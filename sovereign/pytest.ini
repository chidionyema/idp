# The Sovereign Bus test configuration. `bin/idp-ci` runs
# `pytest sovereign/tests/bdd -q` against it; there is no second runner.
#
# rootdir is this directory (pytest finds this file walking up from the test
# args), so bdd_features_base_dir = ".." is the repository root and every
# scenarios() call names a feature by its repository path. No module holds an
# absolute path (LAW 46).
[pytest]
bdd_features_base_dir = ..
testpaths = tests/bdd
norecursedirs = .venv .git __pycache__ node_modules
addopts = -p no:cacheprovider --strict-markers
markers =
    pending(req, owner): this feature's steps are not bound yet. req is the requirement
        number from crew#200 and owner is the builder workstream that lands them. The
        scenarios are skipped, and `bin/idp-ci` prints how many features are still
        pending so the count cannot drift quietly. Delete the mark when the steps land.
