apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-bot-service
  namespace: sovereign-system
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <body>
    <h1>🤖 Telegram Sovereign Bot</h1>
    <p>Status: LIVE</p>
    <p>Commands: /dag, /drift</p>
    <p>Topology: 4 nodes, 2 edges</p>
    <p>Exports: JSON, GraphViz, Mermaid</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-sovereign-bot
  namespace: sovereign-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegram-sovereign-bot
  template:
    metadata:
      labels:
        app: telegram-sovereign-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sovereign-snapshotter
      containers:
        - name: bot
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: telegram-bot-service
        - name: nginx-config
          configMap:
            name: telegram-bot-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-bot-nginx
  namespace: sovereign-system
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /var/run/nginx.pid;
    events { worker_connections 128; }
    http {
      access_log /dev/stdout;
      server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: telegram-sovereign-bot
  namespace: sovereign-system
  labels:
    app: telegram-sovereign-bot
spec:
  type: ClusterIP
  selector:
    app: telegram-sovereign-bot
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
