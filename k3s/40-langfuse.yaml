apiVersion: v1
kind: Service
metadata:
  name: langfuse-db
  namespace: estate
spec:
  selector:
    app: langfuse-db
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-db
  namespace: estate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: langfuse-db
  template:
    metadata:
      labels:
        app: langfuse-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_DB
              value: langfuse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: estate-secrets
                  key: LANGFUSE_DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: estate
spec:
  selector:
    app: langfuse
  ports:
    - name: http
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: estate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      containers:
        - name: web
          image: langfuse/langfuse:2
          env:
            - name: LANGFUSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: estate-secrets
                  key: LANGFUSE_DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql://langfuse:$(LANGFUSE_DB_PASSWORD)@langfuse-db:5432/langfuse
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: estate-secrets
                  key: LANGFUSE_NEXTAUTH_SECRET
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: estate-secrets
                  key: LANGFUSE_SALT
            - name: NEXTAUTH_URL
              value: http://langfuse.estate.svc.cluster.local:3000
            - name: TELEMETRY_ENABLED
              value: "false"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
