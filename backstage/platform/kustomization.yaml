# crew#459: every layer the cluster runs reaches the portal from git through Flux, the same road as
# backstage/founder. bin/catalog-platform renders catalog-info.yaml from clusters/oke/*.yaml; the oke
# overlay mounts this ConfigMap at /estate/platform.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: platform-catalog
    namespace: backstage
    files:
      - catalog-info.yaml
generatorOptions:
  disableNameSuffixHash: true
