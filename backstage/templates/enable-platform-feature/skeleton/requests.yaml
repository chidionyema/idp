# Feature-tier requests opened through the "Enable platform feature" Backstage template
# (crew#584). A row here is a request. The feature-request-enable workflow runs
# `bin/idp-features enable` on the pull request that adds the row and commits the Flux switch
# changes onto the same branch, so merging the pull request is the flip (crew#584 CP-K).
- feature: ${{ values.feature }}
  tier: ${{ values.tier }}
  reason: ${{ values.reason }}
