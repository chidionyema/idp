# Feature-tier requests opened through the "Enable platform feature" Backstage template
# (crew#584). A row here is a request, not a switch: platform/features/features.yaml and
# bin/idp-features are what `enable` reads and writes, and enabling still runs as its own
# reviewed action against a real checkout -- this file only carries what was asked for and
# why, so the pull request's CI run (.github/workflows/ci.yml) can price it with
# `bin/idp-features plan` before a reviewer merges.
- feature: ${{ values.feature }}
  tier: ${{ values.tier }}
  reason: ${{ values.reason }}
