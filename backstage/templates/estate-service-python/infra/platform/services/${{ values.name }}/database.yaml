{%- if 'database' in values.addons %}
# Founder decision 2 (crew#627, 2026-08-30): Postgres on the cluster through the one operator,
# CloudNativePG. It writes the app credentials to the Secret ${{ values.name }}-db-app (key `uri`),
# which the deployment mounts as files. Needs the operator row platform/cnpg (idp follow-up).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${{ values.name }}-db
  namespace: ${{ values.name }}
  labels:
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  instances: 2
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: ${{ values.name | replace("-", "_") }}
      owner: app
{%- else %}
# Database not ticked at creation.
{%- endif %}
