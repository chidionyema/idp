# The vault entry ${{ values.name }}-env lands as the Secret ${{ values.name }}-env; the deployment
# mounts it as files (the cluster refuses secrets in environment variables).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.name }}-env
  namespace: ${{ values.name }}
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: ${{ values.name }}-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: ${{ values.name }}-env }
