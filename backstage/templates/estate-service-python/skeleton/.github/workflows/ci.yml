name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  gate:
    # The one required check. A red step blocks the pull request; that is the whole safety net
    # (founder decision 3, crew#627: "if a test or a guard fails, the PR blocks itself").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: standards (ruff)
        run: ruff check . && ruff format --check .
      - name: tests (pytest)
        run: pytest
      - name: static security analysis (bandit)
        run: bandit -q -r src
      - name: dependency audit (pip-audit)
        run: pip-audit
      - name: secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: the catalogue can see this repo
        run: test -f catalog-info.yaml && grep -q backstage.io/kubernetes-id catalog-info.yaml
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3
  image:
    needs: [gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ values.destination.owner }}/${{ values.name }}:main-${{ github.run_number }}-${{ github.sha }}
