apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: external-integration
  title: Onboard an external integration
  description: >-
    The Day-0 shape for connecting the estate to a third party without a human ever
    holding the credential. Renders the ExternalSecret that reads the estate vault
    entry, the vault-seed.yml stanza that writes it from CI, and a docs page whose
    authentication section is fixed text -- workload identity federation where the
    provider has it, a GitHub-App-style one tap where it does not, and never a value
    a person carries between two browser tabs. Created because an agent left to
    design a Tailscale workflow proposed exactly that carry (crew#66, 2026-08-28).
  tags:
    - estate
    - secrets
    - day-0
    - zero-touch
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Which provider
      required: [provider, name, namespace]
      properties:
        provider:
          title: Provider
          type: string
          enum: [oci, github, tailscale, other]
          enumNames:
            - Oracle Cloud (workload identity federation)
            - GitHub (App installation, one tap)
            - Tailscale (SSO login, one tap)
            - Other third party
          description: >-
            Decides the authentication section of the rendered docs page, and nothing
            else is offered. oci federates an OIDC token; the rest are a one-tap
            install or login. There is no "paste a token" option, by design.
          ui:autofocus: true
        name:
          title: Workload name
          type: string
          description: >-
            Lowercase, hyphenated. Becomes the vault entry key, the ExternalSecret
            name and the Secret it targets.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        namespace:
          title: Namespace
          type: string
          description: The Kubernetes namespace the workload runs in.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

  steps:
    - id: fetch
      name: Render the integration
      action: fetch:template
      input:
        url: ./skeleton
        values:
          provider: ${{ parameters.provider }}
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          # The whole point of the template: the authentication mode is derived from the
          # provider, never typed. Both strings end in "never a value a person carries",
          # so the rendered page can only ever describe a zero-touch path.
          authMode: ${{ 'workload identity federation (OIDC), never a value a person carries' if parameters.provider == 'oci' else 'a one-tap install or login in the provider, never a value a person carries' }}

  output:
    text:
      - title: What to do with it
        content: |
          Three files were rendered for `${{ parameters.name }}`:

          - `external-secret.yaml` -- commit it under `platform/${{ parameters.name }}/`
            and add it to that directory's kustomization.
          - `vault-seed-entry.yaml` -- the entry stanza for
            `.github/workflows/vault-seed.yml`, which is what writes the vault entry
            from repository secrets in CI.
          - `docs/index.md` -- the authentication page, fixed text for the provider.

          The no-toil gate (`policy/no-manual-steps.rego`, `bin/idp-no-toil`) grades all
          three on the pull request that lands them.
