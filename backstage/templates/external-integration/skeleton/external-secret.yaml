# CONFIG-SYNTAX-OK: a scaffolder skeleton, not a manifest. Backstage substitutes the
# ${{ values.* }} placeholders at render time; the rendered file is what a cluster reads.
#
# The one Secret ${{ values.name }} reads, from the estate vault entry `${{ values.name }}`.
# Nothing here holds a value: the entry is written in CI by .github/workflows/vault-seed.yml
# (see vault-seed-entry.yaml beside this file) and read by the External Secrets Operator
# through the estate's one ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: estate-vault
  target:
    name: ${{ values.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ${{ values.name }}
