app:
  # "Bytesync" is DELIBERATE. Founder-facing decision, docs/decisions/portal-defects-crew612.md:
  # "app.title and organization.name in backstage/app-config.yaml read Mumchimp; the portal is
  # the estate portal, not the store. Both now read Bytesync." The parent-company name itself
  # is an open decision on crew#691, and the catalogue's own org entity
  # (backstage/org/catalog-info.yaml) refuses to guess one until it lands.
  #
  # An agent changed this to "Estate" on 2026-09-18 having read "Bytesync" as a stray vendor
  # default. It was not: it is the brand the estate chose, and the change was reverted. Do not
  # "fix" it again without crew#691.
  title: Bytesync
  baseUrl: http://localhost:3100

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # The catalog stays at Backstage's default /catalog. On 2026-08-26 it was overridden to
    # serve "/", which made /catalog (the path in Backstage's own links and the founder's
    # bookmark) a client-side ERROR 404 while the login drill, visiting "/", stayed green.
    # crew#307. The Home page takes "/".
    #
    # The front page is Backstage's home plugin. Widgets stay; the drag-and-resize
    # board does not (founder 2026-09-03: outdated look and outdated interactions).
    # packages/app/src/modules/home/homeLayout.tsx pins them. The crew#459 god view
    # stays at /estate.
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
              movable: false
              resizable: false
            - component: HomePageToolkit
              column: 0
              row: 2
              width: 6
              height: 6
              deletable: false
              movable: false
              resizable: false
    # Visit tracking fed the "Recently visited" and "Most visited" cards. Those cards, and
    # "Starred", are empty for a visitor and are not placed on the page, so tracking stays off.
    - api:home/visits: false
    - app-root-element:home/visit-listener: false
    # A joke widget and world clocks. Off. The page is not a rearrangeable dashboard.
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/world-clock: false
    # The toolkit is the same doors as the menu, in the same order
    # (packages/app/src/modules/nav/EstateNav.tsx); a test holds the two lists equal.
    - home-page-widget:home/toolkit:
        config:
          tools:
            - { url: /, label: Home, icon: dashboard }
            - { url: /estate, label: Estate, icon: 'kind:domain' }
            - { url: /catalog, label: Catalogue, icon: catalog }
            - { url: /ops, label: Health, icon: warning }
            - { url: /showcase, label: Showcase, icon: 'kind:system' }
            - { url: /docs, label: Docs, icon: docs }
            - { url: /settings, label: You, icon: user }
            - { url: /reports, label: Reports, icon: 'kind:api' }
            - { url: /investigate, label: Investigate, icon: search }
            - { url: /pair, label: Pair, icon: 'kind:group' }
            - { url: /tools, label: Tools, icon: 'kind:component' }
            - { url: /fleet, label: Fleet, icon: 'kind:group' }
            - { url: /create, label: Create, icon: scaffolder }
            - { url: /catalog-graph, label: Map, icon: 'kind:system' }
            - { url: '/catalog?filters%5Bkind%5D=Component', label: Kubernetes, icon: 'kind:resource' }
            - { url: /search, label: Find, icon: search }


    # The catalogue index defaults to kind=component and list=owned, so 391 of 587
    # git entities never appear and a first paint of the rest flashes then vanishes
    # (plugin-catalog 2.0.8 CatalogFilterBlueprint). Official NFS config, not a
    # second feed: cursor pagination pages /api/catalog/entities/query; the sidebar stays.
    # page:catalog is configured here without moving its path (crew#307).
    - page:catalog:
        config:
          pagination:
            mode: cursor
            limit: 50
    - catalog-filter:catalog/list:
        config:
          initialFilter: all
    - catalog-filter:catalog/kind:
        config:
          initialFilter: ""

    # crew#612 CP5: no empty tab on an entity page. The TechDocs content ships with no filter,
    # so every one of the 338 entities grew a "TechDocs" tab and 334 of them opened on an
    # error; the api-docs "APIs" content shows on every Component and none provides an API.
    # Each tab now appears only where it has something to show, and the Docs tab says "Docs".
    - entity-content:techdocs:
        config:
          title: Docs
          filter:
            metadata.annotations.backstage.io/techdocs-ref: { $exists: true }
    - entity-content:api-docs/apis:
        config:
          filter:
            # config.filter replaces the plugin's own filter (kind: component), so it is kept here.
            $all:
              - kind: component
              - $any:
                  - relations: { $contains: { type: providesApi } }
                  - relations: { $contains: { type: consumesApi } }

organization:
  # See the app.title note above: Bytesync is the chosen brand, not a vendor default.
  name: Bytesync

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7107
  listen:
    port: 7107
    # BIND POLICY, founder ruling R20 (2026-08-24): the gateway is the only process on this
    # machine that binds a non-loopback address. Everything else binds 127.0.0.1 or nothing.
    #
    # Without this line Node binds `::` and lsof shows `*:7107` -- the developer portal, and
    # its catalog of the whole estate, reachable from anything on the LAN. Measured with
    # `lsof -nP -iTCP:7107 -sTCP:LISTEN` on 2026-08-24: `node 45258 ... TCP *:7107 (LISTEN)`.
    #
    # 127.0.0.1 and not ::1 on purpose. baseUrl says `localhost`, which macOS resolves to ::1
    # first; Node 20's autoSelectFamily falls back to IPv4, and every probe and script in this
    # repo dials 127.0.0.1 literally, so the v4 loopback is the one that must answer.
    host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3100
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  endpoints:
    # crew#684 CP4: the Ops page's founder tiles read docs/founder.json from the rendered state
    # branch (bin/catalog-render writes it on the estate-founder schedule). The repository is
    # public, so no credential; GET only. The mature door is the proxy plugin the backend already
    # runs, never a fetch to a host typed in the page.
    '/estate-state':
      target: 'https://raw.githubusercontent.com/chidionyema/idp/state/live-diagram'
      changeOrigin: true
      allowedMethods: ['GET']

    # The Investigate page (/investigate) asks HolmesGPT a question in plain English and shows
    # what it found. HolmesGPT is an in-cluster Service on port 80 (platform/robusta), so the
    # browser cannot reach it and must not: the backend's proxy plugin is the door, the same one
    # /estate-state uses. POST only for /api/chat -- the page sends {"ask": "..."} and reads back
    # {"analysis": ...}. No credential: the Service is inside the namespace fence
    # (platform/ns-fences/allowances.yaml declares backstage -> robusta both ways), and the
    # portal itself sits behind the estate's one login.
    '/holmes':
      target: 'http://robusta-holmes.robusta.svc.cluster.local'
      changeOrigin: true
      allowedMethods: ['POST']

    # The estate's one scheduler (Dagster) lives in the dagster namespace on port 3210. The
    # webserver is bound to 127.0.0.1 today (catalog/ports.md), so the browser cannot reach it
    # and must not: the backend's proxy plugin is the door, the same one /holmes uses. The
    # browser sees /dagster/* and the proxy forwards to the in-cluster Service. No credential:
    # the namespace fence (platform/ns-fences/allowances.yaml declares backstage -> dagster
    # both ways), and the portal itself sits behind the estate's one login. Once an HTTPRoute
    # for dagster-webserver lands in platform/edge (W4 glass-break), the proxy's target can
    # move to the gateway hostname and the loop is closed.
    '/dagster':
      target: 'http://dagster-dagster-webserver.dagster.svc.cluster.local:80'
      changeOrigin: true
      allowedMethods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH']

    # FleetView CP1 (docs/specs/2026-09-08-fleetview-backstage-offering.md). The Python
    # service at 127.0.0.1:18790 serves the session envelope and SSE stream; the plugin
    # source is backstage/plugins/fleetview-backend/src/{routes.py,sessions.py}, and the
    # launcher is backstage/plugins/fleetview-backend/src/serve.py. Backstage's proxy plugin
    # prepends `/api/proxy/` to the key, so the browser-facing URL is
    # `/api/proxy/fleetview/<...>`; the plugin's default pathRewrite strips that and the
    # Python service hears `/sessions` and `/stream`.
    # GET reads the board, the notes mailbox, and the blast radius of one graph node
    # (`src/blast.py`, `GET /fleetview/blast-radius?node_id=...`, item #7 -- the same
    # answer `bin/estate-twin-runtime --blast-radius` gives at a terminal, from a page
    # instead). POST writes one note (`src/notes.py`, `POST /fleetview/notes`) -- the
    # estate-wide, runtime-agnostic "leave a note for a session" feature -- or nudges
    # one live sovereign session (`src/signals.py`, `POST /fleetview/nudge`, item #6), or
    # checks named sessions' real Langfuse traces for a claimed success with no recorded
    # evidence behind it (`src/evals.py`, `POST /fleetview/check-receipts`, item #9 -- a
    # mechanical receipt check, never a model grading another model's session), or lists
    # pending typed multi-domain mutation ledgers and approves/rejects one
    # (`src/mutations.py`, `GET /fleetview/mutations`, `POST /fleetview/mutations/approve`,
    # `POST /fleetview/mutations/reject` -- docs/tickets/2026-09-15-typed-multidomain-
    # mutation-ledger.md, "The door"; approve never merges, it only ever produces a new
    # branch and commit for the founder's own PR).
    '/fleetview':
      target: 'http://127.0.0.1:18790'
      changeOrigin: true
      allowedMethods: ['GET', 'POST']

    # CP3 (docs/specs/backstage-as-a-product.md): the three vendor surfaces -- founder-traces,
    # founder-telemetry and founder-dashboards -- carried nothing but a link to the vendor's own
    # login. Each now has an in-portal door that returns ONE counted fact, drawn by our own
    # component; the vendor's full UI is never framed (LAW 21, spec Non-goals: CSP and cookie
    # scoping make an iframe a security regression). The three services run in the observability
    # namespace (clusters/oke/platform.yaml, platform/observability/), so the browser cannot reach
    # them and must not: the backend's proxy plugin is the door. Declared only here, not in
    # app-config.container.yaml: the two files' `proxy.endpoints` maps merge (the container file
    # relies on this same file for /estate-state, /holmes, /dagster and /fleetview, and the
    # in-cluster sidecar comment at platform/backstage/overlays/oke/kustomization.yaml treats
    # /fleetview here as the live declaration). No credential is typed here (LAW 46) -- the target
    # is an in-cluster Service name, not a host.
    #
    # Langfuse: /api/public/health answers 200 with a small JSON body ({"status":"OK",...}); the
    # page reads whether the trace store is up. langfuse-web is the Service the HTTPRoute already
    # points at (platform/observability/httproute.yaml, port 3000).
    '/langfuse':
      target: 'http://langfuse-web.observability.svc.cluster.local:3000'
      changeOrigin: true
      allowedMethods: ['GET']

    # SigNoz: the web service on port 8080 (platform/observability/httproute.yaml's signoz route).
    # /api/v1/health is SigNoz's own liveness endpoint; the page reads one up/down fact, not the
    # dashboard.
    '/signoz':
      target: 'http://signoz.observability.svc.cluster.local:8080'
      changeOrigin: true
      allowedMethods: ['GET']

    # Superset: the boardroom dashboards, Service on port 8088
    # (platform/observability/superset-httproute.yaml backendRef). /health is Superset's own
    # endpoint; the page reads whether it answers, not the charts (the charts are level 3, drawn
    # by our own component from one counted fact, never framed).
    '/superset':
      target: 'http://superset.observability.svc.cluster.local:8088'
      changeOrigin: true
      allowedMethods: ['GET']

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    # 'local': mkdocs-techdocs-core is in the image (backstage/Dockerfile); the pod has no docker
    # socket, and must not (crew#412 row 1).
    runIn: 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.
    local:
      # Catalogue pods run with a read-only root filesystem and a writable /tmp emptyDir
      # (platform/backstage/base/catalogue.yaml). The local publisher's default is
      # node_modules/@backstage/plugin-techdocs-backend/static/docs, which mkdir cannot
      # create there. 2026-09-02: every Docs tab 404'd; the builder error was ENOENT on
      # founder-gods-view. Keep this path under /tmp.
      publishDirectory: /tmp/techdocs

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # Local dev only: the proxied provider needs the front door's headers, so run
    # behind it or set them by hand. Production config is app-config.production.yaml.
    oauth2Proxy: {}
    # Official guest provider for `yarn start` (NODE_ENV=development). The
    # production image does not register the guest module. Do not set
    # dangerouslyAllowOutsideDevelopment: that flag is what would weaken live.
    guest:
      userEntityRef: user:default/guest
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User, Template]
  providers:
    # Every Dagster asset, job and schedule becomes a catalogue entity through
    # catalog-backend-module-dagster-entity-provider (crew#468), polled on `schedule` rather than
    # hand-written into catalog/catalog-info.yaml. The module treats this whole block as optional
    # (backstage/plugins/catalog-backend-module-dagster-entity-provider/src/index.ts) so a
    # Backstage with no DAGSTER_GRAPHQL_URL still starts.
    #
    # `url` is a Service-DNS reference: DAGSTER_GRAPHQL_URL is unset in-cluster today because
    # Dagster runs only on the founder's laptop (bin/scheduler-up, no platform/ manifest yet), so
    # this default is the local one bin/scheduler-up starts on 127.0.0.1:3210. The day Dagster
    # gets a platform/ Deployment and Service, that Service's in-cluster DNS name goes into
    # DAGSTER_GRAPHQL_URL as a cluster env var (idp#248 pattern), never as a literal here (LAW 46).
    dagster:
      url: ${DAGSTER_GRAPHQL_URL:-http://127.0.0.1:3210/graphql}
      schedule:
        frequency: { minutes: 30 }
        timeout: { minutes: 10 }
  locations:
    # The org. bin/catalog-gen stamps `group:default/platform` on every entity it emits; until
    # this file existed that owner reference resolved to nothing. Hand-written, in git.
    - type: file
      target: ../../org/catalog-info.yaml
      rules:
        # Group only. crew#307: exactly one location may create User entities
        # (/app/examples/org.yaml), or the founder and the login drill resolve to
        # different User entities. This file holds four Groups and no user.
        - allow: [Group]

    # The estate itself. Generated by idp/bin/catalog-gen from the LAW 39
    # inventory; never hand-edited. Paths are relative to packages/backend.
    - type: file
      target: ../../../catalog/catalog-info.yaml
      rules:
        - allow: [Component, Resource, Domain, System, Group]

    # Every layer the cluster runs (crew#459), generated by bin/catalog-platform from the Flux
    # Kustomizations. The front page is this file plus the live Ready state of each layer.
    - type: file
      target: ../../platform/catalog-info.yaml
      rules:
        - allow: [Component, System, API]

    # The founder's surfaces (crew#401) are hand-written in backstage/founder/catalog-info.yaml
    # but reach the portal only through the generated estate catalogue above: bin/catalog-gen
    # substitutes ${ESTATE_ZONE} (Backstage does not) and stamps each card with its health.

    # Templates the scaffolder actually offers. One real one beats the
    # create-app example, which advertised "Example Node.js Template" to
    # anyone who clicked Create.
    - type: file
      target: ../../templates/estate-component/template.yaml
      rules:
        - allow: [Template]

    # crew#66: the Day-0 shape for a third-party connection. It exists so an agent asked to
    # add a new tool cannot invent a credential-carrying step -- the template offers no such
    # option, and the pull request that lands its output is graded by the same rule.
    - type: file
      target: ../../templates/external-integration/template.yaml
      rules:
        - allow: [Template]

    # crew#66: one button per dispatchable workflow, generated by bin/idp-portal-buttons from
    # .github/workflows (a workflow with no button fails CI). The founder taps Create; nothing is typed.
    - type: file
      target: ../../templates/founder-actions/*/template.yaml
      rules:
        - allow: [Template]

    # crew#584: requests a tier from platform/features/features.yaml by opening a reviewed
    # pull request, never by running bin/idp-features enable from the scaffolder itself.
    - type: file
      target: ../../templates/enable-platform-feature/template.yaml
      rules:
        - allow: [Template]

    # crew#819: onboards a paying customer's messaging channel by opening a reviewed
    # pull request with the binding. It never takes a credential and never claims a
    # connection it has not made -- the row is applied after the merge, not by the form.
    - type: file
      target: ../../templates/customer-onboarding/template.yaml
      rules:
        - allow: [Template]
    # Agent Foundry trainer Space: dispatches a workflow on the agent-foundry repo, not this one,
    # so it is written by hand here and not by bin/idp-portal-buttons (landed from
    # recovery/portal-bundle, 2026-09-08).
    - type: file
      target: ../../templates/agent-foundry-space/template.yaml
      rules:
        - allow: [Template]

    # Sovereign: infrastructure topology DAG with drift detection. Exports intent DAG,
    # runtime capture, and drift reports in JSON, GraphViz, and Mermaid formats.
    - type: file
      target: ../../../backstage/catalog-info-sovereign.yaml
      rules:
        - allow: [Component, API]

    # The guest identity. Load-bearing, not an example: the guest auth provider
    # resolves user:default/guest through the catalog, so removing this file
    # breaks sign-in.
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'Estate catalogue'
  description: 'The estate software catalogue: every repo, guard, ledger, scheduled job and running container, with its owner, its stack and its vendor coupling.'
