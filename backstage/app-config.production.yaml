app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  providers:
    # NO `oauth2Proxy` HERE. The provider is real, and it is NOT removed -- it is registered a
    # layer down, by the front-door backend module (packages/backend/src/auth/index.ts:38,
    # `providers.registerProvider({ providerId: 'oauth2Proxy', ... })`), which is what the door's
    # own redirect flow talks to. Registering the authenticator in CODE and declaring the provider
    # in CONFIG are two different things: config is the list Backstage hands the SPA so it knows
    # which buttons to draw, and the SPA must be handed only `guest`.
    #
    # Declaring it here anyway is what produced the 2026-10-04 reload loop. Measured live on
    # catalogue.mumchimp.com/face, 2026-10-05:
    #     "auth": {"providers": {"oauth2Proxy": {}}}      <- guest absent entirely
    #     POST /api/auth/oauth2Proxy/refresh -> 401 Unauthorized
    #     POST /api/auth/guest/refresh       -> 200, a real token for user:default/guest
    # The face is reached WITHOUT the door's cookie, so oauth2Proxy's refresh can never complete
    # there; the SPA tried it first, took the 401, threw the session away and reloaded, forever.
    # The wall stayed on "Bytesync | Guest | Enter as a Guest User" and getByTestId('fleet-mic')
    # never mounted. The mic was never refused by the browser -- no control ever existed.
    #
    # And this key could not be removed from a later file: `auth.providers` is a MAP, and
    # Backstage's reader UNIONS the keys of every map it merges --
    # node_modules/@backstage/config/dist/reader.cjs.js:31,
    #     for (const key of new Set([...Object.keys(into), ...Object.keys(fromObj)]))
    # so subtraction is not available at that layer. It is removed at the source instead, in
    # app-config.yaml, which merges into every environment.
    guest:
      # The image sets NODE_ENV=production, and Backstage refuses the guest provider outside
      # development unless this is set. Without it POST /api/auth/guest/refresh answers 403 and
      # every catalog read 401, while GET / returns 200 -- a portal that renders nothing.
      dangerouslyAllowOutsideDevelopment: true

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
