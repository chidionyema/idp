metadata:
  name: founder-otto
  title: "Otto (the Architect agent)"
  description: "The one agent that acts for you from anywhere (crew#516): message @Ottototbot on Telegram (see the founder-telegram surface) in, a PR or a run URL out. Runs in-cluster with a single Telegram poller (replicas 1, strategy Recreate — two pollers on one token 409 each other) and, since CP5, executes its shell tools on your Mac through mac-run, a wrapper that reaches your machine over its own Tailscale sidecar instead of the container's own sandbox, so it always has your machine's tools and files. Model calls route through the estate's one router (see founder-model-router); traces land in Langfuse (see founder-traces). No ssh key is ever held by this pod — the tailnet does the authenticating."
  annotations:
    backstage.io/kubernetes-id: hermes-agent-gateway
    backstage.io/kubernetes-namespace: hermes-agent
    backstage.io/kubernetes-label-selector: "app.kubernetes.io/name=hermes-agent-gateway"
