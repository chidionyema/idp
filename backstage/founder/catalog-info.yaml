# Founder surfaces: every place the founder is expected to look, in Backstage's own entity
# format (crew#401, founder 2026-08-27: "all founder interfaces need to be highly accessible to
# founder else it's a void"). One entity per surface, `Open` links, who updates it and how often.
# Loaded by app-config.yaml as a catalog location and copied into the image (backstage/Dockerfile).
# tests/test_incident_crew401_every_founder_surface_is_in_the_catalogue.py refuses a hostname or a
# workflow button that is not listed here. ${ESTATE_ZONE} is substituted by Flux (LAW 46).
# Portal view: https://catalogue.<zone>/catalog?filters[kind]=component&filters[type]=founder-surface
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: founder-catalogue
  title: "The catalogue (this god view)"
  description: "Find every service, address, job and drill the estate runs, all behind one login."
  annotations:
    estate/group: "Build and ship"
    estate/tier: "daily"
    backstage.io/kubernetes-label-selector: "app.kubernetes.io/part-of=idp"
    idp/updated-by: "Flux image automation on every main build (platform/image-automation/backstage.yaml); inventory entities by bin/idp-catalog-push"
  tags: [founder, screen]
  links:
    - title: "Open"
      url: "https://catalogue.${ESTATE_ZONE}"
      icon: dashboard
    - title: "Founder surfaces only"
      url: "https://catalogue.${ESTATE_ZONE}/catalog?filters%5Bkind%5D=component&filters%5Btype%5D=founder-surface"
      icon: dashboard
spec:
  type: founder-surface
  lifecycle: production
  owner: group:default/platform
  system: system:default/estate
