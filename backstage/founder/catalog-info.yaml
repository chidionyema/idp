# Founder surfaces: every place the founder is expected to look, in Backstage's own entity
# format (crew#401, founder 2026-08-27: "all founder interfaces need to be highly accessible to
# founder else it's a void"). One entity per surface, `Open` links, who updates it and how often.
# Loaded by app-config.yaml as a catalog location and copied into the image (backstage/Dockerfile).
# tests/test_incident_crew401_every_founder_surface_is_in_the_catalogue.py refuses a hostname or a
# workflow button that is not listed here. ${ESTATE_ZONE} is substituted by Flux (LAW 46).
# Portal view: https://catalogue.<zone>/catalog?filters[kind]=component&filters[type]=founder-surface
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: founder-catalogue
  title: "The catalogue (this god view)"
  description: "Every service, hostname, job, guard, drill, port and this list. One login (auth). If something is not here, the gate in tests/test_incident_crew401_* refused the change that added it."
  annotations:
    idp/updated-by: "Flux image automation on every main build (platform/image-automation/backstage.yaml); inventory entities by bin/idp-catalog-push"
  tags: [founder]
  links:
    - title: "Open"
      url: "https://catalogue.${ESTATE_ZONE}"
      icon: dashboard
    - title: "Founder surfaces only"
      url: "https://catalogue.${ESTATE_ZONE}/catalog?filters%5Bkind%5D=component&filters%5Btype%5D=founder-surface"
      icon: dashboard
spec:
  type: founder-surface
  lifecycle: production
  owner: group:default/platform
  system: system:default/estate
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: founder-model-router
  title: "Model router (llm)"
  description: "Every model call in the estate goes through here. Pick and add models, keys, teams and budgets in the admin console (/ui); sign in with your estate login (the same as this catalogue); there is no console password. Tutorial: docs/onboarding/litellm.md (crew#400)."
  annotations:
    idp/updated-by: "Flux from platform/llm on merge to main"
  tags: [founder]
  links:
    - title: "API"
      url: "https://llm.${ESTATE_ZONE}/v1/chat/completions"
      icon: dashboard
    - title: "Admin console"
      url: "https://llm.${ESTATE_ZONE}/ui"
      icon: dashboard
    - title: "Model list (source)"
      url: "https://github.com/chidionyema/idp/blob/main/platform/llm/config.yaml"
      icon: dashboard
spec:
  type: founder-surface
  lifecycle: production
  owner: group:default/platform
  system: system:default/estate
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: founder-traces
  title: "Traces (langfuse)"
  description: "Every call through the router leaves a trace here: prompt, answer, cost, latency. The hourly trace-drill proves the round trip."
