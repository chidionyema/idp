      url: "https://langfuse.${ESTATE_ZONE}"
      icon: dashboard
    - title: "Health"
      url: "https://langfuse.${ESTATE_ZONE}/api/public/health"
      icon: dashboard
spec:
  type: founder-surface
  lifecycle: production
  owner: group:default/platform
  system: system:default/estate
