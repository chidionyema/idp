# crew#503 CP6: the founder's surfaces reach the portal from git through Flux. This ConfigMap carries
# catalog-info.yaml; the oke overlay mounts it at /estate/founder and Flux postBuild substitutes
# ${ESTATE_ZONE} like every other manifest. bin/catalog-gen and the founder-links gate read the same file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: founder-catalog
    # crew#503, 2026-08-27 15:05Z: without this line the rendered ConfigMap has no namespace and the
    # backstage Flux Kustomization fails ("namespace not specified"), taking 7 dependents with it.
    namespace: backstage
    files:
      - catalog-info.yaml
generatorOptions:
  disableNameSuffixHash: true
