# What changes when the catalogue runs in a container instead of `yarn start`.
#
# Layered on top of app-config.yaml, which stays the source for everything that
# is the same in both. Backstage replaces arrays rather than merging them, so
# every `catalog.locations` entry has to be restated here, not just the one that
# moves.

app:
  # One origin. Under `yarn start` the app was a separate dev server on 3100 and
  # the backend was on 7107, which is why this repo carried two ports, two
  # health probes and a CORS rule between its own halves. The image runs
  # @backstage/plugin-app-backend, so the backend serves the UI: one process,
  # one port, one bind, and CORS between the app and its own API stops being a
  # thing that can be misconfigured.
  #
  # The origin itself is not this file's to know: it is wherever the platform
  # publishes the portal, so it comes from the environment (LAW 46). Review on
  # idp#125: a literal localhost here made every browser catalog call fail on
  # the cluster. platform/backstage/overlays/oke sets APP_BASE_URL.
  baseUrl: ${APP_BASE_URL}

auth:
  providers:
    guest:
      # The image sets NODE_ENV=production, and Backstage refuses the guest
      # provider outside development unless this is set. Measured on the first
      # container boot, 2026-08-24: `POST /api/auth/guest/refresh` returned 403
      # and every catalog read returned 401, while `GET /` returned 200 -- a
      # portal that renders, serves no data, and cannot be signed into. Under
      # `yarn start` NODE_ENV was development and this never appeared, which is
      # the kind of difference containerising exists to surface.
      #
      # The flag is named "dangerously" because it makes anyone who can reach
      # the port a signed-in user. The boundary is one layer out and today it is
      # the cluster itself: the Service in platform/backstage/base/catalogue.yaml
      # is ClusterIP, platform/edge carries no route for it, so the only way to
      # reach the port is `kubectl port-forward` with cluster credentials.
      # The PR that adds the public route must put identity in front of it in
      # the same change (ADR 0003, OIDC at the gateway) or turn this flag off;
      # tests/test_incident_backstage_image_critical_cve.py holds that rule.
      dangerouslyAllowOutsideDevelopment: true

# crew#562 (ADR 0009 decision founder-screen-access, path 1): the portal's /pair page posts
# Moonlight's PIN to Sunshine on the founder's Mac through this endpoint. The target is the
# tailnet egress Service (platform/backstage/overlays/oke/sunshine-egress.yaml); Sunshine's
# certificate is self-signed, hence secure: false on a link that never leaves the tailnet. The
# Authorization header is a mounted secret file, never an env var (secrets-not-from-env-vars).
proxy:
  endpoints:
    # The Prometheus the estate already runs (platform/monitoring/kube-prometheus-stack.yaml,
    # fullnameOverride kps). The Metrics tab on every cluster entity reads it through here with
    # the signed-in user's Backstage token (default credentials: require). Read only: the plugin
    # issues GET query and rules calls, and Prometheus's own API has no write on this path.
    '/prometheus/api':
      target: http://kps-prometheus.monitoring.svc:9090/api/v1/
      allowedMethods: [GET]
    # crew#684 CP5: the Healthchecks tile on the Ops page. The read-only API key is a mounted file
    # from ExternalSecret healthchecks-ro (platform/backstage/overlays/oke), added here so the
    # browser never holds it. Read only: v3 list checks. The page never names the host.
    '/healthchecks':
      target: http://healthchecks.healthchecks.svc:8000/api/v3
      allowedMethods: [GET]
      headers:
        X-Api-Key:
          $file: /run/secrets/healthchecks-ro/HC_API_KEY_RO
        # Incident 2026-08-30 06:0xZ (login drill 33296013135, "Healthchecks answered 400"):
        # Healthchecks is Django with ALLOWED_HOSTS = hc.<zone> (platform/healthchecks/env.yaml,
        # crew#483), and without this line the proxy forwards the browser's Host, so every
        # read was refused and the Ops tile said "could not be read". The pod names the one
        # allowed host (HEALTHCHECKS_HOST, platform/backstage/overlays/oke/kustomization.yaml).
        Host: ${HEALTHCHECKS_HOST}
    '/sunshine':
      target: https://sunshine-mac.backstage.svc.cluster.local:47990
      changeOrigin: true
      secure: false
      allowedMethods: [GET, POST]
      credentials: dangerously-allow-unauthenticated
      headers:
        Authorization:
          $file: /run/secrets/sunshine/AUTHORIZATION

backend:
  baseUrl: ${APP_BASE_URL}
  auth:
    # crew#631 CP9: the prover's machine door. A static token from the Secret volume (never the
    # environment: secrets-not-from-env-vars), minted by bin/idp-estate-seed as
    # backstage-env.PROVER_TOKEN. Backstage refuses every catalogue read without it (no guest
    # provider in production), which is the NEGATIVE control probes/backstage.py grades.
    externalAccess:
      - type: static
        options:
          token:
            $file: /run/secrets/backstage/PROVER_TOKEN
          subject: idp-prover
  listen:
    port: 3100
    # 0.0.0.0 INSIDE the container, 127.0.0.1 on the host. These are not in
    # conflict and the distinction is the whole point of R20 (the gateway is the
    # only process that binds a non-loopback address).
    #
    # The container's network namespace is not the host's. A process that binds
    # 127.0.0.1 inside a container is reachable only from that container -- the
    # published port cannot forward to it and `docker compose up` produces a
    # service nothing can reach. What R20 governs is the HOST bind, and compose.yml
    # publishes `127.0.0.1:3100:3100`, so `lsof` on this machine sees the loopback
    # and nothing on the LAN can reach the catalogue.
    #
    # It also removes the [::1] versus 127.0.0.1 split that made `curl
    # 127.0.0.1:3100` return 000 while a browser on the same machine got 200.
    host: 0.0.0.0
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  database:
    # Postgres, not the in-memory sqlite of app-config.yaml. Two reasons, and
    # neither is preference. `:memory:` means every restart re-ingests the whole
    # estate from files and serves an empty catalogue until it finishes --
    # measured 2026-08-24, ingestion took 124 seconds after boot, during which
    # the portal renders and looks correct with nothing in it. And Postgres is
    # what the k8s deployment will use, so Phase 2 changes where the database
    # runs, not which database it is.
    client: pg
    # crew: the estate has one Postgres cluster and one database per consumer
    # (platform/estate-db/cluster/databases.yaml: "One database per consumer" --
    # CloudNativePG creates `backstage`, owned by role `backstage`, and nothing
    # more). Backstage's new backend system defaults pluginDivisionMode to
    # 'database', so every plugin tries CREATE DATABASE "backstage_plugin_<x>"
    # on boot. That role owns one database, not the cluster, so Postgres refused
    # it: "CREATE DATABASE \"backstage_plugin_app\" - permission denied to create
    # database" (measured on catalogue-59f4479d78-nsxz6, 2026-09-04), and every
    # new pod since the estate-db migration has crash-looped on it while the old
    # ReplicaSet kept serving. 'schema' divides plugins into schemas inside the
    # one database the role already owns -- no CREATEDB privilege needed, and no
    # second database to add to databases.yaml per plugin.
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      # Read from the Secret volume, not the environment: the estate policy
      # secrets-not-from-env-vars refuses envFrom/secretKeyRef (2026-08-25).
      password:
        $file: /run/secrets/backstage/POSTGRES_PASSWORD
      database: ${POSTGRES_DB}

# The container overrides app-config.yaml's integrations wholesale (Backstage replaces
# arrays, it never merges them). Under `yarn start` the token is ${GITHUB_TOKEN} from
# backstage/.env; here the estate refuses secrets in env vars, so the token is a mounted
# file: an installation token of the estate-agents App, minted in-cluster and narrowed to
# the backstage lane (platform/github-app/lanes.json), mounted by
# platform/backstage/overlays/oke from github-token.yaml. Without it the scaffolder's
# github:actions:dispatch fails "No token available for host: github.com" (2026-09-06).
integrations:
  github:
    - host: github.com
      token:
        $file: /run/secrets/backstage-github/GITHUB_TOKEN

catalog:
  locations:
    # The org, hand-written in git and rendered by Flux from backstage/org/catalog-info.yaml.
    # It is first because every other location's entities name group:default/platform as their
    # owner: the Groups have to exist for those ownedBy relations to resolve to anything.
    - type: file
      target: /estate/org/catalog-info.yaml
      rules:
        # Group only. crew#307: exactly one location may create User entities
        # (/app/examples/org.yaml), or the founder and the login drill resolve to
        # different User entities. This file holds four Groups and no user.
        - allow: [Group]

    # The estate. Generated on the host by bin/catalog-gen from the LAW 39
    # inventory, and bind-mounted read-only at /estate. It is deliberately not
    # baked into the image: the image is a build artefact that Phase 2 ships to
    # k8s unchanged, and the inventory changes hourly. Baking it in would make
    # every inventory refresh an image rebuild.
    - type: file
      target: /estate/catalog-info.yaml
      rules:
        - allow: [Component, Resource, Domain, System, Group]

    # The founder's surfaces (crew#503 CP6): the ConfigMap founder-catalog rendered by Flux from
    # backstage/founder/catalog-info.yaml with ${ESTATE_ZONE} substituted; no laptop push.
    - type: file
      target: /estate/founder/catalog-info.yaml
      rules:
        - allow: [Component]

    # Every layer the cluster runs (crew#459): the ConfigMap platform-catalog rendered by Flux from
    # backstage/platform/catalog-info.yaml, itself generated by bin/catalog-platform from the Flux
    # Kustomizations, so the front page shows what the cluster is, not what someone typed.
    - type: file
      target: /estate/platform/catalog-info.yaml
      rules:
        - allow: [Component, System, API]

    # Products are onboarded, never copied in (crew#282). Each product repo carries its own
    # catalog-info.yaml naming its UIs and their URLs; the platform reads it by URL. The repo is
    # public, so no token is needed. Adding a product is one line here, not a platform change.
    - type: url
      target: https://github.com/chidionyema/prospector/blob/main/catalog-info.yaml
      rules:
        - allow: [Component, System]

    # The scaffolder templates the portal offers.
    - type: file
      target: /app/templates/estate-component/template.yaml
      rules:
        - allow: [Template]

    # crew#66: the Day-0 shape for a third-party connection, so a new integration inherits
    # the zero-touch authentication path instead of an agent inventing one.
    - type: file
      target: /app/templates/external-integration/template.yaml
      rules:
        - allow: [Template]

    # crew#66: one button per dispatchable workflow, generated by bin/idp-portal-buttons from
    # .github/workflows (a workflow with no button fails CI). The founder taps Create; nothing is typed.
    - type: file
      target: /app/templates/founder-actions/*/template.yaml
      rules:
        - allow: [Template]

    # crew#584: requests a tier from platform/features/features.yaml by opening a reviewed
    # pull request, never by running bin/idp-features enable from the scaffolder itself.
    - type: file
      target: /app/templates/enable-platform-feature/template.yaml
      rules:
        - allow: [Template]

    # user:default/guest. The guest auth provider resolves it through the
    # catalog, so this is sign-in, not example data.
    - type: file
      target: /app/examples/org.yaml
      rules:
        - allow: [User, Group]

# The cluster the catalogue runs in, read with the pod's own token (platform/backstage/base/
# rbac.yaml). Only here, never in app-config.yaml: the compose run has no cluster, and the
# plugin logs a fetch error for every entity that carries a kubernetes annotation when the
# configured cluster is unreachable. Cluster name is provider-neutral on purpose (R36).
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: estate
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # metrics-server runs (platform/metrics-server) and the role reads metrics.k8s.io, so the
          # Kubernetes tab shows CPU and memory used against requested (founder 2026-08-29:
          # "i need all metrics exposed ... on backstage").
          skipMetricsLookup: false
