# Workflows this repository deliberately does not run, and why.
#
# GitHub's enabled/disabled switch lives in settings, not in the tree, so a workflow can be off
# for a week while its file reads perfectly and every check stays green -- which is exactly what
# happened to deploy-when-green.yml between 2026-08-31 and 2026-09-08. bin/idp-mechanism-gate
# --live compares GitHub's answer to this file: a workflow that is off and not named here is a
# refusal, and a name here with no reason is not a reason.
disabled:
  .github/workflows/kini-finish.yml: >-
    Switched off in settings on or about 2026-08-31. It is the founder's "Finish KINI" button
    and it fires only on his own `FINISH: KINI` comment, so an idle one costs nothing; every
    run in its history is `skipped`. Turned back on when KINI is next closed out.
