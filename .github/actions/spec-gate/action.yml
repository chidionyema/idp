name: spec-gate
description: >
  Founder ruling R29 (2026-08-25): a pull request that changes code must also
  change the executable spec (a *.feature scenario, a test, or the live-diagram
  generator). Runs bin/spec-gate from chidionyema/idp against the calling
  repository. On a push (no pull request) it reports ok and does nothing.
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with: { fetch-depth: 0 }
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with: { repository: chidionyema/idp, path: .estate-idp }
    - name: spec-gate
      shell: bash
      env: { BASE_SHA: "${{ github.event.pull_request.base.sha }}" }
      run: |
        if [ -z "$BASE_SHA" ]; then echo "ok    spec-gate not a pull request; nothing to compare"; exit 0; fi
        .estate-idp/bin/spec-gate "$BASE_SHA"
