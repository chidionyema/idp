name: estate security scan
description: >
  Runs bin/estate-security-scan from chidionyema/idp against the calling
  repository: gitleaks over the whole git history, pip-audit over every tracked
  requirements*.txt, npm audit over every tracked package-lock.json, and the
  security policy gate where one exists. Non-zero exit fails the job; the
  ruleset `estate-security-scan` then refuses the merge.
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with: { fetch-depth: 0 }   # gitleaks reads the full history of the PR head
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with: { repository: chidionyema/idp, path: .estate-idp }
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with: { python-version: "3.12" }
    - name: tools (gitleaks 8.30.1, pip-audit 2.10.1, trivy 0.74.0)
      shell: bash
      run: |
        curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
        sudo tar -xz -C /usr/local/bin -f /tmp/gitleaks.tgz gitleaks
        # Check 5 of estate-security-scan. Pinned by checksum like gitleaks above, and not by the
        # vendor's install script: `curl | sh` from a release page is the supply-chain shape this
        # estate refuses. The binary carries its own checks bundle, so the scan needs no registry.
        curl -sSL -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
        echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tgz" | sha256sum -c -
        sudo tar -xz -C /usr/local/bin -f /tmp/trivy.tgz trivy
        pip install -q pip-audit==2.10.1
    - name: estate-security-scan
      shell: bash
      run: .estate-idp/bin/estate-security-scan --source "$GITHUB_WORKSPACE"
