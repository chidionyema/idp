name: wake-blocked
description: "crew#504 CP7: closed PRs whose Blocked-by keys have landed are updated, reopened and re-queued"
inputs:
  resolved:
    description: "free-text Blocked-by key that has landed (workflow_dispatch input)"
    default: ""
runs:
  using: composite
  steps:
    - name: "the idp tree this action ships in (no owner name; the runner already downloaded it)"
      shell: bash
      run: ln -sfn "$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)" .idp-wake
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RESOLVED: ${{ inputs.resolved }}
      run: |
        set -o pipefail
        args=()
        [ -n "$RESOLVED" ] && args=(--resolved "$RESOLVED")
        python3 .idp-wake/bin/idp-wake-blocked "${args[@]}" 2>&1 | tee wake.out
        tail -1 wake.out >> "$GITHUB_STEP_SUMMARY"
