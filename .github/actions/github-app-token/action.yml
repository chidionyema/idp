name: github-app-token
# Incident 2026-08-29 11:21Z (idp#769): four pull requests were merged by github-actions[bot]
# because bin/idp-pr-age had armed their auto-merge under GITHUB_TOKEN. GitHub starts no workflow
# for a push made with that token, so ci.yml and build-multiarch.yml never ran on main for
# 530fefaa, cf3c2816, e7037dd1 and a6e37963, and the portal image for the new front page was
# never built. The documented road is an installation token of a GitHub App: a merge armed by
# the App is an App push, and workflows run. bin/idp-github-app token <lane> mints one from
# the estate's App (crew#286 CP7, crew#577), narrowed to platform/github-app/lanes.json.
description: "An installation token of the estate's GitHub App, so a merge armed with it starts main's workflows"
inputs:
  lane:
    description: "lane in platform/github-app/lanes.json"
    default: platform-engineer
  oidc_client_identifier:
    description: "secrets.OIDC_CLIENT_IDENTIFIER"
    required: true
  domain_base_url:
    description: "vars.DOMAIN_BASE_URL"
    required: true
  oci_tenancy:
    description: "secrets.OCI_TENANCY_OCID"
    required: true
  oci_region:
    description: "vars.OCI_REGION"
    required: true
  oci_compartment:
    description: "vars.OCI_COMPARTMENT_OCID"
    required: false
  seed_app_id:
    description: "secrets.SEED_GITHUB_APP_ID; when set, mint without OCI"
    required: false
  seed_pem_b64:
    description: "secrets.SEED_GITHUB_APP_PEM_B64; the App private key, base64"
    required: false
outputs:
  token:
    description: "installation token (masked); expires in one hour"
    value: ${{ steps.seed.outputs.token }}
runs:
  using: composite
  steps:
    # SEED-FIRST (2026-11-16). The OCI OIDC exchange below returned 401 on every run after
    # the estate moved to ARM k3s (ADR 0048), so the lane could not mint at all. The same
    # SEED pair mints tokens in feature-request-enable.yml with this same pinned action.
    - name: Decode the estate App key (SEED secret)
      id: pem
      if: inputs.seed_app_id != '' && inputs.seed_pem_b64 != ''
      shell: bash
      env:
        PEM_B64: ${{ inputs.seed_pem_b64 }}
      run: |
        set -euo pipefail
        pem=$(printf %s "$PEM_B64" | base64 -d)
        while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
        { echo "key<<PEM_EOF"; printf '%s\n' "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"
    - id: seed
      if: inputs.seed_app_id != '' && inputs.seed_pem_b64 != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.seed_app_id }}
        private-key: ${{ steps.pem.outputs.key }}

    # OKE IS RETIRED (founder 2026-11-17; ADR 0048). This action used to fall back to an OCI OIDC
    # session exchange when the SEED inputs were absent -- and that exchange has answered 401 since
    # the estate moved to ARM k3s, so every caller that failed to pass SEED secrets died here with
    # an OCI error that had nothing to do with its own bug. Measured 2026-11-17 on main: the OCI
    # step was still present here, 31 workflows called the retired action directly, 16 routed
    # through this composite. A retired route is refused at its entry point, never attempted.
    - name: refuse the retired OCI exchange
      if: steps.seed.outputs.token == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "::error::github-app-token: no SEED token (seed_app_id / seed_pem_b64 were empty) and the OCI OIDC exchange is retired (ADR 0048). Pass secrets.SEED_GITHUB_APP_ID and secrets.SEED_GITHUB_APP_PEM_B64 to this action."
        exit 1
    - id: assert_boundary
      shell: bash
      env:
        MINTED: ${{ steps.seed.outputs.token }}
      run: |
        set -euo pipefail
        # FAIL CLOSED AT THE BOUNDARY (2026-11-16). Run 43792501522: this composite reported
        # success while the caller's `steps.app.outputs.token` was empty, so the AI Studio intake
        # died one step later with PRIVATE_GITHUB_APP_TOKEN_ABSENT. A credential door that hands
        # out nothing and says ok is the same class as a gate that passes on BLIND. Autonomy needs
        # the door to refuse here, where the cause is, not three steps later.
        if [ -z "${MINTED}" ]; then
          echo "::error::GITHUB_APP_TOKEN_EMPTY_AT_BOUNDARY  lane minted no token; the caller must not proceed"
          exit 2
        fi
        echo "ok      github-app-token  output reaches the caller (${#MINTED} chars)"
