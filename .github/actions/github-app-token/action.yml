name: github-app-token
# Incident 2026-08-29 11:21Z (idp#769): four pull requests were merged by github-actions[bot]
# because bin/idp-pr-age had armed their auto-merge under GITHUB_TOKEN. GitHub starts no workflow
# for a push made with that token, so ci.yml and build-multiarch.yml never ran on main for
# 530fefaa, cf3c2816, e7037dd1 and a6e37963, and the portal image for the new front page was
# never built. The documented road is an installation token of a GitHub App: a merge armed by
# the App is an App push, and workflows run. bin/idp-github-app token <lane> mints one from
# the estate's App (crew#286 CP7, crew#577), narrowed to platform/github-app/lanes.json.
description: "An installation token of the estate's GitHub App, so a merge armed with it starts main's workflows"
inputs:
  lane:
    description: "lane in platform/github-app/lanes.json"
    default: platform-engineer
  oidc_client_identifier:
    description: "secrets.OIDC_CLIENT_IDENTIFIER"
    required: true
  domain_base_url:
    description: "vars.DOMAIN_BASE_URL"
    required: true
  oci_tenancy:
    description: "secrets.OCI_TENANCY_OCID"
    required: true
  oci_region:
    description: "vars.OCI_REGION"
    required: true
  oci_compartment:
    description: "vars.OCI_COMPARTMENT_OCID"
    required: true
outputs:
  token:
    description: "installation token (masked); expires in one hour"
    value: ${{ steps.mint.outputs.token }}
runs:
  using: composite
  steps:
    # main's copy of the tool, whatever branch the caller checked out (image-update-pr runs on
    # flux/image-updates, a branch forked from an old main).
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository_owner }}/idp
        ref: main
        path: .idp-app
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: .idp-app/.github/requirements/oci-cli.txt
    - shell: bash
      run: pip install -q -r .idp-app/.github/requirements/oci-cli.txt
    - name: OCI session token from the GitHub OIDC token
      uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
      with:
        oidc_client_identifier: ${{ inputs.oidc_client_identifier }}
        domain_base_url: ${{ inputs.domain_base_url }}
        oci_tenancy: ${{ inputs.oci_tenancy }}
        oci_region: ${{ inputs.oci_region }}
    - id: mint
      shell: bash
      env:
        OCI_CLI_AUTH: security_token
        OCI_COMPARTMENT_OCID: ${{ inputs.oci_compartment }}
        LANE: ${{ inputs.lane }}
      run: |
        set -euo pipefail
        tok=$(.idp-app/bin/idp-github-app token "$LANE")
        [[ "$tok" =~ ^ghs_[A-Za-z0-9_.-]+$ ]] || { echo "FAIL    github-app-token  no token for lane $LANE: ${tok:0:200}"; exit 1; }
        echo "::add-mask::$tok"
        echo "token=$tok" >> "$GITHUB_OUTPUT"
        echo "ok      github-app-token  lane $LANE (expires in 1h); a merge armed with it starts main's workflows"
