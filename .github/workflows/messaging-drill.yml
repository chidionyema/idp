# button: Test the messaging demos
# founder: Runs the messaging demos end to end on a clean machine and reports whether each one delivered.
# Daily drill: the messaging demos (crew#639 CP9) run end to end on a runner with no cluster and
# no Docker, against the chart's nats-server version and an embedded Postgres. Catalogued in
# drills/catalogue.yaml as messaging-demo; the drills row of bin/idp-verify grades freshness.
name: messaging-drill
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/messaging/go.mod
          cache-dependency-path: platform/messaging/go.sum
      - run: cd platform/messaging && go vet ./... && go test ./...
      - run: bin/idp-messaging-demo all
