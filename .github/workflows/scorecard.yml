# button: none -- scheduled and on every push to main, no dispatch needed
# founder: runs OpenSSF Scorecard (scorecard.dev) against this repository and publishes the
# public supply-chain-health signal a buyer's or investor's engineer checks first. Read-only:
# it grades what is already on the tree (branch protection, pinned actions, signed releases,
# dependency review, ...), it changes nothing. crew, 2026-09-15 platform-maturity pass.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 2"   # weekly, matches OSSF's own reference workflow
  push:
    branches: [main]
permissions: read-all
concurrency:
  group: scorecard
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write   # to upload SARIF results to the Security tab
      id-token: write          # to publish results and get a badge (OSSF publish flag below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
