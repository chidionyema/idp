name: ruff-required
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --select=E9,F63,F7,F82 .
