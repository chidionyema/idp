# One completed Greenlane run = one reaction, not a scheduled sweep.
# Same canonical incident as the DoF owner. No new backend or state ledger.
name: greenlane-common-failure-reaction
on:
  workflow_run:
    workflows: [greenlane]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: greenlane-common-failure-reaction
  cancel-in-progress: false
jobs:
  react:
    # GitHub creates no runner for skipped/cancelled upstream ticks.
    # Only completed actual executions (success/failure) can publish a
    # changed canonical state that needs a reactor. Dispatch remains intact.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Read canonical evidence from state ref
        run: |
          set -euo pipefail
          git fetch -q origin +refs/greenlane/state:refs/greenlane/state
          git show refs/greenlane/state:state.json > "$RUNNER_TEMP/greenlane-state.json"
          test -s "$RUNNER_TEMP/greenlane-state.json"
      - name: Dispatch one deduplicated real operations reaction
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          policy_sha="$(git rev-parse HEAD:catalog/dof-registry.json)"
          python3 bin/idp-greenlane-reactor --state "$RUNNER_TEMP/greenlane-state.json" --policy-sha "$policy_sha" --repo "$GH_REPO" --apply
