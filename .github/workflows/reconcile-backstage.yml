name: reconcile-backstage
on:
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/requirements
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7 # 5fda3b95a4ea
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: install Flux CLI
        run: |
          set -euo pipefail
          mkdir -p ~/bin
          curl -fsSL https://github.com/fluxcd/flux2/releases/download/v2.4.0/flux_2.4.0_linux_amd64.tar.gz \
            -o /tmp/flux.tar.gz
          tar -xzf /tmp/flux.tar.gz -C ~/bin
          chmod +x ~/bin/flux
          rm /tmp/flux.tar.gz
          "$HOME/bin/flux" --version
          echo "$HOME/bin:$PATH" >> "$GITHUB_PATH"
      - name: reconcile backstage (ExternalSecret refresh)
        env:
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          set -euo pipefail
          # Get OKE cluster OCID
          CID=$(oci ce cluster list \
            --compartment-id "$OCI_COMPARTMENT_OCID" \
            --lifecycle-state ACTIVE \
            --query "data[?contains(name,'estate')].id | [0]" \
            --raw-output)
          [ -n "$CID" ] || { echo "error: no active estate cluster found"; exit 1; }
          echo "cluster_id: $CID"
          # Create kubeconfig
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --auth security_token \
            --cluster-id "$CID" \
            --file ~/.kube/config \
            --region "$OCI_REGION" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT
          chmod 600 ~/.kube/config
          kubectl version --client
          # Force Flux to reconcile the backstage kustomization
          flux reconcile kustomization backstage -n flux-system --with-source --timeout 5m
          echo "done: Flux reconciled backstage"
