name: karma-one-shot-20261112
on:
  push:
    branches: [lane/karma-live-observation-20261112]
    paths:
      - .github/workflows/karma-one-shot-20261112.yml
permissions:
  contents: write
jobs:
  falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lane/karma-live-observation-20261112
      - name: Prove KARMA exact-source falsifiers and retire temporary workflow
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_karma_*.py' -v
          python3 -m compileall -q platform/estate/karma bin/idp-karma-observe
          git diff --check
          rm .github/workflows/karma-one-shot-20261112.yml
          git add -u .github/workflows/karma-one-shot-20261112.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(karma): 20 exact-source falsifiers passed; retire one-shot test runner' -m 'Claim: chidionyema/idp#7452' -m 'Agent: chatgpt-github'
          git push origin HEAD:refs/heads/lane/karma-live-observation-20261112
