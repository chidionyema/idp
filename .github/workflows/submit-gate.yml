# button: Re-run the submit door on this branch
# idp#8304. The pre-push check ran on the agent's own machine. A web sandbox with no package
# network cannot install the pinned ruff/yamllint, so its only ways forward were to stop or to
# push with --no-verify, and nothing recorded which. 25 of the last 73 red Greenlane batches were
# red on fast-gate itself.
#
# The door: an agent pushes `submit/<name>`. This runs the reusable fast-gate.yml -- the identical
# pinned check ci.yml runs first -- on that exact commit, in the cloud. Green: the App pushes the
# same commit to `lane/<name>`, which wakes the Greenlane. Red: the failing run is posted to the
# claim issue the commit's `Claim:` trailer names, owner named. No agent needs local tools, and a
# local skip buys nothing, because the check is this job.
name: submit-gate
on:
  push:
    branches: ["submit/**"]
permissions:
  contents: read
  pull-requests: read   # fast-gate.yml's own job asks for it; a callee cannot exceed its caller
concurrency:
  group: submit-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The submit door repairs formatting before any fast-gate verdict. This is
  # machine-owned: agents never need a local Ruff install or founder handback.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.fmt.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Format changed Python with the pinned gate version
        id: fmt
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install -q ruff==0.15.18
          base=$(git merge-base origin/main "$SHA")
          git diff --name-only --diff-filter=ACMR -z "$base" "$SHA" -- '*.py' > "$RUNNER_TEMP/changed-python"
          if [ -s "$RUNNER_TEMP/changed-python" ]; then
            xargs -0 -r ruff format -- < "$RUNNER_TEMP/changed-python"
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi
      - name: Decode SEED App key for the automatic formatting repair
        if: steps.fmt.outputs.changed == 'true'
        id: pem
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PEM_B64" ] || { echo "BLIND   submit-gate  SEED app key missing"; exit 2; }
          pem=$(printf %s "$PEM_B64" | base64 -d)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo "key<<PEM_EOF"; printf '%s\n' "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.fmt.outputs.changed == 'true'
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}
          permission-contents: write
      - name: Push formatted successor through the same submit door
        if: steps.fmt.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'SEED formatting repair'
          git config user.email 'seed-format@users.noreply.github.com'
          git add -- '*.py'
          claim=$(git log -1 --format=%B "$SHA" | sed -n 's/^Claim:[[:space:]]*//p' | tail -1)
          [ -n "$claim" ] || { echo "BLIND   submit-gate  no Claim trailer"; exit 2; }
          git commit -m "style(submit): autoformat changed Python with pinned Ruff" -m "Claim: $claim" -m "Agent: seed-submit-format"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" push origin "HEAD:refs/heads/$REF" --force-with-lease="refs/heads/$REF:$SHA"
          echo "Machine formatted; successor push reruns fast-gate on its exact SHA" >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: format
    if: needs.format.outputs.changed == 'false'
    uses: ./.github/workflows/fast-gate.yml

  # QUAD phase 1 (idp#8336): every commit in the push is checked for an issued, signed
  # identity. Side by side: the verdict is reported, nothing is refused yet (phase 2 refuses).
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify each commit's QUAD identity
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$PEM_B64" ]; then
            printf %s "$PEM_B64" | base64 -d | openssl rsa -pubout > "$RUNNER_TEMP/issuer.pub.pem" 2>/dev/null
          fi
          base=$(git merge-base origin/main "$SHA")
          echo "| commit | verdict | agent | reason |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for c in $(git rev-list --reverse "$base..$SHA"); do
            python3 bin/quad verify "$c" --issuer "$RUNNER_TEMP/issuer.pub.pem" \
              | jq -r '"| \(.commit[0:9]) | \(.verdict) | \(.agent // "-") | \(.reason) |"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

  promote:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Decode the App key
        id: pem
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PEM_B64" ] || { echo "BLIND   submit-gate  SEED_GITHUB_APP_PEM_B64 is not set"; exit 2; }
          pem=$(printf %s "$PEM_B64" | base64 -d)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo "key<<PEM_EOF"; printf '%s\n' "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}
          permission-contents: write
      - name: Promote the checked commit to its lane
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          name="${REF#submit/}"
          case "$name" in ""|*..*|-*) echo "BLIND   submit-gate  refusing lane name '$name'"; exit 2 ;; esac
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git fetch -q --depth=1 origin "$SHA"
          git -c "http.extraHeader=Authorization: Basic $auth" push -q origin "+$SHA:refs/heads/lane/$name"
          echo "promoted $SHA -> lane/$name after fast-gate passed on this exact commit" | tee -a "$GITHUB_STEP_SUMMARY"

  tell-the-owner:
    needs: gate
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Post the failing run to the claim issue
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --format=%B "$SHA")
          claim=$(printf '%s\n' "$msg" | sed -n 's/^Claim:[[:space:]]*\(chidionyema\/idp\)\{0,1\}#\([0-9][0-9]*\)[[:space:]]*$/\2/p' | tail -1)
          agent=$(printf '%s\n' "$msg" | sed -n 's/^Agent:[[:space:]]*\([^[:space:]]*\).*$/\1/p' | tail -1)
          if [ -z "$claim" ]; then
            echo "BLIND   submit-gate  $REF ($SHA) failed and names no Claim: trailer; no owner to tell"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${claim}/comments" -X POST -f body="<!-- submit-gate head=${SHA} -->
          **submit door: \`${REF}\` failed the fast gate** -- owner \`${agent:-unknown}\`.

          - head: \`${SHA}\`
          - failing run: ${RUN}
          - next: fix on \`${REF}\` and push again; only a green commit is promoted to \`lane/${REF#submit/}\`." >/dev/null
          echo "told claim #${claim} (${agent:-unknown})"
