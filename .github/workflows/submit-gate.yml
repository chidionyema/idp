# button: Re-run the submit door on this branch
# idp#8304. The pre-push check ran on the agent's own machine. A web sandbox with no package
# network cannot install the pinned ruff/yamllint, so its only ways forward were to stop or to
# push with --no-verify, and nothing recorded which. 25 of the last 73 red Greenlane batches were
# red on fast-gate itself.
#
# The door: an agent pushes `submit/<name>`. This runs the reusable fast-gate.yml -- the identical
# pinned check ci.yml runs first -- on that exact commit, in the cloud. Green: the App pushes the
# same commit to `lane/<name>`, which wakes the Greenlane. Red: the failing run is posted to the
# claim issue the commit's `Claim:` trailer names, owner named. No agent needs local tools, and a
# local skip buys nothing, because the check is this job.
name: submit-gate
on:
  push:
    branches: ["submit/**"]
permissions:
  contents: read
  pull-requests: read   # fast-gate.yml's own job asks for it; a callee cannot exceed its caller
concurrency:
  group: submit-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: ./.github/workflows/fast-gate.yml

  # QUAD phase 1 (idp#8336): every commit in the push is checked for an issued, signed
  # identity. Side by side: the verdict is reported, nothing is refused yet (phase 2 refuses).
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify each commit's QUAD identity
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$PEM_B64" ]; then
            printf %s "$PEM_B64" | base64 -d | openssl rsa -pubout > "$RUNNER_TEMP/issuer.pub.pem" 2>/dev/null
          fi
          base=$(git merge-base origin/main "$SHA")
          echo "| commit | verdict | agent | reason |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for c in $(git rev-list --reverse "$base..$SHA"); do
            python3 bin/quad verify "$c" --issuer "$RUNNER_TEMP/issuer.pub.pem" \
              | jq -r '"| \(.commit[0:9]) | \(.verdict) | \(.agent // "-") | \(.reason) |"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

  promote:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Decode the App key
        id: pem
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PEM_B64" ] || { echo "BLIND   submit-gate  SEED_GITHUB_APP_PEM_B64 is not set"; exit 2; }
          pem=$(printf %s "$PEM_B64" | base64 -d)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo "key<<PEM_EOF"; printf '%s\n' "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}
          permission-contents: write
      - name: Promote the checked commit to its lane
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          name="${REF#submit/}"
          case "$name" in ""|*..*|-*) echo "BLIND   submit-gate  refusing lane name '$name'"; exit 2 ;; esac
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git fetch -q --depth=1 origin "$SHA"
          git -c "http.extraHeader=Authorization: Basic $auth" push -q origin "+$SHA:refs/heads/lane/$name"
          echo "promoted $SHA -> lane/$name after fast-gate passed on this exact commit" | tee -a "$GITHUB_STEP_SUMMARY"

  tell-the-owner:
    needs: gate
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Collect failed fast-gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          sha = os.environ["SHA"]
          details = []

          def api(path, raw=False):
              args = ["gh", "api", path]
              if raw:
                  args += ["--allow-escape-sequences"]
              else:
                  args += ["--paginate", "--slurp"]
              result = subprocess.run(args, capture_output=True, text=True, check=True)
              return result.stdout if raw else json.loads(result.stdout)

          def clean(text):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              text = re.sub(r"[\x00-\x08\x0b-\x1f\x7f]", "", text)
              text = re.sub(r"\b(?:gh[sopur]_[A-Za-z0-9_.-]+|github_pat_[A-Za-z0-9_]+)", "[REDACTED]", text)
              return text.replace("```", "''' ")

          try:
              pages = api(f"repos/{repo}/actions/runs/{run}/jobs")
              if isinstance(pages, dict):
                  pages = [pages]
              jobs = [job for page in pages for job in page["jobs"]
                      if job.get("conclusion") == "failure"
                      and job.get("head_sha") == sha
                      and job.get("name", "").startswith("gate /")]
              if not jobs:
                  details.append("UNKNOWN: no failed fast-gate job for this exact head.")
              for job in jobs:
                  details.append(f"Job: {job['name']} ({job['id']})")
                  try:
                      check = job["check_run_url"].rsplit("/", 1)[1]
                      pages = api(f"repos/{repo}/check-runs/{check}/annotations")
                      if pages and isinstance(pages[0], dict):
                          pages = [pages]
                      for page in pages:
                          for note in page:
                              details.append(f"{note.get('path', '?')}:{note.get('start_line', '?')}: {note.get('message', '')}")
                  except (subprocess.SubprocessError, ValueError, KeyError, TypeError):
                      details.append("UNKNOWN: failure annotations could not be read.")
                  try:
                      lines = api(f"repos/{repo}/actions/jobs/{job['id']}/logs", raw=True).splitlines()
                      ends = [i for i, line in enumerate(lines)
                              if "Process completed with exit code" in line]
                      if ends:
                          lines = lines[:ends[-1] + 1]
                      details.append("Last 20 failure log lines:\n" + "\n".join(lines[-20:]))
                  except (subprocess.SubprocessError, ValueError):
                      details.append("UNKNOWN: failed-job logs could not be read.")
          except (subprocess.SubprocessError, ValueError, KeyError, TypeError):
              details.append("UNKNOWN: failed-job inventory could not be read.")
          Path("failure-details.txt").write_text(clean("\n".join(details))[:12000] + "\n")
          PY
      - name: Post the failing run to the claim issue
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --format=%B "$SHA")
          claim=$(printf '%s\n' "$msg" | sed -n 's/^Claim:[[:space:]]*\(chidionyema\/idp\)\{0,1\}#\([0-9][0-9]*\)[[:space:]]*$/\2/p' | tail -1)
          agent=$(printf '%s\n' "$msg" | sed -n 's/^Agent:[[:space:]]*\([^[:space:]]*\).*$/\1/p' | tail -1)
          if [ -z "$claim" ]; then
            echo "BLIND   submit-gate  $REF ($SHA) failed and names no Claim: trailer; no owner to tell"
            exit 1
          fi
          cat > owner-comment.md <<EOF
          <!-- submit-gate head=${SHA} -->
          **submit door: \`${REF}\` failed the fast gate** -- owner \`${agent:-unknown}\`.

          - head: \`${SHA}\`
          - failing run: ${RUN}
          - next: use the evidence below to correct the failed gate; validate the exact revised head before another push.

          \`\`\`text
          $(cat failure-details.txt)
          \`\`\`
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/issues/${claim}/comments" -X POST -F body=@owner-comment.md >/dev/null
          echo "told claim #${claim} (${agent:-unknown})"
