# button: Re-run the submit door on this branch
# idp#8304. The pre-push check ran on the agent's own machine. A web sandbox with no package
# network cannot install the pinned ruff/yamllint, so its only ways forward were to stop or to
# push with --no-verify, and nothing recorded which. 25 of the last 73 red Greenlane batches were
# red on fast-gate itself.
#
# The door: an agent pushes `submit/<name>`. This runs the reusable fast-gate.yml -- the identical
# pinned check ci.yml runs first -- on that exact commit, in the cloud. Green: the App pushes the
# same commit to `lane/<name>`, which wakes the Greenlane. Red: the failing run is posted to the
# claim issue the commit's `Claim:` trailer names, owner named. No agent needs local tools, and a
# local skip buys nothing, because the check is this job.
name: submit-gate
on:
  push:
    branches: ["submit/**"]
permissions:
  contents: read
  pull-requests: read   # fast-gate.yml's own job asks for it; a callee cannot exceed its caller
concurrency:
  group: submit-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # I-8455 Stage 2: 2-strike failure-fingerprint circuit breaker (fail closed).
  # The claim issue's comments are the durable ledger: tell-the-owner stamps each
  # failure with `submit-gate-breaker fp=<hash> owner=<agent>`. On the 3rd attempt
  # carrying 2 identical recorded fingerprints, this refuses further speculative
  # retries from that owner and emits the lease-reassignment event.
  breaker:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Refuse speculative retries past the 2-strike cap
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --format=%B "$SHA")
          claim=$(printf '%s\n' "$msg" | sed -n 's/^Claim:[[:space:]]*\(chidionyema\/idp\)\{0,1\}#\([0-9][0-9]*\)[[:space:]]*$/\2/p' | tail -1)
          agent=$(printf '%s\n' "$msg" | sed -n 's/^Agent:[[:space:]]*\([^[:space:]]*\).*$/\1/p' | tail -1)
          if [ -z "$claim" ] || [ -z "$agent" ]; then
            echo "ok breaker no claim/owner trailers; nothing to count"
            exit 0
          fi
          count=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${claim}/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"submit-gate-breaker\")) | select(.body | contains(\"owner=${agent}\"))] | length" 2>/dev/null || echo 0)
          echo "breaker ${agent} on claim #${claim} carries ${count} prior recorded failure(s)"
          if [ "$count" -ge 2 ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${claim}/comments" -X POST -f body="<!-- submit-gate-breaker-reassign head=${SHA} -->
          **2-strike circuit breaker tripped** -- owner \`${agent}\` has \`${count}\` identical recorded failures on claim #${claim}; speculative retries are refused (I-8455 Stage 2).
          - blocked head: \`${SHA}\`
          - run: ${RUN}
          - event: \`lease-reassignment\` — mission reverts to an authorised Lane 3 / CLI executor." >/dev/null
            echo "BLIND   submit-gate  breaker refused ${agent}'s retry on claim #${claim} (${count} prior failures)"
            exit 1
          fi

  gate:
    needs: breaker
    uses: ./.github/workflows/fast-gate.yml

  # QUAD phase 1 (idp#8336): every commit in the push is checked for an issued, signed
  # identity. Side by side: the verdict is reported, nothing is refused yet (phase 2 refuses).
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify each commit's QUAD identity
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$PEM_B64" ]; then
            printf %s "$PEM_B64" | base64 -d | openssl rsa -pubout > "$RUNNER_TEMP/issuer.pub.pem" 2>/dev/null
          fi
          base=$(git merge-base origin/main "$SHA")
          echo "| commit | verdict | agent | reason |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for c in $(git rev-list --reverse "$base..$SHA"); do
            python3 bin/quad verify "$c" --issuer "$RUNNER_TEMP/issuer.pub.pem" \
              | jq -r '"| \(.commit[0:9]) | \(.verdict) | \(.agent // "-") | \(.reason) |"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

  promote:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Decode the App key
        id: pem
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PEM_B64" ] || { echo "BLIND   submit-gate  SEED_GITHUB_APP_PEM_B64 is not set"; exit 2; }
          pem=$(printf %s "$PEM_B64" | base64 -d)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo "key<<PEM_EOF"; printf '%s\n' "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}
          permission-contents: write
      - name: Promote the checked commit to its lane
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          name="${REF#submit/}"
          case "$name" in ""|*..*|-*) echo "BLIND   submit-gate  refusing lane name '$name'"; exit 2 ;; esac
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git fetch -q --depth=1 origin "$SHA"
          git -c "http.extraHeader=Authorization: Basic $auth" push -q origin "+$SHA:refs/heads/lane/$name"
          echo "promoted $SHA -> lane/$name after fast-gate passed on this exact commit" | tee -a "$GITHUB_STEP_SUMMARY"

  tell-the-owner:
    needs: gate
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read   # I-8455 Stage 2: download the failing jobs' log for inline evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Post the failing run to the claim issue
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          msg=$(git log -1 --format=%B "$SHA")
          claim=$(printf '%s\n' "$msg" | sed -n 's/^Claim:[[:space:]]*\(chidionyema\/idp\)\{0,1\}#\([0-9][0-9]*\)[[:space:]]*$/\2/p' | tail -1)
          agent=$(printf '%s\n' "$msg" | sed -n 's/^Agent:[[:space:]]*\([^[:space:]]*\).*$/\1/p' | tail -1)
          if [ -z "$claim" ]; then
            echo "BLIND   submit-gate  $REF ($SHA) failed and names no Claim: trailer; no owner to tell"
            exit 1
          fi
          # I-8455 Stage 2: failure carries its own evidence -- redacted last 20 lines
          # of the failing jobs' output, inlined in the issue comment, plus the
          # 2-strike breaker ledger stamp.
          evidence=$(GH_TOKEN="$GH_TOKEN" python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, ".")
          from greenlane.submit_gate_upgrade import redact_log
          log = subprocess.run(
              ["gh", "run", "view", os.environ["RUN_ID"], "-R", os.environ["GITHUB_REPOSITORY"], "--log-failed"],
              capture_output=True, text=True, timeout=120,
          )
          tail = [l.split("\t", 2)[-1] for l in log.stdout.splitlines() if "\t" in l][-20:]
          print(redact_log("\n".join(tail)) if tail else "log unavailable")
          PY
          )
          fingerprint=$(printf '%s' "$evidence" | python3 -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.read().encode()).hexdigest()[:16])')
          gh api "repos/${GITHUB_REPOSITORY}/issues/${claim}/comments" -X POST -f body="$(cat <<EOF
          <!-- submit-gate head=${SHA} -->
          **submit door: \`${REF}\` failed the fast gate** -- owner \`${agent:-unknown}\`.

          - head: \`${SHA}\`
          - failing run: ${RUN}

          \`\`\`
          ${evidence}
          \`\`\`

          - next: fix on \`${REF}\` and push again; only a green commit is promoted to \`lane/${REF#submit/}\`.
          <!-- submit-gate-breaker fp=${fingerprint} owner=${agent:-unknown} -->
          EOF
          )" >/dev/null
          echo "told claim #${claim} (${agent:-unknown}) with inline evidence; breaker fp=${fingerprint}"
