name: karma-final-proof-once-20261112
on:
  push:
    branches: [lane/karma-live-observation-20261112]
    paths:
      - .github/workflows/karma-final-proof-once-20261112.yml
permissions:
  contents: write
jobs:
  falsify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lane/karma-live-observation-20261112
      - name: Verify real KARMA core and existing Chronos generated calendar
        run: |
          set -euo pipefail
          python3 -m pip install -q --disable-pip-version-check --timeout 20 --retries 1 'PyYAML==6.0.3'
          python3 -m unittest discover -s tests -p 'test_karma_*.py' -v
          # The source schedule changed. Regenerate its existing derived
          # witness before strict check; never weaken the ratchet.
          python3 bin/estate-clocks
          python3 bin/estate-clocks --check
          python3 -m compileall -q platform/estate/karma bin/idp-karma-observe
          git diff --check
          rm .github/workflows/karma-final-proof-once-20261112.yml
          git add -u .github/workflows/karma-final-proof-once-20261112.yml docs/scheduling/CLOCKS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(karma): final 22 falsifiers and generated Chronos clock proof' -m 'Claim: chidionyema/idp#7452' -m 'Agent: chatgpt-github'
          git push origin HEAD:refs/heads/lane/karma-live-observation-20261112
