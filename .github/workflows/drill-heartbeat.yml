name: drill-heartbeat
# crew#307: grades the ABSENCE of the login drill. login-drill.yml opens an issue when it fails; it
# cannot say anything when GitHub never starts it. This runs on a different clock and a different
# workflow, so one dropped schedule is caught by the other. The daily oke-check runs the same row.
on:
  schedule:
    - cron: "3-59/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: drill-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: bin/idp-drill-heartbeat login-drill.yml 20
        id: hb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          bin/idp-drill-heartbeat login-drill.yml 20 2>&1 | tee hb.out
      - name: summary
        if: always()
        run: cat hb.out >> "$GITHUB_STEP_SUMMARY"
      - name: loud on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(cat hb.out | tail -1)
          body=$(printf '%s\n\nRun: %s/%s/actions/runs/%s\nBoard: https://github.com/chidionyema/crew/issues/307\n' "$line" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh label create P0 --color B60205 --force >/dev/null 2>&1 || true
          n=$(gh issue list --state open --search "P0: login drill failed in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "P0: login drill failed" --label P0 --body "$body"; fi
