# The Conscience, hourly (crew#586 CP3): grade main against the founder's ethos and keep one
# open issue per red tenet, never two. Same shape as drill-heartbeat.yml: a schedule, the
# script, the step summary, and `gh issue` for the loud part. Founder, 2026-08-28: "an
# eternal, ambient, active presence that keeps everyone and everything in the estate aligned."
#
# One issue per tenet, titled `conscience: <tenet> is red`, labelled `conscience`. A red row
# comments on its open issue or opens it; a green row closes its issue with the receipt line.
# No issue is ever opened twice for one tenet (the 113-open-PR thrash of 2026-08-27, crew#504).
#
# crew is checked out beside idp so the `research` row can read the research ledger
# (ESTATE_CODE, LAW 46). fetch-depth 0 is for the `better` row's `git log --since`.
name: conscience
on:
  schedule:
    - cron: "23 * * * *"
    - cron: "23 7 * * *"   # crew#586 CP4: the founder's line, once every 24 hours
  workflow_dispatch:
    inputs:
      founder_line:
        description: "Send the founder's Telegram line from this run too"
        required: false
        type: boolean
        default: false
permissions:
  id-token: write        # crew#586: traded for the OCI session that reads the ingest password by name
  contents: write        # crew#586 CP5: the daily page lands through a PR, never a direct push
  pull-requests: write
  issues: write
  actions: read
concurrency:
  group: conscience
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: idp, fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: chidionyema/crew, path: crew }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          # Both files, because conscience.txt starts with `-r oci-cli.txt`: a key that hashed only
          # the referring file would keep restoring a stale cache after oci-cli.txt changed,
          # while reading exactly like a key that tracked the install (crew#488 CP6).
          cache-dependency-path: |
            idp/.github/requirements/conscience.txt
            idp/.github/requirements/oci-cli.txt
      - name: tools the tenet rows call
        run: pip install -q -r idp/.github/requirements/conscience.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      # crew#586 CP6: the `secure` row reads the vault. estate-secrets is private, so github.token
      # cannot fetch it; the estate's GitHub App (lane conscience-reader: metadata+contents read,
      # nothing else) is exchanged for a one-hour installation token from the vault entry github-app.
      # A failed checkout is named here and leaves the row BLIND; it never reads as an empty vault.
      - name: vault checkout for the secure row
        id: vault
        working-directory: idp
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          set -uo pipefail
          tok=$(bin/idp-github-app token conscience-reader 2>&1) || { echo "BLIND vault checkout: ${tok:0:160}"; exit 0; }
          echo "::add-mask::$tok"
          if git clone -q --depth 1 "https://x-access-token:${tok}@github.com/${GITHUB_REPOSITORY_OWNER}/estate-secrets" "$GITHUB_WORKSPACE/estate-secrets" 2>clone.err; then
            echo "ok    estate-secrets checked out ($(find "$GITHUB_WORKSPACE/estate-secrets/secrets" -name '*.yaml' | wc -l) entries)"
          else echo "BLIND vault checkout: git clone refused ($(sed 's/x-access-token:[^@]*@/x-access-token:***@/' clone.err | head -1 | cut -c1-160))"; fi
      - name: bin/idp-conscience
        id: grade
        working-directory: idp
        env:
          ESTATE_CODE: ${{ github.workspace }}
          ESTATE_SECRETS: ${{ github.workspace }}/estate-secrets
          GH_TOKEN: ${{ github.token }}   # the research row's clock is the API Date header (crew#583), never this runner's
        run: |
          set -o pipefail
          # Runs 33200707064 and 33202718520: this shell is `bash -eo pipefail`, so exit 2 from the
          # grader aborted the step on this very line, before rc was ever written, and every step
          # gated on rc was skipped -- founder line included. The pipeline's own status is caught;
          # the job still fails on BLIND, in the last step, after the surfaces have run.
          rc=0; bin/idp-conscience 2>&1 | tee conscience.out || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: summary
        if: always()
        working-directory: idp
        run: cat conscience.out >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: conscience-receipt, path: idp/reports/conscience.json, retention-days: 30 }
      # crew#586 / LAW 50: the receipt lands in the central collector as one log record carrying
      # `science.source=conscience`, so science-facts counts it from ClickHouse. The ingest password
      # is read from the vault by name over the same OIDC -> OCI exchange oke-check uses; never printed.
      - name: receipt to the collector
        if: ${{ steps.grade.outputs.rc != '' }}
        working-directory: idp
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OTLP_INGEST_USER: science
        run: |
          set -uo pipefail
          zone=$(awk '$1=="ESTATE_ZONE:"{print $2}' clusters/oke/estate-config.yaml); test -n "$zone"
          OTLP_INGEST_PASSWORD=$(bin/idp-cloud secret get otlp-ingest-password) || { echo "BLIND otlp-ingest-password not readable (exit $?)"; exit 2; }
          export OTLP_INGEST_PASSWORD OTEL_EXPORTER_OTLP_ENDPOINT="https://signoz.$zone"
          python3 bin/lib/conscience_emit.py reports/conscience.json | tee -a conscience.out
      - name: one issue per red tenet
        if: ${{ steps.grade.outputs.rc != '' }}
        working-directory: idp
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create conscience --color 5319E7 --description "a tenet of the founder's ethos is red" --force >/dev/null 2>&1 || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 -c 'import json; [print(t["name"], "green" if t["ok"] else ("BLIND" if t["ok"] is None else "red"), t["how"], "|", t["ethos"]) for t in json.load(open("reports/conscience.json"))["tenets"]]' \
          | while IFS= read -r line; do
            tenet=${line%% *}; rest=${line#* }; state=${rest%% *}; detail=${rest#* }
            body=$(printf '%s\n\nMeasured: `%s` (%s)\nRun: %s\nBoard: https://github.com/chidionyema/crew/issues/586\n' "$detail" "$tenet" "$state" "$run_url")
            # one open issue per tenet and state: "is red" or "is BLIND"; the other state's issue closes
            for other in red BLIND; do
              title="conscience: $tenet is $other"
              n=$(gh issue list --state open --label conscience --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
              if [ "$state" = "$other" ]; then
                if [ -n "$n" ]; then gh issue comment "$n" --body "$body" >/dev/null; echo "$state $tenet -> #$n (commented)"
                else gh issue create --title "$title" --label conscience --body "$body" >/dev/null; echo "$state $tenet -> opened"; fi
              elif [ -n "$n" ]; then gh issue close "$n" --comment "$body" >/dev/null; echo "$state $tenet -> #$n ($other) closed"; fi
            done
            [ "$state" = green ] && echo "green $tenet"
          done
      # crew#586 CP4: one line to the founder every 24 hours, on the Telegram bot the estate
      # already runs (same send as ping.yml, crew#539). The move is against the receipt of the
      # newest successful run at least 23 hours old; with none, it is the first reading.
      - name: founder line
        if: ${{ steps.grade.outputs.rc != '' && (github.event.schedule == '23 7 * * *' || inputs.founder_line == true) }}
        working-directory: idp
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.SEED_HERMES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.SEED_HERMES_TELEGRAM_HOME_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          now=$(python3 -c 'import json; r=json.load(open("reports/conscience.json")); print(r["score"]["green"], r["score"]["total"], ",".join(t["name"] for t in r["tenets"] if t["ok"] is False) or "-", ",".join(t["name"] for t in r["tenets"] if t["ok"] is None) or "-")')
          read -r green total reds blinds <<< "$now"; reds=${reds#-}; blinds=${blinds#-}
          cutoff=$(date -u -d '23 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          prev_run=$(gh run list --workflow conscience.yml --status completed --limit 50 --json databaseId,createdAt --jq "[.[] | select(.createdAt < \"$cutoff\")][0].databaseId // empty")
          move="first reading"
          if [ -n "$prev_run" ] && gh run download "$prev_run" -n conscience-receipt -D prev >/dev/null 2>&1; then
            prev_green=$(python3 -c 'import json; print(json.load(open("prev/conscience.json"))["score"]["green"])')
            d=$((green - prev_green)); move=$(printf 'moved %+d since yesterday' "$d")
          fi
          if [ -z "$reds$blinds" ]; then text="🧠 conscience $green/$total, $move — every tenet green; the estate is more itself than it was"
          else text="🧠 conscience $green/$total, $move${reds:+ — red: $reds}${blinds:+ — BLIND (not measurable, never green): $blinds}"; fi
          text="$text"$'\n'"$RUN_URL"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT}" --data-urlencode "text=${text}")
          echo "telegram sendMessage $code: ${text%%$'\n'*}"
          test "$code" = 200
      # crew#586 CP5: the portal card. Once a day the receipt is rendered to docs/CONSCIENCE.md
      # (red rows first, trend from docs/conscience-history.jsonl) and lands through a PR with
      # auto-merge, the same shape as bin/catalog-render (crew#401): one branch, force-with-lease,
      # one open PR at a time, merged when the gates pass. Never a direct push to main.
      # idp#769: auto-merge armed under github.token merges as github-actions[bot] and starts no
      # workflow on main; the App's token arms it as an App push (.github/actions/github-app-token).
      - id: app
        if: ${{ steps.grade.outputs.rc != '' && (github.event.schedule == '23 7 * * *' || inputs.founder_line == true) }}
        uses: ./idp/.github/actions/github-app-token
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oci_compartment: ${{ vars.OCI_COMPARTMENT_OCID }}
      - name: portal page
        if: ${{ steps.grade.outputs.rc != '' && (github.event.schedule == '23 7 * * *' || inputs.founder_line == true) }}
        working-directory: idp
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: bot/conscience-page
        run: |
          set -euo pipefail
          bin/idp-conscience --page
          git config user.name "conscience[bot]"; git config user.email "conscience@users.noreply.github.com"
          git add docs/CONSCIENCE.md docs/conscience-history.jsonl
          git diff --cached --quiet && { echo "page unchanged"; exit 0; }
          score=$(python3 -c 'import json; r=json.load(open("reports/conscience.json"))["score"]; print(str(r["green"]) + "/" + str(r["total"]))')
          git commit -q -m "docs(conscience): daily page, $score tenets green (crew#586 CP5)" -m "Author-session: com.estate.conscience"
          git push -q --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            printf '%s\n' "No-Issue: scheduled render of docs/CONSCIENCE.md from reports/conscience.json (crew#586 CP5)." "" \
              "Author-session: com.estate.conscience" "Standard: Definition of Done row, docs/STANDARDS.md" "" \
              "Generated by bin/idp-conscience --page on the daily run. Auto-merge is on; it lands when the gates pass." "" \
              "## Architecture laws" \
              "- LAW 1 zero-gravity: n/a: generated page only, docs/CONSCIENCE.md" \
              "- LAW 2 fractal: bin/idp-conscience -> --page -> docs/CONSCIENCE.md" \
              "- LAW 3 nervous system: .github/workflows/conscience.yml 23 7 * * * -> $BRANCH" \
              "- LAW 4 calibration: n/a: no prediction made" > "$RUNNER_TEMP/body.md"
            gh pr create --base main --head "$BRANCH" --title "docs(conscience): daily page, $score tenets green (crew#586 CP5)" --body-file "$RUNNER_TEMP/body.md" >/dev/null
            n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$n" --auto --squash
          echo "page -> $BRANCH, PR #$n set to auto-merge"
      - name: BLIND fails the job, after every surface has had its turn
        run: |
          rc="${{ steps.grade.outputs.rc }}"
          [ -n "$rc" ] || { echo "grade step wrote no rc"; exit 1; }
          [ "$rc" -ne 2 ]   # BLIND is the only failure; a red tenet is an issue, not a red run
