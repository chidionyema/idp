name: Merdian public release assurance

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/merdian-public-release.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/merdian-public-release.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: merdian-public-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-assurance:
    name: Public brand / types / functionality / build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject obsolete or incomplete public design
        run: npm run release:contract
      - name: Prove old green site cannot return
        run: npm run test:public
      - name: Compile typed application
        run: npm run typecheck
      - name: Verify public production build
        run: npm run build
      - name: Install pinned browser inspection harness
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund puppeteer-core@24.20.0
      - name: Require Chrome on runner
        run: test -x /usr/bin/google-chrome
      - name: Verify rendered UI at four viewport widths
        run: npm run test:visual
      - name: Retain actual mobile and desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merdian-public-browser-evidence
          path: web/artifacts/visual/
          if-no-files-found: warn
          retention-days: 14

  stage-vercel-release:
    name: Stage tested Merdian web changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: candidate-assurance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Advance the Merdian release branch only when its web tree changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/release/merdian" \
            --jq '.[] | select(.ref == "refs/heads/release/merdian") | .object.sha')
          baseline=${current:-$EVENT_BEFORE}

          web_tree() {
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$1" \
              --jq '.tree[] | select(.path == "web" and .type == "tree") | .sha'
          }

          candidate_tree=$(web_tree "$GITHUB_SHA")
          baseline_tree=$(web_tree "$baseline")
          if ! [[ "$candidate_tree" =~ ^[a-f0-9]{40}$ && "$baseline_tree" =~ ^[a-f0-9]{40}$ ]]; then
            printf 'Merdian release requires both verified Git tree IDs.\n' >&2
            exit 2
          fi
          if [[ "$candidate_tree" == "$baseline_tree" ]]; then
            printf 'Merdian web tree %s already staged or unchanged.\n' "$candidate_tree"
            exit 0
          fi

          if [[ -n "$current" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release/merdian" \
              -f sha="$GITHUB_SHA" -F force=false --jq .object.sha
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/release/merdian -f sha="$GITHUB_SHA" --jq .object.sha
          fi

  public-readback:
    name: Public customer-view canary and incident notification
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout source for public canary
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Probe public visitor origins, not Vercel READY
        id: probe
        shell: bash
        run: |
          set +e
          node web/scripts/merdian-public-canary.mjs > "$RUNNER_TEMP/merdian-readback.json" 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/merdian-readback.json"
          exit 0
      - name: Open one P0 incident on regression; close only after independent recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.probe.outputs.code }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="P0 MERDIAN_PUBLIC_REGRESSION - customer-facing identity"
          existing="$(gh issue list --state open --limit 200 --json number,title --jq ".[] | select(.title == \"$marker\") | .number" | head -1)"
          if [[ "$RESULT" != "0" ]]; then
            if [[ -z "$existing" ]]; then
              {
                printf 'Independent public readback detected a customer-facing Meridian website regression.\n\n'
                printf 'Run: %s\n\n' "$RUN_URL"
                printf 'Actual visitor evidence:\n\n'
                printf '%s\n' '```'
                cat "$RUNNER_TEMP/merdian-readback.json"
                printf '%s\n' '```'
                printf '\nCanonical premium design: "INTELLIGENCE, MADE REAL." · consultancy · laboratory · ventures.\n'
                printf 'Restore the last verified premium Vercel deployment, then remove the obsolete release route.\n'
              } > "$RUNNER_TEMP/merdian-incident.md"
              gh issue create --title "$marker" --body-file "$RUNNER_TEMP/merdian-incident.md"
            else
              echo "Existing incident #$existing remains open; no duplicate alert."
            fi
            exit 1
          fi
          if [[ -n "$existing" ]]; then
            # A read-only GET can prove page readiness but cannot prove a real
            # enquiry was delivered to the approved commercial inbox.
            gh issue comment "$existing" --body "Read-only visitor canary is green on checked origins. This is NOT closure: independently verify a synthetic, tagged enquiry receipt and the exact production deployment before closing. Evidence: $RUN_URL"
            echo "Public page probe green; P0 incident remains open pending contact delivery and deployment proof."
          else
            echo "Public visitor readback green; no existing incident."
          fi
