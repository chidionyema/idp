name: Merdian public release assurance

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/merdian-public-release.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/merdian-public-release.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: merdian-public-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-assurance:
    name: Public brand / types / functionality / build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject obsolete or incomplete public design
        run: npm run release:contract
      - name: Prove old green site cannot return
        run: npm run test:public
      - name: Compile typed application
        run: npm run typecheck
      - name: Verify public production build
        run: npm run build
      - name: Install isolated browser driver, without changing the dependency lock
        run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.24.1
      - name: Render and interact with actual mobile, tablet and desktop pages
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/visual-regression.mjs
      - name: Retain reviewed screenshots even when browser acceptance fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merdian-customer-visual-evidence
          path: web/artifacts/visual/*.png
          if-no-files-found: ignore
          retention-days: 14

  public-readback:
    name: Public customer-view canary and incident notification
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout source for public canary
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Probe public visitor origins, not Vercel READY
        id: probe
        shell: bash
        run: |
          set +e
          node web/scripts/merdian-public-canary.mjs > "$RUNNER_TEMP/merdian-readback.json" 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/merdian-readback.json"
          exit 0
      - name: Open one P0 incident on regression; close only after independent recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.probe.outputs.code }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="P0 MERDIAN_PUBLIC_REGRESSION - customer-facing identity"
          existing="$(gh issue list --state open --limit 200 --json number,title --jq ".[] | select(.title == \"$marker\") | .number" | head -1)"
          if [[ "$RESULT" != "0" ]]; then
            if [[ -z "$existing" ]]; then
              {
                printf 'Independent public readback detected a customer-facing Meridian website regression.\n\n'
                printf 'Run: %s\n\n' "$RUN_URL"
                printf 'Actual visitor evidence:\n\n'
                printf '%s\n' '```'
                cat "$RUNNER_TEMP/merdian-readback.json"
                printf '%s\n' '```'
                printf '\nCanonical premium design: "INTELLIGENCE, MADE REAL." · consultancy · laboratory · ventures.\n'
                printf 'Restore the last verified premium Vercel deployment, then remove the obsolete release route.\n'
              } > "$RUNNER_TEMP/merdian-incident.md"
              gh issue create --title "$marker" --body-file "$RUNNER_TEMP/merdian-incident.md"
            else
              echo "Existing incident #$existing remains open; no duplicate alert."
            fi
            exit 1
          fi
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "Independent visitor readback recovered on all checked public origins and customer routes. Evidence: $RUN_URL"
          fi
          echo "Public site identity verified; no open regression incident."
