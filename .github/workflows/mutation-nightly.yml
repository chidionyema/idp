# .github/workflows/mutation-nightly.yml
# Runs mutation testing on the full codebase at 3am UTC every day.
# 4 shards so each runner handles ~1/4 of the codebase.
name: mutation-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard to run (blank = all)"
        required: false
        default: ""

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mutation tools
        run: |
          pip install mutmut
          cargo install cargo-mutants --locked 2>/dev/null || true
          # mewt: skip if not available (no Go module cache in runner)
          curl -sSL https://raw.githubusercontent.com/trailofbits/mewt/master/mewt.sh \
            | sh -s -- --install-dir "$HOME/bin" 2>/dev/null || true

      - name: Install orchestrator
        run: |
          mkdir -p "$HOME/.estate/bin"
          cp .estate/bin/mutation-orchestrator "$HOME/.estate/bin/"
          chmod +x "$HOME/.estate/bin/mutation-orchestrator"

      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}/4
        run: |
          python3 "$HOME/.estate/bin/mutation-orchestrator" \
            --tier=full \
            --shard="$SHARD" \
            --cwd="$PWD"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-${{ matrix.shard }}-report
          path: |
            mutmut_output/
            mutants.out/
            reports/
            mewt-report.json
          retention-days: 7

  mutation-summary:
    needs: mutation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*-report
          merge-multiple: true

      - name: Summarise
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Parse results from ledger if present
          LEDGER="$HOME/.estate/mutation-ledger.jsonl"
          if [ -f "$LEDGER" ]; then
            python3 << 'EOF'
import json, sys
scores = []
for line in open("$LEDGER"):
    d = json.loads(line)
    scores.append(d)
if scores:
    latest = scores[-1]
    print(f"| Tier | Score | Killed | Survived | Elapsed | Budget |")
    print(f"|------|-------|--------|----------|---------|--------|")
    for s in scores[-4:]:
        print(f"| {s['tier']} | {s.get('score','?')}% | {s.get('killed',0)} | "
              f"{s.get('survived',0)} | {s.get('elapsed_s',0)}s | "
              f"{'✓' if s.get('budget_ok') else '✗'} |")
EOF
          fi
