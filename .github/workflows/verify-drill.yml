# crew#345: the platform proves its own health every hour on a machine identity, with no person
# logged in anywhere. The job exchanges its GitHub OIDC token for a one-hour OCI session that
# impersonates the service user estate-ci (the identity oke-check.yml already runs on) and runs
# bin/idp-verify-drill: identity, cluster, and the cluster's own receipt (bin/idp-cluster-state). 24 consecutive
# green scheduled runs is the ticket's acceptance criterion, measured by crew's estate snapshot
# and by the drills row of bin/idp-verify (drills/catalogue.yaml, max_age_hours 3).
name: verify-drill
on:
  schedule:
    - cron: "23 * * * *"   # hourly; the in-cluster receipt (platform/state) lands every 15 minutes
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - platform/state/**
      - bin/idp-verify-drill
      - bin/idp-cluster-state
      - .github/workflows/verify-drill.yml
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
  issues: write
concurrency:
  group: verify-drill
  cancel-in-progress: false
jobs:
  verify-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-verify-drill
        env:
          OCI_CLI_AUTH: security_token   # every oci call in the run uses the exchanged session token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: |
          set -o pipefail
          bin/idp-verify-drill 2>&1 | tee drill.out
      - name: the verdict is on the run summary, pass or fail
        if: always()
        run: |
          printf '### verify-drill\n```\n%s\n```\n' "$(cat drill.out 2>/dev/null || echo 'no verdict: the drill died before printing one')" >> "$GITHUB_STEP_SUMMARY"
      - name: a failed drill is an open P1 on this repository, never a badge nobody reads
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -E '^FAIL' drill.out | tail -1 || true)
          line=${line:-"verify-drill died before printing a verdict"}
          body=$(printf '%s\nrun: %s/%s/actions/runs/%s\nboard: https://github.com/chidionyema/crew/issues/345\n' "$line" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          n=$(gh issue list --state open --search 'in:title "P1: verify drill failed"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh label create P1 --color D93F0B --description "a platform row is not proving itself" --force >/dev/null; gh issue create --title "P1: verify drill failed" --label P1 --body "$body"; fi
