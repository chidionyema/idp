# crew#488 CP1: the hydration scenario of docs/prose/cloud-agnostic-drills.feature, run for real.
#
# A vanilla k3d cluster on a runner with no OCI identity, Flux installed from its own CLI, one
# GitRepository at this run's commit, every Kustomization under clusters/oke/ applied. Then
# bin/idp-portability-drill counts how many layers came Ready and grades it against
# drills/portability-floor.txt. Layers that need OCI (the vault behind secret-store, DNS, the
# receipts bucket) are expected to stay red; the drill prints each with Flux's own reason, and
# the count of everything else is the portability number a buyer's engineer can check.
#
# Weekly, and on any PR that touches the drill itself, so the change ships with its green run
# (LAW 22). Cost: £0, GitHub-hosted runner.
#
# crew#488 CP2: the same tree on a second provider and a second distribution in the same run.
# Job k3s installs k3s (no docker, no k3d) straight on the runner VM — GitHub-hosted runners are
# Azure machines, so nothing here touches OCI — hydrates the identical clusters/oke/ tree from the
# same commit, grades it against the same floor, and prints the wall-clock and the cost of the
# run. The founder unparked CP2 on 2026-08-27 22:10Z with "got public if billing is issue": the
# repository is public, so the provider is the free runner and no OpenTofu-created node is billed.
# The node is destroyed with the runner when the job ends.
name: portability-drill
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/portability-drill.yml
      - bin/idp-portability-drill
      - bin/idp-drill-wait
      - bin/idp-hydrate
      - bin/idp-flux-settle
      - drills/portability-oci-reds.txt
      - drills/portability-floor.txt
      - platform/k3d/estate.yaml
      # R43 (crew#66): every change to the tree Flux applies is proved to hydrate on a second
      # provider before it merges; the k3s job is a required status check on main.
      - platform/**
      - clusters/**
permissions:
  contents: read
concurrency:
  group: portability-drill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-gate:   # crew#584 CP-C: lint red never boots this workflow's heavy jobs
    uses: ./.github/workflows/fast-gate.yml
  hydrate:
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: k3d cluster from platform/k3d/estate.yaml (crew#191)
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79 # v2.4.0
        with:
          cluster-name: estate
          # the action's default k3d (v5.4.6) 404s on download and predates k3d.io/v1alpha5,
          # the apiVersion platform/k3d/estate.yaml declares (run 33062980960)
          k3d-version: v5.9.0
          # crew#488 CP5: a second node. The estate's front door runs two traefik replicas
          # spread hostname/DoNotSchedule (crew#555: a routed surface survives one node), so a
          # one-node cluster can never seat the second pod and edge reads red forever (runs
          # 33212542369, 33212575403). estate.yaml stays one node for the founder's 16 GB Mac;
          # a CLI flag overrides the file on the runner, which has the memory and nothing else on it.
          args: --config=platform/k3d/estate.yaml --agents 1
      - uses: fluxcd/flux2/action@5350425cdcd5fa015337e09fa502153c0275bd4b # v2.4.0
      - name: flux install, then the same tree OKE runs, from this commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: bin/idp-hydrate
      - name: wait only until the floor is met (crew#584 CP-A)
        run: bin/idp-drill-wait
      - name: grade against the floor
        run: |
          set -euo pipefail
          mkdir -p receipt
          kubectl get kustomizations -A -o json > receipt/kustomizations.json
          kubectl get helmreleases -A > receipt/helmreleases.txt 2>&1 || true
          # crew#488 CP5: a ROOT-RED must be diagnosable from the receipt alone; run 33212542369
          # said "HelmRelease/edge/traefik Failed" and nothing about why the pod never came.
          kubectl get pods -A -o wide > receipt/pods.txt 2>&1 || true
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp > receipt/events-warning.txt 2>&1 || true
          kubectl get svc -A > receipt/services.txt 2>&1 || true
          flux get kustomizations -A | tee receipt/flux-get.txt
          bin/idp-portability-drill receipt/kustomizations.json | tee receipt/grade.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portability-receipt
          path: receipt/

  k3s:
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: k3s on the runner VM, the second provider (crew#488 CP2)
        env:
          # https://github.com/k3s-io/k3s/releases — the release train platform/k3d/estate.yaml tracks
          INSTALL_K3S_VERSION: v1.33.4+k3s1
          # the estate's own traefik and servicelb come from the Flux tree, not from k3s; crew#539
          # CP12: k3s's own flannel is disabled the same way OKE's is (--flannel-backend=none) and
          # its NetworkPolicy controller is off (--disable-network-policy) so Cilium owns both,
          # matching Oracle's own procedure (https://docs.oracle.com/en/learn/oke-flannel-to-cilium-cni-plugin/index.html).
          INSTALL_K3S_EXEC: server --disable traefik --disable servicelb --write-kubeconfig-mode 644 --flannel-backend=none --disable-network-policy
        run: |
          set -euo pipefail
          echo "T0=$(date +%s)" >> "$GITHUB_ENV"
          curl -sfL https://get.k3s.io | sh -
          echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          # crew#539 CP12: with --flannel-backend=none the node carries no CNI yet, so it never
          # reports Ready (Oracle's own procedure hits the same order on OKE) — the node-ready
          # wait moves after Cilium installs, below. The DaemonSet's own hostNetwork pods
          # tolerate the NotReady/NetworkUnavailable taints and schedule regardless.
          kubectl get node -o wide
      - name: Cilium replaces k3s's flannel (crew#539 CP12, rehearsal of the OKE break-glass playbook)
        run: |
          set -euo pipefail
          helm install cilium oci://quay.io/cilium/charts/cilium --version 1.20.1 --namespace kube-system -f platform/cni/cilium-values.yaml
          kubectl rollout status ds/cilium -n kube-system --timeout=300s
          # crew#307, 2026-08-28: `kubectl wait --all` does NOT wait for a resource to appear.
          # It resolves its selector once, and an empty set is `error: no matching resources
          # found` with exit 1 -- the --timeout never enters into it. k3s systemd had been up
          # eleven seconds and had not registered its Node, so this step failed on a healthy
          # cluster at 10:18:32Z (run 33162838535) and the second provider went unproved. It is
          # still reachable after the Cilium move below: the DaemonSet rollout can complete on a
          # Node object that the API server has only just accepted. A red that means "the runner
          # was slow" teaches every session to press re-run without reading, which is how a real
          # red gets pressed through too.
          until kubectl get node -o name 2>/dev/null | grep -q .; do sleep 2; done
          kubectl wait node --all --for=condition=Ready --timeout=120s
          kubectl -n kube-system get pods
          kubectl get node -o wide
      - name: a second node, so the front door's two replicas can spread (crew#488 CP5, crew#555)
        run: |
          set -euo pipefail
          # One VM cannot run two k3s kubelets, so the second node is the k3s image itself
          # joined as an agent over Docker -- the same way k3d builds every one of its nodes.
          # Run 33216301296: cilium-agent on the agent read 'path "/var/run/netns" is mounted on "/var/run"
          # but it is not a shared or slave mount' (the --tmpfs is private by default) -> rshared first.
          # Cilium wants bpffs and a cgroup2 mount inside the node, as k3d's own Cilium
          # guide prescribes; without them the cilium pod on this node crash-loops.
          IP=$(hostname -I | awk '{print $1}')
          TOKEN=$(sudo cat /var/lib/rancher/k3s/server/node-token)
          docker run -d --name k3s-agent-2 --hostname k3s-agent-2 --privileged \
            --tmpfs /run --tmpfs /var/run \
            rancher/k3s:v1.33.4-k3s1 agent --server "https://${IP}:6443" --token "${TOKEN}" --node-name k3s-agent-2
          docker exec k3s-agent-2 sh -c 'mount --make-rshared / && mount --make-rshared /run && mount --make-rshared /var/run && mount bpffs -t bpf /sys/fs/bpf && mount --make-shared /sys/fs/bpf && mkdir -p /run/cilium/cgroupv2 && mount -t cgroup2 none /run/cilium/cgroupv2 && mount --make-shared /run/cilium/cgroupv2'
          until kubectl get node k3s-agent-2 -o name 2>/dev/null | grep -q .; do sleep 2; done
          # Run 33214748124: the node registered, the cilium DaemonSet stayed at 1 of 2 for 300 s
          # and the job died here with no reason in the log. The reason goes in the receipt and
          # the drill goes on: a NotReady second node reads as an honest red in the grade.
          mkdir -p receipt
          if ! kubectl rollout status ds/cilium -n kube-system --timeout=300s; then
            {
              kubectl get node -o wide
              kubectl -n kube-system get pods -o wide
              for pod in $(kubectl -n kube-system get pods -l k8s-app=cilium -o name); do
                kubectl -n kube-system describe "$pod" | tail -40
                kubectl -n kube-system logs "$pod" --tail=60 || true
              done
              docker logs k3s-agent-2 2>&1 | tail -60
            } > receipt/second-node.txt 2>&1 || true
            echo "second node: cilium did not roll out; receipt/second-node.txt has the reason"
          fi
          kubectl wait node --all --for=condition=Ready --timeout=180s || true
          kubectl get node -o wide
      - uses: fluxcd/flux2/action@5350425cdcd5fa015337e09fa502153c0275bd4b # v2.4.0
      - name: flux install, then the same tree OKE runs, from this commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: bin/idp-hydrate
      - name: wait only until the floor is met (crew#584 CP-A)
        run: bin/idp-drill-wait
      - name: grade against the floor, then the wall-clock and the cost of the run
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          mkdir -p receipt
          kubectl get kustomizations -A -o json > receipt/kustomizations.json
          kubectl get helmreleases -A > receipt/helmreleases.txt 2>&1 || true
          # crew#488 CP5: a ROOT-RED must be diagnosable from the receipt alone; run 33212542369
          # said "HelmRelease/edge/traefik Failed" and nothing about why the pod never came.
          kubectl get pods -A -o wide > receipt/pods.txt 2>&1 || true
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp > receipt/events-warning.txt 2>&1 || true
          kubectl get svc -A > receipt/services.txt 2>&1 || true
          flux get kustomizations -A | tee receipt/flux-get.txt
          bin/idp-portability-drill receipt/kustomizations.json | tee receipt/grade.txt
          secs=$(( $(date +%s) - T0 ))
          # GitHub-hosted Linux minutes are free on a public repository; a private one is billed
          # per minute at the rate on https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions
          if [ "$PRIVATE" = "false" ]; then cost="£0.00 (public repository, GitHub-hosted ubuntu-latest)"; else cost="$(( (secs + 59) / 60 )) billed minutes (private repository; see the billing page for the rate)"; fi
          echo "ok      portability-k3s  provider=github-hosted-azure distro=k3s wall_clock=${secs}s cost=${cost}" | tee -a receipt/grade.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portability-receipt-k3s
          path: receipt/
