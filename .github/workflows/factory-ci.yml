# button: Test and publish the factory package
# founder: Runs the factory test suite and, on a push to main, builds and publishes its multi-arch image to GHCR.
name: factory-ci

on:
  push: { branches: [main, "queue/**"] }   # queue/**: the Greenlane candidate, graded before it becomes main
  pull_request: { branches: [main] }
  # crew#987 CP2: `test` is a required status check (ruleset 24071703), so a native merge queue
  # needs this workflow to run on the queue's checks_requested snapshot, not only on the PR itself.
  merge_group: { types: [checks_requested] }
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install --quiet pyyaml pytest pytest-xdist jsonschema
      - name: Tests
        run: pytest factory/tests/ -q --maxfail=5 -n 0
