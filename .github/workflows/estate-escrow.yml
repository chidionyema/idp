# button: Back up every repository
# founder: Copies every load-bearing repository to the escrow store so nothing depends on one machine or one account.
# crew#290 layer 4: GitHub is the only copy of every load-bearing repository, and the only escrow
# writer ran on the founder's Mac. Six times a day a runner with no static credential exchanges
# its OIDC token for the estate-ci session, mints a read-only App token, and bin/idp-escrow writes
# a full `git bundle` of every repository the App can see to Cloudflare R2 (a second cloud), then
# reads each one back and verifies it. bin/idp-recover-drill is the restore side. Cost: £0
# (GitHub runner, R2 ingress is free). Catalogued in drills/catalogue.yaml as estate-escrow.
name: estate-escrow
on:
  schedule:
    - cron: "29 */6 * * *"   # four times a day; drills/catalogue.yaml row estate-escrow
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/estate-escrow.yml
      - bin/idp-escrow
      - bin/idp-github-app
      - platform/github-app/lanes.json
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
concurrency:
  group: estate-escrow
  cancel-in-progress: false
jobs:
  escrow:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli and rclone (the same reader the Mac's escrow job and the recover drill use)
        run: |
          pip install -q -r .github/requirements/oci-cli.txt
          sudo apt-get install -y -qq rclone >/dev/null
          rclone version | head -1
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-escrow
        env:
          OCI_CLI_AUTH: security_token   # every oci call in the run uses the exchanged session token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          ESCROW_RECEIPT_DIR: ${{ github.workspace }}/receipt
        run: |
          set -o pipefail
          bin/idp-escrow 2>&1 | tee escrow.out
      - name: the verdict is on the run summary, pass or fail
        if: always()
        run: |
          printf '### estate-escrow\n```\n%s\n```\n' "$(cat escrow.out 2>/dev/null || echo 'no verdict: the escrow died before printing one')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: escrow-receipt
          path: receipt/
