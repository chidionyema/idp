name: offline-installer-budget-preflight
on:
  push:
    branches: ['lane/**', 'queue/**']
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/offline-installer-budget-preflight.yml'
      - 'tests/test_offline_installer_budget.py'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/offline-installer-budget-preflight.yml'
      - 'tests/test_offline_installer_budget.py'
permissions:
  contents: read
jobs:
  budget-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -W error -m py_compile tests/test_offline_installer_budget.py
      - run: python -W error -m unittest discover -s tests -p test_offline_installer_budget.py -v
