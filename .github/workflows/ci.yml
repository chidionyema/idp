name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck jq sqlite3
          pip install -q check-jsonschema sqlite-utils pyyaml
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin conftest
      - run: bin/idp-ci
