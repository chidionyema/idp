name: ci
on:
  pull_request:
  # The merge queue builds each queued pull request on top of main and reruns the
  # required checks against that exact merged state before anything lands.
  merge_group:
  push:
    # flux/image-updates is the branch image-automation-controller pushes a new catalogue tag to
    # (crew#267). The required checks run on that push, so the pull request that
    # image-update-pr.yml opens with GITHUB_TOKEN (which fires no pull_request run) is still graded.
    branches: [main, flux/image-updates]
# A newer run on the same ref supersedes the older one: on 2026-08-27 20:23Z idp had 9 running and
# 20 queued runs, 12 of them stale duplicates, and a one-line oke-check waited 19 min (crew#516).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # crew#584 CP-C: the 60 s gate every heavy job below waits for (fast-gate.yml).
  fast-gate:
    uses: ./.github/workflows/fast-gate.yml
  # 2026-09-04: this job is 9 of the 9.5 minutes a pull request waits. Measured on run
  # 33869529041: fast-gate 24 s, security-scan 47 s, portal-app 8 s, messaging-demo 25 s,
  # bdd-suites 2m06 and 3m42, offline-gate 9m03. It walks the whole AGENTS.md rule table over
  # the entire repository whatever the diff touches, so a three-line change waits the same nine
  # minutes as a platform rewrite, and it was dropped from main's required checks earlier the
  # same day for exactly that reason -- it was already advisory on pull requests and still held
  # every run open.
  #
  # It now runs where it can still stop something landing and costs no one a wait: the merge
  # queue (which builds the pull request on top of main and reruns the required checks before
  # anything lands) and the push to main itself. A pull request's feedback is the four minutes
  # the suites take; the rule table is graded on the merged state, which is the state that
  # matters. Nothing is deleted -- this is a placement change, and `if:` is the switch.
  offline-gate:
    needs: fast-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # bin/law32-gate diffs the PR against origin/main
      # crew#539, 2026-08-28: bin/idp-kyverno-render judges renders against this estate's
      # ClusterPolicies, and two of them -- no-optional-secret-references and
      # money-rail-single-writer -- live in prospector, not here. CI had no copy, so it silently
      # judged 24 of 26 policies and called platform/robusta clean; admission then refused the
      # same Deployment, the release went Failed, and monitoring stayed down 8h. The repo is
      # public, so the default token reads it and no secret is involved. The script is BLIND
      # (never a pass) without this checkout.
      - name: estate ClusterPolicies (outside the workspace on purpose)
        # multiarch-gate and the other repo-root sweeps walk the filesystem, not git, so a tree
        # parked under $GITHUB_WORKSPACE makes idp CI grade prospector's shell scripts, and
        # .gitignore does not help a gate that globs. actions/checkout refuses a path outside the
        # workspace, so this is a clone. The repo is public: no credential, no secret.
        run: git clone --depth 1 https://github.com/chidionyema/prospector "$RUNNER_TEMP/kyverno-policies"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sovereign/requirements*.txt
      - name: tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck jq sqlite3 age
          pip install -q check-jsonschema sqlite-utils pyyaml dagster dagster-webserver
          pip install -q -r sovereign/requirements-dev.txt   # crew#219 R39: the bdd acceptance leg
          pip install -q "mkdocs<2" mkdocs-techdocs-core   # bin/idp-ci rung 8c: docs site builds --strict (ADR 0002)
      - uses: ./.github/actions/estate-tools
      - run: bin/idp-ci
        env:
          IDP_KYVERNO_POLICIES: ${{ runner.temp }}/kyverno-policies/deploy/k8s/policies
          # crew#584 zero-bottleneck law: on a PR the kyverno rung judges the platform dirs the
          # diff touches (fetch-depth 0 above makes the three-dot diff real); empty on main = every dir
          IDP_CI_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
          MIGRATE_HEALTH_WAIT: "240"
          # crew#584: the bdd job below runs the bdd and incident suites once, strictly; this job
          # ran the same 132 s again (run 33202098401). Locally bin/idp-ci still runs them.
          IDP_CI_SKIP_PYTEST: "1"

  # crew#219 R39/R41: the Sovereign Bus acceptance suite, under the branch
  # policy AGENTS.md [merge] declares. offline-gate above already runs this
  # suite inside bin/idp-ci, permissively. This job is the strict leg: on a
  # PR targeting main, SB_BDD_STRICT=1 turns every pending feature -- and
  # every pending mark without a named owner -- into a failure. On every
  # other target it is the same command with the same permissive verdict, so
  # the two branches differ only in what a skip means, never in what runs.
  # Definition of Done v2.1, section 3.3 (docs/reference/policy/definition-of-done.md):
  # secrets in git history, known-vulnerable dependencies, and a security
  # policy row without a proof each block merge. The check is
  # bin/estate-security-scan, the same command that prints the receipt on the
  # founder machine; this job only installs its tools. Pinned by checksum, the
  # way conftest above is pinned by version (bin/actions-pinned covers uses:).
  security-scan:
    needs: fast-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/security-scan   # the steps every active estate repo runs

  bdd-suites:
    needs: fast-gate
    runs-on: ubuntu-latest
    # crew#584, 2026-08-28: run 33203670180 measured this job at 2m13s, of which the acceptance
    # suite was 54 s and the root pytest suite 57 s -- back to back on one runner. GitHub's own
    # matrix runs them as two jobs side by side, so the job's wall-clock is the slower suite plus
    # setup, not the sum. No script: the split is the platform's matrix, the steps are unchanged.
    strategy:
      fail-fast: false
      matrix:
        suite: [acceptance, tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # crew#539, 2026-08-28: bin/idp-kyverno-render judges renders against this estate's
      # ClusterPolicies, and two of them -- no-optional-secret-references and
      # money-rail-single-writer -- live in prospector, not here. CI had no copy, so it silently
      # judged 24 of 26 policies and called platform/robusta clean; admission then refused the
      # same Deployment, the release went Failed, and monitoring stayed down 8h. The repo is
      # public, so the default token reads it and no secret is involved. The script is BLIND
      # (never a pass) without this checkout.
      - name: estate ClusterPolicies (outside the workspace on purpose)
        # multiarch-gate and the other repo-root sweeps walk the filesystem, not git, so a tree
        # parked under $GITHUB_WORKSPACE makes idp CI grade prospector's shell scripts, and
        # .gitignore does not help a gate that globs. actions/checkout refuses a path outside the
        # workspace, so this is a clone. The repo is public: no credential, no secret.
        run: git clone --depth 1 https://github.com/chidionyema/prospector "$RUNNER_TEMP/kyverno-policies"
      # crew#639, 2026-08-31: the embedded Postgres binaries are downloaded the first time the
      # demo runs. That download was the only one in this workflow with no retry and no cache,
      # and it took main red on `no version found matching 16.9.0` while that artefact answered
      # 200 on Maven Central. Cached, the warm path never reaches the network at all; the key
      # carries the major version so a bump fetches once and then stays cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/idp-messaging-demo/postgres-16
          key: embedded-postgres-16-${{ runner.os }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sovereign/requirements*.txt
      - name: tools
        run: |
          pip install -q -r sovereign/requirements.txt -r sovereign/requirements-dev.txt
          # bin/sb builds sovereign/.venv on first use and skips the install when the directory
          # already exists. Under `pytest -n auto` several xdist workers reach that check at the
          # same moment: the first creates the venv, the others see it and exec straight into a
          # python whose pip install is still running, so `import temporalio` fails. Building it
          # once here, serially, is the fix -- the workers then all find a complete venv.
          bin/sb --help >/dev/null 2>&1 || true
      - uses: ./.github/actions/estate-tools
      - name: acceptance suite (strict on PRs to main)
        if: matrix.suite == 'acceptance'
        env:
          SB_BDD_STRICT: ${{ github.base_ref == 'main' && '1' || '0' }}
          # test_gate_langfuse_render and test_gate_llm_admission run bin/idp-kyverno-render for
          # real, so this step is a judging step and needs the estate-only policies like the
          # others. Without it the script is BLIND (rc 2), which is the correct verdict and a
          # failing one -- crew#539 is the 8h outage that happened when it was a pass instead.
          IDP_KYVERNO_POLICIES: ${{ runner.temp }}/kyverno-policies/deploy/k8s/policies
        run: |
          echo "base_ref=${{ github.base_ref }} SB_BDD_STRICT=$SB_BDD_STRICT"
          cd sovereign && python -m pytest tests/bdd -q -p no:cacheprovider -n auto --durations=10   # crew#584: four cores; the ten slowest are printed
      - name: ruff (crew#325 step 3; the rule set is pyproject.toml)
        if: matrix.suite == 'tests'
        run: pip install -q ruff==0.15.18 && ruff check .
      - name: pytest tests (crew#325 step 2, every file under tests/ in one run)
        if: matrix.suite == 'tests'
        env:
          IDP_KYVERNO_POLICIES: ${{ runner.temp }}/kyverno-policies/deploy/k8s/policies
        run: python -m pytest tests -q -p no:cacheprovider -n auto --durations=10   # crew#584: four cores; the ten slowest are printed

  # The merge rule on main (repository ruleset, required_status_checks) waits for a check named
  # exactly `bdd`. GitHub publishes a matrix job's checks as `bdd (acceptance)` and `bdd (tests)`,
  # so splitting the suites renamed the one check the rule waits for out of existence: idp#641 sat
  # MERGEABLE / BLOCKED for 12 hours with both legs green and nothing failing, because the rule was
  # waiting on a name no run would ever report again.
  #
  # This job keeps that name stable. It checks out nothing and installs nothing, so it costs one
  # runner-second; the matrix underneath can change shape -- a third suite, a rename -- without
  # anyone touching the repository ruleset, which is the coupling that caused the stall.
  messaging-demo:
    needs: fast-gate
    runs-on: ubuntu-latest
    # crew#639 CP9, founder 2026-08-30: the messaging demos run on every push, both of them, against
    # an embedded nats-server (the chart's version) and an embedded Postgres. No cluster, no Docker:
    # a red here means the outbox, the duplicate window, the idempotent consumer, the DLQ or the
    # replay broke, and the last line of the log says which.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: platform/messaging/go.mod
          cache-dependency-path: platform/messaging/go.sum
      # crew#639, 2026-08-31: the embedded Postgres binaries are downloaded the first time the
      # demo runs. That download was the only one in this workflow with no retry and no cache,
      # and it took main red on `no version found matching 16.9.0` while that artefact answered
      # 200 on Maven Central. Cached, the warm path never reaches the network at all; the key
      # carries the major version so a bump fetches once and then stays cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/idp-messaging-demo/postgres-16
          key: embedded-postgres-16-${{ runner.os }}
      - run: cd platform/messaging && go vet ./... && go test ./...
      - run: bin/idp-messaging-demo all

  # crew#838 CP1. The domain-migration tool was adopted from survival-stack with its own tests
  # left behind, which is how it arrived claiming green off `node --check` -- a syntax check, not
  # a test. These are the tool's real ones: what counts as a Cloudflare credential, that another
  # vendor's key never gets sent to Cloudflare to be verified, and that the credential the run
  # carries is a scoped one-hour token rather than the root. Only on changes under
  # bin/idp/migrate-domain/, because nothing else in the repository can move them.
  migrate-domain:
    needs: fast-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: did this change touch the tool at all
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in ''|0000000000000000000000000000000000000000) echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if git diff --name-only "$base"...HEAD -- bin/idp/migrate-domain/ | grep -q .; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.touched.outputs.yes == 'true'
        with:
          node-version: "24"
      - if: steps.touched.outputs.yes == 'true'
        run: node --test bin/idp/migrate-domain/test/

  # crew#459, 2026-08-31. The portal's own test suite was run by nothing. Every workflow that
  # mentions backstage grades the *running* one -- verdict-backstage proves the deployed pod,
  # login-drill signs in to it, build-multiarch builds the image -- and the image build runs
  # `yarn tsc` and `yarn build:all`, never `yarn test`. So a unit test under packages/app was an
  # instrument nobody reads (LAW 28): it could only ever go red on a laptop, and only if someone
  # remembered to run it. The colour-contrast guard added with this job is exactly the kind of
  # defect a type-check and a build cannot see -- every state border in the portal failed WCAG
  # 2.2 SC 1.4.11 for months while CI was green -- so the guard is worth nothing without a lane
  # that runs it. Only on changes under backstage/: the install is the slow part and nothing else
  # in the repository can move these tests.
  portal-app:
    needs: fast-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # `repo lint --since origin/main` and `repo test` diff the base
      - name: did this change touch the portal at all
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # a first push to a branch reports an all-zero before-sha; grade the whole thing then
          case "$base" in ''|0000000000000000000000000000000000000000) echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if git diff --name-only "$base"...HEAD -- backstage/ | grep -q .; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.touched.outputs.yes == 'true'
        with:
          # backstage/package.json declares engines.node "22 || 24" and the image is node:24.
          # Pinning the same major here means a green lane and a green image agree about the
          # runtime; the host's node 26 is outside that range on purpose.
          node-version: "24"
      - name: yarn, the version package.json pins
        if: steps.touched.outputs.yes == 'true'
        run: corepack enable && corepack prepare yarn@4.13.0 --activate
      - name: install exactly what yarn.lock holds
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn install --immutable
      - name: type-check
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn tsc
      - name: lint
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn lint
      - name: the app's tests, including the contrast guard
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn test --ci --watchAll=false

  bdd:
    needs: bdd-suites
    if: always()   # a red leg must report a red `bdd`, not a skipped one the rule would wait on forever
    runs-on: ubuntu-latest
    steps:
      - name: every bdd suite passed
        run: |
          set -euo pipefail
          result='${{ needs.bdd-suites.result }}'
          echo "bdd-suites: $result"
          # `skipped` is a pass. The leg only runs when a pull request touches
          # something a bdd suite covers, so a change that touches none of them
          # skips it -- and this gate used to read that skip as a failure and
          # refuse the pull request. Every change outside the bdd surface was
          # red for a reason that had nothing to do with the change. LAW 38: a
          # guard that refuses correct work is an outage. `failure` is still red.
          #
          # `cancelled` is a pass too, since 2026-09-04. ci.yml cancels an
          # in-flight run when a newer commit arrives, so a cancelled leg means
          # only "a newer run is already grading this branch" -- it measures
          # nothing about the code. This gate turned that into `bdd: FAIL
          # (cancelled)`, exit 1, and the merge fence in rule-guard then read
          # main's newest run as red and refused every merge in the estate
          # while the whole Flux tree was stalled waiting for one of them.
          # Same class as the `skipped` case above, one case short.
          case "$result" in
            success|skipped|cancelled) echo "bdd: pass" ;;
            *) echo "bdd: FAIL ($result)"; exit 1 ;;
          esac

  # crew#584 PR B: the "Enable platform feature" Backstage template opens a pull request that
  # adds one row to platform/features/requests.yaml; it never runs `bin/idp-features enable`
  # itself (no runner in the scaffolder). This is the check that fills the gap instead --
  # `plan` prices the requested row and the answer lands on the check summary before a
  # reviewer merges. bin/idp-features itself lands with crew#584 PR A
  # (feat/crew584-feature-register); until that merges this step says so and exits clean
  # rather than failing every unrelated pull request on a script that is not there yet.
  feature-request-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # need the base sha to diff requests.yaml
      - name: price the requested row, if this pull request adds one
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! git diff --name-only "$base" "$head" -- platform/features/requests.yaml | grep -qx 'platform/features/requests.yaml'; then
            echo "ok    this pull request does not touch platform/features/requests.yaml, nothing to price"
            exit 0
          fi
          if [ ! -x bin/idp-features ]; then
            {
              echo "### Feature request plan"
              echo "bin/idp-features is not on this branch yet (crew#584 PR A, feat/crew584-feature-register, has not merged). This step is a no-op until it lands -- nothing invented here."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ok    bin/idp-features not present yet, skipping (crew#584 PR A not merged)"
            exit 0
          fi
          added=$(git diff "$base" "$head" -- platform/features/requests.yaml | grep '^+' | grep -v '^+++')
          feature=$(printf '%s\n' "$added" | grep -oP '(?<=feature:\s).*' | tail -1 | tr -d '"'"'"'"' | xargs)
          tier=$(printf '%s\n' "$added" | grep -oP '(?<=tier:\s).*' | tail -1 | tr -d '"'"'"'"' | xargs)
          if [ -z "$feature" ] || [ -z "$tier" ]; then
            echo "BLIND could not read a feature/tier pair out of the requests.yaml diff"
            exit 1
          fi
          # Informational: the reviewer reads the cost/fits line before merging, but a "fits:
          # no" answer is a review signal, not a reason to red every other check on this pull
          # request, so a non-zero exit here is captured, not propagated.
          set +e
          plan_out=$(bin/idp-features plan --set "$feature=$tier" 2>&1)
          rc=$?
          set -e
          {
            echo "### Feature request plan for \`$feature=$tier\`"
            echo '```'
            echo "$plan_out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || echo "note: bin/idp-features plan exited $rc; see the check summary"

  # A test that executes nothing is not a test. 322 files that read this repository's own YAML
  # and asserted what it said were deleted on 2026-09-04 (519d59e8); within the hour another
  # session started writing the 323rd. Deleting the class once does not stop it coming back, so
  # this refuses a new one at the door (LAW 45). Deliberately its own job and not a step in
  # fast-gate, whose bot exemption skips the whole gate for agent-authored pull requests --
  # which are exactly the pull requests that write these files.
  executes-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: bin/test-executes-gate "${{ github.event.pull_request.base.sha }}"
