name: matrix-review
# ADR 0009 / crew#562. Founder, 2026-08-28: "i like the matrix, enforce it" / "rigorously, cant be
# cheated" / "need evidence" / "and we eed to rview weekly". This is the weekly review, on the
# platform's own scheduler (GitHub Actions cron, the same clock drill-heartbeat runs on), never a
# session's memory: bin/matrix-gate --review --verify-receipts re-reads every evidence URL, checks
# every receipt is a comment by the repository owner, lists the decisions past next_review, and
# posts the report on the crew issue. A red run opens loud (P1 label, run URL) like the drills do.
on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: matrix-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: bin/matrix-gate --review --verify-receipts
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bin/matrix-gate --review --verify-receipts 2>&1 | tee review.out
      - name: summary
        if: always()
        run: cat review.out >> "$GITHUB_STEP_SUMMARY"
      # The run's own token reaches this repository only, so the review lands on one standing idp
      # issue ("Weekly matrix review", like trace-drill's P1 issue) that links the crew board.
      - name: post the review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdict=$(tail -1 review.out)
          body=$(printf '## %s\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\nMatrix: docs/decisions/decision-matrix.yaml · ADR 0009 · board https://github.com/chidionyema/crew/issues/562\n' "$verdict" "$(cat review.out)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          n=$(gh issue list --state open --search 'in:title "Weekly matrix review"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Weekly matrix review" --body "$body"; fi
      - name: loud on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create P1 --color D93F0B --force >/dev/null 2>&1 || true
          line=$(grep -m1 FAIL review.out || tail -1 review.out)
          gh issue create -t "matrix-review red: $line" -l P1 -b "$(printf '%s\n\nRun: %s/%s/actions/runs/%s\nBoard: https://github.com/chidionyema/crew/issues/562\n' "$(cat review.out)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
