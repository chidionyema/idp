name: build-multiarch
# R24: every Dockerfile in this repository is built for linux/amd64 and linux/arm64
# and pushed as one manifest list to GHCR on main. Pull requests build both
# architectures and push nothing.
#
# Each architecture builds on its own native runner (ubuntu-24.04 and
# ubuntu-24.04-arm, free on public repositories) and the merge job joins the two
# digests into one tag. QEMU emulation was rejected: unpacking build-essential
# alone took 11+ minutes emulated (chidionyema-b0, 2026-08-25).
# bin/multiarch-gate resolves `${{ matrix.platform }}` to the union of the matrix
# and refuses this file if the union is ever less than both.
#
# A green run on main that built nothing is not evidence: with zero images in
# bin/dockerfiles the build and merge jobs are skipped and the run still reports
# success. Read the discover job's output before citing a green here.
# Tags are the commit sha only. A moving tag (:main, :latest) makes the running
# version whichever push won a race and leaves a rollback nothing to roll back
# to; prospector's container-images.yml states the same rule.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
# A newer run on the same ref supersedes the older one: on 2026-08-27 20:23Z idp had 9 running and
# 20 queued runs, 12 of them stale duplicates, and a one-line oke-check waited 19 min (crew#516).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # bin/dockerfiles --changed-since needs the base commit
      # Build only the images the change reaches: on 2026-08-27 every run built all
      # images on both architectures (six builds) for a one-line YAML edit (crew#516).
      # A pull request diffs against its base; a push against the commit before it;
      # an unknown ref (first push, force-push) builds everything.
      - id: find
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base="origin/${{ github.base_ref }}"; else base="${{ github.event.before }}"; fi
          list=$(bin/dockerfiles --json --changed-since "$base")
          echo "list=$list" >> "$GITHUB_OUTPUT"; echo "dockerfiles (changed since $base): $list"
  build:
    needs: discover
    if: needs.discover.outputs.dockerfiles != '[]'
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover.outputs.dockerfiles) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: |
          n='${{ matrix.dockerfile.name }}'
          arch=${{ matrix.platform }}; arch=${arch#linux/}
          {
            echo "context=${{ matrix.dockerfile.context }}"
            echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/$n"
            echo "arch=$arch"
            echo "slug=$(echo "$n" | tr -c 'a-z0-9\n' '-')"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.name.outputs.context }}
          file: ${{ matrix.dockerfile.dockerfile }}
          platforms: ${{ matrix.platform }}
          # On push: one untagged image per arch, joined by digest in `merge`.
          # TWO EXPORTERS, ONE BUILD. The first is unchanged: on a push each
          # architecture is pushed to GHCR by digest and untagged, and `merge`
          # joins the two. The second writes the same image to a tarball so
          # Trivy scans the exact bytes that were pushed rather than a second
          # build of the same Dockerfile. Verified locally on buildx v0.36.1:
          # `--output type=cacheonly --output type=docker,dest=...` in one
          # invocation exports both. `type=docker` is single-platform only,
          # which is fine because each matrix leg is one platform.
          outputs: |
            ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || 'type=cacheonly' }}
            type=docker,dest=/tmp/scan.tar
          cache-from: type=gha,scope=${{ steps.name.outputs.slug }}-${{ steps.name.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.slug }}-${{ steps.name.outputs.arch }}
      # NO CRITICAL VULNERABILITY GETS A TAG.
      #
      # This runs after the per-arch push, which looks backwards and is not. The
      # push is push-by-digest and untagged: nothing can pull it by name, and
      # GHCR garbage-collects an untagged digest. A CRITICAL finding fails this
      # job, `merge` needs `build`, so `imagetools create` never runs and no tag
      # ever points at the image. Scanning before the push would need a second
      # build; this way the bytes scanned are the bytes pushed.
      #
      # CRITICAL only, and `ignore-unfixed`. A gate that fires on findings
      # nobody can act on gets switched off within a week, and then it is
      # protecting nothing (LAW 38). HIGH and below are Dependabot's job, which
      # opens a PR a human reads. Raise this bar when the CRITICAL count has
      # been zero for a month, not before.
      - name: no CRITICAL vulnerability ships
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/scan.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests/${{ steps.name.outputs.slug }}
          # artifact paths may not contain ":" -- store the hex only, re-prefix in merge
          d="${{ steps.build.outputs.digest }}"; touch "/tmp/digests/${{ steps.name.outputs.slug }}/${d#sha256:}"
          echo "${{ steps.name.outputs.image }}" > /tmp/digests/${{ steps.name.outputs.slug }}/IMAGE
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.name.outputs.slug }}-${{ steps.name.outputs.arch }}
          path: /tmp/digests/${{ steps.name.outputs.slug }}/*
          if-no-files-found: error
  merge:
    needs: [discover, build]
    if: github.event_name == 'push' && needs.discover.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    # id-token is what makes the signature keyless. Cosign exchanges this run's
    # OIDC token for a short-lived Fulcio certificate, so there is no signing
    # key to store, rotate or leak -- the identity in the certificate is this
    # repository and this workflow, and it cannot be reproduced anywhere else.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        dockerfile: ${{ fromJson(needs.discover.outputs.dockerfiles) }}
    steps:
      - id: name
        run: |
          n='${{ matrix.dockerfile.name }}'
          echo "slug=$(echo "$n" | tr -c 'a-z0-9\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ steps.name.outputs.slug }}-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: tag
        name: one tag, two architectures
        run: |
          cd /tmp/digests
          image=$(cat IMAGE)
          # A glob and a case guard rather than `ls | grep`. The build job writes
          # one empty file per architecture named for its digest, so the filter
          # is "64 hex characters"; parsing ls to get there breaks on any name
          # that is not one (shellcheck SC2010).
          digests=""
          for f in *; do
            case "$f" in *[!0-9a-f]*) continue ;; esac
            [ "${#f}" -eq 64 ] || continue
            digests="$digests $image@sha256:$f"
          done
          n=$(echo "$digests" | wc -w)
          [ "$n" -eq 2 ] || { echo "R24: expected 2 per-arch digests, found $n"; exit 1; }
          # shellcheck disable=SC2086
          # $digests is a list of image references and must word-split here.
          # Two tags on one manifest list. `:<sha>` is the provenance tag. `main-<run>-<sha>` is the
          # tag Flux orders by: a bare sha is a 40-hex string with no order, so an ImagePolicy over it
          # cannot say which image is newest (crew#267). run_number only ever grows, so
          # platform/image-automation/backstage.yaml sorts on it. Signed by digest below, so the
          # extra tag adds nothing to sign.
          docker buildx imagetools create -t "$image:${{ github.sha }}" -t "$image:main-${{ github.run_number }}-${{ github.sha }}" $digests
          docker buildx imagetools inspect "$image:${{ github.sha }}" | grep -E 'Platform:' | sort -u
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # WHO BUILT THIS, PROVED BY SOMETHING OTHER THAN THE REGISTRY.
      #
      # A tag in GHCR says only that someone with push rights put it there. A
      # cosign signature says which repository, which workflow file and which
      # commit produced it, and the record is in a public transparency log, so
      # it cannot be backdated or quietly replaced.
      #
      # Signed by DIGEST, never by tag. A tag is a moving pointer -- signing
      # `:sha` would attest to whatever that name resolves to at verification
      # time, which is exactly the property the signature is supposed to remove.
      # The manifest-list digest covers both architectures, so one signature
      # serves amd64 and arm64.
      - name: sign the manifest list
        run: |
          image='${{ steps.tag.outputs.image }}'
          digest=$(docker buildx imagetools inspect "$image:${{ github.sha }}" --format '{{.Manifest.Digest}}')
          # `--new-bundle-format=false` IS THE WHOLE REASON KYVERNO CAN READ THIS.
          #
          # cosign-installer v4.1.2 installs cosign v3.0.6, and v3 flipped
          # `--new-bundle-format` to default true (cmd/cosign/cli/options/sign.go:155).
          # In that mode the signature is written as a Sigstore bundle v0.3 OCI
          # *referrer* -- GHCR answers /v2/.../referrers/ with 404, so it lands on
          # the referrers tag fallback `sha256-<hex>` with no suffix. Measured on
          # ghcr.io/chidionyema/sovereign-worker@sha256:346446686948aa64ca8cc41bda1e
          # 34e618b512e713d58d11a89bad1f1090c8e3 (run 33166323423): 608 tags, 182 of
          # them `sha256-<hex>`, ZERO ending `.sig`. Kyverno's verifier looks for the
          # legacy `sha256-<hex>.sig` tag and reports `no signatures found`, so an
          # Enforce policy would refuse every image this workflow builds.
          # `--use-signing-config` must go with it: its help says it requires the new
          # bundle format.
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$image@$digest"
          echo "signed $image@$digest"

          # VERIFY IT HERE, IN THIS RUN.
          #
          # `cosign sign` exiting 0 says a signature was uploaded. It does not
          # say the signature verifies, that the certificate carries the identity
          # we expect, or that Rekor accepted the entry -- and a signature nobody
          # checks is a claim, not a proof. This step is what turns it into one,
          # and it fails the job if it does not hold.
          #
          # The identity regexp is anchored to this repository, and that anchor
          # is the whole check. Without it `cosign verify` accepts any identity
          # in the public Fulcio root -- which is every GitHub repository there
          # is, so it would pass on an image signed by a stranger.
          cosign verify "$image@$digest" \
            --new-bundle-format=false \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /tmp/cosign-verify.json
          echo "verified $image@$digest"

          # AND PROVE IT WITH SOMETHING THAT IS NOT COSIGN.
          #
          # The two commands above both ran cosign, so a storage format only cosign
          # could find still printed a full green `Verification for ...` block --
          # which is exactly what happened for every signature this workflow wrote
          # before this commit. A third party has to be able to FIND the signature,
          # and the legacy tag is where every third party looks. docker is not
          # cosign, and this fails the job if the tag is absent.
          sigtag="sha256-${digest#sha256:}.sig"
          docker buildx imagetools inspect "$image:$sigtag" > /dev/null
          echo "third party can find it: $image:$sigtag"
          echo
          echo "anyone can repeat that with:"
          echo "  cosign verify $image@$digest \\"
          echo "    --new-bundle-format=false \\"
          echo "    --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com" 
