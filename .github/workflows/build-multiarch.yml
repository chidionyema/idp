name: build-multiarch
# R24: every Dockerfile in this repository is built for linux/amd64 and linux/arm64
# and pushed as one manifest list to GHCR on main. Pull requests build both
# architectures and push nothing.
#
# Each architecture builds on its own native runner (ubuntu-24.04 and
# ubuntu-24.04-arm, free on public repositories) and the merge job joins the two
# digests into one tag. QEMU emulation was rejected: unpacking build-essential
# alone took 11+ minutes emulated (chidionyema-b0, 2026-08-25).
# bin/multiarch-gate resolves `${{ matrix.platform }}` to the union of the matrix
# and refuses this file if the union is ever less than both.
#
# A green run on main that built nothing is not evidence: with zero images in
# bin/dockerfiles the build and merge jobs are skipped and the run still reports
# success. Read the discover job's output before citing a green here.
# Tags are the commit sha only. A moving tag (:main, :latest) makes the running
# version whichever push won a race and leaves a rollback nothing to roll back
# to; prospector's container-images.yml states the same rule.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: find
        run: |
          list=$(bin/dockerfiles --json)
          echo "list=$list" >> "$GITHUB_OUTPUT"; echo "dockerfiles: $list"
  build:
    needs: discover
    if: needs.discover.outputs.dockerfiles != '[]'
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover.outputs.dockerfiles) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: |
          n='${{ matrix.dockerfile.name }}'
          arch=${{ matrix.platform }}; arch=${arch#linux/}
          echo "context=${{ matrix.dockerfile.context }}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ github.repository_owner }}/$n" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$n" | tr -c 'a-z0-9\n' '-')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.name.outputs.context }}
          file: ${{ matrix.dockerfile.dockerfile }}
          platforms: ${{ matrix.platform }}
          # On push: one untagged image per arch, joined by digest in `merge`.
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || 'type=image,push=false' }}
          cache-from: type=gha,scope=${{ steps.name.outputs.slug }}-${{ steps.name.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.slug }}-${{ steps.name.outputs.arch }}
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests/${{ steps.name.outputs.slug }}
          # artifact paths may not contain ":" -- store the hex only, re-prefix in merge
          d="${{ steps.build.outputs.digest }}"; touch "/tmp/digests/${{ steps.name.outputs.slug }}/${d#sha256:}"
          echo "${{ steps.name.outputs.image }}" > /tmp/digests/${{ steps.name.outputs.slug }}/IMAGE
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ steps.name.outputs.slug }}-${{ steps.name.outputs.arch }}
          path: /tmp/digests/${{ steps.name.outputs.slug }}/*
          if-no-files-found: error
  merge:
    needs: [discover, build]
    if: github.event_name == 'push' && needs.discover.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: ${{ fromJson(needs.discover.outputs.dockerfiles) }}
    steps:
      - id: name
        run: |
          n='${{ matrix.dockerfile.name }}'
          echo "slug=$(echo "$n" | tr -c 'a-z0-9\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ steps.name.outputs.slug }}-*
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: one tag, two architectures
        run: |
          cd /tmp/digests
          image=$(cat IMAGE)
          digests=$(ls | grep -E '^[0-9a-f]{64}$' | sed "s|^|$image@sha256:|" | tr '\n' ' ')
          n=$(echo "$digests" | wc -w); [ "$n" -eq 2 ] || { echo "R24: expected 2 per-arch digests, found $n"; exit 1; }
          docker buildx imagetools create -t "$image:${{ github.sha }}" $digests
          docker buildx imagetools inspect "$image:${{ github.sha }}" | grep -E 'Platform:' | sort -u
