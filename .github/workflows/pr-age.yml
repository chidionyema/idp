# button: Tidy old pull requests
# founder: Merges green pull requests and tells the author on the thread when one has waited too long.
# crew#607 CP2/CP3: a green PR merges itself; a PR over four hours is told why on its own thread.
# Founder, 2026-08-28: "why do we have open PRs not merged" / "4 maximum". Hourly so no PR waits on
# a peer noticing; the job is red exactly when bin/idp-pr-age is (any row over PR_AGE_MAX_H).
name: pr-age
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  id-token: write   # traded for the OCI session that reads the App key (.github/actions/github-app-token)
concurrency:
  group: pr-age
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # idp#769 incident, 2026-08-29 11:21Z: auto-merge armed under GITHUB_TOKEN merges as
      # github-actions[bot], and GitHub starts no workflow for that push: four merges landed on main
      # with no ci and no image build. Arm with the App's token and the merge is an App push.
      - id: app
        uses: ./.github/actions/github-app-token
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oci_compartment: ${{ vars.OCI_COMPARTMENT_OCID }}
      - name: sweep every open PR, merge the green, name the old
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bin/idp-pr-age --act
