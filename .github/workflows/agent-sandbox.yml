# button: Run an agent in a throwaway sandbox
# founder: Runs Claude Code or pi on a task in a fresh GitHub runner that holds no GitHub token, checks every claim it made against its own tool output, and only then opens a pull request as the estate's App. The laptop is not involved.
# agent-sandbox -- the agent works; the environment decides what leaves.
#
# Founder, 2026-09-27: enforcement must be "model and harness agnostic", "no bypasses", "everyone
# works exactly the same way" (crew#975 CP11). A rule configured inside each harness is a rule
# each harness can skip. Here the rule is where the work LEAVES: three jobs, and the one that runs
# the agent can reach nothing that matters.
#
#   agent     untrusted. contents: read, no credential left in .git, the task arrives through env
#             only (never interpolated into a script). Its only outputs are a patch and its own
#             transcript, age-encrypted -- this repo is public, and so are its logs and artifacts.
#   firewall  trusted code only: a fresh checkout of main, main's bin/epistemic_firewall.py over
#             the decrypted transcript. Refused (1) and BLIND (2) both stop the run.
#   submit-lane  trusted code only: applies the patch to main, refuses one that touches .github/
#             or .githooks/, claims the work on an issue (bin/claim-gate's exact CLAIM comment,
#             paths = every file touched, both sides of a rename), commits through the estate's own
#             .githooks (so X-Idp-Signed is stamped the way every agent machine stamps it, not
#             bypassed), and pushes lane/agent-<harness>-<run> as the estate App. The Greenlane
#             lands it when green (AGENTS.md section 2: agents push lanes, they do not open PRs).
#             Pushed as the App so the lander's push trigger fires; its 15-minute schedule is the
#             backstop.
#
# Gemini (founder, 2026-10-30: "the single highest value thing is allowing Gemini to push to the
# Greenlane"). Gemini is a model and pi is a harness: harness=gemini runs pi on Google's own API
# with SEED_GEMINI_API_KEY, so it needs neither the estate router (down since 10-27) nor the
# cluster, and its transcript is the format the firewall already grades. `model` picks the Gemini
# model (default gemini-3.5-flash, the one consult_gemini.py measured live on 2026-10-30).
#
# Not here, deliberately: running the patch's tests. That is untrusted code too, and the required
# checks on the PR already run it on runners that hold nothing.
#
# Needs, and fails closed without: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) for claude-code,
# SEED_MINIMAX_API_KEY for pi, AGENT_TRANSCRIPT_AGE_KEY (secret) + AGENT_TRANSCRIPT_AGE_RECIPIENT
# (variable), SEED_GITHUB_APP_ID + SEED_GITHUB_APP_PEM_B64 (base64 of the PEM, as bin/idp-github-app
# writes it).
name: agent-sandbox
# The run's title is the job's record: Fleet's agent-jobs panel (fleetview_backend/agent_jobs.py)
# lists these runs and reads harness and task back out of this line, so GitHub is the one ledger.
# A title, never a script: nothing here is executed.
run-name: "${{ github.event_name == 'issues' && format('agent (gemini): LEGION #{0}', github.event.issue.number) || format('agent ({0}): {1}', inputs.harness, inputs.task) }}"

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      harness:
        description: "Which agent harness runs the task"
        required: true
        type: choice
        options: [gemini, claude-code, pi]
      task:
        description: "The task, in plain words"
        required: true
        type: string
      model:
        description: "Model for harness=gemini (empty: gemini-3.5-flash)"
        required: false
        default: ""
        type: string
      issue:
        description: "Issue number to claim the work on (empty: open one)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  agent:
    # Only the founder may label an issue they authored as a Legion mission.
    if: >-
      github.event_name != 'issues' || (
        github.actor == vars.ESTATE_FOUNDER_LOGIN &&
        github.event.issue.user.login == vars.ESTATE_FOUNDER_LOGIN &&
        ((github.event.action == 'opened' && startsWith(github.event.issue.title, '[LEGION] ')) ||
         (github.event.action == 'labeled' && github.event.label.name == 'legion-run'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Trusted, read-only preparation; the model never receives GH_TOKEN.
      # A source-only candidate cannot edit this preflight workflow itself.
      - name: Preplan live DoF scope and protected paths before metered provider work
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
        run: |
          set -euo pipefail
          python3 bin/legion-mission-preflight --task "$TASK" --out "$RUNNER_TEMP/legion-success.json"
          python3 -m json.tool "$RUNNER_TEMP/legion-success.json" > /dev/null
          python3 - "$RUNNER_TEMP/legion-success.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          print("Legion success preflight level=" + p["level"] +
                " incidents=" + ",".join(p["active_incidents"]) +
                " protected-workflow-change=independent-review-required")
          PY

      - name: Install the harness and age
        env:
          HARNESS: ${{ github.event_name == 'issues' && 'gemini' || inputs.harness }}
        run: |
          set -euo pipefail
          case "$HARNESS" in
            claude-code) npm install -g --silent @anthropic-ai/claude-code@2.1.280 ;;
            pi|gemini)   npm install -g --silent @earendil-works/pi-coding-agent@0.86.1 ;;
            *)           echo "::error::unknown harness"; exit 1 ;;
          esac
          sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Run the agent (its output goes to a file, never to this public log)
        env:
          HARNESS: ${{ github.event_name == 'issues' && 'gemini' || inputs.harness }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MINIMAX_API_KEY: ${{ secrets.SEED_MINIMAX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEED_GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          # Only founder-issued Legion missions receive a bounded provider fallback.
          LEGION_FAILOVER: ${{ github.event_name == 'issues' && '1' || '0' }}
        run: |
          set -euo pipefail
          # This briefing was obtained BEFORE the model call and is not writable
          # by the model in a different run step. It gives a positive, viable
          # route for current work and explicitly forbids guarded source edits.
          packet="$RUNNER_TEMP/legion-success.json"
          [ -s "$packet" ] || { echo "::error::Legion success contract missing; no provider request"; exit 2; }
          TASK="$(printf '%s\\n\\n%s\\n%s' "$TASK" 'MANDATORY LIVE ESTATE PREPLAN (read this before modifying any file; this packet is advice, never a permission grant):' "$(cat "$packet")")"
          out="$RUNNER_TEMP/out"; mkdir -p "$out" "$RUNNER_TEMP/pi-sessions"
          git rev-parse HEAD > "$out/base"
          # The newest transcript anywhere under a directory, or nothing. Not `ls -t <globs>`: one
          # glob that matches nothing makes ls exit 2, pipefail carries it, and set -e ended the
          # step before it could say why (run 36317202633). stdin is closed: a harness that sees
          # an open pipe waits on it.
          newest() { find "$1" -type f -name '*.jsonl' -exec ls -t {} + 2>/dev/null | head -1 || true; }
          case "$HARNESS" in
            claude-code)
              [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set"; exit 1; }
              rc=0; claude -p "$TASK" --dangerously-skip-permissions < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$HOME/.claude/projects") ;;
            pi)
              [ -n "$MINIMAX_API_KEY" ] || { echo "::error::SEED_MINIMAX_API_KEY is not set"; exit 1; }
              rc=0; pi -p --provider minimax --model MiniMax-M2.7 --session-dir "$RUNNER_TEMP/pi-sessions" "$TASK" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$RUNNER_TEMP/pi-sessions") ;;
            gemini)
              [ -n "$GEMINI_API_KEY" ] || { echo "::error::SEED_GEMINI_API_KEY is not set"; exit 1; }
              rc=0; pi -p --provider google --model "${MODEL:-gemini-3.5-flash}" --session-dir "$RUNNER_TEMP/pi-sessions" "$TASK" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$RUNNER_TEMP/pi-sessions") ;;
          esac
          # An untrusted model can change the worktree before failing. A second
          # provider must NEVER inherit its edits: firewall sees only the
          # successful provider's transcript, so the patch must match it.
          if [ "$HARNESS" = gemini ] && [ "${LEGION_FAILOVER:-0}" = 1 ] && [ "$rc" -ne 0 ]; then
            class=provider-failure-unclassified
            if grep -Eiq 'model.?not.?found|unknown model|unsupported model|model.*does not exist' "$out/stdout"; then
              class=model-unavailable
            elif grep -Eiq 'authentication_error|unauthori[sz]ed|invalid.?api.?key|permission.denied' "$out/stdout"; then
              class=authentication
            elif grep -Eiq '429|quota.exceeded|rate.?limit|resource.exhausted' "$out/stdout"; then
              class=capacity-or-rate-limit
            elif grep -Eiq 'timeout|timed out|ECONNRESET|ECONNREFUSED|network error' "$out/stdout"; then
              class=transport
            fi
            if [ -n "${MINIMAX_API_KEY:-}" ]; then
              # Preserve all failure details inside the age-encrypted artifact;
              # the public log gets only a fixed, low-entropy category.
              cp "$out/stdout" "$out/google.failed.stdout"
              if [ -n "${transcript:-}" ] && [ -f "$transcript" ]; then
                cp "$transcript" "$out/google.failed.transcript.jsonl"
              fi
              git reset --hard "$(cat "$out/base")" >/dev/null
              git clean -fdx >/dev/null
              rm -rf "$RUNNER_TEMP/pi-sessions"
              mkdir -p "$RUNNER_TEMP/pi-sessions" "$RUNNER_TEMP/legion-fallback-home"
              rc=0
              # The second provider also gets a clean HOME: no first-model
              # edits to ~/.pi, shell profiles or agent tools may carry over.
              HOME="$RUNNER_TEMP/legion-fallback-home" pi -p --provider minimax --model MiniMax-M2.7 --session-dir "$RUNNER_TEMP/pi-sessions" "$TASK" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$RUNNER_TEMP/pi-sessions")
              echo "legion provider fallback: google_failure=$class fallback=minimax exit=$rc"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf 'Legion fallback: Gemini failed (%s); MiniMax exit %s; firewall still required.\n' "$class" "$rc" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "legion provider failure: class=$class fallback=unavailable"
            fi
          fi
          echo "harness exit $rc"
          if [ -z "${transcript:-}" ]; then
            # No transcript means the harness never got as far as working; its first line is the
            # reason (a start-up error, not the agent's words).
            echo "::error::the harness left no transcript; nothing can be graded. It said: $(head -1 "$out/stdout" | cut -c1-200)"
            exit 1
          fi
          # Preserve failed runs too: their private transcript is the diagnostic evidence.
          cp "$transcript" "$out/transcript.jsonl"
          if [ "$rc" -ne 0 ]; then
            # A harness that failed did no work worth grading: stop here with the reason. Only the
            # provider's HTTP status and error type reach this public log, never the agent's words.
            # A rejected key reads: 401 {"type":"error","error":{"type":"authentication_error",...
            status=$(grep -oE '^[0-9]{3} ' "$out/stdout" | head -1 || true)
            kind=$(grep -oE '"type":"[a-z_]+_error"' "$out/stdout" | head -1 | cut -d'"' -f4 || true)
            echo "::error::the harness failed (exit $rc); provider said: ${status:-no status}${kind:-}"
            exit "$rc"
          fi
          # The patch is everything the agent changed against the commit it started from,
          # committed or not, tracked or new.
          git add -A
          git diff --cached --binary "$(cat "$out/base")" > "$out/patch"
          echo "patch: $(git diff --cached --stat "$(cat "$out/base")" | tail -1)"

      - name: Encrypt what leaves the job
        if: always()
        env:
          RECIPIENT: ${{ vars.AGENT_TRANSCRIPT_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [ -n "$RECIPIENT" ] || { echo "::error::AGENT_TRANSCRIPT_AGE_RECIPIENT is not set"; exit 1; }
          out="$RUNNER_TEMP/out"; mkdir -p "$RUNNER_TEMP/sealed"
          files=()
          for name in base patch transcript.jsonl stdout google.failed.stdout google.failed.transcript.jsonl; do
            if [ -f "$out/$name" ]; then files+=("$name"); fi
          done
          [ "${#files[@]}" -gt 0 ] || { echo "::error::the job left no evidence to seal"; exit 1; }
          tar -C "$out" -cf - "${files[@]}" | age -r "$RECIPIENT" -o "$RUNNER_TEMP/sealed/work.tar.age"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-work
          path: ${{ runner.temp }}/sealed/work.tar.age
          retention-days: 5
          if-no-files-found: error

  firewall:
    needs: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-work
          path: ${{ runner.temp }}/sealed

      - name: Grade every claim the agent made against its own tool output
        env:
          AGE_KEY: ${{ secrets.AGENT_TRANSCRIPT_AGE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AGE_KEY" ] || { echo "::error::AGENT_TRANSCRIPT_AGE_KEY is not set"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          work="$RUNNER_TEMP/work"; mkdir -p "$work"
          printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
          age -d -i "$RUNNER_TEMP/key" "$RUNNER_TEMP/sealed/work.tar.age" | tar -C "$work" -xf - transcript.jsonl
          rm -f "$RUNNER_TEMP/key"
          # The verdict quotes the agent's own sentences, and this log is public: print the verdict
          # and the count, keep the sentences in the sealed artifact.
          rc=0; python3 bin/epistemic_firewall.py "$work/transcript.jsonl" > "$work/verdict" 2>&1 || rc=$?
          echo "firewall exit $rc: $(head -1 "$work/verdict" | cut -c1-40); refused claims: $(grep -c ' <- ' "$work/verdict" || true)"
          exit "$rc"

  submit-lane:
    needs: [agent, firewall]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # the claim: an issue and its CLAIM comment (bin/claim-gate reads both)
    steps:
      - name: Decode the App key
        id: pem
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PEM_B64" ] || { echo "::error::SEED_GITHUB_APP_PEM_B64 is not set"; exit 1; }
          pem=$(printf %s "$PEM_B64" | base64 -d)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo "key<<PEM_EOF"; printf '%s\n' "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-work
          path: ${{ runner.temp }}/sealed

      - name: Apply the patch to main, refusing what an agent may not change
        env:
          AGE_KEY: ${{ secrets.AGENT_TRANSCRIPT_AGE_KEY }}
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          work="$RUNNER_TEMP/work"; mkdir -p "$work"
          printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
          age -d -i "$RUNNER_TEMP/key" "$RUNNER_TEMP/sealed/work.tar.age" | tar -C "$work" -xf - patch base
          rm -f "$RUNNER_TEMP/key"
          [ -s "$work/patch" ] || { echo "::error::the agent changed nothing; there is no PR to open"; exit 1; }
          git apply --index --3way "$work/patch"
          # Read back what the index now holds, both sides of every rename included, rather than
          # parse the patch text.
          refused=$(git diff --cached --name-only --no-renames HEAD | grep -E '^(\.github|\.githooks)/' || true)
          if [ -n "$refused" ]; then
            echo "::error::an agent patch may not change CI or hooks:"; echo "$refused"; exit 1
          fi
          # The agent-controlled candidate is DATA. Execute ONLY the pinned
          # trusted-main preflight, copied from HEAD before patch application.
          mkdir -p "$RUNNER_TEMP/legion-policy/bin" "$RUNNER_TEMP/legion-policy/catalog"
          git show HEAD:bin/legion-mission-preflight > "$RUNNER_TEMP/legion-policy/bin/legion-mission-preflight"
          git show HEAD:catalog/dof-registry.json > "$RUNNER_TEMP/legion-policy/catalog/dof-registry.json"
          paths=$(git diff --cached --name-only --no-renames HEAD | paste -sd, -)
          # An incident repair is a VIABLE route, not a permanent DoF deadlock.
          # The model/task can suggest the ID but cannot mint it: the pinned
          # checker independently confirms that it is a real OPEN incident and
          # that every changed path sits in its registered repairScope.
          repair_of=$(printf '%s\n' "$TASK" | grep -m1 -E '^Genesis-Resolves: [a-z0-9-]+$' | cut -d' ' -f2 || true)
          args=(--task "$TASK" --paths "$paths" --out "$RUNNER_TEMP/legion-policy/verdict.json")
          if [ -n "$repair_of" ]; then args+=(--repair-of "$repair_of"); fi
          python3 "$RUNNER_TEMP/legion-policy/bin/legion-mission-preflight" "${args[@]}"
          python3 - "$RUNNER_TEMP/legion-policy/verdict.json" <<'PY'
          import json, sys
          packet = json.load(open(sys.argv[1]))
          verdict = packet.get("patch_preflight") or {}
          if not verdict.get("admitted"):
              print("::error::agent patch fails preflight: " + str(verdict.get("reason")))
              print("Next: " + str(verdict.get("next") or "refresh approved scope"))
              sys.exit(2)
          if verdict.get("reason") == "SCOPED_REPAIR":
              from pathlib import Path
              import re
              component = verdict.get("repair_of")
              assert isinstance(component, str) and re.fullmatch(r"[a-z][a-z0-9-]{0,63}", component)
              Path(sys.argv[1]).with_name("repair-of").write_text(component + "\\n")
          print("agent patch preflight admissible: final independent gates still required")
          PY



      - name: Install what the estate's commit hooks run (the fast gate's own pins)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/idp-gate-venv"
          "$RUNNER_TEMP/idp-gate-venv/bin/python" -m pip install -q --disable-pip-version-check ruff==0.15.18 yamllint==1.37.1 pytest==8.3.5
          echo "$RUNNER_TEMP/idp-gate-venv/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq shellcheck

      - name: Claim the work on an issue
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ github.event_name == 'issues' && 'gemini' || inputs.harness }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
          ISSUE: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          agent="$HARNESS"
          # Every path the change touches, both sides of a rename: bin/claim-gate refuses a file
          # outside the claim's paths=, and a rename touches two.
          paths=$(git diff --cached --name-only --no-renames HEAD | paste -sd, -)
          [ -n "$paths" ] || { echo "::error::nothing staged to claim"; exit 1; }
          num="$ISSUE"
          if [ -z "$num" ]; then
            title="agent-sandbox (${HARNESS}): $(printf '%s' "$TASK" | head -1 | cut -c1-80)"
            url=$(gh issue create --title "$title" --body "Opened by agent-sandbox to claim this run's work. Run: ${RUN_URL}")
            num="${url##*/}"
          fi
          hb=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh issue comment "$num" --body "CLAIM agent=${agent} paths=${paths} heartbeat=${hb}"
          { echo "num=$num"; echo "agent=$agent"; } >> "$GITHUB_OUTPUT"

      - name: Commit through the estate's own hooks and push the lane
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ github.event_name == 'issues' && 'gemini' || inputs.harness }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
          NUM: ${{ steps.claim.outputs.num }}
          AGENT: ${{ steps.claim.outputs.agent }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="lane/agent-${HARNESS}-${GITHUB_RUN_ID}"
          git config user.name "estate-agent-sandbox"
          git config user.email "estate-agent-sandbox@users.noreply.github.com"
          git config core.hooksPath .githooks
          git checkout -q -b "$branch"
          subject="agent-sandbox (${HARNESS}): $(printf '%s' "$TASK" | head -1 | cut -c1-72)"
          printf '%s\n\nRun: %s\n\nClaim: #%s\nAgent: %s\n' "$subject" "$RUN_URL" "$NUM" "$AGENT" > "$RUNNER_TEMP/msg"
          # DoF resolves comes only from a trusted-main, live-incident-verified
          # preflight result; the agent cannot self-assert an arbitrary trailer.
          if [ -s "$RUNNER_TEMP/legion-policy/repair-of" ]; then
            repair_of=$(cat "$RUNNER_TEMP/legion-policy/repair-of")
            [[ "$repair_of" =~ ^[a-z][a-z0-9-]{0,63}$ ]] || { echo "::error::invalid verified repair id"; exit 2; }
            printf '\nGenesis-Resolves: %s\n' "$repair_of" >> "$RUNNER_TEMP/msg"
          fi
          git commit -q -F "$RUNNER_TEMP/msg"
          git log -1 --format=%B | grep -q '^X-Idp-Signed: ' || { echo "::error::the commit-msg hook did not stamp the commit"; exit 1; }
          git push -q origin "$branch"
          gh issue comment "$NUM" --body "Submitted \`${branch}\` (harness ${HARNESS}). The Greenlane lands it when it is green. Run: ${RUN_URL}"
          echo "submitted $branch for claim #$NUM"
