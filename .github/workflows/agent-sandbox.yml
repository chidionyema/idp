# button: Run an agent in a throwaway sandbox
# founder: Runs Claude Code or pi on a task in a fresh GitHub runner that holds no GitHub token, checks every claim it made against its own tool output, and only then opens a pull request as the estate's App. The laptop is not involved.
# agent-sandbox -- the agent works; the environment decides what leaves.
#
# Founder, 2026-09-27: enforcement must be "model and harness agnostic", "no bypasses", "everyone
# works exactly the same way" (crew#975 CP11). A rule configured inside each harness is a rule
# each harness can skip. Here the rule is where the work LEAVES: three jobs, and the one that runs
# the agent can reach nothing that matters.
#
#   agent     untrusted. contents: read, no credential left in .git, the task arrives through env
#             only (never interpolated into a script). Its only outputs are a patch and its own
#             transcript, age-encrypted -- this repo is public, and so are its logs and artifacts.
#   firewall  trusted code only: a fresh checkout of main, main's bin/epistemic_firewall.py over
#             the decrypted transcript. Refused (1) and BLIND (2) both stop the run.
#   submit-lane  trusted code only: applies the patch to main, refuses one that touches .github/
#             or .githooks/, claims the work on an issue (bin/claim-gate's exact CLAIM comment,
#             paths = every file touched, both sides of a rename), commits through the estate's own
#             .githooks (so X-Idp-Signed is stamped the way every agent machine stamps it, not
#             bypassed), and pushes lane/agent-<harness>-<run> as the estate App. The Greenlane
#             lands it when green (AGENTS.md section 2: agents push lanes, they do not open PRs).
#             Pushed as the App so the lander's push trigger fires; its 15-minute schedule is the
#             backstop.
#
# Gemini (founder, 2026-10-30: "the single highest value thing is allowing Gemini to push to the
# Greenlane"). Gemini is a model and pi is a harness: harness=gemini runs pi on Google's own API
# with SEED_GEMINI_API_KEY, so it needs neither the estate router (down since 10-27) nor the
# cluster, and its transcript is the format the firewall already grades. `model` picks the Gemini
# model (default gemini-3.5-flash, the one consult_gemini.py measured live on 2026-10-30).
#
# Not here, deliberately: running the patch's tests. That is untrusted code too, and the required
# checks on the PR already run it on runners that hold nothing.
#
# Needs, and fails closed without: CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) for claude-code,
# SEED_MINIMAX_API_KEY for pi, AGENT_TRANSCRIPT_AGE_KEY (secret) + AGENT_TRANSCRIPT_AGE_RECIPIENT
# (variable), SEED_GITHUB_APP_ID + SEED_GITHUB_APP_PEM_B64 (base64 of the PEM, as bin/idp-github-app
# writes it).
name: agent-sandbox
# The run's title is the job's record: Fleet's agent-jobs panel (fleetview_backend/agent_jobs.py)
# lists these runs and reads harness and task back out of this line, so GitHub is the one ledger.
# A title, never a script: nothing here is executed.
run-name: "${{ github.event_name == 'issues' && format('agent ({0}): LEGION #{1}', github.event.label.name == 'claude-native' && 'claude-code' || 'auto', github.event.issue.number) || format('agent ({0}): {1}', inputs.harness, inputs.task) }}"

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      harness:
        description: "Which agent harness runs the task"
        required: true
        type: choice
        options: [auto, claude-code, gemini, pi]
      task:
        description: "The task, in plain words"
        required: true
        type: string
      model:
        description: "Model for harness=gemini (empty: gemini-3.5-flash)"
        required: false
        default: ""
        type: string
      issue:
        description: "Issue number to claim the work on (empty: open one)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  admit:
    # Only the founder may label an issue they authored as a Legion mission.
    # claude-native selects genuine Claude Code with the same founder authorization,
    # sealed transcript firewall and patch-only submission boundaries.
    if: >-
      github.event_name != 'issues' || (
        github.actor == vars.ESTATE_FOUNDER_LOGIN &&
        github.event.issue.user.login == vars.ESTATE_FOUNDER_LOGIN &&
        ((github.event.action == 'opened' && startsWith(github.event.issue.title, '[LEGION] ')) ||
         (github.event.action == 'labeled' && (github.event.label.name == 'legion-run' || github.event.label.name == 'claude-native')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base: ${{ steps.admission.outputs.base }}
      scope_json: ${{ steps.admission.outputs.scope_json }}
      scope_sha256: ${{ steps.admission.outputs.scope_sha256 }}
      provider: ${{ steps.admission.outputs.provider }}
      model: ${{ steps.admission.outputs.model }}
      key_env: ${{ steps.admission.outputs.key_env }}
      key_secret: ${{ steps.admission.outputs.key_secret }}
      fallback: ${{ steps.admission.outputs.fallback }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      # The admission gate reads a fresh `estate.lane-fitness.v1` record per route and refuses
      # `NO_FIT_LANE before inference` without one (#8659). Nothing wrote that ledger from a
      # caller, so every `--harness auto` run was dead on arrival even with the writer on main
      # (#8680). Write it first, from the SAME secret names the admission step below receives,
      # so a measured route is a route admission can actually call.
      - name: Measure lane fitness before admission
        id: fitness
        env:
          MINIMAX_API_KEY: ${{ secrets.SEED_MINIMAX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEED_GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.SEED_ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SEED_DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.SEED_GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.SEED_OPENROUTER_API_KEY }}
          LEGION_PAID_PROVIDERS: ${{ vars.LEGION_PAID_PROVIDERS }}
          LEGION_DISABLED_PROVIDERS: ${{ vars.LEGION_DISABLED_PROVIDERS }}
        run: |
          set -euo pipefail
          fitness="$RUNNER_TEMP/fitness"
          mkdir -p "$fitness"
          # rustc ships on ubuntu-24.04; the crate is std-only, so no cargo or crates.io fetch
          # sits between the lane and its admission decision.
          # Exit 1 is the writer's escalation (some route has no usable credential); its records
          # for every other route are already written, and admission refuses a route with no FIT
          # record by name. Only 2 or more means the writer itself failed (run 46132706055:
          # openrouter FIT, exit 1 for three absent keys, admission never ran).
          rc=0
          bin/lane-fitness --fitness-dir "$fitness" --secret-name-template 'SEED_{key_env}' || rc=$?
          if [ "$rc" -ge 2 ]; then echo "::error::lane-fitness writer failed (exit $rc)"; exit "$rc"; fi
      - name: Admit exact scope and provider capacity
        id: admission
        env:
          HARNESS: ${{ github.event_name == 'issues' && (github.event.label.name == 'claude-native' && 'claude-code' || 'auto') || inputs.harness }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
          MINIMAX_API_KEY: ${{ secrets.SEED_MINIMAX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEED_GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.SEED_ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SEED_DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.SEED_GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.SEED_OPENROUTER_API_KEY }}
          LEGION_PAID_PROVIDERS: ${{ vars.LEGION_PAID_PROVIDERS }}
          LEGION_DISABLED_PROVIDERS: ${{ vars.LEGION_DISABLED_PROVIDERS }}
          MODEL: ${{ inputs.model }}
          # Only founder-issued Legion missions receive a bounded provider fallback.
          LEGION_FAILOVER: ${{ github.event_name == 'issues' && '1' || '0' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/admission"
          mkdir -p "$out"
          case "$HARNESS" in auto|gemini|pi|claude-code) ;; *) exit 2 ;; esac
          # pi's execution model is fixed; probe that exact model.
          if [ "$HARNESS" = pi ]; then export MODEL=MiniMax-M2.7; fi
          # The ledger step above writes even when it refuses (exit 1 for a missing key is the
          # escalation, not an admission failure); a route with no usable record stays unfit
          # and is refused by name, which is the honest verdict.
          fitness="$RUNNER_TEMP/fitness"
          python3 bin/legion-admit --out "$out" --fitness-dir "$fitness"
          printf 'base=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          provider=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("provider",""))' "$out/admission.json")
          fallback=0
          if [ "$HARNESS" = gemini ] && [ "$provider" = google ] && [ "$LEGION_FAILOVER" = 1 ]; then
            # An admitted primary does not imply an admitted fallback.
            if env -u GITHUB_OUTPUT python3 bin/legion-admit --harness pi --model MiniMax-M2.7 --out "$out/fallback" --fitness-dir "$fitness"; then
              fallback=1
            fi
          fi
          printf 'fallback=%s\n' "$fallback" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: legion-admission
          path: ${{ runner.temp }}/admission
          retention-days: 5
          if-no-files-found: error

  agent:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.base }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Refuse tampered age bootstrap before running an agent
        run: bash tests/test_agent_sandbox_age.sh

      - name: Install the harness and age
        env:
          HARNESS: ${{ github.event_name == 'issues' && (github.event.label.name == 'claude-native' && 'claude-code' || 'auto') || inputs.harness }}
        run: |
          set -euo pipefail
          case "$HARNESS" in
            claude-code) npm install -g --silent @anthropic-ai/claude-code@2.1.280 ;;
            auto|pi|gemini)   npm install -g --silent @earendil-works/pi-coding-agent@0.86.1 ;;
            *)           echo "::error::unknown harness"; exit 1 ;;
          esac
          python3 -m pip install -q ruff==0.15.18
          bash bin/agent-sandbox-age

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: legion-admission
          path: ${{ runner.temp }}/admission

      - name: Run the agent (its output goes to a file, never to this public log)
        env:
          HARNESS: ${{ github.event_name == 'issues' && (github.event.label.name == 'claude-native' && 'claude-code' || 'auto') || inputs.harness }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (github.event.label.name == 'claude-native' || inputs.harness == 'claude-code') && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          MINIMAX_API_KEY: ${{ (inputs.harness == 'pi' || inputs.harness == 'gemini') && secrets.SEED_MINIMAX_API_KEY || '' }}
          GEMINI_API_KEY: ${{ inputs.harness == 'gemini' && secrets.SEED_GEMINI_API_KEY || '' }}
          LEGION_SELECTED_KEY: ${{ needs.admit.outputs.key_secret != '' && secrets[needs.admit.outputs.key_secret] || '' }}
          ADMITTED_KEY_ENV: ${{ needs.admit.outputs.key_env }}
          ADMITTED_MODEL: ${{ needs.admit.outputs.model }}
          LEGION_PAID_PROVIDERS: ${{ vars.LEGION_PAID_PROVIDERS }}
          LEGION_DISABLED_PROVIDERS: ${{ vars.LEGION_DISABLED_PROVIDERS }}
          MODEL: ${{ inputs.model }}
          # Only founder-issued Legion missions receive a bounded provider fallback.
          LEGION_FAILOVER: ${{ github.event_name == 'issues' && '1' || '0' }}
          ADMITTED_PROVIDER: ${{ needs.admit.outputs.provider }}
          ADMITTED_FALLBACK: ${{ needs.admit.outputs.fallback }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out" "$RUNNER_TEMP/pi-sessions"
          git rev-parse HEAD > "$out/base"
          TASK="$TASK$(cat "$RUNNER_TEMP/admission/contract.txt")"
          case "$HARNESS:$ADMITTED_PROVIDER" in
            auto:?*|gemini:google|gemini:minimax|pi:minimax|claude-code:) ;;
            *) echo "::error::provider not admitted"; exit 2 ;;
          esac
          # The newest transcript anywhere under a directory, or nothing. Not `ls -t <globs>`: one
          # glob that matches nothing makes ls exit 2, pipefail carries it, and set -e ended the
          # step before it could say why (run 36317202633). stdin is closed: a harness that sees
          # an open pipe waits on it.
          newest() { find "$1" -type f -name '*.jsonl' -exec ls -t {} + 2>/dev/null | head -1 || true; }
          case "$HARNESS" in
            auto)
              rc=0
              export TASK
              python3 bin/legion-admit --launch-admitted "$RUNNER_TEMP/admission/admission.json" --out "$out" --session-dir "$RUNNER_TEMP/pi-sessions" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$RUNNER_TEMP/pi-sessions") ;;
            claude-code)
              [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set"; exit 1; }
              # No GitHub token in this job. Authenticate Claude first with a real
              # Anthropic modelUsage receipt; reject GLM aliases before running tasks.
              [ -x bin/claude-anthropic ] || { echo "::error::CLAUDE_NATIVE_LAUNCHER_NOT_ON_TRUSTED_MAIN"; exit 1; }
              rc=0; bin/claude-anthropic --verify-live < /dev/null > "$out/claude-provider-receipt" 2> "$out/claude-provider-error" || rc=$?
              if [ "$rc" -ne 0 ]; then echo "::error::CLAUDE_NATIVE_PROVIDER_NOT_VERIFIED exit=$rc"; exit "$rc"; fi
              rc=0; bin/claude-anthropic -p "$TASK" --dangerously-skip-permissions < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$HOME/.claude/projects") ;;
            pi)
              [ -n "$MINIMAX_API_KEY" ] || { echo "::error::SEED_MINIMAX_API_KEY is not set"; exit 1; }
              rc=0; pi -p --provider minimax --model MiniMax-M2.7 --session-dir "$RUNNER_TEMP/pi-sessions" "$TASK" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$RUNNER_TEMP/pi-sessions") ;;
            gemini)
              if [ "$ADMITTED_PROVIDER" = minimax ]; then
                [ -n "$MINIMAX_API_KEY" ] || exit 1
                rc=0; pi -p --provider minimax --model MiniMax-M2.7 --session-dir "$RUNNER_TEMP/pi-sessions" "$TASK" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              else
                [ -n "$GEMINI_API_KEY" ] || { echo "::error::SEED_GEMINI_API_KEY is not set"; exit 1; }
                rc=0; pi -p --provider google --model "${MODEL:-gemini-3.5-flash}" --session-dir "$RUNNER_TEMP/pi-sessions" "$TASK" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              fi
              transcript=$(newest "$RUNNER_TEMP/pi-sessions") ;;
          esac
          # An untrusted model can change the worktree before failing. A second
          # provider must NEVER inherit its edits: firewall sees only the
          # successful provider's transcript, so the patch must match it.
          if [ "$HARNESS" = gemini ] && [ "$ADMITTED_PROVIDER" = google ] && [ "${LEGION_FAILOVER:-0}" = 1 ] && [ "$rc" -ne 0 ]; then
            class=provider-failure-unclassified
            if grep -Eiq 'model.?not.?found|unknown model|unsupported model|model.*does not exist' "$out/stdout"; then
              class=model-unavailable
            elif grep -Eiq 'authentication_error|unauthori[sz]ed|invalid.?api.?key|permission.denied' "$out/stdout"; then
              class=authentication
            elif grep -Eiq '429|quota.exceeded|rate.?limit|resource.exhausted' "$out/stdout"; then
              class=capacity-or-rate-limit
            elif grep -Eiq 'timeout|timed out|ECONNRESET|ECONNREFUSED|network error' "$out/stdout"; then
              class=transport
            fi
            if [ "${ADMITTED_FALLBACK:-0}" = 1 ] && [ -n "${MINIMAX_API_KEY:-}" ]; then
              # Preserve all failure details inside the age-encrypted artifact;
              # the public log gets only a fixed, low-entropy category.
              cp "$out/stdout" "$out/google.failed.stdout"
              if [ -n "${transcript:-}" ] && [ -f "$transcript" ]; then
                cp "$transcript" "$out/google.failed.transcript.jsonl"
              fi
              git reset --hard "$(cat "$out/base")" >/dev/null
              git clean -fd >/dev/null
              rm -rf "$RUNNER_TEMP/pi-sessions"
              mkdir -p "$RUNNER_TEMP/pi-sessions" "$RUNNER_TEMP/legion-fallback-home"
              rc=0
              # The second provider also gets a clean HOME: no first-model
              # edits to ~/.pi, shell profiles or agent tools may carry over.
              HOME="$RUNNER_TEMP/legion-fallback-home" pi -p --provider minimax --model MiniMax-M2.7 --session-dir "$RUNNER_TEMP/pi-sessions" "$TASK" < /dev/null > "$out/stdout" 2>&1 || rc=$?
              transcript=$(newest "$RUNNER_TEMP/pi-sessions")
              echo "legion provider fallback: google_failure=$class fallback=minimax exit=$rc"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf 'Legion fallback: Gemini failed (%s); MiniMax exit %s; firewall still required.\n' "$class" "$rc" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "legion provider failure: class=$class fallback=unavailable"
            fi
          fi
          echo "harness exit $rc"
          if [ "$rc" -ne 0 ]; then
            # One-pass cause, as counts only (never the agent's words). The launcher folds every
            # refusal into exit 2 and its output is sealed, so "exit 2" alone needed a second run
            # to explain (run 46134401641). These counts separate an empty patch, a scope escape,
            # a launcher refusal and a harness that never spoke.
            { git diff --name-only --no-renames HEAD; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/changed" || true
            outside=$(python3 -c 'import json,sys; a=set(json.load(open(sys.argv[1])).get("paths") or []); print(sum(1 for p in open(sys.argv[2]).read().split("\n") if p and p not in a))' "$RUNNER_TEMP/admission/admission.json" "$RUNNER_TEMP/changed" 2>/dev/null || echo unknown)
            echo "harness cause: exit=$rc launcher_refusals=$(grep -c '^REFUSED: ' "$out/stdout" || true) files_changed=$(wc -l < "$RUNNER_TEMP/changed" | tr -d ' ') outside_scope=$outside stdout_lines=$(wc -l < "$out/stdout" | tr -d ' ') transcript_lines=$( { [ -n "${transcript:-}" ] && wc -l < "$transcript"; } 2>/dev/null | tr -d ' ' || true) seconds=$SECONDS"
          fi
          if [ -z "${transcript:-}" ]; then
            # No transcript means the harness never got as far as working; its first line is the
            # reason (a start-up error, not the agent's words).
            echo "::error::the harness left no transcript; private diagnostic retained"
            exit 1
          fi
          # Preserve failed runs too: their private transcript is the diagnostic evidence.
          cp "$transcript" "$out/transcript.jsonl"
          if [ "$rc" -ne 0 ]; then
            # A harness that failed did no work worth grading: stop here with the reason. Only the
            # provider's HTTP status and error type reach this public log, never the agent's words.
            # A rejected key reads: 401 {"type":"error","error":{"type":"authentication_error",...
            status=$(grep -oE '^[0-9]{3} ' "$out/stdout" | head -1 || true)
            kind=$(grep -oE '"type":"[a-z_]+_error"' "$out/stdout" | head -1 | cut -d'"' -f4 || true)
            echo "::error::the harness failed (exit $rc); provider said: ${status:-no status}${kind:-}"
            exit "$rc"
          fi
          # The patch is everything the agent changed against the commit it started from,
          # committed or not, tracked or new.
          git add -A
          # Deterministic normalization stays in the untrusted producer, before sealing.
          # The independent submit scope and required checks still grade the final delta.
          git diff --cached --name-only --no-renames --diff-filter=ACMT -z "$(cat "$out/base")" > "$out/changed-paths"
          pyfiles=()
          while IFS= read -r -d '' p; do
            case "$p" in
              *.py) [ -f "$p" ] && [ ! -L "$p" ] && pyfiles+=("$p") ;;
            esac
          done < "$out/changed-paths"
          if [ "${#pyfiles[@]}" -gt 0 ]; then
            ruff format --quiet -- "${pyfiles[@]}" > "$out/format.stdout" 2>&1
            ruff format --quiet --check -- "${pyfiles[@]}" >> "$out/format.stdout" 2>&1
            git add -- "${pyfiles[@]}"
          fi
          git diff --cached --binary "$(cat "$out/base")" > "$out/patch"
          echo "patch: $(git diff --cached --stat "$(cat "$out/base")" | tail -1)"

      - name: Encrypt what leaves the job
        if: always()
        env:
          RECIPIENT: ${{ vars.AGENT_TRANSCRIPT_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          [ -n "$RECIPIENT" ] || { echo "::error::AGENT_TRANSCRIPT_AGE_RECIPIENT is not set"; exit 1; }
          out="$RUNNER_TEMP/out"; mkdir -p "$RUNNER_TEMP/sealed"
          files=()
          for name in base patch transcript.jsonl stdout format.stdout claude-provider-receipt claude-provider-error google.failed.stdout google.failed.transcript.jsonl; do
            if [ -f "$out/$name" ]; then files+=("$name"); fi
          done
          [ "${#files[@]}" -gt 0 ] || { echo "::error::the job left no evidence to seal"; exit 1; }
          tar -C "$out" -cf - "${files[@]}" | age -r "$RECIPIENT" -o "$RUNNER_TEMP/sealed/work.tar.age"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-work
          path: ${{ runner.temp }}/sealed/work.tar.age
          retention-days: 5
          if-no-files-found: error

  firewall:
    needs: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-work
          path: ${{ runner.temp }}/sealed

      - name: Grade every claim the agent made against its own tool output
        env:
          AGE_KEY: ${{ secrets.AGENT_TRANSCRIPT_AGE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AGE_KEY" ] || { echo "::error::AGENT_TRANSCRIPT_AGE_KEY is not set"; exit 1; }
          bash bin/agent-sandbox-age
          work="$RUNNER_TEMP/work"; mkdir -p "$work"
          printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
          age -d -i "$RUNNER_TEMP/key" "$RUNNER_TEMP/sealed/work.tar.age" | tar -C "$work" -xf - transcript.jsonl
          rm -f "$RUNNER_TEMP/key"
          # The verdict quotes the agent's own sentences, and this log is public: print the verdict
          # and the count, keep the sentences in the sealed artifact.
          rc=0; python3 bin/epistemic_firewall.py "$work/transcript.jsonl" > "$work/verdict" 2>&1 || rc=$?
          echo "firewall exit $rc: $(head -1 "$work/verdict" | cut -c1-40); refused claims: $(grep -c ' <- ' "$work/verdict" || true)"
          exit "$rc"

  submit-lane:
    needs: [admit, agent, firewall]
    # Label-triggered replay is restricted to the original founder-owned #8461
    # source run; admit, agent and firewall do not execute again.
    if: >-
      always() && (
        (needs.admit.result == 'success' && needs.agent.result == 'success' && needs.firewall.result == 'success') ||
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
         github.event.label.name == 'P0' &&
         github.actor == vars.ESTATE_FOUNDER_LOGIN &&
         github.event.issue.user.login == vars.ESTATE_FOUNDER_LOGIN &&
         github.event.issue.number == 8461)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read ONLY the original age-sealed job artifacts on replay
      issues: write # the claim: an issue and its CLAIM comment (bin/claim-gate reads both)
    steps:
      - name: Verify original #8461 agent and firewall before sealed replay
        if: github.event_name == 'issues' && github.event.label.name == 'P0'
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDER: ${{ vars.ESTATE_FOUNDER_LOGIN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45106948958" |
            jq -e --arg founder "$FOUNDER" '
              .event == "issues" and
              .path == ".github/workflows/agent-sandbox.yml" and
              .actor.login == $founder and
              (.display_title | contains("#8461"))
            '
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45106948958/jobs?per_page=100" |
            jq -e '
              ([.jobs[] | select(.name == "admit" or .name == "agent" or .name == "firewall") |
                select(.conclusion == "success")] | length) == 3
            '
      - name: Decode the App key
        id: pem
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          [ -n "$PEM_B64" ] || { echo "::error::SEED_GITHUB_APP_PEM_B64 is not set"; exit 1; }
          pem=$(printf %s "$PEM_B64" | base64 -d)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo "key<<PEM_EOF"; printf '%s\n' "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
          # Sealed agent patch is relative to its original base, not HEAD at submission.
          fetch-depth: 0

      # The original scope record and sealed patch are read from the successful
      # upstream jobs; no new model or alternate submission principal is invoked.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'issues' && github.event.label.name == 'P0'
        with:
          name: legion-admission
          path: ${{ runner.temp }}/admission
          run-id: 45106948958
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-work
          path: ${{ runner.temp }}/sealed
          run-id: ${{ github.event.label.name == 'P0' && 45106948958 || github.run_id }}
          github-token: ${{ github.token }}

      - name: Apply the patch to main, refusing what an agent may not change
        env:
          AGE_KEY: ${{ secrets.AGENT_TRANSCRIPT_AGE_KEY }}
          SCOPE_JSON: ${{ needs.admit.outputs.scope_json }}
          SCOPE_SHA256: ${{ needs.admit.outputs.scope_sha256 }}
          REPLAY: ${{ github.event.label.name == 'P0' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash bin/agent-sandbox-age
          work="$RUNNER_TEMP/work"; mkdir -p "$work"
          printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/key"; chmod 600 "$RUNNER_TEMP/key"
          age -d -i "$RUNNER_TEMP/key" "$RUNNER_TEMP/sealed/work.tar.age" | tar -C "$work" -xf - patch base
          rm -f "$RUNNER_TEMP/key"
          [ -s "$work/patch" ] || { echo "::error::the agent changed nothing; there is no PR to open"; exit 1; }
          # Trust the original SHA recorded by the agent job only after validating
          # ancestry against current main. The agent's work must not disappear when
          # another lane advances main while the model is working.
          # The Greenlane, not this stage, rebases and independently proves promotion.
          if [ "${REPLAY:-0}" = 1 ]; then
            SCOPE_JSON="$(cat "$RUNNER_TEMP/admission/scope.json")"
            SCOPE_SHA256="$(sha256sum "$RUNNER_TEMP/admission/scope.json" | cut -d' ' -f1)"
          fi
          : "${SCOPE_JSON:?trusted scope required}" "${SCOPE_SHA256:?trusted digest required}"
          printf %s "$SCOPE_JSON" > "$work/scope.json"
          python3 bin/idp-agent-base-apply.py --base-file "$work/base" --patch "$work/patch" --scope-file "$work/scope.json" --scope-sha256 "$SCOPE_SHA256"
          # Read back what the index now holds, both sides of every rename included, rather than
          # parse the patch text.
          refused=$(git diff --cached --name-only --no-renames HEAD | grep -E '^(\.github|\.githooks)/' || true)
          if [ -n "$refused" ]; then
            echo "::error::an agent patch may not change CI or hooks:"; echo "$refused"; exit 1
          fi

      # Match ci.yml and fast-gate.yml: the hook invokes python3, not the pip
      # executable found on an otherwise unconfigured ubuntu runner.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }

      # The applicator checks out the historical agent base. Install the exact
      # kubeconform pin in runner HOME, which survives that checkout.
      - name: Restore pinned kubeconform to cloud submission runner
        run: |
          set -euo pipefail
          tools="$HOME/.cache/estate-tools"; mkdir -p "$tools"
          curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/kubeconform.tar.gz"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$tools" kubeconform
          chmod 0755 "$tools/kubeconform"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Install and execute the exact estate push-readiness dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -q ruff==0.15.18 yamllint==1.37.1 pytest==8.4.2 pydantic==2.12.4
          sudo apt-get install -y -qq shellcheck
          command -v kubeconform
          python3 -c 'import pydantic; assert pydantic.__version__ == "2.12.4"'
          # Refuse before claim/commit when the hook's interpreter is incomplete.
          python3 -m pytest --version
          bin/idp-production-readiness

      - name: Claim the work on an issue
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ github.event_name == 'issues' && (github.event.label.name == 'claude-native' && 'claude-code' || 'auto') || inputs.harness }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
          ISSUE: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          agent="$HARNESS"
          # Every path the change touches, both sides of a rename: bin/claim-gate refuses a file
          # outside the claim's paths=, and a rename touches two.
          paths=$(git diff --cached --name-only --no-renames HEAD | paste -sd, -)
          [ -n "$paths" ] || { echo "::error::nothing staged to claim"; exit 1; }
          num="$ISSUE"
          if [ -z "$num" ]; then
            title="agent-sandbox (${HARNESS}): $(printf '%s' "$TASK" | head -1 | cut -c1-80)"
            url=$(gh issue create --title "$title" --body "Opened by agent-sandbox to claim this run's work. Run: ${RUN_URL}")
            num="${url##*/}"
          fi
          hb=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh issue comment "$num" --body "CLAIM agent=${agent} paths=${paths} heartbeat=${hb}"
          { echo "num=$num"; echo "agent=$agent"; } >> "$GITHUB_OUTPUT"

      - name: Commit through the estate's own hooks and push the lane
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ github.event_name == 'issues' && (github.event.label.name == 'claude-native' && 'claude-code' || 'auto') || inputs.harness }}
          TASK: ${{ github.event_name == 'issues' && format('{0} -- {1}', github.event.issue.title, github.event.issue.body) || inputs.task }}
          NUM: ${{ steps.claim.outputs.num }}
          AGENT: ${{ steps.claim.outputs.agent }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="lane/agent-${HARNESS}-${GITHUB_RUN_ID}"
          git config user.name "estate-agent-sandbox"
          git config user.email "estate-agent-sandbox@users.noreply.github.com"
          git config core.hooksPath .githooks
          git checkout -q -b "$branch"
          subject="agent-sandbox (${HARNESS}): $(printf '%s' "$TASK" | head -1 | cut -c1-72)"
          printf '%s\n\nRun: %s\n\nClaim: #%s\nAgent: %s\n' "$subject" "$RUN_URL" "$NUM" "$AGENT" > "$RUNNER_TEMP/msg"
          git commit -q -F "$RUNNER_TEMP/msg"
          git log -1 --format=%B | grep -q '^X-Idp-Signed: ' || { echo "::error::the commit-msg hook did not stamp the commit"; exit 1; }
          git push -q origin "$branch"
          gh issue comment "$NUM" --body "Submitted \`${branch}\` (harness ${HARNESS}). The Greenlane lands it when it is green. Run: ${RUN_URL}"
          echo "submitted $branch for claim #$NUM"
