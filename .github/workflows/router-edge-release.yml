# Existing Greenlane owns source admission. This only deploys an exact landed main commit.
name: router-edge-release
on:
  push:
    branches: [main]
    paths:
      - "platform/router-edge/**"
      - ".github/workflows/router-edge-release.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: zone-b-router-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    # Zone B edge is a production deploy: waits on exactly one founder approval tap.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Exact tools and zero-secret preflight
        working-directory: platform/router-edge
        run: |
          set -euo pipefail
          # No package-lock yet: use the repo's esbuild pin; override Wrangler only for versioned releases.
          npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.131.0
          ./node_modules/.bin/wrangler --version | grep -Eq '(^|[^[:digit:]])4\.131\.0([^[:digit:]]|$)'
          npm test
          node --test tests/release.falsifier.mjs
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/router-preflight.sha"
      - name: Mint the ephemeral Workers token (R52 - one root, code mints the rest)
        id: mint
        env:
          ROOT: ${{ secrets.SEED_CLOUDFLARE_ROOT_TOKEN }}
          ACCOUNT: ${{ secrets.SEED_R2_ACCOUNT_ID }}
          ZONE_NAME: meridianlabs.cloud
        run: |
          set -euo pipefail
          API=https://api.cloudflare.com/client/v4
          cf() { curl -sS -H "Authorization: Bearer $1" -H 'Content-Type: application/json' "${@:2}"; }
          groups=$(cf "$ROOT" "$API/user/tokens/permission_groups")
          gid() { jq -r --arg n "$1" --arg s "$2" '.result[] | select(.name==$n and (.scopes|index($s))) | .id' <<<"$groups" | head -1; }
          WS=$(gid "Workers Scripts Write" com.cloudflare.api.account)
          WR=$(gid "Workers Routes Write" com.cloudflare.api.account.zone)
          ZREAD=$(gid "Zone Read" com.cloudflare.api.account.zone.read) || true
          [ -n "$ZREAD" ] || ZREAD=$(jq -r '.result[] | select((.scopes|index("com.cloudflare.api.account.zone.read")) or (.name|test("Zone Read";"i"))) | .id' <<<"$groups" | head -1)
          [ -n "$WS" ] && [ -n "$WR" ] && [ -n "$ZREAD" ] || { echo "FAIL    cloudflare  missing permission group(s):"; jq -r '.result[] | select((.name|test("Workers")) or (.name|test("Zone";"i"))) | "        " + .name + "  " + (.scopes|join(","))' <<<"$groups"; exit 1; }
          # The root is pinned to a zone set that predates the meridianlabs.cloud cutover (measured
          # 2026-11-18, run 44183564083): resolve the zone through a zone-read child, then delete it.
          probe=$(cf "$ROOT" -X POST -d "$(jq -nc --arg n "router-edge-release zone-read $GITHUB_RUN_ID" --arg g "$ZREAD" '{name:$n,policies:[{effect:"allow",resources:{"com.cloudflare.api.account.zone.*":"*"},permission_groups:[{id:$g}]}]}')" "$API/user/tokens")
          jq -e '.success' <<<"$probe" >/dev/null || { echo "FAIL    cloudflare  zone-read child refused:"; jq -c '.errors' <<<"$probe"; exit 1; }
          probe_id=$(jq -r .result.id <<<"$probe"); probe_value=$(jq -r .result.value <<<"$probe")
          echo "::add-mask::$probe_value"
          zone=$(cf "$probe_value" "$API/zones?name=$ZONE_NAME" | jq -r '.result[0] // empty')
          cf "$ROOT" -X DELETE "$API/user/tokens/$probe_id" >/dev/null
          [ -n "$zone" ] || { echo "FAIL    cloudflare  $ZONE_NAME is not a zone of the account this root can reach"; exit 1; }
          zid=$(jq -r .id <<<"$zone")
          expires=$(date -u -d '+2 hours' +%FT%TZ)
          body=$(jq -nc --arg n "router-edge-release $GITHUB_RUN_ID" --arg a "$ACCOUNT" --arg z "$zid" --arg ws "$WS" --arg wr "$WR" --arg zr "$ZREAD" --arg e "$expires" \
            '{name:$n, expires_on:$e, policies:[
               {effect:"allow", resources:{("com.cloudflare.api.account."+$a):"*"}, permission_groups:[{id:$ws}]},
               {effect:"allow", resources:{("com.cloudflare.api.account.zone."+$z):"*"}, permission_groups:[{id:$zr},{id:$wr}]}]}')
          out=$(cf "$ROOT" -X POST -d "$body" "$API/user/tokens")
          jq -e '.success' <<<"$out" >/dev/null || { echo "FAIL    cloudflare  Workers token mint refused:"; jq -c '.errors' <<<"$out"; exit 1; }
          value=$(jq -r .result.value <<<"$out")
          echo "::add-mask::$value"
          echo "token=$value" >> "$GITHUB_OUTPUT"
          echo "ok      cloudflare  Workers token minted (Scripts@account + ZoneRead/Routes@$ZONE_NAME), expires $expires"

      - name: Release with bounded probes and rollback
        working-directory: platform/router-edge
        env:
          GITHUB_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RECEIPT_PATH: ${{ runner.temp }}/router-release-receipt.json
          RELEASE_PREFLIGHT_FILE: ${{ runner.temp }}/router-preflight.sha
          MERIDIAN_ROUTER_URL: https://llm.meridianlabs.cloud
          CLOUDFLARE_API_TOKEN: ${{ steps.mint.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEED_R2_ACCOUNT_ID }}
          MERIDIAN_CLIENT_KEY: ${{ secrets.SEED_MERIDIAN_CLIENT_KEY }}
          MERIDIAN_ADMIN_KEY: ${{ secrets.SEED_MERIDIAN_ADMIN_KEY }}
        run: node scripts/release.mjs
      - name: Preserve exact-SHA release receipt even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5.0.1
        with:
          name: router-edge-release-${{ github.sha }}
          path: ${{ runner.temp }}/router-release-receipt.json
          if-no-files-found: warn
          retention-days: 30
