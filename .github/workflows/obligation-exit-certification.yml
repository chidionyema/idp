name: Obligation exit boundary certification
on:
  push:
    branches: [research/8415-obligation-exit-boundary-20261126]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: a4195a2294c3a7f45bb9e1ba480a70b3f20fe6a2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install -q ruff==0.15.18 pyyaml yamllint==1.37.1 pytest==8.4.2 -r sovereign/requirements.txt
      - uses: ./.github/actions/estate-tools
      - name: Real hooks and independent process-exit canary
        run: |
          set -euo pipefail
          source="$GITHUB_SHA"
          git checkout -b obligation-exit-boundary "$BASE"
          git config core.hooksPath .githooks
          git config user.name "Meridian Unit 0 cloud recovery"
          git config user.email "meridian-unit0@users.noreply.github.com"
          git checkout "$source" -- platform/estate/continuity/accept_txn.py platform/estate/continuity/checkpoints.py platform/estate/continuity/recovery.py platform/estate/continuity/canary_stage2.py tests/estate/test_continuity_conserved_objective.py
          git commit -m "fix(continuity): conserve instruction and fence every unsettled worker exit" -m "Claim: #8415
          Agent: meridian-obligation-custody"
          python3 -m pytest -q tests/test_continuity_operating_receipt.py tests/test_continuity_retry_budget.py tests/estate/test_continuity_conserved_objective.py
          python3 platform/estate/continuity/canary.py
          IDP_CI_FAST=1 IDP_CI_BASE="$BASE" bin/idp-ci
          git bundle create "$RUNNER_TEMP/candidate.bundle" obligation-exit-boundary "^$BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exact-obligation-exit-candidate
          path: ${{ runner.temp }}/candidate.bundle
          retention-days: 1
          if-no-files-found: error
  custody:
    needs: prove
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
    env:
      BASE: a4195a2294c3a7f45bb9e1ba480a70b3f20fe6a2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a4195a2294c3a7f45bb9e1ba480a70b3f20fe6a2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: exact-obligation-exit-candidate
          path: ${{ runner.temp }}/bundle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: pip install -q ruff==0.15.18
      - name: Verify exact ordinary source before publishing quarantine ref
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/bundle/candidate.bundle" refs/heads/obligation-exit-boundary:refs/heads/obligation-exit-boundary
          tip=$(git rev-parse refs/heads/obligation-exit-boundary)
          test "$(git rev-parse "$tip^")" = "$BASE"
          want=$(printf '%s\n' platform/estate/continuity/accept_txn.py platform/estate/continuity/checkpoints.py platform/estate/continuity/recovery.py platform/estate/continuity/canary_stage2.py tests/estate/test_continuity_conserved_objective.py | sort)
          actual=$(git diff --name-only "$BASE" "$tip" | grep -v '^catalog/estate-capability-registry.json$')
          test "$actual" = "$want"
          # Recreate the candidate formatting independently from trusted base config.
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"
            git show "$GITHUB_SHA:$file" > "$file"
          done <<< "$want"
          ruff check --fix $(printf '%s\n' "$want")
          ruff format $(printf '%s\n' "$want")
          while IFS= read -r file; do
            git show "$tip:$file" | cmp - "$file"
          done <<< "$want"
          git reset --hard "$BASE"
          git clean -f -- tests/estate/test_continuity_conserved_objective.py
          git show -s --format=%B "$tip" | grep -q '^X-Idp-Signed: '
          bin/claim-gate "$BASE" "$tip"
          ref=refs/heads/quarantine/8415-obligation-exit-boundary-20261126
          test -z "$(git ls-remote origin "$ref")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" push origin "$tip:$ref"
          echo "CERTIFIED_UNIT_SHA=$tip"
