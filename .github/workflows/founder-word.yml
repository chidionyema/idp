# crew#227 CP5: the founder's `APPROVE: <word>` / `DENY: <word>` comment on a pull request re-judges
# that PR's operating-model gate. Its own workflow so a comment never starts the build matrix in ci.yml.
name: founder-word
on:
  issue_comment:
    types: [created]
# actions: write is what `gh run rerun` needs, pull-requests: write is what the gate needs to post its
# comment. A caller must grant at least what the called workflow asks for, or the run fails at startup
# with no job and no log (2026-08-27, six runs in a row; crew#473).
permissions:
  contents: read
  pull-requests: write
  actions: write
jobs:
  gate:
    uses: ./.github/workflows/operating-model-gate.yml
    permissions: { contents: read, pull-requests: write, actions: write }
    secrets: inherit
