# crew#227 CP5: the founder's `APPROVE: <word>` / `DENY: <word>` comment on a pull request re-judges
# that PR's operating-model gate. Its own workflow so a comment never starts the build matrix in ci.yml.
name: founder-word
on:
  issue_comment:
    types: [created]
# actions: write is what `gh run rerun` needs; a called workflow can only narrow what the caller grants.
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  gate:
    uses: ./.github/workflows/operating-model-gate.yml
    permissions: { contents: read, pull-requests: read, actions: write }
    secrets: inherit
