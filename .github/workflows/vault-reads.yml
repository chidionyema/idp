# crew#584, founder 2026-08-29: the vault audit is monitoring, not a pull-request grade. It used to be
# the vault-reads row of bin/idp-oke-rebuild --check, where a 90-minute OCI audit query (427 s, run
# 33237964214) blocked every platform pull request. Now it runs on its own clock, never on
# pull_request, and its only outputs are a receipt line and a P1 issue: red opens or updates
# `P1: external-secrets is not reading the vault`, green closes it with the run as the receipt.
# Same machine identity as oke-check (GitHub OIDC -> OCI session token); no key on a laptop.
name: vault-reads
on:
  schedule:
    - cron: "41 * * * *"   # hourly: external-secrets refreshInterval is 1h, the audit window 90 min
  workflow_dispatch:
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
  issues: write     # the P1 it opens and closes
concurrency: { group: vault-reads, cancel-in-progress: false }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-vault-reads
        id: audit
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          set +e; out=$(bin/idp-vault-reads); rc=$?; set -e
          echo "$out"
          echo "row=$out" >> "$GITHUB_OUTPUT"
          exit "$rc"
      # A red audit opens the P1 once and comments on it after that; a blind one (exit 2) is a P1 too,
      # because an instrument that cannot see is not green (memory: silent-green-is-the-defect-class).
      - name: a red or blind audit opens or updates the P1
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ROW: ${{ steps.audit.outputs.row }}
        run: |
          body=$(printf '%s\nrun: %s/%s/actions/runs/%s\nfix: bin/idp-vault-reads header; ClusterSecretStore estate-vault' "${ROW:-vault-reads produced no row}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          n=$(gh issue list --state open --search 'in:title "P1: external-secrets is not reading the vault"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh label create P1 --color D93F0B --description "platform layer degraded" --force >/dev/null; gh issue create --title "P1: external-secrets is not reading the vault" --label P1 --body "$body"; fi
      - name: a green audit closes the open P1, with the run as the receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search 'in:title "P1: external-secrets is not reading the vault"' --json number -q '.[0].number')
          [ -z "$n" ] && exit 0
          gh issue close "$n" --reason completed --comment "$(printf 'green: %s\nrun: %s/%s/actions/runs/%s' "${{ steps.audit.outputs.row }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
