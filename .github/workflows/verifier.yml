# Deterministic Verifier — three-stage gauntlet (structural / symbolic / execution).
#
# WHY THIS EXISTS. The pre-push hook calls the same gauntlet through the estate-mcp
# daemon (propose_patch → verify), which requires the daemon running locally. When the
# daemon is unavailable the hook is BLIND, not FAIL — CI is then the real gate.
# This job calls bin/idp-ci-verify, which calls sovereign/verifier.py directly (no
# daemon, no Datasette, no estate.db), so the three-stage verdict lands in CI on every PR.
#
# WHAT IT GRADES. The unified diff of the PR branch against origin/main — the same
# bytes bin/idp-prepush-verify would propose to the daemon on a local push.
#
# BLIND and FAIL are the same verdict here: an unproven diff does not pass. There is
# no bot exemption (agents are the reason this gate exists, not an exception to it) and
# no empty-diff free pass (an empty diff against origin/main is a PR with no merge base,
# which is itself the anomaly). Exit 1 and exit 2 both fail the job closed.
#
# No sigstore fast-path yet: the verifier's sign/verify code is real, but a fast-path
# needs a repo-committed public key and cosign on the runner. Until both exist, every
# PR pays the three stages. See docs/specs/2026-09-22-cryptographic-ci-gateway.md §4.
name: verifier
on:
  workflow_call:
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sovereign/requirements*.txt

      - name: install verifier deps
        run: |
          pip install -q \
            cryptography>=42 \
            z3-solver \
            pytest \
            pyyaml

      - name: run verifier gauntlet
        run: |
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          diff_out=$(git diff "$base"...HEAD)
          if [ -z "$diff_out" ]; then
            echo "BLIND verifier: empty diff — no merge base, refusing to pass unproven"
            exit 1
          fi
          if ! echo "$diff_out" | python3 bin/idp-ci-verify; then
            rc=$?
            echo "verifier verdict: FAIL (exit $rc) — an unproven diff does not pass"
            exit "$rc"
          fi
