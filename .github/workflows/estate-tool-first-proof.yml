# Exact-blob, no-secret proof of the current Legion and yield candidates only.
# A proof branch is not a release branch, reviewer receipt, or admission authority.
name: estate-tool-first-proof
on:
  push:
    branches:
      - proof/estate-legion-yield-20261108
permissions:
  contents: read
jobs:
  existing-tooling-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install isolated test-only dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest==8.4.2 PyYAML==6.0.3
      - name: Exercise actual Legion workflow and institutional memory
        run: python -m pytest -q tests/test_agent_sandbox_workflow.py tests/test_legion_failure_atlas.py
      - name: Exercise commit-bound yield evidence and negative controls
        run: python -m pytest -q tests/test_idp_yield_gate.py
