# Temporary, credential-free source verification only. Never merge into main.
name: temporary-web-fleet-v1-proof
on:
  push:
    branches: ["tmp/web-fleet-v1-test-8430"]
permissions:
  contents: read
jobs:
  node22-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify canonical single-wire source
        run: |
          set -euo pipefail
          node --version
          node --check platform/lifeboat/src/task-packet.js
          node --test platform/lifeboat/test/task-packet.test.mjs
