# crew#516 CP3 slice 2: the catalogue render runs off the Mac.
#
# Until 2026-08-27 bin/catalog-render ran only as com.estate.catalog-render on the founder's Mac,
# because its one input, ~/.estate/state/inventory.json, lived there. estate#9 made the inventory
# job publish that file to the estate bucket at state/inventory/latest.json, read back. This
# workflow is the reader: it takes the object, checks out crew beside idp (estate-showcase reads
# crew/docs/STANDARDS.md through ESTATE_CODE), and runs the same bin/catalog-render.
#
# It starts in --dry-run: the diff it would commit is the receipt, in the job summary, so the
# cloud render is measured against the Mac render before the Mac row is retired (LAW 17). The
# inputs the Mac still owns are reported BLIND by the tools themselves, never faked: the estate
# feed (estate-next), ~/.estate/env (catalog-gen falls back to dev). Flip: `mode: commit` on
# dispatch runs the real render, which opens the auto-merge PR the Mac row opens today.
# Mode: commit also publishes estate.db (bin/idp-estate-db-push) for the cluster's estate-mcp
# (crew#458 row 3).
#
# Secrets: the bucket keys are the SEED_R2_* repo secrets the vault seed already carries; they
# reach rclone as RCLONE_S3_* environment, never argv.
name: catalog-render
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (diff in the summary) or commit (push the branch, open the PR)"
        default: dry-run
        type: choice
        options: [dry-run, commit]
  schedule:
    # 45 minutes after each com.estate.inventory tick (scheduler/schedule.yml: 13 1,7,13,19).
    - cron: "58 1,7,13,19 * * *"
permissions:
  contents: write
  pull-requests: write
  packages: write   # bin/idp-catalog-push pushes the catalogue artifact to ghcr with GITHUB_TOKEN
concurrency: { group: catalog-render, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, path: idp }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: chidionyema/crew, path: crew }   # a sibling of idp/, inside the workspace: checkout refuses any path above it
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: tools
        run: |
          pip install -q pyyaml
          sudo apt-get install -y -qq rclone >/dev/null
      - uses: fluxcd/flux2/action@ed8c5f2c24d57715d08423d3c1a7b0554ceb030e # v2.9.4 -- idp-catalog-push needs the flux CLI (run 33099170685: "BLIND flux missing")
      - name: inventory from the bucket (estate#9 writes it; the `at` field is the receipt)
        env:
          RCLONE_CONFIG: /dev/null
          RCLONE_S3_PROVIDER: Other
          RCLONE_S3_REGION: auto
          RCLONE_S3_FORCE_PATH_STYLE: "true"
          RCLONE_S3_ENDPOINT: https://${{ secrets.SEED_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.SEED_R2_ACCESS_KEY_ID }}
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.SEED_R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ secrets.SEED_R2_BUCKET || 'prospector-packs' }}
        run: |
          set -euo pipefail
          rclone copyto ":s3:$BUCKET/state/inventory/latest.json" "$RUNNER_TEMP/inventory.json" --s3-no-check-bucket
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("inventory taken", d.get("at"), "assets", len(d.get("rows",[])))' "$RUNNER_TEMP/inventory.json" | tee -a "$GITHUB_STEP_SUMMARY"
          # the session feed (estate#10 publishes it beside the inventory); absent = estate-next says BLIND itself
          # rclone copyto exits 0 for an absent object (run 33102084969 said "feed taken" with no file): the file is the receipt
          rclone copyto ":s3:$BUCKET/state/feed/latest.md" "$RUNNER_TEMP/feed.md" --s3-no-check-bucket 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/feed.md" ]; then
            echo "feed taken, last handoff $(grep -E '^## ' "$RUNNER_TEMP/feed.md" | tail -1 | cut -c4-40)" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "feed: not in the bucket yet (state/feed/latest.md), NEXT.md renders BLIND" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: render
        working-directory: idp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INV: ${{ runner.temp }}/inventory.json
          ESTATE_FEED: ${{ runner.temp }}/feed.md
          IDP_STATE_WORKTREE: ${{ runner.temp }}/idp-state
          ESTATE_CODE: ${{ github.workspace }}
          ESTATE_ENV: dev
          MODE: ${{ inputs.mode || 'dry-run' }}
        run: |
          set -uo pipefail
          git config user.name "estate-catalog-render"
          git config user.email "estate-catalog-render@users.noreply.github.com"
          flag=""; [ "$MODE" = dry-run ] && flag="--dry-run"
          python3 bin/catalog-render $flag 2>&1 | tee "$RUNNER_TEMP/render.log"; rc=${PIPESTATUS[0]}
          { echo; echo '```'; tail -60 "$RUNNER_TEMP/render.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: estate.db to the registry (crew#458 row 3; estate-mcp on the cluster pulls it)
        if: ${{ (inputs.mode || 'dry-run') == 'commit' }}
        working-directory: idp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INV: ${{ runner.temp }}/inventory.json
          CATALOG: ${{ runner.temp }}/idp-state/catalog/catalog-info.yaml
          ESTATE_CODE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pip install -q sqlite-utils
          SU="$(command -v sqlite-utils)" bin/idp-estate-db-push | tee -a "$GITHUB_STEP_SUMMARY"
