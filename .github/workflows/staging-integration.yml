name: staging-integration

# One disposable, credential-free cloud environment per pushed SHA.
# Gate is independent of the full Greenlane queue build and never self-promotes.
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-integration-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-integration:
    name: Cloud staging integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.2' 'PyYAML==6.0.3'
      - name: Exercise actual worker patch, gate and receipt boundaries
        id: integration
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_2026_11_11_agent_base_apply.py \
            tests/integration/test_verification_gates.py
      - name: Publish exact-source machine-readable stage receipt
        if: always()
        env:
          RESULT: ${{ steps.integration.outcome }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          result = os.getenv("RESULT") or "skipped"
          receipt = {
            "schema": "estate.staging-integration.v1",
            "environment": "github-hosted-ubuntu-24.04-isolated",
            "repository": os.environ["REPOSITORY"],
            "source_sha": os.environ["SHA"],
            "run_url": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
            "integration_status": result,
            "integration_verified": result == "success",
            "production_effect_verified": False,
          }
          with open("staging-integration-receipt.json", "w") as stream:
            json.dump(receipt, stream, sort_keys=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
            stream.write(f"Cloud staging integration: {result.upper()} at {receipt['source_sha']}\\n")
            stream.write(f"Run: {receipt['run_url']}\\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: staging-integration-${{ github.run_id }}
          path: staging-integration-receipt.json
          retention-days: 14
          if-no-files-found: error
