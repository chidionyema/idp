# `@conscience <question>` on any issue or pull request (crew#586 CP4). The founder asks in
# the thread; the answer comes back in the thread, grounded in the tenet rows and, on a PR,
# the diff. The model is one lane of the estate's own router (platform/llm, LAW 34: no vendor
# named here), reached the way hermes-v2 reaches it (SEED_HERMES_LITELLM_API_KEY). Same
# trigger shape as founder-word.yml: only the repository owner's comment fires it, so a
# stranger's comment can never spend a token or steer the answer.
name: conscience-ask
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  answer:
    if: github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '@conscience')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: answer in the thread
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          QUESTION: ${{ github.event.comment.body }}
          LITELLM_API_KEY: ${{ secrets.SEED_HERMES_LITELLM_API_KEY }}
          CONSCIENCE_MODEL: deepseek   # a lane name in platform/llm/config.yaml, never a vendor model id
        run: |
          set -uo pipefail
          zone=$(awk '$1=="ESTATE_ZONE:"{print $2}' clusters/oke/estate-config.yaml); test -n "$zone"
          diff=""; [ "$IS_PR" = "true" ] && diff=$(gh pr diff "$NUMBER" | head -400)
          DIFF="$diff" python3 - "$zone" <<'PY' > answer.md
          import json, os, sys, urllib.request
          zone = sys.argv[1]
          tenets = open("conscience/tenets.yaml").read()
          rules = open("policy/conscience.rego").read()
          system = ("You are the Conscience of this estate: the founder's ethos, answering in the thread. "
                    "Ground every answer in the tenet rows below and name the tenet you are applying. "
                    "Prefer the mature tool over a script, portability over lock-in, the measured number over prose. "
                    "Be concrete and short: the one answer, its risk in a sentence, the command or file that proves it. "
                    "Plain English, no jargon, under 200 words.\n\n# tenets\n" + tenets + "\n# PR rules\n" + rules)
          user = os.environ["QUESTION"].replace("@conscience", "", 1).strip()
          diff = os.environ.get("DIFF", "")
          if diff:
              user += "\n\n# the pull request diff (first 400 lines)\n" + diff
          req = urllib.request.Request(
              f"https://llm.{zone}/v1/chat/completions",
              data=json.dumps({"model": os.environ["CONSCIENCE_MODEL"], "temperature": 0.2,
                               "messages": [{"role": "system", "content": system}, {"role": "user", "content": user}]}).encode(),
              headers={"Authorization": "Bearer " + os.environ["LITELLM_API_KEY"], "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=120) as r:
              print(json.load(r)["choices"][0]["message"]["content"].strip())
          PY
          printf '🧠 %s\n\n_conscience-ask, lane `%s` of the estate router; tenets: conscience/tenets.yaml_\n' "$(cat answer.md)" "$CONSCIENCE_MODEL" > reply.md
          gh issue comment "$NUMBER" --body-file reply.md >/dev/null && echo "answered on #$NUMBER"
