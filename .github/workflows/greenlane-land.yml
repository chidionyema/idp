# One-shot: land lane/fix/greenlane-pagination-v4 using the lane's engine code.
# Runs once, then should be deleted. Uses a separate concurrency key so it does not
# conflict with the main greenlane workflow.
name: greenlane-land
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Lane branch to land
        required: true
        type: string
concurrency:
  group: greenlane-land-${{ inputs.lane }}
  cancel-in-progress: true
jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the LANE so the engine uses the lane's code (pagination fix)
          ref: ${{ inputs.lane }}
          fetch-depth: 0
          persist-credentials: false
      - id: app
        uses: ./.github/actions/github-app-token
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oci_compartment: ${{ secrets.OCI_COMPARTMENT_OCID }}
      - name: land the lane
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GREENLANE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GREENLANE_STATUS_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: estate-agents[bot]
          GIT_AUTHOR_EMAIL: estate-agents[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: estate-agents[bot]
          GIT_COMMITTER_EMAIL: estate-agents[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          python3 bin/idp-greenlane tick
