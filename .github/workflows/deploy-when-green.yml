# button: Ship the portal and the shop
# founder: Merges the pull request that carries a new image tag once its checks are green and nothing but the tag changed.
# Ships the portal and the shop: merges the pull request that carries a new image tag to the
# cluster, once its checks are green and nothing but the tag has changed.

# The generator that builds the founder's button reads the comment block above this blank line
# and stops there (bin/idp-portal-buttons), so the sentence he reads on the portal is a sentence,
# and the reasoning below stays with the code where it belongs.
#
# The deploy lands itself. Nothing else in this repository does. (idp#1046)
#
# WHAT WAS BROKEN. Shipping here is a pull request: image-automation-controller writes the new tag
# onto flux/image-updates and image-update-pr.yml opens the pull request that carries it to main.
# Those pull requests merged themselves with GitHub's native auto-merge until `allow_auto_merge`
# was turned off on 2026-08-30, by hand, outside every file in this estate. The robots kept calling
# `gh pr merge --auto`, GitHub kept answering `enablePullRequestAutoMerge`, and the step exited 1 on
# a branch nobody reads. catalogue.mumchimp.com served main-2913-2ca4dd33 for thirteen hours while
# every merge to main built an image nothing pointed at, and every other light stayed green: ci
# grades the build, build-multiarch grades the image, and the login drill signs in to the portal --
# the old portal signs in fine.
#
# WHY IT MAY MERGE WITHOUT THE FOUNDER. His release rule stands: a change to platform content waits
# for his word. Founder, 2026-08-31, choosing between the two readings of it: shipping code he
# already approved when he merged it is not a second release. So this lands the tag bump and
# nothing else, and "nothing else" is proved, not assumed -- bin/idp-image-only-diff refuses a
# pull request carrying one line that is not an automation-owned `newTag:`.
#
# WHY NOT NATIVE AUTO-MERGE, EVEN IF IT WERE ON. crew answered this on 2026-08-23 in
# crew/.github/workflows/merge-when-green.yml: GitHub arms auto-merge only on a pull request
# currently BLOCKED by a required check, so an already-green one cannot be armed at all -- which is
# exactly the population that stalls. This mechanism is crew's, scoped to the deploy branch.
name: deploy-when-green

on:
  # The two moments a deploy becomes landable: image-update-pr has just opened or refreshed it, and
  # ci has just finished on it. workflow_run fires for a run on any event, so the deploy pull
  # request's own ci run is what usually wakes this.
  workflow_run:
    workflows: [ci, image-update-pr]
    types: [completed]
  # A backstop, not the mechanism. GitHub drops scheduled runs under load -- measured in this
  # estate, a */5 cron fired 10 times in 60 hours -- so nothing here depends on this firing; it
  # only catches a pull request that went green before this workflow existed, or one that became
  # mergeable because something else merged. The estate's own clock (the drill dispatcher) should
  # carry this row; that manifest lives under platform/ and needs the founder's word, so it is a
  # separate change rather than a reason to hold this one.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  id-token: write   # traded for the OCI session that reads the App key

concurrency:
  group: deploy-when-green
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # idp#769: a merge made with GITHUB_TOKEN starts no workflow on main, so main's own ci never
      # runs on the deploy commit and the estate's "main is green" signal goes quiet.
      - id: app
        uses: ./.github/actions/github-app-token
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oci_compartment: ${{ vars.OCI_COMPARTMENT_OCID }}
      - name: land the deploy if it is green, clean and nothing but a tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: flux/image-updates
        run: |
          set -euo pipefail
          # try_land <pr>: merge #pr only when the landable verdict is MERGE. The verdict now
          # carries the W3.3 fail-closed guard (bin/idp-pr-landable since #2751): a PR labelled
          # type:auto-remediation is MERGE only when a real green shadow-verify / proof-of-convergence
          # check sits in its rollup; a label without proof is SKIP. So calling this for an
          # auto-remediation PR is safe -- nothing merges unless a real shadow run proved it.
          try_land() {
            local pr="$1" why
            gh pr view "$pr" --json isDraft,mergeStateStatus,labels,statusCheckRollup > pr.json
            verdict=$(bin/idp-pr-landable pr.json)
            echo "$verdict"
            case "$verdict" in
              UPDATE*)
                gh api --method PUT "repos/$GH_REPO/pulls/$pr/update-branch" --input /dev/null \
                  && echo "ok      deploy-when-green  refreshed #$pr onto main; it lands next tick"
                ;;
              MERGE*)
                if gh pr merge "$pr" --squash; then
                  echo "ok      deploy-when-green  landed #$pr; flux applies it"
                else
                  echo "ok      deploy-when-green  #$pr went stale before the merge; next tick takes it"
                fi
                ;;
              *) echo "ok      deploy-when-green  #$pr is not landable yet" ;;
            esac
          }

          # Row 1 (unchanged): the automation-owned image tag bump on flux/image-updates.
          n=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            if bin/idp-image-only-diff --pr "$n"; then
              try_land "$n"
            else
              echo "ok      deploy-when-green  #$n is not a plain image bump; it waits for the founder"
            fi
          fi

          # Row 2 (W3.3): an admitted auto-remediation PR whose proof the #2751 guard already
          # forced to real (MERGE only iff a green shadow-verify check is present). No proof, no
          # auto-merge; anything else still waits for the founder through the same gate.
          rem=$(gh pr list --base main --state open --label "type: auto-remediation" \
                  --json number -q '.[].number')
          for r in ${rem:-}; do try_land "$r"; done

          test -n "$n$rem" || echo "ok      deploy-when-green  nothing to land on this tick"
