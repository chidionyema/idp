# crew#284 CP1/CP2, crew#248: the estate vault is written by the machine identity, never a laptop
# (crew#227 deleted the OCI API key; crew#247: infra is never Mac-bound). crew#66 root trust
# (5453747447, docs/policy/root-trust.md): an entry a bootstrapper births is never seeded from a
# pasted GitHub secret; this workflow now carries only github-app (the four keys bin/idp-github-app
# convert produces when no OCI session is live) and k8sgpt (a router key minted here, never pasted).
# Every other entry chosen by name is refused with the command that owns it. Values travel from the
# secret store to the runner's process to the vault and are never printed.
# Runs from the phone: gh workflow run vault-seed.yml -f entry=all
name: vault-seed
on:
  workflow_dispatch:
    inputs:
      entry:
        description: "which vault entry to write"
        type: choice
        options: [all, prospector-engine-env, github-app, flux-writer, temporal-db, mcp-gateway, hindsight, k8sgpt, tailscale-operator]
        default: all
      delete:
        description: "schedule deletion of one vault secret by name (crew#503: a mis-named entry); entry is ignored when set"
        type: string
        default: ""
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
concurrency: { group: oke-check, cancel-in-progress: false }   # shares the state bucket with oke-check
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: "1.12.6", tofu_wrapper: false }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-vault-put ${{ inputs.entry }}
        env:
          ENTRY: ${{ inputs.entry }}
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OKE_SSH_PUBKEY_TEXT: ${{ vars.OKE_SSH_PUBKEY }}
          OKE_ALLOWED_CIDRS: ${{ vars.OKE_ALLOWED_CIDRS }}
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}
          SEED_GITHUB_APP_ID: ${{ secrets.SEED_GITHUB_APP_ID }}
          SEED_GITHUB_APP_SLUG: ${{ secrets.SEED_GITHUB_APP_SLUG }}
          SEED_GITHUB_APP_CLIENT_ID: ${{ secrets.SEED_GITHUB_APP_CLIENT_ID }}
          SEED_GITHUB_APP_PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          bin/idp-oci-login --check
          (cd platform/oci && tofu init -input=false -reconfigure -no-color >/dev/null)
          # the operator env file bin/idp-vault-put expects, assembled from SEED_* in this process
          export ESTATE_ENV_FILE="$RUNNER_TEMP/seed.env"; umask 077
          env | sed -n 's/^SEED_//p' > "$ESTATE_ENV_FILE"
          put() { bin/idp-vault-put "$@"; }
          if [ -n "${{ inputs.delete }}" ]; then bin/idp-vault-put --delete "${{ inputs.delete }}"; exit; fi
          # crew#66 root trust (5453747447, docs/policy/root-trust.md): an entry a bootstrapper births is
          # never seeded from a pasted secret. Chosen by name it is refused with the command that owns it;
          # under `all` those entries are skipped, so `all` still writes what this workflow owns.
          #   tailscale-operator: born by bin/idp-bootstrap-tailscale, never seeded by hand (crew#576)
          #   flux-writer: retired; Flux authenticates as the App (bin/idp-github-app), no deploy key (crew#575)
          retired() {
            case "$1" in
              prospector-engine-env|temporal-db|hindsight|mcp-gateway|backstage-env|oauth2-proxy-cookie-secret|prospector-store-api-env)
                echo "bin/idp-estate-seed (estate keys), bin/idp-bootstrap-vendors (vendor keys), bin/idp-bootstrap-cloudflare (R2), bin/idp-github-app refresh (GitHub tokens)";;
              flux-writer) echo "bin/idp-github-app (Flux authenticates as the App; the deploy key is retired)";;
              tailscale-operator) echo "bin/idp-bootstrap-tailscale";;
              *) return 1;;
            esac
          }
          if owner=$(retired "$ENTRY"); then echo "FAIL    $ENTRY is born by $owner, never seeded by hand (crew#66 root trust)"; exit 1; fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = github-app ]; then
            # the four keys bin/idp-github-app convert writes; installation_id is added by the oke-check installation step
            put github-app app_id=GITHUB_APP_ID slug=GITHUB_APP_SLUG client_id=GITHUB_APP_CLIENT_ID pem_b64=GITHUB_APP_PEM_B64
          fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = k8sgpt ]; then
            # K8sGPT's LiteLLM virtual key, a router key never a vendor key (platform/healing/external-secret.yaml, crew#539 CP7).
            # Minted here from the vault's master key, never seeded by a person (LAW 27, R5).
            bin/idp-router-key k8sgpt minimax
          fi
          rm -f "$ESTATE_ENV_FILE"
