# button: Write or remove a vault entry
# founder: Writes one named entry into the vault under the machine identity, or schedules one for deletion.
# crew#284 CP1/CP2, crew#248: the estate vault is written by the machine identity, never a laptop
# (crew#227 deleted the OCI API key; crew#247: infra is never Mac-bound). crew#66 root trust
# (5453747447, docs/reference/policy/root-trust.md): an entry a bootstrapper births is never seeded from a
# pasted GitHub secret; this workflow now carries only github-app (the four keys bin/idp-github-app
# convert produces when no OCI session is live) and k8sgpt (a router key minted here, never pasted).
# Every other entry chosen by name is refused with the command that owns it. Values travel from the
# secret store to the runner's process to the vault and are never printed.
# Runs from the phone: gh workflow run vault-seed.yml -f entry=all
name: vault-seed
on:
  workflow_dispatch:
    inputs:
      entry:
        description: "which vault entry to write"
        type: choice
        options: [all, prospector-engine-env, github-app, flux-writer, temporal-db, mcp-gateway, hindsight, k8sgpt, holmes, tailscale-operator, laptop, hermes, science, router-rows]
        default: all
      delete:
        description: "schedule deletion of one vault entry by name (for a mis-named entry); the entry field is ignored when this is set"
        type: string
        default: ""
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
concurrency: { group: oke-check, cancel-in-progress: false }   # shares the state bucket with oke-check
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: "1.12.6", tofu_wrapper: false }
      - uses: nhedger/setup-sops@18e52f363488ed469d2e1855e542a1c651743bba # v3.0.0
        with: { version: "3.10.2" }
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-vault-put ${{ inputs.entry }}
        env:
          ENTRY: ${{ inputs.entry }}
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OKE_SSH_PUBKEY_TEXT: ${{ vars.OKE_SSH_PUBKEY }}
          OKE_ALLOWED_CIDRS: ${{ vars.OKE_ALLOWED_CIDRS }}
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}
          SEED_GITHUB_APP_ID: ${{ secrets.SEED_GITHUB_APP_ID }}
          SEED_GITHUB_APP_SLUG: ${{ secrets.SEED_GITHUB_APP_SLUG }}
          SEED_GITHUB_APP_CLIENT_ID: ${{ secrets.SEED_GITHUB_APP_CLIENT_ID }}
          SEED_GITHUB_APP_PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          bin/idp-oci-login --check
          (cd platform/oci && tofu init -input=false -reconfigure -no-color >/dev/null)
          # the operator env file bin/idp-vault-put expects, assembled from SEED_* in this process
          export ESTATE_ENV_FILE="$RUNNER_TEMP/seed.env"; umask 077
          env | sed -n 's/^SEED_//p' > "$ESTATE_ENV_FILE"
          put() { bin/idp-vault-put "$@"; }
          if [ -n "${{ inputs.delete }}" ]; then bin/idp-vault-put --delete "${{ inputs.delete }}"; exit; fi
          # crew#66 root trust (5453747447, docs/reference/policy/root-trust.md): an entry a bootstrapper births is
          # never seeded from a pasted secret. Chosen by name it is refused with the command that owns it;
          # under `all` those entries are skipped, so `all` still writes what this workflow owns.
          #   tailscale-operator: born by bin/idp-bootstrap-tailscale, never seeded by hand (crew#576)
          #   flux-writer: retired; Flux authenticates as the App (bin/idp-github-app), no deploy key (crew#575)
          retired() {
            case "$1" in
              prospector-engine-env|temporal-db|hindsight|mcp-gateway|backstage-env|oauth2-proxy-cookie-secret|prospector-store-api-env|estate-db)
                echo "bin/idp-estate-seed (estate keys), bin/idp-bootstrap-vendors (vendor keys), bin/idp-bootstrap-cloudflare (R2), bin/idp-github-app refresh (GitHub tokens)";;
              flux-writer) echo "bin/idp-github-app (Flux authenticates as the App; the deploy key is retired)";;
              tailscale-operator) echo "bin/idp-bootstrap-tailscale";;
              *) return 1;;
            esac
          }
          if owner=$(retired "$ENTRY"); then echo "FAIL    $ENTRY is born by $owner, never seeded by hand (crew#66 root trust)"; exit 1; fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = github-app ]; then
            # the four keys bin/idp-github-app convert writes; installation_id is added by the oke-check installation step
            put github-app app_id=GITHUB_APP_ID slug=GITHUB_APP_SLUG client_id=GITHUB_APP_CLIENT_ID pem_b64=GITHUB_APP_PEM_B64
          fi
          if [ "$ENTRY" = router-rows ]; then
            # The git lanes become console rows (founder 2026-09-03 "enable the thing": the console's
            # Update API Key form is greyed out on a row defined in config.yaml). Each lane is copied
            # into litellm-db with the vendor key the vault already holds, so the founder changes a
            # key in the console from then on. Not under `all`: it is a one-time move, and it is run
            # by the founder, never by an agent (R65). Idempotent: a lane the console owns is kept.
            bin/idp-router-rows-to-console --config platform/llm/config.yaml --zone-from clusters/oke/estate-config.yaml
          fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = k8sgpt ]; then
            # K8sGPT's LiteLLM virtual key, a router key never a vendor key (platform/healing/external-secret.yaml, crew#539 CP7).
            # Minted here from the vault's master key, never seeded by a person (LAW 27, R5).
            bin/idp-router-key k8sgpt minimax
          fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = holmes ]; then
            # HolmesGPT's own LiteLLM virtual key (platform/robusta/external-secret.yaml). Separate from
            # k8sgpt's on purpose: a key alias is the only thing that attributes router spend to a caller,
            # so the investigator and the smoke alarm must never share one.
            bin/idp-router-key holmes minimax
          fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = laptop ]; then
            # The founder's Mac (pi, every CLI, the consult path) calls the router with ONE virtual key
            # and holds no vendor key (crew#568, LAW 34). Minted here; delivered through the estate's
            # sops vault: sops encrypts to the age recipient estate-secrets/.sops.yaml names (the public
            # half), so this runner decrypts nothing, and the Mac reads it with scripts/secret-load.
            # The lanes are every model the router serves, asked of the router itself (@router), so a
            # lane the founder brings through the console -- kimi is one, and console-owned on purpose
            # (platform/vendors/consoles.yaml) -- is in his picker on the next seed run, instead of
            # being invisible because the generated config never named it (2026-09-04).
            bin/idp-router-key laptop @router
            tok=$(bin/idp-github-app token vault-writer); echo "::add-mask::$tok"
            git clone -q --depth 1 "https://x-access-token:${tok}@github.com/${GITHUB_REPOSITORY_OWNER}/estate-secrets" "$RUNNER_TEMP/estate-secrets"
            bin/idp-cloud secret get laptop | jq -r .key | SECRET_REPLACE=1 "$RUNNER_TEMP/estate-secrets/scripts/secret-add" dev LITELLM_LAPTOP_KEY LITELLM_API_KEY
            # `commit -am` never stages a NEW file: the first delivery of LITELLM_LAPTOP_KEY.yaml printed
            # "unchanged" and pushed nothing (run 33257838162). Add the file by name, then commit.
            git -C "$RUNNER_TEMP/estate-secrets" add secrets/dev/LITELLM_LAPTOP_KEY.yaml
            # Run 33258762617: the commit was made, estate-secrets' pre-push hook asked gh whether the repo is
            # still private, gh had no token, the hook refused, and `|| echo unchanged` turned that into a green
            # run. The hook gets the token so it can answer; a refused push is an error, never "unchanged".
            if git -C "$RUNNER_TEMP/estate-secrets" -c user.name=vault-seed -c user.email=vault-seed@users.noreply.github.com \
                 commit -q -m "laptop router key (vault-seed run $GITHUB_RUN_ID)" 2>/dev/null; then
              GH_TOKEN="$tok" git -C "$RUNNER_TEMP/estate-secrets" push -q origin HEAD || { echo "error   laptop key written but the push to estate-secrets was refused"; exit 1; }
              echo "ok      laptop key delivered to estate-secrets as LITELLM_LAPTOP_KEY"
            else
              echo "info    laptop key unchanged in estate-secrets"
            fi
            rm -rf "$RUNNER_TEMP/estate-secrets"
          fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = hermes ]; then
            # Hermes (the founder's Telegram agent, hermes-v2/config.yaml) calls the router on its own
            # virtual key, lane claude first, never a vendor key (crew#568 Phase 5, LAW 34). Same road as
            # the laptop: minted here, delivered through the sops vault, read by scripts/secret-load.
            bin/idp-router-key hermes default,fast,minimax,deepseek
            tok=$(bin/idp-github-app token vault-writer); echo "::add-mask::$tok"
            git clone -q --depth 1 "https://x-access-token:${tok}@github.com/${GITHUB_REPOSITORY_OWNER}/estate-secrets" "$RUNNER_TEMP/estate-secrets"
            bin/idp-cloud secret get hermes | jq -r .key | SECRET_REPLACE=1 "$RUNNER_TEMP/estate-secrets/scripts/secret-add" dev LITELLM_HERMES_KEY LITELLM_API_KEY
            # `commit -am` never stages a NEW file: the first delivery of LITELLM_HERMES_KEY.yaml printed
            # "unchanged" and pushed nothing (run 33257838162). Add the file by name, then commit.
            git -C "$RUNNER_TEMP/estate-secrets" add secrets/dev/LITELLM_HERMES_KEY.yaml
            # Run 33258762617: the commit was made, estate-secrets' pre-push hook asked gh whether the repo is
            # still private, gh had no token, the hook refused, and `|| echo unchanged` turned that into a green
            # run. The hook gets the token so it can answer; a refused push is an error, never "unchanged".
            if git -C "$RUNNER_TEMP/estate-secrets" -c user.name=vault-seed -c user.email=vault-seed@users.noreply.github.com \
                 commit -q -m "hermes router key (vault-seed run $GITHUB_RUN_ID)" 2>/dev/null; then
              GH_TOKEN="$tok" git -C "$RUNNER_TEMP/estate-secrets" push -q origin HEAD || { echo "error   hermes key written but the push to estate-secrets was refused"; exit 1; }
              echo "ok      hermes key delivered to estate-secrets as LITELLM_HERMES_KEY"
            else
              echo "info    hermes key unchanged in estate-secrets"
            fi
            rm -rf "$RUNNER_TEMP/estate-secrets"
          fi
          if [ "$ENTRY" = all ] || [ "$ENTRY" = science ]; then
            # The research worker (crew science/research_worker.py, crew#659 CP3) calls the router on its
            # own virtual key. The lanes ARE the edge the founder asked for on 2026-08-30 ("run them against
            # a frontier API rather than a local model"): claude and gemini for the worker and the grader,
            # embed for ranking what it scraped; a local or small lane is not on the key, so no env var can
            # reach one. Same road as the laptop: minted here, delivered through the sops vault.
            bin/idp-router-key science default,fast,gemini,gemini-or,minimax,minimax_m27,embed
            tok=$(bin/idp-github-app token vault-writer); echo "::add-mask::$tok"
            git clone -q --depth 1 "https://x-access-token:${tok}@github.com/${GITHUB_REPOSITORY_OWNER}/estate-secrets" "$RUNNER_TEMP/estate-secrets"
            bin/idp-cloud secret get science | jq -r .key | SECRET_REPLACE=1 "$RUNNER_TEMP/estate-secrets/scripts/secret-add" dev LITELLM_SCIENCE_KEY LITELLM_API_KEY
            # `commit -am` never stages a NEW file: the first delivery of LITELLM_SCIENCE_KEY.yaml printed
            # "unchanged" and pushed nothing (run 33257838162). Add the file by name, then commit.
            git -C "$RUNNER_TEMP/estate-secrets" add secrets/dev/LITELLM_SCIENCE_KEY.yaml
            # Run 33258762617: the commit was made, estate-secrets' pre-push hook asked gh whether the repo is
            # still private, gh had no token, the hook refused, and `|| echo unchanged` turned that into a green
            # run. The hook gets the token so it can answer; a refused push is an error, never "unchanged".
            if git -C "$RUNNER_TEMP/estate-secrets" -c user.name=vault-seed -c user.email=vault-seed@users.noreply.github.com \
                 commit -q -m "science router key (vault-seed run $GITHUB_RUN_ID)" 2>/dev/null; then
              GH_TOKEN="$tok" git -C "$RUNNER_TEMP/estate-secrets" push -q origin HEAD || { echo "error   science key written but the push to estate-secrets was refused"; exit 1; }
              echo "ok      science key delivered to estate-secrets as LITELLM_SCIENCE_KEY"
            else
              echo "info    science key unchanged in estate-secrets"
            fi
            rm -rf "$RUNNER_TEMP/estate-secrets"
          fi
          rm -f "$ESTATE_ENV_FILE"
