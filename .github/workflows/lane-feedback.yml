# button: Why the lane went red
# founder: The exact failing line reaches the agent with the failure, instead of the agent doing
# API archaeology and then guessing. Measured 2026-11-06: the lane status names the job
# ("ci-success failure -- offline-gate > Run bin/idp-ci") and never the error, so every red costs
# four API calls before the real cause is visible.
#
# It posts the failing job's FAIL/error lines as a comment on the commit the lane tested, which is
# where an agent already looks, and it prints them in the job summary for a human. No NATS hop is
# added here on purpose: the commit is the one place every runtime already reads.
name: lane-feedback
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  post-error:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    steps:
      - name: Extract the failing job's error
        id: err
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[]|select(.conclusion=="failure")|"\(.id)\t\(.name)"' > jobs.tsv || true
          if [ ! -s jobs.tsv ]; then
            echo "no failed job in run $RUN_ID" >&2
            exit 0
          fi
          job_id=$(head -1 jobs.tsv | cut -f1)
          job_name=$(head -1 jobs.tsv | cut -f2)
          # Annotations first: the runner already knows which line failed, and reading them is a
          # small JSON call instead of a redirected zip.
          check_id=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq "[.check_runs[]|select(.conclusion==\"failure\")][0].id // empty" 2>/dev/null || true)
          error=""
          if [ -n "$check_id" ]; then
            error=$(gh api "repos/$REPO/check-runs/$check_id/annotations?per_page=100" --jq '.[]|"\(.path // ""):\(.start_line // 0)  \(.message)"' 2>/dev/null | head -15 || true)
          fi
          [ -n "$error" ] || error=$(gh api "repos/$REPO/actions/jobs/$job_id/logs" 2>/dev/null \
            | sed -E 's/^[^\t]*\t[^\t]*\t//' \
            | grep -E 'FAIL |error:|Error:|##\[error\]|Traceback' | head -15 || true)
          if [ -z "$error" ]; then
            error=$(gh api "repos/$REPO/actions/jobs/$job_id/logs" 2>/dev/null \
              | sed -E 's/^[^\t]*\t[^\t]*\t//' | tail -15 || true)
          fi
          {
            echo "LANE FEEDBACK: the exact reason this commit is red"
            echo
            echo "failing job: $job_name"
            echo
            printf '%s\n' "$error"
            echo
            echo "run: https://github.com/$REPO/actions/runs/$RUN_ID"
            echo "same answer locally: bin/lane-error $SHA"
          } > feedback.md
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Post it where the agent already looks
        if: hashFiles('feedback.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.err.outputs.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/commits/$SHA/comments" -F body=@feedback.md >/dev/null
          cat feedback.md >> "$GITHUB_STEP_SUMMARY"
      # The loop closes on the surface agents already read at session start: the ticket. A commit
      # comment is where an agent looks when it suspects; an open issue is what it is handed. One
      # issue per branch, updated in place, so a red lane cannot fan out into a hundred tickets.
      - name: Open or update the lane's ticket
        if: hashFiles('feedback.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.err.outputs.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          title="[lane] ${BRANCH} is red"
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title --jq "[.[]|select(.title==\"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file feedback.md >/dev/null
            echo "updated issue #$existing"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file feedback.md >/dev/null
            echo "opened the lane's ticket"
          fi
