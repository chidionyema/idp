name: karma-readback-format-and-falsify-once
on:
  push:
    branches: [lane/karma-live-source-readback-20261112]
    paths: [.github/workflows/karma-readback-format-once-20261112.yml]
permissions:
  contents: write
  pull-requests: write
jobs:
  format-falsify-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lane/karma-live-source-readback-20261112
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Format, run source and BDD falsifiers, amend PR proof, retire this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install -q ruff==0.15.18 pytest==8.4.2 pytest-bdd pyyaml cryptography
          python -m ruff format platform/estate/karma/readback.py platform/llm/action_ledger.py tests/test_karma_readback.py
          python -m ruff format --check platform/estate/karma/readback.py platform/llm/action_ledger.py tests/test_karma_readback.py
          python -m ruff check --select E9,F,B,S platform/estate/karma/readback.py platform/llm/action_ledger.py tests/test_karma_readback.py
          bin/estate-diagnose docs/diagnoses/2026-11-12-karma-router-emitter-gap.yaml --no-write --min-posterior 0.95
          tmp="$RUNNER_TEMP/karma-bdd"
          mkdir -p "$tmp"
          cat > "$tmp/karma.feature" <<'FEATURE'
          Feature: KARMA must refuse unverifiable production conclusions
            Scenario: Green CI is not independently verified production yield
              Given one successful CI execution
              When KARMA projects the CI observations
              Then the production yield remains unverified
          
            Scenario: Duplicate receipts cannot inflate observations
              Given duplicated CI execution receipts
              When KARMA projects the CI observations
              Then duplicate receipts are detected
          
            Scenario: A blind source must never pass as zero failures
              Given a blind malformed CI feed
              When KARMA validates the CI feed
              Then the blind feed is rejected
          
            Scenario: An injected instruction does not bind identity
              Given a malicious untrusted instruction identifier
              When the signed action router classifies it
              Then the instruction link is missing
          FEATURE
          cat > "$tmp/test_karma_bdd.py" <<'PY'
          from pathlib import Path
          import sys
          from pytest_bdd import scenarios, given, when, then
          
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "platform/estate/karma"))
          sys.path.insert(0, str(ROOT / "platform/llm"))
          import readback
          import action_ledger
          
          scenarios("karma.feature")
          
          def ci_row():
              return {"repo": "idp", "workflow": "ci", "id": 71, "conclusion": "success",
                      "sha": "a"*40, "created_at": "2026-11-12T12:00:00Z"}
          
          @given("one successful CI execution", target_fixture="ci_input")
          def successful(): return [ci_row()]
          
          @given("duplicated CI execution receipts", target_fixture="ci_input")
          def duplicate(): return [ci_row(), ci_row()]
          
          @when("KARMA projects the CI observations", target_fixture="projection")
          def project(ci_input): return readback.reconcile(ci_input)
          
          @then("the production yield remains unverified")
          def unknown(projection):
              assert projection["ci"]["verified_production_yield"] is None
              assert projection["investor"]["safe_to_assert_live_verified_KARMA"] is False
          
          @then("duplicate receipts are detected")
          def duplicates(projection):
              assert projection["ci"]["observed_runs"] == 1
              assert projection["ci"]["duplicates"] == 1
          
          @given("a blind malformed CI feed", target_fixture="invalid_input")
          def malformed(): return {"status": "BLIND"}
          
          @when("KARMA validates the CI feed", target_fixture="validation_error")
          def check_blind(invalid_input):
              try:
                  readback.reconcile(invalid_input)
              except ValueError as error:
                  return str(error)
              return None
          
          @then("the blind feed is rejected")
          def rejected(validation_error): assert validation_error is not None
          
          @given("a malicious untrusted instruction identifier", target_fixture="router_kwargs")
          def injected():
              return {"model": "model-x", "litellm_params":
                      {"proxy_server_request": {"body": {"metadata":
                      {"instruction_id": "<unsafe>"}}}}}
          
          @when("the signed action router classifies it", target_fixture="router_result")
          def route(router_kwargs): return action_ledger.karma_call(router_kwargs, {}, outcome="failure")
          
          @then("the instruction link is missing")
          def not_bound(router_result):
              assert router_result["instruction_id"] is None
              assert router_result["instruction_link"] == "MISSING"
              assert router_result["billed_cost"] is None
          PY
          python -m pytest -q tests/test_karma_readback.py "$tmp/test_karma_bdd.py" | tee "$tmp/accepted.log"
          cp platform/estate/karma/readback.py "$tmp/readback.clean.py"
          python - <<'PY'
          from pathlib import Path
          p=Path("platform/estate/karma/readback.py")
          s=p.read_text()
          assert s.count('"verified_production_yield": None,') == 1
          p.write_text(s.replace('"verified_production_yield": None,', '"verified_production_yield": True,', 1))
          PY
          set +e
          python -m pytest -q "$tmp/test_karma_bdd.py" > "$tmp/mutation.log" 2>&1
          mutation_rc=$?
          set -e
          if [ "$mutation_rc" -eq 0 ]; then
            echo "FAIL: falsifier did not reject a self-certified success"
            exit 1
          fi
          grep -q "failed" "$tmp/mutation.log"
          cp "$tmp/readback.clean.py" platform/estate/karma/readback.py
          # Timestamp/size based Python pyc validation can retain the negative-control mutant
          # if the source was restored inside the same second. Invalidate before verification.
          rm -f platform/estate/karma/__pycache__/readback.*.pyc
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/test_karma_readback.py "$tmp/test_karma_bdd.py" | tee "$tmp/restored.log"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .githooks
          git add -- platform/estate/karma/readback.py platform/llm/action_ledger.py tests/test_karma_readback.py
          git rm -- .github/workflows/karma-readback-format-once-20261112.yml
          git commit -m "fix(karma): format readback and verify router with falsifying BDD" -m "Claim: chidionyema/idp#7452
          Agent: chatgpt-github
          Language-Exception: platform/estate/karma/readback.py -- Existing Python estate-state builder and JSON receipts require an in-process stdlib adapter without another service.
          Diagnosis: docs/diagnoses/2026-11-12-karma-router-emitter-gap.yaml
          BDD-Run: https://github.com/chidionyema/idp/actions/runs/$GITHUB_RUN_ID"
          candidate="$(git rev-parse HEAD)"
          gh api repos/"$GITHUB_REPOSITORY"/pulls/8005 --jq '.body' > "$tmp/pr-body.md"
          cat >> "$tmp/pr-body.md" <<EOF
          
          BDD-PROOF
          head: $candidate (checked-out source formatted, 9 source falsifiers and 4 executable Gherkin scenarios passed before this exact commit)
          runner: GitHub Actions ubuntu-24.04; https://github.com/chidionyema/idp/actions/runs/$GITHUB_RUN_ID
          Feature: KARMA unknown-yield, duplicate observations, blind-source rejection and untrusted instruction refusal.
          Command: python -m pytest -q tests/test_karma_readback.py $tmp/test_karma_bdd.py
          Negative control: mutated readback to set verified_production_yield=True without an independent receipt; BDD suite failed, restored original and all cases passed.
          Gate evidence: Ruff --check and strict E9/F/B/S pass; existing Bayesian diagnosis evaluated from real pre-change source property at docs/diagnoses/2026-11-12-karma-router-emitter-gap.yaml.
          Limits: source and mocked router evidence, NOT actual QUAD identity verification, Chronos live tick, billing attestation or live production settlement.
          END-BDD-PROOF
          EOF
          gh api --method PATCH repos/"$GITHUB_REPOSITORY"/pulls/8005 -f body="$(cat "$tmp/pr-body.md")" > /dev/null
          git push origin HEAD:lane/karma-live-source-readback-20261112
          echo "KARMA readback source accepted, BDD mutation falsified, candidate $candidate" >> "$GITHUB_STEP_SUMMARY"
          
