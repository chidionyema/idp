# button: List and prune old Kubernetes secrets to escape OKE's 2000 secret cap
# founder: Cluster over Oracle's 2000-secret leak protection stops every ExternalSecret webhook and
#   stalls Flux end-to-end. Default is dry-run: shows the top classes and how many secrets each has
#   (helm history, service-account tokens, kyverno cache, etc.) so the founder sees the shape before
#   anything is deleted. `prune_helm_history=true` deletes `sh.helm.release.v1.*` secrets keeping the
#   last `helm_keep` revisions per release name -- the standard, safe Helm cleanup Oracle names in
#   its own resource-leak-protection docs.
#
# Two knobs:
#   dry_run=true (default)        list only, delete nothing
#   prune_helm_history=true       actually delete old Helm revision secrets past helm_keep
#   helm_keep=3                   how many recent revisions to keep per release (matches Helm's own default)
#
# Every deletion is logged to the run summary with `namespace/name age`. Never operates on secrets
# that aren't `sh.helm.release.v1.*`, so ExternalSecret-managed secrets, TLS certs, tokens and
# ClusterSecretStore inputs are all untouched by design.
name: estate-secret-prune
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: list only, do not delete"
        type: boolean
        default: true
      prune_helm_history:
        description: "true: delete old sh.helm.release.v1.* secrets past helm_keep"
        type: boolean
        default: false
      helm_keep:
        description: "How many recent revisions per Helm release to keep"
        default: "3"
      reason:
        description: "Why (one line, kept in the run record)"
        required: true
        default: "OKE resource leak protection tripped at 2650 secrets"
permissions:
  id-token: write
  contents: read
concurrency:
  group: estate-secret-prune
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_CLI_AUTH: security_token
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt

      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt

      - name: kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}

      - name: Mint kubeconfig
        env:
          OCI_CLUSTER_NAME: ${{ vars.OCI_CLUSTER_NAME || 'estate' }}
        run: |
          set -euo pipefail
          cl=$(bin/idp-cloud cluster list)
          cid=$(printf '%s\n' "$cl" | awk -v n="$OCI_CLUSTER_NAME" '$1==n{print $2; exit}')
          [ -n "$cid" ] || { echo "no ACTIVE cluster named $OCI_CLUSTER_NAME"; exit 1; }
          mkdir -p "$HOME/.kube"
          bin/idp-cloud cluster kubeconfig "$cid" --file "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Secret inventory (always runs, always safe)
        run: |
          set -uo pipefail
          echo "## Secret inventory" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          total=$(kubectl get secrets -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
          echo "**Total secrets across all namespaces: $total** (Oracle OKE leak protection cap: 2000)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### By type (top 20)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get secrets -A -o custom-columns=TYPE:.type --no-headers 2>/dev/null \
            | sort | uniq -c | sort -rn | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### By namespace (top 20)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get secrets -A -o custom-columns=NS:.metadata.namespace --no-headers 2>/dev/null \
            | sort | uniq -c | sort -rn | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Helm release history secrets" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          helm_total=$(kubectl get secrets -A --field-selector type=helm.sh/release.v1 --no-headers 2>/dev/null | wc -l | tr -d ' ')
          echo "helm.sh/release.v1 secrets: $helm_total" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "top releases by revision count:" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl get secrets -A --field-selector type=helm.sh/release.v1 -o custom-columns=NAME:.metadata.name --no-headers 2>/dev/null \
            | sed -E 's/\.v[0-9]+$//' | sort | uniq -c | sort -rn | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Prune Helm release history (past helm_keep revisions)
        if: ${{ inputs.prune_helm_history == true }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP: ${{ inputs.helm_keep }}
          REASON: ${{ inputs.reason }}
        run: |
          set -uo pipefail
          echo "## Helm-history prune" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "keep=$KEEP  dry_run=$DRY_RUN  reason=$REASON" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Enumerate every helm.sh/release.v1 secret as (namespace name release-name revision).
          # The name format is sh.helm.release.v1.<release>.v<n>. We group by (namespace, release)
          # and, per group, keep the top KEEP revisions by n; the rest are candidates for delete.
          tmp=$(mktemp)
          kubectl get secrets -A --field-selector type=helm.sh/release.v1 \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\n"}{end}' 2>/dev/null \
            | awk -F'\t' '
              {
                ns=$1; name=$2;
                # strip the sh.helm.release.v1. prefix and the trailing .v<n>
                rel=name; sub(/^sh\.helm\.release\.v1\./,"",rel); sub(/\.v[0-9]+$/,"",rel);
                rev=name; sub(/^.*\.v/,"",rev); rev+=0;
                print ns"\t"name"\t"rel"\t"rev;
              }' | sort -t$'\t' -k1,1 -k3,3 -k4,4n > "$tmp"

          # For each (ns, release) group, drop the last KEEP entries (highest rev), delete the rest.
          deleted=0; kept=0
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          awk -F'\t' -v keep="$KEEP" '
            {
              key=$1"\t"$3;
              rows[key]=(key in rows ? rows[key]"\n" : "") $2;
              n[key]++;
            }
            END {
              for (key in rows) {
                split(rows[key], a, "\n");
                total=n[key];
                # a[] is already sorted asc by revision (input was sorted). Delete all but last `keep`.
                del=total-keep; if (del<0) del=0;
                split(key, k, "\t"); ns=k[1]; rel=k[2];
                for (i=1; i<=del; i++) print "DELETE\t"ns"\t"a[i]"\t"rel;
                for (i=del+1; i<=total; i++) print "KEEP\t"ns"\t"a[i]"\t"rel;
              }
            }' "$tmp" | sort > "$tmp.plan"

          while IFS=$'\t' read -r action ns name rel; do
            case "$action" in
              KEEP) kept=$((kept+1));;
              DELETE)
                if [ "$DRY_RUN" = "true" ]; then
                  echo "[dry-run] would delete $ns/$name  (release: $rel)"
                else
                  if kubectl -n "$ns" delete secret "$name" --wait=false >/dev/null 2>&1; then
                    echo "deleted $ns/$name  (release: $rel)"
                    deleted=$((deleted+1))
                  else
                    echo "FAILED to delete $ns/$name"
                  fi
                fi
                ;;
            esac
          done < "$tmp.plan" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Summary:** kept=$kept  deleted=$deleted  dry_run=$DRY_RUN" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post-prune total (only when we actually deleted)
        if: ${{ inputs.prune_helm_history == true && inputs.dry_run == false }}
        run: |
          set -uo pipefail
          # wait for the API server to reflect the deletions — bounded, condition-checked
          for _ in $(seq 1 10); do
            total=$(kubectl get secrets -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
            [ "$total" -lt "${before:-99999}" ] && break
          done
          total=$(kubectl get secrets -A --no-headers 2>/dev/null | wc -l | tr -d ' ')
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Post-prune total: $total** (Oracle OKE cap: 2000)" | tee -a "$GITHUB_STEP_SUMMARY"
