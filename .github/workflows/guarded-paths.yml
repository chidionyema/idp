# button: Refuse any PR that bypasses the estate's authorization contract
# founder: Zero-trust. Founder 2026-09-17, verbatim: "we deal with breaches now", "we have policies
#   for a reason", "we don't allow junk into our cluster", "we run a zero trust model", "instinct is
#   not a defence -- mathematical guarantees". This workflow is the mathematical guarantee: no PR
#   merges to main unless bin/idp-ci-guarded-paths passes on its HEAD commit, and that check
#   refuses (a) touching a guarded policy file without a founder-signed X-Idp-Auth trailer,
#   (b) a blind-accept merge trailer, (c) a commit whose provenance cannot be verified to a fact
#   its author cannot forge -- it must have been written by GitHub itself, or carry a founder
#   signature (defeats --no-verify). The commit-msg HMAC (X-Idp-Signed) is NOT accepted here as
#   evidence (idp#7770): it is minted per-checkout and CI cannot verify it, so accepting its
#   presence alone let `X-Idp-Signed: x` through the gate.
name: guarded-paths
on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'queue/**'          # the Greenlane candidate, graded against origin/main before it becomes main
      # main itself. The ruleset required-checks-main (24071703) lists `guarded-paths` as a
      # required status check on ~DEFAULT_BRANCH, but this workflow only ever ran on
      # pull_request/merge_group/queue/**. Every candidate was graded on queue/bNNN and passed;
      # then main fast-forwarded and the check stayed behind on a queue branch the engine deletes.
      # So on main the required context was permanently ABSENT (measured 2026-10-04 on
      # 9bd03a78a840: check-runs carried ci-success/bdd/land/tick and no guarded-paths run at all),
      # and bin/idp-greenlane status reported main_green:false with alarm:true forever. The
      # grading is unchanged -- this only gives it the trigger the ruleset already assumes.
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  guarded-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # For pull_request events the default checkout is the GitHub test-merge commit,
          # which is never stamped by commit-msg. Check out the PR branch tip directly so
          # git rev-parse HEAD returns the commit the author actually signed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: run bin/idp-ci-guarded-paths against the base
        env:
          ESTATE_CI_EVENT_NAME: ${{ github.event_name }}
          ESTATE_CI_REF: ${{ github.ref }}
          ESTATE_CI_BASE_REF: ${{ github.base_ref }}
          ESTATE_CI_BEFORE: ${{ github.event.before }}
          ESTATE_CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ESTATE_CI_MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -uo pipefail
          # idp#7710 (2026-11-05): the base is named in ONE place now (bin/idp-ci-base). It used
          # to be named here as "the commit main was at before this push", with a first push
          # falling back to HEAD~1 -- which grades only the LAST commit of a batch, so a
          # candidate's other lanes were invisible to this gate. A Greenlane candidate grades
          # against origin/main, like a pull request from the same branch would.
          base="$(bin/idp-ci-base)" || base=""
          if [ -z "$base" ]; then
            echo "BLIND   guarded-paths  no base could be named: refusing to pass unproven"
            exit 1
          fi
          bin/idp-ci-guarded-paths "$base"
