name: seal CLI acceptance one-shot
on:
  push:
    branches: [research/8258-seal-acceptance-20261123]
    paths: [.github/workflows/seal-cli-acceptance.yml]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22'}
      - name: Prove actual signer and CLI match without founder secrets
        run: |
          set -euo pipefail
          node --check platform/lifeboat/src/seal.js
          node --test platform/lifeboat/test/seal-cli.test.mjs platform/lifeboat/test/seal.test.mjs
          bash bin/idp-auth-verify --self-test
