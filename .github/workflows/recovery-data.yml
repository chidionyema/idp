# button: Protect the surviving data, and repair the router host
# founder: Mounts the surviving csi-* volumes read-only on the recovery host, says what each one holds, and with mode=copy streams each off-provider with a checksum. With mode=repair it repairs the host's router and Cloudflare Tunnel connector, which is how llm-recovery.mumchimp.com is served at all.
#
# WHY (#7387, plan step 3). The OKE cluster left three 50 GB volumes, the only copy of the estate's
# data: estate-db had no backup, and volume backups are refused at the free limit. Nothing may write
# to them before they are copied. The recovery host has no SSH door, so this runs
# platform/oci/recovery/data-volumes.sh on it through OCI Run Command and prints what it said.
#
# WHY mode=repair (2026-10-29). llm-recovery.mumchimp.com answered HTTP 530 "error code: 1033",
# which Cloudflare documents as "your tunnel is not connected ... Cloudflare's network cannot find a
# healthy cloudflared instance". The tunnel, DNS, vault entry and bundle were all proven good from
# the outside; the missing thing was the connector on the host. This host has no SSH door and no
# other way in, so the repair runs through the same Run Command door, on the same workflow, with
# its own script. The CI principal needed the Run Command permission for this door to work at all
# (platform/oci/recovery-host.tf); before that grant the create returned NotAuthorizedOrNotFound.
#
# WHY the transport helper (2026-10-30, #7525). OCI refuses a Run Command body above 4096
# characters ("content.source.text size must be between 1 and 4096"), and host-repair.sh is
# 10231 bytes -- gzip+base64 of it is still 4749. The script is therefore transported in
# chunks by platform/oci/recovery/run-command.py, which appends them in order, decodes them on
# the host, runs the script as root and reports its exit code. The workflow no longer builds a
# Run Command body itself: one place builds it, and that place is tested.
name: recovery-data
on:
  # Detect recovery-door regressions continuously, not only when someone edits code.
  # Schedule always executes the main branch, and the default mode is read-only identify.
  schedule:
    - cron: "19 7 * * *"
  # Only a governed main-branch change can launch a new read-only volume census.
  # Never use pull_request or a lane: this job exchanges an OCI OIDC credential.
  push:
    branches: [main]
    paths:
      - .github/workflows/recovery-data.yml
      - platform/oci/recovery/data-volumes.sh
  workflow_dispatch:
    inputs:
      mode:
        description: "identify (read-only look) or copy (identify, then stream each volume to the host's bucket) or repair (fix the router and the tunnel connector)"
        type: choice
        options: [identify, copy, repair]
        default: identify
permissions:
  id-token: write
  contents: read
jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: ${{ inputs.mode || 'identify' }} on the recovery host
        env:
          OCI_CLI_AUTH: security_token
          COMP: ${{ vars.OCI_COMPARTMENT_OCID }}
          MODE: ${{ inputs.mode || 'identify' }}
        run: |
          set -euo pipefail
          script=platform/oci/recovery/data-volumes.sh
          [ "$MODE" = repair ] && script=platform/oci/recovery/host-repair.sh
          # The host script is larger than OCI's 4096-character Run Command limit, so the
          # transport is chunked by the repository-owned helper, not inlined here (#7525).
          # Identify is a read-only probe. An OCI agent that does not answer
          # within 3 minutes per command must be BLIND, not a one-hour hang.
          # Copy/repair retain their original explicit long budgets.
          probe_budget=3600
          if [ "$MODE" = identify ]; then probe_budget=180; fi
          python3 platform/oci/recovery/run-command.py \
            --script "$script" \
            --mode "$MODE" \
            --compartment "$COMP" \
            --display-name estate-recovery \
            --run-id "$GITHUB_RUN_ID" \
            --wait-timeout "$probe_budget"
