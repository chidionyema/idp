# button: Run the estate stack controller
# founder: One commanded cloud loop from an approved intent to a signed receipt.
name: estate-stack-controller

on:
  workflow_dispatch:
    inputs:
      intent:
        description: "Repository-relative stack intent JSON"
        type: string
        required: true
        default: "platform/estate/stack-intents/stack-recovery-20261109.json"
      mode:
        description: "verify is read-only; apply requires a founder-signed intent and live repair lease"
        type: choice
        options: [verify, apply]
        default: verify

permissions:
  id-token: write
  contents: read
  actions: write
  issues: write

concurrency:
  group: estate-stack-controller-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GITHUB_REPOSITORY: chidionyema/idp
      GH_TOKEN: ${{ github.token }}
      LITELLM_API_KEY: ${{ secrets.SEED_DSH_ROUTER_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - uses: ./.github/actions/estate-tools
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: "1.12.6", tofu_wrapper: false }
      - name: Python dependencies for the controller and policy gate
        run: python -m pip install -q cryptography jsonschema pyyaml
      - name: OCI dependencies
        run: python -m pip install -q -r .github/requirements/oci-cli.txt
      - name: GitHub OIDC to one-hour OCI session
        # A failed exchange leaves the controller to emit an honest BLIND plan row
        # instead of preventing the receipt from existing.
        continue-on-error: true
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: Run the one controller
        id: controller
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OKE_SSH_PUBKEY_TEXT: ${{ vars.OKE_SSH_PUBKEY }}
          OKE_ALLOWED_CIDRS: ${{ vars.OKE_ALLOWED_CIDRS }}
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}
        run: |
          set -o pipefail
          bin/estate-stack-controller "${{ inputs.intent }}" \
            --mode "${{ inputs.mode }}" \
            --receipt "$RUNNER_TEMP/estate-stack-receipt.json"
      - name: Verify the signed receipt
        if: always()
        run: |
          test -s "$RUNNER_TEMP/estate-stack-receipt.json"
          bin/estate-stack-controller \
            --verify-receipt "$RUNNER_TEMP/estate-stack-receipt.json"
      - name: Publish receipt to the run summary
        if: always()
        run: |
          test -s "$RUNNER_TEMP/estate-stack-receipt.json"
          python3 - "$RUNNER_TEMP/estate-stack-receipt.json" <<'PY'
          import json, os
          path = os.sys.argv[1]
          receipt = json.load(open(path, encoding="utf-8"))
          print("## Estate stack receipt")
          print()
          print(f"- Receipt: `{receipt['receipt_id']}`")
          print(f"- Mode: `{receipt['mode']}`")
          print(f"- Yield: **{receipt['yield']['verdict']}**")
          print(f"- Reason: {receipt['yield']['reason']}")
          print()
          print("| stage | verdict | measurement |")
          print("|---|---|---|")
          for stage in receipt["stages"]:
              line = str(stage["line"]).replace("|", "\\|")
              print(f"| {stage['stage']} | {stage['verdict']} | {line} |")
          PY
      - name: Upload the signed receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estate-stack-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/estate-stack-receipt.json
          if-no-files-found: error
          retention-days: 90
