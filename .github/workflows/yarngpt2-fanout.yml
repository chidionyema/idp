# founder: Throwaway. Run 4: YarnGPT2 fan-out timed on free GitHub runners, one job per sentence group (as one Modal container per group). Runs only on branch eval/yarngpt2.
name: yarngpt2-fanout

on:
  push:
    branches: [eval/yarngpt2]
    paths: [.github/workflows/yarngpt2-fanout.yml, eval/yarngpt2_fanout.py]

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ["1 0", "2 0", "2 1", "3 0", "3 1", "3 2"]
    env:
      YARNGPT_SHA: 8bb0eb27d307f4b5903149e24ecc1bd3caa4af2d
      LLAMA_CPP_SHA: c0159f9c1f874da15e94f371d136f5920b4b5335
      CFG: wavtokenizer_mediumdata_frame75_3s_nq1_code4096_dim512_kmeans200_attn.yaml
      CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libgomp1 cmake build-essential
      - run: |
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.47.1 outetts==0.2.3 uroman inflect gdown soundfile huggingface_hub sentencepiece protobuf numpy
          pip install -q llama-cpp-python==0.3.19
      - run: |
          sudo mkdir -p /w /opt && sudo chown "$USER" /w /opt
          git clone -q https://github.com/saheedniyi02/yarngpt.git /opt/yarngpt && git -C /opt/yarngpt checkout -q "$YARNGPT_SHA"
          curl -fsSL -o "/w/$CFG" "https://huggingface.co/novateur/WavTokenizer-medium-speech-75token/resolve/main/$CFG"
          gdown -q 1-ASeEkrn4HY49yZWHTASgfGFNXdVnLTt -O /w/wavtokenizer.ckpt
          git init -q /opt/llama.cpp && git -C /opt/llama.cpp fetch -q --depth 1 https://github.com/ggml-org/llama.cpp.git "$LLAMA_CPP_SHA" && git -C /opt/llama.cpp checkout -q FETCH_HEAD
          pip install -q /opt/llama.cpp/gguf-py
          M=$(python -c "from huggingface_hub import snapshot_download as d; print(d('saheedniyi/YarnGPT2'))")
          python /opt/llama.cpp/convert_hf_to_gguf.py "$M" --outtype q8_0 --outfile /w/yarn-q8_0.gguf
      - working-directory: eval
        run: python yarngpt2_fanout.py synth ${{ matrix.group }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: group-${{ strategy.job-index }}
          path: eval/fanout-out
          retention-days: 7

  join:
    needs: synth
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: group-*
          merge-multiple: true
          path: eval/fanout-out
      - run: pip install -q faster-whisper==1.1.0 requests
      - working-directory: eval
        run: python yarngpt2_fanout.py join
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yarngpt2-fanout-joined
          path: eval/fanout-out/joined-*.wav
          retention-days: 7
