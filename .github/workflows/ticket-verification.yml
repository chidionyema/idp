# button: Refresh ticket states
# founder: Moves each ticket's label to match what the checks proved since the last run.
# crew#631 CP5: the ticket state machine. Runs after every prover run and hourly: a ticket labelled
# RESOLVED_PENDING_VERIFICATION moves to VERIFIED or REJECTED only here, on the prover's verdict, as
# the estate's GitHub App; a VERIFIED label set by anyone else, or one with no PASS verdict younger
# than 24 h behind it, is reverted. The App token is minted from the vault (lane ticket-verifier:
# issues write, actions read), which is why this needs the OCI session and lives in idp.
name: ticket-verification
on:
  schedule:
    - cron: "47 * * * *"   # ten minutes after the hourly prover (37)
  workflow_run:
    workflows: [verdict-langfuse]
    types: [completed]
  workflow_dispatch:
    inputs:
      apply:
        description: "apply (move labels) or report only"
        type: boolean
        default: true
permissions:
  id-token: write
  contents: read
concurrency:
  group: ticket-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-ticket-verify as the prover App
        id: verify
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          tok=$(bin/idp-github-app token ticket-verifier 2>&1) || { echo "BLIND   ticket-verify  no App token: ${tok:0:160}"; exit 2; }
          echo "::add-mask::$tok"
          echo "tok=$tok" >> "$GITHUB_OUTPUT"
          apply=--apply
          [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.apply }}" != true ] && apply=""
          GH_TOKEN="$tok" bin/idp-ticket-verify $apply 2>&1 | tee verify.out
          printf '### ticket-verification\n```\n%s\n```\n' "$(cat verify.out)" >> "$GITHUB_STEP_SUMMARY"
      - name: post verdict to crew#102 (only when labels changed or on manual dispatch)
        if: always()
        env:
          GH_TOKEN: ${{ steps.verify.outputs.tok }}
        run: |
          changed=$(grep -cE '^\s*(VERIFIED|REJECTED|REVERTED)' verify.out || true)
          trigger="${{ github.event_name }}"
          if [ "$changed" -gt 0 ] || [ "$trigger" = "workflow_dispatch" ]; then
            ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            body="$ts **ticket-verification** (scheduler): $(grep -cE '^\s*VERIFIED' verify.out || echo 0) verified, $(grep -cE '^\s*REJECTED' verify.out || echo 0) rejected, $(grep -cE '^\s*REVERTED' verify.out || echo 0) reverted — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            gh issue comment 102 --repo chidionyema/crew --body "$body"
          fi
