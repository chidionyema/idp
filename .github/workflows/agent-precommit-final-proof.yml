name: Genesis commit-boundary final exact-source acceptance

on:
  push:
    branches: [proof/agent-precommit-final-20261110]

permissions:
  contents: read

jobs:
  verified-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prove candidate-source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cd1283d570735596935871a7a1b2f356c85bd845"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/agent-precommit-final-proof.yml"
          git diff --quiet HEAD^ HEAD -- bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py .githooks/pre-commit .github/workflows/agent-sandbox.yml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Required syntax and verified policy tests
        run: |
          set -euo pipefail
          bash -n .githooks/pre-commit
          python -m py_compile bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py
          python -m unittest discover -s tests -p test_agent_patch_preflight.py -v
      - name: Pinned lint and format
        run: |
          set -euo pipefail
          python -m pip install -q 'ruff==0.15.18'
          ruff check --select E9,F,B bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py
          ruff format --check bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py
