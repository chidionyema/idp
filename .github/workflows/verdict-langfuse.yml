# button: Check Langfuse and sign the result
# founder: Checks that Langfuse answers, answers its key, refuses a caller without one, and that a signed-in person reaches it; signs the result.
# crew#631 CP1: the prover for Langfuse. Runs on the estate's machine identity (the same GitHub
# OIDC -> OCI session token exchange login-drill.yml once used, until it was deleted 2026-09-21),
# so the API key, the drill password, the
# cluster read and the signing key are all reachable here and nowhere an agent runs. The output is
# one signed verdict file, kept as the run's artifact, and a check-run `verify/langfuse` on the
# commit under test, whose conclusion is the verdict's outcome. An agent token cannot create a
# check-run and does not hold the key, so the only way to a green check is a Langfuse that works.
name: verdict-langfuse
on:
  schedule:
    - cron: "37 * * * *"   # hourly; VERDICT_TTL_SECONDS is 3600, so a verdict lives one cycle
  workflow_dispatch:
    inputs:
      nonce:
        description: "request code for this run (leave blank; the run makes one)"
        required: false
        default: ""
      lookup_trace:
        description: "a trace id from an earlier run, read again now (shown, not checked)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - probes/**
      - bin/idp-prove
      - bin/idp-verdict
      - platform/observability/langfuse*
      - .github/workflows/verdict-langfuse.yml
permissions:
  id-token: write
  contents: read
  checks: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: verdict-langfuse
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/requirements/oci-cli.txt
            .github/requirements/oci-cli.txt
      - name: oci cli and a headless browser
        run: |
          pip install -q -r .github/requirements/oci-cli.txt
          playwright install --with-deps chromium
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-prove langfuse
        id: prove
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          DRILL_SHOT: ${{ runner.temp }}/verdict-langfuse-home.png
          VERDICT_NONCE: ${{ inputs.nonce }}
          IDP_PROVE_LOOKUP_TRACE: ${{ inputs.lookup_trace }}
          VERDICT_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          rc=0
          bin/idp-prove langfuse --out "$RUNNER_TEMP/verdict.json" 2>&1 | tee prove.out || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: the verdict file is the run's artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-langfuse
          path: |
            ${{ runner.temp }}/verdict.json
            ${{ runner.temp }}/verdict-langfuse-home.png
          if-no-files-found: warn
          retention-days: 30
      # Free-tier proof for this PUBLIC repository: GitHub's OIDC-signed
      # Sigstore provenance is tied to the exact verdict.json bytes.
      # A future freshness gate cannot accept an unsigned/tampered artifact.
      # The attestation action is not executable from a PR head here:
      # this producer runs only from protected main, schedule or dispatch.
      - name: GitHub OIDC attestation binds the exact verdict bytes to this workflow
        if: always()
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4 pinned 2026-11-06
        with:
          subject-path: ${{ runner.temp }}/verdict.json
      - name: the verdict row lands in the table as prover (crew#631 CP3; never fatal to the check-run)
        if: always()
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          bin/idp-verdict schema || true
          bin/idp-verdict store "$RUNNER_TEMP/verdict.json"   # a store failure is a red step, never a green run (silent-green class)
          bin/idp-verdict list -n 3 || true
          bin/idp-verdict refuse-test || true
      - name: check-run verify/langfuse on the commit, conclusion = outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -E '^(PASS|FAIL|BLOCKED|ERROR) +prove' prove.out | tail -1 || true)
          line=${line:-"ERROR   prove  the prover died before printing a verdict line"}
          outcome=${line%% *}
          case "$outcome" in PASS) c=success;; FAIL) c=failure;; *) c=neutral;; esac
          summary=$(printf '```\n%s\n```\n' "$(grep -E '^(ok|FAIL) +prove' prove.out || true)")
          gh api "repos/${{ github.repository }}/check-runs" -f name=verify/langfuse -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion="$c" -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "output[title]=$line" -f "output[summary]=$summary" >/dev/null
          printf '### verdict-langfuse\n```\n%s\n```\n%s\n' "$line" "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: post FAIL verdict to crew#102
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -E '^(PASS|FAIL|BLOCKED|ERROR) +prove' prove.out | tail -1 || true)
          outcome=${line%% *}
          [ "$outcome" = "PASS" ] && exit 0
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          body="$ts **verdict/langfuse** (scheduler): ${outcome} — ${line#* } — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          gh issue comment 102 --repo chidionyema/crew --body "$body" || true
      - name: the job is red when the verdict is not PASS
        if: always()
        run: |
          grep -qE '^PASS +prove' prove.out
