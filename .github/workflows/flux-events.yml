# Reconcile ledger (crew#325). Flux's github-dispatch Provider (platform/alerts-github/provider-github.yaml)
# sends every flux-system Kustomization event here as a repository_dispatch. The run does one
# thing: print the event as a receipt, so a session with no kube path can read what the cluster
# did with a commit. Read it with:
#   gh run list -R chidionyema/idp --workflow flux-events.yml --limit 20
#   gh run view <id> -R chidionyema/idp --log | grep -E '^(event|object|severity|revision|message)'
name: flux-events
on:
  repository_dispatch:
permissions: {}
jobs:
  ledger:
    name: ${{ github.event.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: receipt
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          ACTION: ${{ github.event.action }}
        run: |
          printf 'event     %s\n' "$ACTION"
          printf '%s' "$PAYLOAD" | jq -r '
            "object    \(.involvedObject.kind // "?")/\(.involvedObject.name // "?").\(.involvedObject.namespace // "?")",
            "severity  \(.severity // "?")",
            "revision  \(.metadata.revision // "-")",
            "message   \(.message // "?")"'
