# Reconcile ledger and alarm (crew#325; crew#307 CP3, 2026-08-28). Flux's github-dispatch Provider
# (platform/alerts-github/provider-github.yaml) sends every flux-system Kustomization event here as
# a repository_dispatch.
#
# It used to only print. On 2026-08-27 16:05 the catalogue Deployment stopped rolling; Flux said
# "health check failed ... Deployment/backstage/catalogue status: 'Failed'" every ten minutes for
# seventeen hours, this workflow printed each one and exited 0, and a red cluster showed a green
# run. Nobody read a ledger, so the founder found it himself by opening the portal (crew#307).
# LAW 28: an instrument nobody reads is not an instrument.
#
# Now a severity=error event opens (or comments on) a P0 issue naming the object, and the recovery
# event closes it. The ISSUE is the alarm; the run stays green once the alarm is filed. It used to
# also `exit 1` per event — GitHub then emailed the founder one "Run failed" notice per reconcile,
# thousands over a weekend (crew#766, founder 2026-08-31: "stop sending errors to email address...
# too much noise"). A relayed cluster error is data for the board, not a CI failure. The run still
# goes red when the alarm itself cannot be filed (any gh call failing kills the step under -e),
# which is the only failure this workflow owns. Read the ledger the same way:
#   gh run list -R chidionyema/idp --workflow flux-events.yml --limit 20
#   gh run view <id> -R chidionyema/idp --log | grep -E '^(event|object|severity|revision|message)'
name: flux-events
on:
  repository_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  ledger:
    name: ${{ github.event.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The dedupe key. A message with the object names, addresses, durations and revisions taken
      # out is the FIRE; what is left in is the Kustomization, which is only where the fire was
      # noticed. On 2026-09-08 one broken namespace fence produced 33 open P0 issues and eight
      # signatures covered 27 of them -- the founder read a board of 33 rows describing one thing.
      # tests/test_the_alarm_files_one_issue_per_fire.py runs this exact program over those 33
      # real messages and fails if it stops folding them.
      SIGNATURE_JQ: >-
        (.message // "?")
        | gsub("[0-9a-f]{16,}"; "<digest>")
        | gsub("https?://[^\" ]+"; "<url>")
        | gsub("(net/http: )?(context deadline exceeded|TLS handshake timeout|i/o timeout|connection refused|EOF|no route to host)"; "<unreachable>")
        | gsub("[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+"; "<obj>")
        | gsub("(<obj> status: \u0027[A-Za-z]+\u0027(, )?)+"; "<objs>")
        | gsub("[0-9]+"; "N")
        | .[0:400]
    steps:
      - name: receipt
        id: receipt
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          ACTION: ${{ github.event.action }}
        run: |
          printf 'event     %s\n' "$ACTION"
          printf '%s' "$PAYLOAD" | jq -r '
            "object    \(.involvedObject.kind // "?")/\(.involvedObject.name // "?").\(.involvedObject.namespace // "?")",
            "severity  \(.severity // "?")",
            "revision  \(.metadata.revision // "-")",
            "message   \(.message // "?")"'
          {
            printf 'object=%s\n' "$(printf '%s' "$PAYLOAD" | jq -r '"\(.involvedObject.kind // "?")/\(.involvedObject.name // "?").\(.involvedObject.namespace // "?")"')"
            printf 'severity=%s\n' "$(printf '%s' "$PAYLOAD" | jq -r '.severity // "?"')"
            printf 'revision=%s\n' "$(printf '%s' "$PAYLOAD" | jq -r '.metadata.revision // "-"')"
            printf 'message<<EOM\n%s\nEOM\n' "$(printf '%s' "$PAYLOAD" | jq -r '.message // "?"')"
            printf 'signature=%s\n' "$(printf '%s' "$PAYLOAD" | jq -r "$SIGNATURE_JQ")"
          } >> "$GITHUB_OUTPUT"

      # One open issue per object, commented on every repeat: seventeen hours of the same failure
      # is one row on the board, not a hundred. The title is the dedupe key, so it may not carry
      # the message or the revision.
      - name: a red reconcile is a P0 on the board, not a green run nobody opens
        if: steps.receipt.outputs.severity == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          # crew#307, 2026-08-28: this job has no checkout, and `gh` with no repository to infer
          # exits `fatal: not a git repository`. Every gh call below died there, so the alarm
          # detected the red and opened nothing -- and the step's own `exit 1` painted the run red
          # anyway, so it looked from outside exactly like an alarm that worked. Run 33163766050
          # caught `HelmRelease/robusta/robusta status: 'Failed'` at 10:32:53Z and filed no issue.
          # GH_REPO names it once for the whole step, so a gh call added later cannot forget.
          GH_REPO: ${{ github.repository }}
          OBJECT: ${{ steps.receipt.outputs.object }}
          REVISION: ${{ steps.receipt.outputs.revision }}
          MESSAGE: ${{ steps.receipt.outputs.message }}
          SIGNATURE: ${{ steps.receipt.outputs.signature }}
        run: |
          title="P0: Flux cannot reconcile $OBJECT"
          marker="flux-signature: $(printf '%s' "$SIGNATURE" | sha256sum | cut -c1-16)"
          body=$(printf '%s\n\nobject: %s\nrevision: %s\nrun: %s/%s/actions/runs/%s\n\n%s\n\nThe cluster is not running what main says. Until this closes, every check that reads the live estate is grading an older revision.\n' \
            "$MESSAGE" "$OBJECT" "$REVISION" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" "$marker")
          # An open issue already carrying this signature is THIS fire, whichever object first hit
          # it. The marker is matched here rather than in a search query: GitHub does not index a
          # hex string reliably, and the open P0 list is tens of rows.
          n=$(gh issue list --state open --label P0 --limit 100 --json number,body \
                -q "[.[] | select(.body != null and (.body | contains(\"$marker\")))] | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$(printf 'Same fire, reached %s: %s\n\nrun: %s/%s/actions/runs/%s\n' \
              "$OBJECT" "$MESSAGE" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
          else
            gh label create P0 --color B60205 --description "service down for the founder" --force >/dev/null 2>&1 || true
            gh issue create --title "$title" --label P0 --body "$body"
          fi
          echo "::error::$OBJECT $MESSAGE"

      # The recovery event is the only thing that closes it, so the board tracks the cluster and
      # never a session's opinion of the cluster. "Health check passed" and nothing weaker: the
      # stalled rollout emitted an info "Deployment/backstage/catalogue configured" five minutes
      # before it timed out again (flux-events 33157844551 -> 33158187251). Applied is not healthy.
      - name: a healthy reconcile closes the P0 it opened
        if: steps.receipt.outputs.severity == 'info' && contains(steps.receipt.outputs.message, 'Health check passed')
        env:
          GH_TOKEN: ${{ github.token }}
          # crew#307, 2026-08-28: this job has no checkout, and `gh` with no repository to infer
          # exits `fatal: not a git repository`. Every gh call below died there, so the alarm
          # detected the red and opened nothing -- and the step's own `exit 1` painted the run red
          # anyway, so it looked from outside exactly like an alarm that worked. Run 33163766050
          # caught `HelmRelease/robusta/robusta status: 'Failed'` at 10:32:53Z and filed no issue.
          # GH_REPO names it once for the whole step, so a gh call added later cannot forget.
          GH_REPO: ${{ github.repository }}
          OBJECT: ${{ steps.receipt.outputs.object }}
          REVISION: ${{ steps.receipt.outputs.revision }}
          MESSAGE: ${{ steps.receipt.outputs.message }}
          SIGNATURE: ${{ steps.receipt.outputs.signature }}
        run: |
          title="P0: Flux cannot reconcile $OBJECT"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)
          # An object folded into another object's issue has no issue of its own. Closing on the
          # first recovery is deliberate: folded objects share the root cause, and if one is still
          # burning its next error event finds no open issue carrying the signature and opens a
          # fresh one. A row that reopens beats a row that sits open and stale (LAW 28).
          if [ -z "$n" ]; then
            marker="flux-signature: $(printf '%s' "$SIGNATURE" | sha256sum | cut -c1-16)"
            n=$(gh issue list --state open --label P0 --limit 100 --json number,body \
                  -q "[.[] | select(.body != null and (.body | contains(\"$marker\")))] | .[0].number // empty")
          fi
          [ -n "$n" ] || exit 0
          gh issue close "$n" --comment "$(printf 'Recovered at revision %s: %s\n\nrun: %s/%s/actions/runs/%s\n' "$REVISION" "$MESSAGE" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
