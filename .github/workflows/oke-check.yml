# crew#227 CP2: the platform is checked by a machine identity, not by a key on a laptop.
# The job's GitHub OIDC token is exchanged for a one-hour OCI session token that impersonates the
# service user estate-ci (identity propagation trust `github-actions-estate`, created by
# bin/idp-oci-bootstrap). No OCI API key exists for this path. Residual static credentials on
# this path, listed so nobody pretends otherwise: the OIDC client secret (the trust's own
# credential) and the S3 customer secret key for the state bucket (OpenTofu 1.12's S3 backend
# cannot take a session token). Both are GitHub repository secrets, scoped to this repo.
name: oke-check
on:
  schedule:
    - cron: "17 6 * * *"   # daily; crew#220 drill row
  workflow_dispatch:
    inputs:
      mode:
        description: "check (plan, drift = FAIL), apply (crew#289: the STAGED node-pool change, refused by main.tf above node_pool.budget_monthly_usd), or surge-node (crew#516: apply, then replace the one node so a new boot volume or shape takes effect; every pod restarts once), or surge-finish (the surge's second half when its Ready gate went blind, run 33101801971: delete the old node once the receipt shows the new one Ready). Never from a laptop (crew#247)."
        type: choice
        options: [check, apply, surge-node, surge-finish, break-glass]
        default: check
      playbook:
        description: "break-glass only (crew#539): the one named playbook bin/idp-oke-break-glass runs while the runner's /32 is admitted to the API endpoint through tofu; the list is restored on every exit path. diagnose and architect-doctor are read-only."
        type: choice
        options: [diagnose, architect-doctor, cilium-unchain, cilium-replace, helm-retry, dns-per-node, dns-per-namespace, tcp-per-node, node-drain, node-uncordon, chi-resize, catalogue-roll]
        default: diagnose
  pull_request:
    paths: [".github/workflows/oke-check.yml", "bin/idp-oci-login", "bin/idp-oke-rebuild", "bin/idp-login-drill", "bin/idp-cluster-state", "bin/idp-kini-state", "bin/idp-telemetry-coverage", "platform/oci/**", "platform/state/**", "platform/temporal/kini-state.yaml", "platform/observability/telemetry-coverage.yaml", "bin/idp-science-facts", "platform/science/**"]
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
# crew#516 CP4: one group per event. GitHub keeps one PENDING run per group, so every pull_request
# push displaced the queued apply dispatch (33089051005, 33091098027 both cancelled, never ran).
# check runs are read-only plans; the apply dispatch serialises only against other dispatches.
concurrency:
  group: "oke-check-${{ github.event_name }}"
  cancel-in-progress: false
jobs:
  check:
    # A dependabot pull request gets no repository secrets, so OIDC_CLIENT_IDENTIFIER is empty and
    # the job fails at the credentials step (run 32979902578, PR #113). The plan is graded on the
    # next human pull request; the scheduled run grades drift either way.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 25 for check/apply; surge-node waits up to ~65 min for the new node to be ACTIVE then Ready in the receipt (crew#516)
    timeout-minutes: ${{ inputs.mode == 'surge-node' && 90 || inputs.mode == 'break-glass' && 45 || 25 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: "1.12.6", tofu_wrapper: false }
      - uses: fluxcd/flux2/action@5350425cdcd5fa015337e09fa502153c0275bd4b # v2.4.0
      - name: oci cli
        run: pip install -q oci-cli
      - name: token exchange receipt (claims of the job token, and the domain's answer; never the tokens)
        env:
          OIDC: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          EP: ${{ vars.DOMAIN_BASE_URL }}
        run: |
          JWT=$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://cloud.oracle.com" | jq -r .value)
          printf '%s' "$JWT" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{iss,aud,sub,repository,ref,event_name}'
          PUB=$(openssl genrsa 2048 2>/dev/null | openssl rsa -pubout -outform DER 2>/dev/null | base64 -w0)
          curl -sS -o /tmp/x.json -w 'exchange http %{http_code}\n' -u "$OIDC" "$EP/oauth2/v1/token" \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange --data-urlencode requested_token_type=urn:oci:token-type:oci-upst \
            --data-urlencode public_key="$PUB" --data-urlencode subject_token="$JWT" --data-urlencode subject_token_type=jwt
          jq -c 'del(.token, .access_token, .id_token)' /tmp/x.json; rm -f /tmp/x.json
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-oke-rebuild --${{ inputs.mode || 'check' }}
        env:
          OCI_CI: "1"
          OKE_CHECK_EXPECT_CHANGES: ${{ github.event_name == 'pull_request' && '1' || '0' }}   # a PR's plan changes are the PR; drift only on schedule/dispatch
          OCI_CLI_AUTH: security_token   # every oci call in the run uses the exchanged session token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OKE_SSH_PUBKEY_TEXT: ${{ vars.OKE_SSH_PUBKEY }}
          OKE_ALLOWED_CIDRS: ${{ vars.OKE_ALLOWED_CIDRS }}
          BREAK_GLASS_PLAYBOOK: ${{ inputs.playbook || 'diagnose' }}   # crew#539: read by --break-glass only
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}   # platform/oci/langfuse.tf seeds the Langfuse login
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # bin/idp-drill-heartbeat reads login-drill runs; without it the row is BLIND (run 32988930880)
        run: bin/idp-oke-rebuild --${{ inputs.mode || 'check' }}
      # crew#267: the Flux GitRepository idp-writer needs githubAppInstallationID in the vault secret
      # github-app. This ran once from a founder laptop (bin/idp-github-app installation); now the
      # apply run does it with the same machine identity. Exit 2 is BLIND (App not installed yet).
      - name: bin/idp-github-app installation (crew#267)
        # always(): a red drill row in the rebuild step skipped this step in run 32988930880, so the
        # installation id never reached the vault and the ExternalSecret flux-system/github-app
        # could not render (crew#325). The rebuild verdict still fails the job on its own.
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/idp-github-app installation || { rc=$?; [ "$rc" = 2 ] && echo "BLIND   github-app has no installation yet; install the App on chidionyema and re-run apply" || exit "$rc"; }
      # crew#66 root trust (crew#577): the GitHub tokens workloads read (platform/github-app/token-consumers.json)
      # are installation tokens of the App, narrowed to a lane, re-minted here and hourly by
      # bin/idp-verify-drill; no PAT is ever pasted. Exit 2 is BLIND (App not installed yet).
      - name: bin/idp-github-app refresh (crew#577)
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/idp-github-app refresh || { rc=$?; [ "$rc" = 2 ] && echo "BLIND   github-app tokens not refreshed: no installation yet" || exit "$rc"; }
      # crew#516 CP5, founder's locked spec (crew#66 5451926212, Phase 2): platform/tailscale/policy.hujson
      # is git-tracked, applied here (no admin-console edit -- the no-toil rule). Exit 2 is BLIND
      # (vault entry or FOUNDER_MAC_USER not seeded yet).
      - name: bin/idp-tailscale-policy apply (crew#516 CP5)
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
        run: |
          bin/idp-tailscale-policy apply || { rc=$?; [ "$rc" = 2 ] && echo "BLIND   tailscale-policy has nothing to apply yet (see the line above)" || exit "$rc"; }
      # crew#163 residual / crew#345 box 3: a Mac has no OCI identity, so the job monitor's ping key
      # reaches it through the receipts bucket, encrypted to the Mac's age recipient, refreshed hourly.
      - name: bin/idp-hc-publish (crew#163)
        if: ${{ always() }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: |
          sudo apt-get install -y -q age >/dev/null
          bin/idp-hc-publish
      # crew#408: the identity domain's OIDC clients (front door, router console) and their vault
      # secrets are platform/oci/identity. Until this step it had no CI caller: bin/idp-identity-apply
      # ran from a laptop whose OCI session expires (crew#247, R26). The same machine identity plans
      # it on every check and applies it on apply; the rebuild step above rendered its remote state.
      - name: bin/idp-identity-apply ${{ inputs.mode == 'apply' && 'apply' || 'plan' }} (crew#408)
        if: ${{ always() }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          DOMAIN_BASE_URL: ${{ vars.DOMAIN_BASE_URL }}
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}
        run: |
          if [ "${{ inputs.mode }}" = apply ]; then bin/idp-identity-apply apply -auto-approve; else bin/idp-identity-apply plan; fi
      # crew#66 root trust (5453747447; crew#575, crew#576): every estate-born entry -- the router
      # master key, the Postgres passwords, the store's JWT signing key and internal keys, the MCP
      # gateway key, the cookie secret, Backstage's env, and the router keys hindsight and hermes
      # hold -- is minted here by the machine identity and kept when the vault already holds a
      # well-formed value. Vendor keys are bin/idp-bootstrap-vendors', never a SEED_* secret (crew#579).
      - name: bin/idp-estate-seed (crew#66 root trust)
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
        run: bin/idp-estate-seed

      # crew#516 CP4: the same door for The Architect's env (platform/hermes-agent). One vault entry,
      # hermes-agent-env, the env names the gateway reads; SEED_HERMES_* travel once and are deleted
      # after the put. crew#66 root trust: only configuration rides here (allowed users, home channel,
      # the auth store); the bot token, vendor keys, router key and GitHub token are born by
      # bin/idp-bootstrap-vendors, bin/idp-estate-seed and bin/idp-github-app refresh (crew#576, #577, #579).
      - name: bin/idp-vault-put hermes-agent-env (crew#516 CP4)
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.SEED_HERMES_TELEGRAM_ALLOWED_USER_IDS }}
          # crew#516 CP4 (receipt 33116314460, "Unauthorized user ... on telegram"): hermes-agent reads
          # TELEGRAM_ALLOWED_USERS (gateway/run.py); the cockpit reads TELEGRAM_ALLOWED_USER_IDS. Both carry the one value.
          TELEGRAM_ALLOWED_USERS: ${{ secrets.SEED_HERMES_TELEGRAM_ALLOWED_USER_IDS }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.SEED_HERMES_TELEGRAM_HOME_CHANNEL }}
          HERMES_AUTH_JSON: ${{ secrets.SEED_HERMES_AUTH_JSON }}
        run: |
          keys=TELEGRAM_ALLOWED_USER_IDS,TELEGRAM_ALLOWED_USERS,TELEGRAM_HOME_CHANNEL,HERMES_AUTH_JSON
          any=0; for k in ${keys//,/ }; do [ -n "${!k:-}" ] && any=1; done
          [ "$any" = 1 ] || { echo "n/a     hermes-agent-env   no SEED_HERMES_* secrets set; the vault keeps what it holds"; exit 0; }
          umask 077; f=$(mktemp)
          env | grep -E "^(${keys//,/|})=" > "$f"
          args=""; for k in ${keys//,/ }; do args="$args $k=$k"; done
          ESTATE_ENV_FILE="$f" bin/idp-vault-put --merge hermes-agent-env $args
          rm -f "$f"

      # crew#539 CP4: the Cluster Autoscaler's node pool id, found by name after the apply, so the
      # row platform/oci/autoscaler never carries an OCID. Exit 2 is BLIND (no ACTIVE pool yet).
      - name: bin/idp-autoscaler-seed (crew#539 CP4)
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_CLUSTER_NAME: ${{ vars.OCI_CLUSTER_NAME || 'estate' }}
        run: |
          bin/idp-autoscaler-seed || { rc=$?; [ "$rc" = 2 ] && echo "BLIND   oke-autoscaler   no ACTIVE pool yet; the vault keeps what it holds" || exit "$rc"; }

  # crew#292 CP4: the in-cluster chaos experiment leaves a receipt in Object Storage; this reads
  # it with the same machine identity and grades its age. A runner has no kube path, so the
  # receipt is the only door. Never on pull_request: the live door is not what a PR changes.
  chaos-drill:
    # crew#307: a drill never waits on another job. With `needs: check` every tofu red skipped
    # this job and the skip read as green. It runs whether check passed, failed or never ran.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-chaos-drill
        env:
          OCI_CLI_AUTH: security_token   # every oci call in the run uses the exchanged session token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-chaos-drill

  # crew#539 DoD 2: the in-cluster page drill (platform/chaos/langfuse-alert-drill.yaml) fails
  # langfuse-web for 8 minutes and writes whether FounderSurfaceDown fired and Telegram was sent.
  # Same door as chaos-drill: the receipt, read with the machine identity, never a kube path.
  alert-drill:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-chaos-drill langfuse-alert-drill alert-drill
        env:
          OCI_CLI_AUTH: security_token   # every oci call in the run uses the exchanged session token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-chaos-drill langfuse-alert-drill alert-drill

  free-tier:
    # crew#488 CP3: the Always Free allowance, asked of the limits API every day and graded
    # against platform/oci/variables.tf. OCI halved it once (ADR 0004); this is where the next
    # cut shows first. Never waits on check, like every drill (crew#307).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-free-tier --json
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: bin/idp-free-tier --json

  cluster-state:
    # crew#345: the cluster's own state receipt (platform/state), read with the runner's OIDC
    # session. This is the substitute for `oci session authenticate` on a laptop: any session that
    # wants the cluster state dispatches this workflow and reads the job log. Never waits on check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-cluster-state --json
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-cluster-state --json
      # crew#401 CP4: the hostnames the cluster publishes (HTTPRoute, from the same receipt) diffed
      # against backstage/**/catalog-info.yaml. 0 unregistered is the only green.
      - name: bin/idp-catalogue-drift
        if: ${{ always() }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-catalogue-drift
      # crew#439: an open pull request armed for auto-merge that will never merge on its own is a
      # red row, so a stuck flux/image-updates PR never sits silent again. crew#516 widened it from
      # `mergeable` to the blocking reason: idp#486 was armed and MERGEABLE for twelve hours behind
      # a security-scan that had already concluded red, and every estate image stayed frozen.
      - name: bin/idp-automerge-stuck
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/idp-automerge-stuck

  founder-links:
    # crew#503 / LAW 43: every link the portal home shows (backstage/founder/catalog-info.yaml,
    # zone substituted the way bin/catalog-gen does it) is probed by lychee, the mature link
    # checker, on every run. 302 to IDCS, 401 (mcp, key-gated) and 405 (POST-only chat endpoint)
    # are the surfaces answering as designed; anything else is a red row within one schedule tick.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: urls with the zone substituted
        run: |
          set -euo pipefail
          zone=$(awk '$1=="ESTATE_ZONE:"{print $2}' clusters/oke/estate-config.yaml)
          test -n "$zone"
          grep -oE 'url: "https?://[^"]+"' backstage/founder/catalog-info.yaml \
            | sed -E 's/^url: "(.*)"$/\1/' | sed "s/\${ESTATE_ZONE}/$zone/g" | sort -u > founder-links.txt
          if grep -q '\${' founder-links.txt; then echo "unsubstituted placeholder"; cat founder-links.txt; exit 1; fi
          echo "$(wc -l < founder-links.txt) links"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-redirects 5 --accept '200..=399,401,405' --timeout 20 --retry-wait-time 5 --max-retries 2 --exclude 'github.com/chidionyema/mumchimp-medusa' founder-links.txt
          # mumchimp-medusa is private; this repo's token cannot read it, the founder's browser can.
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
      # the default GITHUB_TOKEN reads Actions runs of public estate repos; private ones need the estate token, crew#535 CP2b
      - name: actions-refused (crew#535)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bin/idp-actions-refused --limit 5 | tee -a "$GITHUB_STEP_SUMMARY" || true

  kini-state:
    # crew#396 step 4: the KINI run's receipt (platform/temporal/kini-state.yaml), read the same
    # way cluster-state is. Green while the last run is green, running, or never started; red when
    # a checkpoint is red or the receipt is stale. Never waits on check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
