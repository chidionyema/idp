# crew#227 CP2: the platform is checked by a machine identity, not by a key on a laptop.
# The job's GitHub OIDC token is exchanged for a one-hour OCI session token that impersonates the
# service user estate-ci (identity propagation trust `github-actions-estate`, created by
# bin/idp-oci-bootstrap). No OCI API key exists for this path. Residual static credentials on
# this path, listed so nobody pretends otherwise: the OIDC client secret (the trust's own
# credential) and the S3 customer secret key for the state bucket (OpenTofu 1.12's S3 backend
# cannot take a session token). Both are GitHub repository secrets, scoped to this repo.
name: oke-check
on:
  schedule:
    - cron: "17 6 * * *"   # daily; crew#220 drill row
  workflow_dispatch:
    inputs:
      mode:
        description: "check (plan, drift = FAIL) or apply (crew#289: the STAGED node-pool change, refused by main.tf above node_pool.budget_monthly_usd). Never from a laptop (crew#247)."
        type: choice
        options: [check, apply]
        default: check
  pull_request:
    paths: [".github/workflows/oke-check.yml", "bin/idp-oci-login", "bin/idp-oke-rebuild", "bin/idp-login-drill", "bin/idp-cluster-state", "bin/idp-kini-state", "bin/idp-telemetry-coverage", "platform/oci/**", "platform/state/**", "platform/temporal/kini-state.yaml", "platform/observability/telemetry-coverage.yaml"]
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
concurrency: { group: oke-check, cancel-in-progress: false }
jobs:
  check:
    # A dependabot pull request gets no repository secrets, so OIDC_CLIENT_IDENTIFIER is empty and
    # the job fails at the credentials step (run 32979902578, PR #113). The plan is graded on the
    # next human pull request; the scheduled run grades drift either way.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with: { tofu_version: "1.12.6", tofu_wrapper: false }
      - uses: fluxcd/flux2/action@5350425cdcd5fa015337e09fa502153c0275bd4b # v2.4.0
      - name: oci cli
        run: pip install -q oci-cli
      - name: token exchange receipt (claims of the job token, and the domain's answer; never the tokens)
        env:
          OIDC: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          EP: ${{ vars.DOMAIN_BASE_URL }}
        run: |
          JWT=$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://cloud.oracle.com" | jq -r .value)
          printf '%s' "$JWT" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{iss,aud,sub,repository,ref,event_name}'
          PUB=$(openssl genrsa 2048 2>/dev/null | openssl rsa -pubout -outform DER 2>/dev/null | base64 -w0)
          curl -sS -o /tmp/x.json -w 'exchange http %{http_code}\n' -u "$OIDC" "$EP/oauth2/v1/token" \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange --data-urlencode requested_token_type=urn:oci:token-type:oci-upst \
            --data-urlencode public_key="$PUB" --data-urlencode subject_token="$JWT" --data-urlencode subject_token_type=jwt
          jq -c 'del(.token, .access_token, .id_token)' /tmp/x.json; rm -f /tmp/x.json
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-oke-rebuild --${{ inputs.mode || 'check' }}
        env:
          OCI_CI: "1"
          OKE_CHECK_EXPECT_CHANGES: ${{ github.event_name == 'pull_request' && '1' || '0' }}   # a PR's plan changes are the PR; drift only on schedule/dispatch
          OCI_CLI_AUTH: security_token   # every oci call in the run uses the exchanged session token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OKE_SSH_PUBKEY_TEXT: ${{ vars.OKE_SSH_PUBKEY }}
          OKE_ALLOWED_CIDRS: ${{ vars.OKE_ALLOWED_CIDRS }}
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}   # platform/oci/langfuse.tf seeds the Langfuse login
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # bin/idp-drill-heartbeat reads login-drill runs; without it the row is BLIND (run 32988930880)
        run: bin/idp-oke-rebuild --${{ inputs.mode || 'check' }}
      # crew#267: the Flux GitRepository idp-writer needs githubAppInstallationID in the vault secret
      # github-app. This ran once from a founder laptop (bin/idp-github-app installation); now the
      # apply run does it with the same machine identity. Exit 2 is BLIND (App not installed yet).
      - name: bin/idp-github-app installation (crew#267)
        # always(): a red drill row in the rebuild step skipped this step in run 32988930880, so the
        # installation id never reached the vault and the ExternalSecret flux-system/github-app
        # could not render (crew#325). The rebuild verdict still fails the job on its own.
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/idp-github-app installation || { rc=$?; [ "$rc" = 2 ] && echo "BLIND   github-app has no installation yet; install the App on chidionyema and re-run apply" || exit "$rc"; }
      # crew#408: the identity domain's OIDC clients (front door, router console) and their vault
      # secrets are platform/oci/identity. Until this step it had no CI caller: bin/idp-identity-apply
      # ran from a laptop whose OCI session expires (crew#247, R26). The same machine identity plans
      # it on every check and applies it on apply; the rebuild step above rendered its remote state.
      - name: bin/idp-identity-apply ${{ inputs.mode == 'apply' && 'apply' || 'plan' }} (crew#408)
        if: ${{ always() }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          DOMAIN_BASE_URL: ${{ vars.DOMAIN_BASE_URL }}
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}
        run: |
          if [ "${{ inputs.mode }}" = apply ]; then bin/idp-identity-apply apply -auto-approve; else bin/idp-identity-apply plan; fi
      # crew#325: the model-routing row reads one JSON vault secret, litellm-upstream. trace-drill run
      # 33007689530 found the ACTIVE secret holding a raw value, not the envelope, so ExternalSecret
      # llm/litellm-upstream cannot extract it. The values live only on the operator's laptop, which
      # has no OCI identity (crew#227), so they travel once as SEED_* GitHub secrets, the same machine
      # identity puts them, and the SEED_* secrets are deleted after the put. With none set: n/a.
      - name: bin/idp-vault-put litellm-upstream (crew#325)
        if: ${{ always() && inputs.mode == 'apply' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          MINIMAX_API_KEY: ${{ secrets.SEED_MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.SEED_DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.SEED_OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEED_GEMINI_API_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.SEED_LITELLM_MASTER_KEY }}
        run: |
          [ -n "$LITELLM_MASTER_KEY" ] || { echo "n/a     litellm-upstream   no SEED_* secrets set; the vault keeps what it holds"; exit 0; }
          umask 077; f=$(mktemp)
          env | grep -E '^(MINIMAX_API_KEY|DEEPSEEK_API_KEY|OPENROUTER_API_KEY|GEMINI_API_KEY|LITELLM_MASTER_KEY)=' > "$f"
          ESTATE_ENV_FILE="$f" bin/idp-vault-put litellm-upstream MINIMAX_API_KEY=MINIMAX_API_KEY DEEPSEEK_API_KEY=DEEPSEEK_API_KEY OPENROUTER_API_KEY=OPENROUTER_API_KEY GEMINI_API_KEY=GEMINI_API_KEY LITELLM_MASTER_KEY=LITELLM_MASTER_KEY
          rm -f "$f"

  # crew#292 CP4: the in-cluster chaos experiment leaves a receipt in Object Storage; this reads
  # it with the same machine identity and grades its age. A runner has no kube path, so the
  # receipt is the only door. Never on pull_request: the live door is not what a PR changes.
  chaos-drill:
    # crew#307: a drill never waits on another job. With `needs: check` every tofu red skipped
    # this job and the skip read as green. It runs whether check passed, failed or never ran.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-chaos-drill
        env:
          OCI_CLI_AUTH: security_token   # every oci call in the run uses the exchanged session token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-chaos-drill

  cluster-state:
    # crew#345: the cluster's own state receipt (platform/state), read with the runner's OIDC
    # session. This is the substitute for `oci session authenticate` on a laptop: any session that
    # wants the cluster state dispatches this workflow and reads the job log. Never waits on check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-cluster-state --json
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-cluster-state --json
      # crew#401 CP4: the hostnames the cluster publishes (HTTPRoute, from the same receipt) diffed
      # against backstage/**/catalog-info.yaml. 0 unregistered is the only green.
      - name: bin/idp-catalogue-drift
        if: ${{ always() }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-catalogue-drift
      # crew#439: an open pull request armed for auto-merge that is not MERGEABLE is a red row, so a
      # conflicting flux/image-updates PR never sits silent again.
      - name: bin/idp-automerge-stuck
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/idp-automerge-stuck

  kini-state:
    # crew#396 step 4: the KINI run's receipt (platform/temporal/kini-state.yaml), read the same
    # way cluster-state is. Green while the last run is green, running, or never started; red when
    # a checkpoint is red or the receipt is stale. Never waits on check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-kini-state --json
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-kini-state --json

  telemetry-coverage:
    # crew#320 / LAW 50: coverage is a backend query, never a file scan. The cluster diffs Running
    # pods against pods seen in ClickHouse (platform/observability/telemetry-coverage.yaml) and this
    # reads the receipt the same way cluster-state does. missing=0 is the only green.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: oci cli
        run: pip install -q oci-cli
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-telemetry-coverage --json
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: bin/idp-telemetry-coverage --json
