# button: Salvage uncommitted work from the founder's Mac
# founder: When the screen is dead, this workflow reaches the Mac over the tailnet through the
#   hermes-agent pod's mac-run bridge, commits any dirty state on a timestamped branch, and pushes.
#   Nothing here moves keys, age files or OCI credentials off the Mac (LAW 21). The only thing that
#   leaves the Mac is git objects, over the Mac's own gh/git-over-ssh identity.
#
# Two knobs:
#   probe_only=true  → only run `hostname && whoami && uptime && date -u` on the Mac; do not
#                      touch any repo. Use this first to confirm the Mac is reachable at all.
#   target_dirs      → the checkouts to salvage, space-separated. Blank asks the Mac to
#                      `find $HOME -maxdepth 6 -type d -name .git` and use whatever it returns
#                      (LAW 46: no checkout path is named in this file).
#
# Exit shape mirrors other workflows: a red probe step is the Mac being asleep/off-tailnet/sshd-off
# or the vault key not synced; the run summary carries the exact mac-run stderr so the founder can
# tell which one from his phone.
name: mac-salvage
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: "Only probe hostname/whoami/uptime; do not commit or push anything"
        type: boolean
        default: false
      target_dirs:
        description: "Space-separated repo dirs on the Mac to salvage (leave blank to discover every .git under HOME)"
        default: ""
      branch_prefix:
        description: "Branch name prefix for the WIP commit"
        default: "salvage"
      reason:
        description: "Why (one line, kept in the run record)"
        required: true
        default: "broken screen; salvage uncommitted work"
permissions:
  id-token: write
  contents: read
concurrency:
  group: mac-salvage
  cancel-in-progress: false
jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every kubectl step below auths to the OKE API through the oci exec plugin (the kubeconfig
    # bin/idp-cloud minted carries `command: oci`), so OCI_CLI_AUTH and the session-token
    # environment must be present for the plugin, not just for the mint step (run 35129740693:
    # kubectl blocked at "exec: executable oci failed with exit code 1" until this landed here).
    env:
      OCI_CLI_AUTH: security_token
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt

      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt

      - name: kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}

      - name: Mint kubeconfig for the estate cluster
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_CLUSTER_NAME: ${{ vars.OCI_CLUSTER_NAME || 'estate' }}
        run: |
          set -euo pipefail
          cl=$(bin/idp-cloud cluster list)
          cid=$(printf '%s\n' "$cl" | awk -v n="$OCI_CLUSTER_NAME" '$1==n{print $2; exit}')
          [ -n "$cid" ] || { echo "no ACTIVE cluster named $OCI_CLUSTER_NAME; ACTIVE: $(printf '%s\n' "$cl" | awk '{print $1}' | paste -sd, -)"; exit 1; }
          mkdir -p "$HOME/.kube"
          bin/idp-cloud cluster kubeconfig "$cid" --file "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Confirm hermes-agent pod is ready
        run: |
          set -euo pipefail
          kubectl -n hermes-agent get deploy hermes-agent-gateway
          kubectl -n hermes-agent rollout status deploy/hermes-agent-gateway --timeout=60s

      - name: Probe the Mac over mac-run
        id: probe
        run: |
          set -uo pipefail
          out=$(kubectl -n hermes-agent exec deploy/hermes-agent-gateway -- \
                mac-run 'hostname && whoami && uptime && date -u && df -h ~ | tail -1' 2>&1)
          rc=$?
          printf '%s\n' "$out"
          {
            echo '### probe (rc='"$rc"')'
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "probe failed: the Mac is not answering mac-run. Common causes: Mac asleep, off the tailnet, sshd stopped, or the vault key not synced (see skills/founder-mac)."
            exit "$rc"
          fi

      - name: Salvage each target dir
        if: ${{ inputs.probe_only != true }}
        env:
          TARGET_DIRS: ${{ inputs.target_dirs }}
          BRANCH_PREFIX: ${{ inputs.branch_prefix }}
          REASON: ${{ inputs.reason }}
        run: |
          set -uo pipefail
          stamp=$(date -u +%Y%m%d-%H%M%S)
          # The remote script runs on the Mac via `mac-run 'bash -s' -- $dir $stamp $prefix $reason`.
          # Kept in a file so nothing here relies on nested-heredoc indentation surviving YAML
          # -> bash -> ssh -> bash quoting.
          script="$RUNNER_TEMP/mac-salvage-remote.sh"
          cat >"$script" <<'REMOTE'
          #!/usr/bin/env bash
          set -uo pipefail
          d="$1"; stamp="$2"; prefix="$3"; reason="$4"
          case "$d" in "~/"*) d="$HOME/${d#~/}";; "~") d="$HOME";; esac
          echo "=== $d ==="
          if [ ! -d "$d/.git" ]; then
            echo "skip: $d has no .git directory"
            exit 0
          fi
          cd "$d"
          echo "-- git status --"
          git status --porcelain=v1 --branch
          echo "-- untracked file count --"
          git ls-files --others --exclude-standard | wc -l
          echo "-- git diff --stat (tracked changes) --"
          git diff --stat
          if [ -z "$(git status --porcelain)" ]; then
            echo "clean: nothing to salvage in $d"
            exit 0
          fi
          base=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo detached)
          br="${prefix}/${base}-${stamp}"
          echo "-- creating branch $br --"
          git checkout -b "$br"
          git add -A
          git -c user.name="hermes mac-salvage" -c user.email="hermes-agent@users.noreply.github.com" \
              commit -m "salvage: WIP from broken-screen Mac ($reason)" \
                     -m "Snapshot on branch $br from $base at ${stamp}Z."
          echo "-- pushing $br --"
          git push -u origin "$br"
          echo "ok: $d salvaged to $br"
          REMOTE
          # Strip the 10-space indent YAML forced us to keep so the file stays valid bash.
          sed -i 's/^          //' "$script"
          if [ -z "${TARGET_DIRS// }" ]; then
            echo "no target_dirs given; asking the Mac for every git checkout under HOME"
            TARGET_DIRS=$(kubectl -n hermes-agent exec deploy/hermes-agent-gateway -- \
              mac-run 'find "$HOME" -maxdepth 6 -type d -name .git 2>/dev/null | sed "s#/\.git\$##" | sort -u' 2>&1 \
              | grep -v "^mac-run:" || true)
            echo "discovered:"
            printf '  %s\n' $TARGET_DIRS
          fi
          overall=0
          logf="$RUNNER_TEMP/salvage-$stamp.log"
          : > "$logf"
          for d in $TARGET_DIRS; do
            {
              printf '\n########## %s ##########\n' "$d"
              kubectl -n hermes-agent exec -i deploy/hermes-agent-gateway -- \
                mac-run "bash -s -- '$d' '$stamp' '$BRANCH_PREFIX' '$REASON'" <"$script"
            } 2>&1 | tee -a "$logf" || overall=$?
          done
          {
            echo '### salvage log'
            echo '```'
            cat "$logf"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$overall"
