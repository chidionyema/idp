# button: Check what Otto can do
# founder: Runs every advertised Otto ability for real and reports each as a green or red row.
# crew#561 CP7: "Otto can do X" is a green row on a schedule, not a sentence in an issue. This is
# the otto-parity playbook of bin/idp-oke-break-glass: both Ottos (@Ottototbot via otto-gateway ->
# hermes-agent, @numun_bot via otto-golden) and every layer under them (Flux rows, router, bus,
# memory, the door, Telegram's own webhook verdict, the in-cluster answer probe).
#
# SLA (founder 2026-09-29, "need strict slas"): graded every 15 minutes; the first red tick and the
# recovery each reach the founder on Telegram with the rows that broke. Until 2026-09-28 this ran
# through `idp-oke-rebuild --break-glass` (an OpenTofu apply to open the API endpoint) and every run
# went red on "no kube path" -- 24 red runs a day that graded nothing. The kubeconfig is now minted
# the way op-verify mints it (bin/idp-cloud, OCID or name), with no infrastructure write at all.
name: otto-parity
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  actions: read
concurrency:
  group: otto-parity
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-24.04
    # idp#7354 (2026-10-29): the job timeout was 15 minutes and the playbook needed longer than
    # that against a dark cluster -- every kubectl call waited out a 60s request timeout -- so
    # GitHub CANCELLED the job and the tick concluded `cancelled`, measuring nothing (runs
    # #40715893797..#40792186310). The job timeout is now LONGER than the playbook's own wall
    # clock (PARITY_WALL_CLOCK_S, 780s) plus the kill grace (30s), so the inner `timeout` fires
    # first and the tick ends with a conclusion and a log -- red, but honest -- instead of being
    # cancelled. 25 minutes = 1500s > 780 + 30 = 810s, with room for the mint step above.
    timeout-minutes: 25
    env:
      OCI_CLI_AUTH: security_token
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      # How long ONE kubectl call may take. 20s, not the script's 60s default: the playbook has
      # ~30 rows, and 60s each is how a dark estate turned this tick into a cancellation.
      KUBECTL_REQUEST_TIMEOUT: 20s
      # The playbook's own budget: it stops starting new rows when this is spent and grades the
      # rest BLIND (unmeasured), so it concludes on its own before the wall clock below.
      PARITY_BUDGET_S: 600
      # The wall clock around the playbook. The inner `timeout` is the backstop: if the playbook
      # has NOT concluded by then, it is killed and the tick is red with the reason, not
      # cancelled by GitHub.
      PARITY_WALL_CLOCK_S: 780
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: Mint kubeconfig
        env:
          OCI_CLUSTER_NAME: ${{ vars.OCI_CLUSTER_NAME || 'estate' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          bin/idp-cloud cluster kubeconfig "$OCI_CLUSTER_NAME" --file "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
      - name: otto-parity playbook
        id: parity
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=30s "${PARITY_WALL_CLOCK_S}" bin/idp-oke-break-glass otto-parity | tee "$RUNNER_TEMP/parity.log"; rc=${PIPESTATUS[0]}
          # 124 = the wall clock fired, 137 = the kill grace fired. Either way the playbook did
          # NOT conclude, so the rows are unmeasured: say so in the log and in the summary, and
          # end the tick red. A red tick that says "unmeasured" is a signal; a cancelled tick
          # is silence that the SLA reads as a run.
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "BLIND playbook-wall-clock  the playbook did not conclude within ${PARITY_WALL_CLOCK_S}s; the rows above are unmeasured" | tee -a "$RUNNER_TEMP/parity.log"
            rc=1
          fi
          { echo "## otto-parity"; echo '```'; cat "$RUNNER_TEMP/parity.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo "red<<EOF"; grep -E '^(FAIL|BLIND) ' "$RUNNER_TEMP/parity.log" | cut -c1-140 | head -25; echo "EOF"; } >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: previous tick's verdict
        if: ${{ always() }}
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow otto-parity.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          echo "prev=$prev"; echo "conclusion=$prev" >> "$GITHUB_OUTPUT"
      - name: telegram on breach and on recovery
        if: ${{ always() && ((steps.parity.outcome != 'success' && steps.prev.outputs.conclusion != 'failure') || (steps.parity.outcome == 'success' && steps.prev.outputs.conclusion == 'failure')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.SEED_HERMES_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.SEED_HERMES_TELEGRAM_HOME_CHANNEL }}
          RED: ${{ steps.parity.outputs.red }}
          OUTCOME: ${{ steps.parity.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$OUTCOME" = success ]; then
            text="🟢 Otto SLA: both Ottos and every layer under them are green again"$'\n'"$RUN_URL"
          else
            text="🔴 Otto SLA breached"$'\n'"${RED:-the cluster could not be read}"$'\n'"$RUN_URL"
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT}" --data-urlencode "text=${text}")
          echo "telegram sendMessage $code"
          test "$code" = 200
