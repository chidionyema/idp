# portal-app, in a workflow of its own (2026-10-08, chidionyema/idp#5513).
#
# It was a job inside ci.yml. It is not a required check (platform/github/
# ruleset.idp.required-checks.json), but the Greenlane ticks on `workflow_run` of `ci` COMPLETING
# (.github/workflows/greenlane.yml), and a workflow run completes only when its slowest job does.
# portal-app -- yarn install, tsc, lint, the app's tests, two Playwright browsers -- was that job:
# measured on queue/b1990 (run 37798166235) it held ci open 15+ minutes after ci-success had
# already gone green, and the batch could not land until it finished. Here it reports the same
# `portal-app` check on the same events, and ci completes when its own jobs do.
#
# Triggers and concurrency are ci.yml's, unchanged, so the job runs exactly where it ran before.
# The gate jobs keep the 60 s pre-gate in front of the heavy install (ci.yml's fast-gate and
# verifier, the same reusable workflows) under job ids that do not reuse ci's: a job named
# `fast-gate` here would publish a second `fast-gate / fast-gate` check -- a required context --
# from a workflow that is not the one the ruleset means.
name: portal-app
on:
  pull_request:
  merge_group:
  push:
    branches: [main, queue/**]
concurrency:
  # ci.yml's rule and reasons: superseded on a branch, never on main (every main sha keeps its run).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  gate:
    uses: ./.github/workflows/fast-gate.yml
  verify:
    uses: ./.github/workflows/verifier.yml

  # crew#459, 2026-08-31. The portal's own test suite was run by nothing. Every workflow that
  # mentions backstage grades the *running* one -- verdict-backstage proves the deployed pod,
  # login-drill signs in to it, build-multiarch builds the image -- and the image build runs
  # `yarn tsc` and `yarn build:all`, never `yarn test`. So a unit test under packages/app was an
  # instrument nobody reads (LAW 28): it could only ever go red on a laptop, and only if someone
  # remembered to run it. The colour-contrast guard added with this job is exactly the kind of
  # defect a type-check and a build cannot see -- every state border in the portal failed WCAG
  # 2.2 SC 1.4.11 for months while CI was green -- so the guard is worth nothing without a lane
  # that runs it. Only on changes under backstage/: the install is the slow part and nothing else
  # in the repository can move these tests.
  portal-build:
    # Runs on pull requests (2026-09-27): skipped there, no compiler read a PR's .tsx before it
    # merged (PR #4467). Required, through `portal-app` below (ruleset.idp.required-checks.json,
    # chidionyema/idp#5600): #5587 landed with this red. Only installs when backstage/ changed, so
    # other lanes get an instant green job.
    needs: [gate, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # `repo lint --since origin/main` and `repo test` diff the base
      - name: did this change touch the portal at all
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # 2026-10-14: every queue/<batch> push CREATES its branch, so `before` was all zeros on
          # every candidate and the "instant green job" above never happened where it matters: 14
          # of 14 batches since 10-12 ran the whole install (median 6.5 min, the batch's long pole)
          # whatever they changed. A candidate is built on main, so main is its base.
          case "$GITHUB_REF" in refs/heads/queue/*) base=$(git merge-base origin/main HEAD 2>/dev/null || true) ;; esac
          # a first push to any other branch reports an all-zero before-sha; grade the whole thing then
          case "$base" in ''|0000000000000000000000000000000000000000) echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if git diff --name-only "$base"...HEAD -- backstage/ .github/workflows/portal-app.yml sovereign/requirements.txt | grep -q .; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.touched.outputs.yes == 'true'
        with:
          # backstage/package.json declares engines.node "22 || 24" and the image is node:24.
          # Pinning the same major here means a green lane and a green image agree about the
          # runtime; the host's node 26 is outside that range on purpose.
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.touched.outputs.yes == 'true'
        with:
          # The face test re-derives backstage/packages/app/public/face/estate.glb by running
          # bin/estate-face-avatar --check, so this job needs the interpreter the generator runs
          # on. Without it the generator dies on `import numpy` and the test fails with a
          # ModuleNotFoundError rather than grading the asset (measured 2026-10-04, portal-app on
          # queue/b621). Same major as every other Python job here.
          python-version: "3.12"
      - name: numpy, for the avatar generator
        if: steps.touched.outputs.yes == 'true'
        run: pip install -q "numpy==1.26.4"   # the pin requirements-research.txt carries
      - name: yarn, the version package.json pins
        if: steps.touched.outputs.yes == 'true'
        run: corepack enable && corepack prepare yarn@4.13.0 --activate
      - name: install exactly what yarn.lock holds
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn install --immutable
      - name: type-check
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn tsc
      - name: lint
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn lint
      # faceEngine.test.ts re-derives public/face/estate.glb with `bin/estate-face-avatar --check`
      # to prove the shipped avatar is the one its generator authors. That generator imports numpy
      # (bin/estate-face-avatar line 54), and this job -- node only -- had no Python at all, so the
      # test died on `ModuleNotFoundError: No module named 'numpy'` and reported the traceback text
      # where it wanted "matches the generator". Measured 2026-10-04: `portal-app` was the only red
      # on the greenlane candidate queue/b638 (main 45d25b26900f + 11 lines that touch no portal
      # file), 1 failed / 552 passed, and a required check that cannot go green refuses every land
      # (GH013 on the main fast-forward). numpy is already declared at sovereign/requirements.txt:56
      # and installed this way by the `verifier` job that runs bin/idp-ci; this is the same door, not
      # a second one. The test itself is deliberately not made skippable -- a silently skipped check
      # is not a check, which is the remark at faceEngine.test.ts:94.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.touched.outputs.yes == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sovereign/requirements*.txt
      - name: the generator's Python (numpy), or the avatar check is a traceback
        if: steps.touched.outputs.yes == 'true'
        run: pip install -q -r sovereign/requirements.txt
      - name: the app's tests, including the contrast guard
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn test --ci --watchAll=false

  # The phone run, in a job of its own (2026-10-20, #6669). It was the tail of portal-build:
  # install, tsc, lint and the unit tests, THEN the browsers and the phone suite, one after the
  # other -- 269s and 286s on queue/b3296 and queue/b3298, ~320s of workflow against ci's ~220s, so
  # every batch that touched backstage/ waited on this workflow and on nothing else. The phone
  # suite reads none of that work: it drives the deployed portal (PLAYWRIGHT_URL, no webServer in
  # playwright.mobile.config.ts), so it waits on nothing but its own install. Side by side, the
  # long pole is the phone leg (~200s), not the sum.
  portal-phone:
    needs: [gate, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # the base diff below
      - name: did this change touch the portal at all
        id: touched
        run: |
          # portal-build's step, verbatim: both legs skip or run on the same answer.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$GITHUB_REF" in refs/heads/queue/*) base=$(git merge-base origin/main HEAD 2>/dev/null || true) ;; esac
          case "$base" in ''|0000000000000000000000000000000000000000) echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if git diff --name-only "$base"...HEAD -- backstage/ .github/workflows/portal-app.yml sovereign/requirements.txt | grep -q .; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.touched.outputs.yes == 'true'
        with:
          node-version: "24"   # portal-build's runtime, for the same reason
      # Only Playwright, not the app. Measured 2026-10-20 (queue/b3306): `yarn install --immutable`
      # was 72s of this job's 241s, installing the whole Backstage workspace for specs that import
      # nothing but `@playwright/test` (and node's fs/path) -- portal-build installs and tests the
      # app. Proven before the change: with only @playwright/test@1.62.1 in backstage/node_modules,
      # `playwright test --config playwright.mobile.config.ts --list` loads all 14 phone tests.
      # The version is read from yarn.lock, so the phone runs exactly the Playwright the lockfile
      # pins and the browser cache key below still rotates with it. Installed beside the checkout
      # and moved in, because `npm install` inside backstage/ would read its package.json and
      # install everything again.
      - name: install only the Playwright that yarn.lock pins
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: |
          set -euo pipefail
          v=$(awk '/^"@playwright\/test@/{f=1} f&&/^  version:/{print $2; exit}' yarn.lock)
          [ -n "$v" ] || { echo "no @playwright/test in yarn.lock"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pw" && echo '{"private":true}' > "$RUNNER_TEMP/pw/package.json"
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --no-package-lock "@playwright/test@$v"
          mv "$RUNNER_TEMP/pw/node_modules" node_modules
          node_modules/.bin/playwright --version

      # The founder tests /face and /fleet from a phone, and the estate had no mobile browser check,
      # so every mobile claim was a desktop measurement wearing a phone's name. The defect, measured
      # 2026-10-04 in a real browser: /fleet served the app and then threw
      # `TypeError: Cannot read properties of undefined (reading 'toFixed')` while rendering the
      # efficiency frame, unmounting the Reactor before its mic control mounted -- 0 canvases,
      # getUserMedia never called. An earlier `GET /fleet` 302 to the Oracle login wall was a
      # separate symptom, already fixed. ubuntu-24.04 is the one place this can run: Playwright
      # ships no WebKit or Chromium for macOS 13 (`ERROR: Playwright does not support webkit on
      # mac13`, from the installer, on the founder's laptop). WebKit is the founder's iPhone engine;
      # Chromium stands in for Android. The step is not skippable -- a silently skipped mobile check
      # is not a check.
      # Measured 2026-10-09 (run 37898758630, job 113716901325): this job took 12m51s and the
      # browser install alone -- `yarn playwright install --with-deps webkit chromium` fetching
      # both engines from scratch -- was 1-3min of that, every single run, cache or no cache,
      # whether or not the fetched bits had already changed. Same waste crew#639 found in the
      # embedded-Postgres download (ci.yml:179-184): one slow unconditional fetch with no cache at
      # all. Keyed on yarn.lock, which pins the resolved playwright version exactly -- a version
      # bump changes the lockfile, so the key rotates and the next run fetches once and then stays
      # warm. `--with-deps` still runs apt for the OS libraries every time (not cacheable here),
      # but that's seconds, not minutes.
      - name: cache for the browsers a phone runs
        if: steps.touched.outputs.yes == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('backstage/yarn.lock') }}
      - name: the browsers a phone runs (WebKit for iPhone, Chromium for Android)
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: node_modules/.bin/playwright install --with-deps webkit chromium
      - name: a phone is served the app, reaches the microphone, and a spoken question is heard and answered
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        env:
          PLAYWRIGHT_URL: https://catalogue.mumchimp.com
        run: node_modules/.bin/playwright test --config playwright.mobile.config.ts
      # A red phone run with no trace can only be guessed at: the runner's engine is not the one on a
      # laptop (2026-10-09: Pixel passed on macOS Chrome and failed on the runner's Linux Chromium).
      - name: the phone run's report and traces, when it fails
        if: failure() && steps.touched.outputs.yes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-mobile
          path: |
            backstage/e2e-mobile-report
            backstage/node_modules/.cache/e2e-mobile-results
          retention-days: 7

  # The required `portal-app` context, unchanged in name: green only when both legs are. A skipped
  # leg is a pass -- it is skipped only when gate or verify failed, and those publish their own red
  # -- which is what the single job reported before the split. `!cancelled()`, not always(): a run
  # superseded on its branch stays cancelled, as before, instead of posting a red over it.
  #
  # PORTAL-PHONE IS ADVISORY HERE (2026-10-22, founder-approved, #6840). The phone suite drives the
  # DEPLOYED portal (PLAYWRIGHT_URL above), not this change's code, so before merge it judges
  # production, not the lane. Measured: live /face crashed with React #310 (FaceFindingsStrip
  # called useNow() after an early return, #6790), and every lane touching backstage/ -- b3583,
  # b3585, b3589, b3591, b3602, the last carrying the fix itself -- went red on that same live
  # crash. The fix could not land while production lacked it. So a phone failure is printed as a
  # warning and portal-phone keeps its own red check; only portal-build decides this context.
  # Follow-up: run the phone suite after deploy, where its verdict is about the release.
  portal-app:
    needs: [portal-build, portal-phone]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: the portal built and tested (the phone run against the live portal is advisory)
        run: |
          set -euo pipefail
          build='${{ needs.portal-build.result }}'
          phone='${{ needs.portal-phone.result }}'
          echo "portal-build: $build"
          echo "portal-phone: $phone"
          case "$phone" in
            success|skipped) ;;
            *) echo "::warning title=portal-phone ${phone}::the phone suite against the deployed portal did not pass; it judges production, not this change" ;;
          esac
          case "$build" in success|skipped) ;; *) exit 1 ;; esac
