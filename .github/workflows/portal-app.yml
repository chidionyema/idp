# portal-app, in a workflow of its own (2026-10-08, chidionyema/idp#5513).
#
# It was a job inside ci.yml. It is not a required check (platform/github/
# ruleset.idp.required-checks.json), but the Greenlane ticks on `workflow_run` of `ci` COMPLETING
# (.github/workflows/greenlane.yml), and a workflow run completes only when its slowest job does.
# portal-app -- yarn install, tsc, lint, the app's tests, two Playwright browsers -- was that job:
# measured on queue/b1990 (run 37798166235) it held ci open 15+ minutes after ci-success had
# already gone green, and the batch could not land until it finished. Here it reports the same
# `portal-app` check on the same events, and ci completes when its own jobs do.
#
# Triggers and concurrency are ci.yml's, unchanged, so the job runs exactly where it ran before.
# The gate jobs keep the 60 s pre-gate in front of the heavy install (ci.yml's fast-gate and
# verifier, the same reusable workflows) under job ids that do not reuse ci's: a job named
# `fast-gate` here would publish a second `fast-gate / fast-gate` check -- a required context --
# from a workflow that is not the one the ruleset means.
name: portal-app
on:
  pull_request:
  merge_group:
  push:
    branches: [main, queue/**]
concurrency:
  # ci.yml's rule and reasons: superseded on a branch, never on main (every main sha keeps its run).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  gate:
    uses: ./.github/workflows/fast-gate.yml
  verify:
    uses: ./.github/workflows/verifier.yml

  # crew#459, 2026-08-31. The portal's own test suite was run by nothing. Every workflow that
  # mentions backstage grades the *running* one -- verdict-backstage proves the deployed pod,
  # login-drill signs in to it, build-multiarch builds the image -- and the image build runs
  # `yarn tsc` and `yarn build:all`, never `yarn test`. So a unit test under packages/app was an
  # instrument nobody reads (LAW 28): it could only ever go red on a laptop, and only if someone
  # remembered to run it. The colour-contrast guard added with this job is exactly the kind of
  # defect a type-check and a build cannot see -- every state border in the portal failed WCAG
  # 2.2 SC 1.4.11 for months while CI was green -- so the guard is worth nothing without a lane
  # that runs it. Only on changes under backstage/: the install is the slow part and nothing else
  # in the repository can move these tests.
  portal-app:
    # Runs on pull requests (2026-09-27): skipped there, no compiler read a PR's .tsx before it
    # merged (PR #4467). NOT in ruleset.idp.required-checks.json (measured 2026-10-08), so it
    # never gates a land. Still only installs when backstage/ changed, so other PRs pay nothing.
    needs: [gate, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # `repo lint --since origin/main` and `repo test` diff the base
      - name: did this change touch the portal at all
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # a first push to a branch reports an all-zero before-sha; grade the whole thing then
          case "$base" in ''|0000000000000000000000000000000000000000) echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if git diff --name-only "$base"...HEAD -- backstage/ | grep -q .; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.touched.outputs.yes == 'true'
        with:
          # backstage/package.json declares engines.node "22 || 24" and the image is node:24.
          # Pinning the same major here means a green lane and a green image agree about the
          # runtime; the host's node 26 is outside that range on purpose.
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.touched.outputs.yes == 'true'
        with:
          # The face test re-derives backstage/packages/app/public/face/estate.glb by running
          # bin/estate-face-avatar --check, so this job needs the interpreter the generator runs
          # on. Without it the generator dies on `import numpy` and the test fails with a
          # ModuleNotFoundError rather than grading the asset (measured 2026-10-04, portal-app on
          # queue/b621). Same major as every other Python job here.
          python-version: "3.12"
      - name: numpy, for the avatar generator
        if: steps.touched.outputs.yes == 'true'
        run: pip install -q "numpy==1.26.4"   # the pin requirements-research.txt carries
      - name: yarn, the version package.json pins
        if: steps.touched.outputs.yes == 'true'
        run: corepack enable && corepack prepare yarn@4.13.0 --activate
      - name: install and refresh lockfile for current npm CDN checksums
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn install --refresh-lockfile
      - name: type-check
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn tsc
      - name: lint
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn lint
      # faceEngine.test.ts re-derives public/face/estate.glb with `bin/estate-face-avatar --check`
      # to prove the shipped avatar is the one its generator authors. That generator imports numpy
      # (bin/estate-face-avatar line 54), and this job -- node only -- had no Python at all, so the
      # test died on `ModuleNotFoundError: No module named 'numpy'` and reported the traceback text
      # where it wanted "matches the generator". Measured 2026-10-04: `portal-app` was the only red
      # on the greenlane candidate queue/b638 (main 45d25b26900f + 11 lines that touch no portal
      # file), 1 failed / 552 passed, and a required check that cannot go green refuses every land
      # (GH013 on the main fast-forward). numpy is already declared at sovereign/requirements.txt:56
      # and installed this way by the `verifier` job that runs bin/idp-ci; this is the same door, not
      # a second one. The test itself is deliberately not made skippable -- a silently skipped check
      # is not a check, which is the remark at faceEngine.test.ts:94.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.touched.outputs.yes == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sovereign/requirements*.txt
      - name: the generator's Python (numpy), or the avatar check is a traceback
        if: steps.touched.outputs.yes == 'true'
        run: pip install -q -r sovereign/requirements.txt
      - name: the app's tests, including the contrast guard
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn test --ci --watchAll=false

      # The founder tests /face and /fleet from a phone, and the estate had no mobile browser check,
      # so every mobile claim was a desktop measurement wearing a phone's name. The defect, measured
      # 2026-10-04 in a real browser: /fleet served the app and then threw
      # `TypeError: Cannot read properties of undefined (reading 'toFixed')` while rendering the
      # efficiency frame, unmounting the Reactor before its mic control mounted -- 0 canvases,
      # getUserMedia never called. An earlier `GET /fleet` 302 to the Oracle login wall was a
      # separate symptom, already fixed. ubuntu-latest is the one place this can run: Playwright
      # ships no WebKit or Chromium for macOS 13 (`ERROR: Playwright does not support webkit on
      # mac13`, from the installer, on the founder's laptop). WebKit is the founder's iPhone engine;
      # Chromium stands in for Android. The step is not skippable -- a silently skipped mobile check
      # is not a check.
      - name: the browsers a phone runs (WebKit for iPhone, Chromium for Android)
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        run: yarn playwright install --with-deps webkit chromium
      - name: a phone is served the app, and reaches the microphone or names the refusal
        if: steps.touched.outputs.yes == 'true'
        working-directory: backstage
        env:
          PLAYWRIGHT_URL: https://catalogue.mumchimp.com
        run: yarn playwright test --config playwright.mobile.config.ts
