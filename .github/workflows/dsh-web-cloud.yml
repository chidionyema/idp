# button: Deploy DSH Web
# founder: Deploys the always-on DSH work surface to Modal and proves its health endpoint.
name: dsh-web-cloud
on:
  push:
    branches: [cloud/dsh-web-20261108]
    paths:
      - code/dsh_cloud.py
      - .github/workflows/dsh-web-cloud.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: dsh-web-cloud
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.SEED_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.SEED_MODAL_TOKEN_SECRET }}
      DEEPSEEK_API_KEY: ${{ secrets.SEED_DEEPSEEK_API_KEY }}
      ZAI_API_KEY: ${{ secrets.SEED_ZAI_API_KEY }}
      LITELLM_API_KEY: ${{ secrets.SEED_HERMES_LITELLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modal root and a model fallback must be present
        run: |
          set -euo pipefail
          missing=""
          [ -n "$MODAL_TOKEN_ID" ] || missing="$missing MODAL_TOKEN_ID"
          [ -n "$MODAL_TOKEN_SECRET" ] || missing="$missing MODAL_TOKEN_SECRET"
          [ -n "$DEEPSEEK_API_KEY" ] || missing="$missing DEEPSEEK_API_KEY"
          [ -n "$LITELLM_API_KEY" ] || missing="$missing LITELLM_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=DSH cloud credentials::MISSING repository secrets:$missing"
            exit 1
          fi
          echo "MODEL_ROUTE=estate-router" >> "$GITHUB_ENV"
          python -m pip install --quiet 'modal==1.5.5'
          modal secret list >/dev/null
      - name: Prove the canonical router completes with GLM
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              "https://llm.mumchimp.com/v1/chat/completions",
              data=json.dumps({
                  "model": "glm",
                  "messages": [{
                      "role": "user",
                      "content": "Reply with exactly DSH_ROUTER_OK and nothing else.",
                  }],
                  "max_tokens": 16,
                  "temperature": 0,
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['LITELLM_API_KEY']}",
                  "Content-Type": "application/json",
                  "User-Agent": "estate-dsh-deploy/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              body = json.load(response)
          content = body["choices"][0]["message"]["content"].strip()
          if "DSH_ROUTER_OK" not in content:
              raise SystemExit(f"FAIL canonical router completion: {content[:120]!r}")
          print("ok      model-completion estate.model-router model=glm DSH_ROUTER_OK")
          PY
      - name: Create the versioned DSH runtime secret
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import hashlib, os
          print(hashlib.sha256(
              (os.environ["DEEPSEEK_API_KEY"] + "\nchidionyema/idp:estate-dsh-web:v1").encode()
          ).hexdigest())
          PY
          )
          echo "::add-mask::$TOKEN"
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          args=(
            DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
            LITELLM_API_KEY="$LITELLM_API_KEY"
            DSH_LAUNCH_TOKEN="$TOKEN"
            DSH_SOURCE_SHA="$GITHUB_SHA"
            DSH_DEPLOYED_AT="$DEPLOYED_AT"
          )
          if [ -n "$ZAI_API_KEY" ]; then args+=(ZAI_API_KEY="$ZAI_API_KEY"); fi
          modal secret create estate-dsh-runtime "${args[@]}" --force >/dev/null
      - name: Deploy and prove DSH Web
        id: deploy
        run: |
          set -euo pipefail
          python -m py_compile code/dsh_cloud.py
          if ! modal deploy code/dsh_cloud.py >"$RUNNER_TEMP/modal-deploy.log" 2>&1; then
            tail -60 "$RUNNER_TEMP/modal-deploy.log"
            detail=$(tail -1 "$RUNNER_TEMP/modal-deploy.log" | sed -E 's/[A-Za-z0-9_+\/=-]{40,}/<redacted>/g')
            echo "::error title=DSH Modal deploy::${detail}"
            exit 1
          fi
          tail -20 "$RUNNER_TEMP/modal-deploy.log"
          URL=$(python -c 'import modal; print(modal.Function.from_name("estate-dsh-web","web").get_web_url() or "")')
          case "$URL" in https://*) ;; *) echo "FAIL Modal returned no HTTPS URL"; exit 1;; esac
          if ! python - "$URL" <<'PY' >"$RUNNER_TEMP/dsh-health.log" 2>&1
          import json, os, sys, time, urllib.request
          url = sys.argv[1].rstrip("/") + "/healthz"
          expected_sha = os.environ["GITHUB_SHA"]
          last = None
          for attempt in range(24):
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "estate-dsh-deploy/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = json.load(response)
                  release = body.get("release") or {}
                  contract_ok = (
                      response.status == 200
                      and body.get("service") == "estate-dsh-web"
                      and body.get("contractId") == "estate.dsh-web"
                      and body.get("schemaVersion") == "1.0.0"
                      and release.get("id") == "dsh-web-2026.11.08.2"
                      and release.get("version") == "0.2.1-rc.5+estate.2"
                      and release.get("sourceSha") == expected_sha
                      and str(release.get("configDigest", "")).startswith("sha256:")
                      and release.get("authority") == "work-surface"
                      and release.get("router") == "estate.model-router"
                      and release.get("modelRoute") == "estate-router"
                  )
                  if contract_ok:
                      print(f"ok      dsh-web-cloud  {url} HTTP 200 after {attempt + 1} probe(s)")
                      raise SystemExit(0)
                  last = f"HTTP {response.status} {body}"
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              time.sleep(10)
          raise SystemExit(f"FAIL health contract after 240s: {last}")
          PY
          then
            cat "$RUNNER_TEMP/dsh-health.log"
            echo "::error title=DSH health::$(tail -1 "$RUNNER_TEMP/dsh-health.log")"
            exit 1
          fi
          cat "$RUNNER_TEMP/dsh-health.log"
          printf 'DSH_WEB_URL=%s\n' "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "DSH_MODEL_ROUTE=$MODEL_ROUTE" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish operational milestone
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DSH_URL: ${{ steps.deploy.outputs.url }}
          DSH_SOURCE_SHA: ${{ steps.deploy.outputs.source_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/dsh-success.md"
          {
            echo "DSH Web cloud surface deployed and health-verified."
            echo
            echo "- Surface: \`$DSH_URL\`"
            echo "- Contract: \`estate.dsh-web\` v1.0.0"
            echo "- Release: \`dsh-web-2026.11.08.2\`"
            echo "- DSH: \`0.2.1-rc.5+estate.2\`"
            echo "- Source: \`$DSH_SOURCE_SHA\`"
            echo "- Router: \`estate.model-router\`"
            echo "- Workflow: $RUN_URL"
            echo
            echo "The launch credential is intentionally not published here."
          } >"$body"
          gh issue comment 7797 --body-file "$body"
      - name: Publish deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[cloud] DSH Web deployment failure"
          body="$RUNNER_TEMP/dsh-failure.md"
          {
            echo "DSH Web deployment failed."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/modal-deploy.log" ]; then
              tail -120 "$RUNNER_TEMP/modal-deploy.log" |
                sed -E 's/[A-Za-z0-9_+\/=.-]{40,}/<redacted>/g'
            else
              echo "The failure happened before modal-deploy.log was created."
            fi
            if [ -f "$RUNNER_TEMP/dsh-health.log" ]; then
              echo
              echo "Health probe:"
              tail -80 "$RUNNER_TEMP/dsh-health.log" |
                sed -E 's/[A-Za-z0-9_+\/=.-]{40,}/<redacted>/g'
            fi
            echo
            echo "Modal application log:"
            modal app logs estate-dsh-web --tail 200 2>&1 |
              sed -E 's/[A-Za-z0-9_+\/=.-]{40,}/<redacted>/g' || true
            echo '```'
          } >"$body"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
