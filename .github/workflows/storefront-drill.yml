# button: Test the shop
# founder: Opens the shop the way a stranger does and checks it serves what the last merge built.
# Opens the shop the way a stranger does and checks it is serving what the last merge built.
# Every other drill here grades the platform -- a login, a cluster, a collector. None of them
# opened the shop, so on 2026-08-30 the storefront served an eight-hour-old build with no pack
# pictures while the login drill, flux and the front door all reported green, and the founder
# found it by looking at the site. This holds no credential: it grades what a visitor gets.
# Refs crew#693.
name: storefront-drill
on:
  schedule:
    - cron: "23 * * * *"   # hourly; the estate clock dispatcher covers it when GitHub drops the cron
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - clusters/oke/edge.yaml
      - bin/idp-storefront-drill
      - .github/workflows/storefront-drill.yml
permissions:
  contents: read
  issues: write
concurrency:
  group: storefront-drill
  cancel-in-progress: false
jobs:
  storefront-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No pip step and no browser: the drill is stdlib urllib against a public host, so the thing
      # that grades the shop cannot itself fail on a dependency install.
      - name: bin/idp-storefront-drill
        id: drill
        run: |
          set -o pipefail
          python3 bin/idp-storefront-drill 2>&1 | tee drill.out
      - name: the verdict is on the run summary, pass or fail
        if: always()
        run: |
          rows=$(grep -E '^(ok|FAIL) +(shop-answers|pack-page|pack-pictures)' drill.out || true)
          line=$(grep -E '^(ok|FAIL) +storefront-smoke' drill.out | tail -1 || true)
          printf '### storefront-drill\n```\n%s\n%s\n```\n' "${rows:-no rows}" "${line:-no verdict line: the drill died before printing one}" >> "$GITHUB_STEP_SUMMARY"
      - name: a red shop is an open P0 on this repository, never a badge nobody reads
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rows=$(grep -E '^FAIL ' drill.out || true)
          rows=${rows:-"storefront-drill died before printing a verdict"}
          body=$(printf '%s\nrun: %s/%s/actions/runs/%s\nboard: https://github.com/chidionyema/crew/issues/693\n' "$rows" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          n=$(gh issue list --state open --search 'in:title "P0: the shop is not serving what we built"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh label create P0 --color B60205 --description "service down for the founder" --force >/dev/null; gh issue create --title "P0: the shop is not serving what we built" --label P0 --body "$body"; fi
      # A drill that opens an issue and never closes it is an instrument nobody reads (LAW 28,
      # crew#301: idp#379 stood open with 37 red comments while the drill had been green for hours).
      - name: a green drill closes the open P0, with the run as the receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search 'in:title "P0: the shop is not serving what we built"' --json number -q '.[0].number')
          [ -z "$n" ] && exit 0
          gh issue close "$n" --reason completed --comment "$(printf 'green: the shop answers, a pack page answers, and every pack picture it references loads.\nrun: %s/%s/actions/runs/%s' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
