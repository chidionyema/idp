# button: Reconcile the Flux alarm's board against the cluster
# founder 2026-10-12: "59 open P0s all 'Flux cannot reconcile Kustomization/…'" -- 60 open rows
# naming 31 objects, four of them actually not Ready, and the one live fire (quad-ledger) missing
# from the board entirely. The event path (flux-events.yml) files a row when an event arrives, and
# events are not a state: a row keyed on scrubbed message prose forks one fire into six rows, and a
# row that missed its one recovery event can never close whatever the object does afterwards.
#
# So the board is not maintained by its own history any more. It is made EQUAL to the cluster, on a
# schedule, by bin/flux-board-reconcile: close every row whose object is Ready now or gone, keep the
# oldest row per object and close its duplicates, open one row for every not-Ready object that has
# none. Idempotent, and it refuses to report success while the board contradicts the cluster -- so
# the invariant is a gate that can fail, not a sentence in a docstring.
#
# The kubeconfig is minted the way otto-parity and op-verify mint it (bin/idp-cloud, no
# infrastructure write). Schedules run every 15 minutes; a tick that cannot reach the cluster is
# BLIND and goes red rather than reporting a board it never read.
name: flux-board-reconcile
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  issues: write
concurrency:
  group: flux-board-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CLI_AUTH: security_token
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: Mint kubeconfig
        env:
          OCI_CLUSTER_NAME: ${{ vars.OCI_CLUSTER_NAME || 'estate' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          bin/idp-cloud cluster kubeconfig "$OCI_CLUSTER_NAME" --file "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
      - name: the board is a function of the cluster
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin/flux-board-reconcile | tee "$RUNNER_TEMP/reconcile.log"
          { echo "## flux-board-reconcile"; echo '```'; tail -40 "$RUNNER_TEMP/reconcile.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
