# crew#267: image-automation-controller pushes a new catalogue tag to flux/image-updates
# (platform/image-automation/backstage.yaml). main's rulesets have no bypass actors, so the change
# reaches main as a pull request with auto-merge. ci.yml runs the required checks on the push to
# this branch; a pull request opened with GITHUB_TOKEN fires no pull_request run, and does not
# need to, because the ruleset grades check runs on the head commit.
name: image-update-pr
on:
  push:
    branches: [flux/image-updates]
permissions:
  contents: write
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: open or refresh the pull request, auto-merge on green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          n=$(gh pr list --head flux/image-updates --base main --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh pr create --head flux/image-updates --base main \
              --title "$(git log -1 --format=%s)" \
              --body "$(printf '%s\n\n%s\n%s\n%s\n%s\n' \
                "$(git log -1 --format=%b)" \
                "Spec: tests/test_incident_catalogue_image_never_repulled.py" \
                "Drill: login-drill" \
                "Cost-delta-usd-month: 0" \
                "Rung 7: production oracle, the backstage row health check rolls the Deployment on merge")"
            n=$(gh pr list --head flux/image-updates --base main --state open --json number -q '.[0].number')
          fi
          gh pr merge "$n" --auto --squash
          echo "ok      image-update-pr #$n auto-merge armed"
