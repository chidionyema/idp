# crew#267: image-automation-controller pushes a new catalogue tag to flux/image-updates
# (platform/image-automation/backstage.yaml). main's rulesets have no bypass actors, so the change
# reaches main as a pull request with auto-merge. ci.yml runs the required checks on the push to
# this branch; a pull request opened with GITHUB_TOKEN fires no pull_request run, and does not
# need to, because the ruleset grades check runs on the head commit.
# crew#439: a CONFLICTING pull request is refreshed by bin/idp-image-update-pr, never reported ok.
name: image-update-pr
on:
  push:
    branches: [flux/image-updates]
permissions:
  contents: write
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }  # crew#439: the refresh merges origin/main
      - name: open or refresh the pull request, auto-merge on green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/idp-image-update-pr
