# crew#267: image-automation-controller pushes a new catalogue tag to flux/image-updates
# (platform/image-automation/backstage.yaml). main's rulesets have no bypass actors, so the change
# reaches main as a pull request with auto-merge. ci.yml runs the required checks on the push to
# this branch; a pull request opened with GITHUB_TOKEN fires no pull_request run, and does not
# need to, because the ruleset grades check runs on the head commit.
# crew#439: a CONFLICTING pull request is refreshed by bin/idp-image-update-pr, never reported ok.
name: image-update-pr
on:
  push:
    branches: [flux/image-updates]
permissions:
  contents: write
  pull-requests: write
# A newer run on the same ref supersedes the older one: on 2026-08-27 20:23Z idp had 9 running and
# 20 queued runs, 12 of them stale duplicates, and a one-line oke-check waited 19 min (crew#516).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }  # crew#439: the refresh merges origin/main
      - name: open or refresh the pull request, auto-merge on green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRITER_KEY_B64: ${{ secrets.SEED_FLUX_WRITER_IDENTITY_B64 }}
        run: |
          set -euo pipefail
          # crew#439: the refresh push must fire ci.yml, and a GITHUB_TOKEN push fires nothing;
          # push with the flux-writer deploy key as kini-finish.yml does.
          test -n "$WRITER_KEY_B64" || { echo "FAIL    image-update-pr  SEED_FLUX_WRITER_IDENTITY_B64 is not set (capabilities register: flux-writer)"; exit 1; }
          umask 077; mkdir -p ~/.ssh; printf '%s' "$WRITER_KEY_B64" | base64 -d > ~/.ssh/flux-writer
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/flux-writer -o IdentitiesOnly=yes"
          export PUSH_URL="git@github.com:${GITHUB_REPOSITORY}.git"
          # crew#584 / idp#750: this job checks out flux/image-updates, a branch the controller forked
          # from an old main, so `bin/idp-image-update-pr` here was the crew#439 copy and #750 was
          # opened without the LAW 51 line idp#744 added. The script that opens the pull request is
          # always main's copy; the branch carries only the controller's newTag lines.
          bash <(git show origin/main:bin/idp-image-update-pr)
