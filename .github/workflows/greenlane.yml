# button: The lane
# founder: The one thing that moves main. Proves a lane green on top of main, then raises and lands it in one move.
#
# WHY THIS EXISTS. Founder, 2026-09-29: "I need mathematical guarantees PRs can't fail on this
# platform", "main must never go red, never", "a PR that can fail should never be allowed to be
# raised", "one agent can take down a whole fleet and platform by one PR", "no going back to
# this mess". The lane it replaces (merge-when-green, pr-age, pr-cap, pr-consolidate,
# agent-trunk-batch, deploy-when-green, image-update-pr) graded pull requests after they were
# raised, on a merge commit GitHub made against a main that had since moved, and then closed,
# drafted or consolidated what went red. Every one of those was a hand on a symptom.
#
# HOW IT HOLDS. greenlane/engine.py (proven under 500 chaos lanes: features/gates/greenlane.feature)
# stacks lanes into one candidate on top of the current main, pushes it to queue/<batch>, waits
# for the required checks on that exact sha, and on green raises one pull request per lane and
# fast-forwards main to the tested commit -- the same bytes. Red bisects. Rulesets: only the
# estate App may update main (platform/github/ruleset.idp.main-writer.json) and the tip it
# pushes must carry the required checks (ruleset.idp.required-checks.json). GitHub's native
# merge queue would do the same and is refused on a user-owned repository (422 'merge_queue');
# the day the repository is organisation-owned this workflow can be retired for it.
name: greenlane
on:
  # Privileged workflow runs ONLY from GitHub's default-branch workflow definition.
  # A lane push runs no-harness-folders (read-only); its workflow_run completion
  # wakes this trusted-main workflow without executing candidate-supplied YAML.
  workflow_run:
    workflows: [no-harness-folders]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes: judge queue batches when CI completes
  # workflow_run removed: guarded-paths fires on every main push, creating workflow_run events that
  # queue and cancel push-event and scheduled-tick greenlane runs. CI completions on lane/** are
  # covered by the lane push trigger. CI completions on queue/** are judged twice now: by this
  # schedule as the backstop, and within seconds by the check_run trigger below (idp#6520).
  # A completed check run on a queue/* tip is the batch's verdict arriving. Measured 2026-10-18:
  # candidates b3129/b3120/b2967 sat green on their shas for 3h40m, 4h45m and ~20h because the
  # judge shares one concurrency slot with batch formation and kept losing it. The check_run
  # trigger lets a judge tick collect the verdict the moment the last check finishes. The job
  # body below skips every completion that is not a queue/* tip, so the firehose of check
  # completions elsewhere in the repository exits skipped in seconds and costs nothing.
  check_run:
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  statuses: write
  checks: write
  id-token: write   # traded for the OCI session that reads the App key (.github/actions/github-app-token)
concurrency:
  # TWO groups: `greenlane` for every tick that may observe or form batches, `greenlane-judge`
  # for check_run-triggered ticks that only collect finished proofs (engine.tick(judge_only=True)).
  # The judge never forms a batch, so the 2026-10-17 per-event split failure (two ticks racing the
  # batch formation on b3010..b3012) does not apply to it: all FORMATION stays serialized in the
  # one `greenlane` group, exactly as below. What the split buys is measured, not hoped:
  # three green candidates unjudged 3h40m/4h45m/~20h on 2026-10-18 while ~90-second ticks
  # consumed the shared slot.
  group: ${{ github.event_name == 'check_run' && 'greenlane-judge' || 'greenlane' }}
  # NEVER cancel in progress (2026-10-17). Measured that day: the engine pushes the batch
  # tip onto the lane branch, the push run starts testing it (the `greenlane` required
  # check), and the engine's next push -- ~2 min later, on the same branch, same group --
  # cancels that run mid-CI. The judge then reads `pending` until the 90-minute timeout,
  # requeues, re-forms, and the next candidate is cancelled the same way: landed_total
  # froze at 451 from 11:12 to 14:45 while batches b2961..b2968 churned. Same for main
  # dispatches (14:44:50 cancelled by 14:45:31). Queued, not cancelled: concurrency keeps
  # at most one pending run per group, so the pile-up is bounded, and the state's CAS +
  # member leases already make overlapping ticks safe.
  cancel-in-progress: false
jobs:
  greenlane:
    # Only trusted-main workflow definitions may mint the App token. No
    # unreviewed lane HEAD or GitHub event artifact may supply executable code.
    # Lane wakeups come from the existing read-only no-harness-folders workflow
    # completed on a lane push; unrelated workflow_run events do no work.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       (startsWith(github.event.workflow_run.head_branch || '', 'lane/') ||
        github.event.workflow_run.head_branch == 'flux/image-updates')) ||
      (github.event_name == 'check_run' &&
       startsWith(github.event.check_run.check_suite.head_branch || '', 'queue/')) ||
      (github.event_name != 'workflow_run' && github.event_name != 'check_run')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Never keep the runner token in git config: git sends it as the Authorization
          # header in preference to the App token in the remote URL, and a push made as
          # GITHUB_TOKEN triggers no workflow -- queue/b2 sat with zero check runs
          # (2026-09-29 17:22Z). Candidates must be pushed as the App so CI grades them.
          persist-credentials: false
      # The queue tip emits many optional check completions. Only the canonical
      # required-check contexts can change its admission verdict. Filter those
      # OTHER events before the expensive OCI/OIDC App credential exchange.
      # Unknown/malformed events always INVOKE the judge: cost-only optimization.
      - name: Skip optional checks before minting privileged estate credentials
        id: check_relevance
        run: python3 bin/idp-greenlane-check-trigger
      - id: app
        if: steps.check_relevance.outputs.needs_judge == 'true'
        uses: ./.github/actions/github-app-token
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oci_compartment: ${{ vars.OCI_COMPARTMENT_OCID }}
      - name: one tick of the lane
        if: steps.check_relevance.outputs.needs_judge == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GREENLANE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The lane's `greenlane` commit status is written with the runner's token, which holds
          # `statuses: write` above; the App token holds no statuses permission (#5576). Passed
          # to report() alone, never to git, so pushes and merges still start workflows.
          GREENLANE_STATUS_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: estate-agents[bot]
          GIT_AUTHOR_EMAIL: estate-agents[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: estate-agents[bot]
          GIT_COMMITTER_EMAIL: estate-agents[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # pushes must carry the App's token so they start workflows on the refs they write
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          # CRITICAL TRUST BOUNDARY: the workflow and engine are ALWAYS the
          # reviewed main checkout. Lane/queue refs are data that GitHubBackend
          # reads and rebases in isolated git worktrees, never code executed
          # with the App token. The canonical state ref is already fetched and
          # CAS-checked by GitHubBackend.fetch()/save_state_text().
          trusted_main_sha="$(git rev-parse HEAD)"
          echo "TRUSTED_GREENLANE_ENGINE_SHA=${trusted_main_sha}"
          # A check_run trigger means a batch's verdict may have arrived: collect it (judge-only
          # tick -- lands, bisects or requeues the candidate the state names, forms nothing).
          # Every other trigger is a full tick: observe, judge, form, retire, heartbeat.
          if [ "${{ github.event_name }}" = "check_run" ]; then
            python3 bin/idp-greenlane tick --judge-only
          else
            python3 bin/idp-greenlane tick
          fi
