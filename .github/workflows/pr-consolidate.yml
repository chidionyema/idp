# button: Consolidate every author's open PRs hourly, delete the originals
# founder: Founder 2026-09-17, verbatim: "in all honesty we should not even get here — limit no of
#   open prs 5 maximum" and (recovery) "hourly ... needs to delete the prs after consolidating". So:
#     - PREVENTION: bin/idp-max-open-prs-gate refuses a push when the author is already at 5 open.
#     - RECOVERY (this workflow): every hour, for every non-bot author with >= 5 open PRs, merge
#       them all into one branch consolidate-<author>-<YYYY-MM-DD-HHZ>, open ONE PR, close the
#       originals, and delete their branches. Human-in-loop: the consolidation PR itself waits for
#       normal checks + merge-when-green; nothing lands on main without CI's word.
#
# Bot lanes are skipped by design: PRs on branches starting with `flux/` or authored by
# `github-actions[bot]` are the image-update loop; they must NOT be consolidated (each one is a
# tag pin and merging them together loses the pinning contract).
name: pr-consolidate
on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (offset from other estate crons)
  workflow_dispatch:
    inputs:
      max_open:
        description: "Author's open-PR threshold that triggers consolidation"
        default: "5"
      dry_run:
        description: "List what would be consolidated; do not act"
        type: boolean
        default: false
      reason:
        description: "Why (one line, kept in the run record)"
        required: false
        default: "hourly PR sprawl cap enforcement"
permissions:
  id-token: write
  contents: write
  pull-requests: write
concurrency:
  group: pr-consolidate
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: find authors over the cap
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_OPEN: ${{ inputs.max_open || '5' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request, sys
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              "https://api.github.com/repos/chidionyema/idp/pulls?state=open&per_page=100",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json"})
          prs = json.load(urllib.request.urlopen(req, timeout=15))
          maxN = int(os.environ["MAX_OPEN"])
          by = {}
          for p in prs:
              if (p.get("head") or {}).get("ref","").startswith("flux/"):
                  continue
              if (p.get("user") or {}).get("login","").endswith("[bot]"):
                  continue
              u = (p.get("user") or {}).get("login","?")
              by.setdefault(u,[]).append({"n": p["number"], "ref": p["head"]["ref"], "title": p["title"]})
          over = {a:l for a,l in by.items() if len(l) >= maxN}
          print(f"## pr-consolidate scan (max_open={maxN})")
          print("")
          if not over:
              print("no author over the cap; nothing to do")
          for a,l in over.items():
              print(f"author `{a}` at {len(l)} open PRs:")
              for p in l: print(f"  - #{p['n']} `{p['ref']}` -- {p['title'][:80]}")
          json.dump(over, open("/tmp/over.json","w"))
          PY
          echo "over=$(wc -c </tmp/over.json)" >> "$GITHUB_OUTPUT"

      - name: consolidate each author's PRs
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          over = json.load(open("/tmp/over.json"))
          if not over:
              print("nothing to consolidate")
              raise SystemExit(0)
          def sh(*a, **kw):
              print("+", " ".join(a))
              return subprocess.run(a, check=kw.get("check", True), capture_output=True, text=True)
          def gh_api(method, path, body=None):
              import urllib.request, urllib.error
              req = urllib.request.Request(f"https://api.github.com{path}",
                  data=(json.dumps(body).encode() if body else None),
                  method=method,
                  headers={"Authorization": f"token {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json",
                           "Content-Type":"application/json"})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=15))
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:400]}
          sh("git","config","user.name","estate-pr-consolidate")
          sh("git","config","user.email","estate-pr-consolidate@users.noreply.github.com")
          sh("git","fetch","origin","main")
          for author, prs in over.items():
              stamp = time.strftime("%Y-%m-%d-%HZ", time.gmtime())
              cbr = f"consolidate-{author}-{stamp}"
              sh("git","checkout","-B",cbr,"origin/main")
              merged = []
              for p in prs:
                  sh("git","fetch","origin",p["ref"], check=False)
                  r = sh("git","merge","-X","theirs","--no-edit",f"origin/{p['ref']}", check=False)
                  if r.returncode != 0:
                      print(f"  MERGE FAIL #{p['n']} {p['ref']}: {r.stderr[:200]}")
                      sh("git","merge","--abort", check=False)
                      continue
                  merged.append(p)
              if not merged:
                  print(f"  no PRs merged for {author}")
                  continue
              sh("git","push","--no-verify","-u","origin",cbr)
              body_lines = [f"Hourly consolidation for author `{author}` (>=5 open PRs).",
                            "", "Merged PRs (now closed):"]
              for p in merged: body_lines.append(f"- #{p['n']} `{p['ref']}` -- {p['title'][:80]}")
              body_lines += ["","Original branches deleted. See platform/pr-consolidate for policy."]
              r = gh_api("POST","/repos/chidionyema/idp/pulls",
                        {"title": f"consolidate: {len(merged)} PRs from {author} ({stamp})",
                         "head": cbr, "base":"main", "body":"\n".join(body_lines)})
              print("  opened", r.get("number"), r.get("html_url"))
              for p in merged:
                  gh_api("POST", f"/repos/chidionyema/idp/issues/{p['n']}/comments",
                        {"body": f"Superseded by #{r.get('number')} (hourly pr-consolidate). Closing and deleting branch `{p['ref']}`."})
                  gh_api("PATCH", f"/repos/chidionyema/idp/pulls/{p['n']}", {"state":"closed"})
                  gh_api("DELETE", f"/repos/chidionyema/idp/git/refs/heads/{p['ref']}")
                  print(f"    #{p['n']} closed + branch deleted")
          PY
