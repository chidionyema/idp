# crew#584 CP-C, founder playbook 2026-08-29 Phase 2: "Fail Fast, Pass Slow". One job, under
# 60 s: shell lint, hardcode scan, pipeverdict scan, ruff (IDP_CI_FAST=1 bin/idp-ci). ci.yml,
# build-multiarch.yml and portability-drill.yml each call it as their first job and every heavy
# job `needs:` it, so a lint red never boots k3s or builds four images. Measured before: a lint
# error surfaced after 5 min (offline-gate) while 11 min of drills ran for nothing (idp#659).
name: fast-gate
on:
  workflow_call:
jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -q ruff==0.15.18   # the pin ci.yml's bdd job uses; shellcheck ships on ubuntu-latest
      - run: IDP_CI_FAST=1 bin/idp-ci
