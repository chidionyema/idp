# button: Run the pacemaker now (runs any clock that missed, names any silent pacemaker home)
# founder: GitHub's scheduler skips most of the estate's timed jobs (measured 7% delivered on 2026-11-13). The pacemaker reads Chronos's grades and runs every job that missed its time. It has three homes (GitHub, Cloudflare, the Mac) that each wake it; each run checks the other homes are still waking it and opens a ticket naming any that went quiet.
#
# estate-pacemaker (idp#8026; ADR 0037 three homes, two providers). The judgement is
# bin/estate-pacemaker; the homes only knock this workflow with their name:
#   github-cron  the schedule below
#   cloudflare   platform/pacemaker/worker.js cron (deployed by estate-pacemaker-deploy.yml)
#   mac          launchd/ai.estate.pacemaker.plist.tmpl (until an A1 home exists)
name: estate-pacemaker
run-name: "pacemaker · ${{ inputs.home || 'github-cron' }}"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      home:
        description: which home knocked
        required: false
        default: manual

permissions:
  contents: write   # appends chronos/latest.json to the state/chronos branch, never main
  actions: write
  issues: write

concurrency:
  group: estate-pacemaker
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run what Chronos says missed; ticket a silent home
        id: beat
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_NAME: ${{ inputs.home || 'github-cron' }}
        run: |
          set +e -uo pipefail
          timeout 240 python3 bin/estate-pacemaker --home "$HOME_NAME" --apply --json > beat.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo '```json'; cat beat.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Publish the founder-surface snapshot (state/chronos, chronos/latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_NAME: ${{ inputs.home || 'github-cron' }}
        run: |
          set +e -uo pipefail
          python3 -m pip install --quiet pyyaml
          timeout 120 python3 bin/idp-estate-clocks --json > board.json 2>/dev/null; board_rc=$?
          timeout 60 python3 bin/idp-estate-clocks --coverage --json > loops.json 2>/dev/null; loops_rc=$?
          python3 bin/estate-pacemaker --snapshot beat.json board.json loops.json \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > latest.json || exit 2
          git config user.name "estate-pacemaker"; git config user.email "estate-pacemaker@users.noreply.github.com"
          for attempt in 1 2 3; do
            if git fetch -q --depth 1 origin state/chronos 2>/dev/null; then
              git checkout -q -B snap FETCH_HEAD
            else
              git checkout -q --orphan snap && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git ! -name latest.json -exec rm -rf {} +
            fi
            mkdir -p chronos && cp latest.json chronos/latest.json && git add chronos/latest.json
            git commit -qm "chronos snapshot: $HOME_NAME $(date -u +%FT%TZ)" || exit 0
            git push -q origin snap:refs/heads/state/chronos && { echo "ok      published state/chronos"; break; }
            sleep 3
          done
          # The judgement's own exit decides the run: 2 is BLIND (fails), 0/1 are outcomes.
          [ "${{ steps.beat.outputs.rc }}" = 2 ] && exit 2
          exit 0
