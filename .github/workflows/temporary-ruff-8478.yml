# Temporary, no-secret Ruff canonicalization for source-only #8478; never merge this workflow to main.
name: temporary-ruff-8478
on:
  push:
    branches: ["tmp/ruff-8478-20261123"]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Canonicalize only exact E1-E4 Python source with pinned Ruff
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q ruff==0.15.18
          python -m ruff --version
          python -m ruff format lib/epistemic_kernel/kernel.py lib/epistemic_kernel/cli.py tests/test_epistemic_kernel.py
          python -m ruff format --check lib/epistemic_kernel/kernel.py lib/epistemic_kernel/cli.py tests/test_epistemic_kernel.py
          PYTHONPATH=lib python -m unittest discover -s tests -p test_epistemic_kernel.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5.0.1
        with:
          name: 8478-ruff-exact-canonical
          path: |
            lib/epistemic_kernel/kernel.py
            lib/epistemic_kernel/cli.py
            tests/test_epistemic_kernel.py
          if-no-files-found: error
          retention-days: 1
