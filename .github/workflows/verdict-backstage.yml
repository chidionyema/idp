# crew#631 CP9: the prover for the catalogue. Same machine identity as verdict-langfuse; no browser.
# One signed verdict, one check-run `verify/backstage`, one row in the verdict table.
name: verdict-backstage
on:
  schedule:
    - cron: "43 * * * *"   # hourly; VERDICT_TTL_SECONDS is 3600, so a verdict lives one cycle
  workflow_dispatch:
    inputs:
      nonce:
        description: "nonce issued by the control plane for this request (blank: the run mints one)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - probes/**
      - bin/idp-prove
      - bin/idp-verdict
      - bin/idp-login-drill
      - platform/backstage/**
      - backstage/app-config.container.yaml
      - .github/workflows/verdict-backstage.yml
permissions:
  id-token: write
  contents: read
  checks: write
concurrency:
  group: verdict-backstage
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-prove backstage
        id: prove
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          VERDICT_NONCE: ${{ inputs.nonce }}
          VERDICT_EVIDENCE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          rc=0
          bin/idp-prove backstage --out "$RUNNER_TEMP/verdict.json" 2>&1 | tee prove.out || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: the verdict file is the run's artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verdict-backstage
          path: ${{ runner.temp }}/verdict.json
          if-no-files-found: warn
          retention-days: 30
      - name: the verdict row lands in the table as prover (crew#631 CP3; never fatal to the check-run)
        if: always()
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          bin/idp-verdict schema || true
          bin/idp-verdict store verdict.json || true
          bin/idp-verdict list -n 3 || true
          bin/idp-verdict refuse-test || true
      - name: check-run verify/backstage on the commit, conclusion = outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -E '^(PASS|FAIL|BLOCKED|ERROR) +prove' prove.out | tail -1 || true)
          line=${line:-"ERROR   prove  the prover died before printing a verdict line"}
          outcome=${line%% *}
          case "$outcome" in PASS) c=success;; FAIL) c=failure;; *) c=neutral;; esac
          summary=$(printf '```\n%s\n```\n' "$(grep -E '^(ok|FAIL) +prove' prove.out || true)")
          gh api "repos/${{ github.repository }}/check-runs" -f name=verify/backstage -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion="$c" -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "output[title]=$line" -f "output[summary]=$summary" >/dev/null
          printf '### verdict-backstage\n```\n%s\n```\n%s\n' "$line" "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: the job is red when the verdict is not PASS
        if: always()
        run: |
          grep -qE '^PASS +prove' prove.out
