# button: Refresh the estate status page
# founder: Reads every source of truth and rewrites the one status document the founder and the sessions read.
# crew#648: the estate state document. Every 15 minutes this run reads the sources the estate
# already writes (cluster receipt in the receipts bucket, feed in the state bucket, rulings in
# claude-guards, the newest login-drill log, open P0/P1/security/freeze issues, failed runs of the
# last six hours) and publishes one JSON document as an OCI artifact. The estate-mcp pod
# (platform/mcp/estate-mcp.yaml) pulls it every ten minutes, so `get_estate_state` answers
# `available: true, stale: false` from a document under 30 minutes old (mcp/plugins/estate_state.py).
# Never from a laptop (crew#247). A source that cannot be read is a BLIND line in the run and an
# empty section in the document, never a green row.
name: estate-state
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/estate-state.yml", "bin/idp-estate-state-build", "bin/idp-router-lanes", "bin/idp-reports-render", "platform/estate-state/**"]
permissions:
  contents: read
  id-token: write   # traded for the OCI session that reads the receipts bucket and the App key
  packages: write   # the artifact push uses GITHUB_TOKEN, like bin/idp-estate-db-push
concurrency:
  group: estate-state
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT: oci://ghcr.io/chidionyema/idp/estate-state:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - uses: fluxcd/flux2/action@ed8c5f2c24d57715d08423d3c1a7b0554ceb030e # v2.9.4 -- flux push artifact
      - name: tools
        run: |
          set -euo pipefail
          pip install -q -r .github/requirements/oci-cli.txt jsonschema
          sudo apt-get install -y -qq rclone >/dev/null
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: App token (reads crew and claude-guards, which GITHUB_TOKEN cannot)
        id: app
        uses: ./.github/actions/github-app-token
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oci_compartment: ${{ vars.OCI_COMPARTMENT_OCID }}
      - name: cluster receipt from the receipts bucket (platform/state/cluster-state.yaml writes it every 15 min)
        env:
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: |
          set -uo pipefail
          bin/idp-cloud object get --bucket estate-drill-receipts --name state/cluster > "$RUNNER_TEMP/cluster.txt" \
            || { echo "BLIND cluster receipt not read (exit $?)"; : > "$RUNNER_TEMP/cluster.txt"; }
          head -c 160 "$RUNNER_TEMP/cluster.txt"; echo
      - name: feed from the state branch, fall back to bucket (crew#786)
        env:
          RCLONE_S3_PROVIDER: Cloudflare
          RCLONE_S3_ENDPOINT: https://${{ secrets.SEED_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_S3_ACCESS_KEY_ID: ${{ secrets.SEED_R2_ACCESS_KEY_ID }}
          RCLONE_S3_SECRET_ACCESS_KEY: ${{ secrets.SEED_R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ secrets.SEED_R2_BUCKET || 'prospector-packs' }}
        run: |
          set -uo pipefail
          # crew#786: try the feed from state/live-diagram first (published by Mac sessions)
          git fetch --depth 1 origin state/live-diagram 2>/dev/null || true
          git show origin/state/live-diagram:docs/FEED.md > "$RUNNER_TEMP/feed.md" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/feed.md" ]; then
            echo "feed taken from state/live-diagram, $(wc -c < "$RUNNER_TEMP/feed.md") bytes"
          else
            # rclone copyto exits 0 for an absent object; the file is the receipt, the builder says BLIND without it
            rclone copyto ":s3:$BUCKET/state/feed/latest.md" "$RUNNER_TEMP/feed.md" --s3-no-check-bucket 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/feed.md" ]; then
              echo "feed taken from the bucket, $(wc -c < "$RUNNER_TEMP/feed.md") bytes"
            else echo "feed: not published yet, state/live-diagram and bucket both empty"; fi
          fi
      - name: rulings, issues, runs and the newest login-drill log (App token)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -uo pipefail
          gh api repos/chidionyema/claude-guards/contents/rulings.json --jq .content | base64 -d > "$RUNNER_TEMP/rulings.json" || : > "$RUNNER_TEMP/rulings.json"
          : > "$RUNNER_TEMP/issues.ndjson"
          for repo in chidionyema/idp chidionyema/crew; do
            gh issue list -R "$repo" --state open -L 200 --json number,title,labels,createdAt,url \
              | jq -c --arg repo "${repo#chidionyema/}" '.[]|{repo:$repo,number,title,labels:[.labels[].name],created_at:.createdAt,url}' >> "$RUNNER_TEMP/issues.ndjson" || echo "BLIND issues of $repo not read"
          done
          jq -s . "$RUNNER_TEMP/issues.ndjson" > "$RUNNER_TEMP/issues.json"
          since=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          : > "$RUNNER_TEMP/runs.ndjson"
          for repo in chidionyema/idp chidionyema/crew chidionyema/prospector; do
            gh run list -R "$repo" -L 200 --created ">=$since" --json workflowName,conclusion,createdAt \
              | jq -c --arg repo "${repo#chidionyema/}" '.[]|{repo:$repo,workflow:.workflowName,conclusion,created_at:.createdAt}' >> "$RUNNER_TEMP/runs.ndjson" || echo "BLIND runs of $repo not read"
          done
          jq -s . "$RUNNER_TEMP/runs.ndjson" > "$RUNNER_TEMP/runs.json"
          drill=$(gh run list -R chidionyema/idp -w login-drill.yml -L 1 --status completed --json databaseId,updatedAt --jq '.[0]')
          echo "$drill" | jq -r .updatedAt > "$RUNNER_TEMP/drill.at"
          gh run view "$(echo "$drill" | jq -r .databaseId)" -R chidionyema/idp --log 2>/dev/null | grep -E "(sso|paths|FAIL) +login-drill" | sed -E 's/^[^Z]*Z //' > "$RUNNER_TEMP/drill.log" || echo "BLIND drill log not read"
          echo "issues $(jq length "$RUNNER_TEMP/issues.json") runs $(jq length "$RUNNER_TEMP/runs.json") drill rows $(wc -l < "$RUNNER_TEMP/drill.log")"
      # version 2 (founder 2026-09-03, docs/founder/estate-snapshot-is-mandatory.md): what moved and
      # what waits. Every source is a file; a source that cannot be read is a BLIND line and an
      # empty or UNKNOWN field, never a green row.
      - name: pull requests, merges, decision records, incidents, secret ages, last apply run (App token)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -uo pipefail
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh secret list -R chidionyema/idp --json name,updatedAt > "$RUNNER_TEMP/secrets.json" 2>/dev/null \
            || { echo "BLIND secret last-set times not readable with this token"; : > "$RUNNER_TEMP/secrets.json"; }
          : > "$RUNNER_TEMP/prs.ndjson"; : > "$RUNNER_TEMP/changes.ndjson"; : > "$RUNNER_TEMP/decisions.ndjson"
          for repo in chidionyema/idp chidionyema/crew chidionyema/prospector chidionyema/hermes-v2 chidionyema/claude-guards; do
            gh pr list -R "$repo" --state open -L 50 --json number,title,headRefName,updatedAt,mergeStateStatus,isDraft,url,statusCheckRollup \
              | jq -c --arg repo "${repo#chidionyema/}" '.[]|. + {repo:$repo}' >> "$RUNNER_TEMP/prs.ndjson" || echo "BLIND pull requests of $repo not read"
            gh api "repos/$repo/commits?sha=main&since=$since&per_page=100" \
              | jq -c --arg repo "${repo#chidionyema/}" '.[]|{repo:$repo,sha:.sha,title:(.commit.message|split("\n")[0]),at:.commit.committer.date}' >> "$RUNNER_TEMP/changes.ndjson" || echo "BLIND merges of $repo not read"
          done
          for repo in chidionyema/idp chidionyema/crew; do for path in docs/decisions docs/founder; do
            gh api "repos/$repo/commits?sha=main&path=$path&since=$since&per_page=50" \
              | jq -c --arg repo "${repo#chidionyema/}" '.[]|{repo:$repo,sha:.sha,title:(.commit.message|split("\n")[0]),at:.commit.committer.date}' >> "$RUNNER_TEMP/decisions.ndjson" || echo "BLIND decision records of $repo/$path not read"
          done; done
          jq -s . "$RUNNER_TEMP/prs.ndjson" > "$RUNNER_TEMP/prs.json"
          jq -s 'unique_by(.repo,.sha)' "$RUNNER_TEMP/changes.ndjson" > "$RUNNER_TEMP/changes.json"
          jq -s 'unique_by(.repo,.sha)' "$RUNNER_TEMP/decisions.ndjson" > "$RUNNER_TEMP/decisions.json"
          gh api -H "Accept: application/vnd.github.raw" repos/chidionyema/crew/contents/incidents/LEDGER.jsonl 2>/dev/null | jq -s . > "$RUNNER_TEMP/incidents.json" \
            || { echo "BLIND incident ledger not read"; : > "$RUNNER_TEMP/incidents.json"; }
          # the newest oke-check run that ran the vendor seeder (mode apply; inputs are not in the runs API)
          apply=""
          for id in $(gh run list -R chidionyema/idp -w oke-check.yml -e workflow_dispatch --status completed -L 40 --json databaseId --jq '.[].databaseId'); do
            n=$(gh run view "$id" -R chidionyema/idp --json jobs --jq '[.jobs[].steps[]|select(.name|startswith("bin/idp-bootstrap-vendors"))|select(.conclusion!="skipped")]|length' 2>/dev/null || echo 0)
            if [ "$n" != "0" ]; then apply=$id; break; fi
          done
          if [ -n "$apply" ]; then
            gh run view "$apply" -R chidionyema/idp --json databaseId,url,status,conclusion,createdAt,jobs > "$RUNNER_TEMP/apply-run.json"
            gh run view "$apply" -R chidionyema/idp --log 2>/dev/null | sed -E $'s/^[^\t]*\t([^\t]*)\t[^ ]+ /\\1: /' \
              | grep -E '^[^:]+: (ok|FAIL|BLIND|skip) ' > "$RUNNER_TEMP/apply.log" || echo "BLIND apply log of run $apply has no verdict lines"
            echo "last apply run $apply, $(wc -l < "$RUNNER_TEMP/apply.log") verdict lines"
          else
            echo "BLIND no completed apply run among the last 40 oke-check dispatches"; : > "$RUNNER_TEMP/apply-run.json"; : > "$RUNNER_TEMP/apply.log"
          fi
          echo "prs $(jq length "$RUNNER_TEMP/prs.json") changes $(jq length "$RUNNER_TEMP/changes.json") decisions $(jq length "$RUNNER_TEMP/decisions.json") incidents $(jq length "$RUNNER_TEMP/incidents.json" 2>/dev/null || echo 0)"
      - name: router lanes, one measured call of one token per lane (bin/idp-router-lanes)
        env:
          LITELLM_API_KEY: ${{ secrets.SEED_HERMES_LITELLM_API_KEY }}   # the virtual key conscience-ask.yml already uses
        run: |
          set -uo pipefail
          bin/idp-router-lanes --config platform/llm/config.yaml --zone-from clusters/oke/estate-config.yaml --out "$RUNNER_TEMP/lanes.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: build and validate against platform/estate-state/schema.json
        env:
          GH_TOKEN: ${{ github.token }} # the document's clock is GitHub's Date header (crew#583)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          bin/idp-estate-state-build --cluster-receipt "$RUNNER_TEMP/cluster.txt" --feed "$RUNNER_TEMP/feed.md" \
            --rulings "$RUNNER_TEMP/rulings.json" --drill-log "$RUNNER_TEMP/drill.log" --drill-at "$(cat "$RUNNER_TEMP/drill.at")" \
            --issues "$RUNNER_TEMP/issues.json" --runs "$RUNNER_TEMP/runs.json" --window-hours 6 \
            --registry platform/vendors/consoles.yaml --secrets "$RUNNER_TEMP/secrets.json" \
            --apply-run "$RUNNER_TEMP/apply-run.json" --apply-log "$RUNNER_TEMP/apply.log" --lanes "$RUNNER_TEMP/lanes.json" \
            --prs "$RUNNER_TEMP/prs.json" --incidents "$RUNNER_TEMP/incidents.json" \
            --decision-commits "$RUNNER_TEMP/decisions.json" --changes "$RUNNER_TEMP/changes.json" \
            --main-sha "idp=$GITHUB_SHA" --out "$RUNNER_TEMP/out/estate-state.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: render the Flux report for the portal's Reports page (crew#684, founder 2026-09-01)
        run: |
          set -euo pipefail
          bin/idp-reports-render flux-state --cluster-receipt "$RUNNER_TEMP/cluster.txt" --out-dir "$RUNNER_TEMP/reports" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: estate-reports-flux
          path: ${{ runner.temp }}/reports/*
      - name: publish, never on a pull request (a PR builds and validates, main publishes)
        if: github.event_name != 'pull_request'
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$T" | flux push artifact "$ARTIFACT" --path="$RUNNER_TEMP/out" \
            --source="https://github.com/chidionyema/idp" --revision="$GITHUB_SHA" --creds "chidionyema:$(cat)" >/dev/null
          echo "ok      estate-state pushed $ARTIFACT revision $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
  # crew#684 (founder 2026-09-01: "can we automate all reports, need report tab in Backstage"): the
  # portal's /reports page reads docs/reports/index.json through the /estate-state proxy, which
  # serves the state/live-diagram branch. This job puts the Flux report there every run and folds
  # its meta fragment into the index (upsert by id, so the daily delivery report written by
  # estate-inventory.yml is kept). bin/catalog-render carries docs/reports forward when it
  # force-pushes the branch. Two writers can race on the push; the loop rebases and retries.
  publish-reports:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # crew lineage (root cause, LAW 6): state/live-diagram is DELIBERATELY intermittent --
      # bin/catalog-render force-pushes it fresh from origin/main each run and, after a render PR
      # merges with delete-branch, the origin branch vanishes until the next catalog-render push
      # recreates it (bin/catalog-render:32,41,48,121). A hard `ref: state/live-diagram` here made
      # this job fail on every run that landed in the window where the branch was absent -- exactly
      # the estate-state failures seen 2026-09-06 (publish-reports dying at checkout). main always
      # carries docs/reports forward (catalog-render's carry), so bootstrap from main when the
      # branch is absent: the job's own commit+push below then recreates the branch with the new
      # report, breaking the deadlock instead of wedging on it.
      - name: choose checkout ref (live branch when present, else main - never hard-fail on an intermittently absent ref, estate-state publish-reports deadlock LAW 45)
        id: ref
        run: |
          set -euo pipefail
          if git ls-remote --heads origin refs/heads/state/live-diagram | grep -q .; then
            echo "branch present"
            echo "value=state/live-diagram" >> "$GITHUB_OUTPUT"
          else
            echo "branch absent -- bootstrapping from main (carried reports)"
            echo "value=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: estate-reports-flux
          path: ${{ runner.temp }}/reports
      - name: put the report on the branch the Reports page reads
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/reports/flux-state.md"
          mkdir -p docs/reports
          cp "$RUNNER_TEMP"/reports/*.md docs/reports/
          [ -s docs/reports/index.json ] || echo '{"reports":[]}' > docs/reports/index.json
          for frag in "$RUNNER_TEMP"/reports/*.meta.json; do
            jq --slurpfile e "$frag" '.reports = (((.reports // []) | map(select(.id != $e[0].id))) + $e | sort_by(.id)) | .updated_at = (now | todate)' docs/reports/index.json > docs/reports/index.json.new
            mv docs/reports/index.json.new docs/reports/index.json
          done
          git config user.name "estate-state"
          git config user.email "estate-state@users.noreply.github.com"
          git add docs/reports
          if git diff --cached --quiet; then echo "ok      reports  state branch already holds this report"; exit 0; fi
          git commit -q -m "docs(reports): Flux report from the cluster receipt, run $GITHUB_RUN_ID (crew#684)"
          for attempt in 1 2 3; do
            git push origin HEAD:refs/heads/state/live-diagram && break
            echo "retry $attempt: another writer pushed first; rebasing"
            git pull --rebase origin state/live-diagram
          done
          echo "ok      reports  docs/reports/flux-state.md on state/live-diagram; the Reports page reads it within a minute"
