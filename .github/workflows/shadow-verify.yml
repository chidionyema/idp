# button: Prove a change runs before it merges
# founder: Builds a throwaway Kubernetes cluster, lets Flux deploy the change into it, and fails the pull request unless the workload really starts and stays up. The cluster is destroyed afterwards and can never reach production.
# shadow-verify -- the environment proves the change, on a cluster that did not exist before the job.
#
# Founder, 2026-09-21: "we going for mathematical guarantees" / "agents are not deploying, the
# environment is" / "i dont want agents anywhere near production cluster" / "they do their work,
# handover to environment to verify and deploy".
#
# This job is that handover. It holds NO estate credential and never speaks to OKE. It creates a
# throwaway k3d cluster, installs Flux -- the same reconciler that runs production -- serves this
# PR's tree on the runner's loopback, and pins a Flux GitRepository to the head commit. From that
# point Flux applies the change and Flux decides whether it converged; the job only reads the
# result back out of the API server and grades it fail-closed (bin/idp-shadow-verify).
#
# What it replaces: until today `shadow-verify` was a check name with nothing behind it.
# bin/idp-pr-landable:154 already required it before a type:auto-remediation PR could merge, and
# deploy-when-green.yml already consumed it, so every such PR returned SKIP forever -- fail-closed
# and safe, but the loop never closed. The producer was bin/idp-shadow-run, which minted the green
# line from a JSON observation handed to it on the command line. That file is deleted with this
# commit; a proof a process writes about its own work is not a proof.
name: shadow-verify
# NO paths: filter, deliberately. This check is REQUIRED on the default branch, and GitHub never
# reports a path-filtered check on a PR that does not match its filter -- the PR then waits forever
# on a check that will never arrive. The job therefore always runs and decides its own scope: when
# the diff touches no directory the environment would have to accept, it says so and passes,
# which is a real verdict about a real (empty) scope, not a skip.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      paths:
        description: 'space-separated dirs to reconcile (default: what the diff changed)'
        required: false
      head:
        description: 'commit to prove (default: the dispatched ref); the grader is always the dispatched ref'
        required: false
      base:
        description: 'commit the head is graded against (default: head~1)'
        required: false

concurrency:
  group: shadow-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 2026-10-14, #6194: 24 lines of newTag: bumps went red on 14 of 15 paths, every one a gap the
  # shadow has on any commit (a namespace, CRD or database secret laid by another row; eight paths
  # charged with one dagster pod). A PR is graded on what it CHANGED: the same paths run at the
  # merge-base beside the head, and `judge` fails the PR only for a failure the base does not
  # show. A base run that is missing or BLIND excuses nothing (bin/idp-shadow judge).
  scope:
    runs-on: ubuntu-24.04
    outputs:
      dirs: ${{ steps.scope.outputs.dirs }}
      head: ${{ steps.scope.outputs.head }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The scope is the diff of the commit under test, so it is read from that commit.
          ref: ${{ github.event.inputs.head || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Which directories is this change asking the environment to accept?
        id: scope
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          base="${{ github.event.inputs.base || github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="$(git rev-parse HEAD~1)"
          if [ -n "${{ github.event.inputs.paths }}" ]; then
            dirs="${{ github.event.inputs.paths }}"
          else
            # One owner for this list already exists; a second would disagree with it (crew#623).
            dirs="$(bin/idp-kyverno-dirs "$base" --narrow | tr '\n' ' ')"
          fi
          # The base run proves the tree this PR started from, not whatever main is now.
          mb="$(git merge-base "$base" "$head")"
          {
            echo "dirs=$dirs"
            echo "head=$head"
            echo "base=$mb"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${dirs// /}" ]; then
            echo "no platform directory changed; nothing for the environment to accept"
          else
            echo "the environment is asked to accept: $dirs (head $head, graded against $mb)"
          fi

  run:
    needs: scope
    if: needs.scope.outputs.dirs != ''
    name: shadow-run (${{ matrix.side }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: [head, base]
    steps:
      - uses: actions/checkout@v7
        with:
          # The grader: the PR's own head, or the dispatched ref. The commit it proves is cloned
          # beside it below, so a dispatch can grade any commit with this ref's tool.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lay the commit under test beside the grader
        id: tree
        run: |
          set -euo pipefail
          target="${{ matrix.side == 'head' && needs.scope.outputs.head || needs.scope.outputs.base }}"
          git fetch -q origin "$target" 2>/dev/null || true
          # --shared: every object this checkout fetched is reachable, the target included.
          git clone -q --shared --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/tree/idp"
          git -C "$RUNNER_TEMP/tree/idp" checkout -q --detach "$target"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "the ${{ matrix.side }} run proves $target"

      - name: Install k3d and Flux
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          curl -sSL https://fluxcd.io/install.sh | sudo bash
          k3d version && flux --version

      # idp#5769: every shadow run re-pulls the k3s node image, the Flux controllers and
      # the DB stand-in's image -- ~1GB and a few minutes. The bundle workflow
      # pre-bakes the same list (bin/idp-shadow-bundle-images.txt + the four
      # flux controllers) into a tar and uploads it here. On a hit, k3d image
      # import skips every pod pull; on a miss the run pulls them anyway and
      # the next bundle workflow repopulates the cache.
      - name: Compute the bundle's cache key
        id: bundle_key
        run: |
          set -euo pipefail
          bin/idp-shadow-bundle flux-images > "$RUNNER_TEMP/flux-images.txt"
          key=$(bin/idp-shadow-bundle key --flux-list "$RUNNER_TEMP/flux-images.txt")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "shadow-bundle cache key: $key"

      - name: Restore the shadow image bundle
        id: bundle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/idp-shadow-bundle
          key: ${{ steps.bundle_key.outputs.key }}

      - name: Stand up the shadow cluster and put the environment in it
        run: bin/idp-shadow up

      - name: Bring the bundle into the k3d image store
        if: steps.bundle.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          tar="$RUNNER_TEMP/idp-shadow-bundle/images.tar"
          test -f "$tar" || { echo "bundle cache hit but tar missing at $tar"; exit 1; }
          k3d image import -c shadow "$tar"
          echo "ok  shadow  image bundle restored (cache hit)"

      - name: Hand the commit to Flux and read back what really happened
        id: verify
        env:
          IDP_SHADOW_TIMEOUT: '900'
          IDP_SHADOW_TREE: ${{ runner.temp }}/tree/idp
        run: |
          set -uo pipefail
          args=""
          for d in ${{ needs.scope.outputs.dirs }}; do args="$args --path $d"; done
          # The run's verdict is data for `judge`, not this job's exit: a red head run with a
          # green base must still reach the comparison. The record says how the run ended.
          bin/idp-shadow verify --head "${{ steps.tree.outputs.target }}" $args \
            --record "$RUNNER_TEMP/record/${{ matrix.side }}.json"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: What the environment saw, when it refused
        if: always() && steps.verify.outputs.rc != '0'
        run: |
          kubectl get kustomizations -n flux-system -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          kubectl get pods -A -o wide || true
          for p in $(kubectl get pods -A -o jsonpath='{range .items[?(@.status.phase!="Running")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' 2>/dev/null | head -10); do
            echo "--- logs $p"
            kubectl logs -n "${p%%/*}" "${p##*/}" --tail=50 --all-containers 2>&1 | tail -50 || true
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shadow-record-${{ matrix.side }}
          path: ${{ runner.temp }}/record/${{ matrix.side }}.json
          if-no-files-found: ignore

      - name: Tear the shadow down
        if: always()
        run: bin/idp-shadow down || true

  # The check deploy-when-green and bin/idp-pr-landable read, by this name.
  shadow-verify:
    needs: [scope, run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.scope.outputs.dirs != ''
        continue-on-error: true   # a missing record is graded by judge, fail-closed
        with:
          pattern: shadow-record-*
          path: ${{ runner.temp }}/record
          merge-multiple: true

      - name: Grade the head on what it changed
        run: |
          set -euo pipefail
          if [ "${{ needs.scope.result }}" != "success" ]; then
            echo "FAIL    shadow-verify  the scope job did not finish; the run proves nothing"
            exit 2
          fi
          if [ -z "$(echo '${{ needs.scope.outputs.dirs }}' | tr -d ' ')" ]; then
            echo "no platform directory changed; nothing for the environment to accept"
            exit 0
          fi
          bin/idp-shadow judge \
            --head-record "$RUNNER_TEMP/record/head.json" \
            --base-record "$RUNNER_TEMP/record/base.json"
