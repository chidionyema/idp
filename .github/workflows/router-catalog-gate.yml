# button: Ask every router lane's provider, live
# founder: Catches a retired model or a dead key before a caller does, not after -- every provider
#   this router depends on gets a real, authenticated one-token call on a schedule, from the
#   cloud, with no dependency on any one machine or process being up to notice.
#
# WHY (2026-10-30, incident). A caller's single request fell through deepseek-v4-flash -> minimax
# -> minimax_m31f -> gemini and every one of those four failed: two providers rejected the key,
# Google had retired the pinned model. Nothing caught any of the three before that caller did,
# because the one thing in this estate that asks a provider "does this still work" live
# (platform/llm/router_catalog.py) runs only beside bin/litellm-local's own process -- a single
# machine, checked only when someone is looking at it. This workflow is that same kind of live
# check, run on a schedule from the cloud, independent of any one host answering a loop. A lane
# this workflow cannot see here (no matching repository secret: groq, cerebras, sambanova,
# nvidia, zai) is reported absent, never silently treated as green.
name: router-catalog-gate
on:
  schedule:
    - cron: "11 */1 * * *"  # hourly, minute 11 (not a bare top-of-hour slot)
  workflow_dispatch:
    inputs:
      gate:
        description: "Fail the run on any RED lane (for use as a precondition before a cutover)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      gate:
        type: boolean
        default: true
    outputs:
      red_count:
        value: ${{ jobs.probe.outputs.red_count }}
permissions:
  contents: read
  issues: write
concurrency:
  group: router-catalog-gate
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      red_count: ${{ steps.probe.outputs.red_count }}
      unknown_count: ${{ steps.probe.outputs.unknown_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: install the one thing this needs
        run: pip install -q litellm==1.100.4 pyyaml
      - id: probe
        name: ask every provider live
        env:
          DEEPSEEK_API_KEY: ${{ secrets.SEED_DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.SEED_GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.SEED_MINIMAX_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.SEED_OPENROUTER_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.SEED_KIMI_API_KEY }}
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/report.json"
          # Provider SDKs print to stdout. Never tee that stream as JSON evidence.
          python3 platform/llm/catalog_gate.py llm/config.yaml --output "$RUNNER_TEMP/report.json"
          probe_rc=$?
          summary=$(python3 platform/llm/catalog_gate.py --summary "$RUNNER_TEMP/report.json") || {
            echo "::error::BLIND router catalog: missing/corrupt/incomplete provider receipt"
            exit 70
          }
          red=$(jq -er '.red' <<<"$summary") || exit 70
          unknown=$(jq -er '.unknown' <<<"$summary") || exit 70
          echo "red_count=$red" >> "$GITHUB_OUTPUT"
          echo "unknown_count=$unknown" >> "$GITHUB_OUTPUT"
          if [ "$probe_rc" -ne "$red" ]; then
            echo "::error::BLIND router catalog: probe exit $probe_rc differs from $red RED lanes"
            exit 70
          fi
          if [ "$unknown" -gt 0 ]; then
            echo "::error::BLIND router catalog: $unknown provider lanes not independently verified"
            exit 70
          fi
          exit "$probe_rc"
      - name: file or refresh the one tracking issue, never spam a new one
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Missing/malformed evidence is BLIND, never the previous red=0 fallback.
          summary=$(python3 platform/llm/catalog_gate.py --summary "$RUNNER_TEMP/report.json") || {
            echo "::error::BLIND router catalog: report missing or malformed; existing incident retained"
            exit 70
          }
          red=$(jq -er '.red' <<<"$summary") || exit 70
          unknown=$(jq -er '.unknown' <<<"$summary") || exit 70
          python3 - "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/comment.txt" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          lines = [f"- **{x['lane']}** ({x['model']}): {x['reason'][:200]}" for x in report["red"]]
          text = f"Live provider probe at {report['at']}: {len(report['red'])} RED lane(s).\\n\\n"
          text += "\\n".join(lines)
          open(sys.argv[2], "w").write(text)
          PY
          existing=$(gh api "repos/${GH_REPO}/issues?state=open&labels=router-catalog-gate&per_page=1" --jq '.[0].number' 2>/dev/null || true)
          if [ "$red" -gt 0 ]; then
            printf '\\nRun: %s\\n' "$RUN_URL" >> "$RUNNER_TEMP/comment.txt"
            # The canonical existing #7578 is the fallback, not a new issue.
            target="${existing:-7578}"
            [ "$target" != null ] || target=7578
            gh api "repos/${GH_REPO}/issues/${target}/comments" -F body=@"$RUNNER_TEMP/comment.txt" >/dev/null
          elif [ "$unknown" -gt 0 ]; then
            echo "::warning::BLIND router catalog: $unknown UNKNOWN lane(s); retain existing incident"
          else
            # One green provider sample is not independent incident closure.
            echo "ok catalog receipt verified: all provider lanes green; incident closure remains with its owner"
          fi
      - name: gate
        if: inputs.gate == true
        run: |
          red="${{ steps.probe.outputs.red_count }}"
          unknown="${{ steps.probe.outputs.unknown_count }}"
          [ "$red" = "0" ] && [ "$unknown" = "0" ] || { echo "::error::BLIND/RED catalog: red=${red:-missing}, unknown=${unknown:-missing}"; exit 1; }
