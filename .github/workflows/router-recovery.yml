# button: Recover the router
# founder: Publishes what the recovery host's router needs -- its config bundle, its vault entry and its Cloudflare Tunnel -- and with cutover=true points llm.mumchimp.com at it.
#
# WHY (#7387, 2026-10-29). The OCI free trial ended and OKE cannot exist on this tenancy, so
# llm.mumchimp.com has no backend. platform/oci/recovery-host.tf is one Always Free A1 VM that runs
# the router under podman; at boot it reads, by instance principal, exactly two things this workflow
# writes: the vault entry `router-recovery` and `bundle.tgz` in its own bucket. No Kubernetes, no
# cluster secret store, no laptop.
#
# WHAT IT WRITES, and what it does not:
#   - bundle.tgz: llm/config.yaml filtered to the lanes whose keys the entry holds, with no paid
#     wildcard, no callbacks but local_caller_auth (the #7311 aei_observer crash and every
#     cluster-only callback stay out), plus platform/llm/local_caller_auth.py. Auth is kept: keyed
#     lanes admit only the laptop router key; nobody gets the master key.
#   - vault entry router-recovery: the vendor keys (repository SEED_* secrets), the laptop caller
#     key (the vault's own `laptop` entry) and the tunnel token. Values are never printed.
#   - Cloudflare: one remotely-managed tunnel `estate-recovery` routing llm-recovery.mumchimp.com
#     (always) and llm.mumchimp.com (only with cutover=true) to the router. The DNS change for
#     llm.mumchimp.com is the cutover; run it only after the candidate hostname answered.
name: router-recovery
on:
  workflow_dispatch:
    inputs:
      cutover:
        description: "also point llm.mumchimp.com at the recovery tunnel (after llm-recovery answered)"
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
concurrency: { group: oke-check, cancel-in-progress: false } # shares the state bucket with oke-check
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API: https://api.cloudflare.com/client/v4
      TUNNEL: estate-recovery
      ZONE: mumchimp.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: "1.12.6", tofu_wrapper: false }
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt pyyaml
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}

      - name: The bundle (config + auth module)
        env:
          SERVED: DEEPSEEK_API_KEY,GEMINI_API_KEY,OPENROUTER_API_KEY,MINIMAX_API_KEY,MOONSHOT_API_KEY
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle/modules"
          cp platform/llm/local_caller_auth.py "$RUNNER_TEMP/bundle/modules/"
          python3 - "$RUNNER_TEMP/bundle/config.yaml" <<'PY'
          import os, sys, yaml
          cfg = yaml.safe_load(open("llm/config.yaml"))
          served_keys = set(os.environ["SERVED"].split(","))
          kept = []
          for m in cfg.get("model_list", []):
              key = str(m.get("litellm_params", {}).get("api_key", ""))
              model = str(m.get("litellm_params", {}).get("model", ""))
              if "ollama" in model or "*" in m["model_name"]:
                  continue  # no local lane on this host; no wildcard that could reach a paid model
              if key.startswith("os.environ/") and key.split("/", 1)[1] not in served_keys:
                  continue  # a lane whose key this host does not hold can only fail
              kept.append(m)
          cfg["model_list"] = kept
          served = {m["model_name"] for m in kept}
          rs = cfg.setdefault("router_settings", {})
          rs["fallbacks"] = [{s: [t for t in ts if t in served]} for e in rs.get("fallbacks", [])
                             for s, ts in e.items() if s in served and any(t in served for t in ts)]
          for k in ("redis_host", "redis_port", "redis_password"):
              rs.pop(k, None)
          ls = cfg.setdefault("litellm_settings", {})
          ls["callbacks"] = ["local_caller_auth.proxy_handler_instance"]
          for k in ("success_callback", "failure_callback", "cache", "cache_params"):
              ls.pop(k, None)
          gs = cfg.setdefault("general_settings", {})
          gs["custom_auth"] = "local_caller_auth.user_api_key_auth"
          for k in ("database_url", "master_key", "store_model_in_db"):
              gs.pop(k, None)
          yaml.safe_dump(cfg, open(sys.argv[1], "w"), sort_keys=False)
          print(f"ok      bundle  {len(kept)} lanes: {sorted(served)}")
          PY
          tar -czf "$RUNNER_TEMP/bundle.tgz" -C "$RUNNER_TEMP/bundle" .

      - name: The tunnel, and its token
        id: tunnel
        env:
          ROOT: ${{ secrets.SEED_CLOUDFLARE_ROOT_TOKEN }}
          ACCOUNT: ${{ secrets.SEED_R2_ACCOUNT_ID }}
          CUTOVER: ${{ inputs.cutover }}
        run: |
          set -euo pipefail
          [ -n "$ROOT" ] && [ -n "$ACCOUNT" ] || { echo "BLIND   cloudflare  SEED_CLOUDFLARE_ROOT_TOKEN / SEED_R2_ACCOUNT_ID missing"; exit 2; }
          groups=$(curl -sS -H "Authorization: Bearer $ROOT" "$API/user/tokens/permission_groups")
          gid() { jq -r --arg n "$1" --arg s "$2" '.result[] | select(.name==$n and (.scopes|index($s))) | .id' <<<"$groups" | head -1; }
          T=$(gid "Cloudflare Tunnel Write" com.cloudflare.api.account); D=$(gid "DNS Write" com.cloudflare.api.account.zone)
          [ -n "$T" ] && [ -n "$D" ] || { echo "FAIL    cloudflare  permission groups 'Cloudflare Tunnel Write'/'DNS Write' not found"; exit 1; }
          body=$(jq -nc --arg n "router-recovery $GITHUB_RUN_ID" --arg a "$ACCOUNT" --arg t "$T" --arg d "$D" --arg e "$(date -u -d '+1 hour' +%FT%TZ)" \
            '{name:$n, expires_on:$e, policies:[
               {effect:"allow", resources:{("com.cloudflare.api.account."+$a):"*"}, permission_groups:[{id:$t}]},
               {effect:"allow", resources:{("com.cloudflare.api.account."+$a):{"com.cloudflare.api.account.zone.*":"*"}}, permission_groups:[{id:$d}]}]}')
          out=$(curl -sS -X POST -H "Authorization: Bearer $ROOT" -H 'Content-Type: application/json' -d "$body" "$API/user/tokens")
          jq -e .success <<<"$out" >/dev/null || { echo "FAIL    cloudflare  token mint refused: $(jq -c .errors <<<"$out")"; exit 1; }
          CF=$(jq -r .result.value <<<"$out"); echo "::add-mask::$CF"
          cf() { curl -sS -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' "$@"; }
          id=$(cf "$API/accounts/$ACCOUNT/cfd_tunnel?name=$TUNNEL&is_deleted=false" | jq -r '.result[0].id // empty')
          if [ -z "$id" ]; then
            id=$(cf -X POST "$API/accounts/$ACCOUNT/cfd_tunnel" -d "{\"name\":\"$TUNNEL\",\"config_src\":\"cloudflare\"}" | jq -r .result.id)
            echo "ok      tunnel  created $TUNNEL"
          fi
          hosts='["llm-recovery.mumchimp.com"]'; [ "$CUTOVER" = true ] && hosts='["llm-recovery.mumchimp.com","llm.mumchimp.com"]'
          ingress=$(jq -nc --argjson h "$hosts" '{config:{ingress:([$h[] | {hostname:., service:"http://127.0.0.1:4000"}] + [{service:"http_status:404"}])}}')
          cf -X PUT "$API/accounts/$ACCOUNT/cfd_tunnel/$id/configurations" -d "$ingress" | jq -e .success >/dev/null
          zone=$(cf "$API/zones?name=$ZONE" | jq -r '.result[0].id')
          for h in $(jq -r '.[]' <<<"$hosts"); do
            rec=$(cf "$API/zones/$zone/dns_records?name=$h" | jq -r '.result[0].id // empty')
            want=$(jq -nc --arg n "$h" --arg c "$id.cfargotunnel.com" '{type:"CNAME", name:$n, content:$c, proxied:true, comment:"router-recovery (#7387)"}')
            if [ -n "$rec" ]; then cf -X PUT "$API/zones/$zone/dns_records/$rec" -d "$want" | jq -e .success >/dev/null
            else cf -X POST "$API/zones/$zone/dns_records" -d "$want" | jq -e .success >/dev/null; fi
            echo "ok      dns     $h -> tunnel $TUNNEL"
          done
          tok=$(cf "$API/accounts/$ACCOUNT/cfd_tunnel/$id/token" | jq -r .result); echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: The vault entry and the bundle, written
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OKE_SSH_PUBKEY_TEXT: ${{ vars.OKE_SSH_PUBKEY }}   # bin/idp-oci-login --check refuses without it (run 40845502703)
          OKE_ALLOWED_CIDRS: ${{ vars.OKE_ALLOWED_CIDRS }}
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}
          SEED_DEEPSEEK_API_KEY: ${{ secrets.SEED_DEEPSEEK_API_KEY }}
          SEED_GEMINI_API_KEY: ${{ secrets.SEED_GEMINI_API_KEY }}
          SEED_OPENROUTER_API_KEY: ${{ secrets.SEED_OPENROUTER_API_KEY }}
          SEED_MINIMAX_API_KEY: ${{ secrets.SEED_MINIMAX_API_KEY }}
          SEED_MOONSHOT_API_KEY: ${{ secrets.SEED_KIMI_API_KEY }}
          SEED_TUNNEL_TOKEN: ${{ steps.tunnel.outputs.token }}
        run: |
          set -euo pipefail
          bin/idp-oci-login --check
          (cd platform/oci && tofu init -input=false -reconfigure -no-color >/dev/null)
          caller=$(bin/idp-cloud secret get laptop | jq -r .key); echo "::add-mask::$caller"
          export ESTATE_ENV_FILE="$RUNNER_TEMP/seed.env"; umask 077
          { env | sed -n 's/^SEED_//p'; echo "ESTATE_LOCAL_CALLER_KEY=$caller"; } > "$ESTATE_ENV_FILE"
          bin/idp-vault-put --merge router-recovery \
            DEEPSEEK_API_KEY=DEEPSEEK_API_KEY GEMINI_API_KEY=GEMINI_API_KEY OPENROUTER_API_KEY=OPENROUTER_API_KEY \
            MINIMAX_API_KEY=MINIMAX_API_KEY MOONSHOT_API_KEY=MOONSHOT_API_KEY TUNNEL_TOKEN=TUNNEL_TOKEN \
            ESTATE_LOCAL_CALLER_KEY=ESTATE_LOCAL_CALLER_KEY
          rm -f "$ESTATE_ENV_FILE"
          oci os object put --namespace "$OCI_OS_NAMESPACE" --bucket-name estate-router-recovery \
            --name bundle.tgz --file "$RUNNER_TEMP/bundle.tgz" --force >/dev/null
          echo "ok      bundle  uploaded to estate-router-recovery/bundle.tgz"

      - name: The candidate answers
        run: |
          for i in $(seq 1 20); do
            c=$(curl -s -m 10 -o /dev/null -w '%{http_code}' https://llm-recovery.mumchimp.com/health/liveliness || true)
            [ "$c" = 200 ] && { echo "ok      llm-recovery.mumchimp.com/health/liveliness 200"; exit 0; }
            sleep 15
          done
          echo "WAIT    llm-recovery.mumchimp.com not answering yet ($c): the host may still be booting; re-run later"
