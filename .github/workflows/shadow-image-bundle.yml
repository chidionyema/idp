name: shadow-image-bundle
# idp#5769: the shadow-verify workflow restores this cache on every run; we keep
# the cache warm by rebuilding it on a daily schedule and on any change to the
# image manifest. The tar is restored on a hit and skipped on a miss (the
# shadow pulls the same images anyway, the next populate repopulates).

on:
  schedule:
    - cron: '17 6 * * *'   # once a day, 06:17 UTC, off the image-update peak
  push:
    paths: ['bin/idp-shadow-bundle-images.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }

      - name: Install Flux
        # The bundle's four flux-controller refs are pinned to whatever
        # `flux install --export` writes today; we re-derive them below so the
        # cache stays in sync with Flux's own release cadence.
        run: |
          set -euo pipefail
          curl -sSL https://fluxcd.io/install.sh | sudo bash
          flux --version

      - name: Build the bundle
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/idp-shadow-bundle"
          # Static manifest (k3s node image + DB stand-in). rg is the local
          # convention (AGENTS.md §10) but the runner is a fresh ubuntu image
          # without it; grep -E is the port that's there.
          cat bin/idp-shadow-bundle-images.txt \
            | grep -vE '^\s*(#|$)' \
            >  "$RUNNER_TEMP/idp-shadow-bundle/all-images.txt"
          # Flux controllers, derived from the same manifest the shadow applies.
          bin/idp-shadow-bundle flux-images \
            > "$RUNNER_TEMP/idp-shadow-bundle/flux-images.txt"
          cat "$RUNNER_TEMP/idp-shadow-bundle/flux-images.txt" \
            >> "$RUNNER_TEMP/idp-shadow-bundle/all-images.txt"
          echo "bundle images:"
          cat "$RUNNER_TEMP/idp-shadow-bundle/all-images.txt"
          bin/idp-shadow-bundle export "$RUNNER_TEMP/idp-shadow-bundle/images.tar"

      - name: Compute the cache key
        id: keygen
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          key=$(bin/idp-shadow-bundle key --flux-list "$RUNNER_TEMP/idp-shadow-bundle/flux-images.txt")
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "cache key: $key"

      - name: Upload the bundle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/idp-shadow-bundle
          # The key is what shadow-verify computes in its own 'Compute the
          # cache key' step; the bin script guarantees they match.
          key: ${{ steps.keygen.outputs.key }}
