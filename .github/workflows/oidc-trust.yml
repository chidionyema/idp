# button: OIDC trust
# founder: Which GitHub jobs may become the estate's cloud identity. Only reviewed main, the image controller's branch and engine-raised pull requests; never a lane.
#
# WHY. 2026-11-06: the identity domain's propagation trust admitted `sub eq <repo prefix>*`, so a
# job on ANY ref could trade its OIDC token for the estate-ci session that reads the GitHub App key.
# Lane branches forked before #7743 still carry a push-triggered greenlane.yml, and GitHub runs a
# push from the pushed branch's YAML (50 such runs on lane/* in one hour that day). The declared
# contexts live in platform/github/oidc-trust.json; bin/idp-oidc-trust reconciles the trust to them.
#
#   schedule          check: the live rules equal the declared ones, or FAIL with the drift
#   dispatch apply    reconcile the trust (PATCH impersonationServiceUsers), then re-read and check
#   dispatch probe    the exchange receipt for THIS run's context (claims + the domain's HTTP code,
#                     never a token). Dispatched on a non-main ref it is the falsifier: it must be refused.
name: oidc-trust
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check, apply, or probe"
        type: choice
        options: [check, apply, probe]
        default: check
permissions:
  id-token: write   # the OIDC token this job trades for OCI access
  contents: read
concurrency:
  group: oidc-trust
  cancel-in-progress: false
jobs:
  trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: exchange receipt (claims of the job token and the domain's answer; never the tokens)
        id: receipt
        env:
          OIDC: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          EP: ${{ vars.DOMAIN_BASE_URL }}
        run: |
          set -euo pipefail
          JWT=$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://cloud.oracle.com" | jq -r .value)
          printf '%s' "$JWT" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{sub,ref,event_name,job_workflow_ref}' || true
          PUB=$(openssl genrsa 2048 2>/dev/null | openssl rsa -pubout -outform DER 2>/dev/null | base64 -w0)
          code=$(curl -sS -o /tmp/x.json -w '%{http_code}' -u "$OIDC" "${EP%/}/oauth2/v1/token" \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:token-exchange --data-urlencode requested_token_type=urn:oci:token-type:oci-upst \
            --data-urlencode public_key="$PUB" --data-urlencode subject_token="$JWT" --data-urlencode subject_token_type=jwt)
          echo "RESULT  oidc-trust  exchange http=$code context=$(bin/idp-oidc-trust context) declared=$(bin/idp-oidc-trust allowed >/dev/null 2>&1 && echo yes || echo no)"
          jq -c 'del(.token, .access_token, .id_token)' /tmp/x.json 2>/dev/null | head -c 300; echo; rm -f /tmp/x.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: inputs.mode != 'probe'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - if: inputs.mode != 'probe'
        run: pip install -q -r .github/requirements/oci-cli.txt
      - if: inputs.mode != 'probe'
        name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - if: inputs.mode != 'probe'
        name: bin/idp-oidc-trust ${{ inputs.mode || 'check' }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_REGION: ${{ vars.OCI_REGION }}
          DOMAIN_BASE_URL: ${{ vars.DOMAIN_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          OIDC_CLIENT_IDENTIFIER: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}   # apply re-proves main can still exchange
        run: bin/idp-oidc-trust ${{ inputs.mode || 'check' }}
