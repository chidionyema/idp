name: Router oxygen secret-binding proof (read-only)
# #8416: real GitHub Actions inputs, no OCI auth, no model, no deployment.
on:
  push:
    branches:
      - research/8416-router-vault-custody-20261123
    paths:
      - .github/workflows/router-oxygen-custody-one-shot.yml
permissions:
  contents: read
jobs:
  binding:
    if: github.ref == 'refs/heads/research/8416-router-vault-custody-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independently execute release-lease falsifiers (no credentials)
        working-directory: platform/router-edge
        run: |
          node --check scripts/with-workers-lease.mjs
          node --test tests/with-workers-lease.test.mjs
      - name: Full router test suite before any release promotion
        working-directory: platform/router-edge
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.131.0
          npm test
          node --test tests/release.falsifier.mjs
      - name: Observe binding presence at same secret names as production release
        env:
          CF_ROOT: ${{ secrets.SEED_CLOUDFLARE_ROOT_TOKEN }}
          CF_WORKERS_GH: ${{ secrets.SEED_CLOUDFLARE_WORKERS_TOKEN }}
          CF_ACCOUNT: ${{ secrets.SEED_R2_ACCOUNT_ID }}
          CLIENT_GH: ${{ secrets.SEED_MERIDIAN_CLIENT_KEY }}
          ADMIN_GH: ${{ secrets.SEED_MERIDIAN_ADMIN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'schema=meridian/router-release-inputs-v1'
          for var in CF_ROOT CF_WORKERS_GH CF_ACCOUNT CLIENT_GH ADMIN_GH; do
            if [ -n "${!var:-}" ]; then printf '%s=BOUND\n' "$var"; else printf '%s=UNBOUND\n' "$var"; fi
          done
          echo 'status=SOURCE_INPUT_PRESENCE_ONLY_NOT_DEPLOYED'
