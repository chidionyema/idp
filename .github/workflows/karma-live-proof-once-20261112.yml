name: karma-live-proof-once-20261112
on:
  push:
    branches: [lane/karma-live-observation-20261112]
    paths:
      - .github/workflows/karma-live-proof-once-20261112.yml
permissions:
  contents: write
  actions: read
jobs:
  live-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lane/karma-live-observation-20261112
      - name: Observe actual estate GitHub runs without inventing identity or yield
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 bin/idp-karma-observe --repo chidionyema/idp --json > /tmp/karma-live.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/karma-live.json'))
          assert d['coverage']['runs_accepted'] > 0, 'no real GitHub events observed'
          assert d['coverage']['unlinked_to_obligation'] > 0, 'false assertion of complete FLOW links'
          assert d['state'] == 'MEASURED_WITH_UNVERIFIED_YIELD'
          print('KARMA_LIVE_EVIDENCE:',json.dumps({
            'schema':d['schema'],'state':d['state'],'time':d['recorded_at'],
            'repo':d['repo'],'accepted':d['coverage']['runs_accepted'],
            'unlinked':d['coverage']['unlinked_to_obligation'],
            'yield_coverage':d['coverage']['yield_coverage'],
            'example':d['runs'][0]['evidence_url'],
            'source_sha':d['runs'][0]['source_sha'],
            'unknowns':d['missing_observations'],
          },sort_keys=True))
          PY
      - name: Retire the single-use read-only proof workflow
        run: |
          set -euo pipefail
          rm .github/workflows/karma-live-proof-once-20261112.yml
          git add -u .github/workflows/karma-live-proof-once-20261112.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(karma): live GitHub observation with explicit missing FLOW links' -m 'Claim: chidionyema/idp#7452' -m 'Agent: chatgpt-github'
          git push origin HEAD:refs/heads/lane/karma-live-observation-20261112
