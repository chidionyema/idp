# button: Close a pull request opened over the repo-wide cap
# founder: 2026-09-17 "limit no of open PRs 5 maximum"; 2026-09-27 "it should not even be possible
#   to have these many PRs open" (16 were: bin/idp-max-open-prs-gate existed, was wired nowhere, and
#   passed whenever it had no token).
# The guarantee: a PR opened, reopened or marked ready while the repo already holds the cap is
# closed on its own thread, its branch untouched (nothing is lost; reopen after something lands).
# pull_request_target runs main's copy of the gate, never the PR's code. Only bot lanes are exempt
# (as in the gate); a branch name exempts nothing here, or naming a branch consolidate-* would.
name: pr-cap
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-cap
  cancel-in-progress: false
jobs:
  cap:
    if: ${{ !startsWith(github.head_ref, 'flux/') && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: close this PR if the repo is over the cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          out=$(python3 bin/idp-max-open-prs-gate 2>&1); rc=$?
          echo "$out"
          [ "$rc" = 0 ] && exit 0
          [ "$rc" = 1 ] || { echo "::error::cannot read open PRs (rc=$rc)"; exit 1; }
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Closed by pr-cap: the repo is over its open-PR cap (5 non-bot). Your branch is untouched. Land or consolidate an open PR, then reopen this one.

          \`\`\`
          $out
          \`\`\`"
          gh pr close "$PR" --repo "$GITHUB_REPOSITORY"
          exit 1
