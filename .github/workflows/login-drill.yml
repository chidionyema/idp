# button: Test the front-door sign-in
# founder: Signs in at the front door the way a person does and reports whether the door offers
#          the Face ID / security-key step. A drill is an adversary, not a downstream step: it
#          runs on its own clock whether the platform pipeline is green, red or absent. The
#          id-token: write permission is what exchanges the GitHub OIDC token for a one-hour OCI
#          session token via gtrevorrow/oci-token-exchange-action; without it the OCI step dies
#          with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env variable" and the drill never
#          runs (verdict-surfaces.yml missed this and the battery was silently skipped for weeks).
#          Scoped to the sign-in chain and the MFA step only -- the 15-surface walk that lived
#          here before crew#307 CP2 was deleted by the founder in 6cbad3742, and only this
#          narrower question ("does the door offer Face ID?") is being brought back.
name: login-drill
on:
  schedule:
    - cron: "7 * * * *"   # hourly sign-in + MFA observation
  workflow_dispatch:
    inputs:
      enroll:
        description: "Complete the Face ID ceremony with a virtual authenticator (creates a FIDO2 credential for estate-drill on the domain; limited to maxEnrolledDevices)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - bin/idp-login-drill
      - .github/workflows/login-drill.yml
      - .github/requirements/login-drill.txt
      - platform/identity/**
permissions:
  id-token: write
  contents: read
  issues: write
concurrency:
  group: login-drill
  cancel-in-progress: false
jobs:
  login-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          # Both files, because login-drill.txt starts with `-r oci-cli.txt`: a key that hashed only
          # the referring file would keep restoring a stale cache after oci-cli.txt changed,
          # while reading exactly like a key that tracked the install (crew#488 CP6).
          cache-dependency-path: |
            .github/requirements/login-drill.txt
            .github/requirements/oci-cli.txt
      - name: oci cli and a headless browser
        run: |
          pip install -q -r .github/requirements/login-drill.txt
          playwright install --with-deps chromium
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-login-drill
        id: drill
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          DRILL_SHOT: ${{ runner.temp }}/login-drill-home.png
          DRILL_ENROLL: ${{ inputs.enroll == 'true' && '1' || '0' }}
        run: |
          set -o pipefail
          bin/idp-login-drill 2>&1 | tee drill.out
      - name: the picture of the page it graded, red or green
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: login-drill-home
          path: ${{ runner.temp }}/login-drill-home.png
          if-no-files-found: warn
          retention-days: 14
      - name: the verdict is on the run summary, pass or fail
        if: always()
        run: |
          line=$(grep -E '^(ok|FAIL) +login-drill' drill.out | tail -1 || true)
          printf '### login-drill\n```\n%s\n```\n' "${line:-no verdict line: the drill died before printing one}" >> "$GITHUB_STEP_SUMMARY"
      - name: a failed drill is an open P0 on this repository, never a badge nobody reads
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -E '^FAIL +login-drill' drill.out | tail -1 || true)
          line=${line:-"login-drill died before printing a verdict"}
          body=$(printf '%s\nrun: %s/%s/actions/runs/%s\n' "$line" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          n=$(gh issue list --state open --search 'in:title "P0: login drill failed"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh label create P0 --color B60205 --description "service down for the founder" --force >/dev/null; gh issue create --title "P0: login drill failed" --label P0 --body "$body"; fi
      # crew#301: a green run closes the P0 it opened. An issue that never closes is an instrument nobody reads.
      - name: a green drill closes the open P0, with the run as the receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search 'in:title "P0: login drill failed"' --json number -q '.[0].number')
          [ -z "$n" ] && exit 0
          gh issue close "$n" --reason completed --comment "$(printf 'green: the door offered the Face ID / security-key step and the sign-in completed.\nrun: %s/%s/actions/runs/%s' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
