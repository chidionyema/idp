# crew#292 CP1, rewritten under crew#307. A drill is an adversary, not a downstream step: it runs
# on its own clock whether the platform pipeline is green, red or absent, because as a `needs:`
# of the tofu check it was skipped on every check red and the skip read as green while the
# catalogue served the founder an error. Same machine identity as oke-check (GitHub OIDC token
# exchanged for a one-hour OCI session token); the drill's credential is the domain password
# Terraform put in the vault, read by name, never printed.
name: login-drill
on:
  schedule:
    - cron: "7 * * * *"   # hourly full sign-in; the five-minute pulse is platform/identity/front-door-heartbeat.yaml (idp#229: GitHub dropped the */5 cron)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - backstage/**
      - platform/backstage/**
      - platform/identity/**
      - platform/edge/**
      - bin/idp-login-drill
      - .github/workflows/login-drill.yml
permissions:
  id-token: write
  contents: read
  issues: write
concurrency:
  group: login-drill
  cancel-in-progress: false
jobs:
  login-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: oci cli and a headless browser
        run: |
          pip install -q oci-cli playwright
          playwright install --with-deps chromium
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-login-drill
        id: drill
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          DRILL_SHOT: ${{ runner.temp }}/login-drill-home.png
        run: |
          set -o pipefail
          bin/idp-login-drill 2>&1 | tee drill.out
      - name: the picture of the page it graded, red or green
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: login-drill-home
          path: ${{ runner.temp }}/login-drill-home.png
          if-no-files-found: warn
          retention-days: 14
      - name: the verdict is on the run summary, pass or fail
        if: always()
        run: |
          line=$(grep -E '^(ok|FAIL) +login-drill' drill.out | tail -1 || true)
          home=$(grep -E '^(home|loc|paths) +login-drill' drill.out || true)
          printf '### login-drill\n```\n%s\n%s\n```\n' "${home:-no home row}" "${line:-no verdict line: the drill died before printing one}" >> "$GITHUB_STEP_SUMMARY"
      - name: a failed drill is an open P0 on this repository, never a badge nobody reads
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -E '^FAIL +login-drill' drill.out | tail -1 || true)
          line=${line:-"login-drill died before printing a verdict"}
          body=$(printf '%s\nrun: %s/%s/actions/runs/%s\nboard: https://github.com/chidionyema/crew/issues/307\n' "$line" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          n=$(gh issue list --state open --search 'in:title "P0: login drill failed"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh label create P0 --color B60205 --description "service down for the founder" --force >/dev/null; gh issue create --title "P0: login drill failed" --label P0 --body "$body"; fi
