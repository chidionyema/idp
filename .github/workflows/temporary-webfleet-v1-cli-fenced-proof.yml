# One-shot source security regression; never merge this scratch workflow.
name: temporary-webfleet-v1-cli-fenced-proof
on:
  push:
    branches: ["proof/7760-v1-cli-fenced-20261122"]
permissions:
  contents: read
  issues: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Prove canonical V1 and no security-regression
        run: |
          set -euo pipefail
          node --check scripts/web-fleet/task-packet.mjs
          node --check scripts/web-fleet/patch-wire.mjs
          node --test platform/lifeboat/test/task-packet.test.mjs tests/web_fleet/github-evidence.test.mjs tests/web_fleet/task-packet.test.mjs
      - name: Re-fetch real IDP main and make V1 data-only task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/web-fleet/task-packet.mjs --issue 8430 --file platform/lifeboat/src/task-packet.js --instruction FIR-07 --task FIR-07-FENCED-CLI-REAL --owner gemini-web-unverified --out "$RUNNER_TEMP/p.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/p.json','utf8'));
          if(p.schema!=='MERIDIAN-TASK-V1'||p.requested_result.authority!=='DATA_ONLY_UNTRUSTED'||p.source_files[0].source_mode!=='100644')throw Error('INVALID_CLI_PROOF');
          console.log(JSON.stringify({source_sha:p.source_sha,payload_sha256:p.payload_sha256,bytes:fs.statSync(process.env.RUNNER_TEMP+'/p.json').size,verdict:'REAL_SOURCE_ONLY_NO_GEMINI_RUN'}));
          NODE
