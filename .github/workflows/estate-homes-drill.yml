name: estate-homes-drill

# The recurring drill (ADR 0037): grade every lane of every critical service, and file what
# is down. A fallback nobody measures is a hope; this is what measures it.
#
# It runs on a schedule, not on a merge: the point is to know on a Tuesday morning which
# home is dead, not to know at deploy time. A red lane is a TICKET (the door files one),
# never a red main: this workflow's job is to keep the board honest, and the board is
# honest when a lane that cannot be asked is reported as UNKNOWN and a lane that is proven
# dead becomes an issue someone owns.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-homes-drill
  cancel-in-progress: true

jobs:
  drill:
    permissions:
      contents: read
      issues: write
      id-token: write  # required by OCI exchange; not granted to Chronos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # A leg's secret is resolved by bin/idp-estate-homes -> vault_get -> `bin/idp-cloud secret
      # get <entry>`, which authenticates with the OCI CLI. The CLI needs a session before any
      # read works, and on a cloud runner the session comes from the GitHub OIDC token -- this is
      # the same two-step preamble vault-reads.yml and vault-seed.yml already use, kept identical
      # on purpose (AGENTS.md section 9 R7: a duplicated contract is one that drifts).
      #
      # Without the session `vault_get` returns "" for every entry, so every lane that needs a
      # secret is UNKNOWN. UNKNOWN is not down, but the board cannot tell the two apart, and a
      # lane nobody can ask held llm-router open (#7844) while groq was answering all along.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: grade every lane and file what is down
        # A leg that needs a secret resolves it through bin/idp-estate-homes -> vault_get ->
        # `bin/idp-cloud secret get <entry>`. These three variables are what make that read
        # possible once the session above exists, and they are the same three every other
        # vault-reading workflow passes -- one contract, not a fourth copy (AGENTS.md 9 R7).
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # The floor is UNKNOWN without its credential; do not misgrade it as down.
          # These references yield empty values if the repo/org secrets are absent.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LIFEBOAT_KEY: ${{ secrets.LIFEBOAT_KEY }}
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          python3 bin/idp-estate-homes | tee drill.txt
      - name: keep the board
        uses: actions/upload-artifact@v7
        with:
          name: estate-lanes
          path: drill.txt
          retention-days: 14

  # Independent read-only observer of delivered cadence. Recovered from historical
  # candidate c817327dd/4207642d7; separate job because the existing homes drill
  # owns OCI credentials and must not gain contents:write or an unneeded token.
  # This does not schedule any business operation; it grades actual scheduled runs.
  chronos:
    if: always()
    needs: drill
    permissions:
      contents: write   # publish state to refs/chronos/state only via lease
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: prove Chronos can refuse ghosts and blind data
        run: python3 bin/idp-estate-clocks-proof
      # Chronos: did every DECLARED clock actually deliver, inside its own tolerance?
      #
      # Its exit codes follow the estate's ok_exit convention, so they mean different
      # things and are reported differently:
      #   0  every declared clock delivered
      #   1  at least one MISSED_CYCLE / NOT_HERE -- a finding, filed as a ticket below
      #   2  BLIND: the runs could not be read at all -- never treated as healthy (R1)
      #
      # continue-on-error is deliberate and is NOT a swallowed failure: the lane artifact
      # above is the primary product of this workflow, and a Chronos finding must not
      # cost the estate its home grading. The finding is carried in the step summary and
      # in a filed issue instead.
      - name: chronos -- measure delivered cadence, not declared cadence
        id: chronos
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 bin/idp-estate-clocks --gate 2>&1 | tee chronos.txt
          code=${PIPESTATUS[0]}
          echo "exit=$code" | tee -a chronos.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo '### Chronos: delivered cadence'
            echo '```'
            cat chronos.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # A clock that stopped is a ticket someone owns, exactly like a dead lane -- not a
      # red main and not a line in a log nobody reads. Exit 2 (BLIND) is filed too, and
      # says so in its title: the estate must never let 'cannot judge' pass as healthy.
      - name: file a clock that missed its cadence
        if: steps.chronos.outcome == 'success' && steps.chronos.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.chronos.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          exit_code = os.environ.get("EXIT_CODE", "")
          blind = exit_code == "2"
          title = (
              "chronos: clock state is BLIND - delivered cadence could not be measured"
              if blind
              else "chronos: a declared clock missed its cadence"
          )
          with open("chronos.txt", encoding="utf-8") as handle:
              board = handle.read().strip()
          body = "\n".join([
              f"Chronos measured the delivered cadence of every declared clock and exited **{exit_code}**.",
              "",
              "Exit 2 means BLIND: the runs could not be read, which is never the same fact as",
              "healthy. Exit 1 means a finding: a clock is past its own tolerance, has never",
              "fired, or its workflow is no longer in the tree.",
              "",
              f"```\n{board}\n```",
              "",
              f"Run: {os.environ.get('RUN_URL', '')}",
              "",
              "Registry: `legions/estate-clocks.json` (legion 3). Claim: idp#7799.",
          ])
          # One open issue per state, not one per run: a twice-hourly drill that filed a
          # ticket every tick would bury the board it is trying to keep honest.
          existing = subprocess.run(
              ["gh", "issue", "list", "--state", "open", "--search", f'{title} in:title',
               "--json", "number", "--jq", ".[0].number // empty"],
              capture_output=True, text=True, check=False,
          ).stdout.strip()
          if existing:
              subprocess.run(["gh", "issue", "comment", existing, "--body", body], check=False)
              print(f"commented on existing issue #{existing}")
          else:
              subprocess.run(
                  ["gh", "issue", "create", "--title", title, "--body", body],
                  check=False,
              )
          PY

      - name: publish the chronos board to the founder's surface
        # The founder's live surface is ARGON, which reads idp state by one shallow TOKENLESS
        # fetch of a ref (src/engine/greenlaneFeed.ts) rather than through the REST rate limit.
        # So the board ships the same way: refs/chronos/state, a sibling of refs/greenlane/state.
        #
        # This runs even when the gate found a miss (exit 1): a missed cadence is exactly what
        # the founder must be able to see. It does NOT run on exit 2 -- a blind registry must
        # leave the last true board in place rather than replace it with an empty one, and the
        # publisher refuses on its own (exit 2) even if this condition were removed.
        if: steps.chronos.outcome == 'success' && steps.chronos.outputs.exit_code != '2'
        env:
          EXIT_CODE: ${{ steps.chronos.outputs.exit_code }}
        run: |
          set -uo pipefail
          git config user.name  "estate-chronos"
          git config user.email "chronos@estate.invalid"
          python3 bin/idp-estate-clocks-publish 2>&1 | tee -a chronos.txt
          code=${PIPESTATUS[0]}
          echo "publish_exit=$code" | tee -a chronos.txt
          {
            echo '### Chronos: board published to the founder surface'
            echo ''
            echo "\`refs/chronos/state\`, detector exit \`${EXIT_CODE}\`, publish exit \`${code}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          # A publish failure is not a cadence finding, so it must not masquerade as one: the
          # gate above owns exit 1/2, this step only reports that the surface did not update.
          exit "$code"

      - name: keep the chronos board
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chronos-clocks
          path: chronos.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: refuse an unmeasurable time plane
        if: always() && steps.chronos.outputs.exit_code == '2'
        run: |
          echo "Chronos BLIND — missing or unreadable clock evidence must never pass as healthy."
          exit 2
