name: estate-homes-drill

# The recurring drill (ADR 0037): grade every lane of every critical service, and file what
# is down. A fallback nobody measures is a hope; this is what measures it.
#
# It runs on a schedule, not on a merge: the point is to know on a Tuesday morning which
# home is dead, not to know at deploy time. A red lane is a TICKET (the door files one),
# never a red main: this workflow's job is to keep the board honest, and the board is
# honest when a lane that cannot be asked is reported as UNKNOWN and a lane that is proven
# dead becomes an issue someone owns.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-homes-drill
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: grade every lane and file what is down
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # The floor is UNKNOWN without its credential; do not misgrade it as down.
          # These references yield empty values if the repo/org secrets are absent.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LIFEBOAT_KEY: ${{ secrets.LIFEBOAT_KEY }}
        run: |
          python3 bin/idp-estate-homes | tee drill.txt
      # What the Cloudflare credential can actually see. One call, names and counts only — no
      # token, no record values. This is the measurement that decides whether the doors can be
      # repointed from CI at all, and it costs a line instead of a session spent guessing at
      # account ownership.
      - name: what the cloudflare token can see
        env:
          CLOUDFLARE_ROOT_TOKEN: ${{ secrets.SEED_CLOUDFLARE_ROOT_TOKEN }}
          ESTATE_ZONE: ${{ vars.ESTATE_ZONE || 'mumchimp.com' }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_ROOT_TOKEN:-}" ]; then
            echo "BLIND: no SEED_CLOUDFLARE_ROOT_TOKEN"; exit 0
          fi
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_ROOT_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("zones visible:", ",".join(z["name"] for z in d.get("result") or []) or "NONE", "| success:", d.get("success"))' \
            || echo "could not list zones"
      - name: keep the board
        uses: actions/upload-artifact@v7
        with:
          name: estate-lanes
          path: drill.txt
          retention-days: 14
