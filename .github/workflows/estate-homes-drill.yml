name: estate-homes-drill

# The recurring drill (ADR 0037): grade every lane of every critical service, and file what
# is down. A fallback nobody measures is a hope; this is what measures it.
#
# It runs on a schedule, not on a merge: the point is to know on a Tuesday morning which
# home is dead, not to know at deploy time. A red lane is a TICKET (the door files one),
# never a red main: this workflow's job is to keep the board honest, and the board is
# honest when a lane that cannot be asked is reported as UNKNOWN and a lane that is proven
# dead becomes an issue someone owns.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-homes-drill
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: grade every lane and file what is down
        # A leg that needs a secret resolves it through bin/idp-estate-homes -> vault_get ->
        # `bin/idp-cloud secret get <entry>`, which authenticates with the OCI CLI. These three
        # variables are what make that read possible, and they are the same three every other
        # vault-reading workflow passes (vault-reads.yml, vault-seed.yml) -- one contract, not a
        # fourth copy (AGENTS.md section 9 R7: contracts duplicated, so they drift).
        #
        # Without them `vault_get` returned "" for every entry and the groq leg reported "secret
        # not in this environment" on every scheduled run by construction: the drill was not
        # measuring whether groq answers, it was measuring that CI had no credential. That is a
        # lane that could never pass, which is indistinguishable from a lane that is down -- and
        # it held llm-router open (#7844).
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          python3 bin/idp-estate-homes | tee drill.txt
      - name: keep the board
        uses: actions/upload-artifact@v7
        with:
          name: estate-lanes
          path: drill.txt
          retention-days: 14
