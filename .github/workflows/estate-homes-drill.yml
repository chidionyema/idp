name: estate-homes-drill

# The recurring drill (ADR 0037): grade every lane of every critical service, and file what
# is down. A fallback nobody measures is a hope; this is what measures it.
#
# It runs on a schedule, not on a merge: the point is to know on a Tuesday morning which
# home is dead, not to know at deploy time. A red lane is a TICKET (the door files one),
# never a red main: this workflow's job is to keep the board honest, and the board is
# honest when a lane that cannot be asked is reported as UNKNOWN and a lane that is proven
# dead becomes an issue someone owns.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-homes-drill
  cancel-in-progress: true

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # A leg's secret is resolved by bin/idp-estate-homes -> vault_get -> `bin/idp-cloud secret
      # get <entry>`, which authenticates with the OCI CLI. The CLI needs a session before any
      # read works, and on a cloud runner the session comes from the GitHub OIDC token -- this is
      # the same two-step preamble vault-reads.yml and vault-seed.yml already use, kept identical
      # on purpose (AGENTS.md section 9 R7: a duplicated contract is one that drifts).
      #
      # Without the session `vault_get` returns "" for every entry, so every lane that needs a
      # secret is UNKNOWN. UNKNOWN is not down, but the board cannot tell the two apart, and a
      # lane nobody can ask held llm-router open (#7844) while groq was answering all along.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: grade every lane and file what is down
        # A leg that needs a secret resolves it through bin/idp-estate-homes -> vault_get ->
        # `bin/idp-cloud secret get <entry>`. These three variables are what make that read
        # possible once the session above exists, and they are the same three every other
        # vault-reading workflow passes -- one contract, not a fourth copy (AGENTS.md 9 R7).
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # The floor is UNKNOWN without its credential; do not misgrade it as down.
          # These references yield empty values if the repo/org secrets are absent.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LIFEBOAT_KEY: ${{ secrets.LIFEBOAT_KEY }}
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          python3 bin/idp-estate-homes | tee drill.txt
      - name: keep the board
        uses: actions/upload-artifact@v7
        with:
          name: estate-lanes
          path: drill.txt
          retention-days: 14
