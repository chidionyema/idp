# button: Grade the human pages for plain English
# founder: Reads every page a person sees and refuses a change that puts a ticket code or an engineering word on it.
# Founder, 2026-08-31: "all docs, all sites jargon free"; "dev speak should never cross boundaries".
# Vale (the prose linter GitLab, Microsoft and Red Hat run on their own documentation) is the
# grader; .vale.ini is the boundary. Two gates: every line a pull request touches on a human page
# must be clean (reviewdog, added lines), and the pages a person meets first (README, the Backstage
# catalogue and buttons, the drill catalogue) must be clean whole. The docs tree's remaining count
# is printed on the run summary so it is a number going to zero, never a promise.
name: prose
on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "backstage/**"
      - "drills/catalogue.yaml"
      - ".github/workflows/*.yml"
      - "bin/idp-portal-buttons"
      - ".vale.ini"
      - "styles/**"
      - ".github/workflows/prose.yml"
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plain-english:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vale on the lines this pull request touches (docs tree, README)
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.17.1
          files: '["docs", "README.md"]'
          reporter: github-pr-review
          filter_mode: added
          fail_on_error: true
          vale_flags: "--minAlertLevel=error"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/prose.txt
      - name: Install Vale for the whole-page and count steps (the action keeps its copy off PATH)
        run: |
          set -euo pipefail
          curl -sSL -o vale.tgz https://github.com/errata-ai/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz
          echo "db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd  vale.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf vale.tgz -C "$HOME/.local/bin" vale && rm vale.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" sync
      - name: The pages a person meets first are clean whole
        run: |
          set -euo pipefail
          vale --minAlertLevel=error README.md
          pip install -q -r .github/requirements/prose.txt
          python3 -m pytest -q tests/test_incident_crew612_cp8_dev_speak_never_crosses_the_boundary.py
      - name: Count what is left on the docs tree
        if: always()
        run: |
          set -euo pipefail
          if ! command -v vale >/dev/null 2>&1; then
            echo "the count is skipped: vale never got installed because an earlier step failed, and that step already made the job red" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n=$(vale --output=JSON --no-exit --minAlertLevel=error docs | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(len(v) for v in d.values()))')
          printf '### plain English\n%s dev-speak errors remain on the docs tree (target: 0)\n' "$n" >> "$GITHUB_STEP_SUMMARY"
