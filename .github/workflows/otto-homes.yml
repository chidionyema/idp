# button: Which home is Otto on?
# founder: Asks Otto a real question and reports which of his three homes answered it, and whether the other two are there if that one goes.
# Founder, 2026-09-09: "otto must have 3 homes ... affirmative action, end of get it done", and
# the standing operationalisation rule of the same day: every fix names the door a person presses.
# This is that door. It runs the otto-homes playbook of bin/idp-oke-break-glass, whose first real
# row is a live completion through Otto's own switch -- the model name in the answer says which
# home produced the token. A green row here is a token Otto actually generated, never a health
# check (THE EMPIRICAL PROOF RULE). The steps are oke-check.yml's check job
# verbatim: the runner's OIDC token becomes a one-hour OCI session, --break-glass admits the
# runner's /32 to the API endpoint for the length of the playbook and removes it on every exit.
# One concurrency group with oke-check's dispatches: two break-glass runs must never race on the
# NSG rule.
name: otto-homes
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: "oke-check-workflow_dispatch"
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_version: "1.12.6", tofu_wrapper: false }
      - uses: fluxcd/flux2/action@5350425cdcd5fa015337e09fa502153c0275bd4b # v2.4.0
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: bin/idp-oke-rebuild --break-glass (playbook otto-parity)
        env:
          OCI_CI: "1"
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
          OCI_S3_ACCESS_KEY: ${{ secrets.OCI_S3_ACCESS_KEY }}
          OCI_S3_SECRET_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          OKE_SSH_PUBKEY_TEXT: ${{ vars.OKE_SSH_PUBKEY }}
          OKE_ALLOWED_CIDRS: ${{ vars.OKE_ALLOWED_CIDRS }}
          BREAK_GLASS_PLAYBOOK: otto-homes
          ESTATE_FOUNDER_EMAIL: ${{ vars.ESTATE_FOUNDER_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0; bin/idp-oke-rebuild --break-glass | tee /tmp/homes.log || rc=$?
          # The verdict is captured first and graded as text, never piped into grep inside a
          # pipefail script: a failing left-hand stage would invert the answer silently (LAW 55,
          # bin/idp-pipeverdict). The surrounding rebuild rows are oke-check's daily business.
          verdict=$(cat /tmp/homes.log)
          case "$verdict" in
            *"PASS  break-glass otto-homes"*) : ;;
            *) echo "FAIL  otto-homes: a home is not there (see above)"; exit 1 ;;
          esac
          printf '%s\n' "$verdict" | grep -E 'which-home-answers|answered by' | head -4
          echo "ok    otto-homes  Otto answered, and all three homes are where they should be (rebuild rc=$rc is oke-check's business)"
