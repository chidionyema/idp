# Temporary credential-free trusted formatter workbench for FIR-06.
# Exists on tmp/ruff-format-8184 only. Never merge this workflow into main.
name: temporary-ruff-8184
on:
  push:
    branches: ["tmp/ruff-format-8184"]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Produce exact pinned Ruff canonical sources
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q ruff==0.15.18
          python -m ruff --version
          python -m ruff format platform/estate/governance/plan_links.py tests/estate/test_plan_links.py
          python -m ruff format --check platform/estate/governance/plan_links.py tests/estate/test_plan_links.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: 8184-ruff-canonical
          path: |
            platform/estate/governance/plan_links.py
            tests/estate/test_plan_links.py
          if-no-files-found: error
          retention-days: 1
