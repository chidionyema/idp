# button: Let a scoped, expiring delegate's change count as authorised, with no key anywhere
# founder: rulings on #8725 (2026-11-28): the delegate may not sign .githooks/, bin/idp-ci-guarded-paths,
#   bin/idp-guarded-paths, bin/idp-auth, docs/keys/ or .github/workflows/; author and signer are two
#   separate workflows; one founder-signed bootstrap carries the policy file and this workflow.
#
# RECEIPT. A successful run of THIS workflow whose head_sha is the commit in question is the receipt:
#   gh api "repos/<owner>/<repo>/actions/workflows/delegate-signer.yml/runs?head_sha=<sha>&status=success"
# There is no private key and nothing moves between surfaces (AGENTS.md section 4). The run's
# head_sha is the triggering run's head commit, so the receipt names the commit it covers.
#
# WHY IT TRIGGERS ON `greenlane`, NOT ON `guarded-paths`. A signer that waited for a green
# guarded-paths check would deadlock: the guard refuses the very change the delegate is there to
# cover, so it can never go green first. The Greenlane's own verdict is the green this needs, and
# the policy evaluator below is the authority check. The workflow's name in the repository is the
# lowercase `greenlane`; a trigger spelled `Greenlane` would never fire.
#
# This file runs from the default branch (workflow_run always does) and checks out the default
# branch only. It never checks out or runs anything the head controls: the changed paths come from
# the compare API as data, and the policy it reads is main's, so a lane cannot widen its own scope.
name: delegate-signer
on:
  workflow_run:
    workflows: ["greenlane"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: delegate-signer-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  sign:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A protected Environment (required reviewers or branch rules) is where the founder gates this
    # job. It holds no secret: authority comes from the policy file, not from a credential.
    environment: delegate-signer
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: resolve the diff as data
        # An unresolvable ref leaves no paths file, and the evaluator denies on that. A diff that
        # lists nothing is BLIND. Neither produces a green run, so neither produces a receipt.
        run: |
          set -u
          ahead="$(gh api "repos/${REPO}/compare/${DEFAULT_BRANCH}...${HEAD_SHA}" --jq '.ahead_by' 2>/dev/null)" || ahead=0
          echo "COMMITS=${ahead}" >> "$GITHUB_ENV"
          if gh api --paginate "repos/${REPO}/compare/${DEFAULT_BRANCH}...${HEAD_SHA}" \
              --jq '.files[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/paths.txt" 2>/dev/null; then
            echo "PATHS_FILE=${RUNNER_TEMP}/paths.txt" >> "$GITHUB_ENV"
          else
            echo "PATHS_FILE=${RUNNER_TEMP}/unresolved.txt" >> "$GITHUB_ENV"
          fi
      - name: judge it against main's delegate policy
        run: |
          set -u
          python3 bin/idp-delegate-policy --policy docs/keys/delegate-policy.json \
            --actor "${ACTOR}" --commits "${COMMITS}" --paths-file "${PATHS_FILE}" \
            --receipt "${RUNNER_TEMP}/receipt.json" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; echo "head_sha: ${HEAD_SHA}"; cat "${RUNNER_TEMP}/receipt.json"; } >> "$GITHUB_STEP_SUMMARY"
