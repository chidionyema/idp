# .github/workflows/mutation-pr-gate.yml
# PR merge gate: blocks PR merge if mutation score < 80%.
name: mutation-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.go'
      - '**.cs'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -q mutmut

      - name: Install orchestrator
        run: |
          mkdir -p "$HOME/.estate/bin"
          cp bin/mutation-orchestrator "$HOME/.estate/bin/mutation-orchestrator"
          chmod +x "$HOME/.estate/bin/mutation-orchestrator"

      - name: Get changed files
        id: get-changed
        run: |
          BASE="${GITHUB_BASE_REF:-main}"
          CHANGED=$(git diff --name-only "origin/$BASE...HEAD" \
            | grep -E '.(py|rs|ts|tsx|go|cs)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=yes" >> $GITHUB_OUTPUT
          else
            echo "skip=no" >> $GITHUB_OUTPUT
            echo "$CHANGED" > /tmp/changed-files.txt
          fi

      # No continue-on-error: bin/mutation-orchestrator's own exit code IS the gate (exits 1
      # on a real surviving mutant or a budget overrun, 0 otherwise -- see mutation-orchestrator
      # lines 220-226). This step previously set continue-on-error: true, so a non-zero exit
      # here never failed the job, and the separate "Gate decision" step that followed never
      # read the result either (it set an unused SCORE=0 and always printed success text) --
      # this gate has never actually failed a PR regardless of mutation score since it was
      # written. Removed the dead "Gate decision" step entirely: the orchestrator already prints
      # its full JSON summary (score, killed, survived) to this job's own log.
      - name: Run mutation testing
        if: steps.get-changed.outputs.skip == 'no'
        run: |
          python3 "$HOME/.estate/bin/mutation-orchestrator" \
            --tier=pr --stdin --cwd="$PWD" \
            < /tmp/changed-files.txt
