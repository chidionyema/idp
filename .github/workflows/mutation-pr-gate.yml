# .github/workflows/mutation-pr-gate.yml
# PR merge gate: runs mutation testing on changed files, blocks merge on score drop.
name: mutation-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.go'
      - '**.cs'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  MIN_SCORE: 80

jobs:
  mutation-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install mutmut
          cargo install cargo-mutants --locked 2>/dev/null || true

      - name: Install orchestrator
        run: |
          mkdir -p "$HOME/.estate/bin"
          cp bin/mutation-orchestrator "$HOME/.estate/bin/mutation-orchestrator"
          chmod +x "$HOME/.estate/bin/mutation-orchestrator"

      - name: Get changed files
        id: get-changed
        run: |
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          echo "base_branch=$BASE_BRANCH"
          CHANGED=$(git diff --name-only "origin/$BASE_BRANCH...HEAD" \
            | grep -E '\.(py|rs|ts|tsx|go|cs)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "file_count=0" >> "$GITHUB_OUTPUT"
            echo "files=none" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$CHANGED" | wc -l | tr -d ' ')
            echo "file_count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mutation testing
        id: mutation-pr
        if: steps.get-changed.outputs.file_count != '0'
        env:
          CHANGED_FILES: ${{ steps.get-changed.outputs.files }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          echo "## Mutation PR Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files changed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_FILES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "$CHANGED_FILES" | python3 "$HOME/.estate/bin/mutation-orchestrator" \
            --tier=pr --stdin --cwd="$PWD" > /tmp/mutation-pr.json 2>&1
          RC=${PIPESTATUS[0]}

          # Extract score from JSON output (last JSON block)
          SCORE=$(python3 -c "
import json, sys
lines = open('/tmp/mutation-pr.json').read().strip().splitlines()
for line in reversed(lines):
    line = line.strip()
    if line.startswith('{'):
        try:
            d = json.loads(line)
            print(d.get('score', 0) or 0)
            break
        except:
            pass
print(0)
" 2>/dev/null || echo "0")

          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Score | $SCORE% |" >> $GITHUB_STEP_SUMMARY
          echo "| Min required | $MIN_SCORE% |" >> $GITHUB_STEP_SUMMARY
          echo "| Files | ${{ steps.get-changed.outputs.file_count }} |" >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment
        if: steps.get-changed.outputs.file_count != '0'
        env:
          SCORE: ${{ steps.mutation-pr.outputs.score || '0' }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          SCORE_VAL="${SCORE:-0}"
          MIN=$MIN_SCORE
          if [ "$SCORE_VAL" -lt "$MIN" ] 2>/dev/null; then
            STATUS="FAIL"
            BODY="❌ **Mutation score $SCORE_VAL% is below minimum $MIN%** — merge blocked."
          else
            STATUS="PASS"
            BODY="✅ Mutation score: $SCORE_VAL% (min: $MIN%) — merge allowed."
          fi
          echo "Mutation PR gate: score=$SCORE_VAL% min=$MIN% status=$STATUS"
          if [ -n "$PR_NUM" ]; then
            gh pr comment "$PR_NUM" --body "$BODY" 2>/dev/null || true
          fi

      - name: Gate decision
        if: steps.get-changed.outputs.file_count != '0'
        env:
          SCORE: ${{ steps.mutation-pr.outputs.score || '0' }}
        run: |
          SCORE_VAL="${SCORE:-0}"
          MIN=$MIN_SCORE
          echo "Score: $SCORE_VAL%, Minimum: $MIN%"
          if [ "$SCORE_VAL" -lt "$MIN" ] 2>/dev/null; then
            echo "BLOCK: score $SCORE_VAL% < $MIN%"
            exit 1
          fi
          echo "PASS: score $SCORE_VAL% >= $MIN%"
