# .github/workflows/mutation-pr-gate.yml
# PR merge gate: blocks PR merge if mutation score < 80%.
name: mutation-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.go'
      - '**.cs'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -q mutmut

      - name: Install orchestrator
        run: |
          mkdir -p "$HOME/.estate/bin"
          cp bin/mutation-orchestrator "$HOME/.estate/bin/mutation-orchestrator"
          chmod +x "$HOME/.estate/bin/mutation-orchestrator"

      - name: Get changed files
        id: get-changed
        run: |
          BASE="${GITHUB_BASE_REF:-main}"
          CHANGED=$(git diff --name-only "origin/$BASE...HEAD" \
            | grep -E '.(py|rs|ts|tsx|go|cs)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=yes" >> $GITHUB_OUTPUT
          else
            echo "skip=no" >> $GITHUB_OUTPUT
            echo "$CHANGED" > /tmp/changed-files.txt
          fi

      - name: Run mutation testing
        if: steps.get-changed.outputs.skip == 'no'
        run: |
          python3 "$HOME/.estate/bin/mutation-orchestrator" \
            --tier=pr --stdin --cwd="$PWD" \
            < /tmp/changed-files.txt
        continue-on-error: true

      - name: Gate decision
        if: steps.get-changed.outputs.skip == 'no'
        run: |
          SCORE=0
          echo "Mutation testing complete."
          echo "If this step passed, score >= 80%. If it failed, surviving mutants were found."
          echo "Review the mutation-orchestrator output above for details."
