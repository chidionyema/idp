# button: Copy the estate database
# founder: The estate's PostgreSQL cluster is gone (OKE's free trial ended 2026-10-28) but its data
# survived as logical dumps. A copy service that only runs while the database is alive is not a copy
# service, so this one restores the newest surviving dump, re-dumps it, and publishes the copy and
# its receipt -- on GitHub's runners, so the copy keeps running when the cluster does not.
#
# WHY (#7391). The newest object in estate-db-backups was 2026-09-08 and nothing had written one
# since; bin/idp-estate-db-backup answered "the CronJob has never completed a verified copy". The
# CronJob in platform/estate-db/backup/cronjob.yaml cannot run without the cluster it copies from.
# This workflow is the same contract against the data that survived:
#
#   * restore the newest surviving dump (PostgreSQL 18.1, 16 databases) into PostgreSQL 18;
#   * re-dump it with pg_dumpall, which writes its own completion marker;
#   * publish estate-db/estate-<stamp>.sql.gz, and estate-db/latest.json LAST;
#   * bin/idp-estate-db-backup grades that receipt from the backend: ok.
#
# WHAT THE RECEIPT SAYS OUT LOUD. A fresh stamp over 2026-09-08 data is a fresh copy of old data.
# The receipt carries `data_as_of` (when the restored data was captured), `source` (the object it
# came from) and `mode` (restored-from-surviving-dump), so nobody has to guess how fresh the
# database is. bin/idp-estate-db-backup grades freshness of the COPY; the data's own age is in the
# receipt, not hidden behind it.
#
# WHY A RUNNER AND NOT THE RECOVERY HOST. The recovery host is a VM.Standard.E2.1.Micro: 1 GB of
# RAM, 1/8 OCPU. The dump expands to about 626 MB of SQL across 16 databases; restoring it there
# was measured as impractical. A GitHub runner has the CPU, RAM and disk for it, and it fails
# independently of the estate's own infrastructure.
#
# WHY THIS IMAGE. The dump is PostgreSQL 18.1 and carries \restrict, so the client must be 18.1,
# and it needs the vector, btree_gin and pg_trgm extensions. This is the estate's own image
# (platform/estate-db/postgres-partman/Dockerfile): the CNPG 18.1 standard image plus pg_partman,
# with every extension the dump asks for already in it.
#
# WHY POSTGRESQL IS STARTED BY THE SCRIPT AND NOT BY THE RUNNER. MEASURED 2026-10-30: that image
# has no entrypoint of its own (its config is Entrypoint null, Cmd ["bash"], User postgres) --
# it is built for the CloudNativePG operator, which supplies the command. A GitHub Actions service
# container supplies none, so the first run died with "Failed to initialize container
# ghcr.io/chidionyema/postgres-partman:18.1-postgres-partman" and no PostgreSQL ever started. The
# copy script therefore starts PostgreSQL itself, explicitly, in that same image (initdb, then
# postgres), and waits until it answers -- and prints the container's own logs if it does not.
name: estate-db-backup
on:
  schedule:
    - cron: "23 3 * * *" # the copy, daily; off the hour and off the shop's 03:17
  workflow_dispatch:
permissions:
  id-token: write # the OCI session that reads the surviving dump and writes the copy
  contents: read
concurrency: { group: estate-db-backup, cancel-in-progress: false }
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PG_IMAGE: ghcr.io/chidionyema/postgres-partman:18.1-postgres-partman
      # The service container's own password. It is an ephemeral runner's throwaway instance, not
      # a credential for anything the estate owns; the real ones live in the vault by name.
      PG_PASSWORD: estate-backup-ci
      OCI_CLI_AUTH: security_token
      OCI_PROFILE: DEFAULT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: the tenancy namespace
        run: echo "OCI_OS_NAMESPACE=$(oci os ns get --query data --raw-output)" >>"$GITHUB_ENV"
      - name: start PostgreSQL in the copy image
        id: pg
        run: |
          platform/estate-db/backup/estate-db-backup.sh start-container estate-db-pg /tmp/estate-db-pg.cid
          echo "cid=$(cat /tmp/estate-db-pg.cid)" >>"$GITHUB_OUTPUT"
      - name: fetch the newest surviving dump
        run: |
          mkdir -p /tmp/backup
          platform/estate-db/backup/estate-db-backup.sh fetch-source /tmp/backup/source.sql.gz
      - name: restore it into PostgreSQL 18
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.PG_PASSWORD }}
        run: |
          platform/estate-db/backup/estate-db-backup.sh restore-container "${{ steps.pg.outputs.cid }}" /tmp/backup/source.sql.gz
      - name: dump it again
        env:
          PGUSER: postgres
          PGPASSWORD: ${{ env.PG_PASSWORD }}
        run: |
          platform/estate-db/backup/estate-db-backup.sh dump-container "${{ steps.pg.outputs.cid }}" /tmp/backup/estate.sql.gz
      - name: publish the copy, then the receipt
        env:
          ESTATE_DB_SOURCE_FILE: /tmp/backup/source.sql.gz.source
        run: |
          platform/estate-db/backup/estate-db-backup.sh publish /tmp/backup/estate.sql.gz
      - name: the receipt, graded from the backend
        run: bin/idp-estate-db-backup
