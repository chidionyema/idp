# Internal Merdian research. Free Kilo endpoint; only synthetic/public fixtures.
# No deployments, source modification, external secrets, or production permissions.
name: helm-research
on:
  push:
    branches:
      - research/helm-*
    paths:
      - experiments/helm/**
      - .github/workflows/helm-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify executable HELM invariants
        run: node --test experiments/helm/helm.test.mjs
      - name: Compile and verify HELM seal
        run: node experiments/helm/cli.mjs compile
      - name: Select a currently listed public-free model (one fixed ID per trial)
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from "node:fs";
          const r = await fetch("https://ai-gateway.kilo.ai/api/v1/models");
          if (!r.ok) throw new Error("model catalog HTTP " + r.status);
          const json = await r.json();
          const ids = (json.data || []).map(x => x.id).filter(x => typeof x === "string");
          const free = ids.filter(x => x.endsWith(":free"));
          console.log(JSON.stringify({freeCount:free.length, sample:free.slice(0,20)}));
          const wanted = [
            "minimax/minimax-m3.1-flash:free",
            "z-ai/glm-5:free",
            "nvidia/nemotron-3.5-super-vl:free",
            "nvidia/nemotron-3-ultra:free",
          ];
          const selected = wanted.find(x=>free.includes(x)) || free[0];
          if (!selected) throw new Error("No available anonymous free model in catalog");
          appendFileSync(process.env.GITHUB_ENV,"HELM_MODEL="+selected+"\n");
          console.log("Selected model:",selected);
          NODE
      - name: Execute actual model calls with four comparative arms
        env:
          HELM_INFERENCE_URL: https://ai-gateway.kilo.ai/api/v1/chat/completions
          GITHUB_SHA: ${{ github.sha }}
        run: node experiments/helm/cli.mjs live
      - name: Preserve experiment and negative-result receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-research-${{ github.run_id }}
          path: experiments/helm/out/*.json
          if-no-files-found: warn
          retention-days: 7
