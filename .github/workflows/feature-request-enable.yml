# crew#584 CP-K (founder 2026-08-29: "how does the self service lean vs enterprise, not seeing it
# at all"). The Backstage template "Enable platform feature" opens a pull request that adds one
# row to platform/features/requests.yaml. Before this workflow the flip itself was a script a
# person had to run (LAW 31). Now the request pull request is the flip: this job runs
# `bin/idp-features enable <feature> <tier>` against the pull request's own branch and commits
# the `suspend:` changes it makes onto that branch, so the reviewer sees the switches in the
# diff, every gate grades them, and merging the pull request is what changes the cluster (Flux
# reconciles clusters/oke). Create -> pick tier -> merge is the whole path.
#
# The commit is pushed with the estate's GitHub App token, not GITHUB_TOKEN: a push made with
# GITHUB_TOKEN raises no events, so the checks would never run on the new head and the pull
# request could not merge. The job is idempotent: a second run on its own commit finds nothing
# to change and exits 0, so no loop.
name: feature-request-enable
on:
  pull_request:
    paths: ["platform/features/requests.yaml"]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: "feature-request-${{ github.event.pull_request.number }}"
  cancel-in-progress: false
jobs:
  enable:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .github/requirements/feature-request-enable.txt }
      - run: pip install -q -r .github/requirements/feature-request-enable.txt
      - name: flip the switches the request names, on this pull request's branch
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          added=$(git diff "$base" HEAD -- platform/features/requests.yaml | grep '^+' | grep -v '^+++' || true)
          feature=$(printf '%s\n' "$added" | grep -oP '(?<=feature:\s).*' | tail -1 | tr -d '"'"'"'"' | xargs)
          tier=$(printf '%s\n' "$added" | grep -oP '(?<=tier:\s).*' | tail -1 | tr -d '"'"'"'"' | xargs)
          if [ -z "$feature" ] || [ -z "$tier" ]; then echo "ok    no new feature/tier row in requests.yaml, nothing to flip"; exit 0; fi
          out=$(bin/idp-features enable "$feature" "$tier") || { echo "$out"; gh pr comment "${{ github.event.pull_request.number }}" --body "$(printf 'FAIL  feature request %s/%s was not applied:\n```\n%s\n```' "$feature" "$tier" "$out")"; exit 1; }
          echo "$out"
          if git diff --quiet; then echo "ok    $feature/$tier already switched on this branch"; exit 0; fi
          git config user.name "idp-writer[bot]"; git config user.email "idp-writer[bot]@users.noreply.github.com"
          git add -- clusters platform/oci/node.auto.tfvars 2>/dev/null || git add -- clusters
          git commit -q -m "feature request: enable $feature/$tier (bin/idp-features enable, from the Enable platform feature template)"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(printf 'ok    %s/%s switched on this branch; merging this pull request is the flip.\n```\n%s\n```' "$feature" "$tier" "$out")"
