# button: Estate Topology DAG
# founder: Auto-regenerate infrastructure dependency graph on every commit to platform/oci

name: Generate Estate Topology DAG

on:
  push:
    paths:
      - 'platform/oci/**'
      - '.github/workflows/estate-dag-gen.yml'
      - 'bin/estate-dag-gen'
  workflow_dispatch:

jobs:
  generate-dag:
    runs-on: ubuntu-latest
    name: Generate and commit DAG artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate DAG artifacts
        run: bin/estate-dag-gen

      - name: Commit DAG if changed
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet docs/diagrams/; then
            echo "No changes to DAG"
            exit 0
          fi

          git config user.name "estate-bot"
          git config user.email "estate-bot@estate.local"
          git add docs/diagrams/estate-dag.dot docs/diagrams/estate-topology.json
          # One -m per paragraph. The previous form opened a quote on the subject line and
          # continued the body at column 0, which ends a `run: |` block scalar: `Generated by`,
          # `Files` and `Phase` parsed as TOP-LEVEL workflow keys and GitHub rejected the file.
          git commit -m "chore(estate-dag): regenerate topology DAG from infrastructure state" \
            -m "Generated by: estate-dag-gen" \
            -m "Files: estate-dag.dot (Terraform resources), estate-topology.json (runtime stub)" \
            -m "Phase: 1 (deploy-time), 2 (runtime - pending Cilium integration)"
          git push origin "${GITHUB_REF#refs/heads/}"
