# button: Estate Topology DAG
# founder: Auto-regenerate infrastructure dependency graph on every commit to platform/oci

name: Generate Estate Topology DAG

# crew#6227 wanted platform/oci/github-actions.tf (vault-seeded by the IAM fix) to leave this
# workflow alone, and did it with paths-ignore beside paths -- a combination GitHub refuses at
# parse time. The refusal is silent per-branch and total: from 2026-10-16 to 2026-10-18 every
# push on every branch (queue branches included) created a startup-failure run named by the file
# path with zero jobs. The filters now live in one paths list; the tf-file exclusion moved into
# the guard step below, which can express it.
on:
  push:
    paths:
      - 'platform/oci/**'
      - '.github/workflows/estate-dag-gen.yml'
      - 'bin/estate-dag-gen'
  workflow_dispatch:

jobs:
  generate-dag:
    runs-on: ubuntu-24.04
    name: Generate and commit DAG artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          # the guard below diffs github.event.before against the tip; that needs the base
          # object locally, so a full fetch, not the default depth-1
          fetch-depth: 0

      # crew#6227's exclusion, expressible here but not in `on:`: a push whose watched paths
      # changed EXCEPT the vault-seeded tf file still triggers this workflow (paths has no
      # negation), and the guard declines it, so no DAG commit ever lands on a lane that only
      # touched that file.
      - name: skip when only the vault-seeded IAM file changed
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            'platform/oci/**' '.github/workflows/estate-dag-gen.yml' 'bin/estate-dag-gen' \
            ':!platform/oci/github-actions.tf')"
          if [ -z "$changed" ]; then
            echo "only platform/oci/github-actions.tf changed (crew#6227): nothing the DAG reads"
            exit 0
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Generate DAG artifacts
        run: bin/estate-dag-gen

      - name: Commit DAG if changed
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet docs/diagrams/; then
            echo "No changes to DAG"
            exit 0
          fi

          git config user.name "estate-bot"
          git config user.email "estate-bot@estate.local"
          git add docs/diagrams/estate-dag.dot docs/diagrams/estate-topology.json
          # One -m per paragraph. The previous form opened a quote on the subject line and
          # continued the body at column 0, which ends a `run: |` block scalar: `Generated by`,
          # `Files` and `Phase` parsed as TOP-LEVEL workflow keys and GitHub rejected the file.
          git commit -m "chore(estate-dag): regenerate topology DAG from infrastructure state" \
            -m "Generated by: estate-dag-gen" \
            -m "Files: estate-dag.dot (Terraform resources), estate-topology.json (runtime stub)" \
            -m "Phase: 1 (deploy-time), 2 (runtime - pending Cilium integration)"
          git push origin "${GITHUB_REF#refs/heads/}"
