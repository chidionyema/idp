# button: Refuse a PR that adds a docs/synthesis, docs/tickets or docs/decisions file without
#   writing the durable facts it contains back into growmos.
# founder: 2026-09-28, on watching this session re-derive 2026-09-27's fractal-factory design from
#   scratch because growmos had never heard of it: "the amount of repetition across 10 parallel
#   agent sessions is ridiculous, is this an algorithmic problem". It is: AGENTS.md/CLAUDE.md
#   already instruct every agent to write durable decisions back into growmos before finishing, and
#   the instruction alone already failed once. This workflow is the enforcement, same shape as
#   guarded-paths: no PR merges to main that touches docs/synthesis|tickets|decisions without also
#   touching .growmos/entities.jsonl or .growmos/relations.jsonl in the same diff.
name: growmos-writeback
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  growmos-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: run bin/idp-ci-growmos-writeback against the base
        run: |
          set -uo pipefail
          base_ref="${{ github.base_ref }}"
          base="origin/${base_ref:-main}"
          bin/idp-ci-growmos-writeback "$base"
