# The concierge's road to Modal (crew#885 pattern). Founder 2026-09-11: no terminal, no token on a
# laptop -- the same rule the Forge follows, for the same reason.
#
# WHY THIS EXISTS. The concierge's runtime is one microVM per order: it boots, hydrates a customer's
# encrypted profile into RAM, verifies the voiceprint, drives the browser with the model never
# seeing a card, commits state atomically, and dies. Idle cost is zero. Deploying that needs the
# Modal root, which lives as a repository secret and is never on a machine -- so the deployment is
# a workflow, exactly as forge-train is.
#
# WHY THIS IS HERE AND NOT IN mums-concierge. The code, the sidecar and the model all live in
# chidionyema/mums-concierge, so the obvious home is there. That workflow ran and failed with
# `no Modal root`: SEED_MODAL_TOKEN_ID / SEED_MODAL_TOKEN_SECRET are set on THIS repository, and
# GitHub secrets are write-only -- they cannot be read or copied. So the run happens where the root
# is, and checks the code out with the estate's own App token (the road forge-train already uses).
# No new credential, no second copy of the root, nothing for a person to paste.
#
# THE TWO ARTIFACTS THIS RUN BUILDS, in dependency order:
#
#   1. the Rust vault sidecar (ephemeral/cdp-vault-proxy) -- the Iron Rule. It must be COMPILED
#      before the image can carry it, which is why this is a workflow and not a `modal deploy`.
#   2. the CAM++ voice model, 29.6 MB, from its real upstream release. The name in the original
#      plan (3dspeaker_speech_ecapa_tdnn_sv_en_voxceleb_16k.onnx) returns HTTP 404; the release has
#      36 assets and none is named `ecapa`.
#
# until 2026-09-11 the image fetched both from https://internal.repo/..., which exists nowhere, so
# it could never build. Everything here is now built in the run and handed to Modal as bytes.
#
# button: Deploy the concierge runtime
# founder: Builds the vault sidecar and fetches the voice model, then deploys the concierge's ephemeral runtime to Modal and proves the sidecar is in the path; a dry run stops before deploy.
#
# WHAT IT DEPLOYS (updated when the always-on endpoint got its own road). Two Modal apps, both
# gated on dry_run: `agent.py`, the per-order microVM that touches a shop and a card, and
# `webapp.py`, the thin FastAPI/Twilio/WhatsApp endpoint that dispatches it. The endpoint was a
# launchd LaunchAgent on a Mac until 2026-09-15; it is now deployed here and the vault entry the
# endpoint reads its own public URL from is cut over automatically in the same run (LAW 31), into the
# entry the ESTATE's registry already declares for it -- `concierge-twilio`, not the `concierge-tunnel`
# name in mums_concierge.bootstrap, which has never existed and is reconciled separately. The one thing this workflow cannot do for itself is the Twilio console webhook,
# which is a console step and is tracked as one.
name: concierge-deploy

# WHAT LANDS DEPLOYS ITSELF. Until 2026-10-13 the button was the only way in, so a concierge change
# that landed sat on main undeployed until someone pressed it -- every deploy on record is a
# workflow_dispatch. The Greenlane moves main and Flux deploys what lands, but Flux reaches the
# cluster and the concierge runs on Modal. Two roads now carry a landing here, neither with a new
# credential:
#   push                 idp main changed this file. Not platform/vendors/consoles.yaml: it moved 26
#                        times in 30 days, nearly all for other vendors, and each would redeploy the
#                        public endpoint; a concierge vault row lands with a change here anyway.
#   repository_dispatch  mums-concierge main moved. Flux watches it as a GitRepository with the
#                        estate App, and its Alert dispatches here through the github-dispatch
#                        Provider (clusters/oke/flux-system/alerts/concierge-landed.yaml). Only idp
#                        holds a credential, so mums-concierge cannot call this itself.
# Both deploy for real: `inputs.dry_run` is empty on them, and every deploying step is gated on
# `!= true`, so empty means deploy. The button still defaults to a dry run.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/concierge-deploy.yml
  repository_dispatch:
    types: [GitRepository/mums-concierge.flux-system]
  workflow_dispatch:
    inputs:
      dry_run:
        description: build and verify, deploy nothing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # traded for the OCI session that reads vault entries (R52)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.SEED_MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.SEED_MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The App token, because GITHUB_TOKEN is scoped to this repository and cannot clone another.
      # The lane needs contents: read on the code repo; nothing wider is asked for.
      - id: app
        uses: ./.github/actions/github-app-token
        with:
          lane: recovery
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
          oci_compartment: ${{ vars.OCI_COMPARTMENT_OCID }}

      - name: check out the code the runtime is built from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chidionyema/mums-concierge
          path: code
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: the Modal root must answer before anything is built
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET" \
            || { echo "FAIL    concierge-deploy  no Modal root: run bin/idp-set-root modal once (R52)"; exit 1; }
          python -m pip install --quiet 'modal==1.5.5'
          modal secret list >/dev/null \
            || { echo "FAIL    concierge-deploy  Modal refused the root pair; rotate with bin/idp-set-root modal"; exit 1; }
          echo "ok      modal root answers"

      # STAGE 1 -- the sidecar. The image cannot carry a binary that has not been built, and this is
      # the piece four drafts fetched from a URL that does not exist.
      - name: build the vault sidecar (the Iron Rule)
        run: |
          set -euo pipefail
          cargo build --release --manifest-path code/ephemeral/cdp-vault-proxy/Cargo.toml
          BIN=code/ephemeral/cdp-vault-proxy/target/release/cdp-vault-proxy
          test -x "$BIN" || { echo "FAIL    concierge-deploy  the sidecar did not build at $BIN"; exit 1; }
          echo "ok      sidecar built ($(stat -c%s "$BIN") bytes)"

      - name: the sidecar refuses to run without a card, and passes its own tests
        run: |
          set -euo pipefail
          cargo test --release --manifest-path code/ephemeral/cdp-vault-proxy/Cargo.toml
          BIN=code/ephemeral/cdp-vault-proxy/target/release/cdp-vault-proxy
          # Fail-closed check: without REAL_PAN it must REFUSE, not run as a passthrough that
          # claims to be a fence. Graded on the EXIT CODE, not on a pipe into grep: the first
          # version of this check piped the binary into grep under `set -o pipefail`, so the
          # pipe failed before grep could read anything and the check reported a failure that had
          # not happened. The binary was refusing correctly the whole time. Same defect class as
          # bin/idp-pipeverdict exists to catch.
          set +e
          OUT=$("$BIN" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "FAIL    concierge-deploy  the sidecar started without a card (exit 0)"; exit 1
          fi
          case "$OUT" in
            *"REAL_PAN is not set"*) echo "ok      sidecar fails closed with no card (exit $RC)" ;;
            *) echo "FAIL    concierge-deploy  the sidecar refused for a reason nobody named:"; echo "$OUT"; exit 1 ;;
          esac

      # STAGE 2 -- the voice model, from its real release.
      - name: fetch the CAM++ voice model
        run: |
          set -euo pipefail
          mkdir -p code/models
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx"
          curl -fsSL -o code/models/campplus.onnx "$URL"
          SIZE=$(stat -c%s code/models/campplus.onnx)
          # A 9-byte file is GitHub's "Not Found" body, which is how the bad URL in the plan would
          # have failed -- silently, as a model that loads nothing. Size is the check.
          [ "$SIZE" -gt 20000000 ] || { echo "FAIL    concierge-deploy  model is $SIZE bytes; the URL served an error body"; exit 1; }
          echo "ok      voice model $SIZE bytes"

      - name: the runtime module imports with both artifacts present
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3 cryptography zstandard 'sherpa-onnx' numpy
          python - <<'PY'
          import sys
          sys.path.insert(0, "code")
          import ephemeral.agent as a
          from pathlib import Path
          for name, path in (("sidecar", a.LOCAL_SIDECAR), ("model", a.LOCAL_MODEL)):
              p = Path(path)
              assert p.is_file(), f"{name} missing at {path}"
              print(f"ok      {name} resolves ({p.stat().st_size} bytes)")
          assert a.VOICEPRINT_THRESHOLD == 0.6, "threshold drifted from the model family's default"
          print("ok      threshold is 0.6 (the model family's own default)")
          PY

      - name: mint the secrets the runtime declares, from the roots the estate already holds
        env:
          OPENAI_ROOT: ${{ secrets.SEED_OPENAI_API_KEY }}
          MINIMAX_ROOT: ${{ secrets.SEED_MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          # LAW 52: ONE ROOT PER PROVIDER, SET ONCE; CODE MINTS THE REST; NEVER A CONSOLE STEP.
          #
          # The estate already holds the R2 root (SEED_R2_*), and the Modal root answers in this very
          # run. So every secret the function declares is derivable here, and a deploy that stops to
          # ask a human for them would be the console step R52 exists to remove.
          #
          # Each is created only when missing. Re-minting on every deploy would rotate the card key
          # out from under whatever encrypted card is already on file -- a rotation that silently
          # makes every stored card unreadable is worse than no rotation at all.
          # THREE defects, and only the third was real.
          #
          # 1. `modal secret list` renders a BOXED TABLE, so `grep "^name "` never matches a cell.
          # 2. `grep -q` exits on match and SIGPIPEs the writer, which `pipefail` turns into a
          #    failure even though grep matched.
          # 3. THE ACTUAL ONE: MODAL TRUNCATES THE NAME TO FIT THE COLUMN. A 25-character name is
          #    printed as `cloudflare-r2-cred…`. No pattern matches a name that is not fully there,
          #    which is why three attempts failed while the secret had existed since the first run.
          #
          # Rather than guess a fourth pattern, the output was printed and read. That is why the
          # probe step exists in this workflow's history -- and why it is the right instinct: two of
          # the three defects above were invented by me and fixed nothing.
          #
          # So the check does not read the table at all. `modal secret create` is idempotent in
          # effect: creating one that exists fails with "already exists", which is a POSITIVE
          # confirmation the secret is there. That is the fact being asked for, from the command
          # that owns it, rather than a rendering of it.
          ensure_secret() {
            local name="$1"; shift
            local out
            if out=$(modal secret create "$name" "$@" 2>&1); then
              echo "ok      minted $name"
            elif printf '%s' "$out" | grep -q "already exists"; then
              echo "ok      $name exists (Modal said so)"
            else
              echo "FAIL    could not mint or confirm $name:"
              printf '%s\n' "$out" | sed 's/^/        /'
              exit 1
            fi
          }

          # THE PROBE IS GONE with the guessing: it printed the output precisely because three
          # patterns had failed on a name that was never fully printed.
          ensure_secret cloudflare-r2-credentials \
            R2_ENDPOINT_URL="https://${{ secrets.SEED_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            R2_ACCESS_KEY="${{ secrets.SEED_R2_ACCESS_KEY_ID }}" \
            R2_SECRET_KEY="${{ secrets.SEED_R2_SECRET_ACCESS_KEY }}" \
            R2_BUCKET="${{ secrets.SEED_R2_BUCKET }}"

          # The profile key. Random, generated here, never typed by anybody -- a key a human chooses
          # is a key a human can be guessed at having reused.
          ensure_secret kms-master-key KMS_MASTER_KEY="$(openssl rand -hex 32)"

          # card-key is NOT minted here any more. A random key made in CI was a second card key
          # beside the one the founder holds in Bitwarden (CONCIERGE_CARD_KEY, LAW 54), so the two
          # halves of the concierge could encrypt and decrypt a card with different keys. It is
          # carried from the cluster in the next step instead, like the Twilio fields.

          # THE VISION LANE. It was missing entirely, so the first real order would have failed on
          # its first screenshot with a missing-key error -- and `OPENAI_API_KEY`, which the runtime
          # asked for, DOES NOT EXIST anywhere in the estate.
          #
          # The estate's router is the destination (LAW 34), but its master key lives in the cluster
          # and GitHub does not hold it, so a router secret cannot be minted from CI. What CI does
          # hold is a vendor key. So the vendor lane is minted here, and the runtime PREFERS the
          # router the moment one is configured -- printing that it is not, rather than falling back
          # silently, because a silent vendor call is how a provider-agnostic rule stops being one.
          #
          # REWRITTEN EVERY RUN (--force), like the call lane below (idp#6131). It was create-only, so
          # the endpoint kept whatever key was current when it was first minted, and a rotated
          # SEED_ANTHROPIC_API_KEY never reached it: the live self-check's intent step was refused on
          # every run while every other step passed. Nothing is encrypted under it to orphan.
          #
          # MINIMAX, NOT ANTHROPIC (idp#6103). The Anthropic account behind this lane ran out of credit
          # ("Your credit balance is too low", runs 38514023715 and 38514732151) and the founder
          # declined to top it up. MiniMax-M3 is the model the estate's `minimax` router lane already
          # serves, and it reads screenshots: asked through that lane on 2026-10-15 with the
          # runtime's own two prompts, it read a basket screenshot's product, quantity, total and
          # delivery slot, put the click inside the Checkout button, and returned the intent JSON.
          # (MiniMax-M2.7 is text-only: it answered "I don't have the screenshot".) The runtime picks
          # its endpoint from VISION_BASE_URL, so MiniMax needs no code change.
          if [ -n "$MINIMAX_ROOT" ]; then
            modal secret create vision-lane VISION_API_KEY="$MINIMAX_ROOT" \
              VISION_BASE_URL="https://api.minimax.io/v1" \
              CONCIERGE_VISION_MODEL="MiniMax-M3" --force >/dev/null
            echo "ok      vision-lane holds the current MiniMax key (MiniMax-M3)"
          else
            echo "FAIL    concierge-deploy  SEED_MINIMAX_API_KEY is not set: intent and vision have no lane"
            exit 1
          fi

          # THE CALL LANE. Live phone calls use OpenAI's realtime model (mums_concierge
          # voice_endpoints.py), founder-chosen 2026-10-13 -- no other root in the estate speaks
          # audio both ways. Unlike the secrets above it is REWRITTEN EVERY RUN (--force) once the root
          # is set: a rotated key must reach the endpoint, and nothing is encrypted under it to orphan.
          # Until SEED_OPENAI_API_KEY is set the secret is created holding no key, so the endpoint still
          # deploys and a call hears "send me a voice note" (voice_endpoints.calls_available).
          if [ -n "$OPENAI_ROOT" ]; then
            modal secret create realtime-lane OPENAI_API_KEY="$OPENAI_ROOT" --force >/dev/null
            echo "ok      realtime-lane holds the OpenAI key: calls are on"
          else
            ensure_secret realtime-lane REALTIME_LANE=unset
            echo "note    SEED_OPENAI_API_KEY is not set: calls answer with the voice-note message."
            echo "        Set it with bin/idp-set-root openai, then re-run this workflow."
          fi

      # THE FOUNDER'S HALF, CARRIED, NOT RE-ASKED. TWILIO_AUTH_TOKEN, the three numbers and the card
      # key are born in Bitwarden (consoles.yaml `twilio` and `card-key` rows) and the vendor bridge
      # already lands each in the `concierge` namespace. GitHub holds none of them and must not
      # become a second home (LAW 44), so this run reads them where they already are -- the same
      # OIDC road estate-secret-prune.yml takes to the cluster -- and writes the two Modal secrets
      # the code declares: `human-twilio` (webapp.py) and `card-key` (agent.py). --force, every
      # run: these are copies, so the cluster's value is the truth and a rotation there lands here
      # on the next deploy. Values are masked in the log and never echoed.
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        if: ${{ inputs.dry_run != true }}

      - name: carry the founder's concierge secrets from the cluster to Modal
        if: ${{ inputs.dry_run != true }}
        env:
          OCI_CLI_AUTH: security_token
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_CLUSTER_NAME: ${{ vars.OCI_CLUSTER_NAME || 'estate' }}
        run: |
          set -euo pipefail
          cl=$(bin/idp-cloud cluster list)
          cid=$(printf '%s\n' "$cl" | awk -v n="$OCI_CLUSTER_NAME" '$1==n{print $2; exit}')
          [ -n "$cid" ] || { echo "FAIL    concierge-deploy  no ACTIVE cluster named $OCI_CLUSTER_NAME"; exit 1; }
          KUBECONFIG=$(mktemp); export KUBECONFIG
          trap 'rm -f "$KUBECONFIG"' EXIT
          bin/idp-cloud cluster kubeconfig "$cid" --file "$KUBECONFIG"
          field() { # <secret> <key> -> the value, or nothing
            kubectl get secret "$1" -n concierge -o jsonpath="{.data.$2}" 2>/dev/null | base64 -d 2>/dev/null || true
          }

          tok=$(field human-twilio TWILIO_AUTH_TOKEN)
          [ -n "$tok" ] || {
            echo "FAIL    concierge-deploy  concierge/human-twilio holds no TWILIO_AUTH_TOKEN."
            echo "        The webhook cannot verify Twilio's signature without it. Nothing deployed."
            exit 1
          }
          echo "::add-mask::$tok"
          # Kept for the self-check step, which signs its probe the way Twilio signs a webhook.
          # Runner-local, mode 600, never echoed; the runner is discarded when the job ends.
          (umask 077; printf '%s' "$tok" > "$RUNNER_TEMP/twilio-auth-token")
          twilio=(TWILIO_AUTH_TOKEN="$tok")
          # Optional, each in its own Secret (platform/vendors/templates/externalsecrets.yaml): an
          # absent one narrows what the door does; it does not hold the deploy out.
          for f in MOM_PHONE_NUMBER GUARDIAN_PHONE_NUMBER TWILIO_WHATSAPP_NUMBER TWILIO_ACCOUNT_SID; do
            v=$(field "human-twilio-$(printf '%s' "$f" | tr 'A-Z_' 'a-z-')" "$f")
            if [ -n "$v" ]; then echo "::add-mask::$v"; twilio+=("$f=$v"); else echo "note    $f is not in the vault yet"; fi
          done
          # The SID is optional to the BRIDGE (one absent key must not hold the token out) but not to
          # the product: main.py builds its Twilio client from it, so without it every reply,
          # voice note and guardian alert fails while the inbound door stays green. Loud, not silent.
          sid=no; for kv in "${twilio[@]}"; do case "$kv" in TWILIO_ACCOUNT_SID=AC*) sid=yes ;; esac; done
          [ "$sid" = yes ] || {
            echo "FAIL    concierge-deploy  no TWILIO_ACCOUNT_SID (AC...) in concierge/human-twilio-twilio-account-sid."
            echo "        The concierge could hear Mum and never answer. Nothing deployed."
            exit 1
          }
          modal secret create human-twilio "${twilio[@]}" --force >/dev/null
          echo "ok      modal   human-twilio carried from the cluster (${#twilio[@]} fields)"

          key=$(field human-card-key CARD_KEY_HEX)
          [[ "$key" =~ ^[0-9a-f]{64}$ ]] || {
            echo "FAIL    concierge-deploy  concierge/human-card-key holds no 64-hex CARD_KEY_HEX."
            echo "        A card key of the wrong shape is worse than none. Nothing deployed."
            exit 1
          }
          echo "::add-mask::$key"
          modal secret create card-key CARD_KEY_HEX="$key" --force >/dev/null
          echo "ok      modal   card-key carried from the cluster (the Bitwarden key, not a new one)"

      - name: what the deploy needs, and whether it is there
        run: |
          set -euo pipefail
          # The runtime declares 4 modal secrets. Named here, in the run's own output, rather
          # than discovered at the deploy step -- where a missing one looks like a broken workflow
          # instead of a piece of the architecture that has not been minted yet.
          #
          # The residential proxy is NOT among them any more. It was declared for a bypass that was
          # never built and would not have worked: a shop reads its anti-bot layers at SIGN-IN, and
          # moving one checkout POST moves the request, not the fingerprint. What replaced it is
          # the carried session -- her signed-in state, minted once at enrolment, carried in from
          # the profile. So the runtime needs no proxy and no bypass.
          # ASKED BY CREATING, NOT BY READING THE TABLE. `modal secret list` TRUNCATES names to fit
          # the column, so `cloudflare-r2-credentials` is printed as `cloudflare-r2-cred…` and no
          # pattern matches it. Three attempts failed on that while the secret had existed since the
          # first run. Creating an existing secret fails with "already exists", which is a positive
          # confirmation from the command that owns the fact.
          missing=0
          for s in cloudflare-r2-credentials kms-master-key card-key vision-lane; do
            out=$(modal secret create "$s" PROBE=1 2>&1) && {
              # A secret that did NOT exist now holds a stray PROBE key. Removed immediately, so
              # this report cannot leave a half-made secret behind for the deploy to trip over.
              modal secret delete "$s" --yes >/dev/null 2>&1 || true
              echo "MISSING modal secret $s (created empty and removed again)"
              missing=$((missing + 1))
              continue
            }
            if printf '%s' "$out" | grep -q "already exists"; then
              echo "ok      modal secret $s exists"
            else
              echo "MISSING modal secret $s"
              missing=$((missing + 1))
            fi
          done
          echo "        $missing of 4 missing"

      - name: deploy to Modal
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          # Every secret the function declares must exist, because Modal refuses a deploy whose
          # declared secret is absent -- and that refusal is right: it is the platform telling us a
          # piece is missing rather than letting a run believe a bypass it does not have.
          for s in cloudflare-r2-credentials kms-master-key card-key vision-lane; do
            out=$(modal secret create "$s" PROBE=1 2>&1) && {
              modal secret delete "$s" --yes >/dev/null 2>&1 || true
              echo "FAIL    concierge-deploy  the secret '$s' does not exist and the mint step"
              echo "        above should have created it. Nothing has been deployed."
              exit 1
            }
            printf '%s' "$out" | grep -q "already exists" || {
              echo "FAIL    concierge-deploy  could not confirm '$s':"
              printf '%s\n' "$out" | sed 's/^/        /'
              exit 1
            }
          done
          modal deploy code/ephemeral/agent.py
          echo "ok      concierge runtime deployed"

      # THE OTHER HALF: the always-on endpoint. agent.py above is the per-order microVM; this is the
      # thin FastAPI/Twilio/WhatsApp endpoint it is dispatched BY. Until now only agent.py had a road
      # to Modal, so the endpoint was still a launchd LaunchAgent on whatever Mac ran the installer --
      # torn down the moment that laptop slept. Founder 2026-09-15: "a consumer product that assumes
      # the consumer has expensive hardware is a fail."
      #
      # WHY THIS IS IN idp AND NOT mums-concierge: the Modal root is set on THIS repository, for the
      # reason in this file's header. Same constraint, same answer.
      #
      # dry_run GATES IT, like the step above: a dry run must stop before it changes production. The
      # first version of the plan for this step deployed unconditionally, which would have made
      # dry_run=true a lie for exactly the artifact that faces the public internet.
      - name: deploy the always-on endpoint to Modal
        if: ${{ inputs.dry_run != true }}
        id: webapp
        run: |
          set -euo pipefail
          # ephemeral/webapp.py does not exist on mums-concierge main until the endpoint PR lands
          # there. Say that plainly instead of failing on a missing file, because "the code is not on
          # main yet" and "the deploy broke" are different facts and only one is actionable here.
          if [ ! -f code/ephemeral/webapp.py ]; then
            echo "FAIL    concierge-deploy  code/ephemeral/webapp.py is not on mums-concierge main."
            echo "        The endpoint PR has not merged there yet. Deploy it first, or this step"
            echo "        will keep finding nothing to deploy. agent.py IS deployed; nothing is lost."
            exit 1
          fi
          # The endpoint declares exactly these five secret names (ephemeral/webapp.py, _WEB_SECRETS);
          # vision-lane and realtime-lane are minted by the step above, the first three are not.
          # Modal refuses a deploy whose declared secret is absent, so confirm them by CREATING, not by
          # reading `modal secret list` -- that table truncates names to fit the column
          # (cloudflare-r2-credentials prints as cloudflare-r2-cred...), which is the defect this
          # file's mint step already documents at length.
          #
          # The names are the CODE's, and the estate follows them (decided 2026-10-13):
          #
          #   human-twilio       the Secret platform/vendors renders for the `twilio` row -- the
          #                      cluster already holds it under exactly this name
          #   concierge-tunnel   PUBLIC_SERVER_URL / PUBLIC_WSS_URL. A machine fact Modal issues,
          #                      not a credential anyone types, so it is NOT a Bitwarden row and the
          #                      vault never holds it; the cutover below writes it straight to Modal
          #
          # concierge-tunnel cannot exist before the first deploy has a URL, and Modal refuses a
          # deploy whose declared secret is absent. So on the very first run it is created holding
          # only a marker: bootstrap.load() then finds no PUBLIC_SERVER_URL for the seconds until the
          # cutover replaces it -- the same state as "URL not known yet", which it already handles.
          modal secret create concierge-tunnel CONCIERGE_TUNNEL_PENDING=1 >/dev/null 2>&1 \
            && echo "ok      concierge-tunnel created as a marker; the cutover below fills it" || true
          for s in human-twilio concierge-tunnel cloudflare-r2-credentials vision-lane realtime-lane; do
            out=$(modal secret create "$s" PROBE=1 2>&1) && {
              modal secret delete "$s" --yes >/dev/null 2>&1 || true
              echo "FAIL    concierge-deploy  the endpoint declares secret '$s' and it does not exist."
              echo "        Modal will refuse the deploy. Nothing has been deployed."
              exit 1
            }
            printf '%s' "$out" | grep -q "already exists" || {
              echo "FAIL    concierge-deploy  could not confirm '$s':"
              printf '%s\n' "$out" | sed 's/^/        /'
              exit 1
            }
            echo "ok      endpoint secret $s exists"
          done
          modal deploy code/ephemeral/webapp.py
          echo "ok      concierge endpoint deployed"

      # THE CUTOVER, AUTOMATED (LAW 31: no step is handed to a person to run).
      #
      # The endpoint reads PUBLIC_SERVER_URL / PUBLIC_WSS_URL from the Modal secret
      # `concierge-tunnel` (webapp.py), as environment variables: bootstrap.load() checks os.environ
      # FIRST, so the (absent, in a Modal image) kubectl path never runs.
      #
      # The URL is Modal's to issue, so it is written to Modal and nowhere else. An earlier draft
      # put it in the vault's `concierge-twilio` entry, beside the Twilio token: nothing carried it
      # from there to Modal, and the bridge rendered a Bitwarden ExternalSecret for it that could
      # never go green, because no person is ever meant to paste it (LAW 31). One fact, one home.
      #
      # `--force` replaces the whole secret, which is right here: it holds only these two fields
      # (and, on a first run, the marker the deploy step created). The Twilio token lives in
      # `human-twilio` and is not touched.
      - name: cut the endpoint over to its own Modal URL
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          # Read the URL back from the platform that issued it, with the API that actually carries it.
          #
          # NOT `modal app history --json`: that output is Version / Time deployed / Client / Deployed
          # by / Commit / Tag (modal/cli/app.py:627), with NO url field at all. An earlier draft of
          # this step parsed `a["url"]` out of it, which would have silently matched nothing on every
          # run and failed the cutover forever while looking like a Modal outage. Read the source.
          #
          # get_web_url() is the real door, and it is typed `-> str | None` -- so the None case is a
          # real state (the app exists but has no web endpoint yet) and is handled, not assumed away.
          # Kept to one line so it stays inside this block scalar: a heredoc's terminator has to sit at
          # column 0 and that ends the YAML block, which is how this broke the file once already.
          URL=$(python -c 'import modal; print(modal.Function.from_name("mums-concierge-web", "web").get_web_url() or "")') || URL=""
          [ -n "$URL" ] || {
            echo "FAIL    concierge-deploy  Modal returned no web URL for mums-concierge-web/web."
            echo "        The app may exist without a web endpoint, or the name changed. concierge-tunnel"
            echo "        still holds whatever it held; the endpoint is NOT reachable by URL."
            exit 1
          }
          case "$URL" in https://*) ;; *) echo "FAIL    concierge-deploy  Modal returned a non-HTTPS url: $URL"; exit 1;; esac
          # wss:// for the /ws/live-call bridge, derived from the https host that Modal actually issued.
          WSS="wss://${URL#https://}"
          modal secret create concierge-tunnel PUBLIC_SERVER_URL="$URL" PUBLIC_WSS_URL="$WSS" --force >/dev/null
          # A secret is read when a container starts, so redeploy: the warm container
          # (min_containers=1) is replaced by one that sees the URL.
          modal deploy code/ephemeral/webapp.py >/dev/null
          # Printed because it is a public URL, not a secret -- and because a cutover nobody can read
          # back in the run's own log is a cutover nobody can audit.
          echo "ok      modal   concierge-tunnel now holds $URL"
          echo "next    the Twilio console webhook must point here; that is a console step, tracked"
          echo "        separately, and it is the one thing this workflow cannot do for itself"

      # THE DEPLOY PROVES ITSELF. Every check before this needed the founder's phone, and the
      # shopping request that went silent on 2026-10-13 was a missing key nobody could see from here.
      # /health/selfcheck (mums_concierge main.py) times the slow steps of a reply -- the intent parse,
      # edge-tts, the offline voice, transcription -- inside the always-on container she is served by,
      # so it costs no second container. Twilio-signed like the webhook it sits beside. THIS REPO IS
      # PUBLIC: the words are made up and only timings and engine names come back, by design.
      - name: self-check the live endpoint (intent, voice, transcription)
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          URL=$(python -c 'import modal; print(modal.Function.from_name("mums-concierge-web", "web").get_web_url() or "")')
          python - "$URL" "$RUNNER_TEMP/twilio-auth-token" <<'PY'
          import base64, hashlib, hmac, json, sys, urllib.error, urllib.parse, urllib.request
          base, token_file = sys.argv[1].rstrip("/"), sys.argv[2]
          url, params = f"{base}/health/selfcheck", {"probe": "1"}
          token = open(token_file).read().strip()
          payload = url + "".join(f"{k}{params[k]}" for k in sorted(params))
          sig = base64.b64encode(hmac.new(token.encode(), payload.encode(), hashlib.sha1).digest()).decode()
          req = urllib.request.Request(url, data=urllib.parse.urlencode(params).encode(),
                                       headers={"X-Twilio-Signature": sig})
          try:
              resp = urllib.request.urlopen(req, timeout=280)
          except urllib.error.HTTPError as err:
              resp = err
          body = resp.read().decode()
          try:
              print(json.dumps(json.loads(body), indent=2))
          except ValueError:
              print(f"FAIL    concierge-deploy  /health/selfcheck answered {resp.status}: {body[:200]}")
              sys.exit(1)
          sys.exit(0 if resp.status == 200 else 1)
          PY

      - name: dry run -- say plainly what was not done
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "dry run: the sidecar built, the model fetched, the module imports; NOTHING was deployed."
          echo "         That includes BOTH Modal apps: agent.py (per-order microVM) and webapp.py"
          echo "         (the always-on endpoint). No Modal secret was written and no URL was cut over."
          echo "Re-run with dry_run=false to deploy."
