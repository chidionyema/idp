name: Web agent emergency pull
on:
  push:
    branches: [research/7760-web-agent-unbind-20261126]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: web-agent-emergency-pull
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_web_agent_bridge.py
      - run: node --test ops/aistudio/web_agent_direct_drop.test.mjs
      - run: |
          python3 -m pip install --quiet ruff==0.15.18
          ruff check --select E9,F,B,S bin/web_agent_bridge.py tests/test_web_agent_bridge.py
          ruff format --check bin/web_agent_bridge.py tests/test_web_agent_bridge.py
  fetch:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' && vars.WEB_AGENT_RELEASE_JSON != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exactly one explicitly authorized public drop
        env:
          WEB_AGENT_RELEASE_JSON: ${{ vars.WEB_AGENT_RELEASE_JSON }}
          WEB_AGENT_DRIVE_FOLDER_ID: ${{ vars.WEB_AGENT_DRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python3 bin/web_agent_bridge.py fetch --archive "$RUNNER_TEMP/approved.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: approved-public-web-drop
          path: ${{ runner.temp }}/approved.zip
          retention-days: 1
          if-no-files-found: error
  prepare:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      WEB_AGENT_RELEASE_JSON: ${{ vars.WEB_AGENT_RELEASE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: approved-public-web-drop
          path: ${{ runner.temp }}/drop
      - name: Prepare using existing hooks, no privileged credentials
        run: |
          set -euo pipefail
          base=$(jq -er '.base_sha' <<<"$WEB_AGENT_RELEASE_JSON")
          test "$(git rev-parse HEAD)" = "$base"
          git show "$base:bin/web_agent_bridge.py" > "$RUNNER_TEMP/trusted-bridge.py"
          python3 -m pip install --quiet ruff==0.15.18 pyyaml yamllint==1.37.1 pytest==8.4.2 -r sovereign/requirements.txt
          python3 "$RUNNER_TEMP/trusted-bridge.py" stage --archive "$RUNNER_TEMP/drop/approved.zip"
          git config user.name "meridian-web-agent-intake"
          git config user.email "meridian-web-agent-intake@users.noreply.github.com"
          git config core.hooksPath .githooks
          git checkout -b web-agent-candidate
          {
            printf 'feat(web-agent): approved public source drop\n\n'
            jq -r '"Claim: #\(.claim_issue)\nAgent: \(.agent)\nDrop-Source: \(.archive_sha256 // .source_commit)"' <<<"$WEB_AGENT_RELEASE_JSON"
            git diff --cached --diff-filter=A --name-only -- '*.py' | while IFS= read -r f; do
              case "$f" in tests/*) ;; *) printf 'Language-Exception: %s -- preserve approved source in existing Python runtime\n' "$f";; esac
            done
          } > "$RUNNER_TEMP/message"
          git commit -F "$RUNNER_TEMP/message"
          python3 "$RUNNER_TEMP/trusted-bridge.py" verify --archive "$RUNNER_TEMP/drop/approved.zip" --commit "$(git rev-parse HEAD)"
          git bundle create "$RUNNER_TEMP/candidate.bundle" web-agent-candidate "^$base"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-web-candidate
          path: ${{ runner.temp }}/candidate.bundle
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [fetch, prepare]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    env:
      WEB_AGENT_RELEASE_JSON: ${{ vars.WEB_AGENT_RELEASE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: approved-public-web-drop
          path: ${{ runner.temp }}/drop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sealed-web-candidate
          path: ${{ runner.temp }}/candidate
      - name: Independently verify exact candidate without checking out candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(jq -er '.base_sha' <<<"$WEB_AGENT_RELEASE_JSON")
          test "$(git rev-parse HEAD)" = "$base"
          git fetch "$RUNNER_TEMP/candidate/candidate.bundle" refs/heads/web-agent-candidate:refs/heads/web-agent-candidate
          candidate=$(git rev-parse refs/heads/web-agent-candidate)
          python3 bin/web_agent_bridge.py verify --archive "$RUNNER_TEMP/drop/approved.zip" --commit "$candidate"
          bin/claim-gate "$base" "$candidate"
      - id: pem
        env:
          PEM_B64: ${{ secrets.SEED_GITHUB_APP_PEM_B64 }}
        run: |
          set -euo pipefail
          test -n "$PEM_B64"
          pem=$(printf %s "$PEM_B64" | base64 -d)
          while IFS= read -r line; do test -z "$line" || echo "::add-mask::$line"; done <<<"$pem"
          { echo "key<<PEM_EOF"; echo "$pem"; echo "PEM_EOF"; } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ secrets.SEED_GITHUB_APP_ID }}
          private-key: ${{ steps.pem.outputs.key }}
          repositories: idp
          permission-contents: write
      - name: Publish once to the existing submit gate
        env:
          GH_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          base=$(jq -er '.base_sha' <<<"$WEB_AGENT_RELEASE_JSON")
          digest=$(jq -er '.archive_sha256 // .source_commit' <<<"$WEB_AGENT_RELEASE_JSON")
          ref="refs/heads/submit/web-agent-$digest"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$base"
          test -z "$(git ls-remote origin "$ref" "refs/heads/lane/web-agent-$digest")"
          auth=$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" push origin "refs/heads/web-agent-candidate:$ref"
          echo "SUBMIT_SOURCE_ONLY $ref"
  bootstrap-source:
    # One-time public source bootstrap. No credentials or candidate code in
    # the later publisher. Protected workflow is deliberately not included.
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/7760-web-agent-unbind-20261126'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE: 3b9125097de7adcdbcb488ddb71d2fe1bc8da0c8
      AGENT: meridian-web-agent-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Real estate hooks on ordinary source only
        run: |
          set -euo pipefail
          source="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git checkout -b web-agent-bootstrap "$BASE"
          git config core.hooksPath .githooks
          git config user.name "Meridian web-agent bootstrap"
          git config user.email "meridian-web-agent-bootstrap@users.noreply.github.com"
          python3 -m pip install --quiet ruff==0.15.18 pyyaml yamllint==1.37.1
          git checkout "$source" -- bin/web_agent_bridge.py
          git commit -m "feat(web-agent): exact public release validator" \
            -m "Claim: #7760
          Agent: meridian-web-agent-bootstrap
          Language-Exception: bin/web_agent_bridge.py -- founder-supplied stdlib Python bridge"
          git checkout "$source" -- ops/aistudio/aistudio_direct_github_drop.mjs ops/aistudio/web_agent_direct_drop.test.mjs
          git commit -m "feat(aistudio): create-only direct source custody" \
            -m "Claim: #7760
          Agent: meridian-web-agent-bootstrap"
          git checkout "$source" -- tests/test_web_agent_bridge.py
          git commit -m "test(web-agent): exact scope and source custody regressions" \
            -m "Claim: #7760
          Agent: meridian-web-agent-bootstrap"
          git diff --exit-code "$source" HEAD -- bin/web_agent_bridge.py ops/aistudio/aistudio_direct_github_drop.mjs ops/aistudio/web_agent_direct_drop.test.mjs tests/test_web_agent_bridge.py
          want=$(printf '%s\n' bin/web_agent_bridge.py catalog/estate-capability-registry.json ops/aistudio/aistudio_direct_github_drop.mjs ops/aistudio/web_agent_direct_drop.test.mjs tests/test_web_agent_bridge.py | sort)
          test "$(git diff --name-only "$BASE" HEAD | sort)" = "$want"
          python3 bin/capability-index emit --write
          git diff --exit-code -- catalog/estate-capability-registry.json
          git bundle create "$RUNNER_TEMP/bootstrap.bundle" web-agent-bootstrap "^$BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-agent-bootstrap-bundle
          path: ${{ runner.temp }}/bootstrap.bundle
          retention-days: 1
          if-no-files-found: error
  bootstrap-publish:
    needs: bootstrap-source
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/7760-web-agent-unbind-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      BASE: 3b9125097de7adcdbcb488ddb71d2fe1bc8da0c8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3b9125097de7adcdbcb488ddb71d2fe1bc8da0c8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-agent-bootstrap-bundle
          path: ${{ runner.temp }}/bundle
      - name: Exact verified source only; no protected paths, no force
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git fetch "$RUNNER_TEMP/bundle/bootstrap.bundle" refs/heads/web-agent-bootstrap:refs/heads/web-agent-bootstrap
          tip=$(git rev-parse refs/heads/web-agent-bootstrap)
          want=$(printf '%s\n' bin/web_agent_bridge.py catalog/estate-capability-registry.json ops/aistudio/aistudio_direct_github_drop.mjs ops/aistudio/web_agent_direct_drop.test.mjs tests/test_web_agent_bridge.py | sort)
          test "$(git diff --name-only "$BASE" "$tip" | sort)" = "$want"
          git diff --exit-code "$GITHUB_SHA" "$tip" -- bin/web_agent_bridge.py ops/aistudio/aistudio_direct_github_drop.mjs ops/aistudio/web_agent_direct_drop.test.mjs tests/test_web_agent_bridge.py
          for commit in $(git rev-list "$BASE..$tip"); do
            git show -s --format=%B "$commit" | grep -q '^X-Idp-Signed: '
          done
          paths=$(printf '%s\n' "$want" | paste -sd, -)
          gh issue comment 7760 --body "CLAIM agent=meridian-web-agent-bootstrap paths=$paths heartbeat=$(date -u +%FT%TZ)"
          bin/claim-gate "$BASE" "$tip"
          ref=refs/heads/quarantine/7760-web-agent-bootstrap
          test -z "$(git ls-remote origin "$ref")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" push origin "$tip:$ref"
          echo "EXACT_SIGNED_SOURCE=$tip"
