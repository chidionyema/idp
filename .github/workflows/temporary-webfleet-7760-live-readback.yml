# Read-only real GitHub-source hydration canary. Temporary proof branch only.
name: temporary-webfleet-7760-live-readback
on:
  push:
    branches: ["proof/7760-v1-evidence-node-20261122"]
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Real IDP GitHub API to one canonical V1 task packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { hydrateFromGitHub } from './scripts/web-fleet/github-evidence.mjs';
          const packet=await hydrateFromGitHub({
            issue:8430,
            paths:['platform/lifeboat/src/task-packet.js'],
            taskId:'FIR-07-AISTUDIO-REAL-READBACK',
            instructionId:'FIR-07',
            owner:'gemini-web-unverified',
            acceptance:'Propose a bounded source change or independent adversarial review; do not perform GitHub writes, sign, certify or invent model execution.',
          });
          if(packet.schema!=='MERIDIAN-TASK-V1'||packet.source_files.length!==1||
             packet.source_files[0].source_mode!=='100644'||packet.checkpoint.state!=='UNKNOWN'||
             packet.requested_result.authority!=='DATA_ONLY_UNTRUSTED') {
             throw new Error('CANONICAL_SOURCE_VERDICT_MISMATCH');
          }
          const output=path.join(process.env.RUNNER_TEMP,'meridian-task-v1-real-readback.json');
          fs.writeFileSync(output,JSON.stringify(packet,null,2)+'\n',{mode:0o600});
          console.log(JSON.stringify({task_id:packet.task_id,source_sha:packet.source_sha,
            git_blob_sha:packet.source_files[0].git_blob_sha,bytes:packet.source_files[0].bytes,
            packet_bytes:Buffer.byteLength(JSON.stringify(packet)),checkpoint:packet.checkpoint.state,
            status:'SOURCE_READBACK_ONLY_NOT_GEMINI_EXECUTION'}));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: 7760-real-v1-task-packet
          path: ${{ runner.temp }}/meridian-task-v1-real-readback.json
          retention-days: 2
          if-no-files-found: error
