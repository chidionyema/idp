name: Genesis staged-commit enforcement exact-source proof

on:
  push:
    branches: [proof/agent-precommit-system-20261110]

permissions:
  contents: read

jobs:
  staged-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact user-lane source and tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7bd884bb076e2bf45f60b730877802a3fffa97da"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/agent-precommit-system-proof.yml"
          git diff --quiet HEAD^ HEAD -- bin/idp-agent-patch-preflight.py .githooks/pre-commit .github/workflows/agent-sandbox.yml tests/test_agent_patch_preflight.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate hook and Python syntax before suite
        run: |
          set -euo pipefail
          bash -n .githooks/pre-commit
          python -m py_compile bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py
      - name: Run real Git index acceptance and repair corpus
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_agent_patch_preflight.py -v
      - name: Existing ruff failure-class controls
        run: |
          set -euo pipefail
          python -m pip install -q 'ruff==0.15.18'
          ruff check --select E9,F,B bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py
          if ! ruff format --check bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py; then
            ruff format bin/idp-agent-patch-preflight.py tests/test_agent_patch_preflight.py
            python - <<'PY'
          import json
          from pathlib import Path
          for name in ('bin/idp-agent-patch-preflight.py', 'tests/test_agent_patch_preflight.py'):
              print('GENESIS_FORMAT_RESULT ' + json.dumps({'path':name,'content':Path(name).read_text()},separators=(',',':')))
          PY
            exit 1
          fi
