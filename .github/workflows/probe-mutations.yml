# crew#631 CP8: weekly, every probe is run against a broken target (auth off, database down, an
# ingest that drops, wrong digest). A probe that passes a broken door is quarantined and the run
# is red. Then the last 30 real verdicts grade each assertion's graduation: UNPROVEN until it has
# one real FAIL and one real PASS. No cluster, no vault: the doors are fakes with one thing wrong.
name: probe-mutations
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [probes/**, bin/idp-probe-mutations, bin/idp-prove]
permissions:
  contents: read
  actions: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: last 30 real verdicts from the prover on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verdicts
          for id in $(gh run list --workflow verdict-langfuse.yml --branch main --status completed -L 30 --json databaseId -q '.[].databaseId'); do
            gh run download "$id" -n verdict-langfuse -D "verdicts/$id" 2>/dev/null || true
          done
          echo "downloaded $(find verdicts -name verdict.json | wc -l) verdicts"
      - name: mutations and graduation
        run: |
          rc=0
          bin/idp-probe-mutations --verdicts verdicts | tee mutations.out || rc=$?
          printf '### probe-mutations\n```\n%s\n```\n' "$(cat mutations.out)" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
