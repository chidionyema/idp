# button: Verify every surface after deploy and revert on red
# founder: "i need complete verification automated, real voice conversations on fleet and face that
#   is verified and all other features automated verification... every single feature on both must
#   be extensively verified before and after deployment. i dont want HINT OF A Gapp" — plus
#   "no gaps", 2026-10-02.
# docs/research/2026-10-02-complete-automated-verification.md §6: post-deploy verdict + rollback.
#
# This is the CP4 loop, and the rollback is what makes it a gate rather than a report:
#   hourly        the battery runs through the public gate regardless of any deploy;
#   on dispatch   deploy-when-green fires `surfaces-deployed` the moment an image-update PR lands;
#   on FAIL       a fresh deploy (dispatch) rolls the image tag back through a revert PR on the
#                 flux image-updates branch (raised by this workflow, landed by merge-when-green —
#                 never hand-applied); an hourly (non-dispatch) FAIL pages crew#1019 instead,
#                 because a standing red is a defect to fix, not a tag to churn.
# Pre-deploy (L1/L2/L3/L5 against the lane's own build) runs in the greenlane proof job, not here.
name: verdict-surfaces
on:
  schedule:
    - cron: "43 * * * *"   # hourly; verdict TTL 1h, same cycle as the other verdicts
  workflow_dispatch:
    inputs:
      digest:
        description: "image digest this verdict is bound to (deploy-when-green passes it)"
        required: false
        default: ""
  repository_dispatch:
    types: [surfaces-deployed]
permissions:
  contents: write   # the rollback job pushes a revert lane branch
  checks: write
  issues: write
  id-token: write   # the OIDC token this job trades for OCI access
  # WITHOUT THE LINE ABOVE THE BATTERY NEVER RUNS. Declaring a `permissions:` block sets every
  # unlisted scope to none, so id-token is absent, the exchange action dies on
  # "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL env variable", and `run the battery through the
  # public gate` is SKIPPED -- the job is red before it grades anything, so the public front door
  # was graded by nothing, hourly, since this workflow was written (git log -S id-token: empty).
  # Measured 2026-10-11: 21 workflows that trade an OIDC token all carry this line; oke-check.yml,
  # which runs the identical exchange, is green on main. This file was the only one without it.
concurrency:
  group: verdict-surfaces
  cancel-in-progress: false
jobs:
  battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      outcome: ${{ steps.verdict.outputs.outcome }}
      digest: ${{ steps.verdict.outputs.digest }}
      dispatched: ${{ steps.verdict.outputs.dispatched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/oci-cli.txt
      # The prover's machine identity (same exchange oke-check.yml uses): without it the
      # vault read below is BLIND and the battery 401s at the gate pretending to be verified.
      # domain_base_url and oci_region are required inputs: without them the action threw
      # "Input required and not supplied: domain_base_url" and the battery never ran -- every
      # run red for that reason alone, 22 in a row to 2026-10-08, none of them testing voice.
      #
      # The OIDC token is not the vault read. With the token finally scoped (2026-10-11),
      # run 38168478401 exchanged it successfully and the battery then reported, in its own
      # words, `BLIND   cloud  oci CLI is not installed` -> `BLOCKED surfaces  vault read of
      # backstage-env.PROVER_TOKEN failed; L4/L5 would 401 at the gate`. `bin/idp-cloud secret
      # get` shells out to the oci CLI, and no step in this file ever installed it; every other
      # workflow that reads the vault installs it from .github/requirements/oci-cli.txt
      # (verdict-backstage.yml:42, green on main), the file whose own header says it exists so
      # setup-python has something to hash for `cache: pip`.
      - name: oci cli
        run: pip install -q -r .github/requirements/oci-cli.txt
      - name: OCI session token from the GitHub OIDC token
        uses: gtrevorrow/oci-token-exchange-action@e8b0200e63131e48bc425ea4abf99135201b1e40 # v2
        with:
          oidc_client_identifier: ${{ secrets.OIDC_CLIENT_IDENTIFIER }}
          domain_base_url: ${{ vars.DOMAIN_BASE_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ vars.OCI_REGION }}
      - name: run the battery through the public gate
        id: verdict
        env:
          APP_URL: https://catalogue.mumchimp.com
          BACKEND_URL: https://catalogue.mumchimp.com/api/proxy/fleetview
          RUNNING_DIGEST: ${{ inputs.digest || github.event.client_payload.digest }}
          DISPATCHED: ${{ github.event_name == 'repository_dispatch' }}
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_OS_NAMESPACE: ${{ vars.OCI_OS_NAMESPACE }}
        run: |
          set -o pipefail
          # The prover token arrives by name from the vault (never a secret in the workflow
          # file or the log): the same backstage-env.PROVER_TOKEN idp-prove reads, so L4/L5
          # take the same machine door backstage.py takes.
          env_json=$(bin/idp-cloud secret get backstage-env) \
            && PROVER_TOKEN=$(printf '%s' "$env_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("PROVER_TOKEN",""))') \
            || PROVER_TOKEN=""
          if [ -z "$PROVER_TOKEN" ]; then
            echo "BLOCKED surfaces  vault read of backstage-env.PROVER_TOKEN failed; L4/L5 would 401 at the gate"
            echo "outcome=FAIL" >> "$GITHUB_OUTPUT"
            echo "digest=$RUNNING_DIGEST" >> "$GITHUB_OUTPUT"
            echo "dispatched=$DISPATCHED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PROVER_TOKEN
          rc=0
          bin/idp-verify-surfaces --post 2>&1 | tee verify.out || rc=$?
          line=$(grep -E '^PASS|^FAIL' verify.out | tail -1 || true)
          echo "outcome=$( [ $rc -eq 0 ] && echo PASS || echo FAIL )" >> "$GITHUB_OUTPUT"
          echo "digest=$RUNNING_DIGEST" >> "$GITHUB_OUTPUT"
          echo "dispatched=$DISPATCHED" >> "$GITHUB_OUTPUT"
          exit 0   # the job's colour comes from the final gate step, not this one
      - name: the verdict file is the run's artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdict-surfaces
          path: |
            verify.out
          if-no-files-found: warn
          retention-days: 30
      - name: check-run verify/surfaces, conclusion = outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -E '^(PASS|FAIL) +surfaces' verify.out | tail -1 || true)
          line=${line:-"FAIL   surfaces  the battery died before printing a verdict line"}
          outcome=${line%% *}; case "$outcome" in PASS) c=success;; *) c=failure;; esac
          summary=$(printf '```\n%s\n```\n' "$(grep -E '^(PASS|FAIL) +surfaces' verify.out || true)")
          gh api "repos/${{ github.repository }}/check-runs" -f name=verify/surfaces -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion="$c" -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f "output[title]=$line" -f "output[summary]=$summary" >/dev/null
          printf '### verdict-surfaces\n```\n%s\n```\n' "$line" >> "$GITHUB_STEP_SUMMARY"
      - name: a standing red pages crew#1019 (dispatched red rolls back instead, next job)
        # `failure()` in a step's `if:` sees only the steps that have already run, and the step that
        # decides red comes below this one -- so this page could not fire even once the gate itself
        # was fixed. Measured 2026-10-11, run 38169906354: the gate below failed and this step was
        # SKIPPED. Page on the same signal the gate and the check-run publish.
        if: always() && steps.verdict.outputs.outcome != 'PASS' && steps.verdict.outputs.dispatched != 'true'
        env:
          # bin/idp-github-app reads the github-app vault secret through bin/idp-cloud, which
          # shells out to the oci CLI -- the session the OIDC token exchange opened above.
          OCI_CLI_AUTH: security_token
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        run: |
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          body="$ts **verdict/surfaces** (hourly): FAIL — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — the surfaces battery is red on the standing deployment; see the check-run for the failing level."
          # The page needs an identity that can write to chidionyema/crew. The workflow's own
          # GITHUB_TOKEN cannot: measured 2026-10-11, run 38170507984, `GraphQL: Resource not
          # accessible by integration (addComment)` -- an installation token is scoped to the
          # repository running the workflow, and crew#1019 stayed at one comment. The estate's own
          # GitHub App can: `bin/idp-github-app token <lane>` mints an installation token narrowed
          # by platform/github-app/lanes.json, and `ticket-verifier` is the narrowest lane that can
          # comment on an issue -- metadata:read, issues:write, actions:read; no contents, no pull
          # requests, no workflows. Same incantation as ticket-verification.yml:59, which posts to
          # crew#102 from this same OIDC session. No `|| true`: a page that cannot page must be red,
          # not green, which is how the refusal stayed invisible until now.
          tok=$(bin/idp-github-app token ticket-verifier 2>&1) || { echo "BLIND   page  no App token: ${tok:0:160}"; exit 2; }
          echo "::add-mask::$tok"
          GH_TOKEN="$tok" gh issue comment 1019 --repo chidionyema/crew --body "$body"
      - name: the job is red when the battery is not PASS
        if: always()
        # Measured 2026-10-11, run 38169517103 -- the first run whose battery actually executed:
        # this step ran `grep -qE '^PASS +surfaces' verify.out` and reported SUCCESS on a run whose
        # own verdict was FAIL (`{"state": "FAIL", "levels": {"L1L2": false, "L3": false,
        # "L4": false, "L5": false}}`), because the pattern matches the per-item lines too:
        # `PASS  surfaces.coverage.pages` and `PASS  surfaces.l2.backend.negative/agent-jobs` both
        # begin with `PASS surfaces`. verify.out carries no top-level `PASS surfaces` line at all;
        # its verdict is that JSON, and the step's own `outcome` output -- the value the check-run
        # already publishes -- is the same signal. So the job never went red, `if: failure()` was
        # never true, and both things this file exists for (page crew#1019 on a standing red, roll
        # the image back on a dispatched red) were unreachable: a report, not a gate. Gate on the
        # one signal, so check-run red and job red cannot disagree.
        run: |
          if [ "${{ steps.verdict.outputs.outcome }}" = "PASS" ]; then exit 0; fi
          grep -E '^(PASS|FAIL|BLOCKED|BLIND)' verify.out 2>/dev/null | tail -5 || true
          exit 1
  rollback:
    needs: battery
    if: failure() && needs.battery.outputs.dispatched == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: revert the image tag through a lane (never a hand-raised PR)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.battery.outputs.digest }}
        run: |
          set -eu
          # Measured 2026-10-03: chidionyema/flux does not exist and flux/image-updates is
          # auto-deleted after each merge -- the image-update commits live on THIS repo's main
          # (e.g. "platform: image update -> main-13890-..."). Clone main, find the newest one,
          # revert it onto a lane, and let the Greenlane raise the PR and land it (a hand-raised
          # PR is refused and relaned; the engine is the only PR author).
          git clone --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          target=$(git log -50 --format='%H %s' | grep -iE 'image update' | head -1 | cut -d' ' -f1 || true)
          if [ -z "$target" ]; then
            echo "NO REVERT TARGET -- no image-update commit in the last 50 on main. Filing red instead of guessing."
            gh api "repos/chidionyema/crew/issues/1019/comments" -f body="**verdict/surfaces rollback**: fresh deploy graded FAIL but no image-update commit to revert (digest $DIGEST). A human-visible defect, not a silent pass." || true
            exit 1
          fi
          lane="lane/revert-surfaces-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "verdict-surfaces"
          git config user.email "verdict-surfaces@users.noreply.github.com"
          git revert --no-edit "$target"
          git push origin "HEAD:$lane"
          gh api "repos/chidionyema/crew/issues/1019/comments" -f body="**verdict/surfaces rollback**: fresh deploy graded FAIL; revert lane \`$lane\` pushed (reverts $target, digest $DIGEST). The Greenlane proves it green on main and lands it; the next dispatched verdict must return to PASS." || true
