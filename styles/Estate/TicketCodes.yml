extends: existence
message: "'%s' is a ticket code, a checkpoint, a hash or a run id. Say what it is in words; the code belongs in a link, never in the sentence a person reads."
link: https://github.com/chidionyema/crew/issues/612
level: error
ignorecase: false
nonword: true
tokens:
  - '\b(?:crew|idp|cg|estate|prospector)#\d+'
  - '\bCP\d+[a-z]?\b'
  - '\bLAW \d+\b'
  - '\bR\d{1,2}\b(?=[^\w-]|$)'
  - '\bADR ?\d{4}\b'
  - '\b[0-9a-f]{7,40}\b'
  - '\b\d{9,}\b'
