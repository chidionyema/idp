# The idp platform as one catalog entity, with its docs and its relationships.
#
# Before this file the portal held three entities: the Backstage scaffold's own
# "An example of a Backstage application" (owner john@example.com), the template
# scaffold's copy of it, and the generated estate inventory. Nothing declared
# dependsOn, nothing declared providesApis, and nothing declared techdocs-ref, so
# the catalog drew no graph and TechDocs had nothing to render.
#
# techdocs-ref is dir:. because mkdocs.yml sits beside this file, which is
# Backstage's own recommendation: docs live with the code they describe.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: idp
  title: idp — the platform
  description: >-
    One of each platform layer. Products are onboarded onto it; they do not carry
    their own copies of routing, traces, secrets or scheduling.
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - platform
    - c4
    - diataxis
  links:
    - url: http://127.0.0.1:3300/
      title: Board
    - url: https://github.com/chidionyema/crew/blob/main/docs/STANDARDS.md
      title: Standards
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-engineering
  system: system:default/estate
  providesApis: []
  dependsOn:
    - resource:default/gateway
    - resource:default/model-routing
    - resource:default/traces
    - resource:default/secrets
    - resource:default/scheduling
