[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idp-concurrency"
version = "0.1.0"
description = "Shared concurrency primitives for the estate: CRDT, MerkleLog, DAG, wait-free queues, traced I/O, lint rules."
requires-python = ">=3.9"
dependencies = [
    "pyautomerge>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
server = ["aiohttp>=3.9"]
sqlite = ["aiosqlite>=0.19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
