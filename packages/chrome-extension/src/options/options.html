<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetView Voice Settings</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
      --bg: #1a1a2e;
      --bg-secondary: #16213e;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding: 32px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .section {
      background: var(--bg-secondary);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .section h2 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 16px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="url"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--error);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .status {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 16px;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border: 1px solid var(--error);
    }

    .hidden {
      display: none;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--border);
      border-radius: 24px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
      background: var(--primary);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(24px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FleetView Voice Settings</h1>

    <div class="section">
      <h2>Webhook Configuration</h2>
      <div class="form-group">
        <label for="webhook-url">Local Webhook URL</label>
        <input type="url" id="webhook-url" placeholder="http://localhost:3000/voice/intent">
        <p class="hint">Where to send voice intents. Must be localhost for security.</p>
      </div>
      <div class="form-group">
        <label for="webhook-timeout">Request Timeout (ms)</label>
        <input type="number" id="webhook-timeout" value="5000" min="1000" max="30000">
      </div>
    </div>

    <div class="section">
      <h2>Voice Settings</h2>
      <div class="form-group toggle-group">
        <label class="toggle">
          <input type="checkbox" id="auto-punctuation" checked>
          <span class="toggle-slider"></span>
        </label>
        <span>Auto punctuation</span>
      </div>
      <div class="form-group toggle-group">
        <label class="toggle">
          <input type="checkbox" id="continuous-mode">
          <span class="toggle-slider"></span>
        </label>
        <span>Continuous listening mode</span>
      </div>
      <div class="form-group">
        <label for="language">Language</label>
        <input type="text" id="language" value="en" placeholder="en">
        <p class="hint">ISO language code (en, es, fr, de, etc.)</p>
      </div>
    </div>

    <div class="section">
      <h2>Model Management</h2>
      <div class="form-group">
        <p id="model-info">Loading model info...</p>
      </div>
      <button id="clear-model" class="btn btn-danger">Clear Cached Model</button>
    </div>

    <div class="actions">
      <button id="save-btn" class="btn btn-primary">Save Settings</button>
      <button id="test-webhook" class="btn btn-primary">Test Webhook</button>
    </div>

    <div id="status" class="status hidden"></div>
  </div>

  <script src="../../dist/options.js" type="module"></script>
</body>
</html>
