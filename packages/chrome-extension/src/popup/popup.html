<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetView Voice</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>FleetView Voice</h1>
      <div id="user-info" class="user-info hidden">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn-small">Logout</button>
      </div>
    </header>

    <!-- Login Section -->
    <section id="login-section" class="section">
      <p>Sign in to start using voice commands</p>
      <button id="google-login" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9.003 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.836.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9.003 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.428 0 9.002 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29c.708-2.127 2.692-3.71 5.036-3.71z"/>
        </svg>
        Sign in with Google
      </button>
    </section>

    <!-- Model Download Section -->
    <section id="model-section" class="section hidden">
      <div class="model-status">
        <span id="model-status-text">Checking model...</span>
        <div id="progress-container" class="progress-container hidden">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-text" class="progress-text hidden">0%</span>
      </div>
      <button id="download-model" class="btn btn-primary hidden">Download Voice Model (40MB)</button>
    </section>

    <!-- Voice Control Section -->
    <section id="voice-section" class="section hidden">
      <button id="listen-btn" class="btn btn-listen">
        <svg id="mic-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <span id="listen-text">Start Listening</span>
      </button>

      <div id="transcript-container" class="transcript-container hidden">
        <h3>Transcript</h3>
        <p id="transcript"></p>
      </div>

      <div id="intent-container" class="intent-container hidden">
        <h3>Detected Intent</h3>
        <pre id="intent"></pre>
      </div>

      <div id="webhook-status" class="webhook-status hidden">
        <span id="webhook-status-text"></span>
      </div>
    </section>

    <footer>
      <a href="#" id="options-link">Settings</a>
    </footer>
  </div>

  <script src="../../dist/popup.js" type="module"></script>
</body>
</html>
