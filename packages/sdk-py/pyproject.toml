[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetview-voice"
version = "0.1.0"
description = "FleetView Voice Python SDK - voice events over NATS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "FleetView", email = "chidionyema333@gmail.com" }
]
keywords = ["fleetview", "voice", "nats", "events", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "nats-py>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/chidionyema/idp"
Repository = "https://github.com/chidionyema/idp"

[tool.hatch.build.targets.wheel]
packages = ["fleetview_voice"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
