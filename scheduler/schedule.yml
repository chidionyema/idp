    - --fix
    - --root
    - $CODE
    cron: 57 1,7,13,19 * * *
    skip_on_battery: false
    ok_exit: [1]  # 1 = swept fine and reports a repo with no graph, a missing hook or a stale graph; not a crash (2026-08-28: breaker open after 3 findings runs, row dark)
