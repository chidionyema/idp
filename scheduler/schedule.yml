    - ~/.claude/scripts/hc-wrap.sh
    - law-writer
    - /usr/local/bin/python3
    - ~/.claude/scripts/law-writer.py
    - --write
    cron: 5 1,7,13,19 * * *
    skip_on_battery: false
    timeout_s: 1800
  ai.estate.sovereign-digest:
    # reads the worker's SB_RECEIPTS under ESTATE_HOME, a file the Mac worker writes (measured 2026-08-27 16:55Z from the script, not the command)
    runs_on: mac
    runs_on_ref: crew#396
    command:
    - $IDP/sovereign/.venv/bin/python
    - -m
    - sovereign.cli
    - digest
    - --send
    cwd: $IDP
    description: Builds the signed daily digest (max six lines, kernel-signed) from the receipt chain and posts it to the founder's Telegram; KINI spec 2.5, crew#284 CP5. Hour matches presence.digest_hour.
    cron: 0 9 * * *
    skip_on_battery: false
    timeout_s: 300
  ai.estate.sovereign-self-check:
    # its signals are the tracing last-ok marker and the alert inbox under ESTATE_HOME on the Mac; on a fresh emptyDir every run says continue (measured 2026-08-27 16:55Z from the script, not the command)
    runs_on: mac
    runs_on_ref: crew#396
    ok_exit: [1]  # 1 = ran fine and reports a finding; not a crash
    command:
    - $IDP/sovereign/.venv/bin/python
    - -m
    - sovereign.cli
    - self-check
    - --enforce
    - --json
    cwd: $IDP
    description: Evaluates the self-termination rules (KINI spec 5, crew#284 CP6) every five minutes and acts on the verdict; Langfuse blind over blind.halt_after_min or a low-confidence streak stops running sessions, an alert flood posts one signed digest.
    cron: '*/5 * * * *'
    skip_on_battery: false
    timeout_s: 120
  ai.estate.tracked-guard:
    # syncs this Mac's ~/.claude/scripts checkout; nothing to sync once there is no Mac (measured 2026-08-27 16:55Z from the script, not the command)
    runs_on: retire
    runs_on_ref: crew#516 CP2
    command:
    - /usr/bin/python3
    - ~/.claude/scripts/tracked.py
    - --sync
    cron: '*/30 * * * *'
    cwd: ~/.claude/scripts
    skip_on_battery: false
    timeout_s: 1800
  ai.hermes.runaway-reaper:
    runs_on: retire
    runs_on_ref: crew#516 CP4
    command:
    - /usr/local/bin/python3
    - ~/.claude/scripts/estate/launchd_receipt.py
    - --label
    - ai.hermes.runaway-reaper
    - --
    - /bin/bash
    - ~/.claude/scripts/estate/runaway-reaper.sh
    cron: '*/5 * * * *'
    cwd: ~/.hermes
    env:
      HERMES_HOME: ~/.hermes
      HOME: '~'
    skip_on_battery: false
    timeout_s: 1800
  ai.idp.reconcile:
    runs_on: retire
    runs_on_ref: crew#458
    command:
    - $IDP/bin/idp-reconcile
    - --fix
    cron: '*/10 * * * *'
    cwd: $IDP
    max_load: 8.0
    skip_on_battery: false
    timeout_s: 300
  com.chidionyema.graphify-sweep:
    runs_on: mac
    runs_on_ref: crew#516 CP2
    command:
    - ~/.claude/scripts/hc-wrap.sh
