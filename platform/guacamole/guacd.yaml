# guacd, the protocol daemon: it holds the VNC session to the Mac and streams it to the browser
# through the web pod. Stateless; two replicas kept apart like every founder-facing surface (crew#539).
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: guacamole
  labels: { app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-screen }
spec:
  selector: { app.kubernetes.io/name: guacd }
  ports:
    - { name: guacd, port: 4822, targetPort: 4822 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
  labels: { app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: idp }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: guacd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: guacd, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: guacd }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # the image's `guacd` user (guacamole-server Dockerfile, UID 1000)
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: guacd
          image: docker.io/guacamole/guacd:1.6.0
          ports:
            - { containerPort: 4822, name: guacd }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: 4822 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 4822 }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
