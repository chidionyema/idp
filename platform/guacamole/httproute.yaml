# catalogue.<zone>/screen/ on the shared Gateway's https-catalogue listener (prospector-main
# deploy/k8s/base/edge.yaml; this namespace carries the edge-attach label it selects on). Traefik
# routes the longest path prefix, so /screen/ lands here and everything else stays the catalogue's.
# Behind the one login like every route (ADR 0003, ADR 0007;
# tests/test_front_door_every_route_is_behind_the_one_login.py): oauth2-proxy answers the
# ForwardAuth subrequest and Traefik copies X-Auth-Request-Email onto the request, the header
# Guacamole trusts (env.yaml HTTP_AUTH_HEADER). The /oauth2/ redirect rule already exists on this
# hostname (platform/backstage/overlays/oke). WebSocket upgrades pass through Traefik unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-forward-auth
  namespace: guacamole
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    backstage.io/kubernetes-id: founder-screen
  name: guacamole
  namespace: guacamole
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-catalogue
  hostnames:
    - "catalogue.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /screen/ }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: guacamole
          port: 8080
