# The Guacamole web app (Apache-2.0, guacamole.apache.org), STANDARDS row "founder screen access",
# crew#562 path 2. One Deployment: the init container applies the vendor schema once (the image's
# own initdb.sh, kept in an emptyDir), deletes the schema's default `guacadmin` account, and seeds
# the one connection -- "Estate Mac", VNC over the tailnet egress (mac-egress.yaml) -- granted to
# the founder by the email the front door presents. The VNC username and password are NOT stored:
# Guacamole prompts for the parameters a connection leaves blank, so the founder types his Mac
# login into the browser at connect time and it is never in the vault, git, or a chat (crew#66
# root trust). Sign-in is the front door: the header extension trusts X-Auth-Request-Email and the
# JDBC extension creates or finds that account (env.yaml). No password exists anywhere for this
# app (ADR 0007).
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: guacamole
  labels: { app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-screen }
spec:
  selector: { app.kubernetes.io/name: guacamole }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: guacamole-seed
  namespace: guacamole
data:
  # Idempotent, run under one advisory lock by every replica's init container (psql \if, the
  # shape platform/healthchecks/healthchecks.yaml uses through Django). :founder is the email.
  seed.sql: |
    SELECT pg_advisory_lock(562002);
    SELECT to_regclass('guacamole_connection') IS NOT NULL AS present \gset
    \if :present
    \else
    \i /schema/schema.sql
    \endif
    -- No default admin: the schema's 002-create-admin-user.sql made guacadmin/guacadmin.
    DELETE FROM guacamole_entity WHERE name = 'guacadmin' AND type = 'USER';
    -- The founder, by the email the front door presents. Auto-create would make the row on
    -- first sign-in; it exists now so the grant below can name it. The hash is 16 random bytes
    -- with no salt, matched by nothing: password sign-in is not routed and would not work.
    INSERT INTO guacamole_entity (name, type) VALUES (:'founder', 'USER') ON CONFLICT DO NOTHING;
    INSERT INTO guacamole_user (entity_id, password_hash, password_salt, password_date, disabled)
      SELECT entity_id, decode(md5(random()::text), 'hex'), NULL, now(), false
      FROM guacamole_entity WHERE name = :'founder' AND type = 'USER'
      ON CONFLICT DO NOTHING;
    INSERT INTO guacamole_connection (connection_name, protocol)
      SELECT 'Estate Mac', 'vnc'
      WHERE NOT EXISTS (SELECT 1 FROM guacamole_connection WHERE connection_name = 'Estate Mac');
    INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
      SELECT c.connection_id, p.n, p.v
      FROM guacamole_connection c,
           (VALUES ('hostname', 'founder-mac-vnc'), ('port', '5900'),
                   ('color-depth', '16'), ('cursor', 'local')) AS p(n, v)
      WHERE c.connection_name = 'Estate Mac'
      ON CONFLICT (connection_id, parameter_name) DO UPDATE SET parameter_value = EXCLUDED.parameter_value;
    INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
      SELECT e.entity_id, c.connection_id, 'READ'
      FROM guacamole_entity e, guacamole_connection c
      WHERE e.name = :'founder' AND e.type = 'USER' AND c.connection_name = 'Estate Mac'
      ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
  labels: { app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: idp }
spec:
  replicas: 2   # crew#539: one pod is one node event away from a 503
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: guacamole }
  template:
    metadata:
      labels: { app.kubernetes.io/name: guacamole, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: guacamole }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001   # the image's `guacamole` user (guacamole-client Dockerfile ARG UID=1001)
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # 1. the vendor's own schema, from the image that will use it (no copy of it in git).
        - name: schema
          image: docker.io/guacamole/guacamole:1.6.0
          command: ["/bin/sh", "-c", "/opt/guacamole/bin/initdb.sh --postgresql > /schema/schema.sql"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: schema, mountPath: /schema }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
        # 2. apply it once and seed the founder's connection (seed.sql above). Secrets are mounted
        #    files and exported by the container itself (the cluster policy secrets-not-from-env-vars).
        - name: seed
          image: docker.io/library/postgres:17.6-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              PGPASSWORD=$(cat /run/secrets/guacamole/POSTGRESQL_PASSWORD); export PGPASSWORD
              psql -h guacamole-db -U guacamole -d guacamole -v ON_ERROR_STOP=1 \
                -v founder="$(cat /run/secrets/guacamole/FOUNDER_EMAIL)" -f /seed/seed.sql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: schema, mountPath: /schema, readOnly: true }
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/guacamole, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      containers:
        - name: guacamole
          image: docker.io/guacamole/guacamole:1.6.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for f in /run/secrets/guacamole/*; do export "$(basename "$f")=$(cat "$f")"; done
              exec /opt/guacamole/bin/entrypoint.sh
          ports:
            - { containerPort: 8080, name: http }
          envFrom:
            - configMapRef: { name: guacamole-env }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /screen/, port: 8080 }
            periodSeconds: 10
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /screen/, port: 8080 }
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 60
          resources:
            requests: { cpu: 50m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/guacamole, readOnly: true }
            # the image builds GUACAMOLE_HOME and CATALINA_BASE under /tmp (entrypoint.d/100, /500)
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret: { secretName: guacamole }
        - name: seed
          configMap: { name: guacamole-seed }
        - name: schema
          emptyDir: {}
        - name: tmp
          emptyDir: {}
