# Founder screen access, path 2 of ADR 0009 decision founder-screen-access (crew#562): Apache
# Guacamole in the cluster, the estate Mac's screen in any browser at catalogue.<zone>/screen/,
# behind the one login. Restricted like every other row; the edge-attach label is what the shared
# Gateway's https-catalogue listener selects on (platform/healthchecks/namespace.yaml, same pair).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: guacamole
  labels:
    pod-security.kubernetes.io/enforce: restricted
    availability.idp/tier: founder-facing
    idp.estate/edge-attach: "true"
