# crew#539: a founder-facing surface survives losing one node. maxUnavailable 1, never a floor
# equal to the replica count (platform/healthchecks/availability.yaml). Graded by
# bin/idp-availability-gate in bin/idp-ci.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guacamole
  namespace: guacamole
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guacamole
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guacd
  namespace: guacamole
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guacd
