# Non-secret settings, the names the guacamole/guacamole image turns into guacamole.properties
# (guacamole.apache.org/doc/gug/guacamole-docker.html). The secret is the ExternalSecret next to
# this file, exported from mounted files by the container itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: guacamole-env
  namespace: guacamole
data:
  GUACD_HOSTNAME: guacd
  GUACD_PORT: "4822"
  POSTGRESQL_HOSTNAME: estate-rw.estate-db.svc.cluster.local   # the one estate Postgres (platform/estate-db)
  POSTGRESQL_PORT: "5432"
  POSTGRESQL_DATABASE: guacamole
  POSTGRESQL_USERNAME: guacamole
  # The front door creates the user: Traefik's ForwardAuth copies oauth2-proxy's
  # X-Auth-Request-Email onto the request (httproute.yaml Middleware) and the header extension
  # trusts it; the JDBC extension then creates or finds that account (no password anywhere).
  HEADER_ENABLED: "true"
  HTTP_AUTH_HEADER: X-Auth-Request-Email
  POSTGRESQL_AUTO_CREATE_ACCOUNTS: "true"
  # Served under catalogue.<zone>/screen/ on the existing https-catalogue listener: no new
  # hostname, no new certificate SAN, no change in prospector-main/deploy/k8s/base/edge.yaml.
  WEBAPP_CONTEXT: screen
