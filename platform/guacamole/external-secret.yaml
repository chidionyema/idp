# Every value the row needs comes from the estate vault; nothing is typed by a person (crew#227).
# `guacamole.postgres-password` is minted by bin/idp-estate-seed (register row
# docs/reference/policy/root-trust.md); the founder's email is the entry Langfuse and Healthchecks
# already read, so there is one of it. No Guacamole password exists anywhere: the schema's default
# `guacadmin` account is deleted by seed.sql and the front door is the only login (ADR 0007).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guacamole
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: guacamole
    creationPolicy: Owner
  data:
    - secretKey: POSTGRESQL_PASSWORD
      remoteRef: { key: guacamole, property: postgres-password }
    - secretKey: FOUNDER_EMAIL
      remoteRef: { key: langfuse-init-user-email }
---
# Postgres reads its password as a file (POSTGRES_PASSWORD_FILE), the same shape as healthchecks-db.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: guacamole-db
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: guacamole-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: guacamole, property: postgres-password }
