# The Mac's screen reaches the cluster the same way the pairing page reaches Sunshine
# (platform/backstage/overlays/oke/sunshine-egress.yaml): the Tailscale operator's egress pattern,
# an ExternalName Service carrying the tailnet IP, rewritten by the operator to its proxy. No
# sidecar, no key in this namespace. FOUNDER_MAC_TS_IP is the estate-config row, substituted by
# Flux (LAW 46). 5900 is macOS Screen Sharing (VNC); the Mac's own Sharing switch is the one
# human act on the Mac, and it is a switch, never a paste.
apiVersion: v1
kind: Service
metadata:
  labels:
    backstage.io/kubernetes-id: founder-screen
  name: founder-mac-vnc
  namespace: guacamole
  annotations:
    tailscale.com/tailnet-ip: "${FOUNDER_MAC_TS_IP}"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: vnc
      port: 5900
      protocol: TCP
