# The crew's identity in the cluster is a name and nothing else. No Role, no RoleBinding, no
# ClusterRoleBinding anywhere names this account, and the token is never mounted: the crew has
# no cluster hand by construction (founder 2026-09-01: no agent touches the cluster again).
# tests/test_crew729_agent_workforce_workload.py refuses any binding that names it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-workforce
  namespace: agent-workforce
automountServiceAccountToken: false
---
# crewAI memory and knowledge stores (AGENT_WORKFORCE_STORAGE_DIR). A volume that outlives the pod,
# the same reason platform/hermes-agent keeps HERMES_HOME on one (idp#365): a founder ruling
# ingested once is recalled on every run, never lost with a finished Job.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-workforce-data
  namespace: agent-workforce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# Every 15 minutes: with no argument the crew takes the oldest open ticket in a queued lane on the
# board that has no plan comment yet, and exits `idle` when there is none. One run at a time
# (Forbid), so two Jobs never claim one ticket. The image is the newest main of
# chidionyema/agent-workforce (its image workflow publishes every main commit as :main); the tag
# moves on the vendor side, so the pull policy is Always.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-workforce
  namespace: agent-workforce
  labels:
    # The catalogue Component the Backstage Kubernetes plugin reads this workload under
    # (backstage/platform/catalog-info.yaml, generated by bin/catalog-platform).
    backstage.io/kubernetes-id: agent-workforce
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # crew#396: finished Jobs are removed an hour later so their pods never haunt the receipt
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0                # a failed run is a red Job to read, never a silent retry
      activeDeadlineSeconds: 3000    # one ticket, under the 15-minute period times three; then the Job is killed and read
      template:
        metadata:
          labels:
            backstage.io/kubernetes-id: agent-workforce
        spec:
          # crew#584 CP-I: a batch job is seated by preempting one balloon pod, so it asks for at
          # most what one balloon pod holds (platform/scheduling/balloon.yaml) and is never
          # standing capacity.
          priorityClassName: platform-batch
          serviceAccountName: agent-workforce
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            # The law files the crew's knowledge base is built from, fetched from the repositories
            # that version them into AGENT_WORKFORCE_LAWS_DIR, producing exactly the four names the
            # crew's knowledge.py expects. All four repositories are public, so no token is
            # needed; the owner comes from estate-config (LAW 46), never a literal here.
            # Same pinned image as every estate CronJob (platform/state/cluster-state.yaml): it
            # ships python3, so no git and no second image.
            - name: laws
              image: ghcr.io/oracle/oci-cli:20260826
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  exec python3 - <<'PY'
                  import os, sys, urllib.request
                  owner = os.environ["LAWS_OWNER"]
                  out = os.environ["AGENT_WORKFORCE_LAWS_DIR"]
                  sources = {
                      "AGENTS.md": ("claude-guards", "laws/AGENTS.md"),
                      "AGENTS-FULL.md": ("claude-guards", "laws/AGENTS-FULL.md"),
                      "STANDARDS.md": ("crew", "docs/STANDARDS.md"),
                      "definition-of-done.md": ("idp", "docs/reference/policy/definition-of-done.md"),
                  }
                  failed = 0
                  for name, (repo, path) in sources.items():
                      url = f"https://raw.githubusercontent.com/{owner}/{repo}/main/{path}"
                      try:
                          with urllib.request.urlopen(url, timeout=30) as r:
                              body = r.read()
                      except Exception as why:  # noqa: BLE001 - every miss is named, none is hidden
                          print(f"FAIL laws {name} <- {url}: {why}")
                          failed += 1
                          continue
                      with open(os.path.join(out, name), "wb") as fh:
                          fh.write(body)
                      print(f"ok   laws {name} {len(body)} bytes <- {repo}/{path}")
                  sys.exit(1 if failed else 0)
                  PY
              env:
                - { name: LAWS_OWNER, value: "${ESTATE_GITHUB_OWNER}" }
                - { name: AGENT_WORKFORCE_LAWS_DIR, value: /laws }
                - { name: HOME, value: /tmp }
              volumeMounts:
                - { name: laws, mountPath: /laws }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 128Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
          containers:
            - name: crew
              image: ghcr.io/chidionyema/agent-workforce:main
              imagePullPolicy: Always
              # No argument: queue mode (the next unplanned ticket in a queued lane, or `idle`).
              # AGENT_WORKFORCE_QUEUE_LABELS overrides the lane set; the image's default is the
              # set the board actually carries, so the manifest names none.
              args: []
              env:
                # The one model router (LAW 34); bare aliases, rows in platform/llm/config.yaml (the crew
                # adds the openai/ provider prefix itself, so a prefixed value reaches the router as a
                # name it does not have). The verifier runs on a different alias from the builder so it
                # never grades with the builder's brain. `embed` is the router's embedding row.
                - { name: LITELLM_BASE_URL, value: "http://litellm.llm.svc:4000" }
                - { name: AGENT_WORKFORCE_MODEL, value: "minimax" }
                # `fast` since 2026-09-04: the deepseek lane answers 401 at the vendor and its row
                # has left platform/llm/config.yaml, so this verifier had no model at all.
                - { name: AGENT_WORKFORCE_VERIFIER_MODEL, value: "fast" }
                - { name: AGENT_WORKFORCE_EMBED_MODEL, value: "embed" }
                # The estate collector (LAW 50): one value in clusters/oke/estate-config.yaml.
                - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "${OTLP_ENDPOINT}" }
                - { name: OTEL_SERVICE_NAME, value: agent-workforce }
                - { name: LANGFUSE_BASE_URL, value: "http://langfuse-web.observability.svc:3000" }
                - { name: AGENT_WORKFORCE_REPO_OWNER, value: "${ESTATE_GITHUB_OWNER}" }
                - { name: AGENT_WORKFORCE_BOARD_REPO, value: crew }
                - { name: AGENT_WORKFORCE_PLATFORM_REPO, value: idp }
                - { name: AGENT_WORKFORCE_LAWS_DIR, value: /laws }
                - { name: AGENT_WORKFORCE_STORAGE_DIR, value: /var/lib/agent-workforce }
                - { name: CREWAI_STORAGE_DIR, value: /var/lib/agent-workforce }
                - { name: CREWAI_DISABLE_TELEMETRY, value: "true" }
                - { name: HOME, value: /tmp }
                # Secrets are files (kyverno secrets-not-from-env-vars); the crew reads NAME_FILE.
                - { name: AGENT_WORKFORCE_GITHUB_TOKEN_FILE, value: /run/secrets/agent-workforce/AGENT_WORKFORCE_GITHUB_TOKEN }
                - { name: LITELLM_API_KEY_FILE, value: /run/secrets/agent-workforce/LITELLM_API_KEY }
                - { name: LANGFUSE_PUBLIC_KEY_FILE, value: /run/secrets/agent-workforce/LANGFUSE_PUBLIC_KEY }
                - { name: LANGFUSE_SECRET_KEY_FILE, value: /run/secrets/agent-workforce/LANGFUSE_SECRET_KEY }
              volumeMounts:
                - { name: laws, mountPath: /laws, readOnly: true }
                - { name: data, mountPath: /var/lib/agent-workforce }
                - { name: secrets, mountPath: /run/secrets/agent-workforce, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 225m, memory: 768Mi }  # 2026-09-03: fits one balloon pod (crew#584 CP-I); limit stays "1", runtime unchanged
                limits: { cpu: "1", memory: 1536Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: laws
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: data
              persistentVolumeClaim:
                claimName: agent-workforce-data
            # One directory, three Secrets: the App token the generator mints, the Langfuse pair
            # and the router key. A projected volume, the same shape as hermes-agent's env dir.
            - name: secrets
              projected:
                defaultMode: 0440
                sources:
                  - secret: { name: agent-workforce-github }
                  - secret: { name: agent-workforce-langfuse }
                  - secret: { name: agent-workforce-router }
