# Every credential the crew holds, minted or mirrored in-cluster by external-secrets and mounted
# as files (platform/edge/kyverno-secrets-policy.yaml refuses a secret in an env var). The crew
# reads each one through its NAME_FILE convention (src/agent_workforce/estate.py in
# chidionyema/agent-workforce) and refuses to boot when any is missing: a crew that cannot be seen
# does not run (LAW 50).
#
# 1. GitHub: an installation token of the estate-agents App, narrowed to the agent-workforce lane of
#    platform/github-app/lanes.json (idp#1098): read metadata, write contents, pull requests and
#    issues, read actions and checks. No workflows, no admin, no secrets -- a buyer's engineer
#    reads the whole hand in six lines. The mint lives where the consumer lives, exactly as
#    platform/hermes-agent/gateway.yaml does it: no workflow, no script, no vault hop, and a
#    10-minute refresh keeps every token inside its 60-minute life.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-workforce-github
  namespace: agent-workforce
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: agent-workforce-github, creationPolicy: Owner }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: agent-workforce-github
      rewrite:
        - transform: { template: "AGENT_WORKFORCE_GITHUB_TOKEN" }
---
# ${githubAppIDQuoted} / ${githubAppInstallationIDQuoted} are substituted by Flux from the
# flux-system/github-app Secret (platform/alerts-github/github-app.yaml; this row's substituteFrom
# in clusters/oke/platform.yaml). The Quoted variants carry their own double quotes because
# kustomize build re-emits every scalar plain and a bare numeral types spec.appID as an int
# (idp#1027). Account identifiers are never typed in git (LAW 46).
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: agent-workforce-github
  namespace: agent-workforce
spec:
  appID: ${githubAppIDQuoted}
  installID: ${githubAppInstallationIDQuoted}
  # Mirrors the agent-workforce lane in platform/github-app/lanes.json. Suspending the App's
  # installation (docs/runbooks/agent-workforce.md, kill switch 1) makes this mint fail and every
  # run after it refuse to boot.
  permissions:
    metadata: read
    contents: write
    pull_requests: write
    issues: write
    actions: read
    checks: read
  auth:
    privateKey:
      secretRef:
        name: github-app-pem
        key: key
---
# The App's private key for the generator, from the one vault entry `github-app` that
# bin/idp-github-app writes; same template as platform/hermes-agent/gateway.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-workforce-github-app-pem
  namespace: agent-workforce
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: github-app-pem
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .pem_b64 | b64dec }}"
  dataFrom:
    - extract: { key: github-app }
---
# 2. Langfuse: the project keys Langfuse was initialised with (platform/observability, vault
#    entries langfuse-init-public-key / langfuse-init-secret-key), the same pair LiteLLM and
#    Hermes trace with (platform/llm/external-secret.yaml, platform/hermes-agent/langfuse-key.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-workforce-langfuse
  namespace: agent-workforce
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: agent-workforce-langfuse, creationPolicy: Owner }
  data:
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef: { key: langfuse-init-public-key }
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef: { key: langfuse-init-secret-key }
---
# 3. The model router key. A lane-scoped virtual key minted for this crew alone, with its own
#    daily budget, exactly as hindsight, hermes-agent-env and otto-golden already hold
#    (bin/idp-estate-seed ROUTER_PLAN, bin/idp-router-key). Until 2026-09-04 this line read the
#    router's MASTER key out of `litellm-upstream`, which can mint keys, read every consumer's
#    spend and change the model list -- the whole router inside one CronJob's mounted file.
#    Rotation is ROUTER_ROTATE=1 on the seed, never a console (LAW 52).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-workforce-router
  namespace: agent-workforce
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: agent-workforce-router, creationPolicy: Owner }
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef: { key: agent-workforce, property: LITELLM_API_KEY }
