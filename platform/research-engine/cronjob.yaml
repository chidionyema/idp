# The engine's intake is the estate's open `objective` issues, not a list of typed subjects.
# Until 2026-10-19 this file held five `lane: subject` lines rotated by the hour; none had a
# baseline, so no run could show it had answered anything (founder: "researches nothing
# worthwhile"). bin/idp-objective-miner now files each measured problem as an objective, and
# objective-adapter.py picks which one a run researches and posts the report on its issue.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-engine
  namespace: research
automountServiceAccountToken: false
---
# The hourly pass. One objective per run: the highest-ranked one that is new or whose last
# report has Continue ticked (objective-adapter.py). `run` writes the ledger; the delivery and
# the row counts go to the pod log, which is where the estate collector reads them, and the
# admitted claims go to the objective's issue as a report ending in Continue / Park.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-engine
  namespace: research
  labels: { app.kubernetes.io/name: research-engine, app.kubernetes.io/part-of: idp }
  # The row substitutes the App ids into github-app.yaml; this script's `${issue}`, `${PG}` and
  # the rest are the shell's, and strict envsubst would fail the whole row on them.
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  # A CronJob without `schedule` is schema-invalid (batch/v1 requires it), and Kubectl's
  # `--from=cronjob` needs a valid CronJob to clone. Dagster owns the actual cadence; this
  # value keeps the object valid and is not what fires the run.
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      # The worker deadline inside the engine is 300s per question and the router lanes are
      # given 300s each; 25 minutes is that with room for the crawl, and it is a hard stop so
      # a run that hangs cannot hold the next hour's slot.
      activeDeadlineSeconds: 1500
      template:
        metadata:
          labels: { app.kubernetes.io/name: research-engine, app.kubernetes.io/part-of: idp }
        spec:
          serviceAccountName: research-engine
          automountServiceAccountToken: false
          # ghcr.io is private, so the pod needs the estate's pull credential by name. Measured
          # 2026-09-04: without it every hourly job died in ErrImagePull, "unable to retrieve
          # auth token: invalid username/password: unauthorized".
          imagePullSecrets:
            - name: ghcr-pull
          restartPolicy: Never
          priorityClassName: platform-batch
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: engine
              # Pinned to the commit that built it, so the image the cluster runs can be read
              # in the repository it came from. Built by the research-engine repository's own
              # image workflow on a GitHub runner, never on the founder's Mac (LAW 31).
              # 2026-09-09: ea2d561 fixed the VERBOSE env; 3e3527b bakes the tiktoken o200k_base
              # cache into the image. Without that bake, gpt-researcher's per-response cost
              # estimate tried to download the encoding file from OpenAI's public blob on every
              # run, which this namespace has no internet egress to -> ConnectTimeout -> None ->
              # no question answered. Index amd64+arm64.
              # 2026-10-19: ddad623 fixed the source_index crash that kept every claim ungraded
              # (research-engine#12); e73d76f adds the `objective` lane this job runs (#13).
              # 2026-10-20: 6415760 cuts pages into 6,000-token pieces before embedding (#14).
              # At langchain's 8,191 the router's embed model counted 8,197 and refused with 400
              # "exceeds maximum allowed token size 8192", discarding that sub-query's context.
              # 2026-10-23: ecdd4b2 cuts a stalled embed call at 15s and stops joining executor
              # threads at the worker deadline (94c278e), and caps arxiv below 4.0, which removed
              # Search.results (92473eb). Verified in-cluster with RETRIEVER=exa,searx: one
              # objective answered end to end in 20m43s, status complete, nothing unanswered.
              image: ghcr.io/chidionyema/research-engine:sha-ecdd4b22ff053cf4c6549d9af65cc4f2841911a6
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Both credentials arrive as FILES and are exported here. The estate's
                  # admission policy refuses a workload that takes a secret from an env var,
                  # and the engine reads its configuration from the environment, so this line
                  # is the join between the two.
                  LITELLM_API_KEY="$(cat /secrets/router/LITELLM_API_KEY)"
                  # The estate's one Postgres, one database on it, not a server of our own.
                  # The database and the role are declared to the operator in
                  # platform/estate-db/cluster/databases.yaml, so nothing here creates either.
                  PG="postgresql://research:$(cat /secrets/db/POSTGRES_PASSWORD)@estate-rw.estate-db.svc.cluster.local:5432"
                  RESEARCH_PG_DSN="${PG}/research"
                  # Exa's key is bridged from the vault into human-exa and mounted as a file, for
                  # the same reason: gpt-researcher's Exa retriever reads EXA_API_KEY from the env.
                  EXA_API_KEY="$(cat /secrets/exa/EXA_API_KEY)"
                  export LITELLM_API_KEY RESEARCH_PG_DSN EXA_API_KEY
                  # Which objective this hour researches. The adapter prints its owner/repo#N
                  # ref and research subject, or nothing: an objective is researched once and
                  # again only when its report has Continue ticked (founder, 2026-10-19), so
                  # an hour with nothing new and nothing ticked spends nothing.
                  picked=$(python /adapter/objective-adapter.py pick)
                  if [ -z "$picked" ]; then
                    echo "research-engine: no objective awaiting research (none new, none ticked Continue)"
                    exit 0
                  fi
                  issue=$(printf '%s\n' "$picked" | sed -n 1p)
                  subject=$(printf '%s\n' "$picked" | sed -n 2p)
                  echo "research-engine researching objective ${issue}: ${subject}"
                  # Tiktoken's estimator (costs.py) needs a writable cache dir: the image bakes the
                  # encoding files under /app/tiktoken_cache but the root fs is readOnlyRootFilesystem,
                  # and tiktoken writes a lazy-download .tmp file there -> [Errno 30] Read-only file
                  # system (measured 2026-09-09, right after the earlier tracebacks cleared). Copy the
                  # baked files into the writable /state volume and point the cache there; any encoding
                  # the bake missed (cl100k_base) then downloads from the internet the research fence
                  # now allows. This is why TIKTOKEN_CACHE_DIR is set here, not as an image ENV.
                  mkdir -p /state/tiktoken
                  cp -f /app/tiktoken_cache/* /state/tiktoken/ 2>/dev/null || true
                  export TIKTOKEN_CACHE_DIR=/state/tiktoken
                  # The requester is the objective, so its claims join back to its issue. The
                  # adapter prints the full owner/repo#N ref (objectives live in idp, crew and
                  # prospector), so no repo prefix is added here.
                  # dash has no pipefail, so the run's status is kept here rather than lost
                  # behind a pipe; a failed run posts no report and the job goes red.
                  rc=0
                  python -m engine.cli run --profile objective --requester "${issue}" \
                    --subject "$subject" --out /state > /state/run.log 2>&1 || rc=$?
                  cat /state/run.log
                  [ "$rc" = 0 ] || exit "$rc"
                  python /adapter/objective-adapter.py report "$issue" /state/run.log
              env:
                # Nothing here is a secret and nothing here is a default in the image: the
                # engine hardcodes no host, no port and no model name (LAW 46).
                - { name: LITELLM_BASE_URL, value: "http://litellm.llm.svc.cluster.local:4000/v1" }
                - { name: RESEARCH_SEARXNG_URL, value: "http://searxng.searxng.svc.cluster.local:8080" }
                # Producer and verifier must be different providers -- the engine refuses to
                # start otherwise, and the database CHECK refuses the row. These are lane names
                # on the estate router, never vendor model identifiers (LAW 34).
                - { name: RESEARCH_PRODUCER_MODEL, value: "minimax" }
                - { name: RESEARCH_VERIFIER_MODEL, value: "gemini" }
                - { name: RESEARCH_EMBEDDING_MODEL, value: "embed" }
                # gpt-researcher splits RETRIEVER on commas and queries every name, so this is
                # Exa leading with SearXNG alongside as the retriever that needs no key. The
                # engine only exports SEARX_URL when RETRIEVER is exactly "searx", so it is set
                # here directly for the comma form.
                - { name: RESEARCH_RETRIEVER, value: "exa,searx" }
                - { name: SEARX_URL, value: "http://searxng.searxng.svc.cluster.local:8080" }
                - { name: RESEARCH_WORKER_TIMEOUT_S, value: "300" }
                - { name: HOME, value: "/state" }
              volumeMounts:
                - { name: router, mountPath: /secrets/router, readOnly: true }
                - { name: db, mountPath: /secrets/db, readOnly: true }
                - { name: github-app, mountPath: /secrets/github-app, readOnly: true }
                - { name: exa, mountPath: /secrets/exa, readOnly: true }
                - { name: adapter, mountPath: /adapter, readOnly: true }
                - { name: state, mountPath: /state }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 200m, memory: 512Mi }
                limits: { cpu: "1", memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: router
              secret: { secretName: research-router }
            - name: db
              secret: { secretName: research-db }
            - name: github-app
              secret: { secretName: research-github-app }
            - name: exa
              secret: { secretName: human-exa }
            - name: adapter
              configMap: { name: research-objective-adapter }
            - name: state
              emptyDir: {}
            - name: tmp
              emptyDir: {}
