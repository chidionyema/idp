# Two credentials, and neither is typed, seeded or seen by a person.
#
# The database password is minted inside the cluster by the secret machinery's own
# generator, the same day-0 shape as platform/llm/redis.yaml. refreshInterval 0h: minted
# once at creation and stable, so the database and the job that connects to it can never
# disagree about it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: research-db
  namespace: research
spec:
  length: 42
  digits: 10
  # No symbols: the password is interpolated into a Postgres connection URL, and a URL is
  # the one place where an unescaped '@' or '/' turns a valid credential into a parse error.
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-db
  namespace: research
spec:
  refreshInterval: 0h
  target: { name: research-db, creationPolicy: Owner }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: research-db
      rewrite:
        - transform: { template: "POSTGRES_PASSWORD" }
---
# The router key. It is minted by `bin/idp-router-key science` from the router's master key
# (.github/workflows/vault-seed.yml, entry `science`) and lands in the estate vault as entry
# `science`, field `key`. Run 33867639366 minted the current one on the neutral lanes -- the
# key it replaced named claude and claude-fast, which the router no longer serves.
#
# The key is scoped to the lanes on that mint, so this job cannot reach a lane it was not
# given even if its environment named one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-router
  namespace: research
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: research-router
    creationPolicy: Owner
    template:
      data:
        LITELLM_API_KEY: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef: { key: science }
