# Two credentials, and neither is typed, seeded or seen by a person.
#
# The database credential is the estate's one Postgres, not a new one. The research engine
# has no database server of its own: it gets a database (`research`) and a role of the same
# name on the CloudNativePG cluster in namespace estate-db, and the role's password is the
# vault field platform/estate-db/cluster/secrets.yaml writes it from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-db
  namespace: research
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: research-db
    creationPolicy: Owner
    template:
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: estate-db, property: research-password }
---
# The router key. It is minted by `bin/idp-router-key science` from the router's master key
# (.github/workflows/vault-seed.yml, entry `science`) and lands in the estate vault as entry
# `science`, field `key`. Run 33867639366 minted the current one on the neutral lanes -- the
# key it replaced named claude and claude-fast, which the router no longer serves.
#
# The key is scoped to the lanes on that mint, so this job cannot reach a lane it was not
# given even if its environment named one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-router
  namespace: research
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: research-router
    creationPolicy: Owner
    template:
      data:
        LITELLM_API_KEY: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef: { key: science }
