# The research engine: the estate's own research department, on the hour. It writes a ledger of
# claims that each cite a snapshotted source and were checked by a model from a different
# provider than the one that wrote them; a claim that fails either test is kept with its
# rejection reason rather than dropped.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: research
resources:
  - namespace.yaml
  - secrets.yaml
  - pull-secret.yaml
  - github-app.yaml
  - cronjob.yaml
# The idp side of the engine (SPEC-v1 §8: a consumer's adapter is code in the consumer's repo):
# which objective the hour researches, and the report it posts back (idp#6603).
configMapGenerator:
  - name: research-objective-adapter
    files:
      - objective-adapter.py
    # The row substitutes the App ids into github-app.yaml; the adapter's f-strings carry `${`
    # (a dollar amount), which strict envsubst must not touch.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
