# ghcr-pull for this namespace, mirrored from backstage/ghcr-pull through the ClusterSecretStore
# ghcr-pull (platform/image-automation/pull-secret.yaml, crew#396 step 2).
#
# Without this the hourly job cannot pull its own image: measured 2026-09-04, the pod for job
# research-engine-29808863 sat in ErrImagePull with "unable to retrieve auth token: invalid
# username/password: unauthorized", because the namespace held no pull credential at all and the
# pod spec named none. Every other namespace that runs an estate image (dagster, agent-workforce, mcp,
# temporal) carries this same ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: research
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: ghcr-pull }
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: ghcr-pull, property: .dockerconfigjson }
