# Apprise API reads channel URLs from the vault. Each row names a channel and its URL(s).
# Example: notify-founder-telegram maps to the vault entry "notify-apprise-founder-telegram" which
# contains the Telegram bot token and chat ID in URL form (tgram://bottoken/chatid/).
# Slack and email are commented stubs for new integrations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-channels
  namespace: notify
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: notify-channels
    creationPolicy: Owner
    # The vault entry holds the two halves the bootstrapper verified as a pair (token, chat);
    # the template composes the one URL Apprise reads. No store ever holds a half-URL.
    # The key is a FILE name: Apprise stateful "simple" mode serves /notify/founder-telegram from
    # founder-telegram.cfg in APPRISE_CONFIG_DIR (vendor README), which is this secret's mount.
    template:
      data:
        founder-telegram.cfg: "tgram://{{ .token }}/{{ .chat }}/"
        # The noisy channel (founder, 2026-09-09: "new chanel noisy one"). founder-telegram is the
        # signal line -- the pinned GOAL and anything that needs a decision -- and it stayed quiet
        # only because reports were going nowhere instead. This is the second door: every finding,
        # every report, every measurement, posted whether or not it needs an answer. One bot, two
        # chats, one vault entry; Apprise serves each .cfg file as its own /notify/<name> endpoint
        # (stateful simple mode), so a second channel is a row here and never a second sender.
        # chat_noisy is absent until the channel exists, and ExternalSecret renders an empty
        # tgram:// URL rather than failing, so the guard below is what makes that loud.
        founder-noisy.cfg: "tgram://{{ .token }}/{{ .chat_noisy }}/"
  dataFrom:
    - extract: { key: notify-apprise-founder-telegram }
    # - secretKey: slack
    #   remoteRef: { key: notify-apprise-slack }
    # - secretKey: email
    #   remoteRef: { key: notify-apprise-email }
