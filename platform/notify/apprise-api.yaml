# Apprise API: publish once, deliver everywhere (R75). Named channels are stored in the vault as
# Apprise URLs. A POST to /notify/<channel>?title=X&body=Y fires to every backend the channel owns.
# No backend URL, key or shape leaks to the caller. The server emits traces to the central
# collector (LAW 50).
apiVersion: v1
kind: Service
metadata:
  name: apprise
  namespace: notify
  labels: { app.kubernetes.io/name: apprise, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: platform-notify }
spec:
  selector: { app.kubernetes.io/name: apprise }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise
  namespace: notify
  annotations:
    # A rotated vault key reaches the pod only if it rolls (LAW 50 circuit breaker).
    reloader.stakater.com/auto: "true"
  labels: { app.kubernetes.io/name: apprise, app.kubernetes.io/part-of: idp }
spec:
  replicas: 2   # One pod is one node event away from a 503
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: apprise }
  template:
    metadata:
      labels: { app.kubernetes.io/name: apprise, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      # Two replicas on one node are one replica. DoNotSchedule, not ScheduleAnyway.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: apprise }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apprise
          image: docker.io/caronc/apprise:1.5.3
          # Channels are files, never environment (Kyverno secrets-not-from-env-vars — and a shell
          # that expands a secret value can print it into the pod log; it did on 2026-09-02, which
          # is why no script touches these files at all). Stateful "simple" mode reads
          # {channel}.cfg straight from APPRISE_CONFIG_DIR (vendor README), so the vault-synced
          # mount IS the config store and the image's own entrypoint (supervisord: nginx on 8000 +
          # gunicorn) runs unmodified. Everything it writes at runtime sits under /tmp
          # (supervisord.conf, nginx.conf in the image) — the emptyDir below.
          env:
            - name: APPRISE_STATEFUL_MODE
              value: simple
            - name: APPRISE_CONFIG_DIR
              value: /run/secrets/notify
            - name: APPRISE_ATTACH_SIZE
              value: "0"  # attachments off: nothing sends files and /attach is read-only here
            # gunicorn's default worker count is 2 x CPUs + 1 of the node, not of the 50m
            # request, so on an OKE worker it booted 8+ workers that each import every plugin
            # and the container was OOMKilled (exit 137, 5s after start) against the 512Mi
            # limit on every restart (2026-09-05 12:33Z, restarts=5 on all three pods). Two
            # workers carry the estate's notification rate with headroom to spare.
            - name: APPRISE_WORKER_COUNT
              value: "2"
          ports:
            - { containerPort: 8000, name: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          resources:
            # 128Mi/256Mi OOMKilled every replica within seconds of start (measured 2026-09-04:
            # apprise-6f9bccdcf9-kgwg4, apprise-7bfc7c6756-2tkhf both OOMKilled, three ReplicaSets
            # from repeated redeploys chasing it). supervisord + nginx + gunicorn plus apprise's
            # eager plugin import need more headroom; request keeps the original 2:1 request:limit
            # ratio at the new ceiling.
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: channels, mountPath: /run/secrets/notify, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: channels
          secret: { secretName: notify-channels }
        - name: tmp
          emptyDir: {}
