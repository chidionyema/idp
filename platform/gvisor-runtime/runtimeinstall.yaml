# platform/gvisor-runtime/ -- the first RuntimeInstall CR (crew#892 CP4 next
# phase, goal b9217bea option c). It targets one canary node that carries the
# label sandbox.estate.io/gvisor=true (a label the platform's own node-bootstrap
# stamps on at most one node per fleet), and asks the operator to install runsc
# version 1.0.0 on it, one canary node at a time, with a 15-minute pause between
# canary verification and the rest of the rollout.
#
# Live: the operator source has landed and the controller image is in ghcr, so
# the switch `metadata.annotations.estate.estate.io/suspend` is now "false" for
# this canary. While true the controller's reconcile loop left the CR alone;
# the empirical-proof commit flips it and quotes the real `uname -r` probe.
#
# The verification spec probes `uname -r` on the probe pod; the success
# condition is the regex that catches a gvisor kernel suffix. The PR body for
# the empirical-proof commit will quote the actual `uname -r` line from this
# probe pod on the canary node.
#
# Why this CR is here and not in platform/nodesoftware-operator/: the CR is a
# request, not a definition. CRs land in the namespace of the thing they
# describe (the runtime they install); the controller and the CRD live in the
# platform's own directory. This split keeps the catalog clean (every Flux row
# describes one platform component) and lets a future product land its own
# RuntimeInstall under its own directory without touching platform/.
apiVersion: nodesoftware.estate.io/v1alpha1
kind: RuntimeInstall
metadata:
  name: runsc-canary
  namespace: nodesoftware-operator
  annotations:
    # Live: the operator image is in ghcr (main-6356 runsc handler, main-6325
    # controller) and the controller is Running. Canary node 10.0.148.221
    # carries sandbox.estate.io/gvisor=true. This is the empirical-proof
    # commit the design reserved: unsuspend so the operator installs runsc
    # and the probe quotes a real `uname -r` on the canary.
    estate.estate.io/suspend: "false"
    estate.estate.io/policy-summary: >-
      Asks the NodeSoftwareOperator to install runsc on one canary node
      (label sandbox.estate.io/gvisor=true). Canary of 1, pause 15m. The
      operator's reconcile loop is the only thing that touches the host;
      the lockdown blocks every other writer.
spec:
  runtime: runsc
  version: "1.0.0"
  selector:
    nodeSelector:
      matchLabels:
        sandbox.estate.io/gvisor: "true"
      matchExpressions:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
    tolerations:
      - key: nodesoftware.estate.io/canary
        operator: Exists
        effect: NoSchedule
  rolloutStrategy: ProgressiveCanary
  canaryReplicas: 1
  pauseDuration: 15m
  failurePolicy: FailClosed
  verification:
    probePod:
      spec:
        restartPolicy: Never
        runtimeClassName: runsc
        nodeSelector:
          kubernetes.io/hostname: <filled-by-controller>
        containers:
          - name: probe
            image: gcr.io/distroless/static:latest
            command: ["/bin/sh", "-c", "uname -r"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile: {type: RuntimeDefault}
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits:   {memory: 32Mi}
    successCondition: "[0-9.]+-gvisor-[0-9]+"
    timeoutSeconds: 300
