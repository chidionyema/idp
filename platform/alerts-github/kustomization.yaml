apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# github-app.yaml moved to platform/github-app-creds so it can be depended on
# independently of this Kustomization's health check (which watches the backstage
# catalogue Deployment and has no relation to the Secret's own readiness).
resources:
  - provider-github.yaml
  - alert.yaml
