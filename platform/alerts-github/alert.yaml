# Reconcile ledger (crew#325): a Kustomization or HelmRelease event becomes a repository_dispatch
# on idp, and .github/workflows/flux-events.yml turns it into a P0 issue and closes it again
# (provider-github.yaml). It used to carry EVERY event; see the exclusionList below for why and
# for what it costs -- "applied revision X" is no longer on this ledger, and `flux get
# kustomizations` or the estate MCP server is where a session reads it now.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: reconcile-ledger
  namespace: flux-system
spec:
  providerRef: { name: github-dispatch }
  eventSeverity: info
  # DEBOUNCE (founder 2026-09-07, ~/.claude/docs/founder/2026-09-07T1730Z-re-is-the-elite-plain-english-breakdown-of-c8b0f1fc.md:
  # "You are DDOSing your own repository ... Only fire events on failures"). eventSeverity stays
  # `info` because it has to: flux-events.yml closes a P0 on the info event "Health check passed",
  # and severity=error alone would open alarms that can never close. So the filter is a deny list
  # on the message, which is the safe direction -- an error shape nobody has seen yet still gets
  # through, where an inclusionList would silently drop it.
  #
  # Measured at the source, notification-controller over one hour, 2026-09-07 17:15Z
  # (kubectl -n flux-system logs deploy/notification-controller --since=60m | grep '"dispatching event"'):
  #   1224 events/hour = 29,376/day
  #    656  Reconciliation finished in N, next run in N   <- heartbeat, no state change
  #    430  Dependencies do not meet ready condition      <- a repeat of a failure that emits its own error
  #     74  <Kind>/<ns>/<name> configured                 <- drift churn, the same object reapplied
  #     47  Health check passed                           <- KEPT: this is what closes a P0
  #     ~17 health check failed / timeout waiting for     <- KEPT: this is what opens one
  # After these three patterns: 98 events/hour = 2,352/day, a 92% cut with nothing the workflow
  # acts on removed. Re-measure with the same command; the numbers below are the receipt.
  #
  # The third pattern only ever caught half of what it names, and the half it missed is the larger
  # one. Flux puts every object it applied in ONE event, newline-separated, so a Kustomization that
  # reapplies four NetworkPolicies emits a single four-line message. Go's regexp is not multi-line
  # by default: `^` is the start of the text and `$` is the end of it, so the anchored one-line
  # pattern never matched a message with a newline in it and every one of those events was
  # dispatched. Re-measured at the source 2026-09-07 20:20Z, one hour, same command as above:
  #   112 events/hour still reaching GitHub
  #    80  NetworkPolicy/otto-{gateway,golden}/... configured   <- multi-line drift, this leak
  #    58  Health check passed in N                             <- KEPT: this is what closes a P0
  #    ~15 health check failed / timeout waiting for            <- KEPT: this is what opens one
  # (80 + 58 exceeds 112 because the drift and the health line arrive on separate events.)
  #
  # The replacement anchors the WHOLE message with \A and \z and repeats the line, so an event is
  # dropped only when every line in it is drift. A message that is three reapplied objects and one
  # `health check failed` still gets through -- proved both ways in tests/test_flux_alert.py, which
  # is why the pattern is data the test reads out of this file and not a copy.
  exclusionList:
    - "^Reconciliation finished in "
    - "^Dependencies do not meet ready condition"
    - "\\A([A-Za-z]+/[^ ]+ (configured|created|unchanged|deleted)\\n?)+\\z"
  summary: "estate: reconcile ledger"
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    # crew#718 (founder 2026-08-30): a HelmRelease that fails reached nobody. The Telegram Alert
    # that used to carry these is suspended (platform/alerts/alert.yaml, it was firing into his
    # private chat), and this one only listened to Kustomizations, so the tailscale-operator
    # HelmRelease sat Failed -- taking Guacamole and Temporal down behind it -- with no event
    # anywhere a person reads. A HelmRelease is a workload; it belongs on the same ledger.
    - kind: HelmRelease
      name: "*"
      namespace: "*"
