apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: broken-workload
  namespace: flux-system
spec:
  providerRef: { name: telegram }
  eventSeverity: error
  summary: "estate: a reconciliation failed or a workload is not healthy"
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: chaos-mesh
    - kind: HelmRelease
      name: "*"
      namespace: observability
    - kind: HelmRelease
      name: "*"
      namespace: identity
    - kind: HelmRelease
      name: "*"
      namespace: edge
    - kind: HelmRelease
      name: "*"
      namespace: external-secrets
    - kind: HelmRelease
      name: "*"
      namespace: kyverno
    - kind: GitRepository
      name: "*"
      namespace: flux-system
