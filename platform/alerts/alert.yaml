apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: broken-workload
  namespace: flux-system
spec:
  # 2026-08-29, founder: "how do i get anything done with 6vnessages ? nost of then recurring for
  # past 5 days" -- suspended while flux-telegram.channel was his PRIVATE chat.
  # 2026-09-23, founder: "notification to telegram, not the noisy channel -- otto_mumu's channel
  # is where i want it" -- re-armed. The provider's channel comes from the flux-telegram Secret
  # (seeded from SEED_TELEGRAM_ALERTS_*), which names the alerts group, not the DM; if that value
  # is not the otto_mumu channel id yet, the fix is the Secret value, not this manifest.
  suspend: false
  providerRef: { name: telegram }
  eventSeverity: error
  summary: "estate: a reconciliation failed or a workload is not healthy"
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    # --- generated by bin/idp-alert-rows: every namespace that holds a HelmRelease ---
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: commerce
    - kind: HelmRelease
      name: "*"
      namespace: crossplane-system
    - kind: HelmRelease
      name: "*"
      namespace: dagster
    - kind: HelmRelease
      name: "*"
      namespace: demo-sandbox
    - kind: HelmRelease
      name: "*"
      namespace: edge
    - kind: HelmRelease
      name: "*"
      namespace: estate-db
    - kind: HelmRelease
      name: "*"
      namespace: event-bus
    - kind: HelmRelease
      name: "*"
      namespace: external-secrets
    - kind: HelmRelease
      name: "*"
      namespace: healing
    - kind: HelmRelease
      name: "*"
      namespace: hindsight
    - kind: HelmRelease
      name: "*"
      namespace: identity
    - kind: HelmRelease
      name: "*"
      namespace: keda
    - kind: HelmRelease
      name: "*"
      namespace: kyverno
    - kind: HelmRelease
      name: "*"
      namespace: metrics-server
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: observability
    - kind: HelmRelease
      name: "*"
      namespace: observability-agent
    - kind: HelmRelease
      name: "*"
      namespace: reloader
    - kind: HelmRelease
      name: "*"
      namespace: robusta
    - kind: HelmRelease
      name: "*"
      namespace: spire-mgmt
    - kind: HelmRelease
      name: "*"
      namespace: tailscale
    - kind: HelmRelease
      name: "*"
      namespace: temporal
    - kind: HelmRelease
      name: "*"
      namespace: trivy-system
    - kind: HelmRelease
      name: "*"
      namespace: weave-gitops
    # --- end generated ---
    - kind: GitRepository
      name: "*"
      namespace: flux-system
    # crew#406: the image roll. A registry scan that fails, a policy with no candidate or an
    # automation that cannot push sat frozen for a day with no page; these rows end that.
    - kind: ImageRepository
      name: "*"
      namespace: flux-system
    - kind: ImagePolicy
      name: "*"
      namespace: flux-system
    - kind: ImageUpdateAutomation
      name: "*"
      namespace: flux-system
