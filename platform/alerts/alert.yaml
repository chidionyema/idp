apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: broken-workload
  namespace: flux-system
spec:
  providerRef: { name: telegram }
  eventSeverity: error
  summary: "estate: a reconciliation failed or a workload is not healthy"
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    # --- generated by bin/idp-alert-rows: every namespace that holds a HelmRelease ---
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: chaos-mesh
    - kind: HelmRelease
      name: "*"
      namespace: edge
    - kind: HelmRelease
      name: "*"
      namespace: external-secrets
    - kind: HelmRelease
      name: "*"
      namespace: healing
    - kind: HelmRelease
      name: "*"
      namespace: hindsight
    - kind: HelmRelease
      name: "*"
      namespace: identity
    - kind: HelmRelease
      name: "*"
      namespace: keda
    - kind: HelmRelease
      name: "*"
      namespace: kyverno
    - kind: HelmRelease
      name: "*"
      namespace: metrics-server
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: observability
    - kind: HelmRelease
      name: "*"
      namespace: reloader
    - kind: HelmRelease
      name: "*"
      namespace: robusta
    - kind: HelmRelease
      name: "*"
      namespace: spire-mgmt
    - kind: HelmRelease
      name: "*"
      namespace: tailscale
    - kind: HelmRelease
      name: "*"
      namespace: temporal
    # --- end generated ---
    - kind: GitRepository
      name: "*"
      namespace: flux-system
    # crew#406: the image roll. A registry scan that fails, a policy with no candidate or an
    # automation that cannot push sat frozen for a day with no page; these rows end that.
    - kind: ImageRepository
      name: "*"
      namespace: flux-system
    - kind: ImagePolicy
      name: "*"
      namespace: flux-system
    - kind: ImageUpdateAutomation
      name: "*"
      namespace: flux-system
