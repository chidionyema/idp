# Alerts row (R35 scenario 4, crew#250): a broken workload reaches the founder's Telegram within
# ten minutes. Flux's own notification-controller does it: every Kustomization here has
# `wait: true` with health checks, so a workload that stalls turns its Kustomization not-ready,
# and that error event is what the Alert forwards. Incident: the Backstage catalogue sat in
# ImagePullBackOff for 17 hours on 2026-08-25 and nobody was told.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - provider.yaml
  - provider-github.yaml
  - alert.yaml
