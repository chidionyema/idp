# Secret rotation reaches the pod (crew#506 CP4 incident, 2026-08-27). The router exports its
# upstream keys once, at start (platform/llm/litellm.yaml command), so a key that ESO refreshes
# into the Secret `litellm-upstream` is invisible until the pod restarts. GROQ_API_KEY was written
# to the vault at 14:35Z (oke-check 33082342968: `keys set: ... GROQ_API_KEY`), `/v1/models`
# listed `groq`, and a completion still answered `Invalid API Key` — the pod was holding the
# pre-rotation Secret. No kube path exists from a laptop or a runner (LAW 46, R "infra is never
# Mac-bound"), so the restart must come from inside the cluster.
#
# Stakater Reloader is the mature tool for exactly this (LAW 43): it watches Secrets/ConfigMaps
# and rolls the workloads that opt in by annotation. Rejected: a Flux-side checksum annotation
# (only fires on a git change, a vault rotation is not one); an in-cluster CronJob running
# `kubectl rollout restart` (a script for a problem a proven tool solves, headline rule 1).
# Chart pinned; 2.2.16 was the latest on 2026-08-27
# (api.github.com/repos/stakater/Reloader/releases/latest).
#
# Scope: every namespace, and only the workloads that opt in. That pairing is the crew#684 fix.
# Until 2026-08-30 this row watched a hand-kept list of four namespaces, so the annotations on
# hermes-agent (idp#955), healthchecks and the portal sat in the manifests doing nothing at all --
# an annotation in an unwatched namespace is inert, and inert looks exactly like working. A list of
# namespaces here is the same defect as a list of Secret names in an annotation: a name someone has
# to remember to add. `watchGlobally: true` with `namespaces: []` deletes it (the chart's own
# values.yaml, 2.2.16: the scoped Role-per-namespace mode applies only "when non-empty (and
# watchGlobally is false)"). `autoReloadAll: false` keeps the opt-in: only a workload carrying
# `reloader.stakater.com/auto: "true"` is ever rolled, and platform/edge/require-auto-reload.yaml
# puts that annotation on every workload at admission. `reloadOnCreate: true` because a Secret that
# already existed when Reloader arrived never emits an update: the first GROQ_API_KEY sat in
# `litellm-upstream` while the pod kept answering `Invalid API Key` (crew#506 CP4, 2026-08-27).
# The price is one roll of each opted-in workload whenever Reloader itself restarts.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: reloader
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: reloader
spec:
  interval: 24h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  # Bounded remediation, and the last failure is remediated too, so a wedged release is not left
  # Failed for a person to untangle: helm-controller spends its retries once and then waits forever
  # for a spec change (tailscale-operator sat Failed blocking guacamole, idp#1027).
  # NOT `strategy: uninstall`, which idp#1027 set here and this row takes back out. Founder,
  # 2026-08-30 (~/.claude/docs/founder/2026-08-30T2332Z-yes-and-the-pattern-is-sound-but-two
  # -c08d08d9.md): uninstalling a wedged release turns a degraded service into a deleted one --
  # the PVCs, PDBs and Secrets the release made go with it -- and it erases the state that says
  # which invariant was violated, which is the state an incident is converted into a control from.
  # The default strategy is rollback: the previous revision is restored and the failed one is
  # readable. Repaving stays a hand after capture: `bin/idp-oke-break-glass helm-retry`.
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.16
      sourceRef:
        kind: HelmRepository
        name: stakater
  values:
    fullnameOverride: reloader
    reloader:
      autoReloadAll: false
      reloadOnCreate: true
      watchGlobally: true
      # Explicitly empty, not absent: the chart reads a non-empty list as scoped mode and builds a
      # Role per named namespace instead of the ClusterRole global mode needs (chart 2.2.16
      # values.yaml, `namespaces`). One watcher, every namespace, no list to keep in step.
      namespaces: []
      readOnlyRootFileSystem: true
      deployment:
        # the estate policy set (prospector-main/deploy/k8s/policies) refused the chart defaults on
        # disallow-privilege-escalation, drop-all-capabilities, disallow-capabilities-strict
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          readOnlyRootFilesystem: true
        # one 1.8-core node (platform/oci/main.tf); Kyverno refuses pods without limits
        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { cpu: 100m, memory: 128Mi }
