# The staging floor from the register (features.yaml `staging/namespace`: cpu 0.2, memory 1 GiB,
# storage 2 GiB, before the switch existed) is now summed from git; this quota is the ceiling, so a staging copy of a product
# can never crowd out production on the shared node. A request over 250m CPU still needs the
# capacity label (platform/edge/capacity-policy.yaml); the quota bounds the sum, the fence
# bounds each ask.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-ceiling
  namespace: staging
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    requests.storage: 2Gi
    services.loadbalancers: "0"   # reached over Tailscale only; no public door from staging
