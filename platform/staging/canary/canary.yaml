# The canary itself: one nginx that answers nothing anyone needs. No Service, no route, no
# probe row, no alert rule, no catalog entity of type service. `replicas` is deliberately absent:
# the scheduler owns that field (server-side apply, field manager canary-scheduler), so Flux
# never scales the window back mid-way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: staging
  labels:
    app: canary
    idp.platform/canary: "true"
  annotations:
    idp.platform/never-an-incident: "true"   # crew#656: nothing depends on it; no incident is ever about it
spec:
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
        idp.platform/canary: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: canary
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine   # the same pinned image platform/edge/status-page.yaml runs
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          # crew#656: admission (upstream require-probes, pinned in prospector
          # deploy/k8s/policies/kustomization.yaml) refuses a container with no liveness and no
          # readiness probe, and the canary is a workload like any other -- the experiment is
          # about what the estate REPORTS, not about escaping its own admission rules.
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
