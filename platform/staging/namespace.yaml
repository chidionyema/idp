# crew#584 CP-H (founder 2026-08-29 01:55Z): a staging area on the one cluster. It is a namespace,
# not a node, so every profile has it, the lean shop included (platform/features/features.yaml,
# feature `staging`). The label admits mirrord agents here and nowhere else
# (platform/edge/dev-loop-policy.yaml), so a laptop can attach to a staging pod and never a
# production one. Reached over Tailscale; no public LoadBalancer is created in this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    idp.platform/dev-loop: allowed
    idp.platform/tier: staging
  annotations:
    # Never garbage-collected by Flux: the namespace stays with everything in it if the row
    # moves or is dropped from git (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
