# crew#539 row 7 (founder, 2026-08-27: "intercept K8s crash logs and wire them into Telegram
# before the evidence vanishes"). Robusta (LAW 43, robusta-dev/robusta, MIT) watches the API
# server for CrashLoopBackOff, OOMKilled, ImagePullBackOff, Pending and job failures, and its
# built-in playbooks post the pod's last logs and events to the sink below. Its bundled
# kube-prometheus-stack stays off: crew#539 row 1 owns the one Prometheus; Robusta will read
# that Alertmanager once it exists. No Robusta SaaS account: no robusta_sink, no telemetry.
#
# Secrets: the sink's bot token and chat id are `{{ env.X }}` references resolved by the runner
# from env vars fed by a secretKeyRef (docs.robusta.dev "Managing Secrets";
# src/robusta/core/sinks/sink_base_params.py env_values_validation). Nothing secret is a value.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: robusta
  namespace: robusta
spec:
  interval: 24h
  url: https://robusta-charts.storage.googleapis.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: robusta
  namespace: robusta
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: robusta
      version: 0.48.0
      sourceRef:
        kind: HelmRepository
        name: robusta
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    clusterName: oke
    enablePrometheusStack: false
    # HolmesGPT, the chart's own investigator. K8sGPT says a configuration is broken; Holmes pulls the
    # pod's logs and events and says why. It is a subchart of the chart already installed here, so it
    # needs no second namespace, no second ServiceAccount and no second Helm release -- the usual advice
    # to `helm install robusta/holmes` into its own namespace would be a second copy of what is already
    # running. Its brain is the estate's own router, so no log line leaves the cluster.
    enableHolmesGPT: true
    globalConfig:
      # The investigator reads the estate's own Prometheus. Measured 2026-09-05: service kps-prometheus
      # in namespace monitoring, port 9090.
      prometheus_url: http://kps-prometheus.monitoring.svc:9090
    holmes:
      # require-registry-host: every image names its registry, so no pull can be silently redirected by
      # a daemon's default. The subchart's default is the bare "robustadev", the same reason
      # runner.image.registry above is spelled out.
      registry: docker.io/robustadev
      # The one Secret, mounted whole with envFrom; `envRef:` below reads it by env-var name.
      extraEnvVarsSecrets: [holmes-llm]
      modelList:
        minimax:
          # `openai/` is the protocol, not the vendor: LiteLLM speaks the OpenAI wire format, so Holmes
          # talks to the estate's router exactly as it would to OpenAI, and the router decides which
          # vendor actually answers. Changing lane is a one-word change here (platform/llm/config.yaml
          # declares minimax, gemini, deepseek, fast, ollama and the rest).
          model: openai/minimax
          api_base: http://litellm.llm.svc:4000/v1
          api_key: envRef:LITELLM_API_KEY
      toolsets:
        kubernetes/core: { enabled: true }
        kubernetes/logs: { enabled: true }
        prometheus/metrics: { enabled: true }
        robusta: { enabled: true }
        connectivity_check: { enabled: true }
        skills: { enabled: true }
        # Off, deliberately, and both are on by default in the chart.
        #  - `bash` hands the model a shell inside the cluster with an "extended" allowlist. An
        #    investigator reads; it does not run commands (LAW 21).
        #  - `internet` fetches arbitrary URLs. The point of running the model through our own router is
        #    that nothing about this estate leaves it, and a browsing tool undoes that in one call.
        bash: { enabled: false }
        internet: { enabled: false }
      resources:
        requests: { cpu: 100m, memory: 1Gi }
        limits: { memory: 1Gi }
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # readOnlyRootFilesystem is NOT set here and must not be: the chart hardcodes it true on the
      # container and merges this block after it, so setting it again renders a duplicate mapping key
      # and the manifest stops being YAML. The chart also mounts its own writable emptyDir at /tmp for
      # exactly this reason (charts/holmes/templates/holmes.yaml, "Required for OpenShift restricted
      # SCC and other security-hardened environments that enforce read-only root filesystems").
      containerSecurityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        capabilities: { drop: [ALL] }
        seccompProfile: { type: RuntimeDefault }
    # crew#539, 2026-08-28: run 33162263652 (`bin/idp-oke-rebuild --break-glass`) showed
    # robusta-forwarder and robusta-runner stuck `ImageInspectError`/`Init:ImageInspectError`;
    # the pod event was `InspectFailed: short name mode is enforcing, but image name
    # robustadev/kubewatch:v2.16.1 returns ambiguous list` (and robusta-runner:0.48.0 the
    # same). The chart's templates (forwarder.yaml:49, runner.yaml:78/95) render
    # `{{ .Values.image.registry }}/{{ .Values.kubewatch|runner.imageName }}` — the default
    # `image.registry: robustadev` (chart values.yaml:639) has no registry host, so it is an
    # unqualified short name. The node's container runtime has short-name resolution set to
    # enforcing with more than one unqualified-search registry configured, and containers/image
    # refuses to guess between them (github.com/containers/image, short-name resolution). Every
    # other HelmRelease in this estate that names an image gives it a full host
    # (`platform/llm/litellm.yaml`: `ghcr.io/berriai/litellm-database`); this one line brings
    # robusta to the same shape instead of a per-node runtime config change (LAW 23).
    image:
      registry: docker.io/robustadev
    runner:
      sendAdditionalTelemetry: false
      hardenedFs: true
      # Receipt 33128543299 (2026-08-28 00:09Z): Kyverno refused robusta-runner and robusta-forwarder
      # (drop ALL, runAsNonRoot, seccomp, probes, ro rootfs). The image has no USER line, so the pod
      # pins uid 1000 and HOME leaves /root (the chart's /root/.cache mount sits under a 0700 dir).
      securityContext:
        pod: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
        container:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          capabilities: { drop: [ALL] }
          seccompProfile: { type: RuntimeDefault }
      additional_env_vars:
        - { name: HOME, value: /tmp }
        - name: TELEGRAM_BOT_TOKEN
          valueFrom: { secretKeyRef: { name: robusta-telegram, key: token } }
        - name: TELEGRAM_CHAT_ID
          valueFrom: { secretKeyRef: { name: robusta-telegram, key: channel } }
      # The chart asks 250m / 1 Gi; the pool this lands on was CPU-starved (2026-08-27).
      resources:
        requests: { cpu: 50m, memory: 512Mi }
        limits: { cpu: 100m, memory: 512Mi }
    kubewatch:
      securityContext:
        pod: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
        container:
          allowPrivilegeEscalation: false
          privileged: false
          runAsUser: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
          seccompProfile: { type: RuntimeDefault }
      resources:
        requests: { cpu: 20m, memory: 128Mi }
        limits: { cpu: 20m, memory: 128Mi }
    sinksConfig:
      - telegram_sink:
          name: telegram
          bot_token: "{{ env.TELEGRAM_BOT_TOKEN }}"
          chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
          send_files: true
    # crew#539 CP11. Only the built-in trigger and enrichers (docs.robusta.dev playbook-reference):
    # a CrashLoopBackOff posts the previous container's log and the pod's last events, so the
    # evidence is in Telegram before the pod is recycled. The chart's built-in
    # report_crash_loop (log only, first restart) stays: overriding builtinPlaybooks would drop
    # the OOM/ImagePull/Pending rows too. This one fires at the second restart with the events.
    # Stuck-Terminating force-delete is NOT here: Robusta has no built-in for it (searched
    # playbooks/robusta_playbooks and docs, 2026-08-27); writing a custom Python action would
    # be a script for the class of thing this chart exists to do (headline rule 1). Recorded
    # on crew#539 as the CP11 gap; the descheduler (platform/healing) owns stuck pods today.
    customPlaybooks:
      - triggers:
          - on_pod_crash_loop:
              restart_reason: CrashLoopBackOff
              restart_count: 2
              rate_limit: 3600
        actions:
          - logs_enricher:
              previous: true
          - pod_events_enricher:
              max_events: 8
              included_types: [Warning, Normal]
        sinks: [telegram]
  # The chart has no probe values and gives the hardenedFs init container no securityContext.
  # kubewatch serves /metrics on :2112 unconditionally (pkg/client/run.go); the runner serves
  # /healthz on :5000 (src/robusta/runner/web.py).
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
          - target: { kind: Deployment, name: robusta-forwarder }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: robusta-forwarder }
              spec:
                template:
                  spec:
                    containers:
                      - name: kubewatch
                        readinessProbe: { httpGet: { path: /metrics, port: 2112 }, periodSeconds: 15 }
                        livenessProbe: { httpGet: { path: /metrics, port: 2112 }, periodSeconds: 30, failureThreshold: 5 }
          - target: { kind: Deployment, name: robusta-runner }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: robusta-runner }
              spec:
                template:
                  spec:
                    initContainers:
                      - name: setup-venv
                        # crew#570 CP1, proved 2026-08-28T12:46Z (oke-check 33172282641; the
                        # earlier sighting is diagnose 33172481714). This command is the chart's
                        # own (0.48.0 templates/runner.yaml:79-84) with a single flag changed, and
                        # the flag is the whole incident. `cp -a` is `-dR --preserve=all`, so it
                        # utimensat()s the destination directory. `fsGroup: 1000` above makes the
                        # kubelet chown the venv-lib-volume emptyDir to root:1000 0775 --
                        # group-writable, but owner still uid 0. utimensat with explicit times
                        # needs the owner or CAP_FOWNER; this container is uid 1000 with
                        # `drop: [ALL]`, so it is neither. The kubelet logged exactly one line,
                        # and only ever under `--previous`:
                        #   cp: preserving times for '/venv-writable/.': Operation not permitted
                        # cp exited non-zero, the init container crash-looped across four pods,
                        # the runner never started, HelmRelease/robusta never went Ready, and
                        # monitoring -> monitoring-rules -> chaos sat behind it.
                        #
                        # `-dR`, not `-R`: `-d` is what keeps a symlink a symlink. Plain `-R`
                        # dereferences, so every symlink in site-packages would be copied as a
                        # full second copy of its target. The timestamps and ownership `-dR`
                        # drops are the two attributes nothing downstream reads (Python recompiles
                        # a .pyc whose source mtime moved, into this same writable volume).
                        # FOWNER is deliberately NOT added back: restoring a capability to satisfy
                        # a flag would trade this estate's restricted-PSS posture for a copy
                        # attribute, and the flag is the thing that is wrong.
                        # `-dR` is spelled without `--preserve=` so it holds on busybox cp too.
                        command:
                          - sh
                          - -c
                          - >
                            SRC="/venv/lib/python$(python -V | cut -d' ' -f2 | cut -d. -f1,2)/site-packages" &&
                            cp -dR "${SRC}/." /venv-writable/
                        resources:
                          requests: { cpu: 50m, memory: 128Mi }
                          limits: { cpu: 200m, memory: 256Mi }
                        securityContext:
                          allowPrivilegeEscalation: false
                          runAsNonRoot: true
                          readOnlyRootFilesystem: true
                          capabilities: { drop: [ALL] }
                          seccompProfile: { type: RuntimeDefault }
                    containers:
                      - name: runner
                        readinessProbe: { httpGet: { path: /healthz, port: 5000 }, periodSeconds: 15 }
                        livenessProbe: { httpGet: { path: /healthz, port: 5000 }, initialDelaySeconds: 60, periodSeconds: 30, failureThreshold: 5 }
                        # crew#539, 2026-08-28: chart 0.48.0 marks three secret references
                        # `optional: true`, and `no-optional-secret-references` (the 2026-08-24
                        # incident written as a rule) refuses every one. Admission denied the
                        # upgrade, the release went Failed, and Flux could not remediate it
                        # ("missing target release for rollback"), which held monitoring and
                        # monitoring-rules down. The rule is right, so nothing is excused here:
                        # the two secrets the chart itself renders are declared required, and
                        # the third is not a secret at all.
                        envFrom:
                          - secretRef: { name: robusta-runner-secret }
                    volumes:
                      # The chart renders robusta-playbooks-config-secret, so it is required.
                      - name: playbooks-config-secret
                        secret: { secretName: robusta-playbooks-config-secret, optional: null }
                      # robusta-auth-config-secret is rendered by nothing in this estate and
                      # created by nothing: the Robusta UI is off (enableHolmesGPT false, the
                      # only sink is telegram). Today the kubelet mounts an empty directory at
                      # /etc/robusta/auth because the reference is optional; an emptyDir mounts
                      # the same empty directory, and refers to no secret to be optional about.
                      - name: auth-config-secret
                        secret: null
                        emptyDir: {}
