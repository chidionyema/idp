# The Telegram bot and home channel Robusta posts to: the same vault entry the Flux alerts
# Provider reads (`flux-telegram`, keys token and channel), through the one ClusterSecretStore.
# No literal names a bot or a chat (LAW 46); the runner reads both as env vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: robusta-telegram
  namespace: robusta
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: robusta-telegram, creationPolicy: Owner }
  dataFrom:
    - extract: { key: flux-telegram }
---
# HolmesGPT's model credential. Key name LITELLM_API_KEY because the Holmes chart mounts this whole
# Secret with envFrom and the `envRef:` sugar in modelList reads it by env-var name, so the key must be
# a POSIX env var name (charts/holmes/templates/validate.yaml refuses anything else). The value is a
# LiteLLM virtual key, never a vendor key, minted by .github/workflows/vault-seed.yml -f entry=holmes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-llm
  namespace: robusta
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: holmes-llm, creationPolicy: Owner }
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef: { key: holmes, property: key }
