# crew#841: the bridge's identity, carried from the vault into flux-system so Flux can substitute
# it into the ClusterRoleBinding that trusts it (platform/rbac/bridge.yaml).
#
# Why this is its own Flux Kustomization rather than living beside the binding: the binding's own
# reconcile substitutes from this Secret, so a Kustomization that shipped both could never apply
# the first one -- substitution runs before apply and would fail with the Secret it is about to
# create still missing. Flux's answer to that is dependsOn, and dependsOn needs two of them.
#
# The value is an instance OCID: an identifier, not a credential. It travels this way because
# terraform is what knows it and the cluster is what needs it, and every rebuild changes it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bridge-identity
  namespace: flux-system
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: bridge-identity, creationPolicy: Owner }
  data:
    - secretKey: BRIDGE_INSTANCE_OCID
      remoteRef: { key: bridge-instance-ocid }
