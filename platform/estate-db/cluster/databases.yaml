# One database per consumer, named the way that consumer already names it, so nothing in the
# application changes when its address does. CloudNativePG creates and owns these; a Database
# resource removed from git leaves the data alone (ensure: present never drops).
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: backstage
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: backstage
  owner: backstage
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hc
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: hc
  owner: hc
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hindsight
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: hindsight
  owner: hindsight
  ensure: present
  # The schema is named here, and that is the whole point of the line. The copy Job had dropped
  # schema public and taken both extensions with it; CloudNativePG did not put them back, because
  # its Database controller only reconciles when .metadata.generation moves, and an annotation does
  # not move it -- status still read observedGeneration 1, applied: true, while `select extname from
  # pg_extension` in the database returned plpgsql alone (measured 2026-09-04). Only a change to the
  # spec makes the controller issue CREATE EXTENSION IF NOT EXISTS again, and the role cannot do it
  # itself because pgvector is not a trusted extension. `schema: public` is where both already live.
  extensions:
    - name: vector
      ensure: present
      schema: public
    - name: pg_trgm
      ensure: present
      schema: public
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: superset
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: superset
  owner: superset
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: litellm
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: litellm
  owner: litellm
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: temporal
  owner: temporal
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: temporal-visibility
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: temporal_visibility
  owner: temporal
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: guacamole
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: guacamole
  owner: guacamole
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: otto-gateway
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: otto_gateway
  owner: otto_gateway
  ensure: present
  # Otto's fact store is a pgvector table (hermes-v2 otto/memory/migrations/0001_facts_core.sql).
  # pgvector is not a trusted extension, so `otto_gateway` cannot CREATE EXTENSION it however the
  # role is granted -- only a superuser can, which is exactly why the hindsight Database above
  # carries the same three lines. The operator issues the CREATE; the migration's own
  # `CREATE EXTENSION IF NOT EXISTS vector` then finds it present and does nothing, which is a
  # notice rather than a permission error. Without this the migration Job fails on its first
  # statement and the read path stays empty.
  extensions:
    - name: vector
      ensure: present
      schema: public
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dagster
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: dagster
  owner: dagster
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
