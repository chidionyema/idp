# One database per consumer, named the way that consumer already names it, so nothing in the
# application changes when its address does. CloudNativePG creates and owns these; a Database
# resource removed from git leaves the data alone (ensure: present never drops).
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: backstage
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: backstage
  owner: backstage
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hc
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: hc
  owner: hc
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hindsight
  namespace: estate-db
spec:
  cluster:
    name: estate
  name: hindsight
  owner: hindsight
  ensure: present
  # The schema is named here, and that is the whole point of the line. The copy Job had dropped
  # schema public and taken both extensions with it; CloudNativePG did not put them back, because
  # its Database controller only reconciles when .metadata.generation moves, and an annotation does
  # not move it -- status still read observedGeneration 1, applied: true, while `select extname from
  # pg_extension` in the database returned plpgsql alone (measured 2026-09-04). Only a change to the
  # spec makes the controller issue CREATE EXTENSION IF NOT EXISTS again, and the role cannot do it
  # itself because pgvector is not a trusted extension. `schema: public` is where both already live.
  extensions:
    - name: vector
      ensure: present
      schema: public
    - name: pg_trgm
      ensure: present
      schema: public
---
