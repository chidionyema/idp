# One database per consumer, declared. This is the whole reason for an operator rather than a
# StatefulSet: onboarding the eleventh consumer is a block in this file, not another server.
#
# Nothing is repointed by this file. Every consumer still talks to its own Postgres until the
# migration pass moves it; these databases start empty and wait.
# the service catalogue and the portal
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: backstage
  namespace: estate-db
spec:
  cluster: { name: estate }
  name: backstage
  owner: backstage
  ensure: present
---
# the scheduler's run and event storage
apiVersion: postgresql.cnpg.io/v1
