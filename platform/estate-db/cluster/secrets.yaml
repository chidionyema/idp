# Eleven credentials, none of them typed, pasted or seen by a person. They are fields of the
# single vault entry `estate-db`, born by bin/idp-estate-seed (R52: one root per provider, code
# mints the rest). CNPG reads each as a basic-auth Secret and sets the role's password to it,
# so the database and the consumer can never disagree about a password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-db-superuser
  namespace: estate-db
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: estate-db-superuser
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "postgres"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: estate-db, property: superuser-password }
