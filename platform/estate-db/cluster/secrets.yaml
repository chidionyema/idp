---
# The read side. Its password is minted by bin/idp-estate-seed into estate-db, and the same
# generator copies it into prospector-engine-env, so the cluster and the consumer hold one
# value and nobody types either copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-db-role-research-reader
  namespace: estate-db
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: estate-db-role-research-reader
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "research_reader"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: estate-db, property: research-reader-password }
---
# The money layer's role password, read from the entry Terraform already writes for Lago itself
# (platform/oci/commerce.tf, commerce-lago-credentials.POSTGRES_PASSWORD). That field used to be
# mounted by commerce's own StatefulSet; the StatefulSet is gone and the field stays, because it
# is what keeps the role and the databaseUrl in that same entry holding one value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-db-role-lago
  namespace: estate-db
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: estate-db-role-lago
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "lago"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: commerce-lago-credentials, property: POSTGRES_PASSWORD }
