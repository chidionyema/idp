  name: estate-db-dagster
  namespace: dagster
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: estate-db-dagster
    creationPolicy: Owner
  data:
