# Every password this cluster uses, and not one of them is typed, pasted or seen by a person.
#
# The superuser is minted by bin/idp-estate-seed into the estate-db entry. Every other role
# reads the vault entry its own consumer already reads, so the cluster and the application hold
# one value between them and can never drift apart. Three consumers -- dagster, langfuse and
# research -- had no vault entry of their own (two carried a password their Helm chart
# generated, one is new), so those three are fields of estate-db as well, and each of the three
# is also published into its own namespace because its chart reads the password from there.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-db-superuser
  namespace: estate-db
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: estate-db-superuser
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "postgres"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: estate-db, property: superuser-password }
