# The password each copy Job reads, published into the namespace the Job runs in.
#
# platform/estate-db/cluster/secrets.yaml publishes the same passwords into estate-db, because
# that is where CloudNativePG reads them to mint the roles. A Job cannot mount a Secret from
# another namespace, so eight of the ten copy Jobs mounted a name that existed only in estate-db
# and sat in ContainerCreating with "MountVolume.SetUp failed ... secret not found" -- measured
# 2026-09-04, 50 minutes, which is why estate-db-migrate never went Ready and every consumer
# Kustomization behind it (backstage, dagster, llm, observability, research-engine and the rest)
# stayed blocked. dagster and langfuse were the two that worked, because each already had its
# password published into its own namespace for its Helm chart to read.
#
# Every entry below reads the same vault key and property as its estate-db twin, so the cluster,
# the application and the copy Job hold one value between them and cannot drift.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-db-role-backstage
  namespace: backstage
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: estate-db-role-backstage
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "backstage"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: backstage-env, property: POSTGRES_PASSWORD }
