                  PGPASSWORD="$(cat /old/POSTGRES_PASSWORD)" pg_dump -h otto-gateway-db -U otto_gateway -d otto_gateway \
                          --no-owner --no-privileges --exclude-extension=vector --exclude-extension=pg_trgm \
                          -Fc -f /tmp/db.dump
                  PGPASSWORD="$(cat /new/password)"; export PGPASSWORD
                  psql -h estate-rw.estate-db.svc.cluster.local -U otto_gateway -d otto_gateway -v ON_ERROR_STOP=1 \
                       -c 'drop schema if exists public cascade' -c 'create schema public'
                  pg_restore -h estate-rw.estate-db.svc.cluster.local -U otto_gateway -d otto_gateway --no-owner --no-privileges --exit-on-error /tmp/db.dump
                  psql -h estate-rw.estate-db.svc.cluster.local -U otto_gateway -d otto_gateway -v ON_ERROR_STOP=1 \
