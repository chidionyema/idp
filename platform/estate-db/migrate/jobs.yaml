                  echo "dagster was copied on an earlier run; leaving it alone"
                else
                  echo "copying test from dagster-postgresql into dagster on the estate cluster"
                  PGPASSWORD="$(cat /old/postgresql-password)" pg_dump -h dagster-postgresql -U test -d test \
                          --no-owner --no-privileges --exclude-extension=vector --exclude-extension=pg_trgm \
                          -Fc -f /tmp/db.dump
                  PGPASSWORD="$(cat /new/postgresql-password)"; export PGPASSWORD
                  psql -h estate-rw.estate-db.svc.cluster.local -U dagster -d dagster -v ON_ERROR_STOP=1 \
                       -c 'drop schema if exists public cascade' -c 'create schema public'
                  pg_restore -h estate-rw.estate-db.svc.cluster.local -U dagster -d dagster --no-owner --no-privileges --exit-on-error /tmp/db.dump
                  psql -h estate-rw.estate-db.svc.cluster.local -U dagster -d dagster -v ON_ERROR_STOP=1 \
                       -c 'create table estate_db_migration (copied_at timestamptz not null default now())' \
                       -c 'insert into estate_db_migration default values'
                  unset PGPASSWORD
                  rm -f /tmp/db.dump
                  echo "dagster is on the estate cluster"
                fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: old, mountPath: /old, readOnly: true }
            - { name: new, mountPath: /new, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: old
          # optional, and this is the whole point of the -r3 rename. The script below already
          # treats a missing old server as "nothing to copy" and exits 0, but that branch is
          # inside the container and a required Secret volume is resolved by the kubelet before
          # the container ever starts. Measured 2026-09-04: dagster's bundled PostgreSQL is gone
          # -- no `dagster-postgresql` Service, no StatefulSet, and no `dagster-postgresql-secret`
          # in the namespace -- so estate-db-copy-dagster-r2 sat in ContainerCreating for 148
          # minutes on `MountVolume.SetUp failed for volume "old" : secret
          # "dagster-postgresql-secret" not found`, held estate-db-migrate in Reconciling, and
          # through the dependency chain held otto-gateway at Ready=False on a revision from
          # before the one-door work merged. An old end that no longer exists must not be able to
          # stop the Job from starting.
          secret: { secretName: dagster-postgresql-secret, optional: true }
        - name: new
          secret: { secretName: estate-db-dagster }
        - name: tmp
          emptyDir: {}
---
