# The copy. One Job per server being retired, each one run once and never again.
#
# Every Job runs in the namespace of the server it is emptying and reads that server's own
# Secret for the old end, and the estate role's Secret for the new one. For eight of the ten
# those are the same password, because the role on the estate cluster kept the credential its
# consumer already held; dagster and langfuse are the exceptions, and there the Job reads one
# password and writes another.
#
# Every Job runs the PostgreSQL 18 image the estate cluster itself runs. That matters: langfuse
# was already on PostgreSQL 18 and pg_dump refuses a server newer than itself, so an older
# client could not have read it. One image reads the 14, the 17s and the 18 alike.
#
# The guard is a marker table, not an empty-database check, and the difference matters. Several
# of these applications create their own schema when they start, so between the moment the
# application is pointed at the estate cluster and the moment this Job runs, the new database
# may already hold empty tables the application made. An emptiness check would see those and
# decide the copy had already happened, leaving the real data behind on the old volume. So the
# Job instead drops what is there, restores the dump over it, and writes estate_db_migration.
# On any later run it finds that table and does nothing at all.
#
# Writes the application made during that window are discarded, which is the correct outcome:
# they were made against a blank schema and the old server holds the truth.
#
# Nothing here deletes an old server. Flux does that, and only after this Kustomization reports
# Ready -- every consumer's Kustomization waits on estate-db-migrate in clusters/oke/platform.yaml.
# A Job that cannot find its old server at all exits clean rather than failing, so a cluster
# rebuilt from scratch, where the old servers never existed, is not deadlocked by this file.
# That escape hatch only works if the old end's Secret volume is marked `optional: true`: the
# kubelet resolves volumes before the container starts, so a required Secret that no longer
# exists stops the Job in ContainerCreating and the `exit 0` branch is never reached. Every
# `old` volume added from now on carries `optional: true`. The nine Jobs already Complete cannot
# be corrected in place -- a Job's pod template is immutable -- so they carry the trap until they
# are next renamed, at which point the new name must carry the flag.
#
# A Job is immutable, so a Job that failed or stalled for a reason outside itself can only be
# re-run under a new name; every name here carries an -r2 suffix for that reason. dagster and
# langfuse failed on 2026-09-04 with 'password authentication failed', before their passwords had
# been minted. The other eight never started at all: each mounted estate-db-role-<name>, which
# platform/estate-db/cluster/secrets.yaml publishes into estate-db and not into the namespace the
# Job runs in, so all eight sat in ContainerCreating on "MountVolume.SetUp failed ... secret not
# found" for 50 minutes and estate-db-migrate never reported Ready. role-secrets.yaml now
# publishes each password into its Job's own namespace. The marker table still makes a second
# copy a no-op if any of them had in fact finished.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: estate-db-copy-backstage-r2
  namespace: backstage
  labels:
    app.kubernetes.io/name: estate-db-copy-backstage-r2
    app.kubernetes.io/part-of: idp
    backstage.io/kubernetes-id: layer-estate-db
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estate-db-copy-backstage-r2
        app.kubernetes.io/part-of: idp
    spec:
      restartPolicy: Never
      priorityClassName: platform-batch
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: copy
          # The same image the estate cluster runs, so its pg_dump is never older than either end.
          image: ghcr.io/cloudnative-pg/postgresql:18.1-standard-bookworm
          command: ["/bin/sh", "-c"]
          args:
            - |
                set -eu
                # the server called postgres in its own namespace. If it is not there at all there is nothing to copy, and this Job
                # is finished rather than failed -- see the note at the top of this file.
                i=0
                while [ $i -lt 12 ]; do
                  getent hosts postgres >/dev/null 2>&1 && break
                  i=$((i + 1))
                  sleep 10
                done
                if ! getent hosts postgres >/dev/null 2>&1; then
                  echo "postgres does not resolve; there is no old server to empty"
                  exit 0
                fi
                if [ "$(PGPASSWORD="$(cat /new/password)" psql -h estate-rw.estate-db.svc.cluster.local -U backstage -d backstage -tAc "select to_regclass('public.estate_db_migration') is not null")" = t ]; then
                  echo "backstage was copied on an earlier run; leaving it alone"
                else
                  echo "copying backstage from postgres into backstage on the estate cluster"
                  PGPASSWORD="$(cat /old/POSTGRES_PASSWORD)" pg_dump -h postgres -U backstage -d backstage \
                          --no-owner --no-privileges --exclude-extension=vector --exclude-extension=pg_trgm \
                          -Fc -f /tmp/db.dump
                  PGPASSWORD="$(cat /new/password)"; export PGPASSWORD
                  psql -h estate-rw.estate-db.svc.cluster.local -U backstage -d backstage -v ON_ERROR_STOP=1 \
                       -c 'drop schema if exists public cascade' -c 'create schema public'
                  pg_restore -h estate-rw.estate-db.svc.cluster.local -U backstage -d backstage --no-owner --no-privileges --exit-on-error /tmp/db.dump
                  psql -h estate-rw.estate-db.svc.cluster.local -U backstage -d backstage -v ON_ERROR_STOP=1 \
                       -c 'create table estate_db_migration (copied_at timestamptz not null default now())' \
                       -c 'insert into estate_db_migration default values'
                  unset PGPASSWORD
                  rm -f /tmp/db.dump
                  echo "backstage is on the estate cluster"
                fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: old, mountPath: /old, readOnly: true }
            - { name: new, mountPath: /new, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: old
          secret: { secretName: backstage-env }
        - name: new
          secret: { secretName: estate-db-role-backstage }
        - name: tmp
          emptyDir: {}
---
