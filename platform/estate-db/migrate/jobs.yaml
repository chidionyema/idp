                # guacamole-db. If it is not there at all there is nothing to copy, and this Job
                # is finished rather than failed -- see the note at the top of this file.
                i=0
                while [ $i -lt 12 ]; do
                  getent hosts guacamole-db >/dev/null 2>&1 && break
