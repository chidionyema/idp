# The one Postgres password, from the estate vault entry `temporal-db` (written by
# .github/workflows/vault-seed.yml -f entry=temporal-db from SEED_TEMPORAL_DB_PASSWORD).
# Postgres reads it as a file; the chart reads the same Secret through existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: temporal-db, creationPolicy: Owner }
  dataFrom:
    - extract: { key: temporal-db }
