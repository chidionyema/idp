# Temporal's persistence. Same shape as platform/llm/postgres.yaml (crew#284): one StatefulSet,
# non-root, read-only root, password from a mounted Secret. Two databases: the chart's default
# store and its visibility store; the init script creates the second one on first boot only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-db-init
  namespace: temporal
data:
  visibility.sql: |
    CREATE DATABASE temporal_visibility OWNER temporal;
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-db
  namespace: temporal
  labels: { app.kubernetes.io/name: temporal-db, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-temporal }
spec:
  type: ClusterIP
  clusterIP: None
  selector: { app.kubernetes.io/name: temporal-db }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-db
  namespace: temporal
  labels: { app.kubernetes.io/name: temporal-db, app.kubernetes.io/part-of: idp }
spec:
  serviceName: temporal-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: temporal-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: temporal-db, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # postgres uid in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6-alpine
          env:
            - { name: POSTGRES_USER, value: temporal }
            - { name: POSTGRES_DB, value: temporal }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/temporal-db/password }
          ports:
            - { containerPort: 5432, name: pg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "temporal", "-d", "temporal"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "temporal", "-d", "temporal"] }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: secret, mountPath: /run/secrets/temporal-db, readOnly: true }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secret
          secret: { secretName: temporal-db }
        - name: init
          configMap: { name: temporal-db-init }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
