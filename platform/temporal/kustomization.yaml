apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: temporal
resources:
  - namespace.yaml
  - external-secret.yaml
  - temporal.yaml
  - pull-secret.yaml
  - worker.yaml
  - kini-finish.yaml
  - kini-state.yaml
images:
  # build-multiarch pushes ghcr.io/chidionyema/sovereign-worker:main-<run>-<sha> (crew#396 step 2).
  # The first main build after this file merges writes the tag; until then the Deployment cannot
  # pull and Flux reports it. image-automation-controller rewrites the newTag line from
  # ImagePolicy flux-system/sovereign-worker; the marker is how it finds the line.
  - name: idp/sovereign-worker
    newName: ghcr.io/chidionyema/sovereign-worker
    newTag: main-6271-68e544ca699f69d4f05a51d5f071ca6c1c90605b # {"$imagepolicy": "flux-system:sovereign-worker:tag"}

# WAVE 1 OF THE ROLL ONTO THE ENFORCING CNI.
#
# 10-calico.conflist sorts before 10-flannel.conflist in /etc/cni/net.d, so Calico wins the CNI
# race and any pod created from now on is wired by Calico and judged by the estate's 154
# NetworkPolicy objects. Pods created before that are still on flannel and judged by nothing.
# Measured 2026-09-08: 108 running pods on flannel, 39 on Calico. Every fence in the estate is
# decoration for the flannel half.
#
# The restart is this annotation, not a command. Changing its value changes the pod template, so
# Flux performs the rollout; nothing needs a token, a drain or a founder tap, and reverting the
# value reverts the roll. A drain was measured and refused: two nodes, 144 running pods, a
# 110-pod ceiling each, so one node's pods do not fit on the other and a third node is capacity
# we are not buying.
#
# Bump the value to roll these workloads again.
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sovereign-worker
        namespace: temporal
      spec:
        template:
          metadata:
            annotations:
              idp.internal/cni-generation: "2"
