# crew#396 (founder, 2026-08-26: "type 'Finish KINI', close the laptop, wake up to a green
# dashboard"). The estate's one workflow engine ran on the Mac (launchd/ai.estate.temporal.plist.tmpl,
# `temporal server start-dev` on a sqlite file), so it closed with the lid. This is the official
# Temporal Helm chart (temporalio/helm-charts, LAW 43), pinned, on the Postgres beside it.
# Helm hooks are off: Flux runs the schema and namespace Jobs as ordinary resources.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: temporal
  namespace: temporal
spec:
  interval: 24h
  url: https://go.temporal.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: temporal
spec:
  # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-temporal
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-temporal
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: temporal
      version: 1.6.0
      sourceRef:
        kind: HelmRepository
        name: temporal
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    # Chart 1.x carries no bundled store or metrics stack (the cassandra/mysql/postgresql/
    # elasticsearch/prometheus/grafana sub-charts were removed in 1.0.0; the chart's
    # validations.yaml refuses those keys). Persistence is the StatefulSet in postgres.yaml only.
    # crew#396: the node runtime enforces short-name mode and refused every chart image
    # (`temporalio/server:1.31.2 returns ambiguous list`); the registry is named here so the
    # chart never ships a short name. admintools is disabled but its image runs the schema
    # and namespace Jobs, so it is qualified too. Guard: tests/test_incident_crew284_*.
    admintools:
      enabled: false
      image: { repository: docker.io/temporalio/admin-tools }
    web:
      enabled: true
      image: { repository: docker.io/temporalio/ui }
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
      containerSecurityContext: &csc
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
        seccompProfile: { type: RuntimeDefault }
      additionalVolumes: [{ name: tmp, emptyDir: {} }]
      additionalVolumeMounts: [{ name: tmp, mountPath: /tmp }]
      securityContext: &psc
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
    schema:
      useHelmHooks: false
      containerSecurityContext: *csc
      securityContext: *psc
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
    server:
      replicaCount: 1
      image: { repository: docker.io/temporalio/server }
      securityContext: *psc
      # The image's entrypoint (dockerize) renders /etc/temporal/config/docker.yaml at start, so
      # that directory is an emptyDir under a read-only root (require-ro-rootfs).
      additionalVolumes:
        - { name: config-rendered, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
      additionalVolumeMounts:
        - { name: config-rendered, mountPath: /etc/temporal/config }
        - { name: tmp, mountPath: /tmp }
      config:
        logLevel: "info"
        numHistoryShards: 512
        persistence:
          defaultStore: default
          visibilityStore: visibility
          datastores:
            default:
              sql:
                pluginName: postgres12_pgx
                driverName: postgres12_pgx
                databaseName: temporal
                connectAddr: temporal-db.temporal.svc:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db
                secretKey: password
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h
            visibility:
              sql:
                pluginName: postgres12_pgx
                driverName: postgres12_pgx
                databaseName: temporal_visibility
                connectAddr: temporal-db.temporal.svc:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db
                secretKey: password
                maxConns: 10
                maxIdleConns: 10
                maxConnLifetime: 1h
        namespaces:
          create: true
          useHelmHooks: false
          namespace:
            - name: estate   # sovereign/config.py:167 TEMPORAL_NAMESPACE default
              retention: 7d
      frontend:
        containerSecurityContext: *csc
        resources: &svc
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
      history:
        containerSecurityContext: *csc
        resources: *svc
      matching:
        containerSecurityContext: *csc
        resources: *svc
      worker:
        containerSecurityContext: *csc
        resources: *svc
      internal-frontend: { enabled: false }
