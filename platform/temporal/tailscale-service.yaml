apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend-mesh
  namespace: temporal
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
  - port: 7233
    targetPort: 7233
    name: grpc-rpc
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: frontend
