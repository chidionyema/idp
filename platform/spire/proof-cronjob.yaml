# A workload that holds an SVID, on the cluster, every 15 minutes, with no hand.
# platform/spire/proof.yaml is the same fetch as a one-shot Job for `make spire-proof` on k3d; this
# CronJob is the Flux-managed copy for OKE. The cluster-state receipt (platform/state/cluster-state.yaml)
# lists every pod that mounts csi.spiffe.io under spiffe.csi_workloads, so this pod is the row that
# proves possession; the pod log carries the SPIFFE ID the agent issued.
# Restricted-PSA compliant, like everything else in the backstage namespace.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spiffe-proof
  namespace: backstage
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1200
      backoffLimit: 6   # the agent learns a new entry a few seconds after the pod starts; early attempts get "no identity issued"
      template:
        spec:
          # crew#227 CP4, receipt 2026-08-27T08:45:03Z: seven pods per Job failed "no identity issued" and
          # the agent logged registered=false at 08:40:42Z, the seventh backoff. The entry selector is
          # k8s:pod-uid, the agent syncs entries every 5 s, and `spire-agent api fetch` asks once
          # (cmd/spire-agent/cli/api/fetch_x509.go: one FetchX509SVID call, PermissionDenied on an empty
          # cache). With restartPolicy Never every retry is a new pod, so a new uid, so a new race it
          # loses. OnFailure restarts the container inside the same pod: the uid, and the entry the
          # controller-manager rendered for it, survive to the second attempt.
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: fetch
              image: ghcr.io/spiffe/spire-agent:1.15.3   # the same image the spire chart 0.30.1 runs
              imagePullPolicy: IfNotPresent
              command: ["/opt/spire/bin/spire-agent", "api", "fetch", "x509",
                        "-socketPath", "/spiffe-workload-api/spire-agent.sock", "-timeout", "60s"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              volumeMounts:
                - name: spiffe-workload-api
                  mountPath: /spiffe-workload-api
                  readOnly: true
                - name: tmp
                  mountPath: /tmp   # crew#458: writable /tmp under readOnlyRootFilesystem
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 16Mi }
            - name: spiffe-workload-api
              csi:
                driver: csi.spiffe.io
                readOnly: true
