# The receipt for agent identity: a workload in the catalogue's namespace, holding
# no secret, obtains a short-lived X.509 SVID from the SPIRE Workload API through
# the CSI-mounted socket. `make spire-proof` runs it and prints the SPIFFE ID.
# Restricted-PSA compliant, like everything else in that namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: spiffe-proof
  namespace: backstage
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6   # the agent learns a new entry a few seconds after the pod starts; early attempts get "no identity issued"
  template:
    spec:
      # crew#227 CP4, receipt 2026-08-27T08:45:03Z: seven pods per Job failed "no identity issued" and
      # the agent logged registered=false at 08:40:42Z, the seventh backoff. The entry selector is
      # k8s:pod-uid, the agent syncs entries every 5 s, and `spire-agent api fetch` asks once
      # (cmd/spire-agent/cli/api/fetch_x509.go: one FetchX509SVID call, PermissionDenied on an empty
      # cache). With restartPolicy Never every retry is a new pod, so a new uid, so a new race it
      # loses. OnFailure restarts the container inside the same pod: the uid, and the entry the
      # controller-manager rendered for it, survive to the second attempt.
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fetch
          image: ghcr.io/spiffe/spire-agent:1.15.3   # already on the node; the CLI is in it
          imagePullPolicy: IfNotPresent
          command: ["/opt/spire/bin/spire-agent", "api", "fetch", "x509",
                    "-socketPath", "/spiffe-workload-api/spire-agent.sock", "-timeout", "60s"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
