# SPIRE on the estate cluster — the fortress row "agent identity" (CP4).
#
# Chart: spiffe/helm-charts-hardened (the SPIFFE project's own, CNCF). It was
# deferred while the estate was one laptop with nothing to attest against; the
# k3d cluster changes that. The SPIRE Agent is attested by the SPIRE Server with
# the k8s_psat node attestor (a projected service-account token the API server
# signs), and workloads are attested by the k8s workload attestor (pod identity
# read from the kubelet). A pod gets a short-lived X.509 SVID from the Workload
# API socket without holding any secret. That is the property a buyer is asking
# about, and it is real here, not self-signed.
#
# Trust domain is a name, not a DNS zone. It appears in every SPIFFE ID:
#   spiffe://estate.internal/ns/backstage/sa/default
global:
  spire:
    clusterName: estate
    trustDomain: estate.internal
    namespaces:
      create: true

spire-server:
  # One replica; the k3d cluster is one node.
  replicaCount: 1
  # SVIDs are short-lived on purpose: an hour, so a stolen identity dies fast.
  caTTL: 24h
  defaultX509SvidTTL: 1h
  defaultJwtSvidTTL: 1h
  controllerManager:
    # Lease timings are 4x the chart default (15s/10s/2s). Measured 2026-08-24
    # 23:43: with the host swapping (6.5 GB of 8) k3s's sqlite took ~6 s per
    # write, the apiserver timed out lease PUTs, and the controller-manager's 2 s
    # retry loop became a write storm feeding the thing that starved it. One
    # replica on one node has no election to lose; a slow lease is harmless, a
    # tight one is an amplifier.
    leaderElection:
      leaseDuration: "60s"
      renewDeadline: "40s"
      retryPeriod: "10s"
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
    # Registers a SPIFFE ID for every pod automatically (ClusterSPIFFEID CRD),
    # so onboarding a workload is a label, not a manual `entry create`.
    identities:
      clusterSPIFFEIDs:
        default:
          enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

spire-agent:
  # Off the host network. Incident 2026-08-27 (crew#227 CP4, oke-check 33035070500): the chart
  # default is hostNetwork: true, the API server then defaults every containerPort to a hostPort,
  # and Kyverno's disallow-host-ports refused all eight spire-agent pods (FailedCreate). The
  # offline render in bin/idp-kyverno-render never sees that defaulting, so the exception could
  # not have listed it. The agent serves the Workload API on a hostPath socket, so the host
  # network buys nothing there.
  hostNetwork: false
  # Incident 2026-08-27 (crew#227 CP4, cluster-state receipt 07:00:02Z): with the agent off the
  # host network, every spiffe-proof pod failed with "workload attestation failed" although the
  # CSI socket was mounted and the ClusterSPIFFEID held 67 entries. The chart's kubeletAddress
  # default is "auto", which is 127.0.0.1:10250 outside OpenShift; inside a pod network that is
  # the agent itself, not the kubelet. hostip puts the node's status.hostIP in KUBELET_ADDR
  # (downward API) and the k8s workload attestor reads pods from the real kubelet. Verification
  # stays at the chart default (skip), so the IP needs no certificate name.
  kubeletAddress:
    mode: hostip
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# The CSI driver mounts the Workload API socket into pods; the OIDC discovery
# provider publishes JWKS for JWT-SVIDs. Neither is needed for the first proof.
spiffe-csi-driver:
  enabled: true
spiffe-oidc-discovery-provider:
  enabled: false
