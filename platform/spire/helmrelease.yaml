# Agent identity (crew#227 CP4, KINI spec 4.4). SPIRE from the SPIFFE project's own hardened
# charts, applied by Flux like every other platform row. Until 2026-08-27 SPIRE existed only on
# the laptop k3d cluster through `make spire-up`, which is a hand on a Mac (R "infra is never
# Mac-bound"); OKE had no identity issuer at all.
#
# Values are the one file platform/spire/values.yaml, mounted through the ConfigMap the
# kustomization generates, so a value is written once and `helm template` reads the same file
# the cluster does (tests/test_spire_row.py renders it that way).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: spire-mgmt
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: spiffe
  namespace: spire-mgmt
spec:
  interval: 24h
  url: https://spiffe.github.io/helm-charts-hardened/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire-crds
  namespace: spire-mgmt
spec:
  # Bounded remediation, and the last failure is remediated too, so a wedged release is not left
  # Failed for a person to untangle: helm-controller spends its retries once and then waits forever
  # for a spec change (tailscale-operator sat Failed blocking guacamole, idp#1027).
  # NOT `strategy: uninstall`, which idp#1027 set here and this row takes back out. Founder,
  # 2026-08-30 (~/.claude/docs/founder/2026-08-30T2332Z-yes-and-the-pattern-is-sound-but-two
  # -c08d08d9.md): uninstalling a wedged release turns a degraded service into a deleted one --
  # the PVCs, PDBs and Secrets the release made go with it -- and it erases the state that says
  # which invariant was violated, which is the state an incident is converted into a control from.
  # The default strategy is rollback: the previous revision is restored and the failed one is
  # readable. Repaving stays a hand after capture: `bin/idp-oke-break-glass helm-retry`.
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  interval: 10m
  chart:
    spec:
      chart: spire-crds
      version: 0.6.1
      sourceRef:
        kind: HelmRepository
        name: spiffe
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire-mgmt
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: spire-crds
  chart:
    spec:
      chart: spire
      version: 0.30.1   # app 1.15.3, the same the k3d proof ran (platform/spire/proof.yaml pins the agent image)
      sourceRef:
        kind: HelmRepository
        name: spiffe
  # remediateLastFailure. Incident 2026-08-27 (crew#227 CP4, oke-check 33038080419): the first install
  # exhausted its 3 retries while Kyverno refused the agent's hostPort, and the failed release kept its
  # DaemonSet. #308 removed the hostPort from the values, yet 24 minutes later (03:57:27Z) the same old
  # DaemonSet was still creating refused pods: a HelmRelease in Failed keeps the stale objects until
  # the last failure is remediated. With this flag the failed install is uninstalled and re-run from
  # the current values; tests/test_spire_row.py holds it.
  #
  # This is the ONE row in the estate that keeps install remediation, and it is deliberate, not an
  # oversight of the sweep that took `strategy: uninstall` back out of the other nine (founder,
  # 2026-08-30, c08d08d9.md: uninstalling a wedged release destroys the evidence an incident is
  # converted into a control from; reinstall stays a hand). It is kept because the flag here was
  # never set by that blueprint -- bc6dcfef (#312, 2026-08-27) set it for the opposite failure, a
  # release stuck in Failed whose stale DaemonSet went on creating refused pods for 24 minutes --
  # and because spire-crds and the SPIRE server hold no PVC, PDB or Secret of their own to lose:
  # the SVIDs are re-issued on restart. Anything with state keeps `retries: 3` alone.
  install:
    remediation: { retries: 3, remediateLastFailure: true }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  valuesFrom:
    - kind: ConfigMap
      name: spire-values
      valuesKey: values.yaml
