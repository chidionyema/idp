# The SPIRE install row. values.yaml is the only place a SPIRE value lives; the generator turns it
# into the ConfigMap the HelmRelease reads (valuesFrom), so the file and the cluster cannot drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No kustomization-wide namespace: the PolicyException must stay in `kyverno`, the one namespace
# Kyverno reads exceptions from (crew#325 incident); the generator names its own namespace below.
resources:
  - helmrelease.yaml
  - exception.yaml
  - proof-cronjob.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: spire-values
    namespace: spire-mgmt
    files:
      - values.yaml
