# The SPIRE install row. values.yaml is the only place a SPIRE value lives; the generator turns it
# into the ConfigMap the HelmRelease reads (valuesFrom), so the file and the cluster cannot drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spire-mgmt
resources:
  - helmrelease.yaml
  - exception.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: spire-values
    files:
      - values.yaml
