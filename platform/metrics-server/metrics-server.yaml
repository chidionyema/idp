# crew#539 (2026-08-28): break-glass diagnose run 33140351385 printed `error: Metrics API not
# available` for `kubectl top nodes` — the cluster has no metrics-server, so neither an operator
# nor the descheduler's LowNodeUtilization can read live node usage; the playbook could only show
# allocated requests. The cluster is `cluster_type = "basic"` (platform/oci/main.tf), and OKE's
# managed KubernetesMetricsServer add-on needs an Enhanced cluster (a per-cluster hourly charge —
# the founder's call, not taken here). The smaller road (LAW 23, LAW 43): the upstream
# kubernetes-sigs chart under Flux, pinned; 3.14.0 (app v0.9.0) was the latest on 2026-08-28
# (kubernetes-sigs.github.io/metrics-server/index.yaml). The chart's own defaults already meet
# the restricted profile (non-root uid 1000, read-only rootfs, drop ALL, RuntimeDefault seccomp,
# liveness + readiness probes); only resources and a PriorityClass are added for the estate rules.
apiVersion: v1
kind: Namespace
metadata:
  name: metrics-server
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: metrics-server
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/metrics-server/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: metrics-server
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    fullnameOverride: metrics-server
    replicas: 1
    # The chart's own default, the built-in class every cluster carries: the usage feed the
    # descheduler reads must outlive the pods it ranks. `infrastructure-critical` is strictly the
    # radio-room set (tests/test_incident_crew539_radio_room_survives_node_swap.py), not this.
    priorityClassName: system-cluster-critical
    # Kyverno refuses pods without limits; 100m/200Mi is the upstream sizing for < 100 nodes.
    resources:
      requests: { cpu: 50m, memory: 100Mi }
      limits: { cpu: 200m, memory: 200Mi }
    metrics:
      enabled: false
