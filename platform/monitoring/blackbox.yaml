# crew#539 DoD item 1: an HTTP probe of every founder surface from inside the cluster, every
# minute, evaluated by the one Prometheus (FounderSurfaceDown in rules/estate.yaml; the Probe is
# rules/founder-surfaces-probe.yaml). The target list is
# the same one .github/workflows/ping.yml derives from backstage/founder/catalog-info.yaml (every
# non-GitHub url, the two external ones included) — tests/ keeps the two equal — and the `founder`
# module accepts exactly what ping.yml accepts (2xx, 3xx, 401, 405; memory: curl-head-probe-405).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox
  namespace: monitoring
spec:
  # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.17.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    fullnameOverride: blackbox
    resources:
      requests: { cpu: 20m, memory: 48Mi }
      # Ceiling above the reservation for the same reason as the stack's own pods, and with
      # the same trade: measured at 9m of 20m and 28Mi of 48Mi on 2026-09-05, so a probe
      # burst had nowhere to go.
      limits: { cpu: 100m, memory: 96Mi }
    # The chart sets the rest of the restricted profile; the seccomp profile is the one field
    # it leaves out (kyverno render, restrict-seccomp-strict).
    podSecurityContext:
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      seccompProfile: { type: RuntimeDefault }
    config:
      modules:
        founder:
          prober: http
          timeout: 15s
          http:
            method: GET
            follow_redirects: true
            preferred_ip_protocol: ip4
            valid_status_codes: [200, 201, 202, 203, 204, 301, 302, 303, 307, 308, 401, 405]
        # crew#562 path 2: is the estate Mac's Screen Sharing switch on? A TCP open on 5900 over the
        # tailnet egress Service is the only honest signal; the browser page is up either way.
        mac_screen_sharing:
          prober: tcp
          timeout: 10s
          tcp:
            preferred_ip_protocol: ip4
