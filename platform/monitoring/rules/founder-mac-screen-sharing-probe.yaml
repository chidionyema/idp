# crew#562 path 2: the estate Mac's Screen Sharing switch, measured. A first-time user is never
# told "connection refused" by a page; the estate pages the founder (MacScreenSharingOff in
# estate.yaml) with the one switch to flip. Target is the tailnet egress Service in the guacamole row.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: founder-mac-screen-sharing
  namespace: monitoring
spec:
  jobName: founder-mac-screen-sharing
  interval: 60s
  scrapeTimeout: 15s
  module: mac_screen_sharing
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - founder-mac-vnc.guacamole.svc.cluster.local:5900
