# K8sGPT's findings, read (LAW 28). The operator (platform/healing/k8sgpt.yaml) analyses the
# cluster with the estate's own model and writes Result objects plus these metrics; until
# 2026-08-29 nothing read either (founder: "it just fell into the void"). Two rules: findings
# page like any other alert, and an analyser that cannot reach its model pages too, so silence
# is never mistaken for health.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8sgpt
  namespace: monitoring
spec:
  groups:
    - name: estate.k8sgpt
      rules:
        - alert: K8sGPTFinding
          # object_namespace is kept so each line of the grouped message says where the object
          # lives. It is deliberately NOT promoted to a `namespace` label: that would split the
          # one message into one per namespace (12 on 2026-09-05), and volume is what killed
          # this channel before.
          expr: sum by (object_namespace, kind, name) (k8sgpt_number_of_results_by_type) > 0
          for: 10m
          labels:
            severity: warning
            owner: idp
          annotations:
            summary: "{{ $labels.kind }} {{ $labels.name }} in {{ $labels.object_namespace }}"
            description: "Each object above has been reported broken for 10 minutes. K8sGPT writes the full diagnosis and the fix it suggests as a Result object in the healing namespace; the break-glass playbook `diagnose` (k8sgpt-results row) prints them."
        - alert: K8sGPTBlind
          expr: increase(k8sgpt_number_of_failed_backend_ai_calls[30m]) > 0 or absent(k8sgpt_number_of_results)
          for: 15m
          labels:
            severity: warning
            owner: idp
          annotations:
            summary: "K8sGPT cannot analyse the cluster"
            description: "Either its calls to the model (litellm, model minimax) are failing or its metrics are gone from Prometheus. Its findings are not arriving; do not read the quiet as healthy. Playbook: k8sgpt-analyze."
