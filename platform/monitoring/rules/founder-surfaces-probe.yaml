# The Probe that drives FounderSurfaceDown (see ../blackbox.yaml for the exporter and the module).
# It lives in its own Flux row (monitoring-rules) because a Probe is a monitoring.coreos.com CR and
# the CRD arrives with the chart: one row holding both fails every dry-run (incident 2026-08-25).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: founder-surfaces
  namespace: monitoring
spec:
  jobName: founder-surfaces
  interval: 60s
  scrapeTimeout: 20s
  module: founder
  prober:
    url: blackbox.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://${ESTATE_ZONE}
        - https://auth.${ESTATE_ZONE}
        - https://catalogue.${ESTATE_ZONE}
        - https://catalogue.${ESTATE_ZONE}/catalog/default/component/estate-scheduler
        - https://catalogue.${ESTATE_ZONE}/catalog/default/domain/hermes-v2
        - https://catalogue.${ESTATE_ZONE}/catalog/default/domain/mumchimp
        - https://catalogue.${ESTATE_ZONE}/catalog/default/domain/prospector
        - https://catalogue.${ESTATE_ZONE}/catalog/default/resource/vendor-cursor
        - https://catalogue.${ESTATE_ZONE}/catalog?filters%5Bkind%5D=component&filters%5Btype%5D=founder-surface
        - https://catalogue.${ESTATE_ZONE}/docs/default/component/founder-gods-view/FOUNDER/
        - https://catalogue.${ESTATE_ZONE}/docs/default/component/founder-gods-view/explanation/architecture/model-stack/
        - https://catalogue.${ESTATE_ZONE}/estate
        - https://catalogue.${ESTATE_ZONE}/ops
        - https://catalogue.${ESTATE_ZONE}/pair
        - https://catalogue.${ESTATE_ZONE}/reports
        - https://catalogue.${ESTATE_ZONE}/investigate
        - https://catalogue.${ESTATE_ZONE}/screen/
        - https://catalogue.${ESTATE_ZONE}/screen/#dagster
        - https://catalogue.${ESTATE_ZONE}/screen/#ollama
        - https://catalogue.${ESTATE_ZONE}/showcase
        - https://catalogue.${ESTATE_ZONE}/tools
        - https://cloud.oracle.com/?region=uk-london-1
        - https://cursor.com/dashboard/integrations
        - https://hc.${ESTATE_ZONE}
        - https://hc.${ESTATE_ZONE}/api/v3/status/
        - https://langfuse.${ESTATE_ZONE}
        - https://langfuse.${ESTATE_ZONE}/api/public/health
        - https://llm.${ESTATE_ZONE}/
        - https://llm.${ESTATE_ZONE}/ui
        - https://mcp.${ESTATE_ZONE}/github/mcp
        - https://otto.${ESTATE_ZONE}/healthz
        - https://signoz.${ESTATE_ZONE}
        - https://superset.${ESTATE_ZONE}
        - https://superset.${ESTATE_ZONE}/health
        - https://t.me/Ottototbot
        - https://www.${ESTATE_ZONE}
