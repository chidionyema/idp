# The estate's own rules, on top of the upstream set the chart ships (KubePodNotReady,
# KubePodCrashLooping, KubeNodeNotReady, TargetDown, KubePersistentVolumeFillingUp, Watchdog …).
#   FounderSurfaceDown       a founder surface failed its probe for 5 minutes (crew#539 DoD 1)
#   PersistentVolumeAlmostFull  a PVC is over 90 % used for 10 minutes (crew#539 CP14): this is
#                            the alert Robusta receives through Alertmanager's robusta route
#   GatewayRefusals          the MCP gateway answered 4xx/5xx for 5 minutes (crew#498, folded into
#                            crew#539): a refused agent is an incident, not a log line in SigNoz
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: estate
  namespace: monitoring
spec:
  groups:
    - name: estate.founder-surfaces
      rules:
        - alert: FounderSurfaceDown
          expr: probe_success{job="founder-surfaces"} == 0
          for: 5m
          labels:
            severity: critical
            owner: idp
          annotations:
            summary: "founder surface {{ $labels.instance }} is down"
            description: "The in-cluster probe of {{ $labels.instance }} has failed for 5 minutes (blackbox module founder)."
        - alert: MacScreenSharingOff
          expr: probe_success{job="founder-mac-screen-sharing"} == 0
          for: 10m
          labels:
            severity: warning
            owner: founder
          annotations:
            summary: "the estate Mac is not sharing its screen"
            description: "Nothing answers on the Mac's screen-sharing port over the tailnet, so 'Estate Mac screen (in the browser)' and Apple Screen Sharing both refuse to connect. One switch fixes it: on the Mac, System Settings > General > Sharing > Screen Sharing on. This alert clears on its own within 10 minutes of the switch (crew#562)."
    - name: estate.otto
      rules:
        - alert: OttoDown
          expr: kube_deployment_status_replicas_available{namespace="otto-gateway", deployment="otto-gateway"} == 0
          for: 10m
          labels:
            severity: critical
            owner: idp
          annotations:
            summary: "Otto (the Architect gateway) has no running pod"
            description: "otto-gateway has had zero available replicas for 10 minutes: Otto answers nobody on Telegram. It watched hermes-agent-gateway until 2026-09-05, which stopped being Otto's door when the Universal Event Gateway took the channel over -- an alert pointed at a workload that no longer serves the surface is an instrument nobody can act on (LAW 28). On 2026-08-29 the old pod sat at ContainerCreating for 4h behind a missing sidecar secret and only a break-glass run noticed."
    - name: estate.gateway
      rules:
        - alert: GatewayRefusals
          expr: sum by (route, status) (rate(agentgateway_requests_total{status=~"4..|5.."}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            owner: idp
          annotations:
            summary: "MCP gateway refusing requests on {{ $labels.route }} ({{ $labels.status }})"
            description: "agentgateway answered {{ $labels.status }} on route {{ $labels.route }} at {{ $value | humanize }} req/s for 5 minutes (crew#498)."
        - alert: GatewayMetricsAbsent
          expr: absent(up{job="agentgateway"} == 1)
          for: 10m
          labels:
            severity: warning
            owner: idp
          annotations:
            summary: "the MCP gateway's metrics are not being scraped"
            description: "No up==1 sample for job agentgateway in 10 minutes: the ServiceMonitor or the metrics port is gone, and GatewayRefusals is blind."
    - name: estate.storage
      rules:
        - alert: PersistentVolumeAlmostFull
          expr: |
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
            and kubelet_volume_stats_capacity_bytes > 0
          for: 10m
          labels:
            severity: warning
            owner: idp
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 90% full"
            description: "{{ $value | humanizePercentage }} free on {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} for 10 minutes."
    # Otto answering is a founder surface in its own right, and the one the founder-surfaces probe
    # above cannot grade: that probe fetches /healthz, which stayed 200 through the whole of the
    # 2026-09-05 silence. This one grades the end-to-end answer probe beside the door
    # (platform/otto-gateway/answer-probe.yaml), which fails its Job when any lane the door routes
    # to cannot produce a completion.
    - name: estate.otto
      rules:
        - alert: OttoCannotAnswer
          expr: kube_job_status_failed{namespace="otto-gateway", job_name=~"otto-answer-probe.*"} > 0
          for: 15m
          labels:
            severity: critical
            owner: idp
          annotations:
            summary: "Otto cannot produce an answer"
            description: >-
              The end-to-end answer probe in otto-gateway has failed for 15 minutes: at least one
              model lane the door routes to did not return a completion, so a message to the bot
              is answered with silence. The failed Job's log names the lane and the router's own
              refusal.
