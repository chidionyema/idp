# crew#498 (folded into crew#539 by the train, 2026-08-27): the gateway's refusals are a Prometheus
# alert, not a second collector path. agentgateway v1.4.1 serves Prometheus metrics on its stats
# listener ([::]:15020 by default, agentgateway config key statsAddr); platform/mcp exposes it as
# the `metrics` port and this ServiceMonitor scrapes it. GatewayRefusals in estate.yaml reads
# agentgateway_requests_total{status=~"4..|5.."}.
# Lives here, not in platform/mcp: a ServiceMonitor is a monitoring.coreos.com CR and the mcp row
# reconciles before the chart's CRDs exist (incident 2026-08-25).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agentgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: agentgateway
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames: [mcp]
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
