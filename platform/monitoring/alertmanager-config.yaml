# Alertmanager's whole configuration, rendered by External Secrets from the one vault entry the
# Flux alerts Provider and Robusta already read (`flux-telegram`, keys token and channel). The
# operator mounts this Secret as /etc/alertmanager/config (alertmanagerSpec.configSecret), so no
# manifest names a bot or a chat (LAW 46) and the file never holds a value.
#
# Routing: everything goes to the founder's Telegram; warnings and criticals are also posted to
# Robusta's alert endpoint (continue: true), which is how crew#539 CP14 fires a playbook from a
# real Prometheus alert instead of from a Robusta-side poll. Watchdog is the liveness of this
# pipeline: it is meant to fire forever, so it is routed to the null receiver here and read by
# the cluster-state collector (alert_watchdog=1 on the receipt) — an instrument that is read,
# never a message nobody wants (LAW 28).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: telegram
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: "null"
                matchers: ['alertname = "Watchdog"']
              - receiver: robusta
                matchers: ['severity =~ "warning|critical"']
                continue: true
              # crew#684 CP3: an alert whose rule names no owner is itself a red. It pages
              # the founder's channel as a P1 page once it has been unowned for ten minutes.
              - receiver: telegram-p1-page
                matchers: ['owner = ""', 'alertname != "Watchdog"']
                group_wait: 10m
                repeat_interval: 1h
                continue: true
          receivers:
            - name: "null"
            - name: telegram
              telegram_configs:
                - bot_token: "{{ .token }}"
                  chat_id: {{ .channel }}
                  parse_mode: ""
                  send_resolved: true
                  # Four different programs post into this one chat -- Prometheus through here,
                  # Robusta with its crash logs, Otto, and Flux when its Alert is unsuspended --
                  # and until now none of them said which one was talking. Every message from this
                  # receiver opens with the sender and the state, so the founder can tell at a
                  # glance who is speaking and whether it is starting or ending.
                  message: |-
                    {{ "{{" }} if eq .Status "firing" {{ "}}" }}PROMETHEUS - FIRING{{ "{{" }} else {{ "}}" }}PROMETHEUS - RESOLVED{{ "{{" }} end {{ "}}" }} - {{ "{{" }} .CommonLabels.severity {{ "}}" }}
                    {{ "{{" }} .CommonLabels.alertname {{ "}}" }} in {{ "{{" }} .CommonLabels.namespace {{ "}}" }}
                    {{ "{{" }} range .Alerts {{ "}}" }}{{ "{{" }} .Annotations.summary {{ "}}" }}
                    {{ "{{" }} .Annotations.description {{ "}}" }}
                    {{ "{{" }} end {{ "}}" }}
            - name: telegram-p1-page
              telegram_configs:
                - bot_token: "{{ .token }}"
                  chat_id: {{ .channel }}
                  parse_mode: ""
                  send_resolved: true
                  message: 'PROMETHEUS - P1 PAGE - {{ "{{" }} .CommonLabels.alertname {{ "}}" }} has been red for 10 minutes and no rule names an owner. Add an owner label to the rule in platform/monitoring/rules and a next action.'
            - name: robusta
              webhook_configs:
                - url: http://robusta-runner.robusta.svc.cluster.local/api/alerts
                  send_resolved: true
  dataFrom:
    - extract: { key: flux-telegram }
