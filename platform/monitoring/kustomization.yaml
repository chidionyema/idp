# Monitoring row (crew#539 DoD item 1, founder 2026-08-27): the one Prometheus, the one
# Alertmanager and the blackbox exporter. Pages reach Telegram through the same vault entry the
# Flux alerts use; warnings also reach Robusta (CP14). The estate's rules and the founder-surface
# Probe are monitoring.coreos.com CRs and apply from rules/ in the monitoring-rules row.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - alertmanager-config.yaml
  - kube-prometheus-stack.yaml
  - blackbox.yaml
