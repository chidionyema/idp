# The GitHub App credentials, in THIS namespace.
#
# Measured 2026-09-12: router-backup hung in ContainerCreating for 105 seconds and the kubelet
# said why --
#
#   MountVolume.SetUp failed for volume "github-app" : secret "github-app" not found
#
# A Secret is namespaced. platform/drills/drill-dispatcher.yaml mounts this Secret happily, in
# flux-system, where platform/alerts-github/github-app.yaml creates it. This job runs in llm and
# assumed the same Secret was everywhere. It is not, and the kubelet is the only thing that says
# so -- the Job reports only `DeadlineExceeded`.
#
# Written from the vault rather than copied from another namespace: an ExternalSecret is the
# estate's one way to get a credential onto a namespace (R52), and copying a Secret with kubectl
# would put a material value outside the vault's lifecycle and outside rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: github-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The three files the App JWT is signed from. Named exactly as the Secret in flux-system
        # names them, so a reader who knows one knows the other.
        githubAppID: "{{ .app_id }}"
        githubAppInstallationID: "{{ .installation_id }}"
        githubAppPrivateKey: "{{ .pem_b64 | b64dec }}"
  dataFrom:
    - extract: { key: github-app }
