apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - github-app-secret.yaml
  - publisher.yaml
  - backup.yaml
images:
  # build-multiarch pushes ghcr.io/chidionyema/router-events:main-<run>-<sha> from the Dockerfile in
  # this directory (bin/dockerfiles discovers it by name: `router-events`). The tag is a commit sha
  # because a moving tag makes the running version whichever push won the race and leaves a rollback
  # nothing to roll back to -- the rule prospector's container-images.yml states.
  # image-automation-controller rewrites the newTag line from ImagePolicy
  # flux-system/router-events; the marker is how it finds the line.
  - name: ghcr.io/chidionyema/router-events
    newTag: main-13834-f11d5c3e0d0e066da41e37d0f6b181b40eb68c0f # {"$imagepolicy": "flux-system:router-events:tag"}
