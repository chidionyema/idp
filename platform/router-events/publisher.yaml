# THE PUBLISHER. One long-lived listener on the database, announcing every routing change on the
# bus the moment Postgres commits it.
#
# NOT A CRONJOB, and that is the whole point. A poll every N seconds means the estate believes
# something for up to N seconds after it stopped being true; the founder's decision was to remove
# that window, not to shorten it. This pod holds one connection open and reacts.
#
# WHY THIS IMAGE. Three existing images were tried and all three CrashLoopBackOff'd, which is
# recorded because each cost a deploy cycle and the next person should not repeat it:
#
#   postgres:17.6-alpine         -> "python3: not found"        (a database client, no interpreter)
#   ghcr.io/oracle/oci-cli       -> "No module named psycopg2"  (python3, no postgres driver)
#   ghcr.io/berriai/litellm-db   -> "No module named psycopg2"  (uses Prisma, not psycopg2)
#
# The requirement is narrow and specific -- python3, a postgres driver that speaks LISTEN, and a
# socket to NATS -- and no image in the estate happens to carry all three. So the image is built
# (platform/router-events/Dockerfile) and published by the same workflow that publishes every
# other estate image. That is cheaper than a fourth guess.
#
# THE NOTIFICATION CARRIES NO KEY. pg_notify is visible to every session on the database, so the
# payload says which lane changed and never what is in it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-event-publisher
  namespace: llm
  labels: { app.kubernetes.io/name: router-event-publisher, estate.io/layer: model-routing }
spec:
  # TWO, on DIFFERENT nodes, as kyverno's require-availability demands (crew#555), and the policy
  # was right: two listeners are two separate database sessions, and a duplicate is deduplicated
  # downstream while a node event that reschedules ONE pod is a silent gap in the feed. A gap is
  # not recoverable. A duplicate is.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: router-event-publisher }
  template:
    metadata:
      labels: { app.kubernetes.io/name: router-event-publisher }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: router-event-publisher }
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: publisher
          image: ghcr.io/chidionyema/router-events:main
          command: ["python3", "/app/publisher.py"]
          # require-pod-probes (kyverno) refused the first draft. The probes are not a formality
          # here: the pod being Running does NOT mean it is subscribed. publisher.py touches
          # /tmp/subscribed only AFTER the LISTEN is live and only while the poll keeps returning,
          # so readiness is the actual claim this pod exists to make. A pod that is up but not
          # listening is precisely the silent failure this whole design is against.
          readinessProbe:
            exec: { command: ["sh", "-c", "test -f /tmp/subscribed"] }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["sh", "-c", "test -f /tmp/subscribed"] }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          env:
            - { name: HOME, value: /tmp }
            - { name: NATS_URL, value: "nats.event-bus.svc:4222" }
            - { name: PGPASSWORD_FILE, value: /var/run/db/LITELLM_DB_PASSWORD }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: db, mountPath: /var/run/db, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        # secrets-not-from-env-vars (kyverno): the password is a FILE from the mounted Secret,
        # never an env value.
        - name: db
          secret: { secretName: litellm-upstream, defaultMode: 256 }
