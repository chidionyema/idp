# THE DR BACKUP. When a lane changes, this writes the routing table to git -- automatically.
#
# WHY THIS EXISTS (founder's "burn to the ground" test): if the estate-db volume is lost, every
# lane is lost with it, and every agent dies. A file in git is the one copy that survives losing
# the database, and a human must not be the thing that remembers to make it.
#
# IT DOES NOT DECIDE WHAT IS TRUE. It reads the lanes from the router's admin API and writes them
# down. The database decided; this records the decision.
#
# A COMMIT ONLY WHEN THE CONTENT CHANGED. A timestamp-only rewrite would commit on every event and
# bury the real history in noise; git is compared against, not appended to.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: router-backup
  namespace: llm
  labels: { app.kubernetes.io/name: router-backup, estate.io/layer: model-routing }
spec:
  # Not the change itself -- the change is published to the bus and the twin sees it instantly.
  # This is the BACKUP, so a period that keeps git within a few minutes of the database is enough,
  # and running it on a clock means a missed event cannot leave git permanently stale.
  schedule: "7,22,37,52 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: ghcr.io/oracle/oci-cli:20260826
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  exec python3 - <<'PY'
                  import base64, json, os, subprocess, time, urllib.error, urllib.request

                  ROUTER_KEY = open(os.environ["ROUTER_KEY_FILE"]).read().strip()
                  API = "https://api.github.com"
                  REPO = os.environ["GITHUB_REPO"]
                  APP = os.environ["GITHUB_APP_DIR"]

                  # The App token, MINTED HERE. The first version read /var/run/github-app/token,
                  # a file that does not exist -- the Secret carries githubAppID,
                  # githubAppInstallationID and githubAppPrivateKey, and a token is something you
                  # exchange them for. Copied verbatim from platform/drills/drill-dispatcher.yaml,
                  # which has done this successfully every hour for weeks.
                  def b64(b):
                      return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

                  def app_jwt(app_id, pem):
                      from cryptography.hazmat.primitives import hashes, serialization
                      from cryptography.hazmat.primitives.asymmetric import padding
                      now = int(time.time())
                      head = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
                      body = b64(json.dumps({"iat": now - 60, "exp": now + 540, "iss": app_id}).encode())
                      key = serialization.load_pem_private_key(pem, password=None)
                      sig = key.sign(f"{head}.{body}".encode(), padding.PKCS1v15(), hashes.SHA256())
                      return f"{head}.{body}.{b64(sig)}"

                  def mint():
                      app_id = open(os.path.join(APP, "githubAppID")).read().strip()
                      inst = open(os.path.join(APP, "githubAppInstallationID")).read().strip()
                      pem = open(os.path.join(APP, "githubAppPrivateKey"), "rb").read()
                      req = urllib.request.Request(
                          f"{API}/app/installations/{inst}/access_tokens", method="POST",
                          data=b"{}",
                          headers={"Authorization": "Bearer " + app_jwt(app_id, pem),
                                   "Accept": "application/vnd.github+json"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read())["token"]

                  PATH_IN_REPO = "platform/llm/lanes.backup.yaml"
                  ROUTER = os.environ["ROUTER_URL"]

                  def sh(*a, **kw):
                      return subprocess.run(a, capture_output=True, text=True, **kw)

                  # The lanes, as the one authority reports them.
                  req = urllib.request.Request(ROUTER + "/model/info",
                                               headers={"Authorization": "Bearer " + ROUTER_KEY})
                  lanes = json.load(urllib.request.urlopen(req, timeout=60))["data"]

                  # A KEY IS NEVER WRITTEN. The router reports api_key as a masked value; anything
                  # that is not a plain os.environ/ reference is replaced with one, so this file can
                  # never become a credential store (LAW 21).
                  lines = [
                      "# GENERATED by the router-backup Job from the lanes the router actually holds.",
                      "# The database is the source of truth (founder, 2026-09-12); this file is the",
                      "# copy that survives losing it. Do not hand-edit -- the next change overwrites it.",
                      "model_list:",
                  ]
                  for e in sorted(lanes, key=lambda x: x.get("model_name", "")):
                      p = e.get("litellm_params", {}) or {}
                      lines.append(f"  - model_name: {e.get('model_name')}")
                      lines.append("    litellm_params:")
                      lines.append(f"      model: {p.get('model')}")
                      if p.get("api_base"):
                          lines.append(f"      api_base: {p.get('api_base')}")
                      # Never the value: the name of the variable the pod carries.
                      lines.append("      api_key: os.environ/" + (os.environ.get("KEY_VAR") or "LITELLM_UPSTREAM_KEY"))
                  body = "\n".join(lines) + "\n"

                  token = mint()
                  print(json.dumps({"msg": "read lanes", "count": len(lanes)}))

                  # Read the current file; commit only when the CONTENT changed.
                  def api(method, path, data=None):
                      r = urllib.request.Request(API + path, method=method,
                          data=json.dumps(data).encode() if data else None,
                          headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"})
                      return json.load(urllib.request.urlopen(r, timeout=45))

                  # READ, THEN WRITE, AND RETRY WHEN SOMEONE ELSE WROTE IN BETWEEN.
                  #
                  # Measured 2026-09-12: the job died on
                  #   urllib.error.HTTPError: HTTP Error 409: Conflict
                  # because GitHub's contents API is optimistic concurrency -- you send the sha you
                  # read, and a sha that is no longer HEAD is refused. Two runs overlap whenever a
                  # cron fires while an earlier run is retrying (the job showed failed=2 from the
                  # same run), so a 409 is a NORMAL race, not a failure.
                  #
                  # The retry re-reads and re-derives the whole payload rather than reusing the
                  # stale sha, and it gives up after one attempt so a real conflict still surfaces
                  # as a failure instead of looping.
                  for attempt in (1, 2):
                      try:
                          cur = api("GET", f"/repos/{REPO}/contents/{PATH_IN_REPO}")
                          existing = base64.b64decode(cur["content"]).decode()
                          sha = cur["sha"]
                      except Exception:
                          existing, sha = "", None

                      if existing == body:
                          print(json.dumps({"msg": "unchanged, no commit"}))
                          raise SystemExit(0)

                      payload = {"message": "router backup: the lanes the database holds, recorded",
                                 "content": base64.b64encode(body.encode()).decode(),
                                 "committer": {"name": "estate-router-backup",
                                               "email": "router-backup@users.noreply.github.com"}}
                      if sha:
                          payload["sha"] = sha
                      try:
                          api("PUT", f"/repos/{REPO}/contents/{PATH_IN_REPO}", payload)
                          print(json.dumps({"msg": "committed", "path": PATH_IN_REPO, "attempt": attempt}))
                          raise SystemExit(0)
                      except urllib.error.HTTPError as exc:
                          if exc.code != 409 or attempt == 2:
                              raise
                          print(json.dumps({"msg": "409 conflict, re-reading and retrying"}))
                  PY
              env:
                - { name: HOME, value: /tmp }
                - { name: GITHUB_REPO, value: "${ESTATE_GITHUB_REPO}" }
                - { name: ROUTER_URL, value: "http://litellm.llm.svc.cluster.local:4000" }
                # the App id, installation id and private key, as FILES from the mounted Secret
                # (kyverno secrets-not-from-env-vars refuses the secretKeyRef form).
                - { name: GITHUB_APP_DIR, value: /var/run/github-app }
                # secretKeyRef-in-env is refused by secrets-not-from-env-vars; the key is a file.
                - { name: ROUTER_KEY_FILE, value: /var/run/router/LITELLM_MASTER_KEY }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 300m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: router, mountPath: /var/run/router, readOnly: true }
                - { name: github-app, mountPath: /var/run/github-app, readOnly: true }
          volumes:
            - { name: tmp, emptyDir: {} }
            - name: router
              secret: { secretName: litellm-upstream, defaultMode: 256 }
            - name: github-app
              secret: { secretName: github-app, defaultMode: 256 }
