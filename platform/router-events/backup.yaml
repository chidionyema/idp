# THE DR BACKUP. When a lane changes, this writes the routing table to git -- automatically.
#
# WHY THIS EXISTS (founder's "burn to the ground" test): if the estate-db volume is lost, every
# lane is lost with it, and every agent dies. A file in git is the one copy that survives losing
# the database, and a human must not be the thing that remembers to make it.
#
# IT DOES NOT DECIDE WHAT IS TRUE. It reads the lanes from the router's admin API and writes them
# down. The database decided; this records the decision.
#
# A COMMIT ONLY WHEN THE CONTENT CHANGED. A timestamp-only rewrite would commit on every event and
# bury the real history in noise; git is compared against, not appended to.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: router-backup
  namespace: llm
  labels: { app.kubernetes.io/name: router-backup, estate.io/layer: model-routing }
spec:
  # Not the change itself -- the change is published to the bus and the twin sees it instantly.
  # This is the BACKUP, so a period that keeps git within a few minutes of the database is enough,
  # and running it on a clock means a missed event cannot leave git permanently stale.
  schedule: "7,22,37,52 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: ghcr.io/oracle/oci-cli:20260826
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  exec python3 - <<'PY'
                  import base64, json, os, subprocess, time, urllib.request

                  ROUTER_KEY = open(os.environ["ROUTER_KEY_FILE"]).read().strip()
                  API = "https://api.github.com"
                  REPO = os.environ["GITHUB_REPO"]
                  PATH_IN_REPO = "platform/llm/lanes.backup.yaml"
                  ROUTER = os.environ["ROUTER_URL"]

                  def sh(*a, **kw):
                      return subprocess.run(a, capture_output=True, text=True, **kw)

                  # The lanes, as the one authority reports them.
                  req = urllib.request.Request(ROUTER + "/model/info",
                                               headers={"Authorization": "Bearer " + ROUTER_KEY})
                  lanes = json.load(urllib.request.urlopen(req, timeout=60))["data"]

                  # A KEY IS NEVER WRITTEN. The router reports api_key as a masked value; anything
                  # that is not a plain os.environ/ reference is replaced with one, so this file can
                  # never become a credential store (LAW 21).
                  lines = [
                      "# GENERATED by the router-backup Job from the lanes the router actually holds.",
                      "# The database is the source of truth (founder, 2026-09-12); this file is the",
                      "# copy that survives losing it. Do not hand-edit -- the next change overwrites it.",
                      "model_list:",
                  ]
                  for e in sorted(lanes, key=lambda x: x.get("model_name", "")):
                      p = e.get("litellm_params", {}) or {}
                      lines.append(f"  - model_name: {e.get('model_name')}")
                      lines.append("    litellm_params:")
                      lines.append(f"      model: {p.get('model')}")
                      if p.get("api_base"):
                          lines.append(f"      api_base: {p.get('api_base')}")
                      # Never the value: the name of the variable the pod carries.
                      lines.append("      api_key: os.environ/" + (os.environ.get("KEY_VAR") or "LITELLM_UPSTREAM_KEY"))
                  body = "\n".join(lines) + "\n"

                  token = open(os.environ["GITHUB_TOKEN_FILE"]).read().strip()
                  print(json.dumps({"msg": "read lanes", "count": len(lanes)}))

                  # Read the current file; commit only when the CONTENT changed.
                  def api(method, path, data=None):
                      r = urllib.request.Request(API + path, method=method,
                          data=json.dumps(data).encode() if data else None,
                          headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"})
                      return json.load(urllib.request.urlopen(r, timeout=45))

                  try:
                      cur = api("GET", f"/repos/{REPO}/contents/{PATH_IN_REPO}")
                      existing = base64.b64decode(cur["content"]).decode()
                      sha = cur["sha"]
                  except Exception:
                      existing, sha = "", None

                  if existing == body:
                      print(json.dumps({"msg": "unchanged, no commit"}))
                      raise SystemExit(0)

                  payload = {"message": "router backup: the lanes the database holds, recorded",
                             "content": base64.b64encode(body.encode()).decode(),
                             "committer": {"name": "estate-router-backup",
                                           "email": "router-backup@users.noreply.github.com"}}
                  if sha:
                      payload["sha"] = sha
                  api("PUT", f"/repos/{REPO}/contents/{PATH_IN_REPO}", payload)
                  print(json.dumps({"msg": "committed", "path": PATH_IN_REPO}))
                  PY
              env:
                - { name: HOME, value: /tmp }
                - { name: GITHUB_REPO, value: "${ESTATE_GITHUB_REPO}" }
                - { name: ROUTER_URL, value: "http://litellm.llm.svc.cluster.local:4000" }
                - { name: GITHUB_TOKEN_FILE, value: /var/run/github-app/token }
                # secretKeyRef-in-env is refused by secrets-not-from-env-vars; the key is a file.
                - { name: ROUTER_KEY_FILE, value: /var/run/router/LITELLM_MASTER_KEY }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 300m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: router, mountPath: /var/run/router, readOnly: true }
          volumes:
            - { name: tmp, emptyDir: {} }
            - name: router
              secret: { secretName: litellm-upstream, defaultMode: 256 }
