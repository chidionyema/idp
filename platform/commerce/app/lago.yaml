# THE COMMERCE PRIMITIVE. The mature platform, not a stitched one (headline; LAW 43).
#
# Lago, chart `lago` 1.28.0 / app 1.32.4, both read from
# https://getlago.github.io/lago-helm-charts/index.yaml on 2026-08-29, not from memory.
#
# Why Lago and not Medusa or Kill Bill. The founder needs two things: one-off packs
# ("100_ai_credits") AND user subscriptions. Read from Lago's own OpenAPI contract
# (github.com/getlago/lago-openapi, fetched 2026-08-29), both are first-class endpoints:
#   /subscriptions, /subscriptions/{id}/entitlements   -> the subscriptions
#   /wallets, /wallet_transactions                     -> prepaid credits, the AI-credit packs
#   /wallet_transactions/{id}/payment_url              -> the Checkout URL, for a credit top-up
#   /invoices/{id}/payment_url                         -> the Checkout URL, for a subscription
# and its own index describes it as "usage metering, subscriptions, invoicing, payments,
# entitlements". One tool covers both cases.
#   - Medusa: a cart-and-order engine. Packs yes, subscriptions only via a community plugin or
#     a module we would write. That is the half-stitched solution the headline bans.
#   - Kill Bill: does subscriptions well, but it is a JVM plus Kaui plus its own database, and
#     it has no prepaid-credit wallet. Two tools again, on a 4-6 OCPU node.
#
# DARK, by four independent means, so no single mistake makes it live:
#   1. clusters/oke/commerce.yaml carries `suspend: true` on both rows -- Flux does not apply it.
#   2. global.ingress.enabled false, and the namespace has no idp.estate/edge-attach label, so
#      the Gateway would refuse a route from here even if one appeared.
#   3. global.signup.enabled false -- no self-service account on a money service.
#   4. the payment provider is configured in TEST mode until the cutover PR.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: lago
  namespace: commerce
spec:
  interval: 24h
  url: https://getlago.github.io/lago-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lago
  namespace: commerce
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: lago
      version: 1.28.0
      sourceRef:
        kind: HelmRepository
        name: lago
  install: { remediation: { retries: 3 } }
  upgrade: { remediation: { retries: 3 } }
  values:
    # Internal names only. These become public hostnames in the cutover PR, never before.
    apiUrl: "http://lago-api.commerce.svc:3000"
    frontUrl: "http://lago-front.commerce.svc:80"
    global:
      # databaseUrl and redisUrl come from the vault through this Secret; neither is typed here.
      existingSecret: lago-credentials
      ingress:
        enabled: false
      signup:
        enabled: false
      segment:
        # No telemetry off this estate to a third party from the layer that holds the money.
        enabled: false
      s3:
        enabled: false
      smtp:
        enabled: false
      googleAuth:
        enabled: false
      clickhouse:
        # The event-streaming path (Kafka + ClickHouse) is for usage metering at volume. Off:
        # subscriptions and credit packs do not need it, and it would double the footprint.
        enabled: false
    encryption:
      existingSecret: lago-encryption
    minio:
      # PDF invoice storage. Off while dark; the cutover PR points it at the estate's object
      # store rather than adding a fourth stateful workload to this node.
      enabled: false
    pdf:
      enabled: false
    # The lean worker set, and the size of each one. The chart ships thirteen deployments;
    # eventsConsumer, eventsProcessor and eventsWorker exist only for the ClickHouse path,
    # which is off above.
    #
    # SIZING, and why it is written here rather than left to the chart. Summed from
    # lago-1.28.0.tgz values.yaml on 2026-08-29, the chart's own defaults for the eight
    # deployments that stay enabled ask for 6.80 CPU and 6.75 Gi of REQUESTS:
    #   front 200m  api 1000m  worker 1100m  clockWorker 1100m  clock 100m
    #   billingWorker 1100m  webhookWorker 1100m  paymentWorker 1100m
    # The node this estate runs is 6 OCPU / 24 Gi (bin/idp-features plan: "smallest A1-6-24").
    # Those defaults are written for a cluster that meters usage for many tenants; here they
    # are a layer that would never schedule the day it is switched on -- and the capacity guard
    # could not have caught it, because a chart default is not a number in this repository.
    # So every enabled component names its own request, sized for one estate's subscriptions
    # and credit packs, and the numbers are in git where a guard can read them.
    front:         { resources: { requests: { cpu: 50m,  memory: 128Mi } } }
    api:           { resources: { requests: { cpu: 200m, memory: 512Mi } } }
    worker:        { resources: { requests: { cpu: 100m, memory: 512Mi } } }
    clock:         { resources: { requests: { cpu: 25m,  memory: 128Mi } } }
    clockWorker:   { resources: { requests: { cpu: 100m, memory: 384Mi } } }
    billingWorker: { resources: { requests: { cpu: 100m, memory: 384Mi } } }
    webhookWorker: { resources: { requests: { cpu: 100m, memory: 384Mi } } }
    paymentWorker: { resources: { requests: { cpu: 100m, memory: 384Mi } } }
    eventsConsumer: { replicaCount: 0 }
    eventsProcessor: { replicaCount: 0 }
    eventsWorker: { replicaCount: 0 }
    pdfWorker: { replicaCount: 0 }
  # The chart's own templates carry no `priorityClassName` field -- grep of lago-1.28.0.tgz finds
  # it only in the bundled minio subchart, which is disabled above. Every Deployment it ships
  # would therefore land in the `commerce` namespace (labelled `app.kubernetes.io/part-of: idp`)
  # with no class and become a PolicyReport row under platform/scheduling/require-priority-class
  # `platform-workload-names-a-class`. That rule is Audit today only because charts like this one
  # exist; its own comment says it flips to Enforce "after a pass with zero violations". Adding
  # thirteen violations would push that flip further away, so the class is patched in at render
  # time. postRenderers is already how this estate bends a chart it does not own (temporal,
  # hindsight, langfuse, traefik, signoz and five more), so this is the existing pattern, not a
  # new mechanism.
  #
  # ONE HONEST CAVEAT about that class. `platform-batch` was written for a nightly job that is
  # seated by preempting one balloon pod, and the capacity guard therefore keeps batch requests
  # out of the standing total. This layer is not a nightly job: switched on, eight pods run
  # continuously. So the paper budget reading 5.00 of 5.0 cores today is 5.00 WITHOUT the
  # 1.03 cores this layer would add. That is fine while it is suspended and it is exactly what
  # the cutover pull request has to answer -- a bigger node, or a different class, decided by a
  # person looking at the number rather than by this comment.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Deployment }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used-kustomize-matches-on-target
              spec:
                template:
                  spec:
                    priorityClassName: platform-batch
