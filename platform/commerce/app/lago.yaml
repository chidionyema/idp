# THE COMMERCE PRIMITIVE. The mature platform, not a stitched one (headline; LAW 43).
#
# Lago, chart `lago` 1.28.0 / app 1.32.4, both read from
# https://getlago.github.io/lago-helm-charts/index.yaml on 2026-08-29, not from memory.
#
# Why Lago and not Medusa or Kill Bill. The founder needs two things: one-off packs
# ("100_ai_credits") AND user subscriptions. Read from Lago's own OpenAPI contract
# (github.com/getlago/lago-openapi, fetched 2026-08-29), both are first-class endpoints:
#   /subscriptions, /subscriptions/{id}/entitlements   -> the subscriptions
#   /wallets, /wallet_transactions                     -> prepaid credits, the AI-credit packs
#   /wallet_transactions/{id}/payment_url              -> the Checkout URL, for a credit top-up
#   /invoices/{id}/payment_url                         -> the Checkout URL, for a subscription
# and its own index describes it as "usage metering, subscriptions, invoicing, payments,
# entitlements". One tool covers both cases.
#   - Medusa: a cart-and-order engine. Packs yes, subscriptions only via a community plugin or
#     a module we would write. That is the half-stitched solution the headline bans.
#   - Kill Bill: does subscriptions well, but it is a JVM plus Kaui plus its own database, and
#     it has no prepaid-credit wallet. Two tools again, on a 4-6 OCPU node.
#
# DARK, by four independent means, so no single mistake makes it live:
#   1. clusters/oke/commerce.yaml carries `suspend: true` on both rows -- Flux does not apply it.
#   2. global.ingress.enabled false, and the namespace has no idp.estate/edge-attach label, so
#      the Gateway would refuse a route from here even if one appeared.
#   3. global.signup.enabled false -- no self-service account on a money service.
#   4. the payment provider is configured in TEST mode until the cutover PR.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: lago
  namespace: commerce
spec:
  interval: 24h
  url: https://getlago.github.io/lago-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lago
  namespace: commerce
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: lago
      version: 1.28.0
      sourceRef:
        kind: HelmRepository
        name: lago
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  values:
    # The application version the chart renders into every image tag (getlago/api:v<version>,
    # getlago/front:v<version>). The chart's default, 1.33.4, ships Rails 8.0.2.1 with a
    # CRITICAL Active Storage CVE (2026-33195); 1.52.1 carries 8.0.5.1 and is the newest tag
    # on 2026-09-05. lago-api.Dockerfile and lago-front.Dockerfile rebase exactly this tag.
    version: "1.52.1"
    # Internal names only. These become public hostnames in the cutover PR, never before.
    apiUrl: "http://lago-api.commerce.svc:3000"
    frontUrl: "http://lago-front.commerce.svc:80"
    global:
      # databaseUrl and redisUrl come from the vault through this Secret; neither is typed here.
      existingSecret: lago-credentials
      ingress:
        enabled: false
      signup:
        enabled: false
      segment:
        # No telemetry off this estate to a third party from the layer that holds the money.
        enabled: false
      s3:
        enabled: false
      smtp:
        enabled: false
      googleAuth:
        enabled: false
      pdf:
        # Invoice PDF rendering. Off: the workers that would call the renderer are told so by
        # this flag (it becomes LAGO_DISABLE_PDF_GENERATION in each of them). The renderer's own
        # Deployment has no `enabled` guard in the chart at all, so it is held at replicas 0
        # below -- an object that exists and schedules nothing, not an object that is absent.
        enabled: false
      clickhouse:
        # The event-streaming path (Kafka + ClickHouse) is for usage metering at volume. Off:
        # subscriptions and credit packs do not need it, and it would double the footprint.
        # This one flag is a real guard: events-consumer, events-processor and the topic-creation
        # Job are each wrapped in `{{- if .Values.global.clickhouse.enabled }}` and do not render.
        enabled: false
    encryption:
      existingSecret: lago-encryption
    minio:
      # PDF invoice storage. Off while dark; the cutover PR points it at the estate's object
      # store rather than adding a fourth stateful workload to this node.
      enabled: false
    # WHAT ACTUALLY RUNS, and how the chart is told. Read out of lago-1.28.0/templates on
    # 2026-08-29 by rendering it, not by reading its values file: three of the components take
    # `enabled`, and three more render whatever you say because their template carries no guard.
    #   guarded by `enabled`   clockWorker, billingWorker, webhookWorker, paymentWorker, pdfWorker
    #   guarded by clickhouse  eventsConsumer, eventsProcessor, the create-topic Job
    #   no guard at all        front, api, worker, clock, events-worker, pdf, the migrate Job
    # The chart's key for count is `replicas`. An earlier version of this file wrote
    # `replicaCount: 0` on four of them, which is not a key this chart has: helm ignored it and
    # rendered three worker pods this file claimed were switched off. The render is the proof
    # (docs/how-to/onboarding/commerce.md carries the command), never this comment.
    #
    # Every enabled component names its own requests AND limits. Requests, because the chart's
    # defaults are written for a cluster metering usage for many tenants -- 6.80 CPU and 6.75 Gi
    # across the eight that stay on, on a node that is 6 OCPU / 24 Gi, so it would never
    # schedule the day it was switched on. Limits, because the cluster's own admission policy
    # (require-pod-requests-limits) refuses a container that names one without the other, and
    # requests == limits is Guaranteed QoS: the layer holding the money is not the first evicted.
    front: {replicas: 1, resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 50m, memory: 128Mi}}}
    api: {replicas: 1, resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: 200m, memory: 512Mi}}}
    worker: {replicas: 1, resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: 100m, memory: 512Mi}}}
    clock: {replicas: 1, resources: {requests: {cpu: 25m, memory: 128Mi}, limits: {cpu: 25m, memory: 128Mi}}}
    clockWorker: {enabled: true, replicas: 1, resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: 100m, memory: 384Mi}}}
    billingWorker: {enabled: true, replicas: 1, resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: 100m, memory: 384Mi}}}
    webhookWorker: {enabled: true, replicas: 1, resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: 100m, memory: 384Mi}}}
    paymentWorker: {enabled: true, replicas: 1, resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: 100m, memory: 384Mi}}}
    # Off. pdfWorker has a guard and takes it. events-worker and pdf have no guard, so the
    # chart renders them whatever you say: they are removed from the manifest below instead of
    # being shipped as husks at zero replicas -- an object a buyer's engineer would open and
    # ask why a disabled component still needs a probe, a priority class and a security context.
    # `replicas: 0` stays as the second line of defence: if a chart bump ever renames those
    # Deployments and the removal stops matching, what appears is a pod with no requests, which
    # the cluster's own require-pod-requests-limits refuses loudly, not a 1.1-core default pod.
    pdfWorker: {enabled: false}
    eventsWorker: {replicas: 0}
    pdf: {replicas: 0}
    job:
      migrate:
        # Runs once per install and upgrade as a Helm hook, and it is a pod like any other:
        # without this block it asks for nothing, and require-pod-requests-limits refuses it.
        resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: 200m, memory: 512Mi}}
  # WHAT THIS CHART CANNOT BE TOLD IN VALUES, and is therefore patched at render time.
  # lago 1.28.0 exposes no securityContext, no priorityClassName and no Service labels: grep of
  # lago-1.28.0.tgz finds `securityContext` in no template and `priorityClassName` only in the
  # bundled minio subchart, which is disabled above. postRenderers is already how this estate
  # bends a chart it does not own (temporal, hindsight, langfuse, traefik, signoz and five more),
  # so this is the existing pattern, not a new mechanism. Every patch below closes a rule the
  # cluster's own admission policies refuse, measured by bin/idp-kyverno-render, never guessed.
  #
  # ONE HONEST CAVEAT about the priority class, and it is a scheduling caveat only. `platform-batch`
  # was written for a nightly job seated by preempting one balloon pod. This layer is not a nightly
  # job: switched on, eleven pods run continuously, asking 1.035 CPU and 3.41 Gi. The class is here
  # so that if it is ever switched on before the node grows, it yields to the platform rather than
  # competing with it -- it is not, and must not become, the reason the capacity sum ignores this
  # layer. That reason is the `suspend: true` on the three Flux rows in clusters/oke/commerce.yaml,
  # which is what tests/test_incident_crew584_capacity_requests_need_proof.py reads. Removing the
  # suspension moves all 1.035 into a standing total already at 5.00 of a 5.0 budget, and that test
  # goes red in the same commit -- so the cutover buys the node, trims the requests or moves
  # something off, decided by a person looking at the number rather than by a comment here.
  postRenderers:
    - kustomize:
        # EVERY IMAGE NAMES ITS REGISTRY. The nodes run cri-o with short-name mode enforcing: a
        # reference whose first path segment carries no registry host is admitted and then fails
        # to pull with "returns ambiguous list" (crew#284 postgres, crew#396 temporal, crew#325
        # seaweedfs, tailscale-operator run 33341390235 2026-08-30 -- four times in five days).
        # This chart is the worst case of that class: it writes `image: getlago/api:v{{ .Values
        # .version }}` straight into its templates (lago-1.28.0/templates/api-deployment.yaml:244
        # and eleven more) and offers no values key for a registry, so the post-renderer is the
        # only place the host can be written. Every path answers 200 on registry-1.docker.io,
        # measured 2026-08-31, not assumed. The layer is suspended at replicas 0, so nothing has
        # ever tried to pull these -- which is exactly why it would have failed on the day it was
        # switched on rather than today.
        # NON-ROOT, BY IMAGE AND NOT BY EXCEPTION. The cluster's restricted PodSecurity profile
        # refused lago-migrate-db on 2026-09-05 ("runAsNonRoot != true"): getlago/api and
        # getlago/front carry no USER line. Founder, 2026-09-05: keep the standard, no Kyverno
        # hole for commerce. So the two images are rebased onto a non-root user by
        # lago-api.Dockerfile and lago-front.Dockerfile beside this file, built by
        # build-multiarch and tagged here by the flux-system:lago-api / lago-front ImagePolicies
        # (platform/image-automation). The tag below is a placeholder of the right shape until
        # the first main build lands; image automation rewrites the marked lines and nothing else.
        images:
          - name: getlago/api
            newName: ghcr.io/chidionyema/lago-api
            newTag: main-4876-0c9b94c758e9ce8dfebd077f5e39e3e1166a46e3 # {"$imagepolicy": "flux-system:lago-api:tag"}
          - name: getlago/front
            newName: ghcr.io/chidionyema/lago-front
            newTag: main-4876-0c9b94c758e9ce8dfebd077f5e39e3e1166a46e3 # {"$imagepolicy": "flux-system:lago-front:tag"}
          - name: getlago/lago-events-processor
            newName: docker.io/getlago/lago-events-processor
          - name: getlago/lago-gotenberg
            newName: docker.io/getlago/lago-gotenberg
          - name: alpine
            newName: docker.io/library/alpine
        patches:
          # SWITCHED OFF MEANS ABSENT. Neither of these two templates carries an `enabled`
          # guard, so helm renders them however they are configured. Removing them here is the
          # difference between a manifest that says what runs and a manifest that ships two
          # disabled husks for a reader to trip over. Kustomize's `$patch: delete` is how a
          # post-renderer drops a resource; the render is the proof it matched (the workload
          # list is pinned by tests/test_crew623_money_never_enters_the_application.py).
          - target: {kind: Deployment, name: lago-pdf}
            patch: |
              $patch: delete
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: lago-pdf }
          - target: {kind: Deployment, name: lago-events-worker}
            patch: |
              $patch: delete
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: lago-events-worker }
          # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
          - target: {kind: Service}
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-commerce
          # The pod-level half: a class the scheduler can rank, and the seccomp profile the
          # restricted profile asks for. Both kinds, because the migrate Job is a pod too and a
          # patch targeting Deployment alone never reaches it.
          - target: {kind: Deployment}
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used-kustomize-matches-on-target
              spec:
                template:
                  spec:
                    priorityClassName: platform-batch
                    securityContext:
                      seccompProfile: { type: RuntimeDefault }
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      fsGroup: 1000
          - target: {kind: Job}
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: not-used-kustomize-matches-on-target
              spec:
                template:
                  spec:
                    priorityClassName: platform-batch
                    securityContext:
                      seccompProfile: { type: RuntimeDefault }
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      fsGroup: 1000
          # The container-level half, by position rather than by name: every pod this chart
          # ships holds exactly one container, and a strategic-merge patch would have to name
          # each of the eleven separately to reach them.
          - target: {kind: Deployment}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: [ALL] }
          - target: {kind: Job}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: [ALL] }
          # THE FRONT IS NGINX AND NGINX IS UID 101. lago-front.Dockerfile runs the image's own
          # nginx user on 8080 (a non-root process cannot bind 80, and a capability added in a
          # securityContext never reaches a non-root process: the kubelet grants no ambient
          # capabilities). The pod says who it is, the container port and the Service's
          # targetPort follow the image, and the Service port stays 80 so frontUrl above holds.
          - target: {kind: Deployment, name: lago-front}
            patch: |
              - op: replace
                path: /spec/template/spec/securityContext/runAsUser
                value: 101
              - op: replace
                path: /spec/template/spec/securityContext/runAsGroup
                value: 101
              - op: replace
                path: /spec/template/spec/securityContext/fsGroup
                value: 101
              - op: replace
                path: /spec/template/spec/containers/0/ports/0/containerPort
                value: 8080
          - target: {kind: Service, name: lago-front-svc}
            patch: |
              - op: replace
                path: /spec/ports/0/targetPort
                value: 8080
          # A DOOR THAT ANSWERS. The chart ships livenessProbe values for its eight Rails and
          # Sidekiq components and none for the front, so the cluster's require-pod-probes
          # refuses it. nginx serves the built single-page app at / on the port the non-root
          # image listens on (lago-front.Dockerfile, 8080), so this is the real
          # surface answering, not a probe written to satisfy a policy: readiness keeps the
          # Service from routing at a pod that has not finished starting, and liveness restarts
          # one whose nginx has wedged. Both are the same URL because there is only one.
          - target: {kind: Deployment, name: lago-front}
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe
                value:
                  httpGet: { path: /, port: 8080 }
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe
                value:
                  httpGet: { path: /, port: 8080 }
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 2
                  failureThreshold: 3
