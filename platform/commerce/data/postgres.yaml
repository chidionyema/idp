# The isolated ledger (founder 2026-08-29: "records the revenue in its own isolated ledger").
# Same shape as platform/llm/postgres.yaml: a headless ClusterIP Service reachable only inside
# the namespace, the official alpine image, the password read from a mounted file and never
# from an env var. It is deliberately NOT the prospector database: the money ledger and the
# application's tables must be able to disagree, and be reconciled, without a shared schema.
#
# Cost note (LAW 14): this is the estate's seventh Postgres. platform/features/features.yaml
# `shared.postgres` tracks that count with a target of one; consolidation is that work item,
# not this one, and a money ledger is the last database that should be merged into a shared one.
apiVersion: v1
kind: Service
metadata:
  name: commerce-db
  namespace: commerce
  labels: { app.kubernetes.io/name: commerce-db, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-commerce }
spec:
  type: ClusterIP
  clusterIP: None
  selector: { app.kubernetes.io/name: commerce-db }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: commerce-db
  namespace: commerce
  labels: { app.kubernetes.io/name: commerce-db, app.kubernetes.io/part-of: idp }
spec:
  serviceName: commerce-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: commerce-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: commerce-db, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      priorityClassName: platform-batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # postgres uid in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6-alpine
          env:
            - { name: POSTGRES_USER, value: lago }
            - { name: POSTGRES_DB, value: lago }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/commerce/POSTGRES_PASSWORD }
          ports:
            - { containerPort: 5432, name: pg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "lago", "-d", "lago"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "lago", "-d", "lago"] }
            periodSeconds: 30
            failureThreshold: 3
          # Guaranteed QoS (crew#539 CP9): requests == limits, so the ledger is the last thing
          # the kubelet evicts under memory pressure.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: creds, mountPath: /run/secrets/commerce, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: creds
          secret: { secretName: lago-credentials }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
