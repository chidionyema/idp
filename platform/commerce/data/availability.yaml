# crew#539/#555: a budget whose floor equals the replica count refuses every drain for ever
# (what the clickhouse PDB did to the drain of 2026-08-28 06:30:43Z). maxUnavailable 1 lets a
# node be drained. These are single-replica while dark; at cutover the API becomes
# founder-facing and the availability gate will force two replicas, which is correct: the
# checkout URL endpoint must survive one node.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: commerce-redis
  namespace: commerce
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commerce-redis
