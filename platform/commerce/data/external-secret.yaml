# Every credential this layer needs, from OCI Vault through ClusterSecretStore estate-vault.
# No value is typed in this repository and none is ever printed (R49, LAW 46). The vault
# two estate-minted entries are born in platform/oci/commerce.tf (Terraform `random_password` +
# `oci_vault_secret`, the same path as healthchecks and langfuse), applied by oke-check. The
# third, `commerce-payment-provider`, holds the payment provider's own keys and is minted from
# one root secret at the provider (R52) at crew#623 CP3. Until then this layer's Kustomization
# is suspended, so nothing dry-runs against a key that is not there yet.
#
# Why the payment keys live HERE and not in prospector-store-api-env: that is the whole
# request. The .NET API must not be able to reach Stripe even if someone re-adds the SDK to it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lago-credentials
  namespace: commerce
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  # The chart reads one Secret by this name (global.existingSecret in lago 1.28.0 values.yaml,
  # read from the chart tarball on 2026-08-29). Every `secretKeyRef` in its templates against
  # that name asks for three keys, not two -- databaseUrl, redisUrl AND redisCacheUrl -- and
  # none of the three is marked optional, so a missing redisCacheUrl is an api pod that never
  # starts. platform/oci/commerce.tf writes all three, plus POSTGRES_PASSWORD, which
  # postgres.yaml mounts from this same Secret so the database and its URL cannot drift.
  target: { name: lago-credentials, creationPolicy: Owner }
  dataFrom:
    - extract: { key: commerce-lago-credentials }
---
# Lago encrypts customer and payment-method data at rest with these three keys
# (encryption.existingSecret in the chart). Lose them and the ledger is unreadable; they are
# generated once by the pipeline and never regenerated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lago-encryption
  namespace: commerce
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: lago-encryption, creationPolicy: Owner }
  dataFrom:
    - extract: { key: commerce-lago-encryption }
---
# The payment-provider keys. This is the entry the .NET API must never be able to read: it is
# scoped to namespace commerce, and prospector's ServiceAccounts have no access to it.
# Holds the provider secret key and the webhook signing secret, in TEST mode until cutover.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-payment-provider
  namespace: commerce
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: commerce-payment-provider, creationPolicy: Owner }
  dataFrom:
    - extract: { key: commerce-payment-provider }
