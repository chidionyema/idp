# The commerce primitive (founder 2026-08-29: "we ban money from the application logic
# entirely ... a firewall between the internet's money and your application's logic").
#
# The layer was switched on on 2026-09-04 and this namespace still carries no
# idp.estate/edge-attach label and no availability.idp/tier label -- deliberately. Running is not
# the same as reachable: the Gateway in prospector accepts an HTTPRoute only from a labelled
# namespace, so there is no path from the internet to the ledger even if a route were added by
# mistake. Lago is driven from inside the cluster until it has a hostname of its own, which needs
# a listener and a certificate on that Gateway and is a change in prospector, not here. Both
# labels go on in that change, with the payment provider, on the founder's word (LAW 11).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: commerce
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
