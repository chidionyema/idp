# The commerce primitive (founder 2026-08-29: "we ban money from the application logic
# entirely ... a firewall between the internet's money and your application's logic").
#
# No idp.estate/edge-attach label and no availability.idp/tier label while this layer is dark:
# the Gateway in prospector will not accept an HTTPRoute from this namespace, so there is no
# path from the internet to it even if a route were added by mistake. Both labels go on at
# cutover, in the PR that moves the live money path, on the founder's word (LAW 11).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: commerce
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
