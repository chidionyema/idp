# Lago runs its background work on Sidekiq, which needs a Redis-protocol server: the webhook
# that says "this invoice is paid" is processed by a worker, not in the request. Valkey is the
# BSD-licensed continuation of Redis 7.2 and is protocol-compatible; the estate does not adopt
# the Redis source-available licence for a new layer (LAW 19, portability outranks convenience).
#
# It is persistent, not an emptyDir cache: a queue that loses its jobs on a restart loses a
# payment confirmation, and nobody would ever know. That is the silent-green class.
apiVersion: v1
kind: Service
metadata:
  name: commerce-redis
  namespace: commerce
  labels: { app.kubernetes.io/name: commerce-redis, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-commerce }
spec:
  type: ClusterIP
  clusterIP: None
  selector: { app.kubernetes.io/name: commerce-redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: commerce-redis
  namespace: commerce
  labels: { app.kubernetes.io/name: commerce-redis, app.kubernetes.io/part-of: idp }
spec:
  serviceName: commerce-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: commerce-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: commerce-redis, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      priorityClassName: platform-batch
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1-alpine
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports:
            - { containerPort: 6379, name: redis }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 50m, memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            # crew#458: readOnlyRootFilesystem with nowhere to write is a pod that starts and
            # then fails the first time anything reaches for a temp file. An emptyDir, not a
            # volume off the claim: nothing here is worth keeping across a restart.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
