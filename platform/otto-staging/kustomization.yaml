# Otto staging (founder order 2026-09-01). Same image as platform/hermes-agent, pinned to the
# same tag deliberately -- one build, two commands. No Flux image-automation policy here: that
# is a second thing to keep in sync for a staging lane that is not this branch's job; bump this
# tag by hand alongside hermes-agent's until this lane earns its own policy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otto-staging
resources:
  - namespace.yaml
  - quota.yaml
  - network-policy.yaml
  - telegram-secret.yaml
  - config.yaml
  - deployment.yaml
  - httproute.yaml
images:
  - name: ghcr.io/chidionyema/hermes-agent
    newTag: main-58-0b9c24164b2b9d36c591e0391c97c9c41eaa95a3
