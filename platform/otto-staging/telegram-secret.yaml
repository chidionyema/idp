# The staging bot's token. Same shape as platform/hermes-agent/mac-run-key.yaml: one vault
# entry, decoded into a Kubernetes Secret that is mounted as a file, never as a pod env var --
# Kyverno's secrets-not-from-env-vars policy (platform/edge/kyverno-secrets-policy.yaml)
# refuses env.valueFrom.secretKeyRef and envFrom.secretRef on a Pod (Audit today, Enforce once
# the fleet is clean; litellm's envFrom secretRef was refused outright the same way on
# 2026-08-26, crew#284). deployment.yaml's container reads the file and exports it as
# OTTO_TELEGRAM_BOT_TOKEN itself, before exec'ing python -m otto.boot.
#
# The token is born on the founder's phone in @BotFather and enters the estate through the
# human door (decision 0017): he saves it as the Bitwarden secret `otto-staging-telegram`
# from his phone's browser, and this vault-fed secret pulls it through the `human-vault`
# ClusterSecretStore -- never a terminal, an env file or a chat (LAW 46, LAW 52; the old
# env-file hand was retired 2026-09-02 on the founder's word, docs/runbooks/otto-staging.md).
# If the Bitwarden secret is absent, the read fails and the row's healthCheck reports the
# missing Secret by name, never a value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otto-staging-telegram
  namespace: otto-staging
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: human-vault }
  target:
    name: otto-staging-telegram
    creationPolicy: Owner
  data:
    - secretKey: OTTO_TELEGRAM_BOT_TOKEN
      remoteRef: { key: otto-staging-telegram }
