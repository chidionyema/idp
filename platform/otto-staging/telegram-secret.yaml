# The staging bot's token. Same shape as platform/hermes-agent/mac-run-key.yaml: one vault
# entry, decoded into a Kubernetes Secret that is mounted as a file, never as a pod env var --
# Kyverno's secrets-not-from-env-vars policy (platform/edge/kyverno-secrets-policy.yaml)
# refuses env.valueFrom.secretKeyRef and envFrom.secretRef on a Pod (Audit today, Enforce once
# the fleet is clean; litellm's envFrom secretRef was refused outright the same way on
# 2026-08-26, crew#284). deployment.yaml's container reads the file and exports it as
# OTTO_TELEGRAM_BOT_TOKEN itself, before exec'ing python -m otto.boot.
#
# The vault entry `otto-staging-telegram` is seeded from the operator env file, never a console
# click and never typed here (LAW 46, LAW 52): the raw token from @BotFather goes into
# $ESTATE_ENV_FILE as OTTO_STAGING_TELEGRAM_BOT_TOKEN, then
# `bin/idp-vault-put otto-staging-telegram token=OTTO_STAGING_TELEGRAM_BOT_TOKEN`
# (docs/runbooks/otto-staging.md; seeded 2026-09-02). If the entry is ever absent, this
# ExternalSecret's SecretStore read fails and the row's healthCheck reports the missing Secret
# by name, never a value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otto-staging-telegram
  namespace: otto-staging
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: otto-staging-telegram
    creationPolicy: Owner
  data:
    - secretKey: OTTO_TELEGRAM_BOT_TOKEN
      remoteRef: { key: otto-staging-telegram, property: token }
