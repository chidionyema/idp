# Otto staging's public door. The shared Gateway (prospector-edge, defined in the prospector-main
# repo, out of scope here) already carries a listener named https-otto for hostname
# otto.${ESTATE_ZONE} -- platform/hermes-agent/httproute.yaml owns the path /telegram on it today
# for the production gateway. This route attaches to the SAME listener and hostname (no new
# listener needed, nothing to change in prospector-main) and claims only the two paths the fixed
# deploy contract names: POST /telegram-webhook and GET /healthz. Gateway API merges rules from
# multiple HTTPRoutes bound to one listener/hostname pair; the paths here do not collide with
# hermes-agent's /telegram, so both routes coexist unchanged.
#
# Nothing else on this host is exposed -- no catch-all path, so a request to any other path on
# otto.${ESTATE_ZONE} falls through to whichever other route (or Traefik's own default) already
# owns it; this route adds no new surface beyond the two paths the contract names.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otto-staging
  namespace: otto-staging
  annotations:
    # The webhook door is authenticated at the gateway, not in the pod (founder edict
    # 2026-09-02: auth is infrastructure physics; the app stays ignorant of it). The rule
    # below forwards a POST only when X-Telegram-Bot-Api-Secret-Token exactly matches the
    # vault-fed value; a missing or wrong header never reaches the pod (GHSA-3vpc-7q5r-276h).
    # tests/test_front_door_every_route_is_behind_the_one_login.py holds this proof.
    idp.estate/auth: telegram-webhook-secret-token
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-otto
  hostnames:
    - "otto.${ESTATE_ZONE}"
  rules:
    - matches:
        - path:
            type: Exact
            value: /telegram-webhook
          method: POST
          # Exact header match at the edge: Telegram echoes the secret_token registered at
          # setWebhook in this header on every delivery. The value is substituted by Flux from
          # the otto-webhook Secret (platform/otto-staging-secret/, vault entry
          # otto-staging-telegram property webhook_secret) -- no literal in git (LAW 46).
          headers:
            - type: Exact
              name: X-Telegram-Bot-Api-Secret-Token
              value: "${OTTO_WEBHOOK_SECRET}"
      backendRefs:
        - name: otto-staging
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /healthz
          method: GET
      backendRefs:
        - name: otto-staging
          port: 8080
