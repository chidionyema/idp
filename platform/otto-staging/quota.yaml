# crew#191 fence, half of it (network-policy.yaml is the other half). One pod, one replica
# (deployment.yaml), so the ceiling is deliberately small -- a runaway staging process cannot
# starve the node the way an uncapped one could.
apiVersion: v1
kind: LimitRange
metadata:
  name: otto-staging-defaults
  namespace: otto-staging
spec:
  limits:
    - type: Container
      default: { cpu: 200m, memory: 256Mi }
      defaultRequest: { cpu: 50m, memory: 128Mi }
      max: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: otto-staging-ceiling
  namespace: otto-staging
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    pods: "5"
