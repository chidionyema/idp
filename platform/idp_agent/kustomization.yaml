# The idp_agent platform (docs/specs/orbstack-event-driven-agents.md). One image per workload,
# pinned here; Flux image automation would move the tag the same way hermes-agent's does, once
# this platform has a real image built and pushed (not yet -- see the spec's "what is not yet
# built" section).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: idp-agent
resources:
  - k8s/namespace.yaml
  - k8s/redis.yaml
  - k8s/engine-deployment.yaml
  - k8s/gateway-deployment.yaml
