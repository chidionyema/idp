# The engine fleet: N stateless pods competing for tasks via Redis BLPOP.
# See docs/specs/orbstack-event-driven-agents.md.
#
# No docker.sock, no privileged access: mounting the host's Docker socket
# is a known container-escape vector, and this cluster's Kyverno policy set
# already refuses that shape of access (readOnlyRootFilesystem, non-root,
# no added capabilities -- the same pattern platform/jit/deployment.yaml
# runs). IDP_SKIP_LOCAL_VACUUM=1 below means the in-cluster engine defers
# CI validation to GitHub Actions (the same 14 checks that already gate
# every PR in this repository) instead of trying to run Docker-in-Docker;
# platform/idp_agent/engine.py's run_orbstack_vacuum documents this in full.
#
# GH_TOKEN arrives as a file minted by external-secrets' own GithubAccessToken
# generator, the same pattern platform/mcp/external-secret.yaml and
# platform/hermes-agent/gateway.yaml already use: ESO mints and refreshes the
# token at the platform layer (10m refreshInterval, well inside the token's
# 60-minute life), narrowed to the estate-agents App's agent-workforce lane
# (platform/github-app/lanes.json). No OCI credential, no vault access, and
# no bin/idp-cloud call inside this pod at all -- freshness is a property of
# the platform layer, never of the workload (same reasoning as hermes-agent's
# own comment on this exact pattern).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idp-engine-github-app-pem
  namespace: idp-agent
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: idp-engine-github-app-pem
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .pem_b64 | b64dec }}"
  dataFrom:
    - extract: { key: github-app }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: idp-engine-github
  namespace: idp-agent
spec:
  appID: ${githubAppIDQuoted}
  installID: ${githubAppInstallationIDQuoted}
  # Mirrors platform/github-app/lanes.json's agent-workforce lane exactly: open/update
  # PRs, push to a branch; never merge, dispatch a workflow, or reach a cluster.
  permissions:
    metadata: read
    contents: write
    pull_requests: write
    issues: write
    actions: read
    checks: read
  auth:
    privateKey:
      secretRef:
        name: idp-engine-github-app-pem
        key: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idp-engine
  namespace: idp-agent
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: idp-engine, creationPolicy: Owner }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: idp-engine-github
      rewrite:
        - transform: { template: "GH_TOKEN" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-engine
  namespace: idp-agent
  labels: { app.kubernetes.io/name: idp-engine }
spec:
  replicas: 10
  selector:
    matchLabels: { app.kubernetes.io/name: idp-engine }
  template:
    metadata:
      labels: { app.kubernetes.io/name: idp-engine }
    spec:
      serviceAccountName: idp-engine
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: engine
          image: ghcr.io/chidionyema/idp-engine
          command: [python3, platform/idp_agent/engine.py]
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://signoz-otel-collector.observability.svc:4318 }
            - { name: REDIS_URL, value: "redis://idp-agent-redis:6379" }
            - { name: GH_TOKEN_FILE, value: /etc/idp-engine-secrets/GH_TOKEN }
            - { name: IDP_SKIP_LOCAL_VACUUM, value: "1" }
            - { name: IDP_CI_COMMAND, value: bin/idp-ci }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          volumeMounts:
            # 0400, owned by the one uid the container runs as: the kubelet writes these
            # files and nothing in the pod can rewrite them. Read fresh on every task
            # (mint_gh_token() reopens the file per call, engine.py does not cache it at
            # import time), so a token ESO rotates mid-run is picked up without a restart.
            - { name: secrets, mountPath: /etc/idp-engine-secrets, readOnly: true }
            - { name: workspace-tmp, mountPath: /tmp }
      volumes:
        - { name: secrets, secret: { secretName: idp-engine, defaultMode: 0400 } }
        # readOnlyRootFilesystem needs somewhere writable for
        # tempfile.TemporaryDirectory's ephemeral workspaces.
        - { name: workspace-tmp, emptyDir: { sizeLimit: 4Gi } }
