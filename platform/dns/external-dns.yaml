# external-dns writes Cloudflare from HTTPRoute hostnames and the Gateway's load-balancer address.
# The token comes from platform/prospector/cloudflare.sops.yaml (Secret cloudflare-api-token in
# this namespace, key CF_API_TOKEN), scoped to Zone:DNS:Edit on mumchimp.com.
#
# Policy is upsert-only with a TXT registry: it creates and updates only records it owns and
# never deletes. Records that predate it (the Fly CNAMEs) are foreign to it and are removed once
# by hand; docs/onboarding/oci.md has the step.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: edge
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: edge
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
  values:
    provider:
      name: cloudflare
    sources:
      - gateway-httproute
    policy: upsert-only
    txtOwnerId: oke-estate
    domainFilters:
      - mumchimp.com
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: CF_API_TOKEN
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
