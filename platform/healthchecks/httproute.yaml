# hc.<zone>, two routes on one listener (https-hc on the shared Gateway, prospector-main
# deploy/k8s/base/edge.yaml). The screen is behind the one login like the catalogue and the trace
# store (platform/observability/httproute.yaml). The /ping/ path is the one the jobs call from a
# curl in hc-wrap.sh; it cannot sit behind a browser login, and Healthchecks authenticates it with
# the project ping key in the URL (/ping/<key>/<slug>), the vault entry healthchecks-ping-key.
# tests/test_front_door_every_route_is_behind_the_one_login.py holds both parts of that proof.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-forward-auth
  namespace: healthchecks
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: healthchecks
  namespace: healthchecks
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-hc
  hostnames:
    - "hc.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /oauth2/ }
      backendRefs:
        - name: oauth2-proxy
          namespace: identity
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth
      backendRefs:
        - name: healthchecks
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: healthchecks-ping
  namespace: healthchecks
  annotations:
    idp.estate/auth: healthchecks-ping-key
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-hc
  hostnames:
    - "hc.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /ping/ }
      backendRefs:
        - name: healthchecks
          port: 8000
