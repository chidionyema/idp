# Non-secret settings (hc/settings.py names). The secrets are the ExternalSecret next to this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthchecks-env
  namespace: healthchecks
data:
  DEBUG: "False"
  DB: postgres
  DB_HOST: estate-rw.estate-db.svc.cluster.local   # the one estate Postgres (platform/estate-db)
  DB_PORT: "5432"
  DB_NAME: hc
  DB_USER: hc
  SITE_ROOT: "https://hc.${ESTATE_ZONE}"
  ALLOWED_HOSTS: "hc.${ESTATE_ZONE}"
  SITE_NAME: "Estate jobs"
  REGISTRATION_OPEN: "False"
  # Traefik's ForwardAuth copies oauth2-proxy's X-Auth-Request-Email onto the request
  # (platform/healthchecks/httproute.yaml Middleware); Django sees it as this META key.
  REMOTE_USER_HEADER: HTTP_X_AUTH_REQUEST_EMAIL
  SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,https"
  # No outbound mail: the estate has no SMTP row; the screen is the instrument (LAW 28).
  EMAIL_HOST: ""
