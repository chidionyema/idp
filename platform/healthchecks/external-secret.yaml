# Every value the row needs comes from the estate vault; nothing is typed by a person (crew#227).
# The three healthchecks-* entries are generated by platform/oci/healthchecks.tf; the founder's
# email is the entry Langfuse already reads (platform/oci/langfuse.tf), so there is one of it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks
  namespace: healthchecks
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: healthchecks
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef: { key: healthchecks-secret-key }
    - secretKey: DB_PASSWORD
      remoteRef: { key: healthchecks-db-password }
    - secretKey: PING_KEY
      remoteRef: { key: healthchecks-ping-key }
    - secretKey: RO_KEY
      remoteRef: { key: healthchecks-ro-key }
    - secretKey: FOUNDER_EMAIL
      remoteRef: { key: langfuse-init-user-email }
---
# Postgres reads its password as a file (POSTGRES_PASSWORD_FILE), the same shape as temporal-db.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-db
  namespace: healthchecks
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: healthchecks-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: healthchecks-db-password }
