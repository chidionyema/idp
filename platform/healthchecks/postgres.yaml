# Healthchecks persistence. Same shape as platform/temporal/postgres.yaml (crew#396) and
# platform/llm/postgres.yaml (crew#284): one StatefulSet, non-root, read-only root, password from a
# mounted Secret. One database, hc; the app runs its own migrations on start.
apiVersion: v1
kind: Service
metadata:
  name: healthchecks-db
  namespace: healthchecks
  labels: { app.kubernetes.io/name: healthchecks-db, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-jobs }
spec:
  type: ClusterIP
  clusterIP: None
  selector: { app.kubernetes.io/name: healthchecks-db }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: healthchecks-db
  namespace: healthchecks
  labels: { app.kubernetes.io/name: healthchecks-db, app.kubernetes.io/part-of: idp }
spec:
  serviceName: healthchecks-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: healthchecks-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: healthchecks-db, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # postgres uid in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6-alpine
          env:
            - { name: POSTGRES_USER, value: hc }
            - { name: POSTGRES_DB, value: hc }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/healthchecks-db/password }
          ports:
            - { containerPort: 5432, name: pg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "hc", "-d", "hc"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "hc", "-d", "hc"] }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: secret, mountPath: /run/secrets/healthchecks-db, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secret
          secret: { secretName: healthchecks-db }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
