# Job monitoring, crew/docs/STANDARDS.md row 21 (crew#177): Healthchecks, the dead-man switch every
# periodic job on the estate pings through ~/.claude/scripts/hc-wrap.sh. It is the one instrument
# that tells PASS from NOT RUN. Restricted like every other row; the edge-attach label is what the
# shared Gateway selects on (platform/observability/namespace.yaml has the same pair).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: healthchecks
  labels:
    pod-security.kubernetes.io/enforce: restricted
    availability.idp/tier: founder-facing
    idp.estate/edge-attach: "true"
