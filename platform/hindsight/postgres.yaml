# Hindsight's Postgres needs pgvector. The chart's bundled one is `ankane/pgvector:latest` with no
# securityContext and the password in values (helm/hindsight/values.yaml, chart 0.9.2): that pod
# cannot be admitted to a `restricted` namespace and a buyer's engineer would read the password.
# So `postgresql.enabled: false` and this StatefulSet, the exact shape of platform/temporal/postgres.yaml
# (LAW 2 fractal) on the official pgvector image, pinned.
apiVersion: v1
kind: Service
metadata:
  name: hindsight-db
  namespace: hindsight
  labels: { app.kubernetes.io/name: hindsight-db, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-hindsight }
spec:
  type: ClusterIP
  clusterIP: None
  selector: { app.kubernetes.io/name: hindsight-db }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hindsight-db
  namespace: hindsight
  labels: { app.kubernetes.io/name: hindsight-db, app.kubernetes.io/part-of: idp }
spec:
  serviceName: hindsight-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: hindsight-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hindsight-db, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # postgres uid in the debian-based pgvector image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector:0.8.6-pg17
          env:
            - { name: POSTGRES_USER, value: hindsight }
            - { name: POSTGRES_DB, value: hindsight }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/hindsight-env/postgres-password }
          ports:
            - { containerPort: 5432, name: pg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "hindsight", "-d", "hindsight"] }
            periodSeconds: 10
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: secret, mountPath: /run/secrets/hindsight-env, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secret
          secret: { secretName: hindsight-env }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
