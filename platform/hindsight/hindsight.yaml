# crew#524 CP1 (founder, 2026-08-27: "supercharge"). The Architect's memory provider is Hindsight
# (hermes-v2 config.yaml `memory.provider: hindsight`); on the Mac it pointed at nobody, and the
# client's default is a hosted SaaS (api.hindsight.vectorize.io) that would carry the estate's
# memories out. This is the vendor's own chart (vectorize-io/hindsight, MIT, LAW 43), pinned,
# on the pgvector Postgres beside it, with the LLM behind the estate's one router.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hindsight
  namespace: hindsight
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/vectorize-io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: hindsight
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: hindsight
      version: 0.9.2
      sourceRef:
        kind: HelmRepository
        name: hindsight
  install:
    # crew#524 CP1 (2026-08-27): 4 installs failed on 'Deployment hindsight-api status Failed' and the
    # release stalled with no pod evidence left; one more attempt per hour lets the 15-min
    # cluster-state snapshot catch the pod's own reason (LAW 29: attribute before repair).
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    existingSecret: hindsight-env   # platform/hindsight/external-secret.yaml
    postgresql:
      enabled: false                # platform/hindsight/postgres.yaml
      external:
        host: estate-rw.estate-db.svc.cluster.local   # the one estate Postgres (platform/estate-db)
        port: 5432
        database: hindsight
        username: hindsight
    api:
      env:
        # An alias on the estate router (platform/llm/config.yaml), so a lane swap never touches this row.
        HINDSIGHT_API_LLM_PROVIDER: openai
        # `gemini` (gemini-2.5-flash), not deepseek: DeepSeek answers 401 from inside the router pod
        # (measured 2026-09-04 21:5xZ) and its row has left the config, so extraction had no model.
        # This is the estate's memory: memory_units written per day fell 268 (08-30), 154 (09-02),
        # 14 (09-03), 1 (09-04), counted on estate-db. Extraction is many small calls, so the cheap
        # gemini lane is the right one, and it does not wait on a key the founder rotates himself.
        # `gemini`, not the `fast` alias for the same gemini-2.5-flash row: one alias for this
        # model across the estate, so a lane audit reads one name (founder direction 2026-09-05).
        HINDSIGHT_API_LLM_MODEL: gemini
      persistence:
        modelCache: { enabled: true, size: 5Gi }   # the local embedding model survives a restart
      extraVolumes: [{ name: tmp, emptyDir: {} }]  # the only writable path besides the model cache
      extraVolumeMounts: [{ name: tmp, mountPath: /tmp }]
      resources:
        requests: { cpu: 50m, memory: 1Gi }   # crew#584 zealot rule 1: micro CPU request, burst limit; the memory floor stays (incident-set)
        limits: { cpu: "1", memory: 2Gi }
    worker:
      enabled: false                # one api pod runs its internal worker; a second is a second copy
    controlPlane:
      enabled: false                # the UI is a surface nobody is onboarded to yet (LAW 36)
    tei:
      embedding: { enabled: false } # api embeds in-process; TEI is a second model server
      reranker: { enabled: false }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
  # crew#573, measured 2026-08-28 (oke-check 33172282641). hindsight-api ran 13h at 0/1 ready and
  # was SIGKILLed 392 times, and the reason was destroyed on every one of them. The chart gives the
  # api a livenessProbe and a readinessProbe and no startupProbe, so the kubelet has no way to tell a
  # slow start from a hang:
  #
  #     Liveness:   http-get http://:8888/health/live delay=30s timeout=5s period=10s #failure=3
  #     Readiness:  http-get http://:8888/health      delay=10s timeout=3s period=5s  #failure=3
  #     Last State: Terminated  Reason: Error  Exit Code: 137
  #     Warning Unhealthy 12m (x2144 over 13h)  Readiness probe failed: ... connect: connection refused
  #     Normal  Killing   5m1s (x133 over 13h)  Container api failed liveness probe, will be restarted
  #     Warning BackOff   95s  (x392 over 8h)   Back-off restarting failed container api
  #
  # `connection refused` and not a 5xx is the whole diagnosis: nothing was listening on 8888. uvicorn
  # logged `Waiting for application startup.` and never `Application startup complete.`, because the
  # FastAPI lifespan blocks retrying `Verifying connection: openai/groq` and a lifespan that blocks
  # never binds its port. Liveness then fires at 30s and kills the container at ~60s -- before the
  # retry that would have named the unreachable host ever finishes, and taking the logs with it. The
  # instrument meant to catch the hang is what destroyed its cause (LAW 28, LAW 29).
  #
  # A startupProbe is the kubelet's own answer and needs no script (LAW 43): liveness and readiness
  # are both suspended until it succeeds once, so the pod stops being recycled mid-diagnosis and the
  # 2144 readiness warnings stop being emitted for a port that was never going to be open yet. The
  # chart cannot do this from values -- `helm template` 0.9.2 renders only `livenessProbe` and
  # `readinessProbe` from `.Values.api`, so an `api.startupProbe:` key would be silently ignored --
  # which is why this is a postRenderer and not another value above.
  #
  # 10 x 60 = 600s, and the bound is not arbitrary: `spec.timeout` above is 15m and `spec.install`
  # sets none of its own, so 15m is what Flux gives the install; a startup
  # budget has to sit inside it or the release fails before the pod could ever have succeeded. It
  # also has to cover the worst honest cold start, which here is the local embedding model landing in
  # the modelCache PVC on first boot. 10m under a 15m timeout is the largest budget that still leaves
  # Flux room to report the failure. Past it, liveness takes over exactly as the chart intended.
  #
  # This makes the pod sit not-ready instead of crash-looping, which is only an improvement because
  # the estate can now see a not-ready pod: `KubePodNotReady` is declared in platform/monitoring and
  # had never fired, because `monitoring` was gated behind an optional consumer (idp#601). The two
  # changes are one fix -- alone, this one would trade a loud silence for a quiet one.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-hindsight
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-hindsight
          - target: { kind: Deployment, name: hindsight-api }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: hindsight-api }
              spec:
                template:
                  spec:
                    containers:
                      - name: api
                        startupProbe:
                          httpGet: { path: /health/live, port: 8888 }
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 60
