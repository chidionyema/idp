{{- /*
One PushSecret per key, never one per source Secret. This replaces bin/idp-vendor-render's
seed() and the file it committed.

Grouping several keys into one object would tie them together: a single field the estate has
never held -- MOONSHOT_API_KEY sits in the registry and in no Secret -- fails the whole object
and seeds none of its siblings. One key, one object, one failure.

Keyed by (namespace, name), not by name: one Bitwarden secret is often held in more than one
place -- TELEGRAM_ALERTS_BOT_TOKEN sits in flux-system/flux-telegram and in
notify/notify-apprise-founder-telegram. Seeding from every holder costs nothing (IfNotExists
means the first one to arrive wins and the rest no-op) and means the seed still happens when
one of the holders does not exist yet.

A target with no vault `entry` has no cluster Secret to seed Bitwarden FROM: the founder's copy
IS the only copy (minimax, 2026-09-10, after the vault copies were proved revoked and unset).
Nothing to push, so no PushSecret -- the ExternalSecret in the other direction is the whole
relationship.
*/ -}}
{{- $reg := .Files.Get "consoles.yaml" | fromYaml -}}
{{- $rows := dict -}}
{{- range $name, $v := $reg.vendors }}
{{- if eq (default "" $v.store_default) "human-vault" }}
{{- range $t := (default (list) $v.targets) }}
{{- if and $t.bw $t.ns (not $t.derived) $t.entry }}
{{- $k := printf "%s|%s" $t.ns $t.bw }}
{{- if not (hasKey $rows $k) }}
{{- $_ := set $rows $k (dict "ns" $t.ns "bw" $t.bw "entry" $t.entry "field" $t.field) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $k, $r := $rows }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: seed-{{ $r.bw | lower | replace "_" "-" }}
  namespace: {{ $r.ns }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: human-vault }
  selector:
    secret: { name: {{ $r.entry }} }
  data:
    - match:
        secretKey: {{ $r.field }}
        remoteRef: { remoteKey: {{ $r.bw }} }
{{- end }}
