{{- /*
One ExternalSecret per vendor per namespace, from the `targets:` of every vendor in
consoles.yaml whose store_default is human-vault. This replaces bin/idp-vendor-render's
bridge() and the file it committed.

Why one ExternalSecret per vendor rather than one per namespace holding every key: External
Secrets fails an ExternalSecret whole when any one of its `data` entries names a secret the
store does not hold. Split this way, a vendor whose key has not been dropped in yet fails only
its own Secret, and its status line names exactly which key is missing -- so the set of failing
bridge ExternalSecrets IS the list of keys still to add, with no separate inventory to keep true.

Addressing is by name, not by Bitwarden id, and that is load-bearing. `dataFrom.find` was
measured on 2026-09-07 against bitwarden-sdk-server v0.6.0 and it IGNORES `name.regexp`: a find
for `^NO_SUCH_KEY_AT_ALL$` returned the project's unrelated secret and `rewrite` then renamed it
onto the field. A bridge built on find would quietly serve one vendor's value under every other
vendor's key. `data[].remoteRef.key: <name>` resolves exactly, and refuses when the name is
absent, which is the behaviour a credential path must have.

`derived:` targets are computed from another field (kimi's API base is the key's host), so no
human ever drops them anywhere and nothing bridges them.

Helm ranges a map in sorted key order, so this output is deterministic for a given registry.
*/ -}}
{{- $reg := .Files.Get "consoles.yaml" | fromYaml -}}
{{- if not $reg.vendors -}}
{{- fail "consoles.yaml has no `vendors:` key -- a broken registry is blindness, not drift" -}}
{{- end -}}
{{- range $name, $v := $reg.vendors }}
{{- if eq (default "" $v.store_default) "human-vault" }}
{{- $byNs := dict }}
{{- range $t := (default (list) $v.targets) }}
{{- if and $t.bw $t.ns (not $t.derived) }}
{{- $fields := (index $byNs $t.ns) | default dict }}
{{- $_ := set $fields $t.field $t.bw }}
{{- $_ := set $byNs $t.ns $fields }}
{{- end }}
{{- end }}
{{- range $ns, $fields := $byNs }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: human-{{ $name | replace "_" "-" }}
  namespace: {{ $ns }}
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: human-vault }
  target: { name: human-{{ $name | replace "_" "-" }}, creationPolicy: Owner }
  data:
{{- range $f := (keys $fields | sortAlpha) }}
    - secretKey: {{ $f }}
      remoteRef: { key: {{ index $fields $f }} }
{{- end }}
{{- end }}
{{- end }}
{{- end }}
