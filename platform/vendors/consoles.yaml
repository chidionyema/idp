        \    api_key: os.environ/CEREBRAS_API_KEY\n    # 0.25s measured. Short for\
        \ the same reason the groq row gives: a free lane that\n    # takes minutes\
        \ to refuse is not a floor.\n    timeout: 60\n    max_tokens: 8192\n  model_info:\n\
        \    max_input_tokens: 65536\n\n# --- the other two Cerebras accounts, same\
        \ model_name on purpose, same reason as the\n# three groq deployments above:\
        \ a pool, not a single point of failure, so the router's\n# own cooldown does\
        \ the self-healing instead of a fallback chain re-attempting a dead\n# key\
        \ fresh on every call. Verified live 2026-09-15, same three-model catalogue\n\
        # (gemma-4-31b, gpt-oss-120b, qwen-3.8-27b) as the primary account on both\
        \ keys.\n- model_name: cerebras\n  litellm_params:\n    model: openai/gpt-oss-120b\n\
        \    api_base: https://api.cerebras.ai/v1\n    api_key: os.environ/CEREBRAS_API_KEY_2\n\
        \    timeout: 60\n    max_tokens: 8192\n  model_info:\n    max_input_tokens:\
        \ 65536\n\n- model_name: cerebras\n  litellm_params:\n    model: openai/gpt-oss-120b\n\
        \    api_base: https://api.cerebras.ai/v1\n    api_key: os.environ/CEREBRAS_API_KEY_3\n\
