# Vendor credential registry for bin/idp-bootstrap-vendors (crew#66 root trust, crew#579; R52).
#
# R52 (founder 2026-08-29): one root credential per provider, made by the founder once on his own
# machine and set as a named repository secret; code does everything after that. None of these
# vendors publishes a create-key API (measured 2026-08-28: Anthropic's Admin API lists and updates
# keys but does not create them; OpenRouter's /api/v1/keys needs a provisioning key that is itself
# console-born; DeepSeek, Minimax, Exa and Stripe publish no key API; BotFather has no HTTP
# API), so for each of them the API key IS the root: the founder makes it once at `page`, runs
# `gh secret set <secret> -R chidionyema/idp`, and never touches that vendor again. The bootstrapper
# reads the secret from its environment in the apply run, proves it against `verify` (anything but
# 2xx is a FAIL before any vault write, LAW 15), and writes every target with bin/idp-vault-put
# --merge. No browser is ever driven; nothing is ever pasted into a prompt; no value is printed.
#
# Fields: kind (secret), secret (the repository secret name the apply run maps into the
# environment), page (where the founder makes the key, once; documentation only), shape (regex the
# key must match, anchored), verify (method, url, auth header template; {key} is substituted
# in-process, never on argv), targets (vault entry + field pairs; other keys untouched). Telegram
# carries one secret per bot on the target.
#
# Three fields exist for a credential that is a PAIR rather than one string: `pair: true` on the
# vendor keeps its targets in one group so both halves are proved and written together; `shape` and
# `secret` may then be set per target, because the two halves have different shapes and different
# repository secrets; and `refuse_when` in `verify` is a regex the response body must NOT match,
# for a vendor that grades a credential by refusing it rather than by answering 2xx. Every vendor
# without those three behaves exactly as before.
#
# Modal (the Forge's GPU, forge/modal_app.py) is not a row: its API is gRPC only (modal client 1.5.5
# names no HTTPS endpoint a `verify:` could call), so the bootstrapper cannot grade it. Its root is
# the pair SEED_MODAL_TOKEN_ID / SEED_MODAL_TOKEN_SECRET, set once by `bin/idp-set-root modal`; the
# forge-train workflow proves the pair against the provider (`modal secret list`) before it mints
# the two Modal secrets the launcher reads. Same R52 shape, different prover.
vendors:
  # Anthropic was removed on 2026-09-04. Founder: "estate will never use antropic api keys",
  # "we only use the pro nax nothly subscriptio", "final and end of". Claude reaches the estate
  # through the Claude Max monthly subscription the Claude Code sessions sign in with, so there
  # is no Anthropic API root to seed, no SEED_ANTHROPIC_API_KEY, and no anthropic lane on the
  # router (platform/llm/config.yaml). Do not add one back.
  openrouter:
    kind: secret
    secret: SEED_OPENROUTER_API_KEY
    page: https://openrouter.ai/settings/keys
    shape: "sk-or-v1-[0-9a-f]{64}"
    verify: { method: GET, url: https://openrouter.ai/api/v1/auth/key, headers: { Authorization: "Bearer {key}" } }
    rotation: assisted  # OpenRouter's /api/v1/keys needs a provisioning key that is console-born
    store_default: human-vault
    targets:
      - { entry: litellm-upstream, ns: llm, field: OPENROUTER_API_KEY, bw: OPENROUTER_API_KEY }
      - { entry: prospector-engine-env, ns: prospector, field: OPENROUTER_API_KEY, bw: OPENROUTER_API_KEY }
      - { entry: hermes-agent-env, ns: hermes-agent, field: OPENROUTER_API_KEY, bw: OPENROUTER_API_KEY }
  deepseek:
    kind: secret
    secret: SEED_DEEPSEEK_API_KEY
    page: https://platform.deepseek.com/api_keys
    shape: "sk-[0-9a-f]{32}"
    verify: { method: GET, url: https://api.deepseek.com/models, headers: { Authorization: "Bearer {key}" } }
    rotation: assisted  # DeepSeek publishes no create-key API (measured 2026-09-04)
    store_default: human-vault  # founder-pasted key
    targets:
      # No litellm-upstream field: the router's DeepSeek key is console-owned (see below), so the
      # vault entry the router mounts carries no DeepSeek key at all. prospector holds its own.
      - { entry: prospector-engine-env, ns: prospector, field: DEEPSEEK_API_KEY, bw: DEEPSEEK_API_KEY }
    router:
      # Console-owned, founder 2026-09-04: "i can change the keys nyself, i eed to be ble to delete
      # the esting keys set in config", then "delete the current deepseeky key, ill add a new one".
      # A model row declared in the rendered config is read-only in the LiteLLM admin console --
      # it refuses to attach, change or delete a key for a model that is "defined in config" -- so
      # a git-owned row takes the credential out of his hands. The DeepSeek lane therefore renders
      # no model_list row and holds no key in git or in the router's vault entry; he adds the key
      # in the console's LLM Credentials tab and it lives encrypted in litellm-db, the same shape
      # the Kimi lane has carried since 2026-09-03 (R75).
      #
      # `console_lanes` names a model group that exists at runtime but is rendered by nobody, so
      # the renderer's own check (every fallback names a lane something serves) still passes and
      # the chains below stay in git. The lane rejoins every chain the moment he adds the key --
      # no pull request, no session, no wait.
      console_lanes: [deepseek]
      fallbacks: |
        # DeepSeek answered 401 from inside the router pod on 2026-09-04 21:5xZ (the key is revoked
        # at the vendor; prospector's byte-identical copy fails the same way), which is why Gemini
        # sits in this chain: a hop that always refuses is latency, not redundancy. That sentence
        # now applies to Gemini itself, so it moved to the back -- see the measurement on the
        # gemini block below.
        - deepseek: [gemini, minimax]
  minimax:
    kind: secret
    secret: SEED_MINIMAX_API_KEY
    page: https://platform.minimax.io/user-center/basic-information/interface-key
    # The vendor documents no key format (platform.minimax.io quickstart, read 2026-09-02); the old
    # JSON-web-token regex was a guess, and on run 33685104831 it refused the founder's funded key
    # before the vendor ever saw it. The shape refuses only an empty or malformed paste; the verify
    # probe is the proof, as for kimi.
    shape: "[A-Za-z0-9_.-]{20,}"
    verify: { method: GET, url: https://api.minimax.io/v1/models, headers: { Authorization: "Bearer {key}" } }
    rotation: assisted  # MiniMax publishes no create-key API (R52)
    store_default: human-vault
    targets:
      # No `entry:` on any of these three any more. The vault copies of this key were proved
      # revoked at the vendor on 2026-09-10 -- HTTP 401 "invalid api key (2049)", measured from
      # inside the router pod, while the founder's own copy answered -- and have been unset. The
      # live key reaches every consumer through the Bitwarden human door alone, which is the one
      # place a rotation actually lands. otto-gateway is here because Otto's home 2 reads it.
      - { ns: llm, field: MINIMAX_API_KEY, bw: MINIMAX_API_KEY }
      - { ns: prospector, field: MINIMAX_API_KEY, bw: MINIMAX_API_KEY }
      - { ns: otto-gateway, field: MINIMAX_API_KEY, bw: MINIMAX_API_KEY }
    router:
      lanes: |
        # --- the moat's cheap primary --------------------------------------------------------
        # MiniMax has no first-class LiteLLM provider; it is OpenAI-compatible, so it is declared
        # with an explicit api_base rather than a provider prefix.
        - model_name: minimax
          litellm_params:
            model: openai/MiniMax-M3
            api_base: https://api.minimax.io/v1
            api_key: os.environ/MINIMAX_API_KEY
            timeout: 300
            max_tokens: 8192
            # Without these two the router prices this lane at $0.0000 a call. Measured
            # 2026-09-04 from LiteLLM_SpendLogs: 176 million MiniMax tokens across three
            # consumers since 2026-08-27, every row recorded as zero spend, so
            # general_settings.max_budget could never trip and the vendor's own plan ran
            # out with nothing in the estate showing a cost. MiniMax is OpenAI-compatible
            # rather than a first-class provider, so LiteLLM has no price for it unless
            # the row carries one. MiniMax-M3 is priced $0.30 per million in and $1.20 per
            # million out up to 512K input tokens, and $0.60 / $2.40 above that (vendor
            # pricing page, read 2026-09-07) -- so this lane is the same money per token as
            # the MiniMax-M2 it replaces, for every turn the cap below admits.
            input_cost_per_token: 0.0000003
            output_cost_per_token: 0.0000012
          model_info:
            # crew#506 CP1: the router refuses an oversized turn before it leaves the estate.
            # MiniMax-M3 carries 1,048,576 tokens of context, but LiteLLM holds one rate per lane
            # and MiniMax doubles its rate above 512K input. So the cap is set where the price
            # above stops being true, not where the model stops reading: a turn over 512K would
            # bill at twice what this row records, and a lane that under-reports its own spend is
            # how 176 million tokens went by as $0.0000 in the first place. A turn above the cap
            # 400s here instead of walking the fallback chain into unfunded lanes (the 2026-08-27
            # Telegram outage).
            max_input_tokens: 512000

        # The failover tier: same account and adapter, different model. It is a failover, never
        # a routing choice — see prospector config.yaml on `minimax_m27`.
        - model_name: minimax_m27
          litellm_params:
            # The name was aspirational until 2026-09-07: the lane called minimax_m27 served
            # MiniMax-Text-01, because M2.7 did not exist when the lane was cut. It does now, so
            # the lane serves what it is named after and a reader of the router config is no
            # longer told one model and given another.
            model: openai/MiniMax-M2.7
            api_base: https://api.minimax.io/v1
            api_key: os.environ/MINIMAX_API_KEY
            timeout: 300
            # Priced for the same reason as the row above; without it the failover tier is
            # the free-looking way around a cap the primary now respects.
            # MiniMax-M2.7: $0.30 per million in, $1.20 per million out (vendor pricing page,
            # read 2026-09-07) -- dearer per token than the MiniMax-Text-01 it replaces, and
            # that is the point: a failover that is cheaper than the primary is an invitation
            # to route to it.
            input_cost_per_token: 0.0000003
            output_cost_per_token: 0.0000012
          model_info:
            # M2.7 reads 204,800 tokens, a fifth of the primary's window. Capped here so an
            # oversized turn is refused by the estate rather than by the vendor mid-failover.
            max_input_tokens: 204800
      fallbacks: |
        # Measured from inside the router pod 2026-09-04 21:5xZ: MiniMax answers 401 `invalid api
        # key (2049)` on https://api.minimax.io/v1/chat/completions (request id
        # 06ea7071f3bfa650df549152c286372b), and its native endpoint answers HTTP 200 carrying
        # `base_resp.status_code 2049` in the body -- the same refusal wearing a 200, so a probe
        # that grades only the HTTP status reads that account as healthy. DeepSeek answers 401.
        # Those two were each other's only fallback, so a cheap turn walked minimax -> deepseek
        # and died with nothing to answer the founder's Telegram message. Gemini answers, so it
        # goes ahead of the dead pair rather than after it.
        #
        # That reading expired. Both accounts named above are funded again and answering, and
        # Gemini is now the one refusing: it left this chain entirely on 2026-09-08, on the
        # measurement recorded on the gemini block below. It could not simply move to the back
        # either -- sovereign/tests/bdd/test_cp30.py holds that every chain not headed by the
        # cheap model ends in it, so a cascade never terminates on a costlier lane than the one
        # it could have used. A dead lane after that tail would be a hop that costs a retry and
        # a cooldown and can never answer, which is the founder's "we wait for a nodel to finish
        # and then swtich whih fails all the tine" (2026-09-08) in its purest form. So the chain
        # is minimax -> deepseek and stops: two vendors, both answering, no dead hop.
        # 2026-09-08, the founder's cost mandate. Every chain on main ended in `deepseek`,
        # an account at $0 that has answered 401 since 2026-09-04, so the last hop of every
        # fallback was a guaranteed refusal and there was nothing free underneath it. This
        # file already says twice that a hop which always refuses is latency, not redundancy;
        # here that is applied. deepseek stays a chain HEAD, so the lane rejoins the moment
        # the founder adds its key in the LiteLLM console -- no pull request, no session.
        - minimax: [gemini]
  kimi:
    # Moonshot's Kimi (platform.kimi.ai). The vendor documents no key shape (API overview and
    # list-models pages, read 2026-09-02), so the shape only refuses an empty or malformed paste;
    # the verify probe is the real proof: GET /v1/models answers 2xx only with a live key.
    kind: secret
    secret: SEED_KIMI_API_KEY
    page: https://platform.kimi.ai/console/api-keys
    shape: "[A-Za-z0-9_.-]{20,}"
    # A Kimi key has one of three homes and answers only there (kimi.com/code FAQ, read 2026-09-03:
    # "Kimi Code membership benefits and the Kimi Platform have different Base URLs"): the open
    # platform's global host, the Kimi Code membership host, the open platform's China host. The
    # apply run on 2026-09-02 (job 100467823768) probed only the first and read the founder's key as
    # "Incorrect API key" without ever asking the other two. Now the probe walks the list; the host
    # that accepts the key is written as MOONSHOT_API_BASE, which LiteLLM's moonshot adapter reads
    # from the environment beside the key (docs.litellm.ai/docs/providers/moonshot), so the router
    # calls the home the key belongs to. Nobody is asked where the key was made.
    bases:
      - https://api.moonshot.ai/v1
      - https://api.kimi.com/coding/v1
      - https://api.moonshot.cn/v1
    verify: { method: GET, url: "{base}/models", headers: { Authorization: "Bearer {key}" } }
    rotation: assisted  # Kimi publishes no create-key API
    store_default: human-vault
    targets:
      - { entry: litellm-upstream, ns: llm, field: MOONSHOT_API_KEY, bw: MOONSHOT_API_KEY }
      - { entry: litellm-upstream, field: MOONSHOT_API_BASE, derived: base }
    # NO router block, on purpose (R75, founder 2026-09-03). The kimi lane is console-owned:
    # the key is brought through the router's own console (LLM Credentials -> Add Credential,
    # then Models -> Add Model, stored encrypted in litellm-db) -- the enterprise intake, no
    # terminal, no repository secret. A git-rendered row here locks the name `kimi` in the
    # config file and the console then refuses to attach a key to it ("defined in config",
    # hit by the founder 2026-09-03), so the row that pointed at env keys the vault never
    # held was removed. The seed road above (SEED_KIMI_API_KEY -> MOONSHOT_API_KEY/BASE)
    # remains the automated alternative and re-adding a lane here is one block, but only
    # WITH the vault key, never before it.
  gemini:
    # Google can mint keys with gcloud, but that road needed the founder's laptop SSO every time the
    # session lapsed (a wrong root, crew#66 comment 5461144560). One key made once is the root (R52).
    kind: secret
    secret: SEED_GEMINI_API_KEY
    page: https://aistudio.google.com/apikey
    shape: "AIza[A-Za-z0-9_-]{35}"
    verify: { method: GET, url: "https://generativelanguage.googleapis.com/v1beta/models?key={key}", headers: {} }
    rotation: assisted  # Google key creation needs gcloud SSO
    store_default: human-vault
    targets:
      - { entry: litellm-upstream, ns: llm, field: GEMINI_API_KEY, bw: GEMINI_API_KEY }
    router:
      lanes: |
        # The ceiling is Google's, measured, not chosen here. On 2026-09-08 the router pod's
        # 429 bodies carried quotaId `GenerateContentPaidTierInputTokensPerModelPerMinute`,
        # quotaValue "1000000", quotaDimensions {model: gemini-2.5-flash, location: global}, and
        # retryDelay values of 9s, 46s, 48s, 55s and 57s. So the limit is one million INPUT
        # TOKENS a minute per model -- not requests -- and when it is passed Google makes the
        # caller wait about a minute. That wait is what a person on Telegram experiences as the
        # thing hanging and then switching.
        #
        # Three lanes name the same Google model (gemini, fast, vision), and Google counts them
        # in one bucket, so the million is split across the three rather than repeated on each:
        # 500k + 300k + 150k = 950k, with 50k of headroom for the retry LiteLLM is allowed. With
        # `enable_pre_call_checks` and usage-based-routing-v2 in router_settings, the router now
        # walks the fallback chain BEFORE the call leaves the estate instead of spending a round
        # trip to be refused and then waiting out Google's retryDelay.
        - model_name: gemini
          litellm_params:
            model: gemini/gemini-2.5-flash
            api_key: os.environ/GEMINI_API_KEY
            timeout: 300
            tpm: 500000

        # The two neutral lane names. They used to be declared on the anthropic row, which is
        # gone, and a caller must be able to ask for a capable model or a cheap one without
        # naming a vendor (LAW 34, founder 2026-09-04: "we supposoed to be provider agnostic").
        # They sit on Gemini because that account is bought direct and verified in the
        # 2026-09-04 09:48Z apply run; the fallback chains below take them off Google the
        # moment it refuses. Model ids from https://ai.google.dev/gemini-api/docs/models.
        # gemini-2.5-pro was retired under this lane on or before 2026-09-08. Measured from the
        # router pod that day: 8 of 8 calls to it answered 404, and the body is Google's own
        # instruction -- "This model models/gemini-2.5-pro is no longer available to new users.
        # Please update your code to use models/gemini-3.1-pro-preview". Every one of those 404s
        # then walked the chain to `gemini`, so the neutral lane cost a guaranteed dead round
        # trip on every single call. The replacement id is the vendor's, not this file's guess.
        - model_name: default
          litellm_params:
            model: gemini/gemini-3.1-pro-preview
            api_key: os.environ/GEMINI_API_KEY
            timeout: 300
            max_tokens: 8192
            # Its own model, so its own per-minute bucket (see the note on the `gemini` lane).
            tpm: 1000000
          model_info:
            max_input_tokens: 1048576

        - model_name: fast
          litellm_params:
            model: gemini/gemini-2.5-flash
            api_key: os.environ/GEMINI_API_KEY
            timeout: 300
            max_tokens: 8192
            tpm: 300000
          model_info:
            max_input_tokens: 1048576
      cluster_lanes: |
        # The research worker ranks what it scraped with an embedding model, and the router is
        # the only door to a model (LAW 34, crew#659 CP3). It read that model through OpenRouter
        # until 2026-09-04, when the founder ruled the estate buys model capacity direct and
        # never through a reseller; Google sells this one direct on the key the lanes above
        # already use. `dimensions: 1536` keeps the vector width the OpenRouter row produced, so
        # a store sized for it needs no migration -- but the two models are different spaces, and
        # anything embedded before today has to be embedded again to be comparable. Model id from
        # https://ai.google.dev/gemini-api/docs/embeddings (read 2026-09-04).
        - model_name: embed
          litellm_params:
            model: gemini/gemini-embedding-001
            api_key: os.environ/GEMINI_API_KEY
            dimensions: 1536
            timeout: 120
          model_info:
            mode: embedding

        - model_name: vision
          litellm_params:
            model: gemini/gemini-2.5-flash
            api_key: os.environ/GEMINI_API_KEY
            timeout: 300
            tpm: 150000

        # Founder 2026-08-30, verbatim: "we test with MiniMax see what the image quality is like, then
        # we use Gemini for the ones that will ship to production". So there are two image lanes, and
        # the reason they are shaped differently is a vendor fact, not a preference:
        #
        #   image           this row. Gemini is a first-class LiteLLM lane, so callers ask the router
        #                   for "image" by capability and never name Google.
        #   /minimax/image  a pass-through in general_settings below. LiteLLM v1.98.0 has no MiniMax
        #                   image provider (docs.litellm.ai/docs/image_generation lists OpenAI, Azure,
        #                   Google AI Studio, Vertex, Bedrock, Recraft, OpenRouter, Nscale, Xinference,
        #                   read 2026-08-30), and OpenRouter does not resell it either: every
        #                   minimax/* row on openrouter.ai/api/v1/models is output_modalities ["text"]
        #                   (measured 2026-08-30). MiniMax's own /v1/image_generation is the only door.
        #
        # Model id from https://ai.google.dev/gemini-api/docs/image-generation (read 2026-08-30), where
        # gemini-2.5-flash-image is marked legacy. It is newer than this LiteLLM's price map, so a call
        # on this lane traces with a zero cost until the image ships and the map catches up; spend is
        # still capped by general_settings.max_budget like every other lane.
        - model_name: image
          litellm_params:
            model: gemini/gemini-3.1-flash-image
            api_key: os.environ/GEMINI_API_KEY
            timeout: 300
      fallbacks: |
        # Gemini stopped heading any chain on 2026-09-08. Measured over the two hours to
        # 10:45Z on both live router pods (24,955 log lines): gemini/gemini-2.5-flash
        # answered 5 calls and failed 102, every failure RESOURCE_EXHAUSTED with no quotaId
        # and no retryDelay -- the unbilled shape, not a per-minute ceiling this estate can
        # stay under. openai/MiniMax-M3 answered 71 and failed 0; deepseek-v4-flash answered
        # 97 and failed 24, all 24 being one message ("This response_format type is
        # unavailable now") from a caller that sets a parameter Otto never sends.
        #
        # A chain that opens on a lane refusing 95 of every 100 calls spends the router's two
        # retries and its cooldown before it reaches a lane that can answer. That is the
        # founder's complaint in one sentence -- "why do we wait for a nodel to finish and
        # then swtich whih fails all the tine" (2026-09-08) -- and it is the same reason this
        # file already gives on the deepseek block for demoting a dead hop: "a hop that always
        # refuses is latency, not redundancy". Gemini goes last everywhere and heads nothing.
        # It returns to the front the moment the Google account is billed, which crew#920
        # carries; nothing else about these chains changes.
        #
        # The cheap model is still the last hop of every chain it does not head, which is what
        # sovereign cp30 grades and the `[routing] cheap` line of AGENTS.md declares; which
        # lane is `cheap` is the founder's call, not this file's, so it is untouched.
        #
        # `default` and `fast` are themselves Gemini rows (gemini-2.5-pro and -2.5-flash), so
        # naming gemini in their own fallback lists was a hop back to the model that had just
        # failed. Those entries are gone rather than reordered.
        - gemini: [minimax]
        - default: [gemini, minimax]
        - fast: [gemini, minimax]
  groq:
    # The free floor (founder 2026-09-08, the cost mandate). Every lane the router served until
    # today bills per token, so 100% of every turn was paid: the chains ended in `deepseek`, an
    # account at $0, with nothing free underneath. Groq serves frontier open weights (Llama 3.3
    # 70B, Qwen2.5-Coder-32B) on a free tier with no card, and it is OpenAI-compatible, so it is
    # a LiteLLM lane and not an adapter. It is the floor, never a routing choice: the chains
    # reach it only when the paid lanes are exhausted or refusing.
    #
    # R52: Groq publishes no create-key API (console.groq.com/keys is the only road, read
    # 2026-09-08), so the API key IS the root. The founder makes it once and sets the seed; code
    # does everything after that.
    kind: secret
    secret: SEED_GROQ_API_KEY
    page: https://console.groq.com/keys
    shape: "gsk_[A-Za-z0-9]{20,}"
    verify: { method: GET, url: https://api.groq.com/openai/v1/models, headers: { Authorization: "Bearer {key}" } }
    rotation: assisted  # Groq publishes no create-key API (measured 2026-09-08)
    store_default: human-vault
    targets:
      - { entry: litellm-upstream, ns: llm, field: GROQ_API_KEY, bw: GROQ_API_KEY }
      # Otto's own copy, home 3 of the three homes. No `entry:`: there is no cluster Secret
      # in that namespace to seed Bitwarden FROM -- the founder's copy is the only copy, and
      # the bridge only reads outward here.
      - { ns: otto-gateway, field: GROQ_API_KEY, bw: GROQ_API_KEY }
    # NO router block yet, on purpose. A rendered lane naming os.environ/GROQ_API_KEY before the
    # vault holds that field is exactly the break this registry already carries a scar from (see
    # the kimi row: "a row that pointed at env keys the vault never held was removed"). The lane
    # and the chain tails land in the follow-up the moment bin/idp-bootstrap-vendors has written
    # the field -- one edit, no new mechanism.

  # Cloudflare Workers AI is NOT a row, and the reason is a second value. Its OpenAI-compatible
  # endpoint is /accounts/{account_id}/ai/v1, so a lane needs the account id as well as a token,
  # and no file in this estate holds a Cloudflare account id (grepped 2026-09-08: the external-dns
  # credential is a token alone). A row here whose bootstrap writes one half of a two-half
  # credential is a human-vault bridge that can never go healthy -- the exact shape of the kimi
  # row that was deleted. It becomes a row when the account id has a home, not before. Its token
  # is also a separate credential from the DNS one either way: that token is scoped Zone:DNS:Edit
  # and cannot call Workers AI (R52, one credential is one job).

  exa:
    kind: secret
    secret: SEED_EXA_API_KEY
    page: https://dashboard.exa.ai/api-keys
    shape: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
    verify: { method: POST, url: https://api.exa.ai/search, headers: { x-api-key: "{key}", Content-Type: application/json }, body: '{"query":"estate bootstrap","numResults":1}' }
    rotation: assisted  # Exa publishes no create-key API
    store_default: human-vault
    targets:
      - { entry: prospector-engine-env, ns: prospector, field: EXA_API_KEY, bw: EXA_API_KEY }
      - { entry: hermes-agent-env, ns: hermes-agent, field: EXA_API_KEY, bw: EXA_API_KEY }
  cursor:
    # crew#751: Cursor is an agent harness, not a LiteLLM completions lane. The key authenticates
    # `agent -p` on the Mac via cursor-agent. Architect stays on the model router. Cursor publishes
    # no create-key API (dashboard Integrations / API Keys, read 2026-08-31); the key is the root.
    kind: secret
    secret: SEED_CURSOR_API_KEY
    page: https://cursor.com/dashboard/integrations
    shape: "(key_|crsr_|cursor_)[A-Za-z0-9_-]{16,}"
    verify: { method: GET, url: https://api.cursor.com/v1/me, headers: { Authorization: "Bearer {key}" } }
    rotation: assisted  # Cursor publishes no create-key API
    store_default: human-vault
    targets:
      - { entry: hermes-agent-env, ns: hermes-agent, field: CURSOR_API_KEY, bw: CURSOR_API_KEY }
  telegram:
    # BotFather has no HTTP API; each bot token is a root of its own, made once with /newbot.
    kind: secret
    page: https://t.me/BotFather
    shape: "[0-9]{8,10}:[A-Za-z0-9_-]{35}"
    verify: { method: GET, url: "https://api.telegram.org/bot{key}/getMe", headers: {} }
    rotation: assisted  # BotFather has no HTTP API
    store_default: human-vault
    targets:
      - { entry: hermes-agent-env, ns: hermes-agent, field: TELEGRAM_BOT_TOKEN, secret: SEED_TELEGRAM_HERMES_BOT_TOKEN, bw: TELEGRAM_HERMES_BOT_TOKEN }
      - { entry: flux-telegram, ns: flux-system, field: token, secret: SEED_TELEGRAM_ALERTS_BOT_TOKEN, bw: TELEGRAM_ALERTS_BOT_TOKEN }
  apprise_telegram:
    # The founder's alert channel (root-trust row notify-apprise-founder-telegram). Apprise wants
    # one URL, tgram://<bottoken>/<chatid>/, but a URL is not gradeable whole: the two halves only
    # mean something to Telegram together, so this is a PAIR like google_oauth below. `getChat`
    # grades both in one call: a wrong token is refused outright, a chat the bot cannot see is an
    # error body. platform/notify/external-secret.yaml composes the tgram:// URL from the two
    # vault fields, so no secret store ever holds a half-URL.
    kind: secret
    pair: true
    page: https://t.me/BotFather
    verify:
      method: GET
      url: "https://api.telegram.org/bot{token}/getChat?chat_id={chat}"
      headers: {}
    rotation: assisted  # BotFather has no HTTP API
    store_default: human-vault
    targets:
      - { entry: notify-apprise-founder-telegram, ns: notify, field: token, secret: SEED_TELEGRAM_ALERTS_BOT_TOKEN, shape: "[0-9]{8,10}:[A-Za-z0-9_-]{35}", bw: TELEGRAM_ALERTS_BOT_TOKEN }
      - { entry: notify-apprise-founder-telegram, ns: notify, field: chat, secret: SEED_TELEGRAM_ALERTS_CHAT_ID, shape: "-?[0-9]{6,14}", bw: TELEGRAM_ALERTS_CHAT_ID }
  stripe:
    kind: secret
    secret: SEED_STRIPE_SECRET_KEY
    page: https://dashboard.stripe.com/apikeys
    shape: "sk_(live|test)_[A-Za-z0-9]{24,}"
    verify: { method: GET, url: https://api.stripe.com/v1/balance, headers: { Authorization: "Bearer {key}" } }
    rotation: assisted  # Stripe key creation needs dashboard
    store_default: human-vault
    targets:
      # Stripe__ApiKey, not Stripe__SecretKey: the live prospector-store-api-env Secret carries
      # Stripe__ApiKey and Stripe__WebhookSecret, and nothing in the estate has ever read a key
      # called Stripe__SecretKey. Until 2026-09-07 this row named a field that does not exist,
      # so the door would have delivered the founder's Stripe key under a name the shop ignores.
      - { entry: prospector-store-api-env, ns: prospector, field: Stripe__ApiKey, bw: STRIPE_SECRET_KEY }
  google_oauth:
    # The shop's "Continue with Google" button. It has been absent from mumchimp.com since the move
    # to Kubernetes: Store.Api registers Google only when both halves are non-empty
    # (Auth/AuthServiceCollectionExtensions.cs:203-211), the k8s manifest never carried them, so
    # /v1/auth/external/providers answers 200 {"providers":[]} and the sign-in panel renders nothing
    # (SocialSignIn.tsx:52-53 returns null on an empty list). Measured against the live API
    # 2026-08-31.
    #
    # Google publishes no create-OAuth-client API. The only programmatic road is IAP-scoped, and its
    # own page says the clients it makes are "locked for IAP usage only, and therefore the API does
    # not allow any updates to the redirect URI or other attributes"
    # (its "Creating OAuth clients programmatically" page under /iap/docs, read 2026-08-31) -- so it
    # cannot make a client whose redirect URI is the store's. The host is deliberately not spelled
    # out: this file is the provider-blind layer and the conscience rule no_provider_in_diff refuses
    # a cloud host named outside platform/oci, platform/secret-store and clusters/ (R36).
    # Same shape as BotFather above: the client IS the root, made once at `page` (R52).
    #
    # It is a PAIR, and that is the one thing this registry could not express before. Neither half
    # can be graded alone: an id with no secret and a secret with no id are both meaningless to
    # Google. `pair: true` keeps the two halves in one group, each with its own repository secret and
    # its own anchored shape, verified in one call and written together or not at all.
    kind: secret
    pair: true
    page: https://console.developers.google.com/auth/clients
    # The token endpoint is the only thing that will grade a client without a real authorization
    # code, and it grades it by REFUSING. Measured 2026-08-31 with a made-up pair: 401
    # {"error":"invalid_client","error_description":"The OAuth client was not found."}. Google's own
    # error table calls invalid_client "The OAuth client secret is incorrect", and a pair it knows
    # gets past that to grade the code, answering invalid_grant, "The supplied authorization code is
    # invalid or in the wrong format" (https://developers.google.com/identity/protocols/oauth2/
    # web-server, read 2026-08-31). So the rule is refuse-on-invalid_client, which is exactly the
    # failure this has to catch: a typo, a revoked client, or another project's client. The probe
    # code is junk on purpose and no token is ever issued.
    verify:
      method: POST
      url: https://oauth2.googleapis.com/token
      headers: { Content-Type: application/x-www-form-urlencoded }
      body: "grant_type=authorization_code&code=idp-bootstrap-probe&client_id={Authentication__Google__ClientId}&client_secret={Authentication__Google__ClientSecret}&redirect_uri=https://api.${ESTATE_ZONE}/signin-google"
      refuse_when: '"error"\s*:\s*"invalid_client"'
    rotation: assisted  # Google publishes no create-OAuth-client API
    store_default: human-vault
    # Nothing downstream changes. Kyverno secrets-not-from-env-vars refuses envFrom.secretRef and
    # secretKeyRef, so the store reads its secrets as FILES through KeyPerFile, which turns a file
    # named Authentication__Google__ClientId into the configuration key Authentication:Google:ClientId
    # -- the exact key AuthServiceCollectionExtensions.cs:203 reads. The ExternalSecret pulls the
    # whole prospector-store-api-env object with dataFrom.extract, so a new field in the vault object
    # reaches the pod with no manifest edit at all.
    targets:
      - { entry: prospector-store-api-env, ns: prospector, field: Authentication__Google__ClientId, secret: SEED_GOOGLE_OAUTH_CLIENT_ID, shape: "[0-9]+-[a-z0-9]+\\.apps\\.googleusercontent\\.com", bw: GOOGLE_OAUTH_CLIENT_ID }
      - { entry: prospector-store-api-env, ns: prospector, field: Authentication__Google__ClientSecret, secret: SEED_GOOGLE_OAUTH_CLIENT_SECRET, shape: "GOCSPX-[A-Za-z0-9_-]{20,}", bw: GOOGLE_OAUTH_CLIENT_SECRET }
# Not here yet (crew#579 stays open for it): Mailjet, a key AND a secret pair, two
# prospector-store-api-env fields. `pair: true` above is the road it will take.
