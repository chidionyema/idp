        \ tool_calls=['get_weather'].\n#\n# gpt-oss over qwen even though qwen is\
        \ different weights from the Groq floor: this\n# is the one vendor in the\
        \ matrix whose meter counts TOKENS (1,000,000/day), and qwen\n# spent 290\
        \ tokens saying READY where gpt-oss spent 104. On a token meter the cheaper\n\
        # answer keeps the lane alive longer.\n#\n# No input/output cost keys: the\
        \ lane is free, so $0.0000 a call is the true price.\n# general_settings.max_budget\
        \ still bounds the router; the daily meter is Cerebras's.\n- model_name: cerebras\n\
