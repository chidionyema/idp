# ghcr-pull for this namespace, mirrored through the ClusterSecretStore ghcr-pull
# (platform/image-automation/pull-secret.yaml, crew#396 step 2). Same shape as
# platform/llm/pull-secret.yaml and platform/temporal/pull-secret.yaml.
#
# The package is private, like the repository it is built from: .github/workflows/build-multiarch.yml
# sets no visibility, so a push to ghcr.io/chidionyema/meridian inherits the private default. An
# anonymous manifest request answers 401, and a pod without this Secret ends where cyrus spent
# weeks: ImagePullBackOff, a Deployment that reports 0/2 ready while the site does not exist.
#
# A namespace that pulls from ghcr must not need a laptop, which is the whole point of the
# ClusterSecretStore -- bin/idp-flux-bootstrap writes pull secrets into a fixed list of namespaces
# (backstage, prospector, edge, flux-system) and meridian is not one of them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: meridian
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: ghcr-pull }
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: ghcr-pull, property: .dockerconfigjson }
