# crew#722 CP3 (founder 2026-08-31: "poorly designed enterprise-wide secrets rotation strategy,
# this will harm us badly if we let it slide"). Nothing exercised the rotation road end to end:
# crew#506 CP4 (rotated key, pod kept the old one) and crew#684 (rotated key reached neither pod)
# were both found by a person hitting a broken door. This is the canary that road is drilled on
# daily: the rotation-drill job in oke-check.yml writes a fresh random value to the vault entry
# rotation-canary; ESO copies it to the Secret below within 10 minutes; Reloader rolls this
# Deployment (reloader.stakater.com/auto, the same annotation the estate standard injects); the
# restarted pod reads the mounted value ONCE at start -- modelling the worst consumer, one that
# captures at boot, crew#506's class -- and publishes the sha of what it is actually running
# with to the receipts bucket. The drill polls that receipt for the new sha and is the SLO:
# 25 minutes, vault to running pod, no hand.
#
# The value is mounted as a file, never env (platform/edge/kyverno-secrets-policy.yaml is Audit
# today and flips to Enforce; this canary must outlive the flip). The value itself is 48 hex
# chars of /dev/urandom guarding nothing: its only job is to change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rotation-canary
  namespace: backstage
spec:
  refreshInterval: 10m   # the drill's clock: short enough for a 25-minute SLO, 6 polls/hour is noise-free
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: rotation-canary
    creationPolicy: Owner
  dataFrom:
    - extract: { key: rotation-canary }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotation-canary
  namespace: backstage
  labels: { app.kubernetes.io/name: rotation-canary, app.kubernetes.io/part-of: idp }
  annotations:
    # The estate standard (crew#720): auto-discovery, never an enumerated list of Secret names.
    reloader.stakater.com/auto: "true"
spec:
  # backstage is a founder-facing namespace, so require-availability demands two replicas and a
  # node spread; the drill needs only one voice, so both pods write the same receipt object and
  # the poll matches when the roll reaches either -- Reloader rolls the whole Deployment at once.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: rotation-canary }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rotation-canary, app.kubernetes.io/part-of: idp }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: rotation-canary }
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: canary
          # the one pinned image every estate CronJob runs (cluster-state, drill-dispatcher);
          # ships python3 for the sha and the oci CLI for the bucket write
          image: ghcr.io/oracle/oci-cli:20260826
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # read ONCE, at start: a canary that re-reads the mounted file would go green on
              # kubelet's in-place volume refresh and never prove the restart chain env
              # consumers need (crew#506 CP4 was exactly an at-boot capture)
              VAL_SHA=$(python3 -c "import hashlib;print(hashlib.sha256(open('/canary/value','rb').read()).hexdigest()[:12])")
              STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              while true; do
                printf 'ok rotation-canary sha256=%s started=%s pod=%s at=%s\n' \
                  "$VAL_SHA" "$STARTED" "$(hostname)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/receipt
                # a bucket blip must not crashloop the canary; a receipt that stops ageing is
                # exactly what the drill's 25-minute deadline catches
                oci --auth instance_principal os object put --bucket-name estate-drill-receipts \
                  --name state/rotation-canary --file /tmp/receipt --content-type text/plain --force \
                  >/dev/null 2>&1 || true
                touch /tmp/ok
                sleep 120
              done
          env:
            - { name: HOME, value: /tmp }   # the CLI writes its cache under HOME; the root fs is read-only
          readinessProbe:
            exec: { command: ["test", "-f", "/tmp/ok"] }
            initialDelaySeconds: 5
            periodSeconds: 30
          livenessProbe:
            exec: { command: ["test", "-f", "/tmp/ok"] }
            initialDelaySeconds: 30
            periodSeconds: 60
          volumeMounts:
            - { name: canary, mountPath: /canary, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: canary
          secret: { secretName: rotation-canary }
        - name: tmp
          emptyDir: {}
---
# require-availability (crew#555) grades founder-facing namespaces; the PDB says what the two
# replicas promise: one canary voice survives any single disruption.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rotation-canary
  namespace: backstage
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rotation-canary }
