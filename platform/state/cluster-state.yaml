# crew#345 (founder, 2026-08-26: "zero-touch OCI auth, no local oci session authenticate").
# Every session that wanted to know the cluster's state ran `oci session authenticate` on a laptop,
# because control_plane_allowed_cidrs admits only the Mac (platform/oci/main.tf:20). Same pattern
# as the crew#292 chaos receipt: the answer is written from inside, read from outside.
#
# Every 15 minutes a Job-owned pod (admitted without probes: admit-job-pods.yaml) reads nodes and
# pods through the API server with a read-only ServiceAccount, writes one receipt and puts it in
# the drill-receipts bucket on the node's instance principal (receipts.tf: workers may write that
# bucket and nothing else). Reader: bin/idp-cluster-state, job cluster-state in oke-check.yml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-state
  namespace: backstage
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-state-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  # crew#406: every Flux object's Ready condition lands in the receipt, so a dead image automation
  # or a source that cannot fetch is graded by oke-check instead of sitting frozen unseen.
  - apiGroups: ["source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io", "image.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmrepositories", "kustomizations", "helmreleases", "imagerepositories", "imagepolicies", "imageupdateautomations"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "clustersecretstores"]
    verbs: ["get", "list"]
  # crew#401 CP4: every hostname the cluster publishes, so oke-check can diff it against the catalogue
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-state-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-state-reader
subjects:
  - kind: ServiceAccount
    name: cluster-state
    namespace: backstage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-state-collect
  namespace: backstage
data:
  # Line 1 is the graded summary; the rest is the JSON a session reads instead of kubectl.
  collect.py: |
    import json, re, ssl, sys, urllib.request
    from datetime import datetime, timezone
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    tok = open(f"{SA}/token").read().strip()
    ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
    def get(path):
        req = urllib.request.Request("https://kubernetes.default.svc" + path, headers={"Authorization": "Bearer " + tok})
        with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
            return json.load(r)
    nodes = get("/api/v1/nodes")["items"]
    pods = get("/api/v1/pods")["items"]
    def cond(obj, kind):
        return next((c["status"] for c in obj["status"].get("conditions", []) if c["type"] == kind), "Unknown")
    node_rows = [{"name": n["metadata"]["name"], "ready": cond(n, "Ready") == "True",
                  "version": n["status"]["nodeInfo"]["kubeletVersion"]} for n in nodes]
    # crew#396: a container that starts and exits leaves only "Back-off restarting" in the events,
    # and the receipt is the only kube path a session has, so a restarted container's last lines
    # of its previous run travel with the pod row. A log read that fails is recorded, never dropped.
    def last_log(ns, name, statuses):
        out = {}
        for c in statuses:
            if not c.get("restartCount"):
                continue
            path = f"/api/v1/namespaces/{ns}/pods/{name}/log?container={c['name']}&previous=true&tailLines=8"
            try:
                req = urllib.request.Request("https://kubernetes.default.svc" + path, headers={"Authorization": "Bearer " + tok})
                with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                    out[c["name"]] = r.read().decode("utf-8", "replace")[-800:]
            except Exception as e:
                out[c["name"]] = f"log read failed: {e}"[:300]
        return out
    not_ready = [{"ns": p["metadata"]["namespace"], "name": p["metadata"]["name"], "phase": p["status"].get("phase"),
                  "restarts": sum(c.get("restartCount", 0) for c in p["status"].get("containerStatuses", [])),
                  "last_log": last_log(p["metadata"]["namespace"], p["metadata"]["name"], p["status"].get("containerStatuses", []))}
                 for p in pods
                 if p["status"].get("phase") not in ("Succeeded",) and cond(p, "Ready") != "True"]
    ready = sum(1 for n in node_rows if n["ready"])
    # crew#406: Flux objects. Ready=False with the controller's message is the whole diagnosis
    # when an image roll or a source stops; a list call that fails is itself recorded, never skipped.
    FLUX = [
        ("GitRepository", "/apis/source.toolkit.fluxcd.io/v1/gitrepositories"),
        ("OCIRepository", "/apis/source.toolkit.fluxcd.io/v1/ocirepositories"),
        ("HelmRepository", "/apis/source.toolkit.fluxcd.io/v1/helmrepositories"),
        ("Kustomization", "/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations"),
        ("HelmRelease", "/apis/helm.toolkit.fluxcd.io/v2/helmreleases"),
        ("ImageRepository", "/apis/image.toolkit.fluxcd.io/v1/imagerepositories"),
        ("ImagePolicy", "/apis/image.toolkit.fluxcd.io/v1/imagepolicies"),
        ("ImageUpdateAutomation", "/apis/image.toolkit.fluxcd.io/v1/imageupdateautomations"),
        ("ClusterSecretStore", "/apis/external-secrets.io/v1/clustersecretstores"),
        ("ExternalSecret", "/apis/external-secrets.io/v1/externalsecrets"),
    ]
    flux = []
    for kind, path in FLUX:
        try:
            items = get(path)["items"]
        except Exception as e:
            flux.append({"kind": kind, "ns": "", "name": "*", "ready": False, "message": f"list failed: {e}"[:300]})
            continue
        for o in items:
            st = o.get("status", {})
            c = next((c for c in st.get("conditions", []) if c["type"] == "Ready"), {})
            row = {"kind": kind, "ns": o["metadata"].get("namespace", ""), "name": o["metadata"]["name"],
                   "ready": c.get("status") == "True", "message": c.get("message", "no Ready condition yet")[:300]}
            if kind == "ImagePolicy":
                row["latest"] = st.get("latestImage")
            if kind == "ImageUpdateAutomation":
                row["last_push"] = st.get("lastPushCommit"); row["last_push_time"] = st.get("lastPushTime")
            if kind == "ImageRepository":
                row["tags"] = (st.get("lastScanResult") or {}).get("tagCount")
            if kind == "ExternalSecret":
                # crew#387: a Ready ExternalSecret whose controller stopped refreshing looks healthy
                # forever while the upstream rotates under it. The row carries the last sync time
                # and is graded not-ready once it is older than twice its refreshInterval (floor 2h).
                row["last_sync"] = st.get("refreshTime")
                iv = str((o.get("spec") or {}).get("refreshInterval") or "1h")
                mult = {"s": 1, "m": 60, "h": 3600}
                secs = sum(int(n) * mult[u] for n, u in re.findall(r"(\d+)([smh])", iv)) or 3600
                try:
                    last = datetime.strptime(str(st.get("refreshTime"))[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc)
                    age = (datetime.now(timezone.utc) - last).total_seconds()
                except Exception:
                    age = None
                if row["ready"] and (age is None or age > max(2 * secs, 7200)):
                    row["ready"] = False
                    row["message"] = f"Ready but last sync {st.get('refreshTime')} is older than 2x refreshInterval {iv}"
            flux.append(row)
    flux_not_ready = [r for r in flux if not r["ready"]]
    # crew#320: a DaemonSet with fewer ready pods than desired is invisible to every row above
    # (its pods do not exist, so they are neither Running nor not-ready). k8s-infra-otel-agent
    # ran at 0/1 for a day while telemetry-coverage said seen=0 and nothing said why. The
    # DaemonSet row and the Warning events of the last hour are that why; a list that fails is
    # itself a short row, never a silent zero.
    try:
        ds_items = get("/apis/apps/v1/daemonsets")["items"]
        ds = [{"ns": d["metadata"]["namespace"], "name": d["metadata"]["name"],
               "desired": d["status"].get("desiredNumberScheduled", 0), "ready": d["status"].get("numberReady", 0)}
              for d in ds_items]
    except Exception as e:
        ds = [{"ns": "", "name": "*", "desired": 1, "ready": 0, "message": f"list failed: {e}"[:300]}]
    ds_short = [d for d in ds if d["ready"] < d["desired"]]
    try:
        ev_items = get("/api/v1/events?fieldSelector=type%3DWarning&limit=500")["items"]
    except Exception as e:
        ev_items = [{"reason": "ListFailed", "message": f"list failed: {e}"[:300], "involvedObject": {"kind": "Event", "namespace": "", "name": "*"},
                     "lastTimestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "count": 1}]
    cutoff = datetime.now(timezone.utc).timestamp() - 3600
    def ev_time(e):
        t = e.get("lastTimestamp") or e.get("eventTime") or (e.get("series") or {}).get("lastObservedTime") or ""
        try:
            return datetime.strptime(t[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc).timestamp()
        except Exception:
            return 0
    events = sorted(({"at": (e.get("lastTimestamp") or e.get("eventTime") or "")[:19], "ns": e["involvedObject"].get("namespace", ""),
                      "kind": e["involvedObject"].get("kind"), "name": e["involvedObject"].get("name"),
                      "reason": e.get("reason"), "count": e.get("count", 1), "message": (e.get("message") or "")[:300]}
                     for e in ev_items if ev_time(e) >= cutoff), key=lambda r: r["at"], reverse=True)[:60]
    # crew#401 CP4: the hostnames the cluster publishes (HTTPRoute). bin/idp-catalogue-drift diffs
    # them against backstage/**/catalog-info.yaml; a list that failed is recorded, never left empty.
    hostnames_error = ""
    try:
        hostnames = sorted({h for r in get("/apis/gateway.networking.k8s.io/v1/httproutes")["items"]
                            for h in (r.get("spec") or {}).get("hostnames", [])})
    except Exception as e:
        hostnames, hostnames_error = None, f"{e}"[:300]
    at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
    head = (f"ok cluster-state at {at} nodes={len(node_rows)} ready={ready} pods={len(pods)} pods_not_ready={len(not_ready)}"
            f" flux={len(flux)} flux_not_ready={len(flux_not_ready)} ds={len(ds)} ds_short={len(ds_short)} events_warning={len(events)}"
            f" hostnames={len(hostnames or [])}")
    body = {"at": at, "nodes": node_rows, "pods_total": len(pods), "pods_not_ready": not_ready,
            "flux": flux, "flux_not_ready": flux_not_ready, "daemonsets": ds, "ds_short": ds_short, "events_warning": events,
            "hostnames": hostnames, "hostnames_error": hostnames_error}
    sys.stdout.write(head + "\n" + json.dumps(body, sort_keys=True) + "\n")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-state
  namespace: backstage
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180
      template:
        spec:
          serviceAccountName: cluster-state
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: receipt
              # Same image and uid as platform/chaos/backstage-pod-kill.yaml; the CLI is python, so
              # the collector needs no second image and no kubectl.
              image: ghcr.io/oracle/oci-cli:20260826
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  python3 /collect/collect.py > /tmp/receipt
                  head -1 /tmp/receipt
                  oci --auth instance_principal os object put --bucket-name estate-drill-receipts \
                    --name state/cluster --file /tmp/receipt --content-type text/plain --force
              env:
                - { name: HOME, value: /tmp }
              volumeMounts:
                - { name: collect, mountPath: /collect, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 200m, memory: 256Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: collect
              configMap: { name: cluster-state-collect }
            - name: tmp
              emptyDir: {}
