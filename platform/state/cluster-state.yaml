# crew#345 (founder, 2026-08-26: "zero-touch OCI auth, no local oci session authenticate").
# Every session that wanted to know the cluster's state ran `oci session authenticate` on a laptop,
# because control_plane_allowed_cidrs admits only the Mac (platform/oci/main.tf:20). Same pattern
# as the crew#292 chaos receipt: the answer is written from inside, read from outside.
#
# Every 15 minutes a Job-owned pod (admitted without probes: admit-job-pods.yaml) reads nodes and
# pods through the API server with a read-only ServiceAccount, writes one receipt and puts it in
# the drill-receipts bucket on the node's instance principal (receipts.tf: workers may write that
# bucket and nothing else). Reader: bin/idp-cluster-state, job cluster-state in oke-check.yml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-state
  namespace: backstage
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-state-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  # crew#406: every Flux object's Ready condition lands in the receipt, so a dead image automation
  # or a source that cannot fetch is graded by oke-check instead of sitting frozen unseen.
  - apiGroups: ["source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io", "image.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmrepositories", "kustomizations", "helmreleases", "imagerepositories", "imagepolicies", "imageupdateautomations"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "clustersecretstores"]
    verbs: ["get", "list"]
  # crew#401 CP4: every hostname the cluster publishes, so oke-check can diff it against the catalogue
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
  # crew#227 CP4: the SPIRE controller-manager's ClusterSPIFFEID status is the API-readable proof
  # that workloads are registered for SVIDs; the collector has no kubectl exec into spire-server.
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterspiffeids"]
    verbs: ["get", "list"]
  # crew#483: a PolicyException on main that the cluster never admitted leaves a workload denied
  # with no way to tell from outside; the receipt lists the exceptions the cluster actually holds.
  - apiGroups: ["kyverno.io"]
    resources: ["policyexceptions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-state-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-state-reader
subjects:
  - kind: ServiceAccount
    name: cluster-state
    namespace: backstage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-state-collect
  namespace: backstage
data:
  # Line 1 is the graded summary; the rest is the JSON a session reads instead of kubectl.
  collect.py: |
    import json, re, ssl, sys, urllib.request
    from datetime import datetime, timezone
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    tok = open(f"{SA}/token").read().strip()
    ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
    def get(path):
        req = urllib.request.Request("https://kubernetes.default.svc" + path, headers={"Authorization": "Bearer " + tok})
        with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
            return json.load(r)
    nodes = get("/api/v1/nodes")["items"]
    pods = get("/api/v1/pods")["items"]
    def cond(obj, kind):
        return next((c["status"] for c in obj["status"].get("conditions", []) if c["type"] == kind), "Unknown")
    node_rows = [{"name": n["metadata"]["name"], "ready": cond(n, "Ready") == "True",
                  "version": n["status"]["nodeInfo"]["kubeletVersion"]} for n in nodes]
    # crew#396: a container that starts and exits leaves only "Back-off restarting" in the events,
    # and the receipt is the only kube path a session has, so a restarted container's last lines
    # of its previous run travel with the pod row. A log read that fails is recorded, never dropped.
    def last_log(ns, name, statuses):
        out = {}
        for c in statuses:
            # crew#396 second receipt: a Job pod that fails once never restarts (restartPolicy Never),
            # so its exit was invisible; a terminated container with a non-zero exit code gets its
            # current log, a restarted one its previous log, a quiet one is never asked for.
            term = (c.get("state") or {}).get("terminated") or {}
            if c.get("restartCount"):
                which = "previous=true"
            elif term.get("exitCode"):
                which = "previous=false"
            else:
                continue
            path = f"/api/v1/namespaces/{ns}/pods/{name}/log?container={c['name']}&{which}&tailLines=8"
            try:
                req = urllib.request.Request("https://kubernetes.default.svc" + path, headers={"Authorization": "Bearer " + tok})
                with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                    # crew#495: signoz-0 crashed 37 times and every receipt carried only cobra
                    # frames, because its fatal is one zap JSON line with "msg" at the head and a
                    # stacktrace longer than the 800-char tail kept here. Each line keeps its head.
                    lines = r.read().decode("utf-8", "replace").splitlines()[-8:]
                    out[c["name"]] = "".join(ln[:400] + (" ...[cut]\n" if len(ln) > 400 else "\n") for ln in lines)
            except Exception as e:
                out[c["name"]] = f"log read failed: {e}"[:300]
        return out
    # crew#396, second fault: two pods sat in ImagePullBackOff and the receipt said only "Pending",
    # because the pull error lives in containerStatuses[].state.waiting and the events list keeps
    # the 20 newest. The waiting reason and message travel with the pod row, init containers too.
    def waiting(status):
        out = {}
        for c in status.get("initContainerStatuses", []) + status.get("containerStatuses", []):
            w = (c.get("state") or {}).get("waiting")
            if w and w.get("reason") not in (None, "ContainerCreating", "PodInitializing"):
                out[c["name"]] = (w.get("reason", "") + ": " + (w.get("message") or ""))[:400]
        return out
    # crew#396, third receipt (05:33Z): six kini-state pods were phase Failed with restarts 0, waiting {}
    # and last_log {}, so the receipt still said nothing. A Job pod the kubelet kills for its
    # activeDeadlineSeconds, or a pod evicted before a container ran, has no waiting state and no
    # terminated exit code to read a log for: its reason lives in status.reason / status.message
    # (DeadlineExceeded, Evicted, ...) and in containerStatuses[].state.terminated.reason. Both travel.
    def failed(status):
        out = {}
        if status.get("reason") or status.get("message"):
            out["pod"] = ((status.get("reason") or "") + ": " + (status.get("message") or ""))[:400]
        for c in status.get("initContainerStatuses", []) + status.get("containerStatuses", []):
            t = (c.get("state") or {}).get("terminated")
            if t and (t.get("reason") or t.get("exitCode")):
                out[c["name"]] = f"{t.get('reason', '')} exit={t.get('exitCode')}: {t.get('message') or ''}"[:400]
        return out
    not_ready = [{"ns": p["metadata"]["namespace"], "name": p["metadata"]["name"], "phase": p["status"].get("phase"),
                  "restarts": sum(c.get("restartCount", 0) for c in p["status"].get("containerStatuses", [])),
                  "waiting": waiting(p["status"]),
                  "failed": failed(p["status"]),
                  # crew#396, fourth receipt (06:00Z): kini-state's `receipt` is an init container, and
                  # last_log was handed containerStatuses only, so six Failed pods carried `failed`
                  # {"receipt": "Error exit=1: "} and last_log {}. Init containers are read too.
                  "last_log": last_log(p["metadata"]["namespace"], p["metadata"]["name"],
                                       p["status"].get("initContainerStatuses", []) + p["status"].get("containerStatuses", []))}
                 for p in pods
                 if p["status"].get("phase") not in ("Succeeded",) and cond(p, "Ready") != "True"]
    ready = sum(1 for n in node_rows if n["ready"])
    # crew#406: Flux objects. Ready=False with the controller's message is the whole diagnosis
    # when an image roll or a source stops; a list call that fails is itself recorded, never skipped.
    FLUX = [
        ("GitRepository", "/apis/source.toolkit.fluxcd.io/v1/gitrepositories"),
        ("OCIRepository", "/apis/source.toolkit.fluxcd.io/v1/ocirepositories"),
        ("HelmRepository", "/apis/source.toolkit.fluxcd.io/v1/helmrepositories"),
        ("Kustomization", "/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations"),
        ("HelmRelease", "/apis/helm.toolkit.fluxcd.io/v2/helmreleases"),
        ("ImageRepository", "/apis/image.toolkit.fluxcd.io/v1/imagerepositories"),
        ("ImagePolicy", "/apis/image.toolkit.fluxcd.io/v1/imagepolicies"),
        ("ImageUpdateAutomation", "/apis/image.toolkit.fluxcd.io/v1/imageupdateautomations"),
        ("ClusterSecretStore", "/apis/external-secrets.io/v1/clustersecretstores"),
        ("ExternalSecret", "/apis/external-secrets.io/v1/externalsecrets"),
    ]
    def flux_message(msg: str) -> str:
        # crew#483, 2026-08-27: the k8s-infra HelmRelease message ended at 'admission webhook
        # "validate.kyverno.svc-fail" denied the request:' because the row kept 300 characters
        # and Kyverno puts the policy and rule names after that colon. A denial whose policy
        # name is cut off is a receipt nobody can act on. Keep the whole message up to 2000;
        # past that, keep the head and the tail, since the policy is at the end.
        if len(msg) <= 2000:
            return msg
        return msg[:600] + " ... " + msg[-1400:]

    flux = []
    for kind, path in FLUX:
        try:
            items = get(path)["items"]
        except Exception as e:
            flux.append({"kind": kind, "ns": "", "name": "*", "ready": False, "message": f"list failed: {e}"[:300]})
            continue
        for o in items:
            st = o.get("status", {})
            c = next((c for c in st.get("conditions", []) if c["type"] == "Ready"), {})
            row = {"kind": kind, "ns": o["metadata"].get("namespace", ""), "name": o["metadata"]["name"],
                   "ready": c.get("status") == "True", "message": flux_message(c.get("message", "no Ready condition yet")),
                   # crew#483: when the Ready condition last flipped, so a denial can be dated against
                   # the commit that was meant to fix it instead of read as fresh.
                   "since": c.get("lastTransitionTime")}
            if kind == "ImagePolicy":
                row["latest"] = st.get("latestImage")
            if kind == "ImageUpdateAutomation":
                row["last_push"] = st.get("lastPushCommit"); row["last_push_time"] = st.get("lastPushTime")
            if kind == "ImageRepository":
                row["tags"] = (st.get("lastScanResult") or {}).get("tagCount")
            if kind == "ExternalSecret":
                # crew#387: a Ready ExternalSecret whose controller stopped refreshing looks healthy
                # forever while the upstream rotates under it. The row carries the last sync time
                # and is graded not-ready once it is older than twice its refreshInterval (floor 2h).
                row["last_sync"] = st.get("refreshTime")
                iv = str((o.get("spec") or {}).get("refreshInterval") or "1h")
                mult = {"s": 1, "m": 60, "h": 3600}
                secs = sum(int(n) * mult[u] for n, u in re.findall(r"(\d+)([smh])", iv)) or 3600
                try:
                    last = datetime.strptime(str(st.get("refreshTime"))[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc)
                    age = (datetime.now(timezone.utc) - last).total_seconds()
                except Exception:
                    age = None
                if row["ready"] and (age is None or age > max(2 * secs, 7200)):
                    row["ready"] = False
                    row["message"] = f"Ready but last sync {st.get('refreshTime')} is older than 2x refreshInterval {iv}"
            flux.append(row)
    flux_not_ready = [r for r in flux if not r["ready"]]
    # crew#483: the PolicyExceptions the cluster holds (kyverno.io/v2), name, namespace, policies
    # and the match names; absent from the list means the exception on main was never admitted.
    try:
        policy_exceptions = [{"ns": o["metadata"].get("namespace", ""), "name": o["metadata"]["name"],
                              "policies": sorted({e.get("policyName", "") for e in (o.get("spec") or {}).get("exceptions", [])}),
                              "matches": [r.get("names") for a in (o.get("spec") or {}).get("match", {}).get("any", []) for r in [a.get("resources", {})]]}
                             for o in get("/apis/kyverno.io/v2/policyexceptions")["items"]]
    except Exception as e:
        policy_exceptions = [{"ns": "", "name": "*", "policies": [], "matches": [], "error": f"list failed: {e}"[:300]}]
    # crew#320: a DaemonSet with fewer ready pods than desired is invisible to every row above
    # (its pods do not exist, so they are neither Running nor not-ready). k8s-infra-otel-agent
    # ran at 0/1 for a day while telemetry-coverage said seen=0 and nothing said why. The
    # DaemonSet row and the Warning events of the last hour are that why; a list that fails is
    # itself a short row, never a silent zero.
    try:
        ds_items = get("/apis/apps/v1/daemonsets")["items"]
        ds = [{"ns": d["metadata"]["namespace"], "name": d["metadata"]["name"],
               "desired": d["status"].get("desiredNumberScheduled", 0), "ready": d["status"].get("numberReady", 0)}
              for d in ds_items]
    except Exception as e:
        ds = [{"ns": "", "name": "*", "desired": 1, "ready": 0, "message": f"list failed: {e}"[:300]}]
    ds_short = [d for d in ds if d["ready"] < d["desired"]]
    try:
        ev_items = get("/api/v1/events?fieldSelector=type%3DWarning&limit=500")["items"]
    except Exception as e:
        ev_items = [{"reason": "ListFailed", "message": f"list failed: {e}"[:300], "involvedObject": {"kind": "Event", "namespace": "", "name": "*"},
                     "lastTimestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "count": 1}]
    cutoff = datetime.now(timezone.utc).timestamp() - 3600
    def ev_time(e):
        t = e.get("lastTimestamp") or e.get("eventTime") or (e.get("series") or {}).get("lastObservedTime") or ""
        try:
            return datetime.strptime(t[:19], "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc).timestamp()
        except Exception:
            return 0
    events = sorted(({"at": (e.get("lastTimestamp") or e.get("eventTime") or "")[:19], "ns": e["involvedObject"].get("namespace", ""),
                      "kind": e["involvedObject"].get("kind"), "name": e["involvedObject"].get("name"),
                      "reason": e.get("reason"), "count": e.get("count", 1), "message": (e.get("message") or "")[:300]}
                     for e in ev_items if ev_time(e) >= cutoff), key=lambda r: r["at"], reverse=True)[:60]
    # crew#401 CP4: the hostnames the cluster publishes (HTTPRoute). bin/idp-catalogue-drift diffs
    # them against backstage/**/catalog-info.yaml; a list that failed is recorded, never left empty.
    hostnames_error = ""
    try:
        hostnames = sorted({h for r in get("/apis/gateway.networking.k8s.io/v1/httproutes")["items"]
                            for h in (r.get("spec") or {}).get("hostnames", [])})
    except Exception as e:
        hostnames, hostnames_error = None, f"{e}"[:300]
    # crew#227 CP4: SVIDs between agents are proven from two API rows, never asserted. (1) every
    # ClusterSPIFFEID with the controller-manager's stats (pods selected, entries rendered); (2) every
    # pod that mounts the csi.spiffe.io driver, which is the workload set that can hold an SVID.
    # A list that failed is recorded, never left empty.
    # crew#227 CP4 third row: possession. A CSI workload that finished (the spiffe-proof CronJob pod)
    # printed the SVID the agent issued; the SPIFFE IDs in its log are the receipt, read the same way
    # last_log reads a failed pod. A read that failed is recorded, never left empty.
    def pod_log(ns, name, container, tail=20):
        path = f"/api/v1/namespaces/{ns}/pods/{name}/log?container={container}&tailLines={tail}"
        try:
            req = urllib.request.Request("https://kubernetes.default.svc" + path, headers={"Authorization": "Bearer " + tok})
            with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                return r.read().decode("utf-8", "replace")[-2000:]
        except Exception as e:
            return f"log read failed: {e}"[:300]
    def mounts_csi(p):
        return any((v.get("csi") or {}).get("driver") == "csi.spiffe.io" for v in (p["spec"].get("volumes") or []))
    def spiffe_rows():
        try:
            ids = get("/apis/spire.spiffe.io/v1alpha1/clusterspiffeids")["items"]
            entries = [{"name": i["metadata"]["name"], **{k: v for k, v in (i.get("status") or {}).get("stats", {}).items()}}
                       for i in ids]
            err = ""
        except Exception as e:
            entries, err = None, f"{e}"[:300]
        workloads = sorted(f"{p['metadata']['namespace']}/{p['metadata']['name']}" for p in pods if mounts_csi(p))
        svids = []
        for p in pods:
            if not mounts_csi(p) or (p.get("status") or {}).get("phase") != "Succeeded":
                continue
            ns, name = p["metadata"]["namespace"], p["metadata"]["name"]
            for c in p["spec"].get("containers") or []:
                text = pod_log(ns, name, c["name"])
                svids.append({"pod": f"{ns}/{name}", "container": c["name"],
                              "spiffe_ids": sorted(set(re.findall(r"spiffe://[^\s\"',]+", text))),
                              "error": text[:300] if text.startswith("log read failed") else ""})
        # crew#227 CP4 fourth row (idp#336 residual): the receipt showed every proof pod failing with
        # "workload attestation failed" and nothing said why; the cause (the agent dialling 127.0.0.1
        # for the kubelet) was only in the spire-agent log, which no session can read. The agent pods'
        # last error, warning and attestation lines travel with the receipt; a read that failed is recorded.
        agents = []
        for p in pods:
            lbl = p["metadata"].get("labels") or {}
            if lbl.get("app.kubernetes.io/name") != "agent" or lbl.get("app.kubernetes.io/instance") != "spire":
                continue
            ns, name = p["metadata"]["namespace"], p["metadata"]["name"]
            text = pod_log(ns, name, "spire-agent", 60)
            failed = text.startswith("log read failed")
            lines = [] if failed else [l[:300] for l in text.splitlines() if re.search(r"level=(error|warning)|attest", l)][-6:]
            agents.append({"pod": f"{ns}/{name}", "node": (p["spec"].get("nodeName") or ""), "lines": lines,
                           "error": text[:300] if failed else ""})
        # crew#227 CP4 fifth row (receipt 2026-08-27T08:00:03Z): the agent said "No identity issued
        # registered=false" and the receipt could not say whether the server ever held an entry for the
        # proof pod, or under which parent. The spire-server and controller-manager lines that name an
        # entry, a parent, an attestation or the proof pod travel too; a read that failed is recorded.
        # Receipt 2026-08-27T08:45:03Z: the lines kept their last 300 chars, so `time= level= msg=` were
        # cut off every AttestAgent line and the verdict could not be read. logfmt puts the verdict first;
        # keep the head.
        server = []
        for p in pods:
            lbl = p["metadata"].get("labels") or {}
            if lbl.get("app.kubernetes.io/name") != "server" or lbl.get("app.kubernetes.io/instance") != "spire":
                continue
            ns, name = p["metadata"]["namespace"], p["metadata"]["name"]
            for c in p["spec"].get("containers") or []:
                if c["name"] not in ("spire-server", "spire-controller-manager"):
                    continue
                text = pod_log(ns, name, c["name"], 120)
                failed = text.startswith("log read failed")
                lines = [] if failed else [l[:300] for l in text.splitlines()
                                           if re.search(r"level=(error|warning)|attest|entry|parent|spiffe-proof", l, re.I)][-8:]
                server.append({"pod": f"{ns}/{name}", "container": c["name"], "lines": lines,
                               "error": text[:300] if failed else ""})
        return {"clusterspiffeids": entries, "error": err, "csi_workloads": workloads, "svids": svids, "agents": agents,
                "server": server}
    spiffe = spiffe_rows()
    # crew#227 CP3: every pod that calls OCI proves its identity in the receipt instead of an
    # assertion. The estate runs a BASIC_CLUSTER (platform/oci/main.tf), so per-pod OKE workload
    # identity (an Enhanced-cluster, billed feature) was declined; the answer in place is the
    # node's instance principal, granted by a dynamic group over the node pool (platform/oci/vault.tf).
    # This row proves that shape: which containers call the oci CLI/SDK, which auth mode each one
    # uses, and whether any of them still carries a static key (env var or a Secret volume named
    # for one) -- the thing OKE workload identity and instance principal both exist to remove.
    OCI_KEY_ENV = ("OCI_API_KEY", "OCI_PRIVATE_KEY", "OCI_API_PRIVATE_KEY", "OCI_CLI_KEY_FILE")

    def calls_oci(c):
        image = (c.get("image") or "")
        argv = " ".join((c.get("command") or []) + (c.get("args") or []))
        env_names = {e.get("name") for e in (c.get("env") or [])}
        return ("oci-cli" in image or re.search(r"(^|[\s\"'])oci\s", argv) is not None
                or bool(env_names & {"OCI_CLI_AUTH", "OCI_RESOURCE_PRINCIPAL_VERSION"}))

    def identity_of(c):
        argv = " ".join((c.get("command") or []) + (c.get("args") or []))
        env = {e.get("name"): e.get("value") for e in (c.get("env") or [])}
        if "--auth resource_principal" in argv or env.get("OCI_CLI_AUTH") == "resource_principal" \
                or "OCI_RESOURCE_PRINCIPAL_VERSION" in env:
            return "resource_principal"
        if "--auth instance_principal" in argv or env.get("OCI_CLI_AUTH") == "instance_principal":
            return "instance_principal"
        return "unknown"

    def static_key_names(p, c):
        env_hit = sorted(k for k in OCI_KEY_ENV if k in {e.get("name") for e in (c.get("env") or [])})
        mount_names = {m.get("name") for m in (c.get("volumeMounts") or [])}
        vol_hit = sorted(v["name"] for v in (p["spec"].get("volumes") or [])
                          if v["name"] in mount_names
                          and "oci" in (v.get("secret") or {}).get("secretName", "").lower())
        return env_hit + vol_hit

    oci_pods = []
    for p in pods:
        ns, name = p["metadata"]["namespace"], p["metadata"]["name"]
        for c in (p["spec"].get("containers") or []):
            if not calls_oci(c):
                continue
            oci_pods.append({"pod": f"{ns}/{name}", "container": c["name"], "identity": identity_of(c),
                              "static_key": static_key_names(p, c)})
    oci_pods.sort(key=lambda r: (r["pod"], r["container"]))
    oci_static_key_pods = sorted({r["pod"] for r in oci_pods if r["static_key"]})
    oci_unknown_identity_pods = sorted({r["pod"] for r in oci_pods if r["identity"] == "unknown"})
    at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
    head = (f"ok cluster-state at {at} nodes={len(node_rows)} ready={ready} pods={len(pods)} pods_not_ready={len(not_ready)}"
            f" flux={len(flux)} flux_not_ready={len(flux_not_ready)} ds={len(ds)} ds_short={len(ds_short)} events_warning={len(events)}"
            f" hostnames={len(hostnames or [])} spiffe_ids={len(spiffe['clusterspiffeids'] or [])} spiffe_workloads={len(spiffe['csi_workloads'])}"
            f" svids={sum(len(r['spiffe_ids']) for r in spiffe['svids'])} spire_agents={len(spiffe['agents'])}"
            f" oci_pods={len(oci_pods)} oci_static_key_pods={len(oci_static_key_pods)} policy_exceptions={len(policy_exceptions)}")
    body = {"at": at, "nodes": node_rows, "pods_total": len(pods), "pods_not_ready": not_ready,
            "flux": flux, "flux_not_ready": flux_not_ready, "policy_exceptions": policy_exceptions, "daemonsets": ds, "ds_short": ds_short, "events_warning": events,
            "hostnames": hostnames, "hostnames_error": hostnames_error, "spiffe": spiffe,
            "oci_identity": {"pods": oci_pods, "static_key_pods": oci_static_key_pods,
                              "unknown_identity_pods": oci_unknown_identity_pods}}
    sys.stdout.write(head + "\n" + json.dumps(body, sort_keys=True) + "\n")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-state
  namespace: backstage
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # crew#396: finished Jobs are removed an hour later so their pods never haunt the receipt
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      activeDeadlineSeconds: 180
      template:
        spec:
          priorityClassName: infrastructure-critical
          serviceAccountName: cluster-state
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: receipt
              # Same image and uid as platform/chaos/backstage-pod-kill.yaml; the CLI is python, so
              # the collector needs no second image and no kubectl.
              image: ghcr.io/oracle/oci-cli:20260826
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  python3 /collect/collect.py > /tmp/receipt
                  head -1 /tmp/receipt
                  oci --auth instance_principal os object put --bucket-name estate-drill-receipts \
                    --name state/cluster --file /tmp/receipt --content-type text/plain --force
              env:
                - { name: HOME, value: /tmp }
              volumeMounts:
                - { name: collect, mountPath: /collect, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                # crew#539 CP9: requests == limits -> Guaranteed QoS
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 100m, memory: 256Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: collect
              configMap: { name: cluster-state-collect }
            - name: tmp
              emptyDir: {}
