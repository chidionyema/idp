# The webhook door's secret, rendered where Flux can substitute it (same shape as
# platform/alerts-secret/flux-telegram.yaml): OTTO_WEBHOOK_SECRET (vault entry
# otto-staging-telegram, property webhook_secret) for the HTTPRoute's exact header
# match (platform/otto-golden/httproute.yaml), and OTTO_OPERATOR_CHAT_ID (vault entry
# notify-apprise-founder-telegram, property chat -- the same entry the alert channel
# reads) for the boot config's chat allowlist (platform/otto-golden/config.yaml).
# No manifest carries either value (LAW 46); a missing vault property fails this row
# by name, never fail-open -- the otto-golden row waits on this one, so the route is
# never applied with the literal '${OTTO_WEBHOOK_SECRET}' as its expected header.
#
# The same value must be registered with Telegram at connect time
# (setWebhook secret_token, docs/runbooks/otto-golden.md); Telegram then echoes it
# in X-Telegram-Bot-Api-Secret-Token on every delivery and the gateway drops the rest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otto-webhook
  namespace: flux-system
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: otto-webhook
    creationPolicy: Owner
  data:
    - secretKey: OTTO_WEBHOOK_SECRET
      remoteRef: { key: otto-staging-telegram, property: webhook_secret }
    - secretKey: OTTO_OPERATOR_CHAT_ID
      remoteRef: { key: notify-apprise-founder-telegram, property: chat }
