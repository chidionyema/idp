apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: mcp
  labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/part-of: idp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: agentgateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.4.1
          args: ["-f", "/config/agentgateway.yaml"]
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
            - { name: OTEL_SERVICE_NAME, value: mcp-agentgateway }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/mcp, readOnly: true }
            - { name: tmp, mountPath: /tmp }   # crew#458: writable /tmp under readOnlyRootFilesystem
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: config
          configMap: { name: mcp-config }
        - name: secrets
          secret: { secretName: mcp-gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: mcp
  labels: { app.kubernetes.io/name: agentgateway }
spec:
  selector: { app.kubernetes.io/name: agentgateway }
  ports:
    - { name: http, port: 3000, targetPort: http }
