apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: mcp
  labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/part-of: idp }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  replicas: 2   # crew#539: one pod is one node event away from a 503
  selector:
    matchLabels: { app.kubernetes.io/name: agentgateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgateway, app.kubernetes.io/part-of: idp }
    spec:
      # Two replicas on one node are one replica. DoNotSchedule, not ScheduleAnyway: a
      # best-effort spread silently collapses onto one node exactly when the cluster is tight,
      # which is the moment the spread was for.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: agentgateway }
      priorityClassName: infrastructure-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v1.4.1
          args: ["-f", "/config/agentgateway.yaml"]
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 15020 }   # crew#498: stats listener, scraped by platform/monitoring/rules/agentgateway-servicemonitor.yaml
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
            - { name: OTEL_SERVICE_NAME, value: mcp-agentgateway }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/mcp, readOnly: true }
            - { name: tmp, mountPath: /tmp }   # crew#458: writable /tmp under readOnlyRootFilesystem
          resources:
            # crew#539 CP9: requests == limits -> Guaranteed QoS, evicted last under node pressure
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: config
          configMap: { name: mcp-config }
        - name: secrets
          secret: { secretName: mcp-gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: mcp
  labels: { app.kubernetes.io/name: agentgateway }
spec:
  selector: { app.kubernetes.io/name: agentgateway }
  ports:
    - { name: http, port: 3000, targetPort: http }
    - { name: metrics, port: 15020, targetPort: metrics }
