# crew#539: a founder-facing surface survives losing one node.
# 2026-08-28 06:20-06:39Z one node was cordoned, the single agentgateway pod had nowhere to land, and
# the surface answered 503. maxUnavailable 1 is deliberate: a budget whose floor equals the replica
# count refuses every drain for ever -- that is what the clickhouse PDB did to this same drain at
# 06:30:43Z. Graded by bin/idp-availability-gate in bin/idp-ci.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentgateway
  namespace: mcp
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentgateway
---
# crew#539: agentgateway proxies mcp.${ESTATE_ZONE} to this server; a budget on the gateway alone
# left the second hop as the single point of failure.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: estate-mcp
  namespace: mcp
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: estate-mcp
---
# crew#539: agentgateway proxies mcp.${ESTATE_ZONE} to this server; a budget on the gateway alone
# left the second hop as the single point of failure.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: github-mcp
  namespace: mcp
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: github-mcp
