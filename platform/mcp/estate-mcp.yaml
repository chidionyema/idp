# estate-mcp ran only in the colima VM on the founder Mac with catalog/estate.db mounted from the
# checkout (mcp/agentgateway.yml); this row is the same server on the cluster; its inputs come from
# the estate-db artifact that bin/idp-estate-db-push publishes from the cloud catalog-render
# (.github/workflows/catalog-render.yml); the init container pulls it at start, so a rollout
# restart is a refresh; the file is opened immutable (-i) exactly as on the Mac.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Founder blueprint 2026-08-30 (4ca529a0.md): no hand-kept list of Secret names. Reloader
  # discovers every Secret and ConfigMap this pod references, and
  # platform/edge/require-auto-reload.yaml injects this annotation at admission, so git and the
  # cluster say the same thing.
  annotations:
    reloader.stakater.com/auto: "true"
  name: estate-mcp
  namespace: mcp
  labels: { app.kubernetes.io/name: estate-mcp, app.kubernetes.io/part-of: idp }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  replicas: 2   # crew#539: the second hop behind mcp.${ESTATE_ZONE}
  selector:
    matchLabels: { app.kubernetes.io/name: estate-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: estate-mcp, app.kubernetes.io/part-of: idp }
    spec:
      # Two replicas on one node are one replica. mcp.${ESTATE_ZONE} graded green on the
      # gateway while this, the server it proxies to, ran a single pod -- so the surface still
      # died with a node. crew#539.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: estate-mcp }
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull   # mirrored by pull-secret.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch-estate-db
          image: ghcr.io/fluxcd/flux-cli:v2.9.4
          args: ["pull", "artifact", "oci://ghcr.io/chidionyema/idp/estate-db:latest", "--output", "/data"]
          env:
            - { name: DOCKER_CONFIG, value: /creds }   # flux reads the registry login from $DOCKER_CONFIG/config.json
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: creds, mountPath: /creds, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: estate-mcp
          image: ghcr.io/chidionyema/estate-mcp
          command: ["datasette"]
          args: ["serve", "-i", "/data/estate.db", "-h", "0.0.0.0", "-p", "8001", "--plugins-dir", "/app/plugins"]
          ports:
            - { name: http, containerPort: 8001 }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
            - { name: OTEL_SERVICE_NAME, value: mcp-estate }
            - { name: ESTATE_DB_PATH, value: /data/estate.db }
            - { name: ESTATE_CATALOG_PATH, value: /data/catalog-info.yaml }
            - { name: ESTATE_STATE_MD_PATH, value: /data/STATE.md }
            - { name: ESTATE_STATE_JSON_PATH, value: /data/estate-state.json }   # crew#648, written by refresh-estate-state
            - { name: ESTATE_INVENTORY_BYTE_CEILING, value: "8000" }
            # crew#841: the same memory both Ottos write to, behind the one MCP voice, so a
            # crew session, an agent class or k8sgpt recalls what a chat taught the estate.
            # The self-hosted store takes no credential, so there is nothing here but a URL.
            - { name: ESTATE_MEMORY_URL, value: "http://hindsight-api.hindsight.svc:8888" }
            - { name: ESTATE_MEMORY_BANK, value: hermes }   # one bank, or context stops crossing surfaces
            # The investigator behind the ask_holmes tool (mcp/plugins/estate_holmes.py). Port 80
            # on this Service forwards to Holmes' own 5050; the fence for this conversation is
            # declared both ways in platform/ns-fences/allowances.yaml.
            - { name: ESTATE_HOLMES_URL, value: "http://robusta-holmes.robusta.svc.cluster.local" }
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
            - { name: tmp, mountPath: /tmp }   # crew#458: python tempfile needs one under readOnlyRootFilesystem
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 3
        # crew#648: the state document (.github/workflows/estate-state.yml publishes it every
        # 15 min) is refreshed in place every 10 min, so get_estate_state never reads a document
        # older than the 30-minute stale line in mcp/plugins/estate_state.py. estate.db stays as
        # the init container left it; only estate-state.json is rewritten.
        - name: refresh-estate-state
          image: ghcr.io/fluxcd/flux-cli:v2.9.4
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                # flux pull extracts the file with the archive's own mtime (flux push zeroes it for a
                # reproducible tar), so the probes below would never see a fresh file: run 33303322556
                # sat on ProgressDeadlineExceeded with the pull green. The touch is the receipt of a
                # successful refresh, which is the thing the probes grade.
                if flux pull artifact oci://ghcr.io/chidionyema/idp/estate-state:latest --output /data; then
                  touch /data/estate-state.json
                else
                  echo "estate-state pull failed"
                fi
                sleep 600
              done
          env:
            - { name: DOCKER_CONFIG, value: /creds }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }   # LAW 50: every container names the collector
            - { name: OTEL_SERVICE_NAME, value: mcp-estate-refresh }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: creds, mountPath: /creds, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # the probe is the stale line itself: a document older than 30 min means the refresh
          # loop is dead, and the kubelet restarts it instead of the server serving stale: true
          livenessProbe:
            exec: { command: ["sh", "-c", "find /data -name estate-state.json -mmin -30 | grep -q ."] }
            initialDelaySeconds: 60
            periodSeconds: 120
            failureThreshold: 3
          readinessProbe:
            exec: { command: ["sh", "-c", "find /data -name estate-state.json -mmin -30 | grep -q ."] }
            periodSeconds: 60
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
        - name: creds
          secret: { secretName: ghcr-pull, items: [ { key: .dockerconfigjson, path: config.json } ] }
---
apiVersion: v1
kind: Service
metadata:
  name: estate-mcp
  namespace: mcp
  labels: { app.kubernetes.io/name: estate-mcp, backstage.io/kubernetes-id: founder-mcp-gateway }
spec:
  selector: { app.kubernetes.io/name: estate-mcp }
  ports:
    - { name: http, port: 8001, targetPort: http }