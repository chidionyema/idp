# estate-mcp ran only in the colima VM on the founder Mac with catalog/estate.db mounted from the
# checkout (mcp/agentgateway.yml); this row is the same server on the cluster; its inputs come from
# the estate-db artifact that bin/idp-estate-db-push publishes from the cloud catalog-render
# (.github/workflows/catalog-render.yml); the init container pulls it at start, so a rollout
# restart is a refresh; the file is opened immutable (-i) exactly as on the Mac.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: estate-mcp
  namespace: mcp
  labels: { app.kubernetes.io/name: estate-mcp, app.kubernetes.io/part-of: idp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: estate-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: estate-mcp, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull   # mirrored by pull-secret.yaml
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch-estate-db
          image: ghcr.io/fluxcd/flux-cli:v2.9.4
          args: ["pull", "artifact", "oci://ghcr.io/chidionyema/idp/estate-db:latest", "--output", "/data"]
          env:
            - { name: DOCKER_CONFIG, value: /creds }   # flux reads the registry login from $DOCKER_CONFIG/config.json
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: creds, mountPath: /creds, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: estate-mcp
          image: ghcr.io/chidionyema/estate-mcp
          command: ["datasette"]
          args: ["serve", "-i", "/data/estate.db", "-h", "0.0.0.0", "-p", "8001", "--plugins-dir", "/app/plugins"]
          ports:
            - { name: http, containerPort: 8001 }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
            - { name: OTEL_SERVICE_NAME, value: mcp-estate }
            - { name: ESTATE_DB_PATH, value: /data/estate.db }
            - { name: ESTATE_CATALOG_PATH, value: /data/catalog-info.yaml }
            - { name: ESTATE_STATE_MD_PATH, value: /data/STATE.md }
            - { name: ESTATE_INVENTORY_BYTE_CEILING, value: "8000" }
          volumeMounts:
            - { name: data, mountPath: /data, readOnly: true }
            - { name: tmp, mountPath: /tmp }   # crew#458: python tempfile needs one under readOnlyRootFilesystem
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
        - name: creds
          secret: { secretName: ghcr-pull, items: [ { key: .dockerconfigjson, path: config.json } ] }
---
apiVersion: v1
kind: Service
metadata:
  name: estate-mcp
  namespace: mcp
  labels: { app.kubernetes.io/name: estate-mcp }
spec:
  selector: { app.kubernetes.io/name: estate-mcp }
  ports:
    - { name: http, port: 8001, targetPort: http }