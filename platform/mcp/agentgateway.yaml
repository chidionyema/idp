# agentgateway config, mounted from the mcp-config ConfigMap. The /estate/mcp route is back now
# that estate.db has a cluster producer (bin/idp-estate-db-push in the cloud catalog-render,
# crew#458 row 3). Traces go to the estate collector (LAW 50).
#
# THIS BLOCK IS CORRECT AND THE GATEWAY STILL EXPORTS NOTHING. Both statements are true and neither
# should be read as the other.
#
# What is verified 2026-09-13: otlpEndpoint points at the collector's gRPC port; the collector's
# ConfigMap has an `otlp` receiver on 4317 and a `traces` pipeline wired from it to ClickHouse; the
# Deployment mounts this file at /config and passes -f /config/agentgateway.yaml, and the mounted
# copy carries these two lines. Nothing is misconfigured on either side.
#
# What is also true: signoz_traces holds 1,213,685 litellm spans and 21,802 agent-workforce spans
# and ZERO for mcp-agentgateway, and the gateway's own /metrics (13,796 bytes) exposes no otel,
# trace, export or otlp series at all -- so the tracing pipeline is not merely failing, it is not
# initialised. `otlpProtocol` defaults to `grpc` in the pinned schema, so naming it here changes no
# behaviour; it is written down so the next reader does not have to check the default to know.
#
# The open question is why a correctly-specified tracing block produces no initialised exporter in
# agentgateway v1.4.1. That is not answerable from the estate's side and is tracked separately.
frontendPolicies:
  logging:
    otlp:
      # THE ACCESS LOG GOES TO THE COLLECTOR OVER OTLP. This is the path the tracing block above
      # did not give us: measured 2026-09-13, the gateway exports no spans at all, but the
      # collector's `logs` pipeline is healthy -- 7,499,990 rows in ten minutes against the traces
      # pipeline's silence. A log line carrying protocol=mcp and mcp.method.name is enough to know
      # an agent called a tool, which is the fact the evidence layer needs.
      #
      # THE PLACEMENT IS THE WHOLE TRICK, and it took four refusals to find. `logging` at the config
      # root takes RawLogging (filter/fields/level only, no exporter). LoggingPolicy -- the type
      # that owns `otlp` -- is reachable ONLY through the top-level `frontendPolicies`, which is
      # typed LocalFrontendPolicies. Both facts are in the pinned v1.4.1 schema and neither is
      # guessable: `check-jsonschema` refused config.logging.otlp, binds[].policies.logging.otlp,
      # listeners[].policies.logging.otlp and listeners[].policies.accessLog.otlp before this one
      # validated.
      #
      # The port rides on the hostname. `port:` as a sibling is refused because the plain-host arm
      # of OtlpLoggingConfig's oneOf takes `host` alone.
      host: signoz-otel-collector.observability.svc.cluster.local:4317
      protocol: grpc
config:
  tracing:
    otlpEndpoint: http://signoz-otel-collector.observability.svc:4317
    otlpProtocol: grpc
binds:
- port: 3000
  listeners:
  - name: mcp
    routes:
    - name: github
      matches:
      - path:
          exact: /github/mcp
      policies:
        apiKey:
          mode: strict
          keys:
          # SHA-256 of MCP_GATEWAY_KEY (vault entry mcp-gateway); the key itself is never in git or env.
          - keyHash: sha256:a4f5939a14493c1d44cdad51bb1c824d109f23dfb872fc9d40e2d93d470e313a
      backends:
      - mcp:
          statefulMode: stateless
          targets:
          - name: github
            mcp:
              host: http://github-mcp.mcp.svc:8082/mcp
            policies:
              backendAuth:
                key:
                  value:
                    file: /run/secrets/mcp/GITHUB_MCP_TOKEN
    - name: estate
      matches:
      - path:
          exact: /estate/mcp
      policies:
        apiKey:
          mode: strict
          keys:
          # SHA-256 of MCP_GATEWAY_KEY (vault entry mcp-gateway); the key itself is never in git or env.
          - keyHash: sha256:a4f5939a14493c1d44cdad51bb1c824d109f23dfb872fc9d40e2d93d470e313a
      backends:
      - mcp:
          statefulMode: stateless
          targets:
          - name: estate
            mcp:
              host: http://estate-mcp.mcp.svc:8001/-/mcp
