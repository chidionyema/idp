# MCP row (crew#458): the estate's MCP gateway on the cluster, reached at mcp.<zone> through the
# https-mcp listener on prospector-edge. Replaces the colima VM on the founder Mac that ran the
# same three containers (mcp/agentgateway.yml), the last platform layer that was Mac-bound.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
    availability.idp/tier: founder-facing
    idp.estate/edge-attach: "true"
