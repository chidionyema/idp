apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    backstage.io/kubernetes-id: founder-mcp-gateway
  name: mcp
  namespace: mcp
  annotations:
    idp.estate/auth: api-key
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-mcp
  hostnames:
    - "mcp.${ESTATE_ZONE}"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: agentgateway
          port: 3000
