apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp
  annotations:
    idp.estate/auth: api-key
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-mcp
  hostnames:
    - "mcp.${ESTATE_ZONE}"
  rules:
    - backendRefs:
        - name: agentgateway
          port: 3000
