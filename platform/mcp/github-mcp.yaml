# GitHub's own MCP server, read-only, issues toolset only, the same flags the compose file ran.
# It carries no token: agentgateway adds the Authorization header per request (backendAuth).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  namespace: mcp
  labels: { app.kubernetes.io/name: github-mcp, app.kubernetes.io/part-of: idp }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  replicas: 2   # crew#539: the second hop behind mcp.${ESTATE_ZONE}
  selector:
    matchLabels: { app.kubernetes.io/name: github-mcp }
  template:
    metadata:
      labels: { app.kubernetes.io/name: github-mcp, app.kubernetes.io/part-of: idp }
    spec:
      # Two replicas on one node are one replica. mcp.${ESTATE_ZONE} graded green on the
      # gateway while this, the server it proxies to, ran a single pod -- so the surface still
      # died with a node. crew#539.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: github-mcp }
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: github-mcp
          image: ghcr.io/github/github-mcp-server:v1.10.1
          args: ["http", "--listen-host", "0.0.0.0", "--port", "8082", "--read-only", "--toolsets", "issues"]
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
            - { name: OTEL_SERVICE_NAME, value: mcp-github }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # crew#458: writable /tmp under readOnlyRootFilesystem
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp
  namespace: mcp
  labels: { app.kubernetes.io/name: github-mcp, backstage.io/kubernetes-id: founder-mcp-gateway }
spec:
  selector: { app.kubernetes.io/name: github-mcp }
  ports:
    - { name: http, port: 8082, targetPort: http }
