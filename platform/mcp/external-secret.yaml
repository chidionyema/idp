# The gateway's own API key and the GitHub token the github route forwards. Written to the vault by
# .github/workflows/vault-seed.yml -f entry=mcp-gateway from SEED_MCP_GATEWAY_KEY / SEED_GITHUB_MCP_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: mcp-gateway, creationPolicy: Owner }
  dataFrom:
    - extract: { key: mcp-gateway }
