# The gateway's own API key rides the vault entry (born by bin/idp-estate-seed); the GitHub token
# the github route forwards is minted in-cluster by the GithubAccessToken generator below -- the
# same day-0 shape as platform/hermes-agent/gateway.yaml (idp#852 deleted the hourly off-cluster
# re-mint and the vault-held 1h token died with it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway
  namespace: mcp
  annotations:
    idp.platform/reload-on-mint: >-
      github-mcp reads the mounted token at boot, so the roll is how a fresh token reaches it; every 10m is 1448 revisions and waste against a 60m token, tracked in Linear (cyrus654 follow-up)
spec:
  # Below the minted token's 60-minute life; each refresh mints a fresh installation token.
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: mcp-gateway, creationPolicy: Owner }
  dataFrom:
    # Merged in the order listed; the minted token wins over any stale GITHUB_MCP_TOKEN field.
    - extract: { key: mcp-gateway }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: mcp-github
      rewrite:
        - transform: { template: "GITHUB_MCP_TOKEN" }
---
# Same lane, same substitution road as platform/hermes-agent/gateway.yaml (LAW 46: identifiers
# come from the flux-system/github-app Secret by strict envsubst, never a literal in git).
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: mcp-github
  namespace: mcp
spec:
  appID: ${githubAppIDQuoted}
  installID: ${githubAppInstallationIDQuoted}
  permissions:
    metadata: read
    contents: write
    pull_requests: write
    issues: write
    checks: read
  auth:
    privateKey:
      secretRef:
        name: github-app-pem
        key: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-github-app-pem
  namespace: mcp
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: github-app-pem
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .pem_b64 | b64dec }}"
  dataFrom:
    - extract: { key: github-app }
---
# The same vault field platform/unified-memory-server/oke-unified-memory.yaml reads for the
# server itself (bin/idp-estate-seed mints it once: entry unified-memory, property
# surface-token), delivered a second time into this namespace -- one vault key, two consumers,
# the same shape platform/estate-db/cluster/secrets.yaml and platform/research-engine/secrets.yaml
# already use for a role password read by more than one namespace. estate_memory.py
# (mcp/plugins/estate_memory.py) reads it from the mounted file named MEMORY_SURFACE_TOKEN,
# never from a literal env value (Kyverno secrets-not-from-env-vars).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-mcp-memory
  namespace: mcp
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: estate-mcp-memory
    creationPolicy: Owner
    template:
      data:
        MEMORY_SURFACE_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef: { key: unified-memory, property: surface-token }
