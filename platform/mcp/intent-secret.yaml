# idp#8061: the cloud execution door is not a Mac endpoint.
# ESO supplies the already-authorised cloud-only endpoint and its independent
# scoped token. An absent Vault record is BLIND, never a laptop fallback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-intent
  namespace: mcp
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: cloud-intent, creationPolicy: Owner }
  data:
    - secretKey: url
      remoteRef: { key: cloud-intent, property: url }
    - secretKey: token
      remoteRef: { key: cloud-intent, property: token }
