# The estate-mcp pod's credential for the LAPTOP's programmatic intent door (idp#7579 R2).
#
# The pod ships the intent library and no executor and no plan ledger, so its intent path is
# the laptop's door: the laptop owns the gate, the ledger and the audit, and the pod never
# grows a second gate. This credential is scoped to exactly that -- it runs COMMITTED intents
# through the laptop's own door and nothing else. It is NOT the mac-door token (that one runs
# arbitrary commands) and NOT the voice key (that one is a router key).
#
# The token rides as a FILE, never as an environment variable: an env var is in every crash
# dump and every /proc of the pod. `optional: true` on the mount, because a vault that has not
# synced yet must be a pod whose intent path says "no laptop door configured", never a pod that
# cannot start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleetview-intent
  namespace: mcp
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: fleetview-intent, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: fleetview-intent, property: token }
