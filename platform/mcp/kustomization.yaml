apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp
resources:
  - namespace.yaml
  - external-secret.yaml
  - agentgateway-deploy.yaml
  - github-mcp.yaml
  - httproute.yaml
configMapGenerator:
  - name: mcp-config
    files:
      - agentgateway.yaml
generatorOptions:
  disableNameSuffixHash: false
