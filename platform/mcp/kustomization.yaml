apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp
resources:
  - namespace.yaml
  - external-secret.yaml
  - pull-secret.yaml
  - agentgateway-deploy.yaml
  - availability.yaml
  - github-mcp.yaml
  - estate-mcp.yaml
  - httproute.yaml
  - edge-manners.yaml
  # The context broker and its private engine. One pod, two containers, one Service: the
  # Service reaches the broker only. The engine has no Service, so nothing in the cluster can
  # address it except the broker inside the same pod.
  - estate-context-broker.yaml
images:
  # The broker's image. The tag is written by image-automation-controller from ImagePolicy
  # flux-system/estate-context-broker; the marker is how it finds the line. The placeholder is
  # the estate's convention for "not yet built": the number is 0, so any real build wins it.
  - name: ghcr.io/chidionyema/estate-context-broker
    newTag: main-0-0000000000000000000000000000000000000000 # {"$imagepolicy": "flux-system:estate-context-broker:tag"}
  # The engine's image, pinned to the same pod. The two must move together, so they are written
  # by ONE automation in ONE commit to this file.
  - name: ghcr.io/chidionyema/gortex-engine
    newTag: main-0-0000000000000000000000000000000000000000 # {"$imagepolicy": "flux-system:gortex-engine:tag"}
  # build-multiarch pushes ghcr.io/chidionyema/estate-mcp:main-<run>-<sha> (crew#458 row 3, crew#516 CP3).
  # The first main build after this file merges writes the tag; until then the Deployment cannot
  # pull and Flux reports it. image-automation-controller rewrites the newTag line from
  # ImagePolicy flux-system/estate-mcp; the marker is how it finds the line.
  - name: ghcr.io/chidionyema/estate-mcp
    # 2026-10-26: main-14831 was an August build, so the pod ran a door that could not be handed
    # evidence (its `remember` advertised content/kind/runtime/source/subject/tags only) while
    # main's plugin had offered instrument/evidence/authority since #7166. Measured that hour:
    # 193 of 193 memories raw_source, and `bin/memory-gate` failing at rung 3 on the pod
    # (AttributeError: module 'em' has no attribute 'claim_checker'). Pinned to the build of the
    # main that carries it, so Flux converges on the door every agent writes through.
    newTag: main-14931-5b52f36c580e070d98ecc1d8aa403f7272d11b5a # {"$imagepolicy": "flux-system:estate-mcp:tag"}
configMapGenerator:
  - name: mcp-config
    files:
      - agentgateway.yaml
generatorOptions:
  disableNameSuffixHash: false
# WAVE 1 OF THE ROLL ONTO THE ENFORCING CNI.
#
# 10-calico.conflist sorts before 10-flannel.conflist in /etc/cni/net.d, so Calico wins the CNI
# race and any pod created from now on is wired by Calico and judged by the estate's 154
# NetworkPolicy objects. Pods created before that are still on flannel and judged by nothing.
# Measured 2026-09-08: 108 running pods on flannel, 39 on Calico. Every fence in the estate is
# decoration for the flannel half.
#
# The restart is this annotation, not a command. Changing its value changes the pod template, so
# Flux performs the rollout; nothing needs a token, a drain or a founder tap, and reverting the
# value reverts the roll. A drain was measured and refused: two nodes, 144 running pods, a
# 110-pod ceiling each, so one node's pods do not fit on the other and a third node is capacity
# we are not buying.
#
# Bump the value to roll these workloads again.
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: estate-mcp
        namespace: mcp
      spec:
        template:
          metadata:
            annotations:
              idp.internal/cni-generation: "2"
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: github-mcp
        namespace: mcp
      spec:
        template:
          metadata:
            annotations:
              idp.internal/cni-generation: "2"
