# This ConfigMap configures a self-hosted (operatorless) Calico installation in the kubernetes
# datastore. Byte-source: Calico v3.32.2 `manifests/calico.yaml`
# (raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml). Typha is off
# (2-node estate; the operator path's typha bloat was a stated Road B reason to go operatorless).
kind: ConfigMap
apiVersion: v1
metadata:
  name: calico-config
  namespace: kube-system
data:
  # Typha is disabled.
  typha_service_name: "none"
  # Configure the backend to use.
  calico_backend: "bird"
  # Configure the MTU to use for workload interfaces and tunnels.
  # By default, MTU is auto-detected, and explicitly setting this field should not be required.
  # You can override auto-detection by providing a non-zero value.
  veth_mtu: "0"
  # The CNI network configuration to install on each node. The special values in this config
  # will be automatically populated by install-cni.
  cni_network_config: |-
    {
      "name": "k8s-pod-network",
      "cniVersion": "1.0.0",
      "plugins": [
        {
          "type": "calico",
          "log_level": "info",
          "log_file_path": "/var/log/calico/cni/cni.log",
          "datastore_type": "kubernetes",
          "nodename": "__KUBERNETES_NODE_NAME__",
          "mtu": __CNI_MTU__,
          "ipam": {
              "type": "calico-ipam"
          },
          "policy": {
              "type": "k8s"
          },
          "kubernetes": {
              "kubeconfig": "__KUBECONFIG_FILEPATH__"
          }
        },
        {
          "type": "portmap",
          "snat": true,
          "capabilities": {"portMappings": true}
        }
      ]
    }
