apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CRDs first, then the HelmRelease. The tigera-operator chart does not bundle its CRDs and renders
# an Installation/APIServer custom resource at install, so the API server must already hold these
# kinds when the operator helm release reconciles, or helm fails at render with the 32-hour
# `no matches for kind "APIServer" in operator.tigera.io/v1` this ordering fixes.
resources:
  - crds
  - calico.yaml
