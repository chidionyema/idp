apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The operator.tigera.io CRDs the tigera-operator helm chart needs but does not ship. Kept to the
# three kinds an open-source, cloud-agnostic Calico datapath reconciles (Installation, APIServer,
# Tigerastatus) -- SOURCE.md records why the rest of the 25-CRD upstream catalog is deliberately
# not vendored. Listed FIRST in platform/calico/kustomization.yaml so the API server holds these
# kinds before this Flux Kustomization's HelmRelease tries to render an Installation and an
# APIServer custom resource.
resources:
  - operator/operator.tigera.io_apiservers.yaml
  - operator/operator.tigera.io_installations.yaml
  - operator/operator.tigera.io_tigerastatuses.yaml
