# crew#524 CP5 — the sandbox is this pod, not a docker-in-pod or a Job (attributed 2026-08-27):
# the Hermes fork's tools/terminal_tool.py has backends local, docker, ssh, singularity, modal,
# daytona, vercel_sandbox and no Kubernetes Job backend; the gateway sets no terminal.backend, so
# tool commands run `local` inside this container. That container is the admitted sandbox:
# non-root 10001, readOnlyRootFilesystem, all capabilities dropped, RuntimeDefault seccomp, no
# privilege escalation, Kyverno baseline. The `sandbox:` block in hermes-v2 config.yaml (pinned
# image, :ro mounts) is honoured only where Docker exists (a Mac) and is inert here. A Job backend
# would be a fork feature nobody upstream maintains (LAW 43); the row states this instead.
# The Architect (hermes-agent gateway, Telegram + a2a) on OKE: crew#516 CP4, 2026-08-27.
#
# What runs here is what the Mac's ai.architect.gateway launchd job used to run (booted out;
# measured 2026-09-03, `launchctl list` names no architect or hermes job on the Mac): the image
# ghcr.io/chidionyema/hermes-agent carries the hermes-v2 repo (config.yaml, SOUL.md, skills/,
# cron/watch.jobs, cron/work.jobs) at /app/estate and boots through deploy/k8s/entrypoint.sh,
# which copies that build over HERMES_HOME=/data (this PVC) and leaves the state on it alone:
# state.db, sessions/, memories/, cron/jobs.json, auth.json. A new image changes what the agent
# is, never what it remembers; a pod restart loses nothing.
#
# Telegram does not live here (founder 2026-09-05, after both bots sat silent for a day). This pod
# used to register the bot's webhook with Telegram itself on every start (adapter connect(), the
# pinned fork's plugins/platforms/telegram/adapter.py) and point it at its own /telegram door. That
# door has been dead since the adapter hung at "Connecting to Telegram (attempt 1/8)", so every
# restart of this pod silently took the bot away from otto-gateway, which is the estate's one
# ingress for every channel. The token is now renamed out of this pod's environment by the
# ExternalSecret below, which is what the fork's gateway/config.py reads to decide whether the
# Telegram platform exists at all (`telegram_token = getenv("TELEGRAM_BOT_TOKEN")`): with no token
# the platform is never loaded, so this pod cannot call setWebhook, cannot long-poll, and cannot
# take the bot back. The a2a port (9900) stays in-cluster behind the Service and is what talks to
# this agent now. The token rule stands and is simply held elsewhere: one TELEGRAM_BOT_TOKEN, one
# process, and that process is otto-gateway (platform/otto-gateway).
#
# Secrets: one vault entry, hermes-agent-env, the env names the gateway reads (.env on the Mac),
# seeded by oke-check's vault-put step from SEED_HERMES_* repo secrets, never a value in git
# (LAW 21, LAW 46). Same security shape as platform/llm/litellm.yaml: non-root, read-only root
# filesystem, no privilege escalation, seccomp RuntimeDefault; the two writable paths are the
# volume and /tmp.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: hermes-agent
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
    idp.estate/edge-attach: "true"   # the shared Gateway (prospector-edge) selects route namespaces by this label
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-env
  namespace: hermes-agent
spec:
  # 45m keeps every mint inside the token's 60-minute life (vendor page, generator/github: "Github
  # tokens expire after 60 minutes ... choose a refreshInterval that is below this number").
  # 10m was the churn that broke Otto on 2026-08-31 (crew#736, comment 5480700014): every sync
  # mints a different token, the Secret changes, Reloader rolls the single-replica Recreate pod,
  # and the bot was down ~4.5 of every 10 minutes. 45m keeps the token fresh and cuts the rolls
  # 4.5x; webhook mode above makes each remaining roll lossless.
  refreshInterval: 45m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: hermes-agent-env, creationPolicy: Owner }
  dataFrom:
    # Merged in the order listed (ExternalSecret API: "If multiple dataFrom are specified, secrets
    # are merged in the specified order"), so the token minted below always wins over the stale
    # GITHUB_TOKEN field the vault entry still carries from the retired refresh lane (idp#852).
    #
    # Founder 2026-09-05: every TELEGRAM_* field of the vault entry is renamed on the way in, so the
    # entrypoint exports DISABLED_TELEGRAM_BOT_TOKEN and the fork's config loader finds no
    # TELEGRAM_BOT_TOKEN, never enables the Telegram platform, and never registers a webhook. A
    # rename, not a deletion: the vault entry is untouched and otto-gateway keeps reading the same
    # value from it, so there is one token and one holder. Keys that do not match are passed
    # through unchanged (ESO applies the regexp to every key and leaves non-matches alone).
    - extract: { key: hermes-agent-env }
      rewrite:
        - regexp: { source: "^TELEGRAM_(.*)$", target: "DISABLED_TELEGRAM_$1" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: hermes-agent-github
      rewrite:
        - transform: { template: "GITHUB_TOKEN" }
---
# Otto's GitHub credential, day 0 (founder 2026-08-30: "otto is infra ... not afterthought").
# idp#852 deleted verify-drill.yml and the hourly `bin/idp-github-app refresh` re-mint rode inside
# it, so the 1h installation token in the vault died within the hour and the gateway lost GitHub.
# The mint now lives where the consumer lives: external-secrets' GithubAccessToken generator mints
# a fresh installation token of the estate-agents App on every refresh of the ExternalSecret above,
# narrowed to the same application-engineer lane as platform/github-app/lanes.json. No workflow,
# no script, no vault hop: freshness is a property of the platform layer, never of a drill.
# ${githubAppIDQuoted} / ${githubAppInstallationIDQuoted} are substituted by Flux from the
# flux-system/github-app Secret; the Quoted variants carry their own double quotes because
# kustomize build re-emits every scalar plain (incident run 33339964930: a bare numeral
# parses as int and the API server refuses spec.appID). Source of the keys:
# flux-system/github-app Secret (platform/alerts-github/github-app.yaml; this row's substituteFrom
# in clusters/oke/platform.yaml) -- account identifiers never typed in git (LAW 46).
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: hermes-agent-github
  namespace: hermes-agent
spec:
  appID: ${githubAppIDQuoted}
  installID: ${githubAppInstallationIDQuoted}
  permissions:
    metadata: read
    contents: write
    pull_requests: write
    issues: write
    checks: read
  auth:
    privateKey:
      secretRef:
        name: github-app-pem
        key: key
---
# The App's private key for the generator, rendered the way flux-writer renders it
# (platform/image-automation/flux-writer.yaml): from the one vault entry `github-app` that
# bin/idp-github-app writes. ESO rewrites the Secret only when the value changes, so a stable key
# never rolls the pod through the Reloader annotation; a rotated App key rolls it, which is right.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-github-app-pem
  namespace: hermes-agent
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: github-app-pem
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .pem_b64 | b64dec }}"
  dataFrom:
    - extract: { key: github-app }
---
# crew#516 CP4 (2026-08-27, receipt 33116314460): the a2a adapter binds 127.0.0.1 unless a bearer
# token is configured (hermes-agent plugins/platforms/a2a/security.py resolve_bind_host), so the
# kubelet's probe on the pod IP was "connection refused" 151 times and the pod was killed every five
# minutes. The token is generated once in the cluster by ESO's Password generator, never seeded,
# never in git, and projected into the same env dir the entrypoint exports.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-agent-a2a
  namespace: hermes-agent
spec:
  length: 48
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-a2a
  namespace: hermes-agent
spec:
  refreshInterval: "0"   # generated once; a rotation under a running gateway is a deliberate change
  target: { name: hermes-agent-a2a, creationPolicy: Owner }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-agent-a2a
      rewrite:
        - transform: { template: "A2A_BEARER_TOKEN" }
---
# HERMES_HOME. 5Gi is the Mac's checkout today (state.db, sessions, hindsight, kanban) with room.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: hermes-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent-gateway
  namespace: hermes-agent
  labels:
    backstage.io/kubernetes-id: founder-telegram
    app.kubernetes.io/name: hermes-agent-gateway
spec:
  selector:
    app: hermes-agent-gateway
  ports:
    - name: a2a
      port: 9900
      targetPort: a2a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent-gateway
  namespace: hermes-agent
  annotations:
    # Reloader (platform/reloader) rolls the pod when a vault entry lands through ESO (1h refresh).
    # Founder blueprint 2026-08-30 (~/.claude/docs/founder/2026-08-30T2326Z-*-4ca529a0.md): the
    # enumerated reload list is deleted, not maintained -- it silently omitted hermes-agent-langfuse
    # the day the Secret was added (this PR), the same class as idp#955. `auto` discovers every
    # Secret/ConfigMap this pod consumes (projected sources included: getVolumeMountName,
    # stakater/Reloader tag chart-v2.2.16, internal/pkg/handler/upgrade.go). No list, no stale list.
    reloader.stakater.com/auto: "true"
    # crew#561: mac-run has NO Reloader annotation, deliberately. It is a subPath mount, and a
    # subPath never sees a ConfigMap update, so idp#955 named the ConfigMap here. That could not
    # work: the script had already changed in idp#949 at 05:45Z, Reloader only acts on a change it
    # observes after it starts watching, and otto-parity 33297784151 at 06:53Z still ran the old
    # copy with Flux green. mac-run is now rendered by a configMapGenerator (kustomization.yaml),
    # so its name carries a content hash, the volume reference below changes with the script, and
    # the Deployment itself rolls. A hashed name can never match a static annotation either.
  labels:
    app: hermes-agent-gateway
    app.kubernetes.io/name: hermes-agent-gateway
    app.kubernetes.io/part-of: hermes-agent
spec:
  # One process holds the Telegram token and the volume; Recreate so a rollout never overlaps.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent-gateway
  template:
    metadata:
      labels:
        app: hermes-agent-gateway
        app.kubernetes.io/name: hermes-agent-gateway
    spec:
      priorityClassName: infrastructure-critical
      serviceAccountName: hermes-agent   # crew#561 CP2: rbac.yaml, reads its own namespace only
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/chidionyema/hermes-agent
          imagePullPolicy: IfNotPresent
          # Kyverno secrets-not-from-env-vars (crew#341) refuses envFrom/secretKeyRef, the same as
          # it refused litellm on 2026-08-26 (crew#284). The Secret is mounted as files and the
          # image's entrypoint exports every file under HERMES_ENV_DIR as an env var itself.
          env:
            - name: HERMES_HOME
              value: /data
            - name: HERMES_ENV_DIR
              value: /run/secrets/hermes-agent-env
            - name: HOME
              value: /data
            # crew#524 CP1: the self-hosted Hindsight row (platform/hindsight). A URL alone makes the
            # hermes hindsight plugin available (`has_key or has_url`); no key on a self-host.
            - name: HERMES_ESTATE_YAML   # crew#524 CP2: the estate from git (estate.yaml ConfigMap)
              value: /etc/hermes/estate.yaml
            - name: HINDSIGHT_API_URL
              value: http://hindsight-api.hindsight.svc:8888
            # crew#717 wave 1: where the observability plugin sends Otto's traces (LAW 50). The keys
            # arrive in the env dir from langfuse-key.yaml; a URL with no keys is inert.
            - name: LANGFUSE_BASE_URL
              value: http://langfuse-web.observability.svc:3000
            - name: HERMES_LANGFUSE_ENV
              value: production
            - name: PYTHONUNBUFFERED
              value: "1"
            # crew#516 CP4: bind a2a on the pod IP so the probes below reach it; A2A_BEARER_TOKEN
            # (hermes-agent-a2a, above) is what lets the adapter leave loopback. The agent card is
            # public by design; every POST needs the token.
            - name: A2A_HOST
              value: 0.0.0.0
            # crew#516 CP5: mac-run.tpl's only variables (LAW 46 — the Mac's tailnet IP and login
            # user are named nowhere else). ConfigMap, not Secret: neither is a credential, Tailscale
            # SSH authenticates by tailnet node identity, not by these values.
            - name: FOUNDER_MAC_USER
              value: "${FOUNDER_MAC_USER}"
            - name: FOUNDER_MAC_TS_IP
              value: "${FOUNDER_MAC_TS_IP}"
          ports:
            - containerPort: 9900
              name: a2a
          # /.well-known/agent-card.json is the a2a adapter's own health surface (config.yaml
          # platforms.a2a.enabled: true, port 9900). The first boot copies the build and renders
          # estate.yaml before the gateway starts; the startup probe covers that.
          startupProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # crew#584: radio-room set, Guaranteed QoS required (require-priority-class) -- request
            # cut to 50m, limit held equal.
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              cpu: 50m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: env
              mountPath: /run/secrets/hermes-agent-env
              readOnly: true
            - name: estate
              mountPath: /etc/hermes
              readOnly: true
            # crew#516 CP5: the founder's mac-run script, executable, never baked into the image.
            - name: mac-run
              mountPath: /usr/local/bin/mac-run
              subPath: mac-run
            # crew#751 CP1: same hashed ConfigMap as mac-run, second subPath. A new file in the
            # generator changes the ConfigMap name, so the pod rolls (crew#561).
            - name: mac-run
              mountPath: /usr/local/bin/cursor-agent
              subPath: cursor-agent
              readOnly: true
            # crew#561: mac-run's key to the Mac's sshd (mac-run-key.yaml); optional so the gateway
            # still starts before the first apply has minted it, and mac-run says so (exit 2).
            - name: mac-run-key
              mountPath: /run/secrets/hermes-agent-mac-run
              readOnly: true
        # crew#516 CP5 (founder order, crew#66 5451614620 + addendum): the tailnet identity for
        # this pod, so the gateway container's mac-run reaches the Mac through the SOCKS5 proxy
        # below instead of a sidecar-free "figure out the network" ask nobody made of Otto.
        # TS_USERSPACE=true: no tun device, no NET_ADMIN, unchanged securityContext (LAW 21).
        # TS_KUBE_SECRET="": state lives on the existing PVC, not a second Kubernetes Secret this
        # pod would need RBAC to write. TS_AUTHKEY is a file (Kyverno secrets-not-from-env-vars,
        # crew#341; verified against containerboot's own source,
        # github.com/tailscale/tailscale/blob/main/cmd/containerboot/main.go: "If the value begins
        # with file:, it is treated as a path to a file containing the key").
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.3  # tailscale/tailscale releases/latest 2026-08-29; v1.80.2 was never on ghcr (404), the sidecar sat in ImagePullBackOff
          env:
            - name: TS_AUTHKEY
              value: file:/run/secrets/hermes-agent-tailscale/TS_AUTHKEY
            - name: TS_HOSTNAME
              value: hermes-pod
            - name: TS_USERSPACE
              value: "true"
            - name: TS_STATE_DIR
              value: /data/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_SOCKET
              value: /tmp/tailscaled.sock
            - name: TS_SOCKS5_SERVER
              value: localhost:1055
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:k8s
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          # require-pod-probes (Kyverno, autogen-validate-probes) needs every container in the pod
          # to carry one; `tailscale status --socket` talks to the local tailscaled over the same
          # TS_SOCKET this container sets, so a probe failure is the sidecar's own state, not the
          # gateway's a2a endpoint.
          readinessProbe:
            exec:
              command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"]
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"]
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: tailscale-authkey
              mountPath: /run/secrets/hermes-agent-tailscale
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: tmp
          emptyDir: {}
        - name: env
          projected:
            sources:
              - secret: { name: hermes-agent-env }
              - secret: { name: hermes-agent-a2a }   # crew#516 CP4: A2A_BEARER_TOKEN
              - secret: { name: hermes-agent-mcp, optional: true }   # crew#561 CP3: ESTATE_MCP_KEY (mcp-key.yaml)
              - secret: { name: hermes-agent-langfuse, optional: true }   # crew#717 wave 1: LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY (langfuse-key.yaml)
        - name: estate
          configMap: { name: hermes-agent-estate }
        - name: mac-run
          configMap: { name: hermes-agent-mac-run, defaultMode: 0755 }
        - name: mac-run-key
          secret: { secretName: hermes-agent-mac-run, optional: true, defaultMode: 0440 }
        - name: tailscale-authkey
          # optional: the sidecar's key is born by bin/idp-bootstrap-tailscale (idp#763). Until it exists
          # the gateway must still start; a missing sidecar secret kept Otto at ContainerCreating for
          # 4h on 2026-08-29 (oke-check run 33247274077). The sidecar alone restarts, the gateway runs.
          secret: { secretName: hermes-agent-tailscale, optional: true }
