# crew#524 CP5 — the sandbox is this pod, not a docker-in-pod or a Job (attributed 2026-08-27):
# the Hermes fork's tools/terminal_tool.py has backends local, docker, ssh, singularity, modal,
# daytona, vercel_sandbox and no Kubernetes Job backend; the gateway sets no terminal.backend, so
# tool commands run `local` inside this container. That container is the admitted sandbox:
# non-root 10001, readOnlyRootFilesystem, all capabilities dropped, RuntimeDefault seccomp, no
# privilege escalation, Kyverno baseline. The `sandbox:` block in hermes-v2 config.yaml (pinned
# image, :ro mounts) is honoured only where Docker exists (a Mac) and is inert here. A Job backend
# would be a fork feature nobody upstream maintains (LAW 43); the row states this instead.
# The Architect (hermes-agent gateway, Telegram + a2a) on OKE: crew#516 CP4, 2026-08-27.
#
# What runs here is the same thing the Mac's ai.architect.gateway launchd job runs: the image
# ghcr.io/chidionyema/hermes-agent carries the hermes-v2 repo (config.yaml, SOUL.md, skills/,
# cron/watch.jobs, cron/work.jobs) at /app/estate and boots through deploy/k8s/entrypoint.sh,
# which copies that build over HERMES_HOME=/data (this PVC) and leaves the state on it alone:
# state.db, sessions/, memories/, cron/jobs.json, auth.json. A new image changes what the agent
# is, never what it remembers; a pod restart loses nothing.
#
# Telegram is long-polling (getUpdates), so the gateway needs no public route; the a2a port
# (9900) is unauthenticated and stays in-cluster behind the Service. The swap is the token: one
# TELEGRAM_BOT_TOKEN, held by exactly one process (crew#284). The Mac gateway is booted out
# first, the token lands in the vault entry hermes-agent-env second, and this pod becomes The
# Architect on its next Secret refresh. Never both at once: two pollers on one token is 409s
# on both.
#
# Secrets: one vault entry, hermes-agent-env, the env names the gateway reads (.env on the Mac),
# seeded by oke-check's vault-put step from SEED_HERMES_* repo secrets, never a value in git
# (LAW 21, LAW 46). Same security shape as platform/llm/litellm.yaml: non-root, read-only root
# filesystem, no privilege escalation, seccomp RuntimeDefault; the two writable paths are the
# volume and /tmp.
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-env
  namespace: hermes-agent
spec:
  refreshInterval: 15m   # holds a 1h GitHub App installation token re-minted hourly (crew#577)
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: hermes-agent-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: hermes-agent-env }
---
# crew#516 CP4 (2026-08-27, receipt 33116314460): the a2a adapter binds 127.0.0.1 unless a bearer
# token is configured (hermes-agent plugins/platforms/a2a/security.py resolve_bind_host), so the
# kubelet's probe on the pod IP was "connection refused" 151 times and the pod was killed every five
# minutes. The token is generated once in the cluster by ESO's Password generator, never seeded,
# never in git, and projected into the same env dir the entrypoint exports.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-agent-a2a
  namespace: hermes-agent
spec:
  length: 48
  digits: 8
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-a2a
  namespace: hermes-agent
spec:
  refreshInterval: "0"   # generated once; a rotation under a running gateway is a deliberate change
  target: { name: hermes-agent-a2a, creationPolicy: Owner }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-agent-a2a
      rewrite:
        - transform: { template: "A2A_BEARER_TOKEN" }
---
# HERMES_HOME. 5Gi is the Mac's checkout today (state.db, sessions, hindsight, kanban) with room.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: hermes-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent-gateway
  namespace: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent-gateway
spec:
  selector:
    app: hermes-agent-gateway
  ports:
    - name: a2a
      port: 9900
      targetPort: a2a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent-gateway
  namespace: hermes-agent
  annotations:
    # Reloader (platform/reloader) rolls the pod when the vault entry lands through ESO (1h refresh),
    # the same way litellm picks up litellm-upstream: the swap seeds TELEGRAM_BOT_TOKEN and the pod restarts.
    # crew#516 CP5: hermes-agent-tailscale added so the sidecar re-authenticates on a key rotation.
    secret.reloader.stakater.com/reload: "hermes-agent-env,hermes-agent-a2a,hermes-agent-tailscale"
  labels:
    app: hermes-agent-gateway
    app.kubernetes.io/name: hermes-agent-gateway
    app.kubernetes.io/part-of: hermes-agent
spec:
  # One process holds the Telegram token and the volume; Recreate so a rollout never overlaps.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent-gateway
  template:
    metadata:
      labels:
        app: hermes-agent-gateway
        app.kubernetes.io/name: hermes-agent-gateway
    spec:
      priorityClassName: infrastructure-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/chidionyema/hermes-agent
          imagePullPolicy: IfNotPresent
          # Kyverno secrets-not-from-env-vars (crew#341) refuses envFrom/secretKeyRef, the same as
          # it refused litellm on 2026-08-26 (crew#284). The Secret is mounted as files and the
          # image's entrypoint exports every file under HERMES_ENV_DIR as an env var itself.
          env:
            - name: HERMES_HOME
              value: /data
            - name: HERMES_ENV_DIR
              value: /run/secrets/hermes-agent-env
            - name: HOME
              value: /data
            # crew#524 CP1: the self-hosted Hindsight row (platform/hindsight). A URL alone makes the
            # hermes hindsight plugin available (`has_key or has_url`); no key on a self-host.
            - name: HERMES_ESTATE_YAML   # crew#524 CP2: the estate from git (estate.yaml ConfigMap)
              value: /etc/hermes/estate.yaml
            - name: HINDSIGHT_API_URL
              value: http://hindsight-api.hindsight.svc:8888
            - name: PYTHONUNBUFFERED
              value: "1"
            # crew#516 CP4: bind a2a on the pod IP so the probes below reach it; A2A_BEARER_TOKEN
            # (hermes-agent-a2a, above) is what lets the adapter leave loopback. The agent card is
            # public by design; every POST needs the token.
            - name: A2A_HOST
              value: 0.0.0.0
            # crew#516 CP5: mac-run.yaml's only variables (LAW 46 — the Mac's tailnet IP and login
            # user are named nowhere else). ConfigMap, not Secret: neither is a credential, Tailscale
            # SSH authenticates by tailnet node identity, not by these values.
            - name: FOUNDER_MAC_USER
              value: "${FOUNDER_MAC_USER}"
            - name: FOUNDER_MAC_TS_IP
              value: "${FOUNDER_MAC_TS_IP}"
          ports:
            - containerPort: 9900
              name: a2a
          # /.well-known/agent-card.json is the a2a adapter's own health surface (config.yaml
          # platforms.a2a.enabled: true, port 9900). The first boot copies the build and renders
          # estate.yaml before the gateway starts; the startup probe covers that.
          startupProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: a2a
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # crew#539 CP9: requests == limits -> Guaranteed QoS, evicted last under node pressure
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 250m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: env
              mountPath: /run/secrets/hermes-agent-env
              readOnly: true
            - name: estate
              mountPath: /etc/hermes
              readOnly: true
            # crew#516 CP5: the founder's mac-run script, executable, never baked into the image.
            - name: mac-run
              mountPath: /usr/local/bin/mac-run
              subPath: mac-run
              readOnly: true
        # crew#516 CP5 (founder order, crew#66 5451614620 + addendum): the tailnet identity for
        # this pod, so the gateway container's mac-run reaches the Mac through the SOCKS5 proxy
        # below instead of a sidecar-free "figure out the network" ask nobody made of Otto.
        # TS_USERSPACE=true: no tun device, no NET_ADMIN, unchanged securityContext (LAW 21).
        # TS_KUBE_SECRET="": state lives on the existing PVC, not a second Kubernetes Secret this
        # pod would need RBAC to write. TS_AUTHKEY is a file (Kyverno secrets-not-from-env-vars,
        # crew#341; verified against containerboot's own source,
        # github.com/tailscale/tailscale/blob/main/cmd/containerboot/main.go: "If the value begins
        # with file:, it is treated as a path to a file containing the key").
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.80.2
          env:
            - name: TS_AUTHKEY
              value: file:/run/secrets/hermes-agent-tailscale/TS_AUTHKEY
            - name: TS_HOSTNAME
              value: hermes-pod
            - name: TS_USERSPACE
              value: "true"
            - name: TS_STATE_DIR
              value: /data/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_SOCKET
              value: /tmp/tailscaled.sock
            - name: TS_SOCKS5_SERVER
              value: localhost:1055
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:k8s
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          # require-pod-probes (Kyverno, autogen-validate-probes) needs every container in the pod
          # to carry one; `tailscale status --socket` talks to the local tailscaled over the same
          # TS_SOCKET this container sets, so a probe failure is the sidecar's own state, not the
          # gateway's a2a endpoint.
          readinessProbe:
            exec:
              command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"]
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"]
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: tailscale-authkey
              mountPath: /run/secrets/hermes-agent-tailscale
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: tmp
          emptyDir: {}
        - name: env
          projected:
            sources:
              - secret: { name: hermes-agent-env }
              - secret: { name: hermes-agent-a2a }   # crew#516 CP4: A2A_BEARER_TOKEN
        - name: estate
          configMap: { name: hermes-agent-estate }
        - name: mac-run
          configMap: { name: hermes-agent-mac-run, defaultMode: 0755 }
        - name: tailscale-authkey
          secret: { secretName: hermes-agent-tailscale }
