# crew#561 CP3: Otto reads estate state through the estate MCP (platform/mcp), the one query
# path every session uses, never a second copy of the estate inside the agent. The key is the
# gateway's own MCP_GATEWAY_KEY from vault entry `mcp-gateway` (platform/mcp/external-secret.yaml),
# projected into the pod's env dir as ESTATE_MCP_KEY; hermes-v2 config.yaml names it in the
# server's Authorization header as a placeholder hermes_cli.mcp_config resolves at start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-mcp
  namespace: hermes-agent
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: hermes-agent-mcp, creationPolicy: Owner }
  data:
    - secretKey: ESTATE_MCP_KEY
      remoteRef: { key: mcp-gateway, property: MCP_GATEWAY_KEY }
