# crew#561: the hermes-agent pod's identity to the founder's Mac sshd. One vault entry,
# `hermes-mac-run` (private_key_b64, public_key), minted by bin/idp-bootstrap-macrun on a CI runner
# (oke-check apply), never on a laptop, never pasted. Only the private half reaches the pod, decoded
# here from the one-line base64 the vault holds; the public half is read by bin/idp-mac-adopt-otto
# on the Mac from the apply run's log. Rotation is `bin/idp-bootstrap-macrun --rotate` and a
# re-adopt; the old key stops working at the next sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-mac-run
  namespace: hermes-agent
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: hermes-agent-mac-run
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        id_ed25519: "{{ .b64 | b64dec }}"
  data:
    - secretKey: b64
      remoteRef: { key: hermes-mac-run, property: private_key_b64 }
