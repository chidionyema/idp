# otto.<zone>/telegram — the one path Telegram POSTs updates to (crew#736, founder blueprint
# 2026-08-31T15:24Z: webhook mode, zero-downtime). The listener is https-otto on the shared
# Gateway (prospector-main deploy/k8s/base/edge.yaml); this namespace carries the edge-attach
# label it selects on. No oauth2-proxy on purpose: the caller is Telegram's delivery fleet, not
# a browser. The door is never open though — the adapter registers a secret token with Telegram
# at startup (setWebhook secret_token) and drops any POST that does not echo it in
# X-Telegram-Bot-Api-Secret-Token; it refuses to start at all without that token
# (GHSA-3vpc-7q5r-276h). The token is minted in-cluster in gateway.yaml, never in git.
# tests/test_front_door_every_route_is_behind_the_one_login.py holds this proof.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    backstage.io/kubernetes-id: founder-telegram
  name: otto-telegram-webhook
  namespace: hermes-agent
  annotations:
    idp.estate/auth: telegram-webhook-secret-token
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-otto
  hostnames:
    - "otto.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: Exact, value: /telegram }
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: friendly-errors }
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: edge-headers }
      backendRefs:
        - name: hermes-agent-gateway
          port: 8443
