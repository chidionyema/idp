# crew#524 CP2: the lanes are switched on from git, not from a person's Mac. deploy/k8s/entrypoint.sh
# (hermes-v2#40) copies $HERMES_ESTATE_YAML over estate.yaml before bin/render, so this file is the
# estate the cluster runs; the Mac's gitignored estate.yaml is its ancestor and is retired with it.
# Nothing secret lives here (tokens come through hermes-agent-env); hostnames are the products'.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-estate
  namespace: hermes-agent
data:
  estate.yaml: |
    # This machine's estate. Generated by ./install, safe to edit by hand.
    # After editing, run: bin/render     (then bin/verify)

    estate:
      name: prospector

    github:
      owner: chidionyema
      repo: prospector

    services:
      - key: store-web
        app: prospector-store-web
        url: https://${ESTATE_ZONE}/
        expect: "2xx"
        note: "The store runs on the OKE cluster (idp/clusters) behind ${ESTATE_ZONE} since the Fly exit (R1, crew#78). Measured 200 on 2026-08-26."

      - key: store-api
        app: prospector-store-api
        url: https://api.${ESTATE_ZONE}/
        expect: "any-answer"
        note: "The store API on OKE behind api.${ESTATE_ZONE}. Answers 404 on /, /health, /healthz and /api/health, measured 2026-08-26; a 404 here is not a fault, silence is."

    # Hosts this estate reaches that are not one of the probed services above.
    # The old platform has zero apps (measured 2026-08-26); the estate runs on OKE (idp/clusters).
    egress_extra: []

    # The Hermes deployment itself. These are the only place the new app, the app it
    # replaced, and the checkout that owns the offsite backups are named. Every script
    # that has to say one of them lives in templates/ and reads it from here, because a
    # repo that names one estate cannot be handed to another.
    hermes:
      app: prospector-hermes-v2
      previous_app: prospector-hermes
      offsite_checkout: prospector-live

    platform:
      kind: kubernetes
      cli: kubectl

    models:
      watch: claude-haiku-4-5
      work: claude-haiku-4-5

    dispatch:
      board: chidionyema/crew
      label: agent-go
      claimed: in-progress
      never: [icebox]
      checkouts: ..
      runtime: claude
      # crew#516 CP5 (founder order 2026-08-28, crew#66 5451614620 + addendum, supersedes the
      # operator/mac-egress design of the first CP5 pass, crew#66 5451452409): Otto stays in this
      # pod (the single Telegram poller lock) and executes on the founder's Mac through mac-run
      # (platform/hermes-agent/mac-run.yaml), an ssh wrapper that reaches the tailnet through this
      # pod's own tailscale sidecar (tailscale.yaml). Authentication is Tailscale SSH by the Mac's
      # tailnet node identity; no key of ours is generated, mounted or held (LAW 21, LAW 46).
      # --allowedTools is unchanged: git and gh only, now run on the Mac instead of the container.
      #
      # Founder's own prompting shift (crew#66 5451614620) for whatever text drives this runtime:
      # "Whenever you need to interact with the codebase, do not use local tools. Write your
      # script, save it to a file, and execute it using mac-run 'cat script.sh | bash'." This repo
      # (idp) does not carry hermes-v2's system prompt (SOUL.md, a separate repo) to place that
      # sentence into — recorded here as Not done, with the follow-up path, rather than claimed.
      runtimes:
        claude: [mac-run, claude, -p, "{prompt}", --permission-mode, acceptEdits, --allowedTools, "Bash(git *) Bash(gh *)"]
        gemini: [gemini, -p, "{prompt}", --yolo]
        opencode: [opencode, run, "{prompt}"]
        codex: [codex, exec, --full-auto, "{prompt}"]

    limits:
      max_cost_usd_per_task: 5
      budget_hard_stop: true

    # Which lanes are switched on. Everything in this repo is built; this is what
    # actually runs. A lane that is off gets no cron jobs created for it, so it
    # cannot fire, cost anything or touch your repo.
    #
    # Turn one on, prove it with bin/verify, then turn on the next. Change them with
    # `bin/features work on`, or edit here and run ./install. `bin/features` on its
    # own prints the current state.
    #
    # The order below is the order the spec turns them on in (§12 build order).
    features:
      watch: on                 # §5   read-only pulse and digest. The free lane.
      sunday_rituals: on        # §8   weekly review, three proposal issues.
      work: on                  # §6   WRITES pull requests (crew#524 CP2: on from git, proved by CP3)
      evolution: on             # §9   COSTS MONEY (limits.max_cost_usd_per_task caps it; crew#524 CP4)
      bench: off                # §6b  the on-demand local lane.
      screenshot_handler: off   # §15  a Telegram photo becomes a GitHub issue.

    # Every UI's URL from the catalogue the cluster runs, pinned in the founder's
    # chat by watch-urls (scripts/estate-urls.py, crew#282).
    urls:
      catalog_oci: oci://ghcr.io/chidionyema/idp/estate-catalog:latest
      catalog_repo: chidionyema/idp
      catalog_path: catalog/catalog-info.yaml
      include: ${ESTATE_ZONE}
      chat_env: TELEGRAM_HOME_CHANNEL
