# The Architect on OKE (crew#516 CP4). One image, pinned here; Flux image automation
# (platform/image-automation/hermes-agent.yaml) moves the tag to the newest main-<run>-<sha>
# hermes-v2 builds, the same way sovereign-worker and backstage move.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent
resources:
  - gateway.yaml
  - estate.yaml
images:
  - name: ghcr.io/chidionyema/hermes-agent
    newTag: main-25-140f9b1a51e43ae8bfb09b722ad83f2f90b50008 # {"$imagepolicy": "flux-system:hermes-agent:tag"}
