# The Architect on OKE (crew#516 CP4). One image, pinned here; Flux image automation
# (platform/image-automation/hermes-agent.yaml) moves the tag to the newest main-<run>-<sha>
# hermes-v2 builds, the same way sovereign-worker and backstage move.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent
resources:
  - gateway.yaml
  - edge-manners.yaml
  - estate.yaml
  - mac-run-key.yaml
  - tailscale.yaml
  - rbac.yaml
  - mcp-key.yaml
  - langfuse-key.yaml
# crew#561: mac-run is mounted with `subPath`, and Kubernetes never updates a subPath mount in
# place, so editing a hand-written ConfigMap changed nothing in the running pod. idp#955 hung a
# Reloader annotation off the Deployment, which cannot work either: the script had already changed
# in idp#949 at 05:45Z, Reloader only acts on a change it sees AFTER it is watching, and otto-parity
# 33297784151 at 06:53Z still ran the old copy (`cp ... Permission denied`) with Flux green.
# The generator puts a content hash in the ConfigMap's name, so any edit to mac-run.tpl renames it,
# the Deployment's volume reference changes with it, and the pod rolls. Same fix as
# platform/healthchecks (idp#962). The generated key stays `mac-run`, which is the subPath.
configMapGenerator:
  - name: hermes-agent-mac-run
    files:
      - mac-run=mac-run.tpl
      - cursor-agent=cursor-agent.tpl
images:
  - name: ghcr.io/chidionyema/hermes-agent
    newTag: main-94-f23857b2fc1cca9729d900ab162f2621e025ff4e # {"$imagepolicy": "flux-system:hermes-agent:tag"}
