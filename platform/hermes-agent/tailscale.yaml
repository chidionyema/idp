# crew#516 CP5, founder's locked spec (crew#66 5451926212, "so we solve the problen once" —
# supersedes the reusable-key design of 5451614620/5451623095, which the founder rejected as a
# hand-paste habit, and the interactive-login-URL design of 5451900443 point 1, itself superseded
# by this operator design in the same comment). Phase 3: "the tailscale sidecar joins through the
# operator ... an auth key minted by the operator ... no hand-minted key."
#
# The one Tailscale OAuth client that authenticates the in-cluster operator
# (platform/tailscale/operator.yaml, platform/tailscale/external-secret.yaml) is, by Tailscale's own
# design, also a valid TS_AUTHKEY directly: containerboot recognises a client-secret-shaped value
# (tskey-client-...) and mints a fresh ephemeral device key from it at pod start — no second
# credential, no console step beyond the one OAuth client Phase 1 already needs. This ExternalSecret
# reads the SAME vault entry Phase 1 reads (tailscale-operator, seeded by vault-seed.yml exactly
# like every other estate provider key — Minimax, Anthropic, R2, GitHub App) and composes the
# authkey string via ESO's own template, never a script: ?ephemeral=false&preauthorized=true keeps
# the node non-ephemeral (state persists in TS_STATE_DIR across restarts) and pre-authorised (no
# admin-console tap per pod start). Read as a file (Kyverno secrets-not-from-env-vars, crew#341;
# containerboot's own TS_AUTHKEY=file:... support), never a literal, never a Secret env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-tailscale
  namespace: hermes-agent
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: hermes-agent-tailscale
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TS_AUTHKEY: "{{ .client_secret }}?ephemeral=false&preauthorized=true"
  data:
    - secretKey: client_secret
      remoteRef: { key: tailscale-operator, property: client_secret }
