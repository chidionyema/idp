# The human door, wired (decision 0017; founder 2026-09-07: "should auto sync once i configure on
# portal"). Every ExternalSecret here is generated by bin/idp-vendor-render from the `targets:` of
# platform/vendors/consoles.yaml -- add a vendor there, run the renderer, and its bridge appears.
#
# Nothing in this directory holds a value. Each object says "the secret called <NAME> in Bitwarden
# Secrets Manager belongs in namespace <ns> as key <field>", and External Secrets does the rest on
# a one-minute interval.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecrets.yaml
  - pushsecrets.yaml
