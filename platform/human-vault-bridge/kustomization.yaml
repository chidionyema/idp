# One HelmRelease, and the chart it names renders the bridge from platform/vendors/consoles.yaml
# inside the cluster. The two generated manifests that used to sit here are deleted; see
# helmrelease.yaml for why a committed render was the defect rather than the mechanism.
#
# This directory stays a Flux Kustomization path (clusters/oke/human-vault.yaml) rather than
# becoming a HelmRelease in clusters/oke, because the row's `dependsOn` is load-bearing and
# Flux's HelmRelease.dependsOn names HelmReleases, not Kustomizations. The edge on `concierge`
# is the one that stops `ExternalSecret/concierge/human-twilio ... namespaces "concierge" not
# found`, which is what happened on the first apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
