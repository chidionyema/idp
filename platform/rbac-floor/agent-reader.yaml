# WJ.1: the identity every agent actually uses, and it cannot write anything.
#
# Until this file, `bin/idp-kube` handed every session the founder's own OCI principal, which is
# cluster administrator. Every agent on this laptop could delete any workload in the estate, and
# the only thing standing between an estate and a bad afternoon was that none of them had tried.
#
# Diagnosis stays completely unrestricted, and that is the deliberate half of the design. An agent
# that cannot read is an agent that guesses, and a guessing agent asks for write access it does not
# need. So: every pod log, every event, every manifest, every metric, the rollout history, the
# node conditions -- all of it, in every namespace. What it cannot do is change any of them.
#
# Two things are withheld rather than merely not granted:
#
#   Secrets. `get secret -o yaml` is a credential in a transcript, and the estate's rule (LAW 21)
#   is that a secret never appears anywhere it can be read again. `describe` on a Secret is also
#   refused by this role; key names and byte counts come from the ExternalSecret in git, which is
#   where they are documented anyway.
#
#   RBAC. Reading roles and bindings is how an attacker finds the path from here to admin, and
#   nothing an agent legitimately does needs it. The one who needs it is the founder, and he has
#   his own identity.
#
# Write is not withheld here and granted somewhere else. There is no somewhere else: it is minted
# by the broker, one named action at a time, for minutes (platform/jit/). This role is the floor
# that makes that broker the only ceiling.
apiVersion: v1
kind: Namespace
metadata:
  name: agents
  annotations:
    # crew#191: a namespace Flux created is never a namespace Flux may prune. Moving this row
    # between Kustomizations must not take the workloads in it with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    name: agents
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-reader
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-reader
rules:
  # Everything, read-only, in every API group -- then the two subtractions above. Kubernetes has
  # no "deny" rule, so the subtraction is done by not naming secrets or rbac.authorization.k8s.io
  # anywhere in this list rather than by excluding them from a wildcard. A wildcard with an
  # exception is not a thing RBAC can express, and pretending otherwise is how these roles go
  # wrong.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - configmaps
      - namespaces
      - nodes
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - replicationcontrollers
      - resourcequotas
      - limitranges
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets, controllerrevisions]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, grpcroutes, referencegrants]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling, policy, storage.k8s.io, apiextensions.k8s.io, coordination.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # Flux, Calico, cert-manager, external-secrets, Temporal and the rest of what this estate runs.
  # Reading an ExternalSecret is reading which vault entry feeds a Secret, never the value.
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - external-secrets.io
      - generators.external-secrets.io
      - cert-manager.io
      - acme.cert-manager.io
      - crd.projectcalico.org
      - operator.tigera.io
      - projectcalico.org
      - monitoring.coreos.com
      - temporal.io
      - spiffe.io
      # Added 2026-09-08. The 15 groups above were a hand-kept list that had gone stale by 23 of
      # the 36 custom resource groups this cluster actually serves -- among them the gateway, the
      # estate's Postgres, the estate's ClickHouse, and Kyverno's own policies. It was found the
      # way that list always gets found: an agent diagnosing SigNoz's ClickHouse recreate loop
      # (idp#2425) could read the operator's log and the ConfigMap it rewrote, but not the
      # ClickHouseInstallation those were about, so it reasoned around the object rather than
      # reading it. That is precisely what the header of this file warns against -- "an agent that
      # cannot read is an agent that guesses". The gap was closed in one pass against the live CRD
      # list rather than one group at a time, and the two groups deliberately left out are written
      # down in unreadable-groups.yaml beside this file, with the reason, so silence is never the
      # record.
      - clickhouse.altinity.com
      - postgresql.cnpg.io
      - kyverno.io
      - policies.kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      - traefik.io
      - gateway.networking.x-k8s.io
      - policy.networking.k8s.io
      - cilium.io
      - keda.sh
      - eventing.keda.sh
      - http.keda.sh
      - spire.spiffe.io
      - tailscale.com
      - chaos-mesh.org
      - core.k8sgpt.ai
      - holmesgpt.dev
      - externaldns.k8s.io
      - nodesoftware.estate.io
      - oci.oraclecloud.com
    resources: ["*"]
    verbs: [get, list, watch]
  # Trivy's reports, named one by one rather than with a wildcard, because one kind in this group
  # is different in nature from the rest: an ExposedSecretReport carries the matched secret string
  # itself, so a wildcard here would put secret values behind a read grant, which LAW 21 forbids
  # anywhere they can be read again. platform/trivy/trivy.yaml:53 sets
  # `exposedSecretScannerEnabled: false`, so none exist today -- the exclusion is what keeps that
  # true if the scanner is ever turned on, rather than the grant quietly widening with it.
  - apiGroups: [aquasecurity.github.io]
    resources:
      - vulnerabilityreports
      - clustervulnerabilityreports
      - configauditreports
      - clusterconfigauditreports
      - infraassessmentreports
      - clusterinfraassessmentreports
      - rbacassessmentreports
      - clusterrbacassessmentreports
      - clustercompliancereports
      - sbomreports
      - clustersbomreports
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-reader
subjects:
  - kind: ServiceAccount
    name: agent-reader
    namespace: agents
