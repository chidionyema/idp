# SigNoz k8s-infra: the cluster's own metrics, logs and events into the SigNoz collector next
# door (crew#388). The signoz chart 0.138.0 (signoz.yaml) does not bundle it, so until this
# release the estate had traces from LiteLLM and nothing about pods, nodes or the kubelet.
# One DaemonSet (otel-agent: hostMetrics, kubeletMetrics, container logs) and one Deployment
# (otel-deployment: clusterMetrics, k8sEvents). Chart pinned; 0.17.0 (app 0.139.0) was
# `helm search repo signoz/k8s-infra` on 2026-08-27. Uses the HelmRepository in signoz.yaml.
# The agent reads /var/log/pods and the node filesystem, which the restricted profile refuses;
# platform/edge/k8s-infra-exception.yaml waives exactly the Kyverno rules bin/idp-kyverno-render
# shows failing and nothing else. The Pod Security Admission label is the other gate, and no
# Kyverno exception reaches it, so the release installs into observability-agent
# (platform/edge/k8s-infra-namespace.yaml, enforce: privileged) while this HelmRelease object stays here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-infra
  annotations:
    # crew#483: the install failed 3 times on the Kyverno hostPath denial before the waiver
    # (platform/edge/k8s-infra-exception.yaml, merged 2026-08-27T10:26Z) existed, and
    # helm-controller stops retrying once retries are exhausted. `flux reconcile hr --reset`
    # sets two annotations, and helm-controller only resets the failure count when resetAt
    # carries the same value as requestedAt; resetAt alone (12:11Z) changed nothing and the
    # release kept the pre-waiver denial. The git-only estate has no kubectl to run it.
    reconcile.fluxcd.io/requestedAt: "2026-08-27T12:41:00Z"
    reconcile.fluxcd.io/resetAt: "2026-08-27T12:41:00Z"
spec:
  interval: 1h
  timeout: 10m
  targetNamespace: observability-agent
  storageNamespace: observability-agent
  chart:
    spec:
      chart: k8s-infra
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: signoz
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    clusterName: oke
    # crew#483: this chart's otlphttp exporter (presets.otlphttpExporter.enabled defaults true,
    # confirmed via `helm show values signoz/k8s-infra --version 0.17.0`) takes the raw value of
    # otelCollectorEndpoint as OTEL_EXPORTER_OTLP_ENDPOINT verbatim
    # (templates/_config.tpl:327 sets the exporter's endpoint from that env var directly) -- it does not
    # add a scheme or switch ports itself. The old value (bare host:4317, the gRPC port with no
    # scheme) made every otel-agent/otel-deployment export fail with
    # "unsupported protocol scheme \"signoz-otel-collector.observability.svc\"" (run 33160603986,
    # 09:44-09:45Z), which is why ClickHouse saw logs=0 metrics=0 for the same 15 minutes traces=272
    # kept landing (traces come from LiteLLM/agentgateway/etc, which already use the HTTP port with
    # a scheme -- see otlp-endpoint-workloads in bin/idp-oke-break-glass pb_diagnose). Matching that
    # working form: HTTP port 4318, with the scheme the otlphttp exporter requires.
    otelCollectorEndpoint: http://signoz-otel-collector.observability.svc:4318
    # otelInsecure governs the exporter's TLS insecure flag (_config.tpl:330 `tls: insecure:`),
    # a separate knob from the endpoint's own scheme above; already correct for a plain-http
    # collector Service and left unchanged.
    otelInsecure: true
    presets:
      logsCollection: { enabled: true }
      hostMetrics: { enabled: true }
      kubeletMetrics: { enabled: true }
      kubernetesAttributes: { enabled: true }
      clusterMetrics: { enabled: true }
      k8sEvents: { enabled: true }
      # crew#539 CP12: a pod annotated signoz.io/scrape=true (+ signoz.io/port, signoz.io/path) is
      # scraped by the agent and lands in signoz_metrics; opt-in only, nothing scraped by default.
      # First user: the cilium-agent DaemonSet's Hubble metrics on 9965 (platform/cni/cilium-values.yaml).
      prometheus: { enabled: true, annotationsPrefix: signoz.io, scrapeInterval: 60s }
    otelAgent:
      # No node-level listeners: workloads send OTLP to the signoz-otel-collector Service, so the
      # agent's hostPorts (chart default on) stay off and disallow-host-ports passes.
      ports:
        otlp: { enabled: true, hostPort: false }
        otlp-http: { enabled: true, hostPort: false }
        zipkin: { enabled: false }
        metrics: { enabled: true, hostPort: false }
        health-check: { enabled: true, hostPort: false }
      podSecurityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 300m, memory: 512Mi }
    otelDeployment:
      podSecurityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      resources:
        requests: { cpu: 30m, memory: 96Mi }
        limits: { cpu: 200m, memory: 384Mi }
