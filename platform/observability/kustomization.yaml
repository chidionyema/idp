apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - helmrepository.yaml
  - signoz.yaml
  - telemetry-coverage.yaml
  - signoz-retention.yaml
  - langfuse.yaml
  - httproute.yaml
  - edge-manners.yaml
  - metabase
configMapGenerator:
  - name: signoz-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
  - name: langfuse-values
    files:
      - values.yaml=langfuse-values.yaml
    options:
      disableNameSuffixHash: true
