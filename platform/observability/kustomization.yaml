apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - langfuse.yaml
  - aevum.yaml
  - httproute.yaml
  - edge-manners.yaml
  - superset.yaml
  - superset-external-secret.yaml
  - superset-availability.yaml
  - superset-httproute.yaml
  - metabase-recovery-dump.yaml
  - superset-boardroom-seed.yaml
  - metabase-volume-removal.yaml
  - superset-memory-secret.yaml
  - superset-memory-seed.yaml
configMapGenerator:
  - name: langfuse-values
    files:
      - values.yaml=langfuse-values.yaml
    options:
      disableNameSuffixHash: true
# The tag is moved by Flux image automation (platform/image-automation/aevum.yaml), the same way
# cyrus, jit and estate-mcp move. It is pinned here rather than in aevum.yaml so the marker sits on
# one line the automation owns -- and because a literal tag in the Deployment is what put this
# workload in ImagePullBackOff on 2026-09-12.
images:
  - name: ghcr.io/chidionyema/aevum
    newTag: main-13100-73bfd042a4319970a2d636db3a7ca79de41673ca # {"$imagepolicy": "flux-system:aevum:tag"}
