apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - helmrepository.yaml
  - signoz.yaml
  - telemetry-coverage.yaml
  - signoz-retention.yaml
  - langfuse.yaml
  - httproute.yaml
  - edge-manners.yaml
  - metabase-external-secret.yaml
  - metabase-postgres.yaml
  - metabase-deployment.yaml
  - metabase-availability.yaml
  - metabase-httproute.yaml
  - metabase-setup.yaml
configMapGenerator:
  # Decision 0016: name keeps the hash so an edited script re-runs the setup Job's pod template.
  - name: metabase-setup-script
    files:
      - setup.py=metabase-setup/setup.py
  - name: signoz-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
  - name: langfuse-values
    files:
      - values.yaml=langfuse-values.yaml
    options:
      disableNameSuffixHash: true
