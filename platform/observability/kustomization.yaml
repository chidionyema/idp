apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - helmrepository.yaml
  - signoz.yaml
  - telemetry-coverage.yaml
  - signoz-retention.yaml
  - langfuse.yaml
  - httproute.yaml
  - edge-manners.yaml
  - superset.yaml
  - superset-external-secret.yaml
  - superset-availability.yaml
  - superset-httproute.yaml
  - metabase-recovery-dump.yaml
  - superset-boardroom-seed.yaml
  - metabase-volume-removal.yaml
  - superset-memory-secret.yaml
  - superset-memory-seed.yaml
configMapGenerator:
  - name: signoz-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
  - name: langfuse-values
    files:
      - values.yaml=langfuse-values.yaml
    options:
      disableNameSuffixHash: true
