# Superset's two vault values, mounted as files (kyverno secrets-not-from-env-vars): the session
# signing key and the app-database password. Both are Terraform-minted (platform/oci/superset.tf);
# no person ever sees either. Reloader rolls the pods when the vault rotates them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: superset
  namespace: observability
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: superset
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef: { key: superset-secret-key }
    - secretKey: DB_PASSWORD
      remoteRef: { key: superset-db-password }
---
# Postgres reads its password as a file (POSTGRES_PASSWORD_FILE), the same shape as healthchecks-db.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: superset-db
  namespace: observability
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: superset-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: superset-db-password }
