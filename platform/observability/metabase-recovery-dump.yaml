# Recovery of the founder's dashboards from the old dashboard server's surviving volume.
#
# Decision 0018 swapped the dashboard tool and deleted the old server, but its 50Gi data
# volume (pgdata-metabase-db-0) survived and still holds every question, chart and
# dashboard the founder built. Nothing served that data after the swap.
#
# This one-shot job starts the same database engine the old server used, against that
# surviving volume, runs read queries only, and prints every saved question (name and
# query), every dashboard and every layout row as JSON to its log. The log is the
# receipt: it lands in the central collector and stays readable for seven days here.
# A rebuild step then recreates the content in the new dashboard tool from this dump.
#
# The job changes nothing: queries only, no DROP, no DELETE, no UPDATE. It runs once;
# jobs are immutable, so a re-run means a new name.
apiVersion: batch/v1
kind: Job
metadata:
  name: metabase-recovery-dump
  namespace: observability
  labels: { app.kubernetes.io/name: metabase-recovery-dump, app.kubernetes.io/part-of: idp }
spec:
  backoffLimit: 0            # a failure needs a look, not a retry hammering the volume
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800  # keep the pod and its log a week
  template:
    metadata:
      labels: { app.kubernetes.io/name: metabase-recovery-dump, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # postgres uid in the alpine image, matching the old server exactly
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dump
          image: docker.io/library/postgres:17.6-alpine
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "METABASE-RECOVERY: starting the old dashboard database; read queries only"
              docker-entrypoint.sh postgres &
              SERVER=$!
              TRIES=0
              until pg_isready -U metabase -d metabase -q; do
                TRIES=$((TRIES+1))
                if [ "$TRIES" -gt 60 ]; then
                  echo "METABASE-RECOVERY: database never answered after 120s" >&2
                  exit 1
                fi
                sleep 2
              done
              dump() {
                echo "=== METABASE-DUMP $1 BEGIN ==="
                psql -X -q -t -A -U metabase -d metabase -c "SELECT COALESCE(json_agg(row_to_json(t)), '[]'::json) FROM ($2) t"
                echo "=== METABASE-DUMP $1 END ==="
              }
              dump collections "SELECT id, name, slug, location, archived FROM collection"
              dump questions "SELECT id, name, description, display, dataset_query, visualization_settings, collection_id, archived FROM report_card"
              dump dashboards "SELECT id, name, description, parameters, collection_id, archived FROM report_dashboard"
              dump dashboard_layout "SELECT id, dashboard_id, card_id, \"row\", col, size_x, size_y, visualization_settings FROM report_dashboardcard"
              echo "METABASE-RECOVERY: counts follow"
              psql -X -t -A -U metabase -d metabase -c "SELECT 'questions=' || COUNT(*) FROM report_card"
              psql -X -t -A -U metabase -d metabase -c "SELECT 'dashboards=' || COUNT(*) FROM report_dashboard"
              pg_ctl -D "$PGDATA" -m fast stop
              wait "$SERVER" || true
              echo "METABASE-RECOVERY: done"
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata-metabase-db-0
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
