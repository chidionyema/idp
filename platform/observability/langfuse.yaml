# Langfuse: the estate's one LLM trace store (crew#286 CP6, crew/docs/STANDARDS.md "Traces and
# audit"). Chart pinned; 2.0.2 / app 4.17.0 was `helm search repo langfuse/langfuse` on 2026-08-26.
# Sits on the same suspended observability Kustomization as SigNoz: it comes up when the node pool
# grows (idp#160, crew#289). Nobody signs up: the org, project and API keys are seeded by
# LANGFUSE_INIT_* from the vault (platform/oci/langfuse.tf) and sign-up is disabled.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: langfuse
spec:
  interval: 24h
  url: https://langfuse.github.io/langfuse-k8s
---
# One Secret, mounted as env by the chart's additionalEnvFrom. Every value is generated by
# Terraform (random_password) and never typed by a person.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-init
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: langfuse-init
    template:
      data:
        LANGFUSE_INIT_ORG_ID: estate
        LANGFUSE_INIT_ORG_NAME: Bytesync estate
        LANGFUSE_INIT_PROJECT_ID: agents
        LANGFUSE_INIT_PROJECT_NAME: agents
        LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "{{ .public_key }}"
        LANGFUSE_INIT_PROJECT_SECRET_KEY: "{{ .secret_key }}"
        LANGFUSE_INIT_USER_EMAIL: "{{ .user_email }}"
        LANGFUSE_INIT_USER_NAME: founder
        LANGFUSE_INIT_USER_PASSWORD: "{{ .user_password }}"
  data:
    - secretKey: public_key
      remoteRef: { key: langfuse-init-public-key }
    - secretKey: secret_key
      remoteRef: { key: langfuse-init-secret-key }
    - secretKey: user_email
      remoteRef: { key: langfuse-init-user-email }
    - secretKey: user_password
      remoteRef: { key: langfuse-init-user-password }
---
# crew#503: the second login hop. Langfuse signs the founder in with its own OIDC client against
# the estate identity domain (the app is platform/oci/identity main.tf `langfuse`, the id and
# secret are written to the vault by tofu). AUTH_CUSTOM_ISSUER is the domain URL because that is
# where IDCS serves /.well-known/openid-configuration (the `issuer` claim inside it is
# identity.oraclecloud.com, which serves nothing -- measured 2026-08-29, HTTP 000). ID_TOKEN is
# on (crew#626 CP15): it was set to false here to dodge that issuer string; the vendor page
# (langfuse.com/self-hosting/security/authentication-and-sso, read 2026-08-29) says that
# "switches the token exchange to the plain OAuth2 callback, which fails whenever the token
# response contains an id_token", and the identity domain always returns one for scope openid. The drill
# reproduced it: every SSO click came back with error=OAuthCallback (run 33256502843). ID_TOKEN
# stays at the vendor default (true); the profile comes from the id_token claims.
# Username+password is disabled: the front door is the only way in, and the LANGFUSE_INIT_*
# user above is linked to the SSO identity by email (ALLOW_ACCOUNT_LINKING). The callback
# /api/auth/callback/custom stays behind the ForwardAuth on purpose: the browser only reaches
# Langfuse through the front door, so the cookie is already there when IDCS sends it back.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-sso
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: langfuse-sso
    template:
      data:
        AUTH_CUSTOM_CLIENT_ID: "{{ .client_id }}"
        AUTH_CUSTOM_CLIENT_SECRET: "{{ .client_secret }}"
        AUTH_CUSTOM_ISSUER: "${ESTATE_OIDC_DOMAIN_URL}"
        AUTH_CUSTOM_NAME: "Bytesync estate"
        AUTH_CUSTOM_SCOPE: "openid email profile"
        AUTH_CUSTOM_ID_TOKEN: "true"
        AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING: "true"
        AUTH_DISABLE_USERNAME_PASSWORD: "true"
  data:
    - secretKey: client_id
      remoteRef: { key: langfuse-sso-client-id }
    - secretKey: client_secret
      remoteRef: { key: langfuse-sso-client-secret }
---
# The ClickHouse admin password. SigNoz reads it through valuesFrom (signoz.yaml); Langfuse reads
# it as auth.existingSecret. The chart's default (27ff0399-…) never reaches the cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-auth
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: clickhouse-auth
  data:
    - secretKey: password
      remoteRef: { key: clickhouse-admin-password }
---
# Incident 2026-08-26 (crew#325): langfuse-web crashed for 4 hours on "Database langfuse does not
# exist". The langfuse chart creates its database only when it deploys its own ClickHouse
# (values: "Created automatically by the sub-chart when deploy is true"); on the shared SigNoz
# ClickHouse nothing creates it, and the migrator assumes it exists. This Job is the declared
# owner of that database. It is idempotent, retries until ClickHouse answers, and Flux re-applies
# it on every reconcile, so a rebuilt cluster gets the database before Langfuse asks for it.
apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-clickhouse-database
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: create
          # Same image the SigNoz ClickHouseInstallation runs (signoz chart 0.138.0), already on the node.
          image: docker.io/clickhouse/clickhouse-server:25.12.5
          # Kyverno (secrets-not-from-env-vars) requires the password as a mounted file.
          command:
            - sh
            - -c
            - clickhouse-client --host signoz-clickhouse --user admin --password "$(cat /secrets/password)" --query "CREATE DATABASE IF NOT EXISTS langfuse"
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: clickhouse-auth, mountPath: /secrets, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: clickhouse-auth, secret: { secretName: clickhouse-auth } }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
spec:
  interval: 1h
  timeout: 15m
  # Incident 2026-08-26 (crew#325): langfuse-web crash-looped for four hours on
  # `lookup signoz-clickhouse: no such host` while the signoz release had never become Ready.
  # Langfuse runs on SigNoz's ClickHouse, so it waits for that release instead of racing it.
  dependsOn:
    - name: signoz
  chart:
    spec:
      chart: langfuse
      version: 2.0.2
      sourceRef:
        kind: HelmRepository
        name: langfuse
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  valuesFrom:
    - kind: ConfigMap
      name: langfuse-values
  # Kyverno enforces the restricted profile; the chart exposes securityContext only for web and
  # worker, so the rest is added here. Proven offline by bin/idp-kyverno-render.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-traces
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-traces
          - target: { kind: Deployment, name: langfuse-web }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: langfuse-web }
              spec:
                template:
                  spec:
                    priorityClassName: infrastructure-critical
                    containers:
                      - name: langfuse-web
                        securityContext: { readOnlyRootFilesystem: true }
                        volumeMounts:
                          - { name: tmp, mountPath: /tmp }
                          - { name: next-cache, mountPath: /app/web/.next/cache }
                    volumes:
                      - { name: tmp, emptyDir: {} }
                      - { name: next-cache, emptyDir: {} }
          - target: { kind: Deployment, name: langfuse-worker }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: langfuse-worker }
              spec:
                template:
                  spec:
                    priorityClassName: infrastructure-critical
                    containers:
                      - name: langfuse-worker
                        securityContext: { readOnlyRootFilesystem: true }
                        volumeMounts:
                          - { name: tmp, mountPath: /tmp }
                    volumes:
                      - { name: tmp, emptyDir: {} }
          # Incident 2026-08-26 (crew#325): the SeaweedFS post-install/post-upgrade hook Job that
          # creates the `langfuse` bucket carries no securityContext, Kyverno denied it, and every
          # Helm upgrade of this release failed ("post-upgrade hooks failed ... langfuse-bucket-hook").
          # Flux post-renders hook manifests too, so the profile is added here.
          - target: { kind: Job, name: langfuse-bucket-hook }
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata: { name: langfuse-bucket-hook }
              spec:
                template:
                  spec:
                    securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
                    containers:
                      - name: post-install-job
                        securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
                        resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
                        volumeMounts:
                          - { name: tmp, mountPath: /tmp }
                    volumes:
                      - { name: tmp, emptyDir: {} }
          - target: { kind: Deployment, name: langfuse-redis }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: langfuse-redis }
              spec:
                template:
                  spec:
                    initContainers:
                      - name: langfuse-redis-init
                        resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
          - target: { kind: Deployment, name: langfuse-s3-all-in-one }
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: langfuse-s3-all-in-one }
              spec:
                template:
                  spec:
                    securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
                    containers:
                      - name: seaweedfs
                        securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
                        volumeMounts:
                          - { name: tmp, mountPath: /tmp }
                    volumes:
                      - { name: tmp, emptyDir: {} }
          - target: { kind: StatefulSet, name: langfuse-postgresql }
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata: { name: langfuse-postgresql }
              spec:
                template:
                  spec:
                    securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
                    initContainers:
                      - name: postgresql-init
                        resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
