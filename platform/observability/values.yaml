# SigNoz on the one 1.8-core / 9.2 GiB OKE node (crew#258 CP2). Requests are sized so the node
# stays under its allocatable CPU: 1270m was requested before this release (kubectl describe node,
# 2026-08-25). Kyverno enforces the restricted profile, so every pod carries limits, probes,
# non-root, seccomp and a read-only root filesystem with emptyDir scratch where the process writes.
global:
  storageClass: oci-bv
clickhouse:
  podLabels: { idp.platform/capacity-approved: "true" }   # 1000m Guaranteed, measured (crew#539 CP9, run 33140351385)
  # crew#539 (2026-08-28, diagnose run 33140351385): with a 2Gi limit ClickHouse 25.12 sets its
  # server ceiling at 1.80 GiB (90% of the cgroup) and the merge of one signoz_traces part
  # (20260827_658_11785_163) needs 1.39 GiB on top of table loading, so every start ends in
  # `MEMORY_LIMIT_EXCEEDED`, AsyncLoader stalls (22.1%), :8123 never opens, the startup probe
  # kills it (x301 in 63m, exit 137) and the "ZooKeeper ... Temporary DNS error" is the starved
  # process failing getaddrinfo — dns-per-namespace run 33142680663 resolved every name from
  # inside the namespace. 4Gi is the smallest limit above the measured 1.80 + 1.39 GiB; 1 CPU
  # is what it had before abdcced halved it, so loading finishes inside the probe window.
  # crew#584 (founder 2026-08-29, request inflation): the 1000m CPU *request* was 13 % of the
  # node reserved for an idle database; the request is now micro and the limit doubled, so loading
  # still finishes inside the probe window and the memory floor above stays as measured.
  # 2026-09-07 20:55Z, the same code 241 as crew#483 and the ceiling now genuinely reached. The
  # caches bounded below are still in force -- the rendered server config carries mark_cache_size
  # 536870912 and merges_mutations_memory_usage_to_ram_ratio 0.3 (configmap
  # chi-signoz-clickhouse-common-configd, read live) -- so this is not the untuned default coming
  # back. What changed is load: eleven days of new workloads on one 20Gi volume, and the pod now
  # sits on both ceilings at once, `kubectl top pod` reading 3908Mi of the 4Gi cgroup and 1004m of
  # the 1000m CPU. Every writer is refused at the tracker's 3.60 GiB: signoz-otel-collector logs
  # `code: 241 ... would use 3.07 GiB ... maximum: 3.60 GiB` on logs, traces and metadata, and
  # langfuse-worker the same on WaitForAsyncInsert (134 restarts in 23h). The estate's own
  # instrument had already said so and nobody had read it: `FAIL science-facts at
  # 2026-09-07T19:07:01Z window_h=24 sources=0 rows=0`. Nothing has been written down for a day.
  #
  # Memory is the fenced-free lever by design (platform/edge/capacity-policy.yaml: "memory floors
  # are set by incidents ... a memory request below real use is an OOM, not a saving"), and 5.5Gi
  # is the largest request that still schedules: node 10.0.148.221 has 20935Mi allocatable against
  # 19159Mi requested, and the 4096Mi this pod releases on recreate leaves 5872Mi. Real free memory
  # on that node is 4.4Gi (16061Mi used of 20935Mi), so the limit is coverable, not paper. The CPU
  # request stays at the approved 1000m -- the node is at 99% of allocatable CPU requests and there
  # is no room to raise it -- and the limit doubles, which is the shape crew#584 asks for
  # ("a micro request with a burst limit") and costs nothing: that node runs at 46% CPU.
  #
  # This buys headroom; it does not fix the trend. The structural lever is retention
  # (signoz-retention.yaml), and shortening it deletes data, which is not a call to make alone.
  resources:
    # 2026-09-07 21:0xZ: 5632Mi was Unschedulable and took ClickHouse down. The arithmetic in the
    # block above read `kubectl get nodes -o jsonpath allocatable.memory` as Mi when the unit is Ki:
    # 20935936Ki is 20445Mi, not 20935Mi. Measured with the pod already gone and its 4Gi released,
    # node 10.0.148.221 has 4182Mi free (20445 allocatable - 16263 requested) and 1027m CPU, and
    # node 10.0.159.197 has 5988Mi free but 42m CPU. So neither node fits 1000m + 5632Mi, and the
    # scheduler said exactly that: "0/2 nodes are available: 1 Insufficient cpu, 1 Insufficient
    # memory". 4Gi is the largest request that schedules today, with 86Mi to spare on .221.
    #
    # This restores the pod. It does NOT fix code 241 -- ClickHouse comes back at the same ceiling
    # it was already refusing every write at, which is where it was before #2378. The headroom this
    # cluster would need does not exist on two nodes at 80% and 99% of allocatable, so the levers
    # are retention (signoz-retention.yaml, which deletes data) or a third node. Both are the
    # founder's call, not this file's.
    #
    # The CPU limit stays doubled: limits do not schedule, the node runs at 46% CPU, and a burst
    # ceiling is the shape crew#584 asks for.
    requests: { cpu: 1000m, memory: 4Gi }
    limits: { cpu: 2000m, memory: 4Gi }
  # crew#483 (2026-08-28, diagnose run 33172481714): once the node agents reached the collector
  # (c03fb77), signoz-otel-collector logged `code: 241 ... (total) memory limit exceeded: would use
  # 3.61 GiB ... current RSS: 1.87 GiB, maximum: 3.60 GiB` on every batch of spans, logs and
  # metric metadata, and coverage stayed at 7/95 pods. The ceiling is 90% of the 4Gi cgroup; the
  # 1.7 GiB gap between RSS and "would use" is what ClickHouse's tracker counts on top of the
  # process: its mark cache defaults to 5 GiB (clickhouse.com/docs/operations/server-configuration-
  # parameters/settings, mark_cache_size), larger than the whole pod, and background merges may
  # take half the ceiling (merges_mutations_memory_usage_to_ram_ratio 0.5). These are server
  # settings the chart renders into config.d (chart 0.138.0 `clickhouse.settings`), so the caches
  # are bounded to fit the pod instead of the pod grown to fit the defaults: 512 MiB of marks and
  # 30% of the ceiling for merges leaves the inserts their memory.
  settings:
    mark_cache_size: "536870912"
    index_mark_cache_size: "134217728"
    merges_mutations_memory_usage_to_ram_ratio: "0.3"
  persistence:
    size: 20Gi
  zookeeper:
    replicaCount: 1
    # the chart leaves this image unqualified (signoz/zookeeper:3.7.1); the node runtime enforces
    # short-name mode and refused it with ImageInspectError on 2026-08-25
    image:
      registry: docker.io
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 512Mi }
    persistence:
      size: 2Gi
signoz:
  replicaCount: 1
  # crew#495 CP8: SigNoz (>= v0.112) provisions one admin at startup from these. Email and password
  # come from the vault through signoz.yaml valuesFrom (ExternalSecret signoz-root), never from here.
  env:
    SIGNOZ_USER_ROOT_ENABLED: "true"
    SIGNOZ_USER_ROOT_ORG_NAME: "Bytesync estate"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }
  persistence:
    size: 1Gi
  ingress:
    enabled: false
otelCollector:
  # crew#392: the collector stamps k8s.namespace.name and k8s.pod.name on every span and log line
  # it receives, keyed by the sender's pod IP (k8sattributes, the upstream processor; the chart's
  # clusterRole already grants pods/replicasets for it). Without it a workload that emits on its
  # own (mcp-agentgateway, mcp-github) reaches ClickHouse with only service.name, and the coverage
  # query in telemetry-coverage.yaml, which keys on the pod, counts it as never seen. Existing
  # attributes are kept: k8s-infra's agent already names its pods and the processor does not
  # overwrite. The metrics pipeline is left as shipped: every metric sample comes through the agent.
  config:
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
        pod_association:
          - sources: [{ from: connection }]
    service:
      pipelines:
        traces: { processors: [k8sattributes, signozspanmetrics/delta, batch] }
        logs: { processors: [k8sattributes, batch] }
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 200Mi }
    limits: { cpu: 500m, memory: 512Mi }
telemetryStoreMigrator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
