# SigNoz on the one 1.8-core / 9.2 GiB OKE node (crew#258 CP2). Requests are sized so the node
# stays under its allocatable CPU: 1270m was requested before this release (kubectl describe node,
# 2026-08-25). Kyverno enforces the restricted profile, so every pod carries limits, probes,
# non-root, seccomp and a read-only root filesystem with emptyDir scratch where the process writes.
global:
  storageClass: oci-bv
clickhouse:
  podLabels: { idp.platform/capacity-approved: "true" }   # 1000m Guaranteed, measured (crew#539 CP9, run 33140351385)
  # crew#539 (2026-08-28, diagnose run 33140351385): with a 2Gi limit ClickHouse 25.12 sets its
  # server ceiling at 1.80 GiB (90% of the cgroup) and the merge of one signoz_traces part
  # (20260827_658_11785_163) needs 1.39 GiB on top of table loading, so every start ends in
  # `MEMORY_LIMIT_EXCEEDED`, AsyncLoader stalls (22.1%), :8123 never opens, the startup probe
  # kills it (x301 in 63m, exit 137) and the "ZooKeeper ... Temporary DNS error" is the starved
  # process failing getaddrinfo — dns-per-namespace run 33142680663 resolved every name from
  # inside the namespace. 4Gi is the smallest limit above the measured 1.80 + 1.39 GiB; 1 CPU
  # is what it had before abdcced halved it, so loading finishes inside the probe window.
  # crew#584 (founder 2026-08-29, request inflation): the 1000m CPU *request* was 13 % of the
  # node reserved for an idle database; the request is now micro and the limit doubled, so loading
  # still finishes inside the probe window and the memory floor above stays as measured.
  # 2026-09-07 20:55Z, the same code 241 as crew#483 and the ceiling now genuinely reached. The
  # caches bounded below are still in force -- the rendered server config carries mark_cache_size
  # 536870912 and merges_mutations_memory_usage_to_ram_ratio 0.3 (configmap
  # chi-signoz-clickhouse-common-configd, read live) -- so this is not the untuned default coming
  # back. What changed is load: eleven days of new workloads on one 20Gi volume, and the pod now
  # sits on both ceilings at once, `kubectl top pod` reading 3908Mi of the 4Gi cgroup and 1004m of
  # the 1000m CPU. Every writer is refused at the tracker's 3.60 GiB: signoz-otel-collector logs
  # `code: 241 ... would use 3.07 GiB ... maximum: 3.60 GiB` on logs, traces and metadata, and
  # langfuse-worker the same on WaitForAsyncInsert (134 restarts in 23h). The estate's own
  # instrument had already said so and nobody had read it: `FAIL science-facts at
  # 2026-09-07T19:07:01Z window_h=24 sources=0 rows=0`. Nothing has been written down for a day.
  #
  resources:
    # 2026-09-07: 5632Mi was Unschedulable and took ClickHouse down. The arithmetic in the block
    # above read `kubectl get nodes -o jsonpath allocatable.memory` as Mi when the unit is Ki:
    # 20935936Ki is 20445Mi, not 20935Mi. So the request was raised past what either node could
    # hold, the pod was evicted to Pending, and its place on the node was taken by other pods
    # while it waited. Measured 21:5xZ, with the pod Pending and counted nowhere:
    #
    #   10.0.148.221  allocatable 5808m / 20445Mi   requested 4956m / 15831Mi   free 852m / 4614Mi
    #   10.0.159.197  allocatable 5808m / 20445Mi   requested 5341m / 13929Mi   free 467m / 6516Mi
    #
    # Which is why restoring the memory alone was not enough: 1000m no longer fits either node,
    # and the scheduler says so -- "0/2 nodes are available: 1 Insufficient memory, 2 Insufficient
    # cpu". The CPU request comes down to 200m, which is the idle floor of a database that spends
    # its day waiting, and it fits .221 with 652m to spare. The limit stays at 2000m: limits do
    # not schedule, so the burst that loads the parts inside the startup probe window is unchanged
    # from what crew#539 measured. A micro request with a burst limit is the shape crew#584 asks
    # for, and is what the comment above claimed while the file still said 1000m.
    #
    # 2026-09-08: "retention or a third node" was a false choice, and 4Gi here was a live
    # landmine. Neither lever was needed and neither was safe. Measured on the running pod once
    # the recreate loop was dead (#2426, 48240d12), `system.parts` active by size read:
    #
    #   system.trace_log             12.67 GiB     signoz_logs.logs_v2       458.11 MiB
    #   system.zookeeper_log          5.23 GiB     signoz_metrics.samples_v4 151.11 MiB
    #   system.part_log               1.83 GiB     signoz_traces.index_v3     50.34 MiB
    #   system.query_log              1.70 GiB
    #   system.processors_profile_log 1003.87 MiB
    #
    # 23.0 GiB of 27.37 GiB on disk was ClickHouse's own debug logging -- fifty times the largest
    # table SigNoz actually uses. That is what sat on the ceiling: of 96 code-241 refusals in ten
    # minutes, 94 came from MergePlainMergeTreeTask::executeStep() and MergeTreeBackgroundExecutor
    # and one from executeQuery. It fed itself -- system logs grow, merging them is refused at the
    # ceiling, parts never merge (2124 active), more merges queue. The collector was never shut
    # out, it was in a retry loop: `Exporting failed. Will retry the request after interval`, with
    # `OvercommitTracker decision: Query was selected to stop by OvercommitTracker` as the refusal.
    # Truncating those tables took the database from 24.68 GiB to 4.36 GiB on disk and the memory
    # tracker from 2.73 to 2.06 GiB, deleting no telemetry and buying no node. The TTLs below stop
    # them coming back; the truncate was the one-off that cleared what had already accumulated.
    #
    # The number does not change, and that is the finding: the purge is what made 4Gi correct.
    # Raising it was tried on 2026-09-08 and was wrong. The live pod had drifted to 5632Mi --
    # #2388's rollback never reached the cluster, because the observability Kustomization was
    # stalled behind a failed signoz HelmRelease pre-upgrade hook, itself a casualty of the
    # recreate loop -- and with RSS measured at 4.49 GiB against a 27 GiB database, matching git to
    # the drift looked like the safe move. It was not. Restarting the process to reclaim the
    # allocator memory the truncate had freed but never returned to the OS (RSS 4.82 GiB while the
    # tracker read 2.62) released the pod's place on the node, and 5632Mi fitted neither node:
    # "0/2 nodes are available: 2 Insufficient cpu, 2 Insufficient memory". The database was
    # Unschedulable until the live ClickHouseInstallation was patched back to 200m / 4Gi. That is
    # the trap platform/state/pinned-workloads.yaml exists to catch: a workload that holds its
    # place only because it already has it does not come back from an eviction.
    #
    # 4Gi is now right rather than merely unchanged. The database is 4.36 GiB on disk, not 27.37,
    # so the merges that were sitting on the ceiling have a fraction of the work. If a measurement
    # after the TTLs have held a day says otherwise, that is when the number moves -- and the
    # honest outcome of a purge like this is usually a diff of zero, not banked headroom.
    requests: { cpu: 200m, memory: 4Gi }
    limits: { cpu: 2000m, memory: 4Gi }
  # crew#483 (2026-08-28, diagnose run 33172481714): once the node agents reached the collector
  # (c03fb77), signoz-otel-collector logged `code: 241 ... (total) memory limit exceeded: would use
  # 3.61 GiB ... current RSS: 1.87 GiB, maximum: 3.60 GiB` on every batch of spans, logs and
  # metric metadata, and coverage stayed at 7/95 pods. The ceiling is 90% of the 4Gi cgroup; the
  # 1.7 GiB gap between RSS and "would use" is what ClickHouse's tracker counts on top of the
  # process: its mark cache defaults to 5 GiB (clickhouse.com/docs/operations/server-configuration-
  # parameters/settings, mark_cache_size), larger than the whole pod, and background merges may
  # take half the ceiling (merges_mutations_memory_usage_to_ram_ratio 0.5). These are server
  # settings the chart renders into config.d (chart 0.138.0 `clickhouse.settings`), so the caches
  # are bounded to fit the pod instead of the pod grown to fit the defaults: 512 MiB of marks and
  # 30% of the ceiling for merges leaves the inserts their memory.
  settings:
    mark_cache_size: "536870912"
    index_mark_cache_size: "134217728"
    merges_mutations_memory_usage_to_ram_ratio: "0.3"
    # 2026-09-08: ClickHouse's own system logs default to no TTL, so on a 20Gi volume they grew to
    # 23.0 GiB and pushed the server onto its memory ceiling merging them (see the resources block
    # above for the measurement). Nothing here touches a signoz_* table -- telemetry retention is
    # signoz-retention.yaml's job and is deliberately not changed.
    #
    # The retention MUST be written inside <engine>, never as a sibling <ttl>. The Altinity
    # operator's own chi-signoz-clickhouse-common-configd already ships an <engine> for fourteen
    # of these tables (01-clickhouse-03-query_log.xml and its neighbours), and ClickHouse refuses
    # to start when a system table has both: exit 36, "If 'engine' is specified for system table,
    # TTL parameters should be specified directly inside 'engine' and 'ttl' setting doesn't make
    # sense. (BAD_ARGUMENTS)". The first attempt at this block used <table>/ttl keys and took the
    # server down for two hours on 2026-09-08 -- CrashLoopBackOff, 27 restarts, no endpoints on
    # signoz-clickhouse, which stalled the observability Kustomization on the langfuse-clickhouse-
    # database health check, which held langfuse's two reserved cores and starved both nodes.
    # bin/idp-clickhouse-system-log-ttl is the gate that refuses the sibling form.
    #
    # Each string below is the operator's own engine string with the interval shortened, so the
    # only thing that differs from a config ClickHouse already accepts is the number of days.
    # trace_log is a profiler and the single worst offender at 12.67 GiB, so it keeps one day;
    # zookeeper_log was inflated by the recreate loop and keeps one; the rest keep three, which is
    # longer than any incident window this estate has needed.
    trace_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    zookeeper_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    processors_profile_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    query_thread_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    query_views_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    session_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    asynchronous_insert_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    blob_storage_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 1 day"
    part_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day"
    query_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day"
    metric_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day"
    asynchronous_metric_log/engine: "Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day"
    # text_log is the one table the operator gives no <engine>, so the sibling form is correct
    # there and only there.
    text_log/ttl: "event_date + INTERVAL 1 DAY DELETE"
  persistence:
    size: 20Gi
  zookeeper:
    replicaCount: 1
    # the chart leaves this image unqualified (signoz/zookeeper:3.7.1); the node runtime enforces
    # short-name mode and refused it with ImageInspectError on 2026-08-25
    image:
      registry: docker.io
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 512Mi }
    persistence:
      size: 2Gi
signoz:
  replicaCount: 1
  # crew#495 CP8: SigNoz (>= v0.112) provisions one admin at startup from these. Email and password
  # come from the vault through signoz.yaml valuesFrom (ExternalSecret signoz-root), never from here.
  env:
    SIGNOZ_USER_ROOT_ENABLED: "true"
    SIGNOZ_USER_ROOT_ORG_NAME: "Bytesync estate"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }
  persistence:
    size: 1Gi
  ingress:
    enabled: false
otelCollector:
  # crew#392: the collector stamps k8s.namespace.name and k8s.pod.name on every span and log line
  # it receives, keyed by the sender's pod IP (k8sattributes, the upstream processor; the chart's
  # clusterRole already grants pods/replicasets for it). Without it a workload that emits on its
  # own (mcp-agentgateway, mcp-github) reaches ClickHouse with only service.name, and the coverage
  # query in telemetry-coverage.yaml, which keys on the pod, counts it as never seen. Existing
  # attributes are kept: k8s-infra's agent already names its pods and the processor does not
  # overwrite. The metrics pipeline is left as shipped: every metric sample comes through the agent.
  config:
    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
        pod_association:
          - sources: [{ from: connection }]
    service:
      pipelines:
        traces: { processors: [k8sattributes, signozspanmetrics/delta, batch] }
        logs: { processors: [k8sattributes, batch] }
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 200Mi }
    limits: { cpu: 500m, memory: 512Mi }
telemetryStoreMigrator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
