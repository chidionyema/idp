# The feature registry (platform/features/features.yaml, logs-metrics-store/enterprise)
# promises `knobs: { retention_days: 7 }` and says "retention is a tier knob, not a hand edit".
# The SigNoz chart has no retention value (only ClickHouse system-log TTLs) and the docs point at
# Settings -> Retention Controls, a hand edit; the same setting is the admin API. Once a day this Job
# logs in as the root user the estate already holds (ExternalSecret signoz-root, mounted as files),
# reads the current TTL of each signal and sets the knob's value where it differs. Same pod shape as
# telemetry-coverage.yaml.
#
# V2 IS THE WRITE PATH, MEASURED 2026-09-13. The job ran for days and failed every morning on ONE
# signal:
#
#   FAIL signoz-retention logs 500 {"errors":[{"code":500,"msg":"SetTTLV2 only supported"}]}
#
# traces and metrics were already at 168h so the job never had to write them, and the v1 GET still
# answers 200 for all three -- so the defect hid behind a job that looked like it worked. The v1
# POST is refused because this deployment is on the v2 TTL engine. Measured on the live estate:
#
#   GET  /api/v1/settings/ttl?type=logs -> 200, logs_ttl_duration_hrs: -1   (unset)
#   GET  /api/v2/settings/ttl?type=logs -> 200, default_ttl_days: 15
#   POST /api/v2/settings/ttl {"type":"logs","duration":"168h"}
#        -> 200 {"message":"custom retention TTL has been successfully set up"}
#
# The two API generations do not agree about the current value, so the v2 READ is what this job
# grades against: reading v1 while writing v2 is how a knob lands and a job still reports a change
# every single day.
#
# The knob lives in the ConfigMap below; the test in tests/bdd pins it to the registry so the two
# cannot drift.
apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-retention
data:
  retention_days: "7"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-retention-apply
data:
  apply.py: |
    import json, os, sys, urllib.error, urllib.parse, urllib.request
    SIGNOZ = os.environ.get("SIGNOZ_URL", "http://signoz:8080")
    SIGNALS = ("traces", "metrics", "logs")
    def http(method, path, body=None, token=None, params=None):
        url = SIGNOZ + path + ("?" + urllib.parse.urlencode(params) if params else "")
        headers = {"Content-Type": "application/json"}
        if token:
            headers["Authorization"] = "Bearer " + token
        req = urllib.request.Request(url, method=method, headers=headers,
                                     data=json.dumps(body).encode() if body is not None else None)
        try:
            with urllib.request.urlopen(req, timeout=60) as r:
                return r.status, json.load(r)
        except urllib.error.HTTPError as e:
            return e.code, json.loads(e.read().decode() or "{}")
    def login(http, email, password):
        # v2 sessions (SigNoz >= 0.112): the org id is read from the session context, the token
        # comes back as data.accessToken (pkg/types/authtypes/token.go GettableToken).
        status, ctx = http("GET", "/api/v2/sessions/context", params={"email": email, "ref": ""})
        if status != 200 or not ctx.get("data", {}).get("orgs"):
            raise SystemExit(f"FAIL signoz-retention session context {status}: {json.dumps(ctx)[:200]}")
        org = ctx["data"]["orgs"][0]["id"]
        status, tok = http("POST", "/api/v2/sessions/email_password",
                           {"email": email, "password": password, "orgId": org})
        if status != 200 or not tok.get("data", {}).get("accessToken"):
            raise SystemExit(f"FAIL signoz-retention login {status}: {json.dumps(tok)[:200]}")
        return tok["data"]["accessToken"]
    def current_days(http, token, sig):
        """The signal's retention in DAYS as the v2 engine reports it, or None when unreadable.

        v2 is read because v2 is written. The two generations disagree -- measured 2026-09-13, v1
        answered `logs_ttl_duration_hrs: -1` for a signal v2 had already set -- and a job that
        reads one engine while writing the other reports a change every morning forever.
        `default_ttl_days` is absent once a custom TTL is in force, which is not a failure: it
        means the apply took, so it is read as the knob and not as "unreadable".
        """
        status, cur = http("GET", "/api/v2/settings/ttl", token=token, params={"type": sig})
        if status != 200:
            return None
        if "default_ttl_days" not in cur:
            return "custom"
        return cur.get("default_ttl_days")
    def plan(http, token, days):
        """The signals whose TTL is not the knob, read before any write so a run that finds the
        estate already correct writes nothing -- ALTER TABLE ... MODIFY TTL is not free."""
        todo = []
        for sig in SIGNALS:
            have = current_days(http, token, sig)
            if have is None:
                todo.append((sig, "unreadable"))
            elif have != "custom" and have != days:
                todo.append((sig, have))
        return todo
    def apply(http, token, days, todo):
        failed = []
        for sig, have in todo:
            # The v2 write: a JSON body, because this deployment's v1 query-parameter POST is
            # refused with `SetTTLV2 only supported`.
            status, out = http("POST", "/api/v2/settings/ttl", token=token,
                               body={"type": sig, "duration": f"{days * 24}h"})
            if status == 200:
                print(f"set {sig}: {have} -> {days}d")
            elif status == 409:  # a previous change is still running in ClickHouse; the next run finishes it
                print(f"pending {sig}: {have} -> {days}d (previous change still in progress)")
            else:
                failed.append(f"{sig} {status} {json.dumps(out)[:140]}")
        return failed
    def main(http=http):
        days = int(open("/config/retention_days").read().strip())
        email = open("/secrets/email").read().strip()
        password = open("/secrets/password").read().strip()
        token = login(http, email, password)
        todo = plan(http, token, days)
        failed = apply(http, token, days, todo)
        if failed:
            raise SystemExit("FAIL signoz-retention " + "; ".join(failed))
        print(f"ok signoz-retention retention_days={days} set={len(todo)} unchanged={len(SIGNALS) - len(todo)}")
    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: signoz-retention
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          priorityClassName: platform-batch
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: apply
              # Same image and uid as telemetry-coverage.yaml: python3 for four HTTP calls, nothing else.
              image: ghcr.io/oracle/oci-cli:20260826
              command: ["python3", "/apply/apply.py"]
              env:
                - { name: HOME, value: /tmp }
              volumeMounts:
                - { name: apply, mountPath: /apply, readOnly: true }
                - { name: knob, mountPath: /config, readOnly: true }
                - { name: signoz-root, mountPath: /secrets, readOnly: true }   # Kyverno: the password is a file, never an env var
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 100m, memory: 128Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: apply
              configMap: { name: signoz-retention-apply }
            - name: knob
              configMap: { name: signoz-retention }
            - name: signoz-root
              secret: { secretName: signoz-root }
            - name: tmp
              emptyDir: {}
