# langfuse.<zone>: the trace store behind the one login (ADR 0007, crew#325 showcase). Same shape
# as the catalogue route (platform/backstage/overlays/oke/httproute.yaml): every request is
# subrequested to oauth2-proxy first through Traefik's ForwardAuth, which must live in this
# namespace; the /oauth2/ path goes to oauth2-proxy itself (ReferenceGrant in platform/identity).
# The listener is https-langfuse on the shared Gateway (prospector-main deploy/k8s/base/edge.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-forward-auth
  namespace: observability
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  namespace: observability
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-langfuse
  hostnames:
    - "langfuse.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /oauth2/ }
      backendRefs:
        - name: oauth2-proxy
          namespace: identity
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth
      backendRefs:
        - name: langfuse-web
          port: 3000
---
# Langfuse's public API, the path programs use: bin/idp-trace-drill from a runner reads a trace
# back by id (crew#325). It carries Langfuse's own auth (project public:secret key, basic auth;
# the keys are the two vault entries langfuse.yaml pulls) and cannot sit behind a browser login,
# where every program got a 302. Same two-part proof as the router's route (platform/llm): the
# annotation says so, and the gates check that this route exposes /api/public/ and nothing else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse-api
  namespace: observability
  annotations:
    idp.estate/auth: langfuse-project-keys
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-langfuse
  hostnames:
    - "langfuse.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/public/ }
      backendRefs:
        - name: langfuse-web
          port: 3000
---
# SigNoz, the estate's telemetry backend (crew#495 CP8). Before this route SigNoz had no hostname:
# the founder could not open it and the SigNoz Terraform provider had no endpoint to declare
# alert rules against. Same two rules as langfuse: the login callback path goes to oauth2-proxy,
# everything else passes the one login and reaches the SigNoz frontend (chart service `signoz`,
# port 8080). The Terraform run authenticates with SIGNOZ-API-KEY on /api/, which forward-auth
# lets through only with a browser session; that API path gets its own route when the rules land.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz
  namespace: observability
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-signoz
  hostnames:
    - "signoz.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /oauth2/ }
      backendRefs:
        - name: oauth2-proxy
          namespace: identity
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth
      backendRefs:
        - name: signoz
          port: 8080
---
# The collector's ingest path for programs off the cluster (crew#516 CP5 slice 3): the Mac's
# science tick (crew science/collect.py) posts OTLP/HTTP to signoz.<zone>/v1/logs, and every
# workload emits to the central collector (LAW 50), so the collector needs a door a program can
# use. A program cannot pass a browser login (the 302 every route above returns), and the
# collector enforces no credential of its own, so the edge checks one: Traefik's basicAuth
# Middleware against the `science:<bcrypt>` line platform/oci/otlp-ingest.tf writes to the vault.
# The route exposes the three OTLP/HTTP paths and nothing else; /v1/ is longer than the SigNoz
# route's catch-all, so the Gateway matches it first. The same two-part proof as the routes
# above: the annotation says so, and the gates check the paths, the Middleware and the vault pull.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otlp-ingest-users
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: otlp-ingest-users, creationPolicy: Owner }
  data:
    # `users` is the key Traefik's basicAuth reads; one program credential, no person (ADR 0007).
    - secretKey: users
      remoteRef: { key: otlp-ingest-users }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: otlp-basic-auth
  namespace: observability
spec:
  basicAuth:
    secret: otlp-ingest-users
    realm: otlp-ingest
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otlp-ingest
  namespace: observability
  annotations:
    idp.estate/auth: edge-basic-auth
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-signoz
  hostnames:
    - "signoz.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1/logs }
        - path: { type: PathPrefix, value: /v1/traces }
        - path: { type: PathPrefix, value: /v1/metrics }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: otlp-basic-auth
      backendRefs:
        - name: signoz-otel-collector
          port: 4318
