# Metabase on the OKE node pool: the boardroom dashboard reads LLM traces from Langfuse's
# PostgreSQL and stores dashboards in its own database (crew#R74 CP1). Two doors (decision 0016):
# the gateway's ForwardAuth login guards the route, and inside it Metabase's own session comes
# from Google Sign-In (MB_GOOGLE_AUTH_*; the open-source edition has no header-auth -- the
# earlier METABASE_* header lines here were inert vendor-nonexistent settings and are gone).
# The first admin is created by machine (metabase-setup.yaml Job) with a vault password no
# person is shown; auto-create is off, so only the seeded founder account can sign in.
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: observability
  labels: { app.kubernetes.io/name: metabase, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-jobs }
spec:
  selector: { app.kubernetes.io/name: metabase }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: observability
  annotations:
    reloader.stakater.com/auto: "true"
  labels: { app.kubernetes.io/name: metabase, app.kubernetes.io/part-of: idp }
spec:
  replicas: 2   # crew#539: one pod is one node event away from a 503
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: metabase }
  template:
    metadata:
      labels: { app.kubernetes.io/name: metabase, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: metabase }
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: metabase
          image: docker.io/metabase/metabase:v0.63.16.1
          ports:
            - { containerPort: 3000, name: http }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Secrets are mounted as files (Kyverno secrets-not-from-env-vars policy).
              # Read them and export as environment variables for Metabase to use.
              export MB_DB_PASS=$(cat /run/secrets/metabase/MB_DB_PASS)
              # Google door only turns on once the founder has minted the client id (decision
              # 0016); until then the pod runs and the gateway login still fences the route.
              if [ -n "$MB_GOOGLE_AUTH_CLIENT_ID" ]; then export MB_GOOGLE_AUTH_ENABLED=true; fi
              exec java -jar /app/metabase.jar
          env:
            - { name: MB_DB_TYPE, value: postgres }
            - { name: MB_DB_HOST, value: metabase-db.observability.svc.cluster.local }
            - { name: MB_DB_PORT, value: "5432" }
            - { name: MB_DB_USER, value: metabase }
            - { name: MB_DB_DBNAME, value: metabase }
            # Decision 0016: Google Sign-In, pinned by omission -- no auto-create domain is set,
            # so only the machine-seeded founder account exists to sign in. The client id is
            # public (one place: clusters/oke/estate-config.yaml, Flux postBuild).
            - { name: MB_GOOGLE_AUTH_CLIENT_ID, value: "${METABASE_GOOGLE_CLIENT_ID}" }
            - { name: METABASE_SESSION_COOKIE_SAMESITE, value: lax }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 2Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: metabase-data, mountPath: /metabase.db }
            - { name: secrets, mountPath: /run/secrets/metabase, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: metabase-data
          emptyDir: {}
        - name: secrets
          secret: { secretName: metabase }
