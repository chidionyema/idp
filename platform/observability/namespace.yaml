apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (catalogue 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: restricted
    idp.estate/edge-attach: "true"   # the shared Gateway selects route namespaces by this label
    chaos-mesh.org/inject: enabled   # crew#539 DoD 2: the langfuse-alert-drill Schedule fails langfuse-web here
