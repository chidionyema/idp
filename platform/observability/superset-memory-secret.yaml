# The credential the Memory dashboard reads Hindsight's store with, published into observability.
#
# The estate has one Postgres (platform/estate-db) and Hindsight's memories live in its `hindsight`
# database. Superset runs in observability and a Pod cannot mount a Secret from another namespace,
# so the same vault entry the Hindsight pods read is published here too -- one value, read twice,
# with no copy for either half to drift from (the pattern of platform/estate-db/migrate/role-secrets.yaml).
#
# This is the `hindsight` role, which owns that database, because estate-db mints no reader today.
# The connection is therefore refused the ability to write at the layer above: the Superset
# database object below sets `allow_dml: false`, so neither a chart nor SQL Lab can issue anything
# but a SELECT through it. A reader role on estate-db is the better fence and is worth doing; it
# needs a grant migration in platform/estate-db/migrate, which is a different lane's file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db-reader
  namespace: observability
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: hindsight-db-reader
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "hindsight"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: hindsight, property: postgres-password }
