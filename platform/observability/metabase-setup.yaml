# Decision 0016: the first-run setup wizard dies by machine. Metabase's un-setup instance
# publishes a setup token on /api/session/properties; one POST to /api/setup with that token
# creates the first admin and the wizard is gone before any person visits. The email and the
# vault-minted password arrive as mounted files (Kyverno secrets-not-from-env-vars); no person
# is ever shown the password -- the interactive door is Google Sign-In (metabase-deployment.yaml).
# Idempotent: an already-set-up instance has no setup token and the Job exits green saying so.
apiVersion: batch/v1
kind: Job
metadata:
  name: metabase-setup
  namespace: observability
  labels: { app.kubernetes.io/name: metabase-setup, app.kubernetes.io/part-of: idp }
spec:
  backoffLimit: 30
  template:
    metadata:
      labels: { app.kubernetes.io/name: metabase-setup, app.kubernetes.io/part-of: idp }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: setup
          image: docker.io/library/python:3.13-alpine
          command: ["python3", "/scripts/setup.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: script, mountPath: /scripts, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/metabase, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: script
          configMap: { name: metabase-setup-script }
        - name: secrets
          secret: { secretName: metabase }
        - name: tmp
          emptyDir: {}
