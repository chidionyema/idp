# The K8sGPT analyzer. Split from the operator install (incident 2026-08-25, chaos row):
# Flux dry-runs a row as one unit, and a core.k8sgpt.ai CR cannot be dry-run before the
# operator chart has installed its CRD. Row `healing-analyzer` orders after `healing`.
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: estate
  namespace: healing
spec:
  ai:
    enabled: true
    backend: openai
    baseUrl: http://litellm.llm.svc:4000/v1
    model: minimax
    secret:
      name: k8sgpt
      key: key
    anonymized: true
    language: english
  # Run 33236900434 (break-glass k8sgpt-analyze, 2026-08-29): the operator's Deployment for this
  # object was refused by Kyverno on seven policies (disallow-capabilities-strict,
  # disallow-privilege-escalation, drop-all-capabilities, require-ro-rootfs, require-run-as-nonroot,
  # restrict-seccomp-strict, require-pod-probes) and the CR had sat unreconciled for 29h, green.
  # The CRD (v0.2.29) carries the security context and resources; probes it does not, so
  # platform/healing/analyzer/exception.yaml waives exactly that one policy for exactly this Deployment.
  # noCache true because the root filesystem is read-only; the cache was a repeat-run speed-up only.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  # Run 33239797940 (break-glass k8sgpt-analyze, 2026-08-29 07:05Z): with the security context and
  # the two exceptions in place the Deployment was created and its ReplicaSet was then refused --
  # kubectl cut the policy name to "denied the request: ...", and `kyverno apply` over the
  # operator's Deployment shape named it: require-requests-limits / autogen-validate-resources
  # ("CPU and memory resource requests and memory limits are required"). The earlier note here
  # that the run did not list it was wrong: the seven-policy refusal was at the Deployment, and
  # this rule judges the Pod. 50m stays inside the paper budget (crew#584 CP-B, 5.0 cores).
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  noCache: true
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.4.37
