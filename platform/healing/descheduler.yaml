# crew#539 CP6. After the 2->1 node swap on 2026-08-27 the survivor ran hot while nothing rebalanced
# and a person ran the restarts. The Kubernetes SIGs Descheduler (LAW 43, kubernetes-sigs/descheduler,
# Apache-2.0, chart 0.36.0 read from https://kubernetes-sigs.github.io/descheduler/ index on
# 2026-08-27) runs as a CronJob and evicts pods the scheduler would place better today. Values and
# the 50m request come from d5ae1960's build (branch feat/crew539-descheduler-robusta b2e3b14): the
# chart's default 500m request would itself go Pending on the pool that needed this.
# The radio room is never evicted: DefaultEvictor priorityThreshold = infrastructure-critical, so
# only pods below that class are candidates. RemovePodsViolatingNodeAffinity is CP10 (d5ae1960,
# preemptible pool) and is added there, not here.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: healing
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: healing
spec:
  # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    kind: CronJob
    schedule: "*/10 * * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    cmdOptions:
      v: 3
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    podSecurityContext:
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    deschedulerPolicy:
      # High enough that the cutover below finishes in one run rather than trickling over an hour.
      # An eviction here is a recreation in place: the pod's requests are freed the moment it
      # terminates and taken again by its replacement, so a sweep does not need headroom it does
      # not have (nodes at 98% and 87% of allocatable CPU in requests, kubectl describe node,
      # 2026-09-08).
      maxNoOfPodsToEvictPerNode: 50
      profiles:
        # The flannel -> Calico cutover, and it is a profile rather than a script because the
        # thing that has to happen is exactly what this operator already does: recreate a pod.
        # Calico became the CNI that answers CNI ADD at 2026-09-06T20:xx (calico-node 36h old on
        # 2026-09-08T08:18Z), and every pod created since has come up on it -- measured over the
        # twenty youngest pods in the cluster, all Calico. A pod older than that boundary is still
        # on flannel and stays there until something recreates it; 78 were, across 68 controllers.
        #
        # PodLifeTime with the boundary as its threshold names that set and no other: nothing
        # younger than 36h can be pre-Calico. It respects PodDisruptionBudgets (the descheduler
        # evicts through the eviction API), so a two-replica front door never loses both.
        #
        # evictSystemCriticalPods, and not the other profile's priorityThreshold, because twelve
        # of the 78 sit at or above 1000000 -- traefik, the flux controllers, metrics-server --
        # and a cutover that skips the front door and the reconcilers is not a cutover. estate-db
        # is excluded: CloudNativePG restarts its own cluster replica-first with a switchover, and
        # the annotation on the Cluster is how you ask (platform/estate-db/cluster/cluster.yaml).
        #
        # This profile is temporary by construction. When the flannel count reaches zero it evicts
        # nothing, and it comes out in the pull request that records the zero -- chidionyema/idp#2499.
        # The receipt is the live count falling, not a test that reads this file back: the estate
        # deleted 322 of those on 2026-09-04 (519d59e8) and bin/test-executes-gate refuses the 323rd.
        - name: cni-cutover
          pluginConfig:
            - name: DefaultEvictor
              args:
                ignorePvcPods: false
                evictLocalStoragePods: true
                evictSystemCriticalPods: true
            - name: PodLifeTime
              args:
                maxPodLifeTimeSeconds: 129600
                namespaces:
                  exclude: [estate-db]
          plugins:
            deschedule:
              enabled: [PodLifeTime]
        - name: rebalance-after-node-swap
          pluginConfig:
            - name: DefaultEvictor
              args:
                ignorePvcPods: true
                evictLocalStoragePods: true
                priorityThreshold:
                  name: infrastructure-critical
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 5
                includingInitContainers: true
            - name: LowNodeUtilization
              args:
                thresholds: { cpu: 20, memory: 20, pods: 20 }
                targetThresholds: { cpu: 60, memory: 60, pods: 60 }
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                constraints: [DoNotSchedule, ScheduleAnyway]
            # crew#539, 2026-08-27: descheduler 0.36 refuses a profile that enables a plugin
            # with no pluginConfig entry ("unable to find \"RemoveDuplicates\" plugin config",
            # CronJob pod descheduler-29797890 Failed, receipt 33127558382); every run since the
            # merge had exited 1 without a rebalance. No args: the defaults are the rule.
            - name: RemoveDuplicates
          plugins:
            balance:
              enabled: [RemoveDuplicates, LowNodeUtilization, RemovePodsViolatingTopologySpreadConstraint]
            deschedule:
              enabled: [RemovePodsHavingTooManyRestarts]
