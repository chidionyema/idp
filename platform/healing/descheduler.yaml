# crew#539 CP6. After the 2->1 node swap on 2026-08-27 the survivor ran hot while nothing rebalanced
# and a person ran the restarts. The Kubernetes SIGs Descheduler (LAW 43, kubernetes-sigs/descheduler,
# Apache-2.0, chart 0.36.0 read from https://kubernetes-sigs.github.io/descheduler/ index on
# 2026-08-27) runs as a CronJob and evicts pods the scheduler would place better today. Values and
# the 50m request come from d5ae1960's build (branch feat/crew539-descheduler-robusta b2e3b14): the
# chart's default 500m request would itself go Pending on the pool that needed this.
# The radio room is never evicted: DefaultEvictor priorityThreshold = infrastructure-critical, so
# only pods below that class are candidates. RemovePodsViolatingNodeAffinity is CP10 (d5ae1960,
# preemptible pool) and is added there, not here.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: healing
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: healing
spec:
  # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-alerts
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    kind: CronJob
    schedule: "*/10 * * * *"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    cmdOptions:
      v: 3
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    podSecurityContext:
      seccompProfile: { type: RuntimeDefault }
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    deschedulerPolicy:
      # High enough that the cutover below finishes in one run rather than trickling over an hour.
      # An eviction here is a recreation in place: the pod's requests are freed the moment it
      # terminates and taken again by its replacement, so a sweep does not need headroom it does
      # not have (nodes at 98% and 87% of allocatable CPU in requests, kubectl describe node,
      # 2026-09-08).
      maxNoOfPodsToEvictPerNode: 50
      profiles:
        # The flannel -> Calico cutover profile was HERE and is paused, 2026-09-08T10:5xZ.
        # It is not deleted prose: it is one revert away, and chidionyema/idp#2541 is where the
        # decision to bring it back is recorded.
        #
        # What happened. The profile merged at 09:20Z (#2501) and did exactly what it was built
        # to do: at ~10:10Z it evicted the flux-system, external-secrets and llm pods off flannel.
        # They came back on a dataplane that is half-migrated, and lost their Service path. Both
        # nodes carry OKE's own marker `last-migration-failure=get_kubesvc_failure`, and both
        # calico-node AND kube-flannel-ds are still Running on both nodes -- two dataplanes
        # programming one node's rules. ClusterIP traffic then fails, same-node as well as
        # cross-node: source-controller times out at 10.96.202.29:80, and external-secrets times
        # out to bitwarden-sdk-server while sitting on the same node. Thirty-plus Kustomizations
        # and every ExternalSecret in the estate went down behind it.
        #
        # The premise the profile was written on is the part that did not hold. It reads: "Calico
        # became the CNI that answers CNI ADD ... every pod created since has come up on it". A
        # pod coming up with a Calico IP is not the same fact as a pod whose Service path works,
        # and nothing measured the second one before 78 pods were moved onto it. That is the
        # lesson worth keeping: a cutover's readiness test is a request completing end to end
        # through a ClusterIP, never an address in the right range (THE EMPIRICAL PROOF RULE).
        #
        # It comes back when the migration is finished or reversed and a real cross-node request
        # over a ClusterIP has been measured completing -- not before.
        - name: rebalance-after-node-swap
          pluginConfig:
            - name: DefaultEvictor
              args:
                ignorePvcPods: true
                evictLocalStoragePods: true
                priorityThreshold:
                  name: infrastructure-critical
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 5
                includingInitContainers: true
            - name: LowNodeUtilization
              args:
                thresholds: { cpu: 20, memory: 20, pods: 20 }
                targetThresholds: { cpu: 60, memory: 60, pods: 60 }
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                constraints: [DoNotSchedule, ScheduleAnyway]
            # crew#539, 2026-08-27: descheduler 0.36 refuses a profile that enables a plugin
            # with no pluginConfig entry ("unable to find \"RemoveDuplicates\" plugin config",
            # CronJob pod descheduler-29797890 Failed, receipt 33127558382); every run since the
            # merge had exited 1 without a rebalance. No args: the defaults are the rule.
            - name: RemoveDuplicates
          plugins:
            balance:
              enabled: [RemoveDuplicates, LowNodeUtilization, RemovePodsViolatingTopologySpreadConstraint]
            deschedule:
              enabled: [RemovePodsHavingTooManyRestarts]
