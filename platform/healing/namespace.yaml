# crew#539 CP6/CP7 (founder consultation 2026-08-27, verbatim on the issue): the two healing loops
# that act after the scheduler primitives in platform/scheduling have kept the radio room seated.
# Descheduler rebalances after a node swap; K8sGPT explains a Pending wave through the estate's own
# LiteLLM (LAW 34: no vendor key, no second router). PSA is `baseline` enforced, `restricted` warned:
# the k8sgpt-operator chart 0.2.29 does not set a seccompProfile on the manager pod and a refused
# pod is the crew#325 incident class; the Descheduler job below is restricted-clean on its own.
apiVersion: v1
kind: Namespace
metadata:
  name: healing
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
