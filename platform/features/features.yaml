# The platform feature register (crew#584, founder 2026-08-29).
#
# Founder: "we need all options, we need to be able to run heavyweight infra, we need the four
# radical architectural setup option also to run a leaner shop, we need the flexibility to run and
# scale any combination of options ... it's not just on/off, the options need to take into account
# the infra requirements and allocate accordingly."
#
# Every optional capability of the platform is a row here. A row has tiers; each tier names the
# Flux Kustomizations it turns on (clusters/oke/*.yaml, `suspend:` is the switch -- nothing is ever
# deleted) and the floor it needs from the node. `bin/idp-features plan` sums the enabled tiers
# against the node's allocatable and says whether the combination fits, and if not which node size
# and monthly price it needs (OCI A1 rates from platform/oci/autoscaler.tf). The Backstage template
# "Enable platform feature" shows that answer BEFORE it opens the PR that flips the switch.
#
# A tier's floor is never typed: `bin/idp-features plan` sums the container requests and PVCs git holds
# under each switch's path, so the trim PRs lower the plan on their own and a shared switch counts once.
# Only a tier whose switch does not exist yet (status: planned) carries a typed floor. A tier marked `status: needs-split`
# is real but not yet its own switch: today its Kustomization carries the whole feature, and the
# split is the work item that makes the tier selectable.
#
# Units: cpu in cores, memory and storage in GiB.
apiVersion: idp.platform/v1
kind: FeatureRegister
node:
  # the sizes the planner may pick; price is computed from platform/oci/variables.tf (free allowance +
  # A1 rates), never typed here (LAW 51 memoize). 6/24 is today's shape (23139de6, crew#516).
  sizes:
    - { name: A1-2-12, ocpus: 2, memory_gb: 12 }
    - { name: A1-4-16, ocpus: 4, memory_gb: 16 }
    - { name: A1-4-24, ocpus: 4, memory_gb: 24 }
    - { name: A1-6-24, ocpus: 6, memory_gb: 24 }
  reserved: { cpu: 0.3, memory_gb: 1.5 }                            # kubelet, kube-system, CNI

core:
  # Always on. Not selectable: without these there is no platform to sell.
  description: "cluster + Flux, admission fences (Kyverno), secret store, identity (SSO, SPIRE, Tailscale), DNS/certs/front door, catalogue, cluster receipt, metrics API"
  switches: [kyverno, gateway-api-crds, priority-classes, edge, external-secrets, secret-store, identity, spire, tailscale, dns, backstage-namespace, backstage, estate-catalog, cluster-state, metrics-server, image-automation, prospector-platform]

features:
  - name: traces
    title: LLM traces and observability
    why: every model call, cost and prompt is a trace a buyer's engineer can open
    tiers:
      - name: enterprise
        what: "Langfuse (traces, prompts, evals, SSO) + SigNoz on ClickHouse (logs, metrics, spans) + the estate OTel collector"
        switches: [observability]
        depends: [postgres, clickhouse]
      - name: lean
        what: "collector only, traces forwarded to a remote Langfuse/OTLP endpoint; nothing stored on the node"
        switches: [observability-collector]
    default: enterprise

  - name: logs-metrics-store
    title: Logs and metrics history
    why: three to seven days of logs and metrics are what an incident is diagnosed from
    tiers:
      - name: enterprise
        what: "SigNoz + ClickHouse, retention 3-7 days (retention is a tier knob, not a hand edit)"
        switches: [observability]
        knobs: { retention_days: 7 }
      - name: lean
        what: "Prometheus only (kube-prometheus-stack), no log store"
        switches: [monitoring]
    default: enterprise

  - name: alerting-healing
    title: Alerting and self-healing
    why: a broken thing is noticed and repaired before a person reads a dashboard
    tiers:
      - name: enterprise
        what: "Robusta runbooks + k8sgpt analyser + descheduler, alerts to Telegram and GitHub"
        switches: [robusta, healing, healing-analyzer, alerts, alerts-github, alerts-secret, monitoring, monitoring-rules]
      - name: lean
        what: "Prometheus rules raise GitHub issues; no runbooks, no analyser"
        switches: [alerts-github, monitoring, monitoring-rules]
    default: enterprise

  - name: workflows
    title: Durable workflow engine
    why: multi-step agent work survives a restart and is replayable
    tiers:
      - name: enterprise
        what: "Temporal on Postgres: the backup, kept in the stack and offered here, not deployed"
        switches: [temporal]
        depends: [postgres]
      # Windmill is the choice and Temporal is the backup -- founder, 2026-09-04, confirming his
      # earlier ruling in crew#695 (carried in docs/decisions/decision-matrix.yaml:458 and :475).
      # "Kubernetes CronJobs only" stood in this tier from 2026-08-29 (f9f96bdb, crew#584) and was
      # never a decision anyone took: the session that wrote this register invented it, and then
      # read it back to him as fact. Neither tier is deployed today -- the temporal Kustomization
      # is suspended in clusters/oke/platform.yaml and there is no Windmill row on the cluster --
      # so `switches` stays empty until one exists. This register is what the self-service template
      # offers, never a claim about what is running.
      - name: lean
        what: "Windmill: scripts, flows and schedules on Postgres, the chosen durable workflow engine"
        switches: []
    default: lean

  - name: agent-memory
    title: Agent long-term memory
    why: agents remember across sessions instead of re-deriving
    tiers:
      - name: enterprise
        what: Hindsight API + its Postgres
        switches: [hindsight]
        depends: [postgres]
      - name: lean
        what: "the Hermes agent's own memory files (on its volume, no database); founder 2026-08-29"
        switches: []
        depends: [hermes-agent]
      - name: session-memory
        what: "claude-mem in its server runtime: coding-session capture for any IDE or agent client, its store a database on the one estate Postgres, its compression model routed through LiteLLM; clients keep nothing locally (docs/specs/hosted-session-memory.md)"
        switches: [claude-mem]
        status: planned
        # Typed only because the switch does not exist yet: one API pod, its queue and no store of
        # its own beyond the shared Postgres.
        floor: { cpu: 0.3, memory_gb: 0.75, storage_gb: 1 }
        depends: [postgres, llm]
    default: enterprise

  - name: client-context
    title: Client context ingest
    why: "an agent session starts knowing the customer's platform, their constraints and the workarounds that are deliberate, instead of re-deriving it and proposing what their rules forbid"
    tiers:
      - name: enterprise
        what: "the four context kinds (estate, catalog, constraint, workaround) served as MCP resources on the one door, ingested from the customer's git, the context API or a reader over a system they already run; design in docs/specs/client-context-ingest-and-session-runtime.md"
        switches: [mcp]
        status: planned
        # Typed only because the ingest and validation service does not exist yet; the door,
        # the snapshot producer and the memory store it reads are already running under [mcp].
        floor: { cpu: 0.2, memory_gb: 0.5, storage_gb: 1 }
        depends: [postgres]
      - name: lean
        what: "the generated estate snapshot and the catalogue only, read through the same door; no customer-declared constraints or workarounds"
        switches: [mcp]
    default: enterprise

  - name: agent-session-runtime
    title: Where an agent session runs
    why: "a laptop-bound session cannot be the only option: it dies with the machine, holds its own credentials and cannot be governed; founder 2026-09-05"
    tiers:
      - name: platform-hosted
        what: "the session runs as a workload with a workload identity, reached from any device through the event gateway, the portal or a native app"
        switches: [mcp]
        status: planned
        # Typed only because the session runtime does not exist yet. One concurrent session.
        floor: { cpu: 0.5, memory_gb: 1, storage_gb: 5 }
      - name: workstation
        what: "the engineer's own MCP-capable client pointed at the same door, authenticated by the same identity layer; supported on purpose, never the only road"
        switches: [mcp]
    default: platform-hosted

  - name: model-routing
    title: Model routing and spend control
    why: "one endpoint, any provider, per-lane budgets (provider agnostic from day 0)"
    tiers:
      - name: enterprise
        what: "LiteLLM proxy with per-key budgets, fallbacks, spend in Langfuse"
        switches: [llm]
      - name: lean
        what: "direct provider keys from the secret store, no proxy"
        switches: []
    default: enterprise

  - name: agent-gateway
    title: Agent and MCP gateway
    why: every tool an agent can reach goes through one policed door
    tiers:
      - name: enterprise
        what: agentgateway + estate MCP server
        switches: [mcp]
      - name: "off"
        switches: []
    default: enterprise

  - name: hermes-agent
    title: Founder's Telegram agent
    why: the estate answers the founder where he already is
    tiers:
      - name: "on"
        switches: [hermes-agent]
        depends: [model-routing]
      - name: "off"
        switches: []
    default: "on"

  - name: founder-screen
    title: Founder screen in the browser
    why: "a Mac, a VM or a cluster shell opened from the portal behind SSO, no client to install"
    tiers:
      - name: "on"
        what: Guacamole behind IDCS SSO
        switches: [guacamole]
      - name: "off"
        switches: []
    default: "on"

  - name: health-checks
    title: External uptime checks
    tiers:
      - name: enterprise
        what: Healthchecks.io-style pinger with its own store
        switches: [healthchecks]
      - name: lean
        what: Prometheus blackbox probes only
        switches: [monitoring-rules]
    default: enterprise

  - name: autoscaling
    title: Autoscaling and burst capacity
    why: scale on demand instead of paying for headroom around the clock
    tiers:
      - name: enterprise
        what: "KEDA event scaling + OCI cluster autoscaler + balloon pods (preemptable headroom)"
        switches: [keda, autoscaler, scheduling]
        knobs: { balloon_pods: 2, balloon_cpu: 0.1 }
      - name: lean
        what: "fixed node, no scaler (zealot rule: no paid scaling without a P95 >= 80 % proof)"
        switches: []
    default: lean

  - name: chaos-drills
    title: Chaos and recovery drills
    why: "recovery is proven on a schedule, not assumed"
    tiers:
      - name: enterprise
        what: Chaos Mesh experiments + the hourly drill dispatcher
        switches: [chaos-mesh, chaos, drills]
      - name: lean
        what: "drill dispatcher only (CI-run drills, no in-cluster fault injection)"
        switches: [drills]
    default: enterprise

  - name: science
    title: Science department (evidence ledgers)
    tiers:
      - name: "on"
        switches: [science]
      - name: "off"
        switches: []
    default: "on"

  - name: staging
    title: Staging namespace
    why: "a second copy of a product on the same cluster, $0, reached over Tailscale, no public LB"
    # Founder 2026-08-29: the lean shop has a staging namespace too; it is a namespace, not a node,
    # so it belongs to every profile and is on by default.
    tiers:
      - name: namespace
        switches: [staging]
        what: "platform/staging/: namespace `staging`, dev-loop label, ResourceQuota ceiling (cpu 1, memory 2Gi, storage 2Gi, 0 public LBs)"
      - name: "off"
        switches: []
    default: namespace

  - name: config-reload
    title: Live config reload
    tiers:
      - name: "on"
        switches: [reloader]
      - name: "off"
        switches: []
    default: "on"

  - name: dev-loop
    title: Developer loop (mirrord into staging, sub-minute gates)
    why: "a change is tried against the real cluster from a laptop in seconds, no cluster boot"
    tiers:
      - name: "on"
        what: "mirrord agents confined to labelled namespaces (idp#678) + fast gate (idp#671)"
        switches: []             # CI and a Kyverno rule; no node floor
        depends: [staging]
      - name: "off"
        switches: []
    default: "on"

  - name: commerce
    title: Money (subscriptions and prepaid credit packs)
    why: "the application never touches a card, a checkout session or a payment webhook; one primitive holds the money and emits estate.commerce.order_paid"
    tiers:
      - name: "on"
        what: "Lago (subscriptions, prepaid credit wallets, invoicing, Stripe as the payment rail) + NATS JetStream as the internal bus + an isolated ledger database"
        switches: [commerce-data, commerce, event-bus]
      - name: "off"
        what: "no commerce layer; whichever product needs money holds its own payment code, which is what this feature exists to end"
        switches: []
    default: "off"

  - name: customer-identity
    title: Sign-in for a product's customers
    why: "the shop keeps no password, no reset flow and no account table; one realm holds who may sign in, and that realm is a file in git a reviewer reads"
    tiers:
      - name: "on"
        what: "Keycloak, one realm per product, reconciled from git by keycloak-config-cli on every change, with the running realm graded against the file by bin/idp-realm-diff"
        switches: [customer-identity]
        status: planned
        # Typed, and only because the switch does not exist yet. From the vendor's sizing page:
        # 1250 MB of RAM per pod including caches and 10,000 cached sessions. The database is a
        # row on the shared Postgres below, never a seventh copy.
        floor: { cpu: 0.5, memory_gb: 1.5, storage_gb: 2 }
      - name: "off"
        what: "no customer identity layer; whichever product needs customers holds its own sign-in code, which is what this feature exists to end"
        switches: []
    default: "off"

  - name: test-prove-crew857
    title: "TEST PROVE crew#857 (throwaway)"
    why: "Proves adding a row to features.yaml makes it selectable in the store with no second edit. Remove before merging."
    tiers:
      - name: "on"
        what: "no-op: no switches, no cluster impact"
        switches: []
      - name: "off"
        switches: []
    default: "off"

products:
  # Products run ON the platform; they are rows so the plan sums them, never platform layers.
  - name: prospector
    switches: [prospector]
    default: "on"

shared:
  # Dependencies the plan consolidates, because every chart brings its own; one of each is the
  # target. instances_today is a measurement, not an estimate: counted in the cluster on
  # 2026-09-04 at 11:45Z as pods running a postgres or pgvector image, excluding the two
  # one-shot jobs that only carry psql (spend-velocity-check, metabase-recovery-dump).
  # backstage, dagster, guacamole, healthchecks, hindsight, litellm, langfuse, superset, temporal.
  postgres: { instances_today: 9, target: 1 }
  clickhouse: { instances_today: 2, target: 1 }
