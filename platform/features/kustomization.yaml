# crew#857: the store register and pre-computed plan, generated by
# bin/idp-features plan --json from features.yaml. Both files live in
# this directory, so Kustomize reads them without load-restrictor flags.
# Flux applies this ConfigMap into namespace backstage so the catalogue
# backend route serves it to the scaffolder form.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backstage
configMapGenerator:
  - name: feature-register
    files:
      - features.yaml
      - plan.json
generatorOptions:
  disableNameSuffixHash: true