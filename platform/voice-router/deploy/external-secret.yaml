# The newsroom anchor's LiteLLM virtual key (crew#974 P3): key `key`, a router key never a vendor
# key, from the estate vault entry `newsroom` written by .github/workflows/vault-seed.yml -f entry=newsroom.
# Its own key so the router attributes and budget-caps the anchor's spend apart from every other caller.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newsroom-llm
  namespace: voice-router
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: newsroom-llm, creationPolicy: Owner }
  data:
    - secretKey: key
      remoteRef: { key: newsroom, property: key }
---
# The streaming router's brain key (router.yaml): the SAME vault entry the fleetview sidecar's
# voice uses (platform/backstage/overlays/oke/fleetview-voice-router-key.yaml), so a spoken turn
# on the socket is attributed and budget-capped exactly like the HTTP voice lane's, and no second
# vendor credential is minted for the same conversation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voice-llm
  namespace: voice-router
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: voice-llm, creationPolicy: Owner }
  data:
    - secretKey: key
      remoteRef: { key: fleetview-voice, property: key }
---
# Unified estate memory (brief / remember) through the agentgateway's /estate/mcp route, the same
# memory Otto and the operator's Mac read: the brain is grounded in what the estate remembers
# instead of inventing it. The gateway's own MCP_GATEWAY_KEY from vault entry `mcp-gateway`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: voice-router-mcp
  namespace: voice-router
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: voice-router-mcp, creationPolicy: Owner }
  data:
    - secretKey: ESTATE_MCP_KEY
      remoteRef: { key: mcp-gateway, property: MCP_GATEWAY_KEY }
