# The estate's one-node admission list (ADR 0048, 2026-10-30).
#
# Machine-generated from the measured inventory plus the authored decisions; regenerate with
# `bin/idp-infra-inventory` and keep the numbers here in step with the manifests.
#
# Every applied workload is either admitted (with a justification and a ladder rung) or
# refused (with a reason and the place its capacity goes instead). Every declared-only
# directory is either cut or reserved, with a reason. A workload that is missing from this
# file fails the gate: new infrastructure needs a justification.
#
# The chart reserves are envelopes, not measurements: a HelmRelease declares no pod template
# in git, so each reserve states its basis and its uncertainty.
budget:
  basis: OCI Always Free allows 4 OCPU and 24GB of Ampere A1 capacity in total, so one full VM is the
    whole allowance; 90% of the CPU and 87.5% of the memory are left for requests, the rest for the kubelet
    and the node's own agents
  node_cpu_requests_m: 3600
  node_disk_gb: 200
  node_memory_requests_mi: 21504
  node_shape: 'one OCI Always Free Ampere A1 VM: 4 OCPU, 24GB RAM, one 200GB boot volume, k3s with local-path
    for persistent volumes'
  one_shot_jobs: 'a Job''s request is a burst, not a standing claim: the estate''s one-shot jobs are excluded
    from the concurrent budget and reported separately'
  pvc_storage_gb: 120
