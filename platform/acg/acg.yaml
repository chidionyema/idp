apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: acg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        idp.platform/capacity-approved: "true"
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        node.kubernetes.io/instance-type: VM.Standard.A1.Flex
      # Trivy KSV-0118 (default security context) and KSV-0014 (writable root filesystem), both
      # HIGH. No UID is forced here: the image's own user is kept, because pinning one blind is how
      # a hardening change turns into a CrashLoop at deploy. What is asserted is what the workload
      # demonstrably does not need -- privilege escalation, any capability, or a writable root.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/chidionyema/idp:main-0-placeholder # {"$imagepolicy": "flux-system:acg"}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MATRIX_PATH
              value: /etc/acg/models.yaml
            - name: LLAMA_BIN
              value: /usr/local/bin/llama-server
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acg-secrets
                  key: groq
                  optional: true
            - name: CEREBRAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acg-secrets
                  key: cerebras
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acg-secrets
                  key: openrouter
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acg-secrets
                  key: google
                  optional: true
            - name: VAST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acg-secrets
                  key: vast
                  optional: true
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acg-secrets
                  key: langsmith
                  optional: true
            - name: LANGCHAIN_PROJECT
              value: "acg"
            - name: LANGCHAIN_TRACING_V2
              value: "true"
          resources:
            requests:
              cpu: "3500m"
              memory: "20Gi"
            limits:
              cpu: "4000m"
              memory: "24Gi"
          volumeMounts:
            - name: matrix
              mountPath: /etc/acg
            - name: models
              mountPath: /models
            # readOnlyRootFilesystem above makes / read-only, so the scratch path every Python
            # process reaches for has to be a real volume rather than the image's own layer.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: matrix
          configMap:
            name: matrix
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: acg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: acg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        idp.platform/capacity-approved: "true"
    spec:
      # Same two HIGH findings as the gateway above, same reasoning.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - "--maxmemory"
            - "4gb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--appendonly"
            - "yes"
          ports:
            - containerPort: 6379
          # `--appendonly yes` writes an AOF to /data, which a read-only root would refuse. This
          # emptyDir keeps the behaviour exactly as it was: the AOF is ephemeral here either way,
          # because nothing has ever bound a PVC to this Deployment.
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: acg
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: acg
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
