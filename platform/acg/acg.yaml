apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: acg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        idp.platform/capacity-approved: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      nodeSelector:
        kubernetes.io/arch: arm64
        node.kubernetes.io/instance-type: VM.Standard.A1.Flex
      containers:
        - name: gateway
          image: ghcr.io/chidionyema/idp:main-0-placeholder # {"$imagepolicy": "flux-system:acg"}
          ports:
            - containerPort: 8000
          # Secrets are files, never env-vars (Kyverno secrets-not-from-env-vars). The shell
          # wrapper reads each key from the mounted Secret volume and exports it before
          # exec'ing the gateway server process.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for f in /run/secrets/acg/*; do
                [ -f "$f" ] || continue
                export "$(basename "$f")=$(cat "$f")"
              done
              exec uvicorn acg.main:app --host 0.0.0.0 --port 8000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MATRIX_PATH
              value: /etc/acg/models.yaml
            - name: LLAMA_BIN
              value: /usr/local/bin/llama-server
            - name: LANGCHAIN_PROJECT
              value: "acg"
            - name: LANGCHAIN_TRACING_V2
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://signoz-otel-collector.observability.svc:4318"
          resources:
            requests:
              cpu: "3500m"
              memory: "20Gi"
            limits:
              cpu: "4000m"
              memory: "24Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: matrix
              mountPath: /etc/acg
              readOnly: true
            - name: models
              mountPath: /models
            - name: acg-secrets
              mountPath: /run/secrets/acg
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: matrix
          configMap:
            name: matrix
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
        - name: acg-secrets
          secret:
            secretName: acg-secrets
            optional: true
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: acg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: acg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        idp.platform/capacity-approved: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          # Full registry host required (Kyverno require-registry-host). No persistence:
          # ACG uses redis as a pure cache (readOnlyRootFilesystem; --appendonly no --save "").
          image: docker.io/library/redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - exec redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru --save "" --appendonly no
          ports:
            - containerPort: 6379
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://signoz-otel-collector.observability.svc:4318"
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "1000m"
              memory: "5Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: [ALL]
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: acg
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: acg
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8000
