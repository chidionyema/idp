apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: acg
  labels:
    app: gateway
    app.kubernetes.io/part-of: acg
  annotations:
    # Reloader rolls the pod when the acg-secrets Secret changes through ESO. `auto` discovers
    # every Secret/ConfigMap this pod consumes, so a new provider key reaches the pool without a
    # list to maintain (founder blueprint 2026-08-30, idp#955).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate   # the redis volume and the single tenant meter are not shareable across a surge
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/chidionyema/acg:main-0-placeholder # {"$imagepolicy": "flux-system:acg"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            # Non-secret configuration. Anything credential-shaped is a file under
            # /run/secrets/acg-secrets/<NAME>, read through <NAME>_FILE (gateway/secrets.py);
            # Kyverno's secrets-not-from-env-vars (crew#341) refuses the env form.
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MATRIX_PATH
              value: /etc/acg/models.yaml
            - name: LANGCHAIN_PROJECT
              value: "acg"
            - name: LANGCHAIN_TRACING_V2
              value: "true"
            - name: PYTHONUNBUFFERED
              value: "1"
            # The provider keys, by file. Each is optional: a missing file leaves that provider
            # out of the pool rather than failing the pod.
            - { name: GROQ_API_KEY_FILE,       value: /run/secrets/acg-secrets/GROQ_API_KEY }
            - { name: CEREBRAS_API_KEY_FILE,   value: /run/secrets/acg-secrets/CEREBRAS_API_KEY }
            - { name: OPENROUTER_API_KEY_FILE, value: /run/secrets/acg-secrets/OPENROUTER_API_KEY }
            - { name: GOOGLE_API_KEY_FILE,     value: /run/secrets/acg-secrets/GOOGLE_API_KEY }
            - { name: ANTHROPIC_API_KEY_FILE,  value: /run/secrets/acg-secrets/ANTHROPIC_API_KEY }
            - { name: VAST_API_KEY_FILE,       value: /run/secrets/acg-secrets/VAST_API_KEY }
            - { name: LANGSMITH_API_KEY_FILE,  value: /run/secrets/acg-secrets/LANGSMITH_API_KEY }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: matrix
              mountPath: /etc/acg
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/acg-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: matrix
          configMap: { name: matrix }
        - name: secrets
          # Optional throughout: acg-secrets is seeded by bin/idp-estate-seed after this row first
          # applies, so the gateway must start with an empty directory and a smaller cascade.
          secret: { secretName: acg-secrets, optional: true, defaultMode: 0440 }
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: acg
  labels:
    app: redis
    app.kubernetes.io/part-of: acg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--appendonly"
            - "no"   # a cache: losing it costs a cache miss, not state; no volume to own
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 320Mi
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: acg
  labels:
    app: gateway
    app.kubernetes.io/part-of: acg
spec:
  # ClusterIP, not LoadBalancer: the estate reaches every product through the shared Gateway
  # (prospector-edge) and the ns-ceiling above sets services.loadbalancers: "0" (AGENTS.md:
  # one routing layer).
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: acg
  labels:
    app: redis
    app.kubernetes.io/part-of: acg
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# acg.<zone> -> the gateway, through the shared Gateway. Not behind oauth2-proxy: the callers are
# programs holding an `acg_<tier>_<tenant>_<secret>` bearer key, and the gateway refuses any
# request without one (gateway/main.py tenant_from_key). external-dns writes the record from this
# hostname (platform/dns).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acg
  namespace: acg
  labels:
    app.kubernetes.io/part-of: acg
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-acg
  hostnames:
    - "acg.${ESTATE_ZONE}"
  rules:
    - backendRefs:
        - name: gateway
          port: 80
