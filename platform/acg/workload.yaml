# The ACG gateway and its L0 cache.
#
# Sized for the Always Free A1 budget. The aspirational manifest in the acg repo asked for
# 3.5 CPU / 20Gi and pinned a VM.Standard.A1.Flex node with 4 OCPUs; on a cluster whose whole ARM
# pool is the Always Free 4-OCPU / 24Gi allowance that pod could never schedule beside anything
# else, and its own ns-ceiling (500m / 1Gi) would have refused it a second time. What runs here is
# the part that fits and that the image actually contains: the FastAPI gateway, its redis cache,
# the 5-layer cascade's L0/L1/L5 paths, and the model registry. Local CPU llama.cpp (L2) is off
# because acg.Dockerfile installs no llama-server -- LLAMA_BIN points at a path that does not
# exist, so a local_cpu request falls through the cascade to L5 the way it would if the model were
# absent, which is the honest behaviour and not a lie about a capability.
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix
  namespace: acg
data:
  models.yaml: |
    version: 1
    defaults:
      quant: Q4_K_M
      backend: llama.cpp
    models:
      - id: smollm3-3b
        params: 3.0e9
        active: 3.0e9
        license: apache-2.0
        ram_q4_gb: 2.0
        vram_q4_gb: 2.2
        cpu_tps_ampere: 18
        gpu_tps_3090: 140
        intents: [code, chat, general]
        quality: 0.72
        beats: [sonnet-4]
        benchmarks: {agent_code: 93.3, sonnet4_agent_code: 85.0}
        providers: [local_cpu, local_gpu, free_api]
        hf: HuggingFaceTB/SmolLM3-3B
      - id: nanbeige-3b
