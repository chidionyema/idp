name: consult-gemini
description: >
  Ask Gemini, the estate's long-term architectural consultant, a question with named repo
  files as context. Goes through the estate router so spend is on the ledger, falls back to
  the neutral default lane if Gemini refuses (and says so), and saves the answer as a dated
  review in docs/reviews/.
args:
  question: { type: string, required: true, help: "What you want reviewed or decided, in a sentence or two" }
  files:    { type: string, default: "", help: "Comma-separated repo files to give as context" }
  model:    { type: string, default: "gemini/gemini-3.5-flash", help: "Router model to ask first" }
  max_bytes: { type: int, default: 400000, help: "Context budget; anything past it is cut and named" }
tools: []
door_s: 100
halt_on_failure: true
steps:
  - name: ask
    cmd: |
      python3 ~/.estate/libexec/consult_gemini.py question={{question}} files={{files}} model={{model}} max_bytes={{max_bytes}}
