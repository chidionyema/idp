name: crystallize
description: Crystallize an ephemeral pattern into a durable intent YAML. topic= command= description= dry_run=true force=false.
# declared, so an omitted arg gets its default instead of reaching the script as a literal
# "{{dry_run}}" (tests/estate/test_every_intent_renders_to_valid_shell.py)
args:
  topic:       {type: string}
  command:     {type: string}
  description: {type: string}
  dry_run:     {type: bool, default: true}
  force:       {type: bool, default: false}
steps:
  - name: write
    cmd: python3 ~/.estate/libexec/crystallize.py topic={{topic}} command={{command}} description={{description}} dry_run={{dry_run}} force={{force}}
