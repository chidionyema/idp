name: gh-api
description: >-
  Read-only GitHub API probe for chidionyema/idp. No caller-controlled HTTP
  method, CLI flags, repository, or mutation. GitHub writes belong exclusively
  to the authenticated estate delivery service.
class: read
args:
  path: {type: string, description: "Relative read-only GitHub API path within chidionyema/idp"}
door_s: 60
halt_on_failure: true
steps:
  - name: get
    cmd: |
      set -euo pipefail
      path={{path}}
      if [[ ! "$path" =~ ^[a-zA-Z0-9_./-]+$ ]] || [[ "$path" == *..* ]]; then
        printf 'REFUSED: invalid read-only GitHub API path\n' >&2
        exit 4
      fi
      gh api --method GET "repos/chidionyema/idp/$path"
