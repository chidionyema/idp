name: gh-api
description: Thin wrapper — raw gh api call. Returns JSON.
args:
  path:   {type: string, description: "API path after repos/{owner}/{repo}/"}
  params: {type: string, default: ""}
steps:
  - name: get
    # no `2>/dev/null`: the reason gh refused is the answer, not noise (2026-10-22)
    cmd: >
      gh api repos/chidionyema/idp/{{path}} {{params}}
