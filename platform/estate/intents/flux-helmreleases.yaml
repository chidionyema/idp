name: flux-helmreleases
description: >
  Composite intent. List Flux HelmReleases and their status.
args:
  namespace: {type: string, default: ""}
  kubeconfig: {type: string, default: ""}
steps:
  - name: helmreleases
    intent: kubectl-list
    args:
      resource: helmreleases
      namespace: "{{namespace}}"
      all_ns: true
      output: json
  - name: summary
    cmd: |
      python3 -c "
      import json, sys
      try:
          items = json.load(sys.stdin).get('items', [])
          first_ready = sum(
              1
              for h in items
              if (h.get('status') or {}).get('conditions', [{}])[0].get('type') == 'Ready'
          )
          print(f'{len(items)} HelmReleases | Ready: {first_ready}')
          for h in items:
              conds = (h.get('status') or {}).get('conditions', [])
              ready = any(
                  c.get('type') == 'Ready' and c.get('status') == 'True' for c in conds
              )
              chart = (h.get('spec') or {}).get('chart', {}).get('chart', '')
              label = 'READY' if ready else 'NOT-READY'
              print(f\"  {h['metadata'].get('namespace')}/{h['metadata']['name']} {label} chart={chart}\")
      except Exception as e:
          print(f'flux helm not installed: {e}')
      "
