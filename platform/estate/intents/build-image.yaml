name: build-image
description: >
  Build and push a Docker image via the estate's CI pipeline.
  Uses bin/build-image from the idp repo (R24 enforced there).
args:
  image: { type: string, help: "Image name, e.g. fleetview-backend" }
  ref:   { type: string, default: "main", help: "Git ref to build" }
tools: [bash, git, docker]
models: []
halt_on_failure: true
max_turns: 5
steps:
  - cmd: >
      ~/Documents/code/idp/bin/build-image {{image}} {{ref}}
    on_fail: halt
