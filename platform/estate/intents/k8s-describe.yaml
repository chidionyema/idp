name: k8s-describe
description: Describe a Kubernetes resource including events and conditions.
args:
  kind: { type: string, help: "API resource kind" }
  name: { type: string, help: "Resource name" }
  namespace: { type: string, default: "", help: "Namespace" }
tools: []
halt_on_failure: false
steps:
  - cmd: >
      KUBECONFIG="${OKE_KUBECONFIG:-}"; CMD="kubectl --kubeconfig $KUBECONFIG"; if [ -n "{{namespace}}" ]; then CMD="$CMD -n {{namespace}}"; fi; CMD="$CMD describe {{kind}} {{name}}"; eval "$CMD" 2>&1
