name: k8s-get
description: >
  Read-only kubectl get. Always uses OKE_KUBECONFIG.
args:
  kind: { type: string, help: "API resource kind (e.g. pods, deploy, svc)" }
  name: { type: string, default: "", help: "Specific resource name" }
  namespace: { type: string, default: "", help: "Namespace" }
  selector: { type: string, default: "", help: "Label selector (e.g. app=litellm)" }
  output: { type: string, default: "wide", help: "Output format (wide, yaml, json)" }
tools: []
halt_on_failure: false
steps:
  - cmd: >
      K8S_KIND={{kind}} K8S_NAME={{name}} K8S_NS={{namespace}} K8S_SELECTOR={{selector}} K8S_OUT={{output}} python3 ~/.estate/libexec/k8s-get.py
