name: secrets-discovery
description: >
  Trace how a secret travels from Bitwarden Secrets Manager to the cluster.
  Answers: where is the sync defined, what stores exist, and what secrets are
  flowing. Used to diagnose "why isn't my key in the vault" fast.
steps:
  - name: bitwarden-helmrelease
    cmd: |
      cat <<'EOF'
      Bitwarden SDK server (external-secrets chart, platform/secrets/external-secrets.yaml):
      ESO HelmRelease: external-secrets in namespace external-secrets
      bitwarden-sdk-server.enabled: true  (v0.6.0, in-cluster TLS via cert-manager chain)

      Stores (ClusterSecretStore):
      estate-vault  -> OCI Vault (machine account, instance principal)
      human-vault   -> Bitwarden Secrets Manager (machine account, via bitwarden-sdk-server)

      Key files:
      platform/human-vault/store.yaml          -> ClusterSecretStore human-vault (Bitwarden)
      platform/human-vault/access-token.yaml    -> ESO reads bitwarden-machine from estate-vault
      platform/human-vault/certs.yaml           -> TLS certs for bitwarden-sdk-server
      platform/identity/external-secret.yaml    -> Example: oauth2-proxy pulls from estate-vault
      clusters/oke/estate-config.yaml           -> BITWARDEN_ORG_ID, BITWARDEN_PROJECT_ID (names live here, LAW 46)
      Path: Bitwarden Secrets Manager -> ESO reads via human-vault -> Kubernetes Secret in namespace
      EOF

  - name: vault-seed-workflow
    cmd: |
      cat <<'EOF'
      vault-seed.yml (idp repo, .github/workflows/vault-seed.yml):
      Runs on: OKE CI (ubuntu-latest, OIDC session)
      Backend: OCI Vault (bin/idp-cloud secret put)
      Then: SOPS/age pushes to estate-secrets (sops encrypts to age identity, git push)

      vault-seed does NOT read from Bitwarden directly.
      Bitwarden -> OCI Vault sync is separate (founder adds to Bitwarden Secrets Manager).
      The Bitwarden->OCI path is the human-first-mile into the estate vault system.

      Key binaries:
        bin/idp-cloud              -> OCI Vault abstraction (secret get/put/list)
        bin/idp-cloud secret get   -> reads OCI Vault, not SOPS
        estate-secrets/scripts/secret-load -> reads SOPS/age vault (laptop side)
        estate-secrets/scripts/secret-add -> writes SOPS/age vault (CI side, via vault-seed)
      EOF

  - name: list-estate-vault-secrets
    cmd: |
      IDP_CLOUD_BACKEND=oci ~/Documents/code/idp/bin/idp-cloud secret list 2>/dev/null || echo "(no OCI session)"
  - name: list-sops-vault
    cmd: |
      cd ~/Documents/code/estate-secrets && git -C ~/Documents/code/estate-secrets ls-files secrets/dev/ 2>/dev/null || echo "(no access)"
  - name: summary
    cmd: |
      python3 -c "
      import subprocess, json, os

      print('=== Secret path: Bitwarden -> OCI Vault -> SOPS -> Cluster ===')
      print()
      print('1. Founder adds secret to Bitwarden Secrets Manager (human-vault, platform/human-vault/store.yaml)')
      print('2. ESO reads it via human-vault ClusterSecretStore -> Kubernetes Secret in namespace')
      print('3. For machine seeds: vault-seed.yml (OKE CI) writes to OCI Vault (bin/idp-cloud secret put)')
      print('4. vault-seed then encrypts with SOPS/age and pushes to estate-secrets (git)')
      print('5. Laptop reads: estate-secrets/scripts/secret-load -> decrypts with age key -> env var')
      print()
      print('Key env vars the laptop needs:')
      print('  SOPS_AGE_KEY_FILE  -> age private key (~/.config/prospector/age-key.txt)')
      print('  LITELLM_API_KEY    -> the laptop router key (from SOPS vault)')
      print('  AI_GATEWAY_API_KEY -> via SOPS: secrets/dev/AI_GATEWAY_API_KEY.yaml')
      print()
      print('Adding a new secret to SOPS (from OCI Vault):')
      print('  bin/idp-cloud secret get MY_KEY | secret-add dev MY_KEY KEY_NAME')
      print('  # then git push from estate-secrets')
      "
