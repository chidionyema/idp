name: delegate-build
description: Strong model plans, cheap model builds, a test decides. verb=plan|dispatch|status spec=<md> slug=<name> repo= planner=claude-opus-5-5 builder=claude-sonnet-5 parallel=3 max_turns=30. Plan first, read plan.json, then dispatch.
# WHY: 2026-09-27 builders went out on Opus with a spec and no plan, explored on their own and
# burned tokens. Every step here names its files and a done-check; builders open nothing else;
# done means the check exits 0. Model calls are `claude -p` children, so they go through the
# gateway on :4000 (ANTHROPIC_BASE_URL in ~/.claude/settings.json).
effect: writes
args:
  verb:      {type: string, default: status}
  spec:      {type: string, default: ""}
  slug:      {type: string}
  repo:      {type: string, default: ~/Documents/code/idp}
  planner:   {type: string, default: claude-opus-5-5}
  builder:   {type: string, default: claude-sonnet-5}
  parallel:  {type: int, default: 3}
  max_turns: {type: int, default: 30}
steps:
  - name: run
    timeout: 7200
    cmd: python3 ~/.estate/libexec/delegate-build.py {{verb}} spec={{spec}} slug={{slug}} repo={{repo}} planner={{planner}} builder={{builder}} parallel={{parallel}} max_turns={{max_turns}}
