name: delegate-build
description: Artifact policy routes work; a test decides. verb=plan|dispatch|status spec=<md> slug=<name> repo= planner=auto builder=auto reasoning=standard risk=standard parallel=3 max_turns=30 attempts=3. Ordinary planning is mid-tier; deep/high-risk work is frontier; two gated failures trigger frontier re-planning. Explicit model names are manual overrides.
# WHY: 2026-09-27 builders went out on Opus with a spec and no plan, explored on their own and
# burned tokens. Every step here names its files and a done-check; builders open nothing else;
# done means the check exits 0. Model calls are `claude -p` children, so they go through the
# gateway on :4000 (ANTHROPIC_BASE_URL in ~/.claude/settings.json).
effect: writes
args:
  verb:      {type: string, default: status}
  spec:      {type: string, default: ""}
  slug:      {type: string}
  repo:      {type: string, default: ~/Documents/code/idp}
  planner:   {type: string, default: auto}
  builder:   {type: string, default: auto}
  reasoning: {type: string, default: standard}
  risk:      {type: string, default: standard}
  parallel:  {type: int, default: 3}
  max_turns: {type: int, default: 30}
  attempts:  {type: int, default: 3}
steps:
  - name: run
    timeout: 7200
    cmd: python3 ~/.estate/libexec/delegate-build.py {{verb}} spec={{spec}} slug={{slug}} repo={{repo}} planner={{planner}} builder={{builder}} reasoning={{reasoning}} risk={{risk}} parallel={{parallel}} max_turns={{max_turns}} attempts={{attempts}}
