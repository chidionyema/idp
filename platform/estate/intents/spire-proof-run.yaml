name: spire-proof-run
description: >
  Prove a workload on OKE is issued an X.509 SVID: one ephemeral pod with the spec of
  platform/spire/proof-cronjob.yaml (workload-API CSI socket, PSA-restricted), its log read, the pod
  deleted on every path. Exit 0 only when the pod Succeeded and logged a SPIFFE ID; 1 otherwise.
  Long-running (the fetch timeout plus 60s).
args:
  namespace: { type: string, default: "backstage", help: "Namespace to run the proof pod in" }
  timeout: { type: string, default: "300s", help: "Timeout for SVID fetch" }
tools: []
halt_on_failure: true
steps:
  - cmd: >
      bash ~/.estate/libexec/spire-proof-run.sh {{namespace}} {{timeout}}
