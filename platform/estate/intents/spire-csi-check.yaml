name: spire-csi-check
description: >
  Check CSI driver registration on a node and whether the workload API socket
  exists. Use to diagnose proof pod socket mount failures.
args:
  node: { type: string, default: "", help: "Node name or IP. If omitted, lists all CSI nodes." }
tools: []
halt_on_failure: false
steps:
  - cmd: >
      bash ~/.estate/libexec/spire-csi-check.sh {{node}}
