name: incident-loop
description: >
  The estate incident loop, end to end: sense a real error (a red GitHub Actions run, a refused
  estate door, or an explicit report), give it one incident record, score it with the one policy
  (catalog/incident-policy.json), raise exactly one ticket with that priority, dispatch it to an
  agent session on the sovereign bus or to the estate's own task queue, verify that the error is
  gone, close the ticket with the lesson, and record the MTTR. This is the R-14 path of the
  estate master epic: "an error results in a ticket being raised, prioritised, assigned and
  depending on capacity an agent is automatically launched". Actions: tick (one pass of the whole
  loop - this is what the laptop watcher runs), sense (what the sensors see right now), list, show,
  report (raise one by hand), verify, drill (the sealed-failure drill), policy, clock (can the
  host wall clock be trusted? 0 yes, 1 the clock is untrustworthy, 2 no verdict was possible).
args:
  action: { type: string, default: "tick" }
  repo: { type: string, default: "" }
  incident: { type: string, default: "" }
  severity: { type: string, default: "major" }
  blast: { type: string, default: "lane" }
  title: { type: string, default: "" }
  url: { type: string, default: "" }
  state: { type: string, default: "" }
  lane: { type: string, default: "" }
  worktree: { type: string, default: "" }
tools: []
# The loop talks to GitHub (read the runs, open and close one issue), to the sovereign bus (one
# session) and to the estate queue, so it needs the executor's whole budget.
door_s: 100
halt_on_failure: false
steps:
  - name: loop
    # The executor shell-quotes every {{var}} itself (shlex.quote in estate-execute's
    # interpolate()), so the placeholders are bare here. Quoting them again would send the
    # literal quotes to the script and break every argument.
    cmd: |
      python3 ~/.estate/libexec/incident-loop.py {{action}} \
        --repo {{repo}} \
        --incident {{incident}} \
        --severity {{severity}} \
        --blast {{blast}} \
        --title {{title}} \
        --url {{url}} \
        --state {{state}} \
        --lane {{lane}} \
        --worktree {{worktree}}
