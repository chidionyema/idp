name: ci.run
description: >
  Trigger CI on a branch and wait for the result.
  Returns pass/fail with the first failing job name.
args:
  branch: { type: string, help: "Branch name to trigger CI on" }
  repo:   { type: string, default: "chidionyema/idp", help: "GitHub repo (owner/name)" }
tools: []
halt_on_failure: false
# 2026-11-23 (idp#8463). This step carried two defects, and both of them made the door lie.
#
# 1. `BRANCH="${branch}"`. interpolate() renders {{var}} and <<var>> only, so `${branch}`
#    reached the shell as a reference to an unset shell variable. BRANCH was empty, so
#    `git push origin ""` failed -- and `gh run list --branch ""` filters on nothing at all
#    (measured on chidionyema/gemini-sync: `--branch ""` returns every run in the
#    repository, `--branch does-not-exist` returns none), so the lookup handed back the
#    newest queued run of ANY branch and the intent then watched it and reported its
#    verdict as this branch's. The substitution the executor actually performs is
#    {{branch}}; a shell variable is not one.
#
# 2. `--status queued`. The run a push starts is often already in_progress by the time the
#    lookup runs -- measured: the intent answered "no queued run found" while the branch's
#    own run was running. The run is now identified by the sha that was pushed, not by a
#    status that changes under the lookup: an unfinished run for that sha wins, and a
#    finished run for the same sha is the fallback. A branch that triggers no workflow now
#    says so and names the sha, instead of failing as "no queued run found" or, worse,
#    succeeding on somebody else's run.
steps:
  - cmd: >
      BRANCH="{{branch}}";
      REPO="{{repo}}";
      git push origin "$BRANCH" 2>&1 | tail -3;
      SHA=$(git rev-parse "origin/$BRANCH" 2>/dev/null || git rev-parse "refs/heads/$BRANCH" 2>/dev/null || git rev-parse HEAD);
      RUN=$(gh run list --repo "$REPO" --branch "$BRANCH" --limit 30 --json databaseId,headSha,status --jq ".[] | select(.headSha == \"$SHA\" and .status != \"completed\") | .databaseId" | head -1);
      if [ -z "$RUN" ]; then
        i=0;
        while [ $i -lt 10 ]; do
          sleep 3;
          i=$((i + 1));
          RUN=$(gh run list --repo "$REPO" --branch "$BRANCH" --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -1);
          if [ -n "$RUN" ]; then break; fi;
        done;
      fi;
      echo "sha: $SHA";
      echo "run: $RUN";
      if [ -z "$RUN" ]; then echo "no run found for $SHA on $BRANCH"; exit 1; fi;
      gh run watch "$RUN" --repo "$REPO" --exit-status 2>&1 | tail -5
