name: spire-entries
description: >
  Composite intent. List SPIRE ClusterSPIFFEIDs and their SPIFFE IDs.
args:
  kubeconfig: {type: string, default: ""}
steps:
  - name: entries
    intent: kubectl-list
    args:
      resource: clusterspiffeids
      output: json
  - name: summary
    cmd: |
      python3 -c "
      import json, sys
      try:
          items = json.load(sys.stdin).get('items', [])
          print(f'{len(items)} ClusterSPIFFEIDs:')
          for e in items:
              spiffe = (e.get('spec') or {}).get('spiffeIdTemplate', '?')
              print(f\"  {e['metadata']['name']}: {spiffe}\")
      except Exception as ex:
          print(f'No ClusterSPIFFEIDs or SPIRE not installed: {ex}')
      "
