name: net-forensics
description: >-
  READ-ONLY node network forensics on every node (or one): conntrack saturation, rp_filter,
  kernel drop counters, interface MTU/errors, flannel-vs-calico rule collisions (nft + legacy),
  DROP/REJECT rules with hits, pod routes and broken neighbours. Reads host kernel state through
  each node's calico-node pod; findings are prefixed "!! ". probe=probe adds a cross-node
  pod-to-pod TCP test with two throwaway busybox pods (the only part that creates anything).
  Packet-level companion to k8s-diag.
args:
  node:  {type: string, default: "all"}
  probe: {type: string, default: ""}
halt_on_failure: false
steps:
    # Step bound removed 2026-10-25: time is declared once, as this intent's budget
    # (docs/decisions/0043-the-bound-lives-at-the-door.md). A number here could only be a
    # guess about someone else's work, and where it fired it invented a failure.
  - name: node-net-forensics
    cmd: >
      bash ~/.estate/libexec/net-forensics.sh "{{node}}" {{probe}}
