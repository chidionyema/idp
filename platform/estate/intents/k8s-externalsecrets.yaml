name: k8s-externalsecrets
description: >
  Composite intent. List ExternalSecrets and their sync status.
args:
  namespace: {type: string, default: ""}
  kubeconfig: {type: string, default: ""}
steps:
  - name: externalsecrets
    intent: kubectl-list
    args:
      resource: externalsecrets
      namespace: "{{namespace}}"
      all_ns: true
      output: json
  - name: status
    cmd: |
      python3 -c "
      import json, sys
      try:
          items = json.load(sys.stdin).get('items', [])
          print(f'{len(items)} ExternalSecrets:')
          for es in items:
              synced = (es.get('status') or {}).get('lastSyncTime', '')
              refresh = (es.get('spec') or {}).get('refreshInterval', '?')
              print(f\"  {es['metadata'].get('namespace')}/{es['metadata']['name']} synced={synced} refresh={refresh}\")
      except Exception as e:
          print(f'Error: {e}')
          print('ExternalSecret CRD may not be installed')
      "
