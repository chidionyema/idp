name: k8s-externalsecrets
description: >
  Composite intent. List ExternalSecrets and their sync status.
args:
  namespace: {type: string, default: ""}
  kubeconfig: {type: string, default: ""}
steps:
  - name: externalsecrets
    intent: kubectl-list
    args:
      resource: externalsecrets
      namespace: "{{namespace}}"
      all_ns: true
      output: json
  - name: status
    cmd: |
      python3 -c "
      import sys,json
      try:
      d=json.load(sys.stdin)
      items=d.get('items',[])
      print(f'{len(items)} ExternalSecrets:')
      for es in items:
      name=es['metadata']['name']
      ns=es['metadata']['namespace']
      synced=es.get('status',{}).get('lastSyncTime','')
      refresh=es.get('spec',{}).get('refreshInterval','?')
      print(f'  {ns}/{name} synced={synced} refresh={refresh}')
      except Exception as e:
      print(f'Error: {e}')
      print('ExternalSecret CRD may not be installed')
      "