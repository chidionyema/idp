name: disk-reclaim
description: >
  Reclaim the data volume when the executor's floor refuses every door (measured 2026-10-28:
  426 MB free, floor 1500 MB, so every estate_execute and every git MCP tool refused while the
  machine was starved). Two actions, both narrow and both measured:

    1. stop the local gate runs this machine is running TWICE. bin/idp-ci is a full sweep and two
       of them at once on a 113 GiB volume is what emptied it; the estate's real gate is the one
       GitHub Actions runs on the branch, so a duplicate LOCAL sweep is stopped rather than left
       to starve every other agent. Only the pids named by the caller are signalled, and only
       when their command line is the gate itself.
    2. delete the pytest scratch directories of runs that FINISHED: pytest-of-* directories older
       than the age given, with no process holding anything open inside them (lsof decides, not
       the timestamp). A live test's scratch is never touched.
    3. (added 2026-10-28) reclaim the ESTATE'S OWN regenerable weight, which no other door
       covers: the executor's per-job run records under ~/.estate/runs (one .log/.pid/.exit per
       job -- 73k files, 305M measured) older than a day, the harness job scratch under
       ~/.estate/harness/cc/jobs for jobs that FINISHED (>=3 days old, lsof-clean, no lock
       file), the estate's own logs and harness scratch caches, and the session transcripts of
       sessions that ended more than 14 days ago. Each of these is estate-owned and regenerable:
       a run record is a log, a finished job's scratch is its own leftover, a transcript of a
       session that is over is not the estate's memory (that is facts.jsonl, estate.db and the
       knowledge graph, none of which this touches).
    4. (added 2026-10-28) a stale DEPENDENCY TREE: ~/.estate/frontend/idp/backstage/node_modules
       -- 2277M measured, 28 days stale, restored by `yarn install`. A dependency tree is a
       toolchain cache, the same class as the old toolchains the estate's own cleaner reclaims.
    5. (added 2026-10-28) the estate's own cleaner gets to FINISH: disk-cleanup.sh is a
       multi-phase job (caches, docker, worktrees, temp, clones, the critical tier) that the
       95s door kills mid-phase, so it prints nothing and the caller learns only that it was
       killed. It is started in the background with its own budget and its own log. Its rules
       are its own: a claimed worktree is never removed, uncommitted work is archived first.

    No agent's work is touched by any of this: no worktree a live claim covers, no ledger, no
    database, no toolchain the estate's runtime names. The run prints free space before and
    after, measured, and the lsof refusal for anything it left alone.
class: mutate
args:
  pids: {type: string, default: "", description: "space-separated pids of local idp-ci runs to stop"}
  age_min: {type: int, default: 180, description: "minutes old before a pytest scratch dir may go"}
  budget_s: {type: int, default: 60, description: "seconds of work this run may start"}
  rm_age_min: {type: int, default: 120, description: "minutes old before a FINISHED job's run record may go"}
  dry: {type: int, default: 0, description: "1 = report what would go and remove nothing"}
door_s: 95
halt_on_failure: false
steps:
  - name: before
    cmd: |
      df -k /System/Volumes/Data | awk 'NR==2 {printf "free before: %dM on %s\n", $4/1024, $9}'
  - name: stop-the-duplicate-gates
    cmd: |
      for p in {{pids}}; do
        [ -n "$p" ] || continue
        cmd=$(ps -p "$p" -o command= 2>/dev/null)
        case "$cmd" in
          *bin/idp-ci*)
            echo "stop     idp-ci pid $p: $cmd"
            kill -TERM "$p" 2>/dev/null || echo "ok       pid $p already gone"
            ;;
          "") echo "ok       pid $p is not running" ;;
          *) echo "skip     pid $p is not the gate: $cmd" ;;
        esac
      done
      exit 0
  - name: reclaim-the-finished-pytest-scratch
    cmd: |
      base="${TMPDIR%/}/pytest-of-$(id -un)"
      [ -d "$base" ] || { echo "ok       no pytest scratch at $base"; exit 0; }
      now=$(date +%s)
      for d in "$base"/pytest-*; do
        [ -d "$d" ] || continue
        age=$(( (now - $(stat -f %m "$d")) / 60 ))
        if [ "$age" -lt {{age_min}} ]; then
          echo "keep     $d (${age}m old, live or recent)"
          continue
        fi
        if lsof +D "$d" >/dev/null 2>&1; then
          echo "keep     $d (${age}m old, a process holds it open)"
          continue
        fi
        sz=$(du -sk "$d" 2>/dev/null | awk '{print $1}')
        rm -rf "$d"
        echo "removed  $d (${age}m old, ${sz}K)"
      done
      exit 0
  - name: reclaim-the-estate-s-own-stale-weight
    cmd: |
      # The estate's own home is 11.4G (measured 2026-10-28) and two of its parts are
      # regenerable by definition: the executor's per-job run records and the harness scratch
      # of runs that FINISHED. Age-gated and lsof-guarded: a live job is never touched.
      # The run record of a job that has FINISHED is a log of a past job, not the job: the
      # executor writes one .log/.pid/.exit per job and nothing ever read them again. The
      # estate produced 23913 of them in one day (measured 2026-10-28, 57M), which is the
      # estate's own weight growing under the floor that closes every door.
      #
      # The rule is age in MINUTES, not days, because the rate is the problem: a day of
      # records is a day of growth. A record is only removed when the job it belongs to has
      # an .exit file (the job finished) and that file is older than the age given, so a
      # RUNNING job's log, pid and exit are never touched. dry=1 reports and removes nothing.
      set -uo pipefail
      dry={{dry}}
      rm_age={{rm_age_min}}
      budget={{budget_s}}
      runs="$HOME/.estate/runs"
      if [ -d "$runs" ]; then
        list=$(mktemp "${TMPDIR:-/tmp}/runrec.XXXXXX" 2>/dev/null || echo)
        if [ -z "$list" ]; then echo "ok       no temp file for the run-record list"; exit 0; fi
        find "$runs" -maxdepth 1 -type f -name '*.exit' -mmin +"$rm_age" > "$list" 2>/dev/null
        n=0
        owed=0
        # BOUNDED BY TIME, like the estate's own cleaner (DELETE_S): the phase stops when
        # its budget is spent and says what is still owed, and the next run continues
        # where it stopped. An unbounded loop over 24000 run records took longer than the
        # door and was killed mid-pass on 2026-10-28, which is how a reclaim that frees
        # space ends up freeing none of it.
        deadline=$(( $(date +%s) + budget ))
        while IFS= read -r f; do
          if [ $((n % 100)) -eq 0 ] && [ "$(date +%s)" -ge "$deadline" ]; then
            owed=$((owed + 1))
            continue
          fi
          b="${f%.exit}"
          if [ "$dry" = "1" ]; then
            echo "would   $b"
          else
            rm -f "$b.exit" "$b.log" "$b.pid" 2>/dev/null
          fi
          n=$((n+1))
        done < "$list"
        rm -f "$list"
        if [ "$dry" = "1" ]; then
          echo "would remove $n finished run record(s) older than ${rm_age}m"
        else
          echo "removed  $n finished run record(s) older than ${rm_age}m"
        fi
        [ "$owed" -gt 0 ] && echo "owed     $owed more run record(s) than the ${budget}s budget reached; the next run continues"
        exit 0
      fi
      exit 0
  - name: reclaim-the-estate-s-finished-harness-jobs
    cmd: |
      # The harness scratch of a job that FINISHED (>=3 days old, lsof-clean, no lock file).
      # lsof +D recurses the whole tree and took minutes on a thrashing disk; +d lists the
      # directory's own open files, which is what decides "is this job still running".
      set -uo pipefail
      base="$HOME/.estate/harness/cc/jobs"
      [ -d "$base" ] || { echo "ok       no harness job scratch at $base"; exit 0; }
      now=$(date +%s)
      for d in "$base"/*/; do
        [ -d "$d" ] || continue
        age=$(( (now - $(stat -f %m "$d" 2>/dev/null || echo 0)) / 86400 ))
        [ "$age" -ge 3 ] || { echo "keep     $d (${age}d old, too recent)"; continue; }
        if lsof -nP +d "$d" 2>/dev/null | tail -n +2 | grep -q .; then
          echo "keep     $d (${age}d old, a process holds it open)"
          continue
        fi
        if find "$d" -maxdepth 2 -name '*.lock' -print -quit 2>/dev/null | grep -q .; then
          echo "keep     $d (${age}d old, a lock file is present)"
          continue
        fi
        rm -rf "$d"
        echo "removed  $d (${age}d old, finished)"
      done
      exit 0
  - name: reclaim-the-estate-s-own-logs-and-stale-transcripts
    cmd: |
      # (added 2026-10-28, second disk emergency: 1177M free, floor 1500M, every door closed)
      # The estate's own DERIVED weight, in three narrow rules. Nothing here is an agent's work,
      # a ledger, a database or a toolchain: logs, harness scratch caches, and session
      # transcripts from sessions that ended more than 14 days ago.
      #
      #   1. logs:  ~/.estate/*.log (and rotated *.log.1) untouched for a day, and ~/.estate/logs
      #      entries untouched for three days. A log is evidence of a past run, never the run.
      #   2. harness scratch: paste-cache, file-history, session-env, shell-snapshots untouched
      #      for three days. These are the harness's own caches, rebuilt on demand.
      #   3. transcripts: ~/.estate/harness/cc/projects/<project>/ untouched for 14 days. The
      #      session is over; the estate's durable memory is facts.jsonl, estate.db and the
      #      knowledge graph, none of which this touches.
      #
      # dry=1 reports the same set with its sizes and removes nothing.
      set -uo pipefail
      dry={{dry}}
      now=$(date +%s)
      freed=0
      n=0
      drop() { # path, age_days, why
        p="$1"; a="$2"; why="$3"
        [ -e "$p" ] || return 0
        sz=$(du -sk "$p" 2>/dev/null | awk '{print $1}')
        [ -n "${sz:-}" ] || sz=0
        n=$((n+1))
        freed=$((freed + sz))
        if [ "${sz:-0}" -ge 1024 ]; then
          if [ "$dry" = "1" ]; then
            echo "would   ${sz}K  $p (${a}d old, $why)"
          else
            rm -rf "$p" 2>/dev/null && echo "removed  ${sz}K  $p (${a}d old, $why)"
          fi
        fi
      }
      est="$HOME/.estate"
      # 1. logs
      for f in "$est"/*.log "$est"/*.log.1; do
        [ -f "$f" ] || continue
        age=$(( (now - $(stat -f %m "$f" 2>/dev/null || echo 0)) / 86400 ))
        [ "$age" -ge 1 ] || continue
        drop "$f" "$age" "a log older than a day"
      done
      for d in "$est"/logs/*; do
        [ -e "$d" ] || continue
        age=$(( (now - $(stat -f %m "$d" 2>/dev/null || echo 0)) / 86400 ))
        [ "$age" -ge 3 ] || continue
        drop "$d" "$age" "estate log older than 3d"
      done
      # 2. harness scratch caches
      for sub in paste-cache file-history session-env shell-snapshots; do
        for d in "$est/harness/cc/$sub"/*; do
          [ -e "$d" ] || continue
          age=$(( (now - $(stat -f %m "$d" 2>/dev/null || echo 0)) / 86400 ))
          [ "$age" -ge 3 ] || continue
          drop "$d" "$age" "harness $sub older than 3d"
        done
      done
      # 3. transcripts of sessions that ended
      for d in "$est/harness/cc/projects"/*/; do
        [ -d "$d" ] || continue
        age=$(( (now - $(stat -f %m "$d" 2>/dev/null || echo 0)) / 86400 ))
        [ "$age" -ge 14 ] || continue
        drop "${d%/}" "$age" "session transcript older than 14d"
      done
      echo "total    $n item(s), $((freed / 1024))M of derived weight (dry=$dry)"
      exit 0
  - name: reclaim-the-stale-dependency-tree
    cmd: |
      # (added 2026-10-28, third disk emergency: 1083M free, floor 1500M, every door closed)
      # ~/.estate/frontend/idp is a CLONE the estate keeps for its frontend service, and its
      # backstage/node_modules is a dependency tree -- regenerable by `yarn install`, and here it
      # is a MONTH old (2026-09-30) and stale against the app files of 2026-10-27. A dependency
      # tree is the same class as a toolchain cache: the estate's own cleaner already reclaims
      # old toolchains under pressure. Nothing else in that clone is touched: the app sources,
      # the catalog, the .git and the yarn.lock all stay.
      #
      # dry=1 reports the size and removes nothing.
      set -uo pipefail
      dry={{dry}}
      nm="$HOME/.estate/frontend/idp/backstage/node_modules"
      if [ ! -d "$nm" ]; then echo "ok       no stale dependency tree at $nm"; exit 0; fi
      age=$(( ($(date +%s) - $(stat -f %m "$nm" 2>/dev/null || echo 0)) / 86400 ))
      sz=$(du -sk "$nm" 2>/dev/null | awk '{print $1}')
      echo "dependency tree: $nm, ${sz}K, ${age}d old"
      if pgrep -f "rm -rf $nm" >/dev/null 2>&1; then
        echo "progress a removal of that tree is already running; nothing new was started"
        exit 0
      fi
      if [ "$age" -lt 7 ]; then echo "keep     it is younger than 7d"; exit 0; fi
      if [ "$dry" = "1" ]; then echo "would    remove the stale dependency tree (${sz}K)"; exit 0; fi
      nohup /bin/rm -rf "$nm" >/dev/null 2>&1 &
      echo "started  the removal in the background (pid $!) -- 2.3G of small files takes longer than this door's 95s budget; the next run of this intent reports whether it finished"
      exit 0
  - name: let-the-estates-own-cleaner-finish
    cmd: |
      # (added 2026-10-28) The estate's own cleaner is the sanctioned reclaim, but it is a multi-
      # phase job (caches, docker, worktrees, temp, clones, the critical tier) and the intent door
      # kills it at 95s mid-phase, so it prints NOTHING and the caller learns only that it was
      # killed. The script is the estate's, with the estate's rules (a claimed worktree is never
      # removed; uncommitted work is archived first; a toolchain the runtime names is kept), and it
      # takes a budget of its own. So it is started in the BACKGROUND with its own budget and its
      # output to a file, and a later run of this intent reports the pid. Nothing here decides
      # what to delete: that is the cleaner's job, and its log says what it did.
      pidf=/tmp/disk-cleanup-bg.pid
      outf=/tmp/disk-cleanup-bg.out
      if [ -f "$pidf" ] && kill -0 "$(cat "$pidf" 2>/dev/null)" 2>/dev/null; then
        echo "progress the estate's cleaner is already running (pid $(cat "$pidf"))"
        exit 0
      fi
      nohup bash "$HOME/.estate/libexec/disk-cleanup.sh" true False 0 true 600 >"$outf" 2>&1 &
      echo $! >"$pidf"
      echo "started  the estate's cleaner in the background (pid $(cat "$pidf")), 600s budget, log at $outf"
      exit 0
  - name: reclaim-the-build-cache
    cmd: |
      # Docker's BUILD CACHE and DANGLING images only. No volumes: a volume may hold the
      # estate's data (a local Postgres), and "regenerable" is a claim about a cache, not about
      # somebody's data. The estate's own cleaner prunes the same allow-list.
      export DOCKER_HOST="${DOCKER_HOST:-unix://$HOME/.rd/docker.sock}"
      if ! command -v docker >/dev/null 2>&1; then echo "ok       no docker cli"; exit 0; fi
      if ! docker info >/dev/null 2>&1; then echo "ok       the docker daemon is not answering"; exit 0; fi
      docker system df 2>/dev/null | head -6
      docker builder prune -af 2>&1 | tail -2
      docker image prune -f 2>&1 | tail -2
      exit 0
  - name: after
    cmd: |
      df -k /System/Volumes/Data | awk 'NR==2 {printf "free after: %dM on %s\n", $4/1024, $9}'
