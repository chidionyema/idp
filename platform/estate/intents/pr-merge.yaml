name: pr-merge
description: >
  Show a PR's state; with dry_run=false, queue it for merge with `gh pr merge --auto`, which
  merges only once every required check passes. Never --admin: that merges past the gates, and
  merge-when-green is the lane that lands PRs (AGENTS.md section 2).
args:
  pr:      {type: int,    default: 0}
  method:  {type: string, default: "squash", description: "squash|merge|rebase"}
  dry_run: {type: bool,   default: true}
  repo:    {type: string, default: "chidionyema/idp"}
steps:
  - name: show
    cmd: >
      gh pr view {{pr}} --repo {{repo}}
      --json number,title,state,isDraft,additions,deletions,changedFiles,mergeStateStatus
      --jq '"#\(.number) \(.title) | \(.state) draft=\(.isDraft) merge=\(.mergeStateStatus) +\(.additions)/-\(.deletions) \(.changedFiles) files"'
  - name: merge
    # plain shell, not {{if(...)}}: interpolate() only substitutes {{var}} (2026-09-26)
    cmd: >
      d={{dry_run}}; m={{method}};
      case "$m" in squash|merge|rebase) ;; *) echo "REFUSED method=$m"; exit 1;; esac;
      if [ "$d" = True ] || [ "$d" = true ]; then echo "DRY RUN -- dry_run=false queues it with --auto";
      else gh pr merge {{pr}} --repo {{repo}} --auto --"$m" 2>&1 | head -5; fi
