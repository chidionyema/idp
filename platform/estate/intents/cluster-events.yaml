name: cluster-events
description: >
  Composite intent. Warning events since timestamp. Default 1h.
args:
  since:     {type: string, default: "1h"}
  namespace: {type: string, default: ""}
  kubeconfig: {type: string, default: ""}
steps:
  - name: events
    cmd: |
      # `-n ""` is not a valid kubectl flag, so an empty namespace means every namespace.
      # `get events` no longer accepts --field-selector/--sort-by (kubectl routes it to the
      # `events` verb), so the Warning filter and the ordering happen here.
      # NO SHELL QUOTES AROUND A TEMPLATE: interpolate() already quotes the value, so `ns=''`
      # is an empty value (the 2026-10-18 shape that made site-onboard dead at every door).
      ns={{namespace}}
      if [ -n "$ns" ]; then nsflag="-n $ns"; else nsflag=-A; fi
      KUBECONFIG={{kubeconfig}} kubectl --request-timeout=30s \
        $nsflag get events -o json 2>/dev/null | python3 -c "
      import json, sys
      evs = [e for e in json.load(sys.stdin).get('items', []) if e.get('type') == 'Warning']
      evs.sort(key=lambda e: e.get('lastTimestamp') or '')
      print(f'{len(evs)} warning events:')
      for e in evs[-20:]:
          obj = e.get('involvedObject', {})
          msg = e.get('message', '')[:80]
          print(f\"  {e.get('lastTimestamp', '')} {obj.get('kind')}/{obj.get('name')} — {msg}\")
      "
