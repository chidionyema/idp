name: founder.decision
description: >
  Put ONE structured decision in front of the founder on the estate's Otto Telegram chat, and
  read the answer back in the same shape you asked in. This is the door for every agent that
  needs a human decision and must not guess: the founder answers with a comment on the
  decision message, in his own words, and the answer comes back typed -- an option key when
  he picked one, the whole comment verbatim when he did not.

  HOW IT WORKS. The founder receives exactly ONE message per decision, carrying the decision
  id, the question, the options and the links; he comments `dec-1a2b3c4d ship` (or any comment
  containing the id and a choice). The door matches deterministically: an exact option key
  (case-insensitive) or `approve`/`deny` picks that option; anything else is recorded
  VERBATIM as the answer with `option: null`. A comment that cannot be parsed is never
  silently coerced into an option and never dropped.

  FAIL CLOSED. No answer by the deadline is `state: expired` -- never "assumed yes". Asking
  twice with the same `--decision-id` never sends a second message.

  NO MODEL IN THE PATH. Delivery is one Bot API call and matching is a pure function, so a
  503 router cannot break this door.

  OUTPUT: one JSON object with `decision_id`, `state` (asked | answered | expired), `option`,
  `answer` (the founder's comment, verbatim), `answered_at`, `message_id`, and `bus` (skipped |
  open | answered | unavailable). The bus session is OPT-IN (`bus: "true"`): it is what puts
  the founder's comment into the estate's signed receipt chain, but a bus session makes the
  estate's card post a line message too, and the founder gets exactly ONE message per
  decision. With `bus` false the door's own message and the founder's comment are the record.

  TO READ A DECISION BACK: pass `decision_id` (the id the ask returned) and no question.

  WHY THE ARGUMENTS LOOK LIKE THIS (2026-10-30, issue #7537). The executor substitutes every
  argument into the step as a SHELL-QUOTED value, and an unset argument is substituted as the two
  characters `''`. So `[ -n "{{decision_id}}" ]` is TRUE for an unset argument -- it is the two
  characters inside the quotes, not an empty string. The previous template guarded its read-back
  branch with exactly that test, so EVERY ask was swallowed by the read-back branch and the door
  answered `no decision ''`; the ask path was unreachable and the door had never asked anything.
  Every argument that is branched on therefore carries an explicit sentinel default (`-`) and an
  absolute path default, and no branch tests for emptiness. A question that is absent is REFUSED
  loudly, never asked as an empty question.
args:
  question:    {type: string, default: "-", description: "The decision, in one sentence. '-' is absent and is refused."}
  options:     {type: string, default: "", description: "Up to 5 options, \"key: label, key2: label2\"."}
  context:     {type: string, default: "", description: "Up to 5 links (issue / PR / lane), comma separated."}
  deadline_min: {type: string, default: "60", description: "Minutes the founder has before the decision expires."}
  requester:   {type: string, default: "", description: "Who is asking, e.g. \"pi @ idp\"."}
  decision_id: {type: string, default: "-", description: "Read this decision back instead of asking a new one. '-' means ask."}
  wait:        {type: string, default: "0", description: "Seconds to wait for the founder's answer (0 = return the id at once)."}
  take_webhook: {type: string, default: "false", description: "true: hold the bot's updates while this decision is live (only when the estate's own reader is unreachable)."}
  bus: {type: string, default: "false", description: "true: also open a bus session for the decision (the estate's card then posts a line message as well)."}
  repo:        {type: string, default: "/Users/roseonyema/Documents/code/idp", description: "Repo the sovereign bus session runs in (absolute: a tilde is not expanded inside the quoted substitution)."}
  tool_repo:   {type: string, default: "/Users/roseonyema/.estate/runtime/idp", description: "Checkout that carries bin/founder-decision; the estate runtime is always on main."}
  state:       {type: string, default: "/Users/roseonyema/.estate/sovereign/decisions.json", description: "Path of the decision state file."}
# One Bot API call plus a bounded wait: the wait is the caller's choice and the executor's
# own ceiling bounds it. Silence inside that window is `expired`, never a yes.
door_s: 95
halt_on_failure: false
steps:
  - name: decision
    cmd: |
      set -euo pipefail
      TOOL="{{tool_repo}}/bin/founder-decision"
      if [ ! -f "$TOOL" ]; then
        echo "founder.decision: no bin/founder-decision at $TOOL" >&2
        exit 2
      fi
      # `--repo` and `--state` are GLOBAL options: argparse accepts them only BEFORE the
      # verb. Putting `--state` after the verb is "unrecognized arguments" and the door dies
      # before it asks anything. (Found 2026-10-30, the day the ask path was repaired.)
      # HOW THE PLACEHOLDERS ARE WRITTEN (2026-10-30, issue #7537). The executor's
      # interpolate() applies shlex.quote() to every placeholder, so the substituted text is
      # ALREADY a shell-safe token. Two consequences, both learned the hard way:
      #   1. A second pair of quotes around it ("{{question}}") hands the command the literal
      #      quote characters as part of the value, and around an EMPTY default it hands the
      #      two characters '' instead of an empty argument.
      #   2. `[ {{decision_id}} != "-" ]` is not a comparison at all: the bare '-' is a bash
      #      error, so the branch always falls through.
      # So: every placeholder is UNQUOTED here (shlex.quote has already made it safe), and
      # every branch reads a VARIABLE assigned from it -- a plain assignment does not word
      # split, so the value survives intact.
      GLOBAL=(--repo {{repo}} --state {{state}})
      DECISION_ID={{decision_id}}
      QUESTION={{question}}
      WAIT={{wait}}
      TAKE_WEBHOOK={{take_webhook}}
      BUS={{bus}}
      if [ "$DECISION_ID" != "-" ]; then
        python3 "$TOOL" "${GLOBAL[@]}" show --decision-id "$DECISION_ID"
        exit 0
      fi
      if [ "$QUESTION" = "-" ]; then
        echo "founder.decision: question is required; refusing to ask an empty question" >&2
        exit 2
      fi
      args=(ask --question "$QUESTION" --options {{options}} --context {{context}})
      args+=(--deadline-min {{deadline_min}} --requester {{requester}})
      if [ "$WAIT" != "0" ]; then args+=(--wait "$WAIT"); fi
      if [ "$TAKE_WEBHOOK" = "true" ]; then args+=(--take-webhook); fi
      if [ "$BUS" = "true" ]; then args+=(--bus); fi
      python3 "$TOOL" "${GLOBAL[@]}" "${args[@]}"
