name: shell.parse
description: >
  Authoritative shell script parser. Uses shellcheck -f json for real parse errors.
  Returns exact line numbers and error types — not a guess.
  No LLM needed. No model needed.
args:
  file: { type: string, help: "Path to shell script to parse" }
tools: []
halt_on_failure: false
steps:
  - cmd: >
      shellcheck -f json {{file}} 2>/dev/null || echo "[]"
