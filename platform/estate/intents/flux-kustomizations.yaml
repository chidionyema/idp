name: flux-kustomizations
description: >
  Composite intent. List Flux Kustomizations and their status.
args:
  namespace: {type: string, default: "flux-system"}
  kubeconfig: {type: string, default: ""}
steps:
  - name: kustomizations
    intent: kubectl-list
    args:
      resource: kustomizations
      namespace: "{{namespace}}"
      output: json
  - name: summary
    cmd: |
      python3 -c "
      import json, sys
      try:
          items = json.load(sys.stdin).get('items', [])
          first_ready = sum(
              1
              for k in items
              if (k.get('status') or {}).get('conditions', [{}])[0].get('type') == 'Ready'
          )
          print(f'{len(items)} Kustomizations | Ready: {first_ready}')
          for k in items:
              conds = (k.get('status') or {}).get('conditions', [])
              ready = any(
                  c.get('type') == 'Ready' and c.get('status') == 'True' for c in conds
              )
              label = 'READY' if ready else 'NOT-READY'
              print(f\"  {k['metadata'].get('namespace')}/{k['metadata']['name']} {label}\")
      except Exception as e:
          print(f'flux not installed or no kustomizations: {e}')
      "
