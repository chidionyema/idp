name: voice-doctor
description: Measure the laptop voice path. Cloud placement requires current runtime evidence.
args:
  scope: {type: string, default: "laptop"}
steps:
  - name: diagnose
    cmd: |
      case {{scope}} in
        laptop|all) python3 ~/.estate/libexec/voice-doctor.py --laptop-only ;;
        *) printf '%s\n' 'Unsupported voice scope. Use the current infrastructure authority.' >&2; exit 78 ;;
      esac
