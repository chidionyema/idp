name: repo-export
description: >
  Pack the estate's own code into ONE file sized for another model's context window, so the
  founder can hand the estate's code to Gemini, Argon or any other model directly -- without
  copying file by file or pasting a stale snapshot. First-class because that handoff is how the
  estate gets reviewed from outside itself: one command (`estate_invoke repo-export`), not a
  laptop-only script someone has to remember exists.

  Measured on 2026-10-31 (4-core laptop, load average 600): the old path -- `npx -y
  repomix@1.18.1` over the working tree -- needed the network the door closes, crawled 2.9 GB
  of ignored trees and took 167 s, over the door's 100 s ceiling. This intent calls a local
  libexec packer instead: repomix 1.18.1 is pinned and installed by bin/idp-install-deps into
  ~/.cache/estate-tools/, the file list comes from `git ls-files` (tracked content only, never
  the working tree), and the packer carries its own time budget -- a timed-out attempt is
  treated as a measurement and the retry packs half the list, so the door is met whatever the
  machine's load does.

  The default scope is the estate's CORE (platform/estate, sovereign, mcp, cmd, greenlane): the
  whole tree compresses to ~17.7 MB (~4.4M tokens), which no model's context window holds, and
  costs 110 s on this machine. A pack nobody's model can read is not an export. Widen it with
  path=..., and the token budget refuses a pack that would not fit the window instead of
  producing one that is useless.

  Every pack ships a manifest beside it -- every path included with its sha256, every path
  excluded with the reason, the pack's own sha256, the git HEAD, the measured seconds. An
  export nobody can account for is not traceable. Reads the filesystem and writes one output
  file plus its manifest; touches nothing else the estate owns, so this is a read, not a
  mutation.
class: read
args:
  path:
    type: string
    default: "platform/estate,sovereign,mcp,cmd,greenlane"
    help: "Comma-separated tracked paths to pack, relative to the repo root"
  output:
    type: string
    default: "/tmp/repo-export/pack.xml"
    help: "Where to write the packed file"
  format:
    type: string
    default: "xml"
    help: "xml | markdown | plain"
  compress:
    type: string
    default: "true"
    help: "true|false -- tree-sitter compression: keep signatures, strip bodies, so more repo fits the same token budget"
  include:
    type: string
    default: ""
    help: "Comma-separated glob to include on top of the scope (e.g. platform/llm/**)"
  ignore:
    type: string
    default: ""
    help: "Comma-separated glob to additionally exclude"
  max_file_bytes:
    type: int
    default: 65536
    help: "Files larger than this are excluded and named in the manifest"
  token_budget:
    type: int
    default: 1000000
    help: "Refuse a pack that would not fit the target model's context window (0 disables)"
  budget_s:
    type: int
    default: 80
    help: "The packer's own time budget, inside the door's 100s ceiling"
  attempt_s:
    type: int
    default: 45
    help: "Seconds per repomix attempt; a timeout retries with half the file list"
  repo:
    type: string
    default: ""
    help: "Repo root to pack; empty means the checkout the caller stands in, else ~/.estate/runtime/idp"
tools: []
door_s: 100
halt_on_failure: true
steps:
  - name: pack
    cmd: |
      set -euo pipefail
      mkdir -p "$(dirname {{output}})"
      python3 ~/.estate/libexec/repo_export.py \
        path={{path}} \
        output={{output}} \
        format={{format}} \
        compress={{compress}} \
        include={{include}} \
        ignore={{ignore}} \
        max_file_bytes={{max_file_bytes}} \
        token_budget={{token_budget}} \
        budget_s={{budget_s}} \
        attempt_s={{attempt_s}} \
        repo={{repo}}
  - name: verdict
    cmd: |
      set -euo pipefail
      if [ ! -s {{output}} ]; then
        echo "verdict: repo-export produced no pack at {{output}}"
        exit 1
      fi
      bytes=$(wc -c < {{output}} | tr -d ' ')
      echo "verdict: packed ${bytes} bytes to {{output}} -- hand this one file to the other model's context window"
