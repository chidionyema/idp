name: lane-submit
description: >
  Hand the current branch to the Greenlane and wait for its verdict. This is how work reaches
  main on this estate: never `gh pr create`, never a push to main. The lane proves the branch
  green on top of the current main, raises the pull request itself and lands it in the same
  move; a red or conflicting lane keeps its branch and carries the reason here.
args:
  lane:    {type: string, default: "", description: "lane name; default lane/<current branch>"}
  wait:    {type: int, default: 1800, description: "seconds to wait for a verdict before giving up"}
  cwd:     {type: string, default: "."}
halt_on_failure: true
steps:
  - name: the claim covers the change
    # 2026-10-08, PR #5511: the claim missed three files the lane touched, and claim-gate said so
    # one CI round (~15 min) after the push, twice. The same gate, run here, says it in seconds.
    timeout: 120
    cmd: |
      cd {{cwd}} || exit 2
      git fetch -q origin main || { echo "BLIND   lane-submit  cannot fetch origin/main to judge the claim" >&2; exit 2; }
      [ -x bin/claim-gate ] || { echo "BLIND   lane-submit  no bin/claim-gate in this checkout" >&2; exit 2; }
      GITHUB_REPOSITORY=$(gh repo view --json nameWithOwner -q .nameWithOwner) \
        bin/claim-gate "$(git merge-base origin/main HEAD)" HEAD
  - name: push the lane
    timeout: 300
    cmd: |
      cd {{cwd}} || exit 2
      b=$(git rev-parse --abbrev-ref HEAD); lane={{lane}}; lane=${lane:-lane/$b}
      out=$(git push -q origin "HEAD:refs/heads/$lane" 2>&1); rc=$?
      if [ $rc -eq 0 ]; then
        echo "ok      lane-submit  $lane = $(git rev-parse --short HEAD)"
      elif printf '%s' "$out" | grep -qiE 'non-fast-forward|fetch first|stale info'; then
        # the engine (greenlane/github.py land()) force-pushes a rebased commit onto the
        # lane's own ref before merging, then deletes it only after a successful merge; if a
        # merge failed in between, or another session pushed this lane name, the remote ref
        # has moved underneath this branch and a plain push is correctly rejected here.
        echo "REJECTED lane-submit  $lane moved on origin since this branch was built (non-fast-forward) - fetch/rebase onto origin/$lane, or resubmit under a new lane name: $out" >&2
        exit 1
      else
        echo "FAIL    lane-submit  push to $lane failed: $out" >&2
        exit $rc
      fi
  - name: wait for the verdict
    # above the `wait` default (1800); estate-execute reads timeout raw, so {{wait}} cannot go here
    timeout: 1900
    cmd: |
      cd {{cwd}} || exit 2
      b=$(git rev-parse --abbrev-ref HEAD); lane={{lane}}; lane=${lane:-lane/$b}
      sha=$(git rev-parse HEAD); repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
      end=$(( $(date +%s) + {{wait}} )); s=""
      # the verdict is the `greenlane` commit status on this sha, written by the engine
      while [ "$(date +%s)" -lt "$end" ]; do
        s=$(gh api "repos/$repo/commits/$sha/status" --jq '.statuses[] | select(.context=="greenlane") | .state + " " + .description' 2>/dev/null | head -1)
        case "$s" in
          success*) echo "ok      lane-submit  landed: $s"; exit 0 ;;
          failure*) echo "RED     lane-submit  $s"; exit 1 ;;
        esac
        sleep 30
      done
      echo "BLIND   lane-submit  no verdict for $lane in {{wait}}s (last: ${s:-none}); the lane keeps the branch"; exit 2
