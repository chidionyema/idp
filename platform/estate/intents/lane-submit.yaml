name: lane-submit
description: >
  Hand the current branch to the Greenlane. This is how work reaches main on this estate: never
  `gh pr create`, never a push to main. The lane proves the branch green on top of the current
  main, raises the pull request itself and lands it in the same move; a red or conflicting lane
  keeps its branch and carries the reason on its head commit's `greenlane` status.

  Bounded on purpose (2026-10-12). This intent used to end in a step that blocked up to 1900s for
  that status. No door an agent invokes it through can run such a step -- the harness door kills
  a job at 60s and the MCP door defaults to 55s (mcp/plugins/estate_mcp.py) -- so it declared
  120+300+1900 = 2320s of steps inside a 55s door. Measured: the command was SIGTERMed at the
  ceiling with the push still in flight (`exit 124`), and the lane ref landed on origin a moment
  later -- so the caller was told nothing while the work had in fact been handed over. Handing
  over the branch is the whole job and it converges on its own (AGENTS.md §2); the verdict is an
  observation, not a wait. Read it from the commit status on the head sha: `gh api
  repos/<owner>/<repo>/commits/<sha>/status` answers `pending` the moment the lane picks the branch
  up and then success or failure -- which is the exact command the last step prints for you.

  It needs a 170s door, not 55 (measured 2026-10-12: `git fetch` + claim-gate 5.8-8.4s, the
  pre-push guard 32s of its own accord -- `timing 32s total; slowest rungs: 19s tsc backstage,
  12s ruff` -- plus the push itself, 37.4s once and past 40s the next time). That is 45-55s of
  unavoidable work whose variance crosses 60, which is why the shadow policy records 164 of 192
  runs not ok in 30d, p_fail 0.85: it is not a slow verb, it is a verb offered a door too small
  for it. So run it through a door that fits -- `estate_invoke lane-submit timeout=100` (the
  executor's ceiling; nothing larger exists), or the session plane. A door smaller than the intent's
  `door_s` kills it mid-push and tells you nothing.

  2026-10-22: the door was only half of it. This intent declared a door larger than the default
  while its own push step was capped at 60, so a caller passing a bigger timeout changed nothing --
  the step died at 60036ms (exit 124) and `git ls-remote` showed the lane ref ABSENT, which is
  worse than #5814 (where the push outlived the kill): a killed push that did not land, reported as
  a timeout, and the bound-inside-the-step that exists to prevent it never reached. The identical
  push through the executor door took 16.4s.

  2026-10-25: `door_s: 170` was itself a fiction. Nothing in this estate may run a command for
  longer than the executor's ceiling (100s, mcp/plugins/estate_executor.py), so 170 was never
  granted and the two steps totalling 170 were spent against 100. Both the declaration and the
  budget now fit the door (40 + 50 = 90 inside 100), and the push is no longer bounded by a guess
  about a duration: it runs in the background and the step bounds only its own observation of the
  remote ref (measured this turn: the same push with its pre-push guard took 98s, so the 80s inner
  bound that used to be here reported the lane ABSENT while it was still landing).
args:
  lane:    {type: string, default: "", description: "lane name; default lane/<current branch>"}
  cwd:     {type: string, default: "."}
# the door this intent needs, so a caller can be told instead of guessing (and so the test below
# can refuse a step that outlives the door it is run through). It is the executor's ceiling, not a
# larger number: see 2026-10-25 in the description.
door_s: 100
halt_on_failure: true
steps:
    # Step bound removed 2026-10-25: time is declared once, as this intent's budget
    # (docs/decisions/0043-the-bound-lives-at-the-door.md). A number here could only be a
    # guess about someone else's work, and where it fired it invented a failure.
  - name: the claim covers the change
    # 2026-10-08, PR #5511: the claim missed three files the lane touched, and claim-gate said so
    # one CI round (~15 min) after the push, twice. The same gate, run here, says it in seconds.
    # Measured 2026-10-12: 5.8s and 8.4s on two runs, and a 10s cap timed out inside `git fetch`.
    #
    # 2026-10-23: the cap was still 20s when GitHub got slower, and the step could no longer
    # finish. Measured on this machine, same commands, same minute: `git fetch -q origin main`
    # 3.5s, `gh repo view` 1.0s, `bin/claim-gate` 26.1s -- 30.6s of work inside a 20s cap, so
    # the step was killed three times in a row (exit 124, `TIMEOUT (20s)`) before it ever
    # reached the push. The estate's own shadow policy agrees: 325 of 511 lane-submit runs in
    # 30d were not ok (p_fail 0.64). The cap is now 40s -- the measured work plus room for a slow
    # API, and inside the door's 100 with the push step's 50 (tests/test_lane_submit_fits_the_door.py).
    #
    # A step cap is legal here and nowhere else: this one SPLITS the budget between two sequential
    # jobs (40 + 50 = 90 inside 100), so it cannot contradict the door. It is not a guess about how
    # long the work takes; where such a guess used to live -- inside the push command, as
    # `timeout 80` -- it has been deleted (2026-10-25, bin/timeout-budget).
    timeout: 40
    cmd: |
      cd {{cwd}} || exit 2
      git fetch -q origin main || { echo "BLIND   lane-submit  cannot fetch origin/main to judge the claim" >&2; exit 2; }
      [ -x bin/claim-gate ] || { echo "BLIND   lane-submit  no bin/claim-gate in this checkout" >&2; exit 2; }
      # The repository's name is in this checkout's OWN remote. Asking GitHub for it cost 9.5s on
      # a slow link (measured 2026-10-27), and this step's 40s is 28s of claim-gate plus that
      # call: the API was the difference between fitting the door and being killed by it. The
      # remote is local and answers the same question.
      repo=$(git config --get remote.origin.url | python3 -c 'import re,sys; u=sys.stdin.read().strip(); m=re.search(r"[:/]([^/:]+/[^/:]+?)(?:\.git)?$", u); print(m.group(1) if m else "")')
      GITHUB_REPOSITORY="${repo:-chidionyema/idp}" \
        bin/claim-gate "$(git merge-base origin/main HEAD)" HEAD
  - name: push the lane
    # 2026-10-12 (#5814): guard + push costs ~35s on a quiet laptop and crossed the 60s cap with
    # ~10 agents live -- `estate_invoke lane-submit` answered TIMEOUT exit 124 while the lane ref
    # landed on origin anyway, so a caller could not tell a handed-over branch from nothing
    # happening at all. 60s was the estate's own ceiling then; it is 100s now, and read from
    # mcp/plugins/estate_executor.py rather than from this comment.
    #
    # THE INNER BOUND IS GONE (2026-10-25). It was tried twice as a guess about a duration: 50s
    # inside a 60s step, then 80s inside this 100s step. Both times the network was slower than the
    # guess and the step reported the lane ABSENT while the push was still in flight -- measured
    # this turn, the same push with its pre-push guard took 98s. A guessed bound can only be wrong
    # in the direction that produces a false failure, which is why the guess is replaced by a
    # mechanism: the push runs in the BACKGROUND, and what this step bounds is its own OBSERVATION
    # of the remote ref. A bound on the measurement cannot truncate the work.
    timeout: 50
    cmd: |
      cd {{cwd}} || exit 2
      b=$(git rev-parse --abbrev-ref HEAD); lane={{lane}}; [ -n "$lane" ] || lane="$b"
      # 2026-10-11: a lane branch is already named lane/<name>, so the old `${lane:-lane/$b}`
      # pushed lane/lane/<name> whenever --lane was omitted. Measured on this very change:
      # branch lane/front-door-identity-row pushed as lane/lane/front-door-identity-row, which
      # the engine then queued as a second lane of the same commit. Prepend only when the
      # prefix is missing (#5756). The fix belongs here, in the file estate-runtime-sync reads:
      # patching ~/.estate/intents/lane-submit.yaml alone is reverted by the next sync.
      case "$lane" in lane/*) ;; *) lane="lane/$lane" ;; esac
      sha=$(git rev-parse HEAD)
      pushlog=$(mktemp -t lane-submit-push.XXXXXX)
      # THE PUSH MUST OUTLIVE THIS STEP (2026-10-27). Measured twice today: the step was
      # SIGTERMed at its 50s ceiling while the push was still running, and the push DIED WITH IT
      # -- the lane ref never landed. That is the opposite of what this step has claimed since
      # #5814 ("the push is not killed with it"). The push is now started in its OWN SESSION, so
      # nothing that kills the step -- the step's own ceiling, the door's ceiling, the agent's
      # session -- can reach the handover. `execvp` keeps the SAME pid for git, so the step's
      # `wait` still reads git's own exit code.
      python3 -c 'import os,sys
      try: os.setsid()
      except OSError: os.setpgrp()
      os.execvp("git",["git","push","-q","origin",sys.argv[1]])' "HEAD:refs/heads/$lane" >"$pushlog" 2>&1 &
      push_pid=$!
      # Is the push still running? `kill -0` cannot tell: a finished child that has not been
      # waited for is a ZOMBIE, and kill -0 succeeds on a zombie -- so a poll on it would spin
      # for the whole window on a push that had already finished. `ps -o stat=` can: a dead
      # process is gone (no stat) or a zombie (stat starts with Z).
      push_alive() {
        st=$(ps -p "$push_pid" -o stat= 2>/dev/null | tr -d '[:space:]')
        [ -n "$st" ] || return 1
        case "$st" in Z*) return 1 ;; esac
        return 0
      }
      # The observation window. It bounds the READING, never the push -- and it must FIT inside this
      # step, or the window itself becomes the fourth guessed bound. Measured 2026-10-25: 15 polls at
      # 2s plus the ls-remote round trips each one makes spent the whole 50s cap and the step was
      # killed (exit 124). Measured 2026-10-27: eight ls-remote round trips cost ~5s EACH on a slow
      # link -- 40s of NETWORK inside a 50s step, which is what killed it, twice. The window now
      # watches the push's OWN process (a local question, free) and the remote ref is read ONCE, at
      # the end. A push still running when the window ends is reported as IN-FLIGHT, which is the
      # truth, and the greenlane status named below is the verdict.
      polls=0
      while [ "$polls" -lt 18 ]; do
        polls=$((polls + 1))
        push_alive || break
        sleep 2
      done
      on=$(git ls-remote --heads origin "$lane" 2>/dev/null | awk '{print $1}')
      repo=$(git config --get remote.origin.url | python3 -c 'import re,sys; u=sys.stdin.read().strip(); m=re.search(r"[:/]([^/:]+/[^/:]+?)(?:\.git)?$", u); print(m.group(1) if m else "")')
      repo="${repo:-chidionyema/idp}"
      verdict() {
        echo "        verdict: gh api repos/$repo/commits/$sha/status --jq '.statuses[]|select(.context==\"greenlane\")|.state+\" \"+.description'"
        echo "        that is the whole observation - the lane proves this branch on top of the current main, then lands it"
      }
      if [ "$on" = "$sha" ]; then
        wait "$push_pid" 2>/dev/null || true
        echo "ok      lane-submit  $lane = $(git rev-parse --short HEAD) on origin"
        verdict
        exit 0
      fi
      if push_alive; then
        # STILL RUNNING IS NOT FAILED. The handover has not happened yet and this step cannot say
        # it has; it also cannot say it has not, and that difference is the whole defect this file
        # has been fixing since #5814. Name the state, name the pid, name how to read the outcome.
        echo "IN-FLIGHT lane-submit  $lane: the push (pid $push_pid) is still running after ${polls} observations; it reaches origin on its own once it completes" >&2
        # The push's own output is where its verdict lands: the pre-push guard's refusal, or the
        # network's error. Measured 2026-10-27: a push refused by the fast gate exits 0 from this
        # step's point of view and fails a minute later, and the agent that has to read the log
        # by hand should not have to guess which file it is.
        echo "        push log: $pushlog" >&2
        verdict
        exit 0
      fi
      wait "$push_pid" 2>/dev/null; rc=$?
      out=$(cat "$pushlog")
      # A push that exited 0 can still be ahead of what origin's ref endpoint shows; re-read before
      # concluding anything. This is a re-read of the MEASUREMENT, not a wait on the work -- two
      # reads, because each one costs ~5s of the step's 50 on a slow link (2026-10-27).
      i=0
      while [ "$i" -lt 2 ]; do
        on=$(git ls-remote --heads origin "$lane" 2>/dev/null | awk '{print $1}')
        [ "$on" = "$sha" ] && break
        i=$((i + 1)); sleep 1
      done
      if [ "$on" = "$sha" ]; then
        # The push exited non-zero and the ref is there anyway: report the measurement, not the code.
        echo "ok      lane-submit  $lane = $(git rev-parse --short HEAD) on origin"
        verdict
        exit 0
      fi
      if [ "$rc" -eq 0 ]; then
        # git says it sent it; origin's ref does not say so yet. Neither "landed" nor "failed" is a
        # fact here, so say the fact.
        echo "SENT    lane-submit  $lane: push exited 0, origin has not shown the ref after $((polls + i)) observations" >&2
        verdict
        exit 0
      fi
      if printf '%s' "$out" | grep -qiE 'non-fast-forward|fetch first|stale info'; then
        # the engine (greenlane/github.py land()) force-pushes a rebased commit onto the
        # lane's own ref before merging, then deletes it only after a successful merge; if a
        # merge failed in between, or another session pushed this lane name, the remote ref
        # has moved underneath this branch and a plain push is correctly rejected here.
        echo "REJECTED lane-submit  $lane moved on origin since this branch was built (non-fast-forward) - fetch/rebase onto origin/$lane, or resubmit under a new lane name: $out" >&2
        exit 1
      fi
      rc=${rc:-1}; [ "$rc" -ne 0 ] || rc=1
      echo "FAIL    lane-submit  $lane on origin is '${on:-absent}', not $sha (push rc=$rc): $out" >&2
      exit "$rc"
