name: lane-submit
description: >
  Hand the current branch to the Greenlane. This is how work reaches main on this estate: never
  `gh pr create`, never a push to main. The lane proves the branch green on top of the current
  main, raises the pull request itself and lands it in the same move; a red or conflicting lane
  keeps its branch and carries the reason on its head commit's `greenlane` status.

  Bounded on purpose (2026-10-12). This intent used to end in a step that blocked up to 1900s for
  that status. No door an agent invokes it through can run such a step -- the harness door kills
  a job at 60s and the MCP door defaults to 55s (mcp/plugins/estate_mcp.py) -- so it declared
  120+300+1900 = 2320s of steps inside a 55s door. Measured: the command was SIGTERMed at the
  ceiling with the push still in flight (`exit 124`), and the lane ref landed on origin a moment
  later -- so the caller was told nothing while the work had in fact been handed over. Handing
  over the branch is the whole job and it converges on its own (AGENTS.md §2); the verdict is an
  observation, not a wait. Read it from the commit status on the head sha: `gh api
  repos/<owner>/<repo>/commits/<sha>/status` answers `pending` the moment the lane picks the branch
  up and then success or failure -- which is the exact command the last step prints for you.

  It needs a 170s door, not 55 (measured 2026-10-12: `git fetch` + claim-gate 5.8-8.4s, the
  pre-push guard 32s of its own accord -- `timing 32s total; slowest rungs: 19s tsc backstage,
  12s ruff` -- plus the push itself, 37.4s once and past 40s the next time). That is 45-55s of
  unavoidable work whose variance crosses 60, which is why the shadow policy records 164 of 192
  runs not ok in 30d, p_fail 0.85: it is not a slow verb, it is a verb offered a door too small
  for it. So run it through a door that fits -- `estate_invoke lane-submit timeout=100` (the
  executor's ceiling; nothing larger exists), or the session plane. A door smaller than the intent's
  `door_s` kills it mid-push and tells you nothing.

  2026-10-22: the door was only half of it. This intent declared a door larger than the default
  while its own push step was capped at 60, so a caller passing a bigger timeout changed nothing --
  the step died at 60036ms (exit 124) and `git ls-remote` showed the lane ref ABSENT, which is
  worse than #5814 (where the push outlived the kill): a killed push that did not land, reported as
  a timeout, and the bound-inside-the-step that exists to prevent it never reached. The identical
  push through the executor door took 16.4s.

  2026-10-25: `door_s: 170` was itself a fiction. Nothing in this estate may run a command for
  longer than the executor's ceiling (100s, mcp/plugins/estate_executor.py), so 170 was never
  granted and the two steps totalling 170 were spent against 100. Both the declaration and the
  budget now fit the door (40 + 50 = 90 inside 100), and the push is no longer bounded by a guess
  about a duration: it runs in the background and the step bounds only its own observation of the
  remote ref (measured this turn: the same push with its pre-push guard took 98s, so the 80s inner
  bound that used to be here reported the lane ABSENT while it was still landing).
args:
  lane:    {type: string, default: "", description: "lane name; default lane/<current branch>"}
  cwd:     {type: string, default: "."}
# the door this intent needs, so a caller can be told instead of guessing (and so the test below
# can refuse a step that outlives the door it is run through). It is the executor's ceiling, not a
# larger number: see 2026-10-25 in the description.
door_s: 100
halt_on_failure: true
steps:
    # Step bound removed 2026-10-25: time is declared once, as this intent's budget
    # (docs/decisions/0043-the-bound-lives-at-the-door.md). A number here could only be a
    # guess about someone else's work, and where it fired it invented a failure.
  - name: the claim covers the change
    # 2026-10-08, PR #5511: the claim missed three files the lane touched, and claim-gate said so
    # one CI round (~15 min) after the push, twice. The same gate, run here, says it in seconds.
    # Measured 2026-10-12: 5.8s and 8.4s on two runs, and a 10s cap timed out inside `git fetch`.
    #
    # 2026-10-23: the cap was still 20s when GitHub got slower, and the step could no longer
    # finish. Measured on this machine, same commands, same minute: `git fetch -q origin main`
    # 3.5s, `gh repo view` 1.0s, `bin/claim-gate` 26.1s -- 30.6s of work inside a 20s cap, so
    # the step was killed three times in a row (exit 124, `TIMEOUT (20s)`) before it ever
    # reached the push. The estate's own shadow policy agrees: 325 of 511 lane-submit runs in
    # 30d were not ok (p_fail 0.64). The cap is now 40s -- the measured work plus room for a slow
    # API, and inside the door's 100 with the push step's 50 (tests/test_lane_submit_fits_the_door.py).
    #
    # A step cap is legal here and nowhere else: this one SPLITS the budget between two sequential
    # jobs (40 + 50 = 90 inside 100), so it cannot contradict the door. It is not a guess about how
    # long the work takes; where such a guess used to live -- inside the push command, as
    # `timeout 80` -- it has been deleted (2026-10-25, bin/timeout-budget).
    timeout: 40
    cmd: |
      cd {{cwd}} || exit 2
      git fetch -q origin main || { echo "BLIND   lane-submit  cannot fetch origin/main to judge the claim" >&2; exit 2; }
      [ -x bin/claim-gate ] || { echo "BLIND   lane-submit  no bin/claim-gate in this checkout" >&2; exit 2; }
      # The repository's name is in this checkout's OWN remote. Asking GitHub for it cost 9.5s on
      # a slow link (measured 2026-10-27), and this step's 40s is 28s of claim-gate plus that
      # call: the API was the difference between fitting the door and being killed by it. The
      # remote is local and answers the same question.
      repo=$(git config --get remote.origin.url | python3 -c 'import re,sys; u=sys.stdin.read().strip(); m=re.search(r"[:/]([^/:]+/[^/:]+?)(?:\.git)?$", u); print(m.group(1) if m else "")')
      GITHUB_REPOSITORY="${repo:-chidionyema/idp}" \
        bin/claim-gate "$(git merge-base origin/main HEAD)" HEAD
  - name: push the lane
    timeout: 50
    cmd: |
      cd {{cwd}} || exit 2
      python3 bin/lane-submit-handover --lane={{lane}}
