name: lane-submit
description: >
  Hand the current branch to the Greenlane. This is how work reaches main on this estate: never
  `gh pr create`, never a push to main. The lane proves the branch green on top of the current
  main, raises the pull request itself and lands it in the same move; a red or conflicting lane
  keeps its branch and carries the reason on its head commit's `greenlane` status.

  Bounded on purpose (2026-10-12). This intent used to end in a step that blocked up to 1900s for
  that status. No door an agent invokes it through can run such a step -- the harness door kills
  a job at 60s and the MCP door defaults to 55s (mcp/plugins/estate_mcp.py) -- so it declared
  120+300+1900 = 2320s of steps inside a 55s door. Measured: the command was SIGTERMed at the
  ceiling with the push still in flight (`exit 124`), and the lane ref landed on origin a moment
  later -- so the caller was told nothing while the work had in fact been handed over. Handing
  over the branch is the whole job and it converges on its own (AGENTS.md §2); the verdict is an
  observation, not a wait. Read it from the commit status on the head sha: `gh api
  repos/<owner>/<repo>/commits/<sha>/status` answers `pending` the moment the lane picks the branch
  up and then success or failure -- which is the exact command the last step prints for you.

  It needs a 120s door, not 55 (measured 2026-10-12: `git fetch` + claim-gate 5.8-8.4s, the
  pre-push guard 32s of its own accord -- `timing 32s total; slowest rungs: 19s tsc backstage,
  12s ruff` -- plus the push itself, 37.4s once and past 40s the next time). That is 45-55s of
  unavoidable work whose variance crosses 60, which is why the shadow policy records 164 of 192
  runs not ok in 30d, p_fail 0.85: it is not a slow verb, it is a verb offered a door too small
  for it. So run it through a door that fits -- `estate_invoke lane-submit timeout=120`, or the
  session plane. The default MCP door (55s) and the harness door (60s) kill it mid-push and tell
  you nothing.
args:
  lane:    {type: string, default: "", description: "lane name; default lane/<current branch>"}
  cwd:     {type: string, default: "."}
# the door this intent needs, so a caller can be told instead of guessing (and so the test below
# can refuse a step that outlives the door it is run through).
door_s: 120
halt_on_failure: true
steps:
  - name: the claim covers the change
    # 2026-10-08, PR #5511: the claim missed three files the lane touched, and claim-gate said so
    # one CI round (~15 min) after the push, twice. The same gate, run here, says it in seconds.
    # Measured 2026-10-12: 5.8s and 8.4s on two runs, and a 10s cap timed out inside `git fetch`.
    timeout: 20
    cmd: |
      cd {{cwd}} || exit 2
      git fetch -q origin main || { echo "BLIND   lane-submit  cannot fetch origin/main to judge the claim" >&2; exit 2; }
      [ -x bin/claim-gate ] || { echo "BLIND   lane-submit  no bin/claim-gate in this checkout" >&2; exit 2; }
      GITHUB_REPOSITORY=$(gh repo view --json nameWithOwner -q .nameWithOwner) \
        bin/claim-gate "$(git merge-base origin/main HEAD)" HEAD
  - name: push the lane
    # 2026-10-12 (#5814): guard + push costs ~35s on a quiet laptop and crossed the 60s cap with
    # ~10 agents live -- `estate_invoke lane-submit` answered TIMEOUT exit 124 while the lane ref
    # landed on origin anyway, so a caller could not tell a handed-over branch from nothing
    # happening at all. The cap cannot simply be raised: 60s is the estate's own ceiling for a
    # command (the executor refuses anything above it, whatever the unit), and the guard that
    # spends 32s of it is not bypassed (AGENTS.md, Laws and Guards). So the step stops inferring
    # the handover from its own exit code -- it bounds the push well inside the cap and then READS
    # THE REMOTE REF, which answers the only question that matters whether or not the local push
    # survived.
    timeout: 60
    cmd: |
      cd {{cwd}} || exit 2
      b=$(git rev-parse --abbrev-ref HEAD); lane={{lane}}; [ -n "$lane" ] || lane="$b"
      # 2026-10-11: a lane branch is already named lane/<name>, so the old `${lane:-lane/$b}`
      # pushed lane/lane/<name> whenever --lane was omitted. Measured on this very change:
      # branch lane/front-door-identity-row pushed as lane/lane/front-door-identity-row, which
      # the engine then queued as a second lane of the same commit. Prepend only when the
      # prefix is missing (#5756). The fix belongs here, in the file estate-runtime-sync reads:
      # patching ~/.estate/intents/lane-submit.yaml alone is reverted by the next sync.
      case "$lane" in lane/*) ;; *) lane="lane/$lane" ;; esac
      sha=$(git rev-parse HEAD)
      # The push is bounded INSIDE the step, not by the step's own cap, so the step always reaches
      # the measurement below: a push killed locally can still have landed on the remote (#5814),
      # and a step killed by its own cap reports nothing at all. 50 of the step's 60 seconds go to
      # the push; the remaining 10 always belong to the ls-remote that reports the outcome. The
      # bound is `timeout` when it exists (a shim on macOS, GNU on the runners) and no bound when
      # it does not -- never a hard dependency, or the push never happens at all.
      BOUND=""; command -v timeout >/dev/null 2>&1 && BOUND="timeout 50"
      out=$($BOUND git push -q origin "HEAD:refs/heads/$lane" 2>&1); rc=$?
      # The handover, measured. Not this process's exit code: a timeout can outlive the push.
      on=$(git ls-remote --heads origin "$lane" 2>/dev/null | awk '{print $1}')
      if [ "$on" = "$sha" ]; then
        echo "ok      lane-submit  $lane = $(git rev-parse --short HEAD) on origin"
      elif printf '%s' "$out" | grep -qiE 'non-fast-forward|fetch first|stale info'; then
        # the engine (greenlane/github.py land()) force-pushes a rebased commit onto the
        # lane's own ref before merging, then deletes it only after a successful merge; if a
        # merge failed in between, or another session pushed this lane name, the remote ref
        # has moved underneath this branch and a plain push is correctly rejected here.
        echo "REJECTED lane-submit  $lane moved on origin since this branch was built (non-fast-forward) - fetch/rebase onto origin/$lane, or resubmit under a new lane name: $out" >&2
        exit 1
      else
        rc=${rc:-1}; [ "$rc" -ne 0 ] || rc=1
        echo "FAIL    lane-submit  $lane on origin is '${on:-absent}', not $sha (push rc=$rc): $out" >&2
        exit "$rc"
      fi
  - name: hand it over
    # The lane ticks on its own and nothing here waits for it. This proves the branch is actually
    # on origin -- the one thing the removed wait was ever asked to confirm -- and names where the
    # verdict will appear, then returns. An agent reads the verdict from the commit status when it
    # wants the answer; it does not hold the 60s door open for it.
    timeout: 10
    cmd: |
      cd {{cwd}} || exit 2
      b=$(git rev-parse --abbrev-ref HEAD); lane={{lane}}; [ -n "$lane" ] || lane="$b"
      case "$lane" in lane/*) ;; *) lane="lane/$lane" ;; esac
      sha=$(git rev-parse HEAD); repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
      on=$(git ls-remote --heads origin "$lane" 2>/dev/null | awk '{print $1}')
      if [ "$on" != "$sha" ]; then
        echo "BLIND   lane-submit  $lane on origin is '${on:-absent}', not $sha - the handover did not land" >&2
        exit 2
      fi
      echo "ok      lane-submit  $lane = $(git rev-parse --short HEAD)"
      echo "        verdict: gh api repos/$repo/commits/$sha/status --jq '.statuses[]|select(.context==\"greenlane\")|.state+\" \"+.description'"
      echo "        that is the whole observation - the lane proves this branch on top of the current main, then lands it"
