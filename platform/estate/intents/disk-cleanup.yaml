name: disk-cleanup
description: >-
  Free the laptop's data volume by deleting ONLY regenerable package-manager caches (yarn berry,
  go-build, pip, Homebrew, npm/npx, Cargo target/ dirs in the idp main checkout, never other agents' worktrees). Dry run by default: lists each target with its measured size
  plus the large things it will never touch (estate-tools, worktrees, nvm, ollama). apply=true
  deletes the allow-list, verifies each target is gone (exit 3 if not), and reports free space
  measured before and after. trash=true also empties ~/.Trash (the user's; opt-in only).
  only_below_mb=N applies only while free space is under N MB (the scheduled row uses the
  guard's 10G floor). worktrees=true also removes settled agent worktrees: clean, every commit on
  a branch/tag/remote, unlocked, idle 6h, no process inside, via `git worktree remove` without
  --force (restorable with `git worktree add`). Under a critical floor (DISK_CLEANUP_CRIT_MB,
  default 10240M free) it also reclaims regenerable toolchain weight: ~/.ollama/models when no
  ollama server runs, old ~/.nvm/versions/node/*, old ~/.rustup/toolchains/*, old
  ~/.local/share/claude/versions/* -- keeping the newest of each family, any version the estate's
  own runtime names, anything a running process holds open, and rustup's default toolchain.
  bin/idp-disk-guard reports the pressure; this acts on it.
  The dry run's "where the space is" measurement (a du of HOME) and the apply run's phases are
  each bounded by budget_s: a phase that cannot fit in what is left is skipped by name and the
  exit status is 4 (run it again to continue). Exit 3 still means a target survived deletion.
class: mutate
args:
  apply: {type: bool, default: false}
  trash: {type: bool, default: false}
  only_below_mb: {type: int, default: 0}
  worktrees: {type: bool, default: false}
  budget_s: {type: int, default: 78, description: "seconds of work the cleaner may start; keep under door_s"}
# 95, and it used to declare nothing at all, so it inherited the ceiling: the dry run's du of HOME
# (T_SCAN 300s) then hit the door at 100s and reported a timeout with no measurement in it.
door_s: 95
halt_on_failure: true
steps:
  - name: disk-cleanup
    cmd: >
      bash ~/.estate/libexec/disk-cleanup.sh {{apply}} {{trash}} {{only_below_mb}} {{worktrees}} {{budget_s}}
