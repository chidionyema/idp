# The offsite backup credentials, synced from the human store (Bitwarden) so the laptop's
# restic can read them lawfully through the cluster (migration P0.T2, 2026-10-25). The
# founder named the store entry; the values never transit a repo, a chat, or a log -- the
# laptop reads the synced Secret with kubectl and writes ~/.config/estate/estate.env
# in-process (names only, ever). Restic itself runs on the laptop (P0.T2); the R2 target
# is the bucket the estate already owns.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-backup
  namespace: llm
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ln }
  target: { name: r2-backup, creationPolicy: Owner }
  dataFrom:
    - extract: { key: 65be735114a887792c6e5cbd315cd385 }
