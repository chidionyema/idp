id: secrets
subject: estate.channel.secrets
how_it_works: 'The sdk server''s certificate chain lives in THIS row, not human-vault: the chart''s sdk-server
  pod mounts Secret bitwarden-tls-certs at start, and this row''s wait would never finish if the certificate
  were created by a row that depends on this one (the deadlock found 2026-09-02: external-secrets not-ready
  <- cert missing <- human-vault waiting on external-secrets). cert-manager comes from the edge row, which
  this row now names as a dependency. TLS for the Bitwarden SDK server (decision 0017). The bitwarden-sdk-server
  chart refuses to serve without a certificate in the Secret named bitwarden-tls'
