# External Secrets Operator: reads OCI Vault as the node's instance principal and writes
# Kubernetes Secrets. Replaced the sops-age key that lived in flux-system (crew#227 CP3).
# Chart pinned; the release tag was helm-chart-2.9.0 on 2026-08-25
# (api.github.com/repos/external-secrets/external-secrets/releases/latest).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  # Bounded per HGC (docs/reference/policy/enterprise-operating-model.md, standard 6): Helm
  # keeps one Secret per revision and this estate declared the field on no release, which is
  # how the cluster reached its 2,000-secret ceiling and stalled 18 Flux objects. 3
  # covers a rollback of a rollback; Flux's default of 5 is accumulation at this size.
  maxHistory: 3
  # Bounded remediation, and the last failure is remediated too, so a wedged release is not left
  # Failed for a person to untangle: helm-controller spends its retries once and then waits forever
  # for a spec change (tailscale-operator sat Failed blocking guacamole, idp#1027).
  # NOT `strategy: uninstall`, which idp#1027 set here and this row takes back out. Founder,
  # 2026-08-30 (~/.claude/docs/founder/2026-08-30T2332Z-yes-and-the-pattern-is-sound-but-two
  # -c08d08d9.md): uninstalling a wedged release turns a degraded service into a deleted one --
  # the PVCs, PDBs and Secrets the release made go with it -- and it erases the state that says
  # which invariant was violated, which is the state an incident is converted into a control from.
  # The default strategy is rollback: the previous revision is restored and the failed one is
  # readable. Repaving stays a hand after capture: `bin/idp-oke-break-glass helm-retry`.
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      version: 2.9.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  # Audit 2026-09-14: `secretstore-validate` and `externalsecret-validate` cascaded every
  # ClusterSecretStore/ExternalSecret dry-run into `secret-store` and `rbac-identity` going
  # NotReady, holding ~38 more Kustomizations behind them ("dependency 'flux-system/secret-store'
  # is not ready"). Measured live: the Service (port 443 -> named containerPort `webhook`,
  # 10250) and the NetworkPolicy (platform/ns-fences/network/external-secrets.yaml,
  # allow-apiserver-webhook-ingress, already widened for the cross-node SNAT path in crew#102)
  # are both correct -- 10250 is the chart's own upstream default
  # (deploy/charts/external-secrets/values.yaml `webhook.port: 10250`), not a misrouted port.
  # The pods are Running/Ready with zero restarts. What is wrong: `kubectl get kustomization
  # secret-store` showed 78 reconciliations flapping Failed/Succeeded, every failure reading
  # `failed to call webhook ... context deadline exceeded` against
  # `.../validate-external-secrets-io-v1-clustersecretstore?timeout=5s` -- the chart hardcodes
  # `timeoutSeconds: 5` on every entry of both ValidatingWebhookConfigurations
  # (deploy/charts/external-secrets/templates/validatingwebhook.yaml:33,50,84 at
  # helm-chart-2.9.0) with no values.yaml knob to raise it. crew#102's own comment in
  # clusters/oke/estate-config.yaml already names the cause of the added latency: a webhook
  # call that lands on the other worker takes an extra Calico SNAT hop through the VXLAN
  # tunnel. That hop occasionally pushes response time past a 5s ceiling that was never sized
  # for it. failurePolicy stays Fail (`.Values.webhook.failurePolicy`, unset here so the
  # chart's own default holds) -- a slow validator should still validate, not be waved through.
  # Widening the ceiling instead of relaxing failurePolicy keeps validation live and worst-case
  # adds well under the 5m/10m Kustomization health-check timeouts already in play. Root cause
  # is upstream (the hardcoded 5s); this is the fix available at this layer until the chart
  # takes a `webhook.timeoutSeconds` value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ValidatingWebhookConfiguration
              name: secretstore-validate
            patch: |
              - op: replace
                path: /webhooks/0/timeoutSeconds
                value: 15
              - op: replace
                path: /webhooks/1/timeoutSeconds
                value: 15
          - target:
              kind: ValidatingWebhookConfiguration
              name: externalsecret-validate
            patch: |
              - op: replace
                path: /webhooks/0/timeoutSeconds
                value: 15
  values:
    installCRDs: true
    # Kyverno require-pod-probes refused the controller Deployment on 2026-08-25:
    # the chart ships both probes disabled (helm show values ... livenessProbe.enabled: false).
    livenessProbe: { enabled: true }
    readinessProbe: { enabled: true }
    # one 1.8-core node (platform/oci/main.tf); Kyverno refuses pods without limits
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    webhook:
      # Incident 2026-09-08, the same one that doubled cert-manager's webhook: all four
      # external-secrets pods were on node 10.0.159.197, the API server could not reach it, and
      # `validate.externalsecret.external-secrets.io` timed out on every apply -- which is every
      # ExternalSecret in the estate, so `jit` and `rbac-identity` could not reconcile at all.
      # A fail-closed admission webhook on one replica is one node away from freezing the cluster.
      replicaCount: 2
      # crew#307, in this same policy file: a required podAntiAffinity on hostname plus the
      # apps/v1 default strategy is a deadlock, not a spread. 25% of two replicas rounds down to
      # maxUnavailable 0, so a rollout must place a surge pod on a third node -- and the whole
      # point of the anti-affinity is that there is no third node. The rollout sits Pending for
      # ever while the old ReplicaSet keeps answering 200. maxSurge 0 with maxUnavailable 1 is
      # the shape that rolls: one replica steps down, its node frees, the new one takes it.
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 0
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                # name only, never instance: `app.kubernetes.io/instance` is the Helm release
                # name, and a required anti-affinity whose selector matches nothing is not a
                # constraint. This name is unique to the webhook inside namespace
                # external-secrets, the scope a podAntiAffinity selector has by default.
                matchLabels:
                  app.kubernetes.io/name: external-secrets-webhook
              topologyKey: kubernetes.io/hostname
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
    certController:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
    # decision 0017, the human door: the chart's one dependency, bitwarden-sdk-server (v0.6.0),
    # serves the Bitwarden Secrets Manager SDK in-cluster over TLS from the cert-manager chain in
    # platform/human-vault/certs.yaml (Secret bitwarden-tls-certs, the name the chart requires).
    # The store that speaks to it is ClusterSecretStore human-vault (platform/human-vault/store.yaml).
    # The chart bakes its probes into the template and takes the security context below; the one
    # key it lacks is a priorityClassName - platform/human-vault/exceptions.yaml carries that
    # single admission exception, the cainjector pattern.
    bitwarden-sdk-server:
      enabled: true
      # restrict-seccomp-strict: the scaffold chart ships empty security contexts; the runtime
      # default profile is declared here, not excepted.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests: { cpu: 5m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
