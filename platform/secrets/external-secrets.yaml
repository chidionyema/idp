# External Secrets Operator: reads OCI Vault as the node's instance principal and writes
# Kubernetes Secrets. Replaced the sops-age key that lived in flux-system (crew#227 CP3).
# Chart pinned; the release tag was helm-chart-2.9.0 on 2026-08-25
# (api.github.com/repos/external-secrets/external-secrets/releases/latest).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: 2.9.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    installCRDs: true
    # Kyverno require-pod-probes refused the controller Deployment on 2026-08-25:
    # the chart ships both probes disabled (helm show values ... livenessProbe.enabled: false).
    livenessProbe: { enabled: true }
    readinessProbe: { enabled: true }
    # one 1.8-core node (platform/oci/main.tf); Kyverno refuses pods without limits
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
    certController:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
