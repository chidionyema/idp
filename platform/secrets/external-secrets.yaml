# External Secrets Operator: reads OCI Vault as the node's instance principal and writes
# Kubernetes Secrets. Replaced the sops-age key that lived in flux-system (crew#227 CP3).
# Chart pinned; the release tag was helm-chart-2.9.0 on 2026-08-25
# (api.github.com/repos/external-secrets/external-secrets/releases/latest).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  # Bounded remediation, and the last failure is remediated too, so a wedged release is not left
  # Failed for a person to untangle: helm-controller spends its retries once and then waits forever
  # for a spec change (tailscale-operator sat Failed blocking guacamole, idp#1027).
  # NOT `strategy: uninstall`, which idp#1027 set here and this row takes back out. Founder,
  # 2026-08-30 (~/.claude/docs/founder/2026-08-30T2332Z-yes-and-the-pattern-is-sound-but-two
  # -c08d08d9.md): uninstalling a wedged release turns a degraded service into a deleted one --
  # the PVCs, PDBs and Secrets the release made go with it -- and it erases the state that says
  # which invariant was violated, which is the state an incident is converted into a control from.
  # The default strategy is rollback: the previous revision is restored and the failed one is
  # readable. Repaving stays a hand after capture: `bin/idp-oke-break-glass helm-retry`.
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  interval: 10m
  chart:
    spec:
      chart: external-secrets
      version: 2.9.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    installCRDs: true
    # Kyverno require-pod-probes refused the controller Deployment on 2026-08-25:
    # the chart ships both probes disabled (helm show values ... livenessProbe.enabled: false).
    livenessProbe: { enabled: true }
    readinessProbe: { enabled: true }
    # one 1.8-core node (platform/oci/main.tf); Kyverno refuses pods without limits
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
    certController:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
