# LiteLLM config for the cluster. Every hosted model here is the same entry as llm/config.yaml
# (tests/test_llm_row.py diffs them); what is missing is on purpose:
#   - ollama-vision and ollama-llama: llm/config.base.yaml's copies point at the founder's Mac
#     (host.docker.internal), killed 2026-09-10 ("no i killed ollama because machine is slow",
#     platform/otto-gateway/three-homes.yaml:28-29) and never reachable from the cluster anyway.
#     No room for a second or third resident local model on the 2 OCPU / 12 GB free pool
#     (docs/reference/oci-tenancy.md:18) alongside `ollama` below, litellm, redis, postgres,
#     temporal-worker, langfuse and signoz.
# `vision` is an alias so photo intake names a capability, not a vendor (crew#284 CP1).
#
# `ollama` below is the one that WAS also missing here for the same host.docker.internal
# reason -- fixed 2026-09-15 by giving the cluster its own local model instead
# (platform/llm/ollama.yaml), so this lane no longer depends on any laptop being on.

model_list:
  # @vendor-lanes@

  # @vendor-cluster-lanes@

  # Local, free, and reachable from the cluster: platform/llm/ollama.yaml, on the always-free
  # Ampere pool, not the founder's Mac. 1.5B, not the 7B llm/config.base.yaml names for the
  # laptop, because the whole free allowance here is 2 OCPU / 12 GB, already shared with
  # litellm, redis, postgres, temporal-worker, langfuse and signoz -- no room for a 7B working
  # set. `cost-based-routing` above prefers this lane automatically once it's healthy: it
  # carries no input_cost_per_token/output_cost_per_token, so LiteLLM prices it $0.0000, the
  # same convention the three free vendor pools use.
  - model_name: ollama
    litellm_params:
      model: ollama/qwen2.5-coder:1.5b
      api_base: http://ollama.llm.svc.cluster.local:11434
      timeout: 300
      keep_alive: 24h

  # Claude Code Max subscription, passthrough. NO api_key ON PURPOSE.
  #
  # This lane carries no `api_key:` and that is the whole mechanism, not an omission. A normal
  # lane substitutes the caller's credential for an estate-owned one, which is why pointing
  # Claude Code at this router used to turn it into whatever non-Anthropic lane the model name
  # resolved to. This lane instead RELAYS the client's own OAuth token to api.anthropic.com
  # unchanged (general_settings.forward_client_headers_to_llm_api, below), so each client
  # authenticates as itself against its own Max subscription and the model is genuinely Claude.
  #
  # The 2026-09-04 ruling stands untouched: "the estate will never use Anthropic API keys". An
  # OAuth token minted by a `claude /login` against a Max subscription is a different credential
  # on a different billing path from a sk-ant-api03-... key, and nothing here creates or holds
  # one. There is no Anthropic key in the vault, in external-secret.yaml, or on this line.
  #
  # DOCS: https://docs.litellm.ai/docs/tutorials/claude_code_max_subscription (read 2026-09-21).
  # The client sends TWO credentials: x-litellm-api-key authenticates it to this router, and the
  # OAuth `Authorization: Bearer` header is forwarded upstream. The client sets NO
  # ANTHROPIC_API_KEY and NO ANTHROPIC_AUTH_TOKEN, so the subscription remains the active
  # credential. Verify with `claude /status`: login method must read the claude.ai subscription.
  #
  # `max_tokens` is absent deliberately -- Claude Code sends its own. No cost fields either:
  # with the subscription there is no per-token spend for the router to price, so this lane
  # would report $0.0000 the way the free pools do. Spend governance for this lane comes from
  # Anthropic's own Max-plan limits, which the token carries, not from max_budget here.
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-5
      timeout: 600

  # EVERY Claude model, not only opus (founder, 2026-09-22: "not just opus but all claude
  # models"). The named rows below exist so a lane can be granted, budgeted and read back by
  # name -- `/v1/models` enumerates them, which is how bin/idp-router-key puts a lane on a
  # consumer's key. The wildcard row after them is what makes the passthrough complete.
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      timeout: 600

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      timeout: 600

  # The catch-all, and the row that actually carries Claude Code. A client does not send the
  # tidy alias above -- it sends the exact dated id it was built against
  # (claude-haiku-4-5-20251001, and whatever ships next), and a named row can only ever hold
  # the ids that existed the day it was written. LiteLLM's pattern routing substitutes what
  # `*` matched into the upstream model, so `claude-sonnet-4-5-20250929` leaves here as
  # `anthropic/claude-sonnet-4-5-20250929`: the client's own model name, relayed unchanged to
  # Anthropic under the client's own OAuth token, exactly as the passthrough comment above
  # describes. No api_key here either, for the same reason and by the same mechanism.
  - model_name: "claude-*"
    litellm_params:
      model: "anthropic/claude-*"
      timeout: 600

router_settings:
  fallbacks:
    # crew#506 CP1 (2026-08-27): the first hop is the other funded direct vendor. OpenRouter sat
    # at ~2,400 tokens of credit and Google prepaid was empty, so the crew#284 order (OpenRouter
    # first) walked every turn through 402/429 before reaching a lane that answers. Consensus
    # still survives any one account dry. Every chain not headed by the cheap model ends in it
    # (sovereign cp30). The OpenRouter lanes stay in model_list for crew#506 CP4 (free lanes,
    # job aliases) but sit in no chain while the account is unfunded: a hop that always
    # answers 402 is latency, not redundancy.
    # @vendor-fallbacks@
    # @vendor-cluster-fallbacks@
  # Alias, not a model row (R75, founder 2026-09-03). The Kimi lane is console-owned: the
  # founder brought the key through the LiteLLM console on 2026-09-04 and it is stored
  # encrypted in litellm-db under the vendor's own name, `moonshot/kimi-k3`. Rendering a
  # `kimi` row here would lock that name in the config file and the console would then refuse
  # to attach a key to it ("defined in config"), which is the failure he hit the day before.
  # An alias carries no credential and declares no model, so it cannot lock anything -- it
  # only spares every caller from hardcoding a vendor path that changes when the vendor
  # ships k4. Probed 2026-09-04 05:47Z from inside the litellm pod: `moonshot/kimi-k3`
  # answers HTTP 200 in 30.5s, while `kimi` answered HTTP 400 "Invalid model name".
  model_group_alias:
    kimi: moonshot/kimi-k3
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 60
  # What makes the `tpm` on the Gemini lanes an actual ceiling rather than a decoration.
  # `enable_pre_call_checks` is the pre-call filter that drops a deployment already over its
  # per-minute budget -- over budget, walk the fallback chain now, instead of spending a round
  # trip to be told 429 and then waiting out Google's retryDelay (measured 2026-09-08 at 9s,
  # 46s, 48s, 55s and 57s -- the pause a person reads as the thing hanging before it switches).
  # This filter runs ahead of whichever `routing_strategy` picks among what survives it, so it
  # holds regardless of which strategy is below.
  #
  # 2026-09-15: `groq`, `cerebras`, `sambanova`, `default` and `fast` stopped being one
  # deployment each (the state this comment used to describe -- "changes no routing decision")
  # once the extra Groq/Cerebras keys and the new sambanova vendor turned them into real pools.
  # `cost-based-routing` is the strategy, not `usage-based-routing-v2`: among whichever
  # deployments `enable_pre_call_checks` and the `allowed_fails`/`cooldown_time` breaker leave
  # standing, it picks the cheapest per token. The three free vendors carry no
  # input_cost_per_token/output_cost_per_token (this file's own convention for a $0 lane), so
  # LiteLLM prices them at $0.0000 and picks one of them over paid MiniMax whenever any is
  # healthy -- cost-effective by construction, not by a human watching a bill. They are set here
  # and not in llm/config.base.yaml because the laptop compose has no shared cache and no
  # measured quota incident; the fire was in the cluster (2026-09-08 router pod logs).
  routing_strategy: cost-based-routing
  enable_pre_call_checks: true
  # One memory for the two router pods (founder 2026-09-03): cooldowns, rate counts and spend
  # windows live in the shared cache, so what one pod learns the other honours. The password
  # is exported by the pod from the litellm-cache mount (litellm.yaml), never typed here.
  redis_host: litellm-cache.llm.svc
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  # `otel` is the existing trace exporter. The second entry is the estate's per-request ceiling:
  # a call carrying more input tokens than a working turn needs is REFUSED before it is sent.
  # It is a callback and not a warning because the guard that already graded tokens
  # (spend-breaker-digest.yaml, 2,000,000 per hour) watched 86,525,924 tokens go through one hour
  # on 2026-09-13 and did not sever -- it grades the hour's total, so one session at 737,169 per
  # call is indistinguishable from 200 sessions at 3,700. Its own comment says it:
  # "It reports and warns; it does not sever the router."
  callbacks: ["otel", "request_ceiling.proxy_handler_instance", "efficiency_gateway.proxy_handler_instance", "zeroedge_gateway.proxy_handler_instance"]
  # Every routed call lands in Langfuse (platform/observability) as a trace, whatever product made
  # it: tracing at the router is the one instrument, not one SDK per product (crew#325 showcase).
  # Keys arrive as env from the litellm-langfuse ExternalSecret; LANGFUSE_HOST is set in litellm.yaml.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  drop_params: true
  turn_off_message_logging: true
  # Bounded answer reuse (the containment set the founder approved 2026-09-03): exact-match
  # only, a five-minute life, per-call opt-out honoured ({"cache": {"no-cache": true}}), and
  # every reuse is marked in the trace, never silent.
  cache: true
  cache_params:
    type: redis
    host: litellm-cache.llm.svc
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # crew#400: the founder picks and adds models in the Admin UI at llm.<zone>/ui, not by PR (LAW 31).
  # Models added there are rows in litellm-db and survive a restart; this model_list stays the floor.
  # The console signs in through the estate identity domain (GENERIC_* env from the litellm-sso
  # mount, external-secret.yaml); no console password exists (crew#408, ADR 0007).
  store_model_in_db: true
  max_budget: 5.0
  budget_duration: 1d
  background_health_checks: false
  # Claude Code Max subscription passthrough. Forwards x-* and anthropic-beta headers.
  #
  # PRECISE SCOPE, because this is easy to overstate: this flag is NOT what carries the
  # subscription token. The OAuth `Authorization` header is forwarded by LiteLLM's
  # `clean_headers` regardless of this setting (measured 2026-09-21 against the real v1.98.0
  # code: `clean_headers` returns the OAuth header with the flag False). What this flag
  # forwards is the x-* family and `anthropic-beta`, which is what keeps ENABLE_TOOL_SEARCH
  # and beta features working through the router.
  #
  # The token discriminator is the PREFIX, not this flag: `is_anthropic_oauth_key` forwards
  # `Authorization: Bearer sk-ant-oat01-...` (a Max subscription OAuth token) and drops
  # `sk-ant-api03-...` (an API key). So the estate keeps forwarding the subscription and
  # still holds no Anthropic key. `forward_llm_provider_auth_headers` is deliberately NOT set:
  # that is the x-api-key BYOK path, i.e. exactly the API key the 2026-09-04 ruling forbids.
  #
  # One client rule this implies: the client must authenticate to this router with
  # `x-litellm-api-key`, NOT with `Authorization`. If `Authorization` is used for gateway auth
  # the OAuth token is consumed there and dropped (measured: clean_headers returns {} for
  # authenticated_with_header="authorization"), and the subscription never reaches Anthropic.
  # (https://docs.litellm.ai/docs/proxy/forward_client_headers, read 2026-09-21.)
  forward_client_headers_to_llm_api: true
  # The MiniMax half of the founder's 2026-08-30 ruling. MiniMax's image API is not
  # OpenAI-shaped -- POST https://api.minimax.io/v1/image_generation, body {model, prompt,
  # aspect_ratio, n, response_format}, answer data.image_base64
  # (https://platform.minimax.io/docs/guides/image-generation, read 2026-08-30) -- so it cannot
  # be a model_list row. A pass-through forwards the vendor's own shape and puts the key in the
  # header from the mounted secret, which keeps LAW 34 whole: the caller holds a router virtual
  # key, never MINIMAX_API_KEY.
  #
  # `auth: true` is what makes that true, and it is free on this version. It used to be an
  # enterprise flag; in v1.98.0 _register_pass_through_endpoint attaches Depends(user_api_key_auth)
  # and adds the path to LiteLLMRoutes.openai_routes for everyone
  # (litellm/proxy/pass_through_endpoints/pass_through_endpoints.py:2802-2812 at tag v1.98.0).
  # Without it this path would forward anything the internet sent to llm.<zone>, spending the
  # MiniMax account with no key at all, so the flag is load-bearing and not a default.
  pass_through_endpoints:
    - path: /minimax/image
      target: https://api.minimax.io/v1/image_generation
      auth: true
      methods: ["POST"]
      headers:
        Authorization: Bearer os.environ/MINIMAX_API_KEY
        content-type: application/json
      timeout: 120
