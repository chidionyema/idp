# The Rung 0-3 compute cost ladder (idp#3525 CP1, COST-03).
#
# "The cost ladder (Rung 0-3) SHALL be versioned config data" -- this file,
# not a literal in Python, is that data. sovereign/engine/cost_ladder.py
# reads it; a rung's price changing is an edit here, never a patch.
#
# Rung 2's breakeven band is COMPUTED (cost_ladder.breakeven_band_tokens),
# not written down, because the router's own per-token prices already move
# under platform/llm/config.yaml and a hardcoded band would go stale exactly
# how request_ceiling.py's original warn-only design went stale (idp#3525
# COST-01's corrected evidence, 2026-09-15).
#
# usd_per_month for rung 2 is the EUR-denominated Hetzner flat-monthly quote
# from the founder's 2026-09-14 email (~EUR 64/mo, 32GB M2 Pro), converted at
# ~1.08 EUR/USD -- itself an approximation, so the grade below is
# founder-supplied-unverified until D1/D4 (spec section 7) are resolved
# against the vendor's own pricing page. That is why COST-03's own ACCEPT
# line calls this a "proposal", never an automatic activation.
#
# hardware_class / activation_floor_minutes / cold_start_budget_ms (idp#3525
# CP2, JIT-01/JIT-02): apple_silicon tiers carry Apple's own 24h-minimum
# licensing term as activation_floor_minutes=1440 -- not a vendor policy this
# estate chose, a term it is bound by (S3 §1) -- while gpu tiers bill
# per-second and MUST NOT declare a floor at all.
# sovereign/engine/jit_provisioning.py refuses to load a ladder where a
# tier's hardware_class and activation_floor_minutes disagree.
version: 1

rungs:
  - rung: 0
    name: local_free
    grade: vendor-doc
    activation_mode: always_on
    usd_per_month: 0.0
    source: "platform/llm/ollama.yaml, OCI A1 always-free pool"
    hardware_class: local
    activation_floor_minutes: 0
    cold_start_budget_ms: 2000

  - rung: 1
    name: router_metered
    grade: vendor-doc
    activation_mode: default
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000012
    source: "platform/llm/config.yaml (MiniMax default lane), AGENTS.md budget.usd_per_day.litellm"
    hardware_class: router
    activation_floor_minutes: 0
    cold_start_budget_ms: 3000

  - rung: 2
    name: flat_rate_apple_silicon
    grade: founder-supplied-unverified
    activation_mode: breakeven_gated
    usd_per_month: 69.0
    source: "founder email 2026-09-14 (Hetzner ~EUR64/mo, 32GB M2 Pro); not cross-checked against Hetzner's own pricing page (D1)"
    hardware_class: apple_silicon
    activation_floor_minutes: 1440
    cold_start_budget_ms: 5000

  - rung: 3
    name: gpu_burst_vast_ai
    grade: founder-supplied-unverified
    activation_mode: receipt_pending
    usd_per_month_low: 73.0
    usd_per_month_high: 146.0
    source: "founder email 2026-09-14, Vast.ai RTX 3090 24/7 @ $0.10-0.20/hr; not re-pulled from Vast.ai's live marketplace (D4)"
    hardware_class: gpu
    activation_floor_minutes: 0
    cold_start_budget_ms: 8000
