apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pennyd-edge-keys
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: estate-vault
  target:
    name: pennyd-edge-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pennyd-edge-keys
