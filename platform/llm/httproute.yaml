# llm.<zone> -> the router. Not behind oauth2-proxy on purpose: the callers are programs
# (the sovereign plugin, prospector) holding the master key, and LiteLLM refuses any request
# without it. external-dns writes the record from this hostname (platform/dns).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: llm
  annotations:
    # The front-door gate accepts this only because platform/llm/config.yaml proves a master key.
    idp.estate/auth: bearer-master-key
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-llm
  hostnames:
    - "llm.${ESTATE_ZONE}"
  rules:
    # crew#503: LiteLLM's own /ui -> /ui/ redirect is built from the plaintext Traefik->pod hop, so
    # a browser on https://llm.<zone>/ui is sent to http://llm.<zone>/ui/ (upstream BerriAI/litellm
    # #19663, not fixed in the pinned image). The Gateway answers the exact path first, on https,
    # so the router never emits that redirect. /ui/ and every other path go to the router as before.
    - matches:
        - path: { type: Exact, value: /ui }
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            path: { type: ReplaceFullPath, replaceFullPath: /ui/ }
            statusCode: 301
    - backendRefs:
        - name: litellm
          port: 4000
