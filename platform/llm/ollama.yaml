# The free local lane Pillar 1 of the founder's routing sketch calls for: a tiny
# quantized model that absorbs deterministic, high-volume calls (formatting, tool-call
# routing, classification) at zero marginal cost, so those calls stop paying groq/minimax
# rates. Until now `llm/config.yaml`'s three ollama/* entries pointed at
# http://host.docker.internal:11434 -- the founder's own Mac, which he killed on
# 2026-09-10 ("no i killed ollama because machine is slow", platform/otto-gateway/
# three-homes.yaml:28-29). Every call routed there has been silently falling through
# the fallback chain to a paid model since. This runs the same free floor in-cluster,
# on the always-free Ampere pool, instead of a laptop that can be turned off.
#
# Model is 1.5B, not the 7B llm/config.yaml names, because the whole always-free A1
# allowance is 2 OCPU / 12 GB (docs/reference/oci-tenancy.md:18), shared with litellm
# (2 replicas), redis, postgres, temporal-worker, langfuse and signoz already running
# in this cluster -- there is no room for a 7B model's working set here. 1.5B is the
# size Pillar 1 itself named ("Qwen-2.5-Coder 1.5B") for exactly this gatekeeper role.
#
# WHY IT WAS SCALED TO 0, AND WHAT ACTUALLY BLOCKED IT (2026-10-26). The Deployment sat at
# replicas: 0 since 2026-09-29 with "binding volumes: context deadline exceeded" recorded
# as the cause. The PVC events name the real one: `LimitExceeded: You cannot create a
# volume because you have reached your limit. Upgrade to a paid account.` -- the tenancy's
# block-volume quota is full (14 oci-bv PVCs Bound cluster-wide; coroot and
# agent-workforce PVCs Pending on the same error), so oci-bv can never provision this
# claim, with or without a consumer pod. The fix is to stop asking OCI for a volume at
# all: storageClassName local-path (rancher.io/local-path, already running in
# local-path-storage) provisions node disk with no OCI quota. local-path is node-pinned,
# so a reschedule to the other node re-pulls the ~1 GB of weights once via the init
# container -- network-bound minutes, acceptable for a fallback lane; Recreate keeps a
# single writer as before. replicas is 1 again, and CPU requests are trimmed to 150m
# because both nodes run 5808m of their 6000m allocated (kubectl describe nodes,
# 2026-10-26) -- at the old 200m/250m requests this pod is unschedulable.
#
# WHY THE CLAIM IS RENAMED, NOT MUTATED (2026-10-26, second correction). The first
# version of this change edited the existing claim in place -- storageClassName
# oci-bv -> local-path, 5Gi -> 3Gi -- and Flux's apply was rejected by the API
# server: "spec is immutable after creation except resources.requests and
# volumeAttributesClassName for bound claims". A claim's storage class is fixed at
# birth, so no git edit can move an existing claim onto a different class; only a
# NEW claim can. The claim is therefore named ollama-models-local and the old
# ollama-models object is left behind: it is Pending, unbound, and holds no volume,
# so it consumes no quota and no disk. It is removed by Flux's prune (the
# llm kustomization prunes resources it previously applied), or by an operator who
# deletes it deliberately -- never by a hand edit and a kubectl apply.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-local
  namespace: llm
spec:
  accessModes: [ReadWriteOnce]
  # 3 Gi: the 1.5B q4 weights are ~1 GB plus ollama's blob overhead; the old 5 Gi only
  # ever made sense against a block service that was going to refuse the claim anyway.
  storageClassName: local-path
  resources: {requests: {storage: 3Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
  labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: idp }
spec:
  # 1 since 2026-10-26: local-path binds without the block service that was refusing the
  # claim, and the free floor is load-bearing for the Micro-Token Tier-0 (gatekeeper and
  # classification calls at zero marginal cost). It is still not an HA tier: the
  # availability waiver (chidionyema/idp#3528) records the RWO reasoning, and
  # llm/config.yaml's chain already falls through to a paid model when this pod is down.
  replicas: 1
  strategy: { type: Recreate }   # the PVC is ReadWriteOnce; a rolling second pod can't mount it
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # ollama has no "pull on deploy" step of its own; a pod that only ran `ollama
        # serve` would lazy-pull the model on the FIRST real request, off the litellm
        # 300s timeout budget, unpredictably. Pull once here so the pod is only Ready
        # once the model is actually on disk.
        - name: pull-model
          image: docker.io/ollama/ollama:0.3.14
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ollama serve &
              pid=$!
              for i in $(seq 1 60); do
                wget -q -O- http://127.0.0.1:11434/ >/dev/null 2>&1 && break
                sleep 1
              done
              ollama pull qwen2.5-coder:1.5b
              kill "$pid"
          env:
            - { name: HOME, value: /tmp }
            - { name: OLLAMA_MODELS, value: /models }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
          resources:
            # 150m request: both nodes run 5808m/6000m allocated, so 200m+ never schedules
            # (2026-10-26). Limits unchanged -- the pull is network-bound, the burst headroom
            # is what limits it.
            requests: { cpu: 150m, memory: 512Mi }
            limits: { cpu: 1500m, memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.3.14
          ports:
            - { name: http, containerPort: 11434 }
          env:
            - { name: HOME, value: /tmp }
            - { name: OLLAMA_MODELS, value: /models }
            - { name: OLLAMA_KEEP_ALIVE, value: 24h }   # crew#284 CP2: cold load measured 30.8s, warm 16.9s
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
          resources:
            # 150m request, 2Gi limit: 1.5B q4 weights are ~1GB resident; the limit leaves
            # headroom for context. See the replicas comment on the CPU headroom.
            requests: { cpu: 150m, memory: 768Mi }
            limits: { cpu: 1500m, memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models-local }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels: { app.kubernetes.io/name: ollama, backstage.io/kubernetes-id: founder-model-router }
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports:
    - { name: http, port: 11434, targetPort: http }
