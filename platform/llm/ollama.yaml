# The free local lane Pillar 1 of the founder's routing sketch calls for: a tiny
# quantized model that absorbs deterministic, high-volume calls (formatting, tool-call
# routing, classification) at zero marginal cost, so those calls stop paying groq/minimax
# rates. Until now `llm/config.yaml`'s three ollama/* entries pointed at
# http://host.docker.internal:11434 -- the founder's own Mac, which he killed on
# 2026-09-10 ("no i killed ollama because machine is slow", platform/otto-gateway/
# three-homes.yaml:28-29). Every call routed there has been silently falling through
# the fallback chain to a paid model since. This runs the same free floor in-cluster,
# on the always-free Ampere pool, instead of a laptop that can be turned off.
#
# Model is 1.5B, not the 7B llm/config.yaml names, because the whole always-free A1
# allowance is 2 OCPU / 12 GB (docs/reference/oci-tenancy.md:18), shared with litellm
# (2 replicas), redis, postgres, temporal-worker, langfuse and signoz already running
# in this cluster -- there is no room for a 7B model's working set here. 1.5B is the
# size Pillar 1 itself named ("Qwen-2.5-Coder 1.5B") for exactly this gatekeeper role.
#
# WHY IT WAS SCALED TO 0, AND WHAT ACTUALLY BLOCKED IT (2026-10-26, with the full causal
# chain -- the first two entries are what the 2026-09-29 record called "binding volumes:
# context deadline exceeded" without explaining).
#
# 1. The tenancy's BLOCK VOLUME quota is full. The PVC events name it: `LimitExceeded: You
#    cannot create a volume because you have reached your limit. Upgrade to a paid account.`
#    -- 14 oci-bv PVCs Bound cluster-wide; coroot and agent-workforce claims Pending on the
#    same error. So oci-bv cannot provision a new claim, with or without a consumer pod.
# 2. local-path CANNOT be used here either. The rancher.io/local-path provisioner creates
#    hostPath PVs, and this cluster's admission policy refuses them:
#      failed to provision volume with StorageClass "local-path": failed to create volume
#      pvc-e20f64cf-...: admission webhook "validate.kyverno.svc-fail" denied the request
#      (rule `restrict-volume-types`: only configMap, csi, downwardAPI, emptyDir, ephemeral,
#      persistentVolumeClaim, projected and secret are allowed).
#    The claim then sits in WaitForFirstConsumer, the pod's VolumeBinding plugin times out
#    ("binding volumes: context deadline exceeded"), and the Deployment never starts. The
#    same mistake already left agent-workforce-memory Pending on local-path for 10 days.
# 3. So NO storage class in this cluster can provision a volume for a NEW claim, and the
#    free floor cannot hold its weights on one.
#
# WHAT THIS MANIFEST DOES INSTEAD: the weights live in an emptyDir -- the one volume type
# the policy allows that needs no provisioner and no quota. The init container already
# pulls qwen2.5-coder:1.5b on every pod start, so the floor is self-healing: a reschedule
# re-pulls ~1 GB (network-bound minutes) and the pod is Ready again. The cost is honest and
# bounded: a cold start pays the pull, and the floor is a FALLBACK lane, not state.
#
# A CLAIM'S STORAGE CLASS IS FIXED AT BIRTH (the first version of this fix was wrong and the
# cluster said so): editing an existing claim's storageClassName is refused -- "spec is
# immutable after creation except resources.requests and volumeAttributesClassName for bound
# claims" -- which held the llm kustomization NotReady and blocked agent-workforce, which
# waits on flux-system/llm. Only a new claim can use a different class; and here, no class
# works, so there is no claim at all.
#
# The rest of the sizing: the model is 1.5B, not the 7B llm/config.yaml names, because the
# whole always-free A1 allowance is 2 OCPU / 12 GB (docs/reference/oci-tenancy.md:18), shared
# with litellm (2 replicas), redis, postgres, temporal-worker, langfuse and signoz already
# running in this cluster -- there is no room for a 7B model's working set here. 1.5B is the
# size Pillar 1 itself named ("Qwen-2.5-Coder 1.5B") for exactly this gatekeeper role.
# replicas is 1, and CPU requests are 150m because both nodes run 5808m of their 6000m
# allocated (kubectl describe nodes, 2026-10-26) -- at the old 200m/250m requests this pod
# is unschedulable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
  labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: idp }
spec:
  # 1 since 2026-10-26: the free floor is load-bearing for the Micro-Token Tier-0
  # (gatekeeper and classification calls at zero marginal cost). It is still not an HA
  # tier: the availability waiver (chidionyema/idp#3528) records the reasoning, and
  # llm/config.yaml's chain already falls through to a paid model when this pod is down.
  replicas: 1
  # Recreate, not RollingUpdate: two pods would pull the same ~1 GB of weights at once
  # and race on the model file.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # ollama has no "pull on deploy" step of its own; a pod that only ran `ollama
        # serve` would lazy-pull the model on the FIRST real request, off the litellm
        # 300s timeout budget, unpredictably. Pull once here so the pod is only Ready
        # once the model is actually on disk.
        - name: pull-model
          image: docker.io/ollama/ollama:0.3.14
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ollama serve &
              pid=$!
              for i in $(seq 1 60); do
                wget -q -O- http://127.0.0.1:11434/ >/dev/null 2>&1 && break
                sleep 1
              done
              ollama pull qwen2.5-coder:1.5b
              kill "$pid"
          env:
            - { name: HOME, value: /tmp }
            - { name: OLLAMA_MODELS, value: /models }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
          resources:
            # 150m request: both nodes run 5808m/6000m allocated, so 200m+ never schedules
            # (2026-10-26). Limits unchanged -- the pull is network-bound, the burst headroom
            # is what limits it.
            requests: { cpu: 150m, memory: 512Mi }
            limits: { cpu: 1500m, memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.3.14
          ports:
            - { name: http, containerPort: 11434 }
          env:
            - { name: HOME, value: /tmp }
            - { name: OLLAMA_MODELS, value: /models }
            - { name: OLLAMA_KEEP_ALIVE, value: 24h }   # crew#284 CP2: cold load measured 30.8s, warm 16.9s
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
          resources:
            # 150m request, 2Gi limit: 1.5B q4 weights are ~1GB resident; the limit leaves
            # headroom for context. See the replicas comment on the CPU headroom.
            requests: { cpu: 150m, memory: 768Mi }
            limits: { cpu: 1500m, memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: models
          # emptyDir, not a claim: no storage class in this cluster can provision a
          # volume for a new claim (block quota exhausted, hostPath refused by the
          # admission policy), and the init container re-pulls the weights on every
          # start anyway. 3 Gi holds the ~1 GB of q4 weights plus ollama's blob overhead.
          emptyDir: { sizeLimit: 3Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
  labels: { app.kubernetes.io/name: ollama, backstage.io/kubernetes-id: founder-model-router }
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports:
    - { name: http, port: 11434, targetPort: http }
