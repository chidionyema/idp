# Model routing row (crew#284 CP2, STANDARDS "LLM providers": LiteLLM, adopted 2026-08-24).
# One namespace, restricted profile like every idp row; edge-attach so the Gateway in
# prospector accepts this namespace's HTTPRoute on its https-llm listener.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (catalogue 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: llm
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
    availability.idp/tier: founder-facing
    idp.estate/edge-attach: "true"
