# ghcr-pull for the llm namespace, mirrored from backstage/ghcr-pull through the
# ClusterSecretStore ghcr-pull (platform/image-automation/pull-secret.yaml, crew#396 step 2),
# the same way platform/agent-workforce/pull-secret.yaml and platform/temporal/pull-secret.yaml
# do it.
#
# This namespace never needed one: litellm, redis and ollama all pull public images. ZeroEdge
# is a private package under ghcr.io/chidionyema, so without this its pod is an
# ImagePullBackOff and the optimizer is exactly as absent as it was with no manifest at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: ghcr-pull }
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: ghcr-pull, property: .dockerconfigjson }
