apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - namespace.yaml
  - external-secret.yaml
  - pennyd
  - ollama.yaml
  - availability.yaml
  - httproute.yaml
  - edge-manners.yaml
  - spend-breaker-digest.yaml
  - pull-secret.yaml
  - zeroedge.yaml
images:
  # chidionyema/zeroedge build-image.yml pushes ghcr.io/chidionyema/zeroedge:main-<run>-<sha> on
  # a multiarch manifest list, Trivy-scanned before the push and cosign-signed after it. The tag
  # is a commit sha because a moving tag makes the running version whichever push won the race
  # and leaves a rollback nothing to roll back to.
  # image-automation-controller rewrites the newTag line from ImagePolicy flux-system/zeroedge
  # (platform/image-automation/zeroedge.yaml); the marker is how it finds the line.
  - name: ghcr.io/chidionyema/zeroedge
    newTag: main-5-8fc1d21bb1c94e288bb51d44b877e86626d164e4 # {"$imagepolicy": "flux-system:zeroedge:tag"}
configMapGenerator:
generatorOptions:
  disableNameSuffixHash: false
# WAVE 1 OF THE ROLL ONTO THE ENFORCING CNI.
#
# 10-calico.conflist sorts before 10-flannel.conflist in /etc/cni/net.d, so Calico wins the CNI
# race and any pod created from now on is wired by Calico and judged by the estate's 154
# NetworkPolicy objects. Pods created before that are still on flannel and judged by nothing.
# Measured 2026-09-08: 108 running pods on flannel, 39 on Calico. Every fence in the estate is
# decoration for the flannel half.
#
# The restart is this annotation, not a command. Changing its value changes the pod template, so
# Flux performs the rollout; nothing needs a token, a drain or a founder tap, and reverting the
# value reverts the roll. A drain was measured and refused: two nodes, 144 running pods, a
# 110-pod ceiling each, so one node's pods do not fit on the other and a third node is capacity
# we are not buying.
#
# Bump the value to roll these workloads again.
patches:

