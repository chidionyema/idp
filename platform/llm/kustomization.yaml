apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - namespace.yaml
  - external-secret.yaml
  - postgres.yaml
  - litellm.yaml
  - availability.yaml
  - httproute.yaml
configMapGenerator:
  # The router config is the file, not a copy of it. tests/test_llm_row.py holds
  # platform/llm/config.yaml to llm/config.yaml model for model.
  - name: litellm-config
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: false
