# Postgres for the router's virtual keys and spend ledger (crew#284 CP2). Same shape as
# platform/backstage/base/postgres.yaml: a ClusterIP Service reachable only inside the
# namespace, the official alpine image reading POSTGRES_PASSWORD_FILE from a mounted Secret
# (secrets-not-from-env-vars). The password is the LITELLM_DB_PASSWORD key of the one vault
# entry litellm-upstream, the same key llm/litellm.yml uses on the laptop.
apiVersion: v1
kind: Service
metadata:
  name: litellm-db
  namespace: llm
  labels: { app.kubernetes.io/name: litellm-db, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: founder-model-router }
spec:
  type: ClusterIP
  clusterIP: None
  selector: { app.kubernetes.io/name: litellm-db }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-db
  namespace: llm
  labels: { app.kubernetes.io/name: litellm-db, app.kubernetes.io/part-of: idp }
spec:
  serviceName: litellm-db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: litellm-db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: litellm-db, app.kubernetes.io/part-of: idp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # postgres uid in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6-alpine
          env:
            - { name: POSTGRES_USER, value: litellm }
            - { name: POSTGRES_DB, value: litellm }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/litellm/upstream/LITELLM_DB_PASSWORD }
          ports:
            - { containerPort: 5432, name: pg }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "litellm", "-d", "litellm"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "litellm", "-d", "litellm"] }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: upstream, mountPath: /run/secrets/litellm/upstream, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: upstream
          secret: { secretName: litellm-upstream }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
