# GENERATED by bin/idp-vendor-render -- vendor lanes and fallback chains come from
# platform/vendors/consoles.yaml (`router:` blocks), everything else from platform/llm/config.base.yaml.
# Edit those two, never this file; bin/idp-ci fails when this file and a fresh render differ.
# LiteLLM config for the cluster. Every hosted model here is the same entry as llm/config.yaml
# (tests/test_llm_row.py diffs them); what is missing is on purpose:
#   - the ollama* entries: they point at the founder's Mac (host.docker.internal), which the
#     cluster cannot reach. The free local lane stays on the laptop compose.
#   - the ollama fallbacks, for the same reason.
# `vision` is an alias so photo intake names a capability, not a vendor (crew#284 CP1).

model_list:
  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 300

  # --- the moat's cheap primary --------------------------------------------------------
  # MiniMax has no first-class LiteLLM provider; it is OpenAI-compatible, so it is declared
  # with an explicit api_base rather than a provider prefix.
  - model_name: minimax
    litellm_params:
      model: openai/MiniMax-M2
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      max_tokens: 8192
    model_info:
      # crew#506 CP1: the router refuses an oversized turn before it leaves the estate.
      # MiniMax-M2 context window is 204,800 tokens; a turn above it 400s here instead of
      # walking the fallback chain into unfunded lanes (the 2026-08-27 Telegram outage).
      max_input_tokens: 204800

  # The failover tier: same account and adapter, different model. It is a failover, never
  # a routing choice — see prospector config.yaml on `minimax_m27`.
  - model_name: minimax_m27
    litellm_params:
      model: openai/MiniMax-Text-01
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300

  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 300

  # The two neutral lane names. They used to be declared on the anthropic row, which is
  # gone, and a caller must be able to ask for a capable model or a cheap one without
  # naming a vendor (LAW 34, founder 2026-09-04: "we supposoed to be provider agnostic").
  # They sit on Gemini because that account is bought direct and verified in the
  # 2026-09-04 09:48Z apply run; the fallback chains below take them off Google the
  # moment it refuses. Model ids from https://ai.google.dev/gemini-api/docs/models.
  - model_name: default
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
      timeout: 300
      max_tokens: 8192
    model_info:
      max_input_tokens: 1048576

  - model_name: fast
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 300
      max_tokens: 8192
    model_info:
      max_input_tokens: 1048576

  # The research worker ranks what it scraped with an embedding model, and the router is
  # the only door to a model (LAW 34, crew#659 CP3). It read that model through OpenRouter
  # until 2026-09-04, when the founder ruled the estate buys model capacity direct and
  # never through a reseller; Google sells this one direct on the key the lanes above
  # already use. `dimensions: 1536` keeps the vector width the OpenRouter row produced, so
  # a store sized for it needs no migration -- but the two models are different spaces, and
  # anything embedded before today has to be embedded again to be comparable. Model id from
  # https://ai.google.dev/gemini-api/docs/embeddings (read 2026-09-04).
  - model_name: embed
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
      dimensions: 1536
      timeout: 120
    model_info:
      mode: embedding

  - model_name: vision
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 300

  # Founder 2026-08-30, verbatim: "we test with MiniMax see what the image quality is like, then
  # we use Gemini for the ones that will ship to production". So there are two image lanes, and
  # the reason they are shaped differently is a vendor fact, not a preference:
  #
  #   image           this row. Gemini is a first-class LiteLLM lane, so callers ask the router
  #                   for "image" by capability and never name Google.
  #   /minimax/image  a pass-through in general_settings below. LiteLLM v1.98.0 has no MiniMax
  #                   image provider (docs.litellm.ai/docs/image_generation lists OpenAI, Azure,
  #                   Google AI Studio, Vertex, Bedrock, Recraft, OpenRouter, Nscale, Xinference,
  #                   read 2026-08-30), and OpenRouter does not resell it either: every
  #                   minimax/* row on openrouter.ai/api/v1/models is output_modalities ["text"]
  #                   (measured 2026-08-30). MiniMax's own /v1/image_generation is the only door.
  #
  # Model id from https://ai.google.dev/gemini-api/docs/image-generation (read 2026-08-30), where
  # gemini-2.5-flash-image is marked legacy. It is newer than this LiteLLM's price map, so a call
  # on this lane traces with a zero cost until the image ships and the map catches up; spend is
  # still capped by general_settings.max_budget like every other lane.
  - model_name: image
    litellm_params:
      model: gemini/gemini-3.1-flash-image
      api_key: os.environ/GEMINI_API_KEY
      timeout: 300

router_settings:
  fallbacks:
    # crew#506 CP1 (2026-08-27): the first hop is the other funded direct vendor. OpenRouter sat
    # at ~2,400 tokens of credit and Google prepaid was empty, so the crew#284 order (OpenRouter
    # first) walked every turn through 402/429 before reaching a lane that answers. Consensus
    # still survives any one account dry. Every chain not headed by the cheap model ends in it
    # (sovereign cp30). The OpenRouter lanes stay in model_list for crew#506 CP4 (free lanes,
    # job aliases) but sit in no chain while the account is unfunded: a hop that always
    # answers 402 is latency, not redundancy.
    # 2026-09-04 19:55Z, measured direct at each vendor from the laptop with this router out
    # of the path: DeepSeek answers 401 (the key is revoked at the vendor -- the byte-identical
    # key prospector holds fails the same way), and MiniMax answers 429 `rate_limit_error`
    # "Token Plan usage limit reached ... (2056)", request id 06ea54a72199e6818ce20d8bf90b4102
    # (the key authenticates; that account's plan is spent). Those two were each other's only
    # fallback, so a cheap turn walked deepseek -> minimax -> deepseek and died. Gemini
    # answered HTTP 200 in the same sweep, so every chain now ends in a lane that was measured
    # answering rather than in a two-node cycle of dead ones -- the same rule the note above
    # already states, applied to the pair that has since gone dark: a hop that always fails is
    # latency, not redundancy. Nothing here changes a credential.
    - deepseek: [minimax, gemini]

    - minimax: [deepseek, gemini]

    - gemini: [minimax, deepseek]
    - default: [minimax, deepseek, gemini]
    - fast: [minimax, deepseek, gemini]

  # Alias, not a model row (R75, founder 2026-09-03). The Kimi lane is console-owned: the
  # founder brought the key through the LiteLLM console on 2026-09-04 and it is stored
  # encrypted in litellm-db under the vendor's own name, `moonshot/kimi-k3`. Rendering a
  # `kimi` row here would lock that name in the config file and the console would then refuse
  # to attach a key to it ("defined in config"), which is the failure he hit the day before.
  # An alias carries no credential and declares no model, so it cannot lock anything -- it
  # only spares every caller from hardcoding a vendor path that changes when the vendor
  # ships k4. Probed 2026-09-04 05:47Z from inside the litellm pod: `moonshot/kimi-k3`
  # answers HTTP 200 in 30.5s, while `kimi` answered HTTP 400 "Invalid model name".
  model_group_alias:
    kimi: moonshot/kimi-k3
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 60
  # One memory for the two router pods (founder 2026-09-03): cooldowns, rate counts and spend
  # windows live in the shared cache, so what one pod learns the other honours. The password
  # is exported by the pod from the litellm-cache mount (litellm.yaml), never typed here.
  redis_host: litellm-cache.llm.svc
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  callbacks: ["otel"]
  # Every routed call lands in Langfuse (platform/observability) as a trace, whatever product made
  # it: tracing at the router is the one instrument, not one SDK per product (crew#325 showcase).
  # Keys arrive as env from the litellm-langfuse ExternalSecret; LANGFUSE_HOST is set in litellm.yaml.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  drop_params: true
  turn_off_message_logging: true
  # Bounded answer reuse (the containment set the founder approved 2026-09-03): exact-match
  # only, a five-minute life, per-call opt-out honoured ({"cache": {"no-cache": true}}), and
  # every reuse is marked in the trace, never silent.
  cache: true
  cache_params:
    type: redis
    host: litellm-cache.llm.svc
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # crew#400: the founder picks and adds models in the Admin UI at llm.<zone>/ui, not by PR (LAW 31).
  # Models added there are rows in litellm-db and survive a restart; this model_list stays the floor.
  # The console signs in through the estate identity domain (GENERIC_* env from the litellm-sso
  # mount, external-secret.yaml); no console password exists (crew#408, ADR 0007).
  store_model_in_db: true
  max_budget: 5.0
  budget_duration: 1d
  background_health_checks: false
  # The MiniMax half of the founder's 2026-08-30 ruling. MiniMax's image API is not
  # OpenAI-shaped -- POST https://api.minimax.io/v1/image_generation, body {model, prompt,
  # aspect_ratio, n, response_format}, answer data.image_base64
  # (https://platform.minimax.io/docs/guides/image-generation, read 2026-08-30) -- so it cannot
  # be a model_list row. A pass-through forwards the vendor's own shape and puts the key in the
  # header from the mounted secret, which keeps LAW 34 whole: the caller holds a router virtual
  # key, never MINIMAX_API_KEY.
  #
  # `auth: true` is what makes that true, and it is free on this version. It used to be an
  # enterprise flag; in v1.98.0 _register_pass_through_endpoint attaches Depends(user_api_key_auth)
  # and adds the path to LiteLLMRoutes.openai_routes for everyone
  # (litellm/proxy/pass_through_endpoints/pass_through_endpoints.py:2802-2812 at tag v1.98.0).
  # Without it this path would forward anything the internet sent to llm.<zone>, spending the
  # MiniMax account with no key at all, so the flag is load-bearing and not a default.
  pass_through_endpoints:
    - path: /minimax/image
      target: https://api.minimax.io/v1/image_generation
      auth: true
      methods: ["POST"]
      headers:
        Authorization: Bearer os.environ/MINIMAX_API_KEY
        content-type: application/json
      timeout: 120
