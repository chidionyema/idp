# The upstream API keys and the master key, one JSON secret in the estate vault named
# `litellm-upstream`. Put there once from the operator's env file (values never printed):
#
#   ESTATE_ENV_FILE=~/dev/code/idp/llm/.env bin/idp-vault-put litellm-upstream \
#     MINIMAX_API_KEY=MINIMAX_API_KEY DEEPSEEK_API_KEY=DEEPSEEK_API_KEY \
#     OPENROUTER_API_KEY=OPENROUTER_API_KEY GEMINI_API_KEY=GEMINI_API_KEY \
#     GROQ_API_KEY=GROQ_API_KEY LITELLM_MASTER_KEY=LITELLM_MASTER_KEY
#
# One more key later (crew#506 CP4): `bin/idp-vault-put --merge litellm-upstream GROQ_API_KEY=GROQ_API_KEY`
# overlays that key on the entry the vault holds; the oke-check apply step runs exactly that from
# whichever SEED_* repository secrets are set, so a new provider never means re-seeding every key.
# crew#568 phase 1: `bin/idp-bootstrap-vendors` writes ANTHROPIC_API_KEY=ANTHROPIC_API_KEY here from
# SEED_ANTHROPIC_API_KEY (platform/vendors/consoles.yaml, target litellm-upstream); the claude lanes read it.
# Kimi (2026-09-02): the same bootstrapper writes MOONSHOT_API_KEY=MOONSHOT_API_KEY here from
# SEED_KIMI_API_KEY; the kimi lane reads it.
#
# The pod mounts the Secret as files and exports them itself (litellm.yaml command), which is what `os.environ/...` in
# config.yaml resolves. No key is typed anywhere in this repository (LAW 46).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-upstream
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: litellm-upstream, creationPolicy: Owner }
  dataFrom:
    - extract: { key: litellm-upstream }
---
# The Langfuse project keys, the same two vault entries platform/observability/langfuse.yaml
# initialises Langfuse with, renamed to what the litellm `langfuse` callback reads from env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-langfuse
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: litellm-langfuse
    creationPolicy: Owner
    template:
      data:
        LANGFUSE_PUBLIC_KEY: "{{ .public_key }}"
        LANGFUSE_SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: public_key
      remoteRef: { key: langfuse-init-public-key }
    - secretKey: secret_key
      remoteRef: { key: langfuse-init-secret-key }
---
# crew#408: the Admin UI (llm.<zone>/ui) signs in through the estate identity domain (ADR 0007), the
# same login as the catalogue. The three values are written by platform/oci/identity (tofu, app
# estate-router-console), never by a person: no console password exists, nothing is seeded, nothing
# is ever sent. The container exports every mounted file, so LiteLLM reads them as GENERIC_* env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-sso
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: litellm-sso, creationPolicy: Owner }
  data:
    - secretKey: GENERIC_CLIENT_ID
      remoteRef: { key: litellm-sso-client-id }
    - secretKey: GENERIC_CLIENT_SECRET
      remoteRef: { key: litellm-sso-client-secret }
    - secretKey: PROXY_ADMIN_ID
      remoteRef: { key: litellm-sso-admin-id }
