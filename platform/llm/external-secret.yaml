# The upstream API keys and the master key, one JSON secret in the estate vault named
# `litellm-upstream`. Put there once from the operator's env file (values never printed):
#
#   ESTATE_ENV_FILE=~/dev/code/idp/llm/.env bin/idp-vault-put litellm-upstream \
#     MINIMAX_API_KEY=MINIMAX_API_KEY DEEPSEEK_API_KEY=DEEPSEEK_API_KEY \
#     OPENROUTER_API_KEY=OPENROUTER_API_KEY GEMINI_API_KEY=GEMINI_API_KEY \
#     LITELLM_MASTER_KEY=LITELLM_MASTER_KEY
#
# One more key later (crew#506 CP4): `bin/idp-vault-put --merge litellm-upstream <NAME>=<NAME>`
# overlays one key on the entry the vault holds; the oke-check apply step runs exactly that from
# whichever SEED_* repository secrets are set, so a new provider never means re-seeding every key.
# Anthropic (2026-09-04, founder "estate will never use antropic api keys ... final and end of"):
# no Anthropic key rides this entry and none ever will. The claude and claude-fast lanes are gone;
# the neutral `default` and `fast` lanes replace them and are served by Gemini today. Claude itself
# reaches the estate through the Claude Max monthly subscription, by `claude -p`, never by API.
# Kimi (2026-09-03, R75): the kimi lane is console-owned — its key lives encrypted in litellm-db,
# brought in through the console's LLM Credentials tab (docs/how-to/onboarding/litellm.md), so no
# Moonshot key rides this entry today. The seed road (SEED_KIMI_API_KEY, probed across the three
# Kimi hosts) stays in platform/vendors/consoles.yaml for when a lane is git-owned again.
#
# The pod mounts the Secret as files and exports them itself (litellm.yaml command), which is what `os.environ/...` in
# config.yaml resolves. No key is typed anywhere in this repository (LAW 46).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-upstream
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: litellm-upstream, creationPolicy: Owner }
  dataFrom:
    - extract: { key: litellm-upstream }
---
# The Langfuse project keys, the same two vault entries platform/observability/langfuse.yaml
# initialises Langfuse with, renamed to what the litellm `langfuse` callback reads from env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-langfuse
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: litellm-langfuse
    creationPolicy: Owner
    template:
      data:
        LANGFUSE_PUBLIC_KEY: "{{ .public_key }}"
        LANGFUSE_SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: public_key
      remoteRef: { key: langfuse-init-public-key }
    - secretKey: secret_key
      remoteRef: { key: langfuse-init-secret-key }
---
# crew#408: the Admin UI (llm.<zone>/ui) signs in through the estate identity domain (ADR 0007), the
# same login as the catalogue. The three values are written by platform/oci/identity (tofu, app
# estate-router-console), never by a person: no console password exists, nothing is seeded, nothing
# is ever sent. The container exports every mounted file, so LiteLLM reads them as GENERIC_* env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-sso
  namespace: llm
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: litellm-sso, creationPolicy: Owner }
  data:
    - secretKey: GENERIC_CLIENT_ID
      remoteRef: { key: litellm-sso-client-id }
    - secretKey: GENERIC_CLIENT_SECRET
      remoteRef: { key: litellm-sso-client-secret }
    - secretKey: PROXY_ADMIN_ID
      remoteRef: { key: litellm-sso-admin-id }

---
# PoBR enforcement: the agent public key for verifying receipt signatures.
# The private key lives at ~/.estate/keys/agent.pem (never in the vault, never in git).
# The gate (platform/llm/callbacks/pobr_gate.py) reads /etc/litellm/keys/agent.pub.pem.
# Vault entry: litellm-keys / LITELLM_POBR_AGENT_PUB_KEY (seeded above).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-pobr-agent-key
  namespace: llm
spec:
  refreshInterval: 24h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: litellm-pobr-agent-key
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The filename is what the gate's AGENT_KEY_PATH resolves to.
        agent.pub.pem: "{{ .LITELLM_POBR_AGENT_PUB_KEY }}"
  data:
    - secretKey: LITELLM_POBR_AGENT_PUB_KEY
      remoteRef:
        key: litellm-keys
        property: LITELLM_POBR_AGENT_PUB_KEY
