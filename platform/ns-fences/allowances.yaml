# The input data for bin/idp-ns-fence-gen (crew#839). Every fence in this directory is generated
# from this file plus measured.json; nothing here is hand-written per namespace, which is what the
# founder meant by one shot (~/.claude/docs/founder/2026-09-04T1753Z-we-nder-that-constraint-a-professional-team-shifts-30a728b9.md).
#
# Change a number here and re-run the generator. Never edit a generated file: the next run
# overwrites it, and the run is byte-identical when nothing here changed.

# How a ceiling is derived from what a namespace actually asks for today. measured.json holds the
# reading (kubectl get pods -A, 2026-09-04, 37 namespaces); the headroom is what a namespace may
# grow into before the quota refuses it, and the floor is the smallest ceiling any namespace gets
# so a two-pod namespace is not fenced into its current shape.
sizing:
  headroom:
    cpu: 3.0
    memory: 2.5
    pods: 3.0
  floor:
    cpu_millicores: 500
    memory_mib: 1024
    pods: 10

# A quota that counts requests.cpu makes every pod that declares no cpu request unschedulable,
# refused with "must specify limits.cpu" -- a fence that refuses correct work is an outage
# (LAW 38). The LimitRange supplies the missing request so that never happens. It deliberately
# sets no default LIMIT: 42 containers across 15 namespaces run today with no memory limit, and
# handing them one would OOM-kill whichever of them uses more than the default. For the same
# reason the quota counts requests and pods only, never limits.
default_request:
  cpu: 25m
  memory: 64Mi

# Namespaces that get no fence, each with the reason it is exempt rather than missed.
exempt:
  kube-system: "the cluster's own control plane; a quota here is Oracle's to set, not ours"
  kube-public: "empty by design"
  kube-node-lease: "holds only Lease objects, no pods"
  default: "nothing of ours runs here; a workload appearing here is the defect, not the quota"
  flux-system: "the estate's only writer of the cluster. A quota that refuses a Flux controller
    pod locks the cluster out of its own repair path, including the pull request that would
    raise the quota. Fenced by hand, deliberately, or not at all."
  cyrus: "already carries all four fences beside its own workload, in platform/cyrus/namespace.yaml.
    A second generated quota and default-deny in the same namespace is not a stronger fence, it is
    two ceilings where the tighter one silently wins."
  jit: "already carries all four fences in platform/jit/fence.yaml, and two of its NetworkPolicies
    are named allow rules this generator cannot express -- the-broker-reaches-the-api-server-and-telegram
    and the-one-that-may-speak-to-the-broker. Folding it in means rewriting the broker's own fence,
    which is WJ.8 and the founder's review, not a green check."

# Where a namespace was deliberately tuned by hand before this generator existed, its intent moves
# here rather than being lost. `hard` is merged into that namespace's quota after the sizing above,
# so a deliberate ceiling beats a derived one; `max` adds a per-container ceiling to its LimitRange.
overrides:
  staging:
    # A staging copy of a product can never crowd out production on the shared node, and staging is
    # reached over Tailscale only, so it may not ask for a public load balancer.
    hard:
      requests.cpu: "1"
      requests.memory: 2Gi
      requests.storage: 2Gi
      services.loadbalancers: "0"
  research:
    # The research engine had no pod running when the estate was measured, so the derived ceiling
    # would be the floor -- ten pods. It fans lanes out as jobs, so the floor is the wrong shape
    # for it and a quota is not the place to discover that. Sized for a wide fan-out instead.
    hard:
      requests.cpu: "2"
      requests.memory: 4Gi
      pods: "40"
  monitoring:
    # The derived ceiling was read on 2026-09-04, while Prometheus was dead -- Kyverno had been
    # refusing the operator's StatefulSet since 2026-08-28 -- so the reading saw four small pods
    # and fenced the namespace into the shape of its own outage. When the StatefulSet was finally
    # allowed through on 2026-09-05 the pod was refused a second time, by this quota:
    #   Warning FailedCreate statefulset/prometheus-kps: pods "prometheus-kps-0" is forbidden:
    #   exceeded quota: ns-ceiling, requested: requests.memory=800Mi, used: requests.memory=432Mi,
    #   limited: requests.memory=1Gi
    # Sized for what actually runs here: 432Mi standing (Alertmanager, kube-state-metrics,
    # blackbox, the operator) plus the 800Mi Prometheus asks for is 1232Mi, and 2Gi leaves room
    # for the surge pod of a Prometheus rollout without another outage. CPU likewise: 140m
    # standing plus 200m for Prometheus and its reloader sat 20m under the old 500m ceiling.
    hard:
      requests.cpu: "1"
      requests.memory: 2Gi
  otto-golden:
    # Two replicas plus one surge pod during a rolling update: sized for three, so a rollout is
    # never forbidden by its own quota (the main-62 roll wedged on exactly that).
    hard:
      requests.cpu: 200m
      requests.memory: 384Mi
      pods: "5"
    max: { cpu: 500m, memory: 512Mi }
  commerce:
    # The money layer was switched on on 2026-09-04 and had never been measured, so the derived
    # ceiling would be the floor -- 500m and ten pods -- and the floor would refuse the layer on
    # the day it was switched on, which is a fence refusing correct work (LAW 38). Sized from what
    # platform/commerce actually declares instead: 775m across Lago's eight components plus 50m
    # for the Valkey queue, 2816Mi plus 128Mi, and eleven pods with the migrate Job among them.
    # The headroom above that is one rolling update, not room to grow into.
    hard:
      requests.cpu: "1500m"
      requests.memory: 6Gi
      requests.storage: 2Gi
      pods: "20"
      services.loadbalancers: "0"   # the money layer is reached through the shared Gateway or not at all

# Declared cross-namespace traffic. Derived from a scan of every manifest in platform/ for
# <service>.<namespace>.svc references, then extended by hand where a flow does not appear as a
# hostname in a manifest. THIS DATA IS NOT COMPLETE AND IS KNOWN NOT TO BE: a scan cannot see a
# flow that arrives through a secret, an operator's client-go call to the API server, or
# Prometheus scraping a namespace it monitors. The generated NetworkPolicies ARE applied now
# (Calico has been the enforcement layer since crew#839), so a flow missing from this file is a
# flow that stops. hindsight was exactly that on 2026-09-05: it had an ingress_from list and no
# egress key at all, while estate-db's own ingress_from already named it. Correct this file from
# what a denial names -- Calico's flow log and the namespace's own pod log -- and re-run the
# generator; never hand-edit network/.
#
# Every namespace additionally gets DNS egress to kube-system and OTLP egress to the collector in
# observability (LAW 50); those two are in the generator, not repeated per namespace here.
flows:
  # The sandbox shop is reached at sandbox.${ESTATE_ZONE} through the gateway in edge. That intent
  # was written in platform/sandbox/vcluster/network-policy.yaml (allow-ingress-from-edge, 8080),
  # but that kustomization is not reconciled -- measured 2026-09-08, demo-sandbox held 0
  # NetworkPolicies on the cluster -- so a default-deny arriving from here with nothing carrying
  # the allow would cut the route. It is declared here, where the fence that denies is written.
  demo-sandbox:
    ingress_from: [edge]
  trivy-system:
    # The operator and its scan jobs (scanJobsInSameNamespace: false, so they land here too) pull
    # the vulnerability database from a public registry mirror (mirror.gcr.io); declared here so
    # the fence still says yes the day this cluster runs a CNI that enforces it.
    egress_internet: [443]
  backstage:
    # robusta: the portal's Investigate page asks HolmesGPT a question through the backend's
    # own proxy plugin, so the conversation is backstage -> robusta and it is declared on both
    # sides. On 2026-09-05 hindsight was cut off from its own database because only one side
    # of the same conversation had been written down; that is not repeated here.
    # estate-db: the catalogue plugin's own Postgres (crew#102 follow-up, 2026-09-06: the enforced
    # replica on node-159 hung in its 14-plugin startup because the fence had never declared it).
    # tailscale: "Pair my phone" reaches Sunshine on the Mac through the operator's egress
    # proxy, which runs in that namespace (platform/backstage/overlays/oke/sunshine-egress.yaml).
    egress: [dagster, estate-db, identity, kyverno, robusta, tailscale]
    ingress_from: [edge]
    # api.github.com. The portal's buttons are scaffolder templates whose one step is
    # `github:actions:dispatch`, and the catalogue also ingests entities and TechDocs over the
    # same API. Measured 2026-09-07 in scaffolder.task_events on database `backstage`: the
    # founder's own press of Launch the buyer sandbox, task 5764b629-99ba-4ad8-ad1f-7cfc7c129c42
    # at 08:54:43Z, died with `HttpError: Connect Timeout Error (attempted address:
    # api.github.com:443, timeout: 10000ms)`, and six of the last seven run-demo-sandbox tasks
    # failed the same way. Every button on the portal was dead from the moment Calico began
    # enforcing the default-deny that flannel ignored. Same class as hermes-agent (PR 2107).
    egress_internet: [443]
    # cluster-state and rotation-canary write their receipts to Object Storage as the node.
    egress_metadata: true
  guacamole:
    # tailscale: the estate Mac's screen is reached over the tailnet through the operator's
    # egress proxy in that namespace (Service founder-mac-vnc).
    egress: [identity, tailscale, estate-db]
    ingress_from: [edge, monitoring]
  healing:
    egress: [llm]
  healthchecks:
    egress: [identity, estate-db]
    ingress_from: [edge]
  hermes-agent:
    # mcp: Otto is the estate's Telegram door, and the agentgateway in the mcp namespace is the
    # one place he reads estate state and now asks HolmesGPT (mcp/plugins/estate_holmes.py).
    # The key for it is already mounted (platform/hermes-agent/mcp-key.yaml, ESTATE_MCP_KEY);
    # hermes-v2 config.yaml names the server. Both directions declared, as everywhere else.
    # edge: the estate map this gateway renders (platform/hermes-agent/estate.yaml) probes the
    # store on ${ESTATE_ZONE} and its API on api.${ESTATE_ZONE}. Both resolve to 193.123.184.22,
    # which is this estate's own traefik LoadBalancer, and a LoadBalancer address is programmed
    # into every node -- so the request is delivered to a traefik pod at 10.244.x.x and judged as
    # pod-to-pod egress, never as internet egress. egress_internet below excludes 10.0.0.0/8 by
    # design, so the 443 line does not carry it. Same arithmetic that cut the identity namespace's
    # front-door pulse, where it was measured; here it is the fence being made to match the config
    # before a pod is rolled onto Calico, not a failure observed in this namespace's logs.
    egress: [hindsight, observability, mcp, edge]
    # The Tailscale sidecar logs in to controlplane.tailscale.com and relays over DERP on 443,
    # and the gateway calls api.telegram.org and the router's public door on the same port.
    # Without this the sidecar times out on `tailscale up` and the pod never goes Ready
    # (2026-09-06: 4 restarts, `dial log.tailscale.com:443: i/o timeout`).
    egress_internet: [443]
    ingress_from: [edge]
  # The `laws` container fetches the estate's own laws over https from the code host
  # (platform/agent-workforce/cronjob.yaml line 97) and the crew that reads them refuses to
  # boot without them. Undeclared, that hop was one enforcement wave away from a silent
  # outage: this namespace renders default-deny and rendered no allow-internet-egress, and
  # #2439 is what made twelve namespaces' fences real rather than decoration.
  agent-workforce:
    egress: [observability, llm]
    egress_internet: [443]
  keda:
    egress: [observability]
  llm:
    # estate-db: the router mints budgeted virtual keys and writes every call to a spend ledger
    # in postgres `litellm` (platform/llm/litellm.yaml composes DATABASE_URL against
    # estate-rw.estate-db). estate-db already named llm in its ingress_from, but this side never
    # named estate-db, and a one-sided declaration is a closed door: on 2026-09-07 the router
    # could not roll at all -- every new pod died on `httpx.ConnectError: All connection attempts
    # failed` inside Prisma's startup health check, while two pods that predated the fence kept
    # serving on a ConfigMap Flux had already pruned.
    # notify: the spend breaker's hourly digest posts to apprise.notify when a lane's velocity
    # crosses its band (platform/llm/spend-breaker-digest.yaml:52). A breaker that cannot reach
    # the notifier is a breaker nobody hears, so the failure mode of leaving this undeclared is
    # silent overspend, not a visible error.
    egress: [observability, estate-db, notify]
    # The router's whole job is calling a model vendor's API; declared here so the fence
    # still says yes on the day this cluster runs a CNI that enforces it.
    egress_internet: [443]
    # research: the hourly research engine sends every lane's prompt through the router
    # (platform/research-engine/cronjob.yaml:105, LITELLM_BASE_URL).
    ingress_from: [edge, healing, agent-workforce, mcp, hindsight, otto-gateway, robusta, research]
  research:
    # The research engine is an hourly CronJob (platform/research-engine/cronjob.yaml, schedule
    # "23 * * * *"), so it holds no long-lived pod and nothing here was measured from one. Every
    # hop below is read off the environment the job's own container is given: estate-db is the
    # ledger it writes (PG=...@estate-rw.estate-db, line 87), llm is the router it prompts
    # (LITELLM_BASE_URL, line 105), searxng is the search it reads (RESEARCH_SEARXNG_URL,
    # line 106). A CronJob is the worst shape for a fence gap: each run is a fresh pod, so it
    # lands on the enforcing CNI the first time it fires after the roll, and it fails on its own
    # at 23 minutes past some hour with nobody watching.
    egress: [estate-db, llm, searxng]
  searxng:
    ingress_from: [research]
  mcp:
    # robusta: the estate MCP server hosts the ask_holmes tool (mcp/plugins/estate_holmes.py),
    # which is how an agent -- an assistant session, Otto on Telegram -- asks the investigator
    # a question. Both directions declared, as above.
    egress: [observability, hindsight, robusta, llm]
    # The server does not ship its data. Both init containers run `flux pull artifact
    # oci://ghcr.io/chidionyema/idp/estate-db` (platform/mcp/estate-mcp.yaml), so the pod itself
    # dials the public internet before the server starts -- this is not an image pull, which the
    # kubelet performs on the node and no pod policy sees. Measured 2026-09-08T00:39Z: pod
    # estate-mcp-6cb8dd5b87-8gnpt, created onto Calico, sat in CrashLoopBackOff on
    # `fetch-estate-db` with the single log line "pulling artifact from
    # ghcr.io/chidionyema/idp/estate-db:latest" and no result, while the mcp fence rendered no
    # allow-internet-egress at all.
    egress_internet: [443]
    ingress_from: [edge, hermes-agent, otto-gateway]
  monitoring:
    # edge: Alertmanager and Prometheus are reached through the gateway, which is why edge has
    # admitted monitoring since the fence was written -- but this side never said so, and a
    # half-declaration is a deny on the wire.
    egress: [guacamole, robusta, edge]
    # dagster: the scheduler reads Alertmanager's firing alerts to decide there is
    # anything worth investigating at all.
    ingress_from: [observability, edge, dagster, robusta]
  observability:
    egress: [monitoring, identity, estate-db]
    # telemetry-coverage, science-facts and the Langfuse alert drill each write a receipt to
    # Object Storage as the node.
    egress_internet: [443]
    egress_metadata: true
    ingress_from: [edge, monitoring]
  observability-agent:
    egress: [observability]
  tailscale:
    # The operator's egress proxies are the only way anything in the cluster reaches the
    # founder's Mac. Both doors on to it are declared on the other side too.
    ingress_from: [backstage, guacamole]
    # The JIT broker's ingress proxy: the operator runs it here, and it dials jit-broker:8080
    # in namespace jit. platform/jit/fence.yaml declares the same door from the far side.
    egress: [jit]
    egress_internet: [443]
  otto-golden:
    egress: [observability, hindsight]
    ingress_from: [edge]
  otto-gateway:
    # llm is the estate's model router, and it is on the answering path twice over: the
    # judgment and answer lanes, and (from 2026-09-05) the embedding call the memory
    # engine's vector arm makes on every recall. The namespace's own policy had an
    # egress rule for it already; the router's side did not name this namespace, so a
    # default-deny would have refused the conversation at the far end -- the same
    # one-direction-only defect recorded on the hindsight block below.
    # mcp: step 5 of the build, the estate MCP (agentgateway.mcp.svc:3000) for the estate* tools.
    # It was hand-added to the generated file and not here, so the next regen deleted it.
    egress: [observability, event-bus, estate-db, hindsight, llm, mcp]
    # The answering lane calls api.telegram.org to deliver a reply, and the registration
    # reconciler calls the same host to keep the webhook pointed at this namespace's door.
    # Without this the fence is a silent gag on every answer Otto sends.
    egress_internet: [443]
    ingress_from: [edge]
  identity:
    # oauth2-proxy redeems every login code against the Oracle identity domain, a public name
    # over 443. The front door's pulse (platform/identity/front-door-heartbeat.yaml) asks the
    # catalogue's public address for its 302, and that one is not a public destination at all
    # from in here, which is why `egress_internet` alone never carried it.
    #
    # Measured 2026-09-07: the catalogue's name resolves to 193.123.184.22, which is this
    # estate's own Traefik LoadBalancer (`svc/traefik -n edge`). A Service's load-balancer
    # address is programmed into every node, so a pod dialling it is sent straight to a traefik
    # pod on the cluster network and never leaves for the load balancer. The policy the pulse
    # is judged against is therefore the one for namespace `edge`, not the internet rule -- and
    # `allow-internet-egress` excludes 10.0.0.0/8 by design, so it cannot match either.
    #
    # Two angles, from one run of the pulse (front-door-heartbeat-29813565-npblb, 20:45:02Z):
    # the curl to the catalogue timed out at 20 seconds, and in the same container the receipt
    # upload to OCI object storage over 443 succeeded. Internet egress on 443 works; only this
    # estate's own address fails. Same one-direction-only class as backstage and otto-gateway
    # above, and `edge` names identity in its own ingress_from for the return half.
    #
    # What is NOT claimed here: that this is why the pulse first went red. Its last success is
    # 2026-09-06T08:00:21Z and calico-node's pods were created 2026-09-06T20:02:19Z, twelve
    # hours later, so the fence gap is a second cause and the first one is still unexplained.
    # An earlier version of this comment asserted the 08:00 break WAS Calico beginning to
    # enforce; nothing had measured that.
    egress: [observability, edge]
    egress_internet: [443]
    egress_metadata: true
    ingress_from: [edge, backstage, guacamole, healthchecks, observability]
  dagster:
    # The scheduler is what makes HolmesGPT active (scheduler/estate_scheduler/holmes_watch.py):
    # it reads what is firing from Alertmanager in monitoring, asks the investigator in robusta,
    # and publishes the answer through Apprise in notify. Both directions of each of those three
    # conversations are declared -- on 2026-09-05 hindsight was cut off from its own database
    # because only one side was.
    egress: [monitoring, robusta, notify, estate-db, observability]
    ingress_from: [edge, backstage]
  hindsight:
    # Every surface that remembers: both Otto doors write from the answering lane
    # (hermes-v2 otto/memory/hindsight.py) and estate-mcp serves the same bank to crew, the
    # agent classes and k8sgpt over the remember/recall tools.
    #
    # The egress side was missing until 2026-09-05, while estate-db.ingress_from below already
    # named hindsight -- one direction of the same conversation was declared and the other was
    # not, so a default-deny would have cut the memory service off from its own database.
    # estate-db is estate-rw.estate-db.svc.cluster.local:5432 (platform/hindsight/hindsight.yaml);
    # llm is the estate router it calls for HINDSIGHT_API_LLM_MODEL.
    egress: [estate-db, llm, observability]
    ingress_from: [hermes-agent, edge, otto-gateway, otto-golden, mcp]
  robusta:
    # The runner posts to Telegram, which is on the public internet, and HolmesGPT calls the
    # estate's own router and reads Prometheus. Declared here so the fence still says yes on the
    # day this cluster runs a CNI that enforces it -- the trap this estate is repeatedly warned
    # about is an AI tool that silently cannot reach its model because the namespace is default-deny.
    egress: [llm, monitoring, observability]
    egress_internet: [443]
    # mcp and backstage are the two front doors onto the investigator: the ask_holmes MCP tool
    # (agents, and Otto on Telegram through it) and the portal's Investigate page. monitoring is
    # the alert path that was already here, and dagster is the scheduler POSTing to
    # robusta-holmes /api/chat to start an investigation of its own.
    ingress_from: [monitoring, mcp, backstage, dagster]
  notify:
    # Apprise, the estate's publish-once-deliver-everywhere layer. It delivers to Telegram,
    # which is on the public internet. dagster: HolmesGPT's answer is published here.
    egress_internet: [443]
    ingress_from: [dagster, llm]
  event-bus:
    ingress_from: [otto-gateway, commerce]
  estate-db:
    # guacamole, healthchecks: both hold estate-rw in their own Deployment env (platform/
    # guacamole/env.yaml, platform/healthchecks/env.yaml), not only in the one-shot migration
    # Jobs -- these are standing daily diallers, and a database neither can reach is a service
    # that does not start.
    ingress_from: [backstage, otto-gateway, hindsight, temporal, llm, observability, commerce, dagster, research, guacamole, healthchecks]
  temporal:
    # 2026-09-06: estate-db-copy-temporal-r2 timed out on estate-rw from this namespace once Calico
    # enforced the fence; estate-db named temporal on its ingress side, this side named nothing.
    egress: [estate-db]
    # kini-state writes its receipt to Object Storage as the node, over the public endpoint,
    # proving who it is against the instance-metadata service first.
    egress_internet: [443]
    egress_metadata: true
  commerce:
    # Lago's ledger is database `lago` on the estate cluster, its queue is in this namespace, and
    # it publishes estate.commerce.order_paid to the bus. It reaches nothing else in the estate --
    # in particular it never dials prospector, which is the direction the firewall bans.
    egress: [estate-db, event-bus, observability]
  kyverno:
    ingress_from: [backstage]
  prospector:
    # The shared storefront. It is a served product, not an east-west caller: the Gateway's data
    # plane (edge, the traefik controller pods) dials into it to answer apex/www/api, and it is
    # banned from dialing the rest of the estate -- the commerce block above says the same in the
    # other direction. So it takes ingress from edge and no declared egress: the generator still
    # gives it DNS, the observability collector and the same-namespace hole automatically (the
    # store pods reach each other and their own database through that hole, and through nothing
    # else: measured 2026-09-06, without it store-web's call to store-api timed out). It was missing
    # from flows/ entirely, which left network/prospector.yaml a default-deny with no ingress
    # allow from anyone -- harmless only while a CNI lets east-west traffic through, and the moment
    # one enforces, the storefront answers 30s hangs the way this estate has already seen on the
    # CNI cutover (prospector-store-web/api on Calico 10.244.3.x unreachable from edge on flannel).
    ingress_from: [edge]
    # store-web renders the catalogue server-side by fetching its own public name,
    # https://api.mumchimp.com, which resolves to the load balancer's public address, not to a
    # namespace label. Measured 2026-09-06 21:00Z once the fences enforced: every page took 10.5 s
    # (traefik origin_ms=10746) because that fetch hit "ConnectTimeoutError api.mumchimp.com:443
    # timeout 10000ms" in the store-web log and the page rendered without it. One TCP port to the
    # public address space is the whole hole; private ranges stay cut out by the generator.
    egress_internet: [443]
    # store-db-backup writes the storefront's database dump to Object Storage as the node.
    egress_metadata: true
    # ... and that hole alone was not enough, measured 2026-09-06 21:17Z with it live: the
    # ConnectTimeoutError kept coming (3 in two minutes) and origin_ms stayed at 10529. The
    # load balancer's public address is a Service of type LoadBalancer, so kube-proxy rewrites
    # the destination to the traefik pod before Calico judges the packet, and a pod address is
    # private, which the internet hole cuts out by design. The flow is store-web -> edge, and
    # that is what it is declared as.
    egress: [edge]
  otto-gvisor-sandbox:
    ingress_from: [edge]
    # crew#892 CP4: the gVisor sandbox cell runs code a model wrote, so its fence is the cell
    # decree (zero-trust-boundary.md step 5) — default-deny, and the one declared app route is
    # the gateway (edge), so a sandboxed pod that is compromised cannot wander the estate; it
    # can only reach the front door it talks through and, automatically from the generator, its
    # own namespace, DNS, the API server and the LAW 50 collector. Deliberately NO egress to the
    # internet and NO other namespace: a fence that lets an untrusted-code pod onto the wider
    # estate is the exact isolation break step 6 grades. edge names this namespace back on its
    # ingress_from below, so the gateway accepts the return path — one-direction-only declarations
    # are the defect this estate has been bitten by twice.
    egress: [edge]
  edge:
    egress: [backstage, dagster, guacamole, healthchecks, hermes-agent, identity, llm, mcp,
             monitoring, observability, otto-gateway, otto-golden, hindsight, prospector,
             # crew#892 CP4: the gVisor sandbox cell's one declared app route is this gateway;
             # it must be named here or the return path is cut (the estate's repeated
             # one-direction-only defect: hindsight was cut from estate-db for exactly this).
             otto-gvisor-sandbox,
             # The sandbox shop's route: demo-sandbox admits edge, so edge must name it
             # back or the return path is cut -- the same one-direction-only defect.
             demo-sandbox]
    # The public listeners (traefik containerPorts web 8000 and websecure 8443, behind the OCI
    # load balancer with externalTrafficPolicy Local, so the source address is the client's).
    # The traefik pods still held flannel addresses when Calico started enforcing on 2026-09-06,
    # which is the only reason the estate stayed reachable; the first one rescheduled onto Calico
    # would have been unreachable from the internet with no rule here.
    ingress_public: [8000, 8443]
    # Prometheus scrapes the traefik metrics listener (9100) from monitoring. identity is here
    # for the front door's pulse: it dials the catalogue's public address, which every node
    # programs to land on a traefik pod rather than leave for the load balancer, so the request
    # arrives here as ordinary pod-to-pod traffic and a fence that does not name it drops it.
    ingress_from: [monitoring, otto-gvisor-sandbox, prospector, identity, hermes-agent]
