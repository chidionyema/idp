# The PriorityClasses on their own, before anything that names one (crew#488 CP5).
#
# They lived in platform/scheduling, a layer that waits on edge. Traefik in edge names
# infrastructure-critical, and the API server refuses a pod whose class does not exist
# yet, so on any fresh cluster (portability runs 33212542369 and 33212575403: "timeout
# waiting for Deployment/edge/traefik") edge could never come up and scheduling could
# never start: a deadlock the live cluster only escaped because the classes were created
# before that dependsOn was written. PriorityClass is cluster-scoped and needs nothing,
# so it is the first row of the tree after the CRD layers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - priorityclasses.yaml
