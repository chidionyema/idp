# The "radio room" rule (crew#539 CP2): if the ship is sinking the radio room floods last. Under
# CPU pressure the scheduler evicts ordinary pods to seat these; a runner or an app job may die,
# the visibility and the routing never do. Applied strictly (founder) to langfuse-web,
# langfuse-worker, mcp/agentgateway, hermes-agent-gateway, telemetry-coverage and cluster-state;
# require-priority-class.yaml refuses any of the six that drops it.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: infrastructure-critical
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "crew#539: monitoring and routing are seated before anything else on the node"
---
# The balloon (crew#539 CP1): the class the pause pods run under. Negative so every real pod
# outranks them, and preemptionPolicy Never so a balloon itself can never evict anything.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: balloon
value: -1
globalDefault: false
preemptionPolicy: Never
description: "crew#539: reserved headroom; preempted in milliseconds by any real workload"
---
# Scheduled platform work (crew#584 CP-I): a job that must finish but is not the radio room. Above
# the balloon so it is seated over reserved headroom, far below infrastructure-critical so it is the
# first real work evicted when the ship lists. The radio-room test refuses a job that borrows
# infrastructure-critical instead.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-batch
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "crew#584: nightly platform jobs; finish when the node is calm, yield to the radio room"
---
# Revenue (2026-09-09). The cross-node link was severed, the ingress path was pinned to one node,
# and the node that could serve had 32m of CPU free. Something had to be evicted for the storefront
# API's 100m, and the cluster's own answer was that nothing should be: observability/langfuse-worker
# held 1000m as infrastructure-critical, and prospector -- the product being sold -- ran at priority
# 0 with no class at all, below the nightly platform-batch jobs. mumchimp.com returned 000 to three
# requests in three while a trace processor whose own web front end was unreachable kept its seat.
#
# The radio-room rule still holds for routing and for the visibility you repair by: traefik and the
# gateways stay infrastructure-critical, and system-cluster-critical is untouched above this. What
# changes is that the thing a customer pays for is no longer the first thing the scheduler drops.
# It preempts, so a full node makes room for it rather than leaving the shop down.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: revenue-critical
value: 1500000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "2026-09-09: what a customer pays for outranks what we watch it with"
