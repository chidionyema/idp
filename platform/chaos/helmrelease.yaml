# ADR 0005. Applied by Flux once the OKE cluster exists (ADR 0004 step 3).
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 24h
  url: https://charts.chaos-mesh.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 1h
  chart:
    spec:
      chart: chaos-mesh
      version: 2.8.4
      sourceRef:
        kind: HelmRepository
        name: chaos-mesh
  values:
    controllerManager:
      replicaCount: 1
    dashboard:
      create: false
    chaosDaemon:
      runtime: containerd
      socketPath: /run/containerd/containerd.sock
    enableFilterNamespace: true
