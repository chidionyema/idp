# crew#539 DoD item 2: "scale langfuse-web to 0 and the founder's Telegram says so within 5 minutes",
# run as a Chaos Mesh experiment (the estate's drill engine, ADR 0005) instead of a kubectl from a
# laptop. PodChaos pod-failure takes every langfuse-web pod out for 8 minutes; the Probe
# founder-surfaces (platform/monitoring/rules) fails https://langfuse.<zone>, FounderSurfaceDown
# fires after its 5m `for`, and Alertmanager's telegram receiver delivers it.
#
# The receipt task runs beside the failure and polls the two things that prove the page left the
# cluster: Alertmanager holds an active FounderSurfaceDown for a langfuse instance, and Prometheus
# sees alertmanager_notifications_total{integration="telegram"} rise. It writes one line to the
# drill-receipts bucket from the node's instance principal, ok or FAIL, so a grader outside the
# cluster (bin/idp-chaos-drill langfuse-alert-drill alert-drill) never mistakes silence for green.
# The observability namespace carries chaos-mesh.org/inject=enabled for this.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: langfuse-alert-drill
  namespace: observability
spec:
  schedule: "30 3 * * 1"
  type: Workflow
  concurrencyPolicy: Forbid
  historyLimit: 5
  workflow:
    entry: entry
    templates:
      - name: entry
        templateType: Serial
        deadline: 600s
        children: [experiment]
      - name: experiment
        templateType: Parallel
        deadline: 570s
        children: [fail-web, receipt]
      - name: fail-web
        templateType: PodChaos
        deadline: 540s
        podChaos:
          action: pod-failure
          mode: all
          # No duration here: inside a Workflow template Chaos Mesh's vworkflow.kb.io webhook
          # refuses it ("should not define duration in chaos when using Workflow, use
          # Template#Deadline instead") and the whole chaos Kustomization stays not Ready.
          # The template's own deadline above bounds the run.
          selector:
            namespaces: [observability]
            labelSelectors:
              app.kubernetes.io/name: langfuse
              app: web
      - name: receipt
        templateType: Task
        deadline: 560s
        task:
          container:
            name: receipt
            # ghcr.io/oracle/oci-cli tags are dated; arm64 is published (the A1 nodes). The CLI is a
            # Python console script, so python3 and its stdlib are in the image. User in the image
            # is "oracle", non-numeric, so the uid is pinned here for runAsNonRoot.
            image: ghcr.io/oracle/oci-cli:20260826
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                python3 - <<'PY'
                import datetime, json, time, urllib.parse, urllib.request
                AM = "http://kps-alertmanager.monitoring.svc:9093"
                PROM = "http://kps-prometheus.monitoring.svc:9090"
                def get(url):
                    with urllib.request.urlopen(url, timeout=10) as r:
                        return json.load(r)
                def now():
                    return datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                start, line, err = time.time(), None, ""
                while time.time() - start < 480:
                    try:
                        alerts = [a for a in get(AM + "/api/v2/alerts?active=true&filter=" + urllib.parse.quote('alertname="FounderSurfaceDown"'))
                                  if "langfuse" in a["labels"].get("instance", "")]
                        q = get(PROM + "/api/v1/query?query=" + urllib.parse.quote('sum(increase(alertmanager_notifications_total{integration="telegram"}[15m]))'))["data"]["result"]
                        sent = float(q[0]["value"][1]) if q else 0.0
                        if alerts and sent > 0:
                            line = f"ok langfuse-alert-drill FounderSurfaceDown firing for {alerts[0]['labels']['instance']} telegram_notifications={sent:.0f} after {int(time.time() - start)}s at {now()}"
                            break
                    except Exception as e:
                        err = str(e)[:80]
                    time.sleep(30)
                if line is None:
                    line = f"FAIL langfuse-alert-drill no FounderSurfaceDown for langfuse with a telegram notification within 480s at {now()} {err}"
                open("/tmp/receipt", "w").write(line + "\n")
                print(line)
                PY
                oci --auth instance_principal os object put --bucket-name estate-drill-receipts \
                  --name chaos/langfuse-alert-drill --file /tmp/receipt --content-type text/plain --force
            env:
              - { name: HOME, value: /tmp }   # the CLI writes its cache under HOME; the root fs is read-only
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 200m, memory: 256Mi }
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
              seccompProfile: { type: RuntimeDefault }
            volumeMounts:
              - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
