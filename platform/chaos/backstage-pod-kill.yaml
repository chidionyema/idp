# ADR 0005 first experiment: kill one Backstage pod while a steady-state probe watches.
# The namespace must carry the label chaos-mesh.org/inject=enabled.
#
# crew#292 CP4: the last step writes a one-line receipt to the Object Storage bucket
# platform/oci/receipts.tf creates, from the worker node's instance principal. It runs only when
# the experiment step finished (a StatusCheck abort ends the Workflow before it), so a receipt
# means "pod killed, /healthcheck stayed 200". bin/idp-chaos-drill grades the receipt's age.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: backstage-pod-kill
  namespace: backstage
spec:
  schedule: "0 3 * * 1"
  type: Workflow
  concurrencyPolicy: Forbid
  historyLimit: 5
  workflow:
    entry: entry
    templates:
      - name: entry
        templateType: Serial
        deadline: 240s
        children: [experiment, receipt]
      - name: experiment
        templateType: Parallel
        deadline: 90s
        children: [steady-state, kill-one]
      - name: steady-state
        templateType: StatusCheck
        deadline: 90s
        abortWithStatusCheck: true
        statusCheck:
          mode: Continuous
          type: HTTP
          intervalSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
          http:
            url: http://backstage.backstage.svc:7007/healthcheck
            method: GET
            criteria:
              statusCode: "200"
      - name: kill-one
        templateType: PodChaos
        deadline: 60s
        podChaos:
          action: pod-kill
          mode: one
          selector:
            namespaces: [backstage]
            labelSelectors:
              app.kubernetes.io/name: backstage
      - name: receipt
        templateType: Task
        deadline: 120s
        task:
          container:
            name: receipt
            # ghcr.io/oracle/oci-cli tags are dated; arm64 is published (the A1 nodes). User in the
            # image is "oracle", non-numeric, so the uid is pinned here for runAsNonRoot.
            image: ghcr.io/oracle/oci-cli:20260826
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                printf 'ok backstage-pod-kill accomplished at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/receipt
                oci --auth instance_principal os object put --bucket-name estate-drill-receipts \
                  --name chaos/backstage-pod-kill --file /tmp/receipt --content-type text/plain --force
            env:
              - { name: HOME, value: /tmp }   # the CLI writes its cache under HOME; the root fs is read-only
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 200m, memory: 256Mi }
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
              seccompProfile: { type: RuntimeDefault }
            volumeMounts:
              - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
