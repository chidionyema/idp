# ADR 0005. Applied by Flux once the OKE cluster exists (ADR 0004 step 3).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: chaos-mesh
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 24h
  url: https://charts.chaos-mesh.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  # Bounded remediation, and the last failure is remediated too, so a wedged release is not left
  # Failed for a person to untangle: helm-controller spends its retries once and then waits forever
  # for a spec change (tailscale-operator sat Failed blocking guacamole, idp#1027).
  # NOT `strategy: uninstall`, which idp#1027 set here and this row takes back out. Founder,
  # 2026-08-30 (~/.claude/docs/founder/2026-08-30T2332Z-yes-and-the-pattern-is-sound-but-two
  # -c08d08d9.md): uninstalling a wedged release turns a degraded service into a deleted one --
  # the PVCs, PDBs and Secrets the release made go with it -- and it erases the state that says
  # which invariant was violated, which is the state an incident is converted into a control from.
  # The default strategy is rollback: the previous revision is restored and the failed one is
  # readable. Repaving stays a hand after capture: `bin/idp-oke-break-glass helm-retry`.
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-chaos
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-chaos
  interval: 10m
  chart:
    spec:
      chart: chaos-mesh
      version: 2.8.4
      sourceRef:
        kind: HelmRepository
        name: chaos-mesh
  values:
    controllerManager:
      replicaCount: 1
    dashboard:
      create: false
    chaosDaemon:
      # OKE nodes run cri-o (`kubectl get node -o jsonpath={.items[0].status.nodeInfo.containerRuntimeVersion}`
      # -> cri-o://1.35.2 on 2026-08-26). The chart default is containerd, and the daemon dialled
      # /run/containerd/containerd.sock into CrashLoopBackOff 24 times before anyone read the log.
      runtime: crio
      socketPath: /var/run/crio/crio.sock
    enableFilterNamespace: true
    # No DNS chaos planned; the chart's dns-server requests 100m CPU (chart 2.8.4 values), a
    # third of the single node's headroom measured 2026-08-25 (310m with Backstage running).
    dnsServer:
      create: false
