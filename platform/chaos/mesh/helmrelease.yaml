# ADR 0005. Applied by Flux once the OKE cluster exists (ADR 0004 step 3).
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 24h
  url: https://charts.chaos-mesh.org
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaos-mesh
  namespace: chaos-mesh
spec:
  interval: 1h
  chart:
    spec:
      chart: chaos-mesh
      version: 2.8.4
      sourceRef:
        kind: HelmRepository
        name: chaos-mesh
  values:
    controllerManager:
      replicaCount: 1
    dashboard:
      create: false
    chaosDaemon:
      # OKE nodes run cri-o (`kubectl get node -o jsonpath={.items[0].status.nodeInfo.containerRuntimeVersion}`
      # -> cri-o://1.35.2 on 2026-08-26). The chart default is containerd, and the daemon dialled
      # /run/containerd/containerd.sock into CrashLoopBackOff 24 times before anyone read the log.
      runtime: crio
      socketPath: /var/run/crio/crio.sock
    enableFilterNamespace: true
    # No DNS chaos planned; the chart's dns-server requests 100m CPU (chart 2.8.4 values), a
    # third of the single node's headroom measured 2026-08-25 (310m with Backstage running).
    dnsServer:
      create: false
