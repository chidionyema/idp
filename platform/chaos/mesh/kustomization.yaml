# The Chaos Mesh install only. Its Schedules live one directory up, in a Flux Kustomization
# that dependsOn this one: a Schedule cannot be dry-run before the CRD it names exists, and
# Flux server-side dry-runs the whole row, so a row that carries both never applies
# (incident 2026-08-25: "no matches for kind Schedule in version chaos-mesh.org/v1alpha1"
# for 24 hours, Chaos Mesh never installed).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - exception.yaml
