# The one ClusterSecretStore, and the only manifest that names a cloud (R36, crew#250). To move
# vaults, change `provider:` here; every ExternalSecret keeps `secretStoreRef: estate-vault`.
# Vault OCID and region are substituted by Flux from the `estate-vars` ConfigMap that
# bin/idp-flux-bootstrap writes from tofu outputs (LAW 46: no identifier for this tenancy is typed here).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: estate-vault
  labels:
    # The one cloud secret door (R43, crew#66): platform/edge/provider-independence.yaml refuses
    # any other SecretStore or ClusterSecretStore whose provider is a cloud vault.
    idp.platform/provider-door: "true"
spec:
  provider:
    oracle:
      vault: ${OCI_VAULT_ID}
      region: ${OCI_REGION}
      principalType: InstancePrincipal
