# idp#3448 CP1: the credentials the four connectors need. The cicd/incidents token is minted
# in-cluster from the estate's existing GitHub App (below); the webhook secret and the Slack bot
# token are genuine founder-only births (no create-API for either) and stay MISS in
# docs/reference/policy/root-trust.md until a person fills the vault entry -- R47, LAW 46: never
# a literal in this tree, never guessed.
#
# All three mount as files, never as pod env (Kyverno secrets-not-from-env-vars): the
# Deployment reads *_FILE and reads the mounted path, the same convention
# platform/otto-gateway/external-secret.yaml uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epistemic-fabric-github
  namespace: epistemic-fabric
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: epistemic-fabric-github
    creationPolicy: Owner
  data:
    # The webhook receiver's HMAC secret -- what the GitHub App's own webhook config is set
    # to, so github.go can verify X-Hub-Signature-256 before it ever trusts a payload body.
    - secretKey: webhook_secret
      remoteRef: { key: epistemic-fabric-github, property: webhook_secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epistemic-fabric-slack
  namespace: epistemic-fabric
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: epistemic-fabric-slack
    creationPolicy: Owner
  data:
    # A bot token scoped to conversations.history on the one channel SLACK_CHANNEL_ID names
    # (epistemic-fabric-config ConfigMap in ingest.yaml).
    - secretKey: bot_token
      remoteRef: { key: epistemic-fabric-slack, property: bot_token }
---
# The cicd and incidents pollers' token is minted, not asked for: the estate already runs one
# GitHub App (`github-app`, MEETS via bin/idp-github-app, docs/reference/policy/root-trust.md),
# so this reuses it exactly the way platform/mcp/external-secret.yaml and
# platform/hermes-agent/gateway.yaml already do (R52, LAW 43: no second App, no human PAT).
# Read-only permissions only -- both pollers only ever read the one repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epistemic-fabric-github-api
  namespace: epistemic-fabric
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: epistemic-fabric-github-api, creationPolicy: Owner }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: epistemic-fabric-github-token
      rewrite:
        - transform: { template: "token" }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: epistemic-fabric-github-token
  namespace: epistemic-fabric
spec:
  appID: ${githubAppIDQuoted}
  installID: ${githubAppInstallationIDQuoted}
  permissions:
    metadata: read
    actions: read
    issues: read
  auth:
    privateKey:
      secretRef:
        name: github-app-pem
        key: key
---
# Same lane, same substitution road as platform/mcp/external-secret.yaml (LAW 46: identifiers
# come from the flux-system/github-app Secret by strict envsubst, never a literal in git).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epistemic-fabric-github-app-pem
  namespace: epistemic-fabric
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: github-app-pem
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .pem_b64 | b64dec }}"
  dataFrom:
    - extract: { key: github-app }
