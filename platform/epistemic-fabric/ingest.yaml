        - name: github-api-secret
          secret: { secretName: epistemic-fabric-github-api, defaultMode: 256 }
---
# GITHUB_REPO/SLACK_CHANNEL_ID/INCIDENT_LABEL are not secret -- a repo slug and
# a channel id are addresses, not credentials -- so a ConfigMap, not a vault
# entry. The founder still has to choose them (which repo, which channel);
# left unset here rather than guessed, so a wrong value is never applied
# without a person naming it (postBuild.substituteFrom in
# clusters/oke/platform.yaml's epistemic-fabric row fills GITHUB_REPO from
# estate-config once he has).
apiVersion: v1
kind: ConfigMap
metadata:
  name: epistemic-fabric-config
  namespace: epistemic-fabric
data:
  GITHUB_REPO: "chidionyema/idp"
  SLACK_CHANNEL_ID: ""
  INCIDENT_LABEL: "incident"
