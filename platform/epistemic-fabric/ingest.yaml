            - { name: GITHUB_TOKEN_FILE, value: /var/run/secrets/epistemic-fabric-github-api/token }
            - { name: GITHUB_REPO, valueFrom: { configMapKeyRef: { name: epistemic-fabric-config, key: GITHUB_REPO } } }
            - { name: INCIDENT_LABEL, valueFrom: { configMapKeyRef: { name: epistemic-fabric-config, key: INCIDENT_LABEL } } }
