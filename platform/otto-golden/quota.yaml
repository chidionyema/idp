# crew#191 fence, half of it (network-policy.yaml is the other half). Two replicas
# (deployment.yaml, crew#539 availability) plus one surge pod during a rolling update, so the
# ceiling is sized for three pods -- a runaway process still cannot starve the node, and a
# rollout is never forbidden by its own quota (the main-62 roll wedged on exactly that).
apiVersion: v1
kind: LimitRange
metadata:
  name: otto-golden-defaults
  namespace: otto-golden
spec:
  limits:
    - type: Container
      default: { cpu: 200m, memory: 256Mi }
      defaultRequest: { cpu: 50m, memory: 128Mi }
      max: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: otto-golden-ceiling
  namespace: otto-golden
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 384Mi
    limits.cpu: 600m
    limits.memory: 768Mi
    pods: "5"
