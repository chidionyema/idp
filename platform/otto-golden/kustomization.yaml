# Otto (golden), founder order 2026-09-01. Same image as platform/hermes-agent -- one build,
# two commands. The tag below is rewritten by image-automation-controller from ImagePolicy
# flux-system/hermes-agent (the marker is how it finds the line), so every main build of
# hermes-agent rolls this pod too. It was a hand-bumped tag before 2026-09-03, which is why
# merged work sat unreleased: the hand never bumped it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otto-golden
resources:
  - namespace.yaml
  - network-policy.yaml
  - telegram-secret.yaml
  - router-key.yaml
  - config.yaml
  - deployment.yaml
  - httproute.yaml
  - edge-manners.yaml
  - availability.yaml
images:
  - name: ghcr.io/chidionyema/hermes-agent
    newTag: main-89-f9c2e293285e64b4000142fbc4388a322fc7bf76 # {"$imagepolicy": "flux-system:hermes-agent:tag"}
