# Otto staging's public door -- health only, since crew#768. The shared Gateway
# (prospector-edge, defined in the prospector-main repo, out of scope here) already carries a
# listener named https-otto for hostname otto.${ESTATE_ZONE}; platform/otto-gateway/httproute.yaml
# owns /webhook/telegram on it, and that is now the estate's one door for an inbound channel.
#
# This route used to claim POST /telegram-webhook as well, which made two processes able to
# receive the same channel: two address books, two places the channel word lived, and two
# answers possible for one message. The Universal Event Gateway is the one ingress
# (docs/specs/otto-platform-v1/EVENT-GATEWAY-TENANCY.md), so the second door is gone and this
# namespace keeps only the liveness path its availability probe reads.
#
# Nothing else on this host is exposed -- no catch-all path, so a request to any other path on
# otto.${ESTATE_ZONE} falls through to whichever other route (or Traefik's own default) already
# owns it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otto-golden
  namespace: otto-golden
  labels:
    # Admission physics: the require-catalogue-entity policy (platform/edge/) refuses any
    # HTTPRoute that names no catalogue entity. Same entity the Service next door names.
    backstage.io/kubernetes-id: otto-golden
  annotations:
    # The only path here is an unauthenticated liveness check, which is what the estate's
    # front-door control expects to see declared rather than assumed.
    idp.estate/auth: public-health-only
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-otto
  hostnames:
    - "otto.${ESTATE_ZONE}"
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
          method: GET
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: otto-golden
          port: 8080
