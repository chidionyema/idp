# The staging bot's token. Same shape as platform/hermes-agent/mac-run-key.yaml: one vault
# entry, decoded into a Kubernetes Secret that is mounted as a file, never as a pod env var --
# Kyverno's secrets-not-from-env-vars policy (platform/edge/kyverno-secrets-policy.yaml)
# refuses env.valueFrom.secretKeyRef and envFrom.secretRef on a Pod (Audit today, Enforce once
# the fleet is clean; litellm's envFrom secretRef was refused outright the same way on
# 2026-08-26, crew#284). deployment.yaml's container reads the file and exports it as
# OTTO_TELEGRAM_BOT_TOKEN itself, before exec'ing python -m otto.boot.
#
# The token rides the machine road (founder's word 2026-09-02 evening, reversing #1127's
# human-door flip for this one entry): the estate-vault entry `otto-staging-telegram`
# already holds the fields `token` and `webhook_secret` -- field names read from the vault
# 2026-09-02T20:2xZ, and the webhook half syncs live from the same entry
# (platform/otto-golden-secret/webhook-substitution.yaml) -- while the Bitwarden project
# never received a secret by this name, so the pod never booted (ExternalSecret
# ever-synced empty, measured). Rotation goes through `bin/idp-vault-put --merge
# otto-staging-telegram token=...`, never a chat, a manifest or a value in a log
# (LAW 46, R49). A missing field fails this row by name, never a value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otto-staging-telegram
  namespace: otto-golden
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: otto-staging-telegram
    creationPolicy: Owner
  data:
    - secretKey: OTTO_TELEGRAM_BOT_TOKEN
      remoteRef: { key: otto-staging-telegram, property: token }
