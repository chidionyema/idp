# crew#539: a routed surface survives one node. A drain may never evict the last webhook pod;
# minAvailable 1 against replicas 2 keeps one door open and still lets every drain finish.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otto-golden
  namespace: otto-golden
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: otto-golden
