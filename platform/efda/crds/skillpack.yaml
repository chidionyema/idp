# The SkillPack (Interface 2). A pack says which component class it covers,
# what it costs to run, how it is isolated, and which signatures it can match.
# execution_budget and isolation are required: a pack that cannot say what it
# costs is not admitted.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: skillpacks.efda.estate
spec:
  group: efda.estate
  scope: Namespaced
  names:
    kind: SkillPack
    plural: skillpacks
    singular: skillpack
    shortNames: ["sp"]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.componentClass
        - name: Tier
          type: string
          jsonPath: .spec.coverageTier
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Generated
          type: string
          jsonPath: .spec.generatedBy
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required:
                [
                  "componentClass",
                  "componentKind",
                  "appliesToVersions",
                  "version",
                  "coverageTier",
                  "executionBudget",
                  "isolation",
                ]
              properties:
                componentClass:
                  type: string
                  minLength: 1
                componentKind:
                  type: string
                  enum: ["workload", "controller", "agent", "script", "external_dependency"]
                appliesToVersions:
                  type: string
                  minLength: 1
                version:
                  type: string
                  minLength: 1
                interfaceVersion:
                  type: string
                  default: v1
                coverageTier:
                  type: string
                  enum: ["baseline", "specialist"]
                generatedBy:
                  type: string
                extends:
                  type: string
                provenance:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                owner:
                  type: object
                  properties:
                    team:
                      type: string
                    escalation:
                      type: string
                capabilitiesRequired:
                  type: array
                  items:
                    type: string
                executionBudget:
                  type: object
                  required: ["maxCpuMillicores", "maxMemoryMib", "maxWallClockMs"]
                  properties:
                    maxCpuMillicores:
                      type: integer
                      minimum: 1
                    maxMemoryMib:
                      type: integer
                      minimum: 1
                    maxWallClockMs:
                      type: integer
                      minimum: 1
                    maxRegexComplexity:
                      type: string
                      enum: ["low", "moderate", "high"]
                      default: moderate
                isolation:
                  type: object
                  required: ["sandbox", "network", "filesystem"]
                  properties:
                    sandbox:
                      type: string
                      enum: ["wasm", "gvisor", "subprocess_strict"]
                    network:
                      type: string
                      enum: ["none"]
                    filesystem:
                      type: string
                      enum: ["none"]
                upgradeDeadline:
                  type: string
                  format: date-time
                deprecation:
                  type: object
                  properties:
                    deprecatedAt:
                      type: string
                      format: date-time
                    sunsetAt:
                      type: string
                      format: date-time
                    replacementUri:
                      type: string
                    severity:
                      type: string
                      enum: ["info", "warning", "critical"]
                signatures:
                  type: array
                  items:
                    type: object
                    required: ["id", "symptom", "matchLogic", "cause", "confidenceBase"]
                    properties:
                      id:
                        type: string
                      symptom:
                        type: string
                      diagnosticQuestions:
                        type: array
                        items:
                          type: string
                      matchLogic:
                        type: string
                        maxLength: 4096
                      cause:
                        type: string
                      confidenceBase:
                        type: number
                        minimum: 0
                        maximum: 1
                      provenance:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      remediation:
                        type: object
                        properties:
                          tier:
                            type: string
                            enum: ["T0", "T1", "T2"]
                          actionTemplate:
                            type: string
                          rollbackTemplate:
                            type: string
                          safetyProof:
                            type: string
            status:
              type: object
              properties:
                state:
                  type: string
                lastValidated:
                  type: string
                  format: date-time
