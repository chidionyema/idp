# The controller (G3): observe the estate, register what it finds, generate the
# baseline pack that makes it compliant, publish the registry snapshot and the
# NCWP expression, and report what is still uncovered.
#
# The checkpoint sink is an env var, not a discovery mechanism: one sink, one
# address, and the address is in the manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efda-controller
  namespace: efda-system
  labels:
    app.kubernetes.io/name: efda-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: efda-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efda-controller
    spec:
      serviceAccountName: efda-controller
      # GHCR answers 401 to an anonymous manifest request, so the package needs the
      # credential the pull-secret.yaml ExternalSecret keeps fresh in this namespace.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: ghcr.io/chidionyema/efda:0.0.0 # {"$imagepolicy": "flux-system:efda:tag"}
          args: ["reconcile", "--interval", "30"]
          env:
            - name: EFDA_REDIS_HOST
              value: efda-checkpoints.efda-system.svc.cluster.local
            - name: EFDA_REDIS_PORT
              value: "6379"
            - name: EFDA_NAMESPACE
              value: efda-system
            - name: EFDA_CLUSTER
              value: oke
          # The probe reads the file the controller writes after its FIRST COMPLETE reconcile
          # pass. "The process started" is not readiness: a controller that has started and
          # has not yet seen the cluster has not proved it can cover anything.
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import os,sys; sys.exit(0 if os.path.exists('/tmp/efda.ready') else 1)
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness asks a different question: can this process still load itself and name
          # the sink it talks to? A reconcile that fails because the API server is down is
          # availability, not death, so the liveness probe does not run one.
          livenessProbe:
            exec:
              command: ["python", "-m", "efda", "describe"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The WAL the store falls back to when the sink is unreachable. The root
            # filesystem is read-only, so the directory has to be a mount, not a path
            # the program creates for itself.
            - name: wal
              mountPath: /var/efda/wal
      volumes:
        - name: tmp
          emptyDir: {}
        - name: wal
          emptyDir: {}
---
# The executor (L5). It watches for DiagnosticReports and runs them through
# the gates. On day one the allowlist is empty, so every T1/T2 report is
# refused -- that refusal is the behaviour, not a missing feature.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efda-executor
  namespace: efda-system
  labels:
    app.kubernetes.io/name: efda-executor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: efda-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efda-executor
    spec:
      serviceAccountName: efda-executor
      # GHCR answers 401 to an anonymous manifest request, so the package needs the
      # credential the pull-secret.yaml ExternalSecret keeps fresh in this namespace.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: executor
          image: ghcr.io/chidionyema/efda:0.0.0 # {"$imagepolicy": "flux-system:efda:tag"}
          args: ["execute", "--watch", "--interval", "15"]
          env:
            - name: EFDA_REDIS_HOST
              value: efda-checkpoints.efda-system.svc.cluster.local
            - name: EFDA_REDIS_PORT
              value: "6379"
            - name: EFDA_NAMESPACE
              value: efda-system
            - name: EFDA_CLUSTER
              value: oke
            - name: EFDA_ALLOWLIST_PATH
              value: /etc/efda/allowlist/allowlist.json
          # The executor's readiness is the same contract as the controller's: the ready file
          # appears after the first COMPLETE watch pass, which means the sink answered and
          # the executor could read what was in it.
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import os,sys; sys.exit(0 if os.path.exists('/tmp/efda.ready') else 1)
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "efda", "describe"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: allowlist
              mountPath: /etc/efda/allowlist
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # The WAL the store falls back to when the sink is unreachable. The root
            # filesystem is read-only, so the directory has to be a mount, not a path
            # the program creates for itself.
            - name: wal
              mountPath: /var/efda/wal
      volumes:
        - name: allowlist
          configMap:
            name: efda-allowlist
        - name: tmp
          emptyDir: {}
        - name: wal
          emptyDir: {}
---
# The allowlist. Empty on day one: authority is earned per signature, by a
# ConfigMap change, after the signature has produced a correct report against
# a real artifact and its safety_proof has been reviewed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: efda-allowlist
  namespace: efda-system
data:
  allowlist.json: |
    {
      "version": "v1",
      "actions": []
    }
