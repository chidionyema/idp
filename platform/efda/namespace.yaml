apiVersion: v1
kind: Namespace
metadata:
  name: efda-system
  labels:
    idp.estate.io/runtime: always-on
    efda.estate.io/layer: coverage
---
# The checkpoint sink (L1). One redis, one namespace, append-only persistence.
#
# The persistence is node-local, and that is a measured decision, not a shortcut:
# the OKE tenancy is on the free tier and refuses new block volumes. The PVC this
# sink asked for sat Pending for 43 minutes with
#   LimitExceeded ... You cannot create a volume because you have reached your
#   limit (CreateVolume, 2026-10-27),
# so the sink could never start. The sink's data is therefore an emptyDir: it
# survives a container restart and is lost when the pod is recreated.
#
# What makes that safe is that the emptyDir is a cache, not the record. The
# durable record of what the estate did is the event spine (JetStream, in
# event-bus, which has a volume that is already bound) and the registry in git.
# A checkpoint that must outlive the pod belongs in one of those two, not in a
# third store that only the free tier's refusal keeps honest.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: efda-checkpoints
  namespace: efda-system
  labels:
    app.kubernetes.io/name: efda-checkpoints
spec:
  serviceName: efda-checkpoints
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: efda-checkpoints
  template:
    metadata:
      labels:
        app.kubernetes.io/name: efda-checkpoints
    spec:
      # The sink needs no API token: it stores checkpoints and nothing else.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # redis uid in the alpine image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: docker.io/library/redis:7.4-alpine
          args: ["--appendonly", "yes", "--save", "60", "1"]
          ports:
            - containerPort: 6379
          # The sink is probed with the sink's own client. A redis that answers PONG is a
          # redis that can take a checkpoint; a TCP connect that the sink refuses to serve
          # would not be.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        # The append-only file lives here. See the note at the top of this file:
        # a block volume cannot be created on this tenancy's free tier.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: efda-checkpoints
  namespace: efda-system
  labels:
    app.kubernetes.io/name: efda-checkpoints
    # The catalogue entity this Service is. layer-efda is the entity
    # bin/catalog-platform generates for the efda Flux Kustomization, and the estate's
    # require-catalogue-entity policy refuses a Service that serves a port without naming
    # the entity it belongs to.
    backstage.io/kubernetes-id: layer-efda
spec:
  selector:
    app.kubernetes.io/name: efda-checkpoints
  ports:
    - port: 6379
      targetPort: 6379
