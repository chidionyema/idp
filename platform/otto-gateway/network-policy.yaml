# The crew#191 fence for this namespace -- the both-ways `default-deny-all` and the
# `allow-dns-egress` exception -- is NOT here. It lives in
# platform/ns-fences/network/otto-gateway.yaml, with every other namespace's, because that is the
# deck bin/ns-fence-gate grades and one object may have one owner.
#
# Until 2026-09-07 it was in both files, and two Flux Kustomizations reapplied it at each
# other every ten minutes. Each apply rewrote the object's
# `kustomize.toolkit.fluxcd.io/name` label to its own name, so each one was a real change
# and each emitted a `NetworkPolicy/otto-gateway/... configured` event. Four objects
# (default-deny-all and allow-dns-egress, in otto-gateway and otto-golden) were 80 of the
# 112 Flux events an hour reaching GitHub Actions, and the specs were byte-identical the
# whole time -- the churn was the ownership label, not the policy.
#
# What stays in this file is what is specific to this workload: the holes it needs.
# The shared Traefik gateway (area `edge`) is what an HTTPRoute forwards through; without
# this, a channel's POST to /webhook/telegram and the edge's own health probe would arrive
# at a pod that drops every inbound packet by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-edge
  namespace: otto-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
      ports:
        - protocol: TCP
          port: 8080
---
# LAW 50: every workload emits to the central collector. The door refuses to start without
# the collector endpoint, so this rule is not optional decoration -- without it the pod
# starts, exports nothing, and reads green.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-observability
  namespace: otto-gateway
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4318
---
# The door's whole output: a task envelope on the estate's event bus. Without this the door
# accepts a customer's event, cannot publish it, and answers unavailable -- loudly, which is
# right, but the fix is this rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-event-bus
  namespace: otto-gateway
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: event-bus
      ports:
        - protocol: TCP
          port: 4222
---
# The binding table lives in this same area, so this rule is area-internal on both sides:
# the door reaches the database, and the database accepts only from this area.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-binding-database
  namespace: otto-gateway
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
---
# The estate's memory (platform/hindsight): one bank on the one estate Postgres. Without this
# rule the answering lane's recall and retain calls are refused by the fence and the door
# answers with no memory at all -- which is what it did from 2026-09-03 until this row landed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-memory
  namespace: otto-gateway
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hindsight
      ports:
        - protocol: TCP
          port: 8888
---
# The namespace default-denies egress, and until this rule existed there was no route from
# this pod to the estate's model router at all -- so even a pod holding the key could not
# have reached it. One destination, one port: the router's own Service, never the internet
# (every vendor call leaves from litellm, which is the point of having one router).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-llm
  namespace: otto-gateway
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: llm
      ports:
        - protocol: TCP
          port: 4000
