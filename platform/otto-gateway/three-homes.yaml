# Otto's three homes (founder order, 2026-09-09: "otto must have 3 homes ... has never been
# stable even once ... affirmative action, end of, get it done", and "we must have the
# alternative to litellm").
#
# Otto is the founder's personal assistant. Every outage he has lived through had the same
# shape: one shared thing in the estate broke, and the assistant went silent. On 2026-09-09
# it was cross-node pod networking -- one fault that took CoreDNS, the SigNoz collector, one
# LiteLLM replica (Redis timeout to a cache on the other node) and Otto's door with it.
#
# The fix is not another retry. It is three brains in three failure domains, and a switch
# between them that needs no human:
#
#   home 1  the cluster   http://litellm.llm.svc.cluster.local:4000/v1
#           dies when OKE pod networking breaks, or the router pod does. Tonight.
#
#   home 2  a direct line to the vendor, no cluster hop and no router
#           https://api.minimax.io/v1, Otto's own key from the vault.
#           dies when pod egress to the internet breaks, or the vendor does.
#           This is the "alternative to LiteLLM" the founder asked for: it is not
#           the estate router with a different address, it is not the estate router
#           at all.
#
#   home 3  the founder's Mac, over Tailscale, on local silicon
#           Ollama on the tailnet address in clusters/oke/estate-config.yaml.
#           dies only when the laptop is off. Free, private, and cannot run out of
#           credit -- which is why it is last, the same reason llm/config.yaml:166
#           already gives for putting ollama at the tail ("it is local and cannot run
#           out of credit"). A hop that costs nothing is the right floor, not the
#           right first try.
#
# THE SWITCH IS NOT A SCRIPT. It is the same litellm binary the estate already runs
# (THE HEADLINE, rule 1: no script for a problem a proven platform solves), as a sidecar
# in Otto's own pod on 127.0.0.1 -- so reaching it crosses no network, no Service, no CNI
# and no node. It is the non-database image: no Postgres, no Redis, no callbacks, no
# tracing. Nothing it needs can be taken away from it. Otto's LITELLM_BASE_URL points at
# it instead of at the cluster router, and Otto's code does not change at all.
#
# This is not a second platform router. The estate keeps one router and home 1 is it:
# every happy-path turn still walks litellm.llm.svc, still spends against the estate's
# budgets and still lands in Langfuse. Homes 2 and 3 carry no policy and no ledger and
# are only ever reached when home 1 could not answer -- a lifeboat, not a fleet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otto-three-homes
  namespace: otto-gateway
  labels:
    app: otto-gateway
    app.kubernetes.io/name: otto-gateway
    app.kubernetes.io/part-of: idp
data:
  config.yaml: |
    # GENERATED BY NOBODY -- this file is the source. It is small on purpose.
    model_list:
      # ---- home 1: the estate router -------------------------------------------------
      # One row per lane name platform/otto-gateway/router-lanes.yaml can carry, because
      # Otto sends the lane's value as the model name. timeout 20 and num_retries 0: the
      # retries belong to the estate router, which already does two; doing them again here
      # only delays the hop to a home that can answer, which is the founder's "we wait for
      # a nodel to finish and then swtich whih fails all the tine" (2026-09-08).
      - model_name: minimax
        litellm_params: &home1
          model: openai/minimax
          api_base: http://litellm.llm.svc.cluster.local:4000/v1
          api_key: os.environ/LITELLM_API_KEY
          timeout: 20
          num_retries: 0
      - model_name: deepseek
        litellm_params:
          <<: *home1
          model: openai/deepseek
      - model_name: gemini
        litellm_params:
          <<: *home1
          model: openai/gemini
      - model_name: embed
        litellm_params:
          <<: *home1
          model: openai/embed

      # ---- home 2: the direct vendor line, no cluster, no router ----------------------
      # MiniMax because it is the one lane with a clean measured record on this estate:
      # 137 of 137 calls answered in the two hours to 2026-09-08T10:45Z, and it is what
      # router-lanes.yaml already pins the judgment lane to. The key is Otto's own copy
      # from the same vault entry the router reads, so a rotation reaches both.
      - model_name: home-direct
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          timeout: 60
          num_retries: 0

      # ---- home 3: the founder's Mac, local silicon over Tailscale --------------------
      # Measured on the laptop 2026-09-09: qwen2.5-coder:7b answered "OK, I understand."
      # in one call to 127.0.0.1:11434/v1/chat/completions. The address is
      # FOUNDER_MAC_TS_IP from clusters/oke/estate-config.yaml -- one value, one
      # place, never a literal here (LAW 46). Reached only through the Tailscale sidecar
      # in this pod; there is no other route from the cluster to the laptop.
      - model_name: home-mac
        litellm_params:
          model: openai/qwen2.5-coder:7b
          api_base: http://${FOUNDER_MAC_TS_IP}:11434/v1
          api_key: ollama
          # Measured on the founder's Mac, 2026-09-10: warm, 12.7s for a 20-token reply; cold,
          # over 120s -- a 7B load on a laptop already 46% free and paging. 120 was the first
          # number here and it timed out on exactly the turn home 3 exists for, so the job
          # below now keeps the model resident (OLLAMA_KEEP_ALIVE=-1) and this is the ceiling
          # for the one cold load after a reboot. A lifeboat that gives up is not a lifeboat.
          timeout: 240
          num_retries: 0

    router_settings:
      # The whole point of the file. Every lane Otto can ask for walks the three homes in
      # order and stops at the first that answers.
      fallbacks:
        - minimax:  [home-direct, home-mac]
        - deepseek: [home-direct, home-mac]
        - gemini:   [home-direct, home-mac]
        # `embed` deliberately has NO tail. otto_facts.embedding is a 1536-wide column,
        # matched to gemini-embedding-001; the laptop's nomic-embed-text is 768-wide, so a
        # fallback there would not degrade recall, it would write vectors of the wrong shape
        # into the fact store. Otto already handles a failed embedding correctly without
        # help: OTTO_MEMORY_EMBEDDING_TIMEOUT_S is 1.5s and retrieval falls back to the
        # lexical arm (deployment.yaml). Nobody loses an answer; recall is a little blunter
        # while home 1 is away. That is the right trade and a second home is not.

    litellm_settings:
      # No callbacks. No otel, no langfuse, no cache, no database. Tracing and spend
      # accounting happen at home 1, which is the estate router; a lifeboat that needs a
      # collector, a Redis and a Postgres to float is not a lifeboat. On 2026-09-09 the
      # collector was Init:0/1 and unschedulable and the Redis was on the partitioned
      # node -- both of those killed a router replica that night.
      drop_params: true
      turn_off_message_logging: true
      request_timeout: 330  # home 1 (20) + home 2 (60) + home 3 (240), plus the hop

    general_settings:
      master_key: os.environ/OTTO_BRAIN_KEY
