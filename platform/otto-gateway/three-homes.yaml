# Otto's three homes (founder order, 2026-09-09: "otto must have 3 homes ... has never been
# stable even once ... affirmative action, end of, get it done", and "we must have the
# alternative to litellm").
#
# Otto is the founder's personal assistant. Every outage he has lived through had the same
# shape: one shared thing in the estate broke, and the assistant went silent. On 2026-09-09
# it was cross-node pod networking -- one fault that took CoreDNS, the SigNoz collector, one
# LiteLLM replica (Redis timeout to a cache on the other node) and Otto's door with it.
#
# The fix is not another retry. It is three brains in three failure domains, and a switch
# between them that needs no human:
#
#   home 1  the cluster   http://litellm.llm.svc.cluster.local:4000/v1
#           dies when OKE pod networking breaks, or the router pod does. Tonight.
#
#   home 2  a direct line to the vendor, no cluster hop and no router
#           https://api.minimax.io/v1, Otto's own key from the vault.
#           dies when pod egress to the internet breaks, or the vendor does.
#           This is the "alternative to LiteLLM" the founder asked for: it is not
#           the estate router with a different address, it is not the estate router
#           at all.
#
#   home 3  a second vendor on a second cloud, out through the same tailscale sidecar
#           https://api.groq.com/openai/v1, free tier, no card.
#           dies only when Groq does -- a failure domain it shares with neither of the
#           other two. Free, so it cannot run out of credit, which is why it is last:
#           a hop that costs nothing is the right floor, not the right first try.
#           This WAS the founder's Mac on Ollama until 2026-09-10, when he killed it:
#           "no i killed ollama because machine is slow", "lets think of another cloud
#           home", "dont rely on macbook". The laptop is an Intel i7-8850H with no GPU
#           and could not answer a real prompt inside Otto's client ceiling; the
#           measurements are in the home 3 block below.
#
# THE SWITCH IS NOT A SCRIPT. It is the same litellm binary the estate already runs
# (THE HEADLINE, rule 1: no script for a problem a proven platform solves), as a sidecar
# in Otto's own pod on 127.0.0.1 -- so reaching it crosses no network, no Service, no CNI
# and no node. It is the non-database image: no Postgres, no Redis, no callbacks, no
# tracing. Nothing it needs can be taken away from it. Otto's LITELLM_BASE_URL points at
# it instead of at the cluster router, and Otto's code does not change at all.
#
# This is not a second platform router. The estate keeps one router and home 1 is it:
# every happy-path turn still walks litellm.llm.svc, still spends against the estate's
# budgets and still lands in Langfuse. Homes 2 and 3 carry no policy and no ledger and
# are only ever reached when home 1 could not answer -- a lifeboat, not a fleet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otto-three-homes
  namespace: otto-gateway
  labels:
    app: otto-gateway
    app.kubernetes.io/name: otto-gateway
    app.kubernetes.io/part-of: idp
data:
  config.yaml: |
    # GENERATED BY NOBODY -- this file is the source. It is small on purpose.
    model_list:
      # ---- home 1: the estate router -------------------------------------------------
      # One row per lane name platform/otto-gateway/router-lanes.yaml can carry, because
      # Otto sends the lane's value as the model name. timeout 20 and num_retries 0: the
      # retries belong to the estate router, which already does two; doing them again here
      # only delays the hop to a home that can answer, which is the founder's "we wait for
      # a nodel to finish and then swtich whih fails all the tine" (2026-09-08).
      - model_name: minimax
        litellm_params: &home1
          model: openai/minimax
          api_base: http://litellm.llm.svc.cluster.local:4000/v1
          api_key: os.environ/LITELLM_API_KEY
          timeout: 20
          num_retries: 0
      - model_name: deepseek
        litellm_params:
          <<: *home1
          model: openai/deepseek
      - model_name: gemini
        litellm_params:
          <<: *home1
          model: openai/gemini
      - model_name: embed
        litellm_params:
          <<: *home1
          model: openai/embed

      # ---- home 2: the direct vendor line, no cluster, no router ----------------------
      # MiniMax because it is the one lane with a clean measured record on this estate:
      # 137 of 137 calls answered in the two hours to 2026-09-08T10:45Z, and it is what
      # router-lanes.yaml already pins the judgment lane to. The key is Otto's own copy
      # from the same vault entry the router reads, so a rotation reaches both.
      - model_name: home-direct
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          timeout: 60
          num_retries: 0

      # ---- home 3: a second vendor, on a second cloud, reached the same way ----------
      # Was the founder's Mac over Tailscale until 2026-09-10. It is not any more, on his
      # order -- "no i killed ollama because machine is slow", and "lets think of another
      # cloud home / dont rely on macbook". The measurements behind that call, taken on the
      # laptop the same morning: it is an Intel i7-8850H, Ollama reports
      # `inference compute id=cpu library=cpu` with 4.7 GiB free and NO GPU; qwen2.5-coder:7b
      # pinned resident answered 16 output tokens in 24-46s, returned
      # `unexpected EOF` on a realistic 1.4k-token prompt, and llama3.2:3b returned nothing
      # in 240s. A home that cannot answer a real prompt inside Otto's own 120s client
      # ceiling (otto/router/config.py _DEFAULT_TIMEOUT_SECONDS) is not a lifeboat.
      #
      # Groq instead. It is a different vendor on a different cloud from home 2, so the two
      # tails share no failure domain; it serves frontier open weights (Llama 3.3 70B) on a
      # free tier with no card, so the floor still cannot run out of credit -- the same
      # property the laptop was chosen for, without the laptop; and it is OpenAI-compatible,
      # so it is a lane here and not an adapter. platform/vendors/consoles.yaml already
      # registers it as the estate's free floor, and ExternalSecret/human-groq in llm has
      # been Ready=True since the founder set the seed.
      #
      # Egress is the direct road out of the pod, the same one home 2 takes to
      # api.minimax.io -- which is why api.groq.com joins NO_PROXY on the sidecar in
      # deployment.yaml. The tailscale proxy in this pod carries the tailnet, not the
      # internet: asked to carry this call it refused in 0.05s. So home 3 needs no new
      # route, no new fence rule, and nothing at all on the founder's machine.
      - model_name: home-floor
        litellm_params:
          # `openai/` twice on purpose: the first is LiteLLM's provider prefix (an
          # OpenAI-compatible endpoint), the second belongs to the model's own name.
          # gpt-oss-120b and not Llama 3.3 70B, which every list of Groq's models still
          # names: asked from inside this pod on 2026-09-10 it answered
          #   404 "The model `llama-3.3-70b-versatile` does not exist or you do not have
          #   access to it."
          # while GET /v1/models returned the fourteen it actually serves. Measured on the
          # same call, from this container, on this key:
          #   openai/gpt-oss-120b   HTTP 200  0.48s  119 tokens, a real three-sentence answer
          #   qwen/qwen3.8-27b      HTTP 200  0.43s   74 tokens
          # and a tool-calling turn came back with tool_calls=['get_weather'], which Otto
          # needs: OTTO_ROUTER_TOOL_MAX_TURNS is 12 and a home that cannot call a tool is
          # a home that can only chat.
          model: openai/openai/gpt-oss-120b
          api_base: https://api.groq.com/openai/v1
          api_key: os.environ/GROQ_API_KEY
          # Generation is not the risk -- half a second, measured above. A free tier that
          # is spent says so instantly with a 429, it does not hang. So the budget here is
          # small on purpose: a floor lane that stalls costs the NEXT floor lane its turn.
          timeout: 20
          num_retries: 0

      # ---- the floor is a chain, because a free tier ends ----------------------------
      # Founder, 2026-09-10: "free with linits? what if lnnit is reached? need otto to
      # live forever", and "this has to be sophisticated".
      #
      # He is right, and one free vendor is not a floor. Groq's own headers, read from
      # inside this pod on this key:
      #     x-ratelimit-limit-requests   1000        (per day)
      #     x-ratelimit-limit-tokens     8000        (per minute)
      # Generous for a lifeboat and still finite. So under Groq sit two more free lanes at
      # two more vendors, and the estate already holds a live key for both. Exhausting one
      # is not an outage, it is a hop -- the same mechanism that carries every other hop in
      # this file, with nothing new invented for it.
      #
      # Measured from inside this container, all three the same morning:
      #     groq openai/gpt-oss-120b       0.48s   tool_calls ok
      #     gemini-2.5-flash-lite          0.82s   tool_calls ok
      #     gemini-2.5-flash               0.78s   answered, but returned NO tool call on a
      #                                            prompt that demanded one -- so `lite` is
      #                                            the lane, not the bigger sibling
      # Tool calling is not a nicety here: OTTO_ROUTER_TOOL_MAX_TURNS is 12 and a home that
      # cannot call a tool can only chat.
      - model_name: home-floor-2
        litellm_params:
          model: openai/gemini-2.5-flash-lite
          api_base: https://generativelanguage.googleapis.com/v1beta/openai
          api_key: os.environ/GEMINI_API_KEY
          timeout: 20
          num_retries: 0

      # The last lane, and honestly the weakest -- kept because something beats silence and
      # it is a third vendor again. OpenRouter's free catalogue is genuinely unreliable:
      # of four free models with tool support asked in one run from this pod,
      #     nvidia/nemotron-3-ultra-550b-a55b:free   timed out at 45s
      #     thinkingmachines/inkling:free            403, "only available on agentic harnesses"
      #     google/gemma-4-26b-a4b-it:free           429 from the upstream provider
      #     nvidia/nemotron-3.5-lightning:free       200 in 8.68s, but no tool call
      # so it is last, on a short leash, and never counted on. Its slugs also churn: three
      # `:free` models that every list still names now answer
      # 404 "This model is unavailable for free."
      - model_name: home-floor-3
        litellm_params:
          model: openai/nvidia/nemotron-3.5-lightning:free
          api_base: https://openrouter.ai/api/v1
          api_key: os.environ/OPENROUTER_API_KEY
          # 8.68s measured, and it is the last thing standing between Otto and silence.
          timeout: 25
          num_retries: 0

      # ---- two more vendors, and their meters run in different units -----------------
      # Founder, 2026-09-10: "otto shold neevr be out ofoptins tht ehatthe nati iosall
      # aboit". Three floor lanes is not a matrix, and worse, all three are metered the
      # same way -- Groq counts REQUESTS (1000/day, read from its own headers on this key),
      # OpenRouter counts requests, Gemini counts requests. A day of many short turns
      # empties all three at once.
      #
      # Cerebras counts TOKENS instead (1,000,000/day, the vendor's published figure), and
      # NVIDIA counts per MODEL rather than per account. Neither number is measured here --
      # the only thing measured is whether the lane answers, and the first probe after this
      # lands corrects the model id the way the Groq row above was corrected. What IS true
      # by construction is the shape: a lane whose meter runs in a different unit from the
      # lane above it does not empty on the same afternoon. That is the property being
      # bought, not the size of either number.
      #
      # Both are OpenAI-compatible, so both are lanes and not adapters, and both take the
      # direct road out of the pod -- api.cerebras.ai and integrate.api.nvidia.com join
      # NO_PROXY on the sidecar in deployment.yaml for the same reason api.groq.com did.
      # Their keys arrive through the founder's Bitwarden door
      # (platform/vendors/consoles.yaml -> platform/human-vault-bridge), never through a
      # repository secret and never through a session.
      - model_name: home-floor-4
        litellm_params:
          model: openai/llama-3.3-70b
          api_base: https://api.cerebras.ai/v1
          api_key: os.environ/CEREBRAS_API_KEY
          timeout: 20
          num_retries: 0

      - model_name: home-floor-5
        litellm_params:
          model: openai/meta/llama-3.3-70b-instruct
          api_base: https://integrate.api.nvidia.com/v1
          api_key: os.environ/NVIDIA_API_KEY
          timeout: 25
          num_retries: 0

    router_settings:
      # The whole point of the file. Every lane Otto can ask for walks the three homes in
      # order and stops at the first that answers.
      # The first hop never lands on the vendor that just died. Every chain below used to
      # open with home-direct, which is MiniMax on a direct line -- the same account as the
      # `minimax` lane it was rescuing. So when MiniMax's balance reached zero on 2026-09-10
      # the lane and its own first fallback failed together and the ladder was a rung shorter
      # than it read. Measured in otto-gateway-8684f564f5-r2gtd that afternoon, one run:
      #     minimax      200  7s   served by openai/gpt-oss-120b   <- Groq, two hops down
      #     home-direct  402  0s   "The Token Plan usage limit has been reached"
      #     home-floor   200  2s   home-floor-2 429   home-floor-3 200  8s
      # It still answered, because Groq sits behind the dead hop. It answered a hop later
      # than it needed to, and on the day Groq is also spent that wasted hop is the outage.
      #
      # So each chain now opens on a DIFFERENT vendor from its own, and each ends on its own
      # vendor's other door -- worth trying last, worthless first:
      #     minimax  is MiniMax  -> Groq, Gemini, OpenRouter, then MiniMax's direct line
      #     deepseek is DeepSeek -> Groq, Gemini, MiniMax, OpenRouter
      #     gemini   is Gemini   -> Groq, MiniMax, OpenRouter, then Gemini's own free tier
      # Four vendors is what this file can reach today. It is not enough and it is not a
      # matrix: docs/explanation/otto-survival-matrix.md names twenty lanes. Measured from
      # this pod on 2026-09-10, FOUR are alive: Groq, Gemini, OpenRouter and DeepSeek --
      # deepseek answered 200 in 1s. (A comment in this tree said "DeepSeek 401 since
      # 2026-09-04". That was a revoked key, replaced since; the founder caught the claim
      # being repeated as if it were a measurement. It was not one. Probe, then write.)
      # ONE is wired and dead: MiniMax, out of balance. THREE are ruled out: SiliconFlow and
      # ModelScope want a Chinese government-ID check, and the MacBook Ollama home the founder
      # killed. That leaves TWELVE usable and unwired. Two of the twelve were counted as
      # needing no credential and do not survive contact: GitHub Models answered
      # 410 "github_models_retirement_brownout" from this pod on 2026-09-10 and is retired,
      # and Workers AI's binding is only a credential INSIDE a Worker -- from here it needs an
      # account-scoped token like any other vendor. The remaining twelve each need one key,
      # and platform/vendors/consoles.yaml is where each one's road is declared.
      fallbacks:
        - minimax:  [home-floor, home-floor-4, home-floor-2, home-floor-5, home-floor-3, home-direct]
        - deepseek: [home-floor-4, home-floor, home-floor-2, home-direct, home-floor-5, home-floor-3]
        - gemini:   [home-floor, home-floor-5, home-direct, home-floor-4, home-floor-3, home-floor-2]
        # A spent lane is PARKED, not re-asked. Without this the chain still works but it
      # works stupidly: the day Groq's thousandth request is spent, every single turn pays
      # a round trip to Groq to be told 429 again before it reaches Gemini. allowed_fails
      # 1 with a 5-minute cooldown means the first 429 takes that lane out of the chain and
      # the turns behind it go straight to the next vendor. This is the router's own
      # cooldown machinery, which is the whole reason the switch is litellm and not a
      # script of mine.
      allowed_fails: 1
      cooldown_time: 300

      # `embed` deliberately has NO tail. otto_facts.embedding is a 1536-wide column,
        # matched to gemini-embedding-001; the laptop's nomic-embed-text is 768-wide, so a
        # fallback there would not degrade recall, it would write vectors of the wrong shape
        # into the fact store. Otto already handles a failed embedding correctly without
        # help: OTTO_MEMORY_EMBEDDING_TIMEOUT_S is 1.5s and retrieval falls back to the
        # lexical arm (deployment.yaml). Nobody loses an answer; recall is a little blunter
        # while home 1 is away. That is the right trade and a second home is not.

    litellm_settings:
      # No callbacks. No otel, no langfuse, no cache, no database. Tracing and spend
      # accounting happen at home 1, which is the estate router; a lifeboat that needs a
      # collector, a Redis and a Postgres to float is not a lifeboat. On 2026-09-09 the
      # collector was Init:0/1 and unschedulable and the Redis was on the partitioned
      # node -- both of those killed a router replica that night.
      drop_params: true
      turn_off_message_logging: true
      # home 1 (20) + home 2 (60) + the three floor lanes (20 + 20 + 25), plus the hops.
      # The whole ladder, every lane silent, and the founder still gets an answer from the
      # last one inside Otto's client ceiling -- which deployment.yaml sets to 170 for
      # exactly this arithmetic. The default 120 would have hung up mid-floor.
      request_timeout: 155

    general_settings:
      master_key: os.environ/OTTO_BRAIN_KEY
