# The Universal Event Gateway. Same image as platform/hermes-agent and platform/otto-golden
# -- one build, several commands -- and the tag below carries the same $imagepolicy marker,
# so the estate's one ImageUpdateAutomation bumps all three together on every build. No new
# automation object: two automations on one push branch collide (crew#406).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: otto-gateway
resources:
  - namespace.yaml
  - quota.yaml
  - network-policy.yaml
  - external-secret.yaml
  - agent-env.yaml
  - binding-seed.yaml
  - deployment.yaml
  - telegram-mirror.yaml
  - httproute.yaml
  - edge-manners.yaml
  - availability.yaml
  - registration-reconciler.yaml
  - router-lanes.yaml
  - three-homes.yaml
  - three-homes-secrets.yaml
  - answer-probe.yaml
  - memory-store-job.yaml
images:
  - name: ghcr.io/chidionyema/hermes-agent
    newTag: main-98-743de6d8213a24005b1ac56140dbaa248f6b7048 # {"$imagepolicy": "flux-system:hermes-agent:tag"}
