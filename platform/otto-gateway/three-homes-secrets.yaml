# The two credentials Otto's lifeboat needs, and nothing else.
#
# Both are read as FILES and exported by the sidecar's own entrypoint, never delivered as pod
# environment: Kyverno's secrets-not-from-env-vars policy refuses env.valueFrom.secretKeyRef and
# envFrom.secretRef on a pod (crew#341), and platform/llm/litellm.yaml already carries the same
# shape for the same reason.
---
# Home 2's key is NOT declared here any more, and the absence is the point.
#
# It used to read vault entry `litellm-upstream`, field MINIMAX_API_KEY. On 2026-09-10 that
# value was proved revoked at the vendor -- `HTTP 401 {"message":"invalid api key (2049)"}`,
# measured from inside the router pod -- while the founder's own key answered. There were two
# keys, and the estate had wired Otto to the dead one. The vault copy has since been unset, so
# an ExternalSecret naming it can only ever resolve to nothing:
#     ExternalSecret/otto-gateway-direct   Ready=False   could not get secret data from provider
#
# The live key reaches the cluster through the founder's Bitwarden door
# (platform/human-vault-bridge/externalsecrets.yaml, generated from the `targets:` of
# platform/vendors/consoles.yaml by bin/idp-vendor-render), which mints Secret/human-minimax in
# this namespace. The deployment's brain-secrets volume mounts that. One rotation in the
# console still reaches the router and the lifeboat together -- through the door a person
# actually uses, rather than through a copy nobody was watching go stale.
---
# The Tailscale device key for this pod, so home 3 has a road to the founder's laptop.
# Identical mechanism to platform/hermes-agent/tailscale.yaml: the one estate Tailscale OAuth
# client doubles as a TS_AUTHKEY (containerboot mints a fresh ephemeral device key from a
# tskey-client- value at pod start), composed by ESO's own template, never by a script and never
# by a hand-pasted key. Non-ephemeral so the node's state survives a restart, pre-authorised so
# no admin-console tap is needed per pod start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otto-gateway-tailscale
  namespace: otto-gateway
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: otto-gateway-tailscale
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TS_AUTHKEY: "{{ .client_secret }}?ephemeral=false&preauthorized=true"
  data:
    - secretKey: client_secret
      remoteRef: { key: tailscale-operator, property: client_secret }
