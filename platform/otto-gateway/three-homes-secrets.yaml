# The two credentials Otto's lifeboat needs, and nothing else.
#
# Both are read as FILES and exported by the sidecar's own entrypoint, never delivered as pod
# environment: Kyverno's secrets-not-from-env-vars policy refuses env.valueFrom.secretKeyRef and
# envFrom.secretRef on a pod (crew#341), and platform/llm/litellm.yaml already carries the same
# shape for the same reason.
---
# Home 2's key is NOT here, and its absence is the fix for a dead second home (2026-09-10).
#
# This file used to carry an ExternalSecret `otto-gateway-direct` reading vault entry
# `litellm-upstream`, field MINIMAX_API_KEY, and claimed that made rotation reach the router
# and the lifeboat together. It did the opposite. MiniMax is a human-vault vendor: the founder
# rotates it in Bitwarden Secrets Manager, and the vault copy was a second credential that was
# seeded once and never rotated. Measured from inside the router pod against api.minimax.io on
# 2026-09-10, values never printed:
#
#   vault  litellm-upstream  -> HTTP 401  {"message":"invalid api key (2049)"}
#   human  bitwarden door    -> ANSWERED
#
# The router never noticed, because litellm.yaml exports the human mount after the vault mount
# and the later export wins. Otto's lifeboat read the vault alone, so home 2 answered 401 on
# every fall-through for as long as it has existed.
#
# So the key now arrives the one way it arrives everywhere else: Secret `human-minimax` in this
# namespace, rendered into platform/human-vault-bridge/externalsecrets.yaml from the
# `targets:` of the minimax vendor in platform/vendors/consoles.yaml. One key, one door, one
# rotation -- and no file here to go stale, because there is no second copy to go stale.
# The Tailscale device key for this pod, so home 3 has a road to the founder's laptop.
# Identical mechanism to platform/hermes-agent/tailscale.yaml: the one estate Tailscale OAuth
# client doubles as a TS_AUTHKEY (containerboot mints a fresh ephemeral device key from a
# tskey-client- value at pod start), composed by ESO's own template, never by a script and never
# by a hand-pasted key. Non-ephemeral so the node's state survives a restart, pre-authorised so
# no admin-console tap is needed per pod start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otto-gateway-tailscale
  namespace: otto-gateway
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: otto-gateway-tailscale
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TS_AUTHKEY: "{{ .client_secret }}?ephemeral=false&preauthorized=true"
  data:
    - secretKey: client_secret
      remoteRef: { key: tailscale-operator, property: client_secret }
