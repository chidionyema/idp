# The Universal Event Gateway itself: `python -m otto.ingress`, from the same image the rest
# of Otto runs (one build, several commands). The entrypoint refuses to start without the
# collector, the binding database and the event bus, in that order, so a pod that is
# listening is a pod that can accept a customer's event.
apiVersion: v1
kind: Service
metadata:
  name: otto-gateway
  namespace: otto-gateway
  labels:
    app: otto-gateway
    app.kubernetes.io/name: otto-gateway
    app.kubernetes.io/part-of: idp
    backstage.io/kubernetes-id: otto-gateway
spec:
  type: ClusterIP
  selector: { app: otto-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: otto-gateway
  namespace: otto-gateway
  labels:
    app: otto-gateway
    app.kubernetes.io/name: otto-gateway
    app.kubernetes.io/part-of: idp
    backstage.io/kubernetes-id: otto-gateway
spec:
  # Two, because this is a routed surface and a drain may never take the last door
  # (crew#539 availability).
  replicas: 2
  selector:
    matchLabels: { app: otto-gateway }
  template:
    metadata:
      labels:
        app: otto-gateway
        app.kubernetes.io/name: otto-gateway
        app.kubernetes.io/part-of: idp
    spec:
      # The one ingress door for every channel, so it is seated before the workloads it serves:
      # the class's own description is "monitoring and routing are seated before anything else on
      # the node" (platform/priority-classes/priorityclasses.yaml), and this is the routing. With
      # no class named at all the scheduler ranks it at zero, below platform-batch's nightly jobs,
      # and under CPU pressure the estate would evict its front door to finish a batch run.
      priorityClassName: infrastructure-critical
      # DoNotSchedule and not ScheduleAnyway, the same choice otto-golden makes: two doors on
      # one node are one eviction, and bin/idp-availability-gate refuses the softer form for
      # a routed surface. On an estate with one node the second pod stays pending until a
      # second node exists, which is the honest state rather than a false pair.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: otto-gateway }
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Binding row one, from the vault. Reads the operator's chat and the Telegram
        # webhook word from mounted files, turns the word into the one-way fingerprint the
        # lookup indexes on, and writes the row. Idempotent: safe on every replica and on
        # every restart, and it never prints either value.
        - name: seed-binding
          image: docker.io/library/postgres:17.6-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              PGPASSWORD=$(cat /run/secrets/otto-gateway-db/POSTGRES_PASSWORD); export PGPASSWORD
              PGCONNECT_TIMEOUT=5; export PGCONNECT_TIMEOUT
              fingerprint=$(sha256sum < /run/secrets/otto-gateway-channels/OTTO_TELEGRAM_WEBHOOK_SECRET | cut -d' ' -f1)
              fingerprint_alerts=$(sha256sum < /run/secrets/otto-gateway-channels/OTTO_ALERTS_WEBHOOK_SECRET | cut -d' ' -f1)
              psql -h estate-rw.estate-db.svc.cluster.local -U otto_gateway -d otto_gateway -v ON_ERROR_STOP=1 \
                -v chat_id="$(cat /run/secrets/otto-gateway-channels/TELEGRAM_CHAT_ID)" \
                -v fingerprint="$fingerprint" \
                -v fingerprint_alerts="$fingerprint_alerts" \
                -f /seed/seed.sql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: db-password, mountPath: /run/secrets/otto-gateway-db, readOnly: true }
            - { name: channels, mountPath: /run/secrets/otto-gateway-channels, readOnly: true }
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: gateway
          image: ghcr.io/chidionyema/hermes-agent
          workingDir: /app/estate
          command: ["/bin/sh", "-c"]
          # The channel credential is read from its mounted file and exported here, never
          # delivered as pod environment: Kyverno's secrets-not-from-env-vars policy refuses
          # env.valueFrom.secretKeyRef on a pod. The variable name is not a choice made here
          # -- otto/ingress/secrets.py maps the binding row's references
          # `vault://otto-staging-telegram/webhook_secret` and
          # `vault://otto-staging-telegram/token` onto exactly these two names. The first
          # is how a message is recognised on the way in; the second is how the answer is
          # sent on the way back out.
          args:
            - |
              set -eu
              OTTO_CHANNEL_SECRET_VAULT_OTTO_STAGING_TELEGRAM_WEBHOOK_SECRET=$(cat /run/secrets/otto-gateway-channels/OTTO_TELEGRAM_WEBHOOK_SECRET)
              export OTTO_CHANNEL_SECRET_VAULT_OTTO_STAGING_TELEGRAM_WEBHOOK_SECRET
              OTTO_CHANNEL_SECRET_VAULT_OTTO_STAGING_TELEGRAM_TOKEN=$(cat /run/secrets/otto-gateway-channels/OTTO_TELEGRAM_BOT_TOKEN)
              export OTTO_CHANNEL_SECRET_VAULT_OTTO_STAGING_TELEGRAM_TOKEN
              OTTO_CHANNEL_SECRET_VAULT_FLUX_TELEGRAM_WEBHOOK_SECRET=$(cat /run/secrets/otto-gateway-channels/OTTO_ALERTS_WEBHOOK_SECRET)
              export OTTO_CHANNEL_SECRET_VAULT_FLUX_TELEGRAM_WEBHOOK_SECRET
              OTTO_CHANNEL_SECRET_VAULT_FLUX_TELEGRAM_TOKEN=$(cat /run/secrets/otto-gateway-channels/OTTO_ALERTS_BOT_TOKEN)
              export OTTO_CHANNEL_SECRET_VAULT_FLUX_TELEGRAM_TOKEN
              # otto.router.providers reads this from the environment and refuses to call a
              # model without it; the file is the mount, the environment is what the library
              # reads, and this line is the join between the two (same shape as the two above
              # and as platform/research-engine/cronjob.yaml).
              LITELLM_API_KEY=$(cat /run/secrets/otto-gateway-router/LITELLM_API_KEY)
              export LITELLM_API_KEY
              # The same key under the second name that reads it: the memory engine's
              # embedding provider (hermes-v2 otto/memory/embeddings_litellm.py). One
              # credential and one router, not a second door to a vendor.
              OTTO_MEMORY_EMBEDDING_API_KEY=$LITELLM_API_KEY
              export OTTO_MEMORY_EMBEDDING_API_KEY
              # The fact store the answering lane now reads memory from, instead of
              # waiting on hindsight's cross-encoder for 31.87s per question
              # (hermes-v2 otto/memory/fast_recall.py, and its PR for the trace).
              # libpq's own variables rather than a single URL, because a password
              # containing a URL-special character would otherwise have to be
              # percent-encoded here; no credential is typed in this file either way,
              # it is read from the file OTTO_INGRESS_DB_PASSWORD_FILE already names.
              # Unset, the read path is a no-op and hindsight keeps every write, so a
              # gateway that cannot reach this store answers exactly as it did before.
              PGHOST=$OTTO_INGRESS_DB_HOST
              PGPORT=$OTTO_INGRESS_DB_PORT
              PGUSER=$OTTO_INGRESS_DB_USER
              PGDATABASE=$OTTO_INGRESS_DB_NAME
              PGPASSWORD=$(cat "$OTTO_INGRESS_DB_PASSWORD_FILE")
              export PGHOST PGPORT PGUSER PGDATABASE PGPASSWORD
              # The fork's credentials (GITHUB_TOKEN, EXA key, ESTATE_MCP_KEY ...) arrive as one
              # file per name under HERMES_ENV_DIR; export them the way the image's own
              # entrypoint does (hermes-v2 deploy/k8s/entrypoint.sh), since this command
              # replaces that entrypoint. A missing mount exports nothing and the door
              # answers as before, hands empty.
              # Only the unbraced form of the variable, never ${HERMES_ENV_DIR:-}: Flux's
              # postBuild substitution reads that as its own default syntax and rewrote it
              # to "" before the pod ever saw it, so the test was always false and gh in
              # the live pod reported "not logged into any GitHub hosts" while every
              # credential file sat mounted beside it (gate: flux_subst_scan).
              if [ -d "$HERMES_ENV_DIR" ]; then
                for f in "$HERMES_ENV_DIR"/*; do
                  [ -f "$f" ] || continue
                  n=$(basename "$f")
                  case "$n" in [A-Z_][A-Z0-9_]*) export "$n=$(cat "$f")" ;; esac
                done
              fi
              mkdir -p "$HERMES_HOME/skills" "$HERMES_HOME/bin"
              # The image's skills (82 SKILL.md under /app/hermes-agent/skills on main-92) never
              # reached HERMES_HOME because this command replaces the image entrypoint: the
              # door answered "skills_list: 0" on 2026-09-06 while they sat one directory over.
              # No clobber, so a skill edited on the volume survives an image update.
              cp -Rn /app/hermes-agent/skills/. "$HERMES_HOME/skills/" 2>/dev/null || true
              # gh in the model's shell. hermes-agent's terminal tool strips GH_TOKEN and
              # GITHUB_TOKEN from the environment it hands the model (tools/environments/
              # local.py), so the token exported above never reaches gh, and the live pod
              # answered "You are not logged into any GitHub hosts" (2026-09-06, the
              # "unverified" Telegram replies). The token is the one-hour installation token
              # the GithubAccessToken generator mints (agent-env.yaml), so a one-time
              # `gh auth login` would go stale within the hour; this wrapper reads the
              # mounted file, which kubelet refreshes, on every call. Git borrows the same
              # wrapper for its credential.
              printf '#!/bin/sh\nGH_TOKEN=$(cat %s/GITHUB_TOKEN) exec /usr/local/bin/gh "$@"\n' "$HERMES_ENV_DIR" > "$HERMES_HOME/bin/gh"
              chmod 0755 "$HERMES_HOME/bin/gh"
              PATH="$HERMES_HOME/bin:$PATH"
              export PATH
              git config --global credential.helper "!$HERMES_HOME/bin/gh auth git-credential"
              git config --global --add safe.directory '*'
              exec python -m otto.ingress
          # The router lanes, one source for the door and for the probe that grades it.
          # envFrom, not env: an inline env entry of the same name would win over the
          # ConfigMap and put the drift straight back.
          envFrom:
            - configMapRef: { name: otto-router-lanes }
          env:
            - { name: OTTO_INGRESS_PORT, value: "8080" }
            - { name: OTTO_INGRESS_DB_HOST, value: estate-rw.estate-db.svc.cluster.local }
            - { name: OTTO_INGRESS_DB_PORT, value: "5432" }
            - { name: OTTO_INGRESS_DB_NAME, value: otto_gateway }
            - { name: OTTO_INGRESS_DB_USER, value: otto_gateway }
            # libpq's connect timeout. Without it a Postgres that accepts the TCP
            # handshake and then says nothing holds the first query open for the
            # kernel's default, minutes, and the app-level recall budget never runs.
            - { name: PGCONNECT_TIMEOUT, value: "5" }
            - { name: OTTO_INGRESS_DB_PASSWORD_FILE, value: /run/secrets/otto-gateway-db/POSTGRES_PASSWORD }
            - { name: OTTO_NATS_URL, value: "nats://nats.event-bus.svc:4222" }
            # The estate's memory (platform/hindsight), one bank for every surface, so a
            # person remembered from Telegram is remembered on the next channel too.
            # otto/memory/hindsight.py: unset is a no-op, unreachable never costs an answer.
            - { name: OTTO_MEMORY_HINDSIGHT_URL, value: "http://hindsight-api.hindsight.svc:8888" }
            - { name: OTTO_MEMORY_BANK, value: "hermes" }
            # Recall is on the answering path, so it is bounded: hindsight's own consolidation
            # timings on 2026-09-05 read recall=96.951s and recall=1.886s in consecutive
            # batches, and the client's old hardcoded 3s meant hindsight logged
            # `[RECALL CANCELLED] reason=client disconnected` for every request this gateway
            # made. Ten seconds was not enough either: on 2026-09-05 hindsight logged the only
            # two recalls of the day, 09:04:38 and 09:05:19, and cancelled both -- the client
            # gave up at exactly 10.0s while the server was still working 27s and 31s in.
            # Not one recall completed, so every answer that day was composed with chars=0.
            # Thirty seconds is the founder's call (2026-09-05); a recall that overruns still
            # costs no one their answer, it just arrives without memory.
            - { name: OTTO_MEMORY_RECALL_TIMEOUT_S, value: "30" }
            - { name: OTTO_MEMORY_RETAIN_TIMEOUT_S, value: "5" }
            # The vector half of the L2 read. Without these the lane still answers --
            # Postgres full-text search over the same rows is the lexical arm of the
            # hybrid and is a tested mode, not a failure -- but only half the recall
            # quality. `embed` is a lane on the estate router, never a vendor model id
            # (LAW 34); platform/llm/config.yaml resolves it to gemini-embedding-001 at
            # 1536 dimensions, which is the width otto_facts.embedding is created at, so
            # the column and the model cannot drift apart.
            - { name: OTTO_MEMORY_EMBEDDING_URL, value: "http://litellm.llm.svc.cluster.local:4000/v1" }
            - { name: OTTO_MEMORY_EMBEDDING_MODEL, value: "embed" }
            - { name: OTTO_MEMORY_EMBEDDING_DIM, value: "1536" }
            # Bounded on the answering path like every other call here. An embedding that
            # overruns costs no one their answer: retrieval falls back to the lexical arm.
            - { name: OTTO_MEMORY_EMBEDDING_TIMEOUT_S, value: "1.5" }
            # LAW 50. The entrypoint refuses to start without this, so a door that cannot be
            # seen never opens rather than running dark.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://signoz-otel-collector.observability.svc:4318" }
            # Otto's three homes (founder order 2026-09-09, "otto must have 3 homes"), and the
            # only line of Otto's own configuration that changes to get them. Loopback: the
            # otto-brain sidecar in this same pod. It is the estate's one router first
            # (home 1, http://litellm.llm.svc.cluster.local:4000/v1 -- still every happy-path
            # turn, still the budgets, still Langfuse), then a direct vendor line with no
            # cluster hop, then the founder's Mac on local silicon over Tailscale. The chain
            # and the reasoning are platform/otto-gateway/three-homes.yaml.
            #
            # Reaching 127.0.0.1 crosses no Service, no CNI, no node and no DNS -- which is
            # exactly what took the door down on 2026-09-09, when one broken VXLAN link
            # between the two workers killed CoreDNS, the collector, a router replica and Otto
            # in one stroke.
            - { name: LITELLM_BASE_URL, value: "http://127.0.0.1:4010/v1" }
            # The four lane values are not here. They are one ConfigMap,
            # platform/otto-gateway/router-lanes.yaml, read through the envFrom above,
            # because this door and the drill that grades it (answer-probe.yaml) held
            # them as separate literals and drifted apart twice -- #1678 on 2026-09-05
            # and idp#2504 on 2026-09-08, when the probe reported a green judgment lane
            # on deepseek while the door ran minimax. That file carries the values and
            # the measurements behind each one.
            - { name: PYTHONUNBUFFERED, value: "1" }
            # docs/specs/otto-door-hands-and-senses.md step 5: the door's hands. HERMES_ENV_DIR is
            # the secret mount the shell above exports (Kyverno refuses secretKeyRef on a pod);
            # HERMES_HOME is where the fork keeps skills and its own memory. OTTO_TOOLSETS is the
            # comma list otto/boot/pipeline.py build_registry bridges behind the tool gateway
            # (hermes-v2 #88); OTTO_GATEWAY_MAX_TOOLS is the registry ceiling otto/gateway/config.py
            # reads; OTTO_ROUTER_TOOL_MAX_TURNS bounds the provider tool loop (hermes-v2 #89).
            - { name: HOME, value: /data }
            - { name: HERMES_HOME, value: /data }
            - { name: HERMES_ENV_DIR, value: /run/secrets/hermes-agent-env }
            - { name: OTTO_TOOLSETS, value: "terminal,web,search,skills,file,vision,tts,memory,todo,cronjob,code_execution" }
            - { name: OTTO_GATEWAY_MAX_TOOLS, value: "256" }
            - { name: OTTO_ROUTER_TOOL_MAX_TURNS, value: "12" }
          ports:
            - { containerPort: 8080, name: http }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 400m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: db-password, mountPath: /run/secrets/otto-gateway-db, readOnly: true }
            - { name: channels, mountPath: /run/secrets/otto-gateway-channels, readOnly: true }
            - { name: router, mountPath: /run/secrets/otto-gateway-router, readOnly: true }
            - { name: agent-env, mountPath: /run/secrets/hermes-agent-env, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        # ---- home 1/2/3 switch -------------------------------------------------------------
        # The same litellm binary the estate already runs, as a sidecar on loopback (THE
        # HEADLINE rule 1: no script for a problem a proven platform solves). The
        # NON-database image: no Postgres, no Redis, no callbacks, no tracing, no UI. On
        # 2026-09-09 the database image's replica on the partitioned node died on a Redis
        # timeout to a cache on the other node -- a lifeboat that needs a cache to float is
        # not a lifeboat. Everything it needs is this pod and the config below.
        - name: otto-brain
          image: ghcr.io/berriai/litellm:v1.98.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              for f in /run/secrets/otto-brain/*/*; do
                [ -f "$f" ] || continue
                export "$(basename "$f")=$(cat "$f")"
              done
              # The lifeboat is loopback-only, so its master key is never a credential anyone
              # can reach; it exists because litellm requires one, and it is derived from the
              # router key already mounted rather than minting a second secret nobody rotates.
              OTTO_BRAIN_KEY="sk-$(printf '%s' "$LITELLM_API_KEY" | sha256sum | cut -c1-40)"
              export OTTO_BRAIN_KEY
              exec litellm --config /etc/otto-brain/config.yaml --port 4010 --host 127.0.0.1
          env:
            - { name: HOME, value: /tmp }
            - { name: LITELLM_LOG, value: INFO }
            # Home 3 is reached through the Tailscale sidecar's HTTP proxy; everything else --
            # the estate router on the cluster network, the direct vendor line on ordinary pod
            # egress -- must NOT be. NO_PROXY names them, so exactly one destination in this
            # container's world takes the tunnel: the founder's laptop.
            - { name: ALL_PROXY, value: "http://127.0.0.1:1055" }
            - { name: HTTP_PROXY, value: "http://127.0.0.1:1055" }
            - { name: HTTPS_PROXY, value: "http://127.0.0.1:1055" }
            - { name: NO_PROXY, value: "127.0.0.1,localhost,api.minimax.io,.svc,.svc.cluster.local,.cluster.local,10.0.0.0/8" }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # require-pod-probes (Kyverno autogen-validate-probes) needs one on every container.
          # /health/liveliness needs no key and no upstream, so a probe failure is this
          # sidecar's own state and never a vendor's.
          #
          # These are exec probes, not httpGet, and that is not a style choice. The sidecar
          # binds 127.0.0.1 on purpose (R20, and the whole point of a lifeboat you reach
          # without crossing a network), so an httpGet probe -- which the kubelet sends to the
          # pod IP -- would never arrive. Naming `host: 127.0.0.1` to redirect it is the one
          # thing PodSecurity `restricted` forbids outright, and otto-gateway enforces
          # restricted: every pod create was refused with `probe or lifecycle host (container
          # "otto-brain" uses probe or lifecycle host "127.0.0.1")`, so the ReplicaSet made no
          # pod, the Deployment never went Available, and Otto's three homes sat merged in git
          # for hours while the old single-home pod kept serving. An exec probe runs inside the
          # container, where loopback is the sidecar, and needs no host field at all.
          readinessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4010/health/liveliness', timeout=2)"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4010/health/liveliness', timeout=2)"]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4010/health/liveliness', timeout=2)"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          volumeMounts:
            - { name: three-homes, mountPath: /etc/otto-brain, readOnly: true }
            - { name: brain-secrets, mountPath: /run/secrets/otto-brain/direct, readOnly: true }
            - { name: router, mountPath: /run/secrets/otto-brain/router, readOnly: true }
            - { name: tmp, mountPath: /tmp }

        # ---- the road to home 3 ------------------------------------------------------------
        # Same sidecar, same mechanism and same operator-minted key as
        # platform/hermes-agent/tailscale.yaml, which has carried the tailnet node `hermes-pod`
        # since crew#516 CP5. It was on that pod and not this one, which is why the founder's
        # assistant -- the pod Telegram actually reaches -- had no route to his Mac at all.
        #
        # Userspace mode: no NET_ADMIN, no /dev/net/tun, nothing privileged. The tunnel is
        # offered to the rest of the pod as a local HTTP proxy on 1055, which is what
        # otto-brain's HTTP_PROXY above points at.
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.3
          env:
            - { name: TS_AUTHKEY, value: "file:/run/secrets/otto-gateway-tailscale/TS_AUTHKEY" }
            - { name: TS_HOSTNAME, value: otto-pod }
            - { name: TS_USERSPACE, value: "true" }
            - { name: TS_STATE_DIR, value: /data/tailscale }
            - { name: TS_KUBE_SECRET, value: "" }
            - { name: TS_SOCKET, value: /tmp/tailscaled.sock }
            - { name: TS_SOCKS5_SERVER, value: "localhost:1056" }
            - { name: TS_OUTBOUND_HTTP_PROXY_LISTEN, value: "localhost:1055" }
            - { name: TS_EXTRA_ARGS, value: "--advertise-tags=tag:k8s" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            # tailscaled writes only its state (TS_STATE_DIR=/data) and its socket (/tmp), and
            # both are emptyDir mounts this pod already carries -- so nothing needs a writable
            # image layer. KSV-0014 / require-ro-rootfs.
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec: { command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"] }
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec: { command: ["tailscale", "--socket=/tmp/tailscaled.sock", "status", "--json"] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: tailscale-authkey, mountPath: /run/secrets/otto-gateway-tailscale, readOnly: true }
      volumes:
        - name: db-password
          secret: { secretName: otto-gateway-db }
        - name: channels
          secret: { secretName: otto-gateway-channels }
        - name: router
          secret: { secretName: otto-gateway-router }
        - name: seed
          configMap: { name: otto-gateway-binding-seed }
        - name: tmp
          emptyDir: {}
        # The three homes and their order, one file, read only by the otto-brain sidecar.
        - name: three-homes
          configMap: { name: otto-three-homes }
        # Home 2's key. Optional so a vault entry that is late costs Otto home 2 and leaves
        # homes 1 and 3 answering, rather than holding the whole door closed.
        - name: brain-secrets
          secret: { secretName: otto-gateway-direct, optional: true }
        - name: tailscale-authkey
          secret: { secretName: otto-gateway-tailscale, optional: true }
        # Step 5: the fork's env dir, one file per credential name. The MCP key is optional so a
        # vault entry that is late never holds the door closed.
        - name: agent-env
          projected:
            sources:
              - secret: { name: hermes-agent-env }
              - secret: { name: hermes-agent-mcp, optional: true }
        # HERMES_HOME. The spec asks for a claim sized like the agent's; this Deployment runs two
        # replicas and the cluster's only class (oci-bv) is ReadWriteOnce, so a shared claim would
        # leave one replica Pending. Per-pod scratch until the door is a StatefulSet; skills are
        # in the image, and memory is hindsight + the fact store, not this directory.
        - name: data
          emptyDir: { sizeLimit: 2Gi }
