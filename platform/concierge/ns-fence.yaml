# The fence for the concierge namespace, shipped IN the namespace row rather than after it.
# Copied from the generated shape (platform/ns-fences/reloader.yaml). bin/idp-ns-fence-gen only
# fences namespaces that EXIST -- it holds a namespace declared in git and not yet applied as
# `pending` and fences it on a later run. That leaves a window where a new namespace is created
# unfenced, which is the state bin/ns-fence-gate refuses. Shipping the fence with the namespace
# closes the window: the objects land in the same apply.
apiVersion: v1
kind: LimitRange
metadata:
  name: ns-defaults
  namespace: concierge
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 25m
      memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ns-ceiling
  namespace: concierge
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 1024Mi
    pods: '10'
