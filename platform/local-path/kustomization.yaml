# Node-local volumes, so a small claim stops costing a 50 GB OCI block volume.
#
# Measured 2026-09-29: 15 PVCs asked for 148 Gi and OCI provisioned 750 Gi, because every block
# volume is at least 50 GB. The tenancy's block-storage limit reads used 950 GB, available -750,
# so Oracle refused every new volume (coroot x3 and ollama Pending, 396 failures in 24 h). The
# node boot disks had 80 GB free. A claim on the `local-path` class lands in
# /opt/local-path-provisioner on the node it schedules to and costs only its real bytes.
#
# Opt-in, never the default: a local-path volume lives and dies with its node, so durable state
# (estate-db, the store) stays on oci-bv. Upstream: rancher/local-path-provisioner v0.0.31.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage.yaml
patches:
  - target: {kind: Deployment, name: local-path-provisioner}
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
