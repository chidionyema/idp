# crew#539: scheduling immunity. Cluster-scoped PriorityClasses and the Kyverno policy, plus the
# balloon Deployment in its own namespace. Rows that carry infrastructure-critical
# (observability, mcp, hermes-agent, cluster-state) depend on this row in clusters/oke/platform.yaml so
# the class exists before a pod names it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scheduling
resources:
  - namespace.yaml
  - priorityclasses.yaml
  - balloon.yaml
  - require-priority-class.yaml
  - require-availability.yaml
  - capacity-affinity.yaml
