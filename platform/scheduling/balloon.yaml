# Balloon pods (crew#539 CP1, founder spec): a Deployment of pause containers that request CPU and
# do nothing. When a real pod needs the CPU during a node swap the scheduler preempts a balloon in
# milliseconds instead of waiting the 3-5 minutes a new VM takes. Sized for the one 4 OCPU node
# (platform/keda/keda.yaml): 2 x 250m = 500m, 12.5 % of the node, inside the founder's 10-20 %.
# 2026-08-29: 50m of the reserve went to the K8sGPT analyzer (platform/healing/analyzer/k8sgpt.yaml),
# which Kyverno require-requests-limits refused without a CPU request (run 33239797940); the paper
# budget (crew#584, 5.0 cores) is a ratchet and does not move, so the reserve pays.
# A preempted balloon then sits Pending, which is exactly the signal the OKE Cluster Autoscaler
# (CP4, through oke-check) boots a node on; until CP4 lands this is a standing 15 % reservation.
# registry.k8s.io/pause, not k8s.gcr.io: the old registry is frozen (kubernetes.io, 2023-03).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: balloon
  labels: { app.kubernetes.io/name: balloon, app.kubernetes.io/part-of: idp, idp.platform/capacity-approved: "true" }  # the reserve is the point (crew#539); measured, not fat
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: balloon }
  template:
    metadata:
      labels: { app.kubernetes.io/name: balloon, app.kubernetes.io/part-of: idp, idp.platform/capacity-approved: "true" }   # the reserve is the point (crew#539), not a fat pod
    spec:
      priorityClassName: balloon
      terminationGracePeriodSeconds: 0
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 250m, memory: 16Mi }
            limits: { cpu: 250m, memory: 16Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
