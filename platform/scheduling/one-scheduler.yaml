# The recurring jobs that are not Dagster schedules yet.
#
# Founder, 2026-09-07: "we should only be using dagster for scheduling". Temporal is a durable
# workflow engine, not a scheduler, and is not on this list. bin/idp-one-scheduler grades this
# file against the tree: a new recurring job outside Dagster fails, and a row whose job is gone
# fails too, so the list can only shrink.
