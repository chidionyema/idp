# The login portal's own hostname. external-dns publishes it from this route (platform/dns);
# the certificate SAN comes from the Gateway listener (cert-manager Gateway annotation).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: identity
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-auth
  hostnames:
    - "auth.${ESTATE_ZONE}"
  rules:
    - backendRefs:
        - name: authelia
          port: 80
