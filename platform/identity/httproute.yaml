# The login hostname: GitHub sends the founder back to https://auth.<zone>/oauth2/callback and
# oauth2-proxy sets one cookie for .<zone>, so every front-door hostname shares the session.
# external-dns publishes the hostname from this route (platform/dns); the certificate SAN comes
# from the Gateway listener. The ReferenceGrant lets the catalogue's route in namespace backstage
# send its /oauth2/ path here, which is where the redirect from the ForwardAuth lands.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: login
  namespace: identity
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-auth
  hostnames:
    - "auth.${ESTATE_ZONE}"
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: front-door-oauth2-path
  namespace: identity
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: backstage
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: observability
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: healthchecks
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
