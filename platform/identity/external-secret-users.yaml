# The file backend (see external-secret.yaml): one argon2id hash from the vault, never a password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: authelia-users
    template:
      data:
        users_database.yml: |
          users:
            founder:
              displayname: Founder
              email: "{{ .email }}"
              password: "{{ .password_hash }}"
              groups: [admins]
  dataFrom:
    - extract: { key: authelia-users }
