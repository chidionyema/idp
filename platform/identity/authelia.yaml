# Authelia (ADR 0003): the OIDC provider and the forward-auth endpoint the gateway subrequests.
# One binary, file users, sqlite on a 1Gi volume, no SMTP: password resets are disabled and the
# notifier writes to a file, so nothing here depends on a mail provider.
# Chart: oci://ghcr.io/authelia/chartrepo/authelia 0.11.6 (app 4.39.20), read 2026-08-25 from
# artifacthub.io/packages/helm/authelia/authelia. Secrets come from the estate vault through
# External Secrets (external-secret.yaml); the chart mounts them under /secrets by the file names
# its own defaults expect, so no *.secret_name override is needed.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: identity
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/authelia/chartrepo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: identity
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: authelia
      version: 0.11.6
      sourceRef:
        kind: HelmRepository
        name: authelia
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ingress:
      enabled: false
    secret:
      existingSecret: authelia
    persistence:
      enabled: true
      size: 1Gi
    pod:
      kind: Deployment
      replicas: 1
      securityContext:
        pod:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
      extraVolumes:
        - name: users
          secret:
            secretName: authelia-users
      extraVolumeMounts:
        - name: users
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
    configMap:
      theme: auto
      log:
        level: info
      server:
        port: 9091
      authentication_backend:
        password_reset:
          disable: true
        file:
          enabled: true
          path: /config/users_database.yml
      access_control:
        default_policy: deny
        rules:
          - domain: ["catalogue.${ESTATE_ZONE}"]
            policy: one_factor
      session:
        cookies:
          - domain: "${ESTATE_ZONE}"
            subdomain: auth
            default_redirection_url: "https://catalogue.${ESTATE_ZONE}"
      storage:
        local:
          enabled: true
          path: /config/db.sqlite3
      notifier:
        filesystem:
          enabled: true
          filename: /config/notification.txt
