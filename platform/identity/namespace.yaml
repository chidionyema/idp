# The estate's one login (ADR 0007). `idp.estate/edge-attach` is the label the shared Gateway's
# catalogue and auth listeners select routes from (prospector-main deploy/k8s/base/edge.yaml).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (catalogue 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: identity
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
    availability.idp/tier: founder-facing
    idp.estate/edge-attach: "true"
