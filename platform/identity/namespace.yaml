# The estate's one login (ADR 0007). `idp.estate/edge-attach` is the label the shared Gateway's
# catalogue and auth listeners select routes from (prospector-main deploy/k8s/base/edge.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: identity
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
    availability.idp/tier: founder-facing
    idp.estate/edge-attach: "true"
