how_it_works: 'Edge manners (crew#307 follow-up, founder 2026-08-29: a user saw Traefik''s raw "no available
  server" on the catalogue -- "amateur"). Two of Traefik''s built-in middlewares, attached to every rule
  on this namespace''s routes that fronts an application: friendly-errors  502/503/504 from a backend
  (pod restarting, namespace rebuilding, node gone) are answered by the status page in platform/edge/status-page.yaml,
  which says in plain English that the door is starting and retries itself. edge-headers     HSTS, nosniff,
  same-origin framing, referrer policy, and the backend''s Server / X-Powered-By banne'
