# oauth2-proxy (ADR 0007): the front door federates to GitHub, the identity the founder already
# holds with MFA enforced there. No user database, no password, no secret ever typed in chat: the
# OAuth client id and secret reach this pod only through the estate vault (external-secret.yaml).
# Chart: https://oauth2-proxy.github.io/manifests oauth2-proxy 10.7.0 (app 7.15.3), read 2026-08-26
# from the chart index. Traefik pattern from the upstream docs (configuration/integrations/traefik):
# `--upstream=static://202` and the gateway's ForwardAuth pointing at `/`, so an unauthenticated
# request is answered with the redirect to /oauth2/start and an authenticated one with 202 plus
# X-Auth-Request-User / X-Auth-Request-Email for the application behind it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  interval: 24h
  url: https://oauth2-proxy.github.io/manifests
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-login
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-login
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    # crew#539: oauth2-proxy sits in front of catalogue, hc, langfuse and signoz, so its chart
    # default of replicaCount 1 made every one of those surfaces one node event from a 503 no
    # matter how many replicas they ran. 2026-08-28 06:20-06:39Z proved it. Value names checked
    # against `helm show values oauth2-proxy/oauth2-proxy --version 10.7.0` (lines 450, 501, 509),
    # not assumed. The chart requires exactly one of minAvailable / maxUnavailable to be null.
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      maxUnavailable: null
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: oauth2-proxy
    # Incident 2026-08-26 (idp#146 live): the chart's default wiring hands the three secrets to the
    # pod as environment variables from secretKeyRef, and the cluster policy
    # secrets-not-from-env-vars refused the Deployment; the catalogue answered 500 until this.
    # So the ExternalSecret renders the whole config file (external-secret.yaml) and it is mounted
    # as a volume; the chart writes no secret, no env var and no config of its own.
    proxyVarsAsSecrets: false
    config:
      configFile: ""
      # Without this the chart still generates its own ConfigMap (upstreams file:///dev/null, no
      # client id) and appends a second --config after extraArgs; the last flag wins and the pod
      # never becomes ready ("missing setting: client-id"). idp#147 review, rendered both ways.
      forceLegacyConfig: false
    extraVolumes:
      - name: config
        secret:
          secretName: oauth2-proxy
    extraVolumeMounts:
      - name: config
        mountPath: /etc/oauth2-proxy-config
        readOnly: true
    # The policy's pattern needs a non-empty env list to match against; an empty `env:` is refused
    # as if it held a secret. One plain value keeps the list non-empty.
    extraEnv:
      - name: OAUTH2_PROXY_PROVIDER_DISPLAY_NAME
        value: Estate
    extraArgs:
      config: /etc/oauth2-proxy-config/oauth2_proxy.cfg
      # Generic OIDC against the estate's identity domain (platform/oci/identity). The domain's
      # discovery document names an issuer that differs from its own host, so discovery is off
      # and the four endpoints are spelled out from the one value in estate-config (LAW 46).
      provider: oidc
      oidc-issuer-url: "${ESTATE_OIDC_ISSUER_URL}"
      skip-oidc-discovery: true
      login-url: "${ESTATE_OIDC_DOMAIN_URL}/oauth2/v1/authorize"
      redeem-url: "${ESTATE_OIDC_DOMAIN_URL}/oauth2/v1/token"
      oidc-jwks-url: "${ESTATE_OIDC_DOMAIN_URL}/admin/v1/SigningCert/jwk"
      profile-url: "${ESTATE_OIDC_DOMAIN_URL}/oauth2/v1/userinfo"
      scope: "openid email profile"
      # The domain's id_token carries email without email_verified; the allow-list is the
      # domain's grant table (oci_identity_domains_grant), enforced before any token is issued.
      insecure-oidc-allow-unverified-email: true
      reverse-proxy: true
      set-xauthrequest: true
      skip-provider-button: true
      redirect-url: "https://auth.${ESTATE_ZONE}/oauth2/callback"
      whitelist-domain: ".${ESTATE_ZONE}"
      cookie-domain: ".${ESTATE_ZONE}"
      cookie-secure: true
      cookie-samesite: lax
      cookie-expire: 12h
    service:
      portNumber: 80
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 2000
      runAsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {memory: 128Mi}
