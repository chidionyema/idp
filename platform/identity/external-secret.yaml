# The three values oauth2-proxy needs, each its own secret in the estate vault so a person can
# set one in the console without composing JSON:
#   oauth2-proxy-client-id       GitHub OAuth App client id        (founder, console)
#   oauth2-proxy-client-secret   GitHub OAuth App client secret    (founder, console)
#   oauth2-proxy-cookie-secret   32 random bytes                   (bin/idp-vault-put)
# Nothing here is a password anyone types at the door; the door has no password (ADR 0007).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: oauth2-proxy
    # One config file, mounted as a volume (oauth2-proxy.yaml): the cluster policy
    # secrets-not-from-env-vars refuses a Secret handed to a pod as an environment variable.
    template:
      data:
        oauth2_proxy.cfg: |
          client_id = "{{ .client_id }}"
          client_secret = "{{ .client_secret }}"
          cookie_secret = "{{ .cookie_secret }}"
          email_domains = [ "*" ]
          upstreams = [ "static://202" ]
  data:
    - secretKey: client_id
      remoteRef: { key: oauth2-proxy-client-id }
    - secretKey: client_secret
      remoteRef: { key: oauth2-proxy-client-secret }
    - secretKey: cookie_secret
      remoteRef: { key: oauth2-proxy-cookie-secret }
