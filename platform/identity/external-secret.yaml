# Two Secrets from the estate vault. `authelia` carries the three keys the chart mounts under
# /secrets by these exact file names. `authelia-users` is the file backend: the vault holds one
# argon2id hash (bin/idp-vault-put authelia-users password_hash=...), never a password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: authelia
  dataFrom:
    - extract: { key: authelia }
