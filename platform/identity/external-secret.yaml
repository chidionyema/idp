# The three values oauth2-proxy needs, each its own secret in the estate vault. Nobody types
# them: the client is the OCI Identity Domains confidential app `front_door`
# (platform/oci/identity/main.tf, oci_identity_domains_app + oci_vault_secret), applied by
# bin/idp-identity-apply from oke-check — root trust MEETS (docs/policy/root-trust.md):
#   oauth2-proxy-client-id       front_door client id             (Terraform)
#   oauth2-proxy-client-secret   front_door client secret         (Terraform)
#   oauth2-proxy-cookie-secret   32 random bytes                  (crew#575: in-estate seed, no writer yet)
# Nothing here is a password anyone types at the door; the door has no password (ADR 0007).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: identity
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: oauth2-proxy
    # One config file, mounted as a volume (oauth2-proxy.yaml): the cluster policy
    # secrets-not-from-env-vars refuses a Secret handed to a pod as an environment variable.
    template:
      data:
        oauth2_proxy.cfg: |
          client_id = "{{ .client_id }}"
          client_secret = "{{ .client_secret }}"
          cookie_secret = "{{ .cookie_secret }}"
          email_domains = [ "*" ]
          upstreams = [ "static://202" ]
  data:
    - secretKey: client_id
      remoteRef: { key: oauth2-proxy-client-id }
    - secretKey: client_secret
      remoteRef: { key: oauth2-proxy-client-secret }
    - secretKey: cookie_secret
      remoteRef: { key: oauth2-proxy-cookie-secret }
