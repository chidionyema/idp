# The estate's memory layer (AGENTS.md §6: exactly one). The API alone: its Postgres is the one
# estate-db cluster (role `memory`, database `memory`), not a server of its own -- the draft this
# replaces ran its own pgvector with a 50Gi volume, a second copy of the data layer.
#
# Free tier (ADR 0034, rung 6): scale-to-zero behind the KEDA HTTP add-on. Idle it requests
# nothing; awake it requests 50m CPU and 128Mi. It calls no vendor directly: search by meaning
# goes through the estate router (llm/, lane `embed`), which is the one door to a model and the
# one place the key lives. Until 2026-10-02 this line read 'search by meaning stays off until
# embeddings can go through LiteLLM' -- they now do, and the server computes the vector itself.
apiVersion: v1
kind: Namespace
metadata:
  name: unified-memory
  labels: { app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: unified-memory }
---
# Both secrets come from the vault by name (bin/idp-estate-seed mints them): the role password,
# assembled here into the connection string, and the estate agents' surface token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unified-memory
  namespace: unified-memory
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: unified-memory
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgresql://memory:{{ .password }}@estate-rw.estate-db.svc.cluster.local:5432/memory?sslmode=require"
        MEMORY_SURFACE_TOKEN: "{{ .token }}"
        # The router key, from the SAME vault entry otto-gateway reads (otto-golden), read by
        # name and never copied -- one credential for one router, not a second door to a vendor.
        # It is the RAW master key and not the `sk-<sha256>` form otto derives, because the
        # estate router authenticates the raw one: measured 2026-09-10 in a live otto-gateway
        # pod, raw answered (429 upstream = accepted) while the derived form was refused 401
        # "Invalid proxy server token passed".
        MEMORY_EMBED_API_KEY: "{{ .litellm_api_key }}"
  data:
    - secretKey: password
      remoteRef: { key: estate-db, property: memory-password }
    - secretKey: token
      remoteRef: { key: unified-memory, property: surface-token }
    - secretKey: litellm_api_key
      remoteRef: { key: otto-golden, property: LITELLM_API_KEY }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-memory-server
  namespace: unified-memory
  labels: { app.kubernetes.io/name: unified-memory-server, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: unified-memory }
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # KEDA owns the count (0 or 1); this is only the count before it first acts.
  replicas: 0
  selector:
    matchLabels: { app.kubernetes.io/name: unified-memory-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: unified-memory-server, app.kubernetes.io/part-of: idp, backstage.io/kubernetes-id: unified-memory }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: ghcr.io/chidionyema/unified-memory-server
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: HOME, value: /tmp }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            # secrets-not-from-env-vars (kyverno): files from the mounted Secret, read by main.py.
            - { name: DATABASE_URL_FILE, value: /var/run/memory/DATABASE_URL }
            - { name: MEMORY_SURFACE_TOKEN_FILE, value: /var/run/memory/MEMORY_SURFACE_TOKEN }
            # The embed lane (llm/). Without these the server still stores facts, but every
            # row keeps a NULL vector and recall finds nothing -- the state measured on
            # 2026-10-02: 47 rows, 0 vectors. The key is a file, never an env var (kyverno).
            - { name: MEMORY_EMBED_URL, value: "http://litellm.llm.svc.cluster.local:4000/v1" }
            - { name: MEMORY_EMBED_MODEL, value: "embed" }
            - { name: MEMORY_EMBED_DIM, value: "2048" }
            # The lane is the router's free hop, not the first paid one: every paid hop of the
            # embed chain is dry at the vendor together (measured 2026-10-02).
            - { name: MEMORY_EMBED_MODEL, value: "embed-free" }
            - { name: MEMORY_EMBED_API_KEY_FILE, value: /var/run/memory/MEMORY_EMBED_API_KEY }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://signoz-otel-collector.observability.svc:4318 }
          # Ready means the schema ran and the pool is open: the lifespan does both before the
          # app serves anything, /docs included.
          readinessProbe:
            httpGet: { path: /docs, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /docs, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: secret, mountPath: /var/run/memory, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: secret
          secret: { secretName: unified-memory, defaultMode: 256 }
---
apiVersion: v1
kind: Service
metadata:
  name: unified-memory-server
  namespace: unified-memory
  labels: { app.kubernetes.io/name: unified-memory-server, app.kubernetes.io/part-of: idp }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: unified-memory-server }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# Callers address the interceptor (keda-add-ons-http-interceptor-proxy.keda:8080) with this Host;
# it holds the request, wakes the pod, and forwards. Five idle minutes and the pod is gone again.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: unified-memory-server
  namespace: unified-memory
spec:
  hosts:
    - unified-memory.estate.internal
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-memory-server
    service: unified-memory-server
    port: 8000
  replicas: { min: 0, max: 1 }
  scaledownPeriod: 300
