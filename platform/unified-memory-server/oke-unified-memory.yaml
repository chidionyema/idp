---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-server-config
data:
  TUDUDI_HOSTED_MODE: "true"
  # LAW 4: DATABASE_URL is injected from a Secret (SOPS + age via estate-secrets),
  # never committed as a literal. The connection string carries the password.
---
apiVersion: v1
kind: Secret
metadata:
  name: memory-db-secret
stringData:
  DATABASE_URL: "postgresql://matrix_admin:$(DB_PASSWORD)@memory-db-service:5432/agent_memory"
  POSTGRES_USER: "matrix_admin"
  POSTGRES_PASSWORD: "$(DB_PASSWORD)"
  POSTGRES_DB: "agent_memory"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-block-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-memory-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified-memory-db
  template:
    metadata:
      labels:
        app: unified-memory-db
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: memory-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: memory-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgvector-block-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: memory-db-service
spec:
  selector:
    app: unified-memory-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-memory-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unified-memory-server
  template:
    metadata:
      labels:
        app: unified-memory-server
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: api-server
          image: your-docker-registry/agent-memory-server:latest
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: memory-db-secret
                  key: DATABASE_URL
            - name: TUDUDI_HOSTED_MODE
              valueFrom:
                configMapKeyRef:
                  name: memory-server-config
                  key: TUDUDI_HOSTED_MODE
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: curation-daemon
          image: your-docker-registry/agent-memory-server:latest
          command: ["python", "curation_worker.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: memory-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: unified-memory-service
spec:
  type: ClusterIP
  selector:
    app: unified-memory-server
  ports:
    - port: 80
      targetPort: 8000
