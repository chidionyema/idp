# Risk management system, Art. 9, kept voluntarily for every system regardless of
# tier (founder, 2026-08-25). Control ids are OWASP AI Exchange identifiers where
# one exists. bin/ai-act-gate refuses a risk with a missing field or an overdue
# review, and a registered system with no risk at all.
risks:
  - id: R-PROSP-001
    system: prospector
    hazard: outreach email is sent to a person who believes a human wrote it
    article: "Art. 50(1) transparency"
    owner: chidionyema
    likelihood: medium
    impact: medium
    mitigation: every generated message carries an AI-assisted disclosure line; template gate refuses one without it (crew#202)
    control: OWASP-AIX/#transparency
    status: open
    review_due: 2026-11-25
  - id: R-PROSP-002
    system: prospector
    hazard: fabricated facts about a company or person reach a prospect
    article: "Art. 9 risk management; UK GDPR accuracy"
    owner: chidionyema
    likelihood: high
    impact: medium
    mitigation: every claim in a draft is traced to a source URL in the research record; verifier step refuses an unsourced claim
    control: OWASP-AIX/#hallucination
    status: open
    review_due: 2026-11-25
  - id: R-PROSP-003
    system: prospector
    hazard: personal data scraped beyond business contact details
    article: "Art. 10 data governance; UK GDPR Art. 5(1)(c)"
    owner: chidionyema
    likelihood: medium
    impact: high
    mitigation: data sources are the declared list in platform/ai/systems.yaml; an undeclared host in research output is a gate failure
    control: OWASP-AIX/#datamin
    status: open
    review_due: 2026-11-25
  - id: R-PROSP-004
    system: prospector
    hazard: a single model provider outage or policy change stops the product
    article: "Art. 15 robustness (voluntary)"
    owner: chidionyema
    likelihood: medium
    impact: high
    mitigation: provider routing through LiteLLM with a second provider configured (LAW 34); prospector onboarding is on the crew board
    control: OWASP-AIX/#availability
    status: open
    review_due: 2026-11-25
  - id: R-PROSP-005
    system: prospector
    hazard: prompt injection from a scraped page steers the agent
    article: "Art. 15 cybersecurity (voluntary)"
    owner: chidionyema
    likelihood: high
    impact: medium
    mitigation: scraped text is passed as data with a fixed system prompt; tool calls that send mail or spend money require an approval step
    control: OWASP-AIX/#promptinjection
    status: open
    review_due: 2026-11-25
