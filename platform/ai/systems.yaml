# Register of AI systems (EU AI Act Art. 3(1)), one entry each. bin/ai-act-gate
# refuses a system without a technical file, a risk entry and declared data.
# risk_tier: minimal | limited | high | prohibited, per Art. 6 and Annex III.
# The classification note is the technical file, section 1.
systems:
  - name: prospector
    owner: chidionyema
    role: deployer            # Art. 3(4); provider duties sit with the model vendors
    risk_tier: minimal
    purpose: B2B lead research and outreach drafting for UK/EU sales prospecting
    technical_file: docs/ai-systems/prospector/technical-file.md
    models:
      - provider: anthropic
        ids: [claude-opus-5, claude-sonnet-5, claude-opus-4-8]
      - provider: deepseek
        ids: [deepseek-chat]
      - provider: minimax
        ids: [minimax-m3-full, minimax-m2.7-fast]
    data_sources:
      - name: companies-house-and-gov-uk
        url: https://www.gov.uk
        provenance: public register, UK government
        lawful_basis: legitimate interest (B2B contact data, UK GDPR Art. 6(1)(f))
        personal_data: business contact details
        retention: 12 months from last outreach
      - name: web-archive
        url: https://web.archive.org
        provenance: public web archive
        lawful_basis: legitimate interest
        personal_data: none intended
        retention: not stored
      - name: wikipedia
        url: https://en.wikipedia.org
        provenance: public, CC BY-SA
        lawful_basis: not personal data
        personal_data: none
        retention: not stored
      - name: mumchimp-store
        url: https://api.mumchimp.com
        provenance: own product database
        lawful_basis: contract (UK GDPR Art. 6(1)(b))
        personal_data: customer orders and contact details
        retention: 6 years (accounting)
    review_due: 2026-11-25
