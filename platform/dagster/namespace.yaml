# DAGSTER row (crew#716): the estate's scheduler on the cluster, replacing the Mac's Dagster
# instance. The namespace mirrors MCP's setup: same labels, same prune-disabled annotation.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: dagster
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
    availability.idp/tier: founder-facing
    idp.estate/edge-attach: "false"
