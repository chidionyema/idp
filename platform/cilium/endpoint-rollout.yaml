# crew#539 CP12: a pod gets a Cilium endpoint only when its sandbox is created after the agent is
# Ready (generic-veth chaining, Cilium docs "Restart pods"). Without this the radio-room set keeps
# its flannel-only sandboxes, Hubble counts no flows for it, and the receipt's 0-is-FAIL rule
# fires against the merge that switched Hubble on. So the same Flux row that installs the agent
# rolls the four Deployments once (`kubectl rollout restart` = one pod-template annotation each,
# a normal rolling update under their PDBs), then waits for each rollout to finish.
#
# One-shot by construction: a Job is immutable, so Flux applies it once and leaves it; a pod born
# after this has its endpoint from birth. Runs after the HelmRelease via the Kustomization's
# `wait: true` ordering is not guaranteed, so the Job itself blocks on the DaemonSet rollout first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-endpoint-rollout
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-endpoint-rollout
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-endpoint-rollout
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium-endpoint-rollout
subjects:
  - kind: ServiceAccount
    name: cilium-endpoint-rollout
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cilium-endpoint-rollout
  namespace: kube-system
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-endpoint-rollout
        app.kubernetes.io/part-of: idp
    spec:
      serviceAccountName: cilium-endpoint-rollout
      restartPolicy: OnFailure
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      # kubectl takes one namespace per call: one step per call, in order, no shell.
      # Pinned kubectl; arm64 manifest present (docker manifest inspect, 2026-08-27).
      initContainers:
        - name: wait-agent
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          command: [kubectl, rollout, status, daemonset/cilium, --namespace=kube-system, --timeout=10m]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kube, mountPath: /.kube }
        - name: restart-observability
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          command: [kubectl, rollout, restart, deployment/langfuse-web, deployment/langfuse-worker, --namespace=observability]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kube, mountPath: /.kube }
        - name: restart-mcp
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          command: [kubectl, rollout, restart, deployment/agentgateway, --namespace=mcp]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kube, mountPath: /.kube }
        - name: restart-hermes-agent
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          command: [kubectl, rollout, restart, deployment/hermes-agent-gateway, --namespace=hermes-agent]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kube, mountPath: /.kube }
        - name: status-observability
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          command: [kubectl, rollout, status, deployment/langfuse-web, deployment/langfuse-worker, --namespace=observability, --timeout=10m]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kube, mountPath: /.kube }
        - name: status-mcp
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          command: [kubectl, rollout, status, deployment/agentgateway, --namespace=mcp, --timeout=10m]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kube, mountPath: /.kube }
      containers:
        - name: status-hermes-agent
          image: docker.io/bitnamilegacy/kubectl:1.33.4
          command: [kubectl, rollout, status, deployment/hermes-agent-gateway, --namespace=hermes-agent, --timeout=10m]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: kube, mountPath: /.kube }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kube
          emptyDir: {}
