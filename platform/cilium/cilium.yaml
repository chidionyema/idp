# crew#539 CP12 (founder, 2026-08-27: "as much monitoring tooling as possible"; "OKE CNI choice
# is measured first"). Measured (crew#539 comment 5446026537): the cluster runs OKE's flannel
# (platform/oci/main.tf cni_type) and Oracle's page replaces flannel outright, which is a CNI
# swap on a live cluster; Cilium's own generic-veth chaining keeps flannel and adds a Cilium
# endpoint per pod, which is Hubble (every flow, every drop, DNS) and NetworkPolicy without
# touching the pod network. cilium/hubble-otel is archived (2024-06-20) and the contrib
# collector has no Hubble receiver, so the flows reach the central collector as Hubble's
# Prometheus metrics: the agent pod is annotated for the k8s-infra scraper
# (platform/observability/k8s-infra.yaml presets.prometheus) and lands in
# signoz_metrics.distributed_time_series_v4; the in-cluster telemetry-coverage receipt counts
# hubble_flows_processed_total rows that name a radio-room workload (LAW 50: proved by querying
# the backend). kube-proxy stays (kubeProxyReplacement false), flannel keeps IPAM and routing
# (routingMode native, no Cilium masquerade), the node's own conflist stays (cni.exclusive
# false): removing this directory returns the node to flannel alone.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 24h
  url: https://helm.cilium.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    cluster:
      name: oke
    cni:
      chainingMode: generic-veth
      customConf: true
      configMap: cni-configuration
      exclusive: false
    routingMode: native
    enableIPv4Masquerade: false
    kubeProxyReplacement: "false"
    # crew#539 CP9: the agent is a radio-room neighbour on the same node; requests == limits.
    # First sizing; the cluster-state receipt's kubelet metrics in SigNoz re-pin it.
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 200m, memory: 512Mi }
    initResources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 50m, memory: 64Mi }
    priorityClassName: system-node-critical
    # No L7 policy here, so no per-node Envoy DaemonSet (12 admission refusals fewer,
    # bin/idp-kyverno-render 2026-08-27); the agent embeds a proxy if a policy ever asks.
    envoy:
      enabled: false
    # The k8s-infra scraper (presets.prometheus, prefix signoz.io) reads the annotated port only;
    # Hubble's 9965 is the one that answers the founder's question. The agent's own 9962 is
    # exposed too for a later second annotation-less scrape config.
    podAnnotations:
      signoz.io/scrape: "true"
      signoz.io/port: "9965"
      signoz.io/path: /metrics
    prometheus:
      enabled: true
      port: 9962
    hubble:
      enabled: true
      metrics:
        enableOpenMetrics: true
        port: 9965
        # labelsContext puts the workload names on every sample; the receipt filters on
        # destination_workload / source_workload (docs.cilium.io/en/stable/observability/metrics).
        enabled:
          - dns
          - drop:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
          - tcp:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
          - flow:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
          - port-distribution
          - icmp
      relay:
        enabled: true
        replicas: 1
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 50m, memory: 128Mi }
      ui:
        enabled: false
    operator:
      replicas: 1
      # flannel gives the operator its network; the chart's hostNetwork default is for clusters
      # where Cilium is the only CNI (disallow-host-namespaces, disallow-host-ports pass).
      hostNetwork: false
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 50m, memory: 128Mi }
      prometheus:
        enabled: true
