# The Flux-side objects of the spine, in flux-system.
#
# No `namespace:` here on purpose: kustomize's namespace transformer would rewrite the
# Provider and the Alert into this directory's namespace, and the notification-controller
# only serves them where it watches -- flux-system.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - provider.yaml
  - aevum-secret.yaml
