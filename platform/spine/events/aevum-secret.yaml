# The Aevum API key, for the observer.
#
# The evidence layer's API key is a property of the vault entry the estate already keeps
# (aevum-evidence). The ExternalSecret reads one property of it -- api-key -- and nothing
# else: the observer has no business holding the signing key, which can mint receipts, and
# the estate's own recorder keeps that key inside one container for exactly that reason
# (platform/observability/recorder/recorder.py).
#
# The property is minted by bin/idp-estate-seed, which mints what is missing and keeps
# what already works -- so adding it does not touch the Postgres password or the signing
# key that are already in the vault.
#
# The Secret is optional in the Deployment (platform/spine/worker.yaml): until the vault
# carries the property, the observer still starts, and the receipt says it was not
# ingested. A spine that will not start because a receipt key is missing answers nothing
# at all, which is worse than saying so.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aevum-api
  namespace: spine
  labels: { app.kubernetes.io/name: spine, estate.io/layer: event-spine }
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: estate-vault
    kind: ClusterSecretStore
  target:
    name: aevum-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: aevum-evidence
        property: api-key
