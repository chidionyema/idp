# ghcr-pull for the spine namespace, from the ClusterSecretStore every other
# namespace that pulls uses. The bridge and the worker pull
# ghcr.io/chidionyema/spine, and GHCR answers 401 to an anonymous manifest
# request: without this secret both pods sit in ImagePullBackOff with
# "unauthorized", which looks exactly like a missing image and is not.
#
# WHY NOT A COPIED SECRET. A copy taken with kubectl is frozen at the moment it
# was taken: the registry token expires, the copy does not know, and the pod
# starts failing to pull with an error that looks like a missing package. An
# ExternalSecret refreshes from the store that owns the token, so a rotation
# reaches this namespace without anyone remembering that it exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: spine
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: ghcr-pull }
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: ghcr-pull, property: .dockerconfigjson }
