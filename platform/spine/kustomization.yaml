# The spine: the bridge and the observer, one image, one namespace.
#
# The Flux-side objects (the notification-controller's Provider and Alert) are NOT here:
# they live in flux-system, and Flux's namespace transformer would move them. They are in
# events/, reconciled by their own row that depends on this one -- the stream has to exist
# before anything publishes into it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spine
resources:
  - namespace.yaml
  - rbac.yaml
  - bridge.yaml
  - worker.yaml
  # The pull credential for the GHCR package. Without it both pods sit in
  # ImagePullBackOff with "unauthorized", which reads like a missing image.
  - pull-secret.yaml
images:
  # build-multiarch pushes ghcr.io/chidionyema/spine:main-<run>-<sha> from spine.Dockerfile
  # (bin/dockerfiles discovers it by name: `spine`). The image-automation-controller
  # rewrites the newTag line from ImagePolicy flux-system/spine; the marker is how it
  # finds the line. The tag below is the image built for this commit, written here for
  # the same reason as the efda one: the controller can only set a tag in a file the
  # flux/image-updates branch carries, and it does not carry this one yet.
  - name: ghcr.io/chidionyema/spine
    newTag: main-14976-9063f99d33ba5f9ff7079a8c2633434b7e0c483a # {"$imagepolicy": "flux-system:spine:tag"}
