# Survives sandbox expiry on purpose. Deleting a namespace is refused at admission by the
# estate's protection policy, so the expiry sweep must skip this object or the launch row
# would hang on a finalizer forever: the annotation below tells Flux never to prune it.
# An empty namespace between sandbox runs costs nothing and keeps expiry deadlock-free.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-sandbox
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
