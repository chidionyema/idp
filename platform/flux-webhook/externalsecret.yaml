apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-webhook-token
  namespace: flux-system
spec:
  refreshInterval: 168h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: flux-webhook-token, creationPolicy: Owner }
  data:
    # `token` is the key the Flux Receiver reads; GitHub computes HMAC-SHA256 with this secret.
    - secretKey: token
      remoteRef: { key: flux-webhook-token }
