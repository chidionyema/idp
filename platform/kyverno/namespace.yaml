# crew#488 CP5: the policy engine is its own Flux layer. It used to ship inside platform/edge with
# the ClusterPolicies that need its CRD, and Flux's server-side dry-run refused the whole edge
# row on any cluster where the CRD had not landed yet ("no matches for kind ClusterPolicy"),
# which read as a portability break of the edge and of the 30 layers behind it. The chart first,
# then the policies (platform/edge, platform/scheduling) wait on this row.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (catalogue 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: kyverno
