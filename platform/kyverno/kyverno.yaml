# Kyverno is the policy engine prospector/deploy/k8s/policies targets (ClusterPolicy). Only the
# admission controller runs: reports, background and cleanup controllers are off because nothing
# reads them yet (LAW 28) and the node has 1.8 cores.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  # Bounded remediation, and the last failure is remediated too, so a wedged release is not left
  # Failed for a person to untangle: helm-controller spends its retries once and then waits forever
  # for a spec change (tailscale-operator sat Failed blocking guacamole, idp#1027).
  # NOT `strategy: uninstall`, which idp#1027 set here and this row takes back out. Founder,
  # 2026-08-30 (~/.claude/docs/founder/2026-08-30T2332Z-yes-and-the-pattern-is-sound-but-two
  # -c08d08d9.md): uninstalling a wedged release turns a degraded service into a deleted one --
  # the PVCs, PDBs and Secrets the release made go with it -- and it erases the state that says
  # which invariant was violated, which is the state an incident is converted into a control from.
  # The default strategy is rollback: the previous revision is restored and the failed one is
  # readable. Repaving stays a hand after capture: `bin/idp-oke-break-glass helm-retry`.
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  interval: 10m
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
  values:
    admissionController:
      # 2026-09-04: the `validate.kyverno.svc-fail` webhook is registered on ['*'] ['*'] ['*'] for
      # CREATE, UPDATE and DELETE with failurePolicy Fail and a 10 s timeout, so one
      # admission-controller pod is a cluster-wide write lock -- while it is unreachable nothing is
      # admitted at all. That is what happened this morning: Flux could not create
      # Namespace/external-secrets or Namespace/scheduling ("failed calling webhook
      # validate.kyverno.svc-fail ... context deadline exceeded"), and 33 Flux objects stalled
      # behind those two, weave-gitops (the deploy page) and otto-golden among them. Kyverno's own
      # production guidance is more than one admission-controller replica; this cluster has two
      # nodes, and the chart's default anti-affinity puts one pod on each.
      replicas: 2
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
    backgroundController:
      enabled: false
    # The cleanup controller stays on for time-to-live labels on ordinary objects. It is no longer
    # the buyer sandbox's clock: since 2026-09-06 the sandbox row comes from branch sandbox/launch
    # through Flux (clusters/oke/sandbox.yaml), and a row Flux owns would be recreated a minute
    # after this controller deleted it. The launch workflow's sweep is the clock instead.
    cleanupController:
      enabled: true
    reportsController:
      enabled: false
    features:
      # PolicyException objects are honoured, from namespace kyverno only, so a workload
      # namespace cannot exempt itself. The first one is platform/chaos/mesh/exception.yaml.
      policyExceptions:
        enabled: true
        namespace: kyverno
