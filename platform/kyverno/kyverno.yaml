# Kyverno is the policy engine prospector/deploy/k8s/policies targets (ClusterPolicy). Only the
# admission controller runs: reports, background and cleanup controllers are off because nothing
# reads them yet (LAW 28) and the node has 1.8 cores.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  # Founder blueprint 2026-08-30 (~/.claude/docs/founder/2026-08-30T2252Z-also-o-eliminate-this
  # -exact-class-of-failures-501c10b6.md): a wedged upgrade is uninstalled and rebuilt from git,
  # never left Failed for a person to untangle (tailscale-operator sat Failed blocking guacamole;
  # helm-controller spends its retries once, then waits forever for a spec change).
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, strategy: uninstall, remediateLastFailure: true }
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
  values:
    admissionController:
      replicas: 1
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    features:
      # PolicyException objects are honoured, from namespace kyverno only, so a workload
      # namespace cannot exempt itself. The first one is platform/chaos/mesh/exception.yaml.
      policyExceptions:
        enabled: true
        namespace: kyverno
