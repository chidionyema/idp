# Kyverno is the policy engine prospector/deploy/k8s/policies targets (ClusterPolicy). Only the
# admission controller runs: reports, background and cleanup controllers are off because nothing
# reads them yet (LAW 28) and the node has 1.8 cores.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
  values:
    admissionController:
      replicas: 1
      container:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    features:
      # PolicyException objects are honoured, from namespace kyverno only, so a workload
      # namespace cannot exempt itself. The first one is platform/chaos/mesh/exception.yaml.
      policyExceptions:
        enabled: true
        namespace: kyverno
