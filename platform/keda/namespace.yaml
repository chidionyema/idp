# KEDA: the estate's one autoscaler (crew#488 CP7). Any request-scoped product workload scales to
# zero through it; a second autoscaler is the stitching the headline forbids. Restricted PSA: the
# operator, metrics server, webhooks and the HTTP add-on all run non-root, read-only, no capabilities.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (catalogue 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: keda
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
