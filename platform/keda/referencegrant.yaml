# Gateway API rule: an HTTPRoute may only send traffic to a Service in another namespace when that
# namespace says so, with a ReferenceGrant that lives in the target namespace. So the grant for a
# product HTTPRoute to reach the KEDA interceptor proxy is platform-owned and sits here, not in
# the product repo. One `from` row per product namespace the platform already provisions
# (platform/prospector owns the prospector Namespace); a new product adds its row here.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: products-to-interceptor-proxy
  namespace: keda
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: prospector
  to:
    - group: ""
      kind: Service
      name: interceptor-proxy
