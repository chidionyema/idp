# The mature tool, not a script (headline rule 1; LAW 43): KEDA 2.20.2 and its HTTP add-on 0.15.0,
# the kedacore charts, pinned. Rejected: Knative Serving (a second ingress and a second revision
# model on a 4 OCPU node; crew#488 says KEDA first, Knative only where a measurement shows KEDA
# cannot) and a cron that scales Deployments (a script for a solved problem).
#
# Sizing is for the one 4 OCPU / 24 GB node (crew#289): the charts default to three scaler and
# three interceptor replicas and a 1 CPU operator request; here one of each and requests the
# node can hold. The interceptor's own ScaledObject can still grow it under load (max 5).
#
# LAW 50: the operator exports its metrics to the estate collector over OTLP
# (opentelemetry.collector.uri); the add-on components are covered by the node agent's logs.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kedacore
  namespace: keda
spec:
  interval: 24h
  url: https://kedacore.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: keda
      version: 2.20.2
      sourceRef:
        kind: HelmRepository
        name: kedacore
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    opentelemetry:
      collector:
        uri: signoz-otel-collector.observability.svc:4317
      operator:
        enabled: true
    prometheus:
      metricServer: { enabled: false }
      operator: { enabled: false }
      webhooks: { enabled: false }
    resources:
      operator:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
      metricServer:
        requests: { cpu: 50m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
      webhooks:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: keda
spec:
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: keda
  chart:
    spec:
      chart: keda-add-ons-http
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: kedacore
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  values:
    # The chart's defaults drop capabilities and mount read-only but say nothing about the user or
    # the seccomp profile, so require-run-as-nonroot and restrict-seccomp-strict refuse all three
    # Deployments (bin/idp-kyverno-render, 2026-08-27: 6 fails). These two blocks apply to every
    # component of the chart.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
      privileged: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      supplementalGroups: [1000]
      seccompProfile: { type: RuntimeDefault }
    operator:
      replicas: 1
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
    scaler:
      replicas: 1
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
    interceptor:
      replicas: { min: 1, max: 5 }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 500m, memory: 256Mi }
