# store-api env from OCI Vault secret prospector-store-api-env (one JSON object holding the
# nine keys), through ClusterSecretStore estate-vault (crew#227 CP3). Replaced store-api-env.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prospector-store-api-env
  namespace: prospector
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: prospector-store-api-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: prospector-store-api-env }
