# What the platform hands prospector before its own manifests apply: the namespace, the registry
# pull secret, and the API's secret files. The product repo holds no credential and no reference
# to where one lives (LAW 21, LAW 46).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - store-api-env.sops.yaml
  # Secret cloudflare-api-token, namespace edge, key CF_API_TOKEN: the token survival-stack
  # issued (scripts/migrate.sh, kept in the login keychain as survival-stack-cloudflare-token).
  - cloudflare.sops.yaml
