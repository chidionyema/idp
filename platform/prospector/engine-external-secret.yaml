# Engine env (the scheduler's provider keys and store settings) from OCI Vault secret
# prospector-engine-env, one JSON object of KEY: value, through ClusterSecretStore estate-vault.
# Consumed as files under /var/run/secrets/prospector by the prospector-scheduler Deployment
# (prospector deploy/k8s/base/scheduler.yaml, crew#248). The product repo holds no credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prospector-engine-env
  namespace: prospector
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: prospector-engine-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: prospector-engine-env }
