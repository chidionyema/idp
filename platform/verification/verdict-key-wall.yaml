# crew#631 CP2, the refusal side of the wall. Pods read OCI Vault through ClusterSecretStore
# estate-vault as the workers dynamic group, whose grant reads
# `where target.secret.name != 'verdict-hmac-key'` (platform/oci/vault.tf). This ExternalSecret
# asks for exactly that key and is meant to stay NOT Ready (SecretSyncedError, the vault's
# NotAuthorizedOrNotFound): a pod cannot sign a verdict. Two readers grade it the same way:
# bin/idp-verdict key-wall on every prover run, and the cluster-state collector through the
# estate/expect-ready annotation (Ready here is the breach, refused is the wall standing).
# backstage-env in the portal's own row is the control: the same store, a permitted key, synced.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: verdict-key-wall
  namespace: backstage
  annotations:
    estate/expect-ready: "false"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: verdict-key-wall, creationPolicy: Owner }
  data:
    - secretKey: key
      remoteRef: { key: verdict-hmac-key }
