# Verification wall (crew#631 CP2): objects that prove a refusal. Nothing in this directory is
# meant to become Ready; the Flux row that applies it never waits (clusters/oke/verification.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - verdict-key-wall.yaml
  # Rule 4's Kyverno half: the refusal side of the verifier wall. The ExternalSecret above
  # proves no pod can sign a verdict; this policy refuses an object that claims a verdict it
  # never got. Both are refusals, and both are meant to stand.
  - refuse-unattested-provenance.yaml
