  namespace: jit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jit-broker
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jit-broker
subjects:
- kind: ServiceAccount
  name: jit-broker
  namespace: jit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jit-broker
  namespace: otto-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jit-broker
subjects:
- kind: ServiceAccount
  name: jit-broker
  namespace: jit
