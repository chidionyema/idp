# What the broker itself may do, and the reason it is a Role in ten namespaces rather than one
# ClusterRole binding.
#
# The broker holds the union of its own catalogue and not one verb more. That is forced, not
# chosen: Kubernetes refuses to let an identity create a Role carrying permissions it does not
# already hold, so the broker must hold `patch deployments` and `delete pods` in order to mint a
# token for them. The bound is therefore the catalogue, and bin/idp-jit-grants grades the
# catalogue in CI -- widening what the broker can reach means widening a file that a gate reads.
#
# It is deliberately NOT a ClusterRoleBinding. A ClusterRole bound cluster-wide would reach
# kube-system, flux-system and every namespace nobody has created yet; these RoleBindings reach
# the ten namespaces the catalogue names and stop. A new namespace is not automatically in
# range, which is the property you want the first time somebody adds one in a hurry.
#
# Nothing here touches Secrets, RBAC or the core namespaces. bin/idp-jit-grants refuses a
# catalogue that asks for any of them, so this file cannot grow those verbs without that gate
# going red first.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: jit-broker
  namespace: jit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jit-broker
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  verbs:
  - create
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jit-broker
  namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jit-broker
subjects:
- kind: ServiceAccount
  name: jit-broker
  namespace: jit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jit-broker
  namespace: catalogue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jit-broker
subjects:
- kind: ServiceAccount
  name: jit-broker
  namespace: jit
