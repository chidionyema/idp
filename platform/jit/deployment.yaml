# The broker itself.
#
# One replica, deliberately. Pending requests live in memory, and a second replica would hold a
# different set of them -- his tap would arrive at whichever pod the Service picked and find no
# such request about half the time. The cost of that choice is that a restart drops the pending
# asks, which is the correct direction to fail: a dropped ask is an agent that waits and times
# out (WJ.3 already calls a silence a no), whereas a shared cache would be a second place an
# approval could be spent. The ledger is on a volume and survives the restart.
#
# It holds no standing cloud credential. The only thing it can do is what platform/jit/rbac.yaml
# grants, which is the union of the catalogue and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jit-broker
  namespace: jit
spec:
  refreshInterval: 10m
  secretStoreRef: {kind: ClusterSecretStore, name: estate-vault}
  # The bot is the estate's ONE Telegram bot, read from the vault entry `flux-telegram` that
  # the alerts row already uses (keys `token` and `channel`). A second bot token would be a
  # second copy of one credential, which is the split-brain the estate does not keep (LAW 54:
  # no fresh key while one exists). Only the two values nothing else can hold -- the HMAC
  # signing key and the webhook secret -- come from the broker's own entry, and both are minted
  # by code, never typed (R52).
  target:
    name: jit-broker
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TELEGRAM_BOT_TOKEN: "{{ .token }}"
        TELEGRAM_CHAT_ID: "{{ .channel }}"
        JIT_SIGNING_KEY: "{{ .JIT_SIGNING_KEY }}"
        # flux-telegram's, deliberately, and not the broker's own entry: Telegram signs each
        # delivery with the secret the webhook was *registered* with, and the thing that
        # registered it is platform/otto-gateway/registration-reconciler.yaml using exactly
        # this value (its OTTO_ALERTS_WEBHOOK_SECRET is `flux-telegram`, property
        # `webhook_secret`). A broker checking any other value refuses every real tap.
        TELEGRAM_WEBHOOK_SECRET: "{{ .webhook_secret }}"
        # The bootstrap key an agent presents at /identity. It is not an approval key and
        # cannot become one: holding it buys a one-hour agent-reader token, which is reads.
        # It is the broker's own entry rather than a shared one because it is the one value
        # that has to exist on a laptop, and a key that leaves the cluster must be rotatable
        # without touching anything that has not left it.
        JIT_AGENT_KEY: "{{ .JIT_AGENT_KEY }}"
  # Two values, both minted in the vault and none typed here (LAW 46, R52):
  #   JIT_SIGNING_KEY          -- the HMAC key the approvals are signed with. An identity that
  #                               can read this can forge a tap, so it is the crown jewel of
  #                               the crown jewel and no agent ServiceAccount reaches namespace
  #                               jit at all.
  #   JIT_AGENT_KEY            -- what a device presents to be handed the read-only identity.
  #                               Deliberately the weakest of the three: it mints agent-reader
  #                               and nothing else, so losing it costs an hour of reads.
  #   TELEGRAM_BOT_TOKEN       -- the bot that sends the ask.
  #   TELEGRAM_WEBHOOK_SECRET  -- the token Telegram signs each delivery of his tap with. It
  #                               is flux-telegram's and not the broker's own, because the
  #                               broker registers no webhook: it is handed a mirrored copy of
  #                               the one otto-gateway registered
  #                               (platform/otto-gateway/telegram-mirror.yaml).
  dataFrom:
    - extract: {key: flux-telegram}
    - extract: {key: jit-broker}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jit-ledger
  namespace: jit
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jit-broker
  namespace: jit
  labels: {app.kubernetes.io/name: jit-broker}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: jit-broker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jit-broker}
    spec:
      serviceAccountName: jit-broker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: broker
          image: ghcr.io/chidionyema/jit
          command: [python3, -m, broker.serve]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
            - {name: JIT_GRANTS, value: /etc/jit/grants.yaml}
            - {name: JIT_LEDGER, value: /var/lib/jit/ledger.jsonl}
            - {name: JIT_KILLSWITCH, value: /var/lib/jit/stopped}
            # The four secret values are NOT here. A secret in an env var is printed by every
            # crash dump, `kubectl describe pod`, and any library that logs its environment on
            # start -- which is why kyverno's secrets-not-from-env-vars refuses it. They arrive
            # as files under this directory instead, one file per key, and the process reads
            # them at start (broker/serve.py, secret()).
            - {name: JIT_SECRETS, value: /etc/jit-secrets}
          # /healthz verifies the ledger's hash chain, so a broker whose record has been
          # tampered with fails its own probe and stops answering rather than carrying on
          # minting access nobody can any longer account for.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 60
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: ledger, mountPath: /var/lib/jit}
            - {name: grants, mountPath: /etc/jit}
            - {name: secrets, mountPath: /etc/jit-secrets, readOnly: true}
      volumes:
        - {name: ledger, persistentVolumeClaim: {claimName: jit-ledger}}
        # The catalogue is mounted from a ConfigMap that Flux writes from platform/jit/grants.yaml,
        # so the closed set the broker mints from is the file in git and cannot be edited in
        # the cluster without the change going through the gate first (WJ.8).
        - {name: grants, configMap: {name: jit-grants}}
        # 0400, owned by the one uid the container runs as: the kubelet writes these files and
        # nothing in the pod can rewrite them.
        - {name: secrets, secret: {secretName: jit-broker, defaultMode: 0400}}
---
apiVersion: v1
kind: Service
metadata:
  name: jit-broker
  namespace: jit
  # crew#307: a port that serves names the catalogue entity it belongs to, or admission refuses
  # the object. layer-jit is generated into backstage/platform/catalog-info.yaml from this
  # Kustomization's row in bin/catalog-platform.
  labels: {backstage.io/kubernetes-id: layer-jit}
  # The broker is reachable from the tailnet, and this is the only door it has that is not
  # inside the cluster.
  #
  # Why it needed one. WJ.2 says an agent that hits the wall "does not fail and it does not
  # report back" -- it asks. Until this annotation the asking door faced the pod network only:
  # fence.yaml admitted namespaces `agents` and `edge`, and the public HTTPRoute carries the
  # Telegram webhook alone (`POST https://otto.${ESTATE_ZONE}/ask` answers 404, measured
  # 2026-09-07). So an agent running anywhere but inside the cluster could not ask at all, and
  # on 2026-09-07 one could not: the boundary work needed 97 pods restarted, `restart-workload`
  # in grants.yaml is exactly that grant, and there was no reachable way to request it.
  #
  # Why the tailnet and not the public edge. Exposing /ask on the public host would need a
  # credential in front of it, and a credential minted to answer this is a second identity
  # layer for one door -- refused by the estate's SSO policy and by LAW 54 (no fresh key while
  # one exists). The tailnet is the identity layer that already exists here, it is federated,
  # and policy.hujson is deny-by-default, so the ACL is the authentication and it is in git
  # under review. Nothing about a grant changes: the ask still buzzes the founder's phone, the
  # tap is still HMAC-checked, the TTL still expires on its own. This widens who may *ask*, to
  # the founder's own devices, and widens nothing about what may be *minted*.
  #
  # tag:estate-jit rather than the operator's default tag:k8s: the default is shared with every
  # egress proxy, so an ACL naming it would open port 8080 on all of them. Its owner is tag:k8s
  # for the reason tag:estate-bridge's is -- the root OAuth client carries tag:k8s and a client
  # may only request tags its own tags own (tailscale kb/1215); [] there 400s the authkey mint
  # and the proxy crashloops (P0 idp#586).
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: jit-broker
    tailscale.com/tags: tag:estate-jit
spec:
  selector: {app.kubernetes.io/name: jit-broker}
  ports:
    - {name: http, port: 8080, targetPort: http}
