# The namespaces and their fences. ArgoCD is pointed here, so what is in this
# directory is what the cluster has; a fence applied by hand and not committed
# is reverted on the next sync, which is the point of pointing ArgoCD at git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform.yaml
  - data-ops.yaml
