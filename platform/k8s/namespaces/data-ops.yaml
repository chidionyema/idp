# The data-ops namespace: Dagster, Langfuse. The heavy, bursty, third-party half
# of the estate.
#
# Founder, 2026-08-24: "Apply strict ResourceQuota and LimitRange rules to
# data-ops so a runaway pipeline cannot starve the cluster's brain." That is the
# Noisy Neighbour, and the caps below are deliberately tighter than platform's.
# A Dagster run that leaks memory is OOMKilled inside this namespace instead of
# taking the ingress controller and the API server down with it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: data-ops
  labels:
    kubernetes.io/metadata.name: data-ops
    estate.local/tier: data-ops
---
# max.memory 768Mi is the blast door. A pod asking for more is refused at
# admission with a message naming the LimitRange, before it is ever scheduled --
# which is a better failure than being OOMKilled an hour into a run.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: data-ops
spec:
  limits:
    - type: Container
      # Measured, and the first numbers I wrote were wrong. With a 512Mi default
      # limit and a 768Mi namespace limits budget, the SECOND pod in this
      # namespace was refused: "exceeded quota: budget, requested:
      # limits.memory=512Mi, used: limits.memory=512Mi, limited:
      # limits.memory=768Mi". A namespace that holds one pod is not a fence, it
      # is an outage with a quota attached (LAW 38). Dagster alone is a
      # webserver, a daemon and a run pod.
      #
      # 256Mi is the default a container gets for asking for nothing, not a
      # ceiling: max below is still 768Mi, so a pod that genuinely needs more
      # says so in its own manifest and a reviewer sees it.
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 768Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: data-ops
spec:
  # requests are the reservation the scheduler subtracts from the node; limits
  # are ceilings and are meant to overcommit, so the two numbers are not the
  # same number twice. requests.memory 512Mi is what data-ops is actually
  # promised out of the node's 1536Mi. limits.memory 1536Mi lets six
  # default-sized pods exist, and any one of them is still capped at 768Mi.
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1536Mi
    pods: "15"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: data-ops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: data-ops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: data-ops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
