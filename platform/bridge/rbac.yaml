# What the phone's road may do inside the cluster.
#
# `view`, not `cluster-admin`: this exists so the founder can read pods and logs from his phone
# during an outage, and a debugger that can delete things is a debugger that can cause one.
# `view` excludes secrets by design. This is the same grant platform/rbac/bridge.yaml makes for
# the instance-principal road; the subject differs because the identity does.
#
# The subject is a ServiceAccount, not a person and not a credential: the token is projected into
# the pod by the API server and dies with it. Nothing is stored, nothing is pasted, and there is
# no key to rotate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: estate-bridge
  namespace: estate-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: estate-bridge-read-pod
  annotations:
    estate.io/why: "the founder reads pods and logs from his phone without his laptop (crew#841)"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: estate-bridge
    namespace: estate-bridge
