# The catalogue itself. One container, one port (3100), served by the backend
# (app-config.container.yaml). The estate inventory arrives as a ConfigMap
# mounted read-only at /estate, the same path compose.yml bind-mounts, so the
# image's config is identical in both places.
apiVersion: v1
kind: Service
metadata:
  labels:
    backstage.io/kubernetes-id: founder-catalogue
  name: catalogue
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalogue
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  # crew#684: app-config reads `$file` values once at start (the Healthchecks read-only key,
  # /run/secrets/healthchecks-ro). A rotated key is a 401 on the Ops tile until the pod rolls;
  # Reloader (platform/reloader) rolls it when that Secret changes.
  annotations:
    secret.reloader.stakater.com/reload: "healthchecks-ro"
spec:
  replicas: 1
  strategy:
    type: Recreate   # one Postgres, one writer; two catalogues ingesting at once is a race
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogue
    spec:
      # rbac.yaml: read-only cluster view for the Kubernetes tab (crew#412 row 2).
      serviceAccountName: catalogue
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # `USER node` in backstage/Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalogue
          image: idp/backstage:local
          imagePullPolicy: Never   # built locally, imported with `k3d image import`; a pull would fetch a stranger's image of the same name
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_DB
              value: backstage
          # POSTGRES_PASSWORD is read from a file (app-config.container.yaml, `$file`),
          # never from the environment: the estate policy secrets-not-from-env-vars
          # (prospector-main/deploy/k8s/policies/estate.yaml) refused the pod on
          # 2026-08-25 and the catalogue had no pod for 12 minutes after its image
          # finally built. Same pattern as prospector's file_secrets.py.
          ports:
            - containerPort: 3100
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # require-ro-rootfs; the backend writes only to /tmp
            capabilities:
              drop: ["ALL"]
          # Incident 2026-08-25: /healthcheck does not exist in the new backend system; the
          # app-backend catch-all answered it with index.html (200, text/html), so a pod whose
          # plugins had not mounted still read Ready. Measured: /nonsense-path also returned 200.
          # The backend's own endpoints answer JSON and only once the plugins are up.
          startupProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 36   # 180s; compose.yml gives start_period 120s
          readinessProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /.backstage/health/v1/liveness, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 512Mi }   # crew#584 zealot rule 1: micro CPU request, burst limit; the memory floor stays (incident-set)
            limits: { cpu: 1000m, memory: 1Gi }
          volumeMounts:
            - name: estate
              mountPath: /estate
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/backstage
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: estate
          configMap:
            name: estate-catalog
        - name: secrets
          secret:
            secretName: backstage-env   # POSTGRES_PASSWORD; no-optional-secret-references enforces optional: false
            optional: false
        - name: tmp
          emptyDir: {}
