# The catalogue itself. One container, one port (3100), served by the backend
# (app-config.container.yaml). The estate inventory arrives as a ConfigMap
# mounted read-only at /estate, the same path compose.yml bind-mounts, so the
# image's config is identical in both places.
apiVersion: v1
kind: Service
metadata:
  name: catalogue
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalogue
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
spec:
  replicas: 1
  strategy:
    type: Recreate   # one Postgres, one writer; two catalogues ingesting at once is a race
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # `USER node` in backstage/Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalogue
          image: idp/backstage:local
          imagePullPolicy: Never   # built locally, imported with `k3d image import`; a pull would fetch a stranger's image of the same name
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_DB
              value: backstage
          envFrom:
            - secretRef:
                name: backstage-env   # POSTGRES_PASSWORD, BACKEND_SECRET
          ports:
            - containerPort: 3100
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # backstage-cli writes a cache under /app on boot
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /healthcheck, port: http }
            periodSeconds: 5
            failureThreshold: 36   # 180s; compose.yml gives start_period 120s
          readinessProbe:
            httpGet: { path: /healthcheck, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthcheck, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: estate
              mountPath: /estate
              readOnly: true
      volumes:
        - name: estate
          configMap:
            name: estate-catalog
