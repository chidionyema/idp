# The catalogue itself. One container, one port (3100), served by the backend
# (app-config.container.yaml). The estate inventory arrives as a ConfigMap
# mounted read-only at /estate, the same path compose.yml bind-mounts, so the
# image's config is identical in both places.
apiVersion: v1
kind: Service
metadata:
  labels:
    backstage.io/kubernetes-id: founder-catalogue
  name: catalogue
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalogue
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  # crew#684: app-config reads `$file` values once at start (the Healthchecks read-only key,
  # /run/secrets/healthchecks-ro). A rotated key is a 401 on the Ops tile until the pod rolls.
  # Founder blueprint 2026-08-30 (4ca529a0.md): no hand-kept list of Secret names. Reloader
  # discovers every Secret and ConfigMap this pod references, and
  # platform/edge/require-auto-reload.yaml injects this annotation at admission, so git and the
  # cluster say the same thing.
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate   # one Postgres, one writer; two catalogues ingesting at once is a race
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalogue
    spec:
      # rbac.yaml: read-only cluster view for the Kubernetes tab (crew#412 row 2).
      serviceAccountName: catalogue
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # `USER node` in backstage/Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalogue
          # The registry is written out here, not left to the overlay: on cri-o with
          # short-name mode enforcing, `idp/backstage:local` is admitted and then fails to
          # pull with "returns ambiguous list". The overlay still moves the tag to the sha
          # image-automation ordered; only the host stops depending on being overlaid.
          image: ghcr.io/chidionyema/backstage:local
          imagePullPolicy: Never   # built locally, imported with `k3d image import`; a pull would fetch a stranger's image of the same name
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_DB
              value: backstage
          # POSTGRES_PASSWORD is read from a file (app-config.container.yaml, `$file`),
          # never from the environment: the estate policy secrets-not-from-env-vars
          # (prospector-main/deploy/k8s/policies/estate.yaml) refused the pod on
          # 2026-08-25 and the catalogue had no pod for 12 minutes after its image
          # finally built. Same pattern as prospector's file_secrets.py.
          ports:
            - containerPort: 3100
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # require-ro-rootfs; the backend writes only to /tmp
            capabilities:
              drop: ["ALL"]
          # Incident 2026-08-25: /healthcheck does not exist in the new backend system; the
          # app-backend catch-all answered it with index.html (200, text/html), so a pod whose
          # plugins had not mounted still read Ready. Measured: /nonsense-path also returned 200.
          # The backend's own endpoints answer JSON and only once the plugins are up.
          startupProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 5
            # 2026-09-08: measured on the live pods, not chosen. The replica that started took
            # 09:22:54Z -> 09:25:54Z = 180s to answer readiness, and the budget was 36 x 5s = 180s
            # exactly. Zero margin: a replica a single period slower never starts at all, and
            # catalogue-c8b8f898d-txtbc did not -- seven restarts, every one killed at the same
            # 503 on /.backstage/health/v1/readiness while plugin initialization was still running.
            # Backstage's boot is a fixed amount of work that a 50m CPU request does not get a
            # steady share of, so the time moves with whatever else the node is doing.
            failureThreshold: 90   # 450s, 2.5x the slowest boot measured; compose.yml start_period 120s
          readinessProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /.backstage/health/v1/liveness, port: http }
            periodSeconds: 30
          resources:
            # The 50m request is what made the boot time a coin flip: the scheduler and the CFS
            # share are both computed from the request, so under node contention this container
            # gets 50m of a core to do three minutes of single-threaded plugin loading. The
            # request buys a predictable boot; the burst limit below is unchanged (crew#584
            # zealot rule 1), as is the memory floor (incident-set).
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          volumeMounts:
            - name: estate
              mountPath: /estate
              readOnly: true
            - name: feature-register
              mountPath: /app/feature-register
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/backstage
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: estate
          configMap:
            name: estate-catalog
        - name: feature-register
          configMap:
            name: feature-register
        - name: secrets
          secret:
            secretName: backstage-env   # POSTGRES_PASSWORD; no-optional-secret-references enforces optional: false
            optional: false
        - name: tmp
          emptyDir: {}
