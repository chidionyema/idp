# The catalogue reads the cluster it runs in. crew#412 row 2 (R38): the founder's god view is
# the Backstage portal, and its Kubernetes tab is fed by @backstage/plugin-kubernetes-backend
# talking to https://kubernetes.default.svc with this pod's own token. Read verbs only, and
# only the kinds the plugin renders (backstage.io/docs/features/kubernetes/configuration):
# tests/test_incident_crew412_kubernetes_tab_reads_only.py refuses any create/update/patch/
# delete verb on this role, so the portal can never become a write path into the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalogue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalogue-kubernetes-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, limitranges, resourcequotas, namespaces]
    verbs: [get, list, watch]
  # crew#684 incident 2026-08-30 05:01Z: the Ops page's cluster tile (useClusterHealth.ts) has read
  # /api/v1/nodes since #918, and this role never granted it, so the tile answered 403 and the
  # login drill failed the page (run 33294482021). Read only, cluster-scoped.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  # crew#459: the front page reads every Flux layer's Ready condition and revision in one request
  # through the plugin's proxy, so the founder sees the cluster, not a copy of it. Read only.
  - apiGroups: [kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
    resources: [kustomizations, helmreleases]
    verbs: [get, list, watch]
  # crew#684 CP2: the Ops page reads Alertmanager's active alerts through the cluster API's
  # service proxy (GET .../services/<alertmanager>:9093/proxy/api/v2/alerts). Read only.
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalogue-kubernetes-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalogue-kubernetes-read
subjects:
  - kind: ServiceAccount
    name: catalogue
    namespace: backstage
