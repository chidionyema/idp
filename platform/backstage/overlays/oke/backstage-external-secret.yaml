# backstage-env from OCI Vault secret backstage-env (JSON: BACKEND_SECRET, POSTGRES_PASSWORD),
# through ClusterSecretStore estate-vault (crew#227 CP3). Replaced backstage-env.sops.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-env
  namespace: backstage
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: backstage-env, creationPolicy: Owner }
  dataFrom:
    - extract: { key: backstage-env }
