# The OKE overlay: base, backstage-env as an ExternalSecret from OCI Vault (platform/secret-store)
# (clusters/oke/platform.yaml, decryption.provider: sops). The estate-catalog ConfigMap is NOT
# here: catalog/catalog-info.yaml is generated from this machine's inventory and gitignored, so
# bin/idp-catalog-push publishes it as an OCI artifact and clusters/oke/catalog.yaml pulls it.
# Image: base pins idp/backstage:local, which only k3d can import. OKE needs the image in ghcr
# for arm64; that build is idp#29 (backstage/Dockerfile + bin/dockerfiles). Until it merges
# this overlay renders but the Deployment cannot pull, and the Flux healthCheck reports it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - availability.yaml
  - backstage-external-secret.yaml
  - httproute.yaml
  # crew#503 CP6: backstage/founder is a kustomization of its own (a directory base may live anywhere;
  # a file outside the overlay may not, and plain `kustomize build` in the tests refuses it).
  - ../../../../backstage/founder
images:
  # build-multiarch pushes ghcr.io/chidionyema/<image name from bin/dockerfiles>:<commit sha>
  # and nothing else (its header: a moving tag leaves a rollback nothing to roll back to).
  # 2026-08-25: this pointed at idp/backstage:main, a name and a tag that never existed, and
  # the pod sat in ImagePullBackOff after idp#132. Until crew#267 (image automation) lands,
  # every main build that changes the image is followed by a PR that moves this sha.
  - name: idp/backstage
    newName: ghcr.io/chidionyema/backstage
    # image-automation-controller rewrites this line from ImagePolicy flux-system/backstage
    # (platform/image-automation/backstage.yaml, crew#267); the marker is how it finds the line.
    newTag: main-1779-3936b886efaa79858027469b469c82ae46307f91 # {"$imagepolicy": "flux-system:backstage:tag"}
  # OKE's CRI-O enforces fully qualified names: `postgres:17.6-alpine` failed with
  # "short name mode is enforcing" on 2026-08-25. k3d resolves either form.
  - name: postgres
    newName: docker.io/library/postgres
patches:
  # The label that arms admission. platform/scheduling/require-availability.yaml refuses a
  # Deployment below the standard in any namespace carrying it, and bin/idp-availability-gate
  # FAILS a namespace it graded green that does not. It is set here and not in the base because
  # the base is the k3d shape: one node, one replica, where the policy would refuse correct work.
  - target:
      kind: Namespace
      name: backstage
    patch: |
      - op: add
        path: /metadata/labels/availability.idp~1tier
        value: founder-facing
  # ghcr packages under this account are private (anonymous manifest GET: 403, 2026-08-25).
  # idp-flux-bootstrap writes ghcr-pull in every namespace that pulls; catalog.yaml uses it too.
  - target:
      kind: Deployment
      name: catalogue
    patch: |
      # crew#539, 2026-08-28: one replica with strategy Recreate meant a single cordon
      # (10.0.148.221, 06:20:36Z) left the catalogue Pending and the founder looking at a 503
      # for ~15 minutes (login-drill 33148483050). Two replicas that may not share a node, and
      # a rollout that never takes the last one down, is what makes a node operation survivable.
      # Base keeps replicas 1 and Recreate: k3d is one node, where a second replica cannot be
      # placed and would sit Pending for ever.
      # crew#539, 2026-08-28 10:12Z (oke-check 33162263652): maxSurge 1 with required
      # per-hostname anti-affinity and replicas == nodes is a deadlock by construction -- the
      # surge pod needs a third node, ReplicaSet catalogue-8647bbdc59 "timed out progressing",
      # pod Pending 17m "0/2 nodes are available: 2 node(s) didn't match pod anti-affinity
      # rules", and every Flux row behind backstage waited on it. maxUnavailable 1 / maxSurge 0:
      # a rollout replaces one replica in place, the other keeps serving, the PDB
      # (availability.yaml, maxUnavailable 1) already permits exactly that.
      - op: replace
        path: /spec/replicas
        value: 2
      # crew#307, 2026-08-28: maxSurge 1 / maxUnavailable 0 made this Deployment permanently
      # un-rollable, and silently. A surge asks the scheduler for a THIRD catalogue pod before
      # any old one is deleted, and the hard hostname anti-affinity below plus a two-node pool
      # means there is no node left to put it on. Pod catalogue-8647bbdc59-kjc9j sat `Pending`
      # with node `<none>` while the two old pods served happily, so the estate looked healthy
      # from outside; Flux reported `timeout waiting for: [Deployment/backstage/catalogue
      # status: 'InProgress']` (oke-check run 33161593926) and no revision could ever land.
      #
      # maxSurge 0 / maxUnavailable 1 rolls the other way round: one old pod is removed first,
      # which frees its node, and the new pod takes that node. One replica serves throughout,
      # which is the same floor the PodDisruptionBudget in availability.yaml already sets.
      # tests/test_incident_crew307_a_surge_needs_a_spare_node.py refuses the deadlock shape.
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
      # requiredDuringScheduling, not preferred: preferred is advisory, and the whole failure
      # was two pods that could end up on one node. With the node pool floor at 1 (autoscaler,
      # platform/oci/main.tf) a single-node estate runs one Ready replica and one Pending --
      # which is the honest state, and still one more than it had.
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app.kubernetes.io/name: catalogue}
                topologyKey: kubernetes.io/hostname
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-pull}]
      # base pins Never for the k3d-imported image; on OKE the image only exists in ghcr
      # (ErrImageNeverPull, 2026-08-25).
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # The portal's origin: the hostname httproute.yaml publishes, behind oauth2-proxy
      # (ADR 0003). ESTATE_ZONE is substituted by Flux from estate-vars when set.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: APP_BASE_URL, value: "https://catalogue.${ESTATE_ZONE}"}
      # crew#503 CP6: the founder's surfaces reach the portal from git through Flux, never from a
      # laptop push. The ConfigMap carries backstage/founder/catalog-info.yaml; Flux postBuild
      # substitutes ${ESTATE_ZONE} in it like every other manifest here, and app-config.container
      # .yaml reads it as a catalog location at /estate/founder/catalog-info.yaml.
      #
      # crew#307, 2026-08-28. It was first written as a second volumeMount at /estate/founder,
      # nested inside the /estate ConfigMap mount. A ConfigMap volume is mounted read-only, so
      # the kubelet cannot create the `founder` directory inside it; the new pod never started,
      # the rollout stalled from 2026-08-27 16:05, and the founder kept looking at the old
      # ReplicaSet -- an image whose app-config never declared the location. Flux said so every
      # ten minutes ("health check failed ... Deployment/backstage/catalogue status: 'Failed'",
      # flux-events runs 33157104551 and 33157772740) and nothing read it. Founder, 2026-08-28:
      # "cant see my ui surfaces".
      #
      # One projected volume, two sources, no nested mount: `items.path` may carry a
      # subdirectory, so founder-catalog lands at /estate/founder/catalog-info.yaml inside the
      # same volume the estate catalogue already fills. The location path in the image does not
      # move, so this needs no rebuild -- it rolls on the next reconcile.
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: estate
          projected:
            sources:
              - configMap: {name: estate-catalog}
              - configMap:
                  name: founder-catalog
                  items:
                    - {key: catalog-info.yaml, path: founder/catalog-info.yaml}
