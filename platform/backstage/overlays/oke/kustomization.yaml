# The OKE overlay: base, backstage-env as an ExternalSecret from OCI Vault (platform/secret-store)
# (clusters/oke/platform.yaml, decryption.provider: sops). The estate-catalog ConfigMap is NOT
# here: catalog/catalog-info.yaml is generated from this machine's inventory and gitignored, so
# bin/idp-catalog-push publishes it as an OCI artifact and clusters/oke/catalog.yaml pulls it.
# Image: base pins idp/backstage:local, which only k3d can import. OKE needs the image in ghcr
# for arm64; that build is idp#29 (backstage/Dockerfile + bin/dockerfiles). Until it merges
# this overlay renders but the Deployment cannot pull, and the Flux healthCheck reports it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - backstage-external-secret.yaml
images:
  - name: idp/backstage
    newName: ghcr.io/chidionyema/idp/backstage
    newTag: main
  # OKE's CRI-O enforces fully qualified names: `postgres:17.6-alpine` failed with
  # "short name mode is enforcing" on 2026-08-25. k3d resolves either form.
  - name: postgres
    newName: docker.io/library/postgres
patches:
  # ghcr packages under this account are private (anonymous manifest GET: 403, 2026-08-25).
  # idp-flux-bootstrap writes ghcr-pull in every namespace that pulls; catalog.yaml uses it too.
  - target:
      kind: Deployment
      name: catalogue
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-pull}]
      # base pins Never for the k3d-imported image; on OKE the image only exists in ghcr
      # (ErrImageNeverPull, 2026-08-25).
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # The portal's origin. No route exists in platform/edge yet, so the only
      # path is `kubectl -n backstage port-forward svc/catalogue 3100:3100` and
      # this is the origin the browser then sees. The route PR changes this one
      # value to the published hostname (and adds OIDC in front, ADR 0003).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: APP_BASE_URL, value: "http://localhost:3100"}
generatorOptions:
  disableNameSuffixHash: true
