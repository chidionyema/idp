# crew#684 CP5: the Healthchecks read-only API key (platform/oci/healthchecks.tf mints it, the
# Healthchecks enrol step sets it on the project) mounted as a file for the proxy endpoint in
# backstage/app-config.container.yaml (/healthchecks). Same vault entry as platform/healthchecks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-ro
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: healthchecks-ro, creationPolicy: Owner }
  data:
    - secretKey: HC_API_KEY_RO
      remoteRef: { key: healthchecks-ro-key }
