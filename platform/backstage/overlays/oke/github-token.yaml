# The portal's GitHub credential, minted in-cluster the way hermes-agent mints Otto's
# (platform/hermes-agent/gateway.yaml, idp#852): external-secrets' GithubAccessToken generator
# mints a fresh installation token of the estate-agents App on every refresh, narrowed to the
# backstage lane of platform/github-app/lanes.json -- read the catalog, dispatch a workflow,
# never push or open a pull request.
#
# 2026-09-06: the scaffolder's github:actions:dispatch (template run-demo-sandbox) failed with
# "No token available for host: github.com, with owner chidionyema, and repo idp". The
# deployment never set GITHUB_TOKEN, and the estate refuses secrets in env vars
# (platform/edge/kyverno-secrets-policy.yaml), so the token reaches the config as a file:
# app-config.container.yaml reads it with $file from /run/secrets/backstage-github.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github
  namespace: backstage
spec:
  # 45m, not 10m: crew#736 measured that a 10m mint rolls the pod 4.5x too often through the
  # Reloader, and a mint's only job is to stay inside the token's 60-minute life.
  refreshInterval: 45m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: backstage-github
    creationPolicy: Owner
    template:
      # Founder, 2026-09-07: "our portl cant afford to ever go downn", and on the churn this
      # file caused: "backstage never had this problem until ... token revoked after 45 mins
      # and we came up with this shit show". He is right, and the dates say so. #1032
      # (2026-08-31) made every workload restart when its config changes; #1991 (2026-09-06)
      # gave the portal a token that is replaced every 45 minutes. Apart, both are correct.
      # Together they restarted the portal 32 times a day, at half capacity for up to three
      # minutes each time, because a two-node pool with hard anti-affinity cannot surge
      # (crew#307).
      #
      # The mint is not the problem; the restart is. Reloader reads this annotation and leaves
      # this one Secret alone, so a rotated token no longer rolls the Deployment. Every other
      # Secret and ConfigMap the portal mounts still rolls it, which is what #1032 was for.
      # The kubelet still refreshes the mounted file in place, so the token on disk stays
      # current between deploys.
      metadata:
        annotations:
          reloader.stakater.com/ignore: "true"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: backstage-github
      rewrite:
        - transform: { template: "GITHUB_TOKEN" }
---
# ${githubAppIDQuoted} / ${githubAppInstallationIDQuoted} are substituted by Flux from the
# flux-system/github-app Secret (platform/alerts-github/github-app.yaml; the backstage row's
# substituteFrom in clusters/oke/platform.yaml). The Quoted variants carry their own double
# quotes because kustomize build re-emits every scalar plain and a bare numeral types
# spec.appID as an int (incident run 33339964930). Account identifiers never typed in git
# (LAW 46).
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: backstage-github
  namespace: backstage
spec:
  appID: ${githubAppIDQuoted}
  installID: ${githubAppInstallationIDQuoted}
  # Mirrors the backstage lane in platform/github-app/lanes.json.
  permissions:
    metadata: read
    contents: read
    actions: write
  auth:
    privateKey:
      secretRef:
        name: github-app-pem
        key: key
---
# The App's private key for the generator, rendered the way flux-writer renders it
# (platform/image-automation/flux-writer.yaml): from the one vault entry `github-app` that
# bin/idp-github-app writes. Same shape as hermes-agent-github-app-pem.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-app-pem
  namespace: backstage
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: github-app-pem
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .pem_b64 | b64dec }}"
  dataFrom:
    - extract: { key: github-app }
