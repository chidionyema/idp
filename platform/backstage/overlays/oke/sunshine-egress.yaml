# crew#562 (ADR 0009 decision founder-screen-access, path 1): the portal reaches Sunshine on the
# founder's Mac through the Tailscale operator's egress pattern (platform/tailscale,
# tailscale.com/kb/1438/kubernetes-operator-cluster-egress): an ExternalName Service carrying the
# tailnet IP; the operator runs the proxy and rewrites the Service to point at it. No sidecar in
# the catalogue pod, no SOCKS, no key on the Mac. FOUNDER_MAC_TS_IP is the estate-config row
# (clusters/oke/estate-config.yaml), substituted by Flux (LAW 46). Sunshine's web/API port is 47990.
apiVersion: v1
kind: Service
metadata:
  name: sunshine-mac
  namespace: backstage
  annotations:
    tailscale.com/tailnet-ip: "${FOUNDER_MAC_TS_IP}"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 47990
      protocol: TCP
---
# Sunshine's API takes Basic auth (the admin credential created on the Mac, ~/.estate on the
# Mac, never in git, never in Telegram: memory never-deliver-secrets-over-telegram). The vault
# entry sunshine-auth holds one property, authorization = "Basic <base64 user:pass>"; the
# catalogue reads it as a mounted file (app-config.container.yaml, proxy /sunshine headers), the
# same shape as POSTGRES_PASSWORD -- the estate policy secrets-not-from-env-vars refuses env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sunshine-auth
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: sunshine-auth, creationPolicy: Owner }
  data:
    - secretKey: AUTHORIZATION
      remoteRef: { key: sunshine-auth, property: authorization }
