# The catalogue's one hostname (crew#269): the founder never asks for a URL again. Every request
# is subrequested to oauth2-proxy first (ADR 0007); Traefik's ForwardAuth is the ExtensionRef
# filter and must live in this namespace (Traefik Gateway API reference, read 2026-08-25).
# Unauthenticated, oauth2-proxy answers 302 to /oauth2/start on this same hostname, which the
# second rule sends to oauth2-proxy (ReferenceGrant in platform/identity/httproute.yaml); it then
# hands off to GitHub and back to auth.<zone>/oauth2/callback, and the .<zone> cookie opens this door.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-forward-auth
  namespace: backstage
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username]
---
# 2026-09-03 incident (founder: "Last executed flow is not valid" on the identity domain's
# sign-in page): with an expired session, the catalogue page's background call to
# /api/auth/oauth2Proxy/refresh followed the login 302 cross-origin; the callback arrived
# cookie-less (oauth2-proxy log: "No cookies were found in OAuth callback", 403) and the detour
# started a fresh authorize flow at the identity domain, invalidating the sign-in the founder
# was typing into. An API call is never a browser navigation, so it must get a status code,
# never a redirect. oauth2-proxy's /oauth2/auth endpoint answers exactly 202 (with the identity
# headers) or 401 (oauth2-proxy docs, features/endpoints) -- no Location, no new flow.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-forward-auth-api
  namespace: backstage
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    backstage.io/kubernetes-id: founder-catalogue
  name: catalogue
  namespace: backstage
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-catalogue
  hostnames:
    - "catalogue.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /oauth2/ }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: oauth2-proxy
          namespace: identity
          port: 80
    # crew#631 CP9: the prover's machine door. Only a request that already carries a Bearer token
    # on the catalogue API skips the browser login; Backstage itself grades the token
    # (backend.auth.externalAccess, backstage/app-config.container.yaml) and answers 401 to any
    # other. A request with no Authorization header does not match here and falls through to the
    # forward-auth rule below, so a browser is never let past the login by this rule. The
    # prover's NEGATIVE control (probes/backstage.py) proves the no-token read is refused, hourly.
    - matches:
        - path: { type: PathPrefix, value: /api/catalog/ }
          headers:
            - { type: RegularExpression, name: Authorization, value: "^Bearer .+" }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    # 2026-10-03 (CP4 post battery): the prover's voice legs run through the public gate too
    # (probes/voice.py: /voice/hear -> /voice/stream -> /voice/say -> /voice/hear, real WAVs,
    # real vendors, after every deploy). Same doctrine as /api/catalog/ above: the header match
    # means a browser never takes this rule, and Backstage grades the token itself
    # (backend.auth.externalAccess) -- the route only decides who ASKS, never who ENTERS.
    - matches:
        - path: { type: PathPrefix, value: /api/proxy/fleetview/ }
          headers:
            - { type: RegularExpression, name: Authorization, value: "^Bearer .+" }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    # 2026-09-03: API calls take the auth-only door (Middleware above). Signed in: 202 plus the
    # identity headers, same as before. Session expired: a plain 401 the Backstage frontend
    # understands, instead of a login redirect no XHR can complete -- the redirect chain is what
    # broke the founder's interactive sign-in. Gateway API precedence: /api/catalog/ with a
    # Bearer header still wins above; the catch-all below keeps the browser login for pages.
    - matches:
        - path: { type: PathPrefix, value: /api/ }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth-api
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    # crew#1017 lane A: the face's static shell is public. The avatar runs on phones and demo
    # screens that are never signed in, and a JS module that receives the login page's HTML
    # instead of its own code breaks loading entirely (measured 2026-10-02: /face/talkinghead.mjs,
    # /face/brunette.glb, /voice/ort.min.js all 302 to the sign-in page when not signed in).
    # Static assets only: /api/ rules above keep their gates, and the page's data calls still
    # carry the login. No forward-auth middleware on this rule; friendly-errors and edge-headers
    # stay so errors and zone headers behave like every other rule.
    # 2026-10-03 (browse-live probe): the shell at /face/ is the SPA's index.html, and every one
    # of its 38 bundle references (/static/main.*.js, module-*.js, vendor.css, runtime.js) plus
    # /manifest.json and the 6 root icons 302'd to the SSO authorize endpoint signed-out -- a
    # public shell that can never execute is not public. The bundle is immutable build output
    # (hashes in the names); the data plane keeps its gates: /api/* still takes
    # login-forward-auth-api, and the app answers 401 to an unauthenticated XHR, never a redirect.
    - matches:
        - path: { type: PathPrefix, value: /face }
        - path: { type: PathPrefix, value: /voice }
        - path: { type: PathPrefix, value: /static }
        - path: { type: Exact, value: /manifest.json }
        - path: { type: Exact, value: /favicon.ico }
        - path: { type: Exact, value: /favicon-16x16.png }
        - path: { type: Exact, value: /favicon-32x32.png }
        - path: { type: Exact, value: /apple-touch-icon.png }
        - path: { type: Exact, value: /safari-pinned-tab.svg }
        - path: { type: Exact, value: /icon.svg }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
