# The catalogue's one hostname (crew#269): the founder never asks for a URL again. Every request
# is subrequested to oauth2-proxy first (ADR 0007); Traefik's ForwardAuth is the ExtensionRef
# filter and must live in this namespace (Traefik Gateway API reference, read 2026-08-25).
# Unauthenticated, oauth2-proxy answers 302 to /oauth2/start on this same hostname, which the
# second rule sends to oauth2-proxy (ReferenceGrant in platform/identity/httproute.yaml); it then
# hands off to GitHub and back to auth.<zone>/oauth2/callback, and the .<zone> cookie opens this door.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-forward-auth
  namespace: backstage
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username]
---
# 2026-09-03 incident (founder: "Last executed flow is not valid" on the identity domain's
# sign-in page): with an expired session, the catalogue page's background call to
# /api/auth/oauth2Proxy/refresh followed the login 302 cross-origin; the callback arrived
# cookie-less (oauth2-proxy log: "No cookies were found in OAuth callback", 403) and the detour
# started a fresh authorize flow at the identity domain, invalidating the sign-in the founder
# was typing into. An API call is never a browser navigation, so it must get a status code,
# never a redirect. oauth2-proxy's /oauth2/auth endpoint answers exactly 202 (with the identity
# headers) or 401 (oauth2-proxy docs, features/endpoints) -- no Location, no new flow.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-forward-auth-api
  namespace: backstage
spec:
  forwardAuth:
    address: http://oauth2-proxy.identity.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email, X-Auth-Request-Preferred-Username]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    backstage.io/kubernetes-id: founder-catalogue
  name: catalogue
  namespace: backstage
spec:
  parentRefs:
    - name: prospector-edge
      namespace: prospector
      sectionName: https-catalogue
  hostnames:
    - "catalogue.${ESTATE_ZONE}"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /oauth2/ }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: oauth2-proxy
          namespace: identity
          port: 80
    # crew#631 CP9: the prover's machine door. Only a request that already carries a Bearer token
    # on the catalogue API skips the browser login; Backstage itself grades the token
    # (backend.auth.externalAccess, backstage/app-config.container.yaml) and answers 401 to any
    # other. A request with no Authorization header does not match here and falls through to the
    # forward-auth rule below, so a browser is never let past the login by this rule. The
    # prover's NEGATIVE control (probes/backstage.py) proves the no-token read is refused, hourly.
    - matches:
        - path: { type: PathPrefix, value: /api/catalog/ }
          headers:
            - { type: RegularExpression, name: Authorization, value: "^Bearer .+" }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    # 2026-10-03 (CP4 post battery): the prover's voice legs run through the public gate too
    # (probes/voice.py: /voice/hear -> /voice/stream -> /voice/say -> /voice/hear, real WAVs,
    # real vendors, after every deploy). Same doctrine as /api/catalog/ above: the header match
    # means a browser never takes this rule, and Backstage grades the token itself
    # (backend.auth.externalAccess) -- the route only decides who ASKS, never who ENTERS.
    - matches:
        - path: { type: PathPrefix, value: /api/proxy/fleetview/ }
          headers:
            - { type: RegularExpression, name: Authorization, value: "^Bearer .+" }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    # 2026-09-03: API calls take the auth-only door (Middleware above). Signed in: 202 plus the
    # identity headers, same as before. Session expired: a plain 401 the Backstage frontend
    # understands, instead of a login redirect no XHR can complete -- the redirect chain is what
    # broke the founder's interactive sign-in. Gateway API precedence: /api/catalog/ with a
    # 2026-10-03 (RC-1b, founder: "open the anonymous lane"): the anonymous voice door.
    # A phone visitor with no sign-in opens /face; the SPA's voice calls carry no Bearer,
    # so they miss the rule above and would die on the login rule below. This rule sends
    # ONLY the voice endpoints to serve.py directly (Service fleetview-voice, port 18790)
    # -- stripped (voice-strip applies the same rewrite app-config.yaml's proxy applies
    # for signed-in browsers) and rate-limited (voice-rate: 30 turns/min, burst 60) --
    # with no login filter. The door decides who may SPEAK, never who may read the API:
    # every other /api/ path still demands the door's sign-in or a Bearer.
    - matches:
        - path: { type: PathPrefix, value: /api/proxy/fleetview/voice/ }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: voice-strip
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: voice-rate
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: fleetview-voice
          namespace: backstage
          port: 18790
    # 2026-10-03 (the face renders the WALL, not the avatar): /api/auth/guest/refresh is the
    # one door that exists FOR a visitor who is not signed in, and the catch-all below was
    # demanding login-forward-auth-api on it -- so the guest door could not be walked. Measured
    # inside the pod, no edge: POST /api/auth/guest/refresh -> 200 with a real Backstage token,
    # while the same call through the edge -> 401. Backstage was never the refusal; the edge was.
    #
    # The consequence was every symptom on the surface: the SPA takes 401 on its auth refresh,
    # so it renders the sign-in wall and NEVER MOUNTS THE FACE (measured in a real browser:
    # canvases: 0, and zero requests for /face/talkinghead.mjs or /face/brunette.glb at all --
    # the "black and white face" is an empty container, not an unlit or untextured avatar).
    # The same 401 path is what returns the oauth2Proxy 500 as a non-JSON body, which the voice
    # client reports as: Unexpected token 'I', "Internal S"... is not valid JSON.
    #
    # Carved out exactly like the voice rule above: an auth endpoint must be reachable to
    # establish a session, and the session it hands out is the guest identity, which is what
    # app-config.container.yaml already registers (dangerouslyAllowOutsideDevelopment) and what
    # Backstage answers 200 for. The estate's rule that "nobody enters without the domain"
    # (app-config.production.yaml) is unchanged for /api/catalog/ and every other data path --
    # the Bearer rule and the catch-all below still govern those, and Backstage still grades
    # every read itself. This route decides who ASKS, never who ENTERS.
    - matches:
        - path: { type: PathPrefix, value: /api/auth/guest/ }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    # /api/auth/oauth2Proxy/ is deliberately LEFT GATED by the /api/ catch-all below. The 2026-10-04
    # reload loop was never the gate's fault: the app asked a provider that needs the door's cookie
    # on a page reached without one. The root fix is in the app -- backstage/packages/app/src/
    # modules/signin/index.tsx now signs in with `guest` in production, the provider this deployment
    # actually serves (200, a real token, no door cookie needed), so nothing calls oauth2Proxy's
    # refresh any more. Leaving the path carved open would be worse than gating it: a stray client
    # would reach the backend and get a 500 (the provider has no X-Auth-Request-* headers without
    # the door), and the path would be an unauthenticated surface nothing uses. Gated is correct --
    # it costs nothing, because the one caller that needed it no longer exists.
    # Bearer header still wins above; the catch-all below keeps the browser login for pages.
    - matches:
        - path: { type: PathPrefix, value: /api/ }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth-api
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    # crew#1017 lane A: the face's static shell is public. The avatar runs on phones and demo
    # screens that are never signed in, and a JS module that receives the login page's HTML
    # instead of its own code breaks loading entirely (measured 2026-10-02: /face/talkinghead.mjs,
    # /face/brunette.glb, /voice/ort.min.js all 302 to the sign-in page when not signed in).
    # Static assets only: /api/ rules above keep their gates, and the page's data calls still
    # carry the login. No forward-auth middleware on this rule; friendly-errors and edge-headers
    # stay so errors and zone headers behave like every other rule.
    # 2026-10-03 (browse-live probe): the shell at /face/ is the SPA's index.html, and every one
    # of its 38 bundle references (/static/main.*.js, module-*.js, vendor.css, runtime.js) plus
    # /manifest.json and the 6 root icons 302'd to the SSO authorize endpoint signed-out -- a
    # public shell that can never execute is not public. The bundle is immutable build output
    # (hashes in the names); the data plane keeps its gates: /api/* still takes
    # login-forward-auth-api, and the app answers 401 to an unauthenticated XHR, never a redirect.
    # 2026-04-10 (browse-live probe, real Chrome at catalogue.mumchimp.com/fleet): /fleet was
    # NOT in this list, so it fell through to the `/` catch-all and took `login-forward-auth`.
    # A signed-out browser did not get an error -- it got a 302 to the Oracle OCI IAM wall
    # (idcs-...identity.oraclecloud.com/ui/v1/signin), the SPA never mounted, and therefore
    # getUserMedia was NEVER CALLED (measured: micCalls: []). The founder read that as
    # "microphone blocked on fleet"; the microphone was never reached. /face was exempted for
    # exactly this reason; /fleet is the same SPA behind the same document gate and belongs in
    # the same rule. The DATA plane is unchanged: /api/proxy/fleetview/ still answers 401 to an
    # unauthenticated XHR, so the board stays behind the login -- only its shell is public, the
    # way /face's is.
    - matches:
        - path: { type: PathPrefix, value: /face }
        - path: { type: PathPrefix, value: /fleet }
        - path: { type: PathPrefix, value: /voice }
        - path: { type: PathPrefix, value: /static }
        - path: { type: Exact, value: /manifest.json }
        - path: { type: Exact, value: /favicon.ico }
        - path: { type: Exact, value: /favicon-16x16.png }
        - path: { type: Exact, value: /favicon-32x32.png }
        - path: { type: Exact, value: /apple-touch-icon.png }
        - path: { type: Exact, value: /safari-pinned-tab.svg }
        - path: { type: Exact, value: /icon.svg }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: login-forward-auth
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: friendly-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: edge-headers
      backendRefs:
        - name: catalogue
          port: 3100
