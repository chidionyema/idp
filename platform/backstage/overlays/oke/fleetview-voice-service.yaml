# The anonymous voice door (RC-1b, founder 2026-10-03: "open the anonymous lane").
# serve.py's main app (the /voice/* routes the SPA's useEstateVoice drives) listens on
# 18790 in the catalogue pod; the Backstage proxy normally reaches it at '/fleetview'
# with the browser's session. An anonymous phone visitor has no session, so
# httproute.yaml sends ONLY /api/proxy/fleetview/voice/* here, stripped (voice-strip)
# and rate-limited (voice-rate), never through Backstage's auth-walled proxy.
# Which Services select this pod controls reachability (same doctrine as the
# fleetview-executor relay): this Service + its port-scoped NetworkPolicy are the
# whole in-cluster surface for 18790.
apiVersion: v1
kind: Service
metadata:
  name: fleetview-voice
  namespace: backstage
  labels:
    app.kubernetes.io/name: catalogue
    app.kubernetes.io/part-of: idp
    # Kyverno require-catalogue-entity: the door IS a part of the catalogue entity, so
    # the same label the catalogue HTTPRoute + Service carry names it. Without this label
    # Flux's backstage dry-run fails ("service-names-its-entity") and the anonymous lane
    # stays unwired even though every other surface for the catalogue is live.
    backstage.io/kubernetes-id: founder-catalogue
spec:
  selector:
    app.kubernetes.io/name: catalogue
  ports:
    - name: voice
      port: 18790
      targetPort: 18790
---
# Port-scoped door, same shape as the executor relay's NetworkPolicy: only Traefik
# (ns edge) may reach 18790, and only on this port. allow-declared-ingress keeps
# every other path closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-to-voice
  namespace: backstage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalogue
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
      ports:
        - protocol: TCP
          port: 18790
