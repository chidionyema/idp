# The catalogue survives losing one node. crew#539, 2026-08-28 06:20-06:39Z: cordoning
# 10.0.148.221 put the only catalogue pod into Pending (the other node had no room) and
# https://catalogue.mumchimp.com answered 503 to the founder for ~15 minutes; login-drill
# run 33148483050 recorded it. The drain was correct; the deployment was not: one replica,
# strategy Recreate, no PodDisruptionBudget anywhere in platform/, nothing keeping the two
# replicas apart. A node operation must never be able to take a founder-facing surface down.
#
# maxUnavailable, deliberately, and never minAvailable: a PDB whose floor equals the replica
# count refuses every drain forever -- that is exactly what the clickhouse PDB did to this same
# drain at 06:30:43Z. With 2 replicas, maxUnavailable 1 lets a node be drained one pod at a
# time while one pod always serves.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalogue
  namespace: backstage
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalogue
