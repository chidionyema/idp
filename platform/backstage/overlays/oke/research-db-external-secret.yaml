# The research department's database credential, for the portal's /api/research-output plugin
# (packages/backend/src/researchOutput.ts). Same vault entry and property the engine itself
# reads (platform/research-engine/secrets.yaml): ClusterSecretStore estate-vault, key estate-db,
# property research-password -- the estate's one Postgres, one database on it, role research.
# Arrives as a mounted file on the catalogue pod (/run/secrets/research-db, see the volume
# patches in kustomization.yaml), never an env var: the estate policy is
# secrets-not-from-env-vars and the plugin re-reads the file per request so a rotation lands
# without a pod restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: research-db
  namespace: backstage
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: research-db
    creationPolicy: Owner
    template:
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: estate-db, property: research-password }
