---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expert-falcon-h1-7b
  namespace: edge-runtime
  labels:
    backstage.io/kubernetes-id: estate-edge-runtime-falcon-h1-7b
    founder/surface: ai-agents
spec:
  replicas: 1
  strategy:
    # Recreate, never RollingUpdate: these hold gigabytes, and a rolling swap needs two copies on
    # one node at the moment of change.
    type: Recreate
  selector:
    matchLabels: { app: expert-falcon-h1-7b }
  template:
    metadata:
      labels: { app: expert-falcon-h1-7b }
    spec:
      nodeSelector:
        kubernetes.io/hostname: "10.0.148.221"
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: fetch-artifact
          image: ghcr.io/oras-project/oras:v1.2.0
          workingDir: /artifact
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # GHCR answers 401 without a login even for a public package. The secret is a
              # dockerconfigjson, so oras reads it from ~/.docker/config.json -- no login call.
              # $HOME is unset in this image, which is why it is set explicitly: $HOME/.docker
              # expanded to //.docker and mkdir said "Permission denied".
              export HOME=/tmp/oras-home
              mkdir -p "$HOME/.docker"
              printf '%s' "$GHCR_TOKEN" > "$HOME/.docker/config.json"
              oras pull "ghcr.io/chidionyema/models/falcon-h1-7b@sha256:86a7f1cd5f1a9cadca96671ee5070867d5ffa419c7e7b7da4388c3c97bb288db"
          env:
            - { name: GHCR_TOKEN, valueFrom: { secretKeyRef: { name: ghcr-pull, key: .dockerconfigjson } } }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "320Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: artifact, mountPath: /artifact }
            - { name: scratch, mountPath: /tmp }
      containers:
        - name: expert
          image: ghcr.io/chidionyema/edge-runtime@sha256:eae0df039b91bd444f0ea23853397d2bc5fddc569e2677e8e79d8e7ccd8c16f8
          env:
            - { name: EDGE_BIND, value: "127.0.0.1:8421" }
            - { name: EDGE_ARTIFACT_DIR, value: "/artifact" }
            - { name: RUST_LOG, value: "info" }
          resources:
            requests: { cpu: "100m", memory: "7Gi" }
            limits:   { cpu: "1500m", memory: "7Gi" }
          # EXEC, NOT httpGet. The server binds 127.0.0.1 (R20, enforced in main.rs) and the kubelet
          # probes from outside the pod namespace, so an httpGet gets connection refused forever
          # while the container is healthy. The image is distroless, so the binary checks itself.
          readinessProbe:
            exec: { command: ["/edge-runtime", "--health"] }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            exec: { command: ["/edge-runtime", "--health"] }
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: artifact, mountPath: /artifact, readOnly: true }
            - { name: scratch, mountPath: /tmp }
      volumes:
        - name: artifact
          emptyDir: {}
        - name: scratch
          emptyDir: { medium: Memory }
---
