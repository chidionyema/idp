#cloud-config
# The recovery host (platform/oci/recovery-host.tf, #7387): the estate's router on podman + systemd,
# reachable only through a Cloudflare Tunnel. Everything it needs arrives at boot by instance
# principal -- the vault entry `router-recovery` (vendor keys, the laptop caller key, the tunnel
# token) and the config bundle in its own bucket -- so it starts with no Kubernetes, no cluster
# secret store and no laptop. Both units restart on any exit; a timer re-reads the bundle.
# The bundle mounts at /bundle: /app is the image's own code (mounting over it crash-looped the router).

write_files:
  # Run Command executes as `ocarun`; without this it cannot read the router's logs or restart it,
  # and a broken host can only be replaced, never repaired (2026-10-29: "Interactive authentication
  # required"). The recovery path must be able to recover itself.
  - path: /etc/sudoers.d/101-oracle-cloud-agent-run-command
    permissions: "0440"
    content: |
      ocarun ALL=(ALL) NOPASSWD:ALL

  - path: /etc/estate/router-fetch
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Fetch the vault entry and the config bundle. Prints "changed" when either moved.
      #
      # "changed" covers the ENV file too (2026-10-29). It used to mean only "the bundle moved",
      # so a re-minted tunnel token -- the vault entry changed, the bundle did not -- was never
      # signalled and the connector kept running on the old token. The token is exactly what the
      # tunnel needs; a changed token must restart the connector.
      set -euo pipefail
      export OCI_CLI_AUTH=instance_principal SUPPRESS_LABEL_WARNING=True
      mkdir -p /etc/estate/router && chmod 0700 /etc/estate
      sid="$(oci vault secret list --compartment-id '${compartment_id}' --region '${region}' \
        --name router-recovery --lifecycle-state ACTIVE --query 'data[0].id' --raw-output)"
      [ -n "$sid" ] && [ "$sid" != null ] || { echo "BLIND router-fetch: no ACTIVE vault entry router-recovery" >&2; exit 2; }
      umask 077
      oci secrets secret-bundle get --secret-id "$sid" --region '${region}' \
        --query 'data."secret-bundle-content".content' --raw-output | base64 -d |
        python3 -c 'import json,sys; [print(k + "=" + v) for k, v in json.load(sys.stdin).items()]' > /etc/estate/router.env.new
      env_changed=1
      if cmp -s /etc/estate/router.env.new /etc/estate/router.env 2>/dev/null; then
        env_changed=0
      fi
      mv /etc/estate/router.env.new /etc/estate/router.env
      oci os object get --namespace '${namespace}' --bucket-name '${bucket}' --name bundle.tgz \
        --file /etc/estate/bundle.tgz.new --region '${region}'
      if ! cmp -s /etc/estate/bundle.tgz.new /etc/estate/bundle.tgz 2>/dev/null; then
        rm -rf /etc/estate/router.new && mkdir -p /etc/estate/router.new
        tar -xzf /etc/estate/bundle.tgz.new -C /etc/estate/router.new
        rm -rf /etc/estate/router && mv /etc/estate/router.new /etc/estate/router
        mv /etc/estate/bundle.tgz.new /etc/estate/bundle.tgz
        echo "changed"
      elif [ "$env_changed" = 1 ]; then
        rm -f /etc/estate/bundle.tgz.new
        echo "changed"
      else
        rm -f /etc/estate/bundle.tgz.new
      fi

  - path: /etc/systemd/system/estate-router.service
    content: |
      [Unit]
      Description=The estate router (LiteLLM) on the recovery host (#7387)
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPre=/etc/estate/router-fetch
      ExecStartPre=-/usr/bin/podman rm -f estate-router
      ExecStart=/usr/bin/podman run --name estate-router --network host --env-file /etc/estate/router.env \
        -e PYTHONPATH=/bundle/modules -e ESTATE_ROUTER_CONFIG=/bundle/config.yaml \
        -e ESTATE_ROUTER_HOSTS=llm.mumchimp.com,llm-recovery.mumchimp.com,127.0.0.1:4000,localhost:4000 \
        --memory 900m --log-opt max-size=20m --log-opt max-file=3 \
        -v /etc/estate/router:/bundle:ro,Z ghcr.io/berriai/litellm:v1.98.0 \
        --config /bundle/config.yaml --host 127.0.0.1 --port 4000
      ExecStop=/usr/bin/podman stop -t 30 estate-router
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/estate-tunnel.service
    content: |
      [Unit]
      Description=Cloudflare Tunnel for llm.mumchimp.com (#7387)
      # NOT After=estate-router.service (2026-10-29). The tunnel's origin is the router's
      # 127.0.0.1:4000, but the tunnel must not WAIT for the router to start: estate-router
      # restarts forever on any failure, and a unit that never reaches active blocks every unit
      # ordered after it. The tunnel was never started because the router could not stay up, and
      # with no connector Cloudflare answered 1033 for llm-recovery.mumchimp.com.
      After=network-online.target
      Wants=network-online.target

      [Service]
      # The tunnel needs /etc/estate/router.env (it carries TUNNEL_TOKEN). It had no fetch of its
      # own: if the vault entry had not arrived by the time the unit started, podman --env-file
      # failed and the unit crash-looped forever with nothing to show for it.
      ExecStartPre=/etc/estate/router-fetch
      ExecStartPre=-/usr/bin/podman rm -f estate-tunnel
      ExecStart=/usr/bin/podman run --name estate-tunnel --network host --env-file /etc/estate/router.env \
        --memory 256m --log-opt max-size=10m --log-opt max-file=3 \
        docker.io/cloudflare/cloudflared:2024.12.2 tunnel --no-autoupdate run
      ExecStop=/usr/bin/podman stop -t 10 estate-tunnel
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/estate-router-refresh.service
    content: |
      [Unit]
      Description=Re-read the router bundle; restart the router and the tunnel when it changed

      [Service]
      Type=oneshot
      # The tunnel too (2026-10-29): the vault entry carries the tunnel token, and a re-read that
      # changes the token must reach the connector. Restarting only the router left the connector
      # running on a token the router had already moved past.
      ExecStart=/bin/bash -c '/etc/estate/router-fetch | grep -q changed && { systemctl restart estate-router; systemctl restart estate-tunnel; } || true'

  - path: /etc/systemd/system/estate-router-refresh.timer
    content: |
      [Unit]
      Description=Every 10 minutes, the router bundle

      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=10min

      [Install]
      WantedBy=timers.target

runcmd:
  # A 1 GB shape (E2.1.Micro) needs room to breathe: a 2 GB swap file on the boot volume.
  - [bash, -c, "[ -f /swapfile ] || { fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; }"]
  - [bash, -c, "dnf install -y podman python39-oci-cli || dnf install -y podman python3-oci-cli"]
  - [systemctl, daemon-reload]
  # Each unit is enabled ON ITS OWN (2026-10-30, #7525). One combined
  # `systemctl enable --now a b c` aborts on the first unit that fails to start -- the router
  # could not stay up at boot -- so the timer was never enabled and cloud-final.service failed
  # with "Main process exited, code=exited, status=1/FAILURE". Measured on the live host
  # afterwards: estate-router-refresh.timer active=inactive enabled=static. Each enable is now
  # independent and tolerant, so one temporarily unavailable unit cannot abort the rest or fail
  # the cloud-final module.
  - [bash, -c, "systemctl enable --now estate-router.service || echo 'state estate-router.service not enabled'"]
  - [bash, -c, "systemctl enable --now estate-tunnel.service || echo 'state estate-tunnel.service not enabled'"]
  - [bash, -c, "systemctl enable --now estate-router-refresh.timer || echo 'state estate-router-refresh.timer not enabled'"]
