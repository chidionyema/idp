# Oracle's manifest, read 2026-08-27 from docs.oracle.com/en-us/iaas/Content/ContEng/Tasks/
# contengusingclusterautoscaler_topic-Working_with_the_Cluster_Autoscaler.htm (Step 2a), RBAC verbatim.
# Changed from Oracle's Deployment: one replica (one node, leader election has nobody to elect),
# the image tag Oracle lists for Kubernetes 1.35 pinned, --nodes from the vault-fed Secret,
# a priority above every workload so a scale-out never evicts the thing that does the scaling,
# and OCI_USE_INSTANCE_PRINCIPAL because the cluster is BASIC (no workload identity, crew#289).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
  name: cluster-autoscaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "patch", "update"]
  - apiGroups: [""]
    resources:
      - "pods"
      - "services"
      - "replicationcontrollers"
      - "persistentvolumeclaims"
      - "persistentvolumes"
    verbs: ["watch", "list", "get"]
  - apiGroups: ["extensions"]
    resources: ["replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattachments"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resourceNames: ["cluster-autoscaler"]
    resources: ["leases"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["watch", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create","list","watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status", "cluster-autoscaler-priority-expander"]
    verbs: ["delete", "get", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8085'
    spec:
      serviceAccountName: cluster-autoscaler
      priorityClassName: system-cluster-critical
      # Oracle's copy of this manifest ships no securityContext at all, and the image declares no
      # USER (config blob of iad.ocir.io/oracle/oci-cluster-autoscaler:1.34.3-323, both arches:
      # "User": null, Cmd ["/cluster-autoscaler"]), so without this block the pod runs as uid 0.
      # runAsNonRoot alone would then make the kubelet refuse to start it, which is why the uid is
      # explicit. The values are upstream's own recommendation, verbatim from the commented block
      # in kubernetes/autoscaler charts/cluster-autoscaler/values.yaml at tag
      # cluster-autoscaler-1.34.0 (lines 409-415 pod, 162-168 container).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # readOnlyRootFilesystem below leaves the Go runtime nowhere to put a temp file.
        - name: tmp
          emptyDir: {}
      containers:
        - name: cluster-autoscaler
          # the tag Oracle lists for Kubernetes 1.34-1.36 (the same doc, "Supported versions"); the
          # cluster is v1.35.2 (platform/oci/main.tf). Bump it with the cluster version.
          image: iad.ocir.io/oracle/oci-cluster-autoscaler:1.34.3-323
          imagePullPolicy: IfNotPresent
          env:
            - name: OCI_USE_INSTANCE_PRINCIPAL
              value: "true"
            - name: OCI_REGION
              valueFrom: { secretKeyRef: { name: oke-autoscaler, key: REGION } }
            - name: OCI_COMPARTMENT_ID
              valueFrom: { secretKeyRef: { name: oke-autoscaler, key: COMPARTMENT_ID } }
            - name: NODEPOOL_ID
              valueFrom: { secretKeyRef: { name: oke-autoscaler, key: NODEPOOL_ID } }
            - name: SPOT_NODEPOOL_ID
              valueFrom: { secretKeyRef: { name: oke-autoscaler, key: SPOT_NODEPOOL_ID } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /health-check on 8085 is the binary's own, not a guess: main.go:381 registers the
          # handler and config/flags/flags.go:64 defaults --address to :8085, both at tag
          # cluster-autoscaler-1.34.0, and upstream's chart probes exactly this path and port
          # (charts/cluster-autoscaler/templates/deployment.yaml:284-289). It is the same port
          # the prometheus.io/port annotation above already names.
          ports:
            - name: metrics
              containerPort: 8085
          readinessProbe:
            httpGet: { path: /health-check, port: 8085 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health-check, port: 8085 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 300Mi }
            limits: { cpu: 200m, memory: 300Mi }
          command:
            - ./cluster-autoscaler
            - --v=4
            - --stderrthreshold=info
            - --cloud-provider=oci
            - --max-node-provision-time=25m
            # min:max: the max is estate-defaults node_pool.max_nodes (tests/test_crew539_cp4_autoscaler_row.py pins them equal)
            - --nodes=1:2:$(NODEPOOL_ID)
            # crew#539 CP10: the preemptible pool, from zero; max is estate-defaults node_pool.spot_max_nodes
            - --nodes=0:1:$(SPOT_NODEPOOL_ID)
            - --scale-down-delay-after-add=10m
            - --scale-down-unneeded-time=10m
            - --unremovable-node-recheck-timeout=5m
