# The pool id, compartment and region come from the vault entry bin/idp-autoscaler-seed writes on
# every oke-check apply; nothing here names an OCID (LAW 46).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oke-autoscaler
  namespace: kube-system
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: oke-autoscaler, creationPolicy: Owner }
  dataFrom:
    - extract: { key: oke-autoscaler }
