# Same two middlewares every application door on this estate wears (platform/guacamole/
# edge-manners.yaml): a plain-English page instead of Traefik's raw "no available server" while
# the pod restarts, and the security headers with the backend's banners removed. A Middleware is
# an ExtensionRef filter and must live in the route's own namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: friendly-errors
  namespace: weave-gitops
spec:
  errors:
    status: ["502-504"]
    service:
      name: status-page
      namespace: edge
      port: 80
    query: "/{status}.html"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: edge-headers
  namespace: weave-gitops
spec:
  headers:
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    contentTypeNosniff: true
    customFrameOptionsValue: SAMEORIGIN
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
