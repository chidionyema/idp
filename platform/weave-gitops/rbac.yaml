# WHO THE DASHBOARD ACTS AS.
#
# Weave GitOps does not hold a password and does not show a login screen. The estate's one login
# already happened at the edge (decision 0003: OIDC at the gateway, never in an app), so the server
# runs with --insecure-no-authentication-user=founder and impersonates the Kubernetes user
# "founder" for every call. That flag is only safe behind an auth proxy, which is exactly where it
# sits: the HTTPRoute in this directory attaches login-forward-auth, so an unauthenticated request
# never reaches the pod. The vendor's own guide says the same
# (website/docs/guides/anonymous-access.mdx: "It is designed to be used with other external
# authentication systems like auth proxies").
#
# The rules below are what that user may do, and they are the whole blast radius of the button.
# Read everything the dashboard draws; patch Flux's own objects, which is how Reconcile and
# Suspend are implemented. A deploy button reads no credential (LAW 21), and the secrets rule at
# the bottom of this role is how that stays true while the vendor's namespace filter still passes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: weave-gitops-founder
rules:
  # Everything the dashboard draws, read-only.
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, events, namespaces, nodes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  # Flux's objects. get/list/watch draws them; patch is the Reconcile and Suspend buttons, which
  # write the annotation reconcile.fluxcd.io/requestedAt and the field spec.suspend and nothing
  # else. Both of those fields are themselves declared in git for every row in
  # clusters/oke/platform.yaml, so the parent Kustomization puts them back within its interval:
  # the dashboard cannot leave the cluster in a state git does not describe.
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
    resources: ["*"]
    verbs: [get, list, watch, patch]
  # WHY A DASHBOARD THAT READS NO SECRET ASKS FOR SECRETS.
  #
  # This one rule is the whole reason every page under /deploy drew "No data". Weave GitOps does
  # not list Flux objects across the namespaces the user can read; it first filters the namespace
  # list, and the filter is all-or-nothing against a fixed set of permissions the vendor compiled
  # in -- core/nsaccess/nsaccess.go, DefautltWegoAppRules, v0.38.0. Fourteen grants, and the very
  # first one is secrets get/list. A namespace where the user lacks any single grant is dropped
  # (hasAllRules), so lacking one dropped all of them: the server answered every query with
  # {"objects":[],"errors":[],"searchedNamespaces":[]} -- 200 OK, nothing searched, nothing drawn.
  # Measured 2026-09-05 against the running pod, and confirmed from the other side by asking the
  # API server which of the fourteen this user is refused: exactly these two, and nothing else.
  #
  # So the verb is required and the read is not. resourceNames pins the grant to a single name,
  # and that name cannot be borne by any Secret that will ever exist: a Secret name must be a
  # lowercase RFC 1123 subdomain, and this one is uppercase, so the API server refuses to create
  # it (apimachinery IsDNS1123Subdomain). The dashboard therefore satisfies the filter and can
  # read no credential in this estate -- not by a policy that watches for the mistake, but because
  # the object the grant names is unnameable. `list` cannot be narrowed by resourceNames at all,
  # so that half is dead on arrival by RBAC's own rules, which is the intent.
  #
  # The chart carries its own switch for this (rbac.viewSecretsEnabled in weave-gitops.yaml) and
  # it is deliberately left false: it writes secrets into the ServiceAccount's role, and the
  # filter runs as the impersonated user, not as the ServiceAccount. Flipping it would have handed
  # the pod real secret access and still left the page empty.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
    resourceNames: ["WEAVE-GITOPS-READS-NO-SECRET"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weave-gitops-founder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: weave-gitops-founder
subjects:
  - kind: User
    name: founder
    apiGroup: rbac.authorization.k8s.io
---
# THIS ROLE DID NOT FIX THE EMPTY PAGE, AND THE COMMENT THAT SAID IT DID WAS WRONG.
#
# The reasoning was sound as far as it went: the server runs with
# --insecure-no-authentication-user=founder, and that flag does not mean "act as yourself" -- every
# call the dashboard makes is an impersonated call as the Kubernetes user "founder"
# (core/clustersmngr/cluster/single.go GetUserClient), so the ServiceAccount must be allowed to
# impersonate that user. What was wrong was the measurement behind it. The probe used was
#   kubectl auth can-i impersonate users --as=system:serviceaccount:weave-gitops:weave-gitops
# which answers "no" for a grant pinned to a single name, because it asks about every user. The
# probe that matches the grant is
#   kubectl auth can-i impersonate users/founder --as=system:serviceaccount:weave-gitops:weave-gitops
# and on 2026-09-05 that answered "yes" -- from the chart's own ClusterRole, created 2026-09-04
# 08:55:49Z from the rbac.impersonationResourceNames value in weave-gitops.yaml, five seconds
# before the pods started. The permission has been in place since the install.
#
# The debug pass that comment asked for ran, and it did not name the defect either: at debug the
# server logs "Found principal {user: founder}" and "request success {uri: /deploy/v1/objects,
# status: 200}" for every page load, because from its point of view nothing failed. The answer was
# in the response body rather than the log -- searchedNamespaces was empty -- and the cause is the
# secrets grant described in the first role above.
#
# The role is kept because it states the grant in this repository instead of leaving it implicit in
# a chart value, and resourceNames pins it to the single username above: this ServiceAccount may
# become "founder" and no one else, so the blast radius stays exactly the read-and-reconcile rules
# in this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: weave-gitops-impersonate-founder
rules:
  - apiGroups: [""]
    resources: [users]
    verbs: [impersonate]
    resourceNames: [founder]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weave-gitops-impersonate-founder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: weave-gitops-impersonate-founder
subjects:
  - kind: ServiceAccount
    name: weave-gitops
    namespace: weave-gitops
