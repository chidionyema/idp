[package]
name = "voice-gate"
version = "0.1.0"
edition = "2021"
description = "Semantic egress gateway: one gate grades every string a customer can read (spec: prospector specs/voice-gate-2026-09-06.md)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex-automata = { version = "0.4", features = ["meta"] }
jsonschema = "0.18"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
