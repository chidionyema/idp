# HF Write token for the agent-foundry Backstage tile.
# Operator flow (zero UI, zero paste):
#   1. Drop the hf_xxxxxxxxxxxxxxxxx value into Bitwarden Secrets Manager under the
#      name `AGENT_FOUNDRY_HF_WRITE_TOKEN` (path: human-vault's tenant root).
#   2. ESO syncs it into this Secret as the `hf_write_token` data key (refresh: 1m,
#      matches platform/human-vault-bridge/externalsecrets.yaml).
#   3. The runner pod mounts this Secret as a FILE (mode 0400) at
#      /etc/agent-foundry/hf_token and sets HF_TOKEN_FILE to that path.
#   4. scripts/deploy_hf_space.py reads the file, validates mode, and calls HF.
# No GitHub Secrets UI, no developer laptop, no value in git (LAW 46, R52).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-foundry-hf-token
  namespace: agent-foundry
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: human-vault
  target:
    name: agent-foundry-hf-token
    creationPolicy: Owner
  data:
    - secretKey: hf_write_token
      remoteRef:
        key: AGENT_FOUNDRY_HF_WRITE_TOKEN
