# Platform-owned secret for the agent-foundry self-hosted runner. Source of truth
# is the estate's OCI Vault, surfaced through the ClusterSecretStore `estate-vault`
# (the same path platform/commerce/data/external-secret.yaml and platform/notify/
# external-secret.yaml use). No human pastes a value into Bitwarden for this --
# operator runs bin/idp-vault-put (below) and ESO pulls the JSON into the cluster.
#
# Operator onboarding (one line, one secret, two keys):
#
#     echo "HF_TOKEN=hf_xxxxxxxxxxxxxxxxxxxxxxxxx"      >> ~/.estate/.env
#     echo "RUNNER_PAT=ghp_xxxxxxxxxxxxxxxxxxxxxxxxxx"  >> ~/.estate/.env
#     bin/idp-vault-put agent_foundry_runner \\
#         hf_write_token=HF_TOKEN github_pat=RUNNER_PAT
#
# The CLI is merge-safe (R52): a re-run with one new key does not reset the other.
# Rotate by re-running with --merge after putting the new value in the env file.
#
# Kyverno refuses `env.valueFrom.secretKeyRef` on pods that mount this Secret, so
# the runner deployment projects it as a FILE (mode 0400), never as an env value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-foundry-runner
  namespace: agent-foundry
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: estate-vault
  target:
    name: agent-foundry-runner
    creationPolicy: Owner
  data:
    - secretKey: hf_write_token
      remoteRef:
        key: agent_foundry_runner
        property: hf_write_token
    - secretKey: github_pat
      remoteRef:
        key: agent_foundry_runner
        property: github_pat
