# GitHub PAT for self-hosted runner registration. Scope: `repo` (the agent-foundry
# repo only, least-privilege). Rotate every 90 days; the operator drops the new
# value in Bitwarden under the same name and ESO resyncs within 1m. ARC migration
# (one ephemeral registration token per pod, GitHub App-backed) is the next-step
# uplift noted in README.md; not blocking this milestone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-foundry-runner-pat
  namespace: agent-foundry
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: human-vault
  target:
    name: agent-foundry-runner-pat
    creationPolicy: Owner
  data:
    - secretKey: github_pat
      remoteRef:
        key: AGENT_FOUNDRY_RUNNER_PAT
