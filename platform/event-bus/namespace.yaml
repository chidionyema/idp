# The estate's internal event bus (founder 2026-08-29: "The Primitive fires a generic
# cloud-agnostic event onto an internal bus"). One namespace, restricted profile, no
# edge-attach label: nothing on this bus is reachable from the internet, by construction.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux (idp#648): a namespace dropped from git stays, with
    # everything in it, and the next reconcile reads as a portability break.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: event-bus
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
