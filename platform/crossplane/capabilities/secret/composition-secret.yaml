# provider-adapter: oci
# The one place "secret.estate.io" becomes "vault.oci.upbound.io" (xrd-secret.yaml's header).
# ${ESTATE_OCI_COMPARTMENT_OCID}, ${ESTATE_OCI_VAULT_OCID}, ${ESTATE_OCI_VAULT_KEY_OCID} are
# substituted by Flux postBuild from the estate-config ConfigMap (clusters/oke/platform.yaml,
# crossplane-secret-capability row) -- same mechanism composition-bucket.yaml already uses.
# enableAutoGeneration is the load-bearing field: OCI Vault mints the value server-side, so no
# plaintext secret ever transits this Composition, an agent's intent, or Terraform state -- the
# gap the OpenTofu random_password + oci_vault_secret path (bin/intent-compile compile_secret(),
# the "oci" branch) still has, because a random_password resource's value lives in Terraform
# state whether or not a human ever sees it. Vault/Key are not owned here: they are the one
# vault OpenTofu already created (platform/oci/vault.tf, oci_kms_vault.estate / oci_kms_key.estate)
# -- this capability only ever emits Secrets against it, the same "reuse what OpenTofu already
# provisioned" pattern the bucket Composition uses for the compartment.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xvaultsecrets.secret.estate.io
spec:
  compositeTypeRef:
    apiVersion: secret.estate.io/v1alpha1
    kind: XVaultSecret
  resources:
    - name: secret
      base:
        apiVersion: vault.oci.upbound.io/v1alpha1
        kind: Secret
        spec:
          forProvider:
            compartmentId: "${ESTATE_OCI_COMPARTMENT_OCID}"
            vaultId: "${ESTATE_OCI_VAULT_OCID}"
            keyId: "${ESTATE_OCI_VAULT_KEY_OCID}"
            enableAutoGeneration: true
            freeformTags:
              managed-by: crossplane
          providerConfigRef:
            name: default
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.secretName
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: metadata.annotations[crossplane.io/external-name]
        - type: FromCompositeFieldPath
          fromFieldPath: spec.purpose
          toFieldPath: spec.forProvider.description
        - type: FromCompositeFieldPath
          fromFieldPath: spec.rotation_days
          toFieldPath: spec.forProvider.freeformTags.rotation_days
          transforms:
            - type: convert
              convert: { toType: string }
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.id
          toFieldPath: status.secretOcid
