# ADR 0026 step 4 (2026-09-15): the second capability, same zero-Claim pattern as step 3's
# storage XRD -- provider-agnostic, same non-provider fields as schema/intent/secret.schema.json
# (name, purpose, rotation_days). One field narrower than the intent: a Claim here is one named
# vault entry, not the intent's whole `keys` array, because vault.oci.upbound.io's Secret
# resource (composition-secret.yaml) holds one secretContent per resource -- bin/intent-compile's
# compile_secret_crossplane() emits one Claim per key for the same reason the Terraform branch
# emits one oci_vault_secret per key. No field here can ever hold a provider name, a vault OCID
# or a secret value on purpose: LAW 21 (no secret in git), and unlike the Terraform branch, no
# value ever needs to -- see composition-secret.yaml's enableAutoGeneration.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xvaultsecrets.secret.estate.io
spec:
  group: secret.estate.io
  names:
    kind: XVaultSecret
    plural: xvaultsecrets
  claimNames:
    kind: VaultSecret
    plural: vaultsecrets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{1,60}$"
                purpose:
                  type: string
                  minLength: 10
                  maxLength: 300
                rotation_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 90
              required: [name, purpose]
            status:
              type: object
              properties:
                secretOcid:
                  type: string
