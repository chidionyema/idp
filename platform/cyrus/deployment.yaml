# Cyrus agent orchestration deployment (crew#834).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyrus
  namespace: cyrus
  labels:
    app.kubernetes.io/name: cyrus
    app.kubernetes.io/part-of: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cyrus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyrus
        app.kubernetes.io/part-of: idp
    spec:
      serviceAccountName: cyrus
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cyrus
          image: ghcr.io/chidionyema/cyrus
          env:
            # Cyrus resolves its state directory from HOME. The container runs as uid 10001,
            # which has no passwd entry, so node resolved HOME to "/" and the first thing
            # cyrus does on boot -- ensureRequiredDirectories() -- tried to mkdir /.cyrus/repos
            # on a read-only root and exited:
            #   [ERROR] [CLI] Failed to create directory /.cyrus/repos: ENOENT
            # A writable volume for this was already mounted; nothing pointed HOME at it.
            # It is /var/lib/cyrus and not a path under the users' home tree because the
            # hardcode gate refuses any /home/<name>/ literal (LAW 46) and is right to: a
            # per-user home path in a manifest is the exact shape that broke 17 scripts.
            - name: HOME
              value: /var/lib/cyrus
            # GitHub token from ExternalSecret
            - name: GH_TOKEN_FILE
              value: /secrets/github/token
            # Claude runs on the Max subscription through `claude -p`. The estate holds no
            # Anthropic API key, so none is set here and none is pulled from the vault.
            - name: LINEAR_WEBHOOK_SECRET_FILE
              value: /secrets/webhook/linear-webhook-secret
            - name: LINEAR_API_TOKEN_FILE
              value: /secrets/webhook/linear-api-token
            - name: GITHUB_WEBHOOK_SECRET_FILE
              value: /secrets/webhook/github-webhook-secret
            # CYRUS_CONFIG_PATH was set here and is read by nothing: `cyrus` resolves its
            # config from --cyrus-home, which defaults to ~/.cyrus (dist/src/app.js), and the
            # ConfigMap was mounted at /config where nothing looked for it. The pod started,
            # logged "Edge worker started successfully", and then said "No repositories
            # configured" with three repositories sitting in the ConfigMap. The mount below
            # puts config.json where cyrus actually reads it.
            - name: CYRUS_SERVER_PORT
              value: "3456"
            # The two writable volumes this pod already carries, named explicitly rather than
            # left to default under ~/.cyrus on an emptyDir.
            - name: CYRUS_REPOS_DIR
              value: /repo
            - name: CYRUS_WORKTREES_DIR
              value: /worktrees
            # The public URL Linear and GitHub deliver to. The zone is substituted by Flux from
            # estate-config; a literal hostname here would be a hardcoded machine name (LAW 46).
            - name: CYRUS_BASE_URL
              value: "https://cyrus.${ESTATE_ZONE}"
          volumeMounts:
            # subPath, so the rest of ~/.cyrus stays on the writable home volume: cyrus
            # creates repos, worktrees and mcp-configs beside this file at startup.
            - name: config
              mountPath: /var/lib/cyrus/.cyrus/config.json
              subPath: config.json
              readOnly: true
            - name: github-secret
              mountPath: /secrets/github
              readOnly: true
            - name: webhook-secret
              mountPath: /secrets/webhook
              readOnly: true
            - name: worktrees
              mountPath: /worktrees
            - name: repos
              mountPath: /repo
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /var/lib/cyrus
            - name: npm-cache
              mountPath: /.npm
          # /status, not /health: cyrus serves no /health. EdgeWorker registers GET /status
          # and GET /version and the shared server registers the webhook and OAuth routes;
          # nothing answers /health, so both probes were 404 from the first second.
          livenessProbe:
            httpGet: { path: /status, port: 3456 }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /status, port: 3456 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # 1 core, not 2. The namespace quota is limits.cpu: 4 (namespace.yaml), so a
            # 2-core limit let exactly two pods exist and a rolling update -- which needs the
            # old pod plus one surge pod, and a third the moment either is slow to go -- was
            # refused by the quota rather than by anything wrong with the image. Measured
            # 2026-09-05: `limits.cpu: 4/4` with two pods, both ContainerCreating, one from
            # each of two ReplicaSets, and no third pod admissible. Cyrus is a webhook agent;
            # it has never needed two cores.
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: cyrus-config
        - name: github-secret
          secret:
            secretName: cyrus-github
        - name: webhook-secret
          secret:
            secretName: cyrus-webhook
        - name: worktrees
          emptyDir: {}
        - name: repos
          emptyDir: {}
        # The root filesystem is read-only, so the three paths git, npm and the engine CLIs
        # write to are explicit volumes rather than a writable image.
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cyrus
  namespace: cyrus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cyrus
  namespace: cyrus
rules:
  # Read-only: can list pods to check status, but nothing else
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cyrus
  namespace: cyrus
subjects:
  - kind: ServiceAccount
    name: cyrus
    namespace: cyrus
roleRef:
  kind: Role
  name: cyrus
  apiGroup: rbac.authorization.k8s.io
