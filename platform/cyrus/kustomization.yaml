# Cyrus agent orchestration (crew#834). The runtime that proves every engine works
# and publishes metrics to the central collector.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cyrus
resources:
  - namespace.yaml
  - pull-secret.yaml
  - external-secret.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# The tag is moved by Flux image automation (platform/image-automation/cyrus.yaml), the same way
# hermes-agent, backstage and sovereign-worker move. It is pinned here rather than in
# deployment.yaml so the marker sits on one line the automation owns.
images:
  - name: ghcr.io/chidionyema/cyrus
    newTag: main-5202-2ce8a626804a6e7a754226994118b939f48b9a2b # {"$imagepolicy": "flux-system:cyrus:tag"}
