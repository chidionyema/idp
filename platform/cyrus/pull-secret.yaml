# ghcr-pull for this namespace, mirrored from backstage/ghcr-pull through the ClusterSecretStore
# ghcr-pull (platform/image-automation/pull-secret.yaml), the same way
# platform/infra-crew/pull-secret.yaml does it. The first version of this file carried a
# base64 dockerconfigjson literal, which gitleaks refused and which no manifest may hold.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: cyrus
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: ghcr-pull }
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: ghcr-pull, property: .dockerconfigjson }
