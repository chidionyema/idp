# Cyrus configuration (crew#834). Mounted as a ConfigMap, watched by Cyrus.
# Engines: claude, codex, cursor, gemini, opencode. Claude on Max subscription;
# OpenCode points at the estate router.
# Transports: GitHub and Linear together (crew#834 CP3). Cyrus ships both, an issue can arrive
# from either board, and neither is removed -- a capability the component already supports is
# offered as a set of roads, not narrowed to one.
# serverHost is 0.0.0.0 because kubelet probes the pod IP, not loopback. cyrus-edge-worker
# defaults it to "localhost" (EdgeWorker.js: `config.serverHost || "localhost"`), so without it
# both probes were refused and the pod restarted every 30 seconds while its own log said
# "Edge worker started successfully". R20 fences a host's listeners, not a pod's: this container
# sits behind the namespace default-deny NetworkPolicy and is reachable only through the gateway.
# The agent holds no cluster verbs: it opens a pull request and Flux reconciles it. kubectl and
# flux were in the first version of this file and are gone, because the estate is strictly GitOps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cyrus-config
  namespace: cyrus
data:
  config.json: |
    {
      "promptDefaults": {
        "debugger": { "allowedTools": "readOnly" },
        "builder": { "allowedTools": "safe" }
      },
      "repositories": [
        {
          "id": "idp",
          "name": "idp",
          "repositoryPath": "/repo/idp",
          "baseBranch": "main",
          "githubUrl": "https://github.com/chidionyema/idp",
          "workspaceBaseDir": "/worktrees",
          "isActive": true,
          "allowedTools": [
            "Read", "Edit", "Write", "Glob", "Grep",
            "Bash(git:*)", "Bash(gh:*)", "Bash(pytest:*)", "Bash(ruff:*)",
            "Task", "TaskCreate", "TaskUpdate", "TaskList"
          ],
          "routingLabels": ["claude", "codex", "cursor", "gemini", "opencode"],
          "labelPrompts": {
            "claude": {
              "labels": ["claude"],
              "engine": "claude"
            },
            "codex": {
              "labels": ["codex"],
              "engine": "codex"
            },
            "cursor": {
              "labels": ["cursor"],
              "engine": "cursor"
            },
            "gemini": {
              "labels": ["gemini"],
              "engine": "gemini"
            },
            "opencode": {
              "labels": ["opencode"],
              "engine": "opencode",
              "env": {
                "OPENAI_API_KEY": "os.environ/OPENAI_API_KEY"
              }
            }
          }
        },
        {
          "id": "crew",
          "name": "crew",
          "repositoryPath": "/repo/crew",
          "baseBranch": "main",
          "githubUrl": "https://github.com/chidionyema/crew",
          "workspaceBaseDir": "/worktrees",
          "isActive": true,
          "allowedTools": [
            "Read", "Edit", "Write", "Glob", "Grep",
            "Bash(git:*)", "Bash(gh:*)", "Bash(pytest:*)",
            "Task", "TaskCreate", "TaskUpdate", "TaskList"
          ],
          "routingLabels": ["claude", "codex", "cursor", "gemini", "opencode"]
        },
        {
          "id": "hermes-v2",
          "name": "hermes-v2",
          "repositoryPath": "/repo/hermes-v2",
          "baseBranch": "main",
          "githubUrl": "https://github.com/chidionyema/hermes-v2",
          "workspaceBaseDir": "/worktrees",
          "isActive": true,
          "allowedTools": [
            "Read", "Edit", "Write", "Glob", "Grep",
            "Bash(git:*)", "Bash(gh:*)", "Bash(go:*)",
            "Task", "TaskCreate", "TaskUpdate", "TaskList"
          ],
          "routingLabels": ["claude", "codex", "cursor", "gemini", "opencode"]
        }
      ],
      "serverHost": "0.0.0.0",
      "serverPort": 3456,
      "transports": {
        "github": {
          "enabled": true,
          "webhookSecretFile": "/secrets/webhook/github-webhook-secret"
        },
        "linear": {
          "enabled": true,
          "webhookSecretFile": "/secrets/webhook/linear-webhook-secret",
          "apiTokenFile": "/secrets/webhook/linear-api-token"
        }
      },
      "sandbox": {
        "enabled": false
      },
      "maxTurns": 50,
      "maxSessionTurns": 100
    }
