# Cyrus agent orchestration (crew#834): namespace with full fence per crew#191.
# Every namespace needs: default-deny NetworkPolicy both ways, ResourceQuota,
# LimitRange, and DNS exception.
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: cyrus
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cyrus
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: cyrus
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: cyrus
spec:
  limits:
    - type: Container
      default: {cpu: 1000m, memory: 2Gi}
      defaultRequest: {cpu: 100m, memory: 256Mi}
      max: {cpu: "4", memory: 8Gi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: cyrus
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "10"
