# crew#516 CP5, founder's locked spec (crew#66 5451926212, Phase 1): "the Kubernetes cluster pulls
# its authentication dynamically via an ExternalSecret manifest mapping directly to your secure
# secret store". Vault entry `tailscale-operator` is written by bin/idp-bootstrap-tailscale
# (root-trust ruling crew#66 5453747447, docs/policy/root-trust.md): Tailscale has no API that
# creates an OAuth client (the `oauth_keys` scope is GET/DELETE only, docs/reference/trust-credentials
# 2026-08-28), so the bootstrapper drives the Trust credentials console itself in the estate's
# browser profile, the founder's only act is an SSO sign-in, the client is verified by a token
# exchange and written with bin/idp-vault-put in-process. The SEED_TAILSCALE_* repository-secret
# path (vault-seed.yml) is retired: a person pasting a value is the MISS the ruling refuses.
#
# Target Secret name `operator-oauth`, keys `client_id`/`client_secret`, is the exact fallback the
# tailscale-operator Helm chart itself documents when its `oauth` values block is left unset
# (chart values.yaml, verified live `helm show values tailscale-operator --version 1.102.3`,
# 2026-08-28: "If unset a Secret named operator-oauth must be precreated") — operator.yaml leaves
# that block unset on purpose, so this is the Secret the chart reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-secret
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: operator-oauth, creationPolicy: Owner }
  data:
    - secretKey: client_id
      remoteRef: { key: tailscale-operator, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: tailscale-operator, property: client_secret }
