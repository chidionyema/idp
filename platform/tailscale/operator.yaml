# crew#516 CP5, founder's locked spec (crew#66 5451926212, Phase 1): "Flux automatically deploys
# the official Tailscale Operator, passing the injected client credentials straight into the chart
# values without human exposure." Chart and values verified live against the current chart
# (`helm show values tailscale-operator --version 1.102.3`, 2026-08-28): the chart's own `oauth`
# block has no *FromSecret field (that shape was proposed in tailscale/tailscale#16776 and never
# shipped) -- the documented, shipping mechanism is simpler: leave `oauth` unset in the
# HelmRelease's values and pre-create a Secret literally named `operator-oauth` with keys
# `client_id`/`client_secret` ("If unset a Secret named operator-oauth must be precreated",
# chart values.yaml). external-secret.yaml owns exactly that Secret. The operator never sees a
# static credential in git or in a workflow log.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 24h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  # Bounded remediation, and the last failure is remediated too, so a wedged release is not left
  # Failed for a person to untangle: helm-controller spends its retries once and then waits forever
  # for a spec change (tailscale-operator sat Failed blocking guacamole, idp#1027).
  # NOT `strategy: uninstall`, which idp#1027 set here and this row takes back out. Founder,
  # 2026-08-30 (~/.claude/docs/founder/2026-08-30T2332Z-yes-and-the-pattern-is-sound-but-two
  # -c08d08d9.md): uninstalling a wedged release turns a degraded service into a deleted one --
  # the PVCs, PDBs and Secrets the release made go with it -- and it erases the state that says
  # which invariant was violated, which is the state an incident is converted into a control from.
  # The default strategy is rollback: the previous revision is restored and the failed one is
  # readable. Repaving stays a hand after capture: `bin/idp-oke-break-glass helm-retry`.
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3, remediateLastFailure: true }
  # docs/policy/every-interface-is-a-door.md: the chart's Services name their door.
  postRenderers:
    - kustomize:
        patches:
          - target: { kind: Service }
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-screen
          - target: { kind: HTTPRoute }
            patch: |
              apiVersion: v1
              kind: HTTPRoute
              metadata:
                name: every-interface-is-a-door
                labels:
                  backstage.io/kubernetes-id: founder-screen
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.102.3
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    # The proxy image carries the same short name (`tailscale/tailscale`) from the same chart
    # values file, so it is unresolvable on these nodes for the same reason; the operator only
    # pulls it when it makes a proxy, which is why the operator's own image failed first. The tag
    # answers 200 on Docker Hub (measured 2026-08-30) and the hermes-agent sidecar already runs
    # this exact image from a fully-qualified reference.
    proxyConfig:
      image:
        repository: docker.io/tailscale/tailscale
    # No `oauth:` block here on purpose (see the header comment): the chart falls back to reading
    # the pre-created `operator-oauth` Secret (external-secret.yaml) when this is left unset.
    apiServerProxyConfig:
      # This estate's kube-apiserver access is not routed through Tailscale (bin/idp-oke-rebuild,
      # bin/idp-oke-break-glass are the existing paths); the operator is deployed for its ACL/policy
      # management and to authenticate the hermes-agent sidecar's tag:k8s identity, nothing more.
      mode: "false"
    # The chart ships no default securityContext/resources (verified: templates/deployment.yaml
    # only emits them `{{- with .Values.operatorConfig.* }}`, i.e. never, when unset) -- every
    # ClusterPolicy that reads them refuses the operator Pod otherwise (bin/idp-kyverno-render
    # platform/tailscale, run 2026-08-28). The chart exposes exactly these three fields; this is
    # the estate's own restricted posture applied through them, not a departure from it.
    operatorConfig:
      # Run 33341390235, 2026-08-30: the chart's default is the bare `tailscale/k8s-operator`
      # (tailscale/tailscale cmd/k8s-operator/deploy/chart/values.yaml at v1.102.3, read
      # 2026-08-30), the OKE nodes run cri-o with short-name mode enforcing, and the kubelet
      # answered "short name mode is enforcing, but image name tailscale/k8s-operator:v1.102.3
      # returns ambiguous list". The Deployment stalled, the HelmRelease sat Failed, and
      # Kustomization/guacamole waited behind it. Same class as the seaweedfs image in
      # platform/observability/langfuse-values.yaml (crew#325), and the same fix: name the
      # registry. docker.io is where the chart means to point -- the tag answers 200 there
      # (registry-1.docker.io/v2/tailscale/k8s-operator/manifests/v1.102.3, measured 2026-08-30).
      # platform/edge/require-registry-host.yaml is the guard that stops the class returning.
      image:
        repository: docker.io/tailscale/k8s-operator
      # 2026-08-31 (crew#661 CP1, diagnose run 33354635731): runAsNonRoot on this image is a pod
      # that never starts. The image's own config declares no USER (registry config blob for
      # docker.io/tailscale/k8s-operator:v1.102.3, read 2026-08-31), so the kubelet refused the
      # container 86 times in 28 minutes with "container has runAsNonRoot and image will run as
      # root", and the 102 re-pulls of a container that never ran then burned Docker Hub's
      # unauthenticated pull rate limit as a side effect. Forcing runAsUser instead is disproven
      # upstream: the operator writes $HOME/.config at start and dies "permission denied" as any
      # non-root uid (tailscale/tailscale#10638) -- which also rules out readOnlyRootFilesystem,
      # the same write refused one step later. Same class and same answer as the Lago images
      # (platform/edge/commerce-exception.yaml): upstream's shipped posture, with the admission
      # excuse scoped to this one pod in platform/edge/tailscale-operator-exception.yaml.
      # Everything the image CAN satisfy stays below.
      podSecurityContext:
        seccompProfile: { type: RuntimeDefault }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
        seccompProfile: { type: RuntimeDefault }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 128Mi }
