# crew#516 CP5, founder's locked spec (crew#66 5451926212, Phase 1): the Tailscale Kubernetes
# operator, deployed by Flux like every other chart in this estate (platform/edge/traefik.yaml is
# the shape this row copies).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (catalogue 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: tailscale
  labels:
    app.kubernetes.io/part-of: idp
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
