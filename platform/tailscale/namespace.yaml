# crew#516 CP5, founder's locked spec (crew#66 5451926212, Phase 1): the Tailscale Kubernetes
# operator, deployed by Flux like every other chart in this estate (platform/edge/traefik.yaml is
# the shape this row copies).
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: tailscale
  labels:
    app.kubernetes.io/part-of: idp
    # The proxies the operator creates run a privileged `sysctler` init container and a
    # privileged `tailscale` container (vendor images, 2026-09-02 FailedCreate events). Pod
    # Security Admission is enforced by the API server per namespace and no Kyverno exception
    # can waive it (same reasoning as platform/edge/k8s-infra-namespace.yaml). Only the
    # operator and its proxies live here; warn and audit stay restricted so anything else
    # that lands in this namespace is reported. Record:
    # docs/reference/policy/tailscale-pod-security.md
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
