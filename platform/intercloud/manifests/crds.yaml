apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: lanes.intercloud.estate.internal}
spec:
  group: intercloud.estate.internal
  versions: [{name: v1, served: true, storage: true, schema: {openAPIV3Schema: {type: object, properties: {
    spec: {type: object, properties: {
      class: {type: string, enum: [free, paid, forbidden]},
      provider: {type: string}, cores: {type: number}, memGb: {type: number},
      costMo: {type: number}, recoveryHome: {type: string}}, required: [class, provider, cores, memGb]},
    status: {type: object, properties: {health: {type: string}, verdict: {type: string}}}}}}}]
  scope: Cluster
  names: {kind: Lane, plural: lanes}
---
