apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: estate-platform, namespace: flux-system}
spec:
  interval: 1m
  url: https://github.com/chidionyema/estate-platform
  ref: {branch: main}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: estate-platform, namespace: flux-system}
spec:
  interval: 5m
  path: ./
  prune: true
  sourceRef: {kind: GitRepository, name: estate-platform}
