# crew#267: the catalogue rolls on every main build with no hand on the cluster.
#
# build-multiarch pushes ghcr.io/chidionyema/backstage:main-<run>-<sha>. image-reflector-controller
# lists the tags, the policy picks the highest run number, and image-automation-controller writes
# that tag into platform/backstage/overlays/oke/kustomization.yaml on branch flux/image-updates.
# .github/workflows/image-update-pr.yml turns that push into a pull request with auto-merge; main's
# rulesets have no bypass actors, so nothing writes to main directly. Flux then reconciles main
# and the Deployment's image changes, which is what a mutable tag with IfNotPresent never did.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: backstage
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/backstage
  interval: 1m
  # ghcr packages under this account are private; bin/idp-flux-bootstrap writes ghcr-pull here.
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: backstage
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: backstage
  filterTags:
    # Only the orderable tag. The bare `:<sha>` provenance tag has no order and is ignored.
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
---
# A second GitRepository for the same repo because the bootstrap one (flux-system) holds a
# read-only deploy key (bin/idp-flux-bootstrap: --read-write-key=false). This one authenticates
# as the estate-agents GitHub App (`provider: github`; platform/image-automation/flux-writer.yaml
# renders the App's id, installation id and key from vault entry github-app; crew#66 root trust).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: idp-writer
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/chidionyema/idp
  provider: github   # the estate-agents App (flux-writer.yaml renders githubApp* from vault entry github-app)
  ref:
    branch: main
  secretRef:
    name: flux-writer
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: backstage
  namespace: flux-system
spec:
  # 15m, not 1m. At one minute this automation opened a commit on main for every new image
  # tag CI published: 183 of the 285 commits on main in the 24 hours to 2026-09-05T03:20Z,
  # about one every five minutes. Flux's dependsOn requires each dependency to be applied at
  # the source's *current* revision, so a commit every five minutes means a row five deep in
  # the graph -- otto-gateway is one -- only reconciles when it wins a race against the bot.
  # Fifteen minutes batches the tags into one commit and leaves a quiet window longer than
  # the 10m reconcile interval every row in the chain uses.
  interval: 15m
  sourceRef:
    kind: GitRepository
    name: idp-writer
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: estate-agents
        email: estate-agents[bot]@users.noreply.github.com
      messageTemplate: |
        platform: image update {{ range $resource, $changes := .Changed.Objects }}{{ range $_, $change := $changes }}{{ $resource.Name }} -> {{ $change.NewValue }} {{ end }}{{ end }}(crew#267)

        Written by image-automation-controller. One automation walks the whole repository for
        every ImagePolicy marker; two automations on one push branch collide (crew#406).
    push:
      branch: flux/image-updates
  update:
    # The whole checkout, not ./platform: the prospector images: override lives on its Flux
    # Kustomization in clusters/oke/edge.yaml (crew#693). Only lines carrying a $imagepolicy
    # marker are ever rewritten.
    path: ./
    strategy: Setters
