# The EFDA image rolls on every main build, the same mechanism as every other
# estate image: image-reflector lists the tags, the policy picks the highest
# run number, and the one ImageUpdateAutomation named "backstage" (path: ./,
# whole checkout) rewrites any $imagepolicy marker it finds -- so this file
# adds an ImageRepository and an ImagePolicy and no new automation object.
#
# build-multiarch.yml pushes ghcr.io/chidionyema/efda:main-<run>-<sha> for
# both linux/amd64 and linux/arm64 (R24), so the tag this policy selects is
# the signed manifest list and not one arch.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: efda
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/efda
  interval: 1m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: efda
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: efda
  filterTags:
    # Only the orderable tag. The bare :<sha> provenance tag has no order and
    # is ignored.
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
