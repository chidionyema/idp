# crew#396 step 2: ghcr packages under this account are private, and bin/idp-flux-bootstrap writes
# the pull secret into a fixed list of namespaces from a laptop (backstage, prospector, edge,
# flux-system). A new namespace that pulls from ghcr must not need a laptop. External Secrets'
# kubernetes provider reads backstage/ghcr-pull through a ServiceAccount that may read that one
# Secret, and any namespace mirrors it with an ExternalSecret against this ClusterSecretStore
# (platform/temporal/pull-secret.yaml is the first). Rejected: enabling Kyverno's background
# controller for a generate/clone policy, a second controller for one secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-pull-reader
  namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-pull-reader
  namespace: backstage
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ghcr-pull]
    verbs: [get, list, watch]
  # The provider validates the store by asking the API what this account may do.
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-pull-reader
  namespace: backstage
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ghcr-pull-reader }
subjects:
  - { kind: ServiceAccount, name: ghcr-pull-reader, namespace: backstage }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ghcr-pull
spec:
  provider:
    kubernetes:
      remoteNamespace: backstage
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: backstage }
      auth:
        serviceAccount: { name: ghcr-pull-reader, namespace: backstage }
