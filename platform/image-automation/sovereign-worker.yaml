# crew#396 step 2: the sovereign worker rolls on every main build, the same way the catalogue
# does (backstage.yaml, crew#267). build-multiarch pushes
# ghcr.io/chidionyema/sovereign-worker:main-<run>-<sha>; the policy picks the highest run and
# the automation writes it into platform/temporal/kustomization.yaml on flux/image-updates.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sovereign-worker
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/sovereign-worker
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sovereign-worker
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sovereign-worker
  filterTags:
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: sovereign-worker
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: idp-writer
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: estate-agents
        email: estate-agents[bot]@users.noreply.github.com
      messageTemplate: |
        platform/temporal: sovereign-worker image {{ range .Changed.Objects }}{{ range .Changes }}{{ .NewValue }}{{ end }}{{ end }} (crew#396)

        Written by image-automation-controller from ImagePolicy flux-system/sovereign-worker.
    push:
      branch: flux/image-updates
  update:
    path: ./platform/temporal
    strategy: Setters
