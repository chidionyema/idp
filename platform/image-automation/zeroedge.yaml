# The ZeroEdge gateway's image. Unlike every other row here the Dockerfile is not in this
# repository -- `chidionyema/zeroedge` builds and signs its own (deploy/gateway/Dockerfile,
# .github/workflows/build-image.yml) and writes the same two tags idp's build-multiarch.yml
# writes: `:<sha>` for provenance and `:main-<run>-<sha>` for automation. That workflow's own
# header names this file's pattern as the contract it writes to, so the two sides agree in
# writing and not by luck.
#
# Without this row the tag in platform/llm/kustomization.yaml would be a hand-typed tag, and a
# hand-typed tag rots: cyrus sat in ImagePullBackOff from the day it was applied because its
# deployment asked for a `:main` tag nobody ever pushed.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: zeroedge
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/zeroedge
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: zeroedge
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: zeroedge
  filterTags:
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
