# The voice-router-director sidecar rolls on every main build that touches it, same mechanism as
# backstage.yaml in this directory: image-reflector lists tags, the policy picks the highest run
# number, and the one ImageUpdateAutomation named "backstage" (path: ./, whole checkout) rewrites
# any $imagepolicy marker it finds -- this needs no second automation, only a second
# ImageRepository/ImagePolicy pair for the new image name.
#
# platform/image-automation itself has no Flux row under clusters/oke on origin/main (checked
# 2026-09-27; lost in c96359f4), so this pair applies only once that row returns. Until then the
# placeholder tag above cannot pull.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: voice-router
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/voice-router
  interval: 1m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: voice-router
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: voice-router
  filterTags:
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
