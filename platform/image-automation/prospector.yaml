# The storefront and its API (crew#693): prospector's container-images workflow pushes
# ghcr.io/chidionyema/prospector-store-web and -store-api as main-<run>-<sha> on every merge to
# main; the newest run wins and the one automation (backstage.yaml) writes it into the images:
# override of the prospector Kustomization in clusters/oke/edge.yaml. The prospector repository
# holds no write credential and no automation of its own: promotion is a commit here.
# Receipt: prod ran f398a66 (26 Aug) while prospector main was a6223ef (crew#693).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: prospector-store-web
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/prospector-store-web
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prospector-store-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: prospector-store-web
  filterTags:
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: prospector-store-api
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/prospector-store-api
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prospector-store-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: prospector-store-api
  filterTags:
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
