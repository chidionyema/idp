# The PennyD router's image (platform/llm/pennyd/deploy). build-multiarch.yml already discovers
# platform/llm/pennyd/Dockerfile through bin/dockerfiles and pushes `main-<run>-<sha>` on a
# multiarch manifest list; this row is what moves the deployment onto each new one.
#
# MEASURED 2026-11-19: the deployment asked for `ghcr.io/chidionyema/pennyd:v0.2.0` and that tag
# answers 404 in the registry -- a version string this estate does not produce. The public router
# therefore had no pennyd image to run, which is the mechanical reason the ingress still served
# LiteLLM. The tag a build writes and the tag a policy selects are one agreement (the identical
# lesson recorded in platform/image-automation/zeroedge.yaml and aevum.yaml).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pennyd
  namespace: flux-system
spec:
  image: ghcr.io/chidionyema/pennyd
  interval: 5m
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pennyd
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pennyd
  filterTags:
    pattern: '^main-(?P<run>[0-9]+)-[0-9a-f]{40}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
