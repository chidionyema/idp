# NodeSoftwareOperator Deployment -- the controller pod, run as the SA above.
# Two replicas (leader election): HA without paying for five. Resources sized
# for the controller (the workload is bookkeeping, not data plane), not for the
# runtime handler pods it schedules (those have their own requests below).
#
# NOT APPLIED YET. This file is out of kustomization.yaml's resource list until the controller
# image exists; see that file's header for the three things that must become true first.
#
# The `IMAGE_TAG` below is a placeholder and nothing substitutes it. The header used to say it
# was "substituted at Flux postBuild from the IMAGE_TAG field on Secret ghcr-pull ... same
# mechanism as every other in-repo image reference (cyrus, hermes-agent)". None of that held:
# ghcr-pull is a kubernetes.io/dockerconfigjson Secret whose one key is `.dockerconfigjson`,
# which is not a legal envsubst variable name and aborted the whole row's post-build; cyrus and
# hermes-agent pin their images the estate's actual way, a `newTag:` in kustomization.yaml
# carrying a `# {"$imagepolicy": ...}` marker that Flux image automation rewrites in git; and
# envsubst substitutes `${IMAGE_TAG}`, never the bare word IMAGE_TAG, so even a correct source
# would have left this string in the pod spec for the kubelet to fail to pull.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodesoftware-operator
  namespace: nodesoftware-operator
  labels:
    app.kubernetes.io/name: nodesoftware-operator
    app.kubernetes.io/part-of: idp
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: IMAGE_TAG
spec:
  replicas: 2                              # HA without paying for five
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0                    # never two-down; reconcile is rare
  selector:
    matchLabels:
      app.kubernetes.io/name: nodesoftware-operator
      app.kubernetes.io/part-of: idp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nodesoftware-operator
        app.kubernetes.io/part-of: idp
        app.kubernetes.io/component: controller
        app.kubernetes.io/version: IMAGE_TAG
    spec:
      serviceAccountName: nodesoftware-operator
      automountServiceAccountToken: true    # controller-runtime needs the token
      imagePullSecrets:
        - name: ghcr-pull
      priorityClassName: idp-infrastructure # scheduling/priority-classes (R76)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault             # PSS restricted (edge/policies)
      containers:
        - name: controller
          image: ghcr.io/chidionyema/nodesoftware-operator:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --leader-election-namespace=nodesoftware-operator
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --reconcile-period=15s         # see CRD-SPEC.md "pauseDuration"
            # The runsc handler image ships the install/uninstall/probe scripts
            # the controller invokes on each target node (per C4: PR #2396).
            # The controller's hardcoded default is
            # "ghcr.io/chidionyema/nodesoftware-runsc-handler:IMAGE_TAG", which
            # the kubelet cannot pull. This override does not fix that today: it
            # carries the same placeholder, and nothing substitutes it (see the
            # file header). Both become real tags when the handler image is built
            # and given an ImagePolicy, not before.
            - --handler-image=ghcr.io/chidionyema/nodesoftware-runsc-handler:IMAGE_TAG
            - --handler-namespace=nodesoftware-operator
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# The Service that fronts the metrics + health probes (used by Prometheus and
# by the flux row's healthChecks below). ClusterIP only.
apiVersion: v1
kind: Service
metadata:
  name: nodesoftware-operator
  namespace: nodesoftware-operator
  labels:
    app.kubernetes.io/name: nodesoftware-operator
    app.kubernetes.io/part-of: idp
    # crew#307: a port that serves names the catalogue entity it belongs to, or
    # platform/edge/require-catalogue-entity.yaml refuses the object at admission.
    # layer-nodesoftware-operator is generated into backstage/platform/catalog-info.yaml
    # from this Kustomization's row by bin/catalog-platform.
    backstage.io/kubernetes-id: layer-nodesoftware-operator
spec:
  clusterIP: None                         # headless; replica-per-pod DNS
  selector:
    app.kubernetes.io/name: nodesoftware-operator
    app.kubernetes.io/part-of: idp
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: health
      port: 8081
      targetPort: health
---
# ServiceMonitor (Prometheus Operator CR) -- the controller emits its own
# metrics; the estate's single Prometheus scrapes them. Wired through the same
# mechanism as every other controller's metrics in this repo.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nodesoftware-operator
  namespace: nodesoftware-operator
  labels:
    app.kubernetes.io/name: nodesoftware-operator
    app.kubernetes.io/part-of: idp
    release: kube-prometheus-stack          # the monitoring chart's selector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nodesoftware-operator
      app.kubernetes.io/part-of: idp
  endpoints:
    - port: metrics
      interval: 30s
