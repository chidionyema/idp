# RuntimeInstall CRD -- the nodesoftware.estate.io API the NodeSoftwareOperator
# reconciles. The contract source of truth is platform/nodesoftware-operator/
# CRD-SPEC.md; this file is the installable form. A drift between the two is a
# regression: the offline gate (bin/nodesoftware-operator-gate) grades the same
# fixtures the controller's admission webhook will grade, so the CRD and the
# gate must agree.
#
# Scope: ONE CRD, RuntimeInstall, in the nodesoftware-operator namespace, named
# `runtimeinstalls.nodesoftware.estate.io`. The estate's admission webhook
# (when the controller is up) validates spec fields per CRD-SPEC.md. Until the
# controller lands, the offline gate is the only validator -- a CR committed
# here is admitted because Flux is the only writer and the gate has already
# graded it.
#
# Why a v1alpha1: the spec is still being shaped (one closed runtime set, three
# annotations, canary mandatory). v1alpha1 means we accept breakage on the
# v1beta1 cut. The PR that ships v1beta1 will be a CRD version bump + a
# conversion webhook + a fixture update, all gated by bin/idp-ci.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: runtimeinstalls.nodesoftware.estate.io
  annotations:
    # Estate convention (crew#191 / R76): every admission-relevant annotation
    # carries its meaning in the same place a reviewer looks for it.
    estate.estate.io/policy-summary: >-
      A RuntimeInstall is a request to install a closed-set runtime on selected
      nodes one canary at a time. The NodeSoftwareOperator owns the cordon /
      drain / install / verify / uncordon cycle.
spec:
  group: nodesoftware.estate.io
  scope: Namespaced
  names:
    plural: runtimeinstalls
    singular: runtimeinstall
    kind: RuntimeInstall
    shortNames: [rti]
    listKind: RuntimeInstallList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}             # controllers write status, humans do not
      additionalPrinterColumns:
        - name: Runtime
          type: string
          jsonPath: .spec.runtime
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Verified
          type: integer
          jsonPath: .status.observedNodes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [runtime, version, selector, rolloutStrategy, canaryReplicas, pauseDuration, failurePolicy, verification]
              properties:
                runtime:
                  type: string
                  enum: [runsc, kata, nvidia]   # closed set, enforced by the gate
                  description: >-
                    The runtime to install. Closed set; adding a runtime is a
                    controller code change + spec amendment + fixture update.
                version:
                  type: string
                  pattern: '^[A-Za-z0-9._+\-]{1,64}$'
                  description: >-
                    Exact version to install. The handler looks up the
                    digest-pinned image and records this string in
                    status.rolloutHistory for human audit.
                selector:
                  type: object
                  required: [nodeSelector]
                  properties:
                    nodeSelector:
                      type: object
                      additionalProperties: true
                      description: >-
                        Standard k8s nodeSelector shape (matchLabels +
                        matchExpressions). A CR with an empty selector would
                        match every node; the gate refuses that case.
                    tolerations:
                      type: array
                      items:
                        type: object
                        properties:
                          key:        {type: string}
                          operator:   {type: string, enum: [Exists, Equal]}
                          value:      {type: string}
                          effect:     {type: string, enum: [NoSchedule, PreferNoSchedule, NoExecute]}
                          tolerationSeconds: {type: integer}
                rolloutStrategy:
                  type: string
                  enum: [ProgressiveCanary, AllAtOnce, Manual]
                  default: ProgressiveCanary
                canaryReplicas:
                  type: integer
                  minimum: 1
                  description: >-
                    Number of selected nodes in the canary phase. Required when
                    rolloutStrategy != AllAtOnce.
                pauseDuration:
                  type: string
                  pattern: '^(?:([0-9]+)h)?(?:([0-9]+)m)?(?:([0-9]+)s)?$'
                  description: >-
                    Wait between canary verification and the rest, and between
                    subsequent nodes. Must be >= 30s (the Operator's reconcile
                    period is 15s).
                failurePolicy:
                  type: string
                  enum: [FailClosed, Ignore]
                  default: FailClosed
                verification:
                  type: object
                  required: [probePod, successCondition]
                  properties:
                    probePod:
                      type: object
                      additionalProperties: true
                      description: >-
                        Pod template the Operator renders with the target
                        node pinned and runtimeClassName set to spec.runtime.
                        The controller fills nodeSelector and runtimeClassName;
                        the CR does not.
                    successCondition:
                      type: string
                      description: >-
                        Shell expression the Operator evaluates against the
                        probe pod's logs. Empty = no verdict.
                    timeoutSeconds:
                      type: integer
                      minimum: 30
                      maximum: 1800
                      default: 300
                rollback:
                  type: object
                  description: >-
                    How the Operator uninstalls if verification fails. Free-form
                    commands are forbidden; the Operator ships one uninstall
                    script per runtime, named /usr/local/bin/nodesoftware-
                    <runtime>-uninstall.
                  properties:
                    commands:
                      type: array
                      items:
                        type: string
                        pattern: '^/usr/local/bin/nodesoftware-[a-z0-9]+-uninstall$'
                    timeoutSeconds:
                      type: integer
                      default: 120
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true   # controller-managed, shape owned by controller
              description: >-
                Controller-managed. The Operator writes phase, message,
                observedNodes, canaryResults, and rolloutHistory. Humans do
                not edit status (subresource gate enforces this).
