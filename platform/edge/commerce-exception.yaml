# Three rules the Lago chart's own images cannot satisfy today, scoped to the pods it renders in
# the commerce namespace, nothing wider. Lives in platform/edge, not platform/commerce/app: that
# kustomization stamps `namespace: commerce` and Kyverno honours exceptions from namespace
# kyverno only (crew#325, where the langfuse exception was rewritten to observability and a
# render this judge passed was refused at admission for 41 hours).
#
# Each one was measured, not assumed. Both images were read from the registry's own config blob
# on 2026-08-29 (getlago/api:v1.32.4 and getlago/front:v1.32.4): neither declares a USER, so both
# start as root, and the front image's entrypoint is `/bin/bash -c './.env.sh && nginx -g "daemon
# off;"'` -- a script that writes the runtime configuration file nginx then serves, into the web
# root, every time the container starts.
#
#   run-as-non-root                Patching runAsNonRoot onto an image built to start as root
#                                  produces a pod that cannot boot. The fix is upstream or a
#                                  rebuilt image, not a line in this repository.
#   validate-readOnlyRootFilesystem  The API is Rails and writes to tmp/ and log/ inside the image;
#                                  the front rewrites its own web root at start.
#   secrets-not-from-env-vars      The chart hands every credential to its pods as an env var from
#                                  a secretKeyRef (templates/*-deployment.yaml, migrate-job.yaml),
#                                  and 1.28.0 has no file-based option. Same class as the temporal
#                                  and langfuse exceptions beside this file.
#
# What is NOT excused, because the chart could be made to satisfy it and now is: the seccomp
# profile, privilege escalation, dropping every capability, requests and limits on every
# container, and a priority class -- all patched in by platform/commerce/app/lago.yaml.
#
# These three are the CP2 work item (crew#623): the layer boots on the drill cluster, and each
# one is retested against a running pod rather than against a rendered file. An exception with
# no date to be reconsidered is a permanent hole.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: commerce-lago-vendor-image
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-run-as-nonroot
      ruleNames: [run-as-non-root, autogen-run-as-non-root]
    - policyName: require-ro-rootfs
      ruleNames: [validate-readOnlyRootFilesystem, autogen-validate-readOnlyRootFilesystem]
    - policyName: secrets-not-from-env-vars
      ruleNames: [secrets-not-from-env-vars, secrets-not-from-envfrom, autogen-secrets-not-from-env-vars, autogen-secrets-not-from-envfrom]
  match:
    any:
      - resources:
          kinds: [Deployment, Job, Pod, ReplicaSet]
          namespaces: [commerce]
          names: [lago-*]
---
# One pod, one rule, and it is the honest answer rather than the convenient one.
#
# lago-clock is a single process. Its command is `./scripts/start.clock.sh`, and that script,
# read from the vendor's own source at the tag this chart pins (getlago/lago-api v1.32.4), is
# three lines whose last one is `exec bundle exec clockwork ./clock.rb`. `exec` means clockwork
# replaces the shell and becomes PID 1: the process IS the container. It opens no socket and
# serves no health path -- the chart ships livenessProbe values for its eight HTTP and Sidekiq
# components and none for this one, which is why require-pod-probes refuses it.
#
# So there is nothing true to probe. If clockwork dies, PID 1 dies and the kubelet restarts the
# container already, with or without a probe. The only failure a probe could add is a clockwork
# that is alive and no longer scheduling, and no endpoint in the image reports that. Writing
# `exec: [/bin/sh, -c, "true"]` here would pass this policy and detect nothing, which is the
# thing this estate keeps calling a guard that grades a proxy.
#
# The real detector for a wedged clock is not a probe, it is an absence alert: no billing job
# enqueued inside a billing period. That is CP2 (crew#623), where Lago's own metrics are wired
# to the estate's collector, and it is where this exception is reconsidered.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: commerce-lago-clock-has-no-health-endpoint
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-pod-probes
      ruleNames: [validate-probes, autogen-validate-probes]
  match:
    any:
      - resources:
          kinds: [Deployment, Pod, ReplicaSet]
          namespaces: [commerce]
          names: [lago-clock, lago-clock-*]
