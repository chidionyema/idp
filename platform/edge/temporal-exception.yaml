# Two rules the official chart cannot satisfy, scoped to the pods it renders, nothing wider.
# Lives in platform/edge, not platform/temporal: that kustomization stamps `namespace: temporal`
# and Kyverno honours exceptions from namespace kyverno only (crew#325).
# 1. secrets-not-from-env-vars: the chart hands the store password to the server as SQL_PASSWORD
#    and to its schema Jobs as TEMPORAL_*_STORE_PASSWORD, from `existingSecret`; upstream has no
#    password-file option (charts/temporal/templates/server-deployment.yaml). Same class as
#    platform/edge/langfuse-exception.yaml.
# 2. require-pod-probes: the chart's worker service exposes no health endpoint and values carry no
#    liveness probe for it (values.yaml `server.worker`). Frontend/history/matching keep theirs.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: temporal-secrets-from-env
  namespace: kyverno
spec:
  exceptions:
    - policyName: secrets-not-from-env-vars
      ruleNames: [secrets-not-from-env-vars, secrets-not-from-envfrom, autogen-secrets-not-from-env-vars, autogen-secrets-not-from-envfrom]
  match:
    any:
      - resources:
          kinds: [Deployment, Job, Pod, ReplicaSet]
          namespaces: [temporal]
          names: [temporal-frontend*, temporal-history*, temporal-matching*, temporal-worker*, temporal-schema*, temporal-namespace*]
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: temporal-worker-probes
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-pod-probes
      ruleNames: [validate-probes, autogen-validate-probes]
  match:
    any:
      - resources:
          kinds: [Deployment, Pod, ReplicaSet]
          namespaces: [temporal]
          names: [temporal-worker*]
