# The page a person sees when a door's backend is down (pod restarting, namespace rebuilding, node
# gone). Traefik's `errors` middleware (friendly-errors, in every route namespace) rewrites a
# 502/503/504 from the backend to /<status>.html here, so nobody outside ever reads the proxy's
# raw "no available server" (founder, 2026-08-29, on the portal: "thats amateur"). Static
# nginx, unprivileged, two replicas on two nodes, Guaranteed QoS, infrastructure-critical: the
# page that says "we are down" must be the last thing to go down.
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-page
  namespace: edge
data:
  index.html: &page |
    <!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="20">
    <meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting up</title>
    <style>body{font:16px/1.5 system-ui,sans-serif;background:#0f1115;color:#e6e6e6;display:grid;place-items:center;min-height:100vh;margin:0}
    main{max-width:34rem;padding:2rem;text-align:center}h1{font-weight:600;font-size:1.5rem;margin:0 0 .5rem}p{color:#a8adb7;margin:.25rem 0}</style></head>
    <body><main><h1>This service is starting up</h1><p>It is being restarted or updated and will be back in a moment.</p>
    <p>This page refreshes itself every 20 seconds. If it is still here after a few minutes, the on-call engineer has already been paged.</p></main></body></html>
  502.html: *page
  503.html: *page
  504.html: *page
---
apiVersion: v1
kind: Service
metadata:
  labels:
    backstage.io/kubernetes-id: founder-status-page
  name: status-page
  namespace: edge
spec:
  selector:
    app.kubernetes.io/name: status-page
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: edge
  labels:
    app.kubernetes.io/name: status-page
    availability.idp/tier: founder-facing
spec:
  replicas: 2
  # require-availability: a hostname-pinned pair can only roll by freeing a node first.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: status-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-page
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: status-page
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 10m, memory: 16Mi }
      volumes:
        - name: html
          configMap:
            name: status-page
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: status-page
  namespace: edge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: status-page
