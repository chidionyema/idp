apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - traefik.yaml
  - status-page.yaml
  - require-catalogue-entity.yaml
  - no-token-by-default.yaml
  # crew#684 and the founder blueprint that closed it: the invariant "a workload restarts when
  # its config changes" moves out of three hand-kept annotation lists and one hand-kept test
  # into one mutation every workload gets at admission.
  - require-auto-reload.yaml
  - catalogue-entity-exception.yaml
  - cert-manager.yaml
  - langfuse-exception.yaml
  - k8s-infra-namespace.yaml
  - k8s-infra-exception.yaml
  - temporal-exception.yaml
  - scheduling-exception.yaml
  - hindsight-exception.yaml
  - robusta-exception.yaml
  - monitoring-exception.yaml
  - litellm-cache-exception.yaml
  - tailscale-operator-exception.yaml
  - calico-exception.yaml
  - tailscale-egress-exception.yaml
  - external-dns-exception.yaml
  - protect-namespaces.yaml
  # Founder lockdown 2026-09-03: git is the only writer; any OCI user principal is refused on a
  # write, the oke-check apply service user (estate-config ESTATE_BREAK_GLASS_USER) excepted.
  - flux-only-writes.yaml
  # crew#341, wired 2026-08-28 (crew#488 CP5): the file sat here unreferenced since PR #259, so
  # the cluster never held it. Audit mode until bin/idp-ci's kyverno row reports zero violations.
  - kyverno-secrets-policy.yaml
  - provider-independence.yaml
  - require-registry-host.yaml
  - dev-loop-policy.yaml
  - provider-edge-exception.yaml
  - provider-storage-exception.yaml
  - capacity-policy.yaml
  # crew#623: the money layer. Three rules the Lago images cannot satisfy, scoped to lago-* in
  # the commerce namespace; the file itself says what was measured and when each is retested.
  - commerce-exception.yaml
  # crew#623: the widened admission judge reached platform/oci/autoscaler for the first time and
  # found nine failures on a workload nothing had ever graded. Seven were fixed in the manifest
  # (securityContext, seccomp, dropped capabilities, a read-only root, probes); this excuses the
  # last two, which the autoscaler's argv-only node-pool interface makes impossible to satisfy.
  - autoscaler-exception.yaml
  # crew#716 CP1: the dagster chart passes postgres password through env.valueFrom.secretKeyRef
  # (DAGSTER_PG_PASSWORD, POSTGRES_PASSWORD); no file form exists without a wrapper.
  - dagster-exception.yaml
  # decision 0018: superset's chart-generated env Secret (connection facts, placeholder
  # password) and its deliberately empty Celery worker; the file says what each excuses.
  - superset-exception.yaml
