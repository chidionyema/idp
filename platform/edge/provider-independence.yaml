# Founder decree 2026-08-28 (crew#66 5450184299; ruling R43): the platform is never coupled to a
# compute or cloud provider, and that is enforced here as admission policy -- the same Kyverno
# that already refuses a priority-less workload (platform/scheduling) -- not by a script that
# counts callers. A provider is named in three places only: platform/oci (the compute
# provisioner), platform/secret-store (the one vault door, labelled idp.platform/provider-door)
# and clusters/<name> (the per-cluster row). Anything else that reaches the API server carrying
# a provider's annotation, StorageClass, CSI driver, LoadBalancer class or a second cloud secret
# door is refused, and bin/idp-kyverno-render judges these same rules against every rendered PR
# so the refusal happens before merge. The one hole is declared beside it: provider-edge-exception.yaml
# names the traefik Service that clusters/oke/edge.yaml patches with the load-balancer shape.
# Written control: docs/reference/policy/provider-independence.md. Proof it refuses and passes:
# tests/test_incident_crew66_provider_independence_policy.py (LAW 38: applied to every plain
# manifest under platform/ with zero violations before it merged).
# The provider names below are regex text inside a rule; bin/cloud-agnostic-gate hunts the
# literal host, and a rule that names the enemy is the fence, not the breach.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: provider-independence
  annotations:
    policies.kyverno.io/title: Provider independence (R43)
    policies.kyverno.io/category: crew#66 vendor agnostic
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Service, Ingress, PersistentVolumeClaim, StatefulSet, Pod, ClusterSecretStore, SecretStore
    policies.kyverno.io/description: >-
      No object outside the provisioner boundary may carry a cloud provider's annotation,
      StorageClass, CSI driver or LoadBalancer class, and the estate has exactly one cloud
      secret door. Founder decree 2026-08-28, crew#66, ruling R43.
spec:
  background: true
  rules:
    - name: no-provider-annotations
      match:
        any:
          - resources:
              kinds: [Service, Ingress]   # never PersistentVolumeClaim: the CSI provisioner and scheduler write annotations on live claims (2026-08-29)
              operations: [CREATE, UPDATE]   # idp#688: a DELETE is never a portability defect; judging it left the portal namespace Terminating (run 33227815539)
      validate:
        failureAction: Enforce
        message: >-
          R43: a provider annotation (oci/aws/gcp/azure load balancer, ingress or volume) belongs
          in clusters/<name> as a patch with a PolicyException beside it, never on a platform object
        deny:
          conditions:
            any:
              - key: >-
                  {{ keys(request.object.metadata.annotations || `{}`) | [?regex_match('^(service\.beta\.kubernetes\.io/(oci|aws|azure)-|oci\.oraclecloud\.com/|alb\.ingress\.kubernetes\.io/|cloud\.google\.com/|networking\.gke\.io/)', @)] | length(@) }}
                operator: GreaterThan
                value: 0
    # There is deliberately NO rule on PersistentVolumeClaim here. The API server injects the
    # cluster's default StorageClass (oci-bv on OKE) before admission, so a rule judging the
    # claim's class judges the cluster, not the platform, and refused every new claim on
    # 2026-08-29 (run 33229461240; the portal's database never came back). What we write is
    # judged where it is written: bin/cloud-agnostic-gate refuses a provider class in platform/,
    # and the portability-k3s drill boots the same tree on another provider.
    - name: no-provider-storage-class-in-templates
      match:
        any:
          - resources:
              kinds: [StatefulSet]
              operations: [CREATE, UPDATE]   # idp#688: a DELETE is never a portability defect; judging it left the portal namespace Terminating (run 33227815539)
      validate:
        failureAction: Enforce
        message: >-
          R43: a StatefulSet volumeClaimTemplate names a provider StorageClass; leave it to the
          cluster default
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec.volumeClaimTemplates[].spec.storageClassName || `[]` | [?regex_match('^(oci|gp[23]$|io[12]$|ebs|efs|pd-|standard-rwo|premium-rwo|managed-csi|managed-premium|azure)', @)] | length(@) }}
                operator: GreaterThan
                value: 0
    - name: no-provider-load-balancer-class
      match:
        any:
          - resources:
              kinds: [Service]
              operations: [CREATE, UPDATE]   # idp#688: a DELETE is never a portability defect; judging it left the portal namespace Terminating (run 33227815539)
      validate:
        failureAction: Enforce
        message: >-
          R43: spec.loadBalancerClass names a provider; the platform's Services are plain
          LoadBalancer and the cluster row decides what fronts them
        deny:
          conditions:
            any:
              - key: >-
                  {{ regex_match('(oraclecloud|amazonaws|gke|google|azure)', request.object.spec.loadBalancerClass || '') }}
                operator: Equals
                value: true
    - name: no-provider-csi-driver
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE, UPDATE]   # idp#688: a DELETE is never a portability defect; judging it left the portal namespace Terminating (run 33227815539)
      validate:
        failureAction: Enforce
        message: >-
          R43: an inline CSI volume names a provider driver; use a PersistentVolumeClaim with no
          StorageClass, or a portable driver (csi.spiffe.io)
        deny:
          conditions:
            any:
              - key: >-
                  {{ request.object.spec.volumes[].csi.driver || `[]` | [?regex_match('(oraclecloud\.com|amazonaws\.com|csi\.aws\.com|gke\.io|azure\.com|windows\.net)$', @)] | length(@) }}
                operator: GreaterThan
                value: 0
    - name: one-provider-secret-door
      match:
        any:
          - resources:
              kinds:
                - external-secrets.io/v1/ClusterSecretStore
                - external-secrets.io/v1/SecretStore
              operations: [CREATE, UPDATE]   # idp#688: a DELETE is never a portability defect
      validate:
        failureAction: Enforce
        message: >-
          R43: the estate has one cloud secret door, platform/secret-store/store.yaml, labelled
          idp.platform/provider-door=true; a second store that speaks to a cloud vault is refused
        deny:
          conditions:
            all:
              - key: >-
                  {{ keys(request.object.spec.provider || `{}`) | [?contains(['oracle', 'aws', 'gcpsm', 'azurekv', 'alibaba', 'yandexcertificatemanager', 'yandexlockbox', 'ibm', 'scaleway'], @)] | length(@) }}
                operator: GreaterThan
                value: 0
              - key: >-
                  {{ request.object.metadata.labels."idp.platform/provider-door" || '' }}
                operator: NotEquals
                value: "true"
