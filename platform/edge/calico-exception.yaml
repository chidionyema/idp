# Calico is the cluster's network. Every pod it runs is on the host's network namespace, writes
# the host's CNI configuration and programs the host's routes and iptables chains -- calico-node
# and the operator's own uninstall hook cannot run as a non-root user with a read-only root
# filesystem and no capabilities, because that is a description of a workload that is not a CNI.
# The estate's restricted profile is the right default and stays the default; this excuses the
# one namespace whose job is the thing the profile is protecting.
#
# Narrow on purpose: only the tigera-operator namespace, only the workload-hardening rules. The
# admission rule that matters most here still applies -- flux-only-writes -- so this namespace is
# still writable by Flux alone and by no console principal.
#
# Reconsider when Calico ships a rootless data plane; the eBPF data plane still needs the same
# host access today.
# Lives in platform/edge because Kyverno honours exceptions from namespace kyverno only (crew#325).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: calico-is-the-network
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-run-as-nonroot
      ruleNames: ["*"]
    - policyName: require-ro-rootfs
      ruleNames: ["*"]
    - policyName: drop-all-capabilities
      ruleNames: ["*"]
    - policyName: disallow-privilege-escalation
      ruleNames: ["*"]
    - policyName: restrict-seccomp-strict
      ruleNames: ["*"]
    - policyName: require-requests-limits
      ruleNames: ["*"]
    - policyName: disallow-capabilities-strict
      ruleNames: ["*"]
    - policyName: disallow-host-namespaces
      ruleNames: ["*"]
    - policyName: disallow-host-path
      ruleNames: ["*"]
    - policyName: disallow-host-ports
      ruleNames: ["host-ports-none"]
    # disallow-privileged-containers and require-run-as-non-root-user are the parent ClusterPolicies
    # whose autogen-* rules load onto the calico-node DaemonSet's own pod template (autogen-
    # privileged-containers at /spec/template/spec/initContainers/, autogen-run-as-non-root-user at
    # the same initContainers runAsUser). calico-node's init container installs the CNI binaries
    # into /opt/cni/bin on the host and its containers live on the host network namespace and
    # program the host's routes and iptables: that is privileged and root by definition, the same
    # reason the other hardening policies are exempted above. The two bare-rule policies
    # (require-run-as-nonroot, disallow-capabilities) are listed above and do not catch these
    # autogen names; observed 2026-09-06 once the operator got past the catalogue deny in #2037.
    - policyName: disallow-privileged-containers
      ruleNames: ["*"]
    - policyName: require-run-as-non-root-user
      ruleNames: ["*"]
    - policyName: require-pod-probes
      ruleNames: ["*"]
    - policyName: restrict-volume-types
      ruleNames: ["*"]
    # disallow-host-ports (host-ports-none) above is typha's own Pod carve-out, not a Service one:
    # typha binds hostPort 5473 (calico-node fd's fan-out relay). Until disallow-host-ports was
    # exempted it denied the typha Pod outright, so calico-typha had 0 ready, calico-node
    # crash-looped hunting a ready typha, and both nodes tainted NetworkUnavailable=True
    # (observed 2026-09-06 ~08:03Z -- no new Pod in the whole cluster could then schedule,
    # including the store-web #819/#820 rollout, which is why the clean live copy never shipped).
    # calico-typha is Calico's internal L3/L4 datapath relay between the calico-node agents and
    # the API-controllers; calico-kube-controllers-metrics is the kube-controllers' Prometheus
    # scrape endpoint. Both are operator-minted internal Services, never doors a person opens --
    # the operator (tigera/operator component renderer) creates them and they cannot carry a
    # backstage.io/kubernetes-id catalogue label, so require-catalogue-entity (Enforce,
    # service-names-its-entity) refuses the operator's own reconcile and calico-node/kube-
    # controllers never come up (observed 2026-09-06 once the operator booted after #2031/#2033,
    # then again for the kube-controllers-metrics Service minutes later). Same carve-out rationale
    # as the ACME solver and prometheus-operated in catalogue-entity-operator-children: an
    # operator-minted Service that is never a portal door gets an exception, not a fake label.
    # The calico-system namespace is the operator's own; every Service it mints there is internal.
    # Names scoped to calico-system (globs allowed, see ts-* in the precedent), so this is the
    # complete operator-minted set, not an open slice across the estate.
    - policyName: require-catalogue-entity
      ruleNames: [service-names-its-entity]
  match:
    any:
      - resources:
          kinds: [Pod, Deployment, DaemonSet, ReplicaSet, Job]
          namespaces: [tigera-operator, calico-system, calico-apiserver]
      - resources:
          kinds: [Service]
          namespaces: [calico-system]
          names: ["calico-*"]
