# Services an operator creates for its own workload, never a door a person opens: the operator's
# Deployment carries the label (its HelmRelease postRenderer), its children are named here so
# require-catalogue-entity (Enforce) cannot refuse the operator's own reconcile. Kyverno honours
# exceptions from namespace kyverno only (crew#325). Adding a name here is adding an interface
# nobody can find from the portal: docs/policy/every-interface-is-a-door.md.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: catalogue-entity-operator-children
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-catalogue-entity
      ruleNames: [service-names-its-entity]
  match:
    any:
      - resources:
          kinds: [Service]
          namespaces: [monitoring]
          names: [prometheus-operated, alertmanager-operated]
      - resources:
          kinds: [Service]
          namespaces: [tailscale]
          names: [ts-*]
      - resources:
          kinds: [Service]
          namespaces: [healing]
          names: [k8sgpt-*]
      # crew#768 (2026-09-01): cert-manager presents every HTTP-01 challenge through a Service and
      # an HTTPRoute it mints itself, labelled acme.cert-manager.io/http01-solver. Neither is a
      # door a person opens, and neither can carry a catalogue label. With this rule in Enforce
      # since 2026-08-29 every edge certificate renewal was refused at admission; otto.mumchimp.com
      # served the Traefik placeholder and Telegram could not deliver.
      - resources:
          kinds: [Service, HTTPRoute]
          selector:
            matchLabels:
              acme.cert-manager.io/http01-solver: "true"
      # crew#805 tier 3 (2026-09-02): the one-hour buyer sandbox is a vCluster; its syncer
      # mints host Services at runtime (its DNS, anything a guest deploys inside) that cannot
      # carry a catalogue label any more than the ACME solver can. The sandbox's own door (the
      # control-plane Service) still carries backstage.io/kubernetes-id via its HelmRelease
      # postRenderer, the namespace expires by the cleanup controller's clock, and nothing in
      # it is a door a person opens from the portal. Pin:
      # tests/test_demo_sandbox_is_defined_and_expires.py.
      - resources:
          kinds: [Service]
          namespaces: [demo-sandbox]
      # crew#656 (2026-09-05): the verification canary's gauge Service exists so the one
      # Prometheus can scrape `canary_reported_state` and be caught lying about it. It is not a
      # door a person opens -- the canary carries no route, no alert rule and deliberately no
      # catalogue entity (platform/staging/canary/canary.yaml), because a canary in the portal
      # is an interface someone would try to use. Matched by the label every canary object
      # carries, so a second one needs no second entry here.
      - resources:
          kinds: [Service]
          namespaces: [staging]
          selector:
            matchLabels:
              idp.platform/canary: "true"
