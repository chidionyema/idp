# The Kyverno waiver the Coroot release needs, and the exact reason nothing wider is granted.
#
# WHY A WAIVER IS REQUIRED AT ALL. The node agent attaches eBPF programs to the kernel and reads the
# container runtime's state to resolve a socket to a process. Both need hostPaths: the kernel's
# tracefs/debugfs to load the programs, and the container runtime's socket plus the host /proc to
# attribute an observed connection to a workload. The `restricted` Kyverno profile refuses hostPath,
# and it refuses the privileged container and the added capabilities those same programs need, so
# without this file the DaemonSet is denied at admission.
#
# WHY THIS IS A PolicyException AND NOT THE ClusterPolicy IT USED TO BE. An earlier version of this
# file was a ClusterPolicy named coroot-node-agent-hostpath, held in Audit. A policy cannot excuse
# another policy: when admission is about to refuse an Enforce rule it consults the exception list
# (platform/kyverno/kyverno.yaml, features.policyExceptions), and a second ClusterPolicy -- Audit or
# Enforce -- is never consulted. Measured 2026-10-15: the file was also absent from
# platform/edge/kustomization.yaml, so the cluster never held it and the render was refused by every
# policy below. A waiver that waives nothing is a door nobody is watching, and it reads, in the diff
# and in the cluster, exactly like a door somebody is. Same defect as crew#341, where
# kyverno-secrets-policy.yaml sat unreferenced since PR #259 and the cluster never held it.
#
# ruleNames IS NOT OPTIONAL, and this file was written wrong once. The API server requires it --
# `PolicyException.kyverno.io "coroot-release" is invalid: spec.exceptions[0].ruleNames: Required
# value` -- and the offline judge reads the same exception list, so a missing ruleNames does not
# produce one bad verdict: kyverno aborts with `Error: failed to load exceptions` and judges NOTHING,
# for every directory, while the rung still printed five green lines (measured, 2026-10-15, the run
# that produced this fix). Each entry below names the policy's own rules and their `autogen-` twins,
# because autogen is what admission actually matches for the Pod a Deployment, DaemonSet or
# StatefulSet creates -- and bin/idp-kyverno-render now refuses the whole run (BLIND) if any exception
# in the estate is missing ruleNames, so this defect cannot repeat itself silently.
#
# SCOPE, DELIBERATELY NARROW. One namespace, one release: everything below is scoped to namespace
# coroot by the match block, so the privilege this grants is not available to any other workload in
# the estate. Every policy named here was read off the failing render of THIS release
# (`bin/idp-kyverno-render platform/coroot`, 2026-10-15), never guessed. The match is by namespace
# and not by name because the names admission sees are the controllers': the real object is
# Pod/coroot-node-agent-xxxxx, while the offline judge synthesises Pod/coroot-node-agent-pod -- an
# exception naming the synthetic Pods would pass offline and still refuse every real Pod, which is
# the failure mode this whole rung exists to prevent. No hostPath is granted here: the paths the
# agent mounts are in the release's own spec, and adding one is an edit to platform/coroot/coroot.yaml
# that a reviewer sees.
#
# require-catalogue-entity is NOT waived: the release's seven Services carry
# backstage.io/kubernetes-id=coroot through the HelmRelease's postRenderer, the way
# platform/identity/oauth2-proxy.yaml labels its own. require-registry-host is not waived either: it
# is held in Audit, so it refuses nothing, and bin/idp-kyverno-render counts it as an audit.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: coroot-release
  namespace: kyverno
  annotations:
    # Tie the exception to its owner: when Coroot is removed this file goes with it, because a
    # standing waiver with no release is an unwatched door.
    policies.kyverno.io/description: >-
      The coroot release: an eBPF node agent that must be privileged, mount hostPaths and share the
      host network namespace, plus the chart's own store, UI, collector and exporter pods. The
      restricted profile refuses all of it and the agent cannot be written to satisfy it.
spec:
  exceptions:
    - policyName: disallow-capabilities-strict
      ruleNames: [require-drop-all, adding-capabilities-strict,
                  autogen-require-drop-all, autogen-adding-capabilities-strict]
    - policyName: disallow-host-namespaces
      ruleNames: [host-namespaces, autogen-host-namespaces]
    - policyName: disallow-host-path
      ruleNames: [host-path, autogen-host-path]
    - policyName: disallow-privilege-escalation
      ruleNames: [privilege-escalation, autogen-privilege-escalation]
    - policyName: disallow-privileged-containers
      ruleNames: [privileged-containers, autogen-privileged-containers]
    - policyName: drop-all-capabilities
      ruleNames: [require-drop-all, autogen-require-drop-all]
    - policyName: require-pod-probes
      ruleNames: [validate-probes, autogen-validate-probes]
    - policyName: require-requests-limits
      ruleNames: [validate-resources, autogen-validate-resources]
    - policyName: require-ro-rootfs
      ruleNames: [validate-readOnlyRootFilesystem, autogen-validate-readOnlyRootFilesystem]
    - policyName: require-run-as-nonroot
      ruleNames: [run-as-non-root, autogen-run-as-non-root]
    - policyName: restrict-seccomp-strict
      ruleNames: [check-seccomp-strict, autogen-check-seccomp-strict]
    - policyName: restrict-volume-types
      ruleNames: [restricted-volumes, autogen-restricted-volumes]
    - policyName: secrets-not-from-env-vars
      ruleNames: [secrets-not-from-env-vars, secrets-not-from-envfrom,
                  autogen-secrets-not-from-env-vars, autogen-secrets-not-from-envfrom]
  match:
    any:
      - resources:
          namespaces: [coroot]
