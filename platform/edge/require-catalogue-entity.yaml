# crew#307 (founder, 2026-08-29): "how was even a surface allowed into the estate without being
# on Backstage". Until now nothing refused it: the only inventory check counted public hostnames.
# Policy, docs/policy/every-interface-is-a-door.md: anything that serves a port names its
# catalogue entity with Backstage's own label, backstage.io/kubernetes-id, at admission, Enforce:
# the control plane refuses the object, so nothing can reach the cluster outside the inventory
# (founder, 2026-08-29: "if a surface is not registered in the inventory, the cluster must
# refuse to boot it"). Helm charts get the label through a Flux postRenderer on each HelmRelease;
# the Services an operator creates for itself (prometheus-operated, tailscale proxies) are excepted
# by name in catalogue-entity-exception.yaml. The cluster-state receipt (services_unlisted)
# and bin/idp-catalogue-drift prove the live cluster matches, every 15 minutes.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-catalogue-entity
  annotations:
    policies.kyverno.io/title: Everything that serves a port names its catalogue entity
    policies.kyverno.io/category: founder ruling 2026-08-29, inventory
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Service, HTTPRoute
    policies.kyverno.io/description: >-
      A Service or HTTPRoute outside the system namespaces must carry the label
      backstage.io/kubernetes-id naming the catalogue entity it belongs to. An interface the
      catalogue does not hold is a void the founder cannot see.
spec:
  background: true
  rules:
    - name: service-names-its-entity
      match:
        any:
          - resources:
              kinds: [Service, HTTPRoute]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          # crew#846: trivy-system joins the other admission/operator namespaces here. Its one
          # Service is a metrics endpoint the chart names for itself (deploy/helm/values.yaml
          # service.headless: true) -- no door a person opens, same shape as metrics-server and
          # keda beside it.
          - resources:
              namespaces: [kube-system, flux-system, kyverno, cert-manager, spire-mgmt, metrics-server, reloader, keda, external-secrets, trivy-system]
          - resources:
              kinds: [Service]
              namespaces: [default]
              names: [kubernetes]
      validate:
        failureAction: Enforce
        message: >-
          {{ request.object.kind }} {{ request.namespace }}/{{ request.object.metadata.name }}
          serves a port but names no catalogue entity. Add the label backstage.io/kubernetes-id
          with the entity name from backstage/**/catalog-info.yaml, and a founder surface if a
          person opens it (docs/policy/every-interface-is-a-door.md).
        pattern:
          metadata:
            labels:
              backstage.io/kubernetes-id: "?*"
