# Injects OTEL_EXPORTER_OTLP_ENDPOINT into every estate workload container at admission.
# This is the platform's single point of OTel wiring: a manifest need not declare the env var,
# Kyverno adds it, and the value is always the estate's one collector.
#
# WHY MUTATION OVER DECORATION: the require-auto-reload pattern (crew#684 blueprint) proved
# the model — an annotation the policy injects cannot be forgotten, cannot drift, and is not
# a surface an author must maintain. The same reasoning applies here: every workload emits
# traces to the estate collector, and the only way to guarantee that is to make the wrong
# state inexpressible rather than to enumerate 40 manifests and expect them to stay current.
#
# VENDOR workloads that have no OTel SDK are excluded at the namespace/name level; they do
# not benefit from the injection and the env var sitting unused is noise. Estate code that
# has not yet initialised the SDK receives the env var and emits nothing until the SDK is
# wired — the env var is the contract, not the proof.
#
# SCOPE: Deployments and StatefulSets only; DaemonSets are infra (otel-agent, node-exporters)
# excluded by namespace anyway.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-otel-endpoint
  annotations:
    policies.kyverno.io/title: Inject OTel exporter endpoint into every workload
    policies.kyverno.io/category: observability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet
    policies.kyverno.io/description: >-
      Every container in every estate Deployment and StatefulSet receives
      OTEL_EXPORTER_OTLP_ENDPOINT at admission, pointing at the estate's one
      collector. A container that declares the variable itself has it rewritten
      to that collector; every other variable it declares is left untouched.
spec:
  background: false
  rules:
    - name: inject-otel-endpoint
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet]
              operations: [CREATE, UPDATE]
      exclude:
        any:
          # Infrastructure namespaces — Kyverno, Flux, cert-manager cannot mutate themselves
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - kyverno
                - cert-manager
                - spire-mgmt
                - metrics-server
                - reloader
                - keda
                - external-secrets
                - trivy-system
                - tailscale
                - observability
                - observability-agent
                - monitoring
                - healing
                - nodesoftware-operator
                - crossplane-system
                - calico-system
                - calico-apiserver
                - scheduling
                - cross-node-drill
                - staging
                - state
          # VENDOR workloads — third-party images with no OTel SDK; injection is dead weight
          - resources:
              namespaces: [guacamole]
              names: [guacamole*, guacd*]
          - resources:
              namespaces: [healthchecks]
              names: [healthchecks*]
          - resources:
              namespaces: [searxng]
              names: [searxng*]
          - resources:
              namespaces: [weave-gitops]
              names: [weave-gitops*]
          - resources:
              namespaces: [commerce]
              names: [lago*, redis*, commerce-redis]
          - resources:
              namespaces: [llm, idp-agent, via-negativa]
              names: [redis*, litellm-cache*]
          - resources:
              namespaces: [dagster]
          - resources:
              namespaces: [notify]
              names: [apprise*]
          - resources:
              namespaces: [edge]
              names: [status-page*, traefik*, external-dns*]
          # VENDOR — fully third-party Helm chart namespaces
          - resources:
              namespaces: [event-bus, robusta, estate-db, chaos-mesh, temporal]
          - resources:
              namespaces: [identity]
              names: [oauth2-proxy*]
          # DEMO — sandbox workload
          - resources:
              namespaces: [demo-sandbox]
          # rotation-canary deploys into backstage namespace despite living in platform/state/
          - resources:
              namespaces: [backstage]
              names: [rotation-canary*]
          # ALREADY WIRED — these manifests declare the endpoint inline; injection is a no-op
          # but the Kyverno +(name) add-if-absent patch conflicts with existing valueFrom entries
          # in the same env list (POD_NAMESPACE / metadata fieldRef). Exclude them to prevent
          # the dry-run rejection that blocks Flux reconciliation (crew# observed 2026-09-17).
          - resources:
              namespaces: [jit]
              names: [jit-broker]
          - resources:
              namespaces: [idp-agent]
              names: [idp-engine]
          - resources:
              namespaces: [hermes-agent]
              names: [hermes-agent-gateway]
          - resources:
              namespaces: [otto-gateway]
              names: [otto-gateway]
          # PLATFORM WIP — pending OTel instrumentation (crew#584 follow-up)
          - resources:
              namespaces: [epistemic-fabric]
              names: [epistemic-ingest-*]
          - resources:
              namespaces: [via-negativa]
              names: [via-negativa-proxy*, via-negativa-rca*]
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                containers:
                  - (name): "*"
                    env:
                      # NO ANCHOR HERE. A plain list entry is a strategic merge keyed on
                      # `name`: it adds this variable and touches nothing else. An anchor on
                      # either key breaks that, in opposite directions, and both were measured
                      # with `kyverno apply` on fixtures rather than reasoned about:
                      #
                      #   +(name)   -- what this file carried until now. The anchor lands on the
                      #                `env` LIST, so the `value:` beside it is written onto
                      #                EVERY existing entry:
                      #                   IN   LITELLM_LOG=INFO  ZEROEDGE_BUDGET_ENFORCE=0
                      #                   OUT  both = http://signoz-otel-collector...:4318
                      #                That is what killed llm/litellm --
                      #                   AttributeError: module 'logging' has no attribute
                      #                   'HTTP://SIGNOZ-OTEL-COLLECTOR.OBSERVABILITY.SVC:4318'
                      #                -- and it is also what produced the dry-run rejections
                      #                the exclusion list below records: on a `valueFrom` entry
                      #                it writes a `value:` beside the `valueFrom:`, which is an
                      #                invalid container the API server refuses.
                      #
                      #   +(value)  -- preserves the other variables, but adds nothing: on a
                      #                container that does not already declare the key, kyverno
                      #                reports `skipped mutate policy` and the endpoint never
                      #                arrives. A mutation that cannot mutate is not a fix.
                      #
                      #   (none)    -- adds the entry when absent, leaves LITELLM_LOG,
                      #                ZEROEDGE_BUDGET_ENFORCE and a POD_NAMESPACE `valueFrom`
                      #                exactly as written. This one.
                      #
                      # The cost of no anchor, stated plainly: a container that declares its own
                      # endpoint has it rewritten to the collector below. That is the intended
                      # reading of "single point of OTel wiring" -- the estate has one collector,
                      # and a workload pointing somewhere else is a workload whose traces nobody
                      # is looking at. It is not add-if-absent, and the description no longer
                      # claims to be.
                      - name: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: "http://signoz-otel-collector.observability.svc:4318"
