# crew#539 CP12: the Cilium agent (platform/cilium) is a CNI plugin: it loads eBPF programs into
# the node's kernel, writes /etc/cni/net.d and /opt/cni/bin on the host and shares the node's
# network namespace. That is the whole job of a CNI DaemonSet and it cannot be done inside the
# restricted profile; the waiver lists exactly the policies bin/idp-kyverno-render showed
# failing on 2026-08-27 (17 of 84 checks; envoy off and operator.hostNetwork=false removed the
# other 15). The operator is waived for two rows only: the image runs as root and writes its
# root filesystem; its hostNetwork/hostPort rows pass. Same shape and namespace rule as
# k8s-infra-exception.yaml (Kyverno honours exceptions from namespace kyverno only, crew#325).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: cilium-cni-agent
  namespace: kyverno
spec:
  exceptions:
    - { policyName: disallow-capabilities, ruleNames: ['*'] }
    - { policyName: disallow-capabilities-strict, ruleNames: ['*'] }
    - { policyName: disallow-host-namespaces, ruleNames: ['*'] }
    - { policyName: disallow-host-path, ruleNames: ['*'] }
    - { policyName: disallow-host-ports, ruleNames: ['*'] }
    - { policyName: disallow-privilege-escalation, ruleNames: ['*'] }
    - { policyName: disallow-privileged-containers, ruleNames: ['*'] }
    - { policyName: disallow-selinux, ruleNames: ['*'] }
    - { policyName: drop-all-capabilities, ruleNames: ['*'] }
    - { policyName: require-ro-rootfs, ruleNames: ['*'] }
    - { policyName: require-run-as-nonroot, ruleNames: ['*'] }
    - { policyName: restrict-seccomp, ruleNames: ['*'] }
    - { policyName: restrict-seccomp-strict, ruleNames: ['*'] }
    - { policyName: restrict-volume-types, ruleNames: ['*'] }
  match:
    any:
      - resources:
          kinds: [DaemonSet, Pod]
          namespaces: [kube-system]
          names: [cilium, cilium-*]
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: cilium-operator
  namespace: kyverno
spec:
  exceptions:
    - { policyName: require-ro-rootfs, ruleNames: ['*'] }
    - { policyName: require-run-as-nonroot, ruleNames: ['*'] }
  match:
    any:
      - resources:
          kinds: [Deployment, Pod]
          namespaces: [kube-system]
          names: [cilium-operator, cilium-operator-*]
