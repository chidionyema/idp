# The edge row of crew/docs/STANDARDS.md: one ingress, one certificate issuer, one DNS writer,
# one policy engine, for every product on the cluster. A product ships Gateway API objects and
# nothing else; the four charts below are the platform's, not the product's.
apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    # The front door. bin/idp-availability-gate fails if this label is missing from a namespace
    # whose surfaces it graded green: the label is what makes the cluster refuse a regression
    # (platform/scheduling/require-availability.yaml), and CI proves it is here.
    availability.idp/tier: founder-facing
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
