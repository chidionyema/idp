# The one declared hole in provider-independence.yaml (R43). clusters/oke/edge.yaml patches the
# traefik HelmRelease with the OKE load-balancer shape annotations, and that is the only place the
# estate names its load balancer (R36, crew#250). The exception is scoped to that one Service so a
# second cluster row (clusters/k3s) that patches nothing has nothing to excuse, and any other
# Service carrying a provider annotation is still refused. Namespace kyverno: admission honours
# exceptions from nowhere else (platform/edge/kyverno.yaml features.policyExceptions, crew#325).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: provider-edge-load-balancer
  namespace: kyverno
spec:
  exceptions:
    - policyName: provider-independence
      ruleNames: [no-provider-annotations]
  match:
    any:
      - resources:
          kinds: [Service]
          namespaces: [edge]
          names: [traefik]
