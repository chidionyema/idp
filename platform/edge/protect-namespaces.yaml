# Founder, 2026-08-29: "Moving a file in Git should never cause a cascading destruction of a
# production namespace." Three layers, one mark. The mark is the Flux annotation
# `kustomize.toolkit.fluxcd.io/prune: disabled` on every Namespace under platform/:
#   1. Flux never garbage-collects a namespace that carries it (this repo: every one does;
#      tests/test_incident_a_namespace_moved_between_flux_rows_was_pruned.py holds that at zero misses).
#   2. This policy makes the cluster itself refuse a DELETE of any Namespace carrying it -- an agent,
#      a script, a `kubectl delete ns`, a chart uninstall. Scope is the mark, not a name list, so a
#      new platform namespace is covered the moment it exists and the two layers cannot drift.
#   3. CI refuses a PR that removes or moves a Namespace manifest, or ships one without the mark.
# Incident: the portal's front door answered 404 from 01:05Z on 2026-08-29 after idp#648 moved
# the portal's namespace.yaml from its prune:true Kustomization to a new namespace-only row.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-namespaces
  annotations:
    policies.kyverno.io/title: A platform namespace cannot be deleted
    policies.kyverno.io/category: founder ruling 2026-08-29, namespace immutability
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Deletion of a Namespace carrying kustomize.toolkit.fluxcd.io/prune=disabled is refused at
      admission. To retire one on purpose, remove the annotation in git first; that PR is the
      audit trail.
spec:
  background: false
  rules:
    - name: refuse-delete-of-marked-namespace
      match:
        any:
          - resources:
              kinds: [Namespace]
              operations: [DELETE]
              annotations:
                kustomize.toolkit.fluxcd.io/prune: disabled
      validate:
        failureAction: Enforce
        message: >-
          Namespace {{ request.oldObject.metadata.name }} is a platform namespace and cannot be
          deleted. Remove the kustomize.toolkit.fluxcd.io/prune annotation in git first (the PR
          is the audit trail), then retire it. Founder ruling 2026-08-29.
        deny: {}
