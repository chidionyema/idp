# The previous node agent's namespace (crew#388, 2026-08-27), privileged for its eBPF and hostPath
# mounts. Empty since 2026-09-27: the OTLP door (platform/monitoring/otlp.yaml) needs nothing from
# the host and runs restricted in monitoring, and the one eBPF agent is Coroot's. Kept one PR so the
# retire Job lands first; the cleanup PR that removes retire-signoz.yaml deletes this with it.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Never garbage-collected by Flux: a namespace moved between Kustomization rows or
    # dropped from git stays, with everything in it (portal 404, 2026-08-29 01:05Z, idp#648).
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: observability-agent
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
