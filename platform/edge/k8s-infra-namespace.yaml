# The node agent's own namespace (crew#388, 2026-08-27). It lives in edge, next to the Kyverno
# exception for the same DaemonSet, because platform/observability/kustomization.yaml sets
# namespace: observability and that transformer renames every Namespace object it sees. Measured in cluster-state events_warning:
#   Error creating: pods "k8s-infra-otel-agent-q6z9l" is forbidden: violates PodSecurity
#   "restricted:latest": restricted volume types (volumes "varlog", "varlibdockercontainers",
#   "hostfs" use restricted volume type "hostPath")
# The refusal came from the Pod Security Admission label on namespace observability, not from
# Kyverno. platform/edge/k8s-infra-exception.yaml waives the Kyverno rules, and a Kyverno
# exception cannot waive a PSA label: PSA is enforced by the API server per namespace, and both
# restricted and baseline forbid hostPath. A node agent that reads /var/log/pods and the host
# filesystem therefore needs a namespace whose enforce level is privileged. Giving that level to
# observability would also lift it for SigNoz, ClickHouse and Langfuse, so the agent gets its own
# namespace and observability stays restricted. warn and audit stay restricted here so any other
# workload that lands in this namespace is reported.
apiVersion: v1
kind: Namespace
metadata:
  name: observability-agent
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
