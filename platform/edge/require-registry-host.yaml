# LAW 45 guard for a class this estate has now hit five times in five days:
#   2026-08-26, crew#284 (idp#262/#263): platform/llm/postgres.yaml named `postgres:17.6-alpine`
#     and the pod never started -- "ImageInspectError: short name mode is enforcing".
#   2026-08-27, crew#396: the temporal HelmRelease shipped the chart defaults `temporalio/server`,
#     `temporalio/admin-tools`, `temporalio/ui`; every temporal pod stayed Pending.
#   2026-08-26, crew#325: the langfuse chart's seaweedfs sub-chart rendered
#     `chrislusf/seaweedfs:4.23` with no registry and the S3 pod sat in ImageInspectError for three
#     hours ("returns ambiguous list"). Fixed by pinning global.seaweedfs.image.repository.
#   2026-08-28, robusta (tests/test_incident_crew539_robusta_short_name_image.py): the chart's
#     default `image.registry: robustadev` carries no host; robusta-forwarder and robusta-runner
#     sat in ImageInspectError for hours -- "short name mode is enforcing, but image name
#     robustadev/kubewatch:v2.16.1 returns ambiguous list" -- and the HelmRelease failed early
#     on the stalled Deployments. That guard pins one release's registry; this one is the class.
#   2026-08-30, run 33341390235: the tailscale-operator chart's default
#     operatorConfig image repository of "tailscale/k8s-operator" (tailscale/tailscale
#     cmd/k8s-operator/deploy/chart/values.yaml at v1.102.3, read 2026-08-30) rendered the same
#     shape, kubelet answered "short name mode is enforcing, but image name
#     tailscale/k8s-operator:v1.102.3 returns ambiguous list", the HelmRelease stalled on
#     Deployment/tailscale/operator, and Kustomization/guacamole sat dark behind it for hours.
#
# THE RUNTIME, MEASURED, NOT ASSUMED. Both nodes report `cri-o://1.35.2` (run 33341390235,
# bin/idp-cluster-state, read 2026-08-31). This matters because the common reading of an image-pull
# failure does not apply here: containerd resolves an unqualified name against docker.io by
# default and would have reported `failed to pull and unpack image "docker.io/tailscale/..."`,
# already carrying the host. cri-o uses the containers/image resolver, and with
# `short-name-mode = "enforcing"` and more than one unqualified-search registry configured it
# refuses to RESOLVE the name -- the pull is never attempted. So on this estate an image reference
# whose first path segment carries no registry host is unresolvable, and always will be.
# It also rules out the two usual suspects for this image on OKE: a Docker Hub anonymous rate
# limit (`429 toomanyrequests`) and a missing pull secret both fail during the pull, after
# resolution, with different text. Run 33341390235 is 3,245 lines and contains zero occurrences of
# `toomanyrequests`, `429` or `unauthorized` against any image; the only pull failure in it is the
# resolver refusing the short name.
# Nothing caught either one: the manifest is valid, admission passed, the chart is upstream's, and
# the failure only appears on the kubelet, minutes later, as a stalled controller. This is the
# admission-time answer -- the reference is refused where it is written, not where it is pulled.
#
# THIS CLOSES A RESIDUAL THAT WAS WRITTEN DOWN AND THEN CAME TRUE. After the second instance,
# tests/test_incident_crew284_short_image_name_refused_by_runtime.py named its own blind spot in
# its docstring, verbatim: "Residual: a chart default that the HelmRelease does not override is
# not in any file here and stays unseen". Instances three, four and five were all exactly that.
# A
# guard that greps this repository's files structurally cannot see an image that only exists
# after `helm template` runs, so no amount of widening that regex would have caught them. This
# rule judges the RENDERED pod instead, which is the only surface the chart default appears on.
# THE FILE SCAN IS DELETED IN THE SAME CHANGE (founder, 2026-08-31, doc
# ~/.claude/docs/founder/2026-08-31T0014Z-good-correction-and-the-guard-moved-to-the-9f88e1fd.md):
# "you now have a file-reading guard and a render guard covering the same invariant, and the file
# one has demonstrated it can't see chart defaults. If the render guard subsumes it, delete it in
# this PR." It does subsume it. That guard graded "every image a Kustomization clusters/* applies";
# bin/idp-kyverno-render grades the same directory list after helm template runs, which is the same
# set plus every image a chart invents. Two controls over one invariant, where the weaker one reads
# green while the invariant is broken, is the artefact that produced instances three and four.
#
# Kyverno is already the estate's admission controller (platform/kyverno); a scanner script here
# would be a script for a problem a proven platform already solves (headline rule 1). The rule
# matches Pod, so Kyverno's autogen covers every controller that makes one, and
# bin/idp-kyverno-render grades it offline over every directory bin/idp-kyverno-dirs names.
#
# Audit, not Enforce, on the crew#539 precedent in platform/scheduling/require-priority-class.yaml
# (LAW 38: a guard that refuses correct work is an outage). It flips to Enforce after a render of
# every directory reports zero violations, never before.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-registry-host
  annotations:
    policies.kyverno.io/title: Every image names its registry
    policies.kyverno.io/category: supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The nodes run cri-o with short-name mode enforcing, so an image reference with no registry
      host in its first path segment cannot be pulled and the workload stalls after admission with
      "returns ambiguous list". Every container, init container and ephemeral container names a
      registry host (a first segment containing a dot, or localhost, optionally with a port).
spec:
  background: true
  rules:
    - name: image-names-a-registry-host
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE, UPDATE]
      validate:
        failureAction: Audit
        # Kyverno refuses {{ element.image }} in a validate message ("variable 'element.image'
        # present outside of foreach at path /validate/message", CLI v1.19.0), and `message` is not
        # a key a foreach entry accepts -- adding it makes the whole policy load as zero rules. The
        # offending image is therefore found from the resource the render names, not from here.
        message: >-
          an image on this pod names no registry host, and the nodes enforce short-name mode: it is
          admitted and then fails to pull with "returns ambiguous list" (crew#325 seaweedfs
          2026-08-26, tailscale-operator run 33341390235 2026-08-30). Write the registry in full,
          e.g. docker.io/library/nginx or ghcr.io/owner/name.
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][][]"
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('^([a-zA-Z0-9-]+(\\.[a-zA-Z0-9-]+)+(:[0-9]+)?|localhost(:[0-9]+)?)/', '{{ element.image }}') }}"
                    operator: Equals
                    value: false
