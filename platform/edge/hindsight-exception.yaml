# One rule the vendor chart cannot satisfy, scoped to the one pod it renders, nothing wider.
# Lives in platform/edge for the same reason temporal-exception.yaml does: Kyverno honours
# exceptions from namespace kyverno only (crew#325).
# secrets-not-from-env-vars: chart 0.9.2 hands every key of `existingSecret` to the api as envFrom
# and builds HINDSIGHT_API_DATABASE_URL from $(POSTGRES_PASSWORD) (helm/hindsight/templates/
# _helpers.tpl); upstream has no file option. Same class as temporal-exception.yaml.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: hindsight-secrets-from-env
  namespace: kyverno
spec:
  exceptions:
    - policyName: secrets-not-from-env-vars
      ruleNames: [secrets-not-from-env-vars, secrets-not-from-envfrom, autogen-secrets-not-from-env-vars, autogen-secrets-not-from-envfrom]
  match:
    any:
      - resources:
          kinds: [Deployment, Pod, ReplicaSet]
          namespaces: [hindsight]
          names: [hindsight-api*]
