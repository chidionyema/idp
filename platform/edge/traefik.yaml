# Traefik is the Gateway API implementation. GatewayClass `traefik` is what
# prospector/deploy/k8s/base/edge.yaml names. The chart's own default Gateway is off: each product
# owns its Gateway in its own namespace. Entrypoint ports stay at the chart's 8000/8443 (the pod
# is non-root); the Service maps them to 80/443 on the load balancer, and a product's Gateway
# listeners name 8000/8443.
#
# The Service annotations ask OCI for the one flexible load balancer the Always Free tier
# includes (10 Mbps minimum and maximum, so the shape can never grow into a bill).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: edge
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: edge
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 41.3.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    deployment:
      # Two, on two nodes. Everything the founder can open enters through this pod: at replicas 1
      # the seven surfaces behind it that survive a node drain (bin/idp-availability-gate) are
      # decorative, because the front door dies with the node it happens to sit on.
      replicas: 2
    # Named in the PriorityClass description as routing: the front door is seated on a node before
    # anything else, and evicts the balloon rather than queueing behind it.
    priorityClassName: infrastructure-critical
    podDisruptionBudget:
      enabled: true
      # minAvailable, not maxUnavailable: with 2 replicas both leave the drain exactly one move,
      # and minAvailable states the floor the front door must keep rather than the ceiling it may
      # lose. Never raise it to 2 -- minAvailable == replicas is the shape that refused every
      # drain on the clickhouse PDB at 06:30:43Z.
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        # Middleware CRs (ForwardAuth, ADR 0003) are ExtensionRef filters on HTTPRoutes and
        # need this provider on; IngressRoute stays unused (ADR 0001: Gateway API only).
        enabled: true
    gateway:
      enabled: false
    ingressRoute:
      dashboard:
        enabled: false
    service:
      # `spec:`, not `type:` at this level. The chart passes this map straight into the Service
      # spec (values.yaml: "Additional entries here will be added to the Service spec"); a bare
      # `service.type` is not a key the chart reads, so the LoadBalancer this estate has always
      # had came from the chart's own default and nothing here decided it. Proved by
      # `helm template ... | grep externalTrafficPolicy` returning nothing until this moved.
      spec:
        type: LoadBalancer
        # Local, not Cluster: the load balancer sends traffic only to nodes running a healthy
        # Traefik pod (no second hop through a node that has none) and the client IP survives to
        # oauth2-proxy and the access log. Safe because the spread constraint above puts one pod
        # on each node; a node without one is health-checked out of the backend set rather than
        # blackholing.
        externalTrafficPolicy: Local
      # No provider annotations here (R36): the cluster row (clusters/<cluster>/edge.yaml)
      # patches in the load-balancer shape its cloud needs.
    # Guaranteed QoS: requests == limits on cpu AND memory, because the front door joined the
    # radio-room set on crew#555 and crew#539 CP9 is that the set the kubelet must evict last is
    # Guaranteed. It was Burstable (50m request, no cpu limit, a 256Mi ceiling four times its
    # request), which is the class the kubelet reaches for second under memory pressure.
    # 300m is a ceiling, not a reservation: this edge carries a handful of internal hostnames at
    # single-digit requests per second, and 300m x 2 replicas is 15% of one 4-OCPU node. Raise
    # both numbers together if that ever stops being true -- raising only the limit silently
    # demotes it back to Burstable, and require-priority-class refuses that at admission.
    resources:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 256Mi
