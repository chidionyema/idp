# crew#584 traces/lean: the chart source lives with the collector so the collector row stands
# without the store. platform/observability (SigNoz, Langfuse) references it by name across
# namespaces through its own copy below.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: signoz
spec:
  interval: 24h
  url: https://charts.signoz.io
