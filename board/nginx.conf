user nginx;
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    access_log         off;
    error_log          /dev/stderr;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    server {
        listen                    80;
        listen                    443 ssl;
        http2                     on;
        server_name               localhost;
        index                     index.php;
        root                      /var/www/app;
        client_max_body_size      32M;

        # https://ssl-config.mozilla.org/#server=nginx&version=1.18.0&config=intermediate&openssl=1.1.1i&hsts=false&ocsp=false&guideline=5.6
        ssl_certificate           /etc/nginx/ssl/kanboard.crt;
        ssl_certificate_key       /etc/nginx/ssl/kanboard.key;
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout       1d;
        ssl_session_cache         shared:MozSSL:10m;
        ssl_session_tickets       off;

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/var/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

            # SEAMLESS, AND STILL SHUT. Founder, 2026-08-24: "in seeing a login scren, too
            # nuch friction, we shoukld take seless security seriously" (LAW 20, LAW 21).
            #
            # The board is published only on 127.0.0.1:3300, so nothing off this laptop can
            # reach it. Anything running ON this laptop can already read data/db.sqlite
            # directly, so the login form was costing a click and guarding nothing. This
            # line hands Kanboard a fixed user, and REVERSE_PROXY_AUTH logs that user in.
            #
            # It is set here rather than trusted from the request on purpose. nginx OVERWRITES
            # any REMOTE_USER a caller sends, so a request cannot choose who it is.
            fastcgi_param REMOTE_USER "founder";
        }

        location ~ /data {
            return 404;
        }

        location ~* ^.+\.(log|sqlite)$ {
            return 404;
        }

        location ~ /\.ht {
            return 404;
        }

        location ~* ^.+\.(ico|jpg|gif|png|css|js|svg|eot|ttf|woff|woff2|otf)$ {
            log_not_found off;
            expires 7d;
            etag on;
        }

        gzip on;
        gzip_comp_level 3;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_types
            text/javascript
            application/javascript
            application/json
            text/xml
            application/xml
            application/rss+xml
            text/css
            text/plain;
    }
}
