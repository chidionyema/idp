# The founder's board. Base definition. AGPL, one container.
#
# WHY IT EXISTS, 2026-08-24. He asked for a visual board because he does not use the
# command line (LAW 31). A session published one to claude.ai; he opened it and got a 404:
#   "we need to nove off claude and pbecone agnostic our own prcesses and tooling"
#   "anything we generate bust be persisted in our patfron, else iot ends upn the void"
#
# WHY KANBOARD AND NOT WEKAN. Wekan needs MongoDB because Meteor needs MongoDB. That is a
# third database class next to Postgres and ClickHouse, a second backup and a second thing
# to break. Founder: "the one with least frictino ad nintenance overhed".
#
# WHERE THIS RUNS. The laptop is the backup environment and the place we prove things work.
# The production cluster is being built and is not this. Founder, 2026-08-24: "this laptop
# is just to prove things work" and "its a backup env, not prod".
#
# THIS FILE ALONE PUBLISHES NO PORT AND BYPASSES NO LOGIN, deliberately. The laptop adds
# both with one overlay, because removing the login is only safe while the port answers to
# one machine. Keeping them apart is what stops the bypass reaching the cluster.
#
#   backup env (this laptop):
#     docker compose -f kanboard.yml -f kanboard.laptop.yml up -d   ->  http://localhost:3300
#   production cluster (not yet):
#     see MIGRATION.md

services:
  kanboard:
    image: kanboard/kanboard:v1.2.46
    container_name: kanboard
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./data:/var/www/app/data
      - ./plugins:/var/www/app/plugins
    environment:
      PLUGIN_INSTALLER: "true"
