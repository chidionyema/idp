version: 1
live_gap_budget: 10
rules:
- id: flux-subst
  fast: true
  label: flux-subst
  statement: No shell parameter expansion (${NAME:-...} and kin) in a Flux-reconciled manifest; Flux substitution rewrites it before the pod runs it
  law: incident 2026-09-06, otto-gateway
  planes:
  - ci
  - session
  session_glob:
  - platform/*.yaml
  - clusters/*.yaml
  run:
  - python3
  - bin/idp-flux-subst-gate
  cluster:
    policy: null
    why: the break is in the repo bytes; admission never sees the pre-substitution form
  fixtures:
    must_fail: tests/fixtures/flux-subst/bad.yaml
    must_pass: tests/fixtures/flux-subst/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/flux-subst/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/flux-subst/good.yaml
  - expect: pass
    live: true
    note: the manifests actually committed
  ok: no manifest hands Flux a shell expansion; the gate is proved both ways
  fail: a manifest hands Flux a shell expansion, or the gate is not discriminating
- id: flux-wait-brake
  fast: true
  label: flux-wait-brake
  statement: 'A Flux Kustomization never sets both wait: true and healthChecks; wait wins, the checks the author wrote are discarded, and the row then waits on every object in its path -- so one optional
    Job going Failed holds every change to that path out of the cluster'
  law: incident 2026-09-10, otto-gateway held out by Job/otto-memory-store-6
  origin: 'The otto-gateway row named one health check, Deployment/otto-gateway, and set wait: true above it. The Deployment was healthy. A one-shot backfill in the same path timed out reaching the LLM
    router, went Failed, and the row reported "failed early due to stalled resources" and stopped applying -- including the change that repairs the router path the backfill could not reach. The Job''s own
    manifest says "If this never runs, nothing breaks". 41 of the estate''s 82 Kustomizations carried the same dead healthChecks list.'
  planes:
  - ci
  - session
  session_glob:
  - clusters/**/*.yaml
  run:
  - python3
  - bin/idp-flux-wait-brake
  cluster:
    policy: null
    why: the break is in the Kustomization spec in git; admission never sees a row's own readiness policy
  fixtures:
    must_fail: tests/fixtures/flux-wait-brake/bad.yaml
    must_pass: tests/fixtures/flux-wait-brake/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/flux-wait-brake/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/flux-wait-brake/good.yaml
  - expect: pass
    live: true
    note: this estate's own cluster rows
  ok: no Kustomization declares healthChecks that wait would throw away
  fail: 'a Kustomization sets wait: true beside a healthChecks list, so the list is dead text and the row is braked by every object in its path'
- id: probe-host
  fast: true
  label: probe-host
  statement: 'No probe or lifecycle handler names a host: PodSecurity restricted refuses the pod at create, not the manifest at apply, so a workload carrying one merges green, reconciles green, and then
    its ReplicaSet fails to make a pod forever while the old pod keeps serving'
  law: incident 2026-09-10, otto-gateway three homes Available=False for hours
  origin: 'The otto-brain sidecar binds 127.0.0.1 by design (R20, and a lifeboat you reach without crossing a network). Its probes were pointed back at loopback with host: 127.0.0.1, which cannot work anyway
    -- the kubelet is not in the pod''s network namespace -- and which PodSecurity restricted forbids outright: "probe or lifecycle host (container \"otto-brain\" uses probe or lifecycle host \"127.0.0.1\")".
    Otto''s three homes merged and never ran. An exec probe runs inside the container, where loopback is the sidecar, and needs no host.'
  planes:
  - ci
  - session
  session_glob:
  - platform/**/*.yaml
  - clusters/**/*.yaml
  run:
  - python3
  - bin/idp-probe-host
  cluster:
    policy: null
    why: PodSecurity restricted already refuses it at pod create in every namespace; this row moves the refusal to the pull request, where it is readable
  fixtures:
    must_fail: tests/fixtures/probe-host/bad.yaml
    must_pass: tests/fixtures/probe-host/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/probe-host/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/probe-host/good.yaml
  - expect: pass
    live: true
    note: this estate's own workloads
  ok: no probe or lifecycle handler names a host
  fail: a probe or lifecycle handler sets host, so PodSecurity restricted will refuse every pod the workload tries to create while the manifest itself stays green
- id: cloud-agnostic
  label: agnostic
  statement: No provider-specific annotation or Service outside the compute provisioner
  law: R36
  origin: crew#250
  planes:
  - ci
  run:
  - python3
  - bin/cloud-agnostic-gate
  fixtures:
    must_fail: tests/fixtures/cloud-agnostic/bad
    must_pass: tests/fixtures/cloud-agnostic/good
  cases:
  - expect: refuse
    env:
      CLOUD_AGNOSTIC_ROOT: tests/fixtures/cloud-agnostic/bad
  - expect: pass
    env:
      CLOUD_AGNOSTIC_ROOT: tests/fixtures/cloud-agnostic/good
  - expect: pass
    live: true
  ok: cloud-agnostic-gate refuses a provider annotation, permits a plain Service, and the repo is clean
  fail: cloud-agnostic-gate is not discriminating or the platform names a cloud outside platform/oci
- id: estate-zone
  label: zone
  statement: The DNS zone is one value in clusters/*/estate-config.yaml; a platform file naming it as a literal fails, in the tree and in a pull-request diff
  law: R46
  origin: crew#269, crew#796
  planes:
  - ci
  run:
  - python3
  - bin/estate-zone-gate
  fixtures:
    must_fail: tests/fixtures/estate-zone/bad
    must_pass: tests/fixtures/estate-zone/good
  cases:
  - expect: refuse
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
  - expect: pass
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/good
  - expect: refuse
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
    args:
    - --diff
    - tests/fixtures/estate-zone/added-literal.diff
  - expect: pass
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
    args:
    - --diff
    - tests/fixtures/estate-zone/added-substituted.diff
  - expect: pass
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
    args:
    - --diff
    - tests/fixtures/estate-zone/added-self-marker.diff
  - expect: pass
    live: true
  ok: estate-zone-gate refuses a literal zone (tree and diff), permits the substituted form, and the repo is clean
  fail: estate-zone-gate is not discriminating or the platform names the zone outside clusters/*/estate-config.yaml
- id: port-lock
  label: portlock
  statement: A compose publication not declared in catalog/ports.yaml, or off loopback without non_loopback, fails
  law: R22 mechanism 4, R20
  origin: crew#186 CP4
  planes:
  - ci
  run:
  - python3
  - bin/port-gate
  fixtures:
    must_fail: tests/fixtures/ports-bad
    must_pass: catalog/ports.yaml
  cases:
  - expect: refuse
    env:
      COMPOSE_GLOB: tests/fixtures/ports-bad/*.yml
  - expect: pass
    live: true
    tail_of: true
  ok: '{tail}'
  tail_strip: ^ports\s+
  ok_fallback: port-gate refuses an undeclared publication and passes the repo
  fail: port-gate is not discriminating or the repo has an undeclared bind
- id: port-bind
  label: portbind
  statement: A listener bound to a different address than its ports.yaml row declares is refused
  law: R20
  planes:
  - ci
  run:
  - python3
  - bin/port-gate
  - --live
  fixtures:
    must_fail: tests/fixtures/ports-live/inventory.bad.json
    must_pass: tests/fixtures/ports-live/inventory.good.json
  cases:
  - expect: refuse
    env:
      REG: tests/fixtures/ports-live/ports.yaml
      INV: tests/fixtures/ports-live/inventory.bad.json
      COMPOSE_GLOB: none
      BIN_DIR: none
  - expect: pass
    env:
      REG: tests/fixtures/ports-live/ports.yaml
      INV: tests/fixtures/ports-live/inventory.good.json
      COMPOSE_GLOB: none
      BIN_DIR: none
  ok: port-gate --live refuses a bind that differs from the declared address and passes a matching one
  fail: port-gate --live does not discriminate on bind address
- id: security-policy
  label: security
  statement: A control on the security policy page without a proof command that exists is a wish
  law: LAW 44
  origin: crew#198
  planes:
  - ci
  run:
  - python3
  - bin/security-policy-gate
  fixtures:
    must_fail: tests/fixtures/security-policy/bad.md
    must_pass: tests/fixtures/security-policy/good.md
  cases:
  - expect: refuse
    args:
    - tests/fixtures/security-policy/bad.md
  - expect: pass
    args:
    - tests/fixtures/security-policy/good.md
  - expect: pass
    live: true
  ok: every control on docs/reference/security-policy.md names a proof command that exists; gate proved both ways
  fail: security-policy-gate does not discriminate, or a control has no proof
- id: root-trust
  label: root-trust
  statement: Every vault entry an ExternalSecret reads is born by a bootstrapper on disk or ticketed
  law: R52
  origin: crew#66 ruling 5453747447, crew#580
  planes:
  - ci
  proved_elsewhere: tests/test_incident_crew66_root_trust_register.py refuses a register with a missing bootstrapper and admits a complete one; the case here is the live register
  run:
  - python3
  - bin/idp-root-trust
  fixtures:
    must_fail: tests/test_incident_crew66_root_trust_register.py
    must_pass: platform/secrets
  cases:
  - expect: pass
    live: true
    tail_of: true
  ok: '{tail}'
  tail_strip: ^root-trust:\s*
  ok_fallback: every ExternalSecret credential is registered
  fail: an ExternalSecret reads a credential nobody registered, or a register row has no bootstrapper/ticket
- id: ai-act
  label: ai-act
  statement: Every registered AI system has its Annex IV file, risk entries and declared data (Arts. 9, 10, 11)
  law: AI Act, kept voluntarily
  origin: crew#202
  planes:
  - ci
  run:
  - python3
  - bin/ai-act-gate
  fixtures:
    must_fail: tests/fixtures/ai-act/bad
    must_pass: tests/fixtures/ai-act/good
  cases:
  - expect: refuse
    env:
      TODAY: '2026-08-25'
    args:
    - tests/fixtures/ai-act/bad
  - expect: pass
    env:
      TODAY: '2026-08-25'
    args:
    - tests/fixtures/ai-act/good
  - expect: pass
    live: true
    args:
    - .
  ok: every registered AI system has its Annex IV file, risk entries and declared data; gate proved both ways
  fail: ai-act-gate does not discriminate, or a registered system has a gap
- id: law32-demo-onboarding
  label: law32
  statement: A new bin file ships with docs/tutorials/demo and docs/how-to/onboarding, above the prose floor and in the nav
  law: LAW 32
  origin: founder 2026-08-25
  planes:
  - ci
  run:
  - python3
  - bin/law32-gate
  fixtures:
    must_fail: bin/feature-with-no-pages
    must_pass: bin/supply-chain
  cases:
  - expect: pass
    args:
    - --added
    - bin/supply-chain
  - expect: refuse
    args:
    - --added
    - bin/feature-with-no-pages
  - expect: pass
    live: true
  ok: every new bin file has its demo and onboarding; every page is above the prose floor and in the nav; gate proved both ways
  fail: a feature shipped without demo/onboarding, or a page is thin or unlisted
- id: plist-renders
  label: plist
  statement: Every launchd template renders to a plist that parses and names its job
  law: LAW 45
  origin: idp#49
  planes:
  - ci
  run:
  - python3
  - bin/plist-gate
  fixtures:
    must_fail: tests/fixtures/plist/bad.plist.tmpl
    must_pass: tests/fixtures/plist/abandoned-children.plist.tmpl
  cases:
  - expect: pass
    live: true
  - expect: refuse
    args:
    - tests/fixtures/plist/bad.plist.tmpl
  - expect: refuse
    args:
    - tests/fixtures/plist/bare-argv.plist.tmpl
  - expect: refuse
    args:
    - tests/fixtures/plist/orphaned-children.plist.tmpl
  - expect: pass
    args:
    - tests/fixtures/plist/abandoned-children.plist.tmpl
  ok: every launchd template renders to a plist that parses and names its job; gate proved both ways
  fail: a launchd template does not render to a valid plist, or the gate does not discriminate
- id: migration-idempotent
  label: migration
  statement: A migration whose second apply adds a resource is refused
  law: R22 mechanism 1
  origin: crew#186 CP1
  planes:
  - ci
  proved_elsewhere: the permitting case is the live migration rung in bin/idp-ci, which applies bin/scheduler-migrate twice and rolls it back under a real dagster
  run:
  - bin/migration-gate
  fixtures:
    must_fail: tests/fixtures/migration-not-idempotent
    must_pass: bin/scheduler-migrate
  live_elsewhere: bin/idp-ci:337 -- the migration rung applies bin/scheduler-migrate twice against a real dagster and rolls it back
  cases:
  - expect: refuse
    args:
    - tests/fixtures/migration-not-idempotent
  ok: migration-gate refuses the non-idempotent fixture
  fail: migration-gate accepted a migration whose second apply adds a resource
- id: static-secret
  label: secrets
  statement: Zero static secrets on disk; a key or a .env in the tree is refused
  law: security-policy.md, kini-master-spec 4.1/4.4
  origin: crew#227
  planes:
  - ci
  run:
  - bin/static-secret-gate
  fixtures:
    must_fail: tests/fixtures/static-secret/bad
    must_pass: tests/fixtures/static-secret/good
  cases:
  - expect: pass
    env:
      STATIC_SECRET_GATE_ROOT: tests/fixtures/static-secret/good
      ESTATE_CODE: tests/fixtures/static-secret/good
      ESTATE_SECRETS: tests/fixtures/static-secret/good/vault
  - expect: refuse
    env:
      STATIC_SECRET_GATE_ROOT: tests/fixtures/static-secret/bad
      ESTATE_CODE: tests/fixtures/static-secret/bad/code
      ESTATE_SECRETS: tests/fixtures/static-secret/good/vault
  ok: static-secret-gate passes the empty fixture and refuses the one with a key and a .env
  fail: static-secret-gate fixtures
- id: owner-account
  label: owners
  statement: Every provider account names a second owner
  law: R54
  planes:
  - ci
  run:
  - bin/owner-account-gate
  fixtures:
    must_fail: tests/fixtures/owner-accounts/bad.yaml
    must_pass: tests/fixtures/owner-accounts/good.yaml
  live_gap: 'chidionyema/idp#2452 -- pointed at docs/reference/owner-accounts.yaml, the file it exists to grade, this gate exits 1: six provider accounts name no second owner. The live case lands with the
    fix, not before it.'
  cases:
  - expect: pass
    args:
    - tests/fixtures/owner-accounts/good.yaml
  - expect: refuse
    args:
    - tests/fixtures/owner-accounts/bad.yaml
  ok: owner-account-gate passes a provider with a second owner and refuses one without
  fail: owner-account-gate fixtures
- id: bind-audit
  label: binds
  statement: Only the gateway binds a non-loopback address; everything else is 127.0.0.1 or nothing
  law: R20
  planes:
  - ci
  run:
  - bin/bind-audit
  fixtures:
    must_fail: tests/fixtures/listeners.bad.txt
    must_pass: tests/fixtures/listeners.good.txt
  cases:
  - expect: refuse
    args:
    - --table
    - tests/fixtures/listeners.bad.txt
  - expect: pass
    args:
    - --table
    - tests/fixtures/listeners.good.txt
  - expect: pass
    args:
    - --selftest
    note: the allow-list parser, which would otherwise rot silently
  ok: bind-audit refuses an unknown listener and permits an allow-listed one; selftest green
  fail: bind-audit does not discriminate on the recorded listener tables
- id: conscience
  label: ethos
  statement: The founder's ethos is seven measured tenet rows; a row without a command is refused
  law: LAW 44
  origin: crew#586 CP1
  planes:
  - ci
  proved_elsewhere: 'bin/idp-conscience --selftest is itself the both-ways proof: it scores the good fixture 2/2, the bad one 1/2, and refuses a tenet with no command'
  run:
  - python3
  - bin/idp-conscience
  - --selftest
  fixtures:
    must_fail: a tenet row with no command
    must_pass: bin/idp-conscience
  live_elsewhere: .github/workflows/conscience.yml:94 -- the conscience job runs the gate bare over the estate's own tenet rows, not the selftest
  cases:
  - expect: pass
  ok: idp-conscience scores the good fixture 2/2, the bad 1/2, and refuses a tenet with no command
  fail: bin/idp-conscience --selftest
- id: job-described
  label: describe
  statement: Every scheduled job reaches the Dagster UI with a description of what it does
  law: LAW 28
  planes:
  - ci
  proved_elsewhere: 'estate_scheduler.describe --selftest is the both-ways proof: it derives a description through a wrapper and refuses to invent one from a command line'
  run:
  - python3
  - -m
  - estate_scheduler.describe
  - --selftest
  cwd: scheduler
  fixtures:
    must_fail: tests/fixtures/schedule-undescribed.yml
    must_pass: tests/fixtures/schedule-described.yml
  live_gap: 'chidionyema/idp#2452 -- the selftest grades the describer, not the estate''s schedules. bin/idp-verify:170 runs it for real, and bin/idp-verify is invoked by no workflow: a gate that runs only
    when somebody types it is not a plane.'
  cases:
  - expect: pass
  ok: job descriptions derive from the script, and are refused when absent
  fail: estate_scheduler.describe --selftest
- id: vm-shared-path
  label: vmmount
  statement: A VM mount source outside the shared tree is refused; one inside it is permitted
  law: R19
  planes:
  - ci
  run:
  - bin/vm-shared-path
  fixtures:
    must_fail: /private/tmp
    must_pass: $HOME
  cases:
  - expect: pass
    env:
      VM_SHARED_ROOTS: $HOME
    args:
    - $HOME
  - expect: refuse
    env:
      VM_SHARED_ROOTS: $HOME
    args:
    - /private/tmp
  ok: vm-shared-path permits a path under the shared root and refuses one outside it
  fail: bin/vm-shared-path selftest
- id: ns-fence
  label: fences
  statement: No namespace without a both-ways default-deny NetworkPolicy, a ResourceQuota, a LimitRange and a DNS exception
  law: crew#191, crew#839
  planes:
  - ci
  - cluster
  run:
  - python3
  - bin/ns-fence-gate
  cluster:
    policy: platform/kyverno
    why: admission refuses a namespace with no fence
  fixtures:
    must_fail: tests/fixtures/ns-fence/bad.yaml
    must_pass: tests/fixtures/ns-fence/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/ns-fence/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/ns-fence/good.yaml
  - expect: pass
    args:
    - platform
    live: true
    tail_of: true
    note: the namespaces actually committed
  ok: '{tail}'
  tail_strip: ^ns-fence-gate:\s*
  ok_fallback: every namespace under platform/ ships a fence
  fail: a namespace ships with no fence; add it to platform/ns-fences/allowances.yaml and run bin/idp-ns-fence-gen
- id: main-verdict
  label: verdict
  statement: A workflow that grades main never cancels main's own run; stale pull-request runs still are
  law: crew#865
  planes:
  - ci
  run:
  - python3
  - bin/main-verdict-gate
  fixtures:
    must_fail: tests/fixtures/main-verdict/bad.yml
    must_pass: tests/fixtures/main-verdict/good.yml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/main-verdict/bad.yml
  - expect: pass
    args:
    - tests/fixtures/main-verdict/good.yml
  - expect: pass
    live: true
    tail_of: true
    note: .github/workflows, where a real regression fails it
  ok: '{tail}'
  tail_strip: ^main-verdict\s+
  ok_fallback: no workflow cancels main's own run
  fail: bin/main-verdict-gate refuses .github/workflows/
- id: prose-pin
  label: prose
  statement: 'A test grades behavior or parsed structure, never prose: no test function may only assert sentences or string membership in file text'
  law: R76
  origin: founder 2026-09-03
  planes:
  - ci
  - session
  session_glob:
  - tests/test_*.py
  - sovereign/tests/*.py
  run:
  - python3
  - bin/test-prose-gate
  fixtures:
    must_fail: tests/fixtures/prose-pin/bad.py
    must_pass: tests/fixtures/prose-pin/good.py
  cases:
  - expect: refuse
    args:
    - tests/fixtures/prose-pin/bad.py
  - expect: pass
    args:
    - tests/fixtures/prose-pin/good.py
  - expect: pass
    live: true
    glob: tests/test_*.py
  ok: no test function only asserts prose/string membership in file text (R76)
  fail: a test function only asserts prose/string membership in file text (R76)
- id: tenant-split
  label: twohats
  statement: One credential is one tenant's; the operator's road never widens the customer's
  law: decision 0021
  planes:
  - ci
  run:
  - python3
  - bin/idp-tenant-split
  fixtures:
    must_fail: tests/fixtures/tenant-split/bad.yaml
    must_pass: tests/fixtures/tenant-split/good.yaml
  live_gap: chidionyema/idp#2452 -- a bare run over the repository returns 15 findings, every one of the shape 'no data.seed.sql to grade'. That reads like the gate scanning past its own subject rather
    than 15 tenant defects, and it wants reading before either is claimed.
  cases:
  - expect: refuse
    args:
    - tests/fixtures/tenant-split/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/tenant-split/good.yaml
  ok: idp-tenant-split refuses one secret under two tenants; the clean split passes
  fail: idp-tenant-split cannot tell one-secret-one-tenant from a leak (decision 0021)
- id: jit-grants
  label: jitgrant
  statement: 'A grant the JIT broker may mint can never be turned into standing access: no token for a verb that rewrites a pod spec, no secrets or RBAC, no core namespace, no wildcard, a TTL under the
    ceiling and a declared rate'
  law: WJ.5
  planes:
  - ci
  run:
  - python3
  - bin/idp-jit-grants
  fixtures:
    must_fail: tests/fixtures/jit-grants/bad.yaml
    must_pass: tests/fixtures/jit-grants/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/jit-grants/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/jit-grants/good.yaml
  - expect: pass
    args:
    - platform/jit/grants.yaml
    live: true
    note: the catalogue the broker actually mints from
  ok: idp-jit-grants refuses the escalating catalogue; the live one cannot become standing access
  fail: idp-jit-grants cannot tell a time-boxed grant from a route to admin (WJ.5)
- id: fence-enforcement
  label: fencdrill
  statement: A profile of a denied packet is only ever a wall when the probe proved it could reach an allowed path; a probe that could not run is a fail-closed FAIL, never a pass
  law: zero-trust-boundary.md step 1
  planes:
  - ci
  run:
  - python3
  - bin/idp-fence-enforcement
  fixtures:
    must_fail: tests/fixtures/fence-drill/gate-broken-fence.json
    must_pass: tests/fixtures/fence-drill/gate-good.json
  live_gap: chidionyema/idp#2452 -- the input is a fence drill receipt and nothing in .github writes one, so the three fixtures are the only fence profiles this rule has ever read.
  cases:
  - expect: pass
    args:
    - tests/fixtures/fence-drill/gate-good.json
  - expect: refuse
    args:
    - tests/fixtures/fence-drill/gate-broken-fence.json
  - expect: refuse
    args:
    - tests/fixtures/fence-drill/gate-fail-closed.json
    note: a probe that never ran (shell 127) once read as a passing wall
  ok: fence-enforcement drops a denied packet, fails closed when the probe could not run
  fail: fence-enforcement cannot tell a dropped packet from a leak or a dead probe (ZT step 1)
- id: calico-denyflow
  label: denyflow
