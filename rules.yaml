    statement: Zero static secrets on disk; a key or a .env in the tree is refused
    law: security-policy.md, kini-master-spec 4.1/4.4
    origin: crew#227
    planes: [ci]
    run: [bin/static-secret-gate]
    fixtures: {must_fail: tests/fixtures/static-secret/bad, must_pass: tests/fixtures/static-secret/good}
    cases:
      - expect: pass
        env: {STATIC_SECRET_GATE_ROOT: tests/fixtures/static-secret/good, ESTATE_CODE: tests/fixtures/static-secret/good, ESTATE_SECRETS: tests/fixtures/static-secret/good/vault}
      - expect: refuse
        env: {STATIC_SECRET_GATE_ROOT: tests/fixtures/static-secret/bad, ESTATE_CODE: tests/fixtures/static-secret/bad/code, ESTATE_SECRETS: tests/fixtures/static-secret/good/vault}
    ok: "static-secret-gate passes the empty fixture and refuses the one with a key and a .env"
    fail: "static-secret-gate fixtures"

  - id: owner-account
    label: owners
    statement: Every provider account names a second owner
    law: R54
    planes: [ci]
    run: [bin/owner-account-gate]
    fixtures: {must_fail: tests/fixtures/owner-accounts/bad.yaml, must_pass: tests/fixtures/owner-accounts/good.yaml}
    live_gap: "chidionyema/idp#2452 -- pointed at docs/reference/owner-accounts.yaml, the file it exists to grade, this gate exits 1: six provider accounts name no second owner. The live case lands with the fix, not before it."
    cases:
      - {expect: pass, args: [tests/fixtures/owner-accounts/good.yaml]}
      - {expect: refuse, args: [tests/fixtures/owner-accounts/bad.yaml]}
    ok: "owner-account-gate passes a provider with a second owner and refuses one without"
    fail: "owner-account-gate fixtures"

  - id: bind-audit
    label: binds
    statement: Only the gateway binds a non-loopback address; everything else is 127.0.0.1 or nothing
    law: R20
    planes: [ci]
    run: [bin/bind-audit]
    fixtures: {must_fail: tests/fixtures/listeners.bad.txt, must_pass: tests/fixtures/listeners.good.txt}
    cases:
      - {expect: refuse, args: [--table, tests/fixtures/listeners.bad.txt]}
      - {expect: pass, args: [--table, tests/fixtures/listeners.good.txt]}
      - {expect: pass, args: [--selftest], note: "the allow-list parser, which would otherwise rot silently"}
    ok: "bind-audit refuses an unknown listener and permits an allow-listed one; selftest green"
    fail: "bind-audit does not discriminate on the recorded listener tables"

  - id: conscience
    label: ethos
    statement: The founder's ethos is seven measured tenet rows; a row without a command is refused
    law: LAW 44
    origin: crew#586 CP1
    planes: [ci]
    proved_elsewhere: >-
      bin/idp-conscience --selftest is itself the both-ways proof: it scores the good fixture 2/2, the bad one 1/2, and refuses a tenet with no command
    run: [python3, bin/idp-conscience, --selftest]
    fixtures: {must_fail: "a tenet row with no command", must_pass: bin/idp-conscience}
    live_elsewhere: ".github/workflows/conscience.yml:94 -- the conscience job runs the gate bare over the estate's own tenet rows, not the selftest"
    cases:
      - {expect: pass}
    ok: "idp-conscience scores the good fixture 2/2, the bad 1/2, and refuses a tenet with no command"
    fail: "bin/idp-conscience --selftest"

  - id: job-described
    label: describe
    statement: Every scheduled job reaches the Dagster UI with a description of what it does
    law: LAW 28
    planes: [ci]
    proved_elsewhere: >-
      estate_scheduler.describe --selftest is the both-ways proof: it derives a description through a wrapper and refuses to invent one from a command line
    run: [python3, -m, estate_scheduler.describe, --selftest]
    cwd: scheduler
    fixtures: {must_fail: tests/fixtures/schedule-undescribed.yml, must_pass: tests/fixtures/schedule-described.yml}
    live_gap: "chidionyema/idp#2452 -- the selftest grades the describer, not the estate's schedules. bin/idp-verify:170 runs it for real, and bin/idp-verify is invoked by no workflow: a gate that runs only when somebody types it is not a plane."
    cases:
      - {expect: pass}
    ok: "job descriptions derive from the script, and are refused when absent"
    fail: "estate_scheduler.describe --selftest"

  - id: vm-shared-path
    label: vmmount
    statement: A VM mount source outside the shared tree is refused; one inside it is permitted
    law: R19
    planes: [ci]
    run: [bin/vm-shared-path]
    fixtures: {must_fail: /private/tmp, must_pass: $HOME}
    cases:
      - {expect: pass, env: {VM_SHARED_ROOTS: "$HOME"}, args: ["$HOME"]}
      - {expect: refuse, env: {VM_SHARED_ROOTS: "$HOME"}, args: [/private/tmp]}
    ok: "vm-shared-path permits a path under the shared root and refuses one outside it"
    fail: "bin/vm-shared-path selftest"

  - id: ns-fence
    label: fences
    statement: >-
      No namespace without a both-ways default-deny NetworkPolicy, a ResourceQuota, a LimitRange
      and a DNS exception
    law: crew#191, crew#839
    planes: [ci, cluster]
    run: [python3, bin/ns-fence-gate]
    cluster: {policy: platform/kyverno, why: "admission refuses a namespace with no fence"}
    fixtures: {must_fail: tests/fixtures/ns-fence/bad.yaml, must_pass: tests/fixtures/ns-fence/good.yaml}
    cases:
      - {expect: refuse, args: [tests/fixtures/ns-fence/bad.yaml]}
      - {expect: pass, args: [tests/fixtures/ns-fence/good.yaml]}
      - {expect: pass, args: [platform], live: true, tail_of: true, note: "the namespaces actually committed"}
    ok: "{tail}"
    tail_strip: '^ns-fence-gate:\s*'
    ok_fallback: "every namespace under platform/ ships a fence"
    fail: "a namespace ships with no fence; add it to platform/ns-fences/allowances.yaml and run bin/idp-ns-fence-gen"

  - id: main-verdict
    label: verdict
    statement: A workflow that grades main never cancels main's own run; stale pull-request runs still are
    law: crew#865
    planes: [ci]
    run: [python3, bin/main-verdict-gate]
    fixtures: {must_fail: tests/fixtures/main-verdict/bad.yml, must_pass: tests/fixtures/main-verdict/good.yml}
    cases:
      - {expect: refuse, args: [tests/fixtures/main-verdict/bad.yml]}
      - {expect: pass, args: [tests/fixtures/main-verdict/good.yml]}
      - {expect: pass, live: true, tail_of: true, note: ".github/workflows, where a real regression fails it"}
    ok: "{tail}"
    tail_strip: '^main-verdict\s+'
    ok_fallback: "no workflow cancels main's own run"
    fail: "bin/main-verdict-gate refuses .github/workflows/"

  - id: prose-pin
    label: prose
    statement: >-
      A test grades behavior or parsed structure, never prose: no test function may only assert
      sentences or string membership in file text
    law: R76
    origin: founder 2026-09-03
    planes: [ci, session]
    session_glob: ['tests/test_*.py', 'sovereign/tests/*.py']
    run: [python3, bin/test-prose-gate]
    fixtures: {must_fail: tests/fixtures/prose-pin/bad.py, must_pass: tests/fixtures/prose-pin/good.py}
    cases:
      - {expect: refuse, args: [tests/fixtures/prose-pin/bad.py]}
      - {expect: pass, args: [tests/fixtures/prose-pin/good.py]}
      - {expect: pass, live: true, glob: "tests/test_*.py"}
    ok: "no test function only asserts prose/string membership in file text (R76)"
    fail: "a test function only asserts prose/string membership in file text (R76)"

  - id: tenant-split
