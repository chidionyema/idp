# The estate's rule registry. One row per rule; every plane reads this file.
#
# Why this file exists (founder 2026-09-07, docs/founder/2026-09-07T1719Z-ere-is-the-blunt-expert-
# architectural-analysis-of-d2f5ead9.md): LAW 44 ("a law without a protocol is a wish") and LAW 45
# ("your mistake ends as a guard no session can walk past") made a new executable the required
# output of every mistake, and nothing was ever retired. A rule's statement, its wiring, its
# fixtures and its verdict message lived in four places -- the AGENTS.md table, a hand-written
# rung in bin/idp-ci, a case list inside bin/policy-test, and the gate script itself -- and they
# drifted. Measured on 2026-09-07: 15 policy fixtures under policy/fixtures were graded by nothing
# at all, and the AGENTS.md table declared fixture pairs no rung ran.
#
# A row is the rule. `run` names the one script that implements it; `cases` are the inputs and the
# verdict each must produce; `ok`/`fail` are the lines the CI plane prints. bin/idp-rules is the
# only engine: bin/idp-ci calls it, AGENTS.md's table is generated from it, and the cluster
# adapter reads `cluster:` to say which rules have an admission twin.
#
# Adding a rule: add a row here with at least one refusing case and one passing case, and run
# `bin/idp-rules run`. There is no second place to edit.
version: 1

# The ceiling on rules that admit in live_gap that they have no real input yet. bin/idp-rules
# refuses a run where more rules than this name a gap, so the number may only fall. An escape
# hatch with no ratchet is how a temporary exception becomes the permanent state.
live_gap_budget: 10

rules:
  - id: flux-subst
    fast: true   # cheap enough for the 60-second fast gate
    label: flux-subst
    statement: >-
      No shell parameter expansion (${NAME:-...} and kin) in a Flux-reconciled manifest; Flux
      substitution rewrites it before the pod runs it
    law: incident 2026-09-06, otto-gateway
    planes: [ci, session]
    session_glob: ['platform/*.yaml', 'clusters/*.yaml']
    run: [python3, bin/idp-flux-subst-gate]
    cluster: {policy: null, why: "the break is in the repo bytes; admission never sees the pre-substitution form"}
    fixtures: {must_fail: tests/fixtures/flux-subst/bad.yaml, must_pass: tests/fixtures/flux-subst/good.yaml}
    cases:
      - {expect: refuse, args: [tests/fixtures/flux-subst/bad.yaml]}
      - {expect: pass, args: [tests/fixtures/flux-subst/good.yaml]}
      - {expect: pass, live: true, note: "the manifests actually committed"}
    ok: "no manifest hands Flux a shell expansion; the gate is proved both ways"
    fail: "a manifest hands Flux a shell expansion, or the gate is not discriminating"

  - id: cloud-agnostic
    label: agnostic
    statement: No provider-specific annotation or Service outside the compute provisioner
    law: R36
    origin: crew#250
    planes: [ci]
    run: [python3, bin/cloud-agnostic-gate]
    fixtures: {must_fail: tests/fixtures/cloud-agnostic/bad, must_pass: tests/fixtures/cloud-agnostic/good}
    cases:
      - {expect: refuse, env: {CLOUD_AGNOSTIC_ROOT: tests/fixtures/cloud-agnostic/bad}}
      - {expect: pass, env: {CLOUD_AGNOSTIC_ROOT: tests/fixtures/cloud-agnostic/good}}
      - {expect: pass, live: true}
    ok: "cloud-agnostic-gate refuses a provider annotation, permits a plain Service, and the repo is clean"
    fail: "cloud-agnostic-gate is not discriminating or the platform names a cloud outside platform/oci"

  - id: estate-zone
    label: zone
    statement: >-
      The DNS zone is one value in clusters/*/estate-config.yaml; a platform file naming it as a
      literal fails, in the tree and in a pull-request diff
    law: R46
    origin: crew#269, crew#796
    planes: [ci]
    run: [python3, bin/estate-zone-gate]
    fixtures: {must_fail: tests/fixtures/estate-zone/bad, must_pass: tests/fixtures/estate-zone/good}
    cases:
      - {expect: refuse, env: {ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad}}
      - {expect: pass, env: {ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/good}}
      - {expect: refuse, env: {ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad}, args: [--diff, tests/fixtures/estate-zone/added-literal.diff]}
      - {expect: pass, env: {ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad}, args: [--diff, tests/fixtures/estate-zone/added-substituted.diff]}
      - {expect: pass, env: {ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad}, args: [--diff, tests/fixtures/estate-zone/added-self-marker.diff]}
      - {expect: pass, live: true}
    ok: "estate-zone-gate refuses a literal zone (tree and diff), permits the substituted form, and the repo is clean"
    fail: "estate-zone-gate is not discriminating or the platform names the zone outside clusters/*/estate-config.yaml"

  - id: port-lock
    label: portlock
    statement: A compose publication not declared in catalog/ports.yaml, or off loopback without non_loopback, fails
    law: R22 mechanism 4, R20
    origin: crew#186 CP4
    planes: [ci]
    run: [python3, bin/port-gate]
    fixtures: {must_fail: tests/fixtures/ports-bad, must_pass: catalog/ports.yaml}
    cases:
      - {expect: refuse, env: {COMPOSE_GLOB: "tests/fixtures/ports-bad/*.yml"}}
      - {expect: pass, live: true, tail_of: true}
    ok: "{tail}"
    tail_strip: '^ports\s+'
    ok_fallback: "port-gate refuses an undeclared publication and passes the repo"
    fail: "port-gate is not discriminating or the repo has an undeclared bind"

  - id: port-bind
    label: portbind
    statement: A listener bound to a different address than its ports.yaml row declares is refused
    law: R20
    planes: [ci]
    run: [python3, bin/port-gate, --live]
    fixtures: {must_fail: tests/fixtures/ports-live/inventory.bad.json, must_pass: tests/fixtures/ports-live/inventory.good.json}
    cases:
      - expect: refuse
        env: {REG: tests/fixtures/ports-live/ports.yaml, INV: tests/fixtures/ports-live/inventory.bad.json, COMPOSE_GLOB: none, BIN_DIR: none}
      - expect: pass
        env: {REG: tests/fixtures/ports-live/ports.yaml, INV: tests/fixtures/ports-live/inventory.good.json, COMPOSE_GLOB: none, BIN_DIR: none}
    ok: "port-gate --live refuses a bind that differs from the declared address and passes a matching one"
    fail: "port-gate --live does not discriminate on bind address"

  - id: security-policy
