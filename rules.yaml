- id: trajectory
  label: trajectory
  gate: null
  statement: 'An agent''s action is refused when it serves no goal the agent itself declared: cognitive drift is bounded by a per-goal budget and a context reset, not by asking the model to stay on topic'
  law: founder 2026-09-12, the Teleological Firewall
  origin: incident 2026-09-12, a session that spent a third of its turns outside its stated goal
  planes:
  - ci
  run:
  - python3
  - bin/idp-trajectory
  fixtures:
