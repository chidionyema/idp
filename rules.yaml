  - id: pipeverdict
    label: pipeverdict
    statement: >-
      A conditional's verdict is never a pipeline into grep in a script that sets pipefail: a
      failing left-hand stage inverts the answer silently. Capture the output first and grade the
      text.
    law: LAW 55
    origin: incident 2026-08-25 (port-gate exited 1 on purpose and the leg failed with the message
      exactly right)
    planes: [ci, session]
    session_glob: ["bin/*", "*.sh"]
    fast: true
    run: [bin/idp-pipeverdict]
    fixtures:
      must_fail: tests/fixtures/pipefail-verdict.bad.sh
      must_pass: tests/fixtures/pipefail-verdict.good.sh
    cases:
      - expect: refuse
        args: [tests/fixtures/pipefail-verdict.bad.sh]
      - expect: pass
        args: [tests/fixtures/pipefail-verdict.good.sh]
      # The scope this rule was moved out of read bin/* and nothing else. This case reads all 231
      # tracked shell files, 8 of them outside bin/, and it is why the widening was safe to make:
      # measured at zero hits over those 8 before the move, not after. (The number in this comment
      # was 632 until idp-1a counted it on #2390; nobody had taken it.)
      - expect: pass
        live: true
    ok: "no shell file lets a pipeline exit status stand in for a grep match (LAW 55)"
    fail: "a shell file lets a pipeline exit status stand in for a grep match (LAW 55)"

  # --- decision 0026: Crossplane owns Day-2 and OpenTofu owns the ground. The guard predates the
  #     thing it guards -- this row is step 1 of that record's order of work, written and green
  #     before any operator is installed, so the first Claim ever merged is already judged.
  - id: split-brain
    label: split
    fast: true   # a regex walk of platform/oci plus the YAML that names a Crossplane group
    statement: >-
      One cloud resource has exactly one owner: a Crossplane external-name that matches an
      OpenTofu resource under platform/oci is two controllers undoing each other, forever
    law: decision 0026
    origin: founder 2026-09-07, "i think if crossplane has benefits for us we need to work out how to fit it in"
    planes: [ci]
    run: [python3, bin/idp-split-brain]
    fixtures:
      must_fail: tests/fixtures/split-brain/bad
      must_pass: tests/fixtures/split-brain/good
    cases:
      - {expect: refuse, args: [tests/fixtures/split-brain/bad]}
      - {expect: pass, args: [tests/fixtures/split-brain/good]}
      - {expect: pass, live: true, note: "the estate's own tree, which owns nothing with Crossplane yet"}
    ok: "no cloud object is claimed by both OpenTofu and Crossplane"
    fail: "a cloud object is claimed by both OpenTofu and Crossplane; each controller will undo the other at the reconcile interval"

  - id: mechanism
    label: mechanism
    fast: true
    statement: >-
      A mechanism this repository depends on may not be switched off, deleted or unproduced:
      every `uses:` resolves to a workflow in the tree, and every workflow GitHub is not
      running is named with a reason in .github/workflows/disabled.yaml
    law: "incident 2026-09-08, ten days of nothing merging and nothing red"
    origin: 'founder 2026-09-08, "agents should be responsiblefor their own own, all this chasing is fricion"'
