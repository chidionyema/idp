  law: founder essay 2026-09-14, the Reasoning Gateway ("Design-by-Contract for Tool Calls... A deterministic script (NOT the agent) checks the post-condition against the live system. If it fails, the PRM penalises the trajectory and the agent is forced to adapt before continuing")
