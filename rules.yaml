    cases:
      - {expect: pass, live: true, tail_of: true}
    ok: "{tail}"
    tail_strip: '^root-trust:\s*'
    ok_fallback: "every ExternalSecret credential is registered"
    fail: "an ExternalSecret reads a credential nobody registered, or a register row has no bootstrapper/ticket"

  - id: ai-act
