    cases:
      - {expect: refuse, args: [tests/fixtures/security-policy/bad.md]}
      - {expect: pass, args: [tests/fixtures/security-policy/good.md]}
      - {expect: pass, live: true}
    ok: "every control on docs/reference/security-policy.md names a proof command that exists; gate proved both ways"
    fail: "security-policy-gate does not discriminate, or a control has no proof"

