  fixtures:
    must_fail: tests/fixtures/catalog-platform-owner/bad.py
    must_pass: tests/fixtures/catalog-platform-owner/good.py
  live_elsewhere: bin/idp-ci:236 -- the layers rung runs catalog-platform --check, which calls the same missing_owners() guard against the real LAYERS dict, not the fixture pair
  cases:
  - expect: refuse
    args:
    - tests/fixtures/catalog-platform-owner/bad.py
  - expect: pass
    args:
    - tests/fixtures/catalog-platform-owner/good.py
  ok: every layer in the fixture carries a real owner group
  fail: a layer has no owner, or the guard is not discriminating
