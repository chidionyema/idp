    cases:
      - {expect: pass, live: true}
      - {expect: refuse, args: [tests/fixtures/plist/bad.plist.tmpl]}
      - {expect: refuse, args: [tests/fixtures/plist/bare-argv.plist.tmpl]}
      - {expect: refuse, args: [tests/fixtures/plist/orphaned-children.plist.tmpl]}
      - {expect: pass, args: [tests/fixtures/plist/abandoned-children.plist.tmpl]}
    ok: "every launchd template renders to a plist that parses and names its job; gate proved both ways"
    fail: "a launchd template does not render to a valid plist, or the gate does not discriminate"

  - id: migration-idempotent
    label: migration
    statement: A migration whose second apply adds a resource is refused
    law: R22 mechanism 1
    origin: crew#186 CP1
    planes: [ci]
    proved_elsewhere: >-
      the permitting case is the live migration rung in bin/idp-ci, which applies bin/scheduler-migrate twice and rolls it back under a real dagster
    run: [bin/migration-gate]
    fixtures: {must_fail: tests/fixtures/migration-not-idempotent, must_pass: bin/scheduler-migrate}
    live_elsewhere: "bin/idp-ci:337 -- the migration rung applies bin/scheduler-migrate twice against a real dagster and rolls it back"
    cases:
      - {expect: refuse, args: [tests/fixtures/migration-not-idempotent]}
    ok: "migration-gate refuses the non-idempotent fixture"
    fail: "migration-gate accepted a migration whose second apply adds a resource"

  - id: static-secret
