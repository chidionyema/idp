  - expect: pass
    args:
    - tests/fixtures/prm/good/session.jsonl
  - expect: pass
    live: true
    note: the estate's own session transcripts, read from ~/.pi/agent/sessions
  ok: every step of a transcript scores at least 0.8 on factual correctness, relevance and efficiency, so a hallucinated or off-goal step is caught at the step, not only when the transcript is finished
