  label: budget
  statement: A reasoning run is halted the instant one of three ceilings trips -- a repeated (tool, target) pair proving zero new evidence, a running sum of declared cost_usd crossing --max-cost-usd, or the existing per-goal branch budget (bin/idp-trajectory's budget_per_goal) -- and the best-so-far plan (goal, subgoal completion, steps and dollars spent) is surfaced instead of a claim the run finished
  law: founder essay 2026-09-14, the Reasoning Gateway ("Test-Time Compute Budgeting... Budget exhaustion -> forced termination -- the agent stops thinking and executes the best-so-far plan when the budget runs out")
