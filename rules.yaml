    must_fail: tests/fixtures/migration-not-idempotent
    must_pass: bin/scheduler-migrate
  live_elsewhere: bin/idp-ci:420 -- the migration rung applies bin/scheduler-migrate twice against a real dagster and rolls it back
  cases:
  - expect: refuse
    args:
    - tests/fixtures/migration-not-idempotent
  ok: migration-gate refuses the non-idempotent fixture
  fail: migration-gate accepted a migration whose second apply adds a resource
