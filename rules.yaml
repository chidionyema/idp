    ok: "every new bin file has its demo and onboarding; every page is above the prose floor and in the nav; gate proved both ways"
    fail: "a feature shipped without demo/onboarding, or a page is thin or unlisted"

  - id: plist-renders
    label: plist
    statement: Every launchd template renders to a plist that parses and names its job
    law: LAW 45
    origin: idp#49
    planes: [ci]
    run: [python3, bin/plist-gate]
