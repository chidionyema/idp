  fail: a SecretStore or ClusterSecretStore names a provider outside the cluster that its namespace's fence gives it no route to; the store reports InvalidProviderConfig and every ExternalSecret behind it stops
- id: catalogue-entity-runtime-service
  label: cat-runtime-svc
