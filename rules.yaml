- id: healthcheck-names-a-real-object
  label: healthcheck-exists
  statement: A Kustomization's health check names an object this tree actually creates. A wait on an object nothing creates reports NotFound forever, holds every row depending on it out of the cluster, and is invisible in CI because the manifest is valid YAML naming a plausible object. An object an operator makes at runtime is ungraded and said to be ungraded, never assumed absent
  law: LAW 45, incident 2026-09-13 (the tailscale row waited on Deployment/tailscale-operator; the chart emits Deployment/operator, so guacamole and four rows behind it were held out for days)
  origin: incident 2026-09-13, tailscale
  planes:
  - ci
  run:
  - python3
  - bin/idp-healthcheck-exists
  fixtures:
    must_fail: tests/fixtures/healthcheck-exists/bad
    must_pass: tests/fixtures/healthcheck-exists/good
  cases:
  - expect: refuse
    args:
    - --root
    - tests/fixtures/healthcheck-exists/bad
    - tests/fixtures/healthcheck-exists/bad/compiled.json
    - tests/fixtures/healthcheck-exists/bad/cluster.yaml
    note: the tailscale defect exactly -- a health check naming a Deployment no chart renders
  - expect: pass
    args:
    - --root
    - tests/fixtures/healthcheck-exists/good
    - tests/fixtures/healthcheck-exists/good/compiled.json
    - tests/fixtures/healthcheck-exists/good/cluster.yaml
    note: the same row naming the Deployment the chart does emit
  ok: every health check names an object this tree creates, or is reported ungraded
  fail: a health check waits on an object nothing creates, and CI is green
- id: externalsecret-blockers-are-loud
  label: secret-blockers
  statement: An ExternalSecret that cannot sync is named with the vault key it needs and marked FOUNDER ACTION or ESTATE, never left to read as "Reconciliation in progress". A missing entry in the provider is a value only a person can produce, and it is reported as one; any other failure is an estate defect and is reported as that instead
  law: R47 (a founder blocker is loud and one action), incident 2026-09-13 (cyrus sat HealthCheckFailed for days; the reason was three layers down at ExternalSecret/cyrus/cyrus-linear-oauth, whose vault entries are born in a browser because Linear publishes no create-API for an OAuth application)
  origin: incident 2026-09-13, cyrus
  planes:
  - ci
  run:
  - python3
  - bin/idp-externalsecret-blockers
  fixtures:
    must_fail: tests/fixtures/secret-blockers/bad
    must_pass: tests/fixtures/secret-blockers/good
  cases:
  - expect: refuse
    args:
    - --from
    - tests/fixtures/secret-blockers/bad/externalsecrets.json
    - --fail-on-blocker
    note: the cyrus blocker exactly -- two vault entries that need a browser, and a row held by them
  - expect: pass
    args:
    - --from
    - tests/fixtures/secret-blockers/good/externalsecrets.json
    - --fail-on-blocker
    note: the same ExternalSecret once a person has typed the pair
  ok: every ExternalSecret that cannot sync names the vault key it needs and whether a person must produce it
  fail: a row is held by a missing vault entry and its status reads "Reconciliation in progress"
- id: estate-graph-view
  label: graphview
  statement: 'The /ops graph section reports the estate''s three-state rule and never renders a stale domain as serving: UNKNOWN leads the sentence when the graph is older than its window, a BLIND graph names why rather than reading as clean, and the section keeps the tool''s own ordering so a dead workload is not buried under warning events'
  law: LAW 22, LAW 53
  origin: founder 2026-09-12 (the view must not flatter the estate)
  planes:
  - ci
  run:
  - node
  - bin/idp-estate-graph-prove
  cluster:
    policy: null
    why: the subject is a React module, which no admission controller sees
  fixtures:
    must_fail: tests/fixtures/graphview/bad.json
    must_pass: tests/fixtures/graphview/good.json
  cases:
  - expect: refuse
    args:
    - tests/fixtures/graphview/bad.json
  - expect: pass
    args:
    - tests/fixtures/graphview/good.json
  - expect: pass
    args: []
  ok: the founder's graph view reports the three states honestly and never flatters a stale read (2026-09-12)
  fail: the view could render a stale or blind graph as healthy
- id: estate-twin
  label: twin
  statement: Every runtime fact the estate reports comes from the estate's own cluster-state receipt into catalog/estate.db, never from a second store, bus or server; a domain not read inside its freshness window reads UNKNOWN and never MEASURED_OK; the twin's stranded-branch count equals the catalogue generator's, so two surfaces cannot tell a founder two different numbers
  law: LAW 22, LAW 39, THE HEADLINE
  origin: founder 2026-09-12 ("tired of running my whole estate blind")
  planes:
  - ci
  run:
  - python3
  - tests/test_estate_twin_rule.py
  cluster:
    policy: null
    why: the subject is the estate's own asset graph, not a cluster object
  fixtures:
    must_fail: tests/fixtures/twin/no-summary.json
    must_pass: tests/fixtures/twin/agreed.json
  cases:
  - expect: refuse
    args:
    - tests/fixtures/twin/no-summary.json
  - expect: refuse
    args:
    - tests/fixtures/twin/disagreed.json
  - expect: pass
    args:
    - tests/fixtures/twin/agreed.json
  - expect: pass
    args:
    - --live
  ok: the estate's graph knows what the estate is, and no second surface contradicts it (2026-09-12)
  fail: the graph reports a number the catalogue contradicts, or claims freshness it does not have
- id: bdd-proof
  fast: true
  label: bdd-proof
  statement: 'No pull request opens without BDD proof, across every agent session: the body carries a BDD-PROOF block naming the head commit, that block carries a runner''s own passing counts rather than a sentence saying the tests passed, and the named commit is the pull request''s own head -- a claim with no run output is refused, and so is a real run on another commit'
  law: LAW 22, LAW 53
  origin: founder 2026-09-12
  live_elsewhere: bin/idp-ci:89 -- the fast plane runs bin/idp-bdd-proof-gate --live, which reads the most recent pull request on this repository and refuses one carrying no BDD-PROOF block on its own head; on 2026-09-12 it refused PR
  planes:
  - ci
  - session
  run:
  - python3
  - bin/idp-bdd-proof-gate
  cluster:
    policy: null
    why: the subject is a pull request body, which no admission controller sees
  fixtures:
    must_fail: tests/fixtures/bdd-proof/bad.json
    must_pass: tests/fixtures/bdd-proof/good.json
  cases:
  - expect: refuse
    args:
    - tests/fixtures/bdd-proof/bad.json
  - expect: refuse
    args:
    - tests/fixtures/bdd-proof/good.json
    env:
      BDD_PR_HEAD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  - expect: refuse
    args:
    - tests/fixtures/bdd-proof/good.json
    env:
      BDD_RUN_HEAD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  - expect: pass
    args:
    - tests/fixtures/bdd-proof/good.json
  - expect: refuse
    args:
    - tests/fixtures/bdd-proof/stale-head.json
  ok: no pull request opens without a passing BDD run on its own head, in any agent session (LAW 22)
  fail: a pull request could open on a claim that was never proved by a BDD run (LAW 22)
- id: sleep-ban
  fast: true
  label: sleep-ban
  statement: 'No script waits on a clock where an event exists -- a bare sleep of 10 seconds or more is refused, a sleep of 5 or less is a yield and passes, and a longer fixed interval is accepted only with a sleep-ok marker giving the reason: the documented rate limit or protocol heartbeat that forces it.'
  law: LAW 14
  planes:
  - ci
  - session
  session_glob:
  - bin/*
  - scripts/*
  - .github/workflows/*.yml
  - platform/**/*.yaml
  - platform/**/*.sh
  run:
  - python3
  - bin/idp-sleep-ban
  cases:
  - expect: refuse
    args:
    - tests/fixtures/sleep-ban/bad.sh
  - expect: pass
    args:
    - tests/fixtures/sleep-ban/good.sh
  - expect: pass
    live: true
  ok: 979 files of the estate are scanned and none waits on a clock; a pass over zero files is a FAIL, and a fixed interval carries its reason
  fail: 'measured 2026-09-10: ''set -u; grader | tee out'' exits 0 while the grader failed, so a run reports green having graded nothing. ''set -o pipefail'' or ''-e'' fixes it; a bare last command propagates without -e, and a later step that tests the captured rc is an assertion'
  why: 'Founder 2026-09-12: "sleep 420 is a catastrophic failure of engineering... time is not a synchronization primitive. Events are." Measured the same evening: turns blocked for minutes at a time on `sleep 420` waiting for CI, which is why the session looked hung to the person watching it. The estate already owns the event-driven answer for that case -- gh pr merge --squash --auto arms the merge in 200ms and GitHub watches the checks -- and no rule said so.'
- id: helmrelease-drift-is-detectable
  label: helmrelease-drift
  statement: A HelmRelease reporting Ready while it cannot see the cluster disagree with it is not reconciled -- helm-controller diffs the manifest in Helm storage against the rendered chart and never against the cluster, so a Deployment edited after the apply is invisible to it forever. driftDetection is the fence that compares the two, and a release without it is named, with the number of Ready-and-blind releases reported so the count can be driven down
  law: LAW 45, incident 2026-09-13 (chaos-controller-manager ran at 0 replicas for 18 days while Ready/UpgradeSucceeded and helm-controller logged "release in-sync with desired state"; 39 fail-closed webhooks then made every chaos-mesh.org object uncreatable estate-wide)
  origin: incident 2026-09-13, chaos-mesh
  planes:
  - ci
  run:
  - python3
  - bin/idp-helmrelease-drift-coverage
  fixtures:
    must_fail: tests/fixtures/helmrelease-drift/bad
    must_pass: tests/fixtures/helmrelease-drift/good
  cases:
  - expect: refuse
    args:
    - --from
    - tests/fixtures/helmrelease-drift/bad/helmreleases.json
    - --fail-on-blind-ready
    note: the chaos defect exactly -- Ready, and driftDetection unset
  - expect: pass
    args:
    - --from
    - tests/fixtures/helmrelease-drift/good/helmreleases.json
    - --fail-on-blind-ready
    note: the same release with the fence switched on
  ok: a release that cannot see the cluster disagree with it is named; the count is the number to drive down
  fail: a release reports Ready while a post-apply edit is invisible to it, and nothing says so
- id: drift-reads-blind-not-clean
  label: drift-blind
  statement: A tool that could not read the estate exits 2 and prints BLIND, never 0 with an empty result -- "nothing is drifting" and "nothing could be read" must never print the same thing. The rule is proved on a reader whose kubectl is absent and on a clean set of Flux objects, both ways
  law: LAW 2, incident 2026-09-08 (bin/idp-compile-helm exited 0 while 11 of 33 charts failed to render)
  origin: spec 2026-09-13-gitops-sync-engine.md
  planes:
  - ci
  run:
  - python3
  - bin/idp-drift-blind
  fixtures:
    must_fail: tests/fixtures/drift-blind/bad
    must_pass: tests/fixtures/drift-blind/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/drift-blind/bad
    note: a reader with no kubectl is BLIND, exit 2, never a clean empty estate
  - expect: pass
    args:
    - tests/fixtures/drift-blind/good
    note: a reader that read every object and found the estate reconciled exits 0
  - expect: pass
    note: LIVE -- a bare run invokes bin/idp-gitops-drift twice, once against the estate this machine can see and once with an empty PATH, and grades both verdicts with the same code. It asserts no particular exit code, because a clean cluster answers 0 and a drifting one answers 1 and both are right; it asserts the property -- never BLIND with 0, never 2 without BLIND. This is the case that stays red the day the tool's blind branch is changed, which a fixture-only rule cannot see.
  ok: a reader that cannot see the estate says so and refuses to report a clean one
  fail: a blind reading prints the same thing as a clean estate
- id: breaker-enforcement
  label: breaker-enf
  statement: 'The breaker''s fingerprint is the stable identity of a FINDING, never the bytes a command printed: output carrying no finding -- a successful command, a shell builtin echoing its input, an empty result -- yields no fingerprint and can never lock, however many times it repeats, while three targets carrying the same CVE set still lock. One rule, in bin/idp-circuit-breaker; the extension asks it, so the two cannot drift apart'
  law: R38, incident 2026-09-13
  origin: incident 2026-09-13, the breaker locked bash and read for hours
  planes:
  - ci
  run:
  - python3
  - -m
  - pytest
  - tests/test_breaker_extension.py
  - -q
  - -p
  - no:xdist
  - -o
  - addopts=
  cases:
  - expect: pass
    args:
    - tests/test_breaker_extension.py::TestItBlocksProvedRepetition::test_it_never_blocks_nine_different_findings
    note: 'REFUSING DIRECTION on the extension plane. Nine targets, nine distinct causes: nothing blocks. This is R38 -- a guard that refuses correct work is an outage -- asserted through extensions/breaker/decide.mjs, the module pi actually calls.'
  - expect: pass
    args:
    - tests/test_breaker_extension.py::TestItBlocksProvedRepetition::test_it_blocks_on_the_third_identical_finding
    note: PERMITTING DIRECTION on the extension plane. Three targets carrying the same CVE set in three different orders do block on the fourth, and the block names a lever. The same CVE list reordered must fingerprint identically, or the real 2026-09-12 incident -- six red pull requests, one cause, three different log positions -- would never have been grouped.
  - expect: pass
    args:
    - tests/test_breaker_extension.py::TestItIsBlindRatherThanSilent::test_it_reports_blind_when_the_tool_is_absent
    note: THE BLIND-OR-SILENT CASE. When the tool cannot be found the extension reports BLIND, never a quiet pass -- a guard that cannot run its check must say so, not read as clean.
  - expect: pass
    live: true
    note: the whole breaker test module over the real tree
  fixtures:
    must_fail: tests/fixtures/breaker-enforcement/bad
    must_pass: tests/fixtures/breaker-enforcement/good
  ok: a command with no finding cannot lock, and a proved pattern still locks
  fail: 'output carrying no finding gets a fingerprint, so repeated no-op commands trip N=3 and lock the two tools a session needs to fix anything. Measured 2026-09-13: a session issued the same command repeatedly, the third tripped the lock, and every command that could have cleared it was itself a bash call. R38 -- a guard that refuses correct work is an outage.'
  proved_elsewhere: 'the same rule on the CLI plane, where the runner is the script and not pytest. Re-take it with: python3 bin/idp-circuit-breaker --replay tests/fixtures/breaker-enforcement/bad/replay.json (four no-op targets: `0 finding(s) observed; 0 locked`, exit 0) and python3 bin/idp-circuit-breaker --replay tests/fixtures/breaker-enforcement/good/replay.json (three targets carrying one CVE set in three orders: `3 finding(s) observed; 1 locked`, exit 1, with a 423 and a lever naming the single fix). A case cannot change the row''s runner, so this proof cannot be one of the cases above. The refused-vs-locked distinction is the whole rule: a no-op is never observed and can never lock; a real finding locks on the third target.'
- id: execution-boundary-holds
  label: execution-boundary
  statement: Nothing an agent runs may hold a turn open. The 60-second ceiling is applied by the executor daemon outside the caller's process tree, stated once in the door and imported by the daemon -- a second copy of the number is a second answer, and a daemon that swallows its own door import answers health while unable to run anything
  law: founder 2026-09-13 (verbatim) "60 secsos is the nnax" / "it should not even get bera teh" / "a breach of law or gaurd is a security breach" -- after the cap was breached six times; "find where we have done this, operationalise it, make sure every agent session is aware, and remove bash access afterward"
  origin: founder 2026-09-13, the execution boundary
  planes:
  - ci
  - session
  run:
  - python3
  - bin/idp-execution-boundary
  fixtures:
    must_fail: tests/fixtures/execution-boundary/bad
    must_pass: tests/fixtures/execution-boundary/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/execution-boundary/bad
    note: a door with no daemon, no entry point, no status tool and no launchd job -- the shape of every one of the six failed attempts
  - expect: pass
    args:
    - tests/fixtures/execution-boundary/good
    note: the whole boundary, ceiling imported once from the door
  - expect: pass
    live: true
    args:
    - --check
    note: 'LIVE: the boundary is graded on THIS repository rather than on an example of one, so the row fails the day the daemon restates the ceiling, the door loses its entry point or the launchd job goes missing on the machine that is actually running agents. Two fixture cases alone graded a tree that never moves: every one of the six real breaches this rule was written for would have passed them.'
  ok: the executor daemon applies one ceiling, imported from the door, and every half of the boundary is present -- and the boundary holds on this repository, not only on an example of one
  fail: a ceiling is restated in the daemon, or the boundary is half built and nothing says so
- id: dod-v3-verified-not-asserted
  label: verified-not-asserted
  statement: 'Honestly scoped to ONE of DoD v3''s five required letters -- (c) "Verified, not asserted": a doc''s own `**Status:**` line claiming built/done/proven live/doored, that also names a Kubernetes-shaped capability path (`platform/<name>/` or `backstage/plugins/<name>/`), must show either a real manifest for that path (a Dockerfile plus a `kind: Deployment` naming it) or an honest `**Not done:**` line -- a one-off curl or test the builder ran against its own daemon is not a manifest and does not satisfy this. This row does NOT cover the other four letters (sellable, installable-fast-benchmarked, procurement-passable, owned); those have no document schema in this repo yet and are not claimed here.'
  law: 'LAW 38, founder 2026-09-15 (DoD v3, "final cut"): "Done" means commercially ready and viable, five checks, all five required, none self-graded -- (c) is "verified by a non-builder, scheduled check that keeps confirming, not a one-off curl the builder ran itself, no matter how real the response." ~/.claude/docs/founder/2026-09-15T0947Z-standing-rule-definition-of-done-is-environment-verified-and-commercially-viable.md'
  origin: 'Two incidents the same day. docs/tickets/2026-09-15-typed-multidomain-mutation-ledger.md opens `**Status:** built, smoke-tested, and doored` and names `backstage/plugins/fleetview-backend/`, `platform/estate-db/` and `platform/executor/` -- none of which had a Dockerfile plus a live-tree `kind: Deployment` manifest, and the doc carried no `**Not done:**` line. Separately, a concurrent agent (task a6316e4fdcd04f1f6, "Deploy fleetview-backend for real") replied `DONE:` with a "Founder receipt" that was its own curl to its own `127.0.0.1:18790` launchd daemon -- real output, but not independent, and not a manifest. Both were the same shape: a claim graded only by the claimant.'
  planes:
  - ci
  - session
  session_glob:
  - docs/tickets/*.md
  - docs/specs/*.md
  - docs/audits/*.md
  run:
  - python3
  - bin/dod-live-claim-gate
  fixtures:
    must_fail: tests/fixtures/dod-live-claim/bad.md
    must_pass: tests/fixtures/dod-live-claim/good.md
  cases:
  - expect: refuse
    args:
    - tests/fixtures/dod-live-claim/bad.md
    note: claims built/doored, names a platform/ path with no Dockerfile and no Deployment anywhere in the real tree, and carries no `**Not done:**` line
  - expect: pass
    args:
    - tests/fixtures/dod-live-claim/good.md
    note: the identical claim, honestly downgraded with a `**Not done:**` line naming the gap -- inventory, not done, and the gate agrees
  - expect: pass
    args:
    - tests/fixtures/dod-live-claim/good-deployed.md
    env:
      DOD_LIVE_CLAIM_SEARCH_ROOT: tests/fixtures/dod-live-claim/deployed-good
    note: 'the same claim shape, graded against a self-contained fixture tree that DOES carry a real Dockerfile and `kind: Deployment` manifest naming the capability -- the gate passes a claim only when the environment itself backs it, not the doc''s own say-so'
  - expect: pass
    live: true
    args:
    - docs/tickets/2026-09-13-deterministic-verifier.md
    - docs/tickets/2026-09-13-three-independent-pieces-of-evidence.md
    - docs/tickets/2026-09-13-wartime-inference.md
    - docs/tickets/2026-09-14-bayesian-mcts-k8s-sre.md
    - docs/tickets/2026-09-14-mcts-mcp-server.md
    - docs/tickets/2026-09-14-reasoning-gateway.md
    note: 'LIVE, and deliberately narrow: six real ticket docs from this estate''s own tree, none of which carry an unbacked live claim today, so this case grades the estate rather than an example of one. It deliberately excludes docs/tickets/2026-09-15-typed-multidomain-mutation-ledger.md, the ticket this row exists to catch -- that doc is genuinely RED right now (see `origin` above) and fixing the mutation-ledger deployment itself is separately tracked and out of this row''s scope. Sweeping it into a bare repo-wide default-docs() case and asserting the whole tree green would be exactly the false pass this gate was built to catch, so it is named here instead as a known, live, unclosed gap -- not asserted, not hidden.'
  ok: a doc's completion claim about a named capability path is backed by a real manifest in the tree or an honest `**Not done:**` line -- never the claim alone, and never a one-off curl
  fail: 'a `**Status:**` line claims built/done/doored, names a capability path with no Dockerfile and no `kind: Deployment` manifest anywhere in the tree, and the doc says nothing about it'
  why: 'Measured 2026-09-15: this gate run cold against the real repo (no env override) finds exactly the mutation-ledger doc''s three unbacked claims and nothing else -- see origin. This row covers letter (c) of DoD v3''s five-letter bar only; letters (a) sellable, (b) installable-fast-benchmarked, (d) procurement-passable and (e) owned have no document schema in this repo to grade against yet, and inventing one here would be exactly the ungrounded schema LAW 38 warns against. Not claimed, not hidden.'
- id: a-script-is-not-built-until-it-runs
  fast: true
  label: script-compiles
  statement: 'A script added to bin/ is not built until it has been EXECUTED once: it must answer --self-test, --self-check or --dry-run with exit 0 in bounded time. A parser and a linter both pass a script that has never run, which is exactly how a wrong variable name, a missing command or an unresolvable import reaches a session as a load failure -- so the compile is the run.'
  law: LAW 43 / LAW 45, founder 2026-09-13 (verbatim) "no script shold be built withiut conpiler, enforce it ... aget should not eve have to do it, should be auuto"
  origin: 'founder 2026-09-13, after watching a session hot-reload a file nobody had compiled. bin/idp-script-compiles was committed in 8913a251 and reached this branch with NO row in this registry, so it graded nothing on the repository plane: the coverage gate (bin/idp-rule-coverage) named tests/fixtures/script-compiles as a fixture graded by no rule and no test. A rule the agent must remember to follow is a wish (LAW 44); the row below is what makes the caller structural rather than remembered.'
  planes:
  - ci
  - session
  session_glob:
  - bin/*
  run:
  - python3
  - bin/idp-script-compiles
  fixtures:
    must_fail: tests/fixtures/script-compiles/bad
    must_pass: tests/fixtures/script-compiles/good
  cases:
  - expect: refuse
    args:
    - --files
    - tests/fixtures/script-compiles/bad/never-ran.sh
    note: a script whose --self-test exits 127 on an undefined command, and which parses and lints clean
  - expect: pass
    args:
    - --files
    - tests/fixtures/script-compiles/good/runs.sh
    note: the same script with a --self-test that exercises its real path
  - expect: pass
    live: true
    args:
    - --files
    - bin/idp-script-compiles
    note: 'LIVE, and deliberately narrow: the gate is pointed at ITSELF in the real tree, so this case grades the estate rather than an example and cannot be satisfied by fixtures alone. A bare run over all of bin/ is the honest whole-tree reading and it is RED today -- 257 of 286 scripts answer no --self-test, --self-check or --dry-run -- so it is not asserted here as a pass. That number is the gap this row exists to close and it is quoted in `why` below; asserting it green would be the false pass this gate was built to catch.'
  ok: the gate refuses a script that has never run and passes one that has; it is pointed at the real tree, and the 257 scripts still without a self-test are named rather than passed over
  fail: an executable under bin/ has never been executed and nothing refuses it, so a load failure reaches a session as a surprise
  why: 'Measured 2026-09-13: a bare run over all of bin/ reports `FAIL: 257 of 286 script(s) do not run`. The estate is genuinely short, and the shortfall is stated here rather than asserted green. This row closes that gap one script at a time; the count may only fall.'
- id: deterministic-verifier
  label: verifier
  statement: 'A claim of completed work is not the agent''s to make: the agent may only propose a patch into an ephemeral ledger, three graders the proposer does not control run against the exact bytes -- structural (the bytes compile), symbolic (Z3 over the guard the patch itself declares, which refuses to discharge "tests pass"), and execution (the SUPPLIED TEST SUITE runs in a throwaway tree and the pytest exit code is the verdict, so a proposal carrying no test is refused) -- and an attestation is minted only when all three pass, bound to the SHA-256 of the artifact actually verified. Take the claim away from the claimant'
  law: founder 2026-09-13 "the fact u are able toi lie eans he his rules isnt operation al and the firs thig we need to addres" / "thats why i dont belive clains without hard prrov 3 different w3ys"
  origin: incident 2026-09-13, an agent's first-person claim of done accepted with no third party behind it; see docs/tickets/2026-09-13-deterministic-verifier.md
  planes:
  - ci
  run:
  - python3
  - bin/idp-verifier-oath
  fixtures:
    must_fail: tests/fixtures/verifier-oath/no-seal
    must_pass: tests/fixtures/verifier-oath/sealed
  cases:
  - expect: refuse
    args:
    - tests/fixtures/verifier-oath/no-seal
    note: a proposal the execution stage fails -- the seal is never minted, so no claim leaves
  - expect: pass
    args:
    - tests/fixtures/verifier-oath/sealed
    note: the same proposal with a passing execution stage -- the attestation is bound to the SHA-256 of the exact bytes that were graded, and a byte changed afterwards no longer verifies
  - expect: pass
    live: true
    args: []
    note: 'LIVE: the three-stage gauntlet is run against the real module in this tree with the binding suite CI runs, so the row grades the estate rather than an example. Named with the cwd it needs -- the binding resolves its .feature through bdd_features_base_dir in sovereign/pytest.ini, and it has to run from sovereign/, which is how .github/workflows/ci.yml line 227 invokes it. A root-cwd run dies on import with IndexError: list index out of range.'
  ok: a patch is admitted only through the three-stage gauntlet, the ledger is the only place an agent can write, and the seal binds the attestation to the bytes that were actually graded (measured 2026-09-13, 9 passed, PYTEST_RC=0)
  fail: a claim of completed work reaches the estate on the word of the agent that made it, with no structural, symbolic or execution grader in front of it, or an attestation whose subject is not the SHA-256 of the graded artifact
- id: router-egress-ledger
  label: routeegr
  statement: A LiteLLM model_list router config may live only in a namespace on the reviewed ledger (bin/idp-router-egress-gate); a second, undeclared router is a rogue direct-provider bypass
  law: idp#3525 CP3 (ROUTE-01)
  origin: crew#3525 CP3, founder standing order "no need to stop until fully done"
  planes:
  - ci
  run:
  - python3
  - bin/idp-router-egress-gate
  fixtures:
    must_fail: tests/fixtures/router-egress/bad.yaml
    must_pass: tests/fixtures/router-egress/good.yaml
  cases:
  - expect: pass
    args:
    - tests/fixtures/router-egress/good.yaml
  - expect: refuse
    args:
    - tests/fixtures/router-egress/bad.yaml
  - expect: pass
    args:
    - platform
  live_elsewhere: 'bin/idp-router-egress-gate:190 -- the gate grades the REAL platform/ tree (bin/idp-router-egress-gate platform), naming every router config the repo carries against the reviewed ledger. It ran only its two fixtures before, so a second router landing in an unreviewed namespace was caught by nothing. The runtime half of ROUTE-01 -- a real Calico deny feed for bypass-attempt alerting -- stays tracked on #2452; that is a different question from whether this rule reads the platform, and this rule now does.'
  ok: a model_list router config in llm or otto-gateway (the two reviewed namespaces) passes; the same config in any other namespace is refused
  fail: a second LiteLLM router lands in an unreviewed namespace and nothing catches it before a cluster where NetworkPolicy cannot tell it apart from the router's own traffic
- id: catalog-spec-type
  fast: true
  label: catalog-type
  statement: A catalog entity whose spec.type is not in schema/catalog-ontology.json cannot be queried reliably -- the frontend receives 200 [] indistinguishable from "no results" and "catalog broken", and an agent inventing a type propagates the gap every time it runs. The enum is the contract; the contract is checked before the commit exists.
  law: 'incident: phone-nav blank page (founder-surface type absent from ontology), /dagster page blank (relative URL, same root cause class)'
  origin: spec.type is a free-form string in stock Backstage; the catalog API returns 200 [] for any unknown type. A frontend querying founder-surface got an empty list when no entity declared that type, and a relative /dagster URL caused the same blank-page failure in the scheduler surface. schema/catalog-ontology.json closes the enum; this gate refuses any type not in it. Template kind and scaffold ${{ }} tokens are skipped -- they use Backstage scaffold syntax, not real entity values.
  planes:
  - ci
  - session
  session_glob:
  - backstage/**/*.yaml
  run:
  - python3
  - bin/idp-catalog-spec-type-gate
  cluster:
    policy: null
    why: spec.type is a catalog metadata field; admission controllers see Kubernetes objects, not Backstage entity descriptors
  fixtures:
    must_fail: tests/fixtures/catalog-spec-type/bad
    must_pass: tests/fixtures/catalog-spec-type/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/catalog-spec-type/bad
    note: Component with spec.type 'rogue-service-type' not in the ontology enum
  - expect: pass
    args:
    - tests/fixtures/catalog-spec-type/good
    note: Component (platform-layer), API (openapi) and Template (skipped) all pass
  - expect: pass
    live: true
    note: the catalog files actually committed to backstage/
  ok: a spec.type not in the ontology is refused; valid types and Template skip pass; the real backstage/ tree is clean
  fail: a catalog entity names a spec.type not in schema/catalog-ontology.json, or the gate is not discriminating
- id: catalog-links-absolute
  fast: true
  label: catalog-links
  statement: A relative URL in metadata.links renders a blank page -- the browser resolves it against the portal's own origin, not the service's. The gate refuses any link whose url is not an absolute http/https URI. Template substitution variables (${ESTATE_ZONE}) are permitted when the scheme prefix is present.
  law: 'incident: /dagster page blank because url was relative path rather than https://catalogue.${ESTATE_ZONE}/dagster'
  origin: 'layer-dagster in backstage/platform/catalog-info.yaml carried url: /dagster; the portal rendered it as catalogue.<zone>/dagster which resolved to the portal itself rather than the scheduler. The fix is absolute URLs everywhere; this gate refuses relative paths, protocol-relative URLs and non-http schemes at commit time.'
  planes:
  - ci
  - session
  session_glob:
  - backstage/**/*.yaml
  run:
  - python3
  - bin/idp-catalog-links-gate
  cluster:
    policy: null
    why: links are catalog metadata; admission controllers see Kubernetes objects
  fixtures:
    must_fail: tests/fixtures/catalog-links/bad
    must_pass: tests/fixtures/catalog-links/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/catalog-links/bad
    note: Component with links[0].url '/dagster' (relative path)
  - expect: pass
    args:
    - tests/fixtures/catalog-links/good
    note: Component with https://catalogue.${ESTATE_ZONE}/dagster passes
  - expect: pass
    live: true
    note: the catalog files actually committed to backstage/
  ok: a relative or non-http URL in metadata.links is refused; absolute https URLs including ${ESTATE_ZONE} templates pass; the real backstage/ tree is clean
  fail: a catalog entity carries a relative or non-http URL in metadata.links, or the gate is not discriminating
- id: mutation-reversibility
  fast: true
  label: reversibility
  statement: 'A mutation that carries no inverse is a mutation nobody can take back: every envelope the estate admits names either a deterministic inverse with a state probe, or an irreversible exemption whose attestation is a real signature over the envelope subject -- never a token that merely looks like one. A gate that cannot read its schema or its verifier is BLIND (exit 2), because a machine that cannot judge has not found a defect (LAW 38).'
  law: ADR 0024 (Otto runs every tool and asks only for the unundoable), ADR 0025 (agents hold no write on production), LAW 38 (a guard that refuses correct work is an outage)
  origin: 'The estate had three things that look like reversibility and none of them is it: bin/idp-rollback-only-diff gates a diff that is ALREADY a rollback; rewind is a destructive capability an agent may invoke rather than an obligation attached to a forward mutation; ADR 0024 routes the un-undoable to a human but never demanded the artefact exist. This gate closes that gap as a field on the envelope the ledger door (docs/specs/2026-09-15-typed-multidomain-mutation-ledger-door.md) already consumes -- not as a second envelope beside it (LAW 43). The rejected first draft accepted a human quorum token by startswith("sig-live-quorum-"), which a forged string passes; the exemption path here runs sovereign.verifier.verify_attestation (ed25519 over the subject), the same check admission runs, and the fixture that carries the magic-prefix shape is refused by that signature check rather than by luck.'
  planes:
  - ci
  - session
  session_glob:
  - intents/**/*.json
  - schema/mutation-envelope.schema.json
  run:
  - python3
  - bin/idp-reversibility-gate
  cluster:
    policy: null
    why: a mutation envelope is not a Kubernetes object; admission never sees one. The executor daemon consumes the envelope and the ledger door verifies it -- that is where this rule's refusal lands.
  fixtures:
    must_fail: tests/fixtures/reversibility/bad
    must_pass: tests/fixtures/reversibility/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/reversibility/bad
    note: no-inverse (missing inverse_spec), inverse-is-forward (an inverse that reverses nothing), prefix-forgery (a magic-prefix string the ed25519 check refuses)
  - expect: pass
    args:
    - tests/fixtures/reversibility/good
    note: scale-deployment (self-inverse with different parameters) and different-action (a genuinely different verb)
  ok: an envelope with no inverse, an inverse that echoes the forward, or a forged exemption token is refused; a deterministic inverse and a genuinely signed exemption pass; the gate exits 2 (BLIND) when it cannot read its schema or verifier
  fail: an admitted mutation carries no verifiable inverse, or the gate refuses correct work because it could not read its own inputs (LAW 38)
  live_elsewhere: platform/executor/daemon.py:810 -- _mutation_is_reversible runs this gate on every verify_mutation, so a proposal without an inverse is refused with violation_code NO_INVERSE before the gauntlet runs
- id: redteam-payload-promotion
  fast: true
  label: redteam-promoter
  statement: 'A red-team payload that defeated the proxy must become a signature the proxy blocks: the promoter derives a signature from the payload and writes it through the RCA worker''s one _persist, closing the loop from the eval plane to the live prompt path. A payload whose content is all dynamic values derives NOTHING -- promoting it would ban a bare UUID and refuse correct work (LAW 38) -- and an unreadable payload is BLIND (exit 2), never a promotion.'
  law: the missing wire of the adversarial loop -- red_team_payloads generates attacks and the proxy blocks known signatures, but nothing taught the proxy what red team had already proved defeating, so a hole stayed open until the same lesson arrived as an incident. LAW 38 (a signature derived from pure noise refuses correct work), LAW 43 (one writer of via_negativa:banned_signatures -- the promoter calls the RCA worker's own _persist, never a second mechanism)
  origin: 'The estate had every part of an adversarial loop and no wire between them: platform/eval/red_team_payloads.py generates and classifies payloads, platform/eval/red_team_loop.py scans transcripts for fired payloads, bin/negative-constraints-proxy blocks a tool call whose normalized name or arguments match via_negativa:banned_signatures, and bin/rca_worker/worker.py writes that set -- but only from real production failures. Nothing promoted a synthetic payload the red team proved defeating. This is the wire. It is deliberately not an inference micro-model on the hot path: a defeating payload becomes a signature the proxy rejects at set-membership cost, so the loop is self-improving with no added latency on every prompt. The derivation is checked against the proxy''s OWN Go source (builtinSignatures, normalize, match) in tests/test_redteam_promoter.py, so the two cannot drift.'
  planes:
  - ci
  session_glob:
  - platform/eval/red_team_payloads.py
  - bin/negative-constraints-proxy/main.go
  run:
  - python3
  - bin/redteam_promoter/promoter.py
  - grade
  cluster:
    policy: null
    why: the promoter is a workload (platform/via-negativa/redteam-promoter.yaml) that writes a Redis set, not a Kubernetes object; admission never sees a payload
  fixtures:
    must_fail: tests/fixtures/redteam-promoter/bad
    must_pass: tests/fixtures/redteam-promoter/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/redteam-promoter/bad
    note: a payload whose content is only a UUID derives no signature
  - expect: pass
    args:
    - tests/fixtures/redteam-promoter/good
    note: a defeating shell_injection payload derives a signature the proxy honours
  live_elsewhere: 'platform/via-negativa/redteam-promoter.yaml:1 -- the promoter consumes estate.eval.redteam.defeated off NATS and writes through the RCA worker''s _persist. BOTH HALVES NOW EXIST 2026-09-19: platform/eval/red_team_loop.py calls publish_defeated() the moment a payload is detected, so a defeat reaches the promoter without a human in the middle. tests/test_redteam_promoter.py asserts the publisher''s subject equals the consumer''s, so the two cannot drift apart in silence.'
  ok: a defeating payload derives a signature the proxy blocks; a dynamic-only payload derives nothing and is refused; the graded tree is clean and the derivation is checked against the proxy's own source
  fail: a payload that defeated the proxy cannot be promoted, or the promoter derives a signature from pure noise and would refuse correct work
- id: admitted-mutation-reversible
  fast: true
  label: admitted-mutation
  statement: A pull request may auto-merge through the Greenlane as a reversible mutation only when the executor ADMITTED that ledger, the admitted envelope carries a verifiable inverse (bin/idp-reversibility-gate grades it), and the branch touches nothing the admitted bundle never named. The branch must be `mutation/<ledger_id>` -- the executor's own naming. Anything else waits for the founder like any other platform change.
  law: ADR 0025 (the Greenlane grows a row at a time, and a row is admitted only when its scope binary exists with a refused and a passed fixture), ADR 0024 (every mutation carries its inverse), LAW 43 (the reversibility judgement is bin/idp-reversibility-gate, called, never re-decided)
  origin: 'ADR 0025 gave the Greenlane exactly one row (the image-tag bump, proved by bin/idp-image-only-diff) and fixed how it grows: a row is admitted when its scope binary exists, proved both ways. This is the estate''s first non-tag row: a mutation the executor proposed, verified, sealed and admitted -- a change carrying its own inverse and a Deterministic Verifier signature over the exact bundle bytes. The binary reads the executor''s own ledger (only verify_mutation -> seal_mutation -> admit_mutation can write it) rather than trusting a branch name or a label, so a PR that lacks any of the four facts waits for the founder. Built as a row in the ONE existing mechanism, never a second merge path (the stitching ADR 0025 forbids).'
  planes:
  - ci
  run:
  - python3
  - bin/idp-admitted-mutation-diff
  - --fixture-dir
  cluster:
    policy: null
    why: this grades a pull request's diff against the executor's own ledger on disk; admission controllers see Kubernetes objects and never a ledger
  fixtures:
    must_fail: tests/fixtures/admitted-mutation/bad
    must_pass: tests/fixtures/admitted-mutation/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/admitted-mutation/bad
    note: a plain feature branch and an admitted ledger whose envelope has no inverse_spec
  - expect: pass
    args:
    - tests/fixtures/admitted-mutation/good
    note: an admitted mutation branch whose envelope carries a deterministic inverse and whose diff matches the admitted bundle
  live_elsewhere: .github/workflows/deploy-when-green.yml:1 -- Row 3 calls this binary on an open mutation/* PR, so an admitted reversible mutation lands without the founder while every other change waits
  ok: an admitted reversible mutation on a mutation/<ledger_id> branch passes; a non-mutation branch or an admitted envelope without an inverse is refused; an unreadable ledger is BLIND and never a pass
  fail: a pull request that is not an admitted reversible mutation is treated as landable, or a real one is refused
- id: mcp-first
  fast: true
  label: mcp-first
  statement: A question about estate state is answered by the platform, not by a scheduled report, another session's transcript, or an ad-hoc read of the store
  law: ADR 0006
  origin: 'Measured 2026-09-19, one session, one question (''is component X live?'') answered wrong twice: it read docs/reports/flux-state.md, an artifact a scheduled workflow rewrites every 15 minutes, and reported a row dated the previous day as current cluster state; it quoted an oke-check job log the same way; it searched ~/.claude/projects/*.jsonl -- OTHER SESSIONS'' PRIVATE TRANSCRIPTS -- to infer what a peer could do; and it reported the wrong CNI by quoting a commit message from weeks earlier. At no point did it call the tool that answers the question. ADR 0006 settled this on 2026-08-25 and the rule had no mechanism behind it, so the habit survived the rule. The gate grades a COMMAND STRING, not a model: a Claude, a DeepSeek, a local harness or a person are refused by the same bytes, which is what makes it model-agnostic. Each of the three substitutions carries a typed escape marker, because each is legitimate in itself and illegitimate as a SUBSTITUTE for the call -- and an absolute
    fence would be LAW 38, since get_estate_state answered available:false on the day this was written.'
  planes:
  - ci
  - session
  session_glob:
  - '*.sh'
  - bin/*
  run:
  - python3
  - bin/idp-mcp-first-gate
  cluster:
    policy: null
    why: this grades how a session ASKED a question, which no admission controller can see
  fixtures:
    must_fail: tests/fixtures/mcp-first/bad
    must_pass: tests/fixtures/mcp-first/good
  cases:
  - expect: refuse
    args:
    - tests/fixtures/mcp-first/bad/recon.sh
  - expect: pass
    args:
    - tests/fixtures/mcp-first/good/ask.sh
  ok: the platform is asked, not substituted for
  fail: a state question is answered by a scheduled report, a peer's transcript, or the raw store
