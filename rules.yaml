    statement: One credential is one tenant's; the operator's road never widens the customer's
    law: decision 0021
    planes: [ci]
    run: [python3, bin/idp-tenant-split]
    fixtures: {must_fail: tests/fixtures/tenant-split/bad.yaml, must_pass: tests/fixtures/tenant-split/good.yaml}
    live_gap: "chidionyema/idp#2452 -- a bare run over the repository returns 15 findings, every one of the shape 'no data.seed.sql to grade'. That reads like the gate scanning past its own subject rather than 15 tenant defects, and it wants reading before either is claimed."
    cases:
      - {expect: refuse, args: [tests/fixtures/tenant-split/bad.yaml]}
      - {expect: pass, args: [tests/fixtures/tenant-split/good.yaml]}
    ok: "idp-tenant-split refuses one secret under two tenants; the clean split passes"
    fail: "idp-tenant-split cannot tell one-secret-one-tenant from a leak (decision 0021)"

  - id: jit-grants
    label: jitgrant
    statement: >-
      A grant the JIT broker may mint can never be turned into standing access: no token for a verb
      that rewrites a pod spec, no secrets or RBAC, no core namespace, no wildcard, a TTL under the
      ceiling and a declared rate
    law: WJ.5
    planes: [ci]
    run: [python3, bin/idp-jit-grants]
    fixtures: {must_fail: tests/fixtures/jit-grants/bad.yaml, must_pass: tests/fixtures/jit-grants/good.yaml}
    cases:
      - {expect: refuse, args: [tests/fixtures/jit-grants/bad.yaml]}
      - {expect: pass, args: [tests/fixtures/jit-grants/good.yaml]}
      - {expect: pass, args: [platform/jit/grants.yaml], live: true, note: "the catalogue the broker actually mints from"}
    ok: "idp-jit-grants refuses the escalating catalogue; the live one cannot become standing access"
    fail: "idp-jit-grants cannot tell a time-boxed grant from a route to admin (WJ.5)"

  - id: fence-enforcement
    label: fencdrill
    statement: >-
      A profile of a denied packet is only ever a wall when the probe proved it could reach an
      allowed path; a probe that could not run is a fail-closed FAIL, never a pass
    law: zero-trust-boundary.md step 1
    planes: [ci]
    run: [python3, bin/idp-fence-enforcement]
    fixtures: {must_fail: tests/fixtures/fence-drill/gate-broken-fence.json, must_pass: tests/fixtures/fence-drill/gate-good.json}
    live_gap: "chidionyema/idp#2452 -- the input is a fence drill receipt and nothing in .github writes one, so the three fixtures are the only fence profiles this rule has ever read."
    cases:
      - {expect: pass, args: [tests/fixtures/fence-drill/gate-good.json]}
      - {expect: refuse, args: [tests/fixtures/fence-drill/gate-broken-fence.json]}
      - {expect: refuse, args: [tests/fixtures/fence-drill/gate-fail-closed.json], note: "a probe that never ran (shell 127) once read as a passing wall"}
    ok: "fence-enforcement drops a denied packet, fails closed when the probe could not run"
    fail: "fence-enforcement cannot tell a dropped packet from a leak or a dead probe (ZT step 1)"

  - id: calico-denyflow
    label: denyflow
