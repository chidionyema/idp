  origin: crew#250
  planes:
  - ci
  run:
  - python3
  - bin/cloud-agnostic-gate
  fixtures:
    must_fail: tests/fixtures/cloud-agnostic/bad
    must_pass: tests/fixtures/cloud-agnostic/good
  cases:
  - expect: refuse
    env:
      CLOUD_AGNOSTIC_ROOT: tests/fixtures/cloud-agnostic/bad
  - expect: pass
    env:
      CLOUD_AGNOSTIC_ROOT: tests/fixtures/cloud-agnostic/good
  - expect: pass
    live: true
  ok: cloud-agnostic-gate refuses a provider annotation, permits a plain Service, and the repo is clean
  fail: cloud-agnostic-gate is not discriminating or the platform names a cloud outside platform/oci
- id: vendor-agnostic
  label: agnostic
