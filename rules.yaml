    note: this repository's own workflows
  ok: every grading step in the tree can fail its run, or a later step asserts the captured verdict
  fail: 'measured 2026-09-10: ''set -u; grader | tee out'' exits 0 while the grader failed, so a run reports green having graded nothing. ''set -o pipefail'' or ''-e'' fixes it; a bare last command propagates without -e, and a later step that tests the captured rc is an assertion'
- id: cost-proof
  fast: true
  label: cost-proof
  statement: A pull request that changes a file deciding what the estate SPENDS carries a cost-proof block naming a before, an after and the command that took both -- a number with no way to re-take it is a remembered number, and a change that says caching-enabled without the measured pair is an assertion, not a proof. A change outside the cost paths is never refused.
  law: LAW 2
  planes:
  - ci
  run:
  - python3
  - bin/idp-cost-proof
  cases:
  - expect: refuse
    args:
