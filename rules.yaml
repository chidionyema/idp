- id: grader-exit-gate
  label: grader-exit
  statement: 'A grading step whose verdict cannot reach the run is refused: a grader piped into tee/cat with neither pipefail nor -e, a bare grader that is not the last command under a set line without -e, or a grader ending in ''|| true'' with no ''# optional: <reason>'' marker. The step is accepted when the same job asserts the captured verdict in a later step'
  law: LAW 28
  origin: incident 2026-09-10, grading steps whose verdict is discarded
  planes:
  - ci
  run:
  - python3
  - bin/idp-grader-exit-gate
  fixtures:
