  ok: vendor-agnostic-gate refuses a stray vendor name in workflow.py, permits the registry entry and the adapters/ wrapper, and sovereign/engine is clean
  fail: vendor-agnostic-gate is not discriminating or a vendor name has leaked into the engine outside runners.py
- id: estate-zone
  label: zone
  statement: The DNS zone is one value in clusters/*/estate-config.yaml; a platform file naming it as a literal fails, in the tree and in a pull-request diff
  law: R46
  origin: crew#269, crew#796
  planes:
  - ci
  run:
  - python3
  - bin/estate-zone-gate
  fixtures:
    must_fail: tests/fixtures/estate-zone/bad
    must_pass: tests/fixtures/estate-zone/good
  cases:
  - expect: refuse
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
  - expect: pass
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/good
  - expect: refuse
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
    args:
    - --diff
    - tests/fixtures/estate-zone/added-literal.diff
  - expect: pass
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
    args:
    - --diff
    - tests/fixtures/estate-zone/added-substituted.diff
  - expect: pass
    env:
      ESTATE_ZONE_ROOT: tests/fixtures/estate-zone/bad
    args:
    - --diff
    - tests/fixtures/estate-zone/added-self-marker.diff
  - expect: pass
    live: true
  ok: estate-zone-gate refuses a literal zone (tree and diff), permits the substituted form, and the repo is clean
  fail: estate-zone-gate is not discriminating or the platform names the zone outside clusters/*/estate-config.yaml
- id: port-lock
  label: portlock
  statement: A compose publication not declared in catalog/ports.yaml, or off loopback without non_loopback, fails
  law: R22 mechanism 4, R20
  origin: crew#186 CP4
  planes:
  - ci
  run:
  - python3
  - bin/port-gate
  fixtures:
    must_fail: tests/fixtures/ports-bad
    must_pass: catalog/ports.yaml
  cases:
  - expect: refuse
    env:
      COMPOSE_GLOB: tests/fixtures/ports-bad/*.yml
  - expect: pass
    live: true
    tail_of: true
  ok: '{tail}'
  tail_strip: ^ports\s+
  ok_fallback: port-gate refuses an undeclared publication and passes the repo
  fail: port-gate is not discriminating or the repo has an undeclared bind
- id: port-bind
  label: portbind
  statement: A listener bound to a different address than its ports.yaml row declares is refused
  law: R20
  planes:
  - ci
  run:
  - python3
  - bin/port-gate
  - --live
  fixtures:
    must_fail: tests/fixtures/ports-live/inventory.bad.json
    must_pass: tests/fixtures/ports-live/inventory.good.json
  cases:
  - expect: refuse
    env:
      REG: tests/fixtures/ports-live/ports.yaml
      INV: tests/fixtures/ports-live/inventory.bad.json
      COMPOSE_GLOB: none
      BIN_DIR: none
  - expect: pass
    env:
      REG: tests/fixtures/ports-live/ports.yaml
      INV: tests/fixtures/ports-live/inventory.good.json
      COMPOSE_GLOB: none
      BIN_DIR: none
  ok: port-gate --live refuses a bind that differs from the declared address and passes a matching one
  fail: port-gate --live does not discriminate on bind address
