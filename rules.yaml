- id: prm
  label: prm
  statement: A reasoning step's own completed-work claim is refused unless the transcript, up to and including that step, already holds three independent pieces of evidence for it (reusing the epistemic gate's own count), the step's tool call binds to the declared plan's active goal (reusing the trajectory lock's own authorize()), and the step is not a repeat of a (tool, target) pair already run this session. Process supervision, graded per step, not only at the end of the transcript
  law: founder essay 2026-09-14, the Reasoning Gateway ("Process Reward Models... evaluates the correctness of each step... rather than just the final outcome")
  origin: docs/tickets/2026-09-14-reasoning-gateway.md, deliverable D1
  planes:
