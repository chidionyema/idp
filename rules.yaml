    cases:
      - {expect: refuse, env: {TODAY: "2026-08-25"}, args: [tests/fixtures/ai-act/bad]}
      - {expect: pass, env: {TODAY: "2026-08-25"}, args: [tests/fixtures/ai-act/good]}
      - {expect: pass, live: true, args: ["."]}
    ok: "every registered AI system has its Annex IV file, risk entries and declared data; gate proved both ways"
    fail: "ai-act-gate does not discriminate, or a registered system has a gap"

  - id: law32-demo-onboarding
    label: law32
