- id: convergence-proof
  label: proof
  statement: An infrastructure pull request reaches the merge gate with a Proof-of-Convergence; a body with no such block, or whose proof's run is not a green run on its own head commit, is refused -- a
    missing or unparseable proof is a fail-closed FAIL, never a pass
  law: W2.3
  origin: docs/policy/agent-infra-safety-spec.md
  planes:
  - ci
  run:
  - python3
  - bin/idp-convergence-proof
  cluster:
    policy: null
    why: the subject sits in a pull request body and the proof refers to a shadow run no admission controller can see
  fixtures:
    must_fail: tests/fixtures/convergence/no-proof.md
    must_pass: tests/fixtures/convergence/proved.md
  cases:
  - expect: refuse
    args:
    - tests/fixtures/convergence/no-proof.md
    - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    note: no Proof-of-Convergence block in the body
  - expect: pass
    args:
    - tests/fixtures/convergence/proved.md
    - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    env:
      CONVERGENCE_RUN_GREEN: '1'
      CONVERGENCE_RUN_HEAD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    note: the proof's run is green and on the head commit
  - expect: refuse
    args:
    - tests/fixtures/convergence/proved.md
    - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    env:
      CONVERGENCE_RUN_GREEN: '1'
      CONVERGENCE_RUN_HEAD: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    note: the proof's run belongs to a different commit (W2.3)
  - expect: refuse
    args:
    - tests/fixtures/convergence/proved.md
    - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    env:
      CONVERGENCE_RUN_GREEN: '0'
      CONVERGENCE_RUN_HEAD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    note: an ungreen run is a fail-closed refuse, never a pass
  - expect: pass
    args:
    - tests/fixtures/convergence/proved.md
    - --from-env
    env:
      CONVERGENCE_HEAD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CONVERGENCE_RUN_HEAD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      CONVERGENCE_RUN_GREEN: '1'
    note: the CI seam -- all three witnesses come from the environment
  ok: a change that was never proved in the shadow dimension cannot reach the Greenlane (W2.3)
  fail: a change without a green Proof-of-Convergence on its own head could be auto-merged (W2.3)
