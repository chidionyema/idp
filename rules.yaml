version: 1
live_gap_budget: 10
rules:
- id: api-version-retired
  fast: true
  label: api-version-retired
  statement: A manifest naming a group/version this estate has migrated off is a row that never reconciles -- and it does not fail alone, because the whole Kustomization goes NotReady and every row depending on it stops too
  law: incident 2026-09-12, aevum-evidence held chaos and science out
  origin: platform/observability/aevum.yaml shipped apiVersion external-secrets.io/v1beta1. Every gate that reads a manifest reads it as YAML, and v1beta1 is perfectly good YAML, so CI was green; the failure surfaced only in Flux, as ExternalSecret dry-run "no matches for kind ExternalSecret in version external-secrets.io/v1beta1". The observability Kustomization went NotReady, and chaos and science then failed on their dependency -- one wrong string in one new file held three rows out of the cluster. The gate lists retired group/version pairs once, each with its replacement, and is proved both ways.
  planes:
  - ci
  - session
  session_glob:
  - platform/**/*.yaml
  - clusters/**/*.yaml
  run:
  - python3
  - bin/idp-api-version-gate
  cluster:
    policy: null
    why: the cluster serves what it serves; this grades the manifest in git against the versions the estate has already moved off
  fixtures:
    must_fail: tests/fixtures/api-version/bad
    must_pass: tests/fixtures/api-version/good
  live_elsewhere: bin/idp-ci:647 -- the apiversion rung grades the REAL platform/ and clusters/ trees the cluster reconciles, not the fixture pair
  cases:
  - expect: refuse
    args:
    - tests/fixtures/api-version/bad
  - expect: pass
    args:
    - tests/fixtures/api-version/good
  - expect: pass
    live: true
    note: the manifests actually committed
  ok: a retired group/version in a manifest is refused and the current one passes; the real tree is clean
  fail: a manifest names a group/version this estate has migrated off
- id: aevum-evidence
  fast: true
  label: aevum-evidence
  statement: 'A receipt that does not verify is not evidence: every recorded agent action chains to the previous one and is covered by a signature, and an EMPTY ledger is a fail-closed FAIL rather than a clean bill -- Aevum''s default store is in-memory and verify_sigchain() answers True about a chain with no events, so a misconfigured deployment reports green while recording nothing'
  law: decision 0028
  origin: 'Founder, 2026-09-12: "get Aevum wired for all current and future repos." POPDD signs with HMAC, a symmetric key, so only the holder of the signing key can verify a receipt; decision 0028 records the measured comparison and adopts Aevum (Ed25519 + ML-DSA-65, COSE_Sign1, RFC 3161, standalone aevum-verify). The whole value is one property -- an altered record must fail verification -- so the gate is proved both ways and fails closed on an empty ledger, the way bin/idp-calico-deny-log fails closed on an empty deny feed.'
  planes:
  - ci
  run:
  - python3
  - bin/idp-evidence-gate
  cluster:
    policy: null
    why: the chain is data in the estate's own Postgres, not a Kubernetes object; admission never sees a receipt
  fixtures:
    must_fail: tests/fixtures/aevum-evidence/bad/chain.json
    must_pass: tests/fixtures/aevum-evidence/good/chain.json
  live_elsewhere: 'bin/idp-ci:708 -- the evidence rung grades the REAL platform/observability/aevum.yaml the cluster reconciles: that it is wired into the observability kustomization, that it never configures the in-memory store, and that its gate refuses an altered record while passing a clean one'
  cases:
  - expect: refuse
    args:
    - tests/fixtures/aevum-evidence/bad/chain.json
  - expect: pass
    args:
    - tests/fixtures/aevum-evidence/good/chain.json
  ok: a receipt chains to its predecessor and is covered by its signature; an altered record and an empty ledger are both refused
  fail: an altered record or an empty ledger passes as evidence
- id: flux-subst
  fast: true
  label: flux-subst
  statement: No shell parameter expansion (${NAME:-...} and kin) in a Flux-reconciled manifest; Flux substitution rewrites it before the pod runs it
  law: incident 2026-09-06, otto-gateway
  planes:
  - ci
  - session
  session_glob:
  - platform/*.yaml
  - clusters/*.yaml
  run:
  - python3
  - bin/idp-flux-subst-gate
  cluster:
    policy: null
    why: the break is in the repo bytes; admission never sees the pre-substitution form
  fixtures:
    must_fail: tests/fixtures/flux-subst/bad.yaml
    must_pass: tests/fixtures/flux-subst/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/flux-subst/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/flux-subst/good.yaml
  - expect: pass
    live: true
    note: the manifests actually committed
  ok: no manifest hands Flux a shell expansion; the gate is proved both ways
  fail: a manifest hands Flux a shell expansion, or the gate is not discriminating
- id: flux-wait-brake
  fast: true
  label: flux-wait-brake
  statement: 'A Flux Kustomization never sets both wait: true and healthChecks; wait wins, the checks the author wrote are discarded, and the row then waits on every object in its path -- so one optional Job going Failed holds every change to that path out of the cluster'
  law: incident 2026-09-10, otto-gateway held out by Job/otto-memory-store-6
  origin: 'The otto-gateway row named one health check, Deployment/otto-gateway, and set wait: true above it. The Deployment was healthy. A one-shot backfill in the same path timed out reaching the LLM router, went Failed, and the row reported "failed early due to stalled resources" and stopped applying -- including the change that repairs the router path the backfill could not reach. The Job''s own manifest says "If this never runs, nothing breaks". 41 of the estate''s 82 Kustomizations carried the same dead healthChecks list.'
  planes:
  - ci
  - session
  session_glob:
  - clusters/**/*.yaml
  run:
  - python3
  - bin/idp-flux-wait-brake
  cluster:
    policy: null
    why: the break is in the Kustomization spec in git; admission never sees a row's own readiness policy
  fixtures:
    must_fail: tests/fixtures/flux-wait-brake/bad.yaml
    must_pass: tests/fixtures/flux-wait-brake/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/flux-wait-brake/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/flux-wait-brake/good.yaml
  - expect: pass
    live: true
    note: this estate's own cluster rows
  ok: no Kustomization declares healthChecks that wait would throw away
  fail: 'a Kustomization sets wait: true beside a healthChecks list, so the list is dead text and the row is braked by every object in its path'
- id: probe-host
  fast: true
  label: probe-host
  statement: 'No probe or lifecycle handler names a host: PodSecurity restricted refuses the pod at create, not the manifest at apply, so a workload carrying one merges green, reconciles green, and then its ReplicaSet fails to make a pod forever while the old pod keeps serving'
  law: incident 2026-09-10, otto-gateway three homes Available=False for hours
  origin: 'The otto-brain sidecar binds 127.0.0.1 by design (R20, and a lifeboat you reach without crossing a network). Its probes were pointed back at loopback with host: 127.0.0.1, which cannot work anyway -- the kubelet is not in the pod''s network namespace -- and which PodSecurity restricted forbids outright: "probe or lifecycle host (container \"otto-brain\" uses probe or lifecycle host \"127.0.0.1\")". Otto''s three homes merged and never ran. An exec probe runs inside the container, where loopback is the sidecar, and needs no host.'
  planes:
  - ci
  - session
  session_glob:
  - platform/**/*.yaml
  - clusters/**/*.yaml
  run:
  - python3
  - bin/idp-probe-host
  cluster:
    policy: null
    why: PodSecurity restricted already refuses it at pod create in every namespace; this row moves the refusal to the pull request, where it is readable
  fixtures:
    must_fail: tests/fixtures/probe-host/bad.yaml
    must_pass: tests/fixtures/probe-host/good.yaml
  cases:
  - expect: refuse
    args:
    - tests/fixtures/probe-host/bad.yaml
  - expect: pass
    args:
    - tests/fixtures/probe-host/good.yaml
  - expect: pass
    live: true
    note: this estate's own workloads
  ok: no probe or lifecycle handler names a host
  fail: a probe or lifecycle handler sets host, so PodSecurity restricted will refuse every pod the workload tries to create while the manifest itself stays green
- id: cloud-agnostic
