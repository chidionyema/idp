name: k8s-externalsecrets
description: >
  Composite intent. List ExternalSecrets and their sync status.
args:
  namespace: {type: string, default: ""}
  kubeconfig: {type: string, default: ""}
steps:
  - name: externalsecrets
    intent: kubectl-list
    args:
      resource: externalsecrets
      namespace: "{{namespace}}"
      all_ns: true
      output: json
  - name: status
    # One-line Python per statement: the executor strips the leading indent of a multi-line
    # `python3 -c` block, which turned the old try/for body into an IndentationError.
    cmd: |
      python3 -c "import sys,json; d=json.load(sys.stdin); items=d.get('items',[]); print(f'{len(items)} ExternalSecrets:'); [print(f\"  {e['metadata']['namespace']}/{e['metadata']['name']} ready={next((c.get('status') for c in e.get('status',{}).get('conditions',[]) if c.get('type')=='Ready'),'?')} reason={next((c.get('message','')[:160] for c in e.get('status',{}).get('conditions',[]) if c.get('type')=='Ready'),'')}\") for e in items]"
