# Estate defaults (crew#281, founder 2026-08-26: "Lazy consensus").
# LAW OF AUTONOMY: a session does not ask the founder for a decision this file already makes.
# Read this before any question to him. A value here is a default, not a secret and not a
# host: the zone stays in clusters/<cluster>/estate-config.yaml (LAW 46), this file only says
# which one is authoritative.
infrastructure:
  dns_zone_source: clusters/oke/estate-config.yaml#ESTATE_ZONE   # one value, one place (idp#140)
  compute_tier: auto-scale-paid       # never suspend for a limit; scale up to the monthly cap
  monthly_cap_usd: 50
node_pool:                            # crew#289: '4/24 or 2/12?' is answered here, never asked
  prefer_free: true                   # the Always Free allowance is the floor; growth above it is paid
  budget_monthly_usd: 50              # paid growth up to this is STAGED; above it is FOUNDER ACTION
policy:
  stale_repos: delete-if-no-remote-and-1-commit   # report first, then STAGED deletion (60 min)
  vendor_lock_in: hard-reject         # a PR that binds a platform layer to one provider's SDK fails review
  oauth_creation: terraform-automated # OIDC clients come from platform/oci/identity, never from a console
handoff_protocol:
  mode: lazy_consensus
  timeout_minutes: 0
  format: "STAGED: <action>. Done; say 'undo' to reverse it."
  founder_action_only_for: physical   # a hardware key, a device in his hand; nothing a token or an API can do
