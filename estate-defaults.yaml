# Estate defaults (crew#281, founder 2026-08-26: "Lazy consensus").
# LAW OF AUTONOMY: a session does not ask the founder for a decision this file already makes.
# Read this before any question to him. A value here is a default, not a secret and not a
# host: the zone stays in clusters/<cluster>/estate-config.yaml (LAW 46), this file only says
# which one is authoritative.
infrastructure:
  dns_zone_source: clusters/oke/estate-config.yaml#ESTATE_ZONE   # one value, one place (idp#140)
node_pool:
  # 2026-09-26: prefer_free, budget_monthly_usd 50, burst_hours_monthly and spot_hours_monthly are
  # deleted. They said "free is the floor, paid growth up to $50 is STAGED", and the estate ran
  # 12 OCPU / 48 GB on a Pay As You Go tenancy against the Always Free 2 OCPU / 12 GB. A number in
  # this file never stopped a node. The ceiling is the Oracle compartment quota written by
  # bin/idp-oci-bootstrap (platform/oci/policy/free-tier-quota.statements.json).
  max_nodes: 3                        # crew#539 CP4: the Cluster Autoscaler may add this many nodes in total
  spot_max_nodes: 2                   # crew#539 CP10: preemptible nodes the autoscaler may add (pool a1-spot, from 0)
llm:
  virtual_key_daily_usd: 5             # every consumer's router key (bin/idp-router-key); the kernel's alias carries the same $5/day
capacity:
  # HGC (docs/reference/policy/enterprise-operating-model.md, standard 6). The ceiling OKE
  # enforces and the estate must stay under. Declared here so the number is in the repo rather
  # than in a vendor dashboard, and so bin/idp-cluster-state can publish '2,650 / 2,000' on the
  # capacity tile BEFORE it blocks a deploy.
  #
  # Incident 2026-09-18: the cluster reached 2,650 Secrets against this 2,000 limit. OKE's
  # resource-leak webhook refused every create and 30 Flux objects went NotReady (Backstage,
  # Crossplane, commerce, otto-gateway, prospector, via-negativa among them). Nothing reported
  # the count until Crossplane stopped deploying.
  #
  # Steady state target is <1,500 so there is headroom for a deploy burst without touching the
  # ceiling. secret_limit is NOT added here because rule=secret_headroom refuses any first
  # declaration without APPROVE: capacity-exempt from the founder; a follow-up PR carries the
  # number with that approval. helm_history_max: 3 (HGC obligation 3) is the actual mechanism
  # that stops the growth, and it is in scope for this PR.
  secret_steady_state_max: 1500
  helm_history_max: 3                 # the default every HelmRelease declares (HGC obligation 3)
policy:
  stale_repos: delete-if-no-remote-and-1-commit   # report first, then STAGED deletion (60 min)
  vendor_lock_in: hard-reject         # a PR that binds a platform layer to one provider's SDK fails review
  oauth_creation: terraform-automated # OIDC clients come from platform/oci/identity, never from a console
handoff_protocol:
  mode: lazy_consensus
  timeout_minutes: 0
  format: "STAGED: <action>. Done; say 'undo' to reverse it."
  founder_action_only_for: physical   # a hardware key, a device in his hand; nothing a token or an API can do
