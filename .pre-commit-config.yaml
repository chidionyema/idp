# crew#584 CP-B (founder playbook, 2026-08-29, Phase 1): the checks git commit runs before the
# commit exists. .githooks/pre-commit runs these through `pre-commit run --files <staged>` when
# pre-commit is installed (`pip install pre-commit`, it is in the repo venv), and runs the same
# two checks inline when it is not, so the gate bites on every machine (LAW 27).
#
# Do not run `pre-commit install` here: every repo on the estate already routes git hooks
# through ~/.estate/guards/hooks/_router (core.hooksPath), which dispatches .githooks/pre-commit.
#
# `repo: local` + `language: system` on purpose: the same ruff and shellcheck bin/idp-ci uses,
# no network fetch on first commit, no upstream rev to drift from the CI flags.
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck -S warning (bin/idp-ci step 1)
        entry: shellcheck -S warning
        language: system
        files: ^bin/
        types: [shell]
      - id: bash-n
        name: bash -n
        entry: bash -n
        language: system
        files: ^bin/
        types: [shell]
      - id: ruff
        name: ruff check (pyproject [tool.ruff.lint] set)
        entry: ruff check --quiet
        language: system
        types: [python]
