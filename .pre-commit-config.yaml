# crew#584 CP-B (founder playbook, 2026-08-29, Phase 1): the checks git commit runs before the
# commit exists. .githooks/pre-commit runs these through `pre-commit run --files <staged>` when
# pre-commit is installed (`pip install pre-commit`, it is in the repo venv), and runs the same
# two checks inline when it is not, so the gate bites on every machine (LAW 27).
#
# Do not run `pre-commit install` here: every repo on the estate already routes git hooks
# through ~/.estate/guards/hooks/_router (core.hooksPath), which dispatches .githooks/pre-commit.
#
# `repo: local` + `language: system` on purpose: the same ruff and shellcheck bin/idp-ci uses,
# no network fetch on first commit, no upstream rev to drift from the CI flags.
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck -S warning (bin/idp-ci step 1)
        entry: shellcheck -S warning
        language: system
        files: ^bin/
        types: [shell]
      - id: bash-n
        name: bash -n
        entry: bash -n
        language: system
        files: ^bin/
        types: [shell]
      - id: ruff
        name: ruff check (pyproject [tool.ruff.lint] set)
        entry: ruff check --quiet
        language: system
        types: [python]

  # 207 files in this tree carry a "GENERATED by" banner. Several are graded by an exact-match
  # --check in CI, and until 2026-09-08 nothing regenerated any of them at commit time -- so the
  # only reminder that a derivative had gone stale was a red check ten minutes later, on another
  # machine, naming a command a person then had to remember. idp#2477 and idp#2495 both went red
  # within one hour on bin/idp-portal-buttons, and neither was a mistake in the change itself.
  # backstage/platform/catalog-info.yaml was stale on main at the same time and nothing said so.
  #
  # Each row below regenerates and then stages. The staging is not decoration: pre-commit notices
  # a hook's edits by diffing TRACKED files, and a new dispatchable workflow's portal button is a
  # NEW file -- the exact case that started this. Every row's files: includes its own outputs,
  # because a hand-edit of a generated file is drift too and each one says so in its own banner.
  - repo: local
    hooks:
      - id: portal-buttons
        name: every dispatchable workflow has its portal button (crew#66)
        entry: bash -c 'python3 bin/idp-portal-buttons && git add -A backstage/templates/founder-actions'
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/|backstage/templates/founder-actions/)
      - id: agents-md
        name: the AGENTS.md rule table follows rules.yaml
        entry: bash -c 'python3 bin/idp-rules render-agents-md && git add -A AGENTS.md'
        language: system
        pass_filenames: false
        files: ^(rules\.yaml|AGENTS\.md)$
      - id: vendor-render
        name: both LiteLLM configs follow the vendor registry
        entry: bash -c 'python3 bin/idp-vendor-render && git add -A llm/config.yaml platform/llm/config.yaml'
        language: system
        pass_filenames: false
        files: ^(platform/vendors/consoles\.yaml|llm/config(\.base)?\.yaml|platform/llm/config(\.base)?\.yaml)$
      - id: ns-fences
        name: every namespace fence follows allowances.yaml (crew#839)
        entry: bash -c 'python3 bin/idp-ns-fence-gen && git add -A platform/ns-fences'
        language: system
        pass_filenames: false
        files: ^platform/ns-fences/
      - id: catalog-platform
        name: the platform catalogue follows the Flux Kustomizations (crew#459)
        entry: bash -c 'python3 bin/catalog-platform && git add -A backstage/platform/catalog-info.yaml'
        language: system
        pass_filenames: false
        files: ^(clusters/|platform/|backstage/platform/catalog-info\.yaml$)
