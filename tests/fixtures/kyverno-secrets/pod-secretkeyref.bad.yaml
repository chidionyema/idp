# must-fail: a container reads a secret via env.valueFrom.secretKeyRef.
# Real shape upstream Helm charts default to; the exact class crew#341 exists
# to catch before it reaches a live namespace.
apiVersion: v1
kind: Pod
metadata:
  name: bad-env-secret
  namespace: default
spec:
  containers:
    - name: app
      image: example/app:latest
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: password
