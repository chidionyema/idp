# A key nobody ever put in the estate vault. bin/idp-vault-refs must name it and the file that
# wants it -- this is the shape of the 2026-09-07 incident, where bridge-instance-ocid had been
# scheduled for deletion and every read of it answered 404 for two days.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wants-a-key-that-is-not-there
  namespace: demo-sandbox
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: wants-a-key-that-is-not-there }
  data:
    - secretKey: nope
      remoteRef: { key: a-secret-the-estate-vault-has-never-held }
