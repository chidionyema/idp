# The same manifest asking for a key the estate vault actually holds, plus the case that made the
# gate wrong the first time: an entry naming its own store. The human-vault key must not be graded
# against the estate vault (platform/cyrus/external-secret.yaml does exactly this).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wants-keys-that-are-there
  namespace: demo-sandbox
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target: { name: wants-keys-that-are-there }
  data:
    - secretKey: ocid
      remoteRef: { key: bridge-instance-ocid }
    - secretKey: from-the-other-vault
      sourceRef:
        storeRef: { kind: ClusterSecretStore, name: human-vault }
      remoteRef: { key: cyrus-linear-api-token }
