kind: Pod
metadata:
  name: impostor
  namespace: temporal
spec:
  containers:
    - name: worker
      image: ghcr.io/chidionyema/sovereign-worker:main-789-76fb81a88b8773aa5550bc67ff1d866292bd5a12
