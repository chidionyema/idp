# The catalogue Deployment exactly as it stood at 2026-08-28T09:00Z, when
# catalogue-8647bbdc59-kjc9j sat Pending with node <none> and the old ReplicaSet kept serving
# a 17-hour-old portal. maxSurge 1 asks for a THIRD pod on a two-node pool; hard hostname
# anti-affinity forbids placing it beside either existing replica; maxUnavailable 0 forbids
# freeing one first. There is no legal move.
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalogue, namespace: backstage}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalogue}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata: {labels: {app: catalogue}}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: catalogue}}
      containers: [{name: c, image: busybox}]
