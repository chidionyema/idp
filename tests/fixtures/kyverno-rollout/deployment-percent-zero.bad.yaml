# 25% of 2 replicas, rounded down, is 0. Spelling the default out loud must be refused for the
# same reason omitting it is -- otherwise the policy grades the string and not the arithmetic.
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalogue-percent, namespace: backstage}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalogue}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: "25%", maxUnavailable: "0%"}}
  template:
    metadata: {labels: {app: catalogue}}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: catalogue}}
      containers: [{name: c, image: busybox}]
