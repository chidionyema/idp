apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: edge
spec:
  replicas: 1
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: worker:1
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 128Mi
              cpu: 500m
