# Seven objects, each coupled to a provider one way; provider-independence must refuse every one.
apiVersion: v1
kind: Service
metadata:
  name: lb-with-oci-shape
  namespace: apps
  annotations:
    oci.oraclecloud.com/load-balancer-type: lb
spec:
  type: LoadBalancer
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: lb-with-aws-annotation
  namespace: apps
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: lb-with-provider-class
  namespace: apps
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb-eks.amazonaws.com
  ports: [{port: 80}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claim-on-oci-bv
  namespace: apps
spec:
  storageClassName: oci-bv
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-on-gp3
  namespace: apps
spec:
  serviceName: db
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers: [{name: db, image: db:1}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: gp3
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-with-oci-csi
  namespace: apps
spec:
  selector: {matchLabels: {app: x}}
  template:
    metadata: {labels: {app: x}}
    spec:
      containers: [{name: x, image: x:1}]
      volumes:
        - name: v
          csi:
            driver: blockvolume.csi.oraclecloud.com
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: second-door
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
