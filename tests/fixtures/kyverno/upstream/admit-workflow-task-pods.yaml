# A Chaos Mesh Workflow Task pod runs one command to completion, owned by a WorkflowNode. Same
# rule as admit-job-pods.yaml: a probe on it describes nothing. crew#292 CP4, 2026-08-26: the
# receipt step of platform/chaos/backstage-pod-kill.yaml is such a pod. Appended after the Job
# precondition; nothing else is relaxed (tests/test_incident_chaos_task_pod_admitted.py proves
# the same pod under a ReplicaSet is still refused).
- op: add
  path: /spec/rules/0/preconditions/all/-
  value:
    key: "{{ request.object.metadata.ownerReferences[0].kind || '' }}"
    operator: NotEquals
    value: WorkflowNode
