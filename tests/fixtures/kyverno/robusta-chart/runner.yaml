# robusta chart 0.48.0, the parts of Deployment/robusta-runner that carry a secret
# reference. Vendored so the postRenderer patch can be proved offline; the CI kyverno
# rung renders the real chart and catches drift (crew#539).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robusta-runner
  namespace: robusta
spec:
  template:
    spec:
      containers:
      - name: runner
        envFrom:
        - secretRef:
            name: robusta-runner-secret
            optional: true
        volumeMounts:
        - name: auth-config-secret
          mountPath: /etc/robusta/auth
        - name: playbooks-config-secret
          mountPath: /etc/robusta/config
      volumes:
      - name: playbooks-config-secret
        secret:
          secretName: robusta-playbooks-config-secret
          optional: true
      - name: auth-config-secret
        secret:
          secretName: robusta-auth-config-secret
          optional: true
