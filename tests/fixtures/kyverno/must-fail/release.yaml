# bin/idp-kyverno-render must refuse this: the chart's own defaults, no restricted-profile patches.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: grafana }
spec: { interval: 24h, url: https://grafana.github.io/helm-charts }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: alloy }
spec:
  interval: 1h
  chart: { spec: { chart: alloy, version: 1.12.1, sourceRef: { kind: HelmRepository, name: grafana } } }
