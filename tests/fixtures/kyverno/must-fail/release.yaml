# bin/idp-kyverno-render must refuse this: the chart's own defaults, no restricted-profile patches.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: { name: signoz }
spec: { interval: 24h, url: https://charts.signoz.io }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: { name: signoz }
spec:
  interval: 1h
  chart: { spec: { chart: signoz, version: 0.138.0, sourceRef: { kind: HelmRepository, name: signoz } } }
