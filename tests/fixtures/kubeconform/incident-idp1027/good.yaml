# The fix landed in commit cd9911df (idp#1027): the flux-system/github-app Secret now templates
# githubAppIDQuoted/githubAppInstallationIDQuoted with `| quote`, so the substituted text carries
# its own double quotes and survives kustomize build's plain re-emission as a string. Same
# resource as incident-idp1027/bad.yaml, after substitution, with the fix applied.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: hermes-agent-github
  namespace: hermes-agent
spec:
  appID: "4740261"
  installID: "88097955"
  permissions:
    metadata: read
    contents: write
    pull_requests: write
    issues: write
    checks: read
  auth:
    privateKey:
      secretRef:
        name: github-app-pem
        key: key
