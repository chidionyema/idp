# The pre-fix shape of idp#1027 (commit cd9911df's parent), as it actually reaches the API
# server: kustomize build re-emits scalars plain, so the quotes around ${githubAppID} in
# platform/hermes-agent/gateway.yaml are gone by the time Flux's envsubst runs, and envsubst
# substitutes the bare numeral text-in-text. The YAML that results -- this file -- types
# spec.appID as an integer, which the CRD (generators.external-secrets.io v1alpha1
# GithubAccessToken) declares a string. Run 33339964930: ".spec.appID: expected string, got
# 4740261". kubeconform must refuse this file; see incident-idp1027/good.yaml for the fix.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: hermes-agent-github
  namespace: hermes-agent
spec:
  appID: 4740261
  installID: 88097955
  permissions:
    metadata: read
    contents: write
    pull_requests: write
    issues: write
    checks: read
  auth:
    privateKey:
      secretRef:
        name: github-app-pem
        key: key
