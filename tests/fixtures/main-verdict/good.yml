# Stale pull-request runs are cancelled; main's own run is never cancelled AND never evicted
# from the queue, because every main commit gets its own concurrency group.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - run: true
