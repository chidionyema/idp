# The pre-fix shape of platform/cyrus/external-secret.yaml: a token re-minted every ten minutes
# with nothing said about Reloader. Refused.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minted-silent
  namespace: cyrus
spec:
  refreshInterval: 10m
  secretStoreRef: { kind: ClusterSecretStore, name: estate-vault }
  target:
    name: minted-silent
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: minted-silent
