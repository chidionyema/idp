# The pre-fix state, verbatim from commit 5a151c2b (platform/healthchecks/healthchecks.yaml, the
# metadata block only). It is kept here so the control can be watched failing on every run and not
# only on the day it was written: founder, 2026-08-30 (c08d08d9.md), "a control must be
# demonstrated failing against the pre-fix state before the task can close ... a control nobody has
# watched fail is not known to work -- it's a green check of unknown provenance, which is precisely
# what the stale expected list was".
#
# The list below is the defect: it names one Secret, `healthchecks`, and the day a second Secret is
# mounted it is silently incomplete. platform/edge/require-auto-reload.yaml must refuse this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthchecks
  namespace: healthchecks
  annotations:
    secret.reloader.stakater.com/reload: "healthchecks"
  labels: { app.kubernetes.io/name: healthchecks, app.kubernetes.io/part-of: idp }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: healthchecks }
  template:
    metadata:
      labels: { app.kubernetes.io/name: healthchecks, app.kubernetes.io/part-of: idp }
    spec:
      containers:
        - name: healthchecks
          image: healthchecks/healthchecks:v4.3
          envFrom:
            - secretRef: { name: healthchecks }
