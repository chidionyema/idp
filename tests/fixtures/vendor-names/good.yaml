# The same role under a name no vendor operator ever created, so nothing it left behind can
# block it. The bound ServiceAccount is namespaced and keeps its upstream name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: estate-calico-node
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: estate-calico-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: estate-calico-node
subjects:
  - kind: ServiceAccount
    name: calico-node
    namespace: kube-system
