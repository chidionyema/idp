# The otto-gateway shape of 2026-09-10: one health check that names the Deployment,
# and wait: true above it, which throws that check away and waits on the whole path.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otto-gateway
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/otto-gateway
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: otto-gateway
      namespace: otto-gateway
