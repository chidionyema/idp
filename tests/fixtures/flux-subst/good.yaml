# must-pass: the unbraced form says the same thing to the shell and nothing to
# Flux; a plain ${NAME} with no operator is a Flux substitution and stays legal.
apiVersion: apps/v1
kind: Deployment
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - { name: FOUNDER_MAC_USER, value: "${FOUNDER_MAC_USER}" }
          args:
            - |
              if [ -d "$HERMES_ENV_DIR" ]; then
                echo exported
              fi
---
# A document that opts out of substitution keeps the shell's own syntax.
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check
              args: ['sh', '-c', 'MAX_USD="${SPEND_VELOCITY_MAX_DOLLARS:-10.0}"']
