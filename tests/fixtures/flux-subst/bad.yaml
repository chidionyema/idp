# must-fail: a shell default expansion in a container command. Flux postBuild
# substitution rewrites ${HERMES_ENV_DIR:-} to "" before the pod runs it.
apiVersion: apps/v1
kind: Deployment
spec:
  template:
    spec:
      containers:
        - name: gateway
          args:
            - |
              if [ -n "${HERMES_ENV_DIR:-}" ] && [ -d "$HERMES_ENV_DIR" ]; then
                echo exported
              fi
---
# Escaping in an opted-out document leaves $${ for the shell, which reads $$ as its pid.
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check
              args: ['sh', '-c', 'MAX_USD="$${SPEND_VELOCITY_MAX_DOLLARS:-10.0}"']
