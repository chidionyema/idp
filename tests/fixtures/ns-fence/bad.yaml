# Four namespaces, four different ways to get this wrong. Each one is a mistake
# that has a name and that a reviewer reading the diff would plausibly wave
# through, which is why the gate has to be the one reading it.
---
# 1. The flat namespace. This is what `kubectl create namespace` gives you, and
#    it is the measured backdoor: cross-namespace HTTP 200 in 4ms.
apiVersion: v1
kind: Namespace
metadata:
  name: fixture-flat
---
# 2. The quota with no LimitRange. This looks like the safe half of the job and
#    is worse than nothing: every pod that does not declare cpu and memory is
#    refused with "must specify limits.cpu", so the fence is an outage.
apiVersion: v1
kind: Namespace
metadata:
  name: fixture-quota-only
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: fixture-quota-only
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fixture-quota-only
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
---
# 3. Egress denied and nothing allows DNS. The classic. Nothing here says
#    "blocked" at runtime -- every outbound call just takes five seconds, and
#    the incident gets filed against the application.
apiVersion: v1
kind: Namespace
metadata:
  name: fixture-no-dns
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: fixture-no-dns
spec:
  hard: {requests.cpu: "1", requests.memory: 1Gi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: fixture-no-dns
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 512Mi}
      defaultRequest: {cpu: 50m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fixture-no-dns
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 4. The policy that is named like a default and is not one. `podSelector` picks
#    pods carrying one label, so every pod without that label is unprotected.
#    The name says default-deny-all; the selector says otherwise, and the gate
#    reads the selector.
apiVersion: v1
kind: Namespace
metadata:
  name: fixture-selective-deny
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: fixture-selective-deny
spec:
  hard: {requests.cpu: "1", requests.memory: 1Gi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: fixture-selective-deny
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 512Mi}
      defaultRequest: {cpu: 50m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fixture-selective-deny
spec:
  podSelector:
    matchLabels:
      app: guarded
  policyTypes: [Ingress, Egress]
