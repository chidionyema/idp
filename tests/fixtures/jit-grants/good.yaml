# The closed set of things the JIT broker may ever mint. WJ.5.
#
# WHY A CATALOGUE AND NOT A REQUEST BODY. The broker can mint write access on a cluster where
# nothing else holds any, so an agent that can describe its own permission has admin the moment it
# is creative. Here it cannot describe one: it names a grant from this file and fills the
# parameters that grant declares. Anything not in this file cannot be asked for, so it cannot be
# approved by a tired founder at 3am either -- the phone only ever shows a row that already passed
# bin/idp-jit-grants.
#
# WHY TWO MODES. Kubernetes RBAC has no field-level scope, so `patch deployment` is not the small
# permission it reads as: it lets the holder change serviceAccountName to a privileged account, or
# add a hostPath mount, and escalate out of the grant entirely. So for every verb that can rewrite
# a pod spec the agent gets no token at all -- it gets an outcome. `mode: broker-applies` means the
# broker performs exactly the parameterised change the founder saw on his phone and hands back the
# result. The agent never holds the verb. bin/idp-jit-grants refuses any escalating grant that asks
# for `mode: token`, so this is a property of the file, not a habit.
#
# WHY THE TTLs ARE SHORT. The revoke is the token expiring, not a cleanup job running (WJ.4). A
# short life is the whole guarantee, and 30 minutes is the ceiling this file may declare.
#
# Changing this file is glass-break, permanently (WJ.8): CODEOWNERS names the founder on
# /platform/, and no merge bot may land a change here.

apiVersion: idp.mumchimp.com/v1
kind: GrantCatalogue
grants:
  # The founder's own worked example: the 3am OOMKill.
  - id: raise-memory-limit
    provider: kubernetes
    why: A workload is being killed for memory and needs a higher ceiling to stay up
    mode: broker-applies
    verbs: [patch]
    apiGroups: [apps]
    resources: [deployments, statefulsets]
    namespaces: [backstage, catalogue, commerce, hermes-agent, llm, notify, observability, otto-gateway, prospector, research-engine]
    max_ttl: 10m
    rate_per_hour: 3
    parameters:
      workload: {type: name, required: true}
      namespace: {type: namespace, required: true}
      memory: {type: quantity, required: true, max: 2Gi}

  # Restarting a crash-looping workload. Deleting a Pod is a restart; the Deployment recreates it.
  # It cannot rewrite a pod spec, so a token is safe here and the agent gets one.
  - id: restart-workload
    provider: kubernetes
    why: A workload is crash-looping or wedged and a restart is the whole fix
    mode: token
    verbs: [delete]
    apiGroups: [""]
    resources: [pods]
    namespaces: [backstage, catalogue, commerce, hermes-agent, llm, notify, observability, otto-gateway, prospector, research-engine]
    max_ttl: 5m
    rate_per_hour: 4
    parameters:
      pod: {type: name, required: true}
      namespace: {type: namespace, required: true}

  # Rolling one workload back to an image tag it already ran. Rewrites a pod spec field, so the
  # broker applies it rather than handing over patch.
  - id: rollback-image
    provider: kubernetes
    why: A new image is failing in production and the previous one is known good
    mode: broker-applies
    verbs: [patch]
    apiGroups: [apps]
    resources: [deployments]
    namespaces: [backstage, catalogue, commerce, hermes-agent, llm, notify, observability, otto-gateway, prospector, research-engine]
    max_ttl: 10m
    rate_per_hour: 2
    parameters:
      workload: {type: name, required: true}
      namespace: {type: namespace, required: true}
      tag: {type: image_tag, required: true, must_be_previously_deployed: true}

  # WJ.15. Below Kubernetes. The estate also runs on OCI, on GitHub and on DNS, and zero standing
  # privilege in one layer is not zero standing privilege. These three go through the same ask,
  # the same tap, the same ledger, the same rate limit and the same kill switch -- and all three
  # are broker-applies, because none of those providers can mint a credential that is scoped to
  # what the founder approved and dies on its own. bin/idp-jit-grants refuses `mode: token` on
  # any of them, so that is a property of the file rather than a habit.

  # The node pool is out of room and the fix is two more nodes for an hour. Growing is allowed;
  # shrinking is not -- draining a node is an eviction, and an eviction is an outage decision.
  - id: oci-scale-node-pool
    provider: oci
    why: The cluster has no room left to schedule a workload and needs another node
    mode: broker-applies
    operations: [update-node-pool]
    compartment: oke
    max_ttl: 10m
    rate_per_hour: 2
    parameters:
      node_pool: {type: name, required: true}
      size: {type: integer, required: true, max: 6, min: 2}

  # A surface is answering on the wrong address after a rebuild. The record moves to a target
  # this estate already runs; the apex, the gateway and the identity records are refused by the
  # gate, so the road back is never the thing being moved.
  - id: dns-point-record
    provider: dns
    why: A surface answers on the wrong address and one record has to point at the live one
    mode: broker-applies
    records: [signoz, langfuse, backstage, portal, catalogue, prospector, hermes]
    record_types: [A, CNAME]
    max_ttl: 10m
    rate_per_hour: 2
    parameters:
      record: {type: name, required: true}
      record_type: {type: record_type, required: true}
      target: {type: name, required: true}

  # A check failed on infrastructure, not on the change. Re-running a job runs the workflow the
  # merged commit already carries; it cannot introduce one. The repository that holds the broker
  # is refused by the gate whatever this asks for, so a re-run can never be a way back into the
  # fence (WJ.8).
  - id: github-rerun-failed-checks
    provider: github
    why: A pull request check failed on infrastructure rather than on the change itself
    mode: broker-applies
    repositories: [chidionyema/prospector, chidionyema/hermes-v2, chidionyema/crew]
    permissions: [actions]
    operations: [rerun-failed-jobs]
    max_ttl: 5m
    rate_per_hour: 3
    parameters:
      repository: {type: repository, required: true}
      run_id: {type: integer, required: true, max: 999999999999}
