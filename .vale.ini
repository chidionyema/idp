# Plain English on every human surface (founder, 2026-08-31: "dev speak should never cross
# boundaries"; "all docs, all sites jargon free"). Vale is the prose linter; this file is the
# boundary. The paths it grades are the ones a person reads on a site: the docs tree (rendered by
# Backstage TechDocs, mkdocs.yml), the Backstage catalogue and buttons, the drill catalogue, the
# README. Code, commits, pull-request bodies and workflow comments are the engineers' side and are
# not graded here. Errors fail the pull request (.github/workflows/prose.yml); warnings are the
# Microsoft plain-language style and are counted, not yet gating.
StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/errata-ai/Microsoft/releases/download/v0.15.1/Microsoft.zip
Vocab = Estate

[*.md]
# links and template expressions are not words a person reads
TokenIgnores = (https?://[^\s)]+), (\$\{\{[^}]+\}\})
BasedOnStyles = Vale, Estate, Microsoft
# the Microsoft package's opinions on tone stay advisory
Microsoft.Contractions = NO
# the estate writes " — " with spaces; that is house style, not dev speak
Microsoft.Dashes = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.Vocab = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Vale.Spelling = NO
# product-name capitalisation is not dev speak
Vale.Terms = NO

# The Backstage catalogue, the buttons and the drill catalogue are YAML; the fields a person reads
# in them are extracted and graded by tests/test_incident_crew612_cp8_dev_speak_never_crosses_the_boundary.py
# with this same configuration (vale --ext=.md).
