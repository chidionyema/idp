name: "Bitwarden -> GitHub Actions Automated Secret Sync"

on:
  schedule:
    # Automatically sync specified secrets from Bitwarden every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Trigger Bitwarden -> GitHub Actions secret sync"
        required: false
        default: "Sync allowlisted secrets from Bitwarden Vault"

permissions:
  contents: read

jobs:
  sync_from_bitwarden:
    name: "Pull Allowlisted Secrets from Bitwarden & Update GitHub Actions Secrets"
    runs-on: ubuntu-latest
    # Runs automatically whenever BITWARDEN_ACCESS_TOKEN is configured in GitHub Secrets
    if: ${{ vars.ENABLE_BITWARDEN_SYNC != 'false' }}
    steps:
      - name: Checkout Secret Manifest Allowlist
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/secrets/bitwarden-secret-manifest.json

      - name: Check Bitwarden Machine Account Token Presence
        id: check_bw
        env:
          BW_TOKEN: ${{ secrets.BITWARDEN_ACCESS_TOKEN }}
        run: |
          if [ -z "${BW_TOKEN}" ]; then
            echo "status=SKIPPED_NO_BITWARDEN_ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Note: Set BITWARDEN_ACCESS_TOKEN once in GitHub Secrets (or run sync-bitwarden-to-github.sh locally with bw CLI)."
          else
            echo "status=READY" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Secrets from Bitwarden Secrets Manager (Official Action)
        if: steps.check_bw.outputs.status == 'READY'
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BITWARDEN_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_ARGO_SYNC_PAT }} > ARGO_SYNC_PAT
            ${{ vars.BW_SECRET_ID_GEMINI_API_KEY }} > GEMINI_API_KEY

      - name: Sync Fetched Secrets to Repository Actions Secrets via gh CLI
        if: steps.check_bw.outputs.status == 'READY'
        env:
          GH_TOKEN: ${{ env.ARGO_SYNC_PAT || secrets.ARGO_SYNC_PAT || secrets.GITHUB_TOKEN }}
          SYNC_ARGO_PAT: ${{ env.ARGO_SYNC_PAT }}
          SYNC_GEMINI_KEY: ${{ env.GEMINI_API_KEY }}
        run: |
          if [ -n "${SYNC_ARGO_PAT}" ]; then
            echo -n "${SYNC_ARGO_PAT}" | gh secret set ARGO_SYNC_PAT --repo "${GITHUB_REPOSITORY}"
            echo -n "${SYNC_ARGO_PAT}" | gh secret set ARGON_GITHUB_PAT --repo "${GITHUB_REPOSITORY}"
          fi
          if [ -n "${SYNC_GEMINI_KEY}" ]; then
            echo -n "${SYNC_GEMINI_KEY}" | gh secret set GEMINI_API_KEY --repo "${GITHUB_REPOSITORY}"
          fi
