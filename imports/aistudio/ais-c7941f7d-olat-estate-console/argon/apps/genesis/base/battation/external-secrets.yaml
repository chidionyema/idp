apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: battation-cif-receipt-key
  namespace: genesis-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-genesis-backend
    kind: ClusterSecretStore
  target:
    name: estate-receipt-hmac-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          genesis.olat.io/isolated-consumers: "estate-execute,litellm-verifier,battation-ledger"
          genesis.olat.io/agent-access: "DENIED_ZERO_TRUST"
  data:
    - secretKey: ESTATE_RECEIPT_KEY
      remoteRef:
        key: genesis/cif/estate-receipt-hmac-sha256
        property: current_key
