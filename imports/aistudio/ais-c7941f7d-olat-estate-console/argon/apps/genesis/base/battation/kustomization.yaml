apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: genesis-system

resources:
  - deployment.yaml
  - service.yaml
  - external-secrets.yaml

commonLabels:
  app.kubernetes.io/name: battation-metering-ledger
  app.kubernetes.io/part-of: olat-estate-genesis
  genesis.olat.io/era: ERA_1
  genesis.olat.io/req: REQ-23

configMapGenerator:
  - name: battation-ledger-invariants
    literals:
      - FIXED_POINT_SCALE=1000000000
      - ROUNDING_MODE=ROUND_HALF_EVEN
      - ORACLE_PASS_BUDGET_CEILING=2
      - POOR_ORACLE_CHARGE_ACCOUNT=System:OracleDefectExpense
      - BI_TEMPORAL_GRACE_WATERMARK_HOURS=72
      - SPARSE_MERKLE_TREE_HASH=BLAKE3_256
      - CONTINUOUS_FALSIFICATION_CRON=0 */6 * * *
