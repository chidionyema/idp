[package]
name = "estate-router"
version = "2.4.0"
edition = "2021"
authors = ["Estate Overwatch Systems <otto-day0@estate.internal>"]
description = "Ultra-low-latency lock-free Rust model router with cache-aligned Atomic EWMA scoring, SIMD-style JSON-RPC classification, speculative hedging, 3-tries ring fence, 4096-token auto-compaction, and Consulting-Lane Inbox protocol sandboxing for MiniMax M2.7 big tickets."

[dependencies]
axum = { version = "0.7", features = ["macros", "ws", "json"] }
tokio = { version = "1.41", features = ["full", "rt-multi-thread", "parking_lot"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dashmap = "6.1"
crossbeam-utils = "0.8"
bytes = "1.8"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
