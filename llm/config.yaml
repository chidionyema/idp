# GENERATED by bin/idp-vendor-render -- vendor lanes and fallback chains come from
# platform/vendors/consoles.yaml (`router:` blocks), everything else from llm/config.base.yaml.
# Edit those two, never this file; bin/idp-ci fails when this file and a fresh render differ.
# LiteLLM routing. This file replaces the chain-building half of prospector/operator.py.
#
# Standard: crew/docs/STANDARDS.md "LLM providers" (LiteLLM, adopted 2026-08-24).
#
# The names on the left are the ONLY thing prospector sees. They are deliberately the same
# tier names config.yaml already uses (`operator:`, `noncritical_operator:`), so the
# migration is a `providers:` block pointing at 127.0.0.1:4000 and not a rewrite.
#
# WHAT IS NOT HERE. `claude_cli` and `gemini_cli` are absent on purpose. They are local CLI
# binaries spending a SUBSCRIPTION, not HTTP endpoints spending an API key, and a proxy
# cannot drive them. They stay in prospector, they stay the trusted `moat_primary` tier,
# and they stay the EUR 0 path (R14).

model_list:
  # This key has been mounted in the router pod for days and served no model row, so the
  # estate router held an OpenRouter credential it could not use. Founder, 2026-09-10:
  # "all agets send should be in litelln".
  #
  # Last resort and honestly the weakest lane in the matrix, kept because a fourth free
  # vendor is a fourth failure domain. Of four `:free` tool-capable models asked in one
  # run from the otto-gateway pod on 2026-09-10:
  #   nvidia/nemotron-3-ultra-550b-a55b:free   timed out at 45s
  #   thinkingmachines/inkling:free            403, "only available on agentic harnesses"
  #   google/gemma-4-26b-a4b-it:free           429 from the upstream provider
  #   nvidia/nemotron-3.5-lightning:free       200 in 8.68s, but no tool call
  # and OpenRouter's `:free` slugs churn -- three that every list still names answer
  # 404 "This model is unavailable for free."
  - model_name: openrouter
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      # 8.68s measured, and its free pool is shared, so it queues where the others do not.
      timeout: 90
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 300
      max_tokens: 8192
      # DeepSeek V3 pricing: $0.14/M input, $0.28/M output (platform.deepseek.com, 2026-09)
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
    model_info:
      max_input_tokens: 65536

  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 200000

  # --- the moat's cheap primary --------------------------------------------------------
  # MiniMax has no first-class LiteLLM provider; it is OpenAI-compatible, so it is declared
  # with an explicit api_base rather than a provider prefix.
  - model_name: minimax
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      max_tokens: 8192
      # Without these two the router prices this lane at $0.0000 a call. Measured
      # 2026-09-04 from LiteLLM_SpendLogs: 176 million MiniMax tokens across three
      # consumers since 2026-08-27, every row recorded as zero spend, so
      # general_settings.max_budget could never trip and the vendor's own plan ran
      # out with nothing in the estate showing a cost. MiniMax is OpenAI-compatible
      # rather than a first-class provider, so LiteLLM has no price for it unless
      # the row carries one. MiniMax-M3 is priced $0.30 per million in and $1.20 per
      # million out up to 512K input tokens, and $0.60 / $2.40 above that (vendor
      # pricing page, read 2026-09-07) -- so this lane is the same money per token as
      # the MiniMax-M2 it replaces, for every turn the cap below admits.
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
    model_info:
      # crew#506 CP1: the router refuses an oversized turn before it leaves the estate.
      # MiniMax-M3 carries 1,048,576 tokens of context, but LiteLLM holds one rate per lane
      # and MiniMax doubles its rate above 512K input. So the cap is set where the price
      # above stops being true, not where the model stops reading: a turn over 512K would
      # bill at twice what this row records, and a lane that under-reports its own spend is
      # how 176 million tokens went by as $0.0000 in the first place. A turn above the cap
      # 400s here instead of walking the fallback chain into unfunded lanes (the 2026-08-27
      # Telegram outage).
      max_input_tokens: 512000

  # The constrained-decoding variant of the primary lane (MUM-289).
  # Identical billing and rate limits, but the proxy returns strict JSON
  # only — the 400 cases callers hit parsing free-form prose from a model
  # that should have been structured are avoided here. Consumers opt in
  # by routing to `minimax_json` rather than `minimax`; the unconstrained
  # lane is unchanged.
  - model_name: minimax_json
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      max_tokens: 8192
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      # Forces the model into JSON-only output. LiteLLM forwards
      # response_format to OpenAI-compatible providers, and MiniMax is one
      # (api_base above), so this is the contract the proxy enforces.
      response_format: { type: json_schema, json_schema: { name: estate_json, schema: { type: object, additionalProperties: true } } }
    model_info:
      max_input_tokens: 512000

  # The failover tier: same account and adapter, different model. It is a failover, never
  # a routing choice — see prospector config.yaml on `minimax_m27`.
  - model_name: minimax_m27
    litellm_params:
      # The name was aspirational until 2026-09-07: the lane called minimax_m27 served
      # MiniMax-Text-01, because M2.7 did not exist when the lane was cut. It does now, so
      # the lane serves what it is named after and a reader of the router config is no
      # longer told one model and given another.
      model: openai/MiniMax-M2.7
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      # Priced for the same reason as the row above; without it the failover tier is
      # the free-looking way around a cap the primary now respects.
      # MiniMax-M2.7: $0.30 per million in, $1.20 per million out (vendor pricing page,
      # read 2026-09-07) -- dearer per token than the MiniMax-Text-01 it replaces, and
      # that is the point: a failover that is cheaper than the primary is an invitation
      # to route to it.
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
    model_info:
      # M2.7 reads 204,800 tokens, a fifth of the primary's window. Capped here so an
      # oversized turn is refused by the estate rather than by the vendor mid-failover.
      max_input_tokens: 204800

  # MiniMax-M3.1-Flash: a sibling lane, never a replacement (2026-10-21). MiniMax-M3 is what
  # every measured path in this file answers on today (the voice rows below included), so the
  # new model gets its own name and a caller asks for it the way it asks for `minimax_m27`.
  # Specs read 2026-10-21 from the launch post's own pricing table (minimax.io/blog/minimax-m31f)
  # and the API docs' model table (platform.minimax.io/docs/guides/text-generation): model id
  # `MiniMax-M3.1-Flash`, 1,000,000-token context, FLAT $0.15 per million in, $0.60 per million
  # out, $0.015 cached input. Flat is why this row does not cap its window the way the `minimax`
  # row caps at 512K: MiniMax doubles M3's rate above 512K and has no such band on this model.
  # A fifth of M3's price for a model the vendor ranks above it, so it is the hop to take before
  # leaving the vendor entirely -- which is why `minimax` now falls back here first.
  # Thinking cannot be turned off on this model and `reasoning_effort` defaults to `max` (the
  # vendor 400s on `effort: none`), so a caller with a small max_tokens spends its budget
  # thinking and answers with nothing -- the defect the `narrate` block below already records.
  # A latency-sensitive caller sets reasoning_effort low; it cannot disable thinking.
  - model_name: minimax_m31f
    litellm_params:
      model: openai/MiniMax-M3.1-Flash
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      max_tokens: 8192
      # Pinned for the reason on the `minimax` row above: LiteLLM ships no price for this
      # model, so an unpriced lane records $0.0000 a call and max_budget never trips.
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
    model_info:
      max_input_tokens: 1000000
  # The face's second voice, asked by voice_media.py only when voice-tts refuses. Its own alias, not a
  # second voice-tts deployment: the router lays the caller's voice over a deployment's params
  # (litellm v1.98.0 router.py _aspeech: **data, then "voice"), and MiniMax maps only OpenAI-style voice
  # names, so Orpheus's "hannah" would reach MiniMax as a voice it does not have. The caller sends this
  # lane a MiniMax voice instead. Measured 2026-10-13 from the router pod: speech-02-turbo on
  # MINIMAX_API_KEY at api.minimax.io answered 200 with WAV for English_Graceful_Lady (api.minimaxi.com
  # answers 2049 invalid api key for the same key); every Gemini speech model answered 402, prepayment
  # credits depleted.
  - model_name: voice-tts-minimax
    litellm_params:
      model: minimax/speech-02-turbo
      api_base: https://api.minimax.io
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 20
      # Pinned rather than left to LiteLLM's price map, for the reason on the minimax row: an unpriced
      # lane records $0.0000 and max_budget never trips. $60 per million characters
      # (model_cost["minimax/speech-02-turbo"] on the live v1.98.0 router).
      input_cost_per_character: 0.00006
    model_info:
      mode: audio_speech

  # Coding only. The plan's usage policy (docs.z.ai devpack/usage-policy, read
  # 2026-10-01): "GLM Coding Plan may only be used within officially supported tools
  # and products". So this lane sits in no pool and no fallback chain: nothing reaches
  # it unless a coding harness picks `glm` by name, and the router's own background work
  # (shadow folds, voice, bulk) can never land on it.
  #
  # Flat rate: the plan bills by the month, so the marginal token is $0 until the plan's
  # concurrency limit (Lite: one project at a time). Priced at zero on purpose.
  - model_name: glm
    litellm_params:
      model: openai/glm-5.3
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
      timeout: 300
      input_cost_per_token: 0
      output_cost_per_token: 0

  # The ceiling is Google's, measured, not chosen here. On 2026-09-08 the router pod's
  # 429 bodies carried quotaId `GenerateContentPaidTierInputTokensPerModelPerMinute`,
  # quotaValue "1000000", quotaDimensions {model: gemini-2.5-flash, location: global}, and
  # retryDelay values of 9s, 46s, 48s, 55s and 57s. So the limit is one million INPUT
  # TOKENS a minute per model -- not requests -- and when it is passed Google makes the
  # caller wait about a minute. That wait is what a person on Telegram experiences as the
  # thing hanging and then switching.
  #
  # Three lanes name the same Google model (gemini, fast, vision), and Google counts them
  # in one bucket, so the million is split across the three rather than repeated on each:
  # 500k + 300k + 150k = 950k, with 50k of headroom for the retry LiteLLM is allowed. With
  # `enable_pre_call_checks` and usage-based-routing-v2 in router_settings, the router now
  # walks the fallback chain BEFORE the call leaves the estate instead of spending a round
  # trip to be refused and then waiting out Google's retryDelay.
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 300
      tpm: 500000

  # The two neutral lane names. They used to be declared on the anthropic row, which is
  # gone, and a caller must be able to ask for a capable model or a cheap one without
  # naming a vendor (LAW 34, founder 2026-09-04: "we supposoed to be provider agnostic").
  # They sat on Gemini from 2026-09-04 until today, on the theory that account was bought
  # direct and verified. That theory stopped being true on 2026-09-08 and the fallback
  # rule this same file states two rows below -- "Gemini goes last everywhere and heads
  # nothing" -- was never applied to these two rows, because they ARE a Gemini model_name,
  # not a fallback target of one: the primary attempt is not a fallback hop, so demoting
  # gemini inside their OWN fallback list (the previous `default: [gemini, minimax, groq]`)
  # did nothing -- every call still paid one guaranteed-dead round trip to Google before
  # ever reaching a fallback. Measured 2026-09-15, five consecutive calls to `default` and
  # `fast` from the live router: `x-litellm-attempted-fallbacks: 1` on every single one,
  # `x-litellm-model-group: minimax` on every single one -- 100% dead-hop-then-recover, on
  # every call, forever, because `allowed_fails`/`cooldown_time` cool down a deployment
  # inside a load-balanced pool, and neither of these model_names has ever had a second
  # deployment to fail toward -- there is nothing for a cooldown to route around. So they
  # now sit on MiniMax instead, the same "moat's cheap primary" lane and the only paid
  # vendor the 2026-09-04 21:5xZ and 2026-09-08 measurements below both found answering.
  # Gemini is demoted into their fallback (still first there, per the founder's own
  # "it returns to the front the moment the Google account is billed" rule) rather than
  # deleted, exactly the `embed-fallback` treatment three lanes below for the same vendor
  # and the same unbilled-account condition. Model ids unchanged from the vendor's own
  # https://ai.google.dev/gemini-api/docs/models for the day Gemini is billed again.
  #
  # 2026-09-15: MiniMax stopped being the only deployment under these two names. Both are
  # now a real pool of four -- minimax, groq, cerebras, sambanova -- and router_settings
  # carries `routing_strategy: cost-based-routing`, so among whichever of the four are not
  # presently cooling down, LiteLLM's own Router picks the cheapest per token, not a random
  # one. MiniMax prices its two fields above; the three free vendors carry none, which
  # LiteLLM reads as $0.0000/token, so they are picked ahead of MiniMax whenever any of
  # them is healthy -- the estate pays only when every free lane is dead or exhausted.
  # `allowed_fails`/`cooldown_time` then does the self-healing across all four the same
  # way it now does for groq's and cerebras's own three-key pools above: a deployment that
  # is revoked, out of daily quota, or rate-limited is excluded for the cooldown window and
  # rejoins on its own the moment it starts answering again -- topped-up credit included,
  # since cooldown is blind to why a deployment failed and only watches whether it answers.
  # Gemini stays OUT of pool membership on purpose: a pool picks close to uniformly among
  # its live members (cost-based-routing aside), unlike a fallback chain's fixed order, and
  # Gemini is measured ~95% dead while unbilled (comment above) -- pool membership would
  # still spend one call in several on a vendor that almost always refuses. It keeps its
  # place at the front of the fallback chain below instead, which costs nothing when it is
  # never reached, and it earns pool membership back the day a live probe says it answers.
  - model_name: default
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      max_tokens: 8192
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
    model_info:
      max_input_tokens: 512000
  - model_name: default
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072
  - model_name: default
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 65536
  - model_name: default
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.sambanova.ai/v1
      api_key: os.environ/SAMBANOVA_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  - model_name: fast
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      max_tokens: 8192
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
    model_info:
      max_input_tokens: 512000
  - model_name: fast
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072
  - model_name: fast
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 65536
  - model_name: fast
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.sambanova.ai/v1
      api_key: os.environ/SAMBANOVA_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  # --- the free floor ------------------------------------------------------------------
  # Until this row, the estate router had no free lane at all. Every one of its nine model
  # rows billed per token and the tail of every fallback chain was a paid account: the
  # cascade ended on `minimax` or `gemini`, so a day that emptied both accounts left every
  # consumer of this router -- Holmes, the agent workforce, prospector, whatever answers
  # the founder next -- with nowhere to go. Otto has carried a free floor in its own
  # private brain config since 2026-09-10 (platform/otto-gateway/three-homes.yaml); this
  # is the same floor under the router the rest of the estate rides.
  #
  # It is a floor, never a routing choice. Nothing heads a chain with it; it is the last
  # hop of every chain, which is also what sovereign/tests/bdd/test_cp30.py holds about
  # the cheap model, and why `[routing] cheap` in AGENTS.md moves to `groq` in the same
  # change. Groq's free tier meters REQUESTS per day, not dollars, and resets daily --
  # so unlike a prepaid balance it cannot reach zero and stay there.
  #
  # `openai/` twice on purpose: the first is LiteLLM's provider prefix (an
  # OpenAI-compatible endpoint), the second belongs to the model's own name.
  #
  # gpt-oss-120b, and not the Llama 3.3 70B this registry named when the row was written:
  # asked from inside the otto-gateway pod on this key on 2026-09-10, Groq answered
  #   404 "The model `llama-3.3-70b-versatile` does not exist or you do not have access
  #   to it."
  # while GET /openai/v1/models returned the fourteen it does serve. Measured on the same
  # call: openai/gpt-oss-120b HTTP 200 0.48s, 119 tokens, a real three-sentence answer,
  # and a tool-calling turn returned tool_calls=['get_weather'] -- a floor that cannot
  # call a tool is a floor that can only chat.
  #
  # No input_cost_per_token / output_cost_per_token, and that is the one row where their
  # absence is correct rather than the 176-million-token accounting hole the minimax row
  # describes: this lane costs nothing per token, so $0.0000 a call is the true price.
  # general_settings.max_budget still bounds it, and the daily request meter is Groq's.
  - model_name: groq
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY
      # Shorter than the paid lanes' 300s on purpose. This is the hop a turn reaches
      # after the lanes above it have already spent their own timeouts; a floor that
      # takes five minutes to refuse is not a floor. Measured latency above was 0.48s.
      timeout: 60
      max_tokens: 8192
    model_info:
      # Groq publishes 131,072 tokens of context for gpt-oss-120b. Capped here so an
      # oversized turn is refused by the estate rather than by the vendor at the end of
      # a cascade, the same reason the minimax row carries a cap.
      max_input_tokens: 131072

  # --- the other two Groq accounts, same model_name on purpose ---------------------------
  # This is what turns `groq` from a single deployment into a real LiteLLM pool. A
  # model_name with one deployment has nothing for `allowed_fails`/`cooldown_time`
  # (router_settings) to route around -- the gemini row's own comment three vendors up
  # measured that exact failure mode, 100% dead-hop-then-recover on every call, forever.
  # Three deployments under one name means a key that goes dead for any reason -- revoked,
  # daily quota spent, rate-limited -- gets cooled down and the other two keep answering,
  # and the cooled-down one rejoins on its own the moment the cooldown window ends, with
  # no PR and no agent editing a key. That is cause-agnostic by construction: the router
  # does not know or care WHY a deployment failed, so a revoked key, an empty quota and a
  # quota that got topped up an hour later are all handled by the same mechanism.
  # Verified live 2026-09-15 (`GET /openai/v1/models`, curl, both keys): same fourteen-model
  # catalogue as the primary account, `openai/gpt-oss-120b` present on both.
  - model_name: groq
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY_2
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  - model_name: groq
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY_3
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  # --- voice: the Fleet page's ears and mouth, behind the router so no service holds a vendor key.
  # Measured 2026-09-26 with this key: whisper-large-v3-turbo transcribed a 3s question in 0.19-0.24s,
  # where the laptop's local whisper took 5-20s. Orpheus needs the org admin to accept its terms once
  # (console.groq.com playground); until then voice-tts answers 400 and the backend speaks locally.
  # voice: the brain the founder's spoken turn thinks with (fleetview VOICE_ROUTER_MODEL=voice). Measured
  # 2026-09-30 over 331 turns: first token p50 7.6s -- this single Groq deployment also carried the film
  # director and the newsroom anchor (~800 calls/hour at 01:00 with nobody watching), 78% of voice calls
  # (2406/3150) came back 429, and the founder's one-word answer waited in the cooldown. When Groq
  # accepts, first token is 0.34s. So `voice` is a pool of three free vendors reserved for INTERACTIVE
  # turns, and narration rides `narrate` on separate per-model quotas (Groq meters per model, so the
  # 8B narration row can run dry without the founder's row noticing). Both pools are declared here, in
  # one place, so the priority classes read as one unit; the keys are the same vendors' second and
  # third accounts, so a 429 on one class never cools the other. Answers are one or two sentences by
  # the operator's own brief: max_tokens is small and the timeout is a turn, not a job. rpm sits under
  # every vendor's free ceiling so the router refuses locally before the vendor does.
  # Measured 2026-10-02 from the founder's felt latency ("takes forever or router times out, totally unusable"):
  # the brain leg took 15.9s of a 16.6s turn. All three free rungs were gpt-oss-120b, a REASONING model on
  # every vendor -- it thinks before it speaks, so the first spoken token waits for the hidden chain; the
  # groq and cerebras keys 403'd from this network and sambanova's gpt-oss streamed first content ~14s in.
  # MiniMax-M3, same prompt, same night, through this same router: first content 1.32-1.96s. The lane that
  # answers is the interactive lane; the free rungs stay one hop away in the chain below
  # (voice: [narrate, fast, groq]), so a MiniMax outage degrades to free lanes, never to silence. Cost at
  # the 4k-token voice prompt is ~$0.001 a call, inside the $3/day litellm budget.
  - model_name: voice
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 8
      max_tokens: 96
      rpm: 30
      input_cost_per_token: 0.0000003
    model_info:
      max_input_tokens: 131072
  # deepseek-chat: the voice pool's second deployment (2026-10-18). The single MiniMax-M3 row above stalls in multi-minute windows -- the laptop watch (voice-watch.log) caught readyz brain probes dying at 30s in bursts at 11:02, 11:09, 11:28, 11:37-11:40, 11:48 and 11:57-12:01Z -- and every rung below it in the chain was dead or slower the same morning: narrate's qwen went exhausted(rate) at 12:19Z and the gpt-oss rungs answer 403 from this network or ~14s to first content. Measured this hour through the live router with the laptop caller key: MiniMax-M3 answered the brain's one-word probe in 4.8s after 17 hidden-reasoning tokens; deepseek/deepseek-chat answered 'ok' finish=stop in 2.4s. A pool of two self-heals the same way the groq and default pools do: cooldown drops MiniMax for its bad window, cost-based routing picks this row (true prices, $0.14/M in and $0.28/M out -- ~$0.0006 at the 4k-token voice prompt, inside the $3/day litellm budget), and MiniMax rejoins on its own the moment it answers again.
  - model_name: voice
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 8
      max_tokens: 96
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
    model_info:
      max_input_tokens: 65536
  # narrate: the film director and the newsroom anchor (voice-router LLM_NARRATE_MODEL=narrate). A
  # non-reasoning instruct model: a reasoning model spends 48 tokens thinking and answers with nothing.
  # Measured 2026-10-09 from inside the litellm pod: Llama 3.1 8B is retired at all three vendors this
  # lane used to name (Groq "llama-3.1-8b-instant does not exist", Cerebras and SambaNova no longer
  # list it), CEREBRAS_API_KEY_3 answers 402 and SAMBANOVA_API_KEY_3 answers 401 on chat. So every
  # call since the lane was minted fell through to `groq` (gpt-oss-120b, a reasoning model) -- the
  # newsroom key's ~1,260 calls 2026-10-03..09 were all answered there, none by narrate. Both rows below
  # answered three anchor prompts in one sentence, 15-24 tokens, finish=stop, 0.08-0.58 s. Groq meters
  # per model, so neither row shares the quota of `groq`/`fast` (gpt-oss).
  - model_name: narrate
    litellm_params:
      model: openai/qwen/qwen3.8-27b
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY
      timeout: 4
      max_tokens: 48
      rpm: 12
    model_info:
      max_input_tokens: 131072
  - model_name: narrate
    litellm_params:
      model: openai/allam-2-7b
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY
      timeout: 4
      max_tokens: 48
      rpm: 12
    model_info:
      max_input_tokens: 4096
  - model_name: voice-asr
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/GROQ_API_KEY
      timeout: 20
    model_info:
      mode: audio_transcription
  - model_name: voice-tts
    litellm_params:
      model: openai/canopylabs/orpheus-v1-english
      api_base: https://api.groq.com/openai/v1
      api_key: os.environ/GROQ_API_KEY
      timeout: 20
    model_info:
      mode: audio_speech

  # Founder, 2026-09-10: "all agets send should be in litelln". Until this row the key
  # above reached exactly one consumer -- Otto's private brain -- and the estate router
  # could not call Cerebras at all, so any other agent that wanted it had to go direct
  # and off the ledger. The Secret existed in namespace `llm` (human-cerebras, bridged
  # from Secrets Manager) and simply was not mounted; platform/llm/litellm.yaml mounts
  # it in the same change.
  #
  # gpt-oss-120b, not llama-3.3-70b: asked on this key from inside the otto-gateway pod
  # on 2026-09-10, Cerebras answered 404 "Model does not exist or you do not have access
  # to it." GET /v1/models returned three -- gemma-4-31b, gpt-oss-120b, qwen-3.8-27b.
  # Measured on the same call: openai/gpt-oss-120b HTTP 200 0.25s, and a tool-calling
  # turn returned tool_calls=['get_weather'].
  #
  # gpt-oss over qwen even though qwen is different weights from the Groq floor: this
  # is the one vendor in the matrix whose meter counts TOKENS (1,000,000/day), and qwen
  # spent 290 tokens saying READY where gpt-oss spent 104. On a token meter the cheaper
  # answer keeps the lane alive longer.
  #
  # No input/output cost keys: the lane is free, so $0.0000 a call is the true price.
  # general_settings.max_budget still bounds the router; the daily meter is Cerebras's.
  - model_name: cerebras
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY
      # 0.25s measured. Short for the same reason the groq row gives: a free lane that
      # takes minutes to refuse is not a floor.
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 65536

  # --- the other two Cerebras accounts, same model_name on purpose, same reason as the
  # three groq deployments above: a pool, not a single point of failure, so the router's
  # own cooldown does the self-healing instead of a fallback chain re-attempting a dead
  # key fresh on every call. Verified live 2026-09-15, same three-model catalogue
  # (gemma-4-31b, gpt-oss-120b, qwen-3.8-27b) as the primary account on both keys.
  - model_name: cerebras
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY_2
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 65536

  - model_name: cerebras
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY_3
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 65536

  # Same story as the cerebras row above, and the same fix: the key was in Secrets
  # Manager, the bridge Secret human-nvidia existed in namespace `llm`, and nothing
  # mounted it, so the estate router could not reach NVIDIA at all.
  #
  # nemotron-3.5-lightning-30b-a3b, not meta/llama-3.3-70b-instruct: asked on this key
  # from inside the otto-gateway pod on 2026-09-10, NVIDIA answered
  #   410 "... has reached its end of life on 2026-08-26T09:00:00Z"
  # Measured on the replacement, same call: plain chat HTTP 200 in 2.92s, and a
  # TOOL-CALLING turn HTTP 200 in 38.33s. That second number is why the timeout below
  # is not the 60s the other free lanes carry: a lane whose tool turns take 38s and
  # whose budget is 25s is recorded as the vendor refusing when the vendor answered.
  #
  # NVIDIA meters per MODEL (10,000 requests/day/model), not per account, which is a
  # third meter shape again -- lanes whose meters run in different units do not empty
  # together, which is the whole point of carrying more than one free vendor.
  - model_name: nvidia
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning-30b-a3b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 90
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  - model_name: sambanova
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.sambanova.ai/v1
      api_key: os.environ/SAMBANOVA_API_KEY
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  - model_name: sambanova
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.sambanova.ai/v1
      api_key: os.environ/SAMBANOVA_API_KEY_2
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  - model_name: sambanova
    litellm_params:
      model: openai/gpt-oss-120b
      api_base: https://api.sambanova.ai/v1
      api_key: os.environ/SAMBANOVA_API_KEY_3
      timeout: 60
      max_tokens: 8192
    model_info:
      max_input_tokens: 131072

  # Local, free, and the only tier that survives every credential expiring at once.
  - model_name: ollama
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434
      timeout: 300
      # Keep the weights resident. Ollama unloads a model 5 minutes after its last
      # call, and reloading 7B cost the consensus vote its 30 s deadline every time
      # (measured 2026-08-26: 30.8 s cold, 16.9 s warm, crew#284 CP2). The proxy is
      # the only caller, so it owns the residency.
      keep_alive: 24h
  # routing.vision in AGENTS.md (sovereign model.vision, R8: an alias, never a
  # provider model name). gemma3:4b is multimodal and is already pulled locally.
  # Through Ollama's OpenAI-compatible endpoint, not the ollama/ provider: the
  # litellm-database image ships without Pillow, and the ollama/ provider needs
  # it to pass an image ("ollama image conversion failed", 2026-08-26). The
  # OpenAI route sends the data URL through untouched.
  - model_name: ollama-vision
    litellm_params:
      model: openai/gemma3:4b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 300
  # Converged name (founder 2026-10-25: cluster names win). Same local deployment as
  # ollama-vision above -- additive alias, so existing callers keep working and callers
  # using the cluster's name get sphere-local fulfillment on the laptop. The drift-check
  # treats this wiring difference as sphere-bound (allowed); only the name had to converge.
  - model_name: vision
    litellm_params:
      model: openai/gemma3:4b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 300
  # Second local voter for the kernel's 3-model consensus (kini spec 4.2:
  # "Ollama handles 2/3 quorum load"); a different family from `ollama`, so two
  # local votes are not one model voting twice.
  - model_name: ollama-llama
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://host.docker.internal:11434
      timeout: 300
      keep_alive: 24h

  # Claude Code on the founder's Max subscription, through THIS laptop router, not the cluster
  # (founder, 2026-09-26: "if cluster breaks we are all disabled"). NO api_key ON PURPOSE: the
  # lane relays the client's own `Authorization: Bearer sk-ant-oat01-...` OAuth token upstream
  # (LiteLLM forwards the oat01 prefix and drops sk-ant-api03 keys), so the subscription pays
  # and the estate holds no Anthropic key (2026-09-04 ruling). The client authenticates to this
  # router with `x-litellm-api-key`, never `Authorization`, or the OAuth token is consumed here.
  #
  # The wildcard carries whatever dated id Claude Code sends (claude-opus-5-5,
  # claude-haiku-4-5-20251001, ...) upstream unchanged. Zero cost fields because Max has no
  # per-token spend -- without them LiteLLM prices Opus from its own table and the $5/day
  # max_budget below refuses every call within minutes.
  #
  # tests/test_local_claude_max_lane.py fails if this lane, its header forwarding, or its
  # freedom from aliases is removed -- the cluster copy of this lane was lost that way in the
  # 2026-09-23 consolidate (8f6298ad) and then aliased to deepseek (#4063).
  - model_name: "claude-*"
    litellm_params:
      model: "anthropic/claude-*"
      timeout: 600
      input_cost_per_token: 0
      output_cost_per_token: 0

router_settings:
  # The chain prospector's `noncritical_operator:` already declares, expressed once here
  # instead of in FallbackOperator. `minimax -> minimax_m27` is the documented failover;
  # ollama is last because it is local and cannot run out of credit.
  fallbacks:
    # crew#506 CP1 (2026-08-27): the first hop is the other funded direct vendor. OpenRouter sat
    # at ~2,400 tokens of credit and Google prepaid was empty, so the crew#284 order (OpenRouter
    # first) walked every turn through 402/429 before reaching a lane that answers. Consensus
    # still survives any one account dry. Every chain not headed by the cheap model ends in it
    # (sovereign cp30). The OpenRouter lanes stay in model_list for crew#506 CP4 (free lanes,
    # job aliases) but sit in no chain while the account is unfunded: a hop that always
    # answers 402 is latency, not redundancy.
    # DeepSeek answered 401 from inside the router pod on 2026-09-04 21:5xZ (the key is revoked
    # at the vendor; prospector's byte-identical copy fails the same way), which is why Gemini
    # sits in this chain: a hop that always refuses is latency, not redundancy. That sentence
    # now applies to Gemini itself, so it moved to the back -- see the measurement on the
    # gemini block below.
    - deepseek: [gemini, minimax, groq]
    # DeepSeek V4 Flash (founder 2026-10-10). Reaches DeepSeek directly: the lane row above # carries no api_base, so litellm dials the vendor endpoint itself. It briefly pointed at # the mumchimp router host instead, copied from platform/llm/config.local.yaml, where that # host IS the router because the laptop calls it from outside the cluster. From inside the # cluster that hostname is the router own public address, so the lane asked the router to # call itself and every request died on the hairpin. See # docs/diagnoses/2026-10-11-deepseek-flash-calls-the-router-itself.yaml. # Ends in `groq` (sovereign cp30).
    - deepseek-v4-flash: [minimax, gemini, groq]

    # Measured from inside the router pod 2026-09-04 21:5xZ: MiniMax answers 401 `invalid api
    # key (2049)` on https://api.minimax.io/v1/chat/completions (request id
    # 06ea7071f3bfa650df549152c286372b), and its native endpoint answers HTTP 200 carrying
    # `base_resp.status_code 2049` in the body -- the same refusal wearing a 200, so a probe
    # that grades only the HTTP status reads that account as healthy. DeepSeek answers 401.
    # Those two were each other's only fallback, so a cheap turn walked minimax -> deepseek
    # and died with nothing to answer the founder's Telegram message. Gemini answers, so it
    # goes ahead of the dead pair rather than after it.
    #
    # That reading expired. Both accounts named above are funded again and answering, and
    # Gemini is now the one refusing: it left this chain entirely on 2026-09-08, on the
    # measurement recorded on the gemini block below. It could not simply move to the back
    # either -- sovereign/tests/bdd/test_cp30.py holds that every chain not headed by the
    # cheap model ends in it, so a cascade never terminates on a costlier lane than the one
    # it could have used. A dead lane after that tail would be a hop that costs a retry and
    # a cooldown and can never answer, which is the founder's "we wait for a nodel to finish
    # and then swtich whih fails all the tine" (2026-09-08) in its purest form. So the chain
    # is minimax -> deepseek and stops: two vendors, both answering, no dead hop.
    # 2026-09-08, the founder's cost mandate. Every chain on main ended in `deepseek`,
    # an account at $0 that has answered 401 since 2026-09-04, so the last hop of every
    # fallback was a guaranteed refusal and there was nothing free underneath it. This
    # file already says twice that a hop which always refuses is latency, not redundancy;
    # here that is applied. deepseek stays a chain HEAD, so the lane rejoins the moment
    # the founder adds its key in the LiteLLM console -- no pull request, no session.
    # M3.1-Flash first: same vendor, same key, a fifth of the price, so a `minimax`
    # window that only M3 is failing in is answered inside MiniMax instead of paying
    # a cross-vendor hop. A dead key fails both rows in one refusable call, which
    # the breaker then cools as one group -- the 2026-09-04 lesson above still holds.
    - minimax: [minimax_m31f, gemini, groq]

    # Gemini stopped heading any chain on 2026-09-08. Measured over the two hours to
    # 10:45Z on both live router pods (24,955 log lines): gemini/gemini-2.5-flash
    # answered 5 calls and failed 102, every failure RESOURCE_EXHAUSTED with no quotaId
    # and no retryDelay -- the unbilled shape, not a per-minute ceiling this estate can
    # stay under. openai/MiniMax-M3 answered 71 and failed 0; deepseek-v4-flash answered
    # 97 and failed 24, all 24 being one message ("This response_format type is
    # unavailable now") from a caller that sets a parameter Otto never sends.
    #
    # A chain that opens on a lane refusing 95 of every 100 calls spends the router's two
    # retries and its cooldown before it reaches a lane that can answer. That is the
    # founder's complaint in one sentence -- "why do we wait for a nodel to finish and
    # then swtich whih fails all the tine" (2026-09-08) -- and it is the same reason this
    # file already gives on the deepseek block for demoting a dead hop: "a hop that always
    # refuses is latency, not redundancy". Gemini goes last everywhere and heads nothing.
    # It returns to the front the moment the Google account is billed, which crew#920
    # carries; nothing else about these chains changes.
    #
    # The cheap model is still the last hop of every chain it does not head, which is what
    # sovereign cp30 grades and the `[routing] cheap` line of AGENTS.md declares; which
    # lane is `cheap` is the founder's call, not this file's, so it is untouched.
    #
    # `default` and `fast` are MiniMax rows now (see the lane comment above) -- naming
    # minimax in their own fallback lists would be a hop back to the deployment that had
    # just failed, the same reason `gemini`'s own list below never names `gemini`. Gemini
    # stays first in their fallback, demoted but not deleted, so it is what a turn reaches
    # if MiniMax itself is ever the one refusing, and it is promoted back to heading these
    # two lanes outright the day crew#920 bills the Google account.
    - gemini: [minimax, groq]
    - default: [gemini, groq]
    - fast: [gemini, groq]

    # The floor is a pool of pools, not one vendor (founder 2026-09-27: "concerned by reliance
    # on groq ... what happens if groq runs out"). Every chain in this registry ends in `groq`
    # (sovereign cp30), and until this chain `groq` ended nowhere: the laptop router logged
    # 11 `No deployments available ... Passed model=groq` in one day, with Cerebras, SambaNova
    # and NVIDIA idle -- nine free keys and a per-model meter that no chain ever reached.
    # LiteLLM follows a fallback group's own chain, so this one line carries every chain on:
    # groq down -> cerebras, both down -> sambanova, all three -> nvidia, then openrouter.
    # The meters differ (Groq requests/day, Cerebras tokens/day, NVIDIA per model), so they
    # do not empty together; each hop is a three-key pool that cools a dead key for 60s.
    - groq: [cerebras, sambanova, nvidia, openrouter]
    # `voice` is the ROLE the Fleet voice-router asks for (launchd/ai.estate.voice-router
    # LLM_MODEL=voice). It never had a deployment, so every spoken turn since 2026-09-28
    # died with "no healthy deployments for model_group=voice" and /readyz sat at 503. A
    # role, not a vendor: it rides the `fast` pool and then the floor above.
    - voice: [narrate, fast, groq]
    # narrate has its own templates in voice-router; a hop to the floor is all it gets, never a paid lane.
    - narrate: [groq]

    # Same floor, entered at Cerebras: never back to groq, so the graph has no cycle.
    - cerebras: [sambanova, nvidia, openrouter]

    - sambanova: [nvidia, openrouter]
  # Alias, not a model row (R75, founder 2026-09-03). The Kimi lane is console-owned: the
  # founder brought the key through the LiteLLM console on 2026-09-04 and it is stored
  # encrypted in litellm-db under the vendor's own name, `moonshot/kimi-k3`. Rendering a
  # `kimi` row here would lock that name in the config file and the console would then refuse
  # to attach a key to it ("defined in config"), which is the failure he hit the day before.
  # An alias carries no credential and declares no model, so it cannot lock anything -- it
  # only spares every caller from hardcoding a vendor path that changes when the vendor
  # ships k4. Probed 2026-09-04 05:47Z from inside the litellm pod: `moonshot/kimi-k3`
  # answers HTTP 200 in 30.5s, while `kimi` answered HTTP 400 "Invalid model name".
  model_group_alias:
    kimi: moonshot/kimi-k3
    # No claude-* alias, ever: an alias outranks the `claude-*` lane and silently turns a
    # Claude Code session into another vendor's model (#4063 did exactly that with deepseek).
  num_retries: 2
  # A tier that keeps failing is taken out of the chain rather than retried into the
  # ground. This is the circuit breaker prospector/breaker.py hand-rolls.
  allowed_fails: 3
  cooldown_time: 60
  # `groq`, `cerebras`, `sambanova`, `default` and `fast` are real pools now (platform/vendors/
  # consoles.yaml, 2026-09-15: two extra keys each on groq/cerebras, three on the new sambanova
  # vendor, all four free vendors plus minimax under default/fast). `cost-based-routing` picks
  # the cheapest deployment among whichever the allowed_fails/cooldown_time breaker has not
  # cooled down -- the three free vendors carry no input_cost_per_token/output_cost_per_token,
  # so LiteLLM prices them $0.0000 and prefers them over paid MiniMax whenever one is healthy.
  # Same setting as platform/llm/config.base.yaml, for the same pools; see that file's comment
  # for why this repo has two config.base.yaml files at all.
  routing_strategy: cost-based-routing

litellm_settings:
  # Traces to the collector that already runs. No second store.
  # request_ceiling: the module at /etc/litellm/ceilings/request_ceiling.py, on PYTHONPATH.
  # LiteLLM imports it from this callbacks entry and discovers proxy_handler_instance. The
  # volume mount and PYTHONPATH env var in platform/llm/litellm.yaml are the other half —
  # both must be present or every request fails with ModuleNotFoundError.
  # efficiency_gateway runs first so the ceiling measures the request it actually sends. On the
  # claude-* lane it is append-stable (prompt cache intact) and records per call what each step
  # did and what Anthropic billed: `bin/estate-efficiency-report --follow`.
  callbacks: ["otel", "efficiency_gateway.proxy_handler_instance", "request_ceiling.proxy_handler_instance", "anthropic_beta_passthrough.proxy_handler_instance", "lane_registry.proxy_handler_instance", "route_table.proxy_handler_instance"]
  drop_params: true
  # Never log the prompt or the completion body. Spans carry model, latency, tokens and
  # cost — which is what an audit trail needs — and not the content of a customer's
  # document (LAW 21).
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # A CEILING, not a budget. R14 is zero spend without founder sign-off; this number is
  # the thing that refuses a runaway loop at 03:00, not permission to spend it. Raising it
  # is a founder decision, and the proxy is where that decision is enforced rather than
  # hoped for.
  max_budget: 5.0
  budget_duration: 1d
  # Health checks cost a call per upstream. Off by default; `litellm-status` probes
  # liveliness, which is free.
  background_health_checks: false
  # Forwards the x-* family and `anthropic-beta` to the `claude-*` lane, which keeps tool
  # search and beta features working through the router. The OAuth token itself is forwarded
  # by its sk-ant-oat01 prefix regardless of this flag. `forward_llm_provider_auth_headers` is
  # deliberately NOT set: that is the x-api-key BYOK path, i.e. an Anthropic API key.
  forward_client_headers_to_llm_api: true
