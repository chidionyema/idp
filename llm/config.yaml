# LiteLLM routing. This file replaces the chain-building half of prospector/operator.py.
#
# Standard: crew/docs/STANDARDS.md "LLM providers" (LiteLLM, adopted 2026-08-24).
#
# The names on the left are the ONLY thing prospector sees. They are deliberately the same
# tier names config.yaml already uses (`operator:`, `noncritical_operator:`), so the
# migration is a `providers:` block pointing at 127.0.0.1:4000 and not a rewrite.
#
# WHAT IS NOT HERE. `claude_cli` and `gemini_cli` are absent on purpose. They are local CLI
# binaries spending a SUBSCRIPTION, not HTTP endpoints spending an API key, and a proxy
# cannot drive them. They stay in prospector, they stay the trusted `moat_primary` tier,
# and they stay the EUR 0 path (R14).

model_list:
  # --- the moat's cheap primary --------------------------------------------------------
  # MiniMax has no first-class LiteLLM provider; it is OpenAI-compatible, so it is declared
  # with an explicit api_base rather than a provider prefix.
  - model_name: minimax
    litellm_params:
      model: openai/MiniMax-M3
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300
      max_tokens: 8192
    model_info:
      # crew#506 CP1: the router refuses an oversized turn before it leaves the estate; a turn
      # above the window 400s here instead of walking the fallback chain into unfunded lanes
      # (the 2026-08-27 Telegram outage).
      #
      # M2 -> M3, 2026-09-04. This lane sat on MiniMax-M2 while the account served four newer
      # models. Read from api.minimax.io/v1/models with the estate's own key on 2026-09-04:
      # MiniMax-M3, M2.7, M2.7-highspeed, M2.5, M2.5-highspeed, M2.1, M2.1-highspeed, M2. M3 is
      # the newest and answered a live completion in 1.8s against M2's 4.3s. MiniMax publishes no
      # context number on its models endpoint, so the window below is the one OpenRouter's
      # catalogue gives for the same model (minimax/minimax-m3, context_length 1,048,576, read
      # 2026-09-04), rounded down. It is a refusal threshold, not a promise: too low only costs a
      # clean refusal, which is why it is rounded down rather than up.
      max_input_tokens: 1000000

  # The failover tier: same account and adapter, different model. It is a failover, never
  # a routing choice — see prospector config.yaml on `minimax_m27`.
  - model_name: minimax_m27
    litellm_params:
      model: openai/MiniMax-Text-01
      api_base: https://api.minimax.io/v1
      api_key: os.environ/MINIMAX_API_KEY
      timeout: 300

  - model_name: deepseek
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 300

  - model_name: openrouter
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 300

  # crew#284: every direct consensus account (MiniMax, DeepSeek, Gemini) answered 429 on balance on
  # 2026-08-26 while the OpenRouter account answered 200. These three route the same models through
  # OpenRouter and sit first in each fallback chain, so consensus survives one empty account.
  - model_name: minimax-or
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 300

  # deepseek-chat -> deepseek-v4-pro, 2026-09-04: the catalogue at openrouter.ai/api/v1/models
  # carries deepseek/deepseek-v4-pro at 1,048,576 context, four generations past deepseek-chat,
  # and it answered a live completion on this account the same day.
  - model_name: deepseek-or
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 300

  # Kimi, added 2026-09-04 because the estate named a `kimi` lane it had never declared: callers
  # asked for it, the proxy answered "Invalid model name passed in model=kimi" on every call, and
  # the fallback chain quietly served MiniMax instead. It is bought through OpenRouter rather than
  # from Moonshot directly for one reason: the estate holds no Moonshot credential, and a row
  # wired to a key that does not exist is the same phantom lane in a new costume. moonshotai/kimi-k3
  # is the newest Kimi in the OpenRouter catalogue (context_length 1,048,576, read 2026-09-04).
  #
  # It needs money on the OpenRouter account before it answers: measured 2026-09-04, that account
  # is at total_credits 10 against total_usage 10.18, and a 2,000-token Kimi turn came back
  # HTTP 402, "can only afford 294". The row is declared so that funding the account is the whole
  # of switching it on -- no deploy, no code change.
  - model_name: kimi
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 300
    model_info:
      max_input_tokens: 1000000

  # Claude through the reseller, added 2026-09-04. The direct `claude` row above authenticates
  # fine and refuses on money: "Your credit balance is too low to access the Anthropic API"
  # (measured 2026-09-04). OpenRouter sells the same model -- anthropic/claude-sonnet-5,
  # context_length 1,000,000, read from openrouter.ai/api/v1/models the same day -- on an account
  # the estate already holds a key for. So this row exists for the reason `embed` and `image-or`
  # exist: one empty account must not take a capability off the estate. It sits first in the
  # `claude` chain, so a Claude turn tries Anthropic, then the reseller, and only then falls to
  # the cheap model.
  - model_name: claude-or
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 300
      max_tokens: 8192
    model_info:
      max_input_tokens: 1000000

  - model_name: gemini-or
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 300

  # --- crew#506 CP4: the free tier (2026-08-27) ----------------------------------------
  # Groq's free plan answers openai/gpt-oss-120b at 131k context with no card on file, so it
  # is the first free hop for every job that is not the moat's paid MiniMax lane. Model ids
  # are the ones the key lists at api.groq.com/openai/v1/models on 2026-08-27; llama-3.3-70b
  # is not on the plan. Rate limits are per minute, so the chain drops to a paid direct lane
  # rather than retrying (allowed_fails 3, cooldown 60).
  - model_name: groq
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      timeout: 120
    model_info:
      max_input_tokens: 131072
  - model_name: groq-fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      timeout: 60
    model_info:
      max_input_tokens: 131072
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 300

  # crew#568 phase 1 (ADR 0011): Claude is a lane on the router, not a key on the Mac. Every
  # caller that wants Claude asks the router by name; the key lives in litellm-upstream and is
  # born by bin/idp-bootstrap-vendors from SEED_ANTHROPIC_API_KEY (R52), never pasted anywhere.
  # Model ids from https://docs.anthropic.com/en/docs/about-claude/models (read 2026-08-29).
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 300
      max_tokens: 8192
    model_info:
      max_input_tokens: 200000

  - model_name: claude-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 300
      max_tokens: 8192
    model_info:
      max_input_tokens: 200000

  # Local, free, and the only tier that survives every credential expiring at once.
  - model_name: ollama
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434
      timeout: 300
      # Keep the weights resident. Ollama unloads a model 5 minutes after its last
      # call, and reloading 7B cost the consensus vote its 30 s deadline every time
      # (measured 2026-08-26: 30.8 s cold, 16.9 s warm, crew#284 CP2). The proxy is
      # the only caller, so it owns the residency.
      keep_alive: 24h
  # routing.vision in AGENTS.md (sovereign model.vision, R8: an alias, never a
  # provider model name). gemma3:4b is multimodal and is already pulled locally.
  # Through Ollama's OpenAI-compatible endpoint, not the ollama/ provider: the
  # litellm-database image ships without Pillow, and the ollama/ provider needs
  # it to pass an image ("ollama image conversion failed", 2026-08-26). The
  # OpenAI route sends the data URL through untouched.
  - model_name: ollama-vision
    litellm_params:
      model: openai/gemma3:4b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 300
  # Second local voter for the kernel's 3-model consensus (kini spec 4.2:
  # "Ollama handles 2/3 quorum load"); a different family from `ollama`, so two
  # local votes are not one model voting twice.
  - model_name: ollama-llama
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://host.docker.internal:11434
      timeout: 300
      keep_alive: 24h

router_settings:
  # The chain prospector's `noncritical_operator:` already declares, expressed once here
  # instead of in FallbackOperator. `minimax -> minimax_m27` is the documented failover;
  # ollama is last because it is local and cannot run out of credit.
  fallbacks:
    # crew#506 CP1 (2026-08-27): the first hop is the other funded direct vendor. OpenRouter sat
    # at ~2,400 tokens of credit and Google prepaid was empty, so the crew#284 order (OpenRouter
    # first) walked every turn through 402/429 before reaching a lane that answers. Consensus
    # still survives any one account dry. Every chain not headed by the cheap model ends in it
    # (sovereign cp30). The OpenRouter lanes stay in model_list for crew#506 CP4 (free lanes,
    # job aliases) but sit in no chain while the account is unfunded: a hop that always
    # answers 402 is latency, not redundancy.
    - minimax: [deepseek]
    # crew: kimi is bought through OpenRouter, so an empty account must not take the lane
    # off the estate; it ends in the one directly funded model like every other chain.
    - kimi: [minimax]
    - deepseek: [minimax]
    - openrouter: [minimax, deepseek]
    - gemini: [minimax, deepseek]
    # crew#506 CP4: a free lane that rate-limits falls to the paid direct lanes, never to
    # another free lane first; the chain still ends in the cheap model (cp30).
    - groq: [minimax, deepseek]
    - groq-fast: [groq, deepseek]
    # crew#568 phase 1: a Claude turn that 4xx/5xxs falls to the funded direct lanes and ends
    # in the cheap model (cp30), like every other chain; claude-fast tries claude first.
    - claude: [claude-or, minimax, deepseek]
    - claude-or: [minimax]
    - claude-fast: [claude, deepseek]
  num_retries: 2
  # A tier that keeps failing is taken out of the chain rather than retried into the
  # ground. This is the circuit breaker prospector/breaker.py hand-rolls.
  allowed_fails: 3
  cooldown_time: 60

litellm_settings:
  # Traces to the collector that already runs. No second store.
  callbacks: ["otel"]
  drop_params: true
  # Never log the prompt or the completion body. Spans carry model, latency, tokens and
  # cost — which is what an audit trail needs — and not the content of a customer's
  # document (LAW 21).
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # A CEILING, not a budget. R14 is zero spend without founder sign-off; this number is
  # the thing that refuses a runaway loop at 03:00, not permission to spend it. Raising it
  # is a founder decision, and the proxy is where that decision is enforced rather than
  # hoped for.
  max_budget: 5.0
  budget_duration: 1d
  # Health checks cost a call per upstream. Off by default; `litellm-status` probes
  # liveliness, which is free.
  background_health_checks: false
