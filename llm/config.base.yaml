# LiteLLM routing. This file replaces the chain-building half of prospector/operator.py.
#
# Standard: crew/docs/STANDARDS.md "LLM providers" (LiteLLM, adopted 2026-08-24).
#
# The names on the left are the ONLY thing prospector sees. They are deliberately the same
# tier names config.yaml already uses (`operator:`, `noncritical_operator:`), so the
# migration is a `providers:` block pointing at 127.0.0.1:4000 and not a rewrite.
#
# WHAT IS NOT HERE. `claude_cli` and `gemini_cli` are absent on purpose. They are local CLI
# binaries spending a SUBSCRIPTION, not HTTP endpoints spending an API key, and a proxy
# cannot drive them. They stay in prospector, they stay the trusted `moat_primary` tier,
# and they stay the EUR 0 path (R14).

model_list:
  # @vendor-lanes@

  # Local, free, and the only tier that survives every credential expiring at once.
  - model_name: ollama
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11434
      timeout: 300
      # Keep the weights resident. Ollama unloads a model 5 minutes after its last
      # call, and reloading 7B cost the consensus vote its 30 s deadline every time
      # (measured 2026-08-26: 30.8 s cold, 16.9 s warm, crew#284 CP2). The proxy is
      # the only caller, so it owns the residency.
      keep_alive: 24h
  # routing.vision in AGENTS.md (sovereign model.vision, R8: an alias, never a
  # provider model name). gemma3:4b is multimodal and is already pulled locally.
  # Through Ollama's OpenAI-compatible endpoint, not the ollama/ provider: the
  # litellm-database image ships without Pillow, and the ollama/ provider needs
  # it to pass an image ("ollama image conversion failed", 2026-08-26). The
  # OpenAI route sends the data URL through untouched.
  - model_name: ollama-vision
    litellm_params:
      model: openai/gemma3:4b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      timeout: 300
  # Second local voter for the kernel's 3-model consensus (kini spec 4.2:
  # "Ollama handles 2/3 quorum load"); a different family from `ollama`, so two
  # local votes are not one model voting twice.
  - model_name: ollama-llama
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://host.docker.internal:11434
      timeout: 300
      keep_alive: 24h

  # Claude Code Max subscription, passthrough. NO api_key ON PURPOSE -- same lane and same
  # mechanism as platform/llm/config.base.yaml's copy, kept identical so a client pointed at
  # either router behaves the same. Read that file for the full argument; the short version:
  # a lane with no api_key RELAYS the client's own OAuth token to api.anthropic.com unchanged
  # (general_settings.forward_client_headers_to_llm_api, below), so the model is genuinely
  # Claude on the caller's own Max plan and the estate holds no Anthropic key. The 2026-09-04
  # ruling bans Anthropic API keys; an OAuth token from `claude /login` is a different
  # credential on a different billing path, and nothing here creates or holds one.
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-5
      timeout: 600

  # Every Claude model, not only opus (founder, 2026-09-22). Same rows as the cluster router
  # carries, because tests/test_llm_row.py diffs the two files model for model and a hosted
  # lane that exists on one side only is the drift that check is there to catch. The named
  # rows are what `/v1/models` enumerates and therefore what a key can be granted; the
  # wildcard is what carries a real client, which sends the exact dated id it was built
  # against rather than the alias.
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      timeout: 600

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      timeout: 600

  - model_name: "claude-*"
    litellm_params:
      model: "anthropic/claude-*"
      timeout: 600

router_settings:
  # The chain prospector's `noncritical_operator:` already declares, expressed once here
  # instead of in FallbackOperator. `minimax -> minimax_m27` is the documented failover;
  # ollama is last because it is local and cannot run out of credit.
  fallbacks:
    # crew#506 CP1 (2026-08-27): the first hop is the other funded direct vendor. OpenRouter sat
    # at ~2,400 tokens of credit and Google prepaid was empty, so the crew#284 order (OpenRouter
    # first) walked every turn through 402/429 before reaching a lane that answers. Consensus
    # still survives any one account dry. Every chain not headed by the cheap model ends in it
    # (sovereign cp30). The OpenRouter lanes stay in model_list for crew#506 CP4 (free lanes,
    # job aliases) but sit in no chain while the account is unfunded: a hop that always
    # answers 402 is latency, not redundancy.
    # @vendor-fallbacks@
  # Alias, not a model row (R75, founder 2026-09-03). The Kimi lane is console-owned: the
  # founder brought the key through the LiteLLM console on 2026-09-04 and it is stored
  # encrypted in litellm-db under the vendor's own name, `moonshot/kimi-k3`. Rendering a
  # `kimi` row here would lock that name in the config file and the console would then refuse
  # to attach a key to it ("defined in config"), which is the failure he hit the day before.
  # An alias carries no credential and declares no model, so it cannot lock anything -- it
  # only spares every caller from hardcoding a vendor path that changes when the vendor
  # ships k4. Probed 2026-09-04 05:47Z from inside the litellm pod: `moonshot/kimi-k3`
  # answers HTTP 200 in 30.5s, while `kimi` answered HTTP 400 "Invalid model name".
  model_group_alias:
    kimi: moonshot/kimi-k3
  num_retries: 2
  # A tier that keeps failing is taken out of the chain rather than retried into the
  # ground. This is the circuit breaker prospector/breaker.py hand-rolls.
  allowed_fails: 3
  cooldown_time: 60
  # `groq`, `cerebras`, `sambanova`, `default` and `fast` are real pools now (platform/vendors/
  # consoles.yaml, 2026-09-15: two extra keys each on groq/cerebras, three on the new sambanova
  # vendor, all four free vendors plus minimax under default/fast). `cost-based-routing` picks
  # the cheapest deployment among whichever the allowed_fails/cooldown_time breaker has not
  # cooled down -- the three free vendors carry no input_cost_per_token/output_cost_per_token,
  # so LiteLLM prices them $0.0000 and prefers them over paid MiniMax whenever one is healthy.
  # Same setting as platform/llm/config.base.yaml, for the same pools; see that file's comment
  # for why this repo has two config.base.yaml files at all.
  routing_strategy: cost-based-routing

litellm_settings:
  # Traces to the collector that already runs. No second store.
  # The efficiency gateway runs the 9 token-optimisation mechanisms on every call.
  # See platform/llm/efficiency_gateway.py for what each one does.
  callbacks: ["otel", "efficiency_gateway.proxy_handler_instance"]
  drop_params: true
  # Never log the prompt or the completion body. Spans carry model, latency, tokens and
  # cost — which is what an audit trail needs — and not the content of a customer's
  # document (LAW 21).
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # A CEILING, not a budget. R14 is zero spend without founder sign-off; this number is
  # the thing that refuses a runaway loop at 03:00, not permission to spend it. Raising it
  # is a founder decision, and the proxy is where that decision is enforced rather than
  # hoped for.
  max_budget: 5.0
  budget_duration: 1d
  # Health checks cost a call per upstream. Off by default; `litellm-status` probes
  # liveliness, which is free.
  background_health_checks: false
  # Claude Code Max subscription passthrough. Forwards x-* and anthropic-beta headers. This is
  # NOT what carries the subscription token -- LiteLLM forwards the OAuth `Authorization` header
  # regardless of this flag (measured against v1.98.0's clean_headers, 2026-09-21); the token
  # discriminator is the `sk-ant-oat` prefix, which is forwarded, vs `sk-ant-api03` (an API key),
  # which is dropped. `forward_llm_provider_auth_headers` is deliberately NOT set: that is the
  # x-api-key BYOK path the 2026-09-04 ruling forbids. The client must auth with
  # x-litellm-api-key, not Authorization, or the OAuth token is consumed and dropped.
  forward_client_headers_to_llm_api: true
