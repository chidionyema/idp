# The fallback trace receiver.
#
# This is the same idea as Datasette sitting beside Backstage: a second thing
# that already accepts the traffic, sharing no runtime with the primary, so a
# switch is changing one endpoint rather than starting a service and hoping.
#
# Langfuse is node + ClickHouse + Postgres + Redis + MinIO. This is one Go
# binary writing JSONL to a file. Nothing that breaks Langfuse can break it.
#
#   send here instead:  OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#   read what landed:   bin/langfuse-status --fallback
#
# It is deliberately dumb. There is no query interface, no UI and no retention
# policy beyond file rotation. It is not a replacement for Langfuse, it is
# proof that losing Langfuse does not lose the traces -- which is the whole
# requirement: never one thing, and the switch takes seconds.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory before the container limit does it for us. The collector
  # refusing a batch is recoverable; the kernel killing the collector is not.
  memory_limiter:
    check_interval: 5s
    limit_mib: 96
    spike_limit_mib: 24
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  file:
    path: /data/traces.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 4

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]
