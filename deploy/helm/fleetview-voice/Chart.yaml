apiVersion: v2
name: fleetview-voice
description: FleetView Voice - Real-time voice interface for fleet operations with durable event streaming
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - voice
  - fleetview
  - nats
  - kafka
  - streaming
home: https://github.com/chidionyema/idp
maintainers:
  - name: Bytesync Engineering
    email: engineering@bytesync.io
dependencies:
  - name: nats
    version: "1.1.x"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
