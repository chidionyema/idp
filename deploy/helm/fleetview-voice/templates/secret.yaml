{{- if or .Values.auth.clientSecret (and (eq .Values.eventBus.type "kafka") .Values.eventBus.kafka.sasl.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetview-voice.fullname" . }}-secrets
  labels:
    {{- include "fleetview-voice.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.clientSecret }}
  AUTH_CLIENT_SECRET: {{ .Values.auth.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
