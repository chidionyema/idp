apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleetview-voice.fullname" . }}-api
  labels:
    {{- include "fleetview-voice.api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fleetview-voice.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fleetview-voice.api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "fleetview-voice.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "fleetview-voice.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: {{ include "fleetview-voice.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - uvicorn
            - serve:app
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.observability.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.observability.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "fleetview-voice.fullname" . }}-config
          env:
            # Auth secrets
            {{- if .Values.auth.clientSecretRef.name }}
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.clientSecretRef.name }}
                  key: {{ .Values.auth.clientSecretRef.key }}
            {{- else if .Values.auth.clientSecret }}
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleetview-voice.fullname" . }}-secrets
                  key: AUTH_CLIENT_SECRET
            {{- end }}
            # Kafka secrets (when applicable)
            {{- if and (eq .Values.eventBus.type "kafka") .Values.eventBus.kafka.sasl.enabled .Values.eventBus.kafka.sasl.passwordSecretRef.name }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eventBus.kafka.sasl.passwordSecretRef.name }}
                  key: {{ .Values.eventBus.kafka.sasl.passwordSecretRef.key }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if and (eq .Values.eventBus.type "kafka") .Values.eventBus.kafka.tls.enabled .Values.eventBus.kafka.tls.caSecretRef.name }}
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/ssl/kafka
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthChecks.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthChecks.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthChecks.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthChecks.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthChecks.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthChecks.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthChecks.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthChecks.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthChecks.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthChecks.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if and (eq .Values.eventBus.type "kafka") .Values.eventBus.kafka.tls.enabled .Values.eventBus.kafka.tls.caSecretRef.name }}
      volumes:
        - name: kafka-ca
          secret:
            secretName: {{ .Values.eventBus.kafka.tls.caSecretRef.name }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
