<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The same drawing as components/Logo.tsx, scaled 4/3 (24 -> 32) so the mark in the tab is
       literally the mark in the nav: ring r 8.6, lens rx 3.8, stroke 1.5, bead r 1.7. On an ink
       tile the ring and meridian are paper, and the bead is the accent lifted for dark ground
       (--accent-on-ink), because #1A56DB disappears against #0D0D0A in a tab strip. -->
  <rect width="32" height="32" rx="6" fill="#0D0D0A"/>
  <circle cx="16" cy="16" r="11.47" stroke="#FAFAF8" stroke-width="2"/>
  <ellipse cx="16" cy="16" rx="5.07" ry="11.47" stroke="#FAFAF8" stroke-width="2"/>
  <circle cx="16" cy="4.53" r="2.27" fill="#7FA6F8"/>
</svg>
