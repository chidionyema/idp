# Lint and type configuration for every Python file in idp (crew#325 step 3).
# ci.yml runs `ruff check .`; the selected set is the one that finds real defects
# (syntax errors, undefined names, misused comparisons). Widening it to ruff's default
# set is a separate change: measured 2026-08-26 it adds 91 findings, 44 of them E702.
[tool.ruff]
target-version = "py312"
extend-exclude = ["backstage", "node_modules", ".venv", ".claude", ".estate-hooks", ".growmos", "tests/fixtures/projection/broken.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# fast-gate's python-strict hook runs `ruff check E9,F,B,S` on top of this file's own
# narrower select (idp#3564). S101 (bare assert) is the standard pytest assertion idiom,
# not a production input-validation smell -- bandit's own docs recommend this exact
# exemption for test code. S311 (random not for crypto) fires on tests/pareval's use of
# random.uniform() to generate statistical test noise, never a credential or token.
# S603/S607: subprocess with partial path/untrusted input — tests run git, not user strings.
"tests/**/*.py" = ["S101", "S311", "S603", "S607"]
"**/tests/**/*.py" = ["S101", "S311", "S603", "S607", "S105", "S608"]

[tool.pyright]
include = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
# crew#584: the default nobody types. -n auto spreads the run over every core (measured 2026-08-28:
# 160 s -> 17.34 s on the same 17 files). Selection is NOT testmon: it tracks Python coverage only, and
# after a YAML-only edit to oke-check.yml it answered "no tests ran" -- a false green, measured the same
# day. bin/idp-tests-for names the tests that read a changed file; CI runs everything on a fresh checkout.
addopts = "-n auto"
