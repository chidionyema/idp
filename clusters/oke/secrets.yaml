# Secrets row (crew#227 CP3). The operator first, then the store once its CRDs exist. Nothing
# depends on this row: every workload secret is an ExternalSecret, and the sops-age key is gone
# (idp#120, 2026-08-25).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  # edge installs cert-manager, which signs the sdk server's certificate (certs.yaml in this
  # row) before the chart's sdk-server pod can mount it. Acyclic: edge depends only on
  # gateway-api-crds, kyverno and priority-classes, none of which depend on this row.
  dependsOn:
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secrets
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-store
  namespace: flux-system
  # crew#325: every workload row waits on this one, so its path holds only the store and
  # flux-telegram; an optional credential (the GitHub App) lives with its consumer.
spec:
  interval: 10m
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secret-store
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-vars
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: estate-vault
