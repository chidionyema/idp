# Secrets row (crew#227 CP3). The operator first, then the store once its CRDs exist. Nothing
# depends on this row yet; workloads move over one ExternalSecret at a time, and the sops-age
# key is deleted when the last sops file is gone.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secrets
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-store
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secret-store
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-vars
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: oci-vault
