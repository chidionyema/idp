# Secrets row (crew#227 CP3). The operator first, then the store once its CRDs exist. Nothing
# depends on this row: every workload secret is an ExternalSecret, and the sops-age key is gone
# (idp#120, 2026-08-25).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30s
  # edge installs cert-manager, which signs the sdk server's certificate (certs.yaml in this
  # row) before the chart's sdk-server pod can mount it. Acyclic: edge depends only on
  # gateway-api-crds, kyverno and priority-classes, none of which depend on this row.
  dependsOn:
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secrets
  prune: true
  wait: true
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: secret-store
  namespace: flux-system
  # crew#325: every workload row waits on this one, so its path holds only the store and
  # flux-telegram; an optional credential (the GitHub App) lives with its consumer.
spec:
  interval: 30s
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/secret-store
  prune: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-vars
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: estate-vault
---
# The human door (decision 0017): the founder's Bitwarden project as a ClusterSecretStore, the
# concierge namespace its twilio target lands in, and the bridge HelmRelease that renders one
# ExternalSecret per vendor key from platform/vendors/consoles.yaml. All three rows were dropped by
# c96359f4 (2026-09-26, "~80 Flux rows -> 7") and never restored: their objects stayed live with
# no owner, so nothing in git reached them. The bridge HelmRelease was then hand-suspended on
# 2026-10-03 and sat on that chart for nine days with nothing to put it back. always-on, so
# bin/idp-always-on-guard refuses the next tree that drops them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: human-vault
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: external-secrets
    - name: secret-store
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/human-vault
  prune: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: human-vault
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: concierge
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/concierge
  prune: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: human-vault-bridge
  namespace: flux-system
spec:
  interval: 5m
  # concierge first: the twilio row's ExternalSecrets land in its namespace.
  dependsOn:
    - name: human-vault
    - name: concierge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/human-vault-bridge
  prune: true
  wait: false
  timeout: 5m
