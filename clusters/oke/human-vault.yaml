# Human-door row (decision 0017). Its own row on purpose (crew#284 isolation): while the
# founder has not yet created the Bitwarden organisation or seeded the machine token, this row
# is red and holds NOTHING else - the machine store, the workload rows and the wave all stay
# green. Depends on external-secrets (the operator and its sdk server), secret-store (the
# estate-vault entry that carries the bridge's own token) and edge (cert-manager signs the
# sdk server's certificate).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: human-vault
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: external-secrets
    - name: secret-store
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/human-vault
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: human-vault
