# Human-door row (decision 0017). Its own row on purpose (crew#284 isolation): while the
# founder has not yet created the Bitwarden organisation or seeded the machine token, this row
# is red and holds NOTHING else - the machine store, the workload rows and the wave all stay
# green. Depends on external-secrets (the operator and its sdk server), secret-store (the
# estate-vault entry that carries the bridge's own token) and edge (cert-manager signs the
# sdk server's certificate).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: human-vault
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: external-secrets
    - name: secret-store
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/human-vault
  prune: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: human-vault
---
# The bridge (founder 2026-09-07: "should auto sync once i configure on portal"). Its own row for
# the same reason the store above has one: while a key is still missing from Secrets Manager its
# ExternalSecret is red, and a red row here must not hold the store, the router or anything else.
#
# `wait: false` and no healthChecks, on purpose. The bridge is healthy when the founder has dropped
# in every key, and that is a state he moves through, not a precondition for the platform running.
# A row that waits would go red the moment a vendor is registered before its key is added, which is
# the normal order of events.
#
# This is the switch the portal's "Enable platform feature" template flips (platform/features:
# feature `human-key-door`). Suspended means the estate reads keys only from the vault it seeds
# itself; resumed means a key the founder puts in Bitwarden overrides it, within a minute, with
# nobody told to sync anything.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: human-vault-bridge
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: human-vault
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/human-vault-bridge
  prune: true
  wait: false
  timeout: 5m
