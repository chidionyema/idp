# crew#839: every namespace's quota, LimitRange and network fence, generated by
# bin/idp-ns-fence-gen from platform/ns-fences/allowances.yaml.
#
# Re-added 2026-09-27. c96359f4 (the 7-row transform) deleted this row with platform.yaml, and
# every live fence became an orphan no git change could reach: #4411 (spire-mgmt kubelet egress)
# merged and never landed, leaving SPIRE without workload attestation. Measured before re-adding:
# a server-side diff of this path against the cluster changed exactly one object (that policy);
# the other 394 already matched. prune: false so adopting the orphans can delete nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: ns-fences
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/ns-fences
  prune: false
  wait: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
