# Every namespace's quota, LimitRange and NetworkPolicies, generated by bin/idp-ns-fence-gen
# (restored from the pre-c96359f4 platform.yaml row; a server dry run on 2026-09-27 showed the live
# fences equal to git apart from the memory layer's flows, so this adopts what already runs).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: ns-fences
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/ns-fences
  prune: true
  wait: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
