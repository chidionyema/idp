# Alerts row: waits for its own flux-telegram secret (alerts-secret), then Provider + Alert. The channel id is substituted
# from the flux-telegram Secret so no manifest names the chat (LAW 46).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerts
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: alerts-secret
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/alerts
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-telegram
---
# The flux-telegram ExternalSecret, out of secret-store so a failing sync holds only alerts (crew#284).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerts-secret
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/alerts-secret
  prune: true
  wait: true
  timeout: 10m
---
# The github-app ExternalSecret in its own Kustomization (T009). Previously it lived inside
# platform/alerts-github, which had eight rows depending on it for postBuild substitution
# of ${githubAppIDQuoted}. alerts-github was NOT READY whenever its Notification Provider or
# Alert had an unrelated failure, cascading a NOT READY state to otto-gateway, hermes-agent,
# agent-workforce, mcp, drills, idp-agent, epistemic-fabric, and monitoring-rules. Moving the
# ExternalSecret here means those rows can declare a dependency that maps exactly to what they
# need (the Secret), not to the health of an unrelated notification subsystem.
# wait: false for the same reason the old alerts-github had it: an ExternalSecret that exists
# but is currently failing its vault sync (template error, stale key) is still "applied" and
# the Secret it previously wrote remains valid (deletionPolicy Retain). kstatus cannot tell
# these states apart, so `wait: true` makes this Kustomization permanently NOT READY on any
# vault-side transient error, blocking eight rows for no operational reason.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-app-creds
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/github-app-creds
  prune: true
  wait: false
  timeout: 10m
---
# crew#406 row 4: the GitHub App (vault key github-app) was never created, so the github-app
# ExternalSecret never became Ready, alerts-secret (wait: true) never became Ready, and `alerts`
# was never applied: the Telegram channel was dead behind a credential it does not use. The
# githubdispatch ledger has its own Kustomization; it waits on the App, nothing else waits on it
# -- but eight rows (drills, hermes-agent, agent-workforce, mcp, otto-gateway, idp-agent,
# epistemic-fabric, monitoring-rules) had grown a real dependsOn on this one for the Secret its
# postBuild substitutes. Those eight rows now depend on `github-app-creds` (the Secret only),
# not on this Kustomization (which also carries the Provider and Alert).
#
# Measured 2026-09-04: `wait: true` here has kustomize-controller kstatus-check every applied
# object, including the ExternalSecret itself. Its own controller (external-secrets) can flip
# that ExternalSecret's Ready condition to False on a vault template error -- e.g. a dataFrom
# key going missing on refresh -- even while the Secret it already wrote stays valid and served
# (creationPolicy Owner, deletionPolicy Retain: a failed *refresh* never deletes the existing
# data). kstatus has no way to tell "stale but usable" from "never synced", so the Kustomization
# sat Reconciling/HealthCheckFailed on a 10m loop for days.
#
# None of the two objects this path now applies (Provider, Alert) is a workload with pods;
# there is nothing here for `wait` to usefully block on. Apply-and-prune.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerts-github
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: secret-store
    # Provider/Alert reference the github-app Secret; it must exist before the Provider is created.
    - name: github-app-creds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/alerts-github
  prune: true
  wait: false
  timeout: 10m
