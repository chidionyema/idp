# were tried and rejected before this one (5451614620/5451623095: a hand-pasted reusable auth key;
# 5451900443 point 1: an interactive login URL) -- history left in git history, not repeated here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/tailscale
