# crew#488 / crew#539: the portal's namespace, on its own, before anything that lands in it.
#
# cluster-state, spire and image-automation all apply objects into namespace backstage, and on a
# cluster with no history they ran before it existed (`namespaces "backstage" not found`, drill run
# 33214748124). The edge they wanted -- dependsOn: [backstage] -- is the one crew#539 forbids: the
# portal row waits on Deployment/catalogue being healthy, so that edge makes a stalled catalogue
# rollout hold the platform, which is the incident crew#539 exists for.
#
# One object, no workload, nothing that can be unhealthy. It is what those rows wait for.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backstage-namespace
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/backstage/namespace/overlays/oke
  prune: true
  wait: true
  timeout: 2m
---
# crew#857: the feature register and pre-computed plan consumed by the
# catalogue backend. One ConfigMap, two files (features.yaml + plan.json),
# generated by Kustomize from platform/features/ so Flux never needs a
# load-restrictor flag. Lands in namespace backstage before the catalogue
# pod starts.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: feature-register
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/features
  prune: true
  dependsOn:
    - name: backstage-namespace
  wait: true
  timeout: 2m
---
# ADR 0004 step 3. `flux bootstrap github --path clusters/oke` writes flux-system/ beside this
# file; everything below is what Flux then reconciles. Secrets reach the
# cluster from OCI Vault through External Secrets (platform/secret-store); no sops key in cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backstage
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/backstage/overlays/oke
  prune: true
  # crew#488 CP5: the overlay carries an ExternalSecret (backstage-env). Without these two rows
  # Flux dry-ran it before the CRD existed and the portal read as a root portability break;
  # platform rows still never wait on the portal (crew#539), the portal waits on its secrets.
  dependsOn:
    - name: github-app-creds
    - name: backstage-namespace
    - name: external-secrets
    - name: secret-store
    # The overlay also carries HTTPRoute/catalogue and Middleware/login-forward-auth, whose CRDs
    # come from gateway-api-crds and the Traefik chart in `edge` -- so on an empty cluster the row
    # dry-ran those two before either existed. Found by the closure-aware CRD-before-CR guard,
    # which the flat PRE_INSTALLED set had been widened past (crew#488).
    - name: edge
    # Its Postgres data is copied onto the estate cluster before this row is applied, and
    # this row is what deletes the old server. estate-db-migrate is the copy (crew: one
    # Postgres for the estate) -- it must report Ready first or the data would be pruned
    # ahead of being moved.
    # github-token.yaml substitutes ${githubAppIDQuoted}/${githubAppInstallationIDQuoted}
    # from the flux-system/github-app Secret; strict envsubst fails the row until the
    # Secret exists. github-app-creds (not alerts-github) now owns the Secret (T009).
  postBuild:
    substituteFrom:
      # ESTATE_ZONE (idp#140): the zone is one value in clusters/oke/estate-config.yaml; not
      # optional, a missing ConfigMap must fail the row rather than publish '${ESTATE_ZONE}'.
      - kind: ConfigMap
        name: estate-config
      # The estate-agents App's id and installation id for the GithubAccessToken generator
      # that mints the portal's GitHub token (platform/backstage/overlays/oke/github-token.yaml).
      - kind: Secret
        name: github-app
  timeout: 2m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: catalogue
      namespace: backstage
  patches:
    # pinned to live 2026-09-26: git says 2, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: backstage, name: catalogue }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
---
# The schedules. Split from the install (incident 2026-08-25): Flux dry-runs a row as one
# unit, and a Schedule cannot be dry-run before chaos-mesh.org CRDs exist.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  # Suspended 2026-08-25 because the canary took the 2 OCPU node from 1270m to 1830m requested and
  # left Backstage postgres Pending. The node was replaced by surge with the 4 OCPU / 24 GB shape on
  # 2026-08-26 04:38Z (crew#289 CP3, session 9f8f4f5f), so the row fits and runs again (crew#325).
  suspend: false
  # 10m so a broken workload is reported within ten minutes (tests/test_incident_backstage_17h_unreported.py).
  # After unsuspend the HelmRelease has a 15m timeout, so a cold ClickHouse shows "not ready" for the
  # first two ticks; that is the install, not an incident (code-37, 2026-08-25).
  interval: 30s
  dependsOn:
    - name: scheduling
    # crew#584: the collector row owns k8s-infra now; ordering it first means the objects are
    # relabelled to the new owner before this row's prune sees them as strays.
    # Four ExternalSecrets (clickhouse-auth, langfuse-init, otlp-ingest-users, signoz-root) are in
    # this row; external-secrets.io only exists once the ESO chart has landed (crew#488).
    - name: external-secrets
    # Its Postgres data is copied onto the estate cluster before this row is applied, and
    # this row is what deletes the old server. estate-db-migrate is the copy (crew: one
    # Postgres for the estate) -- it must report Ready first or the data would be pruned
    # ahead of being moved.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/observability
  prune: true
  postBuild:
    substituteFrom:
      # ESTATE_ZONE for langfuse.<zone> (platform/observability/httproute.yaml), like every other row.
      - kind: ConfigMap
        name: estate-config
  timeout: 20m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: signoz
      namespace: observability
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: langfuse
      namespace: observability
  patches:
    # pinned to live 2026-09-26: git says 2, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: observability, name: aevum }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
    # pinned to live 2026-09-26: git says 2, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: observability, name: signoz-sso }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
---
# The estate's one login (ADR 0007, crew#269). After edge (Gateway, cert-manager, Traefik CRD
