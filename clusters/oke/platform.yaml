      - kind: ConfigMap
        name: estate-config
---
# The estate's own search backend (crew#751 research engine, and prospector's grounding chain):
# SearXNG, keyless, ClusterIP only. It depends on nothing -- no vault entry, no identity, no
# route -- because every keyless search path that is not self-hosted has been measured dead
# (platform/searxng/settings.yaml carries the numbers).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/searxng
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: searxng
      namespace: searxng
---
# The research engine (crew#508, SPEC-v1). The estate's own research department: on the hour it
# takes one question from platform/research-engine/cronjob.yaml, has GPT Researcher retrieve and
# snapshot the sources through the estate's SearXNG, extracts candidate claims on one router
# lane, has a lane from a DIFFERENT provider check each one against the document it cites, and
# writes the result -- admitted and rejected alike -- to the estate database.
#
# It depends on four things and says so: secret-store for the two credentials, llm because
# both model lanes are the estate router, searxng because a run with no search backend
# retrieves nothing and the engine stops rather than writing an essay with invented citations,
# and estate-db because its `research` database and role live on the one Postgres.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: research-engine
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: secret-store
    - name: llm
    - name: searxng
    - name: estate-db
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/research-engine
  prune: true
  wait: true
  timeout: 10m
---
# The one database platform, part 1: the operator and its CRDs. Founder, 2026-09-04, on the ten
# Postgres servers this estate ran: "we need urgent consolidtion to one in few steps as possible
# fast, this is a crazy situation". Split in two rows because the cluster below is a custom
# resource the operator defines, and a Kustomization cannot apply a CR whose CRD it is installing
# in the same pass.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: estate-db-operator
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/estate-db/operator
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: estate-db
---
# Part 2: the cluster itself, its twelve databases and their roles. Depends on secret-store
# because every password comes from the vault entry `estate-db`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: estate-db
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: estate-db-operator
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/estate-db/cluster
  prune: true
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: estate
      namespace: estate-db
---
# Part 3: the copy. Seven Jobs, each one lifting a database off the server it is retiring and
# putting it on the estate cluster. It waits for part 2, so it never runs before the databases
# and the roles exist. Each Job is written to be run once and to do nothing on every run after.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: estate-db-migrate
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: estate-db
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/estate-db/migrate
  prune: true
  wait: true
  timeout: 20m
---
# crew#839: every namespace's request defaults and its ceiling, generated in one pass by
# bin/idp-ns-fence-gen from platform/ns-fences/allowances.yaml. A LimitRange lands beside every
# quota in the same file, because a quota that counts requests.cpu refuses every pod that declares
# none -- a fence that refuses correct work is an outage. Sized from what each namespace actually
# asked for on 2026-09-04 (platform/ns-fences/measured.json), not from a guess.
# The matching NetworkPolicies are generated too and are deliberately NOT applied: this cluster
# runs flannel, which enforces none of them. platform/ns-fences/network/README.md says what has to
# be true before that directory gets a row here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ns-fences
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/ns-fences
  prune: true
  wait: true
  timeout: 10m
---
# The estate's network policy enforcement layer, merged suspended (crew#839).
#
# Nothing in this cluster enforces NetworkPolicy today: the CNI is flannel, which routes pods and
# does not read policy objects, so the sixteen policies already here have never denied a packet.
# Oracle refuses the policy-only-beside-flannel arrangement in writing, so this row REPLACES the
# datapath, and that is why it ships suspended rather than applied.
#
# Calico is installed FIRST, while flannel is still routing. The order in Oracle's page --
# remove flannel, then apply Calico -- deadlocks here: `tigera-operator` is an ordinary pod, so
# with no CNI configuration on the node it can never start, and nothing would ever install the
# replacement. calico-node runs on the host network and does not have that problem. So this row
# is live, and the second half of the cutover is the one step Flux cannot take: disabling
# Oracle's flannel add-on, which is what stops its controller putting flannel back.
#
# `wait: false` deliberately: the health of this row is the cluster's own network, and a
# Kustomization that blocks waiting for the network it is installing has nothing left to report
# through. `bin/ns-fence-gate --live` is the receipt instead -- it refuses to report a pass while
# no CNI enforces policy, so a clean line from it means the cutover worked.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calico
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/calico
  prune: false
  wait: false
  timeout: 15m
---
# crew#841: the break-glass bridge's read access. Cluster-scoped RBAC only -- no workload, no
# namespace, nothing to fence. The bridge itself runs on an Oracle instance outside the cluster
# on purpose, so that a node event or a bad reconcile does not take the debugger with it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rbac-identity
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/rbac-identity
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rbac
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: rbac-identity
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/rbac
  prune: true
  wait: true
  timeout: 5m
  # The bridge's instance OCID, published to the vault by terraform and synced here by External
  # Secrets. optional: false on purpose -- if the identity is missing this reconcile must fail
  # loudly, because a binding rendered with an empty subject grants nothing and says nothing.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: bridge-identity
        optional: false
