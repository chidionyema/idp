# LLM, and on 2026-09-08 the bill came in: the descheduler policy that finishes the CNI cutover
# sat undelivered for the better part of an hour behind `dependency 'flux-system/llm' is not
# ready` while the router's own lanes were degraded. K8sGPT is now the row below and keeps both
# dependencies; this row keeps none of them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
