    - apiVersion: apps/v1
      kind: Deployment
      name: hermes-agent-gateway
      namespace: hermes-agent
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otto-golden-secret
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/otto-golden-secret
  prune: true
  wait: true
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otto-golden
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
