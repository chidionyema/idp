# crew#539: scheduling immunity. The balloon and the Kyverno policies that keep the radio-room set
# honest. After edge (Kyverno CRDs) and after priority-classes, which is where the two classes now
# live: the rows that name infrastructure-critical still depend on this one, and reach
# priority-classes through its dependsOn below.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scheduling
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: priority-classes
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/scheduling
  prune: true
  # Never wait on the balloon. platform/scheduling/balloon.yaml is a Deployment whose pods are
  # DESIGNED to sit Pending after a preemption (that Pending pod is the autoscaler's signal), so
  # `wait: true` here turned every preemption into a row stuck "Reconciliation in progress" for up
  # to the 10m timeout -- measured 2026-09-09: runs of 4m31s and 8m56s -- and every row that
  # dependsOn scheduling (cyrus, chaos-mesh, healing, ...) kept landing in that window and reading
  # "dependency 'flux-system/scheduling' is not ready" for the better part of an hour. What those
  # rows actually need from here is the three admission policies, so those are the health checks.
  wait: false
  timeout: 2m
  healthChecks:
    - apiVersion: kyverno.io/v1
      kind: ClusterPolicy
      name: capacity-affinity
    - apiVersion: kyverno.io/v1
      kind: ClusterPolicy
      name: require-availability
    - apiVersion: kyverno.io/v1
      kind: ClusterPolicy
      name: require-priority-class
  patches:
    # pinned to live 2026-09-26: git says 2, live is ABSENT. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: scheduling, name: balloon }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
