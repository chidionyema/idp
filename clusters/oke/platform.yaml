---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/llm
  prune: true
    # Its Postgres data is copied onto the estate cluster before this row is applied, and
    # this row is what deletes the old server. estate-db-migrate is the copy (crew: one
    # Postgres for the estate) -- it must report Ready first or the data would be pruned
    # ahead of being moved.
  # ESTATE_ZONE (found live 2026-09-12): platform/llm/litellm.yaml publishes an HTTPRoute whose
  # hostname is llm.${ESTATE_ZONE}, and without this the literal string reached the API and the
  # route was refused on EVERY reconcile -- "spec.hostnames[0] in body should match ...". Flux
  # therefore never reported the llm path ready, which held every Kustomization that dependsOn it
  # behind a door that could not open. The running pods predated the route and kept serving, so
  # the only symptom was a dependency that never satisfied -- found only because router-events
  # dependsOn llm and refused to apply.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  timeout: 2m
  patches:
    # pinned to live 2026-09-26: git says 2, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: llm, name: litellm }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
    # pinned to live 2026-09-26: git says 1, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: llm, name: litellm-cache }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
    # pinned to live 2026-09-26: git says 1, live is ABSENT. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: llm, name: ollama }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
    # pinned to live 2026-09-26: git says 2, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: llm, name: zeroedge }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
