    - name: backstage-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/image-automation
  prune: true
  timeout: 2m
  healthChecks:
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      name: backstage
      namespace: flux-system
---
# crew#488 CP5: the PriorityClasses, before anything that names one. See
# platform/priority-classes/kustomization.yaml for the deadlock this ends.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
