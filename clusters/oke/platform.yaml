    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: trivy-operator
      namespace: trivy-system
---
# The guarantee against the 504 epidemic of 2026-09-03..10. A dead flannel left a
# FLANNEL-POSTRTG chain in the nodes' nat table that masqueraded every cross-node pod packet
# as the node's own address, so every destination NetworkPolicy -- which whitelists pod
# selectors, never node addresses -- dropped it at the tier default, silently, for a week.
# No gate in this tree could have caught it: they all read files. Two canaries, one per node,
# probe each other every 15 seconds and print what they saw; bin/idp-cross-node-drill reads
# those logs and is a row of the hourly verify-drill. Flux owns it so it cannot be lost.
---
# Restored 2026-09-26 beside the rest: these five own live objects (the github-app, bridge-identity and
# flux-webhook-token Secrets, the three PriorityClasses, the image-automation CRs). No workload, so no pin.
# The github-app ExternalSecret in its own Kustomization (T009). Previously it lived inside
# platform/alerts-github, which had eight rows depending on it for postBuild substitution
# of ${githubAppIDQuoted}. alerts-github was NOT READY whenever its Notification Provider or
# Alert had an unrelated failure, cascading a NOT READY state to otto-gateway, hermes-agent,
# agent-workforce, mcp, drills, idp-agent, epistemic-fabric, and monitoring-rules. Moving the
# ExternalSecret here means those rows can declare a dependency that maps exactly to what they
# need (the Secret), not to the health of an unrelated notification subsystem.
# wait: false for the same reason the old alerts-github had it: an ExternalSecret that exists
# but is currently failing its vault sync (template error, stale key) is still "applied" and
# the Secret it previously wrote remains valid (deletionPolicy Retain). kstatus cannot tell
# these states apart, so `wait: true` makes this Kustomization permanently NOT READY on any
# vault-side transient error, blocking eight rows for no operational reason.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-app-creds
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/github-app-creds
  prune: true
  wait: false
  timeout: 2m
---
# The Flux webhook receiver: GitHub POSTs a push event to hc.${ESTATE_ZONE}/hook/<id>, the
# notification-controller verifies the HMAC-SHA256 signature against the token this row's
# ExternalSecret pulls from Vault, and the flux-system GitRepository reconciles at once instead
# of waiting out its 1m poll. It rides here, and not in clusters/oke/flux-system, because the
# route names the zone as ${ESTATE_ZONE}: only a Flux Kustomization with postBuild substitutes
# that, and the flux-system build has none -- wired there, the Gateway would be handed the
# literal string "hc.${ESTATE_ZONE}" as a hostname and no push would ever land.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 1m
  dependsOn:
    # the HTTPRoute has nothing to attach to until the Gateway exists,
    - name: edge
    # and the ExternalSecret has nowhere to read flux-webhook-token from until the store does.
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/flux-webhook
  prune: true
  wait: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
# crew#267: catalogue image automation. Flux's git writer is the deploy key in flux-writer.yaml; the GitHub App ExternalSecret (github-app) lives in platform/alerts-github with its only consumer, the githubdispatch Provider, so llm, identity and the Telegram alerts never wait on it (crew#284, crew#406). After backstage-namespace, which is the namespace its RBAC lands in and not the portal row (crew#539).
# (the Deployment it rolls). The two image controllers come from flux-system/gotk-components.yaml
# (flux install --components-extra=image-reflector-controller,image-automation-controller).
