# ADR 0004 step 3. `flux bootstrap github --path clusters/oke` writes flux-system/ beside this
# file; everything below is what Flux then reconciles. Secrets reach the
# cluster from OCI Vault through External Secrets (platform/secret-store); no sops key in cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backstage
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/backstage/overlays/oke
  prune: true
  postBuild:
    substituteFrom:
      # ESTATE_ZONE (idp#140): the zone is one value in clusters/oke/estate-config.yaml; not
      # optional, a missing ConfigMap must fail the row rather than publish '${ESTATE_ZONE}'.
      - kind: ConfigMap
        name: estate-config
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: catalogue
      namespace: backstage
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chaos-mesh
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: backstage
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/chaos/mesh
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: chaos-mesh
      namespace: chaos-mesh
---
# The schedules. Split from the install (incident 2026-08-25): Flux dry-runs a row as one
# unit, and a Schedule cannot be dry-run before chaos-mesh.org CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chaos
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: chaos-mesh
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/chaos
  prune: true
---
# crew#258 CP2: SigNoz, the one metrics/traces/logs store (crew/docs/STANDARDS.md "Observability").
# Ordered after backstage so the portal keeps first claim on the single node's CPU.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  # Suspended 2026-08-25 because the canary took the 2 OCPU node from 1270m to 1830m requested and
  # left Backstage postgres Pending. The node was replaced by surge with the 4 OCPU / 24 GB shape on
  # 2026-08-26 04:38Z (crew#289 CP3, session 9f8f4f5f), so the row fits and runs again (crew#325).
  suspend: false
  # 10m so a broken workload is reported within ten minutes (tests/test_incident_backstage_17h_unreported.py).
  # After unsuspend the HelmRelease has a 15m timeout, so a cold ClickHouse shows "not ready" for the
  # first two ticks; that is the install, not an incident (code-37, 2026-08-25).
  interval: 10m
  dependsOn:
    - name: backstage
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/observability
  prune: true
  postBuild:
    substituteFrom:
      # ESTATE_ZONE for langfuse.<zone> (platform/observability/httproute.yaml), like every other row.
      - kind: ConfigMap
        name: estate-config
  wait: true
  timeout: 20m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: signoz
      namespace: observability
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: langfuse
      namespace: observability
---
# The estate's one login (ADR 0007, crew#269). After edge (Gateway, cert-manager, Traefik CRD
# provider) and secret-store (the vault). Health-checked at 10m like every other row.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/identity
  prune: true
  dependsOn:
    - name: edge
    - name: secret-store
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: oauth2-proxy
      namespace: identity
  postBuild:
    substituteFrom:
      # ESTATE_ZONE (idp#140): the zone is one value in clusters/oke/estate-config.yaml; not
      # optional, a missing ConfigMap must fail the row rather than publish '${ESTATE_ZONE}'.
      - kind: ConfigMap
        name: estate-config
---
# Model routing row (crew#284 CP2, crew#313): LiteLLM on the cluster, reached at llm.<zone>
# through the https-llm listener on prospector-edge. After edge (Gateway, certificate) and
# secret-store (the upstream keys). Health-checked at 10m like every other row.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/llm
  prune: true
  dependsOn:
    - name: edge
    - name: secret-store
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: litellm
      namespace: llm
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
# crew#345: the cluster writes its own state receipt to Object Storage every 15 minutes, so no
# session needs a kube path or `oci session authenticate` to read it (bin/idp-cluster-state).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-state
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: backstage
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/state
  prune: true
  wait: true
  timeout: 5m
