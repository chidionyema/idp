# The research engine (crew#508, SPEC-v1). The estate's own research department: on the hour it
# takes one question from platform/research-engine/cronjob.yaml, has GPT Researcher retrieve and
# snapshot the sources through the estate's SearXNG, extracts candidate claims on one router
# lane, has a lane from a DIFFERENT provider check each one against the document it cites, and
# writes the result -- admitted and rejected alike -- to the estate database.
#
# It depends on four things and says so: secret-store for the two credentials, llm because
# both model lanes are the estate router, searxng because a run with no search backend
# retrieves nothing and the engine stops rather than writing an essay with invented citations,
# and estate-db because its `research` database and role live on the one Postgres.
apiVersion: kustomize.toolkit.fluxcd.io/v1
