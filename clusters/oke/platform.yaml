---
# The Architect row (crew#516 CP4): the hermes-agent gateway (Telegram + a2a) on the cluster,
# the Mac's ai.architect.gateway leaving the laptop. After secret-store (the vault entry
# hermes-agent-env); no edge dependency, Telegram polls out and a2a stays in-cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-agent
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/hermes-agent
  prune: true
  postBuild:
    substituteFrom:
      # ESTATE_ZONE for the estate ConfigMap's probe URLs (crew#524 CP2), like every other row.
      - kind: ConfigMap
        name: estate-config
      # The estate-agents App's id and installation id for the GithubAccessToken generator;
      # rendered into flux-system by platform/alerts-github/github-app.yaml from the vault.
      - kind: Secret
        name: github-app
  dependsOn:
    - name: scheduling
    - name: secret-store
    # strict envsubst: an undefined ${githubAppIDQuoted} fails the row, so it waits on the Secret
    - name: alerts-github
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: hermes-agent-gateway
      namespace: hermes-agent
---
# Otto staging row (founder order 2026-09-01: "get this shipped and operational now"). A second,
# separate pod from hermes-agent above -- the new otto.boot process (hermes-v2 branch
# otto/boot-surface), same image, its own namespace and its own HTTPRoute paths
# (/telegram-webhook, /healthz) on the shared otto.${ESTATE_ZONE} host. Needs edge (the shared
# Gateway prospector-edge and its https-otto listener) as well as scheduling and secret-store;
# hermes-agent's row above needs no edge dependency only because it has no HTTPRoute of its own.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otto-golden
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/otto-golden
  prune: true
  postBuild:
    substituteFrom:
      # ESTATE_ZONE for the HTTPRoute hostname, like every other row.
      - kind: ConfigMap
        name: estate-config
      # OTTO_WEBHOOK_SECRET for the route's exact header match: the gateway forwards a
      # webhook POST only when Telegram echoes this value (rendered into flux-system by
      # platform/otto-golden-secret/webhook-substitution.yaml from the vault). Not
      # optional: a missing Secret fails the row rather than applying a route whose
      # expected header is the literal '${OTTO_WEBHOOK_SECRET}'.
      - kind: Secret
        name: otto-webhook
  dependsOn:
    - name: scheduling
    - name: secret-store
    - name: edge
    - name: otto-golden-secret
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: otto-golden
      namespace: otto-golden
---
# The Universal Event Gateway row (founder directive 2026-09-03). One door for every channel
# and every customer, answering /webhook/<channel> on the same otto.${ESTATE_ZONE} host the
# staging row above answers on. It runs alongside otto-golden rather than replacing it: the
# old exact path keeps working until the cutover, which is its own small change.
#
# Needs edge for the shared Gateway and its https-otto listener, secret-store for the two
# ExternalSecrets, event-bus because the door's whole output is a task on the bus, and
# scheduling like every other row. It substitutes only ESTATE_ZONE: unlike otto-golden there
# is no secret in the route, because this door checks credentials against the binding table
# rather than at the edge.
#
# It lands dark, `suspend: true`, the estate's own switch (platform/features/features.yaml:
# "`suspend:` is the switch -- nothing is ever deleted"), for two measured reasons:
#
#   1. The bus it publishes to is dark. event-bus carries `suspend: true` at
#      clusters/oke/commerce.yaml:67, "a bus with no publisher is a workload nobody reads".
#      This door is that publisher, so the two rows wake together or neither does.
#   2. The standing CPU budget has no headroom. platform/ asks for exactly 6.90 cores against
#      the 6.9 the guard allows (tests/test_incident_crew584_capacity_requests_need_proof.py:15);
#      this layer asks for 0.10 more. A suspended layer is listed in the `off` bucket and not
#      charged, and the cutover moves every one of its rows into the standing total in the same
#      commit -- which is a capacity decision, and so the founder's, not this branch's.
#
# The cutover is one small change: `suspend: false` here and on the event-bus row, with the
# 0.10 cores accounted for. Until then this branch changes nothing that runs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otto-gateway
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/otto-gateway
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  dependsOn:
    - name: scheduling
    - name: secret-store
    - name: edge
    - name: event-bus
    # Its Postgres data is copied onto the estate cluster before this row is applied, and
    # this row is what deletes the old server. estate-db-migrate is the copy (crew: one
    # Postgres for the estate) -- it must report Ready first or the data would be pruned
    # ahead of being moved.
    - name: estate-db-migrate
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: otto-gateway
      namespace: otto-gateway
---
# The otto-webhook ExternalSecret, its own row like alerts-secret (crew#284 shape): a failing
# secret sync holds only otto-golden, and the substitution Secret exists before the row
# that substitutes from it is built.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otto-golden-secret
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/otto-golden-secret
  prune: true
  wait: true
  timeout: 10m
---
# MCP row (crew#458): agentgateway + github-mcp on the cluster, reached at mcp.<zone> through the
# https-mcp listener on prospector-edge. Replaces the colima VM on the founder Mac. After edge
# and secret-store (the gateway key and GitHub token), like llm.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/mcp
  prune: true
  dependsOn:
    - name: scheduling
    - name: edge
    - name: secret-store
    # strict envsubst: an undefined ${githubAppIDQuoted} fails the row, so it waits on the Secret
    - name: alerts-github
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: agentgateway
      namespace: mcp
    - apiVersion: apps/v1
      kind: Deployment
      name: github-mcp
      namespace: mcp
    - apiVersion: apps/v1
      kind: Deployment
      name: estate-mcp
      namespace: mcp
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
      # The estate-agents App's id and installation id for the GithubAccessToken generator;
      # rendered into flux-system by platform/alerts-github/github-app.yaml from the vault.
      - kind: Secret
        name: github-app
---
# The infrastructure crew (crew#729 step 3): a crewAI CronJob that takes a `lane:infra` board
# ticket to a plan comment and a pull request. No RBAC, no cluster hand; the founder merges and
# deploys. After scheduling (its priority class), secret-store (the vault), alerts-github (the
# App Secret its token generator reads through strict envsubst) and llm (the router it calls).
# `wait: true` on a CronJob proves the objects applied, nothing more: a CronJob carries no
# readiness, so kstatus reads it Current the moment it exists. Whether a run succeeds is read
# from outside by the infra-crew drill (drills/catalogue.yaml), never from this row.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-crew
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/infra-crew
  prune: true
  postBuild:
    substituteFrom:
      # OTLP_ENDPOINT and ESTATE_GITHUB_OWNER: one value each in estate-config (LAW 46).
      - kind: ConfigMap
        name: estate-config
      # The estate-agents App's id and installation id for the GithubAccessToken generator;
      # rendered into flux-system by platform/alerts-github/github-app.yaml from the vault.
      - kind: Secret
        name: github-app
  dependsOn:
    - name: scheduling
    - name: secret-store
    - name: alerts-github
    - name: llm
  wait: true
  timeout: 10m
---
# crew#716 CP1: the estate scheduler (Dagster) on the cluster instead of the Mac.
# After edge (Kyverno policies) and secret-store (the image pull secret).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dagster
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/dagster
  prune: true
  dependsOn:
    - name: scheduling
    - name: edge
    - name: secret-store
    # Its Postgres data is copied onto the estate cluster before this row is applied, and
    # this row is what deletes the old server. estate-db-migrate is the copy (crew: one
    # Postgres for the estate) -- it must report Ready first or the data would be pruned
    # ahead of being moved.
    - name: estate-db-migrate
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: dagster
      namespace: dagster
---
# crew#345: the cluster writes its own state receipt to Object Storage every 15 minutes, so no
# session needs a kube path or `oci session authenticate` to read it (bin/idp-cluster-state).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-state
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: scheduling
    # crew#539: the namespace, not the portal. This row lands objects in namespace backstage and
    # needs it to exist; it must never wait on Deployment/catalogue being healthy.
    - name: backstage-namespace
    # crew#722: rotation-canary.yaml carries an ExternalSecret; the CRD row must land first.
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/state
  prune: true
  wait: true
  timeout: 10m
---
# crew#396: the estate's one workflow engine, in the cluster instead of on the Mac.
# Suspended 2026-08-30 on the founder's word (crew#284): "what I spec'd was not what was built; I
# wouldn't spec a dumb watcher to use Temporal." What ran here was a Temporal server, its own
# Postgres and a worker, serving two 15-minute CronJobs that write a receipt, red since 2026-08-27
# (kini-finish green=0 red=7). The namespace and its volumes stay; `suspend: false` brings it back.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  dependsOn:
    - name: edge
    - name: secret-store
    - name: image-automation   # ClusterSecretStore ghcr-pull, mirrored into this namespace (step 2)
    # Its Postgres data is copied onto the estate cluster before this row is applied, and
    # this row is what deletes the old server. estate-db-migrate is the copy (crew: one
    # Postgres for the estate) -- it must report Ready first or the data would be pruned
    # ahead of being moved.
    - name: estate-db-migrate
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/temporal
  prune: true
  wait: true
  timeout: 20m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal
      namespace: temporal
---
# Agent identity (crew#227 CP4): SPIRE issues short-lived SVIDs to workloads on this cluster.
# After backstage for the same reason chaos-mesh is: Kyverno and the PolicyException CRD arrive
# with the edge row backstage already waits on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spire
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: scheduling
    # crew#539: the namespace, not the portal. This row lands objects in namespace backstage and
    # needs it to exist; it must never wait on Deployment/catalogue being healthy.
    - name: backstage-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/spire
  prune: true
  wait: true
  timeout: 15m
  healthChecks:
