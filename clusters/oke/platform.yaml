# nyself"). Flux's own dashboard, behind the estate's one login at catalogue.${ESTATE_ZONE}/deploy.
# It depends on identity because the door in front of it is oauth2-proxy, and on edge because the
# route attaches to the shared gateway.
apiVersion: kustomize.toolkit.fluxcd.io/v1
