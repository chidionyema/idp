  # THE DEPLOYMENT IS CALLED `operator`, NOT `tailscale-operator`. Measured 2026-09-13 by
  # rendering the chart from git (`bin/idp-compile-helm`, 33/33 releases): the release is named
  # tailscale-operator and the chart it pins (1.102.3) emits `Deployment/operator` in the
  # tailscale namespace. Nothing ever created a Deployment by the other name, so this health
  # check could not pass, and the row sat HealthCheckFailed for days:
  #
  #   health check failed after 10m0.026651003s: timeout waiting for:
  #     [Deployment/tailscale/tailscale-operator status: 'NotFound']
  #
  # `NotFound` is the tell: a health check on an object that is merely unhealthy reports its
  # status, and one on an object that does not exist reports NotFound forever. guacamole and
  # the four objects behind it were held out of the cluster by this line the whole time.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: operator
      namespace: tailscale
  postBuild:
    substituteFrom:
