---
# The tailnet: Otto's mac-run hands reach the founder's Mac over it (platform/hermes-agent/mac-run.tpl).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/tailscale
  prune: true
  dependsOn:
    - name: secret-store
  timeout: 2m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: operator
      namespace: tailscale
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
# The estate bus (NATS JetStream). otto-gateway publishes every inbound message to otto.ingress on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: event-bus
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/event-bus
  prune: true
  dependsOn:
    - name: priority-classes
  wait: true
  timeout: 2m
---
# Otto's door. Since 2026-09-05 the one TELEGRAM_BOT_TOKEN for @Ottototbot is held here and nowhere
# else (platform/hermes-agent/gateway.yaml header); hermes-agent is reached from it over a2a :9900.
# Without this row Otto has no way to hear the founder at all.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otto-gateway
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/otto-gateway
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
      - kind: Secret
        name: github-app
  dependsOn:
    - name: secret-store
    - name: edge
    - name: event-bus
    - name: github-app-creds
    - name: priority-classes
    - name: estate-db
  timeout: 2m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: otto-gateway
      namespace: otto-gateway
---
# Oracle re-installs its flannel add-on with --ip-masq on node work requests, and the
# FLANNEL-POSTRTG chain SNATs every cross-node Calico pod packet (outages 2026-09-08, 09-26, 09-28).
# This row re-asserts the flag-free DaemonSet every reconcile. prune: false -- dropping this row
# must never delete the node network. Stopgap until Calico goes policy-only on flannel IPAM.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flannel
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/flannel
  prune: false
  wait: true
  timeout: 5m
---
# The workflow engine (crew#396). sovereign/engine runs on it: sessions, shadow branches, undo and
# checkpoints, interventions, budget tiers, the consensus vote. Restored 2026-09-29 (founder: "we
# need temporal obviously") after c96359f4 dropped the row; KINI's jobs are removed (founder: "we
# dont need kini"). Requests: frontend/history/matching/worker 20m each, worker pod 50m.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: edge
    - name: secret-store
    - name: estate-db-migrate
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/temporal
  prune: true
  timeout: 20m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal
      namespace: temporal
---
# image-reflector + image-automation: every ImageRepository/ImagePolicy in
# platform/image-automation, and the one ImageUpdateAutomation ("backstage", path: ./) that walks
# the whole checkout for $imagepolicy markers. c96359f4 (2026-09-26) deleted this row; the objects
# it owns survived with a stale kustomize.toolkit.fluxcd.io/name=image-automation label, so nothing
# applied the new pairs added since -- including voice-router, which is why
# ghcr.io/chidionyema/voice-router sat on its 2026-09-27 build while the director's
# subscribeRetry/ensureNewsStream fix (86461f31b, 2026-09-30) stayed unbuilt in the cluster
# (voice-router-director CrashLoopBackOff: nats: no stream matches subject estate.agent.>).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  dependsOn:
    - name: secret-store
    # crew#539: the namespace, not the portal. Role/RoleBinding/ServiceAccount ghcr-pull-reader
    # land in namespace backstage and need it to exist; this row must never wait on
    # Deployment/catalogue being healthy (crew#488).
    - name: backstage-namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/image-automation
  prune: true
  timeout: 2m
  healthChecks:
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      name: backstage
      namespace: flux-system
---
# The front door (ADR 0007). c96359f4 (2026-09-26, "~80 flux rows down to 7") dropped this row and
# it was not among the ones the two "restore the rows c96359f4 dropped" commits put back; its shape
# is restored from that commit's parent, not invented. It is the same defect as the image-automation
# row above: the objects it owns kept their `kustomize.toolkit.fluxcd.io/name=identity` label, so
# `kubectl get kustomizations` reads complete while nothing reconciles the front door. Measured
# 2026-10-11: no Kustomization named identity existed anywhere, no Kustomization's inventory held
# HelmRelease/identity/oauth2-proxy (ns-fences owns only the namespace's quota and netpols), and the
# release sat frozen at its 2026-09-29 revision (generation 7 = observedGeneration 7, driftDetection
# absent). The cost was not theory: the CSRF fix for the founder's 403 at auth.mumchimp.com landed
# on main (#5780) and could not reach a pod, and phase 1's 720h cookie never went live either -- the
# running args still read `--cookie-expire=12h` with no --cookie-csrf-per-request. The invisible
# case is tracked in #5782; this row removes one instance of it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/identity
  prune: true
  dependsOn:
    - name: edge
    - name: secret-store
  timeout: 2m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: oauth2-proxy
      namespace: identity
  postBuild:
    substituteFrom:
      # ESTATE_ZONE (idp#140): the zone is one value in clusters/oke/estate-config.yaml; not
      # optional, a missing ConfigMap must fail the row rather than publish '${ESTATE_ZONE}'.
      - kind: ConfigMap
        name: estate-config
---
# The universal coverage layer (EFDA). The registry, the diagnostic artifacts,
# the pack factory and the allowlisted executor.
#
# This row declares NO dependsOn on purpose. The coverage layer is the thing
# that tells the estate what is uncovered, so it must not inherit another
# row's redness: the `llm` row was red for weeks (the ollama PVC is
# immutable once bound, idp#7205) and a coverage gate that stops reconciling
# when the model router wobbles is a gate nobody can trust. Everything this
# row owns is static manifest plus one image it rolls itself.
#
# wait: false, because the controller is a reconciler that is never "ready" in
# the sense Flux means -- it is ready when it has published a CoverageReport.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: efda
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/efda
  prune: true
  wait: false
  timeout: 2m
