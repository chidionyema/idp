      - kind: ConfigMap
        name: estate-config
      - kind: Secret
        name: github-app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-agent
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/hermes-agent
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
      - kind: Secret
        name: github-app
  dependsOn:
    - name: secret-store
    - name: github-app-creds
    - name: priority-classes
    - name: llm
  timeout: 2m
