---
# crew#584 CP-H: the staging area. A namespace with a ceiling, on every profile (lean too); the
# dev-loop label on it is what lets a laptop's mirrord agent in (platform/edge/dev-loop-policy.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
