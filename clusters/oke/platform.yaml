# crew#839: every namespace's request defaults and its ceiling, generated in one pass by
# bin/idp-ns-fence-gen from platform/ns-fences/allowances.yaml. A LimitRange lands beside every
# quota in the same file, because a quota that counts requests.cpu refuses every pod that declares
# none -- a fence that refuses correct work is an outage. Sized from what each namespace actually
# asked for on 2026-09-04 (platform/ns-fences/measured.json), not from a guess.
# The matching NetworkPolicies are generated into platform/ns-fences/network/ and are applied by
# this same row: the kustomization one directory up lists `network` as a resource. They were held
# back while flannel was the datapath and read no policy object; the calico row below has been live
# since crew#839, so holding them back only left every namespace unfenced with its policy sitting
# in git. This comment said "this cluster runs flannel" until 2026-09-05, twenty lines above the
# calico row that says the opposite -- a session read the stale half and told the founder nothing
# enforced policy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ns-fences
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/ns-fences
  prune: true
  wait: true
  timeout: 2m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
# The estate's network policy enforcement layer (crew#839). This row converges ./platform/calico
# onto the Road B (founder-approved, 2026-09-06) plain non-operator calico-node migration
# (calico-node in kube-system, DATASTORE_TYPE=kubernetes, no typha, no tiers), replacing the
# tigera-operator route that wedged this cluster (operator auto-enabled typha + a policy/tsu tiers
# stack that is waste on a 2-node estate and cannot reach Ready, and there is no supported
# operator switch to zero typha; plus the phantom `.218` underlay on node .221).
#
# This row is UNSUSPENDED so Flux converges ./platform/calico, which now lists only `raw/` (see
# platform/calico/kustomization.yaml). The operator deck files (crds/, calico.yaml) are kept for
# history but no longer converged, so Flux drives raw calico-node.
#
# !!! LANDING ORDER (read before reconciling / relying on this row being live): the operator's
# calico-node and raw calico-node cannot BOTH write crd.projectcalico.org ippools/felix config;
# that split-brain is what wedged the cluster. `bin/idp-oke-break-glass tigera-reset` must run
# FIRST and prove a clean flannel-only datapath (its Guard 2 requires this row suspended, which
# it was up to this change). Only after the teardown is proven may this converge drive raw. The
# flannel add-on stays untouched until ns-fence-gate --live returns a clean line after raw Calico
# is up; nothing is disabled until then.
#
# Earlier history, preserved: Before calico, nothing in this cluster enforced NetworkPolicy; the
# CNI was flannel, which routes pods and does not read policy objects. Oracle refuses the
# policy-only-beside-flannel arrangement in writing. The installation-ordering deadlock that
# motivated operator-first (tigera-operator is an ordinary pod and cannot start with no CNI):
# Road B's flannel->calico migration does the reverse (calico under flannel, then a rolling node
# swap), tigera-reset is the rollback receipt.
#
# `wait: false` kept: the health of this row is the cluster's own network, and bin/ns-fence-gate
# --live is the receipt -- it refuses to report a pass while no CNI enforces policy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calico
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/calico
  suspend: false
  prune: false
  wait: false
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rbac-floor
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/rbac-floor
  prune: true
  wait: true
  timeout: 2m
---
# The JIT token broker (WJ.1-WJ.15). This is the only workload in the estate that can mint write
# access on a cluster where -- from the row above this one -- agents hold none. It is reconciled
# after rbac-floor deliberately: agent-reader is the floor that makes this broker the only ceiling, and
# a broker standing up before that floor exists would be a second way to write, not the only one.
#
# `wait: true` on purpose. A broker that is half-applied is a broker whose fence may be up while
# its killswitch volume is not, and the next row should not build on that.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jit
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: rbac-floor
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/jit
  prune: true
  wait: true
  timeout: 2m
  # public-door.yaml routes `otto.${ESTATE_ZONE}`, and the zone is one value in
  # clusters/*/estate-config.yaml (R46) that only Flux's variable substitution can fill in. This
  # row declared none, so Flux handed the API the literal and the API refused it:
  #
  #   HTTPRoute/jit/jit-broker dry-run failed (Invalid): spec.hostnames[0]:
  #   Invalid value: "otto.${ESTATE_ZONE}"
  #
  # A Kustomization whose dry-run fails applies nothing, so the broker's whole deck stopped at
  # #2487 -- lastAppliedRevision stuck on 8e326927 and `get httproute -n jit` empty for three
  # weeks. The public door has never once been up. Same block the `platform` row carries.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  patches:
    # pinned to live 2026-09-26: git says 1, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: jit, name: jit-broker }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
---
# NodeSoftwareOperator (crew#892 CP4 next phase, goal b9217bea option c):
# the controller that owns every node-level software install on the estate
# (runsc, kata, nvidia, ...), gated by the RuntimeInstall CRD
# (platform/nodesoftware-operator/crds/runtimeinstall.yaml) and the offline
# gate (bin/nodesoftware-operator-gate). The CRD lands in the same row as the
# controller so the API exists before any reconcile attempt. The lockdown
# (flux-only-writes.yaml) blocks every ocid1.user.* principal; this row runs as
# system:serviceaccount, so it passes through unchanged.
#
# Depends on:
#   - scheduling  the PriorityClass (idp-infrastructure) the controller mounts
#   - secret-store the ghcr-pull image pull secret (every image-automation flow)
#   - image-automation the ClusterSecretStore that backs ghcr-pull
#   - edge the Kyverno policies that gate every Pod (PSS restricted), so the
#     controller's own PodSecurityContext above is enforced at admission
#   - rbac-identity the platform RBAC row that namespaces ClusterRoleBindings
#     (the operator's RBAC is cluster-scoped, so it lands as its own row,
#     never nested in another)
#
# suspend: false means Flux converges the controller as soon as the merged
# image exists in ghcr. Until the controller source lands (next commit on
# this branch), the row will fail healthChecks because the image does not
# exist; this is the safety net. The empirical-proof commit (operator
# reconciles a RuntimeInstall on a canary node and writes status.rolloutHistory)
# is the one that flips the row green in the cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nodesoftware-operator
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/nodesoftware-operator
  prune: true
  dependsOn:
    - name: image-automation
    - name: rbac-identity
    - name: scheduling
    - name: secret-store
    - name: edge
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  # Historical note (kept from the broken mechanism removed on 2026-09-08 by PR #2416):
  # this row previously read `substituteFrom: {kind: Secret, name: ghcr-pull}` for a
  # stated `IMAGE_TAG` field. ghcr-pull is a kubernetes.io/dockerconfigjson Secret whose
  # one key is `.dockerconfigjson`; Flux loads every key of a substituteFrom source as a
  # variable name, `.dockerconfigjson` is not a legal one, and the whole post-build aborted
  # before applying anything. That substituteFrom is gone; the image is now pinned via Flux
  # image automation and a `$imagepolicy` marker in kustomization.yaml (cyrus, hermes-agent
  # and ten more already use it). A pull secret is referenced by name in a pod spec, never
  # substituted as text.
  timeout: 2m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: nodesoftware-operator
      namespace: nodesoftware-operator
  patches:
    # pinned to live 2026-09-26: git says 2, live is 0. Delete this patch to switch it on.
    - target: { kind: Deployment, namespace: nodesoftware-operator, name: nodesoftware-operator }
      patch: '[{"op":"add","path":"/spec/replicas","value":0}]'
---
# crew#846: the fourth question estate-security-scan asks (platform/trivy) -- container image and
# cluster vulnerability scanning, which the estate ran nowhere before this row.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/trivy
  prune: true
  timeout: 2m
