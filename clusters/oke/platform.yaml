# scheduling only, never on observability (founder 2026-09-03, blueprint phase 1: the 20-minute
# observability timeout held the autoscaler back). The product opts in from its own repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: scheduling
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/keda
  prune: true
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda
      namespace: keda
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda-add-ons-http
      namespace: keda
---
