# The concierge's namespace row. It exists before the workload because the Twilio Auth Token
# rides the human door: platform/vendors/consoles.yaml declares `twilio` with
# store_default: human-vault, and the ExternalSecret bin/idp-vendor-render generates for it names
# namespace `concierge`. Without this namespace that row has nowhere to land and the token never
# arrives, which was the whole gap between "the credential is in Bitwarden" and "the product can
# verify a Twilio request".
#
# Nothing runs here. The concierge itself is Mac-hosted -- mums-concierge/docs/DEPLOYMENT.md pins
# Homebrew, a Python 3.12 venv, ffmpeg, Chromium and torch 2.2.2 / speechbrain 0.5.15 in a fixed
# order, and the browser operator needs her own Chrome profile on her own machine. After
# secret-store, because the row's purpose is to receive a secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: concierge
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/concierge
  prune: true
  # postBuild.substituteFrom is REQUIRED here and its absence is what held this row on its first
  # apply: platform/concierge/network.yaml carries ${ESTATE_APISERVER_CIDR}, the same variable
  # every generated fence under platform/ns-fences/network/ carries. A Kustomization without this
  # does not substitute, so the literal string reached the API and the whole apply failed
  # (`NetworkPolicy ... ipBlock.cidr: Invalid value: "${ESTATE_APISERVER_CIDR}"`), leaving the
  # Namespace created and the fence and the ExternalSecret unapplied. Every row that uses an
  # estate variable carries this block; this one now does too.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
        optional: false
  dependsOn:
    - name: secret-store
  timeout: 2m
---
# Notifications row (R75 founder spec 2026-08-29): Apprise API, the single fan-out engine. Publish
