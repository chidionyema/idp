# Otto (@Ottototbot, platform/hermes-agent) and Otto numun (@numun_bot, platform/otto-golden),
# and every layer either one thinks, remembers or acts through.
#
# c96359f4 (2026-09-26, "~80 flux rows down to 7") deleted this file. The root Kustomization prunes,
# so both Ottos, the model router they think through (llm), their memory (hindsight), their estate
# tools (mcp) and the PriorityClass their pods name were removed from the cluster with it. Measured
# 2026-09-28: estate-state 36466538268 "founder-otto -> hermes-agent: a kustomization the cluster
# does not hold", router-lanes "0 ok, 32 FAIL", and https://otto.mumchimp.com/readyz -> 404 at the
# edge, so Telegram had no door to either bot.
#
# Every row is idp.estate.io/runtime: always-on, so bin/idp-always-on-guard refuses any push that
# drops one again. dependsOn names only rows that exist on main or in this file: `scheduling`
# (Kyverno admission policies, not something either Otto needs) and `edge`'s old priority-classes
# edge are not restored here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: priority-classes
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/priority-classes
  # A PriorityClass a running pod names must never be pruned out from under it: the API server
  # refuses every new pod that names a missing class.
  prune: false
  wait: true
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: github-app-creds
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/github-app-creds
  prune: true
  wait: false
  timeout: 2m
---
# The per-application Postgres roles (estate-db-role-litellm, -hindsight) live here. The copy Jobs
# beside them are guarded by a marker table and exit clean when the old server is gone, so a
# re-apply does nothing (platform/estate-db/migrate/jobs.yaml header).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: estate-db-migrate
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  dependsOn:
    - name: estate-db
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/estate-db/migrate
  prune: true
  wait: false
  timeout: 20m
---
# 564790aff added this row and platform/local-path (2026-10-01 13:58Z); f11d5c3e0 (#5255, a /fleet
# feature squashed from a branch cut before it) deleted both seven hours later. The StorageClass
# outlived the provisioner, so a claim on it would wait forever. Measured 2026-10-14: block-storage
# total-storage-gb used 900 of 200, and agent-workforce-data refused 238 times in 14 h with
# LimitExceeded.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/local-path
  prune: true
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/llm
  prune: true
  dependsOn:
    - name: estate-db-migrate
    - name: secret-store
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  timeout: 2m
---
# MEASURED 2026-10-11: this row was declared until c96359f4b dropped ~80 rows down to 7, and the
# restore commits d73db7199/c920a0f32 brought most of them back but not this one -- so
# platform/router-events has sat in the tree with a complete kustomization, an ImagePolicy
# (flux-system/router-events, platform/image-automation/router-events.yaml) and a Dockerfile, and
# nothing reconciling it. The CronJob it once laid is still in the cluster, labelled
# kustomize.toolkit.fluxcd.io/name: router-events, owned by a Kustomization that no longer exists
# -- an orphan no PR can ever update. It kept running the pre-removal script, so the #5767 fix
# could not reach it: the backup of the routing table stays broken while every gate is green.
# The file in git is the one copy that survives losing a volume, which is the whole point of this
# CronJob; a backup nothing reconciles is not a backup.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: router-events
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  # secret-store carries the github-app Secret the backup Job mounts; estate-db-migrate is the
  # row that has the estate-db server up with its roles, and the Job reads the lanes from it.
  dependsOn:
    - name: secret-store
    - name: estate-db-migrate
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/router-events
  prune: true
  # ESTATE_GITHUB_REPO, which backup.yaml puts in the Job's env as GITHUB_REPO=${ESTATE_GITHUB_REPO}.
  # MEASURED 2026-10-11 on router-backup-proof-8trj6: without this the substitution never happens,
  # the env var reaches the pod as the literal string '${ESTATE_GITHUB_REPO}', REPO becomes that,
  # and every GitHub API URL 404s -- the same 404 that looked like a bad branch name. The value
  # itself is in clusters/oke/estate-config.yaml (chidionyema/idp), which is why this row must
  # name estate-config the way the llm row above does.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hindsight
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  dependsOn:
    - name: secret-store
    - name: llm
    - name: estate-db-migrate
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/hindsight
  prune: true
  timeout: 2m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: hindsight
      namespace: hindsight
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/mcp
  prune: true
  dependsOn:
    - name: edge
    - name: secret-store
