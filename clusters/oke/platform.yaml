---
# crew#539 DoD item 1: the one Prometheus + Alertmanager, the founder-surface probe and the
# estate's rules (platform/monitoring). Pages go to Telegram from the flux-telegram vault entry
# and, for warnings, to Robusta (CP14). ESTATE_ZONE substitutes into the Probe targets.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: edge
    - name: secret-store
    # crew#573, measured 2026-08-28T12:44Z (oke-check 33172282641). `- name: robusta` was here and
    # it cost the estate every alert it has. robusta's HelmRelease went `Failed`, so this row never
    # became Ready, so `monitoring-rules` and `chaos` never did either — 4 of the 6 not-Ready Flux
    # objects — and `grep -c kps- ` over that run's full pod dump is 0: no Prometheus, no
    # Alertmanager, no kube-state-metrics in the cluster at all. `KubePodCrashLooping` and
    # `KubePodNotReady` are declared here (`defaultRules.create: true`, `kubernetesApps` not
    # disabled) and have never once fired, which is why hindsight-api crash-looped 13h at 0/1 ready
    # with nothing red anywhere (crew#573).
    #
    # The dependency bought nothing even when robusta was healthy. alertmanager-config.yaml routes
    # `receiver: telegram` by default and sends warnings to robusta on a second route carrying
    # `continue: true` — a copy, not the delivery path. A webhook receiver whose service is absent
    # makes Alertmanager retry that one notification; it does not stop Alertmanager starting and it
    # does not stop the telegram receiver. So robusta is a consumer of this row, never a
    # prerequisite for it, and the reverse edge is not added here either: robusta watches the API
    # server directly and needs nothing from Prometheus to do it.
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/monitoring
  prune: true
  wait: true
  timeout: 20m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: blackbox
      namespace: monitoring
---
# crew#539 DoD 1, second half: the estate's PrometheusRules and the founder-surface Probe are
# monitoring.coreos.com CRs, so they apply after the chart row lands its CRDs (incident
# 2026-08-25: a chart and its own CRs in one row never reconcile).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-rules
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/monitoring/rules
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
# The hourly drills on the estate's clock (crew#554). GitHub fired its hourly schedules 1-3 times a
# day account-wide (measured 2026-08-28); this CronJob dispatches them as the GitHub App every
# hour. After secret-store (the App Secret is an ExternalSecret) and alerts-github (which owns it).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: drills
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/drills
  prune: true
  # crew#488 CP5: alerts-github owns the App Secret and itself waits on secret-store; naming
  # secret-store here twice over made this row read as a vault casualty on a cluster with none.
  dependsOn:
    - name: alerts-github
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
# crew#516 CP5, founder's locked spec (crew#66 5451926212, Phase 1): the Tailscale Kubernetes
# operator, authenticated by the one OAuth client vault-seed.yml seeds (secret-store). Two designs
# were tried and rejected before this one (5451614620/5451623095: a hand-pasted reusable auth key;
# 5451900443 point 1: an interactive login URL) -- history left in git history, not repeated here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale
  namespace: flux-system
