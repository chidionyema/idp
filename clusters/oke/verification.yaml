# Verification wall (crew#631 CP2). The objects under platform/verification are probes that must be
# REFUSED by the identity that asks: an ExternalSecret for the verdict signing key, read as a pod.
# This row therefore never waits and carries no health check -- a probe that stays not-Ready is the
# row doing its job, and a wait here would hold the row red forever (the backstage row is
# `wait: true`, which is why the probe does not live in that overlay). The grade lives in the
# readers: bin/idp-verdict key-wall on every prover run, and the cluster-state collector, which
# inverts the Ready condition for anything annotated estate/expect-ready: "false".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: verification
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/verification
  prune: true
  wait: false
  timeout: 10m
  # external-secrets brings the CRD, secret-store the ClusterSecretStore the probe asks through,
  # backstage-namespace the namespace the probe sits in beside its control (backstage-env).
  dependsOn:
    - name: backstage-namespace
    - name: external-secrets
    - name: secret-store
