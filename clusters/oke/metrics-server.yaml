# The metrics-server row (crew#539, #164). c96359f4b ("~80 flux rows down to 7") deleted it with
# platform.yaml's old copy, so nothing applied platform/metrics-server: the Deployment sat at an
# out-of-band replicas: 0 for 55 days and the v1beta1.metrics.k8s.io APIService had no endpoints.
# Requests (50m CPU, 100Mi) are in the HelmRelease values.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
  annotations:
    idp.estate.io/runtime: always-on
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/metrics-server
  prune: true
  dependsOn:
    - name: priority-classes
  timeout: 2m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: metrics-server
      namespace: metrics-server
