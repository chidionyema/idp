# crew#488 CP5: the policy engine before the policies. platform/edge and platform/scheduling carry
# ClusterPolicies; Flux dry-runs them against the CRD this chart installs, so they wait on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/kyverno
  prune: true
  timeout: 2m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno

---
