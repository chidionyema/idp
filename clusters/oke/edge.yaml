# Edge row. Gateway API CRDs come from the upstream release tag (the experimental channel:
# Traefik's provider lists TLSRoute and TCPRoute and never accepts the GatewayClass without them), then the three platform charts,
# then prospector's own manifests from its repo. Each step waits for the one before it.
# external-dns is a leaf (Kustomization dns, below): nothing waits on it, because it cannot be
# Ready until the Cloudflare token exists, and the shop must not be held behind DNS.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.5.1
  ignore: |
    /*
    !/config/crd/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/experimental
  prune: false
  wait: true
---
# crew#488 CP5: the policy engine before the policies. platform/edge and platform/scheduling carry
# ClusterPolicies; Flux dry-runs them against the CRD this chart installs, so they wait on it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/kyverno
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: gateway-api-crds
    - name: kyverno
    - name: priority-classes
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/edge
  prune: true
  wait: true
  timeout: 10m
  # flux-only-writes.yaml names its two excused identities as ${ESTATE_BREAK_GLASS_USER} and
  # ${ESTATE_FOUNDER_USER}. Without this block Flux applied the literal text (measured on the
  # live ClusterPolicy 2026-09-06 21:10Z), so neither exception ever matched a real principal and
  # the founder was refused on his own cluster. Not optional: a missing ConfigMap must fail the
  # row rather than publish a placeholder.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  # The only place OKE's load balancer is named (R36): platform/edge stays provider-free.
  patches:
    - target: {kind: HelmRelease, name: traefik, namespace: edge}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: { name: traefik, namespace: edge }
        spec:
          values:
            service:
              annotations:
                oci.oraclecloud.com/load-balancer-type: lb
                service.beta.kubernetes.io/oci-load-balancer-shape: flexible
                service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
                service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prospector-platform
  namespace: flux-system
spec:
  interval: 10m
  # crew#488 CP5: an admission webhook that is still booting (ESO 'ca cert not yet ready') fails the
  # first apply; without this the next try is the 10m interval and a fresh cluster reads red for it.
  retryInterval: 1m
  dependsOn:
    - name: edge
    # Three ExternalSecrets (cloudflare-api-token, prospector-engine-env, prospector-store-api-env)
    # are in this row and dry-ran before the ESO CRDs existed on an empty cluster (crew#488).
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/prospector
  prune: true
  wait: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: prospector
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/chidionyema/prospector
  ref:
    branch: main
  ignore: |
    /*
    !/deploy/k8s/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prospector
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: prospector-platform
  sourceRef:
    kind: GitRepository
    name: prospector
  path: ./deploy/k8s/overlays/oke
  prune: true
  wait: true
  timeout: 10m
  # Which build runs is decided here, not in prospector's overlay (crew#693): the markers below are
  # written by the image-automation-controller from platform/image-automation/prospector.yaml, and
  # this override is applied after kustomize renders the overlay, so the hand-pinned tags there are
  # inert. A merge to prospector main becomes a pull request here and a RollingUpdate on merge.
  #
  # THE SEED IS A DEPLOY. This override wins over the overlay the moment it merges, before the
  # automation has written anything, so whatever is typed here is what production runs for the
  # next few minutes. The first draft of this file carried 99cdc96a, the 25 August build: merging
  # it would have rolled the shop BACK off the storefront the founder released by hand at
  # 2026-08-30T17:01:51Z (prospector#792, merge commit 7489661f). The seed is therefore the newest
  # tag the policy itself would pick, and a test pins that it always is.
  #
  # Moved main-73 -> main-85 by hand on 2026-08-30. The controller cannot do it: it pushes to
  # flux/image-updates and .github/workflows/image-update-pr.yml then calls `gh pr merge --auto`,
  # which the repository refuses -- `allow_auto_merge` is false, so every run since 20:45Z ends
  # `GraphQL: Auto merge is not allowed for this repository (enablePullRequestAutoMerge)` (run
  # 33336842115). Meanwhile prospector#793 built main-85-0299e2c4 at 2026-08-30T21:01:04Z and
  # mumchimp.com kept serving main-73: every /pack/<id>.jpg returned 404 an hour later. Both
  # images carry main-85 in ghcr, listed 2026-08-30T22:0xZ.
  images:
    - name: ghcr.io/chidionyema/prospector-store-web
      newTag: main-140-50d66491b9847509d9a90e04d30cc73dac0c27e6 # {"$imagepolicy": "flux-system:prospector-store-web:tag"}
    - name: ghcr.io/chidionyema/prospector-store-api
      newTag: main-140-50d66491b9847509d9a90e04d30cc73dac0c27e6 # {"$imagepolicy": "flux-system:prospector-store-api:tag"}
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: prospector-store-api
      namespace: prospector
    - apiVersion: apps/v1
      kind: Deployment
      name: prospector-store-web
      namespace: prospector
  postBuild:
    substituteFrom:
      # The Gateway's catalogue and auth listeners name the zone as ${ESTATE_ZONE} (prospector#734).
      - kind: ConfigMap
        name: estate-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns
  namespace: flux-system
spec:
  interval: 10m
  # crew#488 CP5: an admission webhook that is still booting (ESO 'ca cert not yet ready') fails the
  # first apply; without this the next try is the 10m interval and a fresh cluster reads red for it.
  retryInterval: 1m
  dependsOn:
    - name: edge
    # founder 2026-09-03 (blueprint phase 1): the cloudflare-api-token ExternalSecret rides in this row
    # now, so dns waits on the secret store and never on the product row (crew#488 CP5 had it wait on
    # prospector-platform, which held the secret then).
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/dns
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
---
# The Flux webhook receiver: GitHub POSTs a push event to hc.${ESTATE_ZONE}/hook/<id>, the
# notification-controller verifies the HMAC-SHA256 signature against the token this row's
# ExternalSecret pulls from Vault, and the flux-system GitRepository reconciles at once instead
# of waiting out its 1m poll. It rides here, and not in clusters/oke/flux-system, because the
# route names the zone as ${ESTATE_ZONE}: only a Flux Kustomization with postBuild substitutes
# that, and the flux-system build has none -- wired there, the Gateway would be handed the
# literal string "hc.${ESTATE_ZONE}" as a hostname and no push would ever land.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  dependsOn:
    # the HTTPRoute has nothing to attach to until the Gateway exists,
    - name: edge
    # and the ExternalSecret has nowhere to read flux-webhook-token from until the store does.
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/flux-webhook
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
