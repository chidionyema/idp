# Edge row. Gateway API CRDs come from the upstream release tag (the experimental channel:
# Traefik's provider lists TLSRoute and TCPRoute and never accepts the GatewayClass without them), then the three platform charts,
# then prospector's own manifests from its repo. Each step waits for the one before it.
# external-dns is a leaf (Kustomization dns, below): nothing waits on it, because it cannot be
# Ready until the Cloudflare token exists, and the shop must not be held behind DNS.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.5.1
  ignore: |
    /*
    !/config/crd/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/experimental
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/edge
  prune: true
  wait: true
  timeout: 10m
  # The only place OKE's load balancer is named (R36): platform/edge stays provider-free.
  patches:
    - target: { kind: HelmRelease, name: traefik, namespace: edge }
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: { name: traefik, namespace: edge }
        spec:
          values:
            service:
              annotations:
                oci.oraclecloud.com/load-balancer-type: lb
                service.beta.kubernetes.io/oci-load-balancer-shape: flexible
                service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
                service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prospector-platform
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/prospector
  prune: true
  wait: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: prospector
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/chidionyema/prospector
  ref:
    branch: main
  ignore: |
    /*
    !/deploy/k8s/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prospector
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: prospector-platform
  sourceRef:
    kind: GitRepository
    name: prospector
  path: ./deploy/k8s/overlays/oke
  prune: true
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: prospector-store-api
      namespace: prospector
    - apiVersion: apps/v1
      kind: Deployment
      name: prospector-store-web
      namespace: prospector
  postBuild:
    substituteFrom:
      # The Gateway's catalogue and auth listeners name the zone as ${ESTATE_ZONE} (prospector#734).
      - kind: ConfigMap
        name: estate-config

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dns
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/dns
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
