# crew#974 P1, the newsroom director, a new owner, so prune: true.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: voice-router
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/voice-router/deploy
  prune: true
  wait: true
  timeout: 5m
