apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
# Founder, 2026-08-28: "ur drowning my telegram channel with repeated". Measured: the Flux Alert
# broken-workload (platform/alerts/alert.yaml) re-sent HealthCheckFailed for the same two stalled
# kustomizations every reconcile (~10 min) for hours, while the state had not changed and the one
# hand that changes it was already pinned in the channel. notification-controller's own
# rate-limit-interval (default 5m, flux docs: "Interval in which rate limit has effect") dedups an
# identical event; one hour is the estate's repeat rate for an unchanged failure. Same as
# alertmanager-config.yaml's repeat_interval: 4h in spirit; 1h keeps a page per hour per fault.
- target:
    kind: Deployment
    name: notification-controller
    namespace: flux-system
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --rate-limit-interval=1h

# The edge Gateway (prospector-edge) admits an HTTPRoute only from a namespace carrying this
# label, and platform/flux-webhook puts a route in flux-system. The namespace is created by
# gotk-components, which this build owns, so the label is patched on here rather than in the
# platform directory the route lives in.
- target:
    kind: Namespace
    name: flux-system
  patch: |
    - op: add
      path: /metadata/labels/idp.estate~1edge-attach
      value: "true"

# A restart of kustomize-controller, driven from git. Founder, 2026-09-04: "If the
# kustomize-controller itself is deadlocked and needs a restart, the GitOps way is to touch its
# manifest in your repository." Changing this timestamp changes the pod template hash, so the
# Deployment rolls its pod the next time Flux applies this directory. Nothing else about the
# controller changes. To restart it again, set a new timestamp and merge.
- target:
    kind: Deployment
    name: kustomize-controller
    namespace: flux-system
  patch: |
    - op: add
      path: /spec/template/metadata/annotations/estate.mumchimp.com~1restarted-at
      value: "2026-09-04T10:22:11Z"

# Incident 2026-09-08: Flux deadlocked estate-wide, 0 of 80 Kustomizations Ready, every one failing
# `dial tcp 10.96.202.29:80: i/o timeout` fetching its artifact. Measured: kustomize-controller was
# scheduled on 10.0.159.197 and source-controller on 10.0.148.221, and cross-node ClusterIP routing
# was broken while two CNIs (kube-flannel-ds and Calico) both held 10.244.0.0/16. helm-controller,
# which shares source-controller's node, kept fetching the same artifacts from the same address
# throughout -- 31 of 32 HelmReleases Ready. Same service, same port, only the node differed.
#
# The trap is that the repair for cluster networking is itself a manifest, so a Flux that cannot
# fetch cannot apply the fix for the reason it cannot fetch. The control plane must not depend on
# the overlay it is responsible for repairing. kustomize-controller reads every artifact over
# source-controller's ClusterIP, so pinning the two to one node takes that hop off the node
# boundary and out of the deadlock. Required, not preferred: a preference would schedule it
# anywhere under pressure and reopen the trap on the day it matters.
- target:
    kind: Deployment
    name: kustomize-controller
    namespace: flux-system
  patch: |
    - op: add
      path: /spec/template/spec/affinity
      value:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: source-controller
              topologyKey: kubernetes.io/hostname
