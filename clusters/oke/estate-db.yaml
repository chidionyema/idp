# The one database platform (restored from clusters/oke/platform.yaml as it stood before c96359f4,
# which cut ~80 rows to 7 and left the estate cluster running with no row reconciling it; a server
# dry run on 2026-09-27 showed the live objects equal to git, so restoring changes nothing but the
# memory layer's role, database and secret). Part 1: the operator and its CRDs. Two rows because
# the cluster below is a custom resource the operator defines, and a Kustomization cannot apply a
# CR whose CRD it is installing in the same pass.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: estate-db-operator
  namespace: flux-system
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/estate-db/operator
  prune: true
  timeout: 2m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: estate-db
---
# Part 2: the cluster, its databases and their roles. Depends on secret-store because every
# password comes from the vault.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: estate-db
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: estate-db-operator
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/estate-db/cluster
  prune: true
  timeout: 2m
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: estate
      namespace: estate-db
---
# Part 2b (idp#7391): the daily dump of the estate database to estate-db-backups. Depends on the
# cluster because the job connects to estate-rw. The receipt is graded by bin/idp-estate-db-backup.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: estate-db-backup
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: estate-db
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/estate-db/backup
  prune: true
  timeout: 2m
---
# Part 3: the catalog's schema, applied to the estate's own Postgres (the record
# itself -- D1: one Postgres, the existing one). Depends on estate-db, because the
# schema lands in that cluster's `estate` database and a Job that starts before
# the cluster is ready fails on connect and is retried into a failed Job.
#
# The health check is the CronJob: Flux waits for it to exist and for its last
# successful run to be recent enough, which is the only honest signal that the
# record's shape has converged on the cluster and not merely in git.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: catalog
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: estate-db
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/catalog
  prune: true
  timeout: 2m
  healthChecks:
    - apiVersion: batch/v1
      kind: CronJob
      name: catalog-schema
      namespace: estate-db
