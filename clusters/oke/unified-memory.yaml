# The estate's memory layer (platform/unified-memory-server). Scale-to-zero, so its runtime is
# on-demand: nothing runs until an agent asks.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: on-demand
  name: unified-memory
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 1m
  dependsOn:
    - name: estate-db
    - name: secret-store
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/unified-memory-server
  prune: true
  wait: false
  timeout: 2m
  postBuild:
    substituteFrom:
      # ESTATE_ZONE (clusters/oke/estate-config.yaml), for the door's hostname. Not optional: a
      # missing ConfigMap fails the row rather than publish '${ESTATE_ZONE}'.
      - kind: ConfigMap
        name: estate-config
