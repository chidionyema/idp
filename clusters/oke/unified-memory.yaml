# The estate's memory layer (platform/unified-memory-server). Scale-to-zero, so its runtime is
# on-demand: nothing runs until an agent asks.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: on-demand
  name: unified-memory
  namespace: flux-system
spec:
  interval: 30s
  retryInterval: 1m
  dependsOn:
    - name: estate-db
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/unified-memory-server
  prune: true
  wait: false
  timeout: 2m
