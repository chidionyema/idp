# crew#267: catalogue image automation. Flux's git writer is the deploy key in flux-writer.yaml; the GitHub App ExternalSecret (github-app) lives in platform/alerts-github with its only consumer, the githubdispatch Provider, so llm, identity and the Telegram alerts never wait on it (crew#284, crew#406). After backstage
# (the Deployment it rolls). The two image controllers come from flux-system/gotk-components.yaml
# (flux install --components-extra=image-reflector-controller,image-automation-controller).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/image-automation
  prune: true
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      name: backstage
      namespace: flux-system
