# The JIT broker: the founder's approval door (crew#1011 CP1). An agent asks, the founder approves
# (FleetView by voice + Face ID, or Otto), and the broker performs the act or returns a key that
# dies on its own. c96359f4b ("~80 flux rows down to 7") left platform/jit with no row, so nothing
# reconciled it: measured 2026-10-01, deployment jit/jit-broker at 0/0 while deployment.yaml says
# replicas: 1. A door nobody reconciles is a door that is quietly shut.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    idp.estate.io/runtime: always-on
  name: jit
  namespace: flux-system
spec:
  interval: 30s
  dependsOn:
    - name: secret-store
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/jit
  # platform/jit/public-door.yaml publishes otto.${ESTATE_ZONE} and deployment.yaml sets
  # JIT_AGE_RECIPIENT from ${ESTATE_AGE_RECIPIENT}. Both live in the estate-config ConfigMap, so
  # without this block they reach the API server unsubstituted: measured 2026-10-02, the
  # Kustomization went False on `HTTPRoute/jit/jit-broker dry-run failed (Invalid):
  # spec.hostnames[0] "otto.${ESTATE_ZONE}"` -- the hostname schema rejects a literal `${...}`.
  # Every other row that renders ${ESTATE_ZONE} carries this same substitution (clusters/oke/
  # platform.yaml:92), which is why the broker's own deployment here carries replicas: 1 but the
  # door in front of it could never admit anyone.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: estate-config
  prune: true
  wait: true
  timeout: 5m
