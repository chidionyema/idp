# Example task. A client task is this file plus a JSONL. Spec: docs/specs/2026-09-06-model-forge-edge-runtime.md section 3.
task: example-classify
base: unsloth/Qwen2.5-1.5B-Instruct   # candle 0.6 serves Qwen2 GGUF; Qwen3 when candle does
kind: classify
prompt_template: |
  Classify the sentiment of the movie review sentence as 0 (negative) or 1 (positive).
  Text: {input}
  Verdict:
labels:
  "0": negative
  "1": positive
abstain_below: 0.80      # margin between the top two label probabilities
min_agreement: 0.95       # on answered held-out rows; the floor for shipping
# a model that cannot beat always-answering the commonest label learned nothing
min_lift_over_majority: 0.05
# a label caught less than half the time is a label the model is not useful on
min_recall_per_label: 0.5
max_abstain: 0.20        # of held-out rows; agreement bought by abstaining is refused
kv_cache_prefix: true
schema: null
compute:                  # the only gate on what a task may try (founder 2026-09-06)
  gpu: T4                 # any Modal GPU name; kind, base and size are the task's choice
  timeout_s: 3600
  budget_usd: 1.00        # refused before launch when gpu rate x timeout exceeds it
lora:
  r: 16
  alpha: 32
  epochs: 3
  lr: 2e-4
