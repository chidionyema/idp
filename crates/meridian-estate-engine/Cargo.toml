[workspace]
members = [
    "crates/meridian-karma",
    "crates/meridian-dof",
    "crates/meridian-muster",
    "crates/meridian-flow",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "PROPRIETARY"
publish = false
authors = ["Meridian Intelligence"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
