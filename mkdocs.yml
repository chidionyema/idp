# mkdocs --strict only refuses what is at least a warning. A page in docs/ that
# is missing from nav is `info` by default, so the gate in bin/idp-ci passed
# the orphan fixture (CI run 32801387343: clean rc=0, orphan rc=0). Raise the
# nav checks to warn so strict mode refuses an unreachable page.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
