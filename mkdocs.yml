# TechDocs renders this. Backstage's builder is already configured
# (backstage/app-config.yaml:158) and had nothing to build until this file existed.
site_name: idp — the platform
docs_dir: docs
plugins:
  - techdocs-core
hooks:
  - bin/mkdocs_hooks/incident_register.py   # writes reference/incident-register.yaml from the incident tests (crew#679 CP2)
  - bin/mkdocs_hooks/forge_experiments.py    # copies forge/experiments/*.md to reference/forge/ with an index (crew#885)
# No nav. MkDocs builds it from the docs/ tree, so a page is reachable the moment
# it exists. The hand-written nav that used to sit here was 380 lines naming every
# file by hand, and it broke every time somebody added or deleted a page: this file
# recorded six of those breakages in its own comments between 2026-09-13 and
# 2026-09-17, and a seventh on 2026-09-22 (a section header left behind by the rules
# registry deletion parsed as None and aborted every --strict build). Seven failures
# of one design is the design, not the people. The invariant it policed -- every page
# is reachable in the portal -- now holds by construction.