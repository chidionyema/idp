# The estate's reference decision matrix (ADR 0009). Founder, 2026-08-28, crew#562 5458023873:
# "we need a matrix for decision making — rather than asking these questions it should be auto —
# for all requirements — just reference matrix, because we solve once and forever".
#
# One matrix, fixed here, cited by every requirement. A decision scores each candidate 0–5 on each
# criterion, multiplies by the weight, and BUILDS THE TOP SCORE. The founder is asked only when the
# top two are within tie_band on an irreversible choice. tests/test_incident_crew562_decision_matrix.py
# refuses a matrix whose weights do not sum to 100 and a worked decision that is not its top score.
#
# Scoring rubric per criterion: 0 = fails the estate's bar for it, 3 = meets it, 5 = best in class.
# THE WEIGHTS ARE THE FOUNDER'S INPUT (founder, same thread: "founder has to have input", "all the
# nuances we need to consider"). He sets them once, here; a session never edits a weight without
# his word on the crew issue. Sessions only score candidates against them, in the open, and post
# the result STAGED: with the 60-minute veto window (LAW 49). Status of these weights: PROPOSED
# 2026-08-28, STAGED for the founder's veto on crew#562.
weights:
  first_time_user: 15      # the whole flow for someone who has never seen it: installs, steps, silent failures
  founder_experience: 15   # LAW 20 / R-high-tech-only: every later use — taps, waits, retries
  feature_parity: 10       # "does it have the features?" — the job at the quality asked for, not a worse copy
  ecosystem_fit: 10        # ties into what the founder already owns and signs into: Apple, the tailnet, SSO
  maturity: 15             # LAW 43 / headline: proven platform, maintained, a buyer's engineer knows it
  security_by_default: 15  # LAW 21 / ADR 0007: federated login, no password travels, least privilege
  portability: 10          # LAW 19 / provider-independence: leaves the vendor in a day
  operability: 5           # one platform layer, emits to the collector, drill-able, self-heals
  cost: 5                  # LAW 14: money and the estate's own time
tie_band: 25               # points out of 500; inside it on an irreversible choice, ask; otherwise build the top score

# Worked decisions. Each names the requirement, the candidates, the scores, and the decision the
# estate built. A new decision is a new entry here (one file, solved once), never a new framework.
decisions:
  - slug: founder-screen-access
    requirement: "the founder sees and drives the estate Mac from his phone, first-time user, no chat in the loop (crew#562)"
    date: 2026-08-28
    candidates:
      sunshine-moonlight:
        note: "Sunshine on the Mac, Moonlight on the phone, over the tailnet; portal card takes the pairing PIN"
        scores: {first_time_user: 2, founder_experience: 4, feature_parity: 5, ecosystem_fit: 3, maturity: 4, security_by_default: 4, portability: 5, operability: 4, cost: 5}
      guacamole-vnc:
        note: "Apache Guacamole in OKE, VNC to the Mac, browser only"
        scores: {first_time_user: 4, founder_experience: 3, feature_parity: 1, ecosystem_fit: 2, maturity: 4, security_by_default: 4, portability: 5, operability: 3, cost: 4}
      apple-screen-sharing:
        note: "Apple's own Screen Sharing over the tailnet; Mac-to-Mac only, no iPhone client exists"
        scores: {first_time_user: 3, founder_experience: 2, feature_parity: 3, ecosystem_fit: 5, maturity: 5, security_by_default: 4, portability: 2, operability: 2, cost: 5}
    decision: sunshine-moonlight
    receipt: "https://github.com/chidionyema/crew/issues/562#issuecomment-5458014415"
