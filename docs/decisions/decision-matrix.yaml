        note: "Kill Bill in the cluster: the older, heavier open-source billing platform, with the Kaui admin UI"
        scores:
          first_time_user:     {score: 2, evidence: "https://killbill.io/"}                                     # JVM stack plus plugins; the docs assume an operator
          founder_experience:  {score: 3, evidence: "https://killbill.io/"}                                     # Kaui is an admin console, not a product surface
          feature_parity:      {score: 5, evidence: "https://killbill.io/"}                                     # subscriptions, invoicing, payments, entitlements
