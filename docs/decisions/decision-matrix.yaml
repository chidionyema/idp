          operability:         {score: 2, evidence: "platform/commerce/app/lago.yaml"}                          # a Node service plus workers plus a storefront to keep alive
          cost:                {score: 3, evidence: "https://docs.medusajs.com/"}
    decision: lago-self-hosted   # 410 vs stripe-billing-only 355 vs killbill 340 vs medusa 300; the gap is outside tie_band 25, so the matrix builds the top score
    next_review: 2026-09-05
    reviews: []

