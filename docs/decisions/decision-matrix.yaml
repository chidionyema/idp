          portability:         {score: 5, evidence: "https://github.com/killbill/killbill/blob/master/LICENSE"} # Apache-2.0, self-hosted
          operability:         {score: 2, evidence: "platform/commerce/app/lago.yaml"}                          # a JVM and a plugin runtime to size, patch and drill on a 6 OCPU node
          cost:                {score: 3, evidence: "https://killbill.io/"}                                     # no licence fee; a heavier footprint than Lago for the same job
      medusa:
        note: "Medusa: a commerce engine with carts, products and orders, extended into subscriptions"
