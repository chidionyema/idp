  - slug: merge-queue
    requirement: "green pull requests merge themselves: the queue rebuilds each one on the latest main, reruns the required checks, and lands it — the founder handles only failures, never routine merges (founder order 2026-09-02)"
    date: 2026-09-02
    status: proposed
    next_review: 2026-09-16
    decision: github-merge-queue   # 470 vs mergify 385 vs bors-ng 325; outside tie_band 25. Vendor refuses the merge_queue rule on a user-owned repository (422; GA note 2023-07-12 scopes it to organization-owned repos) — bridge: repository auto-merge with zero reviews, same gh pr merge --auto command; the ruleset arms on the organization transfer, which the founder deferred on 2026-09-02 and conditioned the same day: the transfer moves once the in-flight peer lanes ship their work. The bridge is the standing state until then. The receipt landed: pull request 1129 merged itself at green with zero reviews.
    reviews: []
    candidates:
      github-merge-queue:
        note: "GitHub's native merge queue, switched on by a repository ruleset: no new service, no new credential, the queue reruns the existing required checks on the merged state and squash-lands"
        scores:
          first_time_user:     {score: 5, evidence: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue"} # gh pr merge --auto and walk away
          founder_experience:  {score: 5, evidence: "docs/onboarding/merge-queue.md"}                                               # he stops typing APPROVE; exceptions only
          feature_parity:      {score: 4, evidence: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue"} # batching, auto-rebase, retest; no custom rules language
          ecosystem_fit:       {score: 5, evidence: "platform/github/ruleset.idp.merge-queue.json"}                                 # a ruleset beside the ones bin/repo-rulesets already applies
          maturity:            {score: 5, evidence: "https://github.blog/2023-07-12-github-merge-queue-is-generally-available/"}    # generally available since 2023, runs github/github
          security_by_default: {score: 5, evidence: "bin/repo-rulesets"}                                                            # no third-party app, no new token, no webhook surface
          portability:         {score: 3, evidence: "docs/runbooks/merge-queue.md"}                                                 # GitHub-shaped; the rollback is one ruleset delete
          operability:         {score: 5, evidence: "docs/runbooks/merge-queue.md"}                                                 # pause = disable one ruleset; queue state is one API read
          cost:                {score: 5, evidence: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue"} # included in the plan; only the reran checks bill minutes
