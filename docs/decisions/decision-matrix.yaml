# The estate's reference decision matrix (ADR 0009). Founder, 2026-08-28, crew#562 5458023873:
# "we need a matrix for decision making — rather than asking these questions it should be auto —
# for all requirements — just reference matrix, because we solve once and forever". And, on this
# file (crew#562 5458078376): "i like the matrix, enforce it" / "rigorously, can't be cheated" /
# "need evidence" / "and we need to review weekly".
#
# bin/matrix-gate grades this file (tests/test_incident_crew562_decision_matrix.py runs it in CI;
# .github/workflows/matrix-review.yml runs the weekly review). The rules it enforces:
#   - every score is {score: 0-5, evidence: <URL | repo path | cmd: …>}; a bare number is refused
#   - the weights are locked to the founder's receipt: weights_history's last sha256 must equal the
#     sha256 of `weights` as they stand — change a weight, add an entry with his word, or be refused
#   - the recorded decision is the arithmetic top score; inside tie_band the founder decides and
#     tie_receipt carries his word; outside it no receipt can pick a loser
#   - a decided entry has a receipt and a next_review date; the weekly review lists the overdue
#   - every candidate scores every criterion; a founder question with no row becomes a weighted row
#
# Scoring rubric per criterion: 0 = fails the estate's bar for it, 3 = meets it, 5 = best in class.
version: 2

# THE WEIGHTS ARE THE FOUNDER'S INPUT ("founder has to have input", "all the nuances we need to
# consider"). A session never edits a weight without his word on the crew issue.
weights:
  first_time_user: 15      # the whole flow for someone who has never seen it: installs, steps, silent failures
  founder_experience: 15   # LAW 20 / R-high-tech-only: every later use — taps, waits, retries
  feature_parity: 10       # "does it have the features?" — the job at the quality asked for, not a worse copy
  ecosystem_fit: 10        # ties into what the founder already owns and signs into: Apple, the tailnet, SSO
  maturity: 15             # LAW 43 / headline: proven platform, maintained, a buyer's engineer knows it
  security_by_default: 15  # LAW 21 / ADR 0007: federated login, no password travels, least privilege
  portability: 10          # LAW 19 / provider-independence: leaves the vendor in a day
  operability: 5           # one platform layer, emits to the collector, drill-able, self-heals
  cost: 5                  # LAW 14: money and the estate's own time
weights_history:
  - date: 2026-08-28
    receipt: "https://github.com/chidionyema/crew/issues/562#issuecomment-5458078376"   # "i like the matrix, enforce it"
    sha256: a14cc2bd09db8ab6a0264838aed2af9224e256f600f3b55e253f08c3d017efb7
tie_band: 25               # points out of 500; inside it on an irreversible choice, ask; otherwise build the top score
review_every_days: 7       # founder: "we need to review weekly"

# Worked decisions. Each names the requirement, the candidates, the scores with their evidence, and
# the decision the estate built. A new decision is a new entry here (one file, solved once).
