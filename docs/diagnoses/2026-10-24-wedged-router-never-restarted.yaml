description: "The laptop router slot sat wedged for 4+ hours on 2026-10-24 (load peaked\
  \ ~370): every agent session starved while the watchdog log read \"probe slow:curl=28\
  \ http=000 -- listening, not restarted\" the whole time. The slot had to be SIGKILLed\
  \ by hand to recover. Question: was the router truly wedged (and the watchdog blind\
  \ to that failure class), was the router healthy and merely the machine overloaded,\
  \ or was the watchdog probing the wrong thing?\nContext: migration spec docs/specs/2026-10-24-estate-cloud-migration-plan.md\
  \ \xA71.1; watchdog platform/llm/watchdog.py as of the 2026-10-02 refused-only rule."
hypotheses:
- name: H1
  description: router truly wedged -- the litellm process accepted TCP but never answered
    HTTP, and the watchdog's refused-only rule cannot see that failure class
  prior: 0.55
- name: H2
  description: router healthy, machine overloaded -- probes timed out only because
    load ~370 starved every process, so the watchdog behaved correctly
  prior: 0.3
- name: H3
  description: watchdog probed the wrong target -- port/label mismatch meant a healthy
    router was never actually probed
  prior: 0.15
evidence:
