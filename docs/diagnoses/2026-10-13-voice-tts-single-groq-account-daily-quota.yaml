description: 'The estate router (deploy/litellm, ns llm) log, 48 h to 2026-10-13.
  Question: why does /voice/say on the catalogue fail, leaving the face to speak through
  browser Kokoro or show an error? voice-tts was ONE deployment: canopylabs/orpheus-v1-english
  on GROQ_API_KEY. Four mechanisms are weighed: that single account''s daily request
  quota is spent and the router has no second deployment to route to; the Groq org
  has not accepted Orpheus''s terms; the pod''s egress to Groq is failing; or callers
  are calling the lane wrongly. Disclosure: the failure counts below were pulled (kubectl
  logs deploy/litellm --since=48h, every voice-tts / orpheus line matching error|exception|fail,
  1502 lines) before this record was written; the likelihoods are what each mechanism
  predicts on its face, not fitted to those counts. n_eff_divisor 100: the lines are
  retries inside two daily quota windows on one account, not 1502 independent events.
  Not established here: whether GROQ_API_KEY_2/_3 have accepted the Orpheus terms
  (a direct probe from the pod was not run) -- a key that has not answers 400, and
  the pool cools it like a spent one, so the change is safe either way.'
n_eff_divisor: 100
hypotheses:
- name: H1
  description: the one Groq account's on_demand daily request quota for Orpheus (100
    RPD) is spent, and with a single voice-tts deployment the router has nothing to
    route around.
  prior: 0.25
- name: H2
  description: the Groq org has not accepted the Orpheus model terms, so every speech
    call is refused 400 regardless of quota.
  prior: 0.25
- name: H3
  description: the litellm pod cannot reach api.groq.com reliably (DNS, TLS, egress,
    timeouts) -- environmental, not a fact about the account.
  prior: 0.25
- name: H4
  description: callers send the lane malformed requests (wrong endpoint or params),
    so the failures are a client defect.
  prior: 0.25
