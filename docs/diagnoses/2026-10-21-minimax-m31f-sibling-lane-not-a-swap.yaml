- name: 'cost of being wrong, as the estate has already paid it: adding a row nothing
    calls costs one unused lane and zero behaviour change, while swapping the model
    under `minimax` changes what every caller that names `minimax` gets, including
    both voice rows, on evidence that is a vendor table only -- no estate traffic
    has run through M3.1 Flash yet'
  observed:
    asymmetric: 1
