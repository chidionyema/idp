description: >-
  The cluster's action ledger, 2026-10-26, after the P1-P2 lane landed. The callback is
  registered, the ledger's destination env is set, the mounted key is a complete 119-byte PEM --
  and yet every call still logs "[action_ledger] not recorded: [Errno 2] No such file or
  directory: '\n<REDACTED-KEY-MATERIAL sha256:88238f533f5fd7ee -- the key text was quoted from the live pod's environment; it was rotated on 2026-10-26 and a key must never be written down>\n'". The missing file is named after a PEM, so the
  ledger tried to OPEN its key. The question is which of five explanations produced that:
  the mounted key is a stub and cannot be parsed; the container's secret wrapper exports every
  mounted secret's CONTENT under the file's basename, so the variable that held the key's PATH
  now holds the key itself and the ledger opens the key as a file; the callback is not
  registered in the running config; the ledger's destination is wrong; or the canonicaliser
  raises on the request body. Every count below was measured on the live cluster on
  2026-10-26: the running pod's log, the running process's own /proc/1/environ, the
  container's command, the mounted Secret's file, the live ConfigMap, the Deployment's env, and
  a listing of the capture volume inside the running pod.
hypotheses:
- name: H1
  description: >-
    the mounted key is a stub or truncated, so the key cannot be loaded and the row is never
    signed
  prior: 0.15
- name: H2
  description: >-
    the container's secret wrapper exports every mounted secret's content under the file's
    basename, so the variable that held the key's path now holds the key text, and the ledger
    opens the key itself as a file
  prior: 0.35
- name: H3
  description: the action_ledger callback is not registered in the running router config
  prior: 0.1
- name: H4
  description: >-
    the row is written to the wrong place: the ledger's destination env does not point at the
    capture volume
  prior: 0.2
- name: H5
  description: the ledger's canonicaliser raises on the request body, so no row is built
  prior: 0.2
