description: 'Every fact the router injects into a model call as Active Memory reaches
  the model as "- [fact]  (None)": seen live 2026-10-21 in a Claude Code turn on the
  laptop router (ten facts, every line identical, the Active Focus rows beside them
  correct). Question: is render() reading field names the brief never sends, is the
  memory server returning facts with no text, is the door losing the fields when it
  parses the MCP result, or is the text stripped after it is read. Measured against
  the live door (platform/estate/memory/door.py call "brief") and platform/llm/active_memory.py
  on main 79593c007, before any fix (#6789).

  '
hypotheses:
- name: H1
  description: render() reads {content, provenance.kind, key}, a shape the brief does
    not send; the brief sends {text, metadata}, so every lookup is empty and renders
    as "[fact]  (None)"
  prior: 0.3
- name: H2
  description: the memory server returns facts whose text is empty or null, so render()
    has nothing to show whatever names it reads
  prior: 0.25
- name: H3
  description: door.call parses the MCP result (structuredContent vs content text)
    and loses the fact fields, so render() gets dicts without them
  prior: 0.25
- name: H4
  description: the text arrives intact but _clip or a sanitiser strips it before the
    line is built
  prior: 0.2
