description: >
  The embed model group has no fallback. When the Cohere trial key is
  exhausted, every LiteLLM retry (2x per upsert chunk) hammers the dead key
  until the quota is gone in seconds. The crew's knowledge init logs warnings
  and continues, but the retry loop burns the remaining trial calls.
  Question: what is the right fallback for embed?
hypotheses:
- name: H1
  description: >
    Add Ollama nomic-embed-text as embed fallback. Ollama is already running
    in-cluster, free, unlimited, serves the embed endpoint natively.
  prior: 0.95
- name: H2
  description: >
    Add a cloud embedder (OpenAI/Gemini) as fallback. Requires a paid key
    or free credits that may also be exhausted.
  prior: 0.03
- name: H3
  description: >
    Do not add a fallback. The crew degrades gracefully without embeddings;
    knowledge init logs a warning and continues.
  prior: 0.02
