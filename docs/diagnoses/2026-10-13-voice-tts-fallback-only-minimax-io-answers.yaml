  on the third -- 2026-10-13-voice-tts-pool-routes-to-groq-accounts-without-orpheus-terms.yaml)?
  Probed 2026-10-13 from inside deploy/litellm (ns llm) with the pod''s own GEMINI_API_KEY
  and MINIMAX_API_KEY, one short English sentence per call: every Gemini model whose
  name carries "tts" in /v1beta/models (5) via :generateContent with AUDIO modality;
  MiniMax speech-2.5-turbo-preview and speech-02-turbo via /v1/t2a_v2 on both api.minimax.io
  and api.minimaxi.com. Disclosure: the probes ran before this record was written;
  the likelihoods are what each hypothesis predicts on its face. n_eff_divisor 2:
  the calls share one pod, one minute and one key per vendor, so they are not independent.
  Each endpoint is its own evidence row, graded on its own outcome. MiniMax''s 2049
  arrives inside an HTTP 200, so the probe graded the body (base_resp.status_code
  and a RIFF header), not the status.'
