description: 'The founder asked for a DeepSeek V4 Flash lane on the estate router
  (2026-10-10). Before adding one, the question is what is actually wrong with the
  DeepSeek path the router already has: the `deepseek` row is `deepseek/deepseek-chat`
  with no api_base, so it calls api.deepseek.com directly. Question: is the lane dead
  because the router process holds no DEEPSEEK_API_KEY (the secret is never mounted),
  because it holds the key and the vendor refuses it, or because the lane is fine
  and only a v4-flash model id is missing.

  Measured 2026-10-10 against the cluster: deployment llm/litellm, pods litellm-568b987867-
  {4ql54,w8kq9} (1/1 Running, 6h), 35 rendered model rows, and the manifests on main.

  '
hypotheses:
- name: H1
  description: the router process holds no DEEPSEEK_API_KEY -- human-deepseek is never
    mounted into the litellm Deployment, so the row's os.environ/DEEPSEEK_API_KEY
    resolves to nothing
  prior: 0.3333333333
- name: H2
  description: the key is mounted and exported, and api.deepseek.com refuses it (revoked
    or unpaid account)
  prior: 0.3333333333
- name: H3
  description: the deepseek lane is healthy end to end, and the only thing absent
    is a model row for a v4-flash id
  prior: 0.3333333333
