description: 'On 2026-10-21 every agent on the founder''s laptop lost every model
  twice: first while the machine was out of memory (load average 95, 3.3-4 GB of swap
  in use), then while the router''s litellm-venv was missing. Question: why did the
  front on 127.0.0.1:4000 (platform/llm/front.py) not keep any model answering, and
  does a cloud leg to llm.mumchimp.com close the gap? Hypotheses and likelihoods were
  fixed from the incident record (estate memory incident.laptop-router-outage-machine-overload)
  before the cloud router was measured in this session (20:14 UTC).

  '
hypotheses:
- name: H1
  description: the front fell through only on a refused or timed-out CONNECT, so a
    slot that accepts and never answers (starved), or both slots refusing with no
    other route, cuts every caller while the OKE router is up and would answer the
    same key; probing health and routing to the cloud when no slot answers keeps a
    model answering
  prior: 0.4
- name: H2
  description: the front's fallback was adequate, and the OKE router could not have
    carried laptop traffic anyway (unreachable from the laptop, or refusing the laptop
    key), so a cloud leg adds nothing
  prior: 0.3
- name: H3
  description: the router path was not the cause; sessions stalled because the machine
    could not schedule the agents themselves, and no change to the front would have
    kept a model answering
  prior: 0.3
evidence:
- name: 'front.py as it stood on main (aaa1c6844): handle() tries backends() in order
    and moves on only on OSError or asyncio.TimeoutError from open_connection with
    a 5 s bound; nothing after the connect is checked, and the only targets are 4001
    and 4002'
  observed:
    fallback_on_connect_only: 1
  likelihoods:
