    H2:
      runs_where_litellm_was_installed_that_passed: 0.60
      runs_where_litellm_was_not_installed_that_failed: 0.70
    H3:
      runs_where_litellm_was_installed_that_passed: 0.90
      runs_where_litellm_was_not_installed_that_failed: 0.20
