description: 'The fleetview outbox on the laptop, 2026-10-09. Question: why does every
  row in ~/.estate/outbox.db stay `pending` (browser steer intents never reach NATS)?
  Three competing explanations were fixed, with their likelihoods, before the per-row
  attempt columns were read: no process ever starts the drain worker; the worker runs
  but every publish to the bus fails; or the worker publishes but cannot mark rows
  published. Disclosure: the code-search evidence (second item) was observed before
  this record was written, while salvaging lane feat/action-ledger; the row-state
  evidence (first item) was read only after the likelihoods below were committed to
  this file.'
hypotheses:
- name: H1
  description: nothing starts the outbox drain worker -- fleetview serve.py never
    calls outbox.start_worker -- so no row is ever attempted
  prior: 0.34
- name: H2
  description: the worker runs, but every publish to NATS fails (bus unreachable or
    refused), so rows are attempted, retried and left pending with an error
  prior: 0.33
- name: H3
  description: the worker runs and publishes, but the status write back to the sqlite
    file fails (wrong path, lock, permissions), so rows look untouched
  prior: 0.33
