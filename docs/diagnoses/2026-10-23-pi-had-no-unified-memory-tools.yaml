resolution: >
  pi has no MCP client, so the estate had been writing an integration pi could never read. The
  fix is a transport, not a second implementation: extensions/estate-memory-tools spawns the same
  bridge every other runtime runs (bin/estate-memory-mcp) and speaks MCP JSON-RPC to it, so
  brief, recall and remember reach pi from the one store, with the bridge's own tool
  descriptions. The manifest now says pi cannot read MCP ("reads": false), the installer
  removes the estate's dead mcpServers entry from ~/.pi/mcp.json and links the extension into
  ~/.pi/agent/extensions/ instead. One bridge, one store, one set of tools.


proof: >
  Live, on the real path, after bin/estate-memory-install --runtime pi: a plain `pi -p` session
  called recall and got real memories back, then called remember and got {"written": true,
  "namespace": "estate", "key": "fact.pi-memory-tools.418375df0113aa84", "metadata": {"subject":
  "pi-memory-tools", "kind": "fact", "source": "pi", "runtime": "pi"}}. Reading the store
  again from a separate process (the bridge itself) found the same memory:
  {"text": "pi-memory-tools-probe-20261023T154210Z pi can reach the estate memory bridge",
  "metadata": {"kind": "fact", "source": "pi", "runtime": "pi", "subject": "pi-memory-tools"}}.
  Before the fix, ~/.pi/mcp.json carried an estate-memory entry that pi never read.


trade_off: >
  pi now starts one python process per session for the bridge, where an MCP client would have
  started the same process itself - the cost is the same and it is bounded by the session. The
  extension keeps its own client (extensions/estate-memory-tools/bridge.ts) rather than
  depending on an MCP library, because pi ships none: that is a hundred lines to maintain
  against a protocol that changes rarely, and it is tested against a stub bridge that speaks the
  same framing. The manifest's "reads": false is a promise the installer has to keep: a runtime
  that later grows an MCP client would have to set it back to true, or the estate would keep
  removing an entry that now works.
