description: >
  pi agents did not get the estate's unified memory. They read the session brief and nothing
  else: no recall mid-session, no remember at all, while Claude Code agents had all three as
  tools. The founder asked why the two runtimes behaved differently. Question: is the
  divergence in pi's configuration, in the router, in the bridge, or in the memory extension
  pi loads? Likelihoods written per item, probes run concurrently.


