description: 'The router lost ~2,100 Active Memory reads on 2026-10-21/22 ("no answer
  inside 3.5s" on 879 brief and 808 focus lines, 423 calls losing both legs) and neither
  leg reproduces when timed alone (brief median 0.82 s; focus cold median 1.45 s,
  max 2.73 s). Question: why can the cause not be found from what the router already
  logged -- is it that a failed read is logged with no time of day and no duration
  (so it cannot be set against load or against the other leg), that the lines carry
  them and the analysis simply missed them, or that they were emitted and later lost
  to rotation. Measured 2026-10-22 on ~/Library/Logs/litellm-local.log (61 MB) and
  platform/llm/active_memory.py at origin/main. This record grades the logging defect
  the change fixes, not the cause of the failed reads, which stays unproven.

  '
