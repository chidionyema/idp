description: 'Drained graph sources carry no per-agent attribution: sources.jsonl
  has no agent field and journal nodes label every actor with the generic "agent",
  so per-agent memory proof is impossible from the graph store (measured 2026-10-18).
  Question: where in the capture-to-graph path is the acting agent''s identity lost
  -- never written by the router''s spooler, dropped by the drain, or present in the
  source text but not surfaced by growmos extraction. Measured against the router
  spool (~/.estate/graph-spool), the drain run lines (~/.estate/graph-drain.log) and
  the graph store on main before any fix.

  '
hypotheses:
- name: H1
  description: graph_capture never writes the acting agent into the spool -- identity
    is absent at the source
  prior: 0.55
- name: H2
  description: capture writes it, but the drain loses it (rename/rename or ingest
    path) before it reaches the graph
  prior: 0.1
- name: H3
  description: capture and drain both carry it in session text, but growmos extraction
    does not surface it as an agent field or node
  prior: 0.25
- name: H4
  description: the drain is not moving sessions at all, so there is nothing to attribute
  prior: 0.1
