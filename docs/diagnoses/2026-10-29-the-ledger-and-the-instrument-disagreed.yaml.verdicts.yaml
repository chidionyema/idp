description: 'On 2026-10-29 the truth instrument could not measure the router''s own
  ledger. The predicate `router.lanes.accounted` asks whether every lane the router
  declares is accounted for as served or refused, and it answers by reading `~/.estate/router-state/lanes.json`,
  the ledger the laptop router writes at every render. The instrument did not answer
  MEASURED_OK or MEASURED_FAIL: it answered UNKNOWN, with the reason "the measurement
  raised TypeError: unhashable type: ''dict''". This record answers: why could the
  instrument not read a ledger the router had just written? The winning hypothesis
  is that BOTH halves were wrong, and each was wrong in a different way. The INSTRUMENT
  did set arithmetic over the refusal list as if every refusal were a plain name,
  while the ledger refuses a lane with an object that carries the lane AND the reason
  it is refused, and a reason is the whole point of the ledger. The LEDGER, meanwhile,
  counted refusal ENTRIES where it should have counted lane NAMES (three cerebras
  deployments are refused under one lane name with three different missing credentials),
  and it kept the lanes the render DERIVED inside the served set, so its own counts
  could not be added up by a reader. Every count below is a measurement taken on this
  machine on 2026-10-29, and the command that produced it is named in the item.'
hypotheses:
- name: H1
  description: 'the instrument was wrong and the ledger was right: the ledger refuses
    a lane with an OBJECT (the lane and the reason it is refused), and the instrument''s
    `declared_accounted` check did set arithmetic over the refusal list as if every
    entry were a plain string, so `set(refused)` raised `TypeError: unhashable type:
    ''dict''` and the predicate could not be measured at all'
  prior: 0.4
- name: H2
  description: 'the ledger was genuinely incomplete: some declared lanes were neither
    served nor refused, so the accounting was broken and the instrument was right
    to refuse'
  prior: 0.1
- name: H3
  description: the ledger was absent, stale or unreadable -- the file the instrument
    read was not the file the router wrote
  prior: 0.05
- name: H4
  description: 'BOTH halves were wrong, in different ways: the instrument could not
    read object-shaped refusals, and the ledger''s own arithmetic counted refusal
    entries where it should count lane names and kept the derived lanes inside the
    served set, so its `declared_accounted` flag was false on a ledger that accounts
    for every declared lane'
  prior: 0.45
