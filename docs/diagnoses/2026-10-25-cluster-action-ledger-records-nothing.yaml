description: >-
  The cluster's action ledger, 2026-10-25. Question: why did the litellm pod in namespace llm
  write no ledger row at all, while the graph spool beside it had rows? Four explanations were
  fixed before the evidence was read: the ledger's canonicaliser raises on a request body json
  cannot serialise (the proxy hands callbacks a Python object, not JSON text, and one body
  carries a tuple key), so the row is never built; the callback was never registered in the
  router's running config, so record() never ran; the row was built and written, but to the
  wrong place (ESTATE_ACTION_LEDGER was unset, so the ledger fell back to HOME, which is /tmp in
  that pod, and the capture volume -- the one place the ledger is consolidated from -- held no
  ledger); or the row was written but could not be signed, because the mounted ESTATE_AGENT_KEY
  was a 27-byte stub of a PEM. Every count below was measured on the live cluster on 2026-10-25:
  the pod's own log, the Deployment's env, the mounted Secret, the live ConfigMap, and a listing
  of the capture volume inside the running pod.
hypotheses:
- name: H1
  description: >-
    the ledger's canonicaliser raises while serialising the request body, so no row is ever
    built and no file is ever opened
  prior: 0.4
- name: H2
  description: the action_ledger callback is not registered in the running router config
  prior: 0.2
- name: H3
  description: >-
    the row was written, but to the wrong path: ESTATE_ACTION_LEDGER is unset in the Deployment,
    so the ledger falls back to HOME (/tmp in that pod) and the capture volume holds no ledger
  prior: 0.25
- name: H4
  description: >-
    the row was written but could not be signed, because the mounted ESTATE_AGENT_KEY was a
    truncated 27-byte stub of a PEM
  prior: 0.15
