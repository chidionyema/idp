description: 'The embed chain on the estate router, 2026-10-11. Question: why did
  every embedding call through the estate router fail or time out (Otto storing facts
  with no vector, the memory backfill dying at read=1 written=0, hindsight-api restarting
  168 times in 18h)? Three competing explanations were fixed before the evidence was
  read: the chain asks a dead vendor lane first (retired model id or zero credit),
  the caller''s payload shape does not fit the provider''s embedding API, or the router
  itself is misconfigured (no lane serves embed / key not mounted).'
