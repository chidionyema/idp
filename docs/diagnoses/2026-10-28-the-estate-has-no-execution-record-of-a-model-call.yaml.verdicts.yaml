description: 'The estate''s router makes every model call, and the estate could not
  answer, from its own record, what one execution cost, or how two executions compare.
  This record asks why that is so, and fixes four explanations before the evidence
  is read. The priors were set from what was already known on 2026-10-28: the router
  has no AEI-shaped observer on it, so a missing surface was the leading explanation
  before anything was measured.

  WHERE THE MEASUREMENTS CAME FROM, AND WHAT THEY COULD NOT SEE. The live router path
  was the laptop''s LiteLLM on 127.0.0.1:4001, because the cloud default route https://llm.mumchimp.com
  answered 503 with the ingress "Starting up" page and carried no traffic to measure.
  The router''s configured callbacks, the per-call row it writes, the estate''s readers
  of per-call facts and the estate''s price table were read from origin/main. The
  cluster was NOT reachable from the laptop, so nothing here claims what the cluster''s
  own pods hold: the cluster''s action ledger was measured on 2026-10-25 (docs/diagnoses/2026-10-25-cluster-action-ledger-
  records-nothing.yaml) and wrote no rows at all on that day. Where a count is a count
  of observations, it is the count of what was observed, not a sample of everything.

  THE FIVE EXECUTION FACTS, used throughout: model, deployment, tokens, latency, cost.
  A per-call record that holds one of them is not an execution record; the question
  is whether any surface in the estate holds them together, joined to the execution
  they belong to, with a cost that is derived rather than guessed.'
hypotheses:
- name: H1
  description: No surface in the estate records the execution facts together, joined
    to an execution, with a derived cost. The router path's per-call records are a
    signed receipt of hashes (the action ledger's row) and a trace in the trace store;
    the cost is nowhere; nothing joins a call to the agent's execution; and no estate
    surface reads per-call facts per execution. A new observation surface -- a callback
    that writes metadata-only execution events into a store the estate queries --
    is the missing piece, and it duplicates neither the trace store nor the signed
    receipt.
  prior: 0.4
- name: H2
  description: 'The facts ARE written, but to a place nothing reads: the per-call
    records exist (the action ledger''s row, the trace export), and what is missing
    is a reader, not a writer. A new collector would be a second copy of what the
    estate already writes.'
  prior: 0.2
- name: H3
  description: 'The facts are written and read, and the only thing missing is the
    cost: the spend header reads 0.0 where the call was paid, and the deployment in
    use has no price row. The fix belongs in the price table, and a run-scoped comparison
    is a nice-to-have nobody asked for.'
  prior: 0.2
- name: H4
  description: Everything the estate needs is already written, read and priced; the
    estate's record answers both questions today, and this delivery is a duplicate
    of the estate's tracing.
  prior: 0.2
