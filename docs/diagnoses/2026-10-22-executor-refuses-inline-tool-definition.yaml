description: 'On 2026-10-21 Claude Code turns through the router failed with 422 "unknown
  variant `tool_definition`, expected `tool_reference`" followed by LiteLLM''s "No
  fallback model group found for original model_group=claude-opus-5-5". Question:
  is the refusal caused by the body the router forwards (inline-tools `tool_addition`
  blocks carrying a `tool_definition`, which the routed leg does not accept), so that
  rewriting them to `tool_reference` and declaring the definition in tools[] in _fit_executor
  ends it? Hypotheses and likelihoods were fixed from the error text and the incident
  record (estate memory incident.router-422-tool_definition) before the client binary
  and LiteLLM were read.

  '
hypotheses:
- name: H1
  description: the routed leg refuses inline-tools blocks (the body schema knows only
    `tool_reference`, and the inline-tools beta does not reach it), so the turn fails
    on the body itself; fitting each `tool_definition` to a `tool_reference` with
    the definition declared in tools[] makes the same turn acceptable
  prior: 0.4
- name: H2
  description: the body is fine and the turn failed because claude-opus-5-5 has no
    fallback group; adding an opus->sonnet fallback in config.runtime.yaml is the
    fix and the body rewrite changes nothing
  prior: 0.3
- name: H3
  description: the refusal is the client's own capability negotiation and never a
    router matter; Claude Code recovers by itself and the router needs no change
  prior: 0.3
