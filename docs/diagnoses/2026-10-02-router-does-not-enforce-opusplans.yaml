description: 'Founder 2026-09-28: "Opus plans, Sonnet executes, and that should be
  impossible to circumvent." Measured that day over the router ledger: opusplan sessions
  ran Sonnet only (71 sessions), yet 35 interactive sessions pinned Opus with /model
  and produced 88% of all turns. Question: is Opus running because the router has
  no enforcement of the plan/execute split at all (the harness setting is the only
  control), because an enforcement path exists but keys on a plan-mode marker the
  installed Claude Code does not emit, or because Opus requests are enforced but fail
  rather than reroute.

  '
hypotheses:
- name: H1
  description: no router-side enforcement exists -- the harness /model setting is
    the only control, so any session can pin Opus
  prior: 0.3333333333
- name: H2
  description: enforcement exists but keys on a plan-mode marker string the installed
    Claude Code build does not emit, so no turn is ever classified as a plan turn
  prior: 0.3333333333
- name: H3
  description: enforcement exists and fires, but routed-down Opus calls error instead
    of completing on the executor, and the error is masked
  prior: 0.3333333333
