description: 'The founder''s spoken turn waited 15.9s for its first spoken clause
  (16.6s turn, reported as "takes forever or router times out, totally unusable")
  on the voice alias, which was three gpt-oss-120b rungs. Question: is the 15.9s the
  reasoning model''s hidden chain blocking the first content token, the dead-rung
  fallback chain adding retry delay (groq and cerebras 403''d from this network tonight),
  or backend/client slowness (fleetview prompt assembly, /sessions)? Fixed before
  reading tonight''s measurements.'
hypotheses:
- name: H1
  description: the alias serves a REASONING model on every rung, so the first spoken
    token waits for the hidden chain-of-thought to finish; swap the rung to a non-reasoning
    model and first content drops under ~2s with every other layer identical
  prior: 0.5
- name: H2
  description: the fallback chain\'s dead rungs (auth 403s) add retry delay before
    the live rung is reached; the model itself is fast and the delay is additive failover
    time
  prior: 0.3
- name: H3
  description: the backend/client is slow (fleetview fleet_summary/catalog prompt
    build, /sessions, SSE assembly); no model or chain change would fix it
  prior: 0.2
