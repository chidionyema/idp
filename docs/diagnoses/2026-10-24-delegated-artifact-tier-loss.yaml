description: 'A delegated build could change capability class on the way to the model,
  and the delegation had no tier for the router to hold: the planner and builder named
  model strings outright, and when the router rescued a dead model group it re-routed
  through the legacy `default` and `fast` pools, whose members are of two different
  capability classes. Question: which of those two facts explains the loss of the
  delegated call''s capability tier? (The evidence below was gathered by reading the
  pre-change tree; the likelihoods were written per item, before the counts were read.)

  '
hypotheses:
- name: H1
  description: the delegation named models outright, so the router was never asked
    for a class and there was nothing for it to preserve
  prior: 0.4
- name: H2
  description: the rescue pools are mixed-class, so a rescued delegated call changes
    class whatever it asked for
  prior: 0.35
- name: H3
  description: the router carried no artifact-class dimension at all, so no tier could
    be requested, held or preserved
  prior: 0.25
