description: 'On the laptop router (slot 4001, door=mcp), a warm window of 40 chat
  calls logged 36 `active_memory injected` and 3 `active_memory focus unreadable ...
  no answer inside 3.5s`: Active Focus missing from about one call in thirteen. Question:
  why does the focus read miss the 3.5 s read deadline (ACTIVE_MEMORY_BUDGET_S=3 +
  0.5) -- is the gh claim search itself slower than the deadline at each FOCUS_TTL_S
  expiry, is gh not found under the launchd PATH, is the whole router stalling, or
  is a slow door brief starving the focus read. Measured 2026-10-20 07:58-08:10 BST,
  before any fix.

  '
hypotheses:
- name: H1
  description: the focus register is re-read from GitHub through one gh issue search
    at every FOCUS_TTL_S (30 s) expiry, and that search takes longer than the read
    deadline, so the caller that hits the expiry gets no focus
  prior: 0.35
- name: H2
  description: gh is not on the PATH the launchd router runs with, so focus.live_focus
    returns None (unknown) and the focus is unreadable
  prior: 0.2
- name: H3
  description: the router itself stalls (event loop or worker threads), so every read
    in flight misses the deadline, the focus among them
  prior: 0.25
- name: H4
  description: the door brief is slow, and the brief read holds up the focus read
    that runs beside it
  prior: 0.2
