description: 'pi agents keep sending calls over the router''s per-call input ceiling (idp#6675).
  Question: is the dominant mechanism that pi never recognises the router''s refusal as a
  context overflow (so it re-sends the same history instead of compacting), that pi compacts
  but against a threshold above the router''s ceiling, that single huge tool results jump a
  turn over the line before any threshold can fire, or that the refusals are mostly not the
  router''s ceiling at all.

  Written in this order, on purpose: hypotheses, priors, likelihoods and the counting method
  below were committed BEFORE any count was taken (see this file''s git history: the commit
  that adds it carries no observed counts). Disclosed prior knowledge: earlier in this session
  one compaction was seen at roughly 369k tokens, and the old refusal wording was checked
  against pi''s OVERFLOW_PATTERNS and did not match. Both favour some hypotheses before the
  count, which is why the priors below are not uniform in their favour -- they are uniform.

  Method (source: every ~/.pi/agent/sessions/*/*.jsonl on the laptop, all sessions, read
  2026-10-20). A "ceiling refusal" is an assistant entry with provider=estate,
  stopReason=error and an errorMessage matching /estate.s ceiling|maximum context length of
  [\d,]+ tokens the estate/ (old and new router wording). "Input" of a turn is
  usage.input + usage.cacheRead. E1: for each ceiling refusal, the type of the next entry in
  the same session file (compaction; another ceiling refusal; any other entry; none = end of
  file). E2: every provider=estate error entry, classified ceiling_refusal or other. E3: for
  each ceiling refusal whose preceding estate assistant entry was NOT a ceiling refusal, that
  preceding entry''s input, bucketed under_128k / 128k_to_200k / over_200k. E4: every
  compaction entry''s tokensBefore, bucketed under_200k / over_200k. n_eff_divisor 5 because
  turns within one session are correlated; fixed before counting.

  '
n_eff_divisor: 5
hypotheses:
- name: H1
  description: pi does not recognise the router's refusal as overflow, so after one it does
    not compact and re-sends the same oversized history, turn after turn
  prior: 0.25
- name: H2
  description: pi recognises the refusal and compacts, but its own compaction threshold sits
    above the router's ceiling, so sessions grow back over the line by gradual accumulation
  prior: 0.25
- name: H3
  description: compaction works, but single large tool results jump one turn from well under
    the ceiling to over it, faster than any threshold checked between turns can catch
  prior: 0.25
- name: H4
  description: the errors pi sessions hit are mostly not the router's ceiling (provider
    limits, auth, transport); the ceiling is a minor contributor
  prior: 0.25
evidence:
- name: next entry in the session after a ceiling refusal
  likelihoods:
    H1:
      compaction: 0.03
      another_refusal: 0.7
      other: 0.12
      none: 0.15
    H2:
      compaction: 0.7
      another_refusal: 0.1
      other: 0.1
      none: 0.1
    H3:
      compaction: 0.6
      another_refusal: 0.1
      other: 0.2
      none: 0.1
    H4:
      compaction: 0.25
      another_refusal: 0.25
      other: 0.25
      none: 0.25
- name: provider=estate error entries, by kind
  likelihoods:
    H1:
      ceiling_refusal: 0.6
      other: 0.4
    H2:
      ceiling_refusal: 0.6
      other: 0.4
    H3:
      ceiling_refusal: 0.5
      other: 0.5
    H4:
      ceiling_refusal: 0.1
      other: 0.9
- name: input of the last estate turn before the first refusal of a run
  likelihoods:
    H1:
      under_128k: 0.4
      128k_to_200k: 0.5
      over_200k: 0.1
    H2:
      under_128k: 0.1
      128k_to_200k: 0.8
      over_200k: 0.1
    H3:
      under_128k: 0.8
      128k_to_200k: 0.15
      over_200k: 0.05
    H4:
      under_128k: 0.34
      128k_to_200k: 0.33
      over_200k: 0.33
- name: compaction tokensBefore
  likelihoods:
    H1:
      under_200k: 0.6
      over_200k: 0.4
    H2:
      under_200k: 0.2
      over_200k: 0.8
    H3:
      under_200k: 0.8
      over_200k: 0.2
    H4:
      under_200k: 0.5
      over_200k: 0.5
