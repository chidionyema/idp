description: 'Should the cluster router carry the estate capture modules (graph spool
  + signed action ledger) now, or wait for the P5 Postgres consolidation? Cloud-primary
  went live 2026-10-25 (P2.T4); until this port lands, every cloud-routed call bypasses
  the estate graph and the accountability ledger -- the estate''s memory and its audit
  trail only see laptop-routed calls. Context: migration P2.T2 documented gap + dated
  fix; design settled in ~/.estate/migration/log.md and decision/capture-port-design.'
hypotheses:
- name: H1
  description: port now -- mount the modules via the callbacks ConfigMap, sign with
    a new cluster-sphere key, accept per-pod capture until P5 consolidates the store
  prior: 0.55
- name: H2
  description: wait for P5 -- land Postgres consolidation first, then wire capture
    once, into its final home
  prior: 0.3
- name: H3
  description: skip -- accept that cloud-routed calls are uncaptured; laptop capture
    suffices for the estate's memory and audit needs
  prior: 0.15
