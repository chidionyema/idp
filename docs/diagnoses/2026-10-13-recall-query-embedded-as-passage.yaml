description: 'unified-memory recall, 2026-10-13. Question: why does POST /memories/recall
  not return the right fact in slot 1 for "where do branches meet into main" and "where
  is postgres hosted in this estate", now that recall reaches the embed lane end to
  end (#6049)? Four competing explanations, with their predictions, were fixed before
  the probe ran: the recall query is embedded with input_type passage on an asymmetric
  model; the 1536 output width degrades ranking; the stored facts do not hold an answer
  any embedding could find; or the embedding ranks correctly and the fault is elsewhere
  in recall. Evidence: one probe run from inside the litellm pod, straight to NVIDIA
  (llama-nemotron-embed-vl-1b-v2), every non-quarantined stored fact embedded as a
  passage at 1536 and 2048, each question embedded as passage@1536, query@1536 and
  query@2048, and the rank of the fact that answers it recorded under each.'
hypotheses:
- name: H1
  description: the recall query is embedded with input_type passage (the `embed` lane
    pins it) on an asymmetric model, so it is compared passage-to-passage; typed as
    a query it would rank the answering fact first
  prior: 0.25
- name: H2
  description: the 1536 output width (truncated from the model's native 2048) loses
    enough of the vector to misrank, whatever the input_type
  prior: 0.25
- name: H3
  description: no stored fact is close enough to the question for any embedding to
    rank it first -- the fact is missing, quarantined, or worded too far from the
    question
  prior: 0.25
- name: H4
  description: the embedding already ranks the answering fact first; the miss is elsewhere
    in recall (the cosine floor, the namespace or tenant filter, the gate)
  prior: 0.25
