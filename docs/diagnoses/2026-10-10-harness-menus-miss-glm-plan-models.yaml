description: 'The laptop router''s harness catalog, 2026-10-10. Question: why do the
  opencode and pi menus (catalog.json 16:04Z) lack glm-5-turbo, which the GLM Coding
  Plan serves, and offer seven zai names the plan never served (#5697)? Three explanations
  were fixed before the evidence was read: router_catalog.py takes zai from LiteLLM''s
  static model list instead of the plan endpoint, the catalog ran before the zai lane
