description: 'The `deepseek-v4-flash` lane (landed #5726 for #5723) routed correctly
  but every call timed out, so the lane never answered a real request. Question is
  whether the router is blocked from leaving the cluster, or whether this one destination
  is unreachable. Measured 2026-10-11 from inside the router pod and from the laptop,
  same moment, with the same mounted key. Supersedes the "the cluster cannot reach
  llm.mumchimp.com" framing in issue #5730: that host is reachable from the laptop
  by design, and unreachable from the cluster by design too -- neither is a fault.
  The fault was the lane''s api_base.

  '
hypotheses:
- name: H1
  description: 'The lane points at the router''s own public hostname from inside the
    cluster, so the request is a hairpin the cluster''s egress path cannot complete.
    The destination is fine from anywhere else; the config is wrong. Fix: drop the
    api_base so the lane dials the vendor endpoint directly.

    '
  prior: 0.4
- name: H2
  description: 'Cluster egress is broken or over-restricted (NetworkPolicy, SNAT,
    no route), so no external destination is reachable and the fix is on the egress
    path.

    '
  prior: 0.3
- name: H3
  description: 'The host llm.mumchimp.com is genuinely down, so nothing reaches it
    from anywhere and the fix belongs on that service.

    '
  prior: 0.3
