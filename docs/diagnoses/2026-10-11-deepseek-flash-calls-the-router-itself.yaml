winner: H1
resolution: 'platform/vendors/consoles.yaml: the `deepseek-v4-flash` lane row loses
  its api_base. litellm then uses the vendor default (api.deepseek.com), which is
  reachable from the cluster and authenticates with the key already mounted at /run/secrets/human/deepseek.
  The mutation is in the registry, not in the rendered platform/llm/config.yaml, which
  bin/idp-vendor-render regenerates.

  '
trade_off: 'The lane no longer shares the row shape platform/llm/config.local.yaml
  serves as default/fast. That shape was only ever correct off-cluster: on the laptop
  llm.mumchimp.com is the router reached over the public internet, and in the pod
  it is the router reached by calling itself. Cost: if the estate ever wants DeepSeek
  traffic to traverse an in-cluster gateway hop for accounting, that hop has to be
  a Service name, never the public hostname.

  '
second_order: 'Any other lane that copies an api_base from config.local.yaml into
  the cluster registry has the same defect. The grep that found this one is `rg -n
  mumchimp platform/vendors/` and it should return nothing for lanes served from inside
  the cluster; after this change it returns only the explanatory comment.

  '
