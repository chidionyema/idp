description: 'The laptop router log, 2026-10-12. Question: why does the router keep
  a lane that its own probes show failing in service and under constant probing --
  194 of 200 probes failed on openai/openai/gpt-oss-120b while real calls to it ran
  at p50 8998 ms, and 579 of 584 failed on gemini/gemini-2.5-flash -- instead of holding
  it out of rotation? Four mechanisms were fixed before the evidence was read: the
  registry''s own state machine cannot hold the lane out (a success promotes any condemned
  lane unconditionally, and a spent balance is read as a transient rate limit), the
  vendor lanes are fine and only the probes are wrong, litellm routes without consulting
  lane state so lane_registry is passive telemetry, or the failures are the laptop''s
  network rather than a fact about the lane.'
hypotheses:
- name: H1
  description: lane_registry's own state machine cannot hold a failing lane out of
    rotation. observe() promotes any condemned lane to READY on a success without
    consulting the reset it just computed, and classify_failure() tests the rate signal
    before the credit signal, so a spent balance is held as EXHAUSTED (30 s probe
    cadence) instead of DEAD/credit (600 s).
  prior: 0.25
- name: H2
  description: the lanes are healthy and the probes are the defect -- the probe request
    itself (params or payload) draws the 429s, so continuing to serve the lane is
    correct.
  prior: 0.25
- name: H3
  description: litellm's router chooses lanes without consulting lane_registry state,
    which is passive telemetry; no branch in the registry decides what serves traffic.
  prior: 0.25
- name: H4
  description: the failures are environmental -- laptop network, DNS or the local
    proxy -- and not a fact about the lane or the registry.
  prior: 0.25
