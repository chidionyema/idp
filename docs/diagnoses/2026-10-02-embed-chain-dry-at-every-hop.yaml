what: 'The embed lane resolved to a paid vendor at every hop, so no fact in either
  memory store could acquire a vector. 59 of 59 otto_facts and all 47 rows of memory.memories
  held a NULL embedding, and the chain had a free hop the estate already owned --
  nvidia/nemotron-3-embed-1b -- that was never in the chain and whose Secret was never
  mounted. The question this record grades is not "is it broken" (it measurably was)
  but WHICH fault produced the dry chain, since the four candidate causes demand different
  fixes and only one of them is "add the free lane".

  '
hypotheses:
- name: H1
  description: 'every paid hop was independently out of money/credit at the vendor
    -- the chain was correct in route and wrong only in that its hops cannot pay,
    so the fix is a free hop

    '
  prior: 0.4
- name: H2
  description: 'the chain was fine and the keys/money were fine; the CALLER was refused
    by a virtual-key allowlist that did not include the embedding models, so every
    hop 401/403''d regardless

    '
  prior: 0.2
- name: H3
  description: 'the model names were wrong or the lane was misnamed (`embed` did not
    resolve to the model the store''s column was built for), so the router errored
    before reaching any vendor

    '
  prior: 0.2
- name: H4
  description: 'the free hop (nvidia) was already in the chain but failing for a second
    reason (width mismatch or auth), so the chain was not dry-for-lack-of-a-free-hop

    '
  prior: 0.2
