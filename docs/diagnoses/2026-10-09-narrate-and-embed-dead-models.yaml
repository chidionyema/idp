description: 'Groq call volume rose from ~30/day to ~440/day on 2026-10-06..07. Every
  one of those calls was the newsroom virtual key (scoped to `narrate` only), answered
  by `groq` (gpt-oss-120b), never by `narrate`: ~1,260 calls 2026-10-03..09, and the
  only narrate rows in LiteLLM_SpendLogs are 6 failures on 2026-10-03 with an empty
  model_group. Separately, all ~8,100 `embed` calls in the three days to 2026-10-09
  failed. Question: why does the narrate lane never answer?

  '
