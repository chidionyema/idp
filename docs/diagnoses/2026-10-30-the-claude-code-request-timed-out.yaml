description: 'The founder''s Claude Code sessions on 2026-10-28..30 gave up with "Request timed
  out" (25 events in 10 sessions across 134 transcripts; 21 of them in the founder''s own seven
  main sessions). The client waited a tight 361.287-374.443 s (p50 364.132 s, n=21) and then
  gave up. Question: why did the caller hear nothing for longer than it could bear? (H1) The
  front holds one request across every leg it may try -- the cloud first (ANSWER_TIMEOUT=120 s
  per target) and then each laptop slot -- with NO total budget, so on a slow leg the caller''s
  request is held past the client''s patience and the answer arrives (or never arrives) to a
  caller that has gone. (H2) The vendors themselves were slow or down, so no front-side budget
  could have saved those calls. (H3) The client was at fault: it delayed or dropped the request.
  (H4) The requests never reached the front at all (an ingress fault upstream of it). The fix
  under test gives one request ONE budget (ANSWER_BUDGET, 240 s) that every leg shares, and
  refuses the caller at once when the budget is spent.

  '
hypotheses:
- name: H1
  description: the front has no total budget per request, so it holds the caller's request across
    every leg it may try and the hold can exceed the client's patience
  prior: 0.25
- name: H2
  description: the vendors were slow or down, so no budget on the front could have saved those
    calls
  prior: 0.25
- name: H3
  description: the client (Claude Code) was at fault -- it delayed or dropped the request
  prior: 0.25
- name: H4
  description: the requests never reached the front, so an ingress fault upstream of it explains
    the silence
  prior: 0.25
