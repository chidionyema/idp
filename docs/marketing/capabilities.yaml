# The capability register: everything the estate has built, whether or not it is a product yet.
# Founder, 2026-09-08: "we missed so much from the investor pitch because inventory isn't audited,
# we don't know what we have"; "capabilities even if undeveloped or appear trivial, the question is:
# is it useful for business and engineers". One row per capability. `useful_for` answers that
# question; `range` ties the row into a product line; `state` is what is true today, counted on
# 2026-09-08 (sweep of every repo under the dev root; tests are test files, not passing runs).
# A capability with no row here is a gap the register gate names (work order section 5).
ranges:
  run-agents:    "Run AI agents: start, watch, steer and stop a workforce of agents"
  govern-agents: "Govern AI agents: what an agent may reach, spend, sign and ship"
  run-platform:  "Run the platform: the estate itself, secure, observed, sold as a managed deployment"
  private-ai:    "Private AI: inference and models on hardware and keys you hold"
  products:      "Products that run on the platform (a buyer buys these; the platform is what they run on)"
capabilities:
